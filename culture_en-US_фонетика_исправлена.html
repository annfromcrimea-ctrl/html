</head><body><button class="mobile-menu" style="display:none" onclick="toggleSide()">Меню</button><aside class="side" id="side"><div class="brand"><h1>Практика английского<br>Курс-спутник 1–5</h1><p>Оригинальная теория, тексты, практика, студия речи и письма</p></div><div class="side-tools"><input class="search" id="search" placeholder="Поиск модуля или темы" oninput="filterNav(this.value)"><div class="progress"><span id="progressText">0 из 40 модулей</span><div class="track"><div class="fill" id="progressFill"></div></div></div></div><nav class="nav" id="nav"></nav><div class="side-bottom"><span id="pointText">Баллы: 0</span> · <button onclick="resetProgress()">сбросить</button></div></aside><main class="main"><div class="topbar"><div class="crumb" id="crumb">Главная</div><div class="top-actions"><button class="small-btn" onclick="showHome()">Все курсы</button><button class="small-btn" onclick="toggleTheme()">Тёмная тема</button><button class="small-btn" onclick="window.print()">Печать</button></div></div><div id="app"></div></main><script>const COURSES=[{"num":1,"level":"A2 · Foundation","title":"Основа языка и учебная самостоятельность","summary":"Произношение, базовая грамматика и уверенное описание привычных ситуаций.","outcomes":["понимать базовую форму предложения","рассказывать о себе, людях и событиях","планировать короткое высказывание"],"units":[{"title":"Sounds, spelling and reading","focus":"Типы слога, транскрипция и чтение частотных сочетаний","can":"Я смогу читать незнакомые простые слова осмысленно и сверяться с транскрипцией.","theory":"<p>Английское написание не всегда предсказывает звук, поэтому полезно соединять правило с транскрипцией. В открытом слоге гласная часто читается «по названию буквы»: <i>name, me, note<\/i>. В закрытом слоге она обычно короче: <i>cat, pen, not<\/i>. Сочетание <b>th<\/b> имеет два основных чтения: [θ] в <i>think<\/i> и [ð] в <i>this<\/i>.<\/p><p>Не пытайтесь выучить одно правило как абсолютное. Прочитайте слово, проверьте его в словаре, затем произнесите в собственной фразе. Так графический образ связывается со звуком и значением.<\/p>","vocab":[["open syllable","открытый слог","The final e changes the vowel in <i>make<\/i>."],["closed syllable","закрытый слог","<i>Pen<\/i> has a short vowel."],["transcription","транскрипция","Check the transcription before reading aloud."],["consonant cluster","сочетание согласных","<i>Street<\/i> begins with a consonant cluster."],["stress","ударение","Mark the stress in new words."],["minimal pair","минимальная пара","Ship and sheep form a minimal pair."]],"readingTitle":"A notice at the language lab","reading":"On Monday, Maya opened the language-lab door five minutes early. A notice on the wall said: “Read slowly, listen twice, then speak.” She chose three difficult words from a map of London, checked their transcription and repeated them into her phone. At first she read <i>though<\/i> like <i>thought<\/i>. After comparing the two words, she heard the difference and wrote a short example for each one.","readQ":["What did Maya do before repeating the words?","She checked their transcription."],"lab":["Разделите слова <i>name, cat, park, here<\/i> по типам слога.","Подчеркните буквы, которые помогают прочитать <i>cake, pen, bike, not<\/i>.","Запишите по одной минимальной паре с [iː] и [ɪ]."],"studio":"Запишите аудиосообщение на 30–40 секунд: назовите шесть английских слов, объясните их чтение и произнесите по одному примеру с каждым.","q1":{"type":"choice","q":"В каком слове сочетание <i>th<\/i> обычно читается как [ð]?","opts":["think","this","bath"],"a":"this","why":"В служебных и ряде частотных слов, включая this, th читается как [ð]."},"q2":{"type":"input","q":"Введите слово с открытым слогом: n___e","a":["name"],"why":"Конечная e делает слог открытым."}},{"title":"Identity and description","focus":"Глагол to be, личные местоимения и прилагательные","can":"Я смогу представиться, описать человека и задать базовые вопросы.","theory":"<p>Глагол <b>to be<\/b> связывает подлежащее с именем, профессией, качеством или местом: <i>I am ready. She is a designer. They are at home.<\/i> В вопросе форма глагола ставится перед подлежащим: <i>Are you ready?<\/i> В отрицании используется <i>not<\/i>: <i>He is not late.<\/i><\/p><p>Прилагательное в английском обычно не меняется по числу: <i>a quiet street — quiet streets<\/i>. Чтобы описание было естественным, добавляйте конкретную деталь, а не только общий ярлык.<\/p>","vocab":[["introduce yourself","представиться","Let me introduce myself briefly."],["reliable","надёжный","A reliable friend keeps promises."],["curious","любознательный","Curious learners ask useful questions."],["neighbourhood","район","My neighbourhood is quiet in the evening."],["similar","похожий","The two plans are similar."],["different from","отличающийся от","This task is different from the last one."]],"readingTitle":"The new study group","reading":"A new study group met online on Thursday. Noor introduced herself as a first-year student who was interested in design and languages. Her classmate Leo was calm but talkative, so he started the conversation. The group was small, yet every person had a different goal. By the end of the meeting, they were more confident about working together.","readQ":["Why did the group feel more confident?","They had talked about their different goals and started working together."],"lab":["Преобразуйте в вопрос: <i>She is interested in design.<\/i>","Напишите три предложения: имя, сфера интересов, сильная сторона.","Замените повторяющееся имя местоимениями в коротком абзаце."],"studio":"Подготовьте мини-представление одногруппника: 5–6 предложений с to be, двумя прилагательными и одним вопросом к аудитории.","q1":{"type":"choice","q":"Выберите корректный вопрос.","opts":["You are ready?","Are you ready?","Ready you are?"],"a":"Are you ready?","why":"В общем вопросе форма to be предшествует подлежащему."},"q2":{"type":"input","q":"Дополните: They ___ interested in languages.","a":["are"],"why":"С they употребляется are."}},{"title":"Things, people and possession","focus":"Существительные, множественное число, have got и притяжательность","can":"Я смогу описывать вещи, семью и принадлежность предметов.","theory":"<p>Большинство исчисляемых существительных во множественном числе оканчивается на <b>-s<\/b>: <i>books<\/i>. После шипящих добавляется <b>-es<\/b>: <i>boxes<\/i>; после согласной + y используется <b>-ies<\/b>: <i>families<\/i>. Некоторые формы нужно запоминать: <i>children, people, mice<\/i>.<\/p><p>Конструкция <b>have got<\/b> показывает обладание: <i>We have got a small library.<\/i> Притяжательная форма с апострофом указывает на владельца: <i>my sister’s notebook<\/i>. Не путайте владельца и описание: <i>the students’ room<\/i> — комната студентов.<\/p>","vocab":[["belong to","принадлежать","This notebook belongs to my cousin."],["household","домашнее хозяйство","Our household shares one study table."],["shelf","полка","The dictionary is on the top shelf."],["equipment","оборудование","The classroom equipment is new."],["relative","родственник","A relative sent us a postcard."],["pair","пара","I need a pair of scissors."]],"readingTitle":"A shared apartment","reading":"Four students share a small apartment near the university. The kitchen has got two shelves for food and one drawer for cups. Lina’s books are on the desk, while the other students’ notebooks are in a box by the window. Everyone has got one responsibility: water the plants, buy bread, clean the table or check the equipment.","readQ":["Where are Lina’s books?","They are on the desk."],"lab":["Образуйте множественное число: <i>family, box, child, shelf<\/i>.","Опишите пять предметов на своём рабочем месте с have got.","Составьте три словосочетания с притяжательной формой."],"studio":"Напишите описание пространства для учёбы (70–90 слов). Используйте не менее трёх притяжательных форм и двух количественных выражений.","q1":{"type":"choice","q":"Выберите правильную форму множественного числа.","opts":["childs","children","childes"],"a":"children","why":"Children — неправильная форма множественного числа."},"q2":{"type":"input","q":"Дополните: My brother ___ got a new laptop.","a":["has"],"why":"С he/she/it употребляется has got."}},{"title":"Daily routines","focus":"Present Simple, наречия частотности и вопросы","can":"Я смогу описать распорядок дня и спросить о привычках.","theory":"<p>Present Simple используют для регулярных действий, фактов и расписаний: <i>I usually study in the evening. The library opens at nine.<\/i> В третьем лице единственного числа добавляется <b>-s/-es<\/b>: <i>she reads, he watches<\/i>. После вспомогательных <i>do/does<\/i> смысловой глагол остаётся в начальной форме: <i>Does she work on Fridays?<\/i><\/p><p>Наречия частотности обычно стоят перед смысловым глаголом, но после <i>to be<\/i>: <i>I often read; She is always punctual.<\/i><\/p>","vocab":[["routine","распорядок","A routine can reduce stress."],["usually","обычно","I usually take notes by hand."],["rarely","редко","We rarely miss the first bus."],["deadline","крайний срок","The deadline is Friday afternoon."],["schedule","расписание","Check the schedule before you leave."],["priority","приоритет","Sleep is a priority during exams."]],"readingTitle":"A quiet morning routine","reading":"Before classes, Daniel usually walks to a café near the station. He rarely opens social media before breakfast because it distracts him. At the café, he checks his schedule, writes one priority in a notebook and sends a message to his project partner. The habit takes fifteen minutes, but it helps him begin the day calmly.","readQ":["Why does Daniel avoid social media before breakfast?","Because it distracts him."],"lab":["Поставьте глаголы в Present Simple: <i>she / finish; they / study<\/i>.","Составьте пять вопросов о распорядке дня партнёра.","Поставьте usually, rarely, always в правильную позицию."],"studio":"Создайте план «A productive weekday» из восьми предложений. Добавьте два наречия частотности и один вопрос для читателя.","q1":{"type":"choice","q":"Выберите правильную форму.","opts":["She study every day.","She studies every day.","She studying every day."],"a":"She studies every day.","why":"В третьем лице единственного числа к study добавляется -ies."},"q2":{"type":"input","q":"Дополните: ___ he work on Saturdays?","a":["Does"],"why":"С he в вопросе Present Simple используется Does."}},{"title":"Here and now","focus":"Present Continuous и различие Simple/Continuous","can":"Я смогу описывать действие в момент речи и отличать его от привычки.","theory":"<p>Present Continuous строится по формуле <b>am/is/are + V-ing<\/b> и описывает процесс сейчас или временную ситуацию: <i>They are preparing a presentation.<\/i> Present Simple описывает факт или привычку: <i>They prepare presentations every month.<\/i><\/p><p>Некоторые глаголы состояния обычно не употребляются в Continuous: <i>know, believe, need, understand<\/i>. Сравните: <i>I think this plan is useful<\/i> (мнение) и <i>I am thinking about the plan<\/i> (процесс размышления).<\/p>","vocab":[["at the moment","в данный момент","At the moment, we are revising."],["currently","сейчас, в настоящее время","The team is currently testing the plan."],["focus on","сосредоточиться на","Please focus on one task."],["interrupt","прерывать","Do not interrupt a speaker."],["temporary","временный","This is a temporary arrangement."],["notice","замечать","I notice small changes quickly."]],"readingTitle":"A working afternoon","reading":"It is four o’clock, and the library is becoming quieter. Two students are discussing a chart near the window, while another student is looking for sources on a laptop. The librarian is not speaking loudly; she is pointing to a sign that asks visitors to use headphones. Outside, rain is falling, but nobody is leaving yet.","readQ":["What is the librarian doing?","She is pointing to a sign."],"lab":["Выберите Simple или Continuous: <i>She usually / work; She / work now<\/i>.","Опишите картинку или комнату пятью предложениями в Present Continuous.","Исправьте: <i>I am knowing the answer.<\/i>"],"studio":"Запишите голосовое описание происходящего вокруг вас в течение одной минуты. Добавьте одно предложение о своей обычной привычке для контраста.","q1":{"type":"choice","q":"Какое предложение описывает действие сейчас?","opts":["I read every evening.","I am reading now.","I have read it yesterday."],"a":"I am reading now.","why":"Present Continuous описывает действие в момент речи."},"q2":{"type":"input","q":"Дополните: We ___ preparing a report now.","a":["are"],"why":"С we используется are."}},{"title":"Place, time and quantity","focus":"There is/are, предлоги, some/any и исчисляемость","can":"Я смогу описывать место, время и количество предметов.","theory":"<p>Конструкции <b>there is/there are<\/b> вводят новую информацию о наличии: <i>There is a printer in the hall. There are two windows in the room.<\/i> С неисчисляемыми словами используется единственное число: <i>There is some information on the website.<\/i><\/p><p><b>Some<\/b> обычно употребляется в утверждениях, а <b>any<\/b> — в вопросах и отрицаниях. В предложении вежливой просьбы или предложения возможно <i>some<\/i>: <i>Would you like some water?<\/i><\/p>","vocab":[["opposite","напротив","The bank is opposite the museum."],["next to","рядом с","Sit next to the window."],["available","доступный","Is there any space available?"],["furniture","мебель","The furniture is practical."],["equipment","оборудование","There is new equipment in the lab."],["appointment","встреча по записи","My appointment is at three."]],"readingTitle":"Finding the workshop room","reading":"There is a workshop room on the second floor of the learning centre. It is next to the computer lab and opposite a small café. There are usually some empty desks before noon, but there is not much space after four. If you need any equipment, ask at the reception desk.","readQ":["Where is the workshop room?","It is on the second floor, next to the computer lab."],"lab":["Опишите комнату с there is/there are.","Вставьте some или any в четыре собственных предложения.","Нарисуйте схему и объясните расположение пяти объектов."],"studio":"Напишите инструкцию «How to find my study place» (80 слов). Используйте минимум пять предлогов места и два выражения количества.","q1":{"type":"choice","q":"Выберите корректное предложение.","opts":["There are some furniture here.","There is some furniture here.","There is many furniture here."],"a":"There is some furniture here.","why":"Furniture — неисчисляемое существительное."},"q2":{"type":"input","q":"Дополните: Is there ___ milk in the fridge?","a":["any"],"why":"В общем вопросе обычно употребляется any."}},{"title":"Past stories","focus":"Past Simple, Past Continuous и временные маркеры","can":"Я смогу рассказать о завершённом событии и его фоне.","theory":"<p>Past Simple обозначает завершённое действие в прошлом: <i>We arrived at six.<\/i> Past Continuous показывает процесс, который происходил в определённый момент: <i>We were walking home when it started to rain.<\/i> Часто Past Continuous создаёт фон, а Past Simple называет событие, которое его прервало.<\/p><p>Используйте ясные маркеры: <i>yesterday, last week, while, when, suddenly<\/i>. Они помогают читателю восстановить порядок событий.<\/p>","vocab":[["unexpectedly","неожиданно","Unexpectedly, the train stopped."],["while","в то время как","While I was waiting, I read an article."],["fortunately","к счастью","Fortunately, nobody was hurt."],["delay","задержка","The delay lasted twenty minutes."],["notice","заметить","I noticed a message on my phone."],["return","вернуться","We returned home late."]],"readingTitle":"A delayed train","reading":"Last Friday, Marta was travelling home after a seminar when her train stopped between two stations. At first, everyone was checking their phones and waiting quietly. Then a member of staff explained that a signal problem had caused the delay. Fortunately, the train started again after twenty minutes, and Marta arrived in time for dinner.","readQ":["What caused the delay?","A signal problem caused the delay."],"lab":["Составьте два предложения с when и while.","Преобразуйте: <i>I read. The phone rang.<\/i>","Напишите пять глаголов в Past Simple и их формы."],"studio":"Напишите историю из 100 слов о небольшом неожиданном событии. Используйте Past Continuous не менее двух раз.","q1":{"type":"choice","q":"Выберите правильный вариант.","opts":["I was walking when I saw her.","I walked when I was seeing her.","I was walk when I saw her."],"a":"I was walking when I saw her.","why":"Длительный процесс выражается Past Continuous."},"q2":{"type":"input","q":"Дополните: They ___ waiting when the bus arrived.","a":["were"],"why":"С they в Past Continuous используется were."}},{"title":"Plans, rules and review","focus":"Будущее, can/must/should и интегрированное повторение","can":"Я смогу говорить о планах, давать рекомендации и формулировать правила.","theory":"<p><b>Will<\/b> используют для решения в момент речи, обещания или прогноза: <i>I’ll call you later.<\/i> <b>Be going to<\/b> выражает намерение или прогноз на основе видимого признака: <i>It is going to rain.<\/i> После расписаний часто используется Present Simple: <i>The workshop starts at ten.<\/i><\/p><p><b>Must<\/b> выражает сильную обязанность, <b>mustn’t<\/b> — запрет, а <b>should<\/b> — совет. Помните: <i>You don’t have to<\/i> означает отсутствие необходимости, а не запрет.<\/p>","vocab":[["intention","намерение","My intention is to practise daily."],["arrangement","договорённость","We have an arrangement to meet at nine."],["rule","правило","The first rule is to listen carefully."],["recommend","рекомендовать","I recommend taking short breaks."],["responsibility","ответственность","Each member has a responsibility."],["review","повторение","A weekly review reveals weak points."]],"readingTitle":"A study-week agreement","reading":"Our group is going to prepare for the final review together. We will meet twice a week, and the first meeting starts on Tuesday at six. Everyone must bring one useful example and should explain one difficult point. We do not have to finish every task in one evening, but we must agree on the next step before leaving.","readQ":["What must every group member bring?","One useful example."],"lab":["Составьте три правила для учебной группы.","Объясните разницу между will и going to на своих примерах.","Отредактируйте: <i>You mustn’t bring a laptop if you want.<\/i>"],"studio":"Создайте личный план на семь дней: цель, три действия, одно правило и один совет самому себе.","q1":{"type":"choice","q":"Какая форма выражает запрет?","opts":["You do not have to leave.","You must not leave.","You should leave."],"a":"You must not leave.","why":"Must not выражает запрет."},"q2":{"type":"input","q":"Дополните: I think I ___ help you with that.","a":["will"],"why":"Will подходит для решения или обещания в момент речи."}}]},{"num":2,"level":"A2+/B1 · Independent communication","title":"Связное высказывание и условность","summary":"Опыт, планы, советы, условные предложения и естественная беседа.","outcomes":["говорить об опыте и изменениях","обсуждать возможности и последствия","передавать слова других людей"],"units":[{"title":"Experience and change","focus":"Present Perfect и Past Simple: результат, опыт и конкретное прошлое","can":"Я смогу различать жизненный опыт и завершённое действие в конкретный момент.","theory":"<p>Present Perfect связывает прошлое с настоящим: опыт, результат или период, который ещё продолжается: <i>I have visited Prague. She has lived here for two years.<\/i> Past Simple называют завершённое время: <i>I visited Prague in 2024.<\/i><\/p><p>Слова <i>already, just, yet, ever, never, for, since<\/i> часто сопровождают Present Perfect. Если в предложении есть <i>yesterday, last month, in 2020<\/i>, обычно нужен Past Simple.<\/p>","vocab":[["achievement","достижение","Finishing the course was an achievement."],["so far","до сих пор","So far, we have completed three units."],["recently","недавно","I have recently changed my routine."],["improve","улучшать","Her pronunciation has improved."],["experience","опыт","This was a useful experience."],["progress","прогресс","Small steps create progress."]],"readingTitle":"A new habit","reading":"Since January, Elena has kept a short learning diary. She started it after a difficult presentation last autumn. So far, she has written about twenty entries and has noticed a clear change in her confidence. Last week, she read her first entry again and laughed at how worried she was.","readQ":["When did Elena start her diary?","She started it last autumn."],"lab":["Напишите три вопроса с ever и yet.","Разделите маркеры времени на Present Perfect и Past Simple.","Исправьте: <i>I have met him yesterday.<\/i>"],"studio":"Напишите заметку «How I have changed as a learner» (100–120 слов) с двумя Present Perfect и двумя Past Simple.","q1":{"type":"choice","q":"Выберите корректное предложение.","opts":["I have finished it yesterday.","I finished it yesterday.","I have finish it yesterday."],"a":"I finished it yesterday.","why":"Yesterday обозначает завершённый момент прошлого."},"q2":{"type":"input","q":"Дополните: She has lived here ___ 2023.","a":["since"],"why":"Since вводит начальную точку периода."}},{"title":"Plans and predictions","focus":"Настоящие договорённости, планы и прогнозы","can":"Я смогу точно выбрать форму будущего в зависимости от смысла.","theory":"<p>Для личной договорённости часто используется Present Continuous: <i>I am meeting my supervisor on Friday.<\/i> Для намерения — <i>be going to<\/i>, а для прогнозов на основе мнения — <i>will<\/i>. Если прогноз опирается на явный признак, тоже подходит <i>going to<\/i>: <i>Look at those clouds — it is going to rain.<\/i><\/p><p>Выбор формы показывает отношение говорящего к действию: расписание, договорённость, намерение и спонтанное решение — не одно и то же.<\/p>","vocab":[["arrange","договориться","We arranged to meet after class."],["forecast","прогноз","The forecast says it will be cold."],["likely","вероятный","A delay is likely this evening."],["intend","намереваться","I intend to apply next year."],["reschedule","перенести","Can we reschedule the meeting?"],["deadline","срок","The deadline is approaching."]],"readingTitle":"A crowded calendar","reading":"Omar is meeting his project team on Wednesday, so he is not going to accept any extra work that evening. He thinks the team will finish the first draft soon, although the schedule is tight. The weather forecast is poor, and it is going to snow overnight, so they are planning to meet online.","readQ":["Why are they planning to meet online?","Because snow is expected overnight."],"lab":["Составьте по одному примеру с will, going to и Present Continuous.","Объясните форму: <i>The train leaves at 7.10.<\/i>","Перепишите план, добавив одну договорённость."],"studio":"Подготовьте календарь на неделю и кратко устно объясните четыре будущих действия разными формами.","q1":{"type":"choice","q":"Выберите форму для назначенной встречи.","opts":["I meet my tutor tomorrow.","I am meeting my tutor tomorrow.","I will meeting my tutor tomorrow."],"a":"I am meeting my tutor tomorrow.","why":"Present Continuous часто выражает личную договорённость."},"q2":{"type":"input","q":"Дополните: Look at the sky! It is ___ to rain.","a":["going"],"why":"Going to выражает прогноз на основе видимого признака."}},{"title":"Habits and adaptation","focus":"Used to, be/get used to и would","can":"Я смогу сравнивать прошлые привычки, текущее привыкание и повторяющиеся действия.","theory":"<p><b>Used to + infinitive<\/b> описывает прошлое состояние или привычку, которых больше нет: <i>I used to live near the sea.<\/i> <b>Be used to + noun/V-ing<\/b> означает «быть привыкшим»: <i>She is used to working late.<\/i> <b>Get used to<\/b> подчёркивает процесс адаптации.<\/p><p><b>Would + infinitive<\/b> может передавать повторяющиеся действия в прошлом, но не состояния: <i>Every summer we would visit our grandparents<\/i>, но не <i>would know<\/i>.<\/p>","vocab":[["adjust","приспосабливаться","It takes time to adjust to a new routine."],["familiar","знакомый","The platform is familiar now."],["former","бывший","My former schedule was less flexible."],["gradually","постепенно","Gradually, the task became easier."],["habit","привычка","A habit grows through repetition."],["comfort zone","зона комфорта","Learning often begins outside a comfort zone."]],"readingTitle":"The first month abroad","reading":"When I moved abroad, I used to call my family every evening because everything felt unfamiliar. At first, I was not used to speaking English at the supermarket or on the bus. Gradually, I got used to small conversations. Now I enjoy them, and I would often stay after class to practise with friends.","readQ":["What did the writer gradually get used to?","Small conversations in English."],"lab":["Составьте по одному примеру с used to и be used to.","Исправьте: <i>I am used to speak English.<\/i>","Опишите привычку, от которой вы отказались."],"studio":"Напишите сравнение «Then and now» (100 слов): две прошлые привычки, одна адаптация и один повторяющийся эпизод.","q1":{"type":"choice","q":"Выберите корректное предложение.","opts":["I am used to work late.","I am used to working late.","I use to working late."],"a":"I am used to working late.","why":"После be used to употребляется существительное или V-ing."},"q2":{"type":"input","q":"Дополните: We ___ to live near the station.","a":["used"],"why":"Used to описывает прошлое состояние, которого больше нет."}},{"title":"Choices and advice","focus":"Модальные глаголы и взвешенный совет","can":"Я смогу формулировать обязанность, рекомендацию и осторожное предложение.","theory":"<p><b>Should<\/b> и <b>ought to<\/b> дают совет: <i>You should back up your files.<\/i> <b>Had better<\/b> подчёркивает более срочную или конкретную рекомендацию: <i>You’d better leave now.<\/i> <b>Must<\/b> выражает обязанность, а <b>have to<\/b> часто связано с внешним правилом.<\/p><p>Хороший совет включает причину и выбор. Вместо категоричного «Do this» используйте: <i>If I were you, I’d…, You might want to…, It may help to…<\/i><\/p>","vocab":[["option","вариант","Consider every option before deciding."],["consequence","последствие","Every choice has a consequence."],["sensible","разумный","A sensible plan is realistic."],["urgent","срочный","The issue is urgent but manageable."],["weigh up","взвесить","We need to weigh up the risks."],["recommendation","рекомендация","Her recommendation was practical."]],"readingTitle":"Choosing a course","reading":"Ravi wants to join an intensive course, but he also works part-time. His friend says he should first check the weekly workload. The adviser explains that Ravi has to attend two live sessions, but he does not have to complete every optional activity. “You might want to start with one module,” she adds, “and then decide.”","readQ":["What does Ravi have to attend?","Two live sessions."],"lab":["Перепишите три приказа как вежливые советы.","Составьте совет с should и причину с because.","Сравните must и have to в двух ситуациях."],"studio":"Запишите ответ другу, который не успевает учиться: три совета разной силы и одно уточняющее вопросительное предложение.","q1":{"type":"choice","q":"Какая форма даёт совет, а не выражает запрет?","opts":["You must not wait.","You should wait.","You cannot wait."],"a":"You should wait.","why":"Should используется для рекомендации."},"q2":{"type":"input","q":"Дополните: You ___ back up your files regularly.","a":["should"],"why":"Should подходит для общего практического совета."}},{"title":"Possibilities","focus":"Conditionals 0–2, unless и условия","can":"Я смогу обсуждать правила, реальные планы и воображаемые варианты.","theory":"<p>Zero Conditional описывает общие закономерности: <i>If you heat ice, it melts.<\/i> First Conditional связывает реальное будущее условие с результатом: <i>If we finish early, we will go for a walk.<\/i> Во времени придаточном после if обычно не ставится will.<\/p><p>Second Conditional выражает воображаемую или маловероятную ситуацию в настоящем/будущем: <i>If I had more time, I would learn Italian.<\/i> Слово <b>unless<\/b> означает «если не»: <i>We will miss the bus unless we hurry.<\/i><\/p>","vocab":[["condition","условие","The condition is clear."],["outcome","результат","We cannot predict every outcome."],["realistic","реалистичный","Set a realistic target."],["otherwise","иначе","Leave now; otherwise, you will be late."],["in case","на случай","Take notes in case you forget."],["opportunity","возможность","The project creates an opportunity."]],"readingTitle":"A community garden","reading":"If the weather stays dry this weekend, the volunteers will plant new trees in the community garden. If people share tools, the work becomes easier. One volunteer says that if she had a larger balcony, she would grow vegetables at home too. Everyone agrees that the garden will not improve unless neighbours take part regularly.","readQ":["What will happen if the weather stays dry?","The volunteers will plant new trees."],"lab":["Напишите одно предложение каждого типа: zero, first, second.","Преобразуйте with unless: <i>If you do not practise, you will not improve.<\/i>","Закончите три условных предложения о своей учёбе."],"studio":"Составьте мини-план улучшения университетского пространства с тремя conditionals разных типов.","q1":{"type":"choice","q":"Выберите Second Conditional.","opts":["If I have time, I will call.","If I had time, I would call.","If I had had time, I would have called."],"a":"If I had time, I would call.","why":"If + Past Simple, would + infinitive выражает воображаемую ситуацию в настоящем."},"q2":{"type":"input","q":"Дополните: If it rains, we ___ stay inside.","a":["will"],"why":"В главной части First Conditional используется will."}},{"title":"Regret and unreal past","focus":"Third and mixed conditionals, wish и рефлексия","can":"Я смогу говорить о прошлом решении, сожалении и его последствиях.","theory":"<p>Third Conditional описывает воображаемое прошлое: <i>If I had left earlier, I would have caught the train.<\/i> Обе части относятся к уже невозможному изменению. <b>I wish + Past Perfect<\/b> выражает сожаление: <i>I wish I had asked more questions.<\/i><\/p><p>Mixed Conditional соединяет прошлую причину с настоящим результатом: <i>If I had taken the course, I would be more confident now.<\/i> Такая форма полезна для аккуратной рефлексии, но не должна превращаться в бесконечное самокритичное перечисление.<\/p>","vocab":[["regret","сожаление","Regret can become a useful lesson."],["miss an opportunity","упустить возможность","I missed an opportunity to ask."],["in hindsight","оглядываясь назад","In hindsight, the choice was clear."],["lesson learned","извлечённый урок","The lesson learned was simple."],["prevent","предотвращать","Preparation prevents stress."],["consequence","последствие","The consequence lasted for weeks."]],"readingTitle":"A missed application","reading":"Last year, Daria saw an announcement for a summer school but delayed her application. By the time she prepared the documents, the deadline had passed. She wishes she had started earlier. If she had applied on time, she would be travelling this July. In hindsight, she says, the main lesson was to break large tasks into small steps.","readQ":["Why did Daria miss the summer school?","She delayed her application until the deadline had passed."],"lab":["Закончите три Third Conditionals.","Переформулируйте сожаление с I wish.","Создайте один Mixed Conditional о навыке сегодня."],"studio":"Напишите рефлексию о вымышленном учебном решении: причина, упущенная возможность, урок и новый план.","q1":{"type":"choice","q":"Выберите Third Conditional.","opts":["If I know, I will help.","If I knew, I would help.","If I had known, I would have helped."],"a":"If I had known, I would have helped.","why":"Third Conditional относится к нереальному прошлому."},"q2":{"type":"input","q":"Дополните: I wish I ___ started earlier.","a":["had"],"why":"После I wish о прошлом используется Past Perfect."}},{"title":"Reporting information","focus":"Косвенная речь, вопросы, просьбы и сдвиг времени","can":"Я смогу передать содержание чужого сообщения точно и нейтрально.","theory":"<p>В косвенной речи утверждение часто вводится глаголом <i>said<\/i> или <i>told<\/i>: <i>She said that she was busy. She told me that she was busy.<\/i> После <i>told<\/i> нужен объект. Если исходная ситуация относится к прошлому, время нередко сдвигается назад: <i>will → would, can → could, have done → had done<\/i>.<\/p><p>Вопросы не сохраняют прямой порядок слов: <i>“Where do you live?” → He asked where I lived.<\/i> Просьба передаётся конструкцией <i>asked/told someone to do something<\/i>.<\/p>","vocab":[["announce","объявить","The coordinator announced a change."],["mention","упомянуть","She mentioned the deadline."],["clarify","уточнить","Please clarify what you mean."],["instruction","инструкция","The instructions were clear."],["report","сообщать","He reported the result calmly."],["quote","цитировать","Do not quote a source without context."]],"readingTitle":"A change of room","reading":"At noon, the coordinator said, “The workshop will take place in Room 12.” Later, a student asked whether the session would still begin at two. The coordinator replied that it would and told everyone to check the updated map. In a group chat, one participant reported that the new room was easier to find.","readQ":["What did the coordinator tell everyone to do?","To check the updated map."],"lab":["Передайте косвенно два утверждения и один вопрос.","Преобразуйте просьбу: <i>“Please send the file.”<\/i>","Объясните разницу между say и tell."],"studio":"Напишите новостное сообщение для группы о переносе занятия, используя минимум три reporting verbs.","q1":{"type":"choice","q":"Выберите корректную косвенную речь.","opts":["She said me that she was late.","She told me that she was late.","She told that she was late."],"a":"She told me that she was late.","why":"После told требуется объект."},"q2":{"type":"input","q":"Дополните: He asked where I ___ .","a":["lived"],"why":"В косвенном вопросе сохраняется порядок утверждения и часто происходит сдвиг времени."}},{"title":"Opinions in conversation","focus":"Согласие, несогласие, связки и повторение","can":"Я смогу поддерживать уважительную дискуссию и развивать мысль.","theory":"<p>Согласие можно выразить кратко: <i>I agree, exactly, that makes sense.<\/i> Чтобы добавить нюанс, используйте <i>I see your point, but…<\/i> или <i>That may be true; however…<\/i> Несогласие становится продуктивным, когда вы отвечаете на идею, а не на человека.<\/p><p>Связки организуют устную и письменную речь: <i>firstly, in addition, however, as a result, in conclusion<\/i>. Сначала сформулируйте тезис, затем причину и пример.<\/p>","vocab":[["point of view","точка зрения","I understand your point of view."],["evidence","доказательство","What evidence supports that claim?"],["however","однако","However, the cost is high."],["in addition","кроме того","In addition, the plan saves time."],["counterargument","контраргумент","Address the counterargument fairly."],["conclusion","вывод","The conclusion restates the main point."]],"readingTitle":"A discussion about phones","reading":"In a seminar, students discussed whether phones should be used in class. One student argued that phones provide quick access to dictionaries and sources. Another replied that this was true; however, notifications often interrupt concentration. In the end, the group agreed on a simple rule: phones were useful when the task required them, but not during discussion.","readQ":["What rule did the group agree on?","Phones were useful for tasks that required them, but not during discussion."],"lab":["Напишите два согласия и два вежливых несогласия.","Добавьте связки к четырём коротким предложениям.","Составьте тезис, причину и пример по знакомой теме."],"studio":"Проведите мини-дискуссию с партнёром: подготовьте тезис, контраргумент, пример и нейтральный вывод.","q1":{"type":"choice","q":"Какая фраза выражает уважительное несогласие?","opts":["That is nonsense.","I see your point, but I read it differently.","You are completely wrong."],"a":"I see your point, but I read it differently.","why":"Фраза признаёт позицию собеседника и мягко вводит альтернативу."},"q2":{"type":"input","q":"Дополните связку: The idea is useful; ___, it may be expensive.","a":["however"],"why":"However вводит противопоставление."}}]},{"num":3,"level":"B1/B1+ · Accuracy and range","title":"Точность формы и системная грамматика","summary":"Систематизация времён, залога, неличных форм и средств связности.","outcomes":["выбирать грамматическую форму по смыслу","редактировать собственный текст","создавать связные аргументированные абзацы"],"units":[{"title":"The tense system","focus":"Simple, Continuous, Perfect и Perfect Continuous","can":"Я смогу объяснить, почему одна форма времени точнее другой.","theory":"<p>Временная форма передаёт не только дату, но и взгляд говорящего на действие. Simple показывает факт или привычку; Continuous — процесс; Perfect — связь с более поздней точкой; Perfect Continuous — длительность процесса до этой точки. Сравните: <i>I wrote the report<\/i>, <i>I was writing the report<\/i>, <i>I have written the report<\/i>, <i>I have been writing the report for two hours.<\/i><\/p><p>Сначала найдите опорную точку во времени, затем спросите: действие завершено, длится или важно как результат?<\/p>","vocab":[["reference point","точка отсчёта","Choose a clear reference point."],["duration","длительность","The duration is two hours."],["completed","завершённый","The task is completed."],["ongoing","продолжающийся","The project is ongoing."],["result","результат","The result matters now."],["sequence","последовательность","The sequence is easy to follow."]],"readingTitle":"A research notebook","reading":"For three weeks, Sam has been collecting examples for a research notebook. He started after his teacher showed a useful method of categorising ideas. Yesterday, he added ten examples and noticed a pattern he had not seen before. By the end of the month, he will have organised the whole notebook into themes.","readQ":["What will Sam have done by the end of the month?","He will have organised the notebook into themes."],"lab":["Постройте временную шкалу для четырёх форм одного глагола.","Объясните разницу: <i>I have read<\/i> / <i>I have been reading<\/i>.","Исправьте две формы времени в собственном абзаце."],"studio":"Напишите журнал проекта из 90 слов, используя Present Perfect Continuous, Past Simple и Future Perfect.","q1":{"type":"choice","q":"Выберите форму для действия, которое длится до настоящего.","opts":["I study here for two years.","I have been studying here for two years.","I studied here for two years now."],"a":"I have been studying here for two years.","why":"Perfect Continuous показывает длительность до настоящего."},"q2":{"type":"input","q":"Дополните: By Friday, we ___ have finished the draft.","a":["will"],"why":"Future Perfect строится will have + Participle II."}},{"title":"Voice and focus","focus":"Пассивный залог, агент и безличные конструкции","can":"Я смогу выбирать активный или пассивный залог в зависимости от фокуса текста.","theory":"<p>Пассивный залог образуется с <b>be + Participle II<\/b>: <i>The report was published yesterday.<\/i> Его используют, когда исполнитель неизвестен, неважен или очевиден, а результат/объект важнее: <i>The data were checked twice.<\/i> Исполнитель при необходимости вводится с <i>by<\/i>.<\/p><p>В формальном стиле полезны безличные конструкции: <i>It is believed that…<\/i> и <i>The method is expected to…<\/i>. Не делайте весь текст пассивным: выбирайте форму, которая делает мысль яснее.<\/p>","vocab":[["agent","исполнитель действия","The agent is not named."],["publish","публиковать","The article was published online."],["evidence","доказательство","The evidence was checked."],["procedure","процедура","The procedure is explained below."],["be expected to","ожидаться","The team is expected to respond."],["be known to","быть известным тем, что","The tool is known to save time."]],"readingTitle":"A transparent process","reading":"Before a report is released, the evidence is checked by two editors. The final version is then sent to the author, who can correct factual mistakes. In the past, this process was completed by email. Now, most comments are recorded in one shared document, so every change can be traced.","readQ":["Who checks the evidence?","Two editors check the evidence."],"lab":["Преобразуйте три активных предложения в пассивные.","Решите, нужен ли агент by в каждом примере.","Перепишите одно тяжёлое пассивное предложение в активе."],"studio":"Составьте нейтральное описание процедуры из шести шагов: минимум три passive forms и одна безличная конструкция.","q1":{"type":"choice","q":"Выберите корректную пассивную форму.","opts":["The file sent yesterday.","The file was sent yesterday.","The file was sending yesterday."],"a":"The file was sent yesterday.","why":"Past Passive: was/were + Participle II."},"q2":{"type":"input","q":"Дополните: The results ___ checked twice.","a":["were"],"why":"С results во множественном числе используется were."}},{"title":"Non-finite forms I","focus":"Infinitive, gerund и модели управления","can":"Я смогу выбирать infinitive или gerund после частотных глаголов и предлогов.","theory":"<p>Инфинитив часто следует за глаголами намерения, решения и ожидания: <i>want to learn, decide to apply, hope to improve<\/i>. Герундий употребляется после глаголов отношения к действию и после предлогов: <i>enjoy reading, avoid making, good at explaining<\/i>. Форму нужно учить вместе с глаголом, а не переводить механически.<\/p><p>Некоторые глаголы меняют смысл: <i>remember to do<\/i> — не забыть сделать; <i>remember doing<\/i> — помнить совершённое действие.<\/p>","vocab":[["aim to","стремиться","We aim to improve clarity."],["avoid","избегать","Avoid making vague claims."],["consider","рассматривать","Consider taking a break."],["manage to","суметь","She managed to finish early."],["look forward to","ждать с нетерпением","I look forward to meeting you."],["worth","стоящий","The book is worth reading."]],"readingTitle":"A useful revision strategy","reading":"Niko decided to change his revision strategy. Instead of trying to memorise everything at once, he began making short cards and testing himself every day. He avoided studying late at night and managed to keep the routine for a month. Now he looks forward to reviewing difficult points because the process feels more manageable.","readQ":["What did Niko avoid doing?","He avoided studying late at night."],"lab":["Сгруппируйте глаголы, после которых нужен infinitive или gerund.","Дополните три предложения после предлогов.","Сравните remember to do и remember doing на примерах."],"studio":"Создайте памятку о стратегии учёбы с шестью verb patterns и кратким объяснением каждого выбора.","q1":{"type":"choice","q":"Выберите корректный вариант.","opts":["I enjoy to read.","I enjoy reading.","I enjoy read."],"a":"I enjoy reading.","why":"После enjoy употребляется gerund."},"q2":{"type":"input","q":"Дополните: She decided ___ apply early.","a":["to"],"why":"После decide используется to-infinitive."}},{"title":"Non-finite forms II","focus":"Причастия, сокращённые придаточные и complex structures","can":"Я смогу сокращать повторяющиеся конструкции и понимать неличные формы в тексте.","theory":"<p>Participle I (-ing) часто передаёт активный процесс: <i>Students working in pairs finished sooner.<\/i> Participle II описывает результат или пассивное значение: <i>The report written yesterday is online.<\/i> Сокращённая конструкция возможна, когда её логический субъект совпадает с субъектом главного предложения.<\/p><p>После <i>see/hear<\/i> bare infinitive часто показывает действие как целое, а -ing — процесс: <i>I saw him leave<\/i> / <i>I saw him leaving<\/i>. В Complex Subject: <i>She is believed to know the answer.<\/i><\/p>","vocab":[["reduced clause","сокращённое придаточное","A reduced clause saves space."],["observe","наблюдать","We observed the change."],["assume","предполагать","The method is assumed to work."],["carry out","проводить","The team carried out a survey."],["given","учитывая","Given the time, we chose a short task."],["based on","основанный на","The decision is based on evidence."]],"readingTitle":"A small observation","reading":"Walking through the library, I noticed two students discussing a diagram. I saw one of them point to a number, then write a short note. The diagram, created for a class project, compared different study habits. Based on the conversation, the students seemed to be testing a simple idea rather than searching for a perfect answer.","readQ":["What did one student do after pointing to a number?","The student wrote a short note."],"lab":["Сократите два relative clauses с причастиями.","Сравните I saw her cross / crossing the street.","Преобразуйте: <i>People believe that he knows.<\/i>"],"studio":"Отредактируйте абзац из собственного текста: добавьте одну reduced clause и одну complex structure без потери ясности.","q1":{"type":"choice","q":"Выберите корректную сокращённую конструкцию.","opts":["The book writing yesterday is useful.","The book written yesterday is useful.","The book wrote yesterday is useful."],"a":"The book written yesterday is useful.","why":"Participle II выражает пассивное значение: книга была написана."},"q2":{"type":"input","q":"Дополните: He is said ___ be reliable.","a":["to"],"why":"Complex Subject строится с to-infinitive."}},{"title":"Modality and deduction","focus":"Must, might, can’t и вывод о настоящем и прошлом","can":"Я смогу строить осторожную версию на основе признаков и отличать её от факта.","theory":"<p>Modal verbs выражают степень уверенности: <b>must<\/b> — сильный вывод, <b>might/may/could<\/b> — возможность, <b>can’t<\/b> — логическая невозможность. <i>She must be busy; her office is closed.<\/i> Это не прямое знание, а разумное заключение.<\/p><p>Для прошлого используйте <i>must have done, might have done, can’t have done<\/i>: <i>They must have left early.<\/i> Всегда отделяйте доказательство от предположения.<\/p>","vocab":[["clue","улика, признак","The empty cup is a clue."],["assumption","предположение","Do not treat an assumption as a fact."],["likely","вероятно","It is likely that they left."],["unlikely","маловероятно","That explanation is unlikely."],["conclude","делать вывод","We cannot conclude too quickly."],["evidence-based","основанный на данных","Use an evidence-based argument."]],"readingTitle":"The missing key","reading":"The office door is locked, but the lights are on. Amir thinks the manager must be inside. His colleague disagrees: she says the manager might have left the lights on by mistake. They both agree that the manager cannot have taken the main exit because the security log shows no record.","readQ":["Why do they think the manager did not take the main exit?","The security log has no record of it."],"lab":["Создайте три вывода разной степени уверенности по фотографии.","Перепишите факт как осторожное предположение.","Объясните разницу must be / must have been."],"studio":"Напишите короткий «case note»: факты, два возможных объяснения и один вывод, который нельзя делать без данных.","q1":{"type":"choice","q":"Какая форма выражает сильный вывод о прошлом?","opts":["She must leave.","She must have left.","She must leaving."],"a":"She must have left.","why":"Must have + Participle II выражает вывод о прошлом."},"q2":{"type":"input","q":"Дополните: He ___ be at home; the lights are off and his car is gone.","a":["cannot","can’t"],"why":"Cannot/can’t выражает логическую невозможность."}},{"title":"Nouns, articles and determiners","focus":"Артикли, квантификаторы и отсылка в тексте","can":"Я смогу выбирать артикль и определитель по смыслу, а не по механическому переводу.","theory":"<p><b>A/an<\/b> вводит один неопределённый экземпляр: <i>a report<\/i>. <b>The<\/b> указывает на известный, конкретный или уникальный объект: <i>the report we discussed<\/i>. Нулевой артикль часто используется с неисчисляемыми существительными и множественным числом в общем значении: <i>information, students need feedback<\/i>.<\/p><p>Квантификаторы различают исчисляемость: <i>many/few<\/i> — исчисляемые, <i>much/little<\/i> — неисчисляемые. <i>A few/a little<\/i> часто имеют более позитивный смысл, чем <i>few/little<\/i>.<\/p>","vocab":[["reference","отсылка","Clear reference improves a text."],["specific","конкретный","The second example is specific."],["general","общий","General statements need support."],["amount","количество","A small amount is enough."],["quantity","количество","The quantity is limited."],["clarity","ясность","Clarity matters more than length."]],"readingTitle":"A clearer notice","reading":"A student wrote a notice about a new study room. At first, the notice said, “Room has equipment and information is available.” The editor changed it to: “The room has some equipment, and information about booking is available at the reception desk.” The second version was clearer because it showed which room and which information were meant.","readQ":["Why was the second notice clearer?","It specified which room and which information were meant."],"lab":["Добавьте a/an/the/zero article в короткий текст.","Выберите few/a few и little/a little по смыслу.","Найдите три неясные отсылки в собственном черновике."],"studio":"Отредактируйте информационное объявление (80 слов), используя точные артикли, квантификаторы и отсылки.","q1":{"type":"choice","q":"Выберите корректный вариант.","opts":["I need an information.","I need some information.","I need informations."],"a":"I need some information.","why":"Information — неисчисляемое существительное."},"q2":{"type":"input","q":"Дополните: There are ___ students in the room.","a":["many"],"why":"Students — исчисляемое существительное во множественном числе."}},{"title":"Clauses and cohesion","focus":"Relative clauses, linkers и пунктуация","can":"Я смогу соединять идеи в ясный абзац и избегать разрозненных предложений.","theory":"<p>Relative clauses добавляют информацию: <i>The student who asked the question stayed after class.<\/i> Определительное придаточное без запятых уточняет, о ком/чём идёт речь; дополнительное часто отделяется запятыми: <i>My tutor, who lives nearby, cycles to work.<\/i><\/p><p>Связки показывают отношения между идеями: причина (<i>because, since<\/i>), контраст (<i>although, however<\/i>), результат (<i>therefore, as a result<\/i>), добавление (<i>moreover, in addition<\/i>). Выбирайте одну ясную связь, а не несколько похожих подряд.<\/p>","vocab":[["cohesion","связность","Cohesion makes a paragraph easier to read."],["whereas","тогда как","Whereas one group agreed, another hesitated."],["therefore","следовательно","The data were incomplete; therefore, we waited."],["although","хотя","Although it was late, we continued."],["relative clause","относительное придаточное","A relative clause adds information."],["punctuation","пунктуация","Punctuation guides the reader."]],"readingTitle":"One strong paragraph","reading":"A study group that meets regularly often develops better habits. Although members have different strengths, they can share methods and explain difficult points. One learner may be confident with grammar, whereas another may be better at organising information. As a result, the group becomes more useful than a collection of people working alone.","readQ":["Why can the group be useful?","Members can share different strengths and methods."],"lab":["Соедините пары предложений relative clauses.","Добавьте three different linkers to a paragraph.","Расставьте запятые в non-defining relative clause."],"studio":"Напишите аргументированный абзац из 120 слов: тезис, два доказательства, контраст и вывод.","q1":{"type":"choice","q":"Выберите подходящую связку для контраста.","opts":["therefore","although","because"],"a":"although","why":"Although вводит уступку/контраст."},"q2":{"type":"input","q":"Дополните: The student ___ asked the question stayed late.","a":["who"],"why":"Who относится к человеку как подлежащему придаточного."}},{"title":"Precision review","focus":"Интегрированное повторение и языковой аудит","can":"Я смогу находить повторяющиеся ошибки и редактировать текст по системе.","theory":"<p>Языковой аудит лучше проводить в несколько проходов. Сначала проверьте содержание и порядок идей. Затем отдельно посмотрите на времена, артикли, предлоги, глагольные модели и пунктуацию. Один проход — одна цель: так вы видите больше, чем при попытке исправить всё одновременно.<\/p><p>Создайте личный журнал ошибок в формате «ошибка → правило → мой новый пример». Повторяющаяся ошибка — не характеристика способностей, а сигнал, какую микротему нужно потренировать.<\/p>","vocab":[["audit","аудит, проверка","A short audit improves accuracy."],["pattern","закономерность","Notice the pattern in your errors."],["revise","переработать","Revise the paragraph after feedback."],["draft","черновик","Keep the first draft for comparison."],["criterion","критерий","Use one criterion at a time."],["self-correction","самокоррекция","Self-correction builds independence."]],"readingTitle":"From draft to final version","reading":"Mina compared two versions of her essay. In the first draft, she had many good ideas but few clear links between them. During her audit, she corrected article errors, replaced repeated words and added one example for each claim. The final version was not longer, but it was easier to follow and more convincing.","readQ":["What did Mina add for each claim?","One example."],"lab":["Проведите четыре прохода проверки собственного текста.","Составьте журнал из пяти личных ошибок.","Поменяйтесь текстами и дайте обратную связь по одному критерию."],"studio":"Соберите мини-портфолио: исходный абзац, отредактированный абзац и комментарий о трёх изменениях.","q1":{"type":"choice","q":"Что лучше проверять в одном проходе редактирования?","opts":["Все аспекты сразу.","Один критерий, например времена.","Только длину текста."],"a":"Один критерий, например времена.","why":"Один фокус за проход повышает качество самопроверки."},"q2":{"type":"input","q":"Дополните: Keep the first ___ for comparison.","a":["draft"],"why":"Draft — черновая версия текста."}}]},{"num":4,"level":"B2 · Analytical reading and argumentation","title":"Аналитическое чтение и аргументация","summary":"Работа с доказательствами, регистрами, академической лексикой и дискуссией.","outcomes":["анализировать текст и источник","строить аргумент с контраргументом","писать в формальном и нейтральном стиле"],"units":[{"title":"Study and assessment","focus":"Академическая лексика, номинализация и рефлексивный ответ","can":"Я смогу обсуждать учёбу, оценивание и критерии более формально.","theory":"<p>Академический стиль часто использует точные существительные вместо расплывчатых глагольных фраз: <i>the assessment of evidence<\/i> вместо <i>how we assess evidence<\/i>. Это называется номинализацией. Она полезна, когда делает мысль компактнее, но избыток абстрактных существительных может утяжелить текст.<\/p><p>Сильный рефлексивный ответ сочетает опыт и анализ: что произошло, почему это важно, чему вы научились и что измените дальше.<\/p>","vocab":[["criterion","критерий","The criterion is explained in advance."],["feedback","обратная связь","Feedback should be specific."],["assessment","оценивание","Assessment needs clear standards."],["evidence","доказательство","Evidence supports the claim."],["justify","обосновывать","Justify your choice with an example."],["reflect on","рефлексировать о","Reflect on the process, not only the mark."]],"readingTitle":"A fair rubric","reading":"Before the presentation, the teacher shared a rubric with four criteria: clarity, evidence, organisation and response to questions. Students used it to prepare and to give peer feedback. After the session, several students said that the rubric reduced anxiety because they understood what strong performance looked like.","readQ":["Why did the rubric reduce anxiety?","Students understood what strong performance looked like."],"lab":["Замените два разговорных выражения на академические.","Составьте один criterion и индикатор для него.","Напишите рефлексивный ответ по модели what–so what–now what."],"studio":"Напишите формальный ответ об оценивании (140 слов): позиция, пример, возможное ограничение и вывод.","q1":{"type":"choice","q":"Что делает обратную связь наиболее полезной?","opts":["Она очень общая.","Она конкретна и связана с критерием.","Она содержит только оценку."],"a":"Она конкретна и связана с критерием.","why":"Конкретная обратная связь показывает, что сохранить и как улучшить."},"q2":{"type":"input","q":"Дополните: Please ___ your choice with evidence.","a":["justify"],"why":"Justify означает обосновать решение."}},{"title":"Law, evidence and fairness","focus":"Аргументация, hedging и точная тематическая лексика","can":"Я смогу обсуждать спорный кейс, отделяя факт от интерпретации.","theory":"<p>В аналитическом обсуждении полезно различать <b>claim<\/b>, <b>evidence<\/b> и <b>inference<\/b>. Утверждение требует основания; доказательство — проверяемая информация; вывод — интерпретация. Hedging делает формулировку точнее: <i>The evidence may suggest…, It appears that…, This is likely to…<\/i><\/p><p>Осторожная формулировка не ослабляет аргумент, если она соответствует силе доступных данных.<\/p>","vocab":[["claim","утверждение","The claim needs support."],["testimony","показание","The testimony was consistent."],["verdict","вердикт","The verdict followed a long discussion."],["reasonable doubt","разумное сомнение","Reasonable doubt affects the decision."],["fairness","справедливость","Fairness requires transparent rules."],["allege","утверждать без доказательства","The report alleges a mistake."]],"readingTitle":"A campus case","reading":"A committee reviewed a complaint about damaged equipment in a shared studio. One student said that another had used the room late at night. However, the booking record did not show who had entered after ten. The committee concluded that the available evidence was insufficient to assign responsibility, but it recommended a clearer sign-in system.","readQ":["Why did the committee not assign responsibility?","The available evidence was insufficient."],"lab":["Отделите факт, утверждение и вывод в трёх предложениях.","Смягчите категоричные формулировки с may/appears/likely.","Постройте аргумент с одним ограничением данных."],"studio":"Проведите мини-слушание по вымышленному кейсу: факты, вопросы, две версии и нейтральная рекомендация.","q1":{"type":"choice","q":"Какая фраза является осторожным выводом?","opts":["This proves everything.","The evidence may suggest a pattern.","There is no possible doubt."],"a":"The evidence may suggest a pattern.","why":"May suggest соотносит вывод с ограниченной уверенностью."},"q2":{"type":"input","q":"Дополните: The available evidence was ___ to decide.","a":["insufficient"],"why":"Insufficient означает недостаточный."}},{"title":"Media and information","focus":"Reporting verbs, bias и оценка источника","can":"Я смогу сравнивать сообщения и указывать на возможную предвзятость.","theory":"<p>Reporting verbs показывают отношение автора к информации: <i>state, claim, suggest, acknowledge, deny<\/i>. Они не равнозначны: <i>claim<\/i> может указывать, что утверждение требует проверки, а <i>acknowledge<\/i> — что говорящий признаёт факт.<\/p><p>Проверяя источник, спросите: кто автор, какова цель, какие доказательства приведены, что не сказано и есть ли независимое подтверждение. Bias не всегда означает ложь; он может проявляться в выборе слов, примеров и акцентов.<\/p>","vocab":[["source","источник","Check the original source."],["bias","предвзятость","Bias can appear in word choice."],["headline","заголовок","The headline is more dramatic than the article."],["confirm","подтверждать","Can another source confirm this?"],["omit","опускать","The summary omits a key detail."],["reliable","надёжный","Reliable sources show their evidence."]],"readingTitle":"Two headlines, one event","reading":"Two local websites reported the same transport change. One headline read, “City ignores commuters again,” while the other said, “New timetable aims to reduce delays.” Both articles mentioned the same start date, but only the second included a link to the public consultation. A careful reader would compare the wording, evidence and missing perspectives before forming an opinion.","readQ":["What did only the second article include?","A link to the public consultation."],"lab":["Замените эмоциональный заголовок на нейтральный.","Выберите reporting verb для пяти цитат.","Составьте чек-лист оценки источника."],"studio":"Сравните два коротких сообщения на одну тему: цели, язык, доказательства, отсутствующая перспектива и собственный вывод.","q1":{"type":"choice","q":"Какой вопрос помогает оценить источник?","opts":["Нравится ли мне заголовок?","Какие доказательства приведены?","Сколько в нём прилагательных?"],"a":"Какие доказательства приведены?","why":"Проверка доказательств — ключ к оценке надёжности."},"q2":{"type":"input","q":"Дополните: The article ___ an important detail.","a":["omits"],"why":"Omit означает не включать/опускать."}},{"title":"Culture and performance","focus":"Оценочная лексика и язык рецензии","can":"Я смогу написать содержательную рецензию, а не только выразить нравится/не нравится.","theory":"<p>Рецензия сочетает описание и оценку. Сначала назовите объект и контекст, затем выберите конкретные элементы: композицию, темп, актёрскую работу, звук, визуальный образ, реакцию аудитории. Оценочное суждение должно сопровождаться примером: <i>The pacing felt uneven because the middle scene repeated the same conflict.<\/i><\/p><p>Сильная рецензия допускает неоднозначность: работа может быть смелой, но не всегда убедительной.<\/p>","vocab":[["compelling","убедительный, захватывающий","The opening was compelling."],["subtle","тонкий","The actor gave a subtle performance."],["pace","темп","The pace slowed in the middle."],["staging","постановочное решение","The staging used very little scenery."],["convey","передавать","Music conveyed tension."],["flawed","несовершенный","The film is flawed but memorable."]],"readingTitle":"A small stage production","reading":"The student theatre used only three chairs and a narrow strip of light, yet the staging made the room feel larger than it was. The lead actor’s performance was subtle rather than dramatic. The pace slowed during the second scene, but the final dialogue was compelling because it brought earlier details together without explaining too much.","readQ":["What made the final dialogue compelling?","It brought earlier details together without over-explaining."],"lab":["Замените like/dislike на точную оценочную лексику.","Напишите тезис рецензии и два доказательства.","Сравните pace и staging в двух постановках."],"studio":"Напишите рецензию на фильм, спектакль или книгу (170 слов) с описанием, оценкой, примером и рекомендацией аудитории.","q1":{"type":"choice","q":"Какая фраза содержит оценку с доказательством?","opts":["The play was good.","The play was very, very good.","The play was compelling because its final scene resolved the conflict quietly."],"a":"The play was compelling because its final scene resolved the conflict quietly.","why":"Оценка подкреплена конкретной причиной."},"q2":{"type":"input","q":"Дополните: The music helped ___ tension.","a":["convey"],"why":"Convey tension — передавать напряжение."}},{"title":"Science and innovation","focus":"Причина–следствие, определения и объяснение идеи","can":"Я смогу объяснить сложную идею неспециалисту без искажения смысла.","theory":"<p>Объяснение начинается с определения: <i>X is a process/system that…<\/i> Затем используйте структуру причина–следствие: <i>because, therefore, leads to, results in, as a consequence<\/i>. Снижайте сложность через пример и сравнение, но не заменяйте точность эффектной метафорой.<\/p><p>Проверьте, может ли читатель после текста назвать: что это, как работает, почему важно и какое у него ограничение.<\/p>","vocab":[["mechanism","механизм","Explain the mechanism clearly."],["variable","переменная","Change one variable at a time."],["impact","влияние","The impact may be long-term."],["efficient","эффективный","The new system is more efficient."],["limitation","ограничение","Every method has a limitation."],["demonstrate","демонстрировать","The example demonstrates the idea."]],"readingTitle":"A simple sensor","reading":"A student team built a small sensor that measures how noisy a study space is. The device does not record conversations; it only tracks sound levels. When the level rises above a chosen point, a light changes colour. The team hopes this will help people notice patterns, although the sensor cannot explain why the room is noisy.","readQ":["What can the sensor not explain?","Why the room is noisy."],"lab":["Определите понятие в одном предложении.","Добавьте cause/effect links к описанию процесса.","Назовите одно ограничение простой технологии."],"studio":"Объясните выбранную технологию школьнику: определение, механизм, польза, ограничение и один пример.","q1":{"type":"choice","q":"Какая связка выражает результат?","opts":["because","therefore","although"],"a":"therefore","why":"Therefore вводит следствие."},"q2":{"type":"input","q":"Дополните: Every method has a ___.","a":["limitation"],"why":"Limitation — ограничение метода."}},{"title":"Work and professional identity","focus":"Коллокации и формальный деловой email","can":"Я смогу представить профессиональный профиль и написать ясное деловое письмо.","theory":"<p>Профессиональный стиль зависит от цели и адресата. В письме полезна структура: понятная тема, краткое обращение, цель в первом абзаце, необходимые детали, конкретный следующий шаг и нейтральное завершение. Избегайте слишком разговорных сокращений и неопределённых просьб.<\/p><p>Учите коллокации: <i>meet a deadline, gain experience, take responsibility, develop expertise<\/i>. Они делают профиль естественнее, чем отдельные слова.<\/p>","vocab":[["meet a deadline","уложиться в срок","We met the deadline."],["take responsibility","брать ответственность","She takes responsibility for the task."],["relevant experience","релевантный опыт","Highlight relevant experience."],["expertise","экспертиза","He develops expertise in data analysis."],["enquiry","запрос","Thank you for your enquiry."],["availability","доступность","Please confirm your availability."]],"readingTitle":"A clear email","reading":"Dear Ms Patel,\n\nI am writing to ask whether there is still a place on the research workshop in May. I have relevant experience in student media and would like to develop my editing skills further. I am available on both workshop days. Could you please let me know the application process?\n\nKind regards,\nAlex","readQ":["What does Alex ask about?","Whether there is still a place on the research workshop and how to apply."],"lab":["Отредактируйте разговорное письмо в формальное.","Составьте тему письма и ясную просьбу.","Добавьте три профессиональные коллокации в профиль."],"studio":"Напишите деловое письмо (150 слов): цель, контекст, релевантный опыт, конкретный вопрос и вежливое завершение.","q1":{"type":"choice","q":"Какое завершение подходит для формального письма?","opts":["See you!","Kind regards,","Cheers mate,"],"a":"Kind regards,","why":"Kind regards — нейтральное формальное завершение."},"q2":{"type":"input","q":"Дополните: Please confirm your ___.","a":["availability"],"why":"Availability — доступность по времени."}},{"title":"Society and urban life","focus":"Сравнение, уступка и предложения","can":"Я смогу сравнить варианты решения общественной проблемы и предложить реалистичный план.","theory":"<p>Для сравнения используйте чёткий критерий: стоимость, доступность, влияние, скорость, справедливость. Не ограничивайтесь «better/worse»: <i>more affordable, less disruptive, the most accessible option<\/i>. Уступка показывает сложность: <i>Although the plan is expensive, it may reduce long-term costs.<\/i><\/p><p>Предложение должно включать проблему, действие, ожидаемый эффект и возможное ограничение.<\/p>","vocab":[["affordable","доступный по цене","The service must be affordable."],["accessible","доступный","The entrance is accessible."],["disruptive","создающий неудобства","Roadworks are disruptive."],["proposal","предложение","The proposal needs detail."],["residents","жители","Residents were consulted."],["long-term","долгосрочный","Think about long-term effects."]],"readingTitle":"A safer crossing","reading":"Residents near a school have proposed a safer crossing. The new design would be more visible than the current one and less disruptive than closing the whole street. Although the project would cost money, supporters argue that it could reduce risk in the long term. The council is now collecting comments from residents and parents.","readQ":["What is the council collecting?","Comments from residents and parents."],"lab":["Сравните два варианта по трём критериям.","Добавьте although к предложению о недостатке.","Сформулируйте проблему и ожидаемый эффект предложения."],"studio":"Напишите предложение по улучшению пространства: 180 слов, сравнение двух вариантов, уступка и план внедрения.","q1":{"type":"choice","q":"Какая форма выражает уступку?","opts":["Although it is expensive, it may help.","Because it is expensive, it may help.","Therefore it is expensive, it may help."],"a":"Although it is expensive, it may help.","why":"Although вводит контраст между недостатком и возможным плюсом."},"q2":{"type":"input","q":"Дополните: The entrance is ___ for wheelchair users.","a":["accessible"],"why":"Accessible означает доступный."}},{"title":"Argumentation review","focus":"Тезис, доказательство, контраргумент и эссе","can":"Я смогу написать связное аргументированное эссе с честным контраргументом.","theory":"<p>Аргументированное эссе строится вокруг ясного тезиса, а не вокруг списка мыслей. Каждый абзац развивает один довод через утверждение, доказательство, объяснение и связь с тезисом. Контраргумент не разрушает позицию: он показывает, что вы учитываете альтернативу и можете ответить на неё.<\/p><p>В заключении не вводите новый аргумент. Вернитесь к тезису и покажите, почему совокупность доказательств поддерживает выбранную позицию.<\/p>","vocab":[["thesis","тезис","The thesis appears in the introduction."],["support","поддержка","Each claim needs support."],["counterargument","контраргумент","Address a strong counterargument."],["rebuttal","опровержение","The rebuttal explains the limitation."],["coherent","связный","The essay is coherent."],["persuasive","убедительный","The evidence is persuasive."]],"readingTitle":"A balanced position","reading":"Some students argue that every lecture should be recorded. They point out that recordings help learners review difficult material and support those who are ill. Others worry that recorded lectures reduce attendance and interaction. A balanced position may support recording while also designing live sessions that include discussion and tasks that cannot be replaced by watching later.","readQ":["What concern do some students have about recordings?","They may reduce attendance and interaction."],"lab":["Сформулируйте thesis по спорной теме.","Постройте один body paragraph по схеме claim–evidence–explanation.","Добавьте контраргумент и rebuttal."],"studio":"Напишите эссе 220–260 слов: тезис, два аргумента, контраргумент, ответ и вывод.","q1":{"type":"choice","q":"Где уместнее всего вводить новый аргумент?","opts":["В заключении","В основном абзаце","После подписи"],"a":"В основном абзаце","why":"Заключение подводит итог уже развитых аргументов."},"q2":{"type":"input","q":"Дополните: A strong essay begins with a clear ___.","a":["thesis"],"why":"Thesis — центральная позиция эссе."}}]},{"num":5,"level":"B2+/C1 · Professional and pedagogical communication","title":"Профессиональная и педагогическая коммуникация","summary":"Культура, педагогика, академическая дискуссия и итоговое портфолио.","outcomes":["вести профессиональное обсуждение","проектировать учебную коммуникацию","создавать продвинутые устные и письменные продукты"],"units":[{"title":"Film and visual narrative","focus":"Лексика кино и описание визуального эффекта","can":"Я смогу говорить о фильме через конкретные художественные решения.","theory":"<p>Анализ фильма начинается с наблюдения: кадр, свет, звук, монтаж, точка зрения, ритм. Затем формулируется эффект: <i>The close-up draws attention to…, The soundtrack creates…, The cut suggests…<\/i> Не называйте намерение автора как факт, если у вас есть только интерпретация; используйте <i>may suggest, seems to emphasise<\/i>.<\/p><p>Хороший устный обзор связывает форму и смысл: не только что показано, но как это влияет на зрителя.<\/p>","vocab":[["close-up","крупный план","A close-up reveals hesitation."],["soundtrack","звуковая дорожка","The soundtrack changes the mood."],["editing","монтаж","Fast editing creates energy."],["perspective","точка зрения","The story shifts perspective."],["scene","сцена","The final scene is quiet."],["visual motif","визуальный мотив","A repeated visual motif links the film."]],"readingTitle":"A short silent scene","reading":"In a short film, a student arrives at an empty station carrying a bright yellow umbrella. The scene contains almost no dialogue. Instead, the camera returns to the umbrella whenever the character hesitates. A slow soundtrack and long pauses make the audience notice small movements. The visual motif may suggest that the character is waiting for a decision, not only for a train.","readQ":["What visual motif is repeated?","A bright yellow umbrella."],"lab":["Опишите кадр через свет, звук и угол камеры.","Замените общий отзыв precise film vocabulary.","Сформулируйте осторожную интерпретацию с may suggest."],"studio":"Подготовьте устную рецензию фильма на 2 минуты: наблюдение, эффект, интерпретация и рекомендация.","q1":{"type":"choice","q":"Какой термин обозначает крупный план?","opts":["soundtrack","close-up","editing"],"a":"close-up","why":"Close-up — крупный план."},"q2":{"type":"input","q":"Дополните: Fast ___ can create energy.","a":["editing"],"why":"Editing — монтаж."}},{"title":"Theatre and live performance","focus":"Регистр, оценка и взаимодействие со зрителем","can":"Я смогу описать живое представление и реакцию аудитории точным языком.","theory":"<p>В театре смысл создаётся не только текстом, но и живым взаимодействием: паузой, жестом, пространством сцены, светом и реакцией зала. Различайте <i>performance<\/i> (исполнение), <i>production<\/i> (постановка в целом), <i>staging<\/i> (сценическое решение) и <i>audience response<\/i>.<\/p><p>Когда описываете эффект, связывайте элемент постановки с реакцией: <i>The pause unsettled the audience because…<\/i><\/p>","vocab":[["rehearsal","репетиция","The rehearsal focused on timing."],["stagecraft","сценическое мастерство","Stagecraft shaped the mood."],["ensemble","актёрский ансамбль","The ensemble worked closely together."],["pause","пауза","A long pause changed the scene."],["audience response","реакция аудитории","Audience response was immediate."],["immersive","погружающий","The production felt immersive."]],"readingTitle":"An empty chair on stage","reading":"A student production began with one empty chair under a narrow light. Throughout the performance, actors moved around it but never sat down. During the final pause, the audience became completely silent. After the show, several viewers said that the simple image made the story feel more personal than a detailed set would have done.","readQ":["What was on stage at the beginning?","One empty chair under a narrow light."],"lab":["Сравните performance и production на примере.","Опишите реакцию аудитории через конкретный момент.","Напишите две фразы с because и therefore о сценическом эффекте."],"studio":"Создайте программу для короткой постановки: концепция, сцена, ожидаемая реакция аудитории и заметка режиссёра.","q1":{"type":"choice","q":"Что означает audience response?","opts":["Стоимость билета","Реакция зрителей","Сценарий"],"a":"Реакция зрителей","why":"Audience response — реакция аудитории."},"q2":{"type":"input","q":"Дополните: The actors prepared during a ___.","a":["rehearsal"],"why":"Rehearsal — репетиция."}},{"title":"The teacher’s classroom","focus":"Инструкции, обратная связь и classroom English","can":"Я смогу сформулировать ясные инструкции и поддерживающую обратную связь.","theory":"<p>Эффективная инструкция коротка, наблюдаема и проверяема. Вместо «Do the task carefully» скажите: <i>Work in pairs. Choose three examples. You have five minutes. Then compare your answers.<\/i> После инструкции проверьте понимание вопросом, который требует действия, а не автоматического «yes».<\/p><p>Обратная связь полезна, когда она называет успех, указывает один следующий шаг и оставляет учащемуся право на попытку: <i>Your examples are clear. Now check the verb form in sentence three.<\/i><\/p>","vocab":[["instruction","инструкция","Give one instruction at a time."],["monitor","наблюдать за работой","Monitor pairs without interrupting."],["prompt","подсказка","Use a prompt, not the full answer."],["criterion","критерий","Share the criterion first."],["peer feedback","взаимооценка","Peer feedback needs a structure."],["wait time","время на обдумывание","Wait time supports participation."]],"readingTitle":"A clearer task","reading":"A teacher asks students to discuss a short text. Instead of saying “Talk about it,” she gives four steps: choose one claim, find one sentence that supports it, explain why, and ask your partner one question. She then asks, “What will you do first?” Students repeat the first step in their own words before starting.","readQ":["How does the teacher check understanding?","She asks students what they will do first."],"lab":["Перепишите расплывчатую инструкцию в четыре шага.","Составьте concept-checking question.","Дайте обратную связь по модели success + next step."],"studio":"Спроектируйте 10-минутную пару-работу: цель, инструкция, time limit, checking question и две фразы feedback.","q1":{"type":"choice","q":"Как лучше проверить понимание инструкции?","opts":["Вы всё поняли?","Что вы сделаете сначала?","Вам нравится задание?"],"a":"Что вы сделаете сначала?","why":"Вопрос требует показать понимание действия."},"q2":{"type":"input","q":"Дополните: Give learners time to think; this is called wait ___.","a":["time"],"why":"Wait time — время на обдумывание ответа."}},{"title":"How languages are learned","focus":"Методическая лексика и сравнение стратегий","can":"Я смогу объяснить и сопоставить учебные стратегии без упрощений.","theory":"<p>Нет одной универсальной стратегии изучения языка. Полезно сопоставлять цель, уровень, материал, время и обратную связь. Повторение с интервалами помогает удержанию, а осмысленная практика помогает переносу в новую ситуацию. Однако любая техника работает лучше, когда учащийся понимает, что именно он тренирует.<\/p><p>Описывая методику, избегайте категоричных заявлений. Вместо «This method always works» используйте «This approach can be effective when…».<\/p>","vocab":[["retrieval practice","воспроизведение из памяти","Retrieval practice strengthens memory."],["spaced repetition","интервальное повторение","Spaced repetition spreads review over time."],["input","языковой вход","Learners need understandable input."],["output","языковой выход","Output reveals gaps."],["scaffold","опора","A scaffo
