<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аракин · 1–5 курс · ВСЁ В ОДНОМ ФАЙЛЕ</title>
<style>
:root{--accent:#12324f;--accent2:#1d4f7a;--gold:#a67c00;--bg:#f3f5f8;--card:#fff;--dark:#0c1826;--shadow:0 6px 22px rgba(12,24,38,.12);--radius:14px;--ok:#1f7a3d;--err:#b3261e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:#222;line-height:1.55}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:295px;background:linear-gradient(168deg,#08131f 0%,#12324f 58%,#3a1c10 100%);color:#eef3f9;z-index:50;display:flex;flex-direction:column;transition:transform .3s ease}
.side-head{padding:14px 14px 10px;border-bottom:1px solid rgba(255,255,255,.12)}
.side-head h1{font-size:14px;line-height:1.3;font-weight:700}
.side-head p{font-size:10.5px;color:#9db3c8;margin-top:3px}
.ctabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 12px 4px}
.ctab{background:rgba(255,255,255,.1);border-radius:7px;padding:6px 0;text-align:center;font-size:10px;font-weight:700;cursor:pointer;transition:.15s}
.ctab:hover{background:rgba(255,255,255,.2)}
.ctab.active{background:rgba(231,180,22,.3);color:#ffe7a1}
.progress-wrap{padding:8px 14px 6px}
.progress-label{display:flex;justify-content:space-between;font-size:9.5px;color:#9db3c8;margin-bottom:4px;text-transform:uppercase}
.progress-track{height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#e7b416);transition:width .5s ease}
.nav-list{flex:1;overflow-y:auto;padding:8px}
.nav-list::-webkit-scrollbar{width:5px}
.nav-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px;border-radius:9px;cursor:pointer;transition:background .16s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.09)}
.nav-item.active{background:rgba(166,124,0,.34)}
.nav-num{flex:0 0 22px;height:22px;border-radius:7px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.nav-tt{flex:1;font-size:11px;font-weight:600;line-height:1.2}
.badge{font-size:8.5px;font-weight:700;padding:2px 5px;border-radius:99px;background:rgba(255,255,255,.14);color:#d7e5f2;white-space:nowrap}
.badge.ok{background:#1f7a3d;color:#fff}.badge.mid{background:#d9a520;color:#231b00}.badge.low{background:#b3261e;color:#fff}
.side-foot{padding:9px 14px;border-top:1px solid rgba(255,255,255,.12);font-size:10px;color:#84a0ba;display:flex;justify-content:space-between;align-items:center}
.side-foot a{color:#ffd76a;cursor:pointer;text-decoration:underline}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:60;width:42px;height:42px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.overlay{display:none;position:fixed;inset:0;background:rgba(6,12,20,.55);z-index:40}
.main{margin-left:295px;padding:30px 36px 80px;max-width:1040px}
.lesson-head{margin-bottom:20px;animation:fadeUp .4s ease}
.lesson-tag{display:inline-block;background:var(--gold);color:#fff;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:4px 12px;border-radius:99px;margin-bottom:9px}
.lesson-head h2{font-size:26px;color:var(--dark);line-height:1.2;margin-bottom:5px}
.lesson-head .sub{font-size:13px;color:#58697d}
.welcome{animation:fadeUp .5s ease}
.hero{background:linear-gradient(135deg,#08131f,#12324f 55%,#5a3905);border-radius:16px;color:#fff;padding:36px 32px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"I–V";position:absolute;right:-8px;bottom:-35px;font-size:130px;font-weight:800;opacity:.06}
.hero h2{font-size:27px;margin-bottom:10px;line-height:1.2}
.hero p{max-width:720px;color:#c7d7e6;font-size:13px}
.hero .start{margin-top:16px;display:inline-block;background:var(--gold);color:#fff;border:none;font-size:13px;font-weight:700;padding:11px 24px;border-radius:10px;cursor:pointer;transition:transform .15s;box-shadow:0 5px 14px rgba(166,124,0,.4)}
.hero .start:hover{transform:translateY(-2px)}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lesson-card{background:var(--card);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);border-top:4px solid var(--gold);transition:transform .18s;cursor:pointer}
.lesson-card:hover{transform:translateY(-3px)}
.lesson-card h3{color:var(--accent);font-size:13px;margin-bottom:4px}
.lesson-card p{font-size:11px;color:#58697d}
.section-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow);animation:fadeUp .4s ease}
.section-card h3{color:var(--accent);font-size:15px;margin-bottom:9px}
.section-card h3::before{content:"§ ";color:var(--gold)}
.section-card p{font-size:12.5px;margin-bottom:6px;color:#263447}
.section-card ul{margin:5px 0 7px 16px;font-size:12.5px;color:#263447}
.section-card li{margin-bottom:3px}
table.gram{width:100%;border-collapse:collapse;margin:8px 0 10px;font-size:11.5px;background:#fff}
table.gram th{background:var(--accent);color:#fff;padding:6px 8px;text-align:left;font-weight:600;font-size:10.5px}
table.gram td{border:1px solid #dfe6ee;padding:6px 8px;vertical-align:top}
table.gram tr:nth-child(even) td{background:#f7fafc}
.text-block{background:#f8f9fc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin:8px 0;font-size:12.5px;line-height:1.6}
.text-block .title{font-weight:700;color:var(--accent);margin-bottom:7px;font-size:13px}
.text-block p{margin-bottom:6px}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;margin:6px 0}
.vocab-item{background:#f4f7fb;border:1px solid #dfe6ee;border-radius:8px;padding:6px 9px;font-size:11.5px}
.vocab-item b{color:var(--accent)}
.vocab-item .def{color:#55677d;font-size:10.5px;display:block;margin-top:1px}
.example{background:#f5f8ff;border-left:3px solid var(--accent2);border-radius:0 8px 8px 0;padding:7px 11px;margin:6px 0;font-size:12px;font-style:italic}
.tip{background:#fff7e7;border-left:3px solid #e0a020;border-radius:0 8px 8px 0;padding:8px 11px;margin:8px 0;font-size:11.5px;color:#5d4a1f}
.tip::before{content:"💡 ";font-weight:700}
.ex-wrap h3.ex-title{font-size:16px;color:var(--dark);margin:22px 0 11px}
.ex-wrap h3.ex-title::before{content:"✎ ";color:var(--gold)}
.ex-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:9px;animation:fadeUp .4s ease}
.ex-q{font-size:12.5px;font-weight:600;color:#172435;margin-bottom:8px}
.ex-q .n{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:6px;background:var(--accent);color:#fff;font-size:10px;margin-right:6px;flex-shrink:0;padding:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid #dfe6ee;background:#fbfcfe;border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;transition:.15s;user-select:none}
.opt:hover{border-color:var(--accent2);background:#eef5fb}
.opt.selected{border-color:var(--accent);background:#e2effa;font-weight:600}
.opt.correct{border-color:var(--ok);background:#e5f5ec;font-weight:700}
.opt.wrong{border-color:var(--err);background:#fdebec}
.fill-input{border:2px solid #dfe6ee;border-radius:8px;padding:6px 10px;font-size:12.5px;width:100%;max-width:340px;outline:none;transition:.15s;background:#fbfcfe;font-family:inherit}
.fill-input:focus{border-color:var(--accent2);background:#fff}
.fill-input.correct{border-color:var(--ok);background:#e5f5ec}
.fill-input.wrong{border-color:var(--err);background:#fdebec}
.feedback{margin-top:7px;font-size:11.5px;font-weight:600;display:none;border-radius:7px;padding:6px 10px}
.feedback.ok{display:block;background:#e5f5ec;color:var(--ok)}
.feedback.err{display:block;background:#fdebec;color:var(--err)}
.btn-row{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:10px 22px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .15s;font-family:inherit}
.btn-check{background:var(--gold);color:#fff;box-shadow:0 4px 12px rgba(166,124,0,.3)}
.btn-check:hover{transform:translateY(-2px)}
.btn-reset{background:#e8edf4;color:#3b4a5d}
.btn-reset:hover{background:#dbe4ef}
.result-box{display:none;margin-top:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;text-align:center;border-top:4px solid var(--gold);animation:fadeUp .4s ease}
.result-box.show{display:block}
.result-box .score{font-size:26px;font-weight:800;color:var(--accent)}
.result-box .msg{font-size:13px;font-weight:700;margin-top:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
.hamburger{display:block}.overlay.show{display:block}
.main{margin-left:0;padding:64px 14px 70px}
.lesson-head h2{font-size:20px}.hero{padding:22px 16px}.hero h2{font-size:20px}
}
</style>
</head>

{t:"School Education in Britain",s:"Nouns, Adjectives, Numerals · Final Revision",g:`<p>Мн. число: child—children. Степени сравнения: good—better—the best. fewer — исчисляемые, less — неисчисляемые.</p>`,x:`<p>In Britain education is compulsory from five to sixteen. Children go to primary school at five and move to secondary school at eleven. At sixteen pupils take GCSE examinations. Those who want to go on to higher education take 'A' level examinations.</p>`,v:`<div class="vocab-grid"><div class="vocab-item"><b>compulsory</b><span class="def">обязательный</span></div><div class="vocab-item"><b>primary school</b><span class="def">начальная школа</span></div><div class="vocab-item"><b>GCSE</b><span class="def">экзамен в 16 лет</span></div></div>`,e:[

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function norm(s){return String(s).toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim()}
function key(c,l){return c+"-"+l}
function allLessons(){let a=[];COURSES.forEach((c,ci)=>c.l.forEach((_,li)=>a.push({c:ci,l:li})));return a}
function buildTabs(){
let h="";COURSES.forEach((c,i)=>{h+='<div class="ctab'+(curC===i?' active':'')+'" onclick="openCourse('+i+')">'+(i+1)+'</div>';});
document.getElementById("ctabs").innerHTML=h;}
function buildNav(){
buildTabs();
const nav=document.getElementById("navlist");let html="";
COURSES[curC].l.forEach((l,i)=>{
const sc=scores[key(curC,i)];let badge="";
if(sc&&sc.answered){const p=Math.round(sc.correct/sc.total*100);const cls=p===100?"ok":(p>=60?"mid":"low");badge='<span class="badge '+cls+'">'+sc.correct+'/'+sc.total+'</span>';}
html+='<div class="nav-item'+(curL===i?' active':'')+'" onclick="loadLesson('+curC+','+i+')"><div class="nav-num">'+(i+1)+'</div><div class="nav-tt">'+esc(l.t)+'</div>'+badge+'</div>';});
nav.innerHTML=html;}
function updateProgress(){
const total=allLessons().length;
const done=allLessons().filter(x=>{const s=scores[key(x.c,x.l)];return s&&s.answered}).length;
const p=Math.round(done/total*100);
document.getElementById("pr-fill").style.width=p+"%";
document.getElementById("pr-text").textContent=p+"%";
let tot=0;allLessons().forEach(x=>{const s=scores[key(x.c,x.l)];if(s&&s.answered)tot+=s.correct;});
document.getElementById("foot-score").textContent="Баллов: "+tot;}
function showWelcome(){
curL=null;buildNav();
let cards="";
COURSES.forEach((c,ci)=>{
cards+='<div class="lesson-card" onclick="openCourse('+ci+')"><h3>'+c.n+' · '+c.l.length+' уроков</h3><p>'+esc(c.l[0].t)+' и др.</p></div>';});
document.getElementById("main").innerHTML='<div class="welcome"><div class="hero"><h2>Аракин · 1–5 курс<br>ВСЁ В ОДНОМ ФАЙЛЕ</h2><p>51 урок: фонетика, грамматика, тексты, словари и упражнения всех пяти курсов. Переключайте курсы кнопками 1–5 слева. Прогресс сохраняется автоматически.</p><button class="start" onclick="openCourse(0)">Открыть 1 курс →</button></div><div class="lesson-grid">'+cards+'</div></div>';
window.scrollTo({top:0});}
function openCourse(ci){
curC=ci;curL=null;buildNav();
const c=COURSES[ci];
let cards=c.l.map((l,i)=>{
const sc=scores[key(ci,i)];
const badge=sc&&sc.answered?('<p style="margin-top:5px;font-weight:700;color:var(--gold);font-size:10px">'+sc.correct+'/'+sc.total+'</p>'):"";
return '<div class="lesson-card" onclick="loadLesson('+ci+','+i+')"><h3>Урок '+(i+1)+'. '+esc(l.t)+'</h3><p>'+esc(l.s)+'</p>'+badge+'</div>';}).join("");
document.getElementById("main").innerHTML='<div class="welcome"><div class="hero"><h2>'+c.n+' · '+c.l.length+' уроков</h2><p>Тексты, словари, грамматика и упражнения. Выберите урок ниже.</p><button class="start" onclick="loadLesson('+ci+',0)">Открыть урок 1 →</button></div><div class="lesson-grid">'+cards+'</div></div>';
window.scrollTo({top:0});}
function loadLesson(ci,li){
curC=ci;curL=li;buildNav();
const l=COURSES[ci].l[li];
let exHtml="";
l.e.forEach((e,i)=>{
const n='<span class="n">'+(i+1)+'</span>';
let body="";
if(e[0]==="c"){body='<div class="opts">'+e[2].map(o=>'<div class="opt" data-val="'+esc(o)+'" onclick="selectOpt(this)">'+esc(o)+'</div>').join("")+'</div>';}
else{body='<input type="text" class="fill-input" placeholder="Введите ответ…" autocomplete="off">';}
exHtml+='<div class="ex-block" data-idx="'+i+'"><div class="ex-q">'+n+esc(e[1])+'</div>'+body+'<div class="feedback"></div></div>';});
let html='<div class="lesson-head"><span class="lesson-tag">'+COURSES[ci].n+' · Урок '+(li+1)+'</span><h2>'+esc(l.t)+'</h2><div class="sub">'+esc(l.s)+'</div></div>';
html+='<div class="section-card"><h3>Грамматика</h3>'+l.g+'</div>';
if(l.x){html+='<div class="section-card"><h3>Текст</h3><div class="text-block"><div class="title">TEXT</div>'+l.x+'</div></div>';}
if(l.v){html+='<div class="section-card"><h3>Словарь</h3>'+l.v+'</div>';}
html+='<div class="ex-wrap"><h3 class="ex-title">Упражнения ('+l.e.length+')</h3>'+exHtml+'<div class="btn-row"><button class="btn btn-check" onclick="checkAll()">✓ Проверить все</button><button class="btn btn-reset" onclick="resetEx()">↺ Сбросить</button></div><div class="result-box" id="resbox"><div class="score" id="res-score"></div><div class="msg" id="res-msg"></div></div></div>';
document.getElementById("main").innerHTML=html;
window.scrollTo({top:0,behavior:"smooth"});
if(window.innerWidth<=768)closeSide();}
function selectOpt(el){el.parentElement.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected"));el.classList.add("selected");}
function checkAll(){
const l=COURSES[curC].l[curL];
const blocks=document.querySelectorAll(".ex-block");let correct=0;
blocks.forEach((blk,i)=>{
const e=l.e[i];const fb=blk.querySelector(".feedback");let ok=false;
if(e[0]==="c"){
const sel=blk.querySelector(".opt.selected");
blk.querySelectorAll(".opt").forEach(o=>{o.classList.remove("correct","wrong");if(o.dataset.val===e[3])o.classList.add("correct");else if(o.classList.contains("selected"))o.classList.add("wrong");});
ok=!!(sel&&sel.dataset.val===e[3]);
fb.innerHTML=ok?"✓ Правильно!":"✗ Неправильно. Ответ: <b>"+esc(e[3])+"</b>";
}else{
const inp=blk.querySelector(".fill-input");const v=norm(inp.value);
const acc=Array.isArray(e[2])?e[2]:[e[2]];
ok=v.length>0&&acc.some(a=>norm(a)===v);
inp.classList.remove("correct","wrong");if(v.length>0)inp.classList.add(ok?"correct":"wrong");
fb.innerHTML=ok?"✓ Правильно!":"✗ Неправильно. Ответ: <b>"+esc(acc[0])+"</b>";
}
fb.className="feedback "+(ok?"ok":"err");if(ok)correct++;});
const total=l.e.length;const p=Math.round(correct/total*100);
let msg,color;
if(p===100){msg="Отлично! Все ответы верны.";color="var(--ok)";}
else if(p>=80){msg="Очень хорошо!";color="var(--ok)";}
else if(p>=60){msg="Неплохо. Повторите материал.";color="#d9a520";}
else{msg="Повторите урок и попробуйте снова.";color="var(--err)";}
document.getElementById("res-score").textContent=correct+" / "+total+" ("+p+"%)";
document.getElementById("res-score").style.color=color;
document.getElementById("res-msg").textContent=msg;
document.getElementById("res-msg").style.color=color;
document.getElementById("resbox").classList.add("show");
document.getElementById("resbox").scrollIntoView({behavior:"smooth",block:"center"});
scores[key(curC,curL)]={correct:correct,total:total,answered:true};
localStorage.setItem(LS,JSON.stringify(scores));
buildNav();updateProgress();}
function resetEx(){
document.querySelectorAll(".opt").forEach(o=>o.classList.remove("selected","correct","wrong"));
document.querySelectorAll(".fill-input").forEach(i=>{i.value="";i.classList.remove("correct","wrong");});
document.querySelectorAll(".feedback").forEach(f=>{f.className="feedback";f.innerHTML="";});
const box=document.getElementById("resbox");if(box)box.classList.remove("show");
window.scrollTo({top:0,behavior:"smooth"});}
function resetAll(){if(!confirm("Сбросить весь прогресс всех курсов?"))return;scores={};localStorage.removeItem(LS);buildNav();updateProgress();showWelcome();}
function toggleSide(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("ovl").classList.toggle("show");}
function closeSide(){document.getElementById("sidebar").classList.remove("open");document.getElementById("ovl").classList.remove("show");}
buildNav();updateProgress();showWelcome();
</script>

{id:'sound',group:'Старт',lv:'A1',title:'Звуки, чтение и ударение',goal:'Не угадывать слово по буквам, а замечать звук и ударение.',easy:'В английском буква и звук — не одно и то же. Поэтому не пытайтесь читать каждую букву «по-русски»: сначала посмотрите на короткое слово-образец, затем повторите весь ритм слова.',formula:'ship [ʃɪp] ≠ sheep [ʃiː] · record (сущ.) /ˈrekɔːd/ ≠ record (гл.) /rɪˈkɔːd/',steps:['Сначала найдите ударный слог: он звучит сильнее, дольше и яснее.','Сравните гласный с образцом: sit — короткий [ɪ], seat — долгий [iː].','Связки th бывают разными: think — [θ], this — [ð].'],examples:['I live in a big city. — В слове live короткий [ɪ].','She sees three green trees. — В sees и green долгий [iː].','I want to record a record. — У существительного и глагола разное ударение.'],tip:'Лайфхак: учите новое слово сразу как пару «написание + произношение + ударение»: e.g. important /ɪmˈpɔːtənt/.',trap:'Ловушка: не добавляйте звук [р] в конце British English: car /kɑː/, а не «карр».',mini:{q:'Какой вариант передаёт звук в слове <b>sheep</b>?',opts:['короткий [ɪ]','долгий [iː]','[e]'],ans:'долгий [iː]',why:'В sheep пишется сочетание ee и здесь слышится долгий [iː].'}},
{id:'sentence',group:'Старт',lv:'A1',title:'Каркас английского предложения',goal:'Сразу видеть, кто делает действие и что именно происходит.',easy:'В обычном английском предложении порядок слов гораздо строже, чем в русском. Самый надёжный каркас: <b>кто? → что делает? → что/кого? → где/когда?</b>. Не переносите русское «свободное» расположение слов в английский.',formula:'Subject + Verb + Object + Place + Time',steps:['Найдите деятеля: I, my friend, the children.','Поставьте сказуемое сразу после него: work, likes, are studying.','После глагола добавьте объект: English, a book, the question.','Детали времени и места поставьте дальше: at home, every day.'],examples:['My sister reads books every evening. — Моя сестра читает книги каждый вечер.','We study English at the university. — Мы изучаем английский в университете.','Yesterday I met Tom in the library. — Вчера я встретил Тома в библиотеке.'],tip:'Проверка: если вы можете указать пальцем на Subject и Verb, скелет предложения уже есть.',trap:'Ловушка: нельзя *Very I like this film*. Правильно: <b>I like this film very much.</b>',mini:{q:'Выберите нейтральный порядок слов.',opts:['Every day reads Anna books.','Anna reads books every day.','Books Anna every day reads.'],ans:'Anna reads books every day.',why:'Подлежащее Anna стоит перед глаголом reads; время — в конце.'}},
{id:'noun',group:'Старт',lv:'A1–A2',title:'Существительные: число, притяжательность и исчисляемость',goal:'Понимать, когда нужен -s, когда слово не меняется и как сказать «чей?».',easy:'Исчисляемые предметы можно посчитать: one book, two books. Неисчисляемые вещества и идеи обычно не считают поштучно: water, information, advice. Чтобы назвать владельца, используют ’s: my sister’s bag.',formula:'book → books · baby → babies · child → children · the student’s book · the students’ books',steps:['Спросите: можно ли посчитать предмет поштучно?','Если один исчисляемый предмет — нужен определитель: a book / the book / my book.','Для обычного множественного числа добавьте -s; после -s, -x, -ch — часто -es.','Если владелец один: ’s; если уже множественное на -s: только апостроф.'],examples:['I need some information. — Мне нужна информация.','There are three children in the garden. — В саду трое детей.','The girl’s coat is blue. — Пальто девочки синее.','The teachers’ room is upstairs. — Комната учителей наверху.'],tip:'Слова advice, furniture, news, information в английском обычно неисчисляемые: <b>some advice</b>, не *advices*.',trap:'Ловушка: *two breads* обычно неверно. Скажите <b>two loaves of bread</b> или two pieces of bread.',mini:{q:'Как правильно: «у меня есть две новости»?',opts:['I have two news.','I have two pieces of news.','I have two informations.'],ans:'I have two pieces of news.',why:'News — неисчисляемое слово; для количества добавляют единицу измерения.'}},
{id:'articles',group:'Старт',lv:'A1–B1',title:'Артикли: a/an, the и нулевой артикль',goal:'Не выбирать артикль «на слух», а понимать, известен ли предмет собеседнику.',easy:'Артикль — маленький указатель. <b>a/an</b> = «один какой-то, впервые упоминаю». <b>the</b> = «тот самый, уже понятный». Нулевой артикль = говорим вообще о множестве, веществе, языке, приёме пищи или учреждении в его функции.',formula:'I saw a dog. The dog was friendly. · an hour · the sun · I like music.',steps:['Предмет один и упоминается впервые? Обычно a/an.','Предмет уже известен, единственный или уточнённый? Обычно the.','Говорим о вещах вообще во множественном числе или о веществе? Часто без артикля.','Выбирайте a/an по звуку: an apple, an hour; a university (звук [j]).'],examples:['She bought a book. The book is on the table.','I drink coffee, but the coffee in this café is too cold.','Children like games. — Дети вообще любят игры.','He goes to school. — Он ходит в школу как ученик.'],tip:'Мнемоника: <b>a</b> = «один из многих», <b>the</b> = «ты знаешь, о чём я».',trap:'Ловушка: не ставьте the перед названием языка: <b>I speak English</b>, не *the English*.',mini:{q:'Выберите верный вариант: “She is ___ engineer.”',opts:['a','an','the'],ans:'an',why:'Engineer начинается с гласного звука [e], поэтому an.'}},
{id:'pronouns',group:'Старт',lv:'A1–A2',title:'Местоимения, some/any/no и there is/are',goal:'Строить фразы «есть / нет / сколько» без буквального перевода с русского.',easy:'Some чаще встречается в утверждении, any — в вопросе и отрицании, no уже содержит отрицание. Конструкция there is/are сообщает, что где-то что-то существует; она не равна «они там».',formula:'There is + ед. ч. · There are + мн. ч. · some / any / no + noun',steps:['Сообщаете о наличии? Используйте there is/are.','В обычном утверждении: some water / some books.','В вопросе и после not: any water / any books.','С no не ставьте not: There is no milk.'],examples:['There is a lamp on the table.','Are there any students in the room?','There aren’t any chairs here.','There is no time. — Нет времени.'],tip:'В просьбе и предложении some возможно: <b>Would you like some tea?</b>',trap:'Ловушка: *There have a book* неверно. Наличие: <b>There is a book.</b> Владение: <b>I have a book.</b>',mini:{q:'Как сказать «В комнате нет стульев»?',opts:['There aren’t any chairs in the room.','There isn’t chairs in the room.','There are no chair in the room.'],ans:'There aren’t any chairs in the room.',why:'Chairs — множественное число, поэтому are; в отрицании подходит any.'}},
{id:'behave',group:'Основа',lv:'A1',title:'to be, have и do: три служебные опоры',goal:'Не смешивать «быть», «иметь» и помощник для вопросов.',easy:'<b>Be</b> говорит о состоянии, профессии, месте: I am tired. <b>Have</b> говорит о владении или опыте: I have a car. <b>Do/does</b> — помощник для вопросов и отрицаний с обычными глаголами: Do you work?',formula:'I am / he is / we are · I have / she has · Do/Does + subject + V?',steps:['Если после подлежащего прилагательное, профессия или место — часто нужен be.','Если речь о том, что у кого-то есть, — have/has.','Если главный глагол обычный, делайте вопрос и отрицание через do/does.','После does основной глагол всегда начальной формы.'],examples:['She is a doctor.','He has a new phone.','Does she speak French?','He doesn’t speak French.'],tip:'Вопрос с be не требует do: <b>Is she ready?</b>, а не *Does she be ready?*',trap:'Ловушка: *He doesn’t has* неверно. После doesn’t: <b>He doesn’t have.</b>',mini:{q:'Выберите верный вопрос.',opts:['Does he is at home?','Is he at home?','He is at home?'],ans:'Is he at home?',why:'At home — состояние/место, поэтому вопрос строится с is.'}},
{id:'present',group:'Времена',lv:'A1–A2',title:'Present Simple и Present Continuous',goal:'Отличать привычку от действия «прямо сейчас».',easy:'Present Simple — расписание, привычка, факт: I work every day. Present Continuous — процесс сейчас или временная ситуация: I am working now. Спросите себя: «это регулярно или происходит в кадре?»',formula:'Simple: I work / she works. · Continuous: am/is/are + V-ing',steps:['Есть every day, usually, often, always? Сначала проверьте Simple.','Есть now, at the moment, look, listen? Проверьте Continuous.','Для he/she/it в Simple добавьте -s/-es/-ies.','В Continuous не забудьте форму be перед -ing.'],examples:['I usually take the bus.','Look! The bus is coming.','She works in a bank.','She is working from home this week.'],tip:'С глаголами состояния обычно не используют Continuous: know, like, want, need, understand.',trap:'Ловушка: *I am knowing* неверно в обычном значении. Скажите <b>I know.</b>',mini:{q:'Выберите: “Look! It ___.”',opts:['rains','is raining','rain'],ans:'is raining',why:'Look! показывает действие в момент речи, нужна форма is + V-ing.'}},
{id:'past',group:'Времена',lv:'A2',title:'Past Simple и Past Continuous',goal:'Показывать завершённое событие и фоновой процесс в прошлом.',easy:'Past Simple — готовый факт: I met him yesterday. Past Continuous — процесс в определённый момент прошлого: I was reading at eight. Часто короткое событие «врывается» в длинный процесс.',formula:'V2 / did + V · was/were + V-ing',steps:['Названа законченная точка прошлого: yesterday, last year, ago? Проверьте Past Simple.','Нужен процесс «в то время»? Возьмите was/were + -ing.','Если одно действие прервало другое: процесс — Continuous, короткое событие — Simple.'],examples:['I watched a film yesterday.','At nine I was watching a film.','I was watching a film when Tom called.','While I was cooking, my sister was setting the table.'],tip:'While часто вводит длительный процесс; when часто вводит короткое событие, но это не железное правило.',trap:'Ловушка: после did глагол возвращается в начальную форму: <b>Did you go?</b>, не *Did you went?*',mini:{q:'“I ___ when the phone rang.”',opts:['slept','was sleeping','sleep'],ans:'was sleeping',why:'Сон был процессом, а звонок — коротким событием.'}},
{id:'perfect',group:'Времена',lv:'A2–B1',title:'Perfect: результат и «раньше другого момента»',goal:'Понять идею Perfect, а не запоминать список маркеров.',easy:'Perfect соединяет два времени. Present Perfect смотрит из настоящего на прошлый результат или опыт. Past Perfect показывает, что одно прошлое произошло раньше другого прошлого.',formula:'Present Perfect: have/has + V3 · Past Perfect: had + V3 · Perfect Continuous: have/has been + V-ing',steps:['Есть результат «сейчас» или опыт без точной даты? Проверьте Present Perfect.','Есть два события в прошлом и нужно назвать более раннее? Past Perfect.','Нужна длительность процесса до настоящего? Perfect Continuous.','Если есть законченная дата (yesterday, in 2020), обычно Past Simple.'],examples:['I have lost my key. — Сейчас ключа нет.','I lost my key yesterday. — Указана дата.','When we arrived, the film had started.','She has been studying for two hours.'],tip:'Представьте стрелку: Perfect всегда оглядывается назад из важного момента.',trap:'Ловушка: *I have seen him yesterday* неверно. С yesterday: <b>I saw him yesterday.</b>',mini:{q:'Выберите: “When I got home, my parents ___ dinner.”',opts:['finished','had finished','have finished'],ans:'had finished',why:'Ужин завершился раньше момента “I got home”.'}},
{id:'future',group:'Времена',lv:'A2–B1',title:'Будущее: will, be going to и настоящее время',goal:'Выбирать форму по смыслу, а не просто переводить «буду».',easy:'Will — решение сейчас, прогноз, обещание. Be going to — план или видимое основание. Present Continuous — личная договорённость. Present Simple — расписание. После if/when о будущем часто используется Present Simple.',formula:'will + V · am/is/are going to + V · am/is/are + V-ing · if/when + Present Simple',steps:['Решили прямо сейчас? Используйте will.','План уже есть или есть признаки? going to.','Договорились с конкретными людьми/временем? Present Continuous.','Говорите о расписании? Present Simple.','После if/when не ставьте will в обычном будущем условии.'],examples:['I’ll answer the phone.','Look at those clouds! It’s going to rain.','I’m meeting Kate at six.','The train leaves at 7.15.','If it rains, we’ll stay at home.'],tip:'Спросите: «решение сейчас, план, договорённость или расписание?» — это почти всегда даёт ответ.',trap:'Ловушка: *If it will rain* обычно неверно. Правильно: <b>If it rains.</b>',mini:{q:'Выберите: “If she ___, we’ll start.”',opts:['will come','comes','is coming tomorrow'],ans:'comes',why:'В придаточной части условия после if обычно Present Simple.'}},
{id:'modals',group:'Конструкции',lv:'A2–B1',title:'Модальные глаголы и модальные перфекты',goal:'Передавать возможность, обязанность, совет и вывод без лишних форм.',easy:'После can, must, should, may, might основной глагол остаётся начальной формы без to. Значение создаёт сам модальный глагол: can — возможность, must — необходимость, should — совет, might — неуверенное предположение.',formula:'modal + V · mustn’t = запрещено · don’t have to = не обязательно · should have + V3 = следовало, но не сделали',steps:['Нужна способность/возможность? can/could.','Жёсткая обязанность? must; внешнее правило — have to.','Совет? should.','Запрет? mustn’t; отсутствие необходимости? don’t have to.','О прошлом сожалении? should have + V3.'],examples:['You can use my laptop.','You must wear a seat belt.','You don’t have to come early.','You mustn’t park here.','You should have called me.'],tip:'Запомните контраст: mustn’t = «нельзя», needn’t / don’t have to = «можно не делать».',trap:'Ловушка: не ставьте to после modal: <b>She can swim</b>, не *can to swim*.',mini:{q:'Что означает “You don’t have to pay now”?',opts:['Нельзя платить сейчас.','Необязательно платить сейчас.','Надо заплатить сейчас.'],ans:'Необязательно платить сейчас.',why:'Don’t have to выражает отсутствие необходимости, а не запрет.'}},
{id:'passive',group:'Конструкции',lv:'A2–B2',title:'Пассивный залог: фокус на результате',goal:'Легко преобразовывать активную фразу в пассив и не делать пассив там, где он не нужен.',easy:'В активной фразе важно, кто делает: The chef cooks the meal. В пассиве важен получатель действия: The meal is cooked. Время живёт в глаголе be, а смысловой глагол становится V3.',formula:'subject + be (в нужном времени) + V3 + by + doer',steps:['Возьмите объект активного предложения — он станет подлежащим.','Определите время исходного глагола.','Поставьте be в том же времени.','Добавьте V3. Исполнителя с by называйте только если он важен.'],examples:['They build houses. → Houses are built.','They built the bridge in 2010. → The bridge was built in 2010.','They are cleaning the room. → The room is being cleaned.','Someone has stolen my bag. → My bag has been stolen.'],tip:'Таблица-ключ: is done / was done / will be done / has been done / is being done.',trap:'Ловушка: не все V3 после be — пассив. <b>She is tired</b> описывает состояние; это не «её устали».',mini:{q:'Выберите пассив от “They will finish the work tomorrow.”',opts:['The work will finish tomorrow.','The work will be finished tomorrow.','The work is finished tomorrow.'],ans:'The work will be finished tomorrow.',why:'Future passive строится will be + V3.'}},
{id:'nonfinite',group:'Неличные формы',lv:'A2–B2',title:'Инфинитив и герундий',goal:'Выбирать to + V и V-ing по управляющему слову и смыслу.',easy:'Инфинитив часто направлен вперёд: want to go, decide to leave. Герундий похож на название действия: enjoy reading, avoid making mistakes. Выбор нередко задаёт первый глагол, поэтому учите не одно слово, а пару.',formula:'want/decide/hope + to V · enjoy/avoid/mind + V-ing · preposition + V-ing',steps:['После предлога почти всегда V-ing: interested in learning.','Проверьте первый глагол: want/plan/decide → to V; enjoy/avoid/suggest → V-ing.','После like/love возможны обе формы; смысл немного меняется.','Сравнивайте stop doing и stop to do: прекратить действие / остановиться ради действия.'],examples:['I want to learn English.','I enjoy learning English.','She is good at drawing.','He stopped smoking.','He stopped to smoke.'],tip:'Смотрите на предлог: <b>look forward to meeting</b>. Здесь to — предлог, поэтому дальше -ing.',trap:'Ловушка: *I look forward to meet you* неверно. Правильно: <b>to meeting you</b>.',mini:{q:'Выберите: “She suggested ___ by taxi.”',opts:['to go','going','go'],ans:'going',why:'После suggest в этой модели используется V-ing.'}},
{id:'participle',group:'Неличные формы',lv:'B1–B2',title:'Причастия и сокращённые конструкции',goal:'Понимать, кто выполняет действие и почему форма бывает -ing или V3.',easy:'Participle I (-ing) обычно активен: a smiling child — ребёнок улыбается. Participle II (V3) обычно пассивен или завершён: a broken window — окно разбили. Короткий причастный оборот должен относиться к подлежащему.',formula:'V-ing = активное действие · V3 = пассив / результат · Having + V3 = действие раньше главного',steps:['Спросите: предмет сам делает действие? Обычно -ing.','На предмет подействовали? Обычно V3.','Проверьте субъект: кто «идёт», «читает», «уставший»? Он должен совпадать с подлежащим главной части.','Для более раннего действия: Having finished, she left.'],examples:['The man standing by the door is my uncle.','The book written by Orwell is famous.','Tired after work, I went home.','Having finished the report, she sent it.'],tip:'Подставьте полное придаточное: the book written by Orwell = the book <b>that was written</b> by Orwell.',trap:'Ловушка: *Walking down the street, the rain started* неверно: дождь не гулял. Правильно: <b>Walking down the street, I felt the rain start.</b>',mini:{q:'Выберите: “The students ___ for the teacher were quiet.”',opts:['waited','waiting','wait'],ans:'waiting',why:'Студенты сами выполняют действие ожидания, поэтому -ing.'}},
{id:'complex',group:'Неличные формы',lv:'B1–B2',title:'Complex Object и Complex Subject',goal:'Разбирать конструкции «хочу, чтобы он сделал» и «говорят, что он сделал».',easy:'Complex Object: сначала человек/предмет, затем действие: I want <b>you to help</b>. Complex Subject: подлежащее «поднимается» в начало: He is said <b>to be</b> rich. Это компактный способ передать чужое мнение или ожидание.',formula:'want/expect + object + to V · see/hear + object + V/V-ing · subject + is said/seems/likely + to V',steps:['После want/expect/ask найдите объект и to-infinitive.','После see/hear: V — действие целиком, V-ing — процесс.','В Complex Subject сравните с that-clause: He is said to live here = They say that he lives here.'],examples:['I want you to listen.','She made me laugh.','I saw him cross the road.','I saw him crossing the road.','The film is likely to win a prize.'],tip:'Make/let обычно без to в активе: make me do; но в пассиве to возвращается: I was made <b>to do</b>.',trap:'Ловушка: *I want that you help* — не стандартная модель. Используйте <b>I want you to help.</b>',mini:{q:'Что значит “I saw him crossing the street”?',opts:['Я видел весь процесс перехода.','Я заставил его перейти улицу.','Я хочу, чтобы он перешёл.'],ans:'Я видел весь процесс перехода.',why:'V-ing после see показывает действие в процессе.'}},
{id:'conditionals',group:'Сложные темы',lv:'B1–B2',title:'Условные предложения: 0, 1, 2, 3 и смешанный тип',goal:'Выбирать условное по реальности ситуации и времени результата.',easy:'Сначала решите, о чём вы говорите: правило всегда? реальный шанс в будущем? воображаемая ситуация сейчас? невозможное прошлое? Только потом ставьте формулу. «Прошедшая» форма во 2 типе показывает не прошлое, а дистанцию от реальности.',formula:'0: if + Present, Present · 1: if + Present, will + V · 2: if + Past, would + V · 3: if + Past Perfect, would have + V3',steps:['Всегда верно? Zero conditional.','Реально возможно в будущем? First.','Маловероятно/воображаемо сейчас или в будущем? Second.','Жалеете о прошлом? Third.','Прошлая причина → нынешний результат? Mixed conditional.'],examples:['If you heat ice, it melts.','If it rains, we’ll stay home.','If I had more time, I would travel.','If I had studied, I would have passed.','If I had studied medicine, I would be a doctor now.'],tip:'Главный вопрос: «это правда, возможно, маловероятно или уже невозможно?»',trap:'Ловушка: в обычном первом типе не ставьте will после if: <b>If it rains, we’ll stay.</b>',mini:{q:'Выберите: “If I ___ more money, I would buy a car.”',opts:['have','had','had had'],ans:'had',why:'Это воображаемая ситуация в настоящем: Second Conditional.'}},
{id:'reported',group:'Сложные темы',lv:'B1–B2',title:'Косвенная речь и согласование времён',goal:'Передавать чужие слова по смыслу, а не механически заменять все формы.',easy:'Косвенная речь отвечает на вопрос «что он сказал?». Если точка отсчёта ушла в прошлое, время часто сдвигается на шаг назад. Но если факт всё ещё верен или важен сейчас, сдвиг не всегда нужен.',formula:'say (that) + clause · tell + person + (that) + clause · ask + if/wh-word + clause',steps:['Определите тип: утверждение, вопрос, приказ/просьба.','Для утверждения используйте said/told + that; после told назовите адресата.','Проверьте время, местоимения, now/today/tomorrow.','В косвенном вопросе порядок прямой: He asked where I lived, не *where did I live*.'],examples:['“I work here.” → She said (that) she worked there.','“I will call tomorrow.” → He said he would call the next day.','“Where do you live?” → She asked where I lived.','“Don’t be late.” → He told me not to be late.'],tip:'Не считайте backshift «законом без исключений»: <b>She said she lives in London</b> возможно, если она всё ещё там живёт.',trap:'Ловушка: tell требует адресата: <b>He told me</b>, но <b>He said</b> (не *said me*).',mini:{q:'Выберите: “She asked me where I ___.”',opts:['live','did I live','lived'],ans:'lived',why:'В косвенном вопросе нет обратного порядка do/did; после asked время обычно сдвигается.'}},
{id:'wish',group:'Сложные темы',lv:'B2',title:'Wish, subjunctive, should have и сожаление',goal:'Отделять желание о настоящем от сожаления о прошлом и совета о прошлом.',easy:'После wish форма показывает, когда ситуация «не такая, как хочется». Wish + Past — хочу, чтобы сейчас было иначе. Wish + Past Perfect — жалею о прошлом. Should have + V3 — следовало сделать, но не сделали.',formula:'I wish + Past · I wish + Past Perfect · should have + V3 · It is high time + Past',steps:['Хотите изменить настоящее? wish + Past.','Жалеете о завершённом прошлом? wish + Past Perfect.','Даете оценку прошлому действию? should have + V3.','Говорите «пора бы»? It is high time + Past.'],examples:['I wish I knew the answer.','I wish I had studied harder.','You should have told me.','It is high time we went home.'],tip:'Слово high time не означает прошедшее время: <b>It is high time we went</b> = уже пора идти.',trap:'Ловушка: *I wish I would know* обычно не нужно. Для состояния используйте <b>I wish I knew.</b>',mini:{q:'Как сказать «Жаль, что я не позвонил ей»?',opts:['I wish I didn’t call her.','I wish I hadn’t called her.','I wish I haven’t called her.'],ans:'I wish I hadn’t called her.',why:'Сожаление о прошлом требует wish + Past Perfect.'}},
{id:'phrasal',group:'Лексика',lv:'A2–C1',title:'Фразовые и предложные глаголы',goal:'Видеть в сочетании единый глагол и правильно ставить объект.',easy:'Phrasal verb = глагол + частица: turn on, give up. Значение часто нельзя угадать из слов по отдельности. С разделяемыми глаголами объект-местоимение ставится между частями: turn <b>it</b> on.',formula:'turn on the light / turn the light on / turn it on · look after a child (не разделяется)',steps:['Определите тип: phrasal (turn on), prepositional (look after), three-part (look forward to).','Если разделяемый и объект — местоимение, ставьте местоимение в середину.','Если это предложный глагол, объект должен идти после предлога.','Учите сочетание целиком в короткой фразе.'],examples:['Please turn the radio on.','Please turn it on.','She looks after her brother.','I look forward to meeting you.','They put off the meeting.'],tip:'Не учите *look* отдельно; учите: look for = искать, look after = заботиться, look up = искать в словаре.',trap:'Ловушка: *turn on it* и *look my sister after* неверны.',mini:{q:'Выберите верный вариант.',opts:['Turn on it, please.','Turn it on, please.','Look it after, please.'],ans:'Turn it on, please.',why:'В разделяемом фразовом глаголе местоимение стоит перед частицей.'}},
{id:'emphasis',group:'Сложные темы',lv:'B2–C1',title:'Инверсия и эмфатические конструкции',goal:'Распознавать книжный/формальный порядок и использовать его осознанно.',easy:'Инверсия — это необычный порядок слов ради акцента. После отрицательных или ограничительных слов в начале предложения вспомогательный глагол выходит перед подлежащим. Cleft sentence выделяет главный кусок: It was Anna who called.',formula:'Never have I seen… · Hardly had we arrived when… · It was Anna who called. · What I need is rest.',steps:['Есть Never, Seldom, Hardly, Not only в начале? Проверьте вспомогательный перед подлежащим.','Если нет готового вспомогательного, используйте do/did: Little did he know.','Хотите подчеркнуть человека/вещь? It was + focus + who/that.'],examples:['Never have I seen such a view.','Hardly had I sat down when the phone rang.','Not only was the film long, but it was boring.','It was my brother who found the key.'],tip:'Это не обязательная «красивая» грамматика для каждой фразы. Сначала научитесь обычному порядку, затем используйте инверсию для выразительности.',trap:'Ловушка: *Never I have seen* — неверно. После Never: <b>Never have I seen.</b>',mini:{q:'Выберите верный вариант.',opts:['Never I have been there.','Never have I been there.','Never did I have been there.'],ans:'Never have I been there.',why:'Present Perfect после Never требует have перед подлежащим.'}},
{id:'adjectives',group:'Лексика',lv:'A2–B1',title:'Прилагательные, наречия и сравнение',goal:'Не путать, что описывает предмет, а что — действие.',easy:'Прилагательное описывает существительное или состояние: a careful driver, she is careful. Наречие чаще описывает действие: she drives carefully. Для сравнения короткие слова получают -er/-est, длинные — more/most; есть неправильные формы good → better → best.',formula:'careful → carefully · fast → faster → fastest · beautiful → more beautiful · good → better → best',steps:['Опишите предмет/человека? Прилагательное.','Опишите как происходит действие? Обычно наречие.','Короткое прилагательное: -er/-est; длинное: more/most.','Сравниваете два? than; самый-самый? the + superlative.'],examples:['She is quiet, but she speaks quietly.','This bag is cheaper than that one.','It is the most interesting book here.','There are fewer cars and less traffic.'],tip:'Fewer — с исчисляемым (fewer books), less — с неисчисляемым (less water).',trap:'Ловушка: *more better* неверно: better уже сравнительная степень.',mini:{q:'Выберите: “He drives very ___.”',opts:['careful','carefully','more careful'],ans:'carefully',why:'Нужно описать действие drives, поэтому наречие.'}},
{id:'prepositions',group:'Лексика',lv:'A1–B1',title:'Предлоги времени, места и направления',goal:'Выбирать предлог по образу: точка, поверхность, объём или движение.',easy:'Предлоги редко переводятся один к одному. Но полезны образы: <b>at</b> — точка, <b>on</b> — поверхность/день, <b>in</b> — внутри/период. Для движения: into — внутрь, onto — на поверхность.',formula:'at 7 o’clock / at home · on Monday / on the table · in July / in the room · go into the room',steps:['Время-точка? at; день/дата? on; месяц/год/часть дня? in.','Место-точка? at; поверхность? on; внутри? in.','Движение во внутреннее пространство? into; из него? out of.'],examples:['The keys are on the table.','We meet at six on Friday in June.','She is in the room.','She walked into the room.'],tip:'Мини-цепочка: <b>at</b> 7 o’clock → <b>on</b> Monday → <b>in</b> May.',trap:'Ловушка: *in Monday* неверно; с днём недели используйте <b>on</b>.',mini:{q:'Выберите: “We have classes ___ Monday.”',opts:['at','on','in'],ans:'on',why:'С днями недели используется on.'}},
{id:'questions',group:'Общение',lv:'A1–B2',title:'Вопросы, короткие ответы и tag questions',goal:'Строить вопрос по типу глагола и слышать «хвостик».',easy:'Если в утверждении есть be или modal, вынесите его вперёд. Если главный глагол обычный, возьмите do/does/did. Tag question повторяет вспомогательный глагол и меняет полярность: It is late, isn’t it?',formula:'Are you ready? · Do they work? · Did she call? · You know him, don’t you?',steps:['Найдите глагол: be/modal или обычный?','Be/modal — вынесите вперёд.','Обычный — добавьте do/does/did, а основной глагол оставьте базовым.','Для tag: утвердительная часть → отрицательный хвост; отрицательная → утвердительный.'],examples:['Is she at home? — Yes, she is.','Does he play tennis? — No, he doesn’t.','They went home, didn’t they?','Let’s start, shall we?'],tip:'Ответьте коротко тем же помощником: Do you? — Yes, I do.',trap:'Ловушка: *Does she plays?* Неверно: после does — <b>play</b>.',mini:{q:'Выберите tag: “He rarely complains, ___?”',opts:['does he','doesn’t he','is he'],ans:'does he',why:'Rarely имеет отрицательный смысл, поэтому хвост положительный.'}},
{id:'wordbuilding',group:'Лексика',lv:'B1–C1',title:'Словообразование и разбор незнакомого слова',goal:'Догадываться о части речи и значении без постоянного перевода.',easy:'Слово часто состоит из основы, приставки и суффикса. Приставка меняет значение (un-, re-, dis-), суффикс часто показывает часть речи (-tion, -ness, -able, -ly). Это не заменяет словарь, но помогает сделать грамотную догадку.',formula:'happy → unhappy → happiness · describe → description → describable · careful → carefully',steps:['Найдите знакомую основу.','Посмотрите на приставку: un- = отрицание, re- = снова, mis- = ошибочно.','Посмотрите на суффикс: -tion/-ness часто существительное; -able прилагательное; -ly наречие.','Проверьте, подходит ли значение к предложению.'],examples:['The decision was unreasonable.','She described the problem clearly.','Misunderstanding caused the error.','Their friendship grew stronger.'],tip:'Сначала угадайте часть речи, затем общий смысл: это резко повышает точность.',trap:'Ловушка: суффикс не даёт 100% гарантии. Например, friendly заканчивается на -ly, но это прилагательное.',mini:{q:'Какая часть речи чаще образуется суффиксом -tion?',opts:['существительное','глагол','предлог'],ans:'существительное',why:'Information, decision, education — существительные.'}}
];
const INLINE={
 'Present Simple':['present','behave','sentence'], 'Present Continuous':['present','sentence'], 'Past Indefinite':['past','perfect'], 'Past Continuous':['past'], 'Present Perfect':['perfect'], 'Past Perfect':['perfect','reported'], 'Future Indefinite':['future','conditionals'], 'Future Continuous':['future'], 'Passive Voice':['passive'], 'Complex Object':['complex','nonfinite'], 'Complex Subject':['complex'], 'Gerund':['nonfinite'], 'Infinitive':['nonfinite'], 'Participle':['participle'], 'Absolute Construction':['participle'], 'Conditional':['conditionals'], 'Conditionals':['conditionals'], 'Reported Speech':['reported'], 'Sequence of Tenses':['reported'], 'Subjunctive':['wish'], 'Phrasal Verbs':['phrasal'], 'Inversion':['emphasis'], 'Articles':['articles'], 'Nouns':['noun'], 'Adjectives':['adjectives'], 'Numerals':['noun'], 'Word-Building':['wordbuilding'], 'Word Stress':['sound'], 'Vowels':['sound'], 'Inter-dental':['sound'], 'Modal Verbs':['modals'], 'there is':['pronouns'], 'to be':['behave'], 'to have':['behave'], 'Prepositions':['prepositions'], 'Tag Questions':['questions'], 'So/Neither':['questions']
};
AK.find=id=>THEORY.find(x=>x.id===id);
AK.related=l=>{const s=(l.t+' '+l.s).toLowerCase();const out=[];Object.entries(INLINE).forEach(([k,ids])=>{if(s.includes(k.toLowerCase()))ids.forEach(id=>{if(!out.includes(id))out.push(id)})});return out.length?out.slice(0,3):['sentence','present'];};
AK.styles=`
#theoryButton{margin-top:9px;width:100%;border:1px solid rgba(255,215,106,.5);border-radius:9px;padding:8px;background:rgba(0,0,0,.16);color:#ffe7a1;font:700 11px/1.2 inherit;cursor:pointer;text-align:left}#theoryButton:hover{background:rgba(255,255,255,.1)}.theory-box{margin-top:13px;border:1px solid #d4e0ee;border-radius:12px;background:linear-gradient(135deg,#f8fbff,#fffdf7);padding:14px 15px}.theory-box h4{font-size:13px;color:var(--accent);margin-bottom:7px}.theory-box p{font-size:12px;margin:6px 0}.theory-box .formula{background:#102f4b;color:#fff;padding:9px 11px;border-radius:8px;font-size:11.5px;font-weight:700;overflow:auto}.theory-box .mini-list{padding-left:18px;font-size:11.7px;margin:7px 0}.theory-box .mini-list li{margin:3px 0}.theory-go{border:0;border-radius:7px;background:var(--accent2);color:#fff;padding:7px 10px;font:700 11px inherit;cursor:pointer;margin-top:7px}.theory-go:hover{background:var(--accent)}.theory-main{animation:fadeUp .35s ease}.theory-intro{background:linear-gradient(135deg,#081b2a,#174b73);color:#eef7ff;border-radius:16px;padding:25px 24px;margin-bottom:16px;box-shadow:var(--shadow)}.theory-intro h2{font-size:25px;line-height:1.2;margin:0 0 7px}.theory-intro p{font-size:12.5px;max-width:730px;color:#c6ddea}.theory-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.theory-filter{border:1px solid #d2ddea;border-radius:999px;background:#fff;padding:6px 10px;color:var(--accent);font:700 10.5px inherit;cursor:pointer}.theory-filter.active,.theory-filter:hover{background:var(--accent);color:#fff;border-color:var(--accent)}.theory-index{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:10px 0 18px}.theory-index button{border:1px solid #d7e2ed;background:#fff;border-radius:9px;padding:9px;text-align:left;cursor:pointer;color:#1c3954;font:600 11px/1.25 inherit}.theory-index button:hover{border-color:var(--gold);box-shadow:0 3px 10px rgba(12,24,38,.1)}.theory-index small{display:block;color:#687a8c;margin-top:3px}.theory-card{background:#fff;border-radius:14px;box-shadow:var(--shadow);margin:14px 0;padding:18px 20px;border-top:4px solid var(--gold);scroll-margin-top:16px}.theory-card h3{margin:0 0 6px;color:var(--accent);font-size:18px}.theory-card .theory-meta{font-size:10.5px;color:#697b8f;margin-bottom:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}.theory-card h4{color:#274c6a;font-size:12px;margin:13px 0 5px}.theory-card p,.theory-card li{font-size:12.5px;color:#263447}.theory-card ul{padding-left:18px;margin:5px 0}.theory-card li{margin:3px 0}.theory-formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#102f4b;color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;overflow:auto}.theory-examples{display:grid;gap:6px}.theory-example{background:#f3f8ff;border-left:3px solid var(--accent2);padding:7px 10px;border-radius:0 8px 8px 0;font-size:12px;color:#243b52}.theory-tip,.theory-trap{padding:9px 11px;margin-top:8px;border-radius:8px;font-size:11.5px}.theory-tip{background:#fff7e7;border-left:3px solid #e0a020;color:#5d4a1f}.theory-trap{background:#fff0f0;border-left:3px solid #b3261e;color:#6a2723}.mini-practice{background:#f7fafc;border:1px solid #dfe8f0;border-radius:10px;padding:11px;margin-top:13px}.mini-practice p{font-weight:700;margin:0 0 8px}.mini-practice .opts{display:flex}.mini-practice .opt{font-size:11.5px}.source-note{font-size:10.5px!important;color:#66788b!important;margin-top:16px!important}.back-course{border:0;border-radius:9px;background:#fff;color:var(--accent);padding:8px 12px;font:700 11px inherit;cursor:pointer;margin-top:12px}.back-course:hover{background:#e9f1f8}@media(max-width:768px){.theory-intro{padding:20px 16px}.theory-intro h2{font-size:21px}.theory-card{padding:15px}.theory-card h3{font-size:16px}}
`;
AK.miniHTML=t=>`<div class="mini-practice"><p>${t.mini.q}</p><div class="opts">${t.mini.opts.map(o=>`<button type="button" class="opt" data-ak="${AK.esc(t.id)}" data-answer="${AK.esc(o)}">${AK.esc(o)}</button>`).join('')}</div><div class="feedback" data-ak-feed="${AK.esc(t.id)}"></div></div>`;
AK.card=t=>`<article class="theory-card" id="theory-${AK.esc(t.id)}"><div class="theory-meta">${AK.esc(t.group)} · ${AK.esc(t.lv)} · цель: ${AK.esc(t.goal)}</div><h3>${AK.esc(t.title)}</h3><h4>Простое объяснение</h4><p>${t.easy}</p><h4>Формула</h4><div class="theory-formula">${AK.esc(t.formula)}</div><h4>Алгоритм: как выбрать форму</h4><ol>${t.steps.map(x=>`<li>${x}</li>`).join('')}</ol><h4>Короткие понятные примеры</h4><div class="theory-examples">${t.examples.map(x=>`<div class="theory-example">${AK.esc(x)}</div>`).join('')}</div><div class="theory-tip"><b>Лайфхак.</b> ${AK.esc(t.tip)}</div><div class="theory-trap"><b>Частая ошибка.</b> ${t.trap}</div>${AK.miniHTML(t)}</article>`;
function openReference(id){AK.topic=id||null;curL=null;buildNav();AK.renderReference();window.scrollTo({top:0,behavior:'smooth'});}
AK.renderReference=()=>{const groups=['all',...new Set(THEORY.map(t=>t.group))];const visible=THEORY.filter(t=>AK.filter==='all'||t.group===AK.filter);const jump=visible.map(t=>`<button type="button" data-ak-jump="${t.id}"><b>${AK.esc(t.title)}</b><small>${AK.esc(t.group)} · ${AK.esc(t.lv)}</small></button>`).join('');document.getElementById('main').innerHTML=`<div class="theory-main"><section class="theory-intro"><span class="lesson-tag">Большой справочник</span><h2>Английская грамматика простым языком</h2><p>Это расширение помогает не заучивать формулы вслепую, а видеть логику: что происходит, когда происходит и зачем нужна форма. В каждой теме есть схема, алгоритм, примеры, ловушка и мини‑проверка.</p><button class="back-course" type="button" onclick="showWelcome()">← К курсам</button></section><div class="theory-toolbar">${groups.map(g=>`<button type="button" class="theory-filter ${AK.filter===g?'active':''}" data-ak-filter="${AK.esc(g)}">${g==='all'?'Все темы':AK.esc(g)}</button>`).join('')}</div><div class="theory-index">${jump}</div>${visible.map(AK.card).join('')}<p class="source-note">Теория сформулирована специально для этого файла. Для сверки правил использованы открытые материалы British Council и Cambridge Dictionary: условные, косвенная речь, пассив, неличные формы и фразовые глаголы.</p></div>`;document.querySelectorAll('[data-ak-filter]').forEach(b=>b.onclick=()=>{AK.filter=b.dataset.akFilter;AK.renderReference()});document.querySelectorAll('[data-ak-jump]').forEach(b=>b.onclick=()=>document.getElementById('theory-'+b.dataset.akJump)?.scrollIntoView({behavior:'smooth',block:'start'}));document.querySelectorAll('[data-ak]').forEach(b=>b.onclick=()=>AK.checkMini(b));if(AK.topic){setTimeout(()=>document.getElementById('theory-'+AK.topic)?.scrollIntoView({behavior:'smooth',block:'start'}),20);AK.topic=null}};
AK.checkMini=btn=>{const t=AK.find(btn.dataset.ak);const area=btn.closest('.mini-practice');area.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected','correct','wrong'));const ok=btn.dataset.answer===t.mini.ans;btn.classList.add(ok?'correct':'wrong');area.querySelectorAll('.opt').forEach(x=>{if(x.dataset.answer===t.mini.ans)x.classList.add('correct')});const f=area.querySelector('[data-ak-feed]');f.className='feedback '+(ok?'ok':'err');f.innerHTML=ok?'✓ Верно! '+AK.esc(t.mini.why):'✗ Правильный ответ: <b>'+AK.esc(t.mini.ans)+'</b>. '+AK.esc(t.mini.why)};
AK.inline=t=>`<section class="theory-box"><h4>Подробное объяснение простым языком</h4><p>${t.easy}</p><div class="formula">${AK.esc(t.formula)}</div><ul class="mini-list">${t.steps.slice(0,3).map(x=>`<li>${AK.esc(x)}</li>`).join('')}</ul><div class="example"><b>Пример:</b> ${AK.esc(t.examples[0])}</div><div class="tip"><b>Лайфхак:</b> ${AK.esc(t.tip)}</div><button type="button" class="theory-go" onclick="openReference('${AK.esc(t.id)}')">Открыть полную тему: формулы, ловушки и мини‑практика →</button></section>`;
AK.addInline=(ci,li)=>{const lesson=COURSES[ci].l[li];const ids=AK.related(lesson);const anchor=document.querySelector('.section-card');if(!anchor)return;const old=document.getElementById('ak-inline-theory');if(old)old.remove();const wrap=document.createElement('div');wrap.id='ak-inline-theory';wrap.innerHTML=ids.map(id=>AK.inline(AK.find(id))).join('');anchor.insertAdjacentElement('afterend',wrap)};
AK.install=()=>{document.head.insertAdjacentHTML('beforeend',`<style>${AK.styles}</style>`);document.querySelector('.side-head').insertAdjacentHTML('beforeend','<button type="button" id="theoryButton" onclick="openReference()">📚 Большая теория · объяснения и примеры</button>');const originalLoad=loadLesson;window.loadLesson=function(ci,li){originalLoad(ci,li);AK.addInline(ci,li)};};
AK.install();

</script>
</body>
</html>
