                        {on && <Icon name="check" size={10} />}{g.name}
                      </button>
                    );
                  })}
                </div>
              </Field>
              <Field label="Описание" className="sm:col-span-2"><textarea className="inp min-h-[60px]" value={description} onChange={e => setDescription(e.target.value)} /></Field>
            </div>
          </Modal>
        );
      }

      /* ================= АНАЛИТИКА ================= */
      function AnalyticsTab() {
        const { data } = useApp();
        const counts = { 2: 0, 3: 0, 4: 0, 5: 0 };
        const att = { present: 0, n: 0, b: 0, u: 0 };
        const allVals = [];

        data.groups.forEach(g => g.students.forEach(s => g.columns.forEach(c => {
          const cell = (g.marks[s.id] || {})[c.id];
          if (cell && cell.attendance === 'Н') att.n++;
          else if (cell && cell.attendance === 'Б') att.b++;
          else if (cell && cell.attendance === 'У') att.u++;
          else {
            att.present++;
            if (cell && cell.grade != null) { counts[cell.grade]++; const v = cellValue(cell); if (v != null) allVals.push(v); }
          }
        })));

        const totalSlots = att.present + att.n + att.b + att.u;
        const attPct = totalSlots ? Math.round((att.present / totalSlots) * 100) : 100;
        const overallAvg = allVals.length ? allVals.reduce((a, b) => a + b, 0) / allVals.length : null;
        const month = todayISO().slice(0, 7);
        const conductedMonth = data.lessons.filter(l => l.status === 'проведён' && l.date.startsWith(month)).length;
        const studentsTotal = data.groups.reduce((s, g) => s + g.students.length, 0);

        const ranked = data.groups.flatMap(g => g.students.map(s => ({
          name: s.name, group: g.name, avg: studentAverage(g, s.id), cnt: gradeCount(g, s.id),
        })));
        const top = ranked.filter(x => x.avg != null && x.cnt >= 3).sort((a, b) => (b.avg || 0) - (a.avg || 0)).slice(0, 5);

        const attention = [];
        data.groups.forEach(g => g.students.forEach(s => {
          const avg = studentAverage(g, s.id);
          const cnt = gradeCount(g, s.id);
          const m = missCount(g, s.id);
          const misses = m.n + m.b + m.u;
          const reasons = [];
          if (avg != null && cnt >= 2 && avg < 3.5) reasons.push(`СР ${fmtAvg(avg)}`);
          if (misses >= 3) reasons.push(`пропусков: ${misses}`);
          if (reasons.length) attention.push({ name: s.name, group: g.name, reason: reasons.join(', ') });
        }));

        const maxCount = Math.max(1, counts[2], counts[3], counts[4], counts[5]);
        const KPI = [
          { label: 'Групп', value: String(data.groups.length), icon: 'users' },
          { label: 'Учеников', value: String(studentsTotal), icon: 'globe' },
          { label: 'Средний балл', value: fmtAvg(overallAvg), icon: 'target', color: avgColor(overallAvg) },
          { label: 'Посещаемость', value: `${attPct}%`, icon: 'check', color: attPct >= 90 ? 'var(--color-pine)' : attPct >= 75 ? 'var(--color-ochre)' : 'var(--color-pen)' },
          { label: 'Проведено в этом месяце', value: String(conductedMonth), icon: 'calcheck' },
        ];

        if (!data.groups.length) {
          return <div className="pt-10"><div className="card border-dashed p-10 text-center text-sm text-soft">Добавьте группы и отметки, чтобы увидеть аналитику.</div></div>;
        }

        const donutSegs = [
          { value: att.present, color: 'var(--color-pine)', label: 'Присутствие' },
          { value: att.u, color: 'var(--color-sky)', label: 'У — болезнь' },
          { value: att.b, color: 'var(--color-ochre)', label: 'Б — уваж. причина' },
          { value: att.n, color: 'var(--color-pen)', label: 'Н — прогул' },
        ];

        return (
          <div className="space-y-6 pt-5">
            <SectionTitle icon="chart">Аналитика</SectionTitle>

            <div className="grid grid-cols-2 gap-3 md:grid-cols-5">
              {KPI.map((k, i) => (
                <div key={k.label} className="card rise p-3" style={{ animationDelay: `${i * 50}ms` }}>
                  <div className="mb-1 flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-soft"><Icon name={k.icon} size={12} />{k.label}</div>
                  <div className="font-display text-2xl font-black" style={k.color ? { color: k.color } : undefined}>{k.value}</div>
                </div>
              ))}
            </div>

            <div className="grid gap-5 lg:grid-cols-2">
              <div className="card rise p-4">
                <h3 className="mb-3 flex items-center gap-2 font-display text-sm font-bold"><Icon name="chart" size={15} />Успеваемость по группам</h3>
                <div className="space-y-3">
                  {data.groups.map(g => {
                    const avg = groupAverage(g);
                    return (
                      <div key={g.id}>
                        <div className="mb-1 flex items-center justify-between gap-2 text-xs">
                          <GroupChip g={g} />
                          <b className="font-display" style={{ color: avgColor(avg) }}>{fmtAvg(avg)}</b>
                        </div>
                        <div className="h-3 border border-line bg-paper2">
                          <div className="h-full transition-all" style={{ width: `${((avg || 0) / 5) * 100}%`, background: accentVar(g.color) }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="card rise flex flex-wrap items-center gap-5 p-4" style={{ animationDelay: '60ms' }}>
                <svg viewBox="0 0 120 120" className="h-40 w-40 flex-none">
                  <circle cx="60" cy="60" r="42" fill="none" stroke="var(--color-paper2)" strokeWidth="16" />
                  {(() => {
                    const C = 2 * Math.PI * 42;
                    const total = Math.max(1, totalSlots);
                    let acc = 0;
                    return donutSegs.map((s, i) => {
                      const frac = s.value / total;
                      const el = <circle key={i} cx="60" cy="60" r="42" fill="none" stroke={s.color} strokeWidth="16"
                        strokeDasharray={`${frac * C} ${C}`} strokeDashoffset={-acc * C} transform="rotate(-90 60 60)" />;
                      acc += frac;
                      return el;
                    });
                  })()}
                  <text x="60" y="57" textAnchor="middle" fontSize="17" fontWeight="800" fill="var(--color-ink)">{attPct}%</text>
                  <text x="60" y="72" textAnchor="middle" fontSize="7.5" fill="var(--color-soft)">посещаемость</text>
                </svg>
                <div className="space-y-1.5 text-xs">
                  {donutSegs.map(s => (
                    <div key={s.label} className="flex items-center gap-2">
                      <span className="h-3 w-3 flex-none" style={{ background: s.color }} />
                      <span className="text-soft">{s.label}</span>
                      <b className="ml-auto font-display">{s.value}</b>
                    </div>
                  ))}
                </div>
              </div>

              <div className="card rise p-4" style={{ animationDelay: '120ms' }}>
                <h3 className="mb-3 flex items-center gap-2 font-display text-sm font-bold"><Icon name="sparkle" size={15} />Распределение оценок</h3>
                {allVals.length === 0 ? (
                  <p className="py-6 text-center text-xs text-soft">Отметок пока нет.</p>
                ) : (
                  <div className="flex h-40 items-end gap-4 px-2">
                    {[5, 4, 3, 2].map(gr => (
                      <div key={gr} className="flex flex-1 flex-col items-center gap-1">
                        <span className="text-xs font-bold">{counts[gr]}</span>
                        <div className="w-full border border-line transition-all" style={{ height: `${Math.max(2, (counts[gr] / maxCount) * 100)}%`, background: gr === 5 ? 'var(--color-pine)' : gr === 4 ? 'var(--color-sky)' : gr === 3 ? 'var(--color-ochre)' : 'var(--color-pen)' }} />
                        <span className="font-display text-sm font-black">{gr}</span>
                      </div>
                    ))}
                  </div>
                )}
                <p className="mt-2 text-center text-[11px] text-soft">{allVals.length} {plural(allVals.length, ['отметка', 'отметки', 'отметок'])} в журналах</p>
              </div>

              <div className="space-y-5">
                <div className="card rise p-4" style={{ animationDelay: '180ms' }}>
                  <h3 className="mb-3 flex items-center gap-2 font-display text-sm font-bold"><Icon name="trophy" size={15} />Сильнейшие</h3>
                  {top.length === 0 ? <p className="py-3 text-center text-xs text-soft">Нужно минимум 3 отметки у ученика.</p> : (
                    <div className="space-y-1.5">
                      {top.map((s, i) => (
                        <div key={s.name + i} className="flex items-center gap-2 text-sm">
                          <span className={`flex h-6 w-6 flex-none items-center justify-center font-display text-xs font-black ${i < 3 ? 'bg-marker text-ink' : 'bg-paper2 text-soft'}`}>{i + 1}</span>
                          <span className="min-w-0 flex-1 truncate font-semibold">{s.name}</span>
                          <span className="hidden truncate text-[11px] text-soft sm:block">{s.group}</span>
                          <b className="font-display" style={{ color: avgColor(s.avg) }}>{fmtAvg(s.avg)}</b>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <div className="card rise p-4" style={{ animationDelay: '240ms' }}>
                  <h3 className="mb-3 flex items-center gap-2 font-display text-sm font-bold"><Icon name="alert" size={15} />Требуют внимания</h3>
                  {attention.length === 0 ? <p className="py-3 text-center text-xs text-soft">Все в порядке — поводов для беспокойства нет.</p> : (
                    <div className="space-y-1.5">
                      {attention.slice(0, 8).map((s, i) => (
                        <div key={s.name + i} className="flex items-center gap-2 border-l-2 border-pen bg-pen-soft/40 px-2 py-1.5 text-sm">
                          <span className="min-w-0 flex-1 truncate font-semibold">{s.name}</span>
                          <span className="hidden truncate text-[11px] text-soft sm:block">{s.group}</span>
                          <span className="text-[11px] font-bold text-pen">{s.reason}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      /* ================= ДАННЫЕ ================= */
      function DataTab() {
        const { data, update, toast, ask, sync } = useApp();
        const [mode, setMode] = useState('merge');
        const [text, setText] = useState('');
        const [err, setErr] = useState(null);
        const [drag, setDrag] = useState(false);
        const [csvGroup, setCsvGroup] = useState((data.groups[0] || {}).id || '');
        const fileRef = useRef(null);
        const [, tick] = useReducer(x => x + 1, 0);

        useEffect(() => { const t = setInterval(tick, 1000); return () => clearInterval(t); }, []);
        const secsToSync = Math.max(0, Math.ceil((sync.nextAt - Date.now()) / 1000));

        const handleImport = (raw) => {
          setErr(null);
          if (!raw.trim()) { setErr('Вставьте JSON или выберите файл.'); return; }
          let parsed;
          try { parsed = JSON.parse(raw); } catch { setErr('Не удалось разобрать JSON — проверьте формат копии.'); return; }
          if (!parsed || typeof parsed !== 'object') { setErr('Файл не похож на резервную копию ЛингвоЖурнала.'); return; }
          const keys = ['groups', 'lessons', 'notes', 'events', 'stickers', 'settings'];
          if (!keys.some(k => k in parsed)) { setErr('В данных нет ни одного известного раздела (groups, lessons, notes…).'); return; }
          const inc = sanitizeAppData(parsed);
          if (mode === 'replace') update(() => inc);
          else update(d => mergeData(d, inc));
          toast(mode === 'replace' ? 'Данные заменены из копии' : 'Данные объединены с копией');
          setText('');
        };
        const readFile = (f) => { f.text().then(handleImport).catch(() => setErr('Не удалось прочитать файл.')); };

        const exportJSON = () => {
          download(`lingvozhurnal-backup-${todayISO()}.json`, JSON.stringify(data, null, 2), 'application/json;charset=utf-8');
          toast('Резервная копия сохранена');
        };
        const exportCSV = () => {
          const g = data.groups.find(x => x.id === csvGroup);
          if (!g) { toast('Выберите группу', 'error'); return; }
          download(`zhurnal-${g.name.replace(/[^\wа-яё-]+/gi, '_')}.csv`, journalToCSV(g), 'text/csv;charset=utf-8');
          toast('CSV для Excel сохранён');
        };
        const exportAllICS = () => {
          const lessons = data.lessons.filter(l => l.status !== 'отменён').map(l => {
            const g = data.groups.find(x => x.id === l.groupId);
            return { date: l.date, time: l.time || undefined, title: `Урок: ${(g || {}).name || ''} — ${l.topic || 'без темы'}`, description: l.homework ? `ДЗ: ${l.homework}` : undefined };
          });
          const events = data.events.filter(e => e.status !== 'отменено').map(e => ({ date: e.date, time: e.time || undefined, title: e.title, place: e.place || undefined, description: e.description || undefined }));
          const items = [...lessons, ...events];
          if (!items.length) { toast('Календарь пуст', 'info'); return; }
          download('kalendar.ics', buildICS(items, 'ЛингвоЖурнал — полный календарь'), 'text/calendar;charset=utf-8');
          toast('Календарь .ics сохранён');
        };

        return (
          <div className="pt-5">
            <SectionTitle icon="database">Данные и синхронизация</SectionTitle>
            <div className="grid gap-5 lg:grid-cols-2">
              <div className="card rise space-y-3 p-4">
                <h3 className="flex items-center gap-2 font-display text-sm font-bold"><Icon name="download" size={15} />Экспорт</h3>
                <button className="btn w-full" onClick={exportJSON}><Icon name="download" size={14} />Резервная копия JSON</button>
                <div className="flex gap-1.5">
                  <select className="inp" value={csvGroup} onChange={e => setCsvGroup(e.target.value)} aria-label="Группа для CSV">
                    {data.groups.length === 0 && <option value="">нет групп</option>}
                    {data.groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                  </select>
                  <button className="btn flex-none" onClick={exportCSV} disabled={!data.groups.length}>CSV для Excel</button>
                </div>
                <p className="text-[11px] text-soft">CSV: разделитель «;» + BOM — файл сразу корректно открывается в русском Excel.</p>
                <button className="btn w-full" onClick={exportAllICS}><Icon name="calendar" size={14} />Весь календарь (.ics): уроки + мероприятия</button>
              </div>

              <div className="card rise p-4" style={{ animationDelay: '60ms' }}>
                <h3 className="mb-3 flex items-center gap-2 font-display text-sm font-bold"><Icon name="refresh" size={15} />Синхронизация</h3>
                <div className="flex items-center gap-3">
                  <span className="pulse-dot inline-block h-3 w-3 flex-none bg-pine" />
                  <div className="flex-1">
                    <div className="font-display text-xl font-black">{sync.count}</div>
                    <div className="text-[11px] text-soft">синхронизаций за сессию</div>
                  </div>
                  <div className="text-right">
                    <div className="font-display text-xl font-black tabular-nums">{secsToSync} с</div>
                    <div className="text-[11px] text-soft">до автосинхронизации (каждые 25 с)</div>
                  </div>
                </div>
                <div className="mt-3 space-y-1 text-[12px] text-soft">
                  <p>Последняя синхронизация: <b className="text-ink">{sync.last ? fmtAgo(sync.last) : 'ещё не было'}</b></p>
                  <p>Изменения мгновенно передаются между открытыми вкладками через BroadcastChannel и автоматически сохраняются в localStorage.</p>
                </div>
              </div>

              <div className="card rise space-y-3 p-4" style={{ animationDelay: '120ms' }}>
                <h3 className="flex items-center gap-2 font-display text-sm font-bold"><Icon name="upload" size={15} />Импорт из резервной копии</h3>
                <div
                  className={`flex cursor-pointer flex-col items-center gap-1 border-2 border-dashed p-6 text-center transition ${drag ? 'border-pine bg-pine-soft' : 'border-line hover:border-soft'}`}
                  onClick={() => fileRef.current && fileRef.current.click()}
                  onDragOver={e => { e.preventDefault(); setDrag(true); }}
                  onDragLeave={() => setDrag(false)}
                  onDrop={e => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) readFile(f); }}>
                  <Icon name="upload" size={22} className="text-soft" />
                  <span className="text-sm font-semibold">Перетащите JSON-файл сюда или нажмите</span>
                  <span className="text-[11px] text-soft">поддерживаются копии ЛингвоЖурнала</span>
                </div>
                <input ref={fileRef} type="file" accept=".json,application/json" className="hidden"
                  onChange={e => { const f = e.target.files && e.target.files[0]; if (f) readFile(f); e.target.value = ''; }} />
                <textarea className="inp min-h-[80px] font-mono text-[11px]" placeholder="…или вставьте JSON текстом" value={text} onChange={e => setText(e.target.value)} />
                <div className="flex flex-wrap items-center gap-3">
                  <label className="flex cursor-pointer items-center gap-1.5 text-[13px]">
                    <input type="radio" name="mode" checked={mode === 'merge'} onChange={() => setMode('merge')} />
                    Объединить с текущими
                  </label>
                  <label className="flex cursor-pointer items-center gap-1.5 text-[13px]">
                    <input type="radio" name="mode" checked={mode === 'replace'} onChange={() => setMode('replace')} />
                    Полностью заменить
                  </label>
                  <button className="btn btn-primary ml-auto" onClick={() => handleImport(text)}><Icon name="upload" size={14} />Импортировать</button>
                </div>
                {err && (
                  <div className="flex items-center gap-2 border border-pen bg-pen-soft px-3 py-2 text-[12px] font-semibold text-pen">
                    <Icon name="alert" size={14} />{err}
                  </div>
                )}
              </div>

              <div className="card rise space-y-4 p-4" style={{ animationDelay: '180ms' }}>
                <div>
                  <h3 className="mb-2 flex items-center gap-2 font-display text-sm font-bold"><Icon name="pencil" size={15} />Настройки</h3>
                  <Field label="Имя учителя (для приветствий и печати)">
                    <input className="inp" value={data.settings.teacherName} onChange={e => update(d => ({ ...d, settings: { ...d.settings, teacherName: e.target.value } }))} />
                  </Field>
                </div>
                <div className="border-t border-line pt-3">
                  <h3 className="mb-2 flex items-center gap-2 font-display text-sm font-bold"><Icon name="sparkle" size={15} />Демо и очистка</h3>
                  <div className="flex flex-wrap gap-2">
                    <button className="btn" onClick={() => ask({
                      title: 'Загрузить демо-данные?', message: 'Текущие данные будут полностью заменены демонстрационным набором.', confirmLabel: 'Загрузить',
                      onConfirm: () => { update(() => makeDemo()); toast('Демо-данные загружены'); },
                    })}><Icon name="refresh" size={14} />Загрузить демо</button>
                    <button className="btn btn-danger" onClick={() => ask({
                      title: 'Очистить все данные?', message: 'Группы, уроки, конспекты, мероприятия и заметки будут удалены. Настройки сохранятся.', danger: true, confirmLabel: 'Очистить',
                      onConfirm: () => { update(d => emptyData(d.settings)); toast('Данные очищены', 'info'); },
                    })}><Icon name="trash" size={14} />Очистить всё</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      /* ================= СОСТОЯНИЕ ПРИЛОЖЕНИЯ ================= */
      const AppCtx = createContext(null);
      function useApp() {
        const c = useContext(AppCtx);
        if (!c) throw new Error('AppCtx missing');
        return c;
      }
      function AppProvider({ children }) {
        const [data, setData] = useState(() => {
          const stored = readStorage();
          if (stored) return stored;
          const demo = makeDemo();
          writeStorage(demo);
          return demo;
        });
        const [tab, setTab] = useState('overview');
        const [navPayload, setNavPayload] = useState(null);
        const [toasts, setToasts] = useState([]);
        const [confirmState, setConfirmState] = useState(null);
        const [helpOpen, setHelpOpen] = useState(false);
        const [sync, setSync] = useState({ count: 0, last: null, nextAt: Date.now() + 25000 });

        const dataRef = useRef(data);
        dataRef.current = data;
        const toastRef = useRef(() => {});

        const toast = useCallback((msg, type = 'success') => {
          const id = Date.now() + Math.random();
          setToasts(t => [...t.slice(-3), { id, msg, type }]);
          setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);
        }, []);
        toastRef.current = toast;

        const update = useCallback((fn) => {
          setData(prev => {
            const next = fn(prev);
            if (!writeStorage(next)) toastRef.current('Хранилище переполнено — удалите крупные файлы', 'error');
            broadcast(next);
            return next;
          });
        }, []);

        useEffect(() => onRemote(d => {
          setData(d);
          setSync(s => ({ ...s, count: s.count + 1, last: Date.now() }));
        }), []);

        useEffect(() => {
          const t = setInterval(() => {
            const stored = readStorage();
            if (stored && JSON.stringify(stored) !== JSON.stringify(dataRef.current)) {
              setData(stored);
              setSync(s => ({ count: s.count + 1, last: Date.now(), nextAt: Date.now() + 25000 }));
            } else {
              setSync(s => ({ ...s, last: s.last || Date.now(), nextAt: Date.now() + 25000 }));
            }
          }, 25000);
          return () => clearInterval(t);
        }, []);

        useEffect(() => {
          document.documentElement.classList.toggle('dark', data.settings.theme === 'dark');
        }, [data.settings.theme]);

        const go = useCallback((t, payload) => {
          setTab(t);
          setNavPayload(payload || null);
          window.scrollTo({ top: 0 });
        }, []);
        const ask = useCallback((opts) => setConfirmState(opts), []);
        const openHelp = useCallback(() => setHelpOpen(true), []);

        return (
          <AppCtx.Provider value={{ data, tab, navPayload, sync, update, go, toast, ask, openHelp }}>
            {children}
            <ToastHost items={toasts} />
            <ConfirmHost state={confirmState} onClose={() => setConfirmState(null)} />
            {(helpOpen || !data.settings.onboardingDone) && (
              <Onboarding onClose={() => { update(d => ({ ...d, settings: { ...d.settings, onboardingDone: true } })); setHelpOpen(false); }} />
            )}
          </AppCtx.Provider>
        );
      }

      /* ================= ОБОЛОЧКА ================= */
      const TABS = [
        { id: 'overview', label: 'Обзор', icon: 'home' },
        { id: 'journal', label: 'Журнал', icon: 'book' },
        { id: 'notes', label: 'Конспекты', icon: 'notebook' },
        { id: 'groups', label: 'Группы', icon: 'users' },
        { id: 'planner', label: 'Планировщик', icon: 'calcheck' },
        { id: 'events', label: 'Мероприятия', icon: 'megaphone' },
        { id: 'analytics', label: 'Аналитика', icon: 'chart' },
        { id: 'data', label: 'Данные', icon: 'database' },
      ];
      function GlobalSearch() {
        const { data, go } = useApp();
        const [q, setQ] = useState('');
        const results = useMemo(() => {
          const t = q.trim().toLowerCase();
          if (t.length < 2) return [];
          const out = [];
          data.groups.forEach(g => g.students.forEach(s => {
            if (s.name.toLowerCase().includes(t)) out.push({ sid: s.id, name: s.name, gid: g.id, gname: g.name });
          }));
          return out.slice(0, 8);
        }, [q, data.groups]);

        return (
          <div className="relative w-full max-w-[260px]">
            <span className="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-soft"><Icon name="search" size={14} /></span>
            <input className="inp py-1.5 pl-8 text-[13px]" placeholder="Поиск ученика…" value={q}
              onChange={e => setQ(e.target.value)} onBlur={() => setTimeout(() => setQ(''), 150)} />
            {results.length > 0 && (
              <div className="pop card absolute left-0 right-0 top-full z-50 mt-1 max-h-64 overflow-auto">
                {results.map(r => (
                  <button key={r.gid + r.sid} className="flex w-full flex-col items-start border-b border-line px-3 py-2 text-left last:border-0 hover:bg-paper2"
                    onMouseDown={() => { go('journal', { groupId: r.gid, studentId: r.sid }); setQ(''); }}>
                    <span className="text-[13px] font-semibold">{r.name}</span>
                    <span className="text-[10px] text-soft">{r.gname}</span>
                  </button>
                ))}
              </div>
            )}
            {q.trim().length >= 2 && results.length === 0 && (
              <div className="pop card absolute left-0 right-0 top-full z-50 mt-1 px-3 py-2 text-[12px] text-soft">Никого не нашли</div>
            )}
          </div>
        );
      }
      function Header() {
        const { data, tab, go, update, openHelp, sync } = useApp();
        return (
          <header className="sticky top-0 z-40 border-b border-line bg-paper/90 backdrop-blur">
            <div className="mx-auto flex max-w-[1440px] items-center gap-3 px-3 pt-2.5 md:px-5">
              <button className="flex items-center gap-2.5" onClick={() => go('overview')} title="На главную">
                <span className="flex h-9 w-9 items-center justify-center bg-pine text-marker shadow-hard"><Icon name="logo" size={22} /></span>
                <span className="hidden text-left sm:block">
                  <span className="block font-display text-[17px] font-black leading-none">ЛингвоЖурнал</span>
                  <span className="text-[10px] font-semibold uppercase tracking-wider text-soft">помощник учителя языков</span>
                </span>
              </button>
              <div className="ml-auto flex items-center gap-2">
                <GlobalSearch />
                <span className="hidden items-center gap-1.5 text-[11px] font-semibold text-soft md:flex" title={`Синхронизаций за сессию: ${sync.count}`}>
                  <span className="pulse-dot inline-block h-2 w-2 bg-pine" />синхр. {sync.count}
                </span>
                <button className="icon-btn" title={data.settings.theme === 'dark' ? 'Светлая тема' : 'Тёмная тема'}
                  onClick={() => update(d => ({ ...d, settings: { ...d.settings, theme: d.settings.theme === 'dark' ? 'light' : 'dark' } }))}>
                  <Icon name={data.settings.theme === 'dark' ? 'sun' : 'moon'} size={16} />
                </button>
                <button className="icon-btn" title="Справка" onClick={openHelp}><Icon name="help" size={16} /></button>
              </div>
            </div>
            <nav className="mx-auto flex max-w-[1440px] gap-1.5 overflow-x-auto px-3 pb-2 pt-2 md:px-5">
              {TABS.map(t => {
                const active = tab === t.id;
                return (
                  <button key={t.id} onClick={() => go(t.id)}
                    className={`press flex flex-none items-center gap-1.5 border px-3 py-1.5 text-[13px] font-bold transition ${
                      active ? 'border-pine-deep bg-pine text-card shadow-hard' : 'border-line bg-card hover:-translate-y-px hover:bg-paper2'}`}>
                    <Icon name={t.icon} size={14} />{t.label}
                  </button>
                );
              })}
            </nav>
          </header>
        );
      }
      function Shell() {
        const { tab } = useApp();
        return (
          <>
            <Header />
            <main className="mx-auto w-full max-w-[1440px] px-3 pb-28 md:px-5">
              <div key={tab} className="rise">
                {tab === 'overview' && <OverviewTab />}
                {tab === 'journal' && <JournalTab />}
                {tab === 'notes' && <NotesTab />}
                {tab === 'groups' && <GroupsTab />}
                {tab === 'planner' && <PlannerTab />}
                {tab === 'events' && <EventsTab />}
                {tab === 'analytics' && <AnalyticsTab />}
                {tab === 'data' && <DataTab />}
              </div>
            </main>
            <Fabs />
          </>
        );
      }
      function App() {
        return (
          <AppProvider>
            <Shell />
          </AppProvider>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      window.__ljBoot = true;
    </script>
<section class="tm-card tm-notes"><h2>Полный конспект темы</h2><div class="tm-form"><input id="foreigner-topic" placeholder="Тема или ситуация"/><input id="foreigner-language" placeholder="Язык и уровень"/><textarea id="foreigner-context" rows="3" placeholder="Что нужно подтянуть: слова, грамматика, культура, документы…"></textarea><button id="foreigner-generate">Создать подробный конспект</button></div><textarea id="foreigner-output" rows="20" placeholder="Подробный конспект появится здесь"></textarea><div class="tm-actions"><button id="foreigner-save">Сохранить</button><button id="foreigner-word">Экспорт Word</button></div></section><script id="theme-tools-script">(()=>{const q=s=>document.querySelector(s), text=(s)=>String(s||'').trim(); const saveWord=(name,content)=>{const blob=new Blob(['\ufeff', '<html><head><meta charset="utf-8"></head><body><pre style="white-space:pre-wrap;font:15px Arial">'+content.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></body></html>'],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.title=document.title.replace(' · Генератор','');document.documentElement.dataset.themeNote='Добавлен подробный генератор конспекта с сохранением и экспортом в Word.';document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>q('#home-output').textContent='Сценарий «'+b.dataset.home+'»: выберите 3 главных действия, назначьте время и оставьте один запасной шаг.');document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>q('#build-output').textContent='Этап «'+b.dataset.build+'»: проверьте соответствие проекту, качество выполнения, безопасность и зафиксируйте замечания.');document.querySelectorAll('[data-mama]').forEach(b=>b.onclick=()=>q('#mama-output').textContent='Сценарий «'+b.dataset.mama+'»: подготовьте вещи заранее, выберите одно обязательное действие и один спокойный резерв.');document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>q('#cook-output').textContent='Раздел «'+b.dataset.cook+'»: запишите конкретные действия, время и нужные продукты.');const fkey='foreign-journal-note';q('#foreigner-generate').onclick=()=>{let t=text(q('#foreigner-topic').value)||'Выбранная тема',l=text(q('#foreigner-language').value)||'иностранный язык',c=text(q('#foreigner-context').value)||'лексика, грамматика и культурный контекст';q('#foreigner-output').value=`ПОДРОБНЫЙ КОНСПЕКТ\nТема: ${t}\nЯзык и уровень: ${l}\nЗапрос: ${c}\n\n1. Краткая карта темы\nОпределите ситуацию, цель общения и ожидаемый результат.\n\n2. Словарь\nКлючевые слова: контекст, пример употребления, синоним или антоним, форма множественного числа/спряжение при необходимости.\n\n3. Грамматика\nСформулируйте правило, приведите утвердительную, отрицательную и вопросительную модели.\n\n4. Практика\nСначала подстановка по образцу, затем перевод смысла, затем свободный диалог.\n\n5. Культурная заметка\nОтметьте вежливость, регистр, реалии и возможные ложные друзья переводчика.\n\n6. Самопроверка\n5 вопросов по теме, мини-текст и список ошибок для повторения.\n\n7. Следующий шаг\nПовторите материал через 1 день, 3 дня и неделю.`;localStorage.setItem(fkey,q('#foreigner-output').value)};q('#foreigner-save').onclick=()=>localStorage.setItem(fkey,q('#foreigner-output').value);q('#foreigner-word').onclick=()=>saveWord('foreign-journal-konspekt',q('#foreigner-output').value);})();</script>
