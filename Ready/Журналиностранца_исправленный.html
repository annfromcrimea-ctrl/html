    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useMemo, useRef, useReducer, useCallback, createContext, useContext } = React;

      /* ================= КОНСТАНТЫ ================= */
      const CEFR_LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
      const GROUP_COLORS = ['pine', 'ochre', 'sky', 'pen', 'plum', 'marker'];
      const LESSON_STATUSES = ['план', 'проведён', 'отменён'];
      const EVENT_STATUSES = ['запланировано', 'проведено', 'отменено'];
      const STICKY_COLORS = ['marker', 'pen', 'sky', 'pine', 'plum'];
      const EVENT_TYPES = [
        { id: 'олимпиада', label: 'Олимпиада', color: 'plum', icon: 'trophy' },
        { id: 'конкурс', label: 'Конкурс', color: 'marker', icon: 'sparkle' },
        { id: 'экскурсия', label: 'Экскурсия', color: 'sky', icon: 'bus' },
        { id: 'праздник', label: 'Праздник', color: 'pen', icon: 'gift' },

      ];
      const MONTHS_RU_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
      const MONTHS_RU_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
      const WEEKDAYS_RU = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
      const WEEKDAYS_RU_SHORT = ['вс','пн','вт','ср','чт','пт','сб'];

      /* ================= УТИЛИТЫ ================= */
      const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      function toISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
      function parseISO(iso) { const p = iso.split('-').map(Number); return new Date(p[0] || 2026, (p[1] || 1) - 1, p[2] || 1); }
      const todayISO = () => toISO(new Date());
      function addDaysISO(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
      const shiftISO = (n) => addDaysISO(todayISO(), n);
      function weekMonday(iso) { const d = parseISO(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); }
      const fmtDateFull = (iso) => { const d = parseISO(iso); return `${d.getDate()} ${MONTHS_RU_GEN[d.getMonth()]} ${d.getFullYear()}`; };
      const fmtDayMonth = (iso) => { const d = parseISO(iso); return `${d.getDate()} ${MONTHS_RU_GEN[d.getMonth()]}`; };
      const fmtShort = (iso) => { const d = parseISO(iso); return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}`; };
      const fmtCol = (iso) => `${fmtShort(iso)} · ${WEEKDAYS_RU_SHORT[parseISO(iso).getDay()]}`;
      function relDay(iso) {
        const t = todayISO();
        if (iso === t) return 'Сегодня';
        if (iso === addDaysISO(t, 1)) return 'Завтра';
        if (iso === addDaysISO(t, -1)) return 'Вчера';
        return null;
      }
      function greeting() {
        const h = new Date().getHours();
        if (h >= 5 && h < 12) return 'Доброе утро';
        if (h < 18) return 'Добрый день';
        return 'Добрый вечер';
      }
      function plural(n, forms) {
        const a = n % 10, b = n % 100;
        if (a === 1 && b !== 11) return forms[0];
        if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return forms[1];
        return forms[2];
      }
      function fmtAvg(v) {
        if (v == null) return '—';
        return v.toFixed(2).replace(/0+$/, '').replace(/\.$/, '').replace('.', ',');
      }
      function fmtSize(b) {
        if (b < 1024) return `${b} Б`;
        if (b < 1048576) return `${Math.round(b / 1024)} КБ`;
        return `${(b / 1048576).toFixed(1).replace('.', ',')} МБ`;
      }
      function fmtAgo(ts) {
        const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (s < 5) return 'только что';
        if (s < 60) return `${s} с назад`;
        if (s < 3600) return `${Math.floor(s / 60)} мин назад`;
        return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      }

      function cellValue(c) { if (!c || c.grade == null) return null; return c.grade + (c.bonus ? 0.1 : 0); }
      function cellStr(c) {
        if (!c) return '';
        if (c.attendance) return c.attendance;
        if (c.grade == null) return '';
        return `${c.grade}${c.bonus ? '+' : ''}`;
      }
      function studentAverage(g, sid) {
        const v = [];
        g.columns.forEach(c => { const x = cellValue((g.marks[sid] || {})[c.id]); if (x != null) v.push(x); });
        return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
      }
      function columnAverage(g, cid) {
        const v = [];
        g.students.forEach(s => { const x = cellValue((g.marks[s.id] || {})[cid]); if (x != null) v.push(x); });
        return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
      }
      function groupAverage(g) {
        const v = [];
        g.students.forEach(s => g.columns.forEach(c => { const x = cellValue((g.marks[s.id] || {})[c.id]); if (x != null) v.push(x); }));
        return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
      }
      function gradeCount(g, sid) { let n = 0; g.columns.forEach(c => { if (((g.marks[sid] || {})[c.id] || {}).grade != null) n++; }); return n; }
      function missCount(g, sid) {
        const r = { n: 0, b: 0, u: 0 };
        g.columns.forEach(c => {
          const a = ((g.marks[sid] || {})[c.id] || {}).attendance;
          if (a === 'Н') r.n++; else if (a === 'Б') r.b++; else if (a === 'У') r.u++;

        return r;

      function avgColor(v) {
        if (v == null) return 'var(--color-soft)';

        return 'var(--color-pen)';
      }
      const gradeColorVar = (g) => g === 5 ? 'var(--color-pine)' : g === 4 ? 'var(--color-sky)' : g === 3 ? 'var(--color-ochre)' : 'var(--color-pen)';
      const ATT_COLOR = { 'Н': 'var(--color-pen)', 'Б': 'var(--color-ochre)', 'У': 'var(--color-sky)' };

      const accentVar = (c) => `var(--color-${c})`;
      const accentText = (c) => `var(--color-${c}-ink, var(--color-${c}))`;
      const chipStyle = (c) => ({
        background: `color-mix(in srgb, ${accentVar(c)} 14%, var(--color-card))`,
        borderColor: `color-mix(in srgb, ${accentVar(c)} 50%, transparent)`,

      const stickyStyle = (c) => ({

      async function copyText(text) {
        try { await navigator.clipboard.writeText(text); return true; }
        catch {
          try {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            const ok = document.execCommand('copy');
            ta.remove(); return ok;
          } catch { return false; }
        }
      }
      function download(name, content, mime = 'text/plain;charset=utf-8') {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }

      function buildICS(items, calName) {
        const esc = (s) => s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
        const n = new Date();
        const stamp = `${toISO(n).replace(/-/g, '')}T${String(n.getHours()).padStart(2, '0')}${String(n.getMinutes()).padStart(2, '0')}00`;
        const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ЛингвоЖурнал//RU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', `X-WR-CALNAME:${esc(calName)}`];
        items.forEach(it => {
          const dt = it.date.replace(/-/g, '');
          lines.push('BEGIN:VEVENT', `UID:${uid()}@lingvozhurnal`, `DTSTAMP:${stamp}`);
          if (it.time) lines.push(`DTSTART:${dt}T${it.time.replace(':', '')}00`);
          else lines.push(`DTSTART;VALUE=DATE:${dt}`);

      function RouletteFab() {
        const { data, toast } = useApp();
        const [open, setOpen] = useState(false);
        const [groupId, setGroupId] = useState('all');
        const [current, setCurrent] = useState(null);
        const [rolling, setRolling] = useState(false);
        const lastPick = useRef('');
        const ivRef = useRef(null);

        const pool = data.groups
          .filter(g => groupId === 'all' || g.id === groupId)
          .flatMap(g => g.students.map(s => ({ id: s.id, name: s.name, group: g.name })));

        useEffect(() => () => { if (ivRef.current) clearInterval(ivRef.current); }, []);

        const roll = () => {
          if (rolling) return;
          if (!pool.length) { toast('Ученики не найдены — добавьте группы', 'error'); return; }
          setRolling(true);
          let i = 0;
          ivRef.current = setInterval(() => {
            setCurrent(pool[Math.floor(Math.random() * pool.length)]);
            i++;
            if (i > 14) {
              if (ivRef.current) clearInterval(ivRef.current);
              let pick = pool[Math.floor(Math.random() * pool.length)];
              if (pool.length > 1) {
                let guard = 0;
                while (pick.id === lastPick.current && guard++ < 30) pick = pool[Math.floor(Math.random() * pool.length)];
              }
              lastPick.current = pick.id;
              setCurrent(pick);
              setRolling(false);
            }
          }, 75);

      function TimerFab() {
        const { toast } = useApp();
        const [open, setOpen] = useState(false);
        const [total, setTotal] = useState(300);
        const [left, setLeft] = useState(0);
        const [running, setRunning] = useState(false);
        const [custom, setCustom] = useState('5');
        const endRef = useRef(0);

        useEffect(() => {
          if (!running) return;
          const t = setInterval(() => {
            const l = Math.max(0, Math.ceil((endRef.current - Date.now()) / 1000));
            setLeft(l);
            if (l <= 0) { setRunning(false); toast('Таймер активности завершён!', 'info'); }
          }, 200);
          return () => clearInterval(t);
        }, [running, toast]);

        const start = (sec) => {
          if (sec <= 0) return;
          setTotal(sec); setLeft(sec);
          endRef.current = Date.now() + sec * 1000;
          setRunning(true);
        };
        const pause = () => setRunning(false);
        const resume = () => { if (left > 0) { endRef.current = Date.now() + left * 1000; setRunning(true); } };
        const addMin = () => {
          setTotal(t => t + 60);
          if (running) endRef.current += 60000;
          else setLeft(l => l + 60);
        };
        const reset = () => { setRunning(false); setLeft(0); };

        const R = 52, C = 2 * Math.PI * R;
        const frac = total > 0 ? left / total : 0;
        const mm = String(Math.floor(left / 60)).padStart(2, '0');
        const ss = String(left % 60).padStart(2, '0');

        return (
          <div className="relative">
            {open && (
              <div className="pop card absolute bottom-14 right-0 w-72 p-4">
                <div className="mb-2 flex items-center gap-2 font-display text-sm font-bold"><Icon name="timer" size={16} />Таймер активности</div>
                {!running && left === 0 && (
                  <>
                    <div className="mb-2 flex flex-wrap gap-1.5">
                      {[1, 2, 5, 10, 15].map(m => (
                        <button key={m} className="btn btn-sm" onClick={() => start(m * 60)}>{m} мин</button>
                      ))}
                    </div>
                    <div className="flex gap-1.5">
                      <input className="inp" type="number" min={1} max={120} value={custom} onChange={e => setCustom(e.target.value)} aria-label="Минуты" />
                      <button className="btn btn-primary" onClick={() => start(Math.max(1, Math.min(120, parseInt(custom, 10) || 0)) * 60)}>
                        <Icon name="play" size={14} />Старт
                      </button>
                    </div>
                  </>
                )}
                {(running || left > 0) && (
                  <div className="flex flex-col items-center gap-3">
                    <div className="relative h-32 w-32">
                      <svg viewBox="0 0 120 120" className="h-32 w-32">
                        <circle cx="60" cy="60" r={R} fill="none" stroke="var(--color-paper2)" strokeWidth="10" />
                        <circle cx="60" cy="60" r={R} fill="none" stroke="var(--color-pine)" strokeWidth="10" strokeLinecap="butt"
                          strokeDasharray={`${frac * C} ${C}`} transform="rotate(-90 60 60)" />
                      </svg>
                      <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <span className="font-display text-2xl font-black tabular-nums">{mm}:{ss}</span>
                        {left === 0 && <span className="text-[10px] font-bold uppercase text-pen">Готово!</span>}
                      </div>
                    </div>
                    <div className="flex w-full gap-1.5">
                      {running
                        ? <button className="btn flex-1" onClick={pause}><Icon name="pause" size={14} />Пауза</button>
                        : <button className="btn flex-1" onClick={resume} disabled={left === 0}><Icon name="play" size={14} />Дальше</button>}
                      <button className="btn btn-sm flex-1" onClick={addMin}>+1 мин</button>
                      <button className="icon-btn" onClick={reset} title="Сбросить"><Icon name="x" size={14} /></button>
                    </div>
                  </div>
                )}
              </div>
            )}
            <button className="btn press h-12 w-12 p-0 shadow-hard" title="Таймер активности" onClick={() => setOpen(!open)}>
              <Icon name="timer" size={22} />
            </button>
          </div>
        );
      }
      function Fabs() {
        return (
          <div className="fixed bottom-5 right-4 z-40 flex flex-col items-end gap-3">
            <RouletteFab />
            <TimerFab />
          </div>
        );
      }

      /* ================= ОБЗОР ================= */
      function OverviewTab() {
        const { data, update, go, toast } = useApp();
        const today = todayISO();
        const tomorrow = addDaysISO(today, 1);
        const [stText, setStText] = useState('');
        const [stColor, setStColor] = useState('marker');

        const todays = data.lessons.filter(l => l.date === today).sort((a, b) => a.time.localeCompare(b.time));
        const hw = [];
        data.lessons.filter(l => l.date === tomorrow && l.homework.trim()).forEach(l => {
          const g = data.groups.find(x => x.id === l.groupId);
          if (g) hw.push({ key: 'l' + l.id, gname: g.name, color: g.color, text: l.homework });
        });
        data.groups.forEach(g => g.columns.filter(c => c.date === tomorrow && c.homework.trim()).forEach(c => {
          hw.push({ key: 'c' + c.id, gname: g.name, color: g.color, text: c.homework });
        }));
        const upcoming = data.events.filter(e => e.date >= today && e.status !== 'отменено').sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4);
        const latestNotes = [...data.notes].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 3);
        const studentsTotal = data.groups.reduce((s, g) => s + g.students.length, 0);
        const d = parseISO(today);

        const conduct = (id) => {
          update(dd => ({ ...dd, lessons: dd.lessons.map(l => (l.id === id ? { ...l, status: 'проведён' } : l)) }));
          toast('Урок отмечен проведённым');
        };
        const addSticker = () => {
          const t = stText.trim();
          if (!t) return;
          update(dd => ({ ...dd, stickers: [...dd.stickers, { id: uid(), text: t, color: stColor, createdAt: Date.now() }] }));
          setStText('');
        };
        const delSticker = (id) => update(dd => ({ ...dd, stickers: dd.stickers.filter(s => s.id !== id) }));

        return (
          <div className="space-y-6 pt-5">
            <div className="rise">
              <h1 className="font-display text-2xl font-black leading-tight md:text-4xl">
                {greeting()}, {data.settings.teacherName.split(' ')[0]}!
              </h1>
              <p className="mt-1 text-sm text-soft">
                сегодня {WEEKDAYS_RU[d.getDay()]}, {fmtDayMonth(today)} · {data.groups.length} групп · {studentsTotal} учеников
              </p>
            </div>

            <div className="grid gap-6 lg:grid-cols-2">
              <section className="rise" style={{ animationDelay: '60ms' }}>
                <SectionTitle icon="clock">Расписание на сегодня</SectionTitle>
                {todays.length === 0 ? (
                  <EmptyState icon="calendar" title="Сегодня уроков нет" hint="Запланируйте урок в «Планировщике» — он появится здесь." />
                ) : (
                  <div className="space-y-2">
                    {todays.map(l => {
                      const g = data.groups.find(x => x.id === l.groupId);
                      return (
                        <div key={l.id} className="card lift flex flex-wrap items-center gap-3 p-3">
                          <span className="font-display text-lg font-black tabular-nums">{l.time || '—'}</span>
                          {g && <GroupChip g={g} />}
                          <span className="min-w-0 flex-1 truncate text-sm font-semibold">{l.topic || 'Без темы'}</span>
                          {l.status === 'план' && (
                            <button className="btn btn-primary btn-sm" onClick={() => conduct(l.id)}><Icon name="check" size={13} />Провести</button>
                          )}
                          {l.status === 'проведён' && <span className="tag bg-pine-soft text-pine-deep">проведён</span>}
                          {l.status === 'отменён' && <span className="tag bg-pen-soft text-pen">отменён</span>}
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>

              <section className="rise" style={{ animationDelay: '120ms' }}>
                <SectionTitle icon="notebook">Домашнее задание на завтра</SectionTitle>
                {hw.length === 0 ? (
                  <EmptyState icon="note" title="На завтра ДЗ не задано" hint="Добавьте домашнее задание в планировщике или в колонке журнала." />
                ) : (
                  <div className="space-y-2">
                    {hw.map(h => (
                      <div key={h.key} className="card lift p-3">
                        <span className="chip mb-1" style={{ background: `color-mix(in srgb, ${accentVar(h.color)} 14%, var(--color-card))`, borderColor: `color-mix(in srgb, ${accentVar(h.color)} 50%, transparent)`, color: accentText(h.color) }}>{h.gname}</span>
                        <div className="text-sm">{h.text}</div>
                      </div>
                    ))}
                  </div>
                )}
              </section>

              <section className="rise" style={{ animationDelay: '180ms' }}>
                <SectionTitle icon="note">Доска заметок</SectionTitle>
                <div className="card p-3">
                  <div className="mb-3 flex gap-1.5">
                    <input className="inp" placeholder="Новая заметка — Enter" value={stText}
                      onChange={e => setStText(e.target.value)}
                      onKeyDown={e => { if (e.key === 'Enter') addSticker(); }} />
                    <div className="flex flex-none items-center gap-1">
                      {STICKY_COLORS.map(c => (
                        <button key={c} aria-label={c} onClick={() => setStColor(c)}
                          className={`h-6 w-6 border-2 ${stColor === c ? 'border-ink' : 'border-transparent'}`}
                          style={{ background: accentVar(c) }} />
                      ))}
                    </div>
                    <button className="icon-btn" onClick={addSticker} title="Добавить"><Icon name="plus" size={16} /></button>
                  </div>
                  {data.stickers.length === 0 ? (
                    <p className="py-4 text-center text-[13px] text-soft">Пока пусто. Запишите, что нельзя забыть.</p>
                  ) : (
                    <div className="grid grid-cols-2 gap-2 md:grid-cols-3">
                      {data.stickers.map((s, i) => (
                        <div key={s.id} className="rise group relative border p-2.5 pr-6 text-[13px] leading-snug"
                          style={{ ...stickyStyle(s.color), transform: `rotate(${((i % 3) - 1) * 1.1}deg)` }}>
                          {s.text}
                          <button className="absolute right-1 top-1 hidden text-ink/60 hover:text-pen group-hover:block" onClick={() => delSticker(s.id)} aria-label="Удалить">
                            <Icon name="x" size={12} />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </section>

              <div className="space-y-6">
                <section className="rise" style={{ animationDelay: '240ms' }}>
                  <SectionTitle icon="flag" right={<button className="btn btn-sm" onClick={() => go('events')}>Все<Icon name="chevR" size={12} /></button>}>
                    Ближайшие мероприятия
                  </SectionTitle>
                  {upcoming.length === 0 ? (
                    <EmptyState icon="flag" title="Мероприятий не запланировано" />
                  ) : (
                    <div className="space-y-2">
                      {upcoming.map(e => {
                        const meta = EVENT_TYPES.find(t => t.id === e.type) || EVENT_TYPES[5];
                        return (
                          <div key={e.id} className="card lift flex items-center gap-3 p-3">
                            <div className="flex h-10 w-10 flex-none flex-col items-center justify-center border border-line bg-paper2">
                              <span className="font-display text-sm font-black leading-none">{parseISO(e.date).getDate()}</span>
                              <span className="text-[9px] uppercase text-soft">{fmtDayMonth(e.date).split(' ')[1]}</span>
                            </div>
                            <div className="min-w-0 flex-1">
                              <div className="truncate text-sm font-bold">{e.title}</div>
                              <div className="text-[11px] text-soft">{e.place || 'место уточняется'}{e.time ? ` · ${e.time}` : ''}</div>
                            </div>
                            <span className="chip flex-none" style={{ background: `color-mix(in srgb, ${accentVar(meta.color)} 16%, var(--color-card))`, borderColor: `color-mix(in srgb, ${accentVar(meta.color)} 45%, transparent)`, color: accentText(meta.color) }}>
                              <Icon name={meta.icon} size={11} />{meta.label}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </section>

                <section className="rise" style={{ animationDelay: '300ms' }}>
                  <SectionTitle icon="notebook" right={<button className="btn btn-sm" onClick={() => go('notes')}>Все<Icon name="chevR" size={12} /></button>}>
                    Последние конспекты
                  </SectionTitle>
                  {latestNotes.length === 0 ? (
                    <EmptyState icon="notebook" title="Конспектов пока нет" />
                  ) : (
                    <div className="space-y-2">
                      {latestNotes.map(n => (
                        <button key={n.id} className="card lift flex w-full items-center gap-3 p-3 text-left" onClick={() => go('notes', { noteId: n.id })}>
                          <span className="flex h-8 w-8 flex-none items-center justify-center bg-marker-soft text-marker-ink"><Icon name="notebook" size={15} /></span>
                          <span className="min-w-0 flex-1">
                            <span className="block truncate text-sm font-bold">{n.title || 'Без темы'}</span>
                            <span className="text-[11px] text-soft">{fmtDayMonth(n.date)} · изменён {fmtAgo(n.updatedAt)}</span>
                          </span>
                          {n.rating != null && <span className="tag bg-marker-soft font-display text-marker-ink">{n.rating}</span>}
                        </button>
                      ))}
                    </div>
                  )}
                </section>
              </div>
            </div>
          </div>
        );
      }

      /* ================= ЖУРНАЛ ================= */
      function JournalTab() {
        const { data, update, ask, navPayload, go } = useApp();
        const [groupId, setGroupId] = useState((data.groups[0] || {}).id || '');
        const [pop, setPop] = useState(null);
        const [flashSid, setFlashSid] = useState(null);

        const group = data.groups.find(g => g.id === groupId) || data.groups[0];

        useEffect(() => {
          if (navPayload && navPayload.groupId) {
            setGroupId(navPayload.groupId);
            if (navPayload.studentId) {
              setFlashSid(navPayload.studentId);
              const sid = navPayload.studentId;
              setTimeout(() => { const el = document.getElementById('jrow-' + sid); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);
              setTimeout(() => setFlashSid(null), 3200);
            }
          }
        }, [navPayload]);

        useEffect(() => {
          if (!pop) return;
          const h = (e) => { if (!e.target.closest('[data-pop]')) setPop(null); };
          const k = (e) => { if (e.key === 'Escape') setPop(null); };
          document.addEventListener('mousedown', h);
          window.addEventListener('keydown', k);
          return () => { document.removeEventListener('mousedown', h); window.removeEventListener('keydown', k); };
        }, [pop]);

        if (!group) {
          return (
            <div className="pt-10">
              <EmptyState icon="book" title="Журнал пуст" hint="Создайте первую группу, чтобы начать вести журнал отметок.">
                <button className="btn btn-primary mt-2" onClick={() => go('groups')}><Icon name="plus" size={14} />Создать группу</button>
              </EmptyState>
            </div>
          );
        }

        const gid = group.id;
        const setCell = (sid, cid, patch) => {
          update(d => ({
            ...d,
            groups: d.groups.map(g => {
              if (g.id !== gid) return g;
              const marks = { ...g.marks };
              const row = { ...(marks[sid] || {}) };
              if (patch === null) delete row[cid];
              else {
                const prev = row[cid] || { grade: null, bonus: false, attendance: null };
                const next = { ...prev, ...patch };
                if (next.grade == null && next.attendance == null) delete row[cid];
                else row[cid] = next;
              }
              if (Object.keys(row).length) marks[sid] = row; else delete marks[sid];
              return { ...g, marks };
            }),
          }));
        };
        const openPop = (e, sid, cid) => {
          const r = e.currentTarget.getBoundingClientRect();
          const w = 218;
          const x = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 8));
          let y = r.bottom + 8;
          if (y + 240 > window.innerHeight) y = Math.max(8, r.top - 248);
          setPop({ sid, cid, x, y });
        };
        const updateColumn = (cid, patch) =>
          update(d => ({ ...d, groups: d.groups.map(g => (g.id !== gid ? g : { ...g, columns: g.columns.map(c => (c.id === cid ? { ...c, ...patch } : c)) })) }));
        const addColumn = () =>
          update(d => ({ ...d, groups: d.groups.map(g => (g.id !== gid ? g : { ...g, columns: [...g.columns, { id: uid(), date: todayISO(), topic: '', homework: '' }].sort((a, b) => a.date.localeCompare(b.date)) })) }));
        const removeColumn = (cid) =>
          ask({
            title: 'Удалить дату?', message: 'Колонка и все отметки за этот день будут удалены безвозвратно.', danger: true, confirmLabel: 'Удалить',
            onConfirm: () => update(d => ({
              ...d,
              groups: d.groups.map(g => {
                if (g.id !== gid) return g;
                const marks = {};
                Object.keys(g.marks).forEach(sid => {
                  const row = { ...g.marks[sid] };
                  delete row[cid];
                  if (Object.keys(row).length) marks[sid] = row;
                });
                return { ...g, columns: g.columns.filter(c => c.id !== cid), marks };
              }),
            })),
          });

        const popCell = pop ? ((group.marks[pop.sid] || {})[pop.cid]) : undefined;
        const popStudent = pop ? group.students.find(s => s.id === pop.sid) : null;
        const popCol = pop ? group.columns.find(c => c.id === pop.cid) : null;
        const gAvg = groupAverage(group);

        return (
          <div className="pt-5">
            <div className="mb-3 flex flex-wrap items-center gap-1.5">
              {data.groups.map(g => (
                <button key={g.id} onClick={() => { setGroupId(g.id); setPop(null); }}
                  className={`chip press cursor-pointer ${g.id === group.id ? 'border-ink bg-ink text-card' : 'border-line bg-card hover:bg-paper2'}`}>
                  <span className="h-1.5 w-1.5" style={{ background: `var(--color-${g.color})` }} />{g.name}
                </button>
              ))}
              <div className="ml-auto flex gap-1.5">
                <button className="btn btn-sm" onClick={addColumn}><Icon name="plus" size={13} />Дата</button>
                <button className="btn btn-sm" onClick={() => printWith('landscape')} disabled={!group.columns.length}>
                  <Icon name="print" size={13} />Печать
                </button>
              </div>
            </div>

            <div className="mb-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-[13px] text-soft">
              <span className="font-display text-base font-bold text-ink">{group.name}</span>
              <span>{group.language} · {group.level}</span>
              <span>{group.students.length} {plural(group.students.length, ['ученик', 'ученика', 'учеников'])} · {group.columns.length} занятий</span>
              <span>СР группы: <b style={{ color: avgColor(gAvg) }}>{fmtAvg(gAvg)}</b></span>
            </div>

            {group.students.length === 0 ? (
              <EmptyState icon="users" title="В группе нет учеников" hint="Добавьте учеников на вкладке «Группы»." />
            ) : (
              <div className="card overflow-hidden">
                <div className="max-h-[68vh] overflow-auto" onScroll={() => setPop(null)}>
                  <table className="jtable w-full text-[13px]">
                    <thead>
                      <tr>
                        <th className="sticky left-0 top-0 z-30 min-w-[200px] bg-card p-2 text-left align-bottom">
                          <span className="text-[10px] font-bold uppercase tracking-wider text-soft">Ученик · явка</span>
                        </th>
                        {group.columns.map(c => (
                          <th key={c.id} className="sticky top-0 z-20 min-w-[148px] bg-card p-1.5 align-top">
                            <div className="flex items-center justify-between gap-1">
                              <span className="whitespace-nowrap text-[11px] font-bold">{fmtCol(c.date)}</span>
                              <button className="icon-btn icon-btn-sm" title="Удалить дату" onClick={() => removeColumn(c.id)}><Icon name="x" size={11} /></button>
                            </div>
                            <input className="inp mt-1 p-1 text-[11px]" placeholder="Тема урока" value={c.topic} onChange={e => updateColumn(c.id, { topic: e.target.value })} />
                            <input className="inp mt-1 p-1 text-[11px]" placeholder="ДЗ" value={c.homework} onChange={e => updateColumn(c.id, { homework: e.target.value })} />
                          </th>
                        ))}
                        <th className="sticky top-0 z-20 min-w-[64px] bg-marker-soft p-2 text-center text-[11px] font-black uppercase text-marker-ink">СР</th>
                      </tr>
                    </thead>
                    <tbody>
                      {group.students.map(s => {
                        const m = missCount(group, s.id);
                        const attended = group.columns.length - m.n - m.b - m.u;
                        const avg = studentAverage(group, s.id);
                        return (
                          <tr key={s.id} id={'jrow-' + s.id} className={flashSid === s.id ? 'flash' : ''}>
                            <td className="sticky left-0 z-10 bg-card p-2">
                              <div className="font-semibold leading-tight">{s.name}</div>
                              <div className="mt-0.5 flex gap-1.5 text-[10px] font-bold text-soft">
                                <span className="text-pine">✓ {attended}</span>
                                {m.n > 0 && <span className="text-pen">Н{m.n}</span>}
                                {m.b > 0 && <span className="text-ochre">Б{m.b}</span>}
                                {m.u > 0 && <span className="text-sky">У{m.u}</span>}
                              </div>
                            </td>
                            {group.columns.map(c => {
                              const cell = (group.marks[s.id] || {})[c.id];
                              return (
                                <td key={c.id} className="p-0.5 text-center">
                                  <button
                                    className="mx-auto flex h-9 w-12 items-center justify-center border border-transparent font-display text-[15px] font-bold transition hover:border-line hover:bg-paper2"
                                    style={cell && cell.grade != null ? { color: gradeColorVar(cell.grade) } : cell && cell.attendance ? { color: ATT_COLOR[cell.attendance] } : { color: 'var(--color-line)' }}
                                    onClick={e => openPop(e, s.id, c.id)}>
                                    {cell && cell.attendance ? cell.attendance : cell && cell.grade != null ? <>{cell.grade}{cell.bonus && <sup className="ml-px text-[9px]">+</sup>}</> : '·'}
                                  </button>
                                </td>
                              );
                            })}
                            <td className="bg-marker-soft/50 text-center font-display font-bold" style={{ color: avgColor(avg) }}>{fmtAvg(avg)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot>
                      <tr>
                        <td className="sticky left-0 z-10 bg-card p-2 font-display text-[11px] font-black uppercase text-soft">СР дня</td>
                        {group.columns.map(c => {
                          const a = columnAverage(group, c.id);
                          return <td key={c.id} className="text-center font-display font-bold" style={{ color: avgColor(a) }}>{fmtAvg(a)}</td>;
                        })}
                        <td className="bg-marker-soft text-center font-display font-black" style={{ color: avgColor(gAvg) }}>{fmtAvg(gAvg)}</td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>
            )}

            {pop && popStudent && popCol && (
              <div data-pop className="pop card fixed z-50 w-[218px] p-2.5" style={{ left: pop.x, top: pop.y }}>
                <div className="mb-2 text-[11px] font-bold text-soft">{popStudent.name} · {fmtCol(popCol.date)}</div>
                <div className="grid grid-cols-4 gap-1">
                  {[2, 3, 4, 5].map(gr => {
                    const active = popCell && popCell.grade === gr;
                    const cVar = gradeColorVar(gr);
                    return (
                      <button key={gr}
                        className="h-9 border font-display text-base font-black transition press"
                        style={active ? { background: `color-mix(in srgb, ${cVar} 22%, var(--color-card))`, borderColor: cVar, color: cVar } : { borderColor: 'var(--color-line)', color: cVar }}
                        onClick={() => setCell(pop.sid, pop.cid, { grade: gr, attendance: null })}>
                        {gr}
                      </button>
                    );
                  })}
                </div>
                <div className="mt-1.5 grid grid-cols-3 gap-1">
                  {['Н', 'Б', 'У'].map(a => {
                    const active = popCell && popCell.attendance === a;
                    const cVar = ATT_COLOR[a];
                    return (
                      <button key={a}
                        className="h-8 border text-sm font-black transition press"
                        style={active ? { background: `color-mix(in srgb, ${cVar} 22%, var(--color-card))`, borderColor: cVar, color: cVar } : { borderColor: 'var(--color-line)', color: cVar }}
                        title={a === 'Н' ? 'Неуважительная' : a === 'Б' ? 'По уважительной причине' : 'Болезнь'}
                        onClick={() => setCell(pop.sid, pop.cid, { attendance: active ? null : a, grade: null, bonus: false })}>
                        {a}
                      </button>
                    );
                  })}
                </div>
                <div className="mt-1.5 flex gap-1">
                  <button
                    className={`btn btn-sm flex-1 ${popCell && popCell.bonus ? 'border-marker bg-marker-soft text-marker-ink' : ''}`}
                    disabled={!popCell || popCell.grade == null}
                    onClick={() => setCell(pop.sid, pop.cid, { bonus: !(popCell && popCell.bonus) })}>
                    + 0,1
                  </button>
                  <button className="btn btn-sm flex-1" disabled={!popCell} onClick={() => { setCell(pop.sid, pop.cid, null); setPop(null); }}>Стереть</button>
                </div>
              </div>
            )}

            {createPortal(
              <div className="print-sheet p-2 text-[11px]">
                <h1 style={{ fontFamily: 'Unbounded, sans-serif', fontSize: 18, fontWeight: 800, marginBottom: 2 }}>Журнал · {group.name}</h1>
                <p style={{ marginBottom: 10, color: '#444' }}>{group.language}, уровень {group.level} · сформирован {fmtDateFull(todayISO())}</p>
                <table className="jprint w-full">
                  <thead>
                    <tr>
                      <th>Ученик</th>
                      {group.columns.map(c => <th key={c.id}>{fmtCol(c.date)}<br /><span style={{ fontWeight: 400 }}>{c.topic}</span>{c.homework && <><br /><span style={{ fontWeight: 400 }}>ДЗ: {c.homework}</span></>}</th>)}
                      <th>СР</th>
                    </tr>
                  </thead>
                  <tbody>
                    {group.students.map(s => (
                      <tr key={s.id}>
                        <td>{s.name}</td>
                        {group.columns.map(c => {

      /* >>>>>>>>>> ЧАСТЬ 3 — вставьте продолжение сразу после этой строки <<<<<<<<<< */
      /* ================= КОНСПЕКТЫ ================= */
      function noteCounters(n) {
        let sections = 0, words = 0, links = 0, files = 0, stickers = 0;
        n.blocks.forEach(b => {
          if (b.type === 'section') sections++;
          else if (b.type === 'vocab') words += b.items.length;
          else if (b.type === 'links') links += b.links.length;
          else if (b.type === 'files') files += b.files.length;
          else stickers++;
        });
        return { sections, words, links, files, stickers };
      }
      function NotesTab() {
        const { data, update, ask, navPayload } = useApp();
        const [editingId, setEditingId] = useState(null);
        useEffect(() => { if (navPayload && navPayload.noteId) setEditingId(navPayload.noteId); }, [navPayload]);

        const note = data.notes.find(n => n.id === editingId);
        if (note) return <NoteEditor note={note} onClose={() => setEditingId(null)} />;

        const createNote = () => {
          const id = uid();
          update(d => ({
            ...d,
            notes: [{ id, title: '', date: todayISO(), duration: 45, goals: '', equipment: '', rating: null, reflection: '', blocks: [], updatedAt: Date.now() }, ...d.notes],
          }));
          setEditingId(id);
        };
        const removeNote = (n) =>
          ask({ title: 'Удалить конспект?', message: `«${n.title || 'Без темы'}» будет удалён безвозвратно.`, danger: true, confirmLabel: 'Удалить', onConfirm: () => update(d => ({ ...d, notes: d.notes.filter(x => x.id !== n.id) })) });

        return (
          <div className="pt-5">
            <SectionTitle icon="notebook" right={<button className="btn btn-primary" onClick={createNote}><Icon name="plus" size={14} />Новый конспект</button>}>
              Конспекты уроков
            </SectionTitle>
            {data.notes.length === 0 ? (
              <EmptyState icon="notebook" title="Конспектов пока нет" hint="Создайте первый конспект: блоки, словарь, ссылки и файлы — всё внутри.">
                <button className="btn btn-primary mt-2" onClick={createNote}><Icon name="plus" size={14} />Создать</button>
              </EmptyState>
            ) : (
              <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                {[...data.notes].sort((a, b) => b.updatedAt - a.updatedAt).map((n, i) => {
                  const c = noteCounters(n);
                  const chips = [
                    c.sections && `разделы: ${c.sections}`, c.words && `слов: ${c.words}`, c.links && `ссылок: ${c.links}`,
                    c.files && `файлов: ${c.files}`, c.stickers && `стикеров: ${c.stickers}`,
                  ].filter(Boolean);
                  return (
                    <div key={n.id} className="card lift rise cursor-pointer p-4" style={{ animationDelay: `${i * 45}ms` }} onClick={() => setEditingId(n.id)}>
                      <div className="mb-1.5 flex items-center justify-between text-[11px] text-soft">
                        <span>{fmtDayMonth(n.date)} · {n.duration} мин</span>
                        {n.rating != null && <span className="tag bg-marker-soft font-display text-sm text-marker-ink">{n.rating}</span>}
                      </div>
                      <h3 className="mb-2 font-display text-[15px] font-bold leading-snug">{n.title || 'Без темы'}</h3>
                      <div className="mb-3 flex flex-wrap gap-1">
                        {chips.length ? chips.map(x => <span key={x} className="tag">{x}</span>) : <span className="tag">пустой конспект</span>}
                      </div>
                      <div className="flex items-center justify-between">
                        <span className="text-[11px] text-soft">изменён {fmtAgo(n.updatedAt)}</span>
                        <button className="icon-btn icon-btn-sm" title="Удалить" onClick={e => { e.stopPropagation(); removeNote(n); }}>
                          <Icon name="trash" size={12} />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      }

        const set = (patch) => {

        const setBlocks = (blocks) => set({ blocks });

        const move = (i, dir) => {
          const j = i + dir;

      /* ================= ГРУППЫ ================= */
      function GroupsTab() {

          update(d => ({
            ...d,
            groups: [...d.groups, {
              id: uid(), name: 'Новая группа', language: 'Английский', level: 'A1',

      function GroupCard({ g, index, onPatch, onRemove, onToast }) {
        const { ask, update } = useApp();
        const [newName, setNewName] = useState('');
        const avg = groupAverage(g);
        const totalMisses = g.students.reduce((s, st) => { const m = missCount(g, st.id); return s + m.n + m.b + m.u; }, 0);

        const addStudent = () => {
          const nm = newName.trim();
          if (!nm) return;
          onPatch(g.id, { students: [...g.students, { id: uid(), name: nm }] });
          setNewName('');
          onToast(`Ученик добавлен в «${g.name}»`);
        };
        const renameStudent = (sid, name) => onPatch(g.id, { students: g.students.map(s => (s.id === sid ? { ...s, name } : s)) });
        const removeStudent = (sid, name) =>
          ask({
            title: 'Удалить ученика?', message: `${name} будет удалён(а) из группы вместе с отметками.`, danger: true, confirmLabel: 'Удалить',
            onConfirm: () => update(d => ({
              ...d,
              groups: d.groups.map(x => {
                if (x.id !== g.id) return x;
                const marks = { ...x.marks };
                delete marks[sid];
                return { ...x, students: x.students.filter(s => s.id !== sid), marks };
              }),
            })),
          });

        return (
          <div className="card rise p-4" style={{ animationDelay: `${index * 60}ms` }}>
            <div className="mb-3 flex items-center gap-2">
              <span className="h-4 w-4 flex-none border border-ink/20" style={{ background: `var(--color-${g.color})` }} />
              <input className="inp font-display text-[15px] font-bold" value={g.name} onChange={e => onPatch(g.id, { name: e.target.value })} aria-label="Название группы" />
              <button className="icon-btn flex-none" title="Удалить группу" onClick={onRemove}><Icon name="trash" size={14} /></button>
            </div>
            <div className="mb-3 grid grid-cols-2 gap-2">
              <Field label="Язык"><input className="inp" value={g.language} onChange={e => onPatch(g.id, { language: e.target.value })} /></Field>
              <Field label="Уровень CEFR">
                <select className="inp" value={g.level} onChange={e => onPatch(g.id, { level: e.target.value })}>
                  {CEFR_LEVELS.map(l => <option key={l}>{l}</option>)}
                </select>
              </Field>
            </div>
            <div className="mb-3 flex items-center gap-1.5">
              <span className="text-[10px] font-bold uppercase tracking-wider text-soft">Цвет:</span>
              {GROUP_COLORS.map(c => (
                <button key={c} aria-label={c} onClick={() => onPatch(g.id, { color: c })}
                  className={`h-6 w-6 border-2 transition ${g.color === c ? 'scale-110 border-ink' : 'border-transparent'}`}
                  style={{ background: `var(--color-${c})` }} />
              ))}
            </div>
            <div className="mb-3 flex flex-wrap gap-1.5 text-[11px]">
              <span className="tag">{g.students.length} {plural(g.students.length, ['ученик', 'ученика', 'учеников'])}</span>
              <span className="tag">{g.columns.length} дат в журнале</span>
              <span className="tag">СР: <b style={{ color: avgColor(avg) }}>{fmtAvg(avg)}</b></span>
              <span className="tag">пропусков: {totalMisses}</span>
            </div>
            <div className="border-t border-line pt-3">
              <div className="mb-2 text-[10px] font-bold uppercase tracking-wider text-soft">Ученики</div>
              <div className="max-h-56 space-y-1 overflow-auto pr-1">
                {g.students.length === 0 && <p className="py-2 text-center text-xs text-soft">Список пуст — добавьте первого ученика ниже.</p>}
                {g.students.map(s => {
                  const a = studentAverage(g, s.id);
                  return (
                    <div key={s.id} className="flex items-center gap-1.5">
                      <input className="inp py-1.5" value={s.name} onChange={e => renameStudent(s.id, e.target.value)} />
                      <span className="w-10 flex-none text-center font-display text-[12px] font-bold" style={{ color: avgColor(a) }}>{fmtAvg(a)}</span>
                      <button className="icon-btn icon-btn-sm flex-none" title="Удалить" onClick={() => removeStudent(s.id, s.name)}><Icon name="x" size={11} /></button>
                    </div>
                  );
                })}
              </div>
              <div className="mt-2 flex gap-1.5">
                <input className="inp" placeholder="Новый ученик — нажмите Enter" value={newName}
                  onChange={e => setNewName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addStudent(); }} />
                <button className="icon-btn flex-none" onClick={addStudent} title="Добавить"><Icon name="plus" size={15} /></button>
              </div>
            </div>
          </div>
        );
      }

      /* ================= ПЛАНИРОВЩИК ================= */
      const PL_SECTIONS = [
        { key: 'overdue', title: 'Просрочено', color: 'pen', icon: 'alert' },
        { key: 'today', title: 'Сегодня', color: 'marker', icon: 'clock' },
        { key: 'tomorrow', title: 'Завтра', color: 'pine', icon: 'chevR' },
        { key: 'week', title: 'На этой неделе', color: 'sky', icon: 'calendar' },
        { key: 'later', title: 'Позже', color: 'ochre', icon: 'flag' },
        { key: 'done', title: 'Проведённые', color: 'plum', icon: 'check' },
      ];
      function PlannerTab() {
        const { data, update, ask, toast } = useApp();
        const [showForm, setShowForm] = useState(false);
        const [editingId, setEditingId] = useState(null);
        const today = todayISO();

        const buckets = { overdue: [], today: [], tomorrow: [], week: [], later: [], done: [] };
        const tomorrowD = addDaysISO(today, 1);
        const weekEnd = addDaysISO(today, 7);
        data.lessons.forEach(l => {
          if (l.status === 'проведён') buckets.done.push(l);
          else if (l.date < today) buckets.overdue.push(l);
          else if (l.date === today) buckets.today.push(l);
          else if (l.date === tomorrowD) buckets.tomorrow.push(l);
          else if (l.date <= weekEnd) buckets.week.push(l);
          else buckets.later.push(l);
        });
        Object.values(buckets).forEach(arr => arr.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)));
        buckets.done.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));

        const monday = weekMonday(today);
        const sunday = addDaysISO(monday, 6);
        const weekLessons = data.lessons.filter(l => l.date >= monday && l.date <= sunday && l.status !== 'отменён');
        const weekDone = weekLessons.filter(l => l.status === 'проведён').length;
        const pct = weekLessons.length ? Math.round((weekDone / weekLessons.length) * 100) : 0;

        const save = (l, id) => {
          if (id) update(d => ({ ...d, lessons: d.lessons.map(x => (x.id === id ? { ...x, ...l } : x)) }));
          else update(d => ({ ...d, lessons: [...d.lessons, { ...l, id: uid(), status: 'план' }] }));
          toast(id ? 'Урок обновлён' : 'Урок запланирован');
          setShowForm(false);
          setEditingId(null);
        };
        const setStatus = (id, status) => update(d => ({ ...d, lessons: d.lessons.map(l => (l.id === id ? { ...l, status } : l)) }));
        const remove = (l) => ask({
          title: 'Удалить урок?', message: `${fmtDateFull(l.date)} · ${l.topic || 'без темы'}`, danger: true, confirmLabel: 'Удалить',
          onConfirm: () => update(d => ({ ...d, lessons: d.lessons.filter(x => x.id !== l.id) })),
        });
        const exportICS = () => {
          const items = data.lessons.filter(l => l.status !== 'отменён').map(l => {
            const g = data.groups.find(x => x.id === l.groupId);
            return { date: l.date, time: l.time || undefined, title: `Урок: ${(g || {}).name || ''} — ${l.topic || 'без темы'}`, description: l.homework ? `ДЗ: ${l.homework}` : undefined };
          });
          if (!items.length) { toast('Нет уроков для экспорта', 'info'); return; }
          download('uroki.ics', buildICS(items, 'Уроки · ЛингвоЖурнал'), 'text/calendar;charset=utf-8');
          toast('Файл uroki.ics сохранён');
        };

        if (data.groups.length === 0) {
          return <div className="pt-10"><EmptyState icon="calcheck" title="Сначала создайте группу" hint="Планировщик привязывает уроки к группам." /></div>;
        }

        return (
          <div className="pt-5">
            <SectionTitle icon="calcheck" right={
              <div className="flex gap-1.5">
                <button className="btn btn-sm" onClick={exportICS}><Icon name="download" size={13} />.ics</button>
                <button className="btn btn-primary btn-sm" onClick={() => setShowForm(!showForm)}><Icon name={showForm ? 'x' : 'plus'} size={13} />{showForm ? 'Скрыть' : 'Урок'}</button>
              </div>
            }>Планировщик</SectionTitle>

            <div className="card rise mb-4 flex flex-wrap items-center gap-4 p-4">
              <div>
                <div className="text-[10px] font-bold uppercase tracking-wider text-soft">Прогресс недели</div>
                <div className="font-display text-2xl font-black">{pct}%</div>
              </div>
              <div className="min-w-[200px] flex-1">
                <div className="mb-1 flex justify-between text-[11px] text-soft">
                  <span>{weekDone} из {weekLessons.length} уроков</span><span>{fmtDayMonth(monday)} – {fmtDayMonth(sunday)}</span>
                </div>
                <div className="h-3.5 border border-line bg-paper2">
                  <div className="h-full bg-pine transition-all" style={{ width: `${pct}%` }} />
                </div>
              </div>
            </div>

            {showForm && (
              <div className="pop card mb-4 p-4">
                <LessonForm onSave={l => save(l)} onCancel={() => setShowForm(false)} />
              </div>
            )}

            <div className="space-y-6">
              {PL_SECTIONS.map(sec => {
                const items = sec.key === 'done' ? buckets.done.slice(0, 12) : buckets[sec.key];
                return (
                  <section key={sec.key}>
                    <div className="mb-2 flex items-center gap-2">
                      <span className="flex h-6 w-6 items-center justify-center" style={{ background: `color-mix(in srgb, ${accentVar(sec.color)} 20%, var(--color-card))`, color: accentText(sec.color) }}>
                        <Icon name={sec.icon} size={13} />
                      </span>
                      <h3 className="font-display text-sm font-bold">{sec.title}</h3>
                      <span className="tag">{items.length}</span>
                    </div>
                    {items.length === 0 ? (
                      <p className="pl-8 text-[12px] italic text-soft">пусто</p>
                    ) : (
                      <div className="space-y-2">
                        {items.map((l, i) => (
                          <LessonCard key={l.id} l={l} index={i} editing={editingId === l.id}
                            onEdit={() => setEditingId(editingId === l.id ? null : l.id)}
                            onSave={x => save(x, l.id)} onCancelEdit={() => setEditingId(null)}
                            onStatus={setStatus} onRemove={() => remove(l)} />
                        ))}
                      </div>
                    )}
                  </section>
                );
              })}
            </div>
          </div>
        );
      }
      function LessonCard({ l, index, editing, onEdit, onSave, onCancelEdit, onStatus, onRemove }) {
        const { data, toast } = useApp();
        const g = data.groups.find(x => x.id === l.groupId);
        const rel = relDay(l.date);

        const lessonText = () => [
          `📅 ${fmtDateFull(l.date)}${l.time ? ', ' + l.time : ''}`,
          `Группа: ${(g || {}).name || '—'}`,
          `Тема: ${l.topic || '—'}`,
          l.homework ? `ДЗ: ${l.homework}` : '',
        ].filter(Boolean).join('\n');

        const send = async (kind) => {
          const text = lessonText();
          if (kind === 'copy') { (await copyText(text)) ? toast('Скопировано в буфер обмена') : toast('Не удалось скопировать', 'error'); }
          if (kind === 'wa') window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
          if (kind === 'mail') window.open(`mailto:?subject=${encodeURIComponent('Урок ' + fmtDateFull(l.date))}&body=${encodeURIComponent(text)}`, '_self');
        };

        if (editing) {
          return <div className="card rise p-3"><LessonForm initial={l} onSave={onSave} onCancel={onCancelEdit} /></div>;
        }

        return (
          <div className={`card rise lift flex flex-wrap items-center gap-3 p-3 ${l.status === 'отменён' ? 'opacity-60' : ''}`} style={{ animationDelay: `${index * 35}ms` }}>
            <div className="w-16 flex-none text-center">
              <div className="font-display text-base font-black tabular-nums">{l.time || '—'}</div>
              <div className="text-[10px] font-bold uppercase" style={{ color: rel ? 'var(--color-pen)' : 'var(--color-soft)' }}>{rel || fmtDayMonth(l.date)}</div>
            </div>
            {g && <GroupChip g={g} />}
            <div className="min-w-[160px] flex-1">
              <div className="text-sm font-bold leading-tight">{l.topic || 'Без темы'}</div>
              {l.homework && <div className="mt-0.5 truncate text-[11px] text-soft">ДЗ: {l.homework}</div>}
              {l.status === 'отменён' && <span className="tag mt-1 bg-pen-soft text-pen">отменён</span>}
            </div>
            <div className="flex flex-none items-center gap-1">
              {l.status === 'план' && <button className="btn btn-primary btn-sm" onClick={() => { onStatus(l.id, 'проведён'); toast('Урок проведён'); }}><Icon name="check" size={12} />Провести</button>}
              {l.status === 'план' && <button className="icon-btn icon-btn-sm" title="Отменить урок" onClick={() => onStatus(l.id, 'отменён')}><Icon name="x" size={12} /></button>}
              {l.status !== 'план' && <button className="icon-btn icon-btn-sm" title="Вернуть в план" onClick={() => onStatus(l.id, 'план')}><Icon name="refresh" size={12} /></button>}
              <span className="mx-1 h-5 w-px bg-line" />
              <button className="icon-btn icon-btn-sm" title="Копировать для чата" onClick={() => send('copy')}><Icon name="copy" size={12} /></button>
              <button className="icon-btn icon-btn-sm" title="WhatsApp" onClick={() => send('wa')}><Icon name="chat" size={12} /></button>
              <button className="icon-btn icon-btn-sm" title="E-mail" onClick={() => send('mail')}><Icon name="mail" size={12} /></button>
              <span className="mx-1 h-5 w-px bg-line" />
              <button className="icon-btn icon-btn-sm" title="Редактировать" onClick={onEdit}><Icon name="pencil" size={12} /></button>
              <button className="icon-btn icon-btn-sm" title="Удалить" onClick={onRemove}><Icon name="trash" size={12} /></button>
            </div>
          </div>
        );
      }
      function LessonForm({ initial, onSave, onCancel }) {
        const { data } = useApp();
        const init = initial || {};
        const [groupId, setGroupId] = useState(init.groupId || (data.groups[0] || {}).id || '');
        const [date, setDate] = useState(init.date || todayISO());
        const [time, setTime] = useState(init.time || '10:00');
        const [topic, setTopic] = useState(init.topic || '');
        const [homework, setHw] = useState(init.homework || '');

        return (
          <div>
            <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
              <Field label="Группа">
                <select className="inp" value={groupId} onChange={e => setGroupId(e.target.value)}>
                  {data.groups.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}
                </select>
              </Field>
              <Field label="Дата"><input type="date" className="inp" value={date} onChange={e => setDate(e.target.value)} /></Field>
              <Field label="Время"><input type="time" className="inp" value={time} onChange={e => setTime(e.target.value)} /></Field>
              <Field label="Тема"><input className="inp" value={topic} onChange={e => setTopic(e.target.value)} placeholder="Тема урока" /></Field>
              <Field label="Домашнее задание"><input className="inp" value={homework} onChange={e => setHw(e.target.value)} placeholder="ДЗ" /></Field>
            </div>
            <div className="mt-3 flex justify-end gap-2">
              <button className="btn" onClick={onCancel}>Отмена</button>
              <button className="btn btn-primary" disabled={!groupId || !date} onClick={() => onSave({ groupId, date, time, topic: topic.trim(), homework: homework.trim() })}>
                <Icon name="check" size={14} />Сохранить
              </button>
            </div>
          </div>
        );
      }

      /* ================= МЕРОПРИЯТИЯ ================= */
      function EventsTab() {
        const { data, update, ask, toast } = useApp();
        const [typeFilter, setTypeFilter] = useState('all');
        const [statusFilter, setStatusFilter] = useState('all');
        const [modal, setModal] = useState({ open: false });
        const today = todayISO();

        const filtered = data.events
          .filter(e => (typeFilter === 'all' || e.type === typeFilter) && (statusFilter === 'all' || e.status === statusFilter))
          .sort((a, b) => a.date.localeCompare(b.date));

        const months = new Map();
        filtered.forEach(e => {
          const key = e.date.slice(0, 7);
          const arr = months.get(key) || [];
          arr.push(e);
          months.set(key, arr);
        });

        const saveEvent = (item) => {
          update(d => {
            const exists = d.events.some(x => x.id === item.id);
            return { ...d, events: exists ? d.events.map(x => (x.id === item.id ? item : x)) : [...d.events, item] };
          });
          toast('Мероприятие сохранено');
          setModal({ open: false });
        };
        const removeEvent = (e) => ask({
          title: 'Удалить мероприятие?', message: e.title, danger: true, confirmLabel: 'Удалить',
          onConfirm: () => update(d => ({ ...d, events: d.events.filter(x => x.id !== e.id) })),
        });
        const toggleDone = (e) =>
          update(d => ({ ...d, events: d.events.map(x => (x.id === e.id ? { ...x, status: x.status === 'проведено' ? 'запланировано' : 'проведено' } : x)) }));
        const exportICS = () => {
          if (!filtered.length) { toast('Нет мероприятий для экспорта', 'info'); return; }
          const items = filtered.map(e => ({ date: e.date, time: e.time || undefined, title: e.title, place: e.place || undefined, description: e.description || undefined }));
          download('meropriyatiya.ics', buildICS(items, 'Мероприятия · ЛингвоЖурнал'), 'text/calendar;charset=utf-8');
          toast('Файл meropriyatiya.ics сохранён');
        };
        const meta = (t) => EVENT_TYPES.find(x => x.id === t) || EVENT_TYPES[5];

        return (
          <div className="pt-5">
            <SectionTitle icon="megaphone" right={
              <div className="flex gap-1.5">
                <button className="btn btn-sm" onClick={exportICS}><Icon name="download" size={13} />В календарь</button>
                <button className="btn btn-primary btn-sm" onClick={() => setModal({ open: true })}><Icon name="plus" size={13} />Мероприятие</button>
              </div>
            }>Мероприятия</SectionTitle>

            <div className="mb-4 flex flex-wrap items-center gap-1.5">
              <button className={`chip press ${typeFilter === 'all' ? 'border-ink bg-ink text-card' : 'border-line bg-card'}`} onClick={() => setTypeFilter('all')}>Все типы</button>
              {EVENT_TYPES.map(t => (
                <button key={t.id} className="chip press" onClick={() => setTypeFilter(typeFilter === t.id ? 'all' : t.id)}
                  style={typeFilter === t.id
                    ? { background: accentVar(t.color), borderColor: accentVar(t.color), color: '#fff' }
                    : { background: `color-mix(in srgb, ${accentVar(t.color)} 14%, var(--color-card))`, borderColor: `color-mix(in srgb, ${accentVar(t.color)} 45%, transparent)`, color: accentText(t.color) }}>
                  <Icon name={t.icon} size={11} />{t.label}
                </button>
              ))}
              <select className="inp ml-auto w-auto" value={statusFilter} onChange={e => setStatusFilter(e.target.value)} aria-label="Статус">
                <option value="all">Все статусы</option>
                {EVENT_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            {filtered.length === 0 ? (
              <EmptyState icon="flag" title="Ничего не найдено" hint="Измените фильтры или добавьте новое мероприятие.">
                <button className="btn btn-primary mt-2" onClick={() => setModal({ open: true })}><Icon name="plus" size={14} />Добавить</button>
              </EmptyState>
            ) : (
              [...months.entries()].map(([key, items]) => {
                const parts = key.split('-').map(Number);
                return (
                  <div key={key} className="mb-6">
                    <h3 className="mb-3 font-display text-lg font-black">{MONTHS_RU_NOM[parts[1] - 1]} {parts[0]}</h3>
                    <div className="relative ml-2 border-l-2 border-line pl-5">
                      {items.map((e, i) => {
                        const t = meta(e.type);
                        const d = parseISO(e.date);
                        const past = e.date < today;
                        return (
                          <div key={e.id} className={`rise relative mb-3 ${past && e.status !== 'проведено' ? 'opacity-70' : ''}`} style={{ animationDelay: `${i * 40}ms` }}>
                            <span className="absolute -left-[27px] top-4 h-3 w-3 border-2 border-card" style={{ background: accentVar(t.color) }} />
                            <div className="card lift flex flex-wrap items-center gap-3 p-3">
                              <div className="flex h-12 w-12 flex-none flex-col items-center justify-center border border-line bg-paper2">
                                <span className="font-display text-lg font-black leading-none">{d.getDate()}</span>
                                <span className="text-[9px] font-bold uppercase text-soft">{WEEKDAYS_RU_SHORT[d.getDay()]}</span>
                              </div>
                              <div className="min-w-[180px] flex-1">
                                <div className="flex flex-wrap items-center gap-2">
                                  <span className="text-sm font-bold">{e.title}</span>
                                  <span className="chip" style={{ background: `color-mix(in srgb, ${accentVar(t.color)} 16%, var(--color-card))`, borderColor: `color-mix(in srgb, ${accentVar(t.color)} 45%, transparent)`, color: accentText(t.color) }}>
                                    <Icon name={t.icon} size={10} />{t.label}
                                  </span>
                                  {e.status === 'проведено' && <span className="tag bg-pine-soft text-pine-deep">проведено</span>}
                                  {e.status === 'отменено' && <span className="tag bg-pen-soft text-pen">отменено</span>}
                                </div>
                                <div className="mt-1 flex flex-wrap items-center gap-2 text-[11px] text-soft">
                                  <span>{fmtDateFull(e.date)}{e.time ? ` · ${e.time}` : ''}</span>
                                  {e.place && <span>· {e.place}</span>}
                                </div>
                                {e.groupIds.length > 0 && (
                                  <div className="mt-1.5 flex flex-wrap gap-1">
                                    {e.groupIds.map(gid => { const g = data.groups.find(x => x.id === gid); return g ? <GroupChip key={gid} g={g} /> : null; })}
                                  </div>
                                )}
                              </div>
                              <div className="flex flex-none gap-1">
                                <button className="icon-btn icon-btn-sm" title={e.status === 'проведено' ? 'Вернуть в план' : 'Отметить проведённым'} onClick={() => toggleDone(e)}>
                                  <Icon name={e.status === 'проведено' ? 'refresh' : 'check'} size={12} />
                                </button>
                                <button className="icon-btn icon-btn-sm" title="Редактировать" onClick={() => setModal({ open: true, item: e })}><Icon name="pencil" size={12} /></button>
                                <button className="icon-btn icon-btn-sm" title="Удалить" onClick={() => removeEvent(e)}><Icon name="trash" size={12} /></button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })
            )}

            {modal.open && <EventModal initial={modal.item} onSave={saveEvent} onClose={() => setModal({ open: false })} />}
          </div>
        );
      }
      function EventModal({ initial, onSave, onClose }) {
        const { data } = useApp();
        const init = initial || {};
        const [type, setType] = useState(init.type || 'другое');
        const [title, setTitle] = useState(init.title || '');
        const [date, setDate] = useState(init.date || todayISO());
        const [time, setTime] = useState(init.time || '');
        const [place, setPlace] = useState(init.place || '');
        const [groupIds, setGroupIds] = useState(init.groupIds || []);
        const [status, setStatus] = useState(init.status || 'запланировано');
        const [description, setDescription] = useState(init.description || '');

        return (
          <Modal title={initial ? 'Мероприятие' : 'Новое мероприятие'} onClose={onClose} wide footer={<>
            <button className="btn" onClick={onClose}>Отмена</button>
            <button className="btn btn-primary" disabled={!title.trim() || !date}
              onClick={() => onSave({ id: init.id || uid(), type, title: title.trim(), date, time, place: place.trim(), groupIds, status, description: description.trim() })}>
              <Icon name="check" size={14} />Сохранить
            </button>
          </>}>
            <div className="grid gap-3 sm:grid-cols-2">
              <Field label="Название" className="sm:col-span-2"><input className="inp" value={title} onChange={e => setTitle(e.target.value)} placeholder="Например: Олимпиада по английскому" /></Field>
              <Field label="Тип">
                <select className="inp" value={type} onChange={e => setType(e.target.value)}>
                  {EVENT_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                </select>
              </Field>
              <Field label="Статус">
                <select className="inp" value={status} onChange={e => setStatus(e.target.value)}>
                  {EVENT_STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </Field>
              <Field label="Дата"><input type="date" className="inp" value={date} onChange={e => setDate(e.target.value)} /></Field>
              <Field label="Время"><input type="time" className="inp" value={time} onChange={e => setTime(e.target.value)} /></Field>
              <Field label="Место" className="sm:col-span-2"><input className="inp" value={place} onChange={e => setPlace(e.target.value)} placeholder="Кабинет, зал, адрес…" /></Field>
              <Field label="Группы" className="sm:col-span-2">
                <div className="flex flex-wrap gap-1.5">
                  {data.groups.length === 0 && <span className="text-xs text-soft">Групп пока нет</span>}
                  {data.groups.map(g => {
                    const on = groupIds.includes(g.id);
                    return (
                      <button key={g.id} className={`chip press ${on ? 'border-pine bg-pine-soft text-pine-deep' : 'border-line bg-card'}`}
