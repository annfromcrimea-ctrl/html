<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аракин 1–5 курс — расширенный учебный тренажёр</title>
<style>
:root{
  --accent:#12324f;--accent2:#1d4f7a;--gold:#a67c00;--bg:#f3f5f8;--card:#fff;--dark:#0c1826;
  --shadow:0 6px 22px rgba(12,24,38,.12);--radius:14px;--ok:#1f7a3d;--err:#b3261e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:#222;line-height:1.55}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:290px;background:linear-gradient(168deg,#08131f 0%,#12324f 58%,#3a1c10 100%);color:#eef3f9;z-index:50;display:flex;flex-direction:column;transition:transform .3s ease}
.side-head{padding:18px 16px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.side-head h1{font-size:15.5px;line-height:1.3;font-weight:700}
.side-head p{font-size:11.5px;color:#9db3c8;margin-top:4px}
.progress-wrap{padding:13px 16px 8px}
.progress-label{display:flex;justify-content:space-between;font-size:10.5px;color:#9db3c8;margin-bottom:5px;text-transform:uppercase}
.progress-track{height:8px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--gold),#e7b416);transition:width .5s ease}
.nav-list{flex:1;overflow-y:auto;padding:9px}
.nav-list::-webkit-scrollbar{width:6px}
.nav-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
.course-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.course-tab{background:rgba(255,255,255,.10);border-radius:8px;padding:7px 0;text-align:center;font-size:11px;font-weight:700;cursor:pointer;transition:.15s}
.course-tab:hover{background:rgba(255,255,255,.18)}
.course-tab.active{background:rgba(231,180,22,.28);color:#ffe7a1}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#84a0ba;padding:12px 8px 5px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:10px;cursor:pointer;transition:background .16s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.09)}
.nav-item.active{background:rgba(166,124,0,.34)}
.nav-num{flex:0 0 25px;height:25px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.nav-tt{flex:1;font-size:12.5px;font-weight:600;line-height:1.25}
.badge{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.14);color:#d7e5f2;white-space:nowrap}
.badge.ok{background:#1f7a3d;color:#fff}
.badge.mid{background:#d9a520;color:#221a00}
.badge.low{background:#b3261e;color:#fff}
.side-foot{padding:11px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#84a0ba;display:flex;justify-content:space-between;align-items:center}
.side-foot a{color:#ffd76a;cursor:pointer;text-decoration:underline}
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:60;width:44px;height:44px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.overlay{display:none;position:fixed;inset:0;background:rgba(6,12,20,.55);z-index:40}
.main{margin-left:290px;padding:34px 42px 80px;max-width:1040px}
.lesson-head{margin-bottom:24px;animation:fadeUp .45s ease}
.lesson-tag{display:inline-block;background:var(--gold);color:#fff;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;padding:5px 13px;border-radius:99px;margin-bottom:11px}
.lesson-head h2{font-size:29px;color:var(--dark);line-height:1.2;margin-bottom:6px}
.lesson-head .sub{font-size:14.5px;color:#58697d}
.welcome{animation:fadeUp .5s ease}
.hero{background:linear-gradient(135deg,#08131f,#12324f 55%,#5a3905);border-radius:18px;color:#fff;padding:42px 38px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"1–5";position:absolute;right:-10px;bottom:-26px;font-size:120px;font-weight:800;opacity:.08}
.hero h2{font-size:30px;margin-bottom:12px;line-height:1.2}
.hero p{max-width:760px;color:#c7d7e6;font-size:14.5px}
.hero .start{margin-top:20px;display:inline-block;background:var(--gold);color:#fff;border:none;font-size:14.5px;font-weight:700;padding:12px 28px;border-radius:11px;cursor:pointer;transition:transform .15s;box-shadow:0 6px 18px rgba(166,124,0,.4)}
.hero .start:hover{transform:translateY(-2px)}
.course-grid,.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.course-card,.lesson-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border-top:4px solid var(--gold);transition:transform .18s;cursor:pointer}
.course-card:hover,.lesson-card:hover{transform:translateY(-3px)}
.course-card h3,.lesson-card h3{color:var(--accent);font-size:16px;margin-bottom:5px}
.course-card p,.lesson-card p{font-size:13px;color:#58697d}
.grammar-card{background:var(--card);border-left:5px solid var(--gold);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:26px;animation:fadeUp .5s ease}
.grammar-card h3{color:var(--accent);font-size:18px;margin-bottom:13px}
.grammar-card h3::before{content:"§ ";color:var(--gold)}
.grammar-card p{font-size:14px;margin-bottom:8px;color:#263447}
table.gram{width:100%;border-collapse:collapse;margin:11px 0 15px;font-size:13.2px;background:#fff}
table.gram th{background:var(--accent);color:#fff;padding:8px 11px;text-align:left;font-weight:600;font-size:12.5px}
table.gram td{border:1px solid #dfe6ee;padding:8px 11px;vertical-align:top}
table.gram tr:nth-child(even) td{background:#f7fafc}
.example{background:#f5f8ff;border-left:3px solid var(--accent2);border-radius:0 9px 9px 0;padding:10px 14px;margin:9px 0;font-size:13.5px}
.tip{background:#fff7e7;border-left:4px solid #e0a020;border-radius:0 10px 10px 0;padding:11px 15px;margin:13px 0;font-size:13.2px;color:#5d4a1f}
.tip::before{content:"Примечание: ";font-weight:700}
.ex-wrap h3.ex-title{font-size:20px;color:var(--dark);margin:32px 0 15px}
.ex-wrap h3.ex-title::before{content:"Задания: ";color:var(--gold)}
.ex-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:19px 21px;margin-bottom:14px;transition:box-shadow .2s;animation:fadeUp .4s ease}
.ex-block:hover{box-shadow:0 9px 26px rgba(12,24,38,.15)}
.ex-q{font-size:14.5px;font-weight:600;color:#172435;margin-bottom:12px}
.ex-q .n{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;margin-right:9px;flex-shrink:0}
.opts{display:flex;flex-wrap:wrap;gap:9px}
.opt{border:2px solid #dfe6ee;background:#fbfcfe;border-radius:10px;padding:8px 14px;font-size:13.5px;cursor:pointer;transition:.15s;user-select:none}
.opt:hover{border-color:var(--accent2);background:#eef5fb}
.opt.selected{border-color:var(--accent);background:#e2effa;font-weight:600}
.opt.correct{border-color:var(--ok);background:#e5f5ec;font-weight:700}
.opt.wrong{border-color:var(--err);background:#fdebec}
.fill-input{border:2px solid #dfe6ee;border-radius:10px;padding:9px 13px;font-size:14px;width:100%;max-width:400px;outline:none;transition:.15s;background:#fbfcfe;font-family:inherit}
.fill-input:focus{border-color:var(--accent2);background:#fff}
.fill-input.correct{border-color:var(--ok);background:#e5f5ec}
.fill-input.wrong{border-color:var(--err);background:#fdebec}
.feedback{margin-top:10px;font-size:13px;font-weight:600;display:none;border-radius:9px;padding:8px 12px}
.feedback.ok{display:block;background:#e5f5ec;color:var(--ok)}
.feedback.err{display:block;background:#fdebec;color:var(--err)}
.btn-row{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{border:none;border-radius:11px;padding:12px 26px;font-size:14.5px;font-weight:700;cursor:pointer;transition:transform .15s;font-family:inherit}
.btn-check{background:var(--gold);color:#fff;box-shadow:0 6px 16px rgba(166,124,0,.32)}
.btn-check:hover{transform:translateY(-2px)}
.btn-reset{background:#e8edf4;color:#3b4a5d}
.btn-reset:hover{background:#dbe4ef}
.result-box{display:none;margin-top:20px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;text-align:center;border-top:5px solid var(--gold);animation:fadeUp .4s ease}
.result-box.show{display:block}
.result-box .score{font-size:34px;font-weight:800;color:var(--accent)}
.result-box .msg{font-size:16px;font-weight:700;margin-top:4px}
.result-box .msg-en{font-size:13.5px;color:#66788c;margin-top:3px;font-style:italic}
@keyframes fadeUp{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
  .scope-card,.study-toolbox,.audit-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin:0 0 24px;border-top:4px solid var(--accent2)}
  .scope-card h3,.study-toolbox h3,.audit-card h3{color:var(--accent);font-size:18px;margin-bottom:10px}
  .scope-card p,.study-toolbox p,.audit-card p{font-size:14px;color:#263447;margin:8px 0}
  .scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
  .scope-item{background:#f5f8ff;border:1px solid #dfe6ee;border-radius:10px;padding:12px 14px;font-size:13px;color:#263447}
  .scope-item strong{display:block;color:var(--accent);margin-bottom:4px}
  .study-toolbox ol{margin:10px 0 0 20px;color:#263447;font-size:14px}
  .study-toolbox li{margin:6px 0}
  .lesson-nav{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
  .lesson-nav .btn{min-width:180px}.btn-nav{background:var(--accent);color:#fff}.btn-nav:disabled{opacity:.48;cursor:not-allowed}.btn-nav:not(:disabled):hover{background:var(--accent2)}
  .course-tab,.nav-item{font-family:inherit;border:none;color:inherit}.course-tab{width:100%}.nav-item{width:100%;text-align:left;background:transparent}.course-card,.lesson-card{width:100%;text-align:left;font-family:inherit;background:var(--card)}
  .course-card:focus-visible,.lesson-card:focus-visible,.nav-item:focus-visible,.course-tab:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid #e7b416;outline-offset:3px}
  .opt{font-family:inherit}.opt[aria-pressed="true"]{border-color:var(--accent);background:#e2effa;font-weight:600}
  .checklist{margin:12px 0 0;padding-left:19px}.checklist li{margin:6px 0;color:#263447;font-size:13.7px}
  .source-note{font-size:12.2px!important;color:#58697d!important;border-top:1px solid #dfe6ee;padding-top:10px;margin-top:13px!important}
  @media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:block}
  .overlay.show{display:block}
  .main{margin-left:0;padding:70px 16px 70px}
  .lesson-head h2{font-size:24px}
  .hero{padding:28px 22px}
  .hero h2{font-size:25px}
}
</style>
</head>
<body>

<button class="hamburger" onclick="toggleSide()">☰</button>
<div class="overlay" id="ovl" onclick="toggleSide()"></div>

<aside class="sidebar" id="sidebar">
  <div class="side-head">
    <h1>Аракин · Практический курс английского</h1>
    <p>Расширенный тренажёр · 52 тематических модуля</p>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span>Прогресс</span><span id="pr-text">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="pr-fill"></div></div>
  </div>
  <nav class="nav-list" id="navlist"></nav>
  <div class="side-foot"><span id="foot-score"></span><a onclick="resetAll()">сбросить всё</a></div>
</aside>

<main class="main" id="main"></main>

<script>
const LS_KEY="arakin_all_courses_extended_v2";
const COURSE_GUIDES=[
  {focus:"Фонетическая база, чтение и ключевая морфология", task:"Прочитайте в своём лицензионном экземпляре выбранный фрагмент модуля вслух, отметьте пять трудных слов и составьте с ними собственные предложения."},
  {focus:"Условные конструкции, привычки и управление глаголов", task:"Составьте четыре собственных высказывания: о реальном условии, нереальном настоящем, прошлом условии и привычке из прошлого. Затем объясните выбор формы."},
  {focus:"Система грамматики уровня Upper-Intermediate", task:"Преобразуйте четыре собственных предложения в пассивную или косвенную речь и письменно прокомментируйте, почему вы выбрали именно эту форму."},
  {focus:"Академическое чтение, лексическая сочетаемость и дискуссия", task:"Подготовьте мини-выступление на 90 секунд по теме модуля: тезис, два аргумента, пример и вывод. Используйте не менее пяти слов из активного словаря."},
  {focus:"Профессиональная коммуникация учителя и тематический словарь", task:"Сделайте краткий план занятия или диалога по теме модуля. Включите учебную цель, языковой материал, вопрос для обсуждения и форму обратной связи."}
];
const ANSWER_ALIASES={
  "travelled":["traveled"],
  "cannot":["can not"],
  "focussed":["focused"],
  "travelling":["traveling"]
};
let scores=JSON.parse(localStorage.getItem(LS_KEY)||"{}");
let currentC=null;
let currentL=null;

const COURSES=[
{n:"1 курс",d:"Фонетика, чтение, базовая грамматика, времена, пассив, Complex Object, герундий",l:[
["Правила чтения. Типы слога","I–IV типы слога, c/s/th/ck/kn",`<p>Четыре типа слога: I — открытый, II — закрытый, III — гласная + r, IV — гласная + r + e.</p><table class="gram"><tr><th>Тип</th><th>Пример</th></tr><tr><td>I</td><td>name, me, note</td></tr><tr><td>II</td><td>map, pen, not</td></tr><tr><td>III</td><td>park, her, fork</td></tr><tr><td>IV</td><td>fare, here, more</td></tr></table><p><b>c</b> перед e/i/y обычно даёт [s], <b>ck</b> — [k]. Сочетание <b>th</b> читается как [ð] в <i>this, the, though</i>, но как [θ] в <i>think, thin, bath</i>. Для чтения новых слов обязательно сверяйтесь с транскрипцией в словаре.</p>`,[
["c","Как читается E в слове me?",["[e]","[i:]","[ei]"],"[i:]"],
["c","Как читается O в слове not?",["[əu]","[ɒ]","[ʌ]"],"[ɒ]"],
["c","Как читается th в слове this?",["[θ]","[ð]","[t]"],"[ð]"],
["c","Как читается c в слове cent?",["[k]","[s]","[ts]"],"[s]"],
["c","В каком слове s читается как [z]?",["sit","best","nose"],"nose"],
["f","Сочетание ck в слове clock даёт звук ___ .","k"],
["c","В каком слове a читается как [ei]?",["map","name","bad"],"name"],
["c","Какое слово содержит закрытый слог?",["he","time","ten"],"ten"]
]],
["Глагол to be. Степени сравнения","am/is/are · taller/the tallest",`<table class="gram"><tr><th>Лицо</th><th>to be</th></tr><tr><td>I</td><td>am</td></tr><tr><td>he/she/it</td><td>is</td></tr><tr><td>we/you/they</td><td>are</td></tr></table><p>Степени сравнения: <i>tall — taller — the tallest</i>; <i>big — bigger</i>; <i>busy — busier</i>; <i>beautiful — more beautiful</i>. После односложных прилагательных с краткой ударной гласной конечная согласная часто удваивается; прилагательные на <i>-y</i> меняют <i>y</i> на <i>i</i>.</p><div class="example">This isn't a box, is it?</div><div class="tip">Сравнивайте сопоставимые объекты: <i>My room is larger than my sister's</i>, а не <i>than my sister</i>.</div>`,[
["f","I ___ a student.","am"],
["f","They ___ doctors.","are"],
["f","She ___ twenty-two.","is"],
["c","Are you a student? — No, ___.",["I'm not","I not","I aren't"],"I'm not"],
["c","Is he a pupil? — Yes, ___.",["he is","he's","is he"],"he is"],
["c","This isn't a box, ___ ?",["is it","isn't it","does it"],"is it"],
["f","Сравнительная степень: big — ___","bigger"],
["c","Сравнительная степень от beautiful:",["beautifuller","more beautiful","most beautiful"],"more beautiful"]
]],
["Множественное число существительных","-s/-es/-ies/-ves · исключения",`<p>-s/-es: <i>bus — buses, box — boxes</i>; <i>-y → -ies</i>: <i>family — families</i>; ряд слов на <i>-f/-fe</i> образует форму на <i>-ves</i>: <i>wife — wives</i>.</p><p>Исключения: <i>child — children, tooth — teeth, mouse — mice; sheep — sheep</i>. Не обобщайте правило <i>-f → -ves</i> механически: <i>roof — roofs</i>, <i>belief — beliefs</i>.</p><div class="example">the books of the students → the students' books</div>`,[
["f","bus → ___","buses"],
["f","family → ___","families"],
["f","child → ___","children"],
["f","tooth → ___","teeth"],
["c","Множественное число от sheep:",["sheeps","sheep","sheepes"],"sheep"],
["c","Множественное число от brother-in-law:",["brother-in-laws","brothers-in-law","brother-ins-law"],"brothers-in-law"],
["f","wife → ___","wives"],
["c","the books of the students = ?",["the students' books","the student's books","the students's books"],"the students' books"]
]],
["to have. some/any/no. Предлоги","have/has · on/in/into/out of",`<table class="gram"><tr><th>Лицо</th><th>have</th></tr><tr><td>I/you/we/they</td><td>have</td></tr><tr><td>he/she/it</td><td>has</td></tr></table><p><b>some</b> обычно употребляется в утверждениях, <b>any</b> — в вопросах и отрицаниях, <b>no</b> создаёт отрицательное значение при утвердительной форме глагола. В вежливых просьбах и предложениях часто используется <b>some</b>: <i>Would you like some tea?</i></p>`,[
["f","I ___ a lot of friends.","have"],
["f","My brother-in-law ___ a doctor.","has"],
["c","Have you ___ relations?",["some","any","no"],"any"],
["f","There isn't ___ chalk on the blackboard.","any"],
["f","The book is ___ the table. (на)","on"],
["f","The pencil is ___ the box. (в)","in"],
["f","Go ___ the room! (в)","into"],
["c","Take the newspaper ___ the bag.",["out of","from","off"],"out of"]
]],
["There is/are. Числительные. Время","there is/are · half past two",`<div class="example">There is a clock on the desk. There are many books on the shelf.</div><p>Важно: <b>forty</b> пишется без <i>u</i>. Время: <i>half past two</i>, <i>a quarter to three</i>. С днями недели используется <b>on</b>: <i>on Sunday</i>; с точным временем — <b>at</b>: <i>at 7.30</i>.</p>`,[
["f","There ___ a clock on the desk.","is"],
["f","There ___ many books on the shelf.","are"],
["c","Is there ___ milk in the jug?",["much","many"],"much"],
["f","15 словами:","fifteen"],
["f","40 словами:","forty"],
["c","2:30 по-английски:",["half past two","half to two","two past half"],"half past two"],
["f","Без четверти три = a quarter ___ three","to"],
["c","___ Sunday",["In","On","At"],"On"]
]],
["Модальные глаголы can/may/must","can/may/must · needn't/mustn't",`<p><b>can</b> выражает способность или неформальное разрешение, <b>may</b> — более формальное разрешение или вероятность, <b>must</b> — сильную обязанность либо логический вывод. <b>mustn't</b> означает запрет, а <b>needn't</b> — отсутствие необходимости.</p><div class="example">Must I read this book? — No, you needn't.</div>`,[
["f","I ___ speak only two foreign languages. (умею)","can"],
["f","___ I come in? (можно)","May"],
["f","You ___ not smoke here. (нельзя, запрет)","must"],
["c","Must I read this book? — No, you ___.",["mustn't","needn't","can't"],"needn't"],
["c","Отрицательная форма глагола can пишется:",["can not","cannot","not can"],"cannot"],

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function norm(s){return String(s).toLowerCase().replace(/\s+/g," ").trim()}
function acceptedAnswers(e){
  const initial=Array.isArray(e[2])?e[2].slice():[e[2]];
  const full=[];
  initial.forEach(a=>{full.push(a);const aliases=ANSWER_ALIASES[norm(a)]||[];aliases.forEach(x=>full.push(x));});
  return [...new Set(full)];
}
function lessonNavigation(ci,li){
  const lessons=COURSES[ci].l;
  const prev=li>0?'<button class="btn btn-nav" onclick="loadLesson('+ci+','+(li-1)+')">Предыдущий модуль</button>':'<button class="btn btn-nav" disabled>Предыдущий модуль</button>';
  const next=li<lessons.length-1?'<button class="btn btn-nav" onclick="loadLesson('+ci+','+(li+1)+')">Следующий модуль</button>':'<button class="btn btn-nav" onclick="openCourse('+ci+')">К списку модулей</button>';
  return '<div class="lesson-nav">'+prev+next+'</div>';
}
function key(c,l){return c+"-"+l}
function allLessons(){let a=[];COURSES.forEach((c,ci)=>c.l.forEach((_,li)=>a.push({c:ci,l:li})));return a}
function getScore(c,l){return scores[key(c,l)]}

function buildNav(){
const nav=document.getElementById("navlist");
let html='<div class="course-tabs">';
COURSES.forEach((c,i)=>{html+='<button type="button" class="course-tab'+(currentC===i?' active':'')+'" onclick="openCourse('+i+')">'+c.n+'</button>'});
html+='</div>';
if(currentC!==null){
const c=COURSES[currentC];
html+='<div class="nav-sec">'+esc(c.n)+' · '+c.l.length+' модулей</div>';
c.l.forEach((l,i)=>{
const sc=getScore(currentC,i);let badge="";
if(sc&&sc.answered){const p=Math.round(sc.correct/sc.total*100);const cls=p===100?"ok":(p>=60?"mid":"low");badge='<span class="badge '+cls+'">'+sc.correct+'/'+sc.total+'</span>'}
html+='<button type="button" class="nav-item'+(currentL===i?' active':'')+'" onclick="loadLesson('+currentC+','+i+')"><span class="nav-num">'+(i+1)+'</span><span class="nav-tt">'+esc(l[0])+'</span>'+badge+'</button>';
});}
nav.innerHTML=html;}

function updateProgress(){
const total=allLessons().length;
const done=allLessons().filter(x=>{const s=getScore(x.c,x.l);return s&&s.answered}).length;
const p=Math.round(done/total*100);

document.getElementById("pr-text").textContent=p+"%";
let tot=0;allLessons().forEach(x=>{const s=getScore(x.c,x.l);if(s&&s.answered)tot+=s.correct});
document.getElementById("foot-score").textContent="Баллов: "+tot;}

function selectOpt(el){el.parentElement.querySelectorAll(".opt").forEach(o=>{o.classList.remove("selected");o.setAttribute("aria-pressed","false")});el.classList.add("selected");el.setAttribute("aria-pressed","true")}

function checkAll(){
const l=COURSES[currentC].l[currentL];const ex=l[3];
const blocks=document.querySelectorAll(".ex-block");let correct=0;
blocks.forEach((blk,i)=>{
const e=ex[i];const fb=blk.querySelector(".feedback");let ok=false;
if(e[0]==="c"){
const sel=blk.querySelector(".opt.selected");
blk.querySelectorAll(".opt").forEach(o=>{o.classList.remove("correct","wrong");if(o.dataset.val===e[3])o.classList.add("correct");else if(o.classList.contains("selected"))o.classList.add("wrong")});
ok=!!(sel&&sel.dataset.val===e[3]);
fb.innerHTML=ok?"✓ Correct!":"✗ Неправильно. Правильный ответ: <b>"+esc(e[3])+"</b>";
}else{
const inp=blk.querySelector(".fill-input");const v=norm(inp.value);
const acc=acceptedAnswers(e);
ok=v.length>0&&acc.some(a=>norm(a)===v);
inp.classList.remove("correct","wrong");if(v.length>0)inp.classList.add(ok?"correct":"wrong");
fb.innerHTML=ok?"✓ Correct!":"✗ Неправильно. Правильный ответ: <b>"+esc(acc[0])+"</b>";
}
fb.className="feedback "+(ok?"ok":"err");if(ok)correct++;});
const total=ex.length;const p=Math.round(correct/total*100);
let msg,msgEn,color;
if(p===100){msg="Отлично!";msgEn="Excellent! Perfect work!";color="var(--ok)"}
else if(p>=80){msg="Очень хорошо!";msgEn="Very good! Keep it up!";color="var(--ok)"}
else if(p>=60){msg="Неплохо!";msgEn="Not bad! Practise a little more.";color="#d9a520"}
else{msg="Повторите материал модуля.";msgEn="Please revise the study material and try again.";color="var(--err)"}
document.getElementById("res-score").textContent=correct+" / "+total+" ("+p+"%)";
document.getElementById("res-score").style.color=color;
document.getElementById("res-msg").textContent=msg;
document.getElementById("res-msg").style.color=color;
document.getElementById("res-msg-en").textContent=msgEn;
document.getElementById("resbox").classList.add("show");
document.getElementById("resbox").scrollIntoView({behavior:"smooth",block:"center"});
scores[key(currentC,currentL)]={correct,total,answered:true};
localStorage.setItem(LS_KEY,JSON.stringify(scores));
buildNav();updateProgress();}

function resetEx(){
document.querySelectorAll(".opt").forEach(o=>{o.classList.remove("selected","correct","wrong");o.setAttribute("aria-pressed","false")});
document.querySelectorAll(".fill-input").forEach(i=>{i.value="";i.classList.remove("correct","wrong")});
document.querySelectorAll(".feedback").forEach(f=>{f.className="feedback";f.innerHTML=""});
const box=document.getElementById("resbox");if(box)box.classList.remove("show");
window.scrollTo({top:0,behavior:"smooth"});}

function resetAll(){if(!confirm("Сбросить весь прогресс всех курсов?"))return;scores={};localStorage.removeItem(LS_KEY);buildNav();updateProgress();showWelcome();}
function toggleSide(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("ovl").classList.toggle("show")}
function closeSide(){document.getElementById("sidebar").classList.remove("open");document.getElementById("ovl").classList.remove("show")}

buildNav();updateProgress();showWelcome();
</script>
