<style>

.dark{--paper:#211c14;--card:#2a241a;--card2:#332b1e;--cream:#312a1e;--line:#4a4030;--ink:#f1e8d3;--mut:#a89a7e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:"Golos Text",system-ui,sans-serif;font-size:15px;color:var(--ink);background-color:var(--paper);

h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.04),0 12px 28px -18px rgba(43,36,23,.35)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);padding:6px 12px;font-size:14px;transition:.15s}
.btn:hover{background:var(--card2)}.btn:active{transform:translate(1px,1px)}.btn:disabled{opacity:.4;cursor:default}
.btn-p{background:#ffd94a;border-color:rgba(43,36,23,.55);font-weight:700}.btn-p:hover{background:#ffd94a;transform:translateY(-1px)}

.inp:focus{border-color:var(--ink)}.inp::placeholder{color:color-mix(in srgb,var(--mut) 65%,transparent)}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);padding:2px 10px;font-size:11px;font-weight:700}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;flex:none}
.rise{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .18s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(6px)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(124,154,114,.55)}70%{box-shadow:0 0 0 7px transparent}}
.sync-dot{animation:pulseDot 1.4s ease-out infinite}
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 95%,transparent);backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}
.nbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.nbtn:hover{border-color:var(--line);background:var(--card)}
.nbtn.on{background:#ffd94a;border-color:rgba(43,36,23,.6);box-shadow:2.5px 2.5px 0 rgba(43,36,23,.16)}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.pill:hover{background:var(--card2)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl td,.tbl th{border:1px solid var(--line)}
.stick{position:sticky;left:0;z-index:5;background:var(--card)}
.mback{position:fixed;inset:0;background:rgba(43,36,23,.45);z-index:70;overflow-y:auto;padding:16px;padding-top:7vh;display:flex;justify-content:flex-start;align-items:flex-start}
.mback2{position:fixed;inset:0;z-index:60}
.ovg{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:900px){.ovg{grid-template-columns:repeat(12,1fr)}.o3{grid-column:span 3}.o4{grid-column:span 4}.o5{grid-column:span 5}.o6{grid-column:span 6}}
.g2{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}
.g3{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.g3{grid-template-columns:1fr 1fr}}

.sb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:8px}
.icobtn{border:1px solid var(--line);background:var(--card);padding:4px;display:inline-flex}

.fbtn{width:52px;height:52px;display:grid;place-items:center;border:1px solid rgba(43,36,23,.55);box-shadow:4px 4px 0 rgba(43,36,23,.16)}
.fbtn:hover{transform:translateY(-2px)}
.timeline{position:relative;margin-left:12px;border-left:2px solid var(--line);padding-left:20px}
.tdot{position:absolute;left:-27px;top:16px;width:14px;height:14px;border-radius:99px;border:2px solid var(--paper)}
.stk{position:relative;border:1px solid rgba(43,36,23,.2);padding:10px;font-size:12px;font-weight:600;color:#2b2417;box-shadow:2.5px 2.5px 0 rgba(43,36,23,.14)}
.stk .del{position:absolute;right:3px;top:3px;display:none;color:rgba(43,36,23,.6)}
.stk:hover .del{display:block}
.sw{width:32px;height:32px;border:1px solid var(--line)}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px color-mix(in srgb,var(--ink) 30%,transparent)}
.dz{border:1px dashed var(--line);background:var(--cream);padding:18px;text-align:center;font-size:14px}

 case 'task-new':D.task={id:'',zoneId:S.zones[0]?S.zones[0].id:'',date:T,time:'',title:'',prep:'',responsible:'мама'};ui.modal={k:'task'};render();break;
 case 'task-edit':{const t=S.tasks.find(x=>x.id===d.id);if(t){D.task=JSON.parse(JSON.stringify(t));ui.modal={k:'task'};render()}break}
 case 'task-save':{const f=D.task||{};const title=sanitizeStr(f.title);if(!title){toast('Введите название дела','err');return}
  const clean={title:title,zoneId:f.zoneId,date:isISO(f.date)?f.date:T,time:f.time||undefined,prep:sanitizeStr(f.prep)||undefined,responsible:f.responsible||'мама'};
  if(f.id)S.tasks=S.tasks.map(t=>t.id===f.id?Object.assign({},t,clean):t);
  else S.tasks.push(Object.assign({id:uid(),status:'todo'},clean));
  ui.modal=null;D.task=null;commit();toast(f.id?'Дело обновлено':'Дело добавлено');break}
 case 'task-toggle':S.tasks=S.tasks.map(t=>t.id===d.id?(t.status==='done'?Object.assign({},t,{status:'todo',doneDate:undefined}):Object.assign({},t,{status:'done',doneDate:T})):t);commit();break;
 case 'task-del':{const t=S.tasks.find(x=>x.id===d.id);ask('Удалить дело?','«'+(t?t.title:'')+'» будет удалено.','Удалить',()=>{S.tasks=S.tasks.filter(x=>x.id!==d.id);commit()});break}
 case 'share':ui.shareKey=ui.shareKey===d.k?null:d.k;render();break;
 case 'share-do':{const txt=shareText(d.k);ui.shareKey=null;render();
  if(d.m==='copy')copyText(txt).then(ok=>toast(ok?'План скопирован в буфер':'Не удалось скопировать',ok?'ok':'err'));
  else if(d.m==='wa')window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  else window.open('mailto:?subject='+encodeURIComponent('План семьи')+'&body='+encodeURIComponent(txt));break}
 case 'ics-plan':{const items=S.tasks.filter(t=>t.status==='todo').map(t=>({uid:t.id,date:t.date,time:t.time,title:t.title,place:zoneName(t.zoneId),desc:'Ответственный: '+t.responsible+(t.prep?'\nПодготовить: '+t.prep:'')}));
  if(!items.length){toast('Нет запланированных дел для экспорта','info');return}
  download('domovnik-plan.ics',buildICS(items),'text/calendar');toast('Файл .ics сохранён');break}
 case 'mnt-int':{S.maintenance=S.maintenance.map(m=>m.id===d.id?Object.assign({},m,{intervalDays:Math.max(1,Number(e.target.value)||1)}):m);commit();break}
 case 'mnt-done':{const m=S.maintenance.find(x=>x.id===d.id);if(!m)return;
  S.maintenance=S.maintenance.map(x=>x.id===d.id?Object.assign({},x,{nextDue:addDaysISO(T,x.intervalDays)}):x);
  commit();toast('«'+m.name+'» — отмечено выполненным, следующее ТО через '+m.intervalDays+' дн.');break}
 case 'mnt-del':{const m=S.maintenance.find(x=>x.id===d.id);ask('Удалить?','«'+(m?m.name:'')+'» исчезнет из календаря обслуживания.','Удалить',()=>{S.maintenance=S.maintenance.filter(x=>x.id!==d.id);commit()});break}
 case 'mnt-add':{const f=D.mnt||{};const name=sanitizeStr(f.name);if(!name){toast('Введите название','err');return}
  S.maintenance.push({id:uid(),name:name,intervalDays:Math.max(1,Number(f.interval)||30),nextDue:isISO(f.due)?f.due:T});D.mnt={};commit();break}
 /* события */
 case 'ev-filter':ui.ef=d.t;render();break;
 case 'ev-new':D.ev={id:'',type:'гости',title:'',date:T,time:'',place:'',people:'',zoneIds:[],status:'запланировано'};ui.modal={k:'ev'};render();break;
 case 'ev-edit':{const ev=S.events.find(x=>x.id===d.id);if(ev){D.ev=JSON.parse(JSON.stringify(ev));ui.modal={k:'ev'};render()}break}
 case 'ev-zone':{const f=D.ev;const i=f.zoneIds.indexOf(d.id);if(i>=0)f.zoneIds.splice(i,1);else f.zoneIds.push(d.id);render();break}
 case 'ev-save':{const f=D.ev||{};const title=sanitizeStr(f.title);if(!title){toast('Введите название события','err');return}
  const clean={title:title,type:f.type,date:isISO(f.date)?f.date:T,time:f.time||undefined,place:sanitizeStr(f.place)||undefined,people:sanitizeStr(f.people)||undefined,zoneIds:f.zoneIds||[],status:f.status};
  if(f.id)S.events=S.events.map(x=>x.id===f.id?Object.assign({},x,clean):x);else S.events.push(Object.assign({id:uid()},clean));
  ui.modal=null;D.ev=null;commit();toast(f.id?'Событие обновлено':'Событие добавлено');break}
 case 'ev-del':{const ev=S.events.find(x=>x.id===d.id);ask('Удалить событие?','«'+(ev?ev.title:'')+'» будет удалено.','Удалить',()=>{S.events=S.events.filter(x=>x.id!==d.id);commit()});break}
 case 'ev-status':S.events=S.events.map(x=>x.id===d.id?Object.assign({},x,{status:e.target.value}):x);commit();break;
 case 'ics-ev':{if(!S.events.length){toast('Событий нет','info');return}
  download('domovnik-sobytia.ics',buildICS(S.events.map(x=>({uid:x.id,date:x.date,time:x.time,title:x.title,place:x.place,desc:x.type+(x.people?'\nУчастники: '+x.people:'')}))),'text/calendar');
  toast('События выгружены в .ics');break}
 /* данные */
 case 'sync-now':{try{const raw=localStorage.getItem(LS_KEY);
   if(!raw)return;
   if(raw===JSON.stringify(S)){toast('Изменений нет — всё синхронно','info');return}
   adopt(normalize(JSON.parse(raw)),'Синхронизировано')}catch(x){toast('Не удалось прочитать хранилище','err')}break}
 case 'role':S.settings.role=d.r;commit();toast('Роль: '+d.r);break;
 case 'exp-json':download('domovnik-backup-'+T+'.json',JSON.stringify({app:'Домовник',version:1,exportedAt:new Date().toISOString(),state:S},null,2),'application/json');toast('Бэкап сохранён');break;
 case 'exp-csv':download('domovnik-dela.csv',toCSV([['Дата','Время','Дело','Зона','Подготовить','Ответственный','Статус']].concat(S.tasks.map(t=>[t.date,t.time||'',t.title,zoneName(t.zoneId),t.prep||'',t.responsible,t.status==='done'?'Сделано':'В плане']))),'text/csv;charset=utf-8');toast('CSV для Excel сохранён');break;
 case 'exp-ics':{const items=S.tasks.filter(t=>t.status==='todo').map(t=>({uid:'t-'+t.id,date:t.date,time:t.time,title:t.title,place:zoneName(t.zoneId)}))
   .concat(S.events.map(x=>({uid:'e-'+x.id,date:x.date,time:x.time,title:x.title,place:x.place})));
  if(!items.length){toast('Нечего экспортировать','info');return}
  download('domovnik-kalendar.ics',buildICS(items),'text/calendar');toast('Календарь .ics сохранён');break}
 case 'imp-mode':ui.impMode=d.m;render();break;
 case 'imp-browse':{const f=document.getElementById('impfile');if(f)f.click();break}
 case 'imp-text':runImport((D.imp&&D.imp.text)||'');break;
 case 'demo':ask('Загрузить демо-данные?','Текущие данные будут заменены демонстрационным набором.','Загрузить',()=>{
  const ns=makeSeed();ns.settings=Object.assign({},S.settings,{onboarded:true});S=ns;commit();toast('Демо-данные загружены')});break;
 case 'wipe':ask('Очистить всё?','Все зоны, дела, чек-листы и события будут удалены. Это действие необратимо.','Очистить',()=>{
  S=Object.assign(emptyState(),{settings:S.settings});commit();toast('Данные очищены')});break;
 /* плавающие */
 case 'panel':ui.panel=ui.panel===d.p?'none':d.p;render();break;
 case 'spin':{const pool=[];S.tasks.filter(t=>t.status==='todo').forEach(t=>pool.push({kind:'task',id:t.id,label:t.title}));
  S.zones.forEach(z=>z.regular.forEach(r=>pool.push({kind:'reg',id:r.id,label:r.name,zoneId:z.id})));
  const cand=pool.filter(p=>p.id!==ui.lastPick),list=cand.length?cand:pool;
  if(!list.length){toast('Дел пока нет — добавьте что-нибудь в планировщик','info');return}
  ui.pick=list[Math.floor(Math.random()*list.length)];ui.lastPick=ui.pick.id;render();break}
 case 'pick-done':{const p=ui.pick;if(!p)return;
  if(p.kind==='task')S.tasks=S.tasks.map(t=>t.id===p.id?Object.assign({},t,{status:'done',doneDate:T}):t);
  else S.zones=S.zones.map(z=>z.id!==p.zoneId?z:Object.assign({},z,{regular:z.regular.map(r=>r.id===p.id?Object.assign({},r,{marks:Object.assign({},r.marks,(function(){const o={};o[T]='v';return o})())}):r)}));
  ui.pick=null;commit();toast('Готово! Дом стал чуточку уютнее ✓');break}
 case 't-start':{const p=PRESETS[Number(d.i)];ui.timer={total:p[1]*60,left:p[1]*60,run:true,name:p[0],fired:false};renderFloatTimer();break}
 case 't-pause':ui.timer.run=!ui.timer.run;renderFloatTimer();break;
 case 't-plus':ui.timer.left+=60;ui.timer.total+=60;renderFloatTimer();break;
 case 't-reset':ui.timer={total:0,left:0,run:false,name:'',fired:false};renderFloatTimer();break;
 }
}
function renderFloatTimer(){document.getElementById('float').innerHTML=floatHTML()}

/* ============ СЛУШАТЕЛИ ============ */
document.addEventListener('click',e=>{
 if(e.target.matches&&e.target.matches('input[type=checkbox]'))return;
 const back=e.target.closest('[data-mback]');
 if(back&&e.target===back){ui.menu=null;ui.taskCard=null;ui.modal=null;render();return}
 const t=e.target.closest('[data-a]');if(!t)return;
 A(t.dataset.a,t.dataset,e);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='clfile'){const c=S.checklists.find(x=>x.id===ui.editCl);
  if(c&&el.files)Array.from(el.files).forEach(f=>{
   if(f.size>2*1024*1024){toast('«'+f.name+'» больше 2 МБ — пропущен','err');return}
   const r=new FileReader();r.onload=()=>{patchCl(c.id,{files:c.files.concat([{id:uid(),name:f.name,mime:f.type,size:f.size,dataUrl:String(r.result)}])});render()};
   r.readAsDataURL(f)});
  el.value='';return}
 if(el.id==='impfile'){const f=el.files&&el.files[0];if(f)f.text().then(runImport);el.value='';return}
 if(el.dataset.d){D[el.dataset.d]=D[el.dataset.d]||{};D[el.dataset.d][el.dataset.f]=el.value;return}
 if(el.dataset.p==='cl'){const o={};o[el.dataset.f]=el.value||undefined;patchCl(el.dataset.id,o);return}
 const t=el.closest('[data-a]');if(t)A(t.dataset.a,t.dataset,e);
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='q'){ui.q=el.value;renderQDrop();return}
 if(el.dataset.d){D[el.dataset.d]=D[el.dataset.d]||{};D[el.dataset.d][el.dataset.f]=el.value;return}
 if(el.dataset.p==='cl'){const o={};o[el.dataset.f]=el.dataset.f==='date'?(el.value||undefined):el.value;patchCl(el.dataset.id,o);return}
 if(el.dataset.p==='szname'){S.zones=S.zones.map(z=>z.id!==el.dataset.z?z:Object.assign({},z,{subzones:z.subzones.map(x=>x.id!==el.dataset.s?x:Object.assign({},x,{name:el.value}))}));persist();return}
});
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;const el=e.target;if(!el.dataset||!el.dataset.enter)return;
 e.preventDefault();A(el.dataset.enter,el.dataset,e);
});
document.addEventListener('dragover',e=>{const dz=e.target.closest&&e.target.closest('#dropz');if(dz){e.preventDefault();dz.classList.add('on')}});
document.addEventListener('dragleave',e=>{const dz=e.target.closest&&e.target.closest('#dropz');if(dz)dz.classList.remove('on')});
document.addEventListener('drop',e=>{const dz=e.target.closest&&e.target.closest('#dropz');if(!dz)return;e.preventDefault();dz.classList.remove('on');
 const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)f.text().then(runImport)});
/* таймер — тики */
setInterval(()=>{
 const t=ui.timer;if(!t.run)return;
 t.left=Math.max(0,t.left-1);
 if(t.left===0&&!t.fired){t.fired=true;t.run=false;beep();toast('Таймер «'+t.name+'» — время вышло!','info')}
 if(ui.panel==='timer'){const el=document.getElementById('tpanel');if(el)el.innerHTML='<div class="sb" style="margin-bottom:8px"><b class="disp" style="font-size:14px">Бытовой таймер</b><button data-a="panel" data-p="none" style="color:var(--mut)">'+icon('x',15)+'</button></div>'+timerInner()}
},1000);

/* ============ СТАРТ ============ */
try{chan=new BroadcastChannel('domovnik-sync');
 chan.onmessage=e=>{try{const n=JSON.parse(e.data);if(n&&Array.isArray(n.zones))adopt(n)}catch(x){}}}catch(e){}
setInterval(()=>{try{const raw=localStorage.getItem(LS_KEY);
 if(raw&&raw!==lastSaved){const n=JSON.parse(raw);if(n&&Array.isArray(n.zones))adopt(normalize(n),'Автосинхронизация')}}catch(e){}},25000);
window.addEventListener('storage',e=>{if(e.key===LS_KEY&&e.newValue&&e.newValue!==lastSaved){
 try{const n=JSON.parse(e.newValue);if(n&&Array.isArray(n.zones))adopt(normalize(n))}catch(x){}}});
document.documentElement.classList.toggle('dark',S.settings.theme==='тёмная');
persist();
render();
if(!S.settings.onboarded){ui.onb=true;render()}
</script>
<section class="tm-card"><h2>Домашние сценарии</h2><div class="tm-grid tm-buttons"><button data-home="Утро">План утра</button><button data-home="Уборка">Зона уборки</button><button data-home="Покупки">Список покупок</button><button data-home="Вечер">Закрытие дня</button></div><p id="home-output" class="tm-output">Выберите сценарий, чтобы получить короткий план.</p></section><script id="theme-tools-script">(()=>{const q=s=>document.querySelector(s), text=(s)=>String(s||'').trim(); const saveWord=(name,content)=>{const blob=new Blob(['\ufeff', '<html><head><meta charset="utf-8"></head><body><pre style="white-space:pre-wrap;font:15px Arial">'+content.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></body></html>'],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.title=document.title.replace(' · Генератор','');document.documentElement.dataset.themeNote='Универсальная панель убрана; добавлены домашние сценарии и быстрые действия по теме.';document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>q('#home-output').textContent='Сценарий «'+b.dataset.home+'»: выберите 3 главных действия, назначьте время и оставьте один запасной шаг.');document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>q('#build-output').textContent='Этап «'+b.dataset.build+'»: проверьте соответствие проекту, качество выполнения, безопасность и зафиксируйте замечания.');document.querySelectorAll('[data-mama]').forEach(b=>b.onclick=()=>q('#mama-output').textContent='Сценарий «'+b.dataset.mama+'»: подготовьте вещи заранее, выберите одно обязательное действие и один спокойный резерв.');document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>q('#cook-output').textContent='Раздел «'+b.dataset.cook+'»: запишите конкретные действия, время и нужные продукты.');})();</script>
</body>
