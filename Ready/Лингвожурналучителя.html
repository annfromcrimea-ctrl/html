<html lang="ru">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700;800&family=Golos+Text:wght@400;500;600;700&display=swap');

        * {
            font-family: 'Golos Text', system-ui, sans-serif;
            box-sizing: border-box;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .font-unbounded {
            font-family: 'Unbounded', sans-serif;
        }
        body {
            background: #f7f2e9;
            background-image: radial-gradient(circle, #d4cdc0 0.8px, transparent 0.8px);
            background-size: 24px 24px;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .theme-dark body {
            background: #1e1b16;
            background-image: radial-gradient(circle, #3a352e 0.8px, transparent 0.8px);
            background-size: 24px 24px;
        }
        .paper-bg {
            background: #faf6ed;
        }
        .theme-dark .paper-bg {
            background: #25201a;
        }
        .paper-border {
            border: 1.5px solid #d4cdc0;
        }
        .theme-dark .paper-border {
            border-color: #4a443b;
        }
        .chip-green {
            background: #2d5a3d;
            color: #faf6ed;
        }
        .chip-yellow {
            background: #e8c84c;
            color: #1e1b16;
        }
        .chip-red {
            background: #c0392b;
            color: #faf6ed;
        }
        .chip-blue {
            background: #3a6b8f;
            color: #faf6ed;
        }
        .chip-ochre {
            background: #b8860b;
            color: #faf6ed;
        }
        .btn-primary {
            background: #2d5a3d;
            color: #faf6ed;
            transition: all 0.15s;
        }
        .btn-primary:hover {
            background: #1e3f2b;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-secondary {
            background: #e8c84c;
            color: #1e1b16;
            transition: all 0.15s;
        }
        .btn-secondary:hover {
            background: #d4b43a;
            transform: translateY(-1px);
        }
        .btn-secondary:active {
            transform: scale(0.96);
        }
        .btn-outline {
            border: 1.5px solid #2d5a3d;
            color: #2d5a3d;
            background: transparent;
            transition: all 0.15s;
        }
        .btn-outline:hover {
            background: #2d5a3d10;
        }
        .theme-dark .btn-outline {
            border-color: #4a8a5a;
            color: #4a8a5a;
        }
        .theme-dark .btn-outline:hover {
            background: #4a8a5a20;
        }
        .card {
            background: #faf6ed;
            border: 1.5px solid #d4cdc0;
            transition: all 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .theme-dark .card {
            background: #2a241f;
            border-color: #4a443b;
        }
        .theme-dark .card:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .sticky-note {
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.06);
            transition: all 0.2s;
        }
        .sticky-note:hover {
            transform: rotate(-0.5deg) scale(1.01);
        }
        .tab-active {
            border-bottom: 3px solid #2d5a3d;
            color: #1e1b16;
            font-weight: 600;
        }
        .theme-dark .tab-active {
            border-bottom-color: #4a8a5a;
            color: #f0ebe2;
        }
        .tab-inactive {
            color: #8a8478;
            border-bottom: 3px solid transparent;
        }
        .theme-dark .tab-inactive {
            color: #8a8478;
        }
        .tab-inactive:hover {
            color: #1e1b16;
            border-bottom-color: #d4cdc0;
        }
        .theme-dark .tab-inactive:hover {
            color: #f0ebe2;
            border-bottom-color: #4a443b;
        }
        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #d4cdc0;
            border-radius: 4px;
        }
        .theme-dark .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #4a443b;
        }
        .pulse-sync {
            animation: pulse-sync 2s ease-in-out infinite;
        }
        @keyframes pulse-sync {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .cascade-in>* {
            animation: fadeIn 0.3s ease-out both;
        }
        .cascade-in>*:nth-child(1) {
            animation-delay: 0.02s;
        }
        .cascade-in>*:nth-child(2) {
            animation-delay: 0.06s;
        }
        .cascade-in>*:nth-child(3) {
            animation-delay: 0.10s;
        }
        .cascade-in>*:nth-child(4) {
            animation-delay: 0.14s;
        }
        .cascade-in>*:nth-child(5) {
            animation-delay: 0.18s;
        }
        .cascade-in>*:nth-child(6) {
            animation-delay: 0.22s;
        }
        .cascade-in>*:nth-child(7) {
            animation-delay: 0.26s;
        }
        .cascade-in>*:nth-child(8) {
            animation-delay: 0.30s;
        }
        .popover-enter {
            animation: popoverIn 0.2s ease-out;
        }
        @keyframes popoverIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(-6px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .ring-progress {
            transform: rotate(-90deg);
        }
        .ring-progress circle {
            transition: stroke-dashoffset 0.3s ease;
        }
        .btn-float {
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }
        .btn-float:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
        }
        .btn-float:active {
            transform: scale(0.94);
        }
        .toast {
            animation: toastIn 0.3s ease-out;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .toast-out {
            animation: toastOut 0.25s ease-in forwards;
        }
        @keyframes toastOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
        }
        @media print {
            body * {
                visibility: hidden;
            }
            .print-journal,
            .print-journal * {
                visibility: visible;
            }
            .print-journal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background: white;
            }
            .print-journal .no-print {
                display: none !important;
            }
            .print-plan {
                page-break-after: avoid;
            }
        }
        .grade-btn {
            transition: all 0.1s;
            border-radius: 4px;
            font-weight: 600;
        }
        .grade-btn:hover {
            transform: scale(1.08);
        }
        .grade-btn:active {
            transform: scale(0.92);
        }
        .theme-dark input,
        .theme-dark textarea,
        .theme-dark select {
            background: #2a241f;
            color: #f0ebe2;
            border-color: #4a443b;
        }
        input,
        textarea,
        select {
            background: #faf6ed;
            border: 1.5px solid #d4cdc0;
            border-radius: 4px;
            padding: 6px 10px;
            font-size: 14px;
            transition: border-color 0.15s;
        }
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2d5a3d;
        }
        .theme-dark input:focus,
        .theme-dark textarea:focus,
        .theme-dark select:focus {
            border-color: #4a8a5a;
        }
    </style>

            Print: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M18 9H6"/><path d="M18 13v6H6v-6"/><rect x="8" y="14" width="8" height="4"/></svg>,
            PlusCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>,
            Info: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>,
            Pause: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>,
            Play: () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Reset: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9m0 0v6m0-6h-6"/></svg>,
            External: () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>,
        };

        // ---------- Утилиты ----------
        const uid = () => Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
        const today = () => new Date().toISOString().slice(0, 10);
        const formatDate = (d) => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString(
                'ru-RU', { day: 'numeric', month: 'short', year: 'numeric' }); };
        const formatDateShort = (d) => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return dt.toLocaleDateString(
                'ru-RU', { day: 'numeric', month: 'short' }); };
        const formatTime = (t) => t ? t.slice(0, 5) : '';
        const isToday = (d) => d === today();
        const isTomorrow = (d) => { const t = new Date(); t.setDate(t.getDate() + 1); return d === t.toISOString().slice(0,
            10); };
        const isPast = (d) => d < today();
        const getWeekNum = (d) => { const dt = new Date(d + 'T00:00:00'); const start = new Date(dt.getFullYear(), 0, 1);
            const diff = (dt - start + (start.getTimezoneOffset() - dt.getTimezoneOffset()) * 60000) / 86400000; return Math
                .ceil((diff + start.getDay() + 1) / 7); };
        const getWeekStart = (d) => { const dt = new Date(d + 'T00:00:00'); const day = dt.getDay() || 7; dt.setDate(dt
            .getDate() - day + 1); return dt.toISOString().slice(0, 10); };
        const getWeekDays = (d) => { const start = getWeekStart(d); const days = []; for (let i = 0; i < 7; i++) { const dt =
                new Date(start + 'T00:00:00'); dt.setDate(dt.getDate() + i);
            days.push(dt.toISOString().slice(0, 10)); } return days; };
        const cefrLevels = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'];
        const colors = ['#2d5a3d', '#b8860b', '#3a6b8f', '#c0392b', '#8e44ad', '#d4a017', '#1a7a5a', '#a04040'];
        const stickerColors = ['#fef3c7', '#fce4ec', '#e3f2fd', '#e8f5e9', '#fff3e0', '#f3e5f5', '#e0f7fa', '#fbe9e7'];
        const eventTypes = ['Урок', 'Семинар', 'Вебинар', 'Конференция', 'Встреча', 'Экзамен', 'Другое'];
        const statuses = ['Запланировано', 'Проведено', 'Отменено', 'Перенесено'];
        const attendanceOptions = ['Н', 'Б', 'У'];
        const gradeOptions = ['2', '3', '4', '5', '+'];

        // ---------- Хранилище ----------
        const STORAGE_KEY = 'lingvojournal_data';
        const SETTINGS_KEY = 'lingvojournal_settings';

        function getDefaultData() {
            const now = today();
            const groupId1 = uid(),
                groupId2 = uid();
            const studentNames = ['Анна Смирнова', 'Борис Иванов', 'Виктор Петров', 'Галина Сидорова', 'Дмитрий Козлов',
                'Елена Морозова', 'Жанна Новикова', 'Игорь Кузнецов'
            ];
            const studentNames2 = ['Мария Попова', 'Николай Соколов', 'Ольга Лебедева', 'Павел Фёдоров', 'Роман Волков',
                'Светлана Егорова'
            ];
            const topics = ['Приветствия', 'Семья', 'Еда', 'Город', 'Работа', 'Путешествия', 'Погода', 'Хобби'];
            const homeworks = ['Упр. 1-5 стр. 12', 'Составить диалог', 'Подготовить рассказ', 'Выучить слова', 'Письмо другу'];

            const students1 = studentNames.map(n => ({ id: uid(), name: n }));
            const students2 = studentNames2.map(n => ({ id: uid(), name: n }));

            const dateCols = [];
            for (let i = -3; i <= 6; i++) {
                const d = new Date(now + 'T00:00:00');
                d.setDate(d.getDate() + i);
                const ds = d.toISOString().slice(0, 10);
                dateCols.push({
                    date: ds,
                    topic: topics[(i + 4) % topics.length],
                    homework: homeworks[(i + 3) % homeworks.length]
                });
            }

            const grades1 = {};
            students1.forEach(s => {
                grades1[s.id] = {};
                dateCols.forEach(c => {
                    const r = Math.random();
                    if (r > 0.25) {
                        const gs = ['2', '3', '4', '5'];
                        grades1[s.id][c.date] = gs[Math.floor(Math.random() * gs.length)];
                    }
                    if (Math.random() > 0.7) grades1[s.id][c.date + '_att'] = attendanceOptions[Math.floor(Math
                    .random() * 3)];
                });
            });
            const grades2 = {};
            students2.forEach(s => {
                grades2[s.id] = {};
                dateCols.forEach(c => {
                    const r = Math.random();
                    if (r > 0.3) {
                        const gs = ['2', '3', '4', '5'];
                        grades2[s.id][c.date] = gs[Math.floor(Math.random() * gs.length)];
                    }
                    if (Math.random() > 0.7) grades2[s.id][c.date + '_att'] = attendanceOptions[Math.floor(Math
                    .random() * 3)];
                });
            });

            const group1 = {
                id: groupId1,
                name: 'Английский A2',
                language: 'Английский',
                level: 'A2',
                color: colors[0],
                students: students1,
                dateCols: dateCols,
                grades: grades1
            };
            const group2 = {
                id: groupId2,
                name: 'Французский B1',
                language: 'Французский',
                level: 'B1',
                color: colors[2],
                students: students2,
                dateCols: dateCols.slice(0, 7),
                grades: grades2
            };

            const lessons = [];
            for (let i = -2; i <= 8; i++) {
                const d = new Date(now + 'T00:00:00');
                d.setDate(d.getDate() + i);
                const ds = d.toISOString().slice(0, 10);
                const g = i % 2 === 0 ? group1 : group2;
                const stat = i < 0 ? 'Проведено' : (i === 0 ? 'Сегодня' : (i === 1 ? 'Завтра' : 'Запланировано'));
                lessons.push({
                    id: uid(),
                    groupId: g.id,
                    groupName: g.name,
                    date: ds,
                    time: `${8 + (i % 6)}:${i % 2 === 0 ? '00' : '30'}`,
                    topic: topics[(i + 2) % topics.length],
                    homework: homeworks[(i + 1) % homeworks.length],
                    status: stat
                });
            }

            const plans = [];
            for (let i = 0; i < 4; i++) {
                const d = new Date(now + 'T00:00:00');
                d.setDate(d.getDate() + i * 2 - 1);
                plans.push({
                    id: uid(),
                    topic: topics[(i + 3) % topics.length] + ' (план)',
                    date: d.toISOString().slice(0, 10),
                    duration: 45 + i * 15,
                    goals: 'Цель: развитие навыков говорения',
                    equipment: 'Доска, проектор, раздаточный материал',
                    rating: 4 + (i % 2),
                    reflection: 'Урок прошёл хорошо, студенты активно участвовали.',
                    sections: ['Введение', 'Основная часть', 'Закрепление'],
                    vocabulary: [{ word: 'hello', translation: 'привет' }, { word: 'goodbye', translation: 'до свидания' }],
                    links: ['https://example.com'],
                    files: [],
                    sticker: stickerColors[i % stickerColors.length],
                    createdAt: now
                });
            }

            const events = [];
            for (let i = -1; i <= 5; i++) {
                const d = new Date(now + 'T00:00:00');
                d.setDate(d.getDate() + i * 2);
                events.push({
                    id: uid(),
                    type: eventTypes[i % eventTypes.length],
                    title: eventTypes[i % eventTypes.length] + ' ' + (i + 1),
                    date: d.toISOString().slice(0, 10),
                    location: 'Ауд. ' + (10 + i * 3),
                    groups: [i % 2 === 0 ? group1.name : group2.name],
                    status: statuses[i % statuses.length],
                    description: 'Описание мероприятия'
                });
            }

            const stickers = [
                { id: uid(), content: 'Проверить ДЗ у группы А2', color: stickerColors[0], createdAt: now },
                { id: uid(), content: 'Подготовить материалы для B1', color: stickerColors[2], createdAt: now },
                { id: uid(), content: 'Встреча с родителями 25.04', color: stickerColors[4], createdAt: now },
            ];

            return {
                groups: [group1, group2],
                lessons: lessons,
                plans: plans,
                events: events,
                stickers: stickers,
                settings: { theme: 'light' }
            };
        }

        let data = null;
        let settings = { theme: 'light' };

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.groups) {
                        data = parsed;
                        settings = data.settings || { theme: 'light' };
                        return;
                    }
                }
            } catch (e) { /* ignore */ }
            data = getDefaultData();
            settings = data.settings || { theme: 'light' };
            saveData();
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
                broadcast('save');
            } catch (e) { /* ignore */ }
        }

        function broadcast(action, payload) {
            try {
                const bc = new BroadcastChannel('lingvojournal');
                bc.postMessage({ action, payload, timestamp: Date.now() });
                bc.close();
            } catch (e) { /* ignore */ }
        }

        function sanitize(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/[<>]/g, '').trim();
        }

        // ---------- Контекст ----------
        const AppContext = React.createContext(null);

        // ---------- Компонент: Toast ----------
        function ToastSystem({ toasts, removeToast }) {
            return (
                <div className="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full">
                    {toasts.map((t) => (
                        <div
                            key={t.id}
                            className={`toast paper-bg paper-border p-4 rounded-md shadow-lg flex items-start gap-3 ${t.type === 'error' ? 'border-red-500 border-l-4' : t.type === 'success' ? 'border-green-600 border-l-4' : 'border-ochre border-l-4'}`}
                            style={{ animation: 'toastIn 0.3s ease-out' }}
                        >
                            <span className="flex-1 text-sm">{t.message}</span>
                            <button onClick={() => removeToast(t.id)} className="text-gray-400 hover:text-gray-600 flex-shrink-0">
                                <Icons.Close />
                            </button>
                        </div>
                    ))}
                </div>
            );
        }

        // ---------- Компонент: Модалка подтверждения ----------
        function ConfirmModal({ isOpen, title, message, onConfirm, onCancel }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm">
                    <div className="paper-bg paper-border p-6 rounded-md max-w-md w-full shadow-xl fade-in">
                        <h3 className="font-unbounded text-lg font-bold mb-2">{title}</h3>
                        <p className="text-gray-600 text-sm mb-6">{message}</p>
                        <div className="flex gap-3 justify-end">
                            <button onClick={onCancel} className="btn-outline px-4 py-2 rounded-md text-sm">Отмена</button>
                            <button onClick={onConfirm} className="btn-primary px-4 py-2 rounded-md text-sm">Подтвердить</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- Компонент: Онбординг ----------
        function Onboarding({ onComplete, currentStep, setStep }) {
            const steps = [
                { title: 'Добро пожаловать!', desc: 'ЛингвоЖурнал — ваш персональный помощник для ведения занятий.' },
                { title: 'Журнал', desc: 'Ведите учёт посещаемости и оценок. Отмечайте Н/Б/У и ставьте оценки 2–5.' },
                { title: 'Конспекты', desc: 'Создавайте планы уроков, добавляйте разделы, словарь, ссылки и файлы.' },
                { title: 'Планировщик', desc: 'Управляйте расписанием, отслеживайте статусы и экспортируйте в календарь.' },
            ];
            if (currentStep >= steps.length) {
                onComplete();
                return null;
            }
            const s = steps[currentStep];
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
                    <div className="paper-bg paper-border p-8 rounded-md max-w-md w-full shadow-xl fade-in">
                        <div className="flex items-center gap-2 mb-2">
                            <span className="text-xs font-medium text-gray-400">{currentStep+1}/{steps.length}</span>
                            <div className="flex-1 h-1 bg-gray-200 rounded">
                                <div className="h-1 bg-green-600 rounded transition-all" style={{ width: `${((currentStep+1)/steps.length)*100}%` }} />
                            </div>
                        </div>
                        <h3 className="font-unbounded text-lg font-bold mb-2">{s.title}</h3>
                        <p className="text-gray-600 text-sm mb-6">{s.desc}</p>
                        <div className="flex gap-3 justify-end">
                            <button onClick={() => { if (currentStep === steps.length-1) onComplete(); else setStep(currentStep+1); }} className="btn-primary px-6 py-2 rounded-md text-sm">
                                {currentStep === steps.length - 1 ? 'Начать' : 'Далее'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- Компонент: Глобальный поиск ----------
        function GlobalSearch({ onSelect }) {
            const [query, setQuery] = useState('');
            const [results, setResults] = useState([]);
            const [isOpen, setIsOpen] = useState(false);
            const inputRef = useRef(null);

            useEffect(() => {
                if (!query.trim() || !data) {
                    setResults([]);
                    return;
                }
                const q = query.toLowerCase().trim();
                const found = [];
                data.groups.forEach(g => {
                    g.students.forEach(s => {
                        if (s.name.toLowerCase().includes(q)) {
                            found.push({ student: s, group: g });
                        }
                    });
                });
                setResults(found.slice(0, 8));
                setIsOpen(found.length > 0);
            }, [query]);

            const handleSelect = (item) => {
                onSelect(item);
                setQuery('');
                setResults([]);
                setIsOpen(false);
            };

            return (
                <div className="relative">
                    <div className="flex items-center gap-2 bg-white/70 paper-border rounded-md px-3 py-1.5">
                        <Icons.Search />
                        <input
                            ref={inputRef}
                            type="text"
                            placeholder="Поиск ученика..."
                            className="bg-transparent border-0 outline-none text-sm w-44"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                            onFocus={() => { if (query.trim()) setIsOpen(true); }}
                            onBlur={() => setTimeout(() => setIsOpen(false), 200)}
                        />
                    </div>
                    {isOpen && results.length > 0 && (
                        <div className="absolute top-full left-0 mt-1 w-64 paper-bg paper-border rounded-md shadow-lg z-30 max-h-56 overflow-y-auto">

                                    <span className="text-gray-400 text-xs">{r.group.name}</span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ============================================================

        // ---------- Вкладка: Обзор ----------

                    <div className="card rounded-md p-4">

                        ) : (

        // ---------- Вкладка: Журнал ----------
        function TabJournal() {
            const [selectedGroupId, setSelectedGroupId] = useState(data.groups && data.groups.length > 0 ? data.groups[0].id :
            null);
            const [popover, setPopover] = useState(null);
            const [printMode, setPrintMode] = useState(false);

            const group = data.groups?.find(g => g.id === selectedGroupId);
            if (!group) return <div className="text-gray-400 text-center py-12">Выберите группу</div>;

            const students = group.students || [];
            const dateCols = group.dateCols || [];
            const grades = group.grades || {};

            const getGrade = (studentId, date) => {
                const row = grades[studentId];
                if (!row) return null;
                return row[date] || null;
            };
            const getAtt = (studentId, date) => {
                const row = grades[studentId];
                if (!row) return null;
                return row[date + '_att'] || null;
            };
            const setGrade = (studentId, date, val) => {
                if (!data) return;
                const g = data.groups.find(gr => gr.id === selectedGroupId);
                if (!g) return;
                if (!g.grades[studentId]) g.grades[studentId] = {};
                if (val === null) {
                    delete g.grades[studentId][date];
                    delete g.grades[studentId][date + '_att'];
                } else if (attendanceOptions.includes(val)) {
                    g.grades[studentId][date + '_att'] = val;
                } else {
                    g.grades[studentId][date] = val;
                }
                saveData();
                setPopover(null);
            };

            const avgStudent = (studentId) => {
                const row = grades[studentId] || {};
                let sum = 0,
                    count = 0;
                dateCols.forEach(c => {
                    const v = row[c.date];
                    if (v && v !== '+' && !attendanceOptions.includes(v)) {
                        const n = parseFloat(v);
                        if (!isNaN(n)) { sum += n;
                            count++; }
                    } else if (v === '+') { sum += 0.1;
                        count++; }
                });
                return count > 0 ? (sum / count).toFixed(2) : '—';
            };

            const avgDay = (date) => {
                let sum = 0,
                    count = 0;
                students.forEach(s => {
                    const v = getGrade(s.id, date);
                    if (v && v !== '+' && !attendanceOptions.includes(v)) {
                        const n = parseFloat(v);
                        if (!isNaN(n)) { sum += n;
                            count++; }
                    } else if (v === '+') { sum += 0.1;
                        count++; }
                });
                return count > 0 ? (sum / count).toFixed(2) : '—';
            };

            const avgGroup = () => {
                let sum = 0,
                    count = 0;
                students.forEach(s => {
                    const row = grades[s.id] || {};
                    dateCols.forEach(c => {
                        const v = row[c.date];
                        if (v && v !== '+' && !attendanceOptions.includes(v)) {
                            const n = parseFloat(v);
                            if (!isNaN(n)) { sum += n;
                                count++; }
                        } else if (v === '+') { sum += 0.1;
                            count++; }
                    });
                });
                return count > 0 ? (sum / count).toFixed(2) : '—';
            };

            const handlePrint = () => {
                setPrintMode(true);
                setTimeout(() => {
                    window.print();
                    setTimeout(() => setPrintMode(false), 500);
                }, 300);
            };

            return (
                <div className="space-y-4 fade-in">
                    <div className="flex flex-wrap gap-2">
                        {data.groups?.map(g => (
                            <button
                                key={g.id}
                                className={`px-4 py-1.5 rounded-md text-sm font-medium transition-all ${selectedGroupId === g.id ? 'chip-green' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}
                                onClick={() => setSelectedGroupId(g.id)}
                            >
                                {g.name} ({g.level})
                            </button>
                        ))}
                    </div>

                    <div className="flex items-center justify-between flex-wrap gap-2">
                        <div className="flex items-center gap-3 text-sm">
                            <span className="text-gray-500">Ср. учеников: <span className="font-medium text-gray-700">{avgGroup()}</span></span>
                            <span className="text-gray-400">|</span>
                            <span className="text-gray-500">Ср. дня: <span className="font-medium text-gray-700">{dateCols.length > 0 ?
                                    avgDay(dateCols[dateCols.length - 1].date) : '—'}</span></span>
                        </div>
                        <button onClick={handlePrint} className="btn-secondary px-4 py-1.5 rounded-md text-sm flex items-center gap-2">
                            <Icons.Print /> Печать
                        </button>
                    </div>

                    <div className="overflow-x-auto paper-border rounded-md">
                        <table className="w-full text-sm border-collapse">
                            <thead className="bg-gray-100">
                                <tr>
                                    <th className="sticky left-0 z-10 bg-gray-100 p-2 text-left font-medium border-b border-r min-w-[120px]">
                                        Ученик
                                    </th>
                                    <th className="sticky left-[120px] z-10 bg-gray-100 p-2 text-left font-medium border-b border-r min-w-[80px]">
                                        Ср.
                                    </th>
                                    {dateCols.map(c => (
                                        <th key={c.date} className="p-2 text-center font-medium border-b border-r min-w-[80px]">
                                            <div className="text-xs">{formatDateShort(c.date)}</div>
                                            <div className="text-[10px] font-normal text-gray-400 truncate max-w-[70px]">
                                                {c.topic || '—'}
                                            </div>
                                            <div className="text-[10px] font-normal text-gray-300 truncate max-w-[70px]">
                                                ДЗ: {c.homework || '—'}
                                            </div>
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {students.map(s => {
                                    const avg = avgStudent(s.id);
                                    return (
                                        <tr key={s.id} className="hover:bg-gray-50">
                                            <td className="sticky left-0 z-10 bg-white p-2 border-b border-r font-medium">
                                                {s.name}
                                            </td>
                                            <td className="sticky left-[120px] z-10 bg-white p-2 text-center border-b border-r font-bold text-green-700">
                                                {avg}
                                            </td>
                                            {dateCols.map(c => {
                                                const g = getGrade(s.id, c.date);
                                                const att = getAtt(s.id, c.date);
                                                const display = att || g || '—';
                                                const isAtt = attendanceOptions.includes(att);
                                                return (
                                                    <td
                                                        key={c.date}
                                                        className="p-1 text-center border-b border-r cursor-pointer hover:bg-gray-50 relative"
                                                        onClick={(e) => {
                                                            const rect = e.currentTarget
                                                                .getBoundingClientRect();
                                                            setPopover({
                                                                studentId: s.id,
                                                                date: c.date,
                                                                x: rect.left + rect.width / 2,
                                                                y: rect.top + rect.height
                                                            });
                                                        }}
                                                    >
                                                        <span
                                                            className={`inline-block px-2 py-0.5 rounded text-xs font-medium ${isAtt ? 'bg-gray-200' : g === '+' ? 'text-yellow-600' : g ? 'text-green-700' : 'text-gray-300'}`}
                                                            style={isAtt ? {} : { fontWeight: g ? 'bold' : 'normal' }}
                                                        >
                                                            {display}
                                                        </span>
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {popover && (
                        <div
                            className="fixed z-40 popover-enter"
                            style={{ left: popover.x - 80, top: popover.y + 6 }}
                        >
                            <div className="paper-bg paper-border rounded-md shadow-xl p-3 w-48">
                                <div className="grid grid-cols-3 gap-1 mb-2">
                                    {gradeOptions.map(g => (
                                        <button
                                            key={g}
                                            className={`grade-btn px-2 py-1 text-sm ${g === '+' ? 'text-yellow-600 bg-yellow-50' : 'bg-gray-100 hover:bg-gray-200'}`}
                                            onClick={() => setGrade(popover.studentId, popover.date, g)}
                                        >
                                            {g}
                                        </button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-3 gap-1 mb-2">
                                    {attendanceOptions.map(a => (
                                        <button
                                            key={a}
                                            className="grade-btn px-2 py-1 text-sm bg-blue-50 hover:bg-blue-100 text-blue-700"
                                            onClick={() => setGrade(popover.studentId, popover.date, a)}
                                        >
                                            {a}
                                        </button>
                                    ))}
                                </div>
                                <button
                                    className="w-full text-xs text-red-500 hover:text-red-700 py-1 border-t border-gray-200 mt-1"
                                    onClick={() => setGrade(popover.studentId, popover.date, null)}
                                >
                                    ✕ Стереть
                                </button>
                            </div>
                        </div>
                    )}

                    {printMode && (
                        <div className="print-journal">
                            <div className="p-8">
                                <h2 className="font-unbounded text-xl font-bold mb-4">{group.name} — Журнал</h2>
                                <table className="w-full text-sm border-collapse">
                                    <thead>
                                        <tr>
                                            <th className="border p-1 text-left">Ученик</th>
                                            {dateCols.map(c => (
                                                <th key={c.date} className="border p-1 text-center text-xs">
                                                    {formatDateShort(c.date)}
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {students.map(s => (
                                            <tr key={s.id}>
                                                <td className="border p-1 font-medium">{s.name}</td>
                                                {dateCols.map(c => {
                                                    const g = getGrade(s.id, c.date);
                                                    const att = getAtt(s.id, c.date);
                                                    return <td key={c.date} className="border p-1 text-center">{att || g || '—'}</td>;
                                                })}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ---------- Вкладка: Конспекты ----------
        function TabPlans() {
            const [selectedPlan, setSelectedPlan] = useState(null);
            const [editorOpen, setEditorOpen] = useState(false);
            const [newSection, setNewSection] = useState('');
            const [newVocab, setNewVocab] = useState({ word: '', translation: '' });
            const [newLink, setNewLink] = useState('');

            const plans = data.plans || [];

            const openEditor = (plan) => {
                setSelectedPlan(plan || { id: uid(), topic: '', date: today(), duration: 45, goals: '', equipment: '',
                        rating: 4, reflection: '', sections: [], vocabulary: [], links: [], files: [], sticker: stickerColors[
                            0], createdAt: today() });
                setEditorOpen(true);
            };

            const savePlan = () => {
                if (!selectedPlan) return;
                if (!selectedPlan.topic.trim()) { showToast('Введите тему конспекта', 'error'); return; }
                if (selectedPlan.id.startsWith('_')) {
                    data.plans.push({ ...selectedPlan, id: uid() });
                } else {
                    const idx = data.plans.findIndex(p => p.id === selectedPlan.id);
                    if (idx >= 0) data.plans[idx] = selectedPlan;
                }
                saveData();
                setEditorOpen(false);
                setSelectedPlan(null);
                showToast('Конспект сохранён', 'success');
            };

            const deletePlan = (id) => {
                if (!confirm('Удалить конспект?')) return;
                data.plans = data.plans.filter(p => p.id !== id);
                saveData();
                showToast('Конспект удалён', 'success');
            };

            const addSection = () => {
                if (!newSection.trim()) return;
                if (!selectedPlan) return;
                selectedPlan.sections.push(newSection.trim());
                setNewSection('');
            };
            const removeSection = (idx) => {
                if (!selectedPlan) return;
                selectedPlan.sections.splice(idx, 1);
            };
            const addVocab = () => {
                if (!newVocab.word.trim() || !newVocab.translation.trim()) return;
                if (!selectedPlan) return;
                selectedPlan.vocabulary.push({ ...newVocab });
                setNewVocab({ word: '', translation: '' });
            };
            const removeVocab = (idx) => {
                if (!selectedPlan) return;
                selectedPlan.vocabulary.splice(idx, 1);
            };
            const addLink = () => {
                if (!newLink.trim()) return;
                if (!selectedPlan) return;
                selectedPlan.links.push(newLink.trim());
                setNewLink('');
            };
            const removeLink = (idx) => {
                if (!selectedPlan) return;
                selectedPlan.links.splice(idx, 1);
            };

            return (

                    <div className="flex items-center justify-between">

                            <Icons.Plus /> Новый конспект
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 cascade-in">
                        {plans.map(p => (
                            <div key={p.id} className="card rounded-md p-4 cursor-pointer hover:shadow-md" onClick={() => openEditor(p)}>
                                <div className="flex items-start justify-between">
                                    <div className="flex-1">
                                        <h3 className="font-unbounded font-bold text-base">{p.topic || 'Без темы'}</h3>
                                        <p className="text-xs text-gray-400">{formatDate(p.date) || '—'}</p>
                                        <div className="flex flex-wrap gap-1 mt-2">
                                            <span className="text-xs bg-gray-100 px-2 py-0.5 rounded">⏱ {p.duration || 45}мин</span>
                                            {p.rating && <span className="text-xs bg-yellow-100 px-2 py-0.5 rounded">⭐ {p.rating}</span>}
                                        </div>
                                    </div>
                                    <button
                                        className="text-gray-400 hover:text-red-500 p-1"
                                        onClick={(e) => { e.stopPropagation(); deletePlan(p.id); }}
                                    >
                                        <Icons.Trash />
                                    </button>
                                </div>
                                {p.sections && p.sections.length > 0 && <div className="mt-2 text-xs text-gray-400">Разделы: {p.sections.length}</div>}
                                {p.vocabulary && p.vocabulary.length > 0 && <div className="mt-1 text-xs text-gray-400">Слова: {p.vocabulary.length}</div>}
                            </div>

                    </div>

                    {plans.length === 0 && <div className="text-center py-12 text-gray-400">Нет конспектов. Создайте первый!</div>}

                    {editorOpen && selectedPlan && (
                        <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="paper-bg paper-border rounded-md w-full max-w-3xl max-h-[90vh] overflow-y-auto p-6 shadow-xl">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-unbounded font-bold text-lg">{selectedPlan.id.startsWith('_') ? 'Новый конспект' : 'Редактировать конспект'}</h3>
                                    <button onClick={() => { setEditorOpen(false); setSelectedPlan(null); }} className="text-gray-400 hover:text-gray-600">
                                        <Icons.Close />
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <div>
                                        <label className="text-sm font-medium">Тема *</label>
                                        <input
                                            type="text"
                                            className="w-full"
                                            value={selectedPlan.topic || ''}
                                            onChange={(e) => setSelectedPlan({ ...selectedPlan, topic: e.target.value })}
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-sm font-medium">Дата</label>
                                            <input
                                                type="date"
                                                className="w-full"
                                                value={selectedPlan.date || ''}
                                                onChange={(e) => setSelectedPlan({ ...selectedPlan, date: e.target.value })}
                                            />
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium">Длительность (мин)</label>
                                            <input
                                                type="number"
                                                className="w-full"
                                                value={selectedPlan.duration || 45}
                                                onChange={(e) => setSelectedPlan({ ...selectedPlan, duration: parseInt(e.target.value) || 45 })}
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium">Цели</label>
                                        <textarea
                                            className="w-full"
                                            rows={2}

                                            onChange={(e) => setSelectedPlan({ ...selectedPlan, goals: e.target.value })}

                                        <textarea
                                            className="w-full"
                                            rows={2}
                                            value={selectedPlan.equipment || ''}
                                            onChange={(e) => setSelectedPlan({ ...selectedPlan, equipment: e.target.value })}
                                        />
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium">Оценка за урок (1-5)</label>
                                        <input
                                            type="number"
                                            className="w-full"
                                            min={1}
                                            max={5}
                                            value={selectedPlan.rating || 4}
                                            onChange={(e) => setSelectedPlan({ ...selectedPlan, rating: parseInt(e.target.value) || 4 })}
                                        />
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium">Рефлексия</label>
                                        <textarea
                                            className="w-full"
                                            rows={2}
                                            value={selectedPlan.reflection || ''}
                                            onChange={(e) => setSelectedPlan({ ...selectedPlan, reflection: e.target.value })}
                                        />

                                    <div>

                                                placeholder="Новый раздел"

                                                onKeyDown={(e) => { if (e.key === 'Enter') addSection(); }}

                                </div>
                            </div>
                        </div>
                    )}

        // ---------- Вкладка: Группы ----------
        function TabGroups() {
            const [editingGroup, setEditingGroup] = useState(null);
            const [newStudent, setNewStudent] = useState('');
            const [editingStudent, setEditingStudent] = useState(null);

            const groups = data.groups || [];

            const updateGroup = (id, field, value) => {
                const g = data.groups.find(gr => gr.id === id);
                if (!g) return;
                g[field] = value;
                saveData();
            };

            const addStudent = (groupId) => {
                if (!newStudent.trim()) return;
                const g = data.groups.find(gr => gr.id === groupId);
                if (!g) return;
                g.students.push({ id: uid(), name: newStudent.trim() });
                setNewStudent('');
                saveData();
                showToast('Ученик добавлен', 'success');
            };

            const removeStudent = (groupId, studentId) => {
                if (!confirm('Удалить ученика?')) return;
                const g = data.groups.find(gr => gr.id === groupId);

        function TabPlanner() {
            const [filter, setFilter] = useState('all');

            const sections = {
                overdue: lessons.filter(l => l.date < now && l.status !== 'Проведено' && l.status !== 'Отменено'),
                today: lessons.filter(l => l.date === now && l.status !== 'Проведено' && l.status !== 'Отменено'),
                tomorrow: lessons.filter(l => isTomorrow(l.date) && l.status !== 'Проведено' && l.status !== 'Отменено'),
                week: lessons.filter(l => {
                    const d = l.date;
                    if (d <= now || isTomorrow(d) || isToday(d)) return false;
                    const weekEnd = new Date(now + 'T00:00:00');
                    weekEnd.setDate(weekEnd.getDate() + 7);
                    return d < weekEnd.toISOString().slice(0, 10) && l.status !== 'Проведено' && l.status !== 'Отменено';
                }),
                later: lessons.filter(l => {
                    const weekEnd = new Date(now + 'T00:00:00');
                    weekEnd.setDate(weekEnd.getDate() + 7);
                    return l.date >= weekEnd.toISOString().slice(0, 10) && l.status !== 'Проведено' && l.status !== 'Отменено';
                }),
                completed: lessons.filter(l => l.status === 'Проведено')
