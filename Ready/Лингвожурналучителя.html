        // ---------- Вкладка: Аналитика ----------
        function TabAnalytics() {
            const groups = data.groups || [];
            const now = today();

            const calcStats = (g) => {
                const students = g.students || [];
                const grades = g.grades || {};
                const dateCols = g.dateCols || [];
                let total = 0,
                    count = 0,
                    attPresent = 0,
                    attTotal = 0;
                const studentAvgs = [];
                students.forEach(s => {
                    let sum = 0,
                        cnt = 0;
                    dateCols.forEach(c => {
                        const v = grades[s.id]?.[c.date];
                        if (v && v !== '+' && !attendanceOptions.includes(v)) {
                            const n = parseFloat(v);
                            if (!isNaN(n)) { sum += n;
                                cnt++; }
                        } else if (v === '+') { sum += 0.1;
                            cnt++; }
                        const att = grades[s.id]?.[c.date + '_att'];
                        if (att) { attTotal++;
                            attPresent++; }
                    });
                    const avg = cnt > 0 ? sum / cnt : 0;
                    studentAvgs.push({ student: s, avg, count: cnt });
                    total += sum;
                    count += cnt;
                });
                const overall = count > 0 ? total / count : 0;
                const attendance = attTotal > 0 ? (attPresent / attTotal) * 100 : 0;
                studentAvgs.sort((a, b) => b.avg - a.avg);
                const strongest = studentAvgs.slice(0, 3).map(s => s.student.name);
                const weakest = studentAvgs.filter(s => s.count > 0).slice(-3).reverse().map(s => s.student.name);
                return { overall, attendance, strongest, weakest, studentAvgs };
            };

            return (
                <div className="space-y-6 fade-in">
                    <h2 className="font-unbounded text-xl font-bold">📊 Аналитика</h2>

                    {groups.map(g => {
                        const stats = calcStats(g);
                        return (
                            <div key={g.id} className="card rounded-md p-4">
                                <h3 className="font-unbounded font-bold text-lg">{g.name}</h3>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-3">
                                    <div className="bg-gray-50 rounded-md p-3 text-center">
                                        <div className="text-2xl font-bold text-green-700">{stats.overall.toFixed(2)}</div>
                                        <div className="text-xs text-gray-400">Ср. балл</div>
                                    </div>
                                    <div className="bg-gray-50 rounded-md p-3 text-center">
                                        <div className="text-2xl font-bold text-blue-600">{stats.attendance.toFixed(0)}%</div>
                                        <div className="text-xs text-gray-400">Посещаемость</div>
                                    </div>
                                    <div className="bg-gray-50 rounded-md p-3 text-center">
                                        <div className="text-sm font-bold text-green-600">{stats.strongest.join(', ') || '—'}</div>
                                        <div className="text-xs text-gray-400">Сильнейшие</div>
                                    </div>
                                    <div className="bg-gray-50 rounded-md p-3 text-center">
                                        <div className="text-sm font-bold text-red-600">{stats.weakest.join(', ') || '—'}</div>
                                        <div className="text-xs text-gray-400">Требуют внимания</div>
                                    </div>
                                </div>
                            </div>
                        );
                    })}

                    {groups.length === 0 && <div className="text-center py-12 text-gray-400">Нет данных для аналитики</div>}
                </div>
            );
        }

        // ---------- Вкладка: Данные ----------
        function TabData() {
            const [syncStatus, setSyncStatus] = useState('Синхронизировано');
            const [importMode, setImportMode] = useState('replace');

            const exportJSON = () => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lingvojournal_backup_${today()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Экспорт JSON выполнен', 'success');
            };

            const exportCSV = () => {
                let csv = '\uFEFF';
                const groups = data.groups || [];
                groups.forEach(g => {
                    csv += `Группа;${g.name};${g.language};${g.level}\n`;
                    csv += 'Ученик;';
                    (g.dateCols || []).forEach(c => { csv += `${formatDateShort(c.date)};`; });
                    csv += 'Средний\n';
                    (g.students || []).forEach(s => {
                        csv += `${s.name};`;
                        let sum = 0,
                            cnt = 0;
                        (g.dateCols || []).forEach(c => {
                            const v = g.grades[s.id]?.[c.date];
                            if (v && v !== '+' && !attendanceOptions.includes(v)) {
                                const n = parseFloat(v);
                                if (!isNaN(n)) { sum += n;
                                    cnt++; }
                            } else if (v === '+') { sum += 0.1;
                                cnt++; }
                            const att = g.grades[s.id]?.[c.date + '_att'];
                            csv += `${att || v || ''};`;
                        });
                        csv += `${cnt > 0 ? (sum/cnt).toFixed(2) : ''}\n`;
                    });
                    csv += '\n';
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `lingvojournal_export_${today()}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Экспорт CSV выполнен', 'success');
            };

            const handleImport = (file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!imported.groups || !Array.isArray(imported.groups)) {
                            showToast('Неверный формат файла', 'error');
                            return;
                        }
                        if (importMode === 'replace') {
                            data.groups = imported.groups || [];
                            data.lessons = imported.lessons || [];
                            data.plans = imported.plans || [];
                            data.events = imported.events || [];
                            data.stickers = imported.stickers || [];
                        } else {
                            imported.groups?.forEach(g => {
                                if (!data.groups.find(gr => gr.id === g.id)) data.groups.push(g);
                            });
                            imported.lessons?.forEach(l => {
                                if (!data.lessons.find(ls => ls.id === l.id)) data.lessons.push(l);
                            });
                            imported.plans?.forEach(p => {
                                if (!data.plans.find(pl => pl.id === p.id)) data.plans.push(p);
                            });
                            imported.events?.forEach(e => {
                                if (!data.events.find(ev => ev.id === e.id)) data.events.push(e);
                            });
                            imported.stickers?.forEach(s => {
                                if (!data.stickers.find(st => st.id === s.id)) data.stickers.push(s);
                            });
                        }
                        saveData();
                        showToast('Импорт выполнен успешно', 'success');
                    } catch (err) {
                        showToast('Ошибка при импорте: ' + err.message, 'error');
                    }
                };
                reader.readAsText(file);
            };

            const resetDemo = () => {
                if (!confirm('Загрузить демо-данные? Текущие данные будут заменены.')) return;
                data = getDefaultData();
                saveData();
                showToast('Демо-данные загружены', 'success');
            };

            const clearAll = () => {
                if (!confirm('Удалить все данные? Это действие необратимо.')) return;
                data = { groups: [], lessons: [], plans: [], events: [], stickers: [], settings: { theme: 'light' } };
                saveData();
                showToast('Все данные удалены', 'success');
            };

            return (
                <div className="space-y-6 fade-in">
                    <h2 className="font-unbounded text-xl font-bold">💾 Управление данными</h2>

                    <div className="card rounded-md p-4">
                        <h3 className="font-unbounded font-bold text-lg mb-3">Экспорт</h3>
                        <div className="flex flex-wrap gap-3">
                            <button onClick={exportJSON} className="btn-primary px-4 py-2 rounded-md text-sm flex items-center gap-2">
                                <Icons.Download /> JSON-бэкап
                            </button>
                            <button onClick={exportCSV} className="btn-primary px-4 py-2 rounded-md text-sm flex items-center gap-2">
                                <Icons.Download /> CSV (Excel)
                            </button>
                        </div>
                    </div>

                    <div className="card rounded-md p-4">
                        <h3 className="font-unbounded font-bold text-lg mb-3">Импорт</h3>
                        <div className="flex flex-wrap gap-3 items-center">
                            <select className="text-sm" value={importMode} onChange={(e) => setImportMode(e.target.value)}>
                                <option value="replace">Заменить</option>
                                <option value="merge">Объединить</option>
                            </select>
                            <label className="btn-secondary px-4 py-2 rounded-md text-sm flex items-center gap-2 cursor-pointer">
                                <Icons.Upload /> Выбрать файл
                                <input
                                    type="file"
                                    accept=".json"
                                    className="hidden"
                                    onChange={(e) => { if (e.target.files[0]) handleImport(e.target.files[0]); }}
                                />
                            </label>
                            <div className="text-xs text-gray-400">или перетащите файл сюда</div>
                        </div>
                    </div>

                    <div className="card rounded-md p-4">
                        <h3 className="font-unbounded font-bold text-lg mb-3">Сервис</h3>
                        <div className="flex flex-wrap gap-3">
                            <button onClick={resetDemo} className="btn-outline px-4 py-2 rounded-md text-sm">🔄 Демо-данные</button>
                            <button onClick={clearAll} className="px-4 py-2 rounded-md text-sm bg-red-100 text-red-600 hover:bg-red-200">🗑️ Очистить всё</button>
                        </div>
                    </div>

                    <div className="text-xs text-gray-400 flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-green-600 pulse-sync" />
                        {syncStatus} • {new Date().toLocaleTimeString()}
                    </div>
                </div>
            );
        }

        // ---------- Плавающие кнопки ----------
        function FloatingButtons() {
            const [rouletteOpen, setRouletteOpen] = useState(false);
            const [timerOpen, setTimerOpen] = useState(false);
            const [timerRunning, setTimerRunning] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(60);
            const [timerTotal, setTimerTotal] = useState(60);
            const [timerPaused, setTimerPaused] = useState(false);
            const [lastStudent, setLastStudent] = useState(null);
            const [currentStudent, setCurrentStudent] = useState(null);
            const timerInterval = useRef(null);

            const allStudents = useMemo(() => {
                const list = [];
                data.groups?.forEach(g => {
                    g.students?.forEach(s => {
                        list.push({ student: s, group: g });
                    });
                });
                return list;
            }, [data]);

            const pickRandom = () => {
                if (allStudents.length === 0) { showToast('Нет учеников', 'error'); return; }
                let available = allStudents;
                if (lastStudent) {
                    available = allStudents.filter(s => s.student.id !== lastStudent.student.id);
                }
                if (available.length === 0) available = allStudents;
                const picked = available[Math.floor(Math.random() * available.length)];
                setLastStudent(picked);
                setCurrentStudent(picked);
                showToast(`🎲 ${picked.student.name} (${picked.group.name})`, 'success');
            };

            const startTimer = (secs) => {
                setTimerTotal(secs);
                setTimerSeconds(secs);
                setTimerRunning(true);
                setTimerPaused(false);
                if (timerInterval.current) clearInterval(timerInterval.current);
                timerInterval.current = setInterval(() => {
                    setTimerSeconds(prev => {
                        if (prev <= 1) {
                            clearInterval(timerInterval.current);
                            setTimerRunning(false);
                            showToast('⏰ Время вышло!', 'success');
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
            };

            const pauseTimer = () => {
                if (timerPaused) {
                    setTimerPaused(false);
                    timerInterval.current = setInterval(() => {
                        setTimerSeconds(prev => {
                            if (prev <= 1) {
                                clearInterval(timerInterval.current);
                                setTimerRunning(false);
                                showToast('⏰ Время вышло!', 'success');
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    setTimerPaused(true);
                    if (timerInterval.current) clearInterval(timerInterval.current);
                }
            };

            const resetTimer = () => {
                if (timerInterval.current) clearInterval(timerInterval.current);
                setTimerRunning(false);
                setTimerPaused(false);
                setTimerSeconds(timerTotal);
            };

            const addMinute = () => {
                setTimerSeconds(prev => prev + 60);
                setTimerTotal(prev => prev + 60);
            };

            const circleSize = 56;
            const strokeWidth = 4;
            const radius = (circleSize - strokeWidth) / 2;
            const circumference = 2 * Math.PI * radius;
            const progress = timerTotal > 0 ? (timerSeconds / timerTotal) : 1;
            const dashOffset = circumference * (1 - progress);

            return (
                <>
                    <div className="fixed bottom-6 right-6 flex flex-col gap-3 z-40">
                        <button
                            onClick={() => { setRouletteOpen(!rouletteOpen); setTimerOpen(false); }}
                            className="btn-float w-12 h-12 rounded-full bg-green-600 text-white flex items-center justify-center"
                            title="Случайный ученик"
                        >
                            <Icons.Random />
                        </button>
                        <button
                            onClick={() => { setTimerOpen(!timerOpen); setRouletteOpen(false); }}
                            className="btn-float w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center"
                            title="Таймер"
                        >
                            <Icons.Timer />
                        </button>
                    </div>

                    {rouletteOpen && (
                        <div className="fixed bottom-28 right-6 w-64 paper-bg paper-border rounded-md shadow-xl p-4 z-40 popover-enter">
                            <div className="flex items-center justify-between mb-3">
                                <span className="font-unbounded font-bold text-sm">🎲 Рулетка</span>
                                <button onClick={() => setRouletteOpen(false)} className="text-gray-400 hover:text-gray-600">
                                    <Icons.Close />
                                </button>
                            </div>
                            {currentStudent && (
                                <div className="bg-gray-100 rounded-md p-2 text-center mb-3">
                                    <div className="font-bold text-lg">{currentStudent.student.name}</div>
                                    <div className="text-xs text-gray-400">{currentStudent.group.name}</div>
                                </div>
                            )}
                            <button onClick={pickRandom} className="btn-primary w-full py-2 rounded-md text-sm">Крутить!</button>
                            {allStudents.length === 0 && <p className="text-xs text-gray-400 text-center mt-2">Нет учеников</p>}
                        </div>
                    )}

                    {timerOpen && (
                        <div className="fixed bottom-28 right-6 w-64 paper-bg paper-border rounded-md shadow-xl p-4 z-40 popover-enter">
                            <div className="flex items-center justify-between mb-3">
                                <span className="font-unbounded font-bold text-sm">⏱️ Таймер</span>
                                <button onClick={() => setTimerOpen(false)} className="text-gray-400 hover:text-gray-600">
                                    <Icons.Close />
                                </button>
                            </div>
                            <div className="flex justify-center mb-3">
                                <svg width={circleSize} height={circleSize} viewBox={`0 0 ${circleSize} ${circleSize}`}>
                                    <circle cx={circleSize/2} cy={circleSize/2} r={radius} fill="none" stroke="#e5e7eb" strokeWidth={strokeWidth} />
                                    <circle
                                        className="ring-progress"
                                        cx={circleSize/2}
                                        cy={circleSize/2}
                                        r={radius}
                                        fill="none"
                                        stroke="#2d5a3d"
                                        strokeWidth={strokeWidth}
                                        strokeDasharray={circumference}
                                        strokeDashoffset={dashOffset}
                                        strokeLinecap="round"
                                    />
                                    <text x={circleSize/2} y={circleSize/2 + 6} textAnchor="middle" className="text-sm font-bold fill-current">
                                        {Math.floor(timerSeconds / 60)}:{String(timerSeconds % 60).padStart(2, '0')}
                                    </text>
                                </svg>
                            </div>
                            <div className="flex gap-2 mb-3 flex-wrap justify-center">
                                {[60, 120, 180, 300].map(s => (
                                    <button
                                        key={s}
                                        onClick={() => { if (!timerRunning) startTimer(s); }}
                                        className="btn-outline px-2 py-0.5 rounded text-xs"
                                        disabled={timerRunning}
                                    >
                                        {Math.floor(s / 60)}м
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-center justify-center gap-2">
                                {!timerRunning ? (
                                    <button onClick={() => startTimer(timerTotal)} className="btn-primary px-4 py-1 rounded-md text-sm">Старт</button>
                                ) : (
                                    <>
                                        <button onClick={pauseTimer} className="btn-secondary px-4 py-1 rounded-md text-sm">
                                            {timerPaused ? '▶' : '⏸'}
                                        </button>
                                        <button onClick={resetTimer} className="btn-outline px-4 py-1 rounded-md text-sm">↺</button>
                                        <button onClick={addMinute} className="btn-outline px-4 py-1 rounded-md text-sm">+1м</button>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        }

        // ---------- Основной компонент приложения ----------
        function App() {
            const [tab, setTab] = useState('overview');
            const [theme, setTheme] = useState(settings.theme || 'light');
            const [toasts, setToasts] = useState([]);
            const [showOnboarding, setShowOnboarding] = useState(true);
            const [onboardStep, setOnboardStep] = useState(0);
            const [searchResult, setSearchResult] = useState(null);

            useEffect(() => {
                loadData();
                setTheme(settings.theme || 'light');
                try {
                    const bc = new BroadcastChannel('lingvojournal');
                    bc.onmessage = (e) => {
                        if (e.data.action === 'save') {
                            loadData();
                            setTheme(settings.theme || 'light');
                            showToast('🔄 Данные синхронизированы', 'success');
                        }
                    };
                    return () => bc.close();
                } catch (e) { /* ignore */ }
            }, []);

            useEffect(() => {
                const interval = setInterval(() => {
                    if (data) saveData();
                }, 25000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('theme-dark');
                } else {
                    document.documentElement.classList.remove('theme-dark');
                }
                if (data) {
                    data.settings = { theme };
                    settings.theme = theme;
                    saveData();
                }
            }, [theme]);

            const showToast = (message, type = 'info') => {
                const id = uid();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3000);
            };
            window.showToast = showToast;

            const removeToast = (id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            };

            const handleSearchSelect = (item) => {
                setSearchResult(item);
                setTab('journal');
                showToast(`🔍 ${item.student.name} (${item.group.name})`, 'success');
            };

            if (!data) return <div className="flex items-center justify-center min-h-screen text-gray-400">Загрузка...</div>;

            const tabs = [
                { id: 'overview', label: 'Обзор', icon: '🏠' },
                { id: 'journal', label: 'Журнал', icon: '📖' },
                { id: 'plans', label: 'Конспекты', icon: '📝' },
                { id: 'groups', label: 'Группы', icon: '👥' },
                { id: 'planner', label: 'Планировщик', icon: '📋' },
                { id: 'events', label: 'Мероприятия', icon: '🎯' },
                { id: 'analytics', label: 'Аналитика', icon: '📊' },
                { id: 'data', label: 'Данные', icon: '💾' },
            ];

            const renderTab = () => {
                switch (tab) {
                    case 'overview': return <TabOverview setTab={setTab} setSelectedStudent={handleSearchSelect} />;
                    case 'journal': return <TabJournal />;
                    case 'plans': return <TabPlans />;
                    case 'groups': return <TabGroups />;
                    case 'planner': return <TabPlanner />;
                    case 'events': return <TabEvents />;
                    case 'analytics': return <TabAnalytics />;
                    case 'data': return <TabData />;
                    default: return <div>Страница не найдена</div>;
                }
            };

            return (
                <div className="min-h-screen paper-bg text-gray-800">
                    <header className="sticky top-0 z-30 paper-bg paper-border-b border-b px-4 py-3 flex items-center justify-between flex-wrap gap-3">
                        <div className="flex items-center gap-3">
                            <span className="font-unbounded text-xl font-bold text-green-800">📓 ЛингвоЖурнал</span>
                            <span className="text-xs text-gray-400 hidden sm:inline">v1.0</span>
                        </div>
                        <div className="flex items-center gap-3 flex-1 max-w-sm">
                            <GlobalSearch onSelect={handleSearchSelect} />
                        </div>
                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { setTheme(theme === 'light' ? 'dark' : 'light'); }}
                                className="p-2 rounded-md hover:bg-gray-200 text-gray-600"
                            >
                                {theme === 'light' ? <Icons.Moon /> : <Icons.Sun />}
                            </button>
                            <button
                                onClick={() => { setShowOnboarding(true); setOnboardStep(0); }}
                                className="p-2 rounded-md hover:bg-gray-200 text-gray-600 text-sm font-bold"
                            >
                                ?
                            </button>
                        </div>
                    </header>

                    <nav className="px-4 pt-2 flex overflow-x-auto gap-1 border-b border-gray-200 scrollbar-thin">
                        {tabs.map(t => (
                            <button
                                key={t.id}
                                className={`px-3 py-2 text-sm font-medium transition-all whitespace-nowrap ${tab === t.id ? 'tab-active' : 'tab-inactive'}`}
                                onClick={() => setTab(t.id)}
                            >
                                {t.icon} {t.label}
                            </button>
                        ))}
                    </nav>

                    <main className="p-4 max-w-7xl mx-auto">
                        {renderTab()}
                    </main>

                    <FloatingButtons />
                    <ToastSystem toasts={toasts} removeToast={removeToast} />

                    {showOnboarding && (
                        <Onboarding
                            onComplete={() => setShowOnboarding(false)}
                            currentStep={onboardStep}
                            setStep={setOnboardStep}
                        />
                    )}

                    <ConfirmModal isOpen={false} title="" message="" onConfirm={() => {}} onCancel={() => {}} />
                </div>
            );
        }

        // ---------- Запуск ----------
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<section class="tm-card tm-notes"><h2>Генератор расширенного конспекта</h2><div class="tm-form"><input id="lj-topic" placeholder="Тема урока"/><select id="lj-level"><option>начальный уровень</option><option>средний уровень</option><option>продвинутый уровень</option></select><input id="lj-goal" placeholder="Цель и результат занятия"/><button id="lj-generate">Сформировать подробный конспект</button></div><textarea id="lj-output" rows="16" placeholder="Здесь появится структурированный конспект"></textarea><div class="tm-actions"><button id="lj-copy">Копировать</button><button id="lj-word">Скачать Word</button></div></section><script id="theme-tools-script">(()=>{const q=s=>document.querySelector(s), text=(s)=>String(s||'').trim(); const saveWord=(name,content)=>{const blob=new Blob(['\ufeff', '<html><head><meta charset="utf-8"></head><body><pre style="white-space:pre-wrap;font:15px Arial">'+content.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></body></html>'],{type:'application/msword'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.doc';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.title=document.title.replace(' · Генератор','');document.documentElement.dataset.themeNote='Добавлен генератор подробного конспекта с локальным экспортом в Word.';document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>q('#home-output').textContent='Сценарий «'+b.dataset.home+'»: выберите 3 главных действия, назначьте время и оставьте один запасной шаг.');document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>q('#build-output').textContent='Этап «'+b.dataset.build+'»: проверьте соответствие проекту, качество выполнения, безопасность и зафиксируйте замечания.');document.querySelectorAll('[data-mama]').forEach(b=>b.onclick=()=>q('#mama-output').textContent='Сценарий «'+b.dataset.mama+'»: подготовьте вещи заранее, выберите одно обязательное действие и один спокойный резерв.');document.querySelectorAll('[data-cook]').forEach(b=>b.onclick=()=>q('#cook-output').textContent='Раздел «'+b.dataset.cook+'»: запишите конкретные действия, время и нужные продукты.');q('#lj-generate').onclick=()=>{let t=text(q('#lj-topic').value)||'Тема урока',l=q('#lj-level').value,g=text(q('#lj-goal').value)||'ученик применяет навык в речи';q('#lj-output').value=`КОНСПЕКТ: ${t}\nУровень: ${l}\nЦель: ${g}\n\n1. Вход в тему\nКороткий вопрос, визуальная опора и актуализация знакомых слов.\n\n2. Теория\nДайте правило простыми словами, покажите 2–3 модели и выделите типичные ошибки.\n\n3. Управляемая практика\nВыполните задание по образцу, затем попросите ученика объяснить выбор.\n\n4. Коммуникативная практика\nСитуация из жизни с обязательным использованием нового материала.\n\n5. Проверка\nМини-задание без подсказки, самооценка и короткая обратная связь.\n\n6. Домашний шаг\nПовторение слов в контексте и одно творческое задание.`};q('#lj-copy').onclick=()=>navigator.clipboard?.writeText(q('#lj-output').value);q('#lj-word').onclick=()=>saveWord('lingvo-konspekt',q('#lj-output').value);})();</script>
</body>
</html>
