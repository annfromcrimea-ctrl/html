<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Домовник — помощник хозяйки</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap');

        * {
            font-family: 'Golos Text', sans-serif;
            box-sizing: border-box;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        .font-unbounded {
            font-family: 'Unbounded', sans-serif;
        }

        :root {
            --bg: #f9f5ed;
            --paper: #fcf8f0;
            --sage: #7a9b8c;
            --sage-light: #d4e2d9;
            --yellow: #f7d44a;
            --red: #d45a4a;
            --ochre: #c4905a;
            --blue: #5a7a9b;
            --terracotta: #b86a4a;
            --ink: #2a2a2a;
            --border: #d8cdbc;
            --shadow: rgba(0, 0, 0, 0.06);
        }
        .dark {
            --bg: #1e1e1e;
            --paper: #2a2a2a;
            --sage: #5a7a6a;
            --sage-light: #3a4a42;
            --yellow: #a0802a;
            --red: #8a4a3a;
            --ochre: #8a6a3a;
            --blue: #4a6a8a;
            --terracotta: #8a5a4a;
            --ink: #e8e0d8;
            --border: #4a4a4a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            background: var(--bg);
            color: var(--ink);
            transition: background 0.3s, color 0.3s;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .bg-paper {
            background: var(--paper);
        }
        .border-paper {
            border-color: var(--border);
        }
        .text-ink {
            color: var(--ink);
        }

        /* Пользовательские цветовые утилиты для классов Tailwind в автономном файле. */
        .bg-sage { background-color: var(--sage); }
        .bg-sage-light { background-color: var(--sage-light); }
        .bg-terracotta { background-color: var(--terracotta); }
        .bg-border { background-color: var(--border); }
        .text-sage { color: var(--sage); }
        .text-terracotta { color: var(--terracotta); }
        .text-blue { color: var(--blue); }
        .text-ochre { color: var(--ochre); }
        .border-sage { border-color: var(--sage); }
        .border-terracotta { border-color: var(--terracotta); }
        .focus\:border-sage:focus { border-color: var(--sage); }
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid color-mix(in srgb, var(--sage) 45%, transparent);
            outline-offset: 2px;
        }
        .shadow-card {
            box-shadow: 0 2px 8px var(--shadow);
        }

        .dot-grid {
            background-image: radial-gradient(var(--border) 0.8px, transparent 0.8px);
            background-size: 20px 20px;
        }

        .card-hover {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        .tab-btn {
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            padding: 8px 14px;
            font-weight: 500;
            font-size: 0.9rem;
            white-space: nowrap;
            cursor: pointer;
            background: transparent;
            color: var(--ink);
            opacity: 0.6;
        }
        .tab-btn.active {
            opacity: 1;
            border-bottom-color: var(--sage);
            background: var(--sage-light);
            border-radius: 6px 6px 0 0;
        }
        .tab-btn:hover {
            opacity: 1;
        }

        .chip {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--paper);
            color: var(--ink);
            cursor: pointer;
            transition: all 0.15s;
        }
        .chip.active {
            background: var(--sage);
            color: white;
            border-color: var(--sage);
        }
        .chip:hover {
            transform: scale(1.04);
        }

        .btn-primary {
            background: var(--sage);
            color: white;
            border: none;
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.9rem;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        .btn-secondary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--border);
            padding: 6px 18px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-secondary:hover {
            background: var(--sage-light);
        }

        .sticky-note {
            background: var(--yellow);
            padding: 12px 16px;
            border-radius: 4px;
            box-shadow: 2px 3px 10px rgba(0, 0, 0, 0.08);
            transform: rotate(-0.5deg);
            border: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 0.85rem;
            color: #2a2a1a;
        }
        .dark .sticky-note {
            color: #1a1a0a;
        }

        .timer-ring {
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.5s;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--paper);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            z-index: 999;
            max-width: 380px;
            animation: slideUp 0.3s ease;
            font-size: 0.9rem;
            color: var(--ink);
        }
        .toast.success {
            border-left: 4px solid var(--sage);
        }
        .toast.error {
            border-left: 4px solid var(--red);
        }
        .toast.info {
            border-left: 4px solid var(--blue);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cascade {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .cascade {
            animation: cascade 0.3s ease forwards;
        }
        .cascade:nth-child(1) {
            animation-delay: 0.02s;
        }
        .cascade:nth-child(2) {
            animation-delay: 0.06s;
        }
        .cascade:nth-child(3) {
            animation-delay: 0.10s;
        }
        .cascade:nth-child(4) {
            animation-delay: 0.14s;
        }
        .cascade:nth-child(5) {
            animation-delay: 0.18s;
        }
        .cascade:nth-child(6) {
            animation-delay: 0.22s;
        }
        .cascade:nth-child(7) {
            animation-delay: 0.26s;
        }
        .cascade:nth-child(8) {
            animation-delay: 0.30s;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--sage);
            display: inline-block;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.3;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        .modal-box {
            background: var(--paper);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px 28px;
            max-width: 460px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
            animation: scaleIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--sage-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--sage);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media print {
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background: white !important;
                color: black !important;
            }
            .bg-paper {
                background: white !important;
            }
            .dot-grid {
                background: none !important;
            }
            .modal-overlay {
                display: none !important;
            }
        }
        .print-only {
            display: none;
        }

        /* fixes for dark mode */
        .dark .bg-paper {
            background: var(--paper);
        }
        .dark .border-paper {
            border-color: var(--border);
        }
        .dark .text-ink {
            color: var(--ink);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .tab-btn {
                font-size: 0.7rem;
                padding: 6px 10px;
            }
            .modal-box {
                padding: 16px;
                max-width: 95%;
            }
        }
    </style>
</head>

        // ----- React & ReactDOM from UMD -----

        // ----- Helpers -----
        const uid = () => Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
        const dateKey = (date = new Date()) => {
            const offset = date.getTimezoneOffset() * 60000;
            return new Date(date.getTime() - offset).toISOString().slice(0, 10);
        };
        const today = () => dateKey();
        const formatDate = (d) => { const dt = new Date(d); return dt.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: 'numeric' }); };
        const formatTime = (d) => { const dt = new Date(d); return dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); };
        const isToday = (d) => d === today();
        const isTomorrow = (d) => { const t = new Date(); t.setDate(t.getDate() + 1); return d === t.toISOString().slice(0, 10); };
        const isOverdue = (d) => d < today() && d !== '';

        const getStatusLabel = (s) => { const map = { '✓': 'Сделано', '~': 'Частично', '—': 'Отложено', '✗': 'Пропущено', '✦': 'Сверх плана' }; return map[s] || s; };
        const statusColors = { '✓': 'text-green-700 bg-green-100', '~': 'text-amber-700 bg-amber-100', '—': 'text-gray-500 bg-gray-100',
            '✗': 'text-red-700 bg-red-100', '✦': 'text-purple-700 bg-purple-100' };
        const statusOrder = ['✓', '~', '—', '✗', '✦'];

        // ----- Toast System -----
        let toastListeners = [];
        const addToast = (msg, type = 'info') => { toastListeners.forEach(fn => fn(msg, type)); };
        const ToastContainer = () => {
            const [toasts, setToasts] = useState([]);
            useEffect(() => {
                const handler = (msg, type) => {
                    const id = uid();
                    setToasts(prev => [...prev, { id, msg, type }]);
                    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4500);
                };
                toastListeners.push(handler);
                return () => { toastListeners = toastListeners.filter(fn => fn !== handler); };
            }, []);
            return toasts.map(t => <div key={t.id} className={`toast ${t.type}`} role="status" aria-live="polite">{t.msg}</div>);
        };

        // ----- Modal -----
        const Modal = ({ isOpen, onClose, title, children, onConfirm, confirmText = 'Подтвердить', cancelText = 'Отмена' }) => {
            if (!isOpen) return null;
            return <div className="modal-overlay" role="presentation" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
                <div className="modal-box" role="dialog" aria-modal="true" aria-label={title || 'Диалог'}>
                    {title && <h3 className="font-unbounded text-lg font-semibold mb-3">{title}</h3>}
                    <div className="mb-4">{children}</div>
                    {(cancelText || onConfirm) && <div className="flex gap-3 justify-end">
                        {cancelText && <button type="button" className="btn-secondary" onClick={onClose}>{cancelText}</button>}
                        {onConfirm && <button type="button" className="btn-primary" onClick={onConfirm}>{confirmText}</button>}
                    </div>}
                </div>
            </div>;
        };

        // ----- Context -----
        const AppContext = createContext(null);

        // ----- Data Store -----
        const defaultData = () => ({
            zones: [],
            tasks: [],
            checklists: [],
            garden: [],
            maintenance: [],
            events: [],
            stickers: [],
            settings: { role: 'хозяйка', theme: 'light' },
            syncId: 0
        });

        const demoZones = () => [
            { id: 'z1', name: 'Гостиная', type: 'дом', color: '#7a9b8c', subzones: ['Диванная зона', 'ТВ-уголок'] },
            { id: 'z2', name: 'Кухня', type: 'дом', color: '#c4905a', subzones: ['Рабочая поверхность', 'Обеденный стол'] },
            { id: 'z3', name: 'Спальня', type: 'дом', color: '#5a7a9b', subzones: ['Кровать', 'Гардероб'] },
            { id: 'z4', name: 'Двор', type: 'двор', color: '#b86a4a', subzones: ['Патио', 'Дорожки'] },
            { id: 'z5', name: 'Огород', type: 'сад-огород', color: '#7a9b5a', subzones: ['Грядка 1', 'Теплица'] },
            { id: 'z6', name: 'Сарай', type: 'хозяйственные постройки', color: '#8a7a6a', subzones: ['Инструменты', 'Запас'] },
        ];

        const demoData = () => {
            const zones = demoZones();
            const now = today();
            const tasks = [
                { id: 't1', zoneId: 'z1', date: now, time: '09:00', title: 'Проветрить комнату', preparation: 'Открыть окна',
                    responsible: 'мама', status: '✓' },
                { id: 't2', zoneId: 'z2', date: now, time: '10:30', title: 'Завтрак для семьи', preparation: 'Продукты',
                    responsible: 'мама', status: '~' },
                { id: 't3', zoneId: 'z5', date: now, time: '16:00', title: 'Полив грядок', preparation: 'Лейка',
                    responsible: 'дети', status: '—' },
                { id: 't4', zoneId: 'z4', date: now, time: '12:00', title: 'Подмести двор', preparation: 'Веник',
                    responsible: 'папа', status: '' },
                { id: 't5', zoneId: 'z1', date: now, time: '20:00', title: 'Вечерний уют', preparation: 'Свечи',
                    responsible: 'мама', status: '' },
            ];
            const checklists = [{
                id: 'c1',
                name: 'Уборка гостиной',
                type: 'уборка',
                date: now,
                duration: '30 мин',
                goal: 'Чистота и порядок',
                items: [{ pos: 'Пыль', qty: '1 тряпка' }, { pos: 'Пол', qty: 'швабра' }],
                steps: ['Убрать вещи', 'Протереть пыль', 'Помыть пол'],
                supplies: 'Тряпка, швабра',
                result: 'Отлично',
                notes: '',
                files: [],
                color: '#f7d44a',
                done: false
            }, {
                id: 'c2',
                name: 'Заготовка варенья',
                type: 'заготовки',
                date: now,
                duration: '1 ч',
                goal: '3 банки',
                items: [{ pos: 'Ягоды', qty: '1 кг' }, { pos: 'Сахар', qty: '1 кг' }],
                steps: ['Перебрать ягоды', 'Варить', 'Разлить'],
                supplies: 'Кастрюля, банки',
                result: '',
                notes: '',
                files: [],
                color: '#d45a4a',
                done: false
            }];
            const garden = [{
                id: 'g1',
                name: 'Помидоры',
                type: 'овощи',
                planted: '2025-05-10',
                status: 'растет',
                events: [{ date: '2025-05-10', action: 'посев', note: 'В теплицу' }, { date: '2025-05-25',
                        action: 'полив', note: '' }]
            }];
            const maintenance = [{
                id: 'm1',
                name: 'Котёл',
                due: '2026-01-15',
                status: 'ok',
                notes: 'Проверка перед сезоном'
            }, { id: 'm2', name: 'Фильтры', due: '2026-03-01', status: 'pending', notes: '' }];
            const events = [{
                id: 'e1',
                title: 'День рождения',
                type: 'семейный праздник',
                date: '2026-08-20',
                place: 'Дом',
                zones: ['z1'],
                participants: ['Все'],
                status: 'planned'
            }];
            const stickers = [{ id: 's1', text: 'Купить молоко', color: '#f7d44a', pinned: false }, { id: 's2',
                text: 'Полить цветы', color: '#d4e2d9', pinned: false }];
            return { zones, tasks, checklists, garden, maintenance, events, stickers, settings: { role: 'хозяйка',
                    theme: 'light' }, syncId: 0 };
        };

        // ----- Storage -----
        const STORAGE_KEY = 'domovnik_data';
        let bc = null;
        try { bc = new BroadcastChannel('domovnik_sync'); } catch (e) {}

        const normalizeData = (candidate) => {
            const base = defaultData();
            const incoming = candidate && typeof candidate === 'object' ? candidate : {};
            const list = (key) => Array.isArray(incoming[key]) ? incoming[key] : [];
            return {
                ...base,
                ...incoming,
                zones: list('zones'),
                tasks: list('tasks'),
                checklists: list('checklists'),
                garden: list('garden'),
                maintenance: list('maintenance'),
                events: list('events'),
                stickers: list('stickers'),
                settings: { ...base.settings, ...(incoming.settings && typeof incoming.settings === 'object' ? incoming.settings : {}) },
                syncId: Number.isFinite(Number(incoming.syncId)) ? Number(incoming.syncId) : 0
            };
        };

        const loadData = () => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return normalizeData(JSON.parse(raw));
            } catch (e) { console.warn('Ошибка чтения данных', e); }
            const demo = demoData();
            saveData(demo);
            return demo;
        };

        const saveData = (data) => {
            try {
                const next = normalizeData(data);
                next.syncId = (next.syncId || 0) + 1;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
                if (bc) bc.postMessage({ type: 'sync', data: next });
                return next;
            } catch (e) {
                console.warn('Ошибка сохранения данных', e);
                return normalizeData(data);
            }
        };

        if (bc) {
            bc.onmessage = (e) => {
                if (e.data?.type !== 'sync' || !e.data.data) return;
                const remote = normalizeData(e.data.data);
                const current = loadData();
                if (remote.syncId > (current.syncId || 0)) {
                    // Входящие данные сохраняются без повторной отправки в канал, чтобы не создавать цикл синхронизации.
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
                    window.dispatchEvent(new CustomEvent('domovnik_sync'));
                }
            };
        }

        // ----- App -----
        const App = () => {
            const [data, setData] = useState(loadData);
            const [tab, setTab] = useState('overview');
            const [search, setSearch] = useState('');
            const [theme, setTheme] = useState(data?.settings?.theme || 'light');
            const [showOnboarding, setShowOnboarding] = useState(false);
            const [onboardingStep, setOnboardingStep] = useState(0);
            const [isTimerOpen, setIsTimerOpen] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(900);
            const [timerRunning, setTimerRunning] = useState(false);
            const [timerPaused, setTimerPaused] = useState(false);
            const [timerInitial, setTimerInitial] = useState(900);
            const timerRef = useRef(null);
            const [showFloating, setShowFloating] = useState(true);
            const [lastRandomTask, setLastRandomTask] = useState(null);

            // sync listener
            useEffect(() => {
                const handler = () => { const d = loadData();
                    setData(d); };
                window.addEventListener('domovnik_sync', handler);
                return () => window.removeEventListener('domovnik_sync', handler);
            }, []);

            useEffect(() => {
                document.documentElement.className = theme === 'dark' ? 'dark' : '';
            }, [theme]);

            const updateData = useCallback((updater) => {
                setData(prev => {
                    const nextData = typeof updater === 'function' ? updater(prev) : updater;
                    return saveData(nextData);
                });
            }, []);

            const getZone = (id) => data.zones.find(z => z.id === id);

            // Timer logic
            useEffect(() => {
                if (timerRunning && !timerPaused) {
                    timerRef.current = setInterval(() => {
                        setTimerSeconds(prev => {
                            if (prev <= 1) { setTimerRunning(false);
                                clearInterval(timerRef.current);
                                addToast('⏰ Таймер завершён!', 'success'); return 0; }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [timerRunning, timerPaused]);

            const startTimer = (secs = timerSeconds || 900) => {
                const duration = Math.max(1, Number(secs) || 900);
                setTimerInitial(duration);
                setTimerSeconds(duration);
                setTimerRunning(true);
                setTimerPaused(false);
                setIsTimerOpen(true);
            };

            const toggleTimerPause = () => {
                if (!timerRunning) {
                    setTimerRunning(true);
                    setTimerPaused(false);
                    return;
                }
                setTimerPaused(p => !p);
            };
            const stopTimer = () => { setTimerRunning(false);
                setTimerPaused(false);
                setIsTimerOpen(false);
                clearInterval(timerRef.current); };
            const addMinute = () => setTimerSeconds(prev => prev + 60);

            // Random task picker
            const pickRandomTask = () => {
                const available = data.tasks.filter(t => t.status !== '✓' && t.status !== '✗' && t.title);
                if (available.length === 0) { addToast('Нет доступных дел!', 'info'); return; }
                let pick;
                let attempts = 0;
                do {
                    pick = available[Math.floor(Math.random() * available.length)];
                    attempts++;
                } while (pick.id === lastRandomTask && attempts < 20);
                setLastRandomTask(pick.id);
                addToast(`🎯 ${pick.title} (${getZone(pick.zoneId)?.name || '—'})`, 'info');
            };

            // Onboarding
            const onboardingSteps = [
                { title: 'Добро пожаловать!', desc: 'Домовник — ваш личный помощник по дому и участку. Всё в одном месте.' },
                { title: 'Журнал дел', desc: 'Отмечайте дела, следите за прогрессом и не забывайте о важном.' },
                { title: 'Чек-листы и сценарии', desc: 'Планируйте уборку, заготовки, праздники и ремонты.' },
                { title: 'Аналитика', desc: 'Смотрите статистику, зоны-передовики и точки роста.' },
            ];

            // ---- Tabs ----
            const tabs = [
                { id: 'overview', label: 'Обзор', icon: Icons.home },
                { id: 'journal', label: 'Журнал', icon: Icons.list },
                { id: 'checklists', label: 'Чек-листы', icon: Icons.check },
                { id: 'zones', label: 'Зоны', icon: Icons.zones },
                { id: 'planner', label: 'Планировщик', icon: Icons.calendar },
                { id: 'events', label: 'События', icon: Icons.calendar },
                { id: 'analytics', label: 'Аналитика', icon: Icons.analytics },
                { id: 'data', label: 'Данные', icon: Icons.data },
            ];

            // ---- Render helpers ----
            const renderTabContent = () => {
                switch (tab) {
                    case 'overview':
                        return <Overview data={data} updateData={updateData} getZone={getZone} />;
                    case 'journal':
                        return <Journal data={data} updateData={updateData} getZone={getZone} />;
                    case 'checklists':
                        return <Checklists data={data} updateData={updateData} />;
                    case 'zones':
                        return <Zones data={data} updateData={updateData} />;
                    case 'planner':
                        return <Planner data={data} updateData={updateData} getZone={getZone} />;
                    case 'events':
                        return <Events data={data} updateData={updateData} getZone={getZone} />;
                    case 'analytics':
                        return <Analytics data={data} getZone={getZone} />;
                    case 'data':
                        return <DataManager data={data} updateData={updateData} />;
                    default:
                        return <div>Страница не найдена</div>;
                }
            };

            const toggleTheme = () => {
                const nextTheme = theme === 'light' ? 'dark' : 'light';
                setTheme(nextTheme);
                updateData(d => ({ ...d, settings: { ...d.settings, theme: nextTheme } }));
            };

            const openSearchResult = (result) => {
                setTab(result.type === 'задача' ? 'journal' : 'zones');
                setSearch('');
                addToast(`Открыт раздел: ${result.type === 'задача' ? 'Журнал' : 'Зоны'}`, 'info');
            };

            // ---- Search ----
            const searchResults = useMemo(() => {
                if (!search.trim()) return [];
                const q = search.toLowerCase();
                const res = [];
                data.tasks.forEach(t => {
                    if (t.title.toLowerCase().includes(q)) res.push({ type: 'задача', title: t.title, id: t.id,
                        zone: getZone(t.zoneId)?.name });
                });
                data.zones.forEach(z => {
                    if (z.name.toLowerCase().includes(q)) res.push({ type: 'зона', title: z.name, id: z.id });
                });
                return res.slice(0, 8);
            }, [search, data]);

            return (
                <AppContext.Provider value={{ data, updateData, getZone, addToast }}>
                    <div className="min-h-screen dot-grid p-3 md:p-5">
                        {/* Header */}
                        <header className="bg-paper border border-paper rounded-xl shadow-card p-3 md:p-4 mb-4 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center gap-3">
                                <span className="font-unbounded text-xl font-bold text-[#7a9b8c]">🏡 Домовник</span>
                                <span className="text-xs opacity-50 bg-sage-light px-2 py-0.5 rounded-full">{data
                                        .settings?.role || 'хозяйка'}</span>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                                {/* Search */}
                                <div className="relative">
                                    <input type="text" placeholder="Поиск..." value={search} onChange={e => setSearch(e
                                            .target.value)}
                                    className="bg-paper border border-paper rounded-lg px-3 py-1.5 pl-8 text-sm w-36 md:w-48 focus:outline-none focus:border-sage" />
                                    <span className="absolute left-2 top-1/2 -translate-y-1/2 opacity-50">
                                        <Icons.search className="w-4 h-4" />
                                    </span>
                                    {searchResults.length > 0 && (
                                        <div className="absolute top-full left-0 mt-1 bg-paper border border-paper rounded-lg shadow-lg w-full max-h-48 overflow-y-auto z-50">
                                            {searchResults.map(r => <button type="button" key={`${r.type}-${r.id}`} onClick={() => openSearchResult(r)}
                                            className="block w-full text-left px-3 py-1.5 text-sm hover:bg-sage-light cursor-pointer border-b border-paper last:border-0">
                                                <span className="opacity-50 text-xs mr-2">{r.type}</span>{r.title} {r
                                                    .zone && <span className="opacity-40 text-xs">— {r.zone}</span>}
                                            </button>)}
                                        </div>
                                    )}
                                </div>
                                <button type="button" onClick={toggleTheme} aria-label={theme === 'light' ? 'Включить тёмную тему' : 'Включить светлую тему'}
                                className="p-2 rounded-lg hover:bg-sage-light transition">
                                    {theme === 'light' ? <Icons.moon className="w-5 h-5" /> :
                                        <Icons.sun className="w-5 h-5" />}
                                </button>
                                <button onClick={() => setShowOnboarding(true)} className="text-lg hover:scale-110 transition">?
                                </button>
                            </div>
                        </header>

                        {/* Tabs */}
                        <div className="flex overflow-x-auto gap-0.5 mb-4 pb-1 no-print bg-paper border border-paper rounded-xl p-1 shadow-card">
                            {tabs.map(t => (
                                <button key={t.id} onClick={() => setTab(t.id)}
                                className={`tab-btn ${tab === t.id ? 'active' : ''}`}>
                                    <span className="flex items-center gap-1.5">
                                        <t.icon className="w-4 h-4" />
                                        <span className="hidden sm:inline">{t.label}</span>
                                        <span className="sm:hidden">{t.label.slice(0, 3)}</span>
                                    </span>
                                </button>
                            ))}
                        </div>

                        {/* Content */}
                        <div className="bg-paper border border-paper rounded-xl shadow-card p-3 md:p-5 min-h-[480px] relative">
                            {renderTabContent()}
                        </div>

                        {/* Floating buttons */}
                        {showFloating && (
                            <div className="fixed bottom-6 right-6 flex flex-col gap-3 no-print z-40">
                                <button onClick={pickRandomTask} title="Что сделать за 15 минут"
                                className="bg-sage text-white p-3.5 rounded-full shadow-lg hover:scale-105 transition border-0">
                                    <Icons.dice className="w-6 h-6" />
                                </button>
                                <button onClick={() => { if (isTimerOpen) { stopTimer(); } else { setIsTimerOpen(true);
                                        setTimerSeconds(900);
                                        setTimerInitial(900);
                                        setTimerRunning(false);
                                        setTimerPaused(false); } }}
                                className="bg-terracotta text-white p-3.5 rounded-full shadow-lg hover:scale-105 transition border-0">
                                    <Icons.timer className="w-6 h-6" />
                                </button>
                            </div>
                        )}

                        {/* Timer modal */}
                        <Modal isOpen={isTimerOpen} onClose={stopTimer} title="⏱ БЫТОВОЙ ТАЙМЕР" cancelText={null}>
                            <div className="flex flex-col items-center gap-4">
                                <div className="relative w-40 h-40">
                                    <svg className="w-full h-full -rotate-90">
                                        <circle cx="80" cy="80" r="70" fill="none" stroke="var(--border)" strokeWidth="8" />
                                        <circle cx="80" cy="80" r="70" fill="none" stroke="var(--sage)" strokeWidth="8"
                                        className="timer-ring"
                                        style={{ strokeDashoffset: 283 * (1 - timerSeconds / Math.max(timerInitial, 1)) }} />
                                    </svg>
                                    <div className="absolute inset-0 flex items-center justify-center text-2xl font-unbounded">
                                        {Math.floor(timerSeconds / 60)}:{String(timerSeconds % 60).padStart(2, '0')}
                                    </div>
                                </div>
                                <div className="flex flex-wrap gap-2 justify-center">
                                    {[
                                        [15, 900],
                                        [20, 1200],
                                        [30, 1800],
                                        [40, 2400],
                                        [10, 600]
                                    ].map(([label, secs]) => (
                                        <button key={secs} onClick={() => startTimer(secs)}
                                        className="btn-secondary text-sm px-3 py-1">{label} мин</button>
                                    ))}
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={toggleTimerPause} className="btn-primary">
                                        {timerRunning && !timerPaused ? '⏸ Пауза' : timerPaused ? '▶ Продолжить' : '▶ Старт'}
                                    </button>
                                    <button onClick={addMinute} className="btn-secondary">+1 мин</button>
                                    <button onClick={stopTimer} className="btn-secondary text-red-500">⏹ Стоп</button>
                                </div>
                            </div>
                        </Modal>

                        {/* Onboarding */}
                        <Modal isOpen={showOnboarding} onClose={() => setShowOnboarding(false)} cancelText={null}>
                            <div className="text-center">
                                <div className="text-4xl mb-3">🏡</div>
                                <h3 className="font-unbounded text-lg font-semibold">{onboardingSteps[onboardingStep]
                                        .title}</h3>
                                <p className="text-sm opacity-70 mt-2">{onboardingSteps[onboardingStep].desc}</p>
                                <div className="flex justify-center gap-2 mt-4">
                                    {onboardingSteps.map((_, i) => <span key={i} className={`w-2 h-2 rounded-full ${i === onboardingStep ? 'bg-sage' : 'bg-border'}`} />)}
                                </div>
                                <div className="flex gap-3 justify-center mt-4">
                                    <button onClick={() => { if (onboardingStep > 0) setOnboardingStep(s => s - 1); }}
                                    className="btn-secondary text-sm">Назад</button>
                                    <button onClick={() => { if (onboardingStep < onboardingSteps.length - 1)
                                            setOnboardingStep(s => s + 1); else setShowOnboarding(false); }}
                                    className="btn-primary text-sm">
                                        {onboardingStep === onboardingSteps.length - 1 ? 'Начать' : 'Далее'}
                                    </button>
                                </div>
                            </div>
                        </Modal>

                        {/* Toasts */}
                        <ToastContainer />
                    </div>
                </AppContext.Provider>
            );
        };

        // ----- Overview Tab -----
        const Overview = ({ data, updateData, getZone }) => {
            const now = today();
            const todayTasks = data.tasks.filter(t => t.date === now && t.status !== '✓' && t.status !== '✗');
            const tomorrowTasks = data.tasks.filter(t => isTomorrow(t.date) && t.status !== '✓' && t.status !== '✗');
            const upcomingEvents = data.events.filter(e => e.date >= now).sort((a, b) => a.date.localeCompare(b.date))
                .slice(0, 3);
            const recentChecklists = data.checklists.filter(c => !c.done).slice(0, 3);
            const pinnedStickers = data.stickers.filter(s => s.pinned);

            const markDone = (id) => {
                updateData(d => ({
                    ...d,
                    tasks: d.tasks.map(t => t.id === id ? { ...t, status: '✓' } : t)
                }));
                addToast('✅ Дело сделано!', 'success');
            };

            const totalToday = data.tasks.filter(t => t.date === now).length;
            const doneToday = data.tasks.filter(t => t.date === now && t.status === '✓').length;

            return <div className="space-y-4">
                <div className="flex flex-wrap items-center justify-between gap-3">
                    <div>
                        <h2 className="font-unbounded text-2xl">👋 Добрый день!</h2>
                        <p className="text-sm opacity-60">{today()} · {totalToday} дел на сегодня</p>
                    </div>
                    <div className="flex items-center gap-3">
                        <span className="text-sm">Прогресс дня</span>
                        <div className="w-32 h-2 bg-border rounded-full overflow-hidden">
                            <div className="h-full bg-sage rounded-full transition-all" style={{ width: `${totalToday ? (doneToday / totalToday) * 100 : 0}%` }} />
                        </div>
                        <span className="text-sm font-medium">{totalToday ? Math.round(doneToday / totalToday * 100) :
                            0}%</span>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {/* Today's plan */}
                    <div className="border border-paper rounded-xl p-4 bg-paper shadow-card">
                        <h3 className="font-unbounded text-sm font-medium mb-3">📋 План на сегодня</h3>
                        {todayTasks.length === 0 ? (
                            <p className="text-sm opacity-50">Все дела сделаны! ✨</p>
                        ) : (
                            <ul className="space-y-2">
                                {todayTasks.slice(0, 6).map(t => {
                                    const zone = getZone(t.zoneId);
                                    return <li key={t.id} className="flex items-center justify-between gap-3 text-sm border-b border-paper pb-1.5">
                                        <span>{t.title} {zone && <span className="text-xs opacity-40">— {zone
                                                    .name}</span>}</span>
                                        <button onClick={() => markDone(t.id)} className="btn-primary text-xs px-3 py-0.5">Сделано</button>
                                    </li>;
                                })}
                            </ul>
                        )}
                    </div>

                    {/* Tomorrow prep */}
                    <div className="border border-paper rounded-xl p-4 bg-paper shadow-card">
                        <h3 className="font-unbounded text-sm font-medium mb-3">🌅 Подготовить с вечера</h3>
                        {tomorrowTasks.length === 0 ? (
                            <p className="text-sm opacity-50">На завтра пока ничего не запланировано</p>
                        ) : (
                            <ul className="space-y-1.5">
                                {tomorrowTasks.slice(0, 5).map(t => {
                                    const zone = getZone(t.zoneId);
                                    return <li key={t.id} className="text-sm border-b border-paper pb-1.5">
                                        <span className="font-medium">{t.title}</span>
                                        {t.preparation && <span className="text-xs opacity-50 ml-2">🛒 {t
                                                .preparation}</span>}
                                        {zone && <span className="text-xs opacity-40 ml-2">— {zone.name}</span>}
                                    </li>;
                                })}
                            </ul>
                        )}
                    </div>
                </div>

                {/* Stickers & events & checklists */}
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="border border-paper rounded-xl p-4 bg-paper shadow-card">
                        <h3 className="font-unbounded text-sm font-medium mb-3">📌 Стикеры</h3>
                        {pinnedStickers.length === 0 ? (
                            <p className="text-sm opacity-50">Нет закреплённых заметок</p>
                        ) : (
                            <div className="space-y-2">
                                {pinnedStickers.slice(0, 4).map(s => <div key={s.id} className="sticky-note text-sm">{s
                                        .text}</div>)}
                            </div>
                        )}
                    </div>
                    <div className="border border-paper rounded-xl p-4 bg-paper shadow-card">
                        <h3 className="font-unbounded text-sm font-medium mb-3">📅 Ближайшие события</h3>
                        {upcomingEvents.length === 0 ? (
                            <p className="text-sm opacity-50">Нет ближайших событий</p>
                        ) : (
                            <ul className="space-y-2">
                                {upcomingEvents.map(e => <li key={e.id} className="text-sm border-b border-paper pb-1.5">
                                    <span className="font-medium">{e.title}</span>
                                    <span className="text-xs opacity-50 ml-2">{formatDate(e.date)}</span>
                                </li>)}
                            </ul>
                        )}
                    </div>
                    <div className="border border-paper rounded-xl p-4 bg-paper shadow-card">
                        <h3 className="font-unbounded text-sm font-medium mb-3">📋 Последние чек-листы</h3>
                        {recentChecklists.length === 0 ? (
                            <p className="text-sm opacity-50">Нет активных чек-листов</p>
                        ) : (
                            <ul className="space-y-2">
                                {recentChecklists.map(c => <li key={c.id} className="text-sm border-b border-paper pb-1.5">
                                    <span>{c.name}</span>
                                    <span className="text-xs opacity-40 ml-2">({c.type})</span>
                                </li>)}
                            </ul>
                        )}
                    </div>
                </div>
            </div>;
        };

        // ----- Journal Tab -----
        const Journal = ({ data, updateData, getZone }) => {
            const now = today();
            const [selectedZone, setSelectedZone] = useState(null);
            const [selectedDate, setSelectedDate] = useState(now);
            const [showStatusPopover, setShowStatusPopover] = useState(null);

            const zones = data.zones;
            const filteredTasks = data.tasks.filter(t => {
                if (selectedZone && t.zoneId !== selectedZone) return false;
                return true;
            });

            const dates = [...new Set(data.tasks.map(t => t.date).filter(Boolean))].sort();
            const currentDate = selectedDate || dates[0] || now;
            const dayTasks = filteredTasks.filter(t => t.date === currentDate);

            const setStatus = (taskId, status) => {
                updateData(d => ({
                    ...d,
                    tasks: d.tasks.map(t => t.id === taskId ? { ...t, status } : t)
                }));
                setShowStatusPopover(null);
                addToast(`Статус обновлён: ${getStatusLabel(status)}`, 'success');
            };

            const getCompletionRate = (tasks) => {
                if (!tasks.length) return 0;
                const done = tasks.filter(t => t.status === '✓' || t.status === '✦').length;
                return Math.round(done / tasks.length * 100);
            };

            const zoneRate = (zoneId) => {
                const ts = data.tasks.filter(t => t.zoneId === zoneId);
                return getCompletionRate(ts);
            };

            return <div>
                <div className="flex flex-wrap gap-2 mb-4">
                    <button onClick={() => setSelectedZone(null)} className={`chip ${!selectedZone ? 'active' : ''}`}>Все
                        зоны</button>
                    {zones.map(z => <button key={z.id} onClick={() => setSelectedZone(z.id)}
                        className={`chip ${selectedZone === z.id ? 'active' : ''}`}
                        style={{ borderColor: selectedZone === z.id ? z.color : undefined }}>
                        {z.name} <span className="text-xs ml-1 opacity-60">{zoneRate(z.id)}%</span>
                    </button>)}
                </div>

                <div className="flex flex-wrap gap-2 mb-4 overflow-x-auto">
                    {dates.slice(0, 14).map(d => <button key={d} onClick={() => setSelectedDate(d)}
                        className={`chip ${d === currentDate ? 'active' : ''} ${isToday(d) ? 'border-yellow' : ''}`}>
                        {isToday(d) ? 'Сегодня' : isTomorrow(d) ? 'Завтра' : formatDate(d)}
                    </button>)}
                    {dates.length === 0 && <span className="text-sm opacity-50">Нет дел</span>}
                </div>

                <div className="overflow-x-auto">
                    <table className="w-full text-sm border-collapse">
                        <thead>
                            <tr className="border-b border-paper">
                                <th className="text-left py-2 px-2 font-medium">Дело</th>
                                <th className="text-left py-2 px-2 font-medium">Зона</th>
                                <th className="text-left py-2 px-2 font-medium">Время</th>
                                <th className="text-left py-2 px-2 font-medium">Ответственный</th>
                                <th className="text-left py-2 px-2 font-medium">Статус</th>
                            </tr>
                        </thead>
                        <tbody>
                            {dayTasks.length === 0 ? (
                                <tr><td colSpan="5" className="py-8 text-center opacity-50">Нет дел на эту дату</td></tr>
                            ) : (
                                dayTasks.map(t => {
                                    const zone = getZone(t.zoneId);
                                    return <tr key={t.id} className="border-b border-paper hover:bg-sage-light/20 transition">
                                        <td className="py-2 px-2">{t.title}</td>
                                        <td className="py-2 px-2">{zone?.name || '—'}</td>
                                        <td className="py-2 px-2">{t.time || '—'}</td>
                                        <td className="py-2 px-2">{t.responsible || '—'}</td>
                                        <td className="py-2 px-2 relative">
                                            <button onClick={() => setShowStatusPopover(showStatusPopover === t.id ? null :
                                                    t.id)}
                                            className={`px-3 py-0.5 rounded-full text-xs font-medium ${t.status ? statusColors[t.status] || 'bg-gray-100 text-gray-700' : 'bg-border/30 text-ink/50'}`}>
                                                {t.status ? getStatusLabel(t.status) : '▼'}
                                            </button>
                                            {showStatusPopover === t.id && (
                                                <div className="absolute z-30 mt-1 bg-paper border border-paper rounded-lg shadow-lg p-2 flex flex-wrap gap-1 w-44">
                                                    {statusOrder.map(s => (
                                                        <button key={s} onClick={() => setStatus(t.id, s)}
                                                        className={`px-2 py-0.5 rounded text-xs ${statusColors[s] || 'bg-gray-100'}`}>
                                                            {s} {getStatusLabel(s)}
                                                        </button>
                                                    ))}
                                                    <button onClick={() => setStatus(t.id, '')} className="px-2 py-0.5 rounded text-xs bg-gray-200">✕
                                                        стереть</button>
                                                </div>
                                            )}
                                        </td>
                                    </tr>;
                                })
                            )}
                        </tbody>
                    </table>
                </div>

                <div className="mt-4 flex flex-wrap gap-4 text-sm">
                    <span>📊 Средний процент выполнения: <strong>{getCompletionRate(dayTasks)}%</strong></span>
                    <span className="opacity-50">|</span>
                    <span className="opacity-60">Всего дел: {dayTasks.length}</span>
                    <button onClick={() => window.print()} className="btn-secondary text-xs">🖨 Печать (ландшафт)</button>
                </div>
            </div>;
        };

        // ----- Checklists Tab -----
        const Checklists = ({ data, updateData }) => {
            const [selectedId, setSelectedId] = useState(null);
            const [isEditorOpen, setIsEditorOpen] = useState(false);
            const [editing, setEditing] = useState(null);

            const openEditor = (id = null) => {
                if (id) {
                    const c = data.checklists.find(cl => cl.id === id);
                    setEditing(c ? { ...c } : null);
                } else {
                    setEditing({
                        id: uid(),
                        name: '',
                        type: 'уборка',
                        date: today(),
                        duration: '',
                        goal: '',
                        items: [{ pos: '', qty: '' }],
                        steps: [''],
                        supplies: '',
                        result: '',
                        notes: '',
                        files: [],
                        color: '#f7d44a',
                        done: false
                    });
                }
                setIsEditorOpen(true);
            };

            const saveChecklist = () => {
                if (!editing.name.trim()) { addToast('Введите название', 'error'); return; }
                updateData(d => {
                    const exists = d.checklists.find(c => c.id === editing.id);
                    if (exists) {
                        return { ...d, checklists: d.checklists.map(c => c.id === editing.id ? editing : c) };
                    } else {
                        return { ...d, checklists: [...d.checklists, editing] };
                    }
                });
                setIsEditorOpen(false);
                setEditing(null);
                addToast('✅ Чек-лист сохранён', 'success');
            };

            const deleteChecklist = (id) => {
                if (confirm('Удалить чек-лист?')) {
                    updateData(d => ({ ...d, checklists: d.checklists.filter(c => c.id !== id) }));
                    addToast('🗑 Удалено', 'info');
                }
            };

            const toggleDone = (id) => {
                updateData(d => ({
                    ...d,
                    checklists: d.checklists.map(c => c.id === id ? { ...c, done: !c.done } : c)
                }));
            };

            const renderEditor = () => {
                if (!editing) return null;
                const update = (field, val) => setEditing({ ...editing, [field]: val });
                const updateItem = (idx, field, val) => {
                    const items = [...editing.items];
                    items[idx] = { ...items[idx], [field]: val };
                    update('items', items);
                };
                const addItem = () => update('items', [...editing.items, { pos: '', qty: '' }]);
                const removeItem = (idx) => {
                    if (editing.items.length <= 1) return;
                    update('items', editing.items.filter((_, i) => i !== idx));
                };
                const updateStep = (idx, val) => {
                    const steps = [...editing.steps];
                    steps[idx] = val;
                    update('steps', steps);
                };
                const addStep = () => update('steps', [...editing.steps, '']);
                const removeStep = (idx) => {
                    if (editing.steps.length <= 1) return;
                    update('steps', editing.steps.filter((_, i) => i !== idx));
                };

                return <Modal isOpen={isEditorOpen} onClose={() => { setIsEditorOpen(false);
                        setEditing(null); }} title="✏️ Редактор чек-листа" onConfirm={saveChecklist} confirmText="Сохранить">
                    <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
                        <input type="text" value={editing.name} onChange={e => update('name', e.target.value)}
                        placeholder="Название" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                        <div className="flex flex-wrap gap-3">
                            <select value={editing.type} onChange={e => update('type', e.target.value)}
                            className="bg-transparent border border-paper rounded-lg px-3 py-2 text-sm">
                                {['уборка', 'заготовки', 'праздник', 'ремонт', 'посадки'].map(t => <option key={t}
                                        value={t}>{t}</option>)}
                            </select>
                            <input type="date" value={editing.date} onChange={e => update('date', e.target.value)}
                            className="bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                            <input type="text" value={editing.duration} onChange={e => update('duration', e.target
                                    .value)}
                            placeholder="Длительность" className="bg-transparent border border-paper rounded-lg px-3 py-2 text-sm w-28" />
                        </div>
                        <input type="text" value={editing.goal} onChange={e => update('goal', e.target.value)}
                        placeholder="Цель" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                        <input type="text" value={editing.supplies} onChange={e => update('supplies', e.target.value)}
                        placeholder="Что понадобится (инвентарь, средства...)" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />

                        <div>
                            <div className="flex items-center justify-between mb-1">
                                <span className="text-sm font-medium">Шаги</span>
                                <button onClick={addStep} className="btn-primary text-xs px-2 py-0.5">+</button>
                            </div>
                            {editing.steps.map((s, i) => <div key={i} className="flex gap-2 mb-1">
                                <input type="text" value={s} onChange={e => updateStep(i, e.target.value)}
                                placeholder={`Шаг ${i + 1}`} className="flex-1 bg-transparent border border-paper rounded-lg px-3 py-1.5 text-sm" />
                                <button onClick={() => removeStep(i)} className="text-red-400 text-sm">✕</button>
                            </div>)}
                        </div>

                        <div>
                            <div className="flex items-center justify-between mb-1">
                                <span className="text-sm font-medium">Список (позиция — количество/где взять)</span>
                                <button onClick={addItem} className="btn-primary text-xs px-2 py-0.5">+</button>
                            </div>
                            {editing.items.map((item, i) => <div key={i} className="flex gap-2 mb-1">
                                <input type="text" value={item.pos} onChange={e => updateItem(i, 'pos', e.target
                                        .value)}
                                placeholder="Позиция" className="flex-1 bg-transparent border border-paper rounded-lg px-3 py-1.5 text-sm" />
                                <input type="text" value={item.qty} onChange={e => updateItem(i, 'qty', e.target
                                        .value)}
                                placeholder="Кол-во/где" className="w-28 bg-transparent border border-paper rounded-lg px-3 py-1.5 text-sm" />
                                <button onClick={() => removeItem(i)} className="text-red-400 text-sm">✕</button>
                            </div>)}
                        </div>

                        <input type="text" value={editing.result} onChange={e => update('result', e.target.value)}
                        placeholder="Оценка результата" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                        <textarea value={editing.notes} onChange={e => update('notes', e.target.value)}
                        placeholder="Заметки" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm resize-none h-16" />
                        <input type="color" value={editing.color} onChange={e => update('color', e.target.value)}
                        className="w-12 h-10 rounded border border-paper" />
                        <div className="flex items-center gap-3">
                            <label className="text-sm">✅ Выполнен</label>
                            <input type="checkbox" checked={editing.done} onChange={e => update('done', e.target
                                    .checked)} />
                        </div>
                    </div>
                </Modal>;
            };

            return <div>
                <div className="flex justify-between items-center mb-4">
                    <h2 className="font-unbounded text-xl">📋 Чек-листы</h2>
                    <button onClick={() => openEditor()} className="btn-primary text-sm flex items-center gap-1">
                        <Icons.plus className="w-4 h-4" /> Создать
                    </button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {data.checklists.length === 0 ? (
                        <div className="col-span-full text-center py-12 opacity-50">
                            <p className="text-lg">📭 Нет чек-листов</p>
                            <p className="text-sm">Создайте первый чек-лист для уборки или заготовок</p>
                        </div>
                    ) : (
                        data.checklists.map(c => {
                            const total = c.steps?.length || 0;
                            const done = c.done ? 1 : 0;
                            return <div key={c.id} className="border border-paper rounded-xl p-4 card-hover shadow-card"
                            style={{ borderLeftColor: c.color, borderLeftWidth: '4px' }}>
                                <div className="flex items-start justify-between">
                                    <div>
                                        <h3 className="font-medium">{c.name}</h3>
                                        <div className="flex flex-wrap gap-1 mt-1">
                                            <span className="text-xs px-2 py-0.5 rounded-full bg-sage-light">{c
                                                    .type}</span>
                                            <span className="text-xs opacity-50">{formatDate(c.date)}</span>
                                        </div>
                                    </div>
                                    <div className="flex gap-1">
                                        <button onClick={() => toggleDone(c.id)} className="text-sm">
                                            {c.done ? '✅' : '⬜'}
                                        </button>
                                        <button onClick={() => openEditor(c.id)} className="text-sm opacity-50 hover:opacity-100">
                                            <Icons.edit className="w-4 h-4" />
                                        </button>
                                        <button onClick={() => deleteChecklist(c.id)} className="text-sm opacity-50 hover:opacity-100 text-red-400">
                                            <Icons.trash className="w-4 h-4" />
                                        </button>
                                    </div>
                                </div>
                                <div className="mt-2 flex items-center gap-2 text-xs">
                                    <span>Шагов: {total}</span>
                                    <span className="opacity-30">|</span>
                                    <span>Выполнено: {done}</span>
                                    <button onClick={() => { setSelectedId(c.id);
                                        window.print(); }} className="ml-auto btn-secondary text-xs px-2 py-0.5">🖨</button>
                                </div>
                            </div>;
                        })
                    )}
                </div>
                {renderEditor()}
            </div>;
        };

        // ----- Zones Tab -----
        const Zones = ({ data, updateData }) => {
            const [newSubzoneByZone, setNewSubzoneByZone] = useState({});
            const zoneTypes = ['дом', 'двор', 'сад-огород', 'хозяйственные постройки'];

            const addZone = () => {
                const number = data.zones.length + 1;
                updateData(d => ({
                    ...d,
                    zones: [...d.zones, { id: uid(), name: `Новая зона ${number}`, type: 'дом', color: '#7a9b8c', subzones: [] }]
                }));
                addToast('Зона добавлена — укажите её название и тип.', 'success');
            };

            const deleteZone = (id) => {
                const linkedTaskCount = data.tasks.filter(t => t.zoneId === id).length;
                const message = linkedTaskCount
                    ? `Удалить зону? У ${linkedTaskCount} дел будет удалена привязка к зоне.`
                    : 'Удалить зону?';
                if (confirm(message)) {
                    updateData(d => ({
                        ...d,
                        zones: d.zones.filter(z => z.id !== id),
                        tasks: d.tasks.map(t => t.zoneId === id ? { ...t, zoneId: '' } : t)
                    }));
                    addToast(linkedTaskCount ? `Зона удалена; дел без зоны: ${linkedTaskCount}.` : 'Зона удалена.', 'info');
                }
            };

            const updateZone = (id, field, val) => {
                updateData(d => ({
                    ...d,
                    zones: d.zones.map(z => z.id === id ? { ...z, [field]: val } : z)
                }));
            };

            const addSubzone = (zoneId) => {
                const subzoneName = (newSubzoneByZone[zoneId] || '').trim();
                if (!subzoneName) return;
                updateData(d => ({
                    ...d,
                    zones: d.zones.map(z => z.id === zoneId ? { ...z, subzones: [...z.subzones, subzoneName] } : z)
                }));
                setNewSubzoneByZone(prev => ({ ...prev, [zoneId]: '' }));
                addToast('Подзона добавлена.', 'success');
            };

            const removeSubzone = (zoneId, idx) => {
                updateData(d => ({
                    ...d,
                    zones: d.zones.map(z => z.id === zoneId ? { ...z, subzones: z.subzones.filter((_, i) => i !==
                            idx) } : z)
                }));
            };

            return <div>
                <div className="flex justify-between items-center mb-4">
                    <h2 className="font-unbounded text-xl">🏠 Зоны</h2>
                    <button onClick={addZone} className="btn-primary text-sm flex items-center gap-1">
                        <Icons.plus className="w-4 h-4" /> Добавить зону
                    </button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {data.zones.map(z => {
                        const taskCount = data.tasks.filter(t => t.zoneId === z.id).length;
                        return <div key={z.id} className="border border-paper rounded-xl p-4 card-hover shadow-card"
                        style={{ borderLeftColor: z.color, borderLeftWidth: '4px' }}>
                            <div className="flex items-start justify-between">
                                <div>
                                    <input type="text" value={z.name} onChange={e => updateZone(z.id, 'name', e
                                            .target.value)}
                                    className="font-medium bg-transparent border border-transparent hover:border-paper rounded px-1 text-sm w-full" />
                                    <div className="flex flex-wrap items-center gap-1 mt-1">
                                        <select value={z.type} onChange={e => updateZone(z.id, 'type', e.target.value)} aria-label={`Тип зоны: ${z.name}`}
                                        className="text-xs px-2 py-0.5 rounded-full bg-sage-light border border-paper">
                                            {zoneTypes.map(type => <option key={type} value={type}>{type}</option>)}
                                        </select>
                                        <span className="text-xs opacity-50">{taskCount} дел</span>
                                    </div>
                                </div>
                                <div className="flex gap-1">
                                    <input type="color" value={z.color} onChange={e => updateZone(z.id, 'color', e
                                            .target.value)}
                                    className="w-6 h-6 rounded border border-paper" />
                                    <button onClick={() => deleteZone(z.id)} className="text-red-400 opacity-50 hover:opacity-100">
                                        <Icons.trash className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                            <div className="mt-3">
                                <div className="flex gap-2">
                                    <input type="text" value={newSubzoneByZone[z.id] || ''} onChange={e => setNewSubzoneByZone(prev => ({ ...prev, [z.id]: e.target.value }))}
                                    placeholder="Добавить подзону..." aria-label={`Новая подзона для «${z.name}»`} className="flex-1 bg-transparent border border-paper rounded-lg px-3 py-1.5 text-sm"
                                    onKeyDown={e => { if (e.key === 'Enter') addSubzone(z.id); }} />
                                    <button onClick={() => addSubzone(z.id)} className="btn-primary text-sm px-3 py-1">+</button>
                                </div>
                                {z.subzones.length > 0 && (
                                    <div className="flex flex-wrap gap-1.5 mt-2">
                                        {z.subzones.map((sz, i) => <span key={i} className="text-xs px-2 py-0.5 rounded-full bg-paper border border-paper flex items-center gap-1">
                                            {sz}
                                            <button onClick={() => removeSubzone(z.id, i)} className="text-red-400 text-xs hover:scale-110">✕</button>
                                        </span>)}
                                    </div>
                                )}
                            </div>
                        </div>;
                    })}
                    {data.zones.length === 0 && (
                        <div className="col-span-full text-center py-12 opacity-50">
                            <p className="text-lg">🏠 Нет зон</p>
                            <p className="text-sm">Добавьте первую зону — дом, двор, огород...</p>
                        </div>
                    )}
                </div>
            </div>;
        };

        // ----- Planner Tab -----
        const Planner = ({ data, updateData, getZone }) => {
            const now = today();
            const [filter, setFilter] = useState('all');

            const tasks = data.tasks;
            const grouped = {
                overdue: tasks.filter(t => isOverdue(t.date) && t.status !== '✓' && t.status !== '✗'),
                today: tasks.filter(t => isToday(t.date) && t.status !== '✓' && t.status !== '✗'),
                tomorrow: tasks.filter(t => isTomorrow(t.date) && t.status !== '✓' && t.status !== '✗'),
                week: tasks.filter(t => {
                    const d = new Date(t.date);
                    const nowD = new Date(now);
                    const diff = (d - nowD) / (1000 * 60 * 60 * 24);
                    return diff > 1 && diff <= 7 && t.status !== '✓' && t.status !== '✗';
                }),
                later: tasks.filter(t => {
                    const d = new Date(t.date);
                    const nowD = new Date(now);
                    const diff = (d - nowD) / (1000 * 60 * 60 * 24);
                    return diff > 7 && t.status !== '✓' && t.status !== '✗';
                }),
                done: tasks.filter(t => t.status === '✓' || t.status === '✗')
            };

            const totalPending = tasks.filter(t => t.status !== '✓' && t.status !== '✗').length;
            const doneCount = tasks.filter(t => t.status === '✓' || t.status === '✦').length;
            const progress = totalPending + doneCount > 0 ? Math.round(doneCount / (totalPending + doneCount) * 100) :
            0;

            const sections = [
                { key: 'overdue', label: '🔴 Просрочено', items: grouped.overdue },
                { key: 'today', label: '📌 Сегодня', items: grouped.today },
                { key: 'tomorrow', label: '🌅 Завтра', items: grouped.tomorrow },
                { key: 'week', label: '📅 Неделя', items: grouped.week },
                { key: 'later', label: '⏳ Позже', items: grouped.later },
                { key: 'done', label: '✅ Сделанные', items: grouped.done },
            ];

            const setStatus = (id, status) => {
                updateData(d => ({
                    ...d,
                    tasks: d.tasks.map(t => t.id === id ? { ...t, status } : t)
                }));
                addToast(`Статус: ${getStatusLabel(status)}`, 'success');
            };

            const shareChat = () => {
                const msg = `🏡 Домовник — план на ${now}\n` +
                    grouped.today.map(t => `• ${t.title} ${t.responsible ? '(' + t.responsible + ')' : ''}`).join('\n');
                if (navigator.clipboard) { navigator.clipboard.writeText(msg);
                    addToast('📋 Скопировано в буфер', 'success'); }
                // WhatsApp fallback
                if (window.confirm('Отправить в WhatsApp?')) {
                    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
                }
            };

            const exportICS = () => {
                const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Domovnik//RU'];
                tasks.forEach(t => {
                    if (!t.date) return;
                    const dt = new Date(t.date + 'T' + (t.time || '09:00'));
                    lines.push('BEGIN:VEVENT');
                    lines.push(`SUMMARY:${t.title}`);
                    lines.push(`DTSTART:${dt.toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`);
                    lines.push(`DTEND:${new Date(dt.getTime() + 3600000).toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`);
                    lines.push('END:VEVENT');
                });
                lines.push('END:VCALENDAR');
                const blob = new Blob([lines.join('\n')], { type: 'text/calendar' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'domovnik.ics';
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 0);
                addToast('📅 Экспорт .ics выполнен', 'success');
            };

            return <div>
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <div>
                        <h2 className="font-unbounded text-xl">📋 Планировщик</h2>
                        <div className="flex items-center gap-3 mt-1">
                            <span className="text-sm">Общий прогресс</span>
                            <div className="w-32 h-2 bg-border rounded-full overflow-hidden">
                                <div className="h-full bg-sage rounded-full transition-all" style={{ width: `${progress}%` }} />
                            </div>
                            <span className="text-sm font-medium">{progress}%</span>
                        </div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                        <button onClick={shareChat} className="btn-secondary text-sm flex items-center gap-1">
                            <Icons.whatsapp className="w-4 h-4" /> Чат
                        </button>
                        <button onClick={exportICS} className="btn-secondary text-sm flex items-center gap-1">
                            <Icons.ics className="w-4 h-4" /> .ics
                        </button>
                    </div>
                </div>

                {sections.map(({ key, label, items }) => {
                    if (items.length === 0) return null;
                    return <div key={key} className="mb-4">
                        <h3 className="font-medium text-sm mb-2">{label} ({items.length})</h3>
                        <div className="space-y-1.5">
                            {items.slice(0, 15).map(t => {
                                const zone = getZone(t.zoneId);
                                return <div key={t.id} className="flex items-center justify-between gap-3 text-sm border-b border-paper pb-1.5 pl-2">
                                    <span>{t.title} {zone && <span className="text-xs opacity-40">— {zone
                                                .name}</span>}</span>
                                    <div className="flex items-center gap-2">
                                        {t.time && <span className="text-xs opacity-50">{t.time}</span>}
                                        <select onChange={e => setStatus(t.id, e.target.value)} value={t.status || ''}
