                                        className="bg-transparent border border-paper rounded px-2 py-0.5 text-xs">
                                            <option value="">—</option>
                                            {statusOrder.map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                </div>;
                            })}
                            {items.length > 15 && <span className="text-xs opacity-50">+ ещё {items.length - 15}</span>}
                        </div>
                    </div>;
                })}
                {tasks.length === 0 && <div className="text-center py-12 opacity-50">
                    <p className="text-lg">📭 Нет дел</p>
                    <p className="text-sm">Добавьте задачи через журнал или зоны</p>
                </div>}
            </div>;
        };

        // ----- Events Tab -----
        const Events = ({ data, updateData, getZone }) => {
            const [filterType, setFilterType] = useState('all');
            const [newEvent, setNewEvent] = useState(null);
            const [showEventForm, setShowEventForm] = useState(false);

            const types = ['семейный праздник', 'гости', 'ремонт', 'сбор урожая', 'оплата счетов', 'детские кружки'];

            const events = data.events.filter(e => {
                if (filterType !== 'all' && e.type !== filterType) return false;
                return true;
            }).sort((a, b) => a.date.localeCompare(b.date));

            const addEvent = () => {
                if (!newEvent?.title) { addToast('Введите название', 'error'); return; }
                updateData(d => ({
                    ...d,
                    events: [...d.events, { ...newEvent, id: uid(), status: 'planned' }]
                }));
                setNewEvent(null);
                setShowEventForm(false);
                addToast('✅ Событие добавлено', 'success');
            };

            const deleteEvent = (id) => {
                if (confirm('Удалить событие?')) {
                    updateData(d => ({ ...d, events: d.events.filter(e => e.id !== id) }));
                    addToast('🗑 Удалено', 'info');
                }
            };

            return <div>
                <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <h2 className="font-unbounded text-xl">🎉 События</h2>
                    <button onClick={() => { setNewEvent({ title: '', type: 'семейный праздник', date: today(),
                                place: '', zones: [], participants: '' });
                            setShowEventForm(true); }}
                    className="btn-primary text-sm flex items-center gap-1">
                        <Icons.plus className="w-4 h-4" /> Добавить
                    </button>
                </div>

                <div className="flex flex-wrap gap-2 mb-4">
                    <button onClick={() => setFilterType('all')} className={`chip ${filterType === 'all' ? 'active' : ''}`}>
                        Все
                    </button>
                    {types.map(t => <button key={t} onClick={() => setFilterType(t)}
                        className={`chip ${filterType === t ? 'active' : ''}`}>{t}</button>)}
                </div>

                <div className="space-y-2 max-h-[420px] overflow-y-auto">
                    {events.length === 0 ? (
                        <div className="text-center py-12 opacity-50">
                            <p className="text-lg">📅 Нет событий</p>
                            <p className="text-sm">Добавьте семейные праздники, дни рождения, встречи...</p>
                        </div>
                    ) : (
                        events.map(e => <div key={e.id} className="flex items-center justify-between border-b border-paper py-2 px-2 hover:bg-sage-light/10 transition">
                            <div>
                                <span className="font-medium">{e.title}</span>
                                <div className="flex flex-wrap gap-2 text-xs mt-0.5">
                                    <span className="px-2 py-0.5 rounded-full bg-sage-light">{e.type}</span>
                                    <span className="opacity-50">{formatDate(e.date)}</span>
                                    {e.place && <span className="opacity-50">📍 {e.place}</span>}
                                    {e.participants && <span className="opacity-50">👥 {e.participants}</span>}
                                </div>
                            </div>
                            <button onClick={() => deleteEvent(e.id)} className="text-red-400 opacity-50 hover:opacity-100">
                                <Icons.trash className="w-4 h-4" />
                            </button>
                        </div>)
                    )}
                </div>

                <Modal isOpen={showEventForm} onClose={() => { setShowEventForm(false);
                        setNewEvent(null); }} title="✏️ Новое событие" onConfirm={addEvent} confirmText="Добавить">
                    <div className="space-y-3">
                        <input type="text" value={newEvent?.title || ''} onChange={e => setNewEvent({ ...newEvent,
                                title: e.target.value })}
                        placeholder="Название" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                        <select value={newEvent?.type || 'семейный праздник'} onChange={e => setNewEvent({ ...newEvent,
                                type: e.target.value })}
                        className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm">
                            {types.map(t => <option key={t} value={t}>{t}</option>)}
                        </select>
                        <input type="date" value={newEvent?.date || today()} onChange={e => setNewEvent({ ...newEvent,
                                date: e.target.value })}
                        className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                        <input type="text" value={newEvent?.place || ''} onChange={e => setNewEvent({ ...newEvent,
                                place: e.target.value })}
                        placeholder="Место" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                        <input type="text" value={newEvent?.participants || ''} onChange={e => setNewEvent({ ...newEvent,
                                participants: e.target.value })}
                        placeholder="Участники" className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm" />
                    </div>
                </Modal>
            </div>;
        };

        // ----- Analytics Tab -----
        const Analytics = ({ data, getZone }) => {
            const tasks = data.tasks;
            const total = tasks.length;
            const done = tasks.filter(t => t.status === '✓' || t.status === '✦').length;
            const overdue = tasks.filter(t => isOverdue(t.date) && t.status !== '✓' && t.status !== '✗').length;
            const completion = total > 0 ? Math.round(done / total * 100) : 0;

            const zoneStats = data.zones.map(z => {
                const ts = tasks.filter(t => t.zoneId === z.id);
                const doneTs = ts.filter(t => t.status === '✓' || t.status === '✦');
                const rate = ts.length > 0 ? Math.round(doneTs.length / ts.length * 100) : 0;
                return { ...z, total: ts.length, done: doneTs.length, rate };
            }).sort((a, b) => b.rate - a.rate);

            const topZones = zoneStats.filter(z => z.total > 0).slice(0, 3);
            const needyZones = zoneStats.filter(z => z.total > 0 && z.rate < 40).slice(0, 3);

            const statusDist = {};
            statusOrder.forEach(s => { statusDist[s] = tasks.filter(t => t.status === s).length; });

            return <div>
                <h2 className="font-unbounded text-xl mb-4">📊 Аналитика</h2>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
                    <div className="border border-paper rounded-xl p-3 text-center">
                        <div className="text-2xl font-unbounded text-sage">{completion}%</div>
                        <div className="text-xs opacity-50">Выполнение плана</div>
                    </div>
                    <div className="border border-paper rounded-xl p-3 text-center">
                        <div className="text-2xl font-unbounded text-terracotta">{overdue}</div>
                        <div className="text-xs opacity-50">Просрочек</div>
                    </div>
                    <div className="border border-paper rounded-xl p-3 text-center">
                        <div className="text-2xl font-unbounded text-blue">{done}</div>
                        <div className="text-xs opacity-50">Сделано</div>
                    </div>
                    <div className="border border-paper rounded-xl p-3 text-center">
                        <div className="text-2xl font-unbounded text-ochre">{total}</div>
                        <div className="text-xs opacity-50">Всего дел</div>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="border border-paper rounded-xl p-4">
                        <h3 className="font-unbounded text-sm font-medium mb-3">🏆 Зоны-передовики</h3>
                        {topZones.length === 0 ? <p className="text-sm opacity-50">Нет данных</p> :
                            topZones.map(z => <div key={z.id} className="flex items-center justify-between border-b border-paper py-1.5 text-sm">
                                <span>{z.name}</span>
                                <span className="text-sage font-medium">{z.rate}% ({z.done}/{z.total})</span>
                            </div>)}
                    </div>
                    <div className="border border-paper rounded-xl p-4">
                        <h3 className="font-unbounded text-sm font-medium mb-3">⚠️ Требуют внимания</h3>
                        {needyZones.length === 0 ? <p className="text-sm opacity-50">Все зоны в порядке ✨</p> :
                            needyZones.map(z => <div key={z.id} className="flex items-center justify-between border-b border-paper py-1.5 text-sm">
                                <span className="text-red-400">{z.name}</span>
                                <span className="text-red-400 font-medium">{z.rate}% ({z.done}/{z.total})</span>
                            </div>)}
                    </div>
                </div>

                <div className="mt-4 border border-paper rounded-xl p-4">
                    <h3 className="font-unbounded text-sm font-medium mb-3">📈 Распределение статусов</h3>
                    <div className="flex flex-wrap gap-4 text-sm">
                        {statusOrder.map(s => {
                            const count = statusDist[s] || 0;
                            const pct = total > 0 ? Math.round(count / total * 100) : 0;
                            return <div key={s} className="flex items-center gap-2">
                                <span className={`px-2 py-0.5 rounded ${statusColors[s] || 'bg-gray-100'}`}>{s}</span>
                                <span>{count} ({pct}%)</span>
                            </div>;
                        })}
                    </div>
                </div>
            </div>;
        };

        // ----- Data Manager Tab -----
        const DataManager = ({ data, updateData }) => {
            const [importMode, setImportMode] = useState('replace');
            const [importText, setImportText] = useState('');
            const [showImport, setShowImport] = useState(false);

            const exportJSON = () => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `domovnik_backup_${today()}.json`;
                a.click();
                addToast('📦 Бэкап JSON скачан', 'success');
            };

            const exportCSV = () => {
                const rows = [['ID', 'Зона', 'Дата', 'Время', 'Дело', 'Подготовка', 'Ответственный', 'Статус']];
                data.tasks.forEach(t => {
                    const zone = data.zones.find(z => z.id === t.zoneId);
                    rows.push([t.id, zone?.name || '', t.date, t.time, t.title, t.preparation || '', t.responsible ||
                        '', t.status || ''
                    ]);
                });
                const escapeCsvValue = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
                const csv = rows.map(row => row.map(escapeCsvValue).join(';')).join('\r\n');
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `domovnik_export_${today()}.csv`;
                a.click();
                addToast('📊 CSV экспортирован', 'success');
            };

            const mergeById = (existing, imported) => {
                const merged = [...existing];
                const indexById = new Map(existing.map((record, index) => [record?.id, index]));
                imported.filter(record => record && typeof record === 'object').forEach(record => {
                    const safeRecord = { ...record, id: record.id || uid() };
                    const index = indexById.get(safeRecord.id);
                    if (index === undefined) {
                        indexById.set(safeRecord.id, merged.length);
                        merged.push(safeRecord);
                    } else {
                        merged[index] = { ...merged[index], ...safeRecord };
                    }
                });
                return merged;
            };

            const importData = () => {
                try {
                    const parsed = JSON.parse(importText);
                    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.zones) || !Array.isArray(parsed.tasks)) {
                        throw new Error('В файле должны быть массивы «zones» и «tasks».');
                    }
                    const imported = normalizeData(parsed);
                    if (importMode === 'replace') {
                        updateData(imported);
                    } else {
                        updateData(d => ({
                            ...d,
                            zones: mergeById(d.zones, imported.zones),
                            tasks: mergeById(d.tasks, imported.tasks),
                            checklists: mergeById(d.checklists, imported.checklists),
                            events: mergeById(d.events, imported.events),
                            stickers: mergeById(d.stickers, imported.stickers),
                            garden: mergeById(d.garden, imported.garden),
                            maintenance: mergeById(d.maintenance, imported.maintenance),
                            settings: { ...d.settings, ...imported.settings }
                        }));
                    }
                    setShowImport(false);
                    setImportText('');
                    addToast('Данные импортированы.', 'success');
                } catch (e) {
                    addToast('Ошибка импорта: ' + e.message, 'error');
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    addToast('Размер JSON-файла не должен превышать 5 МБ.', 'error');
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        setImportText(JSON.stringify(parsed, null, 2));
                        setShowImport(true);
                        addToast('📄 Файл загружен', 'success');
                    } catch (err) {
                        addToast('❌ Ошибка чтения файла', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const resetDemo = () => {
                if (confirm('Сбросить все данные на демо-версию?')) {
                    updateData(demoData());
                    addToast('🔄 Демо-данные загружены', 'info');
                }
            };

            const clearAll = () => {
                if (confirm('Удалить все данные? Это необратимо!')) {
                    updateData(defaultData());
                    addToast('🗑 Все данные удалены', 'info');
                }
            };

            return <div>
                <h2 className="font-unbounded text-xl mb-4">💾 Управление данными</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="border border-paper rounded-xl p-4">
                        <h3 className="font-unbounded text-sm font-medium mb-3">📤 Экспорт</h3>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={exportJSON} className="btn-primary text-sm flex items-center gap-1">
                                <Icons.download className="w-4 h-4" /> JSON бэкап
                            </button>
                            <button onClick={exportCSV} className="btn-secondary text-sm flex items-center gap-1">
                                <Icons.download className="w-4 h-4" /> CSV (Excel)
                            </button>
                        </div>
                    </div>
                    <div className="border border-paper rounded-xl p-4">
                        <h3 className="font-unbounded text-sm font-medium mb-3">📥 Импорт</h3>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => setShowImport(true)} className="btn-primary text-sm flex items-center gap-1">
                                <Icons.upload className="w-4 h-4" /> Из текста
                            </button>
                            <label className="btn-secondary text-sm flex items-center gap-1 cursor-pointer">
                                <Icons.upload className="w-4 h-4" /> Из файла
                                <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                            </label>
                            <div className="flex items-center gap-2 text-sm">
                                <label>Режим:</label>
                                <select value={importMode} onChange={e => setImportMode(e.target.value)}
                                className="bg-transparent border border-paper rounded px-2 py-0.5 text-sm">
                                    <option value="replace">Заменить</option>
                                    <option value="merge">Объединить</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div className="border border-paper rounded-xl p-4">
                        <h3 className="font-unbounded text-sm font-medium mb-3">🔄 Синхронизация</h3>
                        <div className="flex items-center gap-3 text-sm">
                            <span className="pulse-dot"></span>
                            <span>Синхронизация между открытыми вкладками активна</span>
                            <span className="opacity-50">ID: {data.syncId || 0}</span>
                        </div>
                    </div>
                    <div className="border border-paper rounded-xl p-4">
                        <h3 className="font-unbounded text-sm font-medium mb-3">⚙️ Служебное</h3>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={resetDemo} className="btn-secondary text-sm">🔄 Демо-данные</button>
                            <button onClick={clearAll} className="btn-secondary text-sm text-red-500">🗑 Очистить всё</button>
                        </div>
                    </div>
                </div>

                <Modal isOpen={showImport} onClose={() => { setShowImport(false);
                        setImportText(''); }} title="📥 Импорт из JSON" onConfirm={importData} confirmText="Импортировать">
                    <textarea value={importText} onChange={e => setImportText(e.target.value)}
                    placeholder="Вставьте JSON данные..." className="w-full bg-transparent border border-paper rounded-lg px-3 py-2 text-sm resize-none h-48 font-mono" />
                    <div className="mt-2 text-xs opacity-50">Режим: {importMode === 'replace' ? 'замена' :
                        'объединение'}</div>
                </Modal>
            </div>;
        };

        // ----- Mount -----
        const container = document.getElementById('root');
        if (container) {
            const root = createRoot(container);
            root.render(<App />);
        }
    </script>
</body>
</html>
