// ===== HELPERS =====
function attachSayHandlers(root){
  root.querySelectorAll('[data-say]').forEach(el=>{
    el.onclick = e => { e.stopPropagation(); speak(el.dataset.say, el.dataset.saySlow!==undefined); };
  });
}

function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

function setTheme(t){
  STATE.theme = t;
  document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'');
  $('#themeBtn').textContent = t==='dark'?'☀️':'🌙';
  save();
}

function checkAchievements(){
  const newAchievements = [];
  if(STATE.learned.size >= 1 && !STATE.achievements.has('first_word')){ STATE.achievements.add('first_word'); newAchievements.push('🌱 Первое слово'); }
  if(STATE.learned.size >= 10 && !STATE.achievements.has('ten_words')){ STATE.achievements.add('ten_words'); newAchievements.push('📚 10 слов'); }
  if(STATE.learned.size >= 50 && !STATE.achievements.has('fifty_words')){ STATE.achievements.add('fifty_words'); newAchievements.push('🎓 50 слов'); }
  if(STATE.streak >= 3 && !STATE.achievements.has('streak3')){ STATE.achievements.add('streak3'); newAchievements.push('🔥 3 дня подряд'); }
  if(STATE.streak >= 7 && !STATE.achievements.has('streak7')){ STATE.achievements.add('streak7'); newAchievements.push('🌟 Неделя'); }
  if(newAchievements.length > 0){ save(); newAchievements.forEach(a => toast(`🏆 Достижение: ${a}`, 'success')); }
}

// ===== INIT =====
function init(){
  parseData();
  load();
  setTheme(STATE.theme);
  checkAchievements();
  render();
  
  $('#themeBtn').onclick = () => setTheme(STATE.theme === 'dark' ? 'light' : 'dark');
  
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      if(STATE.screen === 'session') navigate('exercises');
      else if(STATE.screen === 'grammar-detail') navigate('grammar');
      else if(STATE.screen === 'lesson') navigate('lessons');
      else if(STATE.screen !== 'home') navigate('home');
    }
    if(e.key === 'Enter' && STATE.screen === 'session'){
      const btn = $('#checkAnswer');
      if(btn) btn.click();
    }
  });
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>


<script id="didactic-expansion-script">
(function(){
'use strict';
let refreshTimer=0;
const PICK=(items,n)=>{const copy=[...items];const out=[];while(copy.length&&out.length<n){out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);}return out;};
const ESC=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
function title(){return clean(document.querySelector('#app h2,.main h2,main h2,h1')?.textContent||'Текущий урок');}
function vocabFrom(block){const data=[];Array.from(block.querySelectorAll(':scope > div')).forEach(card=>{const word=clean(card.querySelector('b')?.textContent);const translation=clean(card.querySelector('span')?.textContent);const example=clean(card.querySelector('em')?.textContent);if(word)data.push({word,translation:translation||'значение в контексте',example});});return data;}
function fallbackWords(){try{if(typeof DATA!=='undefined'&&Array.isArray(DATA.words)){const current=(typeof STATE!=='undefined'&&Number.isInteger(STATE.lessonIdx)&&Array.isArray(DATA.lessons))?DATA.lessons[STATE.lessonIdx]:null;const wanted=new Set(current?.words||[]);const direct=DATA.words.filter(item=>wanted.has(item.word)).slice(0,6).map(item=>({word:clean(item.word),translation:clean(item.trans)||'значение в контексте',example:''}));if(direct.length>1)return direct;}}catch(error){}return PICK(Array.from(document.querySelectorAll('[data-say]')).map(node=>clean(node.dataset.say)).filter(value=>value&&value.length<70),6).map(word=>({word,translation:'повторите и употребите в своей фразе',example:''}));}
function guideHTML(words){const samples=words.slice(0,3);const lesson=title();const sampleCards=samples.map(item=>'<div class="didactic-mini"><b>'+ESC(item.word)+'</b><span>'+ESC(item.translation)+'</span></div>').join('');const focus=samples[0]?.word||'ключевое выражение';return '<div class="didactic-kicker">Понятно с нуля</div><h4>Как понять этот урок без терминов</h4><p><b>'+ESC(lesson)+'</b> — это не набор непонятных правил. Здесь нужно научиться замечать готовый речевой шаблон, понимать его в ситуации и повторять так, чтобы он стал привычным. Сначала берите смысл целой фразы, а уже потом рассматривайте отдельные слова.</p><p><b>Простой алгоритм:</b> увидьте образец → произнесите его вслух → замените один знакомый элемент → скажите свою короткую фразу. Так язык превращается из таблицы в действие.</p><div class="didactic-grid">'+sampleCards+'</div><div class="didactic-callout"><b>Лайфхак «3–2–1»:</b> трижды прослушайте <b>'+ESC(focus)+'</b>, дважды повторите без чтения и один раз используйте в собственной ситуации. Если получилось неидеально, не исправляйте всё сразу: выберите только один элемент для следующей попытки.</div><p><b>Что считается успехом:</b> вы можете объяснить по-русски, когда эта фраза нужна, произнести её медленно и быстро, а затем применить в своём примере. Этого достаточно для первого прохода.</p>';}
function optionButton(text,correct){return '<button type="button" class="didactic-choice" data-correct="'+(correct?'1':'0')+'">'+ESC(text)+'</button>';}
function exercisesHTML(words){const pool=words.length?words:[{word:'слово',translation:'значение',example:''}];const selected=PICK(pool,Math.min(3,pool.length));const first=selected[0]||pool[0];const distractors=PICK(pool.filter(item=>item.translation!==first.translation),3).map(item=>item.translation);const choices=PICK([first.translation,...distractors],Math.min(4,1+distractors.length));const example=first.example||('Составьте одну короткую фразу с выражением «'+first.word+'».');const soundWords=selected.map(item=>'<li>Прослушайте и повторите: <b>'+ESC(item.word)+'</b>.</li>').join('');return '<div class="didactic-exercises"><div class="didactic-task"><p class="didactic-task-title">1. Быстрый выбор значения</p><p>Как лучше передать по-русски выражение <b>'+ESC(first.word)+'</b>?</p><div class="didactic-options">'+choices.map(value=>optionButton(value,value===first.translation)).join('')+'</div><div class="didactic-answer">Правильный ответ: <b>'+ESC(first.translation)+'</b>. Скажите исходное выражение ещё раз целой фразой.</div></div><div class="didactic-task"><p class="didactic-task-title">2. Повторение с опорой на слух</p><ul class="didactic-list">'+soundWords+'</ul><p class="didactic-answer show">Сначала слушайте в обычном темпе, затем произнесите медленнее и в конце — в естественном ритме.</p></div><div class="didactic-task"><p class="didactic-task-title">3. Свой мини-пример</p><p>Используйте фразу-опору: <i>'+ESC(example)+'</i></p><textarea class="didactic-write" placeholder="Напишите или проговорите здесь свой вариант. Сначала достаточно одной простой мысли."></textarea></div><div class="didactic-task"><p class="didactic-task-title">4. Интервальное повторение</p><p>Вернитесь к этой тройке слов через 10 минут, завтра и через 3 дня. Каждый раз сначала попробуйте вспомнить значение, затем слушайте и только после этого открывайте перевод.</p></div></div>';}
function wire(box){box.querySelectorAll('.didactic-choice').forEach(button=>button.addEventListener('click',()=>{const task=button.closest('.didactic-task');task.querySelectorAll('.didactic-choice').forEach(item=>{item.disabled=true;if(item.dataset.correct==='1')item.classList.add('correct');});if(button.dataset.correct!=='1')button.classList.add('incorrect');task.querySelector('.didactic-answer')?.classList.add('show');}));}
function addToVocab(block){if(block.dataset.didacticReady==='1')return;const words=vocabFrom(block);if(!words.length)return;const section=block.closest('.section')||block.parentElement;const guide=document.createElement('aside');guide.className='didactic-guide';guide.setAttribute('aria-label','Понятное объяснение и учебные подсказки');guide.innerHTML=guideHTML(words);const heading=Array.from(section.children).find(node=>/^H[1-6]$/.test(node.tagName));if(heading)heading.insertAdjacentElement('afterend',guide);else section.insertBefore(guide,block);const practice=document.createElement('section');practice.className='didactic-practice';practice.setAttribute('aria-label','Генератор практики');practice.innerHTML='<div class="didactic-kicker">Практика без заучивания</div><h4>Генератор упражнений по этой лексике</h4><p>Нажмите кнопку, чтобы получить новую комбинацию заданий из слов текущего урока. Генератор не повторяет один и тот же порядок и помогает вернуться к материалу несколько раз по-разному.</p><div class="didactic-actions"><button type="button" class="didactic-button primary">Сгенерировать новый набор</button><button type="button" class="didactic-button">Показать подсказки</button><span class="didactic-status" aria-live="polite">Готов первый набор из '+words.length+' слов.</span></div><div class="didactic-output"></div>';const output=practice.querySelector('.didactic-output');const create=()=>{output.innerHTML=exercisesHTML(words);wire(output);practice.querySelector('.didactic-status').textContent='Создан новый вариант упражнений. Попробуйте выполнить его без подсказок.';};practice.querySelector('.didactic-button.primary').addEventListener('click',create);practice.querySelector('.didactic-button:not(.primary)').addEventListener('click',()=>output.querySelectorAll('.didactic-answer').forEach(answer=>answer.classList.add('show')));create();block.insertAdjacentElement('afterend',practice);block.dataset.didacticReady='1';}
function addCrimeanFallback(){if(document.querySelector('.vocab')||document.querySelector('.didactic-fallback'))return;const main=document.querySelector('main');const lessonSection=main?.querySelector('.lesson-section');const words=fallbackWords();if(!main||!lessonSection||words.length<2)return;const card=document.createElement('section');card.className='didactic-practice didactic-fallback';card.innerHTML='<div class="didactic-kicker">Понятно и практично</div><h4>Как закрепить этот материал</h4><p>Не нужно запоминать всё за один раз. Выберите два выражения, сначала послушайте, затем повторите и примените в очень короткой ситуации: приветствие, просьба, ответ или сообщение.</p><div class="didactic-actions"><button class="didactic-button primary" type="button">Сгенерировать мини-практику</button><span class="didactic-status" aria-live="polite">Используются слова текущего экрана.</span></div><div class="didactic-output"></div>';const output=card.querySelector('.didactic-output');const create=()=>{output.innerHTML=exercisesHTML(words);wire(output);};card.querySelector('button').addEventListener('click',create);create();lessonSection.insertAdjacentElement('afterbegin',card);}
function refresh(){document.querySelectorAll('.vocab').forEach(addToVocab);addCrimeanFallback();}
function init(){const observer=new MutationObserver(()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(refresh,80);});observer.observe(document.body,{childList:true,subtree:true});setTimeout(refresh,180);setTimeout(refresh,700);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="adaptive-practice-script">
(function(){
'use strict';
const storeKey='adaptive_practice_'+location.pathname;
const esc=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
const normalize=value=>clean(value).toLocaleLowerCase().replace(/[.,!?;:]/g,'');
const pick=(list,count=1)=>{const copy=[...list];const out=[];while(copy.length&&out.length<count)out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);return out;};
const load=()=>{try{const data=JSON.parse(localStorage.getItem(storeKey)||'{}');return data&&typeof data==='object'?data:{mistakes:{},right:0,wrong:0,generated:0};}catch(error){return {mistakes:{},right:0,wrong:0,generated:0};}};
let state=load();if(!state.mistakes)state.mistakes={};
const save=()=>localStorage.setItem(storeKey,JSON.stringify(state));
const speechLanguage=()=>{const name=(document.title+' '+location.pathname).toLowerCase();if(name.includes('араб'))return 'ar-SA';if(name.includes('испан'))return 'es-ES';if(name.includes('итальян'))return 'it-IT';if(name.includes('китай')||name.includes('путун'))return 'zh-CN';if(name.includes('корей'))return 'ko-KR';if(name.includes('немец'))return 'de-DE';if(name.includes('норвеж'))return 'nb-NO';if(name.includes('англий'))return 'en-US';if(name.includes('русск'))return 'ru-RU';if(name.includes('француз'))return 'fr-FR';if(name.includes('япон'))return 'ja-JP';if(name.includes('португ'))return 'pt-BR';return 'tr-TR';};
const speak=word=>{if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang=speechLanguage();utterance.rate=.86;window.speechSynthesis.speak(utterance);};
function vocabFromCards(block){return Array.from(block.querySelectorAll(':scope > div')).map(card=>({word:clean(card.querySelector('b')?.textContent),translation:clean(card.querySelector('span')?.textContent),example:clean(card.querySelector('em')?.textContent)})).filter(item=>item.word&&item.translation);}
function crimeanItems(){try{if(typeof DATA==='undefined'||!Array.isArray(DATA.words))return [];const index=(typeof STATE!=='undefined'&&Number.isInteger(STATE.lessonIdx))?STATE.lessonIdx:0;const needed=new Set(DATA.lessons?.[index]?.words||[]);return DATA.words.filter(item=>needed.has(item.word)).map(item=>({word:clean(item.word),translation:clean(item.trans),example:''})).filter(item=>item.word&&item.translation);}catch(error){return [];}}
function wordsFor(block){const direct=block?vocabFromCards(block):[];return direct.length>1?direct:crimeanItems();}
function dueWords(items){const now=Date.now();return items.filter(item=>state.mistakes[normalize(item.word)]?.next<=now);}
function record(item,correct){const key=normalize(item.word);if(correct){state.right=(state.right||0)+1;const entry=state.mistakes[key];if(entry){entry.stage=Math.min((entry.stage||0)+1,3);const gaps=[10*60e3,24*60*60e3,3*24*60*60e3,7*24*60*60e3];entry.next=Date.now()+gaps[entry.stage];entry.translation=item.translation;entry.word=item.word;} }else{state.wrong=(state.wrong||0)+1;const entry=state.mistakes[key]||{word:item.word,translation:item.translation,stage:0};entry.stage=0;entry.next=Date.now();entry.translation=item.translation;state.mistakes[key]=entry;}save();}
function dashboard(items){const pending=dueWords(items).length;const total=(state.right||0)+(state.wrong||0);const accuracy=total?Math.round((state.right||0)*100/total):0;return '<div class="ap-dashboard"><div class="ap-metric"><b>'+pending+'</b><span>слов на повторение</span></div><div class="ap-metric"><b>'+accuracy+'%</b><span>точность ответов</span></div><div class="ap-metric"><b>'+(state.generated||0)+'</b><span>вариантов создано</span></div></div>';}
function choiceTask(item,pool,inverse){const correct=inverse?item.word:item.translation;const raw=inverse?pool.map(x=>x.word):pool.map(x=>x.translation);const options=pick([...new Set([correct,...pick(raw.filter(x=>x!==correct),3)])],4);return '<section class="ap-task" data-word="'+esc(item.word)+'"><h4>'+ (inverse?'Перевод → слово':'Слово → значение') +'</h4><p>'+ (inverse?'Какое слово означает «<b>'+esc(item.translation)+'</b>»?':'Как лучше передать выражение <b>'+esc(item.word)+'</b>?') +'</p><div class="ap-options">'+options.map(option=>'<button type="button" class="ap-option" data-correct="'+(option===correct?'1':'0')+'" data-word="'+esc(item.word)+'" data-translation="'+esc(item.translation)+'">'+esc(option)+'</button>').join('')+'</div><p class="ap-feedback"></p></section>';}
function typingTask(item){return '<section class="ap-task" data-word="'+esc(item.word)+'"><h4>Вспомнить без подсказки</h4><p>Напишите на изучаемом языке: <b>'+esc(item.translation)+'</b>.</p><div class="ap-inputrow"><input class="ap-input" autocomplete="off" placeholder="Ваш ответ" data-answer="'+esc(item.word)+'" data-word="'+esc(item.word)+'" data-translation="'+esc(item.translation)+'"><button type="button" class="ap-btn ap-check-input">Проверить</button></div><p class="ap-feedback"></p></section>';}
function listeningTask(item,pool){const alternatives=pick(pool.filter(x=>x.word!==item.word),2);const choices=pick([item,...alternatives],3);return '<section class="ap-task" data-word="'+esc(item.word)+'"><h4>Слуховая опора</h4><p>Нажмите «Слушать», затем выберите услышанное слово.</p><div class="ap-toolbar"><button type="button" class="ap-btn ap-speak" data-say="'+esc(item.word)+'">Слушать</button></div><div class="ap-options">'+choices.map(option=>'<button type="button" class="ap-option" data-correct="'+(option.word===item.word?'1':'0')+'" data-word="'+esc(item.word)+'" data-translation="'+esc(item.translation)+'">'+esc(option.word)+'</button>').join('')+'</div><p class="ap-feedback"></p></section>';}
function dialogueTask(items){const trio=pick(items,Math.min(3,items.length));const key=trio[0]||items[0];const roles=['Вы встречаете человека впервые.','Вы уточняете важную деталь.','Вы заканчиваете короткий разговор вежливо.'];const lines=trio.map((item,index)=>'<li><b>Шаг '+(index+1)+':</b> '+roles[index]+' Используйте <b>'+esc(item.word)+'</b> («'+esc(item.translation)+'»).</li>').join('');return '<section class="ap-task"><h4>Мини-диалог: говорите, а не переводите</h4><div class="ap-dialogue"><p>Сценарий: короткий разговор в ситуации текущего урока. Начните с выражения <b>'+esc(key.word)+'</b>, затем добавьте свой вопрос или ответ.</p><ol>'+lines+'</ol></div><div class="ap-toolbar"><button type="button" class="ap-btn ap-speak" data-say="'+esc(key.word)+'">Прослушать ключевую реплику</button><button type="button" class="ap-btn ap-done-dialogue" data-word="'+esc(key.word)+'" data-translation="'+esc(key.translation)+'">Я проговорил(а) диалог</button></div><p class="ap-feedback"></p></section>';}
function schedule(){return '<div class="ap-note"><b>План повторения по ошибкам:</b> неверный ответ остаётся в тренажёре на текущую сессию. После верного ответа он переносится на повторение через 10 минут, затем через 1 день, 3 дня и 7 дней. Кнопка «Повторить ошибки» подбирает слова, срок которых уже наступил.</div>';}
function bind(box,items,status){box.querySelectorAll('.ap-option').forEach(button=>button.addEventListener('click',()=>{const task=button.closest('.ap-task');if(task.dataset.done==='1')return;task.dataset.done='1';const item={word:button.dataset.word,translation:button.dataset.translation};const correct=button.dataset.correct==='1';task.querySelectorAll('.ap-option').forEach(option=>{option.disabled=true;if(option.dataset.correct==='1')option.classList.add('correct');});if(!correct)button.classList.add('incorrect');record(item,correct);const feedback=task.querySelector('.ap-feedback');feedback.className='ap-feedback show '+(correct?'good':'bad');feedback.textContent=correct?'Верно. Это слово перейдёт на более редкое повторение.':'Пока нет. Слово добавлено в ближайшее повторение; произнесите его и попробуйте ещё раз в следующем наборе.';status.textContent='Статистика обновлена. Ошибки сохраняются только в этом браузере.';renderDashboard(box.closest('.adaptive-practice'),items);}));box.querySelectorAll('.ap-check-input').forEach(button=>button.addEventListener('click',()=>{const task=button.closest('.ap-task');if(task.dataset.done==='1')return;const input=task.querySelector('.ap-input');const item={word:input.dataset.word,translation:input.dataset.translation};const correct=normalize(input.value)===normalize(input.dataset.answer);task.dataset.done='1';input.disabled=true;button.disabled=true;input.style.borderColor=correct?'#167c4c':'#b42318';record(item,correct);const feedback=task.querySelector('.ap-feedback');feedback.className='ap-feedback show '+(correct?'good':'bad');feedback.innerHTML=correct?'Верно. Отличная активная память.':'Правильный вариант: <b>'+esc(item.word)+'</b>. Скажите его вслух и вернитесь к нему в следующем наборе.';status.textContent='Статистика обновлена. Ошибки сохраняются только в этом браузере.';renderDashboard(box.closest('.adaptive-practice'),items);}));box.querySelectorAll('.ap-speak').forEach(button=>button.addEventListener('click',()=>speak(button.dataset.say)));box.querySelectorAll('.ap-done-dialogue').forEach(button=>button.addEventListener('click',()=>{record({word:button.dataset.word,translation:button.dataset.translation},true);const feedback=button.closest('.ap-task').querySelector('.ap-feedback');feedback.className='ap-feedback show good';feedback.textContent='Отлично. Теперь повторите диалог без чтения и замените одно слово на другое из урока.';renderDashboard(box.closest('.adaptive-practice'),items);}));}
function renderDashboard(container,items){container.querySelector('.ap-dashboard').outerHTML=dashboard(items);}
function renderSet(container,items,reviewOnly){const pool=reviewOnly?dueWords(items):items;const active=reviewOnly?(pool.length?pool:items):items;if(!active.length){container.querySelector('.ap-output').innerHTML='<div class="ap-empty">Пока нет слов для генерации. Откройте модуль с активной лексикой.</div>';return;}const chosen=pick(active,Math.min(4,active.length));const tasks=[];if(chosen[0])tasks.push(choiceTask(chosen[0],active,false));if(chosen[1])tasks.push(choiceTask(chosen[1],active,true));if(chosen[2])tasks.push(typingTask(chosen[2]));if(chosen[3])tasks.push(listeningTask(chosen[3],active));tasks.push(dialogueTask(chosen.length?chosen:active));container.querySelector('.ap-output').innerHTML=tasks.join('')+schedule();state.generated=(state.generated||0)+1;save();container.querySelector('.ap-status').textContent=reviewOnly?(pool.length?'Собран повтор ошибок: '+pool.length+' слов(а) доступно сейчас.':'Нет просроченных ошибок; показан обычный набор для поддержания навыка.'):'Новый набор собран из слов текущего урока. Меняются слова, порядок и типы заданий.';renderDashboard(container,items);bind(container.querySelector('.ap-output'),items,container.querySelector('.ap-status'));}
function mount(items,anchor){if(!items||items.length<2||document.querySelector('.adaptive-practice'))return;const container=document.createElement('section');container.className='adaptive-practice';container.setAttribute('aria-label','Адаптивный тренажёр и генератор упражнений');container.innerHTML='<div class="ap-kicker">Адаптивная практика</div><h3>Тренажёр: новые задания, ошибки и говорение</h3><p>Этот блок создаёт разные задания из слов текущего урока. Он запоминает ошибки только в вашем браузере и возвращает их в нужный момент, чтобы вы повторяли не всё подряд, а именно то, что пока не закрепилось.</p>'+dashboard(items)+'<div class="ap-toolbar"><button type="button" class="ap-btn primary ap-generate">Новый набор из 5 заданий</button><button type="button" class="ap-btn review ap-review">Повторить ошибки</button><button type="button" class="ap-btn ap-dialogue-only">Сгенерировать мини-диалог</button></div><p class="ap-status" aria-live="polite">Готово: используются '+items.length+' слов(а) текущего урока.</p><div class="ap-output"></div>';const output=container.querySelector('.ap-output');anchor.insertAdjacentElement('afterend',container);container.querySelector('.ap-generate').addEventListener('click',()=>renderSet(container,items,false));container.querySelector('.ap-review').addEventListener('click',()=>renderSet(container,items,true));container.querySelector('.ap-dialogue-only').addEventListener('click',()=>{output.innerHTML=dialogueTask(items)+schedule();container.querySelector('.ap-status').textContent='Собран новый мини-диалог. Проговорите его, затем замените хотя бы одно слово.';bind(output,items,container.querySelector('.ap-status'));});renderSet(container,items,false);}
function refresh(){const vocab=document.querySelector('.vocab');const items=wordsFor(vocab);if(items.length>1){const anchor=document.querySelector('.didactic-practice')||vocab||document.querySelector('.lesson-section');if(anchor)mount(items,anchor);}}
function init(){const observer=new MutationObserver(()=>setTimeout(refresh,100));observer.observe(document.body,{childList:true,subtree:true});setTimeout(refresh,850);setTimeout(refresh,1400);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="phonetic-lab-script">
(function(){
'use strict';
const CONFIG={
'arabic':{lang:'ar-SA',name:'арабского',headline:'Согласные и долгота гласных',principle:'Сначала различайте короткие и долгие гласные, затем обратите внимание на согласные, которые произносятся глубже или твёрже. Не пытайтесь говорить быстро до того, как услышите контраст.',mistake:'Не заменяйте разные арабские согласные одной русской привычной буквой: слушайте место и силу звука.',routine:'Произнесите слово медленно по слогам, затем соедините слоги без пауз и повторите в короткой фразе.'},
'spanish':{lang:'es-ES',name:'испанского',headline:'Чистые гласные и ритм',principle:'Испанские гласные обычно сохраняют чёткое качество: не превращайте их в русские редуцированные звуки. Сначала держите ровный ритм, затем отдельно тренируйте r и rr.',mistake:'Не растягивайте и не «съедайте» безударные гласные; каждая гласная должна быть слышна.',routine:'Отбейте ладонью слоги, произнесите каждую гласную одинаково ясно и только потом ускорьте фразу.'},
'italian':{lang:'it-IT',name:'итальянского',headline:'Гласные, удвоение и ясные слоги',principle:'Итальянская речь строится из ясных слогов. Важно слышать разницу между обычной и удвоенной согласной: удвоение меняет границу и длительность.',mistake:'Не проглатывайте гласные и не сокращайте двойную согласную до одной.',routine:'Сначала произнесите слово медленно, чуть дольше удерживая удвоенный согласный звук, затем вернитесь к естественному темпу.'},
'chinese':{lang:'zh-CN',name:'китайского',headline:'Тоны, инициали и финали',principle:'В путунхуа тон — часть слова, а не украшение. Тренируйте одну и ту же слоговую основу с разными мелодиями, затем связывайте тон и смысл.',mistake:'Не заменяйте тон русской интонацией конца предложения: сначала удерживайте форму тона на одном слоге.',routine:'Скажите слог медленно, проведите рукой направление тона, затем произнесите слово и короткую фразу.'},
'korean':{lang:'ko-KR',name:'корейского',headline:'Слоги, придыхание и финальный согласный',principle:'Корейский удобно учить слогами: начало слога, гласная и возможный финальный согласный. Слушайте контраст обычных, придыхательных и напряжённых согласных.',mistake:'Не добавляйте после финального согласного русскую гласную и не делайте каждый слог одинаково громким.',routine:'Хлопните один раз на каждый слог, затем отдельно повторите конечный согласный и соедините слово.'},
'crimean':{lang:'tr-TR',name:'крымскотатарского',headline:'Гармония гласных и точные согласные',principle:'Сначала замечайте гласные и их согласование внутри слова. Отдельно слушайте q, ğ, ñ и долготу: это не декоративные буквы, а подсказки к звуку.',mistake:'Не заменяйте q на обычное русское к и не пропускайте гласные в длинном слове.',routine:'Разделите слово на слоги, назовите гласные, затем повторите всё слово в плавном ритме.'},
'german':{lang:'de-DE',name:'немецкого',headline:'Долгота, умлауты и ch',principle:'Немецкое слово часто различается по длительности гласного и по качеству согласного. Тренируйте пары с длинным и коротким гласным, а ich- и ach-звук учите как отдельные жесты языка.',mistake:'Не превращайте все ch в русское х и не игнорируйте умлауты ä, ö, ü.',routine:'Сначала растяните гласную или сделайте её короткой, затем произнесите согласный отдельно и соедините всё слово.'},
'norwegian':{lang:'nb-NO',name:'норвежского Bokmål',headline:'Долгота и спокойный ритм',principle:'В норвежском полезно слышать длину гласной и согласной. Не гонитесь за музыкальностью речи на первом шаге: сначала добейтесь чётких слов и ровного темпа.',mistake:'Не переносите русское ударение автоматически и не сокращайте долгие гласные.',routine:'Повторите слово в медленном темпе, слегка удлиняя ключевую гласную, затем используйте его в короткой связке.'},
'portuguese':{lang:'pt-BR',name:'португальского',headline:'Носовые гласные и связный ритм',principle:'В португальском носовой оттенок и безударные гласные важнее, чем кажется. Слушайте слово целиком: часть гласных произносится короче или меняет качество в потоке речи.',mistake:'Не произносите каждую букву отдельно и не закрывайте носовой гласный слишком резко.',routine:'Повторите слово с лёгким носовым резонансом, затем произнесите его в короткой фразе на одном дыхании.'},
'english':{lang:'en-US',name:'английского',headline:'Ударение, schwa и связная речь',principle:'Английская понятность держится на ударных слогах и нейтральном безударном звуке. Сначала найдите сильный слог, затем сделайте остальные короче и легче.',mistake:'Не произносите каждую букву по отдельности и не делайте все слоги одинаково сильными.',routine:'Хлопните на ударный слог, произнесите слово медленно, затем повторите его в ритмичной короткой фразе.'},
'russian':{lang:'ru-RU',name:'русского',headline:'Ударение, редукция и мягкость',principle:'В русском ударение делает один слог главным, а безударные гласные часто звучат иначе. Отдельно слушайте пару твёрдого и мягкого согласного.',mistake:'Не пытайтесь одинаково чётко произнести все безударные гласные и не игнорируйте мягкий знак.',routine:'Сначала выделите ударный слог голосом, затем медленно повторите соседний согласный твёрдо и мягко.'},
'french':{lang:'fr-FR',name:'французского',headline:'Носовые гласные, liaison и поток речи',principle:'Французский лучше учить связками, а не изолированными буквами. Носовая гласная произносится как единый звук, а liaison появляется только в подходящей связке.',mistake:'Не добавляйте русское н после носового гласного и не произносите все финальные буквы.',routine:'Повторите короткую связку на одном дыхании, затем произнесите её медленно, сохраняя плавное соединение.'},
'japanese':{lang:'ja-JP',name:'японского',headline:'Моры, долгота и пауза',principle:'Японский ритм удобно считать морами: короткими равными долями. Долгая гласная и удвоенная согласная занимают дополнительную долю.',mistake:'Не ставьте русское силовое ударение на один слог и не сокращайте долготу.',routine:'Отбейте равные доли рукой, затем произнесите слово, сохраняя одинаковую длительность каждой моры.'}
};

const esc=value=>String(value||'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const clean=value=>String(value||'').replace(/\s+/g,' ').trim();
const normalize=value=>clean(value).toLocaleLowerCase().replace(/[.,!?;:]/g,'');
const pick=(list,count=1)=>{const copy=[...list];const out=[];while(copy.length&&out.length<count)out.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);return out;};
function keyFor(){const name=(document.title+' '+location.pathname).toLowerCase();if(name.includes('араб'))return'arabic';if(name.includes('испан'))return'spanish';if(name.includes('итальян'))return'italian';if(name.includes('китай')||name.includes('путун'))return'chinese';if(name.includes('корей'))return'korean';if(name.includes('крым'))return'crimean';if(name.includes('немец'))return'german';if(name.includes('норвеж'))return'norwegian';if(name.includes('португ'))return'portuguese';if(name.includes('англий'))return'english';if(name.includes('русск'))return'russian';if(name.includes('француз'))return'french';if(name.includes('япон'))return'japanese';return'english';}
const cfg=()=>CONFIG[keyFor()]||CONFIG.english;
function getVoice(){const language=cfg().lang.toLowerCase();const voices=window.speechSynthesis?.getVoices?.()||[];return voices.find(voice=>voice.lang?.toLowerCase()===language)||voices.find(voice=>voice.lang?.toLowerCase().startsWith(language.split('-')[0]))||null;}
function playFallback(status){const source=FALLBACK_AUDIO[keyFor()];if(!source)return false;try{const audio=new Audio(source);audio.preload='auto';audio.play().then(()=>{status.textContent='Нативный голос недоступен: воспроизводится автономный контрольный образец для проверки звука. Для полного словаря установите голос '+cfg().lang+'.';}).catch(()=>{status.textContent='Нативный голос и резервный образец не запустились. Проверьте разрешение звука и настройки браузера.';});return true;}catch(error){return false;}}
function say(text,rate,status){if(!('speechSynthesis' in window)){if(!playFallback(status))status.textContent='Озвучивание не поддерживается этим браузером. Откройте курс в современном браузере.';return;}const phrase=clean(text);if(!phrase){status.textContent='Нет текста для озвучивания.';return;}window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(phrase);utterance.lang=cfg().lang;utterance.rate=rate||.82;const voice=getVoice();if(voice)utterance.voice=voice;status.textContent=voice?'Произношение воспроизводится голосом: '+voice.name+'.':'Целевой голос пока не найден. Браузер пытается использовать доступный голос; при сбое будет предложен автономный контрольный образец.';utterance.onend=()=>{status.textContent='Прослушано. Повторите: медленно → обычный темп → в короткой фразе.';};utterance.onerror=()=>{if(!playFallback(status))status.textContent='Браузер не смог воспроизвести этот фрагмент. Проверьте разрешение звука, установленные голоса и повторите попытку.';};window.speechSynthesis.speak(utterance);}
function cardsFrom(block){return Array.from(block?.querySelectorAll(':scope > div')||[]).map(card=>{const word=clean(card.querySelector('b')?.textContent);const translation=clean(card.querySelector('span')?.textContent);const ipa=clean(card.querySelector('.phonetic')?.textContent)||((clean(card.textContent).match(/\/[^/]{1,45}\//)||[])[0]||'');return{word,translation,ipa};}).filter(item=>item.word&&item.translation);}
function crimeanWords(){try{if(typeof DATA==='undefined'||!Array.isArray(DATA.words))return[];const lesson=(typeof STATE!=='undefined'&&Number.isInteger(STATE.lessonIdx))?DATA.lessons?.[STATE.lessonIdx]:null;const needed=new Set(lesson?.words||[]);return DATA.words.filter(item=>needed.has(item.word)).map(item=>({word:clean(item.word),translation:clean(item.trans),ipa:clean(item.ipa)})).filter(item=>item.word&&item.translation);}catch(error){return[];}}
function getItems(){const direct=cardsFrom(document.querySelector('.vocab'));return direct.length>1?direct:crimeanWords();}
function theoryHTML(items){const first=items[0]||{word:'слово',translation:'значение',ipa:''};const details=cfg();return '<div class="pl-kicker">Фонетика без сложных терминов</div><h3>Звучание '+esc(details.name)+': '+esc(details.headline)+'</h3><p>Фонетика — это не проверка «идеальности». Её цель — сделать вашу речь понятной и научить слышать разницу между похожими словами. Начинайте с одного короткого элемента и повторяйте его несколько раз, а не пытайтесь сразу скопировать длинную фразу.</p><div class="pl-grid"><div class="pl-card"><b>На что слушать</b><span>'+esc(details.principle)+'</span></div><div class="pl-card"><b>Типичная ловушка</b><span>'+esc(details.mistake)+'</span></div><div class="pl-card"><b>Рабочий алгоритм</b><span>'+esc(details.routine)+'</span></div></div><div class="pl-theory"><b>Стартовый образец:</b> <span class="pl-target">'+esc(first.word)+'</span> — '+esc(first.translation)+(first.ipa?' <span class="pl-ipa">'+esc(first.ipa)+'</span>':'')+'. Сначала услышите его, затем повторите медленно, в нормальном темпе и в своей короткой фразе.</div>';}
function listenTask(item){return '<section class="pl-task"><h4>1. Слуховой фокус</h4><p>Нажмите «Слушать» и выберите услышанное слово. Не читайте варианты до первого прослушивания.</p><div class="pl-tools"><button type="button" class="pl-btn primary pl-say" data-say="'+esc(item.word)+'">Слушать медленно</button><button type="button" class="pl-btn pl-say-fast" data-say="'+esc(item.word)+'">Обычный темп</button></div><p class="pl-target">'+esc(item.word)+'</p>'+(item.ipa?'<p class="pl-ipa">'+esc(item.ipa)+'</p>':'')+'<p class="pl-note">После прослушивания закройте слово ладонью и попробуйте воспроизвести ритм или тон голосом.</p></section>';}
function dictationTask(item,items){const alternatives=pick(items.filter(entry=>entry.word!==item.word),3);const options=pick([item,...alternatives],Math.min(4,1+alternatives.length));return '<section class="pl-task" data-answer="'+esc(item.word)+'"><h4>2. Фонетический выбор</h4><p>Слушайте слово, затем выберите услышанную форму.</p><div class="pl-tools"><button type="button" class="pl-btn primary pl-say" data-say="'+esc(item.word)+'">Слушать</button></div><div class="pl-options">'+options.map(option=>'<button type="button" class="pl-option" data-correct="'+(option.word===item.word?'1':'0')+'">'+esc(option.word)+'</button>').join('')+'</div><p class="pl-feedback"></p></section>';}
function typingTask(item){return '<section class="pl-task" data-answer="'+esc(item.word)+'"><h4>3. Диктант без подсказки</h4><p>Послушайте фрагмент, затем напишите слово. Сначала доверьтесь слуху, после этого проверьте написание.</p><div class="pl-tools"><button type="button" class="pl-btn primary pl-say" data-say="'+esc(item.word)+'">Слушать</button></div><div class="pl-inputrow"><input class="pl-input" autocomplete="off" placeholder="Запишите услышанное слово"><button type="button" class="pl-btn pl-check">Проверить</button></div><p class="pl-feedback"></p></section>';}
function echoTask(items){const selected=pick(items,Math.min(3,items.length));const words=selected.map(item=>'<span class="pl-target">'+esc(item.word)+'</span>'+(item.ipa?' <span class="pl-ipa">'+esc(item.ipa)+'</span>':'')).join(' → ');const phrase=selected.map(item=>item.word).join(' · ');return '<section class="pl-task"><h4>4. Эхо и ритм</h4><p>Повторите цепочку три раза: сначала медленно, затем в обычном темпе, затем как часть фразы. Сохраняйте контраст, который важен для этого языка.</p><div class="pl-sequence">'+words+'</div><div class="pl-tools"><button type="button" class="pl-btn primary pl-say" data-say="'+esc(phrase)+'">Слушать цепочку</button><button type="button" class="pl-btn pl-self-check">Я повторил(а) три раза</button></div><p class="pl-feedback"></p></section>';}
function build(container,items){const chosen=pick(items,Math.min(4,items.length));const selected=chosen.length?chosen:items;const output=container.querySelector('.pl-output');output.innerHTML=(selected[0]?listenTask(selected[0]):'')+(selected[1]?dictationTask(selected[1],items):'')+(selected[2]?typingTask(selected[2]):'')+echoTask(selected);container.querySelector('.pl-status').textContent='Создан новый фонетический набор: слушание, диктант, ритм и самопроверка.';wire(output,container.querySelector('.pl-status'));}
function wire(output,status){output.querySelectorAll('.pl-say').forEach(button=>button.addEventListener('click',()=>say(button.dataset.say,.68,status)));output.querySelectorAll('.pl-say-fast').forEach(button=>button.addEventListener('click',()=>say(button.dataset.say,.9,status)));output.querySelectorAll('.pl-option').forEach(button=>button.addEventListener('click',()=>{const task=button.closest('.pl-task');if(task.dataset.done==='1')return;task.dataset.done='1';const correct=button.dataset.correct==='1';task.querySelectorAll('.pl-option').forEach(option=>{option.disabled=true;if(option.dataset.correct==='1')option.classList.add('correct');});if(!correct)button.classList.add('incorrect');const feedback=task.querySelector('.pl-feedback');feedback.className='pl-feedback show '+(correct?'good':'bad');feedback.textContent=correct?'Верно. Теперь прослушайте слово ещё раз и повторите его без чтения.':'Пока нет. Слушайте ещё раз, выделите начало и конец слова, затем повторите в медленном темпе.';}));output.querySelectorAll('.pl-check').forEach(button=>button.addEventListener('click',()=>{const task=button.closest('.pl-task');if(task.dataset.done==='1')return;task.dataset.done='1';const input=task.querySelector('.pl-input');const correct=normalize(input.value)===normalize(task.dataset.answer);input.disabled=true;button.disabled=true;input.style.borderColor=correct?'#15803d':'#b91c1c';const feedback=task.querySelector('.pl-feedback');feedback.className='pl-feedback show '+(correct?'good':'bad');feedback.innerHTML=correct?'Верно. Произнесите слово ещё раз, но теперь не читая с экрана.':'Верное написание: <b>'+esc(task.dataset.answer)+'</b>. Прослушайте ещё раз и разделите слово на удобные для вас части.';}));output.querySelectorAll('.pl-self-check').forEach(button=>button.addEventListener('click',()=>{const feedback=button.closest('.pl-task').querySelector('.pl-feedback');feedback.className='pl-feedback show good';feedback.textContent='Отлично. Следующий шаг: замените одно слово в цепочке на другое из урока и повторите без пауз.';}));}
function mount(items,anchor){if(items.length<2||document.querySelector('.phonetic-lab'))return;const container=document.createElement('section');container.className='phonetic-lab';container.setAttribute('aria-label','Фонетический блок и тренажёр произношения');container.innerHTML=theoryHTML(items)+'<div class="pl-tools"><button type="button" class="pl-btn primary pl-test-voice">Проверить озвучивание</button><button type="button" class="pl-btn pl-new-set">Сгенерировать фонетическую практику</button></div><p class="pl-status" aria-live="polite">Нажмите «Проверить озвучивание»: курс подберёт голос для '+esc(cfg().lang)+' или сообщит, если в браузере доступен только запасной вариант.</p><div class="pl-output"></div>';anchor.insertAdjacentElement('afterend',container);container.querySelector('.pl-test-voice').addEventListener('click',()=>{const words=pick(items,Math.min(2,items.length)).map(item=>item.word).join(' · ');say(words,.8,container.querySelector('.pl-status'));});container.querySelector('.pl-new-set').addEventListener('click',()=>build(container,items));build(container,items);}
function refresh(){const items=getItems();if(items.length>1){const anchor=document.querySelector('.adaptive-practice')||document.querySelector('.didactic-practice')||document.querySelector('.vocab')||document.querySelector('.lesson-section');if(anchor)mount(items,anchor);}}
function init(){if('speechSynthesis'in window){window.speechSynthesis.onvoiceschanged=()=>{};}const observer=new MutationObserver(()=>setTimeout(refresh,100));observer.observe(document.body,{childList:true,subtree:true});setTimeout(refresh,1200);setTimeout(refresh,1900);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="phonetic-quiz-script">
(function(){
'use strict';
const META={
arabic:{lang:'ar-SA',title:'арабского',focus:'долгота гласных и различие согласных',tip:'Сначала слушайте целый слог и его длительность, а не пытайтесь заменить все похожие согласные одной русской буквой.'},
spanish:{lang:'es-ES',title:'испанского',focus:'ясные гласные и ритм',tip:'Держите каждую гласную слышимой и не сокращайте её так, как в русской быстрой речи.'},
italian:{lang:'it-IT',title:'итальянского',focus:'ясные слоги и удвоенные согласные',tip:'Услышьте, где согласный произносится дольше: это может менять границу слова и значение.'},
chinese:{lang:'zh-CN',title:'путунхуа',focus:'тона, инициали и финали',tip:'Тон — часть слова. Сначала удерживайте мелодию одного слога, затем соединяйте её с остальными.'},
korean:{lang:'ko-KR',title:'корейского',focus:'слоговая структура и типы согласных',tip:'Не добавляйте после конечного согласного русскую гласную: заканчивайте слог чётко.'},
crimean:{lang:'tr-TR',title:'крымскотатарского',focus:'гармония гласных и точные согласные',tip:'Разделяйте длинное слово на слоги, прислушивайтесь к гласным и не упрощайте особые согласные.'},
german:{lang:'de-DE',title:'немецкого',focus:'долгота, умлауты и ch',tip:'Не заменяйте все варианты ch одним русским х; сначала различите долгую и короткую гласную.'},
norwegian:{lang:'nb-NO',title:'норвежского Bokmål',focus:'долгота и спокойный ритм',tip:'Не переносите русское ударение автоматически. Сначала слушайте длину гласной и общий ритм слова.'},
portuguese:{lang:'pt-BR',title:'португальского',focus:'носовые гласные и связный ритм',tip:'Не читайте каждую букву отдельно: слушайте носовой оттенок и связность слова целиком.'},
english:{lang:'en-US',title:'английского',focus:'ударение, schwa и связная речь',tip:'Сделайте один слог сильнее, а остальные короче и легче; не произносите каждую букву отдельно.'},
russian:{lang:'ru-RU',title:'русского',focus:'ударение, редукция и мягкость',tip:'Найдите ударный слог, затем проверьте, не смешали ли вы твёрдый и мягкий согласный.'},
french:{lang:'fr-FR',title:'французского',focus:'носовые гласные и связки слов',tip:'Носовой гласный — единый звук; не добавляйте после него отдельное русское н.'},
japanese:{lang:'ja-JP',title:'японского',focus:'моры, долгота и пауза',tip:'Считайте равные короткие доли. Долгая гласная и удвоенный согласный занимают дополнительную долю.'}
};
const esc=v=>String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const clean=v=>String(v||'').replace(/\s+/g,' ').trim();
const normal=v=>clean(v).toLocaleLowerCase().replace(/[.,!?;:]/g,'');
const pick=(list,count=1)=>{const a=[...list],o=[];while(a.length&&o.length<count)o.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);return o;};
function key(){const s=(document.title+' '+location.pathname).toLowerCase();if(s.includes('араб'))return'arabic';if(s.includes('испан'))return'spanish';if(s.includes('итальян'))return'italian';if(s.includes('китай')||s.includes('путун'))return'chinese';if(s.includes('корей'))return'korean';if(s.includes('крым'))return'crimean';if(s.includes('немец'))return'german';if(s.includes('норвеж'))return'norwegian';if(s.includes('португ'))return'portuguese';if(s.includes('англий'))return'english';if(s.includes('русск'))return'russian';if(s.includes('француз'))return'french';if(s.includes('япон'))return'japanese';return'english';}
function meta(){return META[key()]||META.english;}
function words(){const cards=Array.from(document.querySelectorAll('.vocab > div')).map(card=>({word:clean(card.querySelector('b')?.textContent),trans:clean(card.querySelector('span')?.textContent),ipa:clean(card.querySelector('.phonetic')?.textContent)||((clean(card.textContent).match(/\/[^/]{1,50}\//)||[])[0]||'')})).filter(x=>x.word&&x.trans);if(cards.length>1)return cards;try{if(typeof DATA!=='undefined'&&Array.isArray(DATA.words)){const lesson=typeof STATE!=='undefined'?DATA.lessons?.[STATE.lessonIdx]:null;const current=new Set(lesson?.words||[]);return DATA.words.filter(x=>current.has(x.word)).map(x=>({word:clean(x.word),trans:clean(x.trans),ipa:clean(x.ipa)})).filter(x=>x.word&&x.trans);}}catch(e){}return[];}
function fallback(status){try{const text=document.getElementById('phonetic-lab-script')?.textContent||'';const m=text.match(/const FALLBACK_AUDIO=({.*?});/);if(!m)return false;const data=JSON.parse(m[1]);const a=new Audio(data[key()]);a.play().then(()=>status.textContent='Воспроизводится автономный контрольный образец: голос браузера недоступен.').catch(()=>status.textContent='Не удалось запустить звук. Проверьте разрешение аудио в браузере.');return true;}catch(e){return false;}}
function speak(text,status){if(!('speechSynthesis'in window)){if(!fallback(status))status.textContent='Этот браузер не поддерживает озвучивание.';return;}const u=new SpeechSynthesisUtterance(text);u.lang=meta().lang;u.rate=.78;const voices=window.speechSynthesis.getVoices?.()||[];const wanted=meta().lang.toLowerCase();u.voice=voices.find(v=>v.lang?.toLowerCase()===wanted)||voices.find(v=>v.lang?.toLowerCase().startsWith(wanted.split('-')[0]));u.onerror=()=>{if(!fallback(status))status.textContent='Озвучивание не запустилось. Проверьте голосовой пакет языка.';};u.onend=()=>status.textContent='Прослушано. Теперь выберите ответ, не перечитывая слово заранее.';window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}
function question(title,body,answer,type,explain){return{title,body,answer,type,explain};}
function build(items){const chosen=pick(items,Math.min(4,items.length));const a=chosen[0]||items[0],b=chosen[1]||a,c=chosen[2]||b;const distractors=pick(items.filter(x=>x.word!==a.word),3);const listenOptions=pick([a,...distractors],Math.min(4,1+distractors.length));const transcription=c.ipa||c.word;const transOptions=pick([c,...pick(items.filter(x=>x.word!==c.word),3)],Math.min(4,items.length));return[
question('1. Слуховое различение','Нажмите «Слушать», затем выберите услышанное слово.',a.word,'listen',{good:'Вы распознали слово на слух. Повторите его вслух до того, как смотреть на написание.',bad:'Слушайте ещё раз: сначала уловите длину, тон или ритм, а затем сопоставьте звук с формой.' ,options:listenOptions}),
question('2. Транскрипция или Pinyin','Какому слову в текущем уроке соответствует запись «'+esc(transcription)+'»?',c.word,'choice',{good:'Верно. Транскрипция — опора для слуха и артикуляции, а не замена живому прослушиванию.',bad:'Сравните запись с карточкой лексики, затем произнесите слово медленно и обычным темпом.',options:transOptions}),
question('3. Стратегия произношения','Что особенно важно в фонетике '+meta().title+' в этом курсе?',meta().focus,'strategy',{good:'Верно. Вы выбрали фокус текущего языка.',bad:'Верный фокус: '+meta().focus+'. '+meta().tip,options:[meta().focus,'только буквальный перевод','скорость без предварительного слухового анализа','запоминание написания без прослушивания']}),
question('4. Фонетический диктант','Нажмите «Слушать» и запишите услышанное слово без подсказки.',b.word,'input',{good:'Верно. Теперь повторите слово три раза: медленно, в обычном темпе и в короткой фразе.',bad:'Правильный ответ: '+b.word+'. '+meta().tip}),
question('5. Верная последовательность','Какой порядок лучше помогает освоить новое слово?', 'слушать → медленно повторить → произнести в фразе','strategy',{good:'Верно. Такой порядок соединяет восприятие, артикуляцию и реальное употребление.',bad:'Сначала нужно услышать образец, затем повторить его медленно и только потом встроить в фразу.',options:['слушать → медленно повторить → произнести в фразе','прочитать перевод → быстро сказать один раз → перейти дальше','выучить написание → не слушать образец → проверить себя','сразу произнести длинную фразу без разбора']})
];}
function renderQuiz(root,items){const questions=build(items);root.innerHTML='<div class="pq-kicker">Проверка усвоения фонетики</div><h3>Интерактивный фонетический квиз</h3><p class="pq-intro">Пять заданий проверяют, насколько вы умеете слышать форму слова, читать транскрипцию или Pinyin и выбирать верную стратегию произношения. Квиз оценивает результат после всех ответов и объясняет каждую ошибку.</p><div class="pq-progress" aria-label="Прогресс квиза"><span></span></div><div class="pq-questions"></div><div class="pq-actions"><button type="button" class="pq-check">Проверить результат</button><button type="button" class="pq-retry">Новый квиз</button><span class="pq-status" aria-live="polite">Ответьте на все пять заданий.</span></div><div class="pq-result" aria-live="polite"></div>';
const box=root.querySelector('.pq-questions');questions.forEach((q,index)=>{const node=document.createElement('section');node.className='pq-question';node.dataset.answer=q.answer;node.dataset.type=q.type;node.dataset.index=index;node.innerHTML='<h4>'+esc(q.title)+'</h4><p>'+q.body+'</p>'+(q.type==='listen'||q.type==='input'?'<button type="button" class="pq-listen" data-say="'+esc(q.answer)+'">Слушать</button>':'')+(q.type==='input'?'<div style="margin-top:9px"><input class="pq-input" autocomplete="off" placeholder="Введите ответ"></div>':'<div class="pq-options">'+q.explain.options.map(opt=>'<button type="button" class="pq-option" data-value="'+esc(opt.word||opt)+'">'+esc(opt.word||opt)+'</button>').join('')+'</div>')+'<div class="pq-explain"></div>';node._question=q;box.appendChild(node);});
wire(root);
}
function wire(root){const status=root.querySelector('.pq-status');root.querySelectorAll('.pq-listen').forEach(btn=>btn.addEventListener('click',()=>speak(btn.dataset.say,status)));root.querySelectorAll('.pq-option').forEach(btn=>btn.addEventListener('click',()=>{const parent=btn.closest('.pq-question');if(parent.dataset.locked==='1')return;parent.querySelectorAll('.pq-option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');updateProgress(root);}));root.querySelector('.pq-check').addEventListener('click',()=>grade(root));root.querySelector('.pq-retry').addEventListener('click',()=>{const items=words();if(items.length>1)renderQuiz(root,items);});}
function updateProgress(root){const all=Array.from(root.querySelectorAll('.pq-question'));const answered=all.filter(q=>q.dataset.type==='input'?clean(q.querySelector('.pq-input')?.value):q.querySelector('.pq-option.selected')).length;root.querySelector('.pq-progress span').style.width=(answered/all.length*100)+'%';root.querySelector('.pq-status').textContent='Отвечено: '+answered+' из '+all.length+'.';}
function grade(root){const all=Array.from(root.querySelectorAll('.pq-question'));const empty=all.filter(q=>q.dataset.type==='input'?!clean(q.querySelector('.pq-input')?.value):!q.querySelector('.pq-option.selected'));if(empty.length){root.querySelector('.pq-status').textContent='Сначала ответьте на все задания: осталось '+empty.length+'.';empty[0].scrollIntoView({behavior:'smooth',block:'center'});return;}let score=0;all.forEach(q=>{q.dataset.locked='1';const answer=q.dataset.answer;const value=q.dataset.type==='input'?q.querySelector('.pq-input').value:q.querySelector('.pq-option.selected')?.dataset.value;const ok=normal(value)===normal(answer);if(ok)score++;if(q.dataset.type==='input'){q.querySelector('.pq-input').style.borderColor=ok?'#15803d':'#b91c1c';q.querySelector('.pq-input').disabled=true;}else{q.querySelectorAll('.pq-option').forEach(btn=>{btn.disabled=true;if(normal(btn.dataset.value)===normal(answer))btn.classList.add('correct');else if(btn.classList.contains('selected'))btn.classList.add('wrong');});}const exp=q.querySelector('.pq-explain');exp.className='pq-explain show';exp.innerHTML=(ok?'<b>Верно.</b> ':'<b>Пока нет.</b> ')+(ok?q._question.explain.good:q._question.explain.bad);});const percent=Math.round(score/all.length*100);const result=root.querySelector('.pq-result');let level=percent>=80?'good':percent>=50?'mid':'low';let text=percent>=80?'Отличное усвоение: вы уверенно различаете и применяете фонетические опоры.':percent>=50?'Базовое усвоение есть. Повторите задания с ошибками, затем создайте новый квиз.':'Стоит ещё раз пройти фонетическую лабораторию: слушание, медленное повторение и эхо-цепочку.';result.className='pq-result show '+level;result.innerHTML='<b>Результат: '+score+' из '+all.length+' ('+percent+'%).</b> '+text;root.querySelector('.pq-status').textContent='Квиз завершён. Нажмите «Новый квиз», чтобы получить другие слова и варианты.';root.querySelector('.pq-progress span').style.width='100%';}
function mount(){if(document.querySelector('.phonetic-quiz'))return;const items=words();if(items.length<2)return;const anchor=document.querySelector('.phonetic-lab')||document.querySelector('.adaptive-practice');if(!anchor)return;const root=document.createElement('section');root.className='phonetic-quiz';root.setAttribute('aria-label','Интерактивный квиз по фонетике');anchor.insertAdjacentElement('afterend',root);renderQuiz(root,items);}
function init(){const obs=new MutationObserver(()=>setTimeout(mount,120));obs.observe(document.body,{childList:true,subtree:true});setTimeout(mount,1300);setTimeout(mount,2100);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script id="unified-course-navigation-script">

    document.querySelectorAll('.ref-modal').forEach(function(modal){
      if(modal.classList.contains('open'))enhance(modal);
      new MutationObserver(function(){if(modal.classList.contains('open'))enhance(modal);}).observe(modal,{attributes:true,attributeFilter:['class']});
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',watch);else watch();
})();
</script>

<script id="complete-reference-guard-script">
(function(){
  function nativeButton(){
    return Array.prototype.find.call(document.querySelectorAll('button'),function(button){
      return !button.classList.contains('pqs-reference') && /справочник/i.test(button.textContent||'');
    });
  }
  function mount(){
    var box=document.getElementById('phon-v2-quickstart');
    if(!box||box.querySelector('.pqs-reference')) return;
    var actions=box.querySelector('.pqs-actions');
    if(!actions) return;
    var button=document.createElement('button');
    button.type='button';
    button.className='pqs-reference';
    button.textContent='Полный фонетико-грамматический справочник';
    button.setAttribute('aria-label','Открыть полный фонетико-грамматический справочник');
    actions.appendChild(button);
    var note=document.createElement('p');
    note.className='pqs-reference-note';
    note.textContent='Фонетика, грамматика, таблицы, примеры и практика доступны в одном окне.';
    actions.parentNode.appendChild(note);
    button.addEventListener('click',function(){
      var original=nativeButton();
      if(!original){note.textContent='Справочник ещё загружается. Подождите секунду и повторите попытку.';return;}
      original.click();
      setTimeout(function(){
        var modal=document.querySelector('.ref-modal');
        if(modal){
          modal.id='complete-reference-modal';
          modal.setAttribute('role','dialog');
          modal.setAttribute('aria-label','Полный фонетико-грамматический справочник');
          var focus=modal.querySelector('.ref-box')||modal;
          if(focus&&typeof focus.focus==='function'){focus.tabIndex=-1;focus.focus();}
          note.textContent='Справочник открыт. Выберите нужную вкладку внутри окна.';
        }else{note.textContent='Справочник загружается. Если окно не появилось, закройте и снова откройте файл.';}
      },20);
    });
    document.addEventListener('keydown',function(event){
      if(event.altKey&&event.shiftKey&&!event.ctrlKey&&!event.metaKey&&event.key.toLowerCase()==='r'){event.preventDefault();button.click();}
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script>

<script id="phonetic-quickstart-script">
(function(){
  function setup(){
    if(document.getElementById('phon-v2-quickstart')) return;
    var launch=document.querySelector('.phon-v2-launch');
    if(!launch) return;
    var original=launch.querySelector('button');
    if(!original) return;
    original.setAttribute('aria-label','Открыть лабораторию фонетики, букв и письма');
    var box=document.createElement('aside');
    box.id='phon-v2-quickstart';
    box.className='phon-v2-quickstart';
    box.setAttribute('aria-label','Быстрый доступ к фонетике, буквам и письму');
    box.innerHTML='<button class="pqs-close" type="button" aria-label="Скрыть быстрый доступ">×</button><strong>Фонетика, буквы и письмо</strong><p>Начните со звучания, затем откройте ряд букв и правила написания. Озвучивание запускается только по нажатию кнопки.</p><div class="pqs-actions"><button type="button" class="primary" data-pqs="sound">Открыть фонетику</button><button type="button" data-pqs="letters">Буквы</button><button type="button" data-pqs="write">Написание</button><button type="button" data-pqs="quiz">Мини-тест</button></div>';
    document.body.appendChild(box);
    function go(panel){
      original.click();
      setTimeout(function(){
        var tab=document.querySelector('.phon-v2-modal [data-p="'+panel+'"]');
        if(tab){tab.click();tab.focus();}
      },0);
    }
    box.querySelectorAll('[data-pqs]').forEach(function(button){button.addEventListener('click',function(){go(button.getAttribute('data-pqs'));});});
    box.querySelector('.pqs-close').addEventListener('click',function(){box.hidden=true;});
    document.addEventListener('keydown',function(event){
      if(event.altKey&&event.shiftKey&&!event.ctrlKey&&!event.metaKey&&event.key.toLowerCase()==='f'){event.preventDefault();go('sound');}
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup); else setup();
})();
</script>

</html>
