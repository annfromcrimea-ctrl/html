<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="description" content="Интерактивное приложение для изучения крымскотатарского языка">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2300A8A8'/%3E%3Cpath d='M50 20 Q65 35 65 50 Q65 65 50 80 Q35 65 35 50 Q35 35 50 20' fill='%23D4AF37'/%3E%3C/svg%3E">
<style>
:root{
  --primary:#00A8A8;--primary-dark:#007A7A;--primary-light:#4DD0D0;
  --secondary:#D4AF37;--secondary-dark:#A8860F;--secondary-light:#F0D060;
  --accent:#1E3A5F;--accent-light:#2E5A8F;
  --bg:#F5F1E8;--bg-card:#FFFDF7;--bg-alt:#EDE8DA;
  --text:#2C1810;--text-soft:#6B5442;--text-light:#9B8472;
  --success:#4CAF50;--error:#E74C3C;--warn:#FF9800;
  --shadow:0 8px 24px rgba(30,58,95,.15);
  --shadow-lg:0 16px 48px rgba(30,58,95,.25);
  --shadow-sm:0 2px 8px rgba(30,58,95,.1);
  --radius:20px;--radius-sm:12px;--radius-xs:8px;
  --font:'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#1A1A2E;--bg-card:#252540;--bg-alt:#1E1E35;
  --text:#F5F1E8;--text-soft:#C8B898;--text-light:#8B7B62;
  --shadow:0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.6;overflow-x:hidden;
}
.ornament-border{
  position:relative;
  border:3px solid var(--secondary);
  border-radius:var(--radius);
  background:var(--bg-card);
  box-shadow:var(--shadow);
}
.nav-top{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);
  color:white;padding:12px 20px;
  box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:8px;
}
.nav-top h1{font-size:1.3rem;font-weight:700;}
.nav-top .subtitle{font-size:.8rem;opacity:.85}
.nav-top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.theme-btn,.streak-badge{
  background:rgba(255,255,255,.15);border:none;color:white;
  padding:8px 12px;border-radius:var(--radius-xs);cursor:pointer;
  font-size:.9rem;
}
.streak-badge{display:flex;align-items:center;gap:6px;font-weight:600}
.nav-bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--bg-card);border-top:2px solid var(--secondary);
  display:flex;overflow-x:auto;padding:8px 4px;
  box-shadow:0 -4px 20px rgba(0,0,0,.1);
}
.nav-item{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  padding:6px 12px;cursor:pointer;border-radius:var(--radius-xs);
  transition:all .2s;color:var(--text-soft);font-size:.7rem;
  border:none;background:none;min-width:60px;
}
.nav-item.active{color:var(--primary);background:rgba(0,168,168,.1)}
.nav-item .icon{font-size:1.4rem;margin-bottom:2px}
.main{padding:20px 16px 100px;max-width:900px;margin:0 auto}
.screen{display:none;animation:fadeIn .3s}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 24px;border:none;border-radius:var(--radius-sm);
  font-size:1rem;font-weight:600;cursor:pointer;
  transition:all .15s;font-family:var(--font);
  box-shadow:0 6px 0 rgba(0,0,0,.15),0 8px 16px rgba(0,0,0,.1);
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn-primary{background:linear-gradient(180deg,var(--primary-light),var(--primary));color:white}
.btn-secondary{background:linear-gradient(180deg,var(--secondary-light),var(--secondary));color:var(--text)}
.btn-accent{background:linear-gradient(180deg,var(--accent-light),var(--accent));color:white}
.btn-ghost{background:var(--bg-alt);color:var(--text);box-shadow:var(--shadow-sm)}
.btn-danger{background:linear-gradient(180deg,#FF6B6B,var(--error));color:white}
.btn-small{padding:8px 14px;font-size:.85rem;border-radius:var(--radius-xs)}
.btn-block{width:100%}
.card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:20px;margin-bottom:16px;
  box-shadow:var(--shadow);border:2px solid transparent;
}
.card-title{font-size:1.15rem;font-weight:700;color:var(--accent)}
.hero{
  background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);
  color:white;border-radius:var(--radius);padding:30px 24px;
  margin-bottom:20px;position:relative;overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.hero h2{font-size:1.6rem;margin-bottom:8px;position:relative}
.hero p{opacity:.9;position:relative}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{
  background:var(--bg-card);border-radius:var(--radius-sm);
  padding:16px;text-align:center;box-shadow:var(--shadow-sm);
  border-top:4px solid var(--primary);
}
.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:.8rem;color:var(--text-soft);margin-top:4px}
.word-day,.quote-day{
  background:linear-gradient(135deg,var(--secondary-light),var(--secondary));
  border-radius:var(--radius);padding:20px;margin-bottom:16px;
}
.word-day .word{font-size:1.8rem;font-weight:700;text-align:center}
.word-day .ipa{text-align:center;color:var(--text-soft);font-style:italic}
.word-day .trans{text-align:center;font-size:1.1rem;margin-top:8px}
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.ex-card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:24px;cursor:pointer;transition:all .2s;
  box-shadow:var(--shadow);border:3px solid transparent;text-align:center;
}
.ex-card:hover{border-color:var(--primary);transform:translateY(-4px)}
.ex-card .emoji{font-size:3rem;margin-bottom:12px}
.ex-card h3{color:var(--accent);margin-bottom:8px}
.session-card{background:var(--bg-card);border-radius:var(--radius);padding:30px 24px;box-shadow:var(--shadow-lg);text-align:center}
.session-card .question{font-size:1.5rem;font-weight:700;margin:20px 0;color:var(--accent)}
.answers{display:grid;gap:10px;margin:20px 0}
.answer-btn{
  padding:14px;border:2px solid var(--bg-alt);border-radius:var(--radius-sm);
  background:var(--bg-card);cursor:pointer;font-size:1rem;
  transition:all .15s;text-align:left;font-family:var(--font);
}
.answer-btn:hover{border-color:var(--primary)}
.answer-btn.correct{background:var(--success);color:white;border-color:var(--success)}
.answer-btn.wrong{background:var(--error);color:white;border-color:var(--error)}
.answer-btn.reveal{background:var(--success);color:white;border-color:var(--success)}
.input-answer{
  width:100%;padding:14px;border:2px solid var(--bg-alt);
  border-radius:var(--radius-sm);font-size:1.1rem;
  font-family:var(--font);background:var(--bg-card);color:var(--text);
}
.input-answer:focus{outline:none;border-color:var(--primary)}
.input-answer.correct{border-color:var(--success);background:rgba(76,175,80,.1)}
.input-answer.wrong{border-color:var(--error);background:rgba(231,76,60,.1)}
.progress-bar{height:10px;background:var(--bg-alt);border-radius:5px;overflow:hidden;margin:16px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));transition:width .3s}
.grammar-list{display:grid;gap:12px}
.grammar-item{
  background:var(--bg-card);border-radius:var(--radius-sm);
  padding:16px 20px;cursor:pointer;transition:all .2s;
  box-shadow:var(--shadow-sm);border-left:5px solid var(--primary);
  display:flex;justify-content:space-between;align-items:center;
}
.grammar-item:hover{transform:translateX(4px)}
.grammar-item .lvl{background:var(--primary);color:white;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:600}
.grammar-detail{background:var(--bg-card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.grammar-detail h3{color:var(--accent);font-size:1.4rem;margin-bottom:16px}
.grammar-detail h4{color:var(--primary);margin:16px 0 8px;font-size:1.1rem}
.grammar-table{width:100%;border-collapse:collapse;margin:12px 0;background:var(--bg-card);border-radius:var(--radius-sm);overflow:hidden}
.grammar-table th,.grammar-table td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--bg-alt)}
.grammar-table th{background:var(--accent);color:white;font-weight:600}
.example-row{
  background:var(--bg-alt);padding:10px 14px;border-radius:var(--radius-xs);
  margin:6px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.example-row .orig{font-weight:600;color:var(--accent)}
.example-row .ipa{color:var(--text-soft);font-style:italic;font-size:.9rem}
.example-row .trans{color:var(--text)}
.error-row{
  background:rgba(231,76,60,.08);padding:10px 14px;border-radius:var(--radius-xs);
  margin:6px 0;border-left:4px solid var(--error);
}
.error-row .wrong{color:var(--error);text-decoration:line-through}
.error-row .right{color:var(--success);font-weight:600}
.lesson-list{display:grid;gap:12px}
.lesson-item{
  background:var(--bg-card);border-radius:var(--radius-sm);
  padding:16px 20px;cursor:pointer;transition:all .2s;
  box-shadow:var(--shadow-sm);
  display:flex;justify-content:space-between;align-items:center;
}
.lesson-item:hover{transform:translateX(4px)}
.lesson-item.done{border-left:5px solid var(--success)}
.phrase-topic{background:var(--bg-card);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.phrase-topic h4{color:var(--accent);margin-bottom:12px}
.phrase-item{padding:10px;border-bottom:1px solid var(--bg-alt);display:flex;justify-content:space-between;align-items:center;gap:10px}
.phrase-item:last-child{border-bottom:none}
.phrase-item .ph{font-weight:600;color:var(--accent)}
.phrase-item .ipa{color:var(--text-soft);font-size:.85rem;font-style:italic}
.phrase-item .tr{color:var(--text);font-size:.9rem}
.search-box{width:100%;padding:12px 16px;border:2px solid var(--bg-alt);border-radius:var(--radius-sm);font-size:1rem;background:var(--bg-card);color:var(--text);margin-bottom:12px}
.search-box:focus{outline:none;border-color:var(--primary)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter-chip{padding:6px 14px;border-radius:16px;border:2px solid var(--bg-alt);background:var(--bg-card);cursor:pointer;font-size:.85rem}
.filter-chip.active{background:var(--primary);color:white;border-color:var(--primary)}
.word-list{display:grid;gap:8px}
.word-item{background:var(--bg-card);padding:12px 16px;border-radius:var(--radius-xs);display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm);gap:10px;flex-wrap:wrap}
.word-item .w{font-weight:700;color:var(--accent);font-size:1.05rem}
.word-item .i{color:var(--text-soft);font-style:italic;font-size:.85rem}
.word-item .t{color:var(--text)}
.word-item .lvl{background:var(--secondary);color:var(--text);padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.word-item.learned{border-left:4px solid var(--success)}
.flashcard{perspective:1000px;height:280px;margin:20px auto;max-width:400px;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-shadow:var(--shadow-lg)}
.flashcard-front{background:linear-gradient(135deg,var(--primary),var(--accent));color:white}
.flashcard-back{background:linear-gradient(135deg,var(--secondary),var(--secondary-dark));color:var(--text);transform:rotateY(180deg)}
.flashcard .big{font-size:2rem;font-weight:700;text-align:center}
.flashcard .sub{font-size:1rem;opacity:.9;margin-top:8px;text-align:center}
.card-controls{display:flex;gap:12px;justify-content:center;margin-top:16px}
.timer{font-size:3rem;font-weight:700;color:var(--accent);text-align:center;margin:16px 0}
.timer.urgent{color:var(--error);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.culture-card{background:var(--bg-card);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border-top:4px solid var(--secondary)}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:12px 24px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);z-index:200;animation:slideDown .3s}
@keyframes slideDown{from{top:40px;opacity:0}to{top:80px;opacity:1}}
.toast.success{background:var(--success)}
.toast.error{background:var(--error)}
@media(min-width:768px){.nav-bottom{display:none}.main{padding:30px 24px}.nav-desktop{display:flex !important}}
.nav-desktop{display:none;gap:8px}
.nav-desktop button{background:rgba(255,255,255,.1);border:none;color:white;padding:8px 14px;border-radius:var(--radius-xs);cursor:pointer;font-size:.9rem;font-family:var(--font)}
.nav-desktop button.active{background:var(--secondary);color:var(--text)}
@media(max-width:767px){.nav-desktop{display:none !important}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-alt)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}
.tip-box{background:rgba(212,175,55,.15);border-left:4px solid var(--secondary);padding:12px 16px;border-radius:var(--radius-xs);margin:12px 0}
.tip-box strong{color:var(--secondary-dark)}
.lesson-section{background:var(--bg-alt);border-radius:var(--radius-sm);padding:16px;margin:12px 0}
.lesson-section h5{color:var(--accent);margin-bottom:8px;font-size:1rem}
.exercise-box{background:var(--bg-card);border-radius:var(--radius-sm);padding:16px;margin:8px 0;border:2px solid var(--bg-alt)}
.exercise-box .ex-q{font-weight:600;margin-bottom:8px}
.exercise-box .ex-options{display:grid;gap:6px;margin:8px 0}
.exercise-box .ex-options button{text-align:left;padding:8px 12px;border:1px solid var(--bg-alt);border-radius:var(--radius-xs);background:var(--bg-card);cursor:pointer;font-family:var(--font)}
.exercise-box .ex-options button:hover{border-color:var(--primary)}
.exercise-box .ex-options button.correct{background:var(--success);color:white;border-color:var(--success)}
.exercise-box .ex-options button.wrong{background:var(--error);color:white;border-color:var(--error)}
.exercise-box .ex-options button.reveal{background:var(--success);color:white;border-color:var(--success)}
.homework-box{background:rgba(30,58,95,.05);border-radius:var(--radius-sm);padding:16px;margin:8px 0;border-left:4px solid var(--accent)}
.homework-box h5{color:var(--accent);margin-bottom:6px}
</style>

<style id="didactic-expansion-style">

t:700}.didactic-exercises{display:grid;gap:10px}.didactic-task{border:1px solid var(--didactic-line);border-radius:10px;background:#fff;padding:12px}.didactic-task-title{font-weight:850;margin:0 0 7px}.didactic-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.didactic-choice{appearance:none;text-align:left;border:1px solid var(--didactic-line);border-radius:8px;background:#fff;color:var(--didactic-ink);font:inherit;padding:9px;cursor:pointer}.didactic-choice.correct{background:#dcfce7;border-color:#16a34a}.didactic-choice.incorrect{background:#fee2e2;border-color:#dc2626}.didactic-answer{display:none;margin-top:8px;color:var(--didactic-muted);font-size:13px}.didactic-answer.show{display:block}.didactic-write{box-sizing:border-box;width:100%;min-height:72px;border:1px solid var(--didactic-line);border-radius:8px;padding:9px;font:inherit;color:var(--didactic-ink);background:#fff}.didactic-list{margin:8px 0 0;padding-left:20px}.didactic-list li{margin:5px 0}.didactic-fallback{margin:16px 0}
@media(max-width:720px){.didactic-guide,.didactic-practice{border-radius:12px;padding:14px}.didactic-grid{grid-template-columns:1fr;gap:7px}.didactic-options{grid-template-columns:1fr}.didactic-actions{align-items:stretch}.didactic-button{width:100%}.didactic-status{width:100%}.didactic-guide h4,.didactic-practice h4{font-size:16px}}

</style>

# Гармония гласных (Закон дружбы звуков) | A1
ОБЪЯСНЕНИЕ: В крымскотатарском языке гласные делятся на две группы: твёрдые и мягкие. При добавлении окончаний нужно выбирать вариант, который "дружит" с последним гласным в слове. Это как если бы звуки пели в одной тональности.
ПРАВИЛО: Твёрдые гласные: a, ı, o, u → требуют твёрдых суффиксов (-лар, -ды, -да). Мягкие гласные: e, i, ö, ü → требуют мягких суффиксов (-лер, -ди, -де).
ТАБЛИЦА: Твёрдые | a, ı, o, u | суффиксы -лар, -ды, -да | Мягкие | e, i, ö, ü | суффиксы -лер, -ди, -де
ПРИМЕР: evler | /evˈler/ | дома (e — мягкое → -лер)
ПРИМЕР: dağlar | /daːˈlar/ | горы (a — твёрдое → -лар)
ПРИМЕР: kediler | /cediˈler/ | кошки (e — мягкое → -лер)
ПРИМЕР: quşlar | /quʃˈlar/ | птицы (u — твёрдое → -лар)
ОШИБКА: evlar | evler | После мягкого e нужен -лер, не -лар
ОШИБКА: dağler | dağlar | После твёрдого а нужен -лар, не -лер
ЛАЙФХАК: Запомни пару: «су» (вода) — твёрдая, «сүт» (молоко) — мягкое. Попробуй добавить -лар/-лер: сулар, сүтлер. Чувствуешь разницу?
ВОПРОС: Какой суффикс множественного числа у слова «kitap» (книга)? | -лер | -лар | -нар | 2
ВОПРОС: Какой суффикс у слова «göz» (глаз)? | -лар | -лер | -нар | 2

# Множественное число (Как сказать «много») | A1
ОБЪЯСНЕНИЕ: Чтобы сказать, что предметов несколько, добавляем суффикс -лар или -лер. Выбор зависит от гармонии гласных (смотри предыдущий урок).
ПРАВИЛО: Основа слова + лар/лер.
ПРИМЕР: evler | /evˈler/ | дома
ПРИМЕР: dağlar | /daːˈlar/ | горы
ПРИМЕР: balıqlar | /balɯqˈlar/ | рыбы
ПРИМЕР: qızlar | /qɯzˈlar/ | девочки
ОШИБКА: evlar | evler | Нужно -лер после e
ОШИБКА: dağler | dağlar | Нужно -лар после а
ЛАЙФХАК: Если слово заканчивается на гласную, просто добавляй суффикс: ana → analar, kedi → kediler. Если на согласную — тоже добавляй, но следи за гармонией.
ВОПРОС: Множественное число от «ana» (мать)? | analer | anelar | analar | 3
ВОПРОС: Множественное число от «kedi» (кошка)? | kediler | kedilar | kedlär | 1

# Падежи (Кто? Кому? Где? Откуда?) | A1
ОБЪЯСНЕНИЕ: Падежи показывают роль слова в предложении. В крымскотатарском их 6. Суффиксы меняются по гармонии гласных.
ПРАВИЛО: Именительный (кто? что?) — без суффикса. Родительный (кого? чего?) — -нын/-нин. Дательный (кому? куда?) — -гъа/-ге. Винительный (кого? что?) — -ны/-ни. Местный (где?) — -да/-де. Исходный (откуда?) — -дан/-ден.
ТАБЛИЦА: Падеж | Суффикс | Пример (ev — дом)
Именительный | — | ev
Родительный | -нын/-нин | evniñ (дома)
Дательный | -гъа/-ге | evge (к дому)
Винительный | -ны/-ни | evni (дом)
Местный | -да/-де | evde (в доме)
Исходный | -дан/-ден | evden (из дома)
ПРИМЕР: men mektepke barım | /men mecˈtepce baˈrɯm/ | я иду в школу
ПРИМЕР: kitap masada | /ciˈtap maˈsada/ | книга на столе
ПРИМЕР: su içtim | /su itʃˈtim/ | я пил воду
ПРИМЕР: dağdan keldim | /daːdan celˈdim/ | я пришёл с горы
ОШИБКА: men mektep barım | men mektepke barım | Нужен дательный падеж -ке
ОШИБКА: kitap masa | kitap masada | Нужен местный падеж -да
ЛАЙФХАК: Запомни вопросы: «ким?» (кто?), «нен?» (что?), «кимнин?» (чей?), «кимге?» (кому?), «ненге?» (чему?), «кимни?» (кого?), «нени?» (что?), «кимде?» (у кого?), «ненде?» (в чём?), «кимден?» (от кого?), «ненден?» (из чего?).
ВОПРОС: Как сказать «в доме»? | ev | evde | evden | 2
ВОПРОС: Как сказать «из школы»? | mektep | mektepke | mektepten | 3

# Склонение существительных (Изменение по падежам) | A1
ОБЪЯСНЕНИЕ: Существительные меняют окончание в зависимости от падежа. Это как в русском «дом — дома — дому», но по-своему.
ПРАВИЛО: К основе добавляем падежный суффикс. Все суффиксы подчиняются гармонии гласных.
ТАБЛИЦА: Падеж | Вопрос | Суффикс | Пример (ev — дом) | Пример (su — вода)
Именительный | кто? что? | — | ev | su
Родительный | кого? чего? | -нын/-нин | evniñ | sunıñ
Дательный | кому? куда? | -гъа/-ге | evge | suğa
Винительный | кого? что? | -ны/-ни | evni | sunı
Местный | где? | -да/-де | evde | suda
Исходный | откуда? | -дан/-ден | evden | sudan
ПРИМЕР: men evde | /men evˈde/ | я дома
ПРИМЕР: o mektepten keldi | /o mecˈtepten celˈdi/ | он пришёл из школы
ПРИМЕР: kitapnı oquyım | /ciˈtapnɯ oqujɯm/ | я читаю книгу
ОШИБКА: men ev | men evde | Нужен местный падеж -де
ОШИБКА: o mektep | o mektepten | Нужен исходный падеж -тен
ЛАЙФХАК: Если слово заканчивается на гласную, между основой и суффиксом может появиться -н-: su → sunıñ (воды), qapı → qapınıñ (двери).
ВОПРОС: Как сказать «в воде»? | su | suda | sudan | 2
ВОПРОС: Как сказать «из воды»? | su | suda | sudan | 3

# Притяжательные аффиксы (Мой, твой, его) | A2
ОБЪЯСНЕНИЕ: Чтобы сказать «мой дом», «твой дом», добавляем суффикс к слову. Это как в русском окончания, но они всегда приклеиваются к концу слова.
ПРАВИЛО: -ым/-им (мой), -ын/-ин (твой), -ы/-и (его/её), -ымыз/-имиз (наш), -ынъыз/-инъиз (ваш), -лары/-лери (их).
ТАБЛИЦА: Лицо | Суффикс | Пример (ev — дом)
1 л. ед. (мой) | -ым/-им | evim
2 л. ед. (твой) | -ын/-ин | eviñ
3 л. ед. (его) | -ы/-и | evi
1 л. мн. (наш) | -ымыз/-имиз | evimiz
2 л. мн. (ваш) | -ынъыз/-инъиз | eviñiz
3 л. мн. (их) | -лары/-лери | evleri
ПРИМЕР: anam | /aˈnam/ | моя мать
ПРИМЕР: baban | /baˈban/ | твой отец
ПРИМЕР: kitabım | /citaˈbɯm/ | моя книга
ПРИМЕР: evimiz | /eviˈmiz/ | наш дом
ОШИБКА: men ev | menim evim | Нужно притяжательное окончание
ОШИБКА: sen kitap | seniñ kitabıñ | Нужно -ынъ после согласной
ЛАЙФХАК: Запомни: если слово заканчивается на согласную, добавляем -ым/-им (мой). Если на гласную — просто -м: ana → anam (моя мать), kedi → kedim (моя кошка).
ВОПРОС: «Моя книга» по-крымскотатарски? | kitap | kitabım | kitabın | 2
ВОПРОС: «Наш дом»? | ev | evim | evimiz | 3

# Настоящее время глагола (Я делаю сейчас) | A2
ОБЪЯСНЕНИЕ: Чтобы сказать, что действие происходит сейчас, добавляем к глаголу суффикс -а/-е и личное окончание.
ПРАВИЛО: Основа глагола + а/е + окончание: -м (я), -сынъ (ты), — (он), -мыз/-миз (мы), -сынъыз (вы), -лар/-лер (они).
ТАБЛИЦА: Лицо | Суффикс | Пример (bar- идти)
я | -ам/-ем | barım
ты | -асынъ/-есинъ | barasıñ
он | -а/-е | bara
мы | -амыз/-емиз | baramız
вы | -асынъыз/-есинъиз | barasıñız
они | -алар/-елер | baralar
ПРИМЕР: men barım | /men baˈrɯm/ | я иду
ПРИМЕР: sen barasıñ | /sen baraˈsɯŋ/ | ты идёшь
ПРИМЕР: o bara | /o baˈra/ | он идёт
ПРИМЕР: biz baramız | /biz baraˈmɯz/ | мы идём
ОШИБКА: men bar | men barım | Нужно личное окончание -м
ОШИБКА: sen bar | sen barasıñ | Нужно -асынъ для «ты»
ЛАЙФХАК: Если основа глагола заканчивается на гласную, перед -а/-е может появиться -й-: oqu- (читать) → oquyım (я читаю). Это чтобы звуки не сливались.
ВОПРОС: «Я иду» по-крымскотатарски? | men bar | men barım | men bara | 2
ВОПРОС: «Он читает» (oqu-)? | o oqu | o oquy | o oquya | 2

# Прошедшее время (Я сделал вчера) | A2
ОБЪЯСНЕНИЕ: Чтобы сказать о действии в прошлом, добавляем суффикс -ды/-ди/-ты/-ти и личное окончание.
ПРАВИЛО: Основа + ды/ди/ты/ти + окончание: -м (я), -нъ (ты), — (он), -къ/-к (мы), -нъыз (вы), -лар/-лер (они).
ТАБЛИЦА: Лицо | Суффикс | Пример (bar- идти)
я | -дым/-дим | bardım
ты | -дынъ/-динъ | bardıñ
он | -ды/-ди | bardı
мы | -дыкъ/-дик | bardıq
вы | -дынъыз/-динъиз | bardıñız
они | -дылар/-дилер | bardılar
ПРИМЕР: men bardım | /men barˈdɯm/ | я шёл
ПРИМЕР: sen keldiñ | /sen celˈdiŋ/ | ты пришёл
ПРИМЕР: o içti | /o itʃˈti/ | он пил
ПРИМЕР: biz keldik | /biz celˈdic/ | мы пришли
ОШИБКА: men bar | men bardım | Нужно прошедшее время -дым
ОШИБКА: sen kel | sen keldiñ | Нужно -диñ для «ты пришёл»
ЛАЙФХАК: Если основа заканчивается на глухую согласную (p, ç, t, k), суффикс будет -ты/-ти вместо -ды/-ди: iç- (пить) → içti (он пил), yap- (делать) → yaptı (он сделал).
ВОПРОС: «Я пришёл» (kel-)? | men kel | men keldim | men kele | 2
ВОПРОС: «Он пил» (iç-)? | o iç | o içti | o içe | 2

# Будущее время (Я сделаю завтра) | A2
ОБЪЯСНЕНИЕ: Чтобы сказать о действии в будущем, добавляем суффикс -джак/-джек и личное окончание.
ПРАВИЛО: Основа + джак/джек + окончание: -мын (я), -сынъ (ты), — (он), -мыз (мы), -сынъыз (вы), -лар (они).
ТАБЛИЦА: Лицо | Суффикс | Пример (bar- идти)
я | -джакъмын/-джекмин | baracaqım
ты | -джакъсынъ/-джексинъ | baracaqsıñ
он | -джакъ/-джек | baracaq
мы | -джакъмыз/-джекмиз | baracaqmız
вы | -джакъсынъыз | baracaqsıñız
они | -джакълар/-джеклер | baracaqlar
ПРИМЕР: men baracaqım | /men baraˈdʒaqɯm/ | я пойду
ПРИМЕР: sen baracaqsıñ | /sen baraˈdʒaqsɯŋ/ | ты пойдёшь
ПРИМЕР: o baracaq | /o baraˈdʒaq/ | он пойдёт
ПРИМЕР: biz baracaqmız | /biz baraˈdʒaqmɯz/ | мы пойдём
ОШИБКА: men bar | men baracaqım | Нужно будущее время
ОШИБКА: sen bar | sen baracaqsıñ | Нужно -джакъсынъ
ЛАЙФХАК: Если основа заканчивается на гласную, суффикс начинается с -й-: oqu- (читать) → oquyacaqım (я буду читать).
ВОПРОС: «Я пойду» (bar-)? | men bar | men baracaqım | men bara | 2
ВОПРОС: «Он сделает» (yap-)? | o yap | o yapacaq | o yapa | 2

# Отрицание (Я НЕ делаю) | A2
ОБЪЯСНЕНИЕ: Чтобы сказать «не делаю», «не пошёл», «не пойду», добавляем суффикс -ма/-ме между основой глагола и окончанием времени.
ПРАВИЛО: Основа + ма/ме + время + лицо. Выбор -ма/-ме по гармонии гласных.
ПРИМЕР: men barmaım | /men barˈmaɯm/ | я не иду
ПРИМЕР: sen kelmeysiñ | /sen celˈmejsiŋ/ | ты не приходишь
ПРИМЕР: o içmedi | /o itʃˈmedi/ | он не пил
ПРИМЕР: biz yapmacaqmız | /biz japˈmadʒaqmɯz/ | мы не сделаем
ОШИБКА: men bar yoq | men barmaım | Отрицание через -ма/-ме
ОШИБКА: sen kel yoq | sen kelmeysiñ | Нужно -ме перед окончанием
ЛАЙФХАК: В настоящем времени отрицание образуется так: bar- (идти) → barmaım (я не иду). В прошедшем: iç- (пить) → içmedi (он не пил). В будущем: yap- (делать) → yapmacaq (он не сделает).
ВОПРОС: «Я не иду» (bar-)? | men bar | men barmaım | men bar yoq | 2
ВОПРОС: «Он не пил» (iç-)? | o içmedi | o iç yoq | o içme | 1

# Вопросительная частица (Ты идёшь?) | A2
ОБЪЯСНЕНИЕ: Чтобы задать вопрос, добавляем частицу -мы/-ми после сказуемого. Это как вопросительная интонация в русском, только в виде суффикса.
ПРАВИЛО: Сказуемое + мы/ми. Выбор по гармонии гласных.
ПРИМЕР: barasıñmı? | /baraˈsɯŋmɯ/ | ты идёшь?
ПРИМЕР: keldiñmi? | /celˈdiŋmi/ | ты пришёл?
ПРИМЕР: o baracaqmı? | /o baraˈdʒaqmɯ/ | он пойдёт?
ПРИМЕР: evde misin? | /evde miˈsin/ | ты дома?
ОШИБКА: sen bar? | sen barasıñmı? | Нужна вопросительная частица
ОШИБКА: o kel? | o keldimi? | Нужно -ми после прошедшего
ЛАЙФХАК: В вопросе частица всегда ставится в конце: «Барасынъмы?» — «Ты идёшь?». Просто добавь -мы/-ми к сказуемому.
ВОПРОС: «Ты идёшь?» (bar-)? | sen bar? | sen barasıñmı? | sen bar mı? | 2
ВОПРОС: «Он пришёл?» (kel-)? | o kel? | o keldi mi? | o keldimi? | 3

# Спряжение глаголов (Полная таблица) | A2
ОБЪЯСНЕНИЕ: Спряжение — это изменение глагола по лицам и временам. В крымскотатарском это делается с помощью суффиксов. Всё логично и последовательно.
ПРАВИЛО: Основа глагола + суффикс времени + личное окончание. Исключений почти нет!
ТАБЛИЦА (глагол bar- — идти):
Время | Я | Ты | Он | Мы | Вы | Они
Настоящее | barım | barasıñ | bara | baramız | barasıñız | baralar
Прошедшее | bardım | bardıñ | bardı | bardıq | bardıñız | bardılar
Будущее | baracaqım | baracaqsıñ | baracaq | baracaqmız | baracaqsıñız | baracaqlar
ПРИМЕР: men barım | /men baˈrɯm/ | я иду
ПРИМЕР: o bardı | /o barˈdɯ/ | он шёл
ПРИМЕР: biz baracaqmız | /biz baraˈdʒaqmɯz/ | мы пойдём
ОШИБКА: men bar | men barım | В настоящем времени нужно окончание -м
ОШИБКА: o bardı | o bardı | Здесь всё верно
ЛАЙФХАК: Глаголы в крымскотатарском спрягаются очень регулярно. Выучи одну таблицу — и сможешь спрягать любой глагол!
ВОПРОС: «Я иду» (bar-)? | men bar | men barım | men bara | 2
ВОПРОС: «Мы шли» (bar-)? | biz bar | biz bardıq | biz baramız | 2

# Склонение местоимений (Я, меня, мне...) | A1
ОБЪЯСНЕНИЕ: Местоимения «я», «ты», «он» и другие меняются по падежам, как и существительные. Это нужно, чтобы правильно строить предложения.
ПРАВИЛО: К основе местоимения добавляется падежный суффикс.
ТАБЛИЦА: Падеж | Я | Ты | Он | Мы | Вы | Они
Именительный | men | sen | o | biz | siz | olar
Родительный | menim | seniñ | onıñ | bizim | siziñ | olarnıñ
Дательный | maña | saña | oña | bizge | sizge | olarğa
Винительный | meni | seni | onı | bizi | sizi | olarnı
Местный | mende | sende | onda | bizde | sizde | olarda
Исходный | menden | senden | ondan | bizden | sizden | olardan
ПРИМЕР: menim evim | /meˈnim eˈvim/ | мой дом
ПРИМЕР: maña ber! | /maˈɲa ber/ | дай мне!
ПРИМЕР: onı kördim | /oˈnɯ kørˈdim/ | я увидел его
ОШИБКА: men ev | menim evim | Нужно притяжательное окончание
ОШИБКА: maña | maña | Правильно: maña — это «мне»
ЛАЙФХАК: Запомни дательный падеж: maña (мне), saña (тебе), oña (ему/ей). Они не похожи на именительный падеж, но их нужно запомнить как отдельные слова.
ВОПРОС: «Мне» по-крымскотатарски? | men | maña | menim | 2
ВОПРОС: «Тебе»? | sen | saña | seniñ | 2

== УРОКИ ==
# Урок 1. Приветствия и знакомство | A1
ТЕОРИЯ: В этом уроке мы учимся здороваться, знакомиться и говорить «спасибо». В крымскотатарском языке, как и в русском, есть разные формы приветствия в зависимости от времени суток и степени вежливости. Основа вежливости — слова «selam» и «merhaba».
СЛОВА: selam, merhaba, sağ ol, teşekkürler, eva, yoq, men, sen, o
ФРАЗЫ: Selam! Menim adım… | /seˈlam meˈnim aˈdɯm/ | Привет! Меня зовут…; Merhaba! Sen kimsin? | /merˈhaba sen cimˈsin/ | Здравствуйте! Кто ты?; Sağ ol! | /saːˈol/ | Спасибо!
УПРАЖНЕНИЯ:
Вставь пропущенную букву: S_l_m | e | a | o | 1
Как сказать «спасибо»? | selam | sağ ol | eva | 2
Как сказать «нет»? | eva | yoq | merhaba | 2
ДОМАШНЕЕ ЗАДАНИЕ: Напиши 3 фразы приветствия и выучи их наизусть. Попробуй поздороваться с другом по-крымскотатарски.
СОВЕТ: Запомни: «sağ ol» — это «спасибо» в единственном числе. Если благодаришь нескольких людей, скажи «sağ olıñız».

# Урок 2. Семья | A1
ТЕОРИЯ: В этом уроке мы учимся называть членов семьи и говорить «мой», «твой». В крымскотатарском языке слова «ana» и «baba» очень похожи на русские «мама» и «папа» — это помогает их запомнить.
СЛОВА: ana, baba, qardaş, qız, oğlan, bala, ev, evim, eviñ
ФРАЗЫ: Bu menim anam. | /bu meˈnim aˈnam/ | Это моя мать.; Seniñ baban kim? | /seˈniɲ baˈban cim/ | Кто твой отец?
УПРАЖНЕНИЯ:
Как будет «мать»? | ana | baba | qız | 1
«Мой дом» по-крымскотатарски? | ev | evim | eviñ | 2
Как сказать «твой отец»? | seniñ baban | menim anam | baba | 1
ДОМАШНЕЕ ЗАДАНИЕ: Напиши по-крымскотатарски 5 членов своей семьи. Попробуй сказать «моя мать», «мой отец», «мой брат».
СОВЕТ: Чтобы сказать «мой», добавь к слову окончание -ым/-им: ana → anam (моя мать), baba → babam (мой отец).

# Урок 3. Еда и напитки | A1
ТЕОРИЯ: В этом уроке мы учимся называть еду и напитки. Крымскотатарская кухня очень богата, но начнём с простых слов: «вода», «хлеб», «чай», «молоко».
СЛОВА: su, ekmek, çay, süt, aş, elma, et, bal, masa
ФРАЗЫ: Men su içtim. | /men su itʃˈtim/ | Я пил воду.; Çay masada. | /tʃaj maˈsada/ | Чай на столе.
УПРАЖНЕНИЯ:
Как будет «вода»? | su | çay | süt | 1
«Чай» по-крымскотатарски? | çay | süt | ekmek | 1
Как сказать «я пил воду»? | men su içtim | men çay içtim | men su içe | 1
ДОМАШНЕЕ ЗАДАНИЕ: Напиши список продуктов, которые ты любишь, по-крымскотатарски. Попробуй сказать «я пью чай», «я ем хлеб».
СОВЕТ: «Aş» — это не только «еда», но и «каша» или «плов» в зависимости от контекста.

# Урок 4. Природа Крыма | A1
ТЕОРИЯ: Крым — это удивительный край, где есть горы, море, степи и леса. В этом уроке мы учим слова, чтобы описывать природу. Многие из них звучат красиво и мелодично.
СЛОВА: dağ, deñiz, çöl, orman, küneş, ay, yıldız, yağmur, qar, yel
ФРАЗЫ: Dağlar büyük. | /daːˈlar byˈjyc/ | Горы большие.; Deñiz mavı. | /deˈɲiz maˈvɯ/ | Море синее.
УПРАЖНЕНИЯ:
Как будет «гора»? | dağ | deñiz | orman | 1
«Море» по-крымскотатарски? | dağ | deñiz | çöl | 2
Как сказать «горы большие»? | dağ büyük | dağlar büyük | deñiz büyük | 2
ДОМАШНЕЕ ЗАДАНИЕ: Напиши 5 слов о природе и выучи их. Нарисуй пейзаж и подпиши его по-крымскотатарски.
СОВЕТ: Суффикс множественного числа -лар/-лер добавляется к словам: dağ → dağlar (горы), deñiz → deñizler (моря).

# Урок 5. Глаголы движения | A2
ТЕОРИЯ: Глаголы движения — это слова, которые описывают, как мы перемещаемся: идти, прийти, уйти. В крымскотатарском языке они спрягаются по лицам и временам.
СЛОВА: bar-, kel-, iç-, oqu-, yap-
ФРАЗЫ: Men mektepke barım. | /men mecˈtepce baˈrɯm/ | Я иду в школу.; Sen kitap oquysıñ. | /sen ciˈtap oqujˈsɯŋ/ | Ты читаешь книгу.
УПРАЖНЕНИЯ:
Как сказать «я иду»? | men bar | men barım | men bara | 2
«Ты читаешь» по-крымскотатарски? | sen oquy | sen oquysıñ | sen oqu | 2
Как будет «я иду в школу»? | men mektepke barım | men mektep barım | men mektepke bar | 1
ДОМАШНЕЕ ЗАДАНИЕ: Составь 3 предложения о том, куда ты идёшь или что читаешь. Используй слова mektep, kitap, ev.
СОВЕТ: Глаголы с основой на гласную добавляют -й- перед окончанием: oqu- → oquyım (я читаю).

# Урок 6. Прошлое и будущее | A2
ТЕОРИЯ: В этом уроке мы учимся говорить о том, что уже произошло, и о том, что произойдёт. Это важно для любого общения.
СЛОВА: bar-, kel-, iç-, yap-
ФРАЗЫ: Men keldim. | /men celˈdim/ | Я пришёл.; O baracaq. | /o baraˈdʒaq/ | Он пойдёт.; Men barmaım. | /men barˈmaɯm/ | Я не иду.
УПРАЖНЕНИЯ:
Как сказать «я пришёл»? | men kel | men keldim | men kele | 2
«Он пойдёт» по-крымскотатарски? | o bar | o baracaq | o bara | 2
Как будет «я не иду»? | men bar | men barmaım | men baracaqım | 2
ДОМАШНЕЕ ЗАДАНИЕ: Напиши 3 предложения о том, что ты делал вчера, и 3 — о том, что сделаешь завтра.
СОВЕТ: Прошедшее время образуется с -ды/-ди: kel- → keldim (я пришёл). Будущее — с -джак/-джек: bar- → baracaq (он пойдёт).

# Урок 7. Спряжение глаголов | A2
ТЕОРИЯ: Спряжение глаголов — это основа крымскотатарского языка. Запомнив одну схему, ты сможешь спрягать любой глагол. В этом уроке мы закрепляем все три времени.
СЛОВА: bar-, kel-, iç-, oqu-, yap-
ФРАЗЫ: men barım | /men baˈrɯm/ | я иду; sen keldiñ | /sen celˈdiŋ/ | ты пришёл; o yapacaq | /o japaˈdʒaq/ | он сделает
УПРАЖНЕНИЯ:
Как сказать «я сделаю»? | men yap | men yapacaqım | men yapa | 2
«Ты пришёл» по-крымскотатарски? | sen kel | sen keldiñ | sen kele | 2
Как будет «мы идём»? | biz bar | biz baramız | biz baracaqmız | 2
ДОМАШНЕЕ ЗАДАНИЕ: Проспрягай глагол «yap-» (делать) в трёх временах. Напиши таблицу.
СОВЕТ: Учи глаголы вместе с окончаниями: bar- (идти) + -ım (я) = barım (я иду). Так будет легче запомнить.

// ===== PARSE DATA =====
function parseData(){
  const raw = $('#app-data').textContent;
  const sections = raw.split(/^== /m).filter(Boolean);
  const get = name => { const s = sections.find(x => x.startsWith(name+' ==')); return s ? s.slice(name.length+4) : ''; };
  
  const p = get('ПАРАМЕТРЫ').trim().split('\n').reduce((a,l)=>{const m=l.match(/^(.+?):\s*(.+)$/); if(m) a[m[1].trim()]=m[2].trim(); return a;},{});
  DATA.params = p;
  
  DATA.words = get('СЛОВА').trim().split('\n').filter(l=>l.trim()).map(l=>{
    const [word,ipa,trans,level,cat] = l.split('|').map(s=>s.trim());
    return {word,ipa:ipa||'',trans:trans||'',level:level||'A1',cat:cat||'',id:word};
  });
  
  const gRaw = get('ГРАММАТИКА').trim();
  DATA.grammar = [];
  const gBlocks = gRaw.split(/^# /m).filter(Boolean);
  gBlocks.forEach(b=>{
    const lines = b.split('\n');
    const titleLine = lines[0];
    const [title, level] = titleLine.split('|').map(s=>s.trim());
    const text = lines.slice(1).join('\n');
    const getBlock = k => { const m = text.match(new RegExp(k+':\\s*([\\s\\S]*?)(?=\\n[A-ZА-ЯЁ]+:|\\nПРИМЕР:|\\nОШИБКА:|\\nВОПРОС:|$)', 'i')); return m?m[1].trim():''; };
    const getMulti = k => { const matches = text.match(new RegExp(k+':\\s*([\\s\\S]*?)(?=\\n[A-ZА-ЯЁ]+:|\\nПРИМЕР:|\\nОШИБКА:|\\nВОПРОС:|$)', 'gi')); return matches ? matches.map(x => x.replace(new RegExp(k+':\\s*', 'i'), '').trim()) : []; };
    
    const tableRaw = getBlock('ТАБЛИЦА');
    const table = tableRaw ? tableRaw.split('\n').map(r=>r.split('|').map(c=>c.trim())) : [];
    
    const examples = getMulti('ПРИМЕР').map(e=>{const [o,i,t]=e.split('|').map(s=>s.trim()); return {orig:o,ipa:i,trans:t};});
    const errors = getMulti('ОШИБКА').map(e=>{const [w,r,c]=e.split('|').map(s=>s.trim()); return {wrong:w,right:r,comment:c};});
    const questions = getMulti('ВОПРОС').map(q=>{const parts=q.split('|').map(s=>s.trim()); return {q:parts[0],opts:parts.slice(1,4),correct:parseInt(parts[4])-1};});
    
    const tipMatch = text.match(/ЛАЙФХАК:\s*([\s\S]*?)(?=\n[A-ZА-ЯЁ]+:|$)/i);
    const tip = tipMatch ? tipMatch[1].trim() : '';
    
    DATA.grammar.push({title,level:level||'A1',explanation:getBlock('ОБЪЯСНЕНИЕ'),rule:getBlock('ПРАВИЛО'),table,examples,errors,questions,tip});
  });
  
  const lRaw = get('УРОКИ').trim();
  DATA.lessons = [];
  const lBlocks = lRaw.split(/^# /m).filter(Boolean);
  lBlocks.forEach(b=>{
    const lines = b.split('\n');
    const titleLine = lines[0];
    const [title, level] = titleLine.split('|').map(s=>s.trim());
    const text = lines.slice(1).join('\n');
    
    const getBlock = k => { const m = text.match(new RegExp(k+':\\s*([\\s\\S]*?)(?=\\n[A-ZА-ЯЁ]+:|$)', 'i')); return m?m[1].trim():''; };
    const getMulti = k => { const matches = text.match(new RegExp(k+':\\s*([\\s\\S]*?)(?=\\n[A-ZА-ЯЁ]+:|$)', 'gi')); return matches ? matches.map(x => x.replace(new RegExp(k+':\\s*', 'i'), '').trim()) : []; };
    
    const theory = getBlock('ТЕОРИЯ');
    const words = getBlock('СЛОВА').split(',').map(s=>s.trim()).filter(Boolean);
    const phrasesRaw = getBlock('ФРАЗЫ');
    const phrases = phrasesRaw ? phrasesRaw.split(';').filter(Boolean).map(p=>{
      const parts = p.split('|').map(s=>s.trim());
      return {orig:parts[0]||'', ipa:parts[1]||'', trans:parts[2]||''};
    }) : [];
    const exRaw = getBlock('УПРАЖНЕНИЯ');
    const exercises = exRaw ? exRaw.split('\n').filter(Boolean).map(e=>{
      const parts = e.split('|').map(s=>s.trim());
      return {q:parts[0]||'', opts:parts.slice(1,4), correct:parseInt(parts[4])-1};
    }) : [];
    const homework = getBlock('ДОМАШНЕЕ ЗАДАНИЕ');
    const tip = getBlock('СОВЕТ');
    
    DATA.lessons.push({title,level:level||'A1',theory,words,phrases,exercises,homework,tip});
  });
  
  const phRaw = get('РАЗГОВОРНИК').trim();
  DATA.phrases = [];
  const phBlocks = phRaw.split(/^# /m).filter(Boolean);
  phBlocks.forEach(b=>{
    const lines = b.split('\n');
    const topic = lines[0].trim();
    const items = lines.slice(1).filter(l=>l.trim()).map(l=>{const [ph,ipa,tr]=l.split('|').map(s=>s.trim()); return {ph,ipa,trans:tr};});
    DATA.phrases.push({topic,items});
  });
  
  const cRaw = get('КУЛЬТУРА').trim();
  DATA.culture = [];
  const cBlocks = cRaw.split(/^# /m).filter(Boolean);
  cBlocks.forEach(b=>{
    const lines = b.split('\n');
    const topic = lines[0].trim();
    const items = lines.slice(1).filter(l=>l.trim()).map(l=>{
      const parts = l.split('|').map(s=>s.trim());
      return parts.length>=2 ? {text:parts[0],ipa:parts[1]||'',trans:parts[2]||''} : {text:l,ipa:'',trans:''};
    });
    DATA.culture.push({topic,items});
  });
}

function save(){
  localStorage.setItem('crh_state', JSON.stringify({
    theme:STATE.theme, streak:STATE.streak, lastDay:STATE.lastDay,
    learned:[...STATE.learned], mistakes:STATE.mistakes,
    cards:STATE.cards, records:STATE.records, achievements:[...STATE.achievements]
  }));

function load(){
  try{
    const s = JSON.parse(localStorage.getItem('crh_state'));
    if(s){ 
      STATE = {...STATE, ...s, learned:new Set(s.learned||[]), achievements:new Set(s.achievements||[])}; 
      if(!STATE.cards.boxes || typeof STATE.cards.boxes !== 'object') STATE.cards.boxes = {0:[],1:[],2:[],3:[],4:[],5:[]};
    }
  }catch(e){}
  const today = new Date().toDateString();
  if(STATE.lastDay !== today){
    const yesterday = new Date(Date.now()-86400000).toDateString();
    if(STATE.lastDay === yesterday) STATE.streak++;
    else if(STATE.lastDay) STATE.streak = 0;
    STATE.lastDay = today;
    save();
  }
}

// ===== SPEECH =====
function speak(text, slow=false){
  if(!('speechSynthesis' in window)) return;
  if(!text) return;
  speechSynthesis.cancel();
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = DATA.params['КОД ЯЗЫКА ДЛЯ TTS'] || 'tr-TR';
    u.rate = slow ? 0.6 : 1.0;
    u.pitch = 1.0;
    speechSynthesis.speak(u);
  } catch(e) { console.warn('Speech error:', e); }
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function beep(freq, dur, type='sine'){
  try {
    if(!audioCtx) audioCtx = new AudioCtx();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) { /* игнорируем */ }
}

function generateExercise(type, pool){
  const words = pool || DATA.words;
  if(words.length < 4 && type !== 'sentence' && type !== 'error' && type !== 'quiz'){
    return {type, error: 'Недостаточно слов'};
  }
  
  const exercises = {
    word2trans: () => {
      const target = rnd(words);
      const distractors = shuffle(words.filter(w => w.id !== target.id)).slice(0, 3);
      const options = shuffle([target, ...distractors]);
      return {
        type: 'choice',
        prompt: 'Выбери перевод слова:',
        question: target.word,
        questionAudio: target.word,
        options: options.map(o => ({text: o.trans, correct: o.id === target.id})),
        correct: target.trans,
        word: target
      };
    },
    trans2word: () => {
      const target = rnd(words);
      const distractors = shuffle(words.filter(w => w.id !== target.id)).slice(0, 3);
      const options = shuffle([target, ...distractors]);
      return {
        type: 'choice',
        prompt: 'Как будет по-крымскотатарски:',
        question: target.trans,
        options: options.map(o => ({text: `${o.word} ${o.ipa}`, correct: o.id === target.id, value: o.word})),
        correct: target.word,
        word: target
      };
    },
    word2ipa: () => {
      const target = rnd(words);
      const distractors = shuffle(words.filter(w => w.id !== target.id)).slice(0, 3);
      const options = shuffle([target, ...distractors]);
      return {
        type: 'choice',
        prompt: 'Выбери правильную транскрипцию:',
        question: target.word,
        questionAudio: target.word,
        options: options.map(o => ({text: o.ipa, correct: o.id === target.id})),
        correct: target.ipa,
        word: target
      };
    },
    listen2word: () => {
      const target = rnd(words);
      const distractors = shuffle(words.filter(w => w.id !== target.id)).slice(0, 3);
      const options = shuffle([target, ...distractors]);
      return {
        type: 'choice',
        prompt: 'Послушай и выбери слово:',
        question: '🔊',
        questionAudio: target.word,
        autoPlay: true,
        options: options.map(o => ({text: o.word, correct: o.id === target.id})),
        correct: target.word,
        word: target
      };
    },
    missing: () => {
      const target = rnd(words.filter(w => w.word.length >= 2));
      if(!target) return generateExercise('missing', words);
      const word = target.word;
      const pos = Math.floor(Math.random() * word.length);
      const letter = word[pos];
      const shown = word.slice(0, pos) + '_' + word.slice(pos + 1);
      const alphabet = 'aıoueüiöbcçdğfgkhjlmnpqrsştuvyz'.split('');
      const distractors = shuffle(alphabet.filter(c => c !== letter)).slice(0, 3);
      const options = shuffle([letter, ...distractors]);
      return {
        type: 'choice',
        prompt: 'Вставь пропущенную букву:',
        question: shown,
        questionLarge: true,
        hint: target.trans,
        options: options.map(o => ({text: o, correct: o === letter})),
        correct: letter,
        word: target
      };
    },
    sentence: () => {
      const examples = DATA.lessons.flatMap(l => l.examples || []);
      const allExamples = DATA.lessons.flatMap(l => l.phrases || []);
      const pool = examples.length ? examples : allExamples;
      if(pool.length === 0) return {type: 'sentence', error: 'Нет примеров'};
      const target = rnd(pool);
      const words_arr = target.orig.split(' ');
      const shuffled = shuffle(words_arr);
      return {
        type: 'sentence',
        prompt: 'Составь предложение:',
        hint: target.trans,
        words: shuffled,
        correct: target.orig,
        example: target
      };
    },
    error: () => {
      const errors = DATA.grammar.flatMap(g => g.errors);
      if(errors.length === 0) return {type: 'error', error: 'Нет ошибок'};
      const target = rnd(errors);
      return {
        type: 'choice',
        prompt: 'Выбери правильный вариант:',
        hint: target.comment,
        options: [
          {text: target.wrong, correct: false, wrong: true},
          {text: target.right, correct: true}
        ],
        correct: target.right,
        error: target
      };
    },
    quiz: () => {
      const questions = DATA.grammar.flatMap(g => g.questions);
      if(questions.length === 0) return {type: 'quiz', error: 'Нет вопросов'};
      const target = rnd(questions);
      const options = target.opts.map((o, i) => ({text: o, correct: i === target.correct}));
      return {
        type: 'choice',
        prompt: 'Викторина:',
        question: target.q,
        options: shuffle(options),
        correct: target.opts[target.correct],
        questionData: target
      };
    },
    dictation: () => {
      const target = rnd(words);
      return {
        type: 'input',
        prompt: 'Послушай и напиши слово:',
        questionAudio: target.word,
        autoPlay: true,
        hint: target.trans,
        correct: target.word,
        word: target
      };
    }
  };
  
  return exercises[type] ? exercises[type]() : {type, error: 'Неизвестный тип'};
}

function createSession(type, count = 10){
  const session = {type, items: [], idx: 0, correct: 0, total: count, startTime: Date.now(), mistakes: []};
  for(let i = 0; i < count; i++){
    let ex;
    if(type === 'mistakes' && STATE.mistakes.length > 0) {
      const pool = STATE.mistakes.map(m => DATA.words.find(w => w.word === m)).filter(Boolean);
      ex = generateExercise('word2trans', pool.length ? pool : DATA.words);
    } else {
      ex = generateExercise(type);
    }
    if(ex.error){ toast(ex.error, 'error'); return null; }
    session.items.push(ex);
  }
  return session;
}

function startExercise(type){
  if(type === 'mistakes'){
    if(STATE.mistakes.length === 0){ toast('Нет ошибок для повторения', 'error'); return; }
    const mistakeWords = STATE.mistakes.map(m => DATA.words.find(w => w.word === m)).filter(Boolean);
    const session = {
      type: 'mistakes',
      items: shuffle(mistakeWords).slice(0, 10).map(w => generateExercise('word2trans', [w])),
      idx: 0, correct: 0, total: Math.min(10, mistakeWords.length),
      startTime: Date.now(), mistakes: []
    };
    navigate('session', {session});
    return;
  }
  const session = createSession(type);
  if(!session) return;
  navigate('session', {session});
}

function attachSessionHandlers(main, s, item){
  main.querySelectorAll('.answer-btn[data-idx]').forEach(b => {
    b.onclick = () => {
      if(b.classList.contains('correct') || b.classList.contains('wrong')) return;
      const isCorrect = b.dataset.correct === '1';
      const correctBtn = main.querySelector('.answer-btn[data-correct="1"]');
      if(isCorrect){
        b.classList.add('correct'); soundCorrect(); s.correct++;
        if(item.word) STATE.learned.add(item.word.word || item.word);
      } else {
        b.classList.add('wrong'); soundWrong();
        if(correctBtn) correctBtn.classList.add('reveal');
        if(item.word) STATE.mistakes.push(item.word.word || item.word);
        s.mistakes.push(item.word?.word || item.correct);
      }
      save();
      setTimeout(() => { s.idx++; render(); }, 1200);
    };
  });
  
  const inputAnswer = $('#inputAnswer');
  const checkAnswer = $('#checkAnswer');
  if(checkAnswer && inputAnswer){
    const check = () => {
      const val = inputAnswer.value.trim().toLowerCase();
      const correct = val === item.correct.toLowerCase();
      if(correct){
        inputAnswer.classList.add('correct'); soundCorrect(); s.correct++;
        if(item.word) STATE.learned.add(item.word.word || item.word);
      } else {
        inputAnswer.classList.add('wrong'); inputAnswer.value = item.correct; soundWrong();
        if(item.word) STATE.mistakes.push(item.word.word || item.word);
        s.mistakes.push(item.correct);
      }
      save();
      setTimeout(() => { s.idx++; render(); }, 1500);
    };
    checkAnswer.onclick = check;
    inputAnswer.onkeydown = e => { if(e.key === 'Enter') check(); };
    setTimeout(() => inputAnswer.focus(), 100);
  }
  
  const checkSentence = $('#checkSentence');
  if(checkSentence){
    const area = $('#sentenceArea');
    const pool = $('#sentencePool');
    pool.querySelectorAll('button').forEach(b => {
      b.onclick = () => { if(b.parentElement === pool) area.appendChild(b); else pool.appendChild(b); };
    });
    checkSentence.onclick = () => {
      const built = [...area.querySelectorAll('button')].map(b => b.dataset.w).join(' ');
      const correct = built === item.correct;
      if(correct){ soundCorrect(); s.correct++; toast('Правильно! ✓', 'success'); if(item.example) STATE.learned.add(item.example.orig); }
      else { soundWrong(); toast(`Правильно: ${item.correct}`, 'error'); s.mistakes.push(item.correct); }
      save();
      setTimeout(() => { s.idx++; render(); }, 1500);
    };
  }
}

function startSprint(){
  const session = {type: 'sprint', time: 60, score: 0, startTime: Date.now(), mistakes: [], timer: null};
  STATE.session = session;
  STATE.screen = 'session';
  render();
  const main = $('#main');
  let nextTimeout = null;
  
  const cleanup = () => {
    if(session.timer) { clearInterval(session.timer); session.timer = null; }
    if(nextTimeout) { clearTimeout(nextTimeout); nextTimeout = null; }
  };
  
  const nextWord = () => {
    if(session.time <= 0){
      cleanup();
      const rec = STATE.records.sprint || 0;
      const isNewRecord = session.score > rec;
      if(isNewRecord) STATE.records.sprint = session.score;
      save();
      main.innerHTML = `
        <div class="session-card ornament-border">
          <h2 style="color:var(--accent)">⏱️ Время вышло!</h2>
          <div style="font-size:4rem;margin:20px 0">🏃</div>
          <div style="font-size:2.5rem;font-weight:700;color:var(--primary)">${session.score} слов</div>
          <div style="color:var(--text-soft);margin:8px 0">за 60 секунд</div>
          ${isNewRecord ? '<div style="color:var(--secondary);font-weight:600;margin:12px 0;font-size:1.1rem">🎉 Новый рекорд!</div>' : `<div style="color:var(--text-soft);margin:8px 0">Рекорд: ${rec}</div>`}
          <div style="margin-top:20px">
            <button class="btn btn-primary" onclick="startSprint()">🔄 Ещё раз</button>
            <button class="btn btn-ghost" onclick="navigate('training')" style="margin-left:12px">⚡ Тренировка</button>
          </div>
        </div>
      `;
      return;
    }
    const w = rnd(DATA.words);
    const opts = shuffle([w, ...shuffle(DATA.words.filter(x => x.id !== w.id)).slice(0, 3)]);
    main.innerHTML = `
      <div class="session-card">
        <div class="timer ${session.time <= 10 ? 'urgent' : ''}">${session.time}с</div>
        <div style="color:var(--text-soft);margin-bottom:16px">Счёт: <span style="font-weight:700;color:var(--primary)">${session.score}</span></div>
        <div class="prompt">Выбери перевод:</div>
        <div class="question">${esc(w.word)} <button class="btn btn-small btn-ghost" data-say="${esc(w.word)}">🔊</button></div>
        <div class="answers">${opts.map(o => `<button class="answer-btn" data-w="${esc(o.word)}" data-correct="${o.word === w.word ? '1' : '0'}">${esc(o.trans)}</button>`).join('')}</div>
      </div>
    `;
    attachSayHandlers(main);
    main.querySelectorAll('.answer-btn').forEach(b => {
      b.onclick = () => {
        if(b.classList.contains('correct') || b.classList.contains('wrong')) return;
        if(b.dataset.correct === '1'){ b.classList.add('correct'); soundCorrect(); session.score++; STATE.learned.add(w.word); }
        else { b.classList.add('wrong'); soundWrong(); main.querySelectorAll('.answer-btn[data-correct="1"]').forEach(x => x.classList.add('reveal')); STATE.mistakes.push(w.word); }
        save();
        nextTimeout = setTimeout(nextWord, 400);
      };
    });
  };
  
  session.timer = setInterval(() => {
    session.time--;
    const timerEl = $('.timer');
    if(timerEl){ timerEl.textContent = `${session.time}с`; if(session.time <= 10) timerEl.classList.add('urgent'); }
  }, 1000);
  
  nextTimeout = setTimeout(nextWord, 500);
}

      if(filter==='learned' && !STATE.learned.has(w.word)) return false;
      if(filter==='new' && STATE.learned.has(w.word)) return false;
      if(filter!=='all'&&filter!=='learned'&&filter!=='new' && w.level!==filter) return false;
      if(search && !w.word.toLowerCase().includes(search) && !w.trans.toLowerCase().includes(search)) return false;
      return true;
    });
    $('#wordList').innerHTML = list.length ? list.map(w=>`<div class="word-item ${STATE.learned.has(w.word)?'learned':''}"><span class="w">${esc(w.word)}</span><span class="i">${esc(w.ipa)}</span><span class="t">${esc(w.trans)}</span><span class="lvl">${esc(w.level)}</span><button class="btn btn-small btn-ghost" data-say="${esc(w.word)}">🔊</button></div>`).join('') : '<div class="card" style="text-align:center;color:var(--text-soft)">Ничего не найдено</div>';

    $('#filters').querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); filter = c.dataset.f; renderList();
  });
  $('#exportBtn').onclick = () => {
    const txt = DATA.words.map(w=>`${w.word} | ${w.ipa} | ${w.trans} | ${w.level} | ${w.cat}`).join('\n');

    const a = document.createElement('a');

    a.download = 'crim_tatar_dictionary.txt';
    a.click();
  };

      const lines = r.result.split('\n').filter(l=>l.trim());
      lines.forEach(l=>{
        const [word,ipa,trans,level,cat] = l.split('|').map(s=>s.trim());
        if(word && !DATA.words.find(w=>w.word===word)) DATA.words.push({word,ipa:ipa||'',trans:trans||'',level:level||'A1',cat:cat||'',id:word});
      });
      toast(`Импортировано ${lines.length} строк`,'success');
      renderList();
    };
    r.readAsText(f);
  };
  $('#exportProgressBtn').onclick = () => {
    const data = {
      version: '1.0',
      date: new Date().toISOString(),
      learned: [...STATE.learned],
      mistakes: STATE.mistakes,
      streak: STATE.streak,
      lastDay: STATE.lastDay,
      achievements: [...STATE.achievements],
      records: STATE.records,
      cards: STATE.cards
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `crh_progress_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  };
  $('#importProgressFile').onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if(data.learned) STATE.learned = new Set(data.learned);
        if(data.mistakes) STATE.mistakes = data.mistakes;
        if(data.streak) STATE.streak = data.streak;
        if(data.lastDay) STATE.lastDay = data.lastDay;
        if(data.achievements) STATE.achievements = new Set(data.achievements);
        if(data.records) STATE.records = data.records;
        if(data.cards) STATE.cards = data.cards;
        save();
        toast('Прогресс восстановлен! ✅', 'success');
        renderList();
        render();
      } catch(e) { toast('Ошибка загрузки файла', 'error'); }
    };
    r.readAsText(f);
  };
  renderList();
}

  const boxes = STATE.cards.boxes || {0:[],1:[],2:[],3:[],4:[],5:[]};
  STATE.cards.boxes = boxes;
  const currentBox = STATE.cards.currentBox || 0;

  main.innerHTML = `

    </div>
    ${word ? `
      <div class="flashcard" id="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-front">
            <div class="big">${esc(word.word)}</div>
            <div class="sub">${esc(word.ipa)}</div>

            <div class="sub">${esc(word.cat)}</div>
            <button class="btn btn-small btn-ghost" style="margin-top:16px;background:rgba(255,255,255,.3);color:white" data-say="${esc(word.word)}">🔊 ${esc(word.word)}</button>
          </div>
        </div>
      </div>
      <div class="card-controls">
        <button class="btn btn-danger" id="wrongBtn">❌ Не знаю</button>
        <button class="btn btn-primary" id="rightBtn">✓ Знаю</button>
      </div>
    ` : '<div class="card" style="text-align:center">В этой коробке нет карточек</div>'}
  `;
  attachSayHandlers(main);
  const fc = $('#flashcard');
  if(fc) fc.onclick = () => fc.classList.toggle('flipped');
  $$('.filter-chip[data-b]').forEach(c=>c.onclick=()=>{ STATE.cards.currentBox = parseInt(c.dataset.b); save(); render(); });
  const wrongBtn = $('#wrongBtn');
  const rightBtn = $('#rightBtn');
  if(wrongBtn){
    wrongBtn.onclick = () => {
      if(!word) return;
      boxes[0].push(word.word);
      boxes[currentBox] = boxes[currentBox].filter(w=>w!==word.word);
      STATE.cards.boxes = boxes;
      save(); render();

      if(!word) return;
      const next = Math.min(currentBox+1, 5);
      boxes[next].push(word.word);
      boxes[currentBox] = boxes[currentBox].filter(w=>w!==word.word);
      STATE.cards.boxes = boxes;
      STATE.learned.add(word.word);
      soundCorrect();
      save(); render();
    };
  }
}
