в значениях:\nпоток, река, канал. В качестве ключа обычно выделяют производную от нее графему , которая не имеет самостоятельного употребления.\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Камень, скала (sh [ши]).\nЭта графема восходит к изображению горы с тремя пиками. Она употребляется в качестве самостоятельного иероглифа с исходным значением. В левой части иероглифа графема пишется в несколько сокращенном варианте.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Холм (f).\nРисунок, к которому восходит эта графема, возможно, изображал лестницу, ведущую наверх, на какую-то возвышенность. По другой версии, он изображал несколько\nположенных друг на друга камней.\nГрафема в качестве иероглифа употребляется крайне редко, а в качестве компонента\nвсегда пишется производная от нее графема , которая отличается от графемы (поселение) лишь тем, что поселение всегда пишется справа, а\nе\nхолм — слева.\nм\nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Пещера (xu [сюэ]).\nЭта графема в первоначальном виде изображала свод или отверстие, образованное двумя\nкаменными глыбами. Часто употребляется как самостоятельный иероглиф в значениях:\nпещера, нора; яма, дыра, отверстие; точка акупунктуры. Как компонент всегда пишется\nв сокращенном варианте с точками вместо нисходящих черт в верхней части иероглифа.\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n10. Ущелье, долина (g).\nЭта графема, скорее всего, восходит к изображению ущелья (нижний элемент— яма,\nовраг) в горах (верхний элемент), хотя верхний элемент также мог изображать воду,\nв таком случае рисунок обозначал просто какой-то водоем. Интересно, что графема\nв современном написании больше всего похожа на наиболее древнюю пиктограмму.\nГрафема употребляется самостоятельно в значениях: долина, ущелье, а также зерновые.\nВ левой части иероглифа графема пишется в сокращенном варианте.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Дождь (y\ny [юй]).\nРисунок, к которому восходит эта графема, изображал грозовую тучу и падающие капли\nдождя.\nВ современном китайском графема употребляется самостоятельно в своем исходном\nзначении. В качестве компонента графема всегда пишется в сокращенном варианте\nсверху иероглифа.\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Электричество (din [диэнь]).\nЭта графема восходит к изображению грозовой молнии, в более поздних вариантах\nнаписания она содержала также элемент (дождь).\nВ качестве компонента эта графема употребляется редко и не является ключом, однако\nв современном китайском языке она используется очень часто в своем исходном значении.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Ветер (fēng [фэн]).\nЭта графема в своем наиболее раннем начертании имеет в себе элемент (солнце)—\nэто связано с тем, что китайцы в древности думали, что ветер порождается активностью\nсолнца.\nБолее поздние начертания имеют в себе элемент (насекомое)— это связано с поверьем, что ветер способствует появлению насекомых.\nВ качестве самостоятельного иероглифа графема употребляется в значениях ветер,\nобычай, известие.\nПолная форма написания:\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Воздух, туман, газ (q [цси]).\nЭта графема восходит к изображению испарений, поднимающихся от земли и образующих облака. В более поздних вариантах, в том числе в полной форме, эта графема писалась с элементом (рис\n), видимо, подразумевая пар, который образуется при варке\nриса. Современный иероглиф употребляется в значениях: газ, туман, воздух; настроение; жизненная сила и др.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Облако (yn [юнь]).\nЭта графема восходит к изображению облака. В более поздних вариантах, в том числе\nв полной форме, эта графема писалась с элементом (дождь). В современном китайском языке иероглиф ѥ употребляется в своем исходном значении.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Земля (t), щепотка (guī).\nПиктограмма, к которой восходит графема, изображала взошедший из земли\nросток. В современном китайском графема употребляется самостоятельно\nв значениях земля, почва.\nИероглиф\nвосходит к изображению нефритового жезла, но он пишется как две\nземли, отсюда значение щепотка. Его можно рассматривать как сложный иероглиф.\nВариант написания слева (земля):\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Золото, металл (jīn [цзинь]).\nСейчас достаточно сложно говорить об этимологии этой графемы, но, скорее\nвсего, она восходит к изображению золотых слитков, находящихся в земле.\nГрафема в качестве самостоятельного иероглифа употребляется в значениях\nзолото, золотой; металл, металлический.\n\nВ качестве компонента всегда пишется ее производная\nв левой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. Огонь (hu).\nЭта графема восходит к изображению языков пламени костра. В качестве самостоятельного иероглифа она употребляется в значениях: огонь, пламя, пожар.\nВ левой части иероглифа графема пишется в сокращенном варианте с точкой\nвместо нисходящей вправо.\nУ этой графемы есть производная .\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Вода, лед (shuӿ [шуэй]).\nЭта графема, как и , восходит к изображению водного потока. Этот иероглиф\nупотребляется очень часто, обозначая жидкость, воду.\nВ качестве компонента эта графема может писаться в низу иероглифа в несколько\nизмененном виде с пятью чертами вместо четырех. Кроме того, у нее есть производные (три капли воды) и (лед).\nВариант написания снизу:\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЧТЕНИЕ ГРАФЕМ","y (g)— долина, ущелье;\ny (t)— земля;\ny (f)— холм;\ny\n(guī)— щепотка, малость, мера;\ny (duō)— много;\ny (hu)— огонь."],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\nӇ\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Сравните графемы:\n()()\n4. Найдите знакомые графемы в следующих иероглифах:\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите"],["ключи к упражнениям):",", , , , Ӈ;\n, , , , , .\n6. Потренируйтесь бегло читать следующие графемы:\n\n7. Переведите и запишите иероглифами:\nвход, вход/импорт, высокие ворота.\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nСолнце; день\n(r [жи])\nЛуна; месяц\n(yu [юэ])\nРавный; друг\n(png [пэн])\nВечер (xī [си])\n\nМного (duō)\nГора (shān [шань])\nВариант\nслева\nВодный поток\n(chuān [тшуань])\nВариант\nснизу\nПроизводная\nграфема\nКамень, скала\n(sh [ши])\nХолм (f)\nПроизводная\nграфема\nПещера\n(xu [сюэ])\nВариант\nсверху\nДолина, ущелье\n(g)\nВариант\nслева\n\nДождь (y\ny [юй])\nВариант\nсверху\nЭлектричество\n(din [диэнь])\nВетер (fēng [фэн])\nВоздух; газ\n(q [цси])\nОблако\n(yn [юнь])\nЗемля (t)\nВариант\nслева\nЩепотка (guī)\nЗолото, металл\n(jīn [цзинь])\nПроизводная\nграфема\nОгонь (hu)\nВариант\nслева\nПроизводная\nграфема"]],"6":[["Начало урока","Вода\n(shuӿ [шуэй])\nВариант снизу\nПроизводная\nграфема\nЛед\nСнизу нисходящевосходящая черта!"],["ФОНЕТИКА","ФИНАЛИ AN, EN, UAN\nВ этом уроке мы рассмотрим финали an, en, uan и слоги, которые они образуют с изученными нами\nв предыдущих уроках инициалями (табл.6.1).\nТаблица 6.1. Финали an, en, uan в сочетании с инициалями b, p, m, f, d, t, n, l, g, k, h\nИнициали/\nфинали\nan [an]\nen [n]\nuan [uan]\nb [b]\nban\nben\np [p]\npan\npen\nm [m]\nman\nmen\nf [f]\nfan\nfen\nd [d]\ndan\nden\nduan\nt [t]\ntan\ntuan\nn [n]\nnan\nnen\nnuan\nl [l]\nlan\nluan\ng [g]\ngan\ngen\nguan\nk [k]\nkan\nken\nkuan\nh [h]\nhan\nhen\nhuan"],["Комментарий","Звук n [n] в финалях an, en и uan произносится так же, как в инициали\nn, при его произнесении кончик языка тоже чуть касается альвеол, его\nназывают переднеязычным звуком n (рис.6.1\nФиналь an [an] произносится похоже на русское ань, но н не так сильно\nсмягчается.\nФиналь en [n] произносится похоже на русское энь, но н не так сильно\nсмягчается. Гласный звук e при этом становится более закрытым []\nи передним, поскольку язык перемещается вперед для произнесения\nпереднеязычного звука n.\nФиналь uan [uan] произносится похоже на русское уань, но н не так\nсильно смягчается. Гласная u является медиалью."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 6.1.1\n1. Прочитайте, повторяя за диктором, финали an, en и uan в сочетании с изученными ранее инициалями:\nān\nbān\npān\nmān\nfāf n\ndān\ntān\nnān\nlān\ngān\nkān\nhān\nēn\nbēn\npēn\nmēn\nfēf n\ndēn\nnēn\ngēn\nkēn\nhēn\nuān\nduān\ntuān\nnuān\nluān\nguān\nkuān\nhuān\nān bn pӽn mn ēn fn děn nn uān lun guӽn kun\nCD 6.1.2\n2. Прочитайте, повторяя за диктором, слоги с контрастными финалями an/en, an/uan:\nān ēn\nbn bn\npӽn pěn\nmn mn\nfāf n fēf n\ndn dn\nnӽn něn\ngn gn\nān uān\ndn dun\ntӽn tuӽn\nnn nun\nCD 6.1.3\n3. Прочитайте, повторяя за диктором, слоги с контрастными финалями e []/en [n]:\nē ēn d dn\ngě gěn\nh hn\nCD 6.1.4\n4. Прочитайте, повторяя за диктором, каждый из пройденных слогов в тех тонах, в которых они\nупотребляются:\nān - ӽn n\nēn - - n\nbān - bӽn bn\nbēn - běn bn\npān pn - pn\npēn pn - pn\nmān mn mӽn mn\nmēn mn - mn\nfān fn fӽf n fn\nfēn fn fěn fn\ndān - dӽn dn\n- - - dn\nduān - duӽn dun\ntān tn tӽn tn\ntuān tun tuӽn tun\nnān nn nӽn nn\n- - - nn\n- - nuӽn -\nlān ln lӽn ln\n- lun luӽn lun\ngān - gӽn gn\ngēn gn gěn gn\nguān - guӽn gun\nkān - kӽn kn\n- - kěn kn\nkuān - kuӽn -\nhān hn hӽn hn\n- hn hěn hn\nhuān hun huӽn hun\nРис. 6.1. Техника\nпроизнесения переднеязычного звука n\n\n5. Прослушайте следующую скороговорку, затем прочитайте ее, повторяя за диктором:\nNnnn yu g ln\nУ Нань-нань есть корзинка (отрывок)\nNnnn fānle lnln,\nњ\nНань-нань опрокинула корзинку,\nLnln kule pnpn,\nњ\nКорзинка накрыла тарелку,\nPnpn dӽle wӽnwӽn,\nњ\nТарелка опрокинула пиалу,\nWӽnwӽn sāle fnfn.\n\nњ\nИз пиалы рассыпался рис."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 6.2.1\n1. Прочитайте следующие односложные слова, повторяя за диктором:\nt pn ()— тарелка;\nt\nln ()— синий;\nt\nfn ()— отварной рис, еда;\nt\nhn ()— китайский;\nt\nnn ()— трудный;\nt\nnn ()— юг;\nt\nnn ()— мужчина;\nt\nkn ()— смотреть, читать;\nt\ngn ()— делать что-либо:\nt\ngēn ()— следовать, вместе с…, с…;\nt\nmn ()— медленно;\nt\nmӽn ()— полный, довольный;\nt guān (\n)— закрывать;\nt\nmn ()— ворота, дверь;\nt hěn ()— очень;\nt\n-men (Ӏ)— суффикс множественного числа.\nCD 6.2.2\n6. Прочитайте следующие сложные слова и словосочетания, повторяя за диктором:\nt\nnnběi (\n)— север и юг;\nt ln pn ()— синяя тарелка;\nt\nkāi mn ()— открыть дверь;\nt guān mn (\n)— закрыть дверь;\nt kn bo ()— читать газеты;\nt\nb kn bo ()— не читать газеты;\nt\nhӽokn ()— красивый;\nt\nb hӽokn ()— некрасивый;\nt\nnnkn ()— уродливый;\nt\nhӽohē ()— вкусный (о напитке);\nt\nb hӽohē ()— невкусный;\nt\nnnhē ()— отвратительный;\nt\nhěn hӽo ()— (очень) хороший;\nt\nhěn mn ()— (очень) медленный;\nt\nhěn nn ()— (очень) трудный;\nt\nhěn gāo ()— (очень) высокий;\nt\nhěn hӽokn ()— (очень) красивый.\nCD 6.2.3\n7. Прочитайте следующие предложения, повторяя за диктором:\nNӿ hӽo ma? — Hěn hӽo, nӿ ne? (— )— Как твои дела? (Очень) хорошо,\nа у тебя?\nNӿ bba māma hӽo ma? — Tāmen dōu hěn hӽo. (— ҪӀ)— Как\nпоживают твои папа и мама? — У них (обоих) все (очень) хорошо.\nTā mimei hěn hӽokn. (\n)— Ее младшая сестра (очень) красивая.\nNӿ gēge hěn gāo. ()— Твой старший брат (очень) высокий.\nPbāo b gu. (\n)— Портфель недорогой."],["Комментарий","1. Прилагательные типа hӽokn/nnkn.\nДля китайского языка характерно наличие прилагательных, имеющих оттенок смысла, указывающий на то, что совершение какого-то действия вызывает определенные эмоции, например:\nhӽokn — красивый, красиво (букв. хорошо смотреть), hӽohē — вкусный, вкусно (букв. хорошо\nпить), nnkn— уродливый, уродливо (букв. трудно смотреть), nnhē— отвратительный на\nвкус (букв.\nс\nтрудно пить).\n2. Суффикс множественного числа -men.\nСуффикс множественного числа -men может употребляться только с местоимениями, например:\ntāmen — они, nӿmen — вы, и в редких случаях с существительными, обозначающими людей.\n3. Предложения с качественным сказуемым.\nПредложения с качественным сказуемым— предложения, сказуемое которых выражено прилагательным или наречием, например: Tā mimei hěn hӽokn.— Ее младшая сестра (очень) красивая. Nӿ gēge hěn gāo.— Твой старший брат (очень) высокий. Tāmen dōu hěn hӽo.— У них (\nх всех)\nвсе (очень) хорошо.\n4. Наречие степени hěn.\nНаречие степени hěn, которое обычно переводится как очень, весьма в отличие от hӽo, хотя\nи употребляется чаще, на самом деле скорее исполняет функциональную роль, на русский его\nможно не переводить. Hěn практически всегда ставится в утвердительных предложениях с качественным сказуемым, занимая позицию перед сказуемым."],["ЗАДАНИЯ","CD 6.3.1\n1. Слушая звукозапись, определите слог в правильном тоне:\nt mān mn mӽn mn\nt fēf n ff n fěf n ff n\nt\ntuān tun tuӽn tun\nt bēn bn běn bn\nt huān hun huӽn hun\nt\ngēn gn gěn gn\nt\nfāf n ff n fӽf n ff n\nt\nlān ln lӽn ln\nt\nnān nn nӽn nn\nt tān tn tӽn tn\nt hān hn hӽn hn\nt\ngān gn gӽn gn\nCD 6.3.2\n2. Слушая звукозапись, поставьте правильный тон в следующих словосочетаниях:\nmen han huan lan duan man fen gan luan nan ben tuan pan kan tan an\nCD 6.3.3\n3. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n4. Переведите с русского на китайский и запишите с помощью пиньинь:\nКак поживает твоя бабушка (по отцу)?— У нее все хорошо.\n__________________________________________________________________________________\n\nКак поживают твои старший и младший братья?— У них все хорошо.\n__________________________________________________________________________________\nПортфель очень дорогой. Его младший брат невысокий. Она очень красивая.\n__________________________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: РАСТЕНИЯ И ЗЕМЛЕДЕЛИЕ\nВ данном уроке мы рассмотрим графемы, связанные с растениями и земледелием (табл.6.2).\nТаблица 6.2. Графемы, связанные с растениями и земледелием\nГрафемы\nТранскрипция\nЗначение\nросток\n\nтрава\nshēng [шэн]\nрождаться\nzh [чжу]\nбамбук\nѠ\ng\nштука\n(универсальное\nсчетное слово)\nm\nдерево\n\nběn\nкорень;\nсчетное слово\nдля книг\nh\nзлак\nmӿ\nрис; зерно\n\nli\nприходить\nГрафемы\nТранскрипция\nЗначение\nm\nлен, конопля\n\nguā\nтыква\nђ\ndōng [дун]\nвосток\n\nnin [ниэнь]\nгод\n\nq [цси]\nровный\n\nxiāng [сян]\nароматный\nxīn [синь]\nгорький\n\ndu\nбобы\n\ntin [тиэнь]\nполе\nlӿ\nли (0,6 км); внутри\ngu\nплод\nВ качестве ключей из них обычно выделяют графемы:\n, ,, , ,,, ,,, , ,, , .\n1. Росток, трава.\nГрафема восходит к изображению только что взошедшего побега или ростка. Два\nростка стали обозначать траву. Однако в современном написании графема сократилась до . Обе эти графемы употребляются только в качестве компонентов\nсложных иероглифов. Графема всегда пишется сверху.\nВарианты написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n2. Появляться, рождаться (shēng [шэн]).\nЭта графема также восходит к изображению ростка, пробившегося сквозь толщу земли.\nВ современном китайском иероглиф имеет множество значений, основные из которых: рождаться, появляться на свет, возникать, жить, существовать; сырой, свежий.\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Бамбук (zh [чжу]), штука (g).\nПиктограмма, к которой восходит графема , изображала две веточки бамбука\nс листьями. Одна веточка стала обозначать штуку или единицу чего-либо, что\nявляется универсальным счетным словом.\nГрафема употребляется самостоятельно в исходном значении, а в качестве компонента только в сокращенном варианте. Графема (g) не может быть компонентом.\nВариант написания сверху:\n. Полная форма написания (штука):\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Дерево (m), корень (běn).\nОбе эти графемы восходят к изображению дерева с корнями, стволом и ветвями,\nтолько в графеме горизонтальной линией дополнительно выделены корни.\nИероглиф используется главным образом для обозначения дерева как материала, в то время как дерево как растение обозначается иероглифом\n. Иероглиф\nможет означать: корень, основу, том (книги).\nВарианты написания (дерево):\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Злак (h).\nРисунок, к которому восходит эта графема, изображал колос, согнувшийся под тяжестью своих зерен.\nВ качестве иероглифа эта графема встречается достаточно редко, зато в качестве компонента она употребляется очень часто. При варианте написания слева нисходящая вправо\n\nчерта сокращается до точки, так же как у графемы .\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n6. Рис, зерно (mӿ).\nХотя эта графема в своем современном написании изображает рисовое растение, изначально она обозначала засеянное рисовое поле или зерна риса.\nСовременным китайским иероглифом кроме риса могут обозначаться другие виды\nзерна.\nПри варианте написания слева нисходящая вправо черта сокращается до точки.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Приходить (li).\nРисунок, к которому восходит эта графема, изображал ячмень. Однако впоследствии\nграфемой стали обозначать абстрактное понятие приходить, которое произносилось\nтак же, как ячмень.\nВ современном китайском языке этот иероглиф употребляется очень часто в значениях\nприходить, прибывать и др.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Лен, конопля (m).\nРисунок, к которому восходит эта графема, изображал растения, сложенные под навесом\nили в сарае.\nВ современном китайском иероглиф употребляется в значениях конопля, лен, пакля,\nджут, холст, а также оцепенение, паралич, мурашки (по телу).\nВ качестве компонента графема пишется всегда сверху иероглифа в немного измененном виде.\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n9. Тыква (guā).\nНа древнем рисунке, к которому восходит эта графема, можно увидеть ползучий стебель\nи крупный плод, что изображало какую-то бахчевую культуру.\nВ современном китайском языке иероглиф в сочетаниях может означать тыква,\nдыня, арбуз, огурец.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Восток (dōng [дун]).\nЭта графема восходит к рисунку, изображающему встающее из-за леса солнце, что символизировало восток. Впоследствии графема была упрощена до .\nВ современном китайском она употребляется самостоятельно, в основном в своем исходном значении. В качестве компонента она всегда пишется в правой части иероглифа.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Год (nin [ниэнь]).\nПиктограмма, к которой восходит эта графема, изначально состояла из двух знаков, колоса\nи тысячи, что вместе означало годовой урожай. Однако впоследствии графему стали\nупотреблять в значении год. В качестве компонента она практически не употребляется, но\nкак иероглиф используется в современном китайском языке очень часто.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Ровный (q [цси]).\nДревний рисунок, к которому восходит эта графема, изображал ровные ряды кукурузы,\nвыражая идею упорядоченности и гармонии. В упрощенном варианте графема также выглядит ровной и симметричной. В современном китайском графема употребляется самостоятельно в значениях ровный, стройный; вместе, сообща; целиком.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Ароматный (xiāng [сян]).\nДревний рисунок, ставший прототипом этой графемы, изображал рот и какое-то растение, имеющее сладкий вкус и аромат. Впоследствии снизу вместо рта стали изображать\nсолнце. В современном китайском языке графема употребляется самостоятельно в значениях ароматный, пахучий, душистый, сладкий, аппетитный; благовония.\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Горький (xīn [синь]).\nДревний рисунок, ставший прототипом этой графемы, также изображал рот и какое-то\nрастение, видимо, имеющее горький вкус.\nВ современном китайском языке графема употребляется самостоятельно в значениях\nгорький, терпкий, острый (вкус), а также горький, скорбный, тяжелый, тяжкий (труд).\nВ качестве компонента при написании слева может иметь несколько измененное написание с нисходящей влево вместо вертикальной черты.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Бобы (du).\nЭта графема, имеющая в современном китайском значение бобы, на самом деле восходит\nк изображению какого-то сосуда для приготовления пищи. Сейчас сложно сказать, почему\nзначение этой графемы так сильно изменилось.\nВ современном китайском языке иероглифомобозначаются любые бобовые культуры.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Поле (tin [тиэнь]).\nЭта графема восходит к изображению размежеванного поля.\nВ современном китайском языке она употребляется самостоятельно в своем исходном\nзначении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Ли, внутри, в (lӿ).\nЭта графема состоит из двух элементов: поле и земля. Рисунок, к которому она восходит,\nизначально обозначал деревню протяженностью в 600метров. Позднее так стали обозначать меру длины ли— расстояние в 600 метров.\nВ современном китайском языке иероглиф помимо основного имеет значение внутри.\nВ качестве компонента в варианте написания слева пишется в немного измененном виде.\nВариант написания слева:\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. Плод (gu).\nЭта графема восходит к изображению дерева с плодами на нем. В современном китайском языке она употребляется самостоятельно в значениях плод, фрукт; результат.\nВ качестве компонента при написании слева может иметь немного сокращенный вариант с точкой вместо нисходящей влево.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЧТЕНИЕ ГРАФЕМ","t (g)— штука, единица;\nt (h)— злак;\nt (m)— дерево, деревянный;\nt (m)— лен, конопля;\nt (mӿ)— рис, зерно;\nt (lӿ)— «ли», внутри;\nt (du)— бобы;\nt (li)— приходить;\nt (guā)— тыква;\nt (gu)— плод, фрукт, результат;\nt (mn)— ворота, дверь;\nt (běn)— корень, основа."],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\nѠђ\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Сравните графемы:\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям):\n, , , , , ,\n,; ,.\n6. Потренируйтесь бегло читать следующие графемы:\nѠ\n\n7. Потренируйтесь бегло читать следующие сложные слова и словосочетания:\n,, ,.\n8. Переведите на китайский и запишите иероглифами следующие словосочетания:\nВысокая гора, вулкан (дословно «огненная гора»), горное ущелье, дождевая вода, много облаков,\nветер и дождь (ветер с дождем), вода и огонь, металлы и минералы (или золото и драгоценные\nкамни), солнце и луна (или дни и месяцы).\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nРосток\nВариант\nслева\nВариант\nТрава\nРождаться\n(shēng [шэн])\nВариант сверху\n\nБамбук\n(zh [чжу])\nВариант\nсверху\nШтука, единица\n(g)\nДерево (материал)\n(m)\nВариант\nслева:\nВариант\nснизу:\nКорень; основа\n(běn)\nЗлак (h)\nВариант\nслева\nРис; зерно (mӿ)\nВариант\nслева\nПриходить (li)\nЛен, конопля (m)\nВариант\n\nТыква (guā)\nВосток (dōng\n[дун])\nГод (nin [ниэнь])\nРовный\n(q [цси])\nАроматный\n(xiāng [сян])\nГорький; тяжкий\n(xīn [синь])\nВариант\nслева\nБобы (du)\nПоле (tin\n[тиэнь])\n«Ли»; внутри, в…\n(lӿ)\nВариант\nслева\nПлод (gu)\nВариант\nслева"]],"7":[["ФОНЕТИКА","ФИНАЛИ ANG, ENG, UANG\nВ этом уроке мы рассмотрим финали ang, eng, uang и слоги, которые они образуют с изученными\ng\nнами в предыдущих уроках инициалями (табл.7.1).\nТаблица 7.1. Слоги, образуемые инициалями b, p, m, f, d, t, n, l, g, k, h с финалями\nang, eng, uang\nИнициали/\nфинали\nang [ŋ]\neng [ŋ]\nuang [ŋ]\nang\nb [b]\nbang\nbeng\np [p]\npang\npeng\nm [m]\nmang\nmeng\nf [f]\nfang\nfeng\nd [d]\ndang\ndeng\nt [t]\ntang\nteng\nn [n]\nnang\nneng\nl [l]\nlang\nleng\ng [g]\ngang\ngeng\nguang\nk [k]\nkang\nkeng\nkuang\nh [h]\nhang\nheng\nhuang\nКомментарии\nЗвук ng [ŋ] в слогах ang, eng и\ng\nuang называется носовым заднеязычным\ng\nn,\nон произносится так же, как английский звук ng. При артикуляции ng\nзадняя часть спинки языка поднимается и смыкается с мягким нёбом\n(рис.7.1\nФиналь ang [ŋ] произносится похоже на русское ан, но с носовым заднеязычным звуком н. Гласный звук a при этом становится более закрытым\na\n[] и задним, поскольку язык перемещается назад для произнесения заднеязычного звука n [ŋ].\nФиналь eng [ŋ] произносится похоже на русское эн, но с носовым заднеязычным звуком н. Гласный звук e при этом становится более закрытым\n[] и задним, поскольку язык перемещается назад для произнесения заднеязычного звука n [ŋ].\nФиналь uang [uŋ] произносится похоже на русское уан, но с носовым\nзаднеязычным звуком н. Гласная u является медиалью."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 7.1.1\n1. Прочитайте, повторяя за диктором, финали ang, eng и uang в сочетании с изученными ранее\ng\nинициалями:\nРис. 7.1. Техника\nпроизнесения заднеязычного звука n\n\nāng\nbāng\npāng\nmāng\nfāf ng\ndāng tāng nāng lāng gāng kāng hāng\nēng\nbēng\npēng\nmēng\nfēf ng\ndēng tēng nēng lēng gēng kēng hēng\nuāng guāng kuāng huāng\nbāng gng kӽng hng\nēng gng kěng hng\nuāng gung kuӽng hung\nCD 7.1.2\n2. Прочитайте, повторяя за диктором, слоги с контрастными финалями ang/eng, ang/uang:\nāng ēng bng bng pӽng pěng mng mng\nfāf ng fēf ng dng dng tӽng těng nng nng\nāng uāng gng gung kӽng kuӽng hng hung\nCD 7.1.3\n3. Прочитайте, повторяя за диктором слоги с контрастными фианлями an/ang, en/eng, uan/uang:\nān āng bn bng pӽn pӽng mn mng\nēn ēng ff n ff ng děn děng nn nng\nuān uāng gun gung kuӽn kuӽng hun hung\nCD 7.1.4\n4. Прочитайте, повторяя за диктором, каждый из пройденных слогов в тех тонах, в которых они\nупотребляются:\nāng ng - ng\nbāng - bӽng bng\nbēng bng běng bng\npāng png pӽng png\npēng png pěng png\nmāng mng mӽng -\nmēng mng měng mng\nfāf ng ff ng fӽf ng ff ng\nfēf ng ff ng fěf ng ff ng\ndāng dng dӽng dng\ndēng dng děng dng\ntāng tng tӽng tng\ntēng tng těng tng\nnāng nng nӽng nng\nnēng nng něng nng\nlāng lng lӽng lng\nlēng lng lěng lng\ngāng gng gӽng gng\ngēng gng gěng gng\nguāng gung guӽng gung\nkāng kng kӽng kng\nkēng kng kěng kng\nkuāng kung kuӽng kung\nhāng hng hӽng hng\nhēng hng hěng hng\nhuāng hung huӽng hung\nCD 7.1.5\n5. Прослушайте следующую скороговорку, затем прочитайте ее, повторяя за диктором:\nFēi fng\nЛетящий феникс (отрывок)\nFӽn fng fāngfӽf\nЕсли повернуть вышивку,\nFӽngf fēi fng,\nӓ То кажется, что феникс летит,\nFӽnf fān fng\nА если ее постоянно поворачивать,\nFēi fng fn fēi.\n\nЛетящий феникс стремительно взлетает."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 7.2.1\n1. Прочитайте следующие односложные слова, повторяя за диктором:\nt fāng ()— сторона, направление;\nt\nfēng ()— ветер;\nt\nmng ()— занятой;\nt hung ()— желтый;\nt\nlng ()— волна;\nt\npng ()— полный, толстый;\n\nt\ntāng ()— суп;\nt\ntng ()— сахар;\nt\nnng ()— мочь, быть в состоянии;\nt\nlěng ()— холодно, холодный;\nt\ndēng ()— лампа, свет;\nt\nděng ()— ждать.\nCD 7.2.2\n6. Прочитайте следующие сложные слова и словосочетания, повторяя за диктором:\nt běi fāng (\n)— север, северная сторона;\nt běi fēng (\n)— северный ветер;\nt nn fāng ()— юг, южная сторона;\nt nn fēng ()— южный ветер;\nt\nlěng fēng ()— холодный ветер;\nt\nlěng tāng ()— холодный суп;\nt\nd lng ()— большая волна(ы);\nt\nHung h ()— река Хуанхэ,\nбукв. Желтая река;\nt hěn lěng ()— (очень) холодно(ый);\nt\nhěn mng ()— (очень) занят;\nt hěn png ()— (очень) полный;\nt kāi dēng ()— включать свет;\nt\nguān dēng (\n)— выключать свет;\nt hē tāng ()— есть суп,\nбукв. пить суп;\nt\ni hē tāng ()— любить есть\n(пить) суп;\nt p lěng ()— бояться холода;\nt\nb p lěng ()— не бояться холода.\nCD 7.2.3\n7. Прочитайте следующие предложения, повторяя за диктором:\nNӿ mng ma? — B mng. (— )— Ты занят? — Не занят.\nNӿ bba mng-bu-mng? — Tā hěn mng. (— )— Твой отец занят\n(или нет)? — Он (очень) занят.\nNӿ gēge gāo-bu-gāo? — Tā hěn gāo. (— )— Твой старший брат высокий (или нет)? — Он (очень) высокий.\nTā mimei hӽokn-bu-hӽokn? — Hěn hӽokn. (Ҫ\n— ) — Ее\nмладшая сестра красивая (или нет)? — (Очень) красивая.\nPbāo gu-bu-gu? — B ti gu. (\n— )— Сумка дорогая (или нет)? — Не\nслишком дорогая.\nTāng hӽohē-bu-hӽohē? — Hěn hӽohē. (— )— Суп вкусный (или\nнет)? — (Очень) вкусный.\nNӿ i-bu-i hē tāng? — Hěn i. (— )— Любишь (или нет) есть суп? —\n(Очень) люблю.\nNӿ p-bu-p lěng? — B p. (— )— Ты боишься (или нет) холода? — Не\nбоюсь.\nNӿ nng-bu-nng li? — B-nng. (— )— Можешь (или нет) прийти? — Не\nмогу."],["Комментарий","1. Вопрос Nӿ mng ma?\nӿ\nВопрос Nӿ mng ma?\nӿ\n— Ты занят? можно отнести к приветственным словам, поскольку китайцы\nочень часто задают его при встрече сразу после приветствия, и на него принято отвечать hěn\nmng— (\ng\nочень) занят, b hěn mng —\ng\nне очень занят или b mng —\ng\nне занят, подразумевая\nзанятость не в данный момент, а в целом за последнее время. Этот вопрос не обязательно пред-\n\nполагает, что у вас есть какое-то дело к собеседнику, что вы хотите его о чем-то попросить или\nкуда-то пригласить, это скорее просто вежливая фраза типа Как твои дела? Этот вопрос также\nчасто задают о родственниках или супругах.\n2. Общий вопрос посредством удвоения сказуемого.\nВ одном из предыдущих уроков мы узнали, как задать общий вопрос с помощью вопросительной частицы ma, однако общий вопрос может также задаваться другими способами, например\nпосредством удвоения сказуемого и частицы b, например: Nӿ mng-b-mng?\nӿ\n— Ты занят? (до\nсловно: Ты занят (или) не занят?). Такой вопрос наиболее характерен для предложений с качественным сказуемым."],["ЗАДАНИЯ","CD 7.3.1\n1. Слушая звукозапись, определите правильный тон и обведите нужную финаль:\nt pāng png pӽng png;\nt\ntēng tng těng tng;\nt\nhuāng hung huӽng hung;\nt gēng gng gěng gng;\nt\ndāng dng dӽng dng;\nt\nkuāng kung kuӽng kung;\nt fāf ng ff ng fӽf ng ff ng;\nt\nbēng bng běng bng;\nt\nguāng gung guӽng gung.\nCD 7.3.2\n2. Слушая звукозапись, поставьте правильный тон:\ngeng bang huang fang meng kuang geng dang kuang lang neng pang feng mang\nCD 7.3.3\n3. Слушая звукозапись, определите, какой звук n в слоге— переднеязычный или заднеязычный,\nпоставьте в конце слога, там где надо, букву g для обозначения заднеязычного звука\ng\nn:\nlӽn..., dӽn..., bn..., bӽn..., lēn..., gēn..., pěn..., kn..., mēn..., hn..., hān..., bān..., fn..., nn...\nCD 7.3.4\n4. Слушая звукозапись, определите и впишите нужную гласную букву (a/e):\nb…ng, b…ng, p…ng, p…ng, m…ng, m…ng, f…ng, f…ng, d…ng, d…ng, t…ng, t…ng, n…ng, n…ng,\nl…ng, l…ng, g…ng, g…ng, k…ng, k…ng, h…ng, h…ng\nCD 7.3.5\n5. Слушая звукозапись, напишите диктант:\n__________________________________________________________________________________\n6. Переведите, переделайте вопросительные предложения с вопросительной частицей ma в вопросительные предложения с повтором сказуемого, запишите с помощью пиньинь, ответьте устно\nутвердительно и отрицательно:\nNӿ mng ma? _______________________________________________________________________\nNӿ ddi gāo ma? _____________________________________________________________________\nNӿ mimei hӽokn ma? _______________________________________________________________\nPbāo gu ma? _______________________________________________________________________\nNӿ p gu ma? ______________________________________________________________________\n\nTāng hӽohē ma? _____________________________________________________________________\nNӿ i hē tāng ma? ____________________________________________________________________\nNӿ i kn bo ma? ____________________________________________________________________\nTā png ma?________________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: ЖИВОТНЫЕ\nВ данном уроке мы рассмотрим графемы, изображающие различных животных (табл.7.2).\nТаблица 7.2. Графемы, связанные с изображением животных\nГрафемы\nТранскрипция\nЗначение\n\nchng [тшун]\nнасекомое,\nчервяк\n\nbi\nракушка,\nмоллюск\ny [юй]\nрыба\n\ntā\nместоимение\n«оно»\n\nкороткохвостая\nптица\nniӽo [няо]\n(длиннохвостая)\nптица\n\nfēi\nлетать\nголова свиньи;\nрука\n\nmӽ\nлошадь\nni [ниу]\nкорова\nГрафемы\nТранскрипция\nЗначение\nyng [ян]\nбаран\n\nquӽn [цсюэнь]\nсобака (устар.)\n\nzh [чжи]\nединорог\n\nshӿ [ши]\nсвинья (устар.)\n\nxing [сян]\nслон\nh\nтигр\n\nlng [лун]\nдракон\n\nsh [шу]\nмышь\n\nnng\nмочь, быть\nв состоянии\nВ качестве ключей из них обычно выделяют графемы:\n, ,,, ,(), , ,,, ,,, , .\n1. Насекомое, червяк (chng [тшун]).\nРисунок, к которому восходит эта графема, изображал червяка или гусеницу.\nВ качестве иероглифа эта графема употребляется в современном китайском языке в значениях: насекомое, червяк и даже иногда\nк\nрептилия.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n2. Ракушка, моллюск (bi).\nГрафема восходит к изображению ракушки каори. В древности китайцы использовали такие ракушки вместо денег, поэтому в качестве компонента эта графема обозначает\nденьги.\nВ качестве самостоятельного иероглифа графема употребляется в своем исходном значении. В качестве компонента графема располагается в нижней или левой части иероглифа.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Рыба (y [юй]).\nРисунок, к которому восходит эта графема, первоначально изображал рыбу с чешуей,\nплавниками и хвостом. Более поздний вариант обозначал, по всей видимости, рыбу, подвешенную над огнем на крючке. В упрощенном варианте графемы вместо элемента\n(огонь) стала писаться горизонтальная черта.\nВ качестве самостоятельного иероглифа эта графема употребляется в своем исходном\nзначении.\nПолная форма написания:\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Местоимение «оно» (tā).\nЭта графема изначально восходит к изображению змеи, которая впоследствии стала обозначаться иероглифом , а графемой стали обозначать местоимение третьего лица\nоно, которое в китайском языке служит для ссылок на предметы, явления и животных.\nВ качестве компонента эта графема всегда пишется в правой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Короткохвостая птица (zhuī [чжуэй]).\nДревняя пиктограмма, к которой восходит эта графема, изображала птицу с распущенными крыльями и коротким хвостом.\nВ качестве самостоятельного иероглифа эта графема не употребляется, а в качестве компонента она пишется в верхней или правой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n6. Птица (длиннохвостая) (niӽo [няо]).\nЭта графема восходит к изображению птицы с длинным хвостом.\nВ качестве самостоятельного иероглифа она употребляется в значении птица, а в качестве\nкомпонента может иметь вариант написания без горизонтальной черты в иероглифе\n(остров).\nИероглиф Р (ворона) имеющий сходное написание, но без точки, также относят к этому\nключу.\nПолная форма написания:\n. Вариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Летать (fēi).\nГрафема восходит к изображению журавля, который изогнул шею и распростер крылья, собираясь взлететь.\nВ полной форме иероглиф имел сложное написание , которое впоследствии упростилось до .\nЭта графема выступает в качестве компонента только в полных формах некоторых иероглифов, поэтому в современных словарях в качестве ключа она не выделяется. Тем не менее\nв современном китайском языке данный иероглиф употребляется очень часто и его следует запомнить.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Голова свиньи, рука.\nЭта графема, восходящая к изображению головы или пятачка свиньи, имеет три варианта написания. Однако в своих первых двух вариантах в некоторых случаях она может\nизображать руку.\nНи в одном из этих вариантов графема не имеет самостоятельного употребления, а может\nлишь выступать в роли компонента сложных иероглифов.\nВарианты написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Лошадь (mӽ).\nЭта графема восходит к изображению лошади с гривой и длинным хвостом. В упрощенном варианте она стала писаться очень похоже на (птица).\nВ качестве самостоятельного иероглифа она употребляется в значении лошадь, конь.\nПолная форма написания:\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Корова (ni [ниу]).\nПервоначально рисунок, к которому восходит графема ni [ниу], изображал голову коровы.\nВ современном написании она выглядит совсем абстрактно. В качестве самостоятельного иероглифа она употребляется в значениях корова, бык, а в левой части иероглифа при использовании в качестве компонента она может иметь сокращенный вариант написания.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Баран (yng [ян]).\nРисунок, к которому восходит графема , изображал голову барана с большими рогами.\nВ качестве самостоятельного иероглифа она употребляется в значениях овца, баран. В качестве компонента при использовании в верхней части иероглифа графема может иметь\nдва несколько разных вариантов написания.\nВарианты написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Собака (quӽn [цсюэнь]).\nГрафема изначально восходит к изображению собаки. В качестве самостоятельного иероглифа графема практически вышла из употребления, поскольку в современном китайском языке собака обозначается иероглифом .\nГрафема является производной от графемы и не может употребляться\nсамостоятельно. В качестве компонента она обычно присутствует в иероглифах,\nобозначающих животных.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Единорог (zh [чжи]).\nСейчас сложно сказать, что изображает эта графема. По одной версии, она восходит\nк изображению змеи или какого-то безногого животного, по другойверсии — кошки,\nпо третьей— единорога.\nВ качестве самостоятельного иероглифа она употребляется очень редко, а в качестве\nкомпонента всегда пишется в левой части иероглифа.\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Свинья (shӿ [ши]).\nЭта графема, восходящая к изображению свиньи, со временем очень сильно видоизменилась. Сейчас она практически вышла из употребления в качестве самостоятельного\nиероглифа, в современном китайском языке свинья обозначается иероглифом .\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Слон (xing [сян]).\nЭта графема, восходящая к изображению слона, со временем очень сильно видоизменилась.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Тигр (h).\nЭта графема восходит к изображению тигра, однако в современном написании она напоминает полосы на тигриной шкуре.\nВ качестве самостоятельного иероглифа эта графема употребляется в значении тигр, а также\nзапугивать, обманывать. В качестве компонента графема практически всегда используется\nв сокращенном варианте написания, который и является ключом.\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Дракон (lng [лун]).\nЭта графема восходит к изображению мифологического существа— китайского дракона.\nВ современном китайском языке в качестве самостоятельного иероглифа употребляется\nв значениях дракон, динозавр.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n18. Мышь, крыса (sh [шу]).\nЭта графема, восходящая к изображению мыши, имеет достаточно сложное написание.\nВ современном китайском языке в качестве самостоятельного иероглифа она употребляется для обозначения различных грызунов, таких как мышь, крыса, белка и др.\nВ качестве компонента она употребляется очень редко, хотя и входит в список ключевых\nграфем.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Мочь (nng).\nЭта графема изначально восходит к изображению медведя с головой (), телом (\nи лапами (\n). Медведь всегда считался сильным и могучим зверем, поэтому этот иероглиф впоследствии стал употребляться в значениях мочь, быть в состоянии, а медведь\nобозначаться той же графемой, но с четырьмя точками снизу ().\nВ современном китайском языке в качестве компонента эта графема употребляется очень\nредко, а в качестве самостоятельного иероглифа— очень часто.\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЧТЕНИЕ ГРАФЕМ","t (mӽ) )— лошадь;\nt (h)— тигр;\nt (tā)— оно;\nt (bi)— ракушка;\nt (fēi)— летать;\nt (nng)— мочь;\nt (fāng)— сторона, квадрат;\nt (fēng)— ветер;\nt (guӽng)— обширный."],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Сравните графемы:\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям):\n; ; ; , ; .\n6. Потренируйтесь бегло читать следующие графемы:\n\n7. Потренируйтесь бегло читать сложные слова и словосочетания:\n, , , , .\n8. Переведите на китайский язык и запишите иероглифами:\nкартофель, фрукты, злаковое поле, заливное поле, день рождения, следующий год, бобы и злаки,\nогонь и вода, огонь и земля, в воде(у), в земле(ю).\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nНасекомое\n(chng [тшун])\nРакушка (bi)\nРыба (y [юй])\nВариант\nслева:\n\nОно (tā)\nКороткохвостая\nптица (zhuӿu [чжуэй])\nДлиннохвостая\nптица (niӽo [няо])\nЛетать (fēi)\nГолова свиньи\nВариант\nсверху\nВариант\nЛошадь (mӽ)\nКорова (ni [ниу])\nВариант слева\nБаран (yng [ян])\nВариант\nсверху1\nВариант сверху2\n\nСобака (устар.)\n(quӽn [цсюэнь])\nПроизводная\nграфема\nЕдинорог\n(zh [чжи])\nСвинья (устар.)\n(shӿ [ши])\nСлон (xing [сян])\nТигр (h)\nВариант\nсверху\nДракон\n(lng [лун])\nМышь, крыса\n(sh [шу])\nМочь (nng)"]],"8":[["ФОНЕТИКА","ФИНАЛИ IN, ING, UN, ONG. ОСОБЫЕ ИНИЦИАЛИ W, Y\nВ этом уроке мы рассмотрим финали in, ing, un, ong и слоги, которые они образуют с изученными\ng\nнами в предыдущих уроках инициалями (табл.8.1).\nТаблица 8.1. Слоги, образуемые инициалями b, p, m, f, d, t, n, l, g, k, h с финалями ing, ing, un, ung\nИнициали/\nфинали\nin [in]\ning [iŋ]\nun [un]\nong [uŋ]\nb [p]\nbin\nbing\np [p]\npin\nping\nm [p]\nmin\nming\nf [p]\nd [p]\nding\ndun\ndong\nt [t]\nting\ntun\ntong\nn [p]\nnin\nning\nnong\nl [p]\nlin\nling\nlun\nlong\ng [p]\ngun\ngong\nk [k]\nkun\nkong\nh [p]\nhun\nhong\nКроме того, мы рассмотрим особые инициали w и\nw\ny, а также слоги, которые они образуют с рассмотренными ранее финалями (табл.8.2 и 8.3).\nТаблица 8.2. Слоги, образуемые инициалью w с финалями a, o, u, ai, ei, an, en, ang, eng\nИнициали/\nфинали\na [a]\no [o]\nu [u]\nai [ai]\nei [ei]\nan [ŋ]\nen [ŋ]\nang [ŋ]\neng [ŋ]\nw [w]\nwa\nwo\nwu\nwai\nwei\nwan\nwen\nwang\nweng\nТаблица 8.3. Слоги, образуемые инициалью y с финалями a, e, i, ao, ou, an, in, ang, ing, ong\nИнициали/\nфинали\na [a]\ne [e]\ni [i]\nao [ao] ou [ou] an [an] in [in]\nang [ŋ]\ning [iŋ]\nong [uŋ]\ny [y]\nya\nye\nyi\nyao\nyou\nyan\nyin\nyang\nying\nyong\nКомментарии\nВ предыдущих уроках мы рассмотрели две пары финалей с носовыми согласными [n] и [ŋ] на конце:\nan/ang и\ng\nen/eng, теперь изучим еще две пары финалей, различающихся по тому же принципу: in/ ing\nи un/ong.\nФинали in [in] и ing [iŋ] произносятся как финаль i с добавлением в конце переднеязычного или\nзаднеязычного звука n [n].\n\nФиналь un [un] произносится с призвуком э [] после у.\nФиналь ong, хотя и пишется через букву о, произносится скорее как ун [uŋ] с небольшим оттенком\n[o], поэтому можно считать, что она составляет пару финали un. Призвук [o] у гласного звука u появляется из-за того, что при его сочетании с заднеязычным звуком [ŋ] спинка языка приподнимается и оттягивается назад к мягкому нёбу и занимает положение, близкое к тому, которое он занимает\nпри произнесении [o].\nОб инициалях w и y стоит поговорить отдельно, поскольку часто их вообще не выделяют в качестве\ny\nинициалей. В этом случае считается, что они заменяют u и i, когда те стоят в начале слога, или же\nставятся перед ними, когда слог состоит лишь из этих гласных, например: uen = wen, ian = yan, wu =\n= u, yi = i ит.д., чтобы четко разграничивать слогораздел. Однако в путунхуа есть слоги, которые начинаются гласными a и e, но которые при этом при письме не заменяются другими буквами. Также\nможно сказать, что звуки w и y немного отличаются от\ny\nu и i, поэтому мы будем их рассматривать\nкак самостоятельные инициали.\nКитайский звук w является аналогом английского\nw\nw и произносится как «огубленный» звук\nw\nв. Чтобы\nнаучиться правильно его произносить, произнесите сначала звук у [u], а затем попробуйте при таком\nже положении губ произнести в [v]. Звук должен быть кратким. Сочетание wu читается скорее просто\nкак [u].\nИнициаль y очень похожа на русский звук\ny\nй, только произносится мягче. Сочетание yi по правилу\nчитается просто как [i], однако в начале присутствует легкий призвук й, то есть оно читается ближе\nк йи. В китайской транскрипции ее принято обозначать как [j], однако, чтобы не спутать ее потом\nс инициалью j, мы оставим значок [y].\nГласный звук a в слоге yan в положении между i и n становится более закрытым и произносится как\nзвук [], который напоминает среднее между русскими а и э, таким образом, слог yan произносится\nкак [in], что больше всего похоже на сочетание йэнь."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 8.1.1\n1. Прочитайте, повторяя за диктором, слоги с инициалью w:\nw wō wū wā wāi wēi wān wāng wēn wēng\nCD 8.1.2\n2. Прочитайте, повторяя за диктором, слоги с инициалью y:\ny yā yē yī yāo yōu yān yāng yīn yīng yōng\nCD 8.1.3\n3. Прочитайте, повторяя за диктором, финали in, ing, un, ong в сочетании с изученными инициалями:\ng\nīn\nyīn\nbīn\npīn\nmīn\nnīn\nlīn\nbīn\nīng\nyīng\nbīng\npīng\nmīng\ndīng\ntīng\nnīng\nlīng\nūn\ndūn\ntūn\nlūn\ngūn\nkūn\nhūn\nōng\nyōng\ndōng\ntōng\nnōng\nlōng\ngōng\nkōng\nhōng\nCD 8.1.4\n4. Прочитайте, повторяя за диктором, слоги с контрастными финалями an/ en/ un и ang/eng/ong:\nān ēn ūn\ndn dn dn\ngӽn gěn gn\nhn hn hn\nāng ēng ōng\ndng dng dng\ngӽng gěng gng\nhng hng hng\n\nCD 8.1.5\n5. Прочитайте, повторяя за диктором, слоги с контрастными финалями in/ ing и\ng\nun/ong:\nīn īng bn bng pӿn pӿng mn mng\nūn ōng dn dng tn tng ln lng\nCD 8.1.6\n6. Прочитайте, повторяя за диктором, каждый из изученных слогов в тех тонах, в которых они употребляются:\nbīn - - bn\nbīng - - bng\npīn pn pӿn pn\npīng png - -\n- mn mӿn -\n- mng mӿng mng\ndīng - dӿng dng\ndūn - dn dn\ndōng - dng dng\nyā y yӽ y\nyē y yě y\nyī y yӿy y\nyāo yo yӽo yo\nyōu yu yu yu\nyān yn yӽn yn\nyāng yng yӽng yng\ntīng tng tӿng -\ntūn tn tn tn\ntōng tng tng tng\n- nn - -\n- nng nӿng nng\n- nng - nng\nlīn ln lӿn ln\nlūn ln - ln\nlīng lng lӿng lng\nlōng lng lng lng\nyīn yn yӿy n yn\nyīng yng yӿy ng yng\nyōng yng yng yng\nwā w wӽ w\nwō - w w\nwū w w\nw w\n- - gn gn\ngōng - gng gng\nkūn - k\nk n kn\nkōng - kng kng\nhūn hn - hn\nhōng hng hng hng\nwāi - wӽi wi\nwān wn wӽn wn\nwāng wng wӽng wng\nwēn wn wěn wn\nwēng - wěng wng\nCD 8.1.7\n7. Прослушайте следующую скороговорку, затем прочитайте ее, повторяя за диктором:\nFnghung\nФениксы\nHng fnghung,\n\nКрасные фениксы,\nHung fnghung,\n\nЖелтые фениксы,\nFěnhng fnghung,\n\nРозовые фениксы,\nHuā fnghung fēi.\n\nРазноцветные фениксы летят."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 8.2.1\n1. Прочитайте следующие односложные слова, повторяя за диктором:\nt nn ()— Вы (уважительное обращение);\nt\nmng ()— светлый, следующий;\nt\ntīng ()— слушать;\nt\nhng ()— красный;\nt\ngōng ()— работа, рабочий;\nt\ndōng ()— восток;\nt\nyě (г)— тоже;\nt yu (\n)— иметь;\nt\nyu ()— друг;\nt\nyng ()— использовать;\nt\nyo ()— нужно, требуется;\nt\nw ()— я;\n\nt\nwi ()— внешний;\nt\nwӽn (\n)— поздно, вечерний;\nt wn ()— письменный знак, язык;\nt wn (— спрашивать.\nCD 8.2.2.\n2. Прочитайте следующие сложные слова и словосочетания, повторяя за диктором:\nt\nhӽotīng ()— благозвучный;\nt\nb hӽotīng ()— неблагозвучный;\nt\nnntīng ()— неприятный на слух;\nt hӽoyng ()— удобный (в использовании);\nt b hӽoyng ()— неудобный;\nt\ndōng fāng ()— восток, восточная сторона;\nt dōng fēng ()— восточный ветер;\nt\ndōngnn ()— юго-восток;\nt\ndōngběi (\n)— северо-восток;\nt\nli wӽn (\n)— прийти поздно;\nt\nmiyu (\n)— не иметь;\nt wigu ()— иностранное\nгосударство;\nt wiwn ()— иностранный язык;\nt\npngyou (\n)— друг, приятель;\nt\nhӽoyu ()— близкий друг;\nt\nkěyӿy (\nҹ)— можно, дозволено,\nразрешено.\nCD 8.2.3\n3. Прочитайте следующие предложения, повторяя за диктором:\nW kn bo, tā yě kn bo. (Ҫг)— Я читаю газету, [и] он (тоже) читает газету.\nNӿ i hē tāng, w\nӿ\nyě i hē tāng. (г)— Ты любишь (есть) суп, [и] я (тоже)\nлюблю (есть) суп.\nWmen dōu hӽo, tāmen yě dōu hӽo. (ӀҪӀг)— У нас (всех) все хорошо,\nи у них (всех) (тоже) все хорошо.\nW yu pbāo, tā yě yu pbāo. (\n\nҪг\n\n)— У меня есть сумка, [и] у нее\n(тоже) есть сумка.\nW yu ddi, nӿ ne? — W yě yu ddi. (\n— г\n)— У меня есть\nмладший брат, а у тебя? — У меня (тоже) есть младший брат.\nNӿ yu mimei ma? — W mi\\u mimei. (\n)— У тебя есть\nмладшая сестра? — У меня нет младшей сестры.\nNӿ yu-mi-yu gēge? Miyu.\n\n)— У тебя есть (или нет) старший\nбрат? — Нет.\nNӿ yo hē tāng ma? — W yo hē tāng. (— )— Ты будешь есть суп? —\nЯ буду есть суп.\nTā lile ma? — Tā hi mi li ne. (Ҫњ— Ҫ)— Она пришла? — Она еще\nне пришла.\nNӿ le ma? — Hi mi yu. (њ—\n)— Ты проголодался? — Еще нет.\nGēge mӽile bo ma? — Mi yu. (фњ—\n)— Старший брат купил газету? —\nНет.\nCD 8.2.4\n4. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите следующий диалог:\nNӿ hӽo ma? — Как твои дела?\n\nNӿ hӽo ma?\nW hěn hӽo, nӿ ne?\nW yě hěn hӽo. Nӿ bba māma hӽo ma?\nTāmen dōu hěn hӽo. Nӿ mng ma?\nW b mng, nӿ ne?\nW yě b mng.\n\nг\nҪӀ\n\nг"],["Комментарий","1. Союзное наречие yě.\nЕсли в русском языке для обозначения солидарности чаще всего употребляется союз и, например:\nЯ читаю газеты, и он читает газеты, то в китайском языке солидарность всегда выражается с помощью союзного наречия yě: W kn bo, tā yě kn bo (Я читаю газеты, он тоже читает газеты).\n2. Предложения обладания/наличия.\nПредложения с глагольным сказуемым yu (иметь, обладать, иметься) означают обладание или\nналичие, их специфика заключается в том, что отрицание в них образуется с помощью отрицательной частицы mi.\n3. Отрицание в прошедшем времени.\nОтрицание в прошедшем также образуется с помощью отрицания mi или miyu, при этом\nв отрицательных предложениях суффикс -le не ставится. Если перед сказуемым в отрицательной\nформе стоит еще слово hi (еще), то в конце предложения ставится частица ne, которая придает\nнекую незавершенность действию.\n4. Модальные глаголы kěyӿy , nng и\ng\nyo.\nМодальные глаголы выражают возможность, желание, способность или необходимость совершить действие. Глагол nng имеет значение возможности что-либо сделать,\ng\nkěyӿy чаще всего употребляется при вопросе о разрешении на какое-либо действие, yo выражает желание или необходимость что-то сделать, но при этом делается акцент на решимости это сделать."],["ЗАДАНИЯ","CD 8.3.1\n1. Слушая звукозапись, определите слог в правильном тоне:\nt dīng dng dӿng dng;\nt\ntōng tng tng tng;\nt līng lng lӿng lng;\nt pīn pn pӿn pn;\nt\nhōng hng hng hng;\nt lūn ln ln ln;\nt\nkōng kng kng kng;\nt tūn tn tn tn;\nt lōng lng lng lng.\nCD 8.3.2\n2. Слушая звукозапись, поставьте правильный тон в следующих слогах:\nling kong pin hong tun nong gun ning lun bing min\nCD 8.3.3\n3. Слушая звукозапись, определите, какой звук n в слоге— переднеязычный или заднеязычный,\nпоставьте в конце слога, там где надо, букву g для обозначения заднеязычного звука\ng\nn:\n\npӿn…, dn…, bn..., ln..., gūn..., pīn..., kn..., mn..., hn..., hūn..., nn...\nCD 8.3.4\n4. Слушая звукозапись, определите и впишите нужный гласный (o/u):\nd…ng, d…n, t…ng, t…n, l…n, l…ng, g…ng, g…n, k…n, k…ng, h…ng, h…n\nCD 8.3.5\n5. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n6. Переведите c русского на китайский:\nЯ ем суп, и он ест суп.\n__________________________________________________________________________________\nУ меня есть красная ручка, и у него есть красная ручка.\n__________________________________________________________________________________\nУ меня есть младшая сестра, а у тебя?— У меня тоже есть младшая сестра.\n__________________________________________________________________________________\nУ него есть старший брат, а у тебя?— У меня нет старшего брата.\n__________________________________________________________________________________\nЯ буду есть суп, а ты?— Я тоже буду есть суп.\n__________________________________________________________________________________\nМладшая сестра купила (кожаную) сумку?— Не купила.\n__________________________________________________________________________________\nСтарший брат пришел?— Еще не пришел.\n__________________________________________________________________________________\nЦветы еще не расцвели.\n__________________________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: ЖИВОТНЫЕ И ПРОДУКТЫ ЖИВОТНОВОДСТВА\nВ данном уроке мы рассмотрим графемы, косвенно связанные c животными или изображающие\nпродукты животноводства (табл.8.4).\nТаблица 8.4. Графемы, связанные с изображением животных и продуктов животноводства\nГрафемы\nТранскрипция\nЗначение\nу\nb\nнет, не\n\nfēi\nнет, не\nxī [си]\nзапад\nГрафемы\nТранскрипция\nЗначение\n\nzhī [чжи], zhӿ\n[чжи]\nединица; только\n\ns [сы]\nзмея (6-й знак\nв цикле из 12)\n\nyӿy\nуже\n\nОкончание табл. 8.4\nВ качестве ключей из них обычно выделяют графемы:\n, , ,, , ,, , ,\n, , ,, , ,.\n1. Нет, не (b).\nЭта графема представляет собой изображение птицы, улетающей в небо. Птицы летают\nтак высоко, что скрываются из виду, как будто перестают существовать.\nГрафема употребляется самостоятельно, являясь наиболее распространенным отрицанием в китайском языке.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. Нет, не (fēi).\nЭта графема, по всей видимости, также восходит к изображению птицы с распростертыми крыльями или летящей птицы. Возможно, она имеет такое же объяснение, как и графема . Однако согласно наиболее распространенной версии, это изображение было\nзаимствовано для обозначения абстрактного понятия не, поскольку являлось омонимом\nслова летать, которое также читалось как fēi.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Запад (xī [си]).\nГрафема имеет интересное происхождение. Рисунок, к которому она восходит, изображал птицу в гнезде. Это связано с тем, что птицы возвращаются в свои гнезда на закате\nсолнца, а оно садится на западе.\nВ современном китайском языке в качестве самостоятельного иероглифа графема\nупотребляется в значениях: запад, «западный», а также Запад (западные страны).\nГрафемы\nТранскрипция\nЗначение\n\njӿ [цзи]\nсам\n\nbā\nудав; прилегать;\nсуффикс существительных\n\nпух\n\nmo\nшерсть\n\ny\ny [юй]\nкрылья; перья\nҖ\nx [си]\nупражняться,\nповторять\nzhӽo [чжао]\nкогти\nГрафемы\nТранскрипция\nЗначение\n\nзвериный след\nru [жоу]\nмясо\n\nyng\nиспользовать\n\njiӽo [цзяо]\nрог\n\ng\nкость\n\np\nсырая кожа\n\nwi\nмягкая кожа\n\ng\nвыделанная кожа\n\nВ качестве компонента она может иметь несколько отличное написание.\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Единица, только (zhī; zhӿ [чжи]).\nДревняя пиктограмма, к которой восходит графема , изображала птицу в руке, что\nозначало один, единичный, единица.\nВ сокращенном варианте графема стала совпадать с графемой (только).\nЭта графема употребляется самостоятельно в значениях только, всего лишь, а также\nв качестве основного счетного слова для животных (единица).\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Циклический знак (s [сы]), уже (yӿy ), сам (jӿ [цзи]).\nПо одной из версий, графемы,ивосходят к изображению змеи.\nИероглиф является знаком змеи при обозначении лет циклическими\nзнаками, иероглиф также может быть циклическим знаком, однако\nв современном китайском языке он употребляется в значении сам, иероглиф означает уже.\nВ современных словарях эти три графемы рассматриваются как варианты\nодного ключа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n6. Удав, прилегать, суффикс (bā).\nГрафема восходит к изображению удава с длинным хвостом.\nГрафема не выделяется в качестве ключа, но она очень часто употребляется в составе\nсложных иероглифов в качестве компонента.\nКак самостоятельный иероглиф она может иметь различные значения кроме исходного:\nпримыкать, прилегать; пристать, присохнуть; держаться, хвататься, а как суффикс\nвходит в состав слов хвост (), губы, рот () и др.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n7. Пух.\nЭта графема представляет собой изображение трех пушинок или перышек и практически не отличается от исходной пиктограммы.\nОна может употребляться только в качестве компонента сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Шерсть (mo).\nРисунок, к которому восходит эта графема, изображал пучок шерсти.\nВ современном китайском языке она часто употребляется в качестве самостоятельного\nиероглифа, которым обозначают волосяной покров или оперение, его основные значения: шерсть, волосы, пух, иногда перья.\nЭта графема часто используется в качестве компонента сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Крылья (y\ny [юй]), упражняться (x [си]).\nДревняя пиктограмма, к которой восходит графема , изображала два крыла\nптицы. В современном китайском языке она употребляется в значениях крылья,\nа также оперение.\nГрафема д, которая выглядит как половина графемы, в полной форме состояла\nиз графеми , обозначая молодую птицу, которая учится летать.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Когти (zhӽo [чжао]).\nДревний рисунок, к которому восходит графема , изображала, по всей видимости,\nруку, которая собирается что-то взять, или когти хищной птицы.\nВ современном китайском языке в качестве самостоятельного иероглифа графема\nупотребляется в значениях когти и лапа, а в качестве компонента при написании в верхней части иероглифа пишется сокращенно ().\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n11. Звериный след.\nДревняя пиктограмма, к которой восходит эта графема, изображала след какого-то зверя. Самостоятельно графема вообще не употребляется, а в качестве компонента употребляется достаточно редко.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Мясо (ru [жоу]).\nЭта графема восходит к изображению куска грудинки с ребрами.\nВ современном китайском языке в качестве самостоятельного иероглифа она употребляется в значениях мясо, плоть, мякоть, сердцевина.\nВ качестве компонента может иметь два разных написания, одно из которых совпадает с графемой луна. Графемы луна и мясо в таком варианте считают одним ключом.\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Использовать (yng).\nПроисхождение этой графемы не совсем ясно. По одной из версий, она восходит к изображению загона для выпаса скота.\nЭто очень часто употребляемый в современном китайском языке иероглиф, основные\nзначения которого: использовать, применять, употреблять; применение, назначение.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Рог (jiӽo [цзяо]).\nГрафемавосходит к изображению рога быка или буйвола. В современном написании\nона стала похожа на графему (использовать). В качестве самостоятельного иероглифа графема употребляется в своем исходном значении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Кость (g).\nРисунок, к которому восходит графема , изображал кость с частью сустава и мясом.\nВ современном китайском языке графема употребляется самостоятельно в своем исходном значении, а в качестве компонента встречается достаточно редко.\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Кожа (сырая) (p).\nЭта графема восходит к изображению руки, которая сдирает кожу или шкуру с туши.\nВ современном китайском языке это наиболее распространенный иероглиф, которым\nобозначают любую кожу. Также он употребляется в значениях шкура, кора, поверхность.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Мягкая кожа (wi).\nДревняя пиктограмма, к которой восходит эта графема, изображала кусок кожи, который\nмяли ногами.\nВ полной форме графема писалась как , но затем была упрощена до .\nВ качестве самостоятельного иероглифа также употребляется в значении кожа, но гораздо\nреже, чем иероглиф .\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. Выделанная кожа (g).\nГрафема восходит к изображению выделанной и растянутой кожи или шкуры животного. Графема употребляется самостоятельно. Основные ее значения в современном\nкитайском языке: изменять, переменять, например в слове\n(революция\n). В исходном\nзначении она употребляется редко.\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЧТЕНИЕ ГРАФЕМ","y (bā)— удав, прилегать, суффикс;\ny (bӿ)— ручка, пишущий предмет;\ny (b)— нет, не;\ny (p)— кожа;\ny (g)— изменять;\ny (g)— кость;\ny (fēi)— нет, не;\ny (wi)— кожа;\ny (mo)— шерсть;\ny (yī)— «1»;\ny (y)— город, поселение;\ny (yӿy )— уже;\n\ny (yng)— баран;\ny (yng)— использовать;\ny (lng)— дракон;\ny (dōng)— кожа;\ny\n(png)— друг, равный."],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\nуҖ\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Назовите и сравните графемы:\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям):\nђ;,,, , ,,,,\n,, ;у,у, у, у\n6. Потренируйтесь бегло читать следующие графемы:\nужђ\n7. Потренируйтесь бегло читать следующие сложные слова и словосочетания:\n,, ,у,у,у, , у\n8. Переведите на китайский и запишите иероглифами словосочетания:\nдеревянная лошадь, тигриная пасть, свежая рыба, летящая птица, коровы и бараны, может прийти.\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nНет, не (b)\nНет, не (fēi)\nЗапад (xī [си])\nВариант\nсверху\nЕдиница (zhī [чжи]);\nтолько (zhӿ)\n6-й циклический\nзнак «змея» (s [сы])\nУже (yӿy )\nСам (jӿ [цзи])\nУдав; прилегать;\nсуффикс (bā)\nПух\nШерсть (mo)\nПовторять (x [си])\n\nКрылья; перья\n(y\ny [юй])\nКогти\n(zhӽo [чжао])\nВариант сверху\nСлед зверя\nМясо, плоть\n(ru [жоу])\nПроизводная\nграфема\nВариант\nИспользовать\n(yng)\nРог (jiӽo [цзяо])\nКость (g)\nСырая кожа (p)\nМягкая кожа (wi)"]],"9":[["Начало урока","Выделанная кожа\n(g)"],["ФОНЕТИКА","ИНИЦИАЛИ Z, C, S. ОСОБАЯ ФИНАЛЬ I. СЛОГ ER\nВ этом уроке мы рассмотрим инициали z, c, s и слоги, которые они образуют с изученными нами\nв предыдущих уроках финалями, а также особую финаль, обозначаемую буквой i (табл.9.1).\nТаблица 9.1. Слоги, образуемые инициалями z, c, s с финалями\nИнициали/\nфинали\na\n[a]\ne\n[e]\nu\n[u]\ni\nai\n[ai]\nei\n[ei]\nui\n[uei]\nao\n[au]\nou\n[ou]\nuo\n[uo]\nan\n[an]\nen\n[n]\nun\n[uen]\nang\n[ŋ]\neng\n[ŋ]\nong\n[uŋ]\nz [tz]\nza\nze\nzu\nzi\nzai\nzei\nzui\nzao\nzou\nzuo\nzan\nzen\nzun\nzang\nzeng\nzong\nc [ts’]\nca\nce\ncu\nci\ncai\ncei\ncui\ncao\ncou\ncuo\ncan\ncen\ncun\ncang\nceng\ncong\ns [s]\nsa\nse\nsu\nsi\nsai\nsui\nsao\nsou\nsuo\nsan\nsen\nsun\nsang\nseng\nsong\nКомментарии\nСогласные z, c, s являются щелевыми переднеязычными, при их произнесении язык создает щель\nс альвеолами.\nЗвук z относится к полузвонким согласным, он близок к русскому ц, но произносится немного более\nзвонко, как сочетание цз. В китайской транскрипции он обозначается как [ts], но поскольку в реальности он произносится звонче, мы будем обозначать его [tz].\nЗвук с [ts’] произносится как русский ц, но с сильным придыханием, в результате он становится\nбольше похожим на сочетание цх.\nЗвук s [s] похож на русский с, но произносится немного напряженнее.\nЗвук, передаваемый буквой i после инициалей z, c, s, в китайской лингвистике обозначается как особая финаль []. По звучанию она напоминает\nрусский звук ы, но ее особенностью является то, что она имеет согласный\nпризвук. При произнесении этого звука сохраняется то же положение языка, что и при произнесении предшествующего согласного, лишь немного\nувеличивается щель и начинают вибрировать голосовые связки (рис.9.1\nЭтот звук невозможно произнести самостоятельно, только в сочетании\nс инициалью. Чтобы научиться произносить этот звук, попробуйте произнести по очереди согласные z, c, s, как бы растягивая их. В результате у вас\nдолжен получится глубокий звук, немного похожий на ы, но с согласным\nпризвуком.\nРис. 9.1. Техника\nпроизнесения звуков\nz, c, s\n\nСлог er занимает особое место в китайской фонетике, поскольку единственный из всех слогов заканчивается на r. Звук, обозначаемый буквой r,\nполностью соответствует английскому r или русскому р, но с загнутым\nвверх кончиком языка (рис.9.2"],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 9.1.1\n1. Прочитайте, повторяя за диктором, инициали z, c, s в сочетании с особой финалью:\nz zī\nc cī\ns sī\nzī zī\ncī cī\nsī sī\nzī cī sī\nCD 9.1.2\n2. Прочитайте, повторяя за диктором, инициали z, c, s в сочетании с другими простыми финалями:\nā zā ū zū ē zē ā cā ū cū ē cē ā sā ū sū ē sē\nā z cӽ s ū z c s ē z cě s\nCD 9.1.3\n3. Прочитайте, повторяя за диктором, инициали z, c, s в сочетании со сложными финалями:\nāi zāi\nāo zāo\nān zān\nāng zāng\ng\nēi zēi\nōu zōu\nuō zuō\nūn zūn\nōng zōng\ng\nāi cāi\nāo cāo\nān cān\nāng cāng\ng\nēi cēi\nōu cōu\nuō cuō\nūn cūn\nōng cōng\nāi sāi\nāo sāo\nān sān\nāng sāng\nēi sēi\nōu sōu\nuō suō\nūn sūn\nōng sōng\nāi zi cӽi si āo zo cӽo so ān zn cӽn sn āng zng\ng\ncӽng sng\nōu zu cu su uō zu cu su ūn zn cn sn ōng zng\ng\ncng sng\nCD 9.1.4\n4. Прочитайте, повторяя за диктором, слоги с инициалями, различающимися наличием и отсутствием придыхания:\nbā pā d t gӽ kӽ\nz c bū pū d t g\ng k\nk\nz c\nCD 9.1.5\n5. Прочитайте, повторяя за диктором, каждый из слогов в тех тонах, в которых он употребляется:\nzā z zӽ -\n- z - z\nzū z z -\nzī - zӿ z\nzāi - zӽi zi\nzāo zo zӽo zo\nzān zn zӽn zn\nzāng - zӽng zng\n- zi - -\nzuī - zuӿ zu\n- - zěn zn\ncā - cӽ -\n- - - c\ncū c - c\ncī c cӿ c\ncāi ci cӽi ci\ncāo co cӽo co\ncān cn cӽn cn\ncāng cng - -\n- - cěi ci\ncuī - cuӿ cu\ncēn cn - cn\nsā - sӽ s\n- - - s\nsū s - s\nsī - sӿ s\nsāi - - si\nsāo - sӽo so\nsān - sӽn sn\nsāng - sӽng sng\nsuī su suӿ su\nsēn - - -\nsēng - - -\nРис. 9.2. Техника\nпроизнесения звука r\n\nzēng - - zng\nzōu - zu zu\nzuō zu zu zu\nzūn - zn -\nzōng - zng zng\ncēng cng - cng\n- - - cu\ncuō cu cu cu\ncūn cn cn cn\ncōng cng - -\nsōu - su su\nsuō - su -\nsūn - sn -\nsōng - sng sng\n- r ěr r\nCD 9.1.6\n6. Прослушайте следующую скороговорку, затем прочитайте ее, повторяя за диктором:\nZu zӽocāo\nДелай утреннюю зарядку\nZӽochen zӽozӽo qӿq ,\n\nУтром рано-рано встань,\nZӽo qӿq zu zӽocāo.\n\nРано встань и делай утреннюю зарядку.\nRn rn zu zӽocāo,\nҎҎ\nВсе делают утреннюю зарядку,\nZu cāo shēntӿ hӽo.\n\nЕсли делать зарядку, то здоровье будет хорошим."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 9.2.1\n1. Прочитайте следующие, односложные слова, повторяя за диктором:\nt\nz ()— иероглиф;\nt\nc ()— слово;\nt\ns ()— цвет;\nt\ncng ()— этаж, слой;\nt\ncān ()— еда;\nt\nci ()— овощи, еда, блюдо;\nt\nzӽo ()— утренний, ранний;\nt wӽn (\n)— вечерний, поздний;\nt zu ()— лево;\nt zu ()— прошлый, вчерашний;\nt\nzu ()— делать (что-либо);\nt\nzu ()— сидеть, садиться;\nt\nzu ()— идти;\nt\nzi ()— находиться, присутствовать, в;\nt\ncu ()— ошибка, неправильно;\nt\nzu (\n)— самый;\nt\nnӽ ()— какой, который;\nt\nn ()— то, тот.\nCD 9.2.2\n7. Прочитайте следующие сложные слова и словосочетания, повторяя за диктором:\nt (zi) nӽli? (()) — где?\nt (zi) nli (())— там.\nt\nzěnme… (М…)— как?\nt zěnme zu? (М)— как пройти?\nt\nzěnmeyng? (М)— как? какой?\nкаков?\nt\nzuyu ()— левый и правый;\nприблизительно.\nt hēis ()— черный цвет.\nt\nbis ()— белый цвет.\nt\nlns ()— синий цвет.\nt\nhngs ()— красный цвет.\nt\nhungs ()— желтый цвет.\nt\nbici ()— капуста.\nt\nhnz ()— китайские иероглифы.\nt\nzm ()— буквы.\nt\nzӽofn/zӽocān ()— завтрак.\nt\nzufn/zuci ()— готовить еду.\nt gōngzu ()— работа, работать.\nt\nzuhӽo (\n)— лучший.\nt\nbcu ()— неплохо; хорошо.\nCD 9.2.3\n8. Прочитайте следующие предложения, повторяя за диктором:\n\nMimei zu de zӽofn (\n)— Завтрак, который приготовила младшая сестра (приготовленный младшей сестрой завтрак).\nMāma zu de ci ()— Еда, которую приготовила мама (приготовленная мамой еда).\nTā kn de bo (Ҫ)— Газета, которую он читает (читаемая им газета).\nTā zu de gōngzu (Ҫ)— Работа, которую он выполняет (выполняемая им работа).\nTā zi ma? — Tā zi. (Ҫ— Ҫ)— Он (находится) на месте (у себя)? — Он (находится)\nна месте (у себя).\nTā zi nӽli? — Tā zi nli. (Ҫ— Ҫ)— Где он (находится)? — Он (находится)\nтам.\nNӿ zěnme yng? — Hěn b cu. (М— )— Как ты? (Как твои дела?) — (Очень,\nвесьма) неплохо.\nTāng zěnme yng? — Hěn hӽo hē. (М— )— Как суп? — (Очень) вкусный.\nBӿ zěnme yng? — Hěn hӽo yng. (М— )— Как ручка? — (Очень) удобная.\nPbāo zěnme yng? — Hěn hӽokn. (\nМ— )— Как сумка? — (Очень) красивая.\nCD 9.2.4\n9. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите следующий диалог:\nNӿ yo hē tāng ma?\nӿ\n() — Ты будешь есть суп?\nMimei, nӿ yo hē tāng ma? (\nW yo hē tāng, nӿ ne? (г)\nW yě yo hē tāng. (г)\nTāng zěnme yng? (М)\nHěn hӽohē. W hěn i hē māma zu de tāng. ()"],["Комментарий","1. Словосочетания в качестве определения.\nКак мы узнали в предыдущих уроках, с помощью служебной частицы de оформляется определение, тоесть выражается отношение или принадлежность одного предмета к другому, кроме\nтого, мы узнали, что в роли определения могут выступать различные части речи, в том числе существительные. Однако в роли определения также могут выступать словосочетания, например:\nMāma zu de zӽofn, что дословно переводится как мамой приготовленный завтрак, однако на\nрусский язык такие обороты лучше переводить с помощью слова который(е): завтрак, который\nприготовила мама. Подобные обороты всегда оформляются с помощью служебной частицы de.\nВ качестве определения также могут выступать целые предложения.\n2. Предложения наличия/местонахождения с zi.\nСлово zi может выступать в роли предлога в, однако в некоторых случаях оно может быть глаголом,\nобозначающим присутствие, наличие человека на месте: Tā zi ma? — Tā zi. Вопрос Tā zi ma? на\nрусский язык невозможно перевести дословно, обычно он переводится так: Он дома? или\nОн у себя?\n3. Специальные вопросы nӽli и zěnmeyng.\nС этого урока мы начинаем изучать специальные вопросы. Для китайского языка характерно,\nчто в вопросительных предложениях не меняется порядок слов.\n\nЧтобы узнать о местонахождении чего-либо, задается вопрос … zi nӽli?, и ответ на такой\nвопрос звучит: … zi (где-то).\nВопрос как может звучать в китайском так:\nк\nzěnme или zěnmeyng. Разница между ними заключается в том, что zěnme требует дополнительного слова, например: zěnme zu?— как пройти?.\nZěnmeyng (здесь yng —\ng\nвид, тип) переводится скорее как какой? каков? и не требует дополни\nтельных слов."],["ЗАДАНИЯ","CD 9.3.1\n1. Слушая звукозапись, определите слог в правильном тоне:\nt\nzāo zo zӽo zo;\nt cān cn cӽn cn;\nt zuō zu zu zu;\nt\ncuō cu cu cu;\nt sāng sng sӽng sng;\nt zī z zӿ z;\nt\ncī c cӿ c;\nt sāo so sӽo so;\nt zān zn zӽn zn.\nCD 9.3.2\n4. Слушая звукозапись, поставьте правильный тон в следующих слогах:\nzao cun song zi san sao zang cuo si zuo ceng zai zen cai suo\nCD 9.3.3\n5. Слушая звукозапись, определите правильную инициаль:\nb\np\nā\nd\nt\n\ng\nk\nӽ\nz\nc\n\nb\np\nū\nd\nt\n\ng\nk\n\nz\nc\n\nCD 9.3.4\n6. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n7. Переведите c русского на китайский:\nСамый высокий ______________________\nСамый красивый ______________________\nСамый дорогой _______________________\nСумка, которую купила младшая сестра, очень красивая.\n__________________________________________________________________________________\nСуп, который приготовила моя мама, очень вкусный.\n__________________________________________________________________________________\nЯ люблю есть суп, который готовит мама.\n__________________________________________________________________________________\nОн (находится) на месте (у себя)?— Его нет.\n__________________________________________________________________________________\nГде моя ручка?— Твоя ручка там.\n__________________________________________________________________________________\n_"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: ЧЕЛОВЕК\nВ данном уроке мы рассмотрим графемы, связанные c изображением человека (табл.9.2).\nТаблица 9.2. Графемы, связанные с изображением человека\nГрафемы\nТранскрипция\nЗначение\nӰ(\n)ӱ\nrn [жэнь]\nчеловек\n\nqin [цсиэнь]\nоткрытый рот,\nнедоставать\nd\nбольшой\n\nti\nслишком\n\ntiān [тиэнь]\nнебо, день\n\nr\nидущий\nчеловек, сын\n\njin [цзиэнь]\nвидеть\n\nхромой\n\nболезнь\n\nshī [ши]\nтруп, тело\nпечать, власть\nГрафемы\nТранскрипция\nЗначение\n\nl\nстоять\n\nwn\nписьменный\nзнак\nn [нюй]\nженщина\n\nm\nмать\n\nbāo\nсверток, сумка\nzӿ\nребенок\nҼ\n-le\nглагольный\nсуффикс\n\nchng [тшан]\nдлинный\n\nsh [ши]\n(нести); род\nshēn [шэнь]\nтело\n1. Человек (rn [жэнь]).\nГрафема Ҏ восходит к изображению человека в профиль. В современном китайском языке эта графема употребляется самостоятельно в своем исходном значении.\nВариант написания графемы сверху совпадает с вариантом написания графемы\n(вход), поэтому они часто считаются одним ключом. Графема ҏ(стоящий\nчеловек) является производной от Ҏ.\nВарианты написания слева и сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. Открытый рот, недоставать (qin [цсиэнь]).\nРисунок, к которому восходит графема , изображал человека с широко открытым\nртом, поэтому иногда ее называют зевать, открывать рот.\nВ современном китайском языке графема употребляется в качестве самостоятельного иероглифа с основными значениями не хватать, недоставать, задолжать.\nВ качестве компонента сложных иероглифов графема всегда пишется справа.\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Большой (d), слишком (ti).\nГрафема произошла от изображения человека с широко раскинутыми в стороны руками. Этот иероглиф в современном китайском языке употребляется\nочень часто. Другие его значения: огромный, громадный; значительно, широко;\nстарший; размер.\nГрафема , по всей видимости, означает большой плюс еще капля. Она также\nупотребляется самостоятельно.\nВариант написания (большой):\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Небо, день (tiān [тиэнь]).\nПо всей видимости, китайцы в древности обозначали небо в виде горизонтальной линии\nнад головой человека. Нынешний иероглиф мало отличается от своего прототипа.\nВ современном китайском языке эта графема употребляется в качестве самостоятельного иероглифа в значениях небо, день.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Идущий человек, сын (r).\nГрафема восходит к изображению идущего человека. Кроме того, она совпадает с сокращенной формой иероглифа (ребенок\n, сын).\nВ современном китайском языке этот иероглиф может также выступать в роли суффикса.\nВ качестве компонента графема пишется, как правило, в нижней части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n6. Видеть (jin [цзиэнь]).\nДревняя пиктограмма, к которой восходит эта графема, изображала глаз и человека под\nним. В полной форме графема писалась как , но затем была упрощена до .\nВ качестве самостоятельного иероглифа она употребляется в своем исходном значении.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n7. Хромой.\nЭта графема восходит к рисунку, изображавшему человека, который подвернул ногу.\nОна может употребляться только в качестве компонента сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Власть, печать.\nДревняя пиктограмма, к которой восходит эта графема, изображала человека, сидящего\nперед кем-то на коленях, что символизировало власть. Также графемаизвестна под\nназванием печать.\nХотя эта графема имеет три варианта написания, ни в одном из них она не употребляется\nсамостоятельно.\nВарианты написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Болезнь.\nДревняя пиктограмма, к которой восходит эта графема, изображала человека, лежащего\nна кровати и страдающего от тяжелой болезни, вследствие чего на его теле выступили\nкапельки пота.\nСамостоятельно графема не употребляется, а в качестве компонента употребляется\nв иероглифах, обозначающих какую-либо болезнь, и всегда замыкает иероглиф сверху\nи слева.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Труп, тело (shī [ши]).\nПо одной из версий, эта графема восходит к изображению человека, представляющего\nдух умершего во время обряда жертвоприношения. Эта графема совпадает с сокращенной формой иероглифа (мертвый, труп).\nВ качестве компонента эта графема всегда замыкает иероглиф сверху и слева.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Стоять (l).\nГрафема восходит к изображению человека, стоящего на земле.\nЭтот иероглиф в современном китайском языке употребляется очень часто, его основные значения: стоять, поставить, установить, учредить.\n\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Письменный знак (wn).\nПо всей видимости, изначально эта графема восходила к изображению человека с татуировкой на груди.\nВ современном китайском языке она употребляется в качестве самостоятельного иероглифа, который обозначает такие понятия, как язык, литература, а в сочетаниях— культура.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Женщина (n [нюй]).\nДревняя пиктограмма, к которой восходит графема , изображала сидящую на коленях женщину, однако на более поздних изображениях женщина уже не сидит, а стоит.\nВ современном китайском языке графема употребляется самостоятельно в своем исходном значении.\nВ качестве компонента при написании слева может иметь немного сокращенное написание\nс укороченной горизонтальной чертой.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Мать (m).\nГрафема восходит к изображению женщины, которая собирается кормить ребенка.\nВ современном китайском языке графема употребляется в качестве самостоятельного иероглифа со значениями мать, самка, матка.\nИз
