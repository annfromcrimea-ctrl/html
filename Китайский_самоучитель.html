менение знака\nПримеры употребления\nПорядок написания черт\n15. Сверток, сумка (bāo).\nЭта графема восходит к изображению зародыша в утробе.\nВ современном китайском языке употребляется самостоятельно в значениях сверток,\nпакет, сумка, портфель, кошелек.\nВ качестве компонента она всегда пишется справа и выступает в роли фонетика.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n16. Ребенок (zӿ), суффикс.\nДревний рисунок, от которого произошла графема , изображал младенца с поднятыми руками.\nВ современном китайском языке эта графема употребляется самостоятельно\nи может означать: сын, потомок, ребенок; яйцо, икра, семечко и др., а также может\nбыть суффиксом существительных.\nГрафема њ, как полагают, также изображает ребенка, но без рук. Самостоятельно\nона чаще всего употребляется в качестве глагольного суффикса.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Длинный (chng [тшан]).\nРисунок, к которому восходит эта графема, изображал человека с распущенными длинными волосами, развевающимися на ветру.\nЭта графема часто употребляется в качестве самостоятельного иероглифа, основные значения которого длинный, длина и главный, глава.\nВ качестве компонента графема всегда пишется в правой части иероглифа.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. Род (sh [ши]).\nЭта графема в своем современном написании очень сильно отличается от своего прототипа— изображения человека с ношей в руках.\nЭта графема употребляется в современном китайском языке самостоятельно в значениях\nфамилия, род, клан, что отличается от ее исходного значения.\nВ качестве компонента эта графема встречается редко.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Тело (shēn [шэнь]).\nЭта графема восходит к изображению человека с большим животом. В современном китайском языке эта графема употребляется как самостоятельный иероглиф со значениями: тело, туловище; сам, самолично; корпус.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЧТЕНИЕ ГРАФЕМ","t (l) — стоять;\nt њ(-le)— глагольный суффикс;\nt (m)— мать;\nt (d)— большой;\nt (ti)— слишком;\nt\n(bāo)— сверток, сумка;\nt (r)— сын, ребенок;\nt (wn)— письменный знак; язык;\nt (zӿ)— ребенок, суффикс\nсуществительных."],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\nӰӱ\n\nҼ\n2. Сравните разные варианты графем по их написанию и употреблению:\nӰ\n\n3. Назовите и сравните графемы:\nӰ Ӱ\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\nӝ\n\nӨ\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям):\n; , ; , Ӱ, Ӱ,\n, , , , , .\n6. Потренируйтесь бегло читать следующие иероглифы:\nҼ\n7. Потренируйтесь бегло читать сложные слова и словосочетания:\n,, ,, ,, ,\n8. Переведите на китайский и запишите иероглифами словосочетания:\nбычья шкура/кожа, баранья шкура/кожа, бычьи рога, бараньи рога, говядина, баранина, овечья\nшерсть, тигриные когти, птичьи крылья/перья, картофельная кожура/очистки, кисть, не мочь,\nне мочь прийти.\n\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nЧеловек\n(rn [жэнь])\nВариант\nслева\nВариант\nсверху\nПроизводная\nграфема\nОткр. рот, недоставать (qin [цсиэнь])\nБольшой (d)\nВариант\nСлишком (ti)\nНебо; день\n(tiān [тиэнь])\nШагающий человек, сын (r)\nВидеть\n(jin [цзиэнь])\n\nХромой (shī [ши])\nПечать, власть\nВариант\nВариант\nБолезнь\nТруп, тело\n(shī [ши])\nСтоять (l)\nПисьменный знак,\nязык (wn)\nЖенщина\n(n [нюй])\nВариант\nМать (m)\nСверток, сумка\n(bāo)\nРебенок, суффикс\nсуществ. (zӿ)\nВариант"]],"10":[["Начало урока","Глагольный\nсуффикс (-le)\nДлинный\n(chng [тшан])\n(Нести), род\n(sh [ши])\nТело (shēn [шэнь])\nВариант"],["ФОНЕТИКА","ИНИЦИАЛИ J, Q, X. ФИНАЛИ IA, IE, IU, IAO, IAN\nВ этом уроке мы рассмотрим инициали j, q, x и финали\nx\nia, ie, iu, iao, ian, а также слоги, которые они\nвместе образуют (табл.10.1). Также мы рассмотрим уже изученные в предыдущих уроках инициали в сочетании с новыми финалями.\nТаблица 10.1. Слоги образуемые инициалями j, q, x и финалями i, ia, ie, iu, iao\nИнициали/\nфинали\ni [i]\nia [ia]\nie [i]\niu [iou]\niao [iu]\nin [in]\ning [iŋ]\nb [b]\n(bi)\nbie\nbiao\n(nin)\n(ning)\np [p]\n(pi)\npie\npiao\n(lin)\n(ling)\nm [m]\n(mi)\nmie\nmiao\n(min)\n(ming)\nd [d]\n(li)\ndia\ndie\ndiu\ndiao\n(ding)\nt [t]\n(ti)\ntie\ntiao\n(ting)\nn [n]\n(ni)\nnie\nniu\nniao\n(nin)\n(ning)\nl [l]\n(li)\nlia\nlie\nliu\nliao\n(lin)\n(ling)\n\n \nИнициали/\nфинали\ni [i]\nia [ia]\nie [i]\niu [iou]\niao [iu]\nin [in]\ning [iŋ]\nj [d]\nji\njia\njie\njiu\njiao\njin\njing\nq [t]\nqi\nqia\nqie\nqiu\nqiao\nqin\nqing\nx []\nxi\nxia\nxie\nxiu\nxiao\nxin\nxing\nКомментарии\nЗвуки j, q, x не имеют аналогов в русском языке. Они являются мягкими\nx\nвариантами звуков z, c, s. При произнесении всех этих трех звуков язык\nзанимает следующее положение: кончик его прижимается к нижним зубам, а спинка приподнимается вверх и вперед к твердому нёбу (рис.10.1),\nкак при произнесении русских букв ч и щ. При таком положении языка\nструя воздуха проходит через образуемую щель, производя своеобразный присвист, что создает ощущение некоторой шепелявости.\nЗвук [], обозначаемый буквой x, похож на русский звук сь, но\nпроизносится с щ-образным призвуком. Чтобы научиться правильно произносить этот звук, сначала произнесите сь, а затем\nприподнимите спинку языка вверх и вперед, как при произнесении щ, и произнесите звук еще раз.\nЗвук q [t] представляет собой сочетание звуков [t] и [], больше всего он похож на сочетание тсь, но произносится с ч-образным призвуком и придыханием. При его произнесении\nкончик языка прижимается к нижним зубам, а спинка языка приподнимается наверх, как при\nпроизнесении русской буквы ч.\nЗвук j, как и звуки b, d и g, относится к полузвонким согласным. Он больше всего похож на\nсочетание дзь или цзь, но произносится не так звонко, представляя собой звонкий вариант\nзвука q, но в отличие от него произносится без придыхания. При его произнесении язык занимает такое же положение, как и при произнесении звука q. В русской транскрипции этот\nзвук обозначается как цз в сочетании с гласными и, е, ю, я (цзя, цзю ит.д.).\nВ этом уроке мы начинаем изучать сложные финали с медиалью i, особенность таких финалей\nв том, что гласная i в них никогда не является слогообразующей и произносится очень легко и кратко,\nа роль слогообразующей всегда играет гласная, следующая за ней.\nФиналь ia произносятся как иа, где слогообразующей гласной является a. Хотя в русской\nтранскрипции она передается буквой я, например: цзя, ця, ся, это не совсем верно, поскольку\nзвук i, несмотря на свою краткость, отчетливо слышен. Это же касается и остальных случаев\nупотребления финалей с i в начале.\nФиналь ie произносятся как ие [ie], где слогообразующей гласной является e.\nФиналь iu— исключение, поскольку она произносится ближе к звуку иоу [iou] с кратким о\nпосередине. В слогах с финалью iu, произносимых в первом и втором тонах, звук о практически редуцируется, но в третьем тоне он слышен очень отчетливо. Основное ударение в этой\nфинали падает на гласную о, но поскольку она редуцируется на письме, значок тона ставится\nнад гласной u, например: li.\nФиналь iao произносятся как иау [iau], то есть так же, как финаль ao, только с легким и кратким звуком i в начале.\nОкончание табл. 10.1\nРис. 10.1. Техника\nпроизнесения звуков j, q, x"],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 10.1.1\n1. Прочитайте, повторяя за диктором, инициали b, p, m, d, t, n, l в сочетании с новыми финалями:\niā diā liā iē biē piē miē diē tiē niē liē iū diū niū liū iāo biāo piāo miāo diāo tiāo niāo liāo\nCD 10.1.2\n2. Прочитайте, повторяя за диктором, инициали j, q, x по отдельности и в сочетании с финалью\nx\ni:\nj jī q qī x xī jī qī xī\nCD 10.1.3\n3. Инициали j, q, x в сочетании с финалями\nx\nia, ie, iu, iao, iān:\nī jī\niā jiā\niē jiē\niū jiū\niāo jiāo\nīn jīn\nīng jīng\ng\nī qī\niā qiā\niē qiē\niū qiū\niāo qiāo\nīn qīn\nīng qīng\ng\nī xī\niā xiā\niē xiē\niū xiū\niāo xiāo\nīn xīn\nīng xīng\ng\nī j qӿq x iā ji qiӽ xi iē ji qiě xi iū ji qi xi iāo jio qiӽo xio īn jn qӿq n xn īng jng q\ng\nӿq ng xng\nCD 10.1.4\n4. Прочитайте, повторяя за диктором, слоги с парами инициалей z/j, c/q, s/x, которые различаются по принципу твердости/мягкости, обращая внимание на финали, с которыми эти инициали сочетаются:\nzī jī\nz ji\nzě jiě\nz ji\ncī qī\nc qi\ncě qiě\nc qi\nsī xī\ns xi\nsě xiě\ns xi\nCD 10.1.5\n5. Прочитайте, повторяя за диктором, каждый из слогов в тех тонах, в которых он употребляется:\njī j jӿ j\njiā ji jiӽ ji\njiē ji jiě ji jiějie\njiū - ji ji\njiāo jio jiӽo jio\njīn - jӿn jn\njīng - jӿng jng\nqī q qӿq q\nqiā - qiӽ qi\nqiē qi qiě qi\nqiū qi qi -\nqiāo qio qiӽo qio\nqīn qn qӿq n qn\nqīng qng qӿq ng qng\nxī x xӿ x\nxiā xi - xi\nxiē xi xiě xi\nxiū - xi xi\nxiāo xio xiӽo xio\nxīn xn xӿn xn\nxīng xng xӿng xng\nbiē bi biě bi\nbiāo - biӽo bio\npiē - piě -\npiāo pio piӽo pio\nmiē - - mi\nmiāo mio miӽo\nmio\n- - diӽ -\ndiē di - -\ndiū - - -\ndiāo - diӽo dio\ntiē - tiě ti\ntiāo tio tiӽo tio\nniē ni - ni\nniū ni ni ni\n- niӽo nio\nniān nin niӽn nin\n- - liӽ -\nliē - liě li\nliū li li li\nliāo lio liӽo lio\nCD 10.1.6\n6. Прослушайте следующую скороговорку, затем прочитайте ее, повторяя за диктором:\nKn xīngxīng\nСмотреть на звезды\nJīngjīng h Xīnxīn\n\nЦзин-цзин и Синь-синь\nYīqӿq kn xīngxīng.\n\nВместе смотрят на звезды.\n\n \nTiānshng xīngxīng ling jīngjīng, ҂\nНа небе звезды светят ярко,\nJīngjīng Xīnxīn kn xīngxīng.\n\nЦзин-цзин и Синь-синь\nсмотрят на звезды."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 10.2.1\n1. Прочитайте следующие односложные слова, повторяя за диктором:\nt xī ()— запад;\nt\nq ()— воздух, газ, тон, атмосфера;\nt xi ()— снизу, под, падать, заканчиваться;\nt\njӿ ()— сколько?\nt\njiā ()— семья;\nt\njiě (\n)— (в сочетании) сестра (старшая);\nt\nxiě ()— писать;\nt\nxi ()— благодарить;\nt\njio ()— звать, называть;\nt\njio ()— преподавать;\nt\nxiӽo ()— маленький;\nt\npio ()— билет;\nt\njn ()— входить;\nt\njīn (Ҟ)— нынешний, сегодняшний;\nt\njīn ()— 1 цзинь (полкило);\nt\nxīn ()— новый;\nt\njīng (Ҁ)— столица;\nt\nqīng ()— светлый, чистый, ясный;\nt qӿq ng ()— просить, пожалуйста, позвольте;\nt xng ()— фамилия.\nCD 10.2.2\n2. Прочитайте следующие слова и словосочетания, повторяя за диктором:\nt\nBěijīng (\nҀ)— Пекин\n(дословно: Северная столица);\nt Nnjīng (Ҁ)— Нанкин\n(дословно: Южная столица);\nt\nDōngjīng (Ҁ)— Токио\n(дословно: Восточная столица);\nt dōngxi ()— вещь(и);\nt dōng-xī — запад и восток;\nt\ndjiā ()— все\n(дословно: большая семья);\nt\njiějie (\n)— старшая сестра;\nt\nxiӽojiě (\n)— девушка;\nt\nmӽi pio (ф)— покупать билет(ы);\nt\nmӽi dōngxi (ф)— делать покупки;\nt\nxiě z ()— писать иероглифы;\nt\nxiě hnz ()— писать китайские\nиероглифы;\nt qӿq ng wn ()— позвольте спросить;\nt\nxixie ()— спасибо;\nt\nb xi ()— не благодарите;\nt\nb yng xi ()— не стоит\nблагодарности;\nt kqi ()— вежливый, вежливость,\nцеремониться;\nt\nb kqi ()— не церемоньтесь;\nt\nbi kqi ()— не нужно церемониться;\nt dubuqӿq ()— извини(те) ;\nt mi guānxi (\n)— ничего страшного.\nCD 10.2.3\n3. Прочитайте следующие предложения, повторяя за диктором:\nQӿng jn! ()— Пожалуйста, войди(те)!\nQӿng zu! ()— Пожалуйста, сядь(те)!\nQӿng (nӿ) kāi mn! ()— Пожалуйста, включи свет!\nQӿng (nӿ) kāi dēng! ()— Пожалуйста, открой дверь!\nQӿng gěi w bӿ. ()— Пожалуйста, дай мне ручку.\n\n \nNӿ kn! ()— Посмотри!\nHē tāng ba! ()— Ешь(те) суп!\nQӿng (nӿ) kāi dēng ba! ()— Пожалуйста, (включи) свет!\nQӿng (nӿ) hē tāng ba! ()— Пожалуйста, поешь суп!\nCD 10.2.4А\n4. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите диалоги:\n— Qӿng gěi w bӿ.\n\n— Gěi nӿ.\n\n— Xixi.\n\n— B xi.\n\nCD 10.2.4Б\n— Xiӽojiě, qӿq ng wn,\nGgōng zi nӽli?\n\n— Ggōng zi nlӿ.\n\n— Xixi.\n\n— B kq.\n\nCD 10.2.4В\n— Qӿngwn,\nWng Huā zi ma?\n\n— Tā zi.\n\n— Xixie.\n\n— B yng xi.\n\nCD 10.2.4Г\n— Kěyӿy jnli ma?\n\nҹ\n— Qӿng jn!\n\n— Dubuqӿq , w\nliwӽnle.\n\nњ\n— Miguānxi, —\nqӿq ng zu!\n\nВ этих диалогах используются новые слова: Ggōng (\ng )— императорский дворец в Пекине\n(Гугун); kěyӿy (\nӿ\nҹ)— можно, разрешено; jnli (\ng (\ng\n)— входить."],["Комментарий","1. Побуждение в китайском языке.\nПобуждение в китайском языке может выражаться двумя основными способами: посредством\nвспомогательного глагола qӿ\nq ng, который в данном случае переводится как пожалуйста, будьте\nлюбезны: Qӿng kāi mn.— Пожалуйста, открой(те) дверь, или побудительной частицы ba: Hē\ntāng ba! — Ешь(те) суп!. Кроме того, глагол qӿ\nq ng и частица ba могут употребляться одновременно: Qӿng nӿ hē tāng ba!\nӿ\n— Пожалуйста, поешь суп!\n5. Выражения вежливости в китайском языке.\nЕсли нужно вежливо о чем-то спросить, то вопрос обычно начинают с выражения qӿ\nq ng wn —\nпозвольте спросить. Здесь употребляется тот же самый глагол qӿ\nq ng, однако в данном контексте он переводится по-другому. Благодарность чаще всего выражается посредством выражения\nxixi — спасибо, на что обычно отвечают: b xi— не благодарите, b yng xi — не стоит\nблагодарности или bkqi /bikqi — не церемоньтесь/не нужно церемониться. Если нужно извиниться, то чаще всего употребляют выражение: dubqӿ —\nӿ\nизвини(те), на которое обычно\nотвечают: miguānxi— ничего страшного."],["ЗАДАНИЯ","CD 10.3.1\n1. Слушая звукозапись, определите слог в правильном тоне:\nt jiāo jio jiӽo jio;\nt xīng xng xӿng xng;\nt\nbiān bin biӽn bin;\nt\nxī x xӿ x;\n\n \nt jiē ji jiě ji;\nt tiāo tio tiӽo tio;\nt\nqīng qng qӿq ng qng;\nt\nniū ni ni ni;\nt\nqiē qi qiě qi.\nCD 10.3.2\n6. Слушая звукозапись, поставьте правильный тон в следующих слогах:\njin bie qing xiao qi diao jie qiao liu tiao xi jing xiu biao lie ji xiao qin jiu tiao\nCD 10.3.3\n7. Слушая звукозапись, впишите нужную инициаль (z/j, c/q, s/x):\n__ā, __iā, __i, __, __i, __, __o, __io, __ū, __iū, __, __, __ě, __iě, __io, __o\nCD 10.3.4\n8. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n9. Переведите c русского на китайский:\nПожалуйста, закрой дверь. ___________________________________________________________\nЗакрой дверь! ______________________________________________________________________\nПожалуйста, выключи свет. __________________________________________________________\nВыключи свет! _____________________________________________________________________\nПожалуйста, почитай газету. _________________________________________________________\nПочитай газету! ____________________________________________________________________\nПожалуйста, купи овощей. ___________________________________________________________\nКупи овощей! ______________________________________________________________________\nПожалуйста, купи билеты. ___________________________________________________________\nКупи билеты! ______________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: НОГИ\nВ этом уроке мы рассмотрим графемы, которые связаны с изображениями сидящего человека и ног\n(табл.10.2).\nТаблица 10.2. Графемы, связанные с изображением сидящего человека и ног\nГрафемы\nТранскрипция\nЗначение\nbӿ\n(сидящий человек)\nкинжал\n\nbӿ\nсравнивать\nběi\nсевер\nlӽo\nстарый\nГрафемы\nТранскрипция\nЗначение\n\nch [тши]\nшаг\n\nxng\nпуть, идти\n\nzu\nсидеть, садиться\n\nchū [тшу]\nвыходить\n\n \nГрафемы\nТранскрипция\nЗначение\n\nбыстро идти\n\nпродвигаться\nс\nxi\nснизу, под\nр\nshng [шан]\nсверху, на, над\nzhӿ [чжи]\nостанавливаться\nzhng [чжэн]\nправильный\nнога в движении\nГрафемы\nТранскрипция\nЗначение\nz\nнога\n\nzu\nидти, уходить\n\nsh [ши]\nбыть, являться\ngn\nпреграда\n\nтоптать\n\nchuӽn [тшуань]\nпротиворечие\nВ качестве ключей из них обычно выделяют графемы:\n, ,(), , ,, , ,, , ,, , .\n1. Кинжал (bӿ).\nРисунок, к которому восходит эта графема, изображал сидящего человека, однако, по всей\nвидимости, ее поздняя форма написания совпала с изображением кинжала, поэтому она\nстала употребляться в этом значении. В качестве компонента она может иметь несколько\nотличное написание с пересекающей нисходящей.\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. Сравнивать (bӿ).\nЭта графема восходит к рисунку, изображавшему двух людей.\nВ современном китайском языке она употребляется в качестве самостоятельного иероглифа, основные значения которого: сравнивать, сопоставлять, …по сравнению с…\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Север (běi).\nЭта графема представляет собой изображение двух людей, повернутых друг к другу спиной. Это связано с тем, что север на китайском компасе находится сзади, а не спереди,\nкак принято на Западе.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n4. Старый (lӽo).\nРисунок, к которому восходит эта графема, изображал сидящего человека и волосы\nсверху, что означало человека, чьи волосы поменяли свой цвет, тоесть поседели.\nВ качестве самостоятельного иероглифа графема употребляется в значениях старый и уважаемый, а в качестве компонента— только в своем сокращенном варианте.\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Путь, идти (xng), шаг (ch [тши]).\nПо одной из версий, графема изображает две стопы, однако скорее она восходит\nк изображению перекрестка дорог. Эта графема употребляется самостоятельно в значениях идти, ехать; дорога, путь, путешествие; действовать, заниматься; годиться.\nКроме того, она может означать ряд, в этом случае графема читается как hng.\nХотя графема является половиной иероглифа , чаще всего она трактуется как шаг.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n6. Сидеть, садиться (zu).\nГрафема восходит к изображению двух людей (Ҏ, которые собираются сесть напротив\nдруг друга на землю (. В современном китайском языке употребляется самостоятельно\nв исходном значении, а как компонент обычно пишется в правой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Выходить, наружу (chū [тшу]).\nПиктограмма, к которой восходит эта графема, изображает ногу (ступню), приподнимаемую из ямы. В современном китайском языке она употребляется самостоятельно в своем\nисходном значении, а в качестве компонента обычно пишется в правой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Быстро идти.\nЭта графема произошла от изображения дороги и отпечатка ноги. Она является уже\nдавно сокращенной формой иероглифа . Графема может употребляться только\nв качестве компонента сложных иероглифов, всегда замыкая иероглиф или его часть\nслева и снизу. В печатном виде она может иметь вид: (без изгиба).\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Продвигаться.\nЭта графема имеет происхождение от той же пиктограммы, что и графема .\nОна также может употребляться только в качестве компонента сложных иероглифов,\nвсегда замыкая иероглиф или его часть слева и снизу.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Снизу, под (xi).\nГрафема является индикативной, поскольку она изображает абстрактное явление\nниз. Она не входит в список ключевых графем, однако в своем нынешнем написании\nимеет большое сходство с графемами, восходящими к изображению ступни, к тому же\nв современном китайском языке этот иероглиф употребляется очень часто.\nВ качестве иероглифа графема может также употребляться в значениях следующий (например: следующая неделя) и заканчивать (например: заканчивать урок).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Сверху, на, над (shng [шан]).\nГрафема также является индикативной, представляя собой зеркальную копию графемы . Она не входит в список ключевых графем, однако в своем нынешнем написании имеет большое сходство с графемами, восходящими к изображению ступни, к тому\nже в современном китайском языке этот иероглиф употребляется очень часто.\nВ качестве иероглифа графема может также употребляться в значениях: прошлый, предыдущий (например: предыдущая неделя) и начинать (например: начинать урок).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Останавливаться (zhӿ [чжи]).\nВ современном китайском языке графема употребляется самостоятельно в значениях перестать, остановиться. В качестве компонента при размещении слева она может\nиметь сокращенное написание с восходящей чертой вместо горизонтальной.\nВариант написания слева:\n. Древняя пиктограмма, к которой восходит эта графема,\nизображала ногу.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n13. Прямой (zhng [чжэн]).\nЭта графема восходит к рисунку, изображавшему ступню с чем-то сверху: сначала\nкоробкой, потом кругом, а затем и прямой линией. Скорее всего, основной смысл\nэтой графемы— идти по прямой.\nОна не входит в список ключевых знаков, однако очень часто употребляется в качестве\nкак компонента, так и иероглифа в значениях: прямой, ровный; главный, центральный;\nистинный. В качестве компонента графема может иметь два разных варианта написания.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Нога в движении.\nГрафема очень похожа на один из вариантов написания графемы , только пишется\nс крюком. Она восходит к изображению ноги с завитком сверху, что обозначало движение.\nЭта графема в данный момент вышла из самостоятельного употребления и может использоваться только в качестве компонента сложных иероглифов. В левой части иероглифа она имеет сокращенное написание.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Нога (z).\nДревняя пиктограмма, к которой восходит эта графема, изображала ногу от колена.\nВ современном китайском языке она употребляется в качестве самостоятельного иероглифа в своем исходном значении. В левой части иероглифа графема имеет сокращенное\nнаписание.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Идти, уходить (zu).\nЭта графема восходит к рисунку, изображавшему ногу и человека сверху.\nВ современном китайском языке она употребляется в качестве самостоятельного иероглифа, основные значения которого: идти, следовать; уходить, уезжать.\nВ качестве компонента графема всегда замыкает иероглиф слева и снизу.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n17. Быть, являться (sh [ши]).\nПроисхождение этой графемы не совсем ясно, хотя она содержит в себе элементы\n(правильный, прямой) и (солнце). Возможно, солнце взято здесь как образец правильности.\nВ современном китайском языке она употребляется в значениях да, быть, являться.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. Преграда (gn).\nЭта графема произошла от изображения сидящего человека и глаза сверху. По всей видимости, это обозначало человека, который внимательно рассматривает возникшее перед\nним препятствие.\nВ качестве самостоятельного иероглифа графема употребляется в значениях преграда;\nтвердый, крепкий. В качестве компонента при размещении в левой части иероглифа она\nимеет сокращенное написание.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Топтать.\nГрафема произошла от изображения двух отпечатков ног, которые что-то топтали.\nОна может употребляться только в качестве компонента сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n20. Противоречие (chuӽn [тшуань]).\nРисунок, к которому восходит эта графема, изображал две ступни, развернутые в разные\nстороны.\nГрафема также может иметь название переступать.\nВ современном китайском языке графема употребляется самостоятельно в своих исходных значениях: противоречие, ошибка, однако как в качестве иероглифа, так и в качестве\nкомпонента она встречается редко.\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЧТЕНИЕ ГРАФЕМ","y\n(bӿ)— кинжал;\ny (bӿ)— сравнивать;\ny\n(běi)— север;\ny (gn)— преграда;\ny (lӽo)— старый, уважаемый;\ny (tiān)— небо;\ny (tin)— поле;\ny (nin)— год;\ny (din)— электричество;\ny (ni)— корова;\ny (niӽo)— птица;\ny (z)— нога;\ny (zu)— идти;\ny (zu)— сидеть, садиться;\ny (xī)— вечер;\ny (xī)— запад;\ny д (x)— повторять, практиковать;\ny (q)— ровный;\ny (q)— воздух, газ;\ny (xi)— снизу, под;\ny (jīn)— металл, золото;\ny (jiӽo)— рог;\ny (jin)— видеть;\ny (xng, hng)— путь, идти, ряд;\ny (xiāng)— ароматный;\ny (xing)— слон;\ny ѩ (jӿng)— колодец."],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\n\nср\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Назовите и сравните графемы:\n\nсрр\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям):\nђ, ђ, , рс, Ӱ, р\n, с\n, р, с, с,\nсҼ\n\n \n6. Потренируйтесь бегло читать следующие графемы:\n\nҖсӋ\n7. Потренируйтесь бегло читать следующие сложные слова и словосочетания:\nђ, , с\n, , , , , , , ,\n8. Переведите на китайский и запишите иероглифами:\nсын, дочь, сын и дочь, мать и ребенок, овца, корова, мертвое тело, человеческое тело, большой\nчеловек, длинная река, большая гора, большой дождь, ливень, кожаная сумка.\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nКинжал (bӿ)\nВариант\nСравнивать (bӿ)\nСевер (běi)\nСтарый (lӽo)\nВариант\nШаг (ch [тши])\nПуть; идти (xng)\n\n \nСидеть, садиться\n(zu)\nВыходить\n(chū [тшу])\nБыстро идти\nПродвигаться\nСнизу, под (xi)\nСверху, на, над\n(shng [шан])\nОстанавливаться\n(zhӿ [чжи])\nВариант\nслева\nПравильный\n(zhng [чжэн])\nВариант\nслева\nНога\nв движении\nВариант\nслева\nНога (z)\nВариант\nслева"]],"11":[["Начало урока","Идти (zu)\nБыть, являться\n(sh [ши])\nПреграда (gn)\nВариант слева\nТоптать\nПротиворечие\n(chuӽn [тшуань])"],["ФОНЕТИКА","ФИНАЛИ IAN, IANG, IONG, , N, E, AN\nВ этом уроке мы продолжим изучать финали с медиалью i, включая финали ian, iang, iong, а также\nрассмотрим финали с медиалью : n, e, an (табл.11.1).\nТаблица 11.1. Слоги, образуемые инициалями и финалями ian, iang, iong,: n, e, an\nИнициали/\nфинали\nian\n[in]\niang\n[iŋ]\niong\n[iuŋ]\n\nn\n[n]\ne\nan\n[n]\nb [b]\nbian\np [p]\npian\nm [m]\nmian\n\n \nОкончание табл. 11.1\nИнициали/\nфинали\nian\n[in]\niang\n[iŋ]\niong\n[iuŋ]\n\nn\n[n]\ne\nan\n[n]\nd [d]\ndian\nt [t]\ntian\nn [n]\nnian\nniang\nn\nl [l]\nlian\nliang\nl\nle\ny [y]\nyu\nyun\nyue\nyuan\nj [j]\njian\njiang\njiong\nju\njun\njue\njuan\nq [q]\nqian\nqiang\nqiong\nqu\nqun\nque\nquan\nx [x]\nxian\nxiang\nxiong\nxu\nxun\nxue\nxuan"],["Комментарий","Финаль ian представляет собой исключение, она, как и yan, читается близко к иэнь [in].\nФиналь iang произносится как\ng\nиан [iaŋ], то есть так же, как финаль ang, только с легким и кратким\nзвуком i в начале. Слогообразующей является гласная a.\nФиналь iong читается как финаль\ng\nong, только со звуком i в начале,\nкоторый произносится слабо и кратко. Она также представляет собой\nисключение, поскольку произносится не так, как пишется. Звук, передаваемый буквой o в финали iong, представляет собой среднее между\nо и у, финаль читается близко к иун [iung].\nЗвук, передаваемый в путунхуа буквой , не имеет аналогов в русском\nязыке, но полностью соответствует звуку в немецком и французском\nязыках. При его произнесении язык сильно продвигается вперед, а его\nспинка приподнимается к твердому нёбу, как при произнесении [i], но\nгубы при этом округляются, как при произнесении [u] (рис.11.1\n). Чтобы\nнаучиться произносить этот звук, произнесите сначала звук [i], а затем\nокруглите и немного вытяните вперед губы, как при произнесении [u].\nЗвук в качестве финали имеет два варианта обозначения. Он обозначается как только после инициалей n, l, а после инициалей j, q, x и y он записывается просто\ny\nбуквой u без точек. Обычно в транскрипции этот звук принято записывать буквой y, но во избежание путаницы мы здесь оставим обозначение . Сочетание yu в слогах yu, yun, yue, yuan по правилу\nчитается просто как , однако в начале присутствует легкий звук й.\nВ этом уроке мы рассмотрим также сложные финали, начинающиеся с . Если за буквой следует\nеще одна гласная, то всегда произносится очень легко и кратко, а основное ударение падает на\nследующую за ней гласную. Гласная в таком положении считается медиалью.\nФиналь n произносится так же, как и пишется: [n]. После инициалей j, q, x и y она записы\ny\nвается как un.\nФиналь ē произносится так же, как и пишется: [e], основное ударение падает на e. После\nинициалей j, q, x и y она записывается как\ny\nuē.\nФиналь an произносится [n], основное ударение падает на a. После инициалей j, q, x и y\nона записывается как uan.\nРис. 11.1. Техника\nпроизнесения звука"],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 11.1.1\n1. Прочитайте, повторяя за диктором, инициали b, p, m, d, t, n, l в сочетании с финалями ian и iang:\niān biān piān miān diān tiān niān liān iāng niāng liāng\ng\nCD 11.1.2\n2. Прочитайте, повторяя за диктором, инициали j, q, x в сочетании с финалями\nx\nian, iang, iong:\niān jiān\niāng jiāng\ng\niōng jiōng\ng\niān qiān\niāng qiāng\ng\niōng qiōng\ng\niān xiān\niāng xiāng\ng\niōng xiōng\ng\niān jin qiӽn xin iāng jing qi\ng\nӽng xing iōng jing qi\ng\nng xing\nCD 11.1.3\n3. Прочитайте, повторяя за диктором, слоги с контрастными финалями ian/iang:\niān iāng jin jing qiӽn qiӽng xin xing niān ning liӽn ling\nCD 11.1.4\n4. Прочитайте, повторяя за диктором, слоги с контрастными инициалями d/j:\ndī jī\ndi ji diě jiě di ji diāo jiāo dng jng diӽn jiӽn\nding jing\nCD 11.1.5\n5. Прочитайте, повторяя за диктором, слоги с контрастными инициалями z/ j/d:\nzī jī dī di ji z zě jiě diě di ji z\nCD 11.1.6\n6. Прочитайте, повторяя за диктором, финали i и :\nī\nī\n\nCD 11.1.7\n7. Прочитайте, повторяя за диктором слоги, образуемые финалью :\nyū j q\nq x yūn jn q\nq n xn yuē ju quě xu yuān jun quӽn xun n l ně l\nCD 11.1.8\n8. Прочитайте, повторяя за диктором, слоги с контрастными финалями /iu:\niū j ji q\nq qi x xi n ni l li\nCD 11.1.9\n9. Прочитайте, повторяя за диктором, слоги с контрастными инициалями uan/ian:\nyuān yān qun qin xuӽn xiӽn jun jin\nCD 11.1.10\n10. Прочитайте, повторяя за диктором, каждый из слогов в тех тонах, в которых он употребляется:\nbiān - biӽn bin\npiān pin piӽn pin\n- min miӽn min\n- diān - diӽn din\nniān nin niӽn nin\n- ning - ning\n- lin liӽn lin\n- ling liӽng ling\nqiān qin qiӽn qin\nqiāng qing qiӽng qing\n- qing - -\nxiān xin xiӽn xin\n\n \ntiān tin tiӽn tin\n- - n n\n- l l l\njiān - jiӽn jin\njiāng - jiӽng jing\njiōng - jing -\nxiāng xing xiӽng xing\nxiōng xing - xing\nyū y y\ny y\nyūn yn y\ny n yn\nyuē - yuě yu\nyuān yun yuӽn yun\njū j j j\njūn - - jn\njuē ju juě ju\njuān - juӽn jun\nqū q q\nq q\nqūn qn - -\nquē qu - qu\nquān qun quӽn qun\nxū x x\nx x\nxuē xu xuě xu\nxuān xun xuӽn xun\nxūn xn - xn\nCD 11.1.11А\n11. Прослушайте следующие скороговорки, затем прочитайте их, повторяя за диктором:\nNilng h Li ning\nПастух и девушка Лю\nNilng lin Li ning,\n\nПастух любит девушку Лю,\nLi ning nin nilng,\n\nДевушка Лю тоскует по пастуху.\nNilng ninnin lin Li ning,\n\nПастух много лет любит девушку Лю,\nLi ning linlin nin nilng.\n\nДевушка Лю постоянно тоскует\nо пастухе.\nCD 11.1.11Б\nLӽo L h lӽo X\nСтарина Люй и старина Сюй\nLӽo L h lӽo X,\n\nСтарина Люй и старина Сюй\nShng jiē q mӽi y,\nф\nПошли на рынок покупать рыбу,\nZu do bnl tiān xiy\ny .\n\nПрошли полпути, как с неба пошел\nдождь,\nr rn dōu mi di y\ny j.\n\nѠҎ\nОба они не взяли снаряжение\nот дождя.\nGbude shng jiē q mӽi y,\nф\n\nВсе не предусмотрев, они пошли\nна рынок за рыбой,\nXiān zhӽo dfāng q du y\n ить английский.\nCD 11.2.3\n3) предложения:\nJīntiān yu y\ny . (Ҟ\n)— Сегодня (есть) дождь.\nJīntiān xi y\ny . (Ҟ)— Сегодня идет дождь.\nJīntiān qngtiān. (Ҟ)— Сегодня ясно (ясный день).\nJīntiān tiānq zěnme yng? — Jīntiān tiānq hěn hӽo. (ҞМ— Ҟ)—\nКакая сегодня погода? — Сегодня (очень) хорошая погода.\nMngtiān tiānq hӽo ma? — B, mngtiān tiānq b hӽo, xi y\ny , guā fēng. (\n\ng\nq\ng\n)— Завтра [будет] хорошая погода? — Нет, завтра [будет] плохая\nпогода, [будет] (очень) холодно, дождь и ветер.\n\n \nMngtiān hu bu hu xiy\ny ? — Mngtiān hu xiy\ny . (ӮӮ Ӯ)—\nЗавтра может (или нет) пойти дождь? — Завтра может пойти дождь.\nNӿ xu Hny\ny ma? — Du, w xu Hny\ny . (— )— Ты учишь китайский язык? Да (правильно), я учу китайский язык.\nNӿ xu b xu Yīngy\ny ? — W xu Yīngy\ny . (— )— Ты учишь английский язык? — Я учу английский язык.\nNӿ xu-bu-xu y\ny ? — B, w b xu y\ny , w xu Hny\ny . (\n\ny\n)— Ты учишь (или нет) русский язык? — Нет, я не учу русский язык, я учу\nкитайский язык.\nNӿ zi nӽOi xu Hny\ny ? — W zi Wiy\ny xuyun xu Hny\ny . (—\nд\ny\n)— Где ты учишь китайский язык? — Я учу китайский язык в Институте\nиностранных языков.\nXi k. ()— заканчивается.\nXi kle. (њ)— закончился.\nXi y\ny . ()— Идет дождь.\nXi y\ny le. (њ)— Пошел дождь.\nGuā fēng. ()— Дует ветер.\nGuā fēngle. (њ)— Подул ветер.\nCD 11.2.4А\n4) диалоги:\nJīntiān tiānq zěnme yng? — Какая сегодня погода?\n— Māmā, jīntiān tiānq zěnme yng?\nҞМ\n— Jīntiān tiānq hěn lěng, bitiān hu xi y\ny .\nҞӮ\n— W di y\ny sӽn, w de y\ny sӽn zi nӽli?\nӲӲ\n— Wimin guā dfēng, nӿ di y\ny yī ba!\n\n— Hӽo.\n\nВ этом диалоге используются новое слово: di ()— брать с собой.\nCD 11.2.4Б\nNӿ xu hny\nӿ\nmӽ? — Ты учишь китайский язык?\n— Nӿ xu Hny\ny mӽ?\n\n— W xu Hny\ny .\n\n— Nӿ zi nӽli xu Hny\ny ?\n\n— W zi Běijīng Wiguy\ny dxu xu Hny\ny .\n\nҀ\n— Nӿ de pngyu yě xu Hny\ny ma?\n\nг\n— B, tā b xu hny\ny , tā xu Yīngy\ny\nҪҪ\nВ этом диалоге используются новые слова: Wiguy dxu ()— Университет иностранных языков."],["Комментарий","1. Будущее время в китайском языке.\nВ отличие от прошедшего времени будущее время в китайском не имеет специального обозначения посредством суффиксов или служебных частиц. То, что речь идет именно о будущем, обычно понятно из контекста. На будущее время всегда указывает обстоятельство времени: потом,\nзавтра, в следующем месяце ит.д., а также специальные глаголы, выражающие намерение говорящего что-то сделать: xiӽng (\ng думать, хотеть, собираться), yo (хотеть, иметь необходимость,\nнамереваться» и др.), например: Mngtiān nӿ xi\nӿ\nӽng/yo q nӽli? — Куда ты собираешься пойти\nзавтра?. В безличных предложениях может употребляться глагол hu, который в данном контексте означает не уметь, а может случиться, что...; может статься, что. Например: Mngtiān hu\nxiy.— Завтра может пойти дождь.\n2. Безличные предложения в китайском языке.\nК простым предложениям в китайском языке также относятся безличные предложения, в которых отсутствует подлежащее, например: Xi y.— Идет дождь."],["ЗАДАНИЯ","CD 11.3.1\n1. Слушая звукозапись, определите слог в правильном тоне:\nt piān pin piӽn pin;\nt\nqiāng qing qiӽng qing;\nt\nxū x x\nx x;\nt quān qun quӽn qun;\nt\nxiāng xing xiӽng xing;\nt\nyuān yun yuӽn yun;\nt\nyū y y\ny y;\nt\njuē ju juě ju;\nt\nyūn yn y\ny n yn.\nCD 11.3.2\n2. Слушая звукозапись, поставьте правильный тон в следующих слогах:\njian liang quan xian qu xiang juan yu niang tian xu jue xian l jiang dian ju tian\nCD 11.3.3\n3. Слушая звукозапись, впишите нужную инициаль (d/j):\n__ī, __i, __iě, __i, __iāo, __ng __iӽn, __ing\nCD 11.3.4\n4. Слушая звукозапись, впишите нужную финаль (/iu):\nj__, q__, x__, n__, l__\nCD 11.3.5\n5. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n__________________________________________________________________________________\n6. Переведите c русского на китайский и запишите с помощью пиньинь:\nСегодня облачно. ___________________________________________________________________\nСегодня пасмурный день. ____________________________________________________________\nСегодня идет снег. __________________________________________________________________\n\n \nСегодня днем может пойти дождь. ____________________________________________________\nСегодня очень холодно ______________________________________________________________\nПошел снег. ________________________________________________________________________\nТы учишь английский язык? — Нет, я учу китайский язык.\n__________________________________________________________________________________\nГде ты учишь китайский язык? — Я учу китайский язык в университете.\n__________________________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: РУКИ\nВ данном уроке мы рассмотрим графемы, восходящие к изображениям рук (табл.11.2).\nТаблица 11.2. Графемы, связанные с изображением рук\nГрафемы\nТранскрипция\nЗначение\n\nличный, частный\nl\nсила\nshu [шоу]\nрука\n\nприветствие\n\nkāi\nоткрывать\nguān\nзакрывать\n\nf\nотец\nyu\n(правая рука);\nопять, снова\nshuāng [шуан]\nпара\n\nследовать\n(рука с палкой);\nбить\nГрафемы\nТранскрипция\nЗначение\n\nzhī [чжи]\nветка\n\nпика\n\nfӽf n\nпереворачивать\nyu\nдруг\n\nyu\nиметь\n\nzu\nлевый\n\nyu\nправый\n\ncn\nцунь; вершок;\nдюйм\ny\nорудие письма\nҜ\nshū [шу]\nкнига\nВ качестве ключей из них обычно используют графемы:\n, ,,,, ,,, (),\n,, , ().\n1. Личный, частный.\nПроисхождение этой графемы не совсем ясно, хотя по одной из версий она изображает\nсогнутую в локте руку.\nГрафема может употребляться только в качестве компонента сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n2. Сила (l).\nСуществует несколько версий относительно происхождения этой графемы. Наиболее вероятно, что она произошла от изображения руки с напряженными мускулами, что символизировало силу, однако есть мнение, что ее прототипом являлось изображение плуга.\nВ современном китайском языке графема употребляется самостоятельно в значениях\nсила, способность, действие, эффект.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Рука (shu [шоу]):\nДревняя пиктограмма, к которой восходит графема , изображала руку. В современном китайском языке она употребляется самостоятельно в значениях рука; мастер,\nспециалист; способ,б прием.\nМожет иметь измененное написание в иероглифах и .\nГрафема является производной от . В этом варианте она может употребляться\nтолько в качестве компонента сложных иероглифов, при этом всегда располагаясь слева.\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Приветствие.\nЭта графема произошла от изображения двух рук, поднятых вверх для приветствия. Она\nможет употребляться только в качестве компонента сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Открывать (kāi).\nЭта графема восходит к иероглифу , который изображал две руки, открывающие ворота, и который впоследствии сократился до .\nСамостоятельно графема употребляется в значениях открывать, начинать, водить\n(машину).\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n6. Закрывать (guān).\nЭта графема восходит к иероглифу , который состоял из элемента (ворота)\nи элемента в середине, видимо, изображавшего руки. В упрощенной форме этот\nиероглиф стал писаться как\nСамостоятельно графема употребляется в значениях закрывать, связывать.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Отец (f).\nЭта графема восходит к изображению руки, держащей символ семейной власти.\nВ современном китайском языке она употребляется самостоятельно в своем исходном\nзначении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Правая рука, опять, снова (yu).\nРисунок, от которого произошла эта графема, изображал ладонь правой руки, однако\nв современном китайском языке графема стала употребляться в значениях опять,\nснова; еще, к тому же.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Пара (shuāng [шуан]).\nЭта графема восходит к изображению двух птиц в руке (), в то время как графема\n()— одной птицы в руке. В упрощенной форме она стала писаться как пара рук ().\nЭту графему также можно считать сложным иероглифом.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Следовать.\nПредположительно, эта графема изображала след или идущего человека и имеет также\nзначения медленно идти и бродить, однако в своем современном написании она очень\nпохожа на графемы, восходящие к изображению ладони, поэтому мы условно отнесли ее\nк этой группе графем.\nГрафема может употребляться только в качестве компонента сложных иероглифов.\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Бить.\nДревняя пиктограмма, к которой восходит эта графема, изображала руку, держащую\nпалку. Она очень похожа на графему (следовать), однако их отличает разное количество черт.\nЭта графема может употребляться только в качестве компонента сложных иероглифов,\nгде всегда пишется в правой части иероглифа.\nВ редких случаях графема может иметь написание .\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Ветка, поддерживать (zhī [чжи]).\nРисунок, к которому восходит эта графема, изображал руку, держащую ветку. Она очень\nпохожа на вариант графемы (бить).\nВ современном китайском языке она чаще всего употребляется в значениях подпирать,\nподдерживать, а в качестве компонента всегда пишется в правой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Пика.\nЭта графема восходит к изображению руки, держащей некое древнее оружие, возможно\nпику.\nОна может употребляться только в качестве компонента сложных иероглифов, где всегда\nпишется справа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Переворачиваться (fӽf n).\nРисунок, ставший прообразом этой графемы, изображал руку, которая что-то переворачивает.\nВ современном китайском языке она употребляется в значениях переворачиваться, опрокидываться; наоборот, вопреки, а в качестве компонента обычно пишется в правой части\nиероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n15. Друг (yu).\nЭта графема не входит в список ключей, однако употребляется достаточно часто. Она\nвосходит к изображению двух соединенных рук.\nВ качестве самостоятельного иероглифа графема употребляется в своем исходном значении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Иметь, обладать (yu).\nЭта графема также не входит в список ключей, однако употребляется очень часто.\nПо всей видимости, она восходит к изображению руки, держащей кусок мяса.\nВ качестве самостоятельного иероглифа графема употребляется в своем исходном значении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Левый (zu).\nЭта графема также не входит в список ключей, однако употребляется очень часто.\nДревний рисунок, от которого она произошла, изображал левую руку, держащую во время какой-то работы вспомогательный инструмент, возможно линейку.\nВ современном китайском она употребляется самостоятельно в значениях левый; неправильный, ошибочный.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. Правый (yu).\nЭта графема также не входит в список ключей, однако употребляется очень часто.\nДревний рисунок, от которого она произошла, изображал правую руку и рот, то есть обозначал руку, которой едят.\nВ современном китайском языке она употребляется самостоятельно в своем исходном\nзначении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Цунь, вершок, дюйм (cn).\nДревняя пиктограмма, к которой восходит эта графема, изображала руку с нанесенной\nна нее отметкой, фиксирующей китайскую меру длины цунь, равную 3,3см.\nВ качестве самостоятельного иероглифа она может также употребляться в значении\nдюйм.\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n20. Орудие письма (y).\nДревняя пиктограмма, к которой восходит эта графема, изображала руку, держащую\nдревнее орудие письма, и черточку, символизирующую надпись.\nДанная графема практически вышла из самостоятельного употребления в современном\nкитайском языке, а в качестве ключа обычно выделяют ее сокращенный вариант— графему .\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n21. Книга (shū [шу]).\nЭта графема является упрощенной формой иероглифа, изображающего руку, держащую\nорудие письма и пишущую на бамбуковой дощечке.\nВ современном китайском языке она употребляется самостоятельно в значениях книга,\nдокумент; писать.\nХотя данная графема не выступает в роли компонента, этот иероглиф в современном\nкитайском языке употребляется очень часто.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЧТЕНИЕ ГРАФЕМ","t (l)— сила;\nt (f)— отец;\nt (fӽf n)— переворачивать;\nt (cn)— цунь, вершок, дюйм;\nt (kāi)— открывать;\nt\n(guān)— закрывать;\nt (tiān)— небо;\nt (tin)— поле;\nt (nin)— год;\nt (din)— электричество;\nt (qin)— нехватка;\nt (quӽn)— собака (устар.);\nt (jin)— видеть;\nt\n(yu)— иметь;\nt (yu)— друг;\nt (yu)— (правая рука), опять, и;\nt (yu)— правый;\nt (zu)— левый;\nt (y\ny )— дождь;\nt (y)— рыба;\nt (y\ny )— крылья, перья;\nt (y)— орудие письма;\nt (n)— женщина;\nt ѥ (yn)— облако;\nt\n(yu)— месяц;\nt (xu)— пещера."],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\n\nҜ\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Назовите и сравните графемы:\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\nѰӚ\n\nҜ\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям):\n,, ,\n, ,, , ,\n6. Потренируйтесь бегло читать следующие графемы:\n\nӇ\n7. Потренируйтесь бегло читать следующие сложные слова и словосочетания:\n, , , ,\n,с, сҼ, ,с, Ӈ,.\n8. Переведите на китайский и запишите иероглифами сложные слова и словосочетания:\nвосток и запад, вещи, идти пешком, сверху и снизу, старый человек, верхняя сторона, нижняя\nсторона, на небе, под небом, Поднебесная, идет дождь, пошел дождь\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n\n \n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nЛичный, частный\nСила (l)\nРука (shu [шоу])\nВариант\nПроизводная\nграфема\nПриветствие\nОткрывать (kāi)\nЗакрывать (guān)\nОтец (f)\n(Правая рука);\nопять (yu)\n\n \nПара (shuāng\n[шуан])\nСледовать\nБить\nВариант\nВетка (zhī [чжи])\nПика\nПереворачивать\n(fӽf n)\nДруг (yu)\nИметь, обладать\n(yu)\nЛевый; слева (zu)\nПравый; справа\n(yu)\nЦунь; вершок;\nдюйм (cn)"]],"12":[["Начало урока","Орудие письма\n(y)\nВариант\nКнига (shū [шу])"],["ФОНЕТИКА","ИНИЦИАЛИ ZH, CH, SH, R\nВ этом уроке мы рассмотрим инициали zh, ch, sh, r в сочетании с изученными в предыдущих уроках\nфиналями (табл.12.1 и 12.2). А в конце урока мы подведем итоги изучения звуков китайского языка\nи выучим китайский фонетический алфавит.\nТаблица 12.1. Короткие cлоги, образуемые инициалями zh, ch, sh, r\nИнициали/\nфинали\na [a]\ne []\ni []\nu [u]\nai [ai]\nei [ei]\nao [u] ou [ou] ua [u] uo [uo]\nzh [t]\n\nzha\nzhe\nzhi\nzhu\nzhai\nzhei\nzhao\nzhou\nzhua\nzhuo\nch [t]\ncha\nche\nchi\nchu\nchai\nchao\nchou\nchua\nchuo\nsh []\nsha\nshe\nshi\nshu\nshai\nshei\nshao\nshou\nshua\nshuo\nr []\n\nre\nri\nru\nrao\nrou\nruo\nТаблица 12.2. Длинные слоги, образуемые инициалями zh, ch, sh, r\nИнициали/\nфинали\nuai\n[uai]\nui\n[uei]\nan\n[an]\nen\n[n]\nun\n[un]\nuan\n[uan]\nang\n[ŋ]\neng\n[ŋ]\nong\n[uŋ]\nuang\n[uŋ]\nzh [t]\n\nzhuai\nzhui\nzhan\nzhen\nzhun\nzhuan\nzhang\nzheng\nzhong\nzhuang\nch [t]\nchuai\nchui\nchan\nchen\nchun\nchuan\nchang\ncheng\nchong\nchuang\nsh []\nshuai\nshui\nshan\nshen\nshun\nshuan\nshang\nsheng\nshuang\nr []\n\nrui\nran\nren\nrun\nrang\nreng\nrong"],["Комментарий","Звуки zh, ch, sh, r относят к переднеязычным аффрикатам. При их произнесении кончик языка поднимается к альвеолам и загибается назад (рис.12.1\n\n \nКитайский звук, передаваемый сочетанием sh [], очень похож на русский звук ш, но при произнесении китайского sh кончик языка поднимается высоко к альвеолам, почти соприкасаясь с ними, и слегка загибается\nкверху и назад.\nКитайский согласный звук r [] в качестве инициали похож на что-\n\nто среднее между русским ж и английским r. Он произносится так\nже, как ж, но с загнутым наверх кончиком языка, от sh он отличается\nтолько участием голосовых связок.\nКитайский звук ch [t] сильно отличается от русского ч. Если при произнесении русского ч кончик языка опущен, то при произнесении китайского ch язык сначала образует смычку с альвеолами, а затем, образуя щель, слегка загибается кверху и назад, по звучанию получается\nпохоже на сочетание тш. Этот звук произносится с придыханием. Кроме\nтого, в отличие от звука ч, который всегда мягкий, звук ch всегда твердый и никогда не смягчается, тоесть сочетания cha, chu произносятся как тша, тшу, а не как ча, чу.\nКитайский согласный звук [t]\n, передаваемый буквосочетаниемzh, артикулируется так же, как ch,\nно отличается от него звонкостью и отсутствием придыхания. Он похож на сочетание чж.\nПосле согласных zh, ch, sh, r употребляется особая финаль [], передаваемая буквой i, однако по\nпроизношению больше похожая на русский звук ы. Кроме того, ее особенностью является согласный призвук. Мы уже встречали особую финаль [] в слогах zi, ci, si, финаль [] звучит немного\nпо-другому, что связано с различным положением языка при произнесении согласных, предшествующих этой гласной. Принцип ее произнесения остается тем же: нужно после произнесения согласного звука с таким же положением языка и остальных органов речи произнести звук ы, при этом\nкак бы растягивая согласный звук."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 12.1.1\n1. Прочитайте, повторяя за диктором, инициали zh/ch/sh/ r по отдельности и в сочетании с особой\nфиналью:\nzh zhī ch chī sh shī\nr rī\nCD 12.1.2\n2. Прочитайте, повторяя за диктором, инициали zh/ch/sh/ r в сочетании с простыми финалями:\nzhā ch shӽ ro zhē ch shě r zhū ch sh r zhī ch shӿ r\nCD 12.1.3\n3. Прочитайте, повторяя за диктором, слоги с контрастными инициалями zh/z/j/d, ch/c/q/t, sh/s/x:\nzhī z jӿ d\nzhā z jiӽ di\nzhē z jiě di\nzhū z ji di\nchī c qӿ t\nchā c qi\nchē c qiě ti\nchū c qi\nshī s x\nshā s xi\nshē s xi\nshū s xi\nCD 12.1.4\n4. Прочитайте, повторяя за диктором, пары придыхательных и непридыхательных инициалей:\nbō pō dē tē gē kē jī qī zī cī zhī chī\nРис. 12.1. Техника\nпроизнесения звуков\nzh, ch, sh, r\n\n \nCD 12.1.5\n5. Прочитайте, повторяя за диктором, следующие слоги в тех тонах, в которых они употребляются:\nzhā zh zhӽ zh\nzhē zh zhě zh\nzhī zh zhӿ zh\nzhū zh zh zh\nzhāi zhi zhӽi zhi\n- - - zhi\nzhāo zho zhӽo zho\nchōu chu chu chu\nchuā - - -\nchuō - - chu\nchuāi chui chuӽi chui\nchuī chu - -\nchān chn chӽn chn\nshāng - shӽng shng\nshēn shn shěn shn\nshēng shng shěng shng\n- - shn shn\nshuān - - shun\nshuāng - shuӽng -\n- - rě r\n- - - r\n- r r r\n- ro rӽo ro\n- ru - ru\n- ru - ru\n- ru ruӿ ru\nrn rӽn -\nrāng rng rӽng rng\n- rn rěn rn\nrēng rng - -\nrōng rng rng -\n- rn - rn\nCD 12.1.6\n6. Прочитайте, повторяя за диктором, а затем выучите китайский фонетический алфавит:\nb p m f d t n l g k h j q x zh ch sh r z c s w y a o e i u\nCD 12.1.7А\n7. Прочитайте, повторяя за диктором, следующие скороговорки:\nQīng cӽocng\nЗеленая трава\nQīng cӽocng, cӽocng qīng, Зеленая трава, трава зеленая,\nQīngqīng cӽo lӿ c\nӿ ӽo qīngchng. В зеленой траве сидит зеленая гусеница.\nQīngchng zuānjn qīng\ncӽocng,\nЗеленая гусеница забралась в зеленую\nтраву,\nQīng cӽocng qīng cӽochng\nqīng.\nЗеленая трава зеленая и гусеница зеленая.\nCD 12.1.7Б\nCn h chn\nГусеница шелкопряда и цикада\nCn sh cn, chn sh chn,\nГусеница— это гусеница, цикада— это\nцикада.\nChī sāng y sh cn,\n\nЕст листья тутового дерева гусеница,\nT chng sī sh cn,\n\nВырабатывает шелковое волокно тоже\nгусеница,\nCng zi shy shng\n\nПрячется в листьях дерева\nChnggē de sh chn.\n\nИ поет цикада."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 12.2.1\n1. Прочитайте следующие односложные слова, повторяя за диктором:\nt shng ()— сверху, на, начинать;\nt\nch ()— чай;\nt\nchē ()— средство передвижения; автомобиль;\nt\nchī ()— есть, кушать;\n\n \nt shī ()— (в сочетании) учитель;\nt\nzhōng (Ё)— средний; китайский;\nt\nshān ()— гора;\nt\nshӽo ()— мало;\nt shū (к)— книга;\nt\nsh (\n)— дерево;\nt shuō ()— говорить;\nt\nshuӿ ()— вода;\nt\nzh ()— это;\nt\nsh ()— быть, являться;\nt\nrn (Ҏ)— человек;\nt\nr ()— жаркий, горячий, жарко.\nCD 12.2.2\n2. Прочитайте следующие двусложные слова и словосочетания, повторяя за диктором:\ny\nhishi ()— или;\ny\nzhli ()— здесь;\ny\nshi ()— кто;\ny\nshide()— чей;\ny\nshnme (ҔМ)— что, какой;\ny\nshnme shhou (ҔМ)— когда;\ny\nwishnme (ЎҔМ)— почему;\ny\nZhōnggu (Ё)— Китай;\ny\nzhōnggurn (ЁҎ)— китаец,\nгражданин Китая;\ny\nZhōngwn (Ё) или Hny\ny ()—\nкитайский язык;\ny\ngu (\n) или lusī (\n)— Россия;\ny\ngurn (\nҎ) или lusīrn (\n\nҎ\ng\n)— россиянин;\ny\nRběn ()— Япония;\ny\nrběnrn (Ҏ)— японец;\ny\nYīnggu ()— Англия;\ny\nyīnggurn (Ҏ)— англичанин;\ny\nMěigu ()— Америка;\ny\nměigurn (Ҏ)— американец;\ny\nFӽgu ()— Франция;\ny\nfӽf gurn (Ҏ)— француз;\ny\nDgu ()— Германия;\ny\ndgurn (Ҏ)— немец;\ny\nlӽoshī ()— учитель;\ny\njioshī ()— преподаватель;\ny\nhē ch ()— пить чай;\ny\nhē shuӿ ()— пить воду;\ny\np shān ()— забираться на горы;\ny\np sh (\n)— забираться на деревья;\ny\nkāi chē ()— водить машину;\ny\nshng wӽng ()— выходить в Интернет;\ny\nshngk ()— начинать урок, заниматься;\ny\nknshū (к)— читать (дословно: читать\nкнигу);\ny\njiāoshū (к)— преподавать (дословно:\nпреподавать книгу);\ny\nshuōhu ()— разговаривать (дословно:\nговорить речь);\ny\nchīfn ()— есть, кушать (дословно:\nесть вареный рис);\ny\nchnggē ()— петь (дословно: петь\nпесни).\nCD 12.2.3\n3. Прочитайте следующие предложения, повторяя за диктором:\nZh sh shnme? — Zh sh shū. (ҔМ— к)— Что это? — Это книга.\nZh sh shnme shū? — Zh sh Zhōngwn shū. (ҔМк— к)— Какая это\nкнига? — Это книга(и) на китайском языке.\nN sh shnme? — N sh w de pbāo. (ҔМ—\n)— Что то? — Это моя\nсумка.\nZh sh shu? — Zh sh w de pngyou. (—\n)— Кто это? — Это мой\nдруг.\nN sh shu? — N sh w Hny\ny lӽoshī. (—)— Кто это? — Это мой\nучитель китайского языка.\n\n \nTā sh shu? — Tā sh w gēge. (Ҫ Ҫ)— Кто он? — Он мой старший брат.\nZh sh shu de bӿ? — Zh sh w de bӿ. (— ) — Чья это ручка? —\nЭто моя ручка.\nNӿ wishnme xu hny\ny ? — Hny\ny\nhěn hӽotīng. (ЎҔМ— ) —\nПочему ты учишь китайский язык? — Китайский язык очень красивый (благозвучный).\nNӿ shnme shhou li? (ҔМ)— Когда/во сколько ты придешь?\nZh sh mobӿ hishi qiānbӿ? — Zh sh qiānbӿ. (— )— Это\nкисть или карандаш? — Это карандаш.\nNӿ i hē ch hishi i hē shuӿ? — W i hē ch. (— )— Ты\nлюбишь пить чай или (любишь пить) воду? — Я люблю пить чай.\nNӿn gu xng? — W xng Wng. (\n— (Как) ваша (драгоценная) фамилия? — Моя фамилия Ван.\nNӿ xng shnme? — W\nӿ\nxng Wng, jio Wng Xiӽoyn. (\nҔМ—\nѥ)—\nКак твоя фамилия? — Моя фамилия Ван, [меня] зовут Ван Сяоюнь.\nNӿ jio shnme mngz? — W jio Wng Huā. (ҔМ— )— Как тебя\nзовут? (Каким именем тебя зовут?) — Меня зовут Ван Хуа.\nNӿ jio shnme mngz? — Wde mngz jio Ānn. (ҔМ—)—\nКак тебя зовут? — Меня зовут Анна.\nNӿ sh nӽ gu rn? — W sh zhōnggurn. (Ҏ— ЁҎ)— Откуда ты? —\nЯ из Китая.\nNӿ sh-b-sh zhōnggurn? — Sh, w sh Zhōnggu rn. (ЁҎ— Ё\nҎ)— Ты из Китая? — Да, я из Китая.\nNӿ sh yīnggurn, sh-b-sh? — B, w b sh yīnggurn, w sh gurn. (Ҏ\n— Ҏ\nҎ\ngg\ngg\ny\ngg\ny\n)— Ты из Англии, да или нет? — Нет, я не из\nАнглии, я из России.\nNӿ sh rběnrn, sh ma? — Sh. (Ҏ— )— Ты из Японии, да? — Да.\nNӿ sh měigurn, b sh ma? — Sh, w\nӿ\nsh měigurn. (Ҏ—\nҎ)— Ты из Америки, не так ли? — Да, я из Америки.\nNӿ sh rběnrn hi sh zhōnggurn? — W\nӿ\nsh zhōnggurn. (ҎЁҎ—\nЁҎ)— Ты из Японии или из Китая? — Я из Китая.\nNӿ sh n\nӿ\nӽli rn? — W sh Běijīng rn. (Ҏ—\nҀҎ)— Из какого ты места/\nгорода? — Я из Пекина.\nCD 12.2.4\n4. Прочитайте, повторяя за диктором, переведите и выучите следующий диалог:\n— Nӿ hӽo!\n\n— Nӿ hӽo!\n\n— Nӿ xng shnme?\n\nҔМ\n— W xng Wng, jio Wng Xiӽoyn. Nӿ jio\nshnme mngz?\n\nѥҔМ\n— W jio Anna.\n\n \n— Nӿ sh nӽ gurn?\nҎ\n— W sh gurn, nӿ sh zhōnggurn ma?\n\nҎЁҎ\n— Sh, w sh zhōnggurn.\nЁҎ\n— Nӿ sh nӽli rn?\nҎ\n— W sh Běijīng rn.\n\nҀҎ\n— Rnshi nӿ w hěn gāoxng!\n\n— Rnshi nӿ w yě hěn gāoxng!\nг\n\nВ этом диалоге используются новые слова: rnshi ()— познакомиться, узнать; gāoxng\n)— радоваться.\nКомментарии\n1. Предложение с составным именным сказуемым.\nСоставное именное сказуемое — это сказуемое, которое состоит из глагола-связки sh— быть,\nявляться (аналог английского глагола\nя\nto be) и именной части, которая обычно выражена существительным, например:\nW sh zhōnggurn.— Я китаец. Tā sh dxushēng.— Он студент.\nТо есть в этих предложениях sh является глаголом-связкой, а Zhōnggurn и dxushēng —\ng\nименными частями сказуемых, выраженными существительными.\nОтрицание в таких предложениях образуется с помощью отрицания b, которое ставится перед\nsh, в результате появляется устойчивое словосочетание b sh — не являться, где b меняет свой\nэтимологический четвертый тон на второй:\nW b sh zhōnggurn.— Я не китаец. Tā b sh dxusheng.— Он не студент.\nОбщий вопрос в таком предложении может образовываться с помощью частицы ma, например:\nTā sh dxusheng ma?\nТого же самого можно добиться посредством удвоения глагола-связки, например:\nTā sh-b-sh dxusheng?\n2. Вопросительные концовки sh-b-sh?, sh ma?, b-sh ma?.\nГлагол sh также может образовывать три основных типа вопросительных концовок: sh-b-\nsh?— да или нет?, sh ma?— да?, b-sh ma?— не так ли?, например:\nTā sh dxusheng, sh-b-sh? — Он студент, да или нет?\nTā sh dxusheng, sh ma? — Он студент, да?\nTā sh dxusheng, b sh ma? — Он студент, не так ли?\nСтоит отметить, что такие концовки могут употребляться с любыми типами предложений, например:\nNӿ xu hny\nӿ\n, sh ma?— Он учит китайский, да?\n3. Альтернативный вопрос.\nАльтернативный вопрос в китайских предложениях образуется с помощью союза hish — или:\nNӿ sh rběnrn hish zhōnggurn?\nӿ\n— Ты из Китая или из Японии?\nЕсли альтернативный вопрос задается к дополнению в предложении с глагольным сказуемым,\nто сказуемое при этом дублируется:\n\n \nNӿ i hē ch hish\nӿ\ni i hē shuӿ?— Ты любишь пить чай или (любишь пить) воду?\nОбратите внимание, что этот союз употребляется только в вопросительных предложениях.\n4. Вопрос о фамилии.\nВ китайском языке употребляются два вопроса о фамилии. Nӿn guxng? и Nӿ xng shnme?\nӿ\nПервый из них в основном используется в официальной обстановке или когда хотят задать вопрос\nподчеркнуто вежливо. Такой вопрос буквально переводится так: (Как) ваша драгоценная фамилия? Второй вариант употребляется в остальных случаях. У иностранцев китайцы обычно фами\nлию не спрашивают.\nПри ответе на вопрос о фамилии можно назвать только свою фамилию, а можно сразу и фамилию и имя. Нужно запомнить, что у китайцев вначале всегда располагается фамилия, которая\nчаще всего состоит из одного иероглифа, а потом имя, чаще всего состоящее из двух иероглифов.\nДругой порядок невозможен.\n5. Вопрос о гражданстве.\nВопрос Nӿ sh n\nӿ\nӽ gu rn? иногда переводят как Кто ты по национальности?, а ответ W sh\nzhōnggurn.— как Я китаец. Однако это не совсем верно, поскольку это больше вопрос о гражданстве, и правильнее перевести данный диалог следующим образом: Откуда ты? —\nЯ из Китая, поскольку слово zhōnggurn означает гражданство, а не национальность.\n6. Глагольно-объектные конструкции в китайском языке.\nВ китайском языке есть несколько так называемых слов глагольно-объектного типа, которые являются глаголами, но при этом состоят из двух частей: глагольной и именной. Глагольная часть\nобозначает действие, а именная— объект этого действия, например: shuōhu ()— говорить (дословно: говорить речь); chīfn ()— есть, кушать (дословно: кушать вареный рис)."],["ЗАДАНИЯ","CD 12.3.1\n1. Слушая звукозапись, определите правильный тон и обведите нужную финаль:\nt\nzhā zh zhӽ zh;\nt chān chn chӽn chn;\nt\nshēng shng shěng shng;\nt\nchuāi chui chuӽi chui;\nt zhāi zhi zhӽi zhi;\nt\nzhī zh zhӿ zh;\nt\nshēn shn shěn shn;\nt\nchōu chu chu chu;\nt\nshāng - shӽng shng.\nCD 12.3.2\n2. Слушая звукозапись, поставьте правильный тон:\nzhe chao ri chang shen rang zhuan sha che shuai zhang shuo rao shuang re zheng\nCD 12.3.3\n3. Слушая звукозапись, впишите нужную инициаль (zh/ch, sh/r):\n__ā __ā, __u __u, __u __u, __ __, __āng __āng, __ __, __ӽn __ӽn, __u __u\nCD 12.3.4\n4. Слушая звукозапись, напишите диктант:\n__________________________________________________________________________________\n\n \n5. Переведите c русского на китайский:\nЧто это?— Это газета моего старшего брата.\n__________________________________________________________________________________\nКакая это газета?— Это газета на английском языке.\n__________________________________________________________________________________\nЭто что?— Это мои (кожаные) ботинки.\n__________________________________________________________________________________\nКто это?— Это мой младший брат.\n__________________________________________________________________________________\nКто это?— Это мой преподаватель английского языка.\n__________________________________________________________________________________\nЧья эта кисть?— Это кисть моей младшей сестры.\n__________________________________________________________________________________\nПочему ты учишь английский язык?— Английский язык благозвучен и прост в изучении.\n__________________________________________________________________________________\nТы студент или преподаватель?— Я студент.\n__________________________________________________________________________________\nТу учишь японский язык или (учишь) китайский язык?— Я учу китайский язык.\n__________________________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: РАЗЛИЧНЫЕ ЧАСТИ ТЕЛА\nВ данном уроке мы рассмотрим графемы, которые восходят к изображениям других частей тела\n(табл.12.3).\nТаблица 12.3. Графемы, связанные с изображением различных частей тела\nГрафемы\nТранскрипция\nЗначение\n\nyuē\nговорить (устар.)\n\ngān\nсладкий\nsh\nязык\n\nyn\nслова; речь\n\nyīn\nзвук\n\nxiōng\nстарший брат\n(в сочетаниях)\n\ndu\nменять, разменивать\nГрафемы\nТранскрипция\nЗначение\n\nm\nглаз (устар.)\n\nzh\nпрямо\n\nchn\n(слуга); чиновник\n\nz\n(нос); сам, свой\n\nb\nнос\něr\nухо\n\ny\n(голова); страница\n\n \nГрафемы\nТранскрипция\nЗначение\n\ntu\nголова\n\nshu\nголова; макушка\n\ny\nзуб\n\nchӿ\nзубы\nГрафемы\nТранскрипция\nЗначение\n\nr\n(усы); предлог «да, и»\n\nmin\nлицо\nxīn\nсердце; душа\nВ качестве ключей из них обычно используют графемы:\n, ,,, , ,,, ,, ,, ,,, ,, ,.\n1. Говорить (yuē) (устар.).\nЭта графема изображает рот и вылетающие из него слова в виде горизонтальной черты. Она практически идентична графеме (солнце) лишь с тем отличием, что графема\nсолнце вытянута вертикально, а графема говорить — горизонтально.\nВ современном китайском языке эта графема практически вышла из самостоятельного\nупотребления, а в значении говорить сегодня употребляется слово (shuō).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. Сладкий (gān).\nЭта графема, по всей видимости, восходит к изображению рта с чем-то сладким внутри.\nВ современном китайском языке она употребляется в качестве самостоятельного иероглифа в своем исходном значении, а в качестве компонента встречается достаточно редко.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Язык (sh).\nРисунок, к которому восходит эта графема, по одной из версий изображал раздвоенный\nязык, высунутый изо рта.\nВ современном китайском языке употребляется самостоятельно в своем исходном значении.\nВ качестве компонента иероглифа графема может писаться с горизонтальной чертой\nсверху вместо нисходящей.\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n4. Слова, речь (yn).\nСейчас сложно сказать, что изображала древняя пиктограмма, к которой восходит эта графема. Скорее всего, она изображала что-то, что выходит изо рта,\nв данном случае— слова. Однако при этом очевидно ее сходство с графемой .\nВ современном китайском языке эта графема употребляется самостоятельно\nв исходном значении, а в качестве компонента упрощенных иероглифов всегда\nпишется так: .\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Звук (yīn).\nСчитается, что эта графема восходит к изображению рта, флейты и звуков в виде горизонтальных линий, которые из нее исходят.\nОчевидна ее связь с графемами и . Самостоятельно она употребляется в своем\nисходном значении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n6. Старший брат (xiōng).\nЭта графема изображает человека с большим ртом. По всей видимости, ее смысл заключается в том, что старший брат — это тот, чьи слова имеют авторитет, и тот, кто может\nговорить младшим братьям и сестрам, что им делать.\nВ современном китайском языке этот иероглиф употребляется самостоятельно только\nв сочетаниях с другими, а более современное слово, обозначающее старшего брата,—\n(gēge).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Менять, разменивать (du).\nЭта графема восходит к рисунку, изображающему человека, который что-то говорит. Ее\nизначальное значение, видимо, было обмениваться словами.\nИероглиф также может означать обмен (валюты).\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n8. Глаз (m) (устар.).\nЭта графема представляет собой повернутое вертикально изображение глаза.\nВ современном китайском языке в своем изначальном значении она употребляется только в сочетаниях, в то время как более современное слово, обозначающее глаз,—\n(yӽnjing), где графема выступает в роли детерминатива обоих иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Прямо (zh).\nЭта графема восходит к изображению глаза и прямой черты, что означало смотреть\nпрямо.\nВ современном китайском языке она употребляется самостоятельно в исходном значении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Слуга, чиновник (chn).\nЭта графема восходит к изображению глаза, повернутого вертикально, что подразумевало слугу, который всегда держит голову опущенной и не может прямо смотреть на своего\nхозяина.\nВ современном китайском языке этим иероглифом стали обозначать министров и чиновников. В качестве компонента упрощенных иероглифов графема может писаться в виде\nдвух вертикальных черт.\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Сам, свой (z), нос (b).\nГрафема восходит к изображению носа, однако современное ее значение сам,\nсвой. Обычно она употребляется в сочетании (zjӿ—\nӿ\nсам, свой).\nИероглиф правильнее было бы отнести к фоноидеограммам, поскольку он\nсостоит из детерминатива (нос) и фонетика\nb), однако его принято относить к графемам.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n12. Ухо (ěr).\nЭта графема восходит к изображению уха.\nВ современном китайском языке она употребляется самостоятельно в сочетании\n(ěrduo — ухо). В качестве компонента она может иметь несколько сокращенное написание.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Страница (y).\nЭта графема восходит к изображению человека с большой головой, и изначально она\nимела значение голова, однако в современном китайском она самостоятельно употребляется в значении страница.\nВ качестве компонента она всегда пишется в правой части иероглифа.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Голова (tu).\nГрафемаявляется упрощенной формой фоноидеограммы , состоящей из детерминатива\n\n(голова) и фонетика (du), представляющего собой более поздний вариант\nграфемы\n\n. Сокращенная форма иероглифа изображает человека с головой, обозначенной двумя точками.\nГрафема помимо основного значения может употребляться в значении первый, кроме\nтого, она часто выступает в роли суффикса.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Макушка, голова (shu).\nЭта графема изначально восходит к изображению головы с волосами на макушке. В современном китайском языке она также может употребляться в значении голова, но в основном\nв сочетаниях.\nВ качестве компонента она всегда пишется справа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n16. Зуб (y).\nЭта графема восходит к изображению зуба, однако в своем современном написании\nимеет с ним мало сходства, зато она очень похожа на русскую букву я и читается\nтакже— y.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Зубы (chӿ).\nГрафема восходит к рисунку, изображавшему рот, полный зубов. Но обычно зубы\nв современном китайском языке обозначаются сразу двумя иероглифами— (ychӿ\nh ).\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. (Усы), да, и (r).\nДревняя пиктограмма, к которой восходит эта графема, изображала лицо с усами. В современном китайском языке она, однако, употребляется самостоятельно в качестве предлога:\nда, и, к тому же.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Лицо (min).\nПиктограмма, к которой восходит эта графема, изображала овал лица с глазом внутри.\nВ современном китайском языке она употребляется в исходном значении, но в основном в сочетаниях, а более современное слово для обозначения лица— (liӽn).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n20. Сердце, душа (xīn).\nГрафема восходит к изображению человеческого сердца. В современном\nкитайском языке иероглиф употребляется в своем исходном значении, также он\nможет означать душа.\nГрафема является производной от . Она всегда пишется в левой части\nиероглифа и указывает на сферу чувств и эмоций.\nВариант написания:\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Назовите и сравните графемы:\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\nҧ\nѪ\n\n5. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям):\n,, ,Ӱ, ,.\n6. Потренируйтесь бегло читать следующие графемы:\n\nӰ\nрҜ\n7. Потренируйтесь бегло читать следующие сложные слова и словосочетания:\n, , , Ӱ, , , , , , ,\n, , , , , , , , , ,\n, , , , , , Ӱ, Ӱ, Ӱ, р\n\n \n8. Переведите на китайский и запишите иероглифами:\nпогода, друг, мужчины и женщины, родители, открывать дверь, закрывать дверь, есть/идет\nдождь, слева и справа, левая рука, правая рука, левая нога, правая нога\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nГоворить (yuē)\n(устар.)\nСладкий (gān)\nЯзык (sh)\nВариант\nСлова; речь (yn)\nПроизводная\nграфема\nЗвук (yīn)\nСтарший брат\n(xiōng)\nМенять (du)\n\n \nГлаз (m) (устар.)\nПрямо (zh)\n(Слуга), чиновник\n(chn)\nВариант\n(Нос), сам, свой\n(z)\nНос (b)\nУхо (ěr)\nВариант\n(Голова); страница\n(y)\nГолова (tu)\n(Макушка); голова\n(shu)\nЗуб (y)"]],"13":[["Начало урока","Зубы (chӿ)\n(Усы); да, и (r)\nЛицо (min)\nСердце (xīn)\nВариант\nПроизводная\nграфема"],["ФОНЕТИКА","ЭРИЗАЦИЯ\nЭризацией1 называют добавление в конце слова суффикса -r. Суффикс -r генетически восходит к древ\nr\nнему знаменательному слову (r)— сын. В отличие от остальных суффиксов китайского языка\nсуффикс -r ассилабичен, тоесть не составляет отдельного слога, а просто добавляется к основному\nr\nслогу, например: huār —\nr\nцветок.\nЭтот суффикс в основном употребляется с существительными, выполняя различные функции.\n1. Он может придавать им уменьшительно-ласкательный оттенок, например:\n(gn)— палка —> (gnr)— палочка;\n(xiӽomāo)— кошка, котенок —>\nк\n(xiӽomāor)— кошечка, котеночек.\n1 Частое использование эризации характерно для пекинского диалекта, особенно для устной речи пекинцев. В путунхуа\nэризация употребляется весьма ограниченно. В некоторых диалектах (в особенности южных) эризация может вообще\nне употребляться.\n\n \n2. Он позволяет различать существительные с близким или производным смыслом:\n(tu)— голова —> (tur)— начальник;\n(min)— мука —> (minr)— порошок.\n3. Он может служить для образования существительных из глаголов и прилагательных:\n(hu)— рисовать —> (hur)— рисунок;\n(duӽn)— короткий —> (duӽnr)— недостаток.\n4. В редких случаях он может употребляться с глаголами и наречиями:\n(wnr)— играть, развлекаться;\n(y diӽnr)— немного.\nУ эризации существуют определенные правила, вот основные из них:\nСуффикс -r добавляется не ко всем слогам.\nЕсли слог, с которым употребляется данный суффикс, заканчивается любой гласной, то суффикс -r просто добавляется к нему, а слог читается так же, как и пишется:\n(huā + er = huār)— цветок;\n(t + er = tr)— зайчик.\nЕсли слог, с которым употребляется данный суффикс, заканчивается согласной n, то при произношении этот конечный звук слога редуцируется, однако в орфографическом написании\nслова непроизносимый элемент сохраняется для соблюдения единства с исходной морфемой,\nнапример следующее слово пишется wnr:\n(wn + er = wr, но пишется wnr)— играть, развлекаться.\nЕсли слог, с которым употребляется данный суффикс, заканчивается сочетанием ng, передающим заднеязычный звук [ŋ], то этот звук редуцируется частично, а суффикс -r как бы\nнаслаивается на него:\n(png +\ng\ner = pngr)— бутылка.\nЕсли слог заканчивается особой финалью i [], [] или финалью ui, то звук, передаваемый\nбуквой i, читается как e:\n(z + er = zr, но пишется zr) — иероглиф;\nџ (sh + er = shr, но пишется shr) — дело, занятие;\nӮ (hu + er = hur, но пишется hur) — миг, мгновение.\nСОЧЕТАНИЕ СЛОГОВ В РАЗЛИЧНЫХ ТОНАХ СО СЛОГАМИ В НУЛЕВОМ ТОНЕ\nИ СУФФИКСЫ -ZI, -TOU\nВ предыдущих уроках мы уже рассматривали сочетания со слогами в нулевом тоне в таких словах,\nкак bba, māma и др., где происходило удвоение слога, однако употребление слогов в нулевом\nтоне этим не исчерпывается.\nВ данном уроке мы будем отрабатывать чтение более сложных сочетаний.\nНаиболее часто образуют такие словосочетания безударные суффиксы -zi и -tou, которые мы рассмотрим далее, также могут встречаться сочетания различных слогов.\nПовторим еще раз правило сочетания слогов в четырех тонах со слогом в нулевом тоне: после первого,\nвторого и третьего тонов нулевой тон произносится ниже, а после третьего (самого низкого) тона,\nнаоборот, выше первого слога.\n\n \nКроме того, при сочетании третьего и нулевого, а также третьего и второго, третьего и четвертого\nтонов третий тон не имеет восходящей интонации, в таком положении он называется третьим\nнизким, или полутретьим, тоном (рис.13.1\nРис. 13.1. Сочетание слогов в нулевом тоне со слогами в четырех основных тонах\nСуффикс -zi, восходящий к древнему слову (zĭ)— сын, ребенок, является одним из важнейших\nсловообразовательных суффиксов китайского языка. Он представляет собой отдельный слог, поэтому при соединении с односложной знаменательной морфемой образуется двусложное слово, например: bĕnzi — тетрадь, yĭzi — стул, hizi — ребенок. В некоторых случаях он может нести уменьшительный или даже уничижительный смысл: (xiӽohgōuzi)— маленький ручьишко.\nСуффикс -zi произносится нейтральным тоном, высота которого определяется тоном предыдущего\nслога.\nСуффикс -tou, восходящий к слову (tu)— голова, также является важным словообразующим\nсуффиксом существительных, обозначающих предметы округлой или цилиндрической формы:\n\nуфф\nфф\n(shtou)— камень, (mtou)— бревно. Кроме того, он служит для образования существительных, обозначающих некоторые части тела или лица: (shtou)— язык; существительных, обозначающих единицу времени: (zhōngtou)— час; существительных (а также\nнаречий), обозначающих место:\n\nу\nр\n(hutou)— позади.\nСуффикс -tou в некоторых сочетаниях произносится в нулевом тоне, а в некоторых— во втором\nтоне, однако здесь мы будем его рассматривать только в нулевом тоне."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 13.1.1\n1. Прочитайте, повторяя за диктором, слоги с эризацией и без нее:\nгласные + -r\nhuā\nhuār\ndi\ndir\nmӽ\nmӽr\nb\nbr\ndōu\ndōur\nch\nchr\nnӽ\nnӽr\nt\ntr\nn + -r\njiān\njiānr\npn\npnr\ndiӽn\ndiӽnr\nyn\nynr\ngūn\ngūnr\npn\npnr\nzhn\nzhnr\nbn\nbnr\nng + -r\nbāng\nbāngr\npng\npngr\njӿng\njӿngr\nkng\nkngr\nxiāng\nxiāngr\nlng\nlngr\nshӽng\nshӽngr\ndng\ndngr\nфинали i [], [], ui c\ncr\nz\nzr\nhu\nhur\nCD 13.1.2\n2. Прочитайте, повторяя за диктором, слоги с эризацией в разном порядке:\npngr gānr mor lngr dāor xiӽngr cr nr mngr dur jiānr zur jīnr kur br\n\n \nCD 13.1.3\n3. Прочитайте, повторяя за диктором, слова с суффиксом -zi:\nqīzi\nwūzi\ndāozi\nbēizi\nzhuōzi\nfngzi\nhzi\nhizi\nyzi\nchzi\nyĭzi\nxiězi\nguŏzi\nchĭzi\nbĕnzi\ndngzi\nguzi\nmozi\nkzi\nbizi\nCD 13.1.4\n4. Прочитайте, повторяя за диктором, слова с суффиксом -tou:\nyātou\ngēntou\nchītou\nfēngtou\njīntou\nshtou\nshtou\nmntou\nqintou\nquntou\nlӿtou\ngtou\nzhӿtou\nmӽtou\ngӽotou\nmtou\nshngtou\nhutou\nnintou\nwitou\nCD 13.1.5\n5. Прочитайте, повторяя за диктором, различные двухсложные сочетания с нулевым тоном:\nyīfu nlai wmen zhge yuānyuan rzi nӿde zhme shēnshang pngyou zӽoshang gosu xiūxi\nshhou nӽge wile xiāoxi lile jiějie qguo guānxi mimao wěiba titai qīngchu mgu yude\nknguo zhīdao xusheng ěrduo wimian duōshao tngting wӽnshang knkan\nCD 13.1.6А\n6. Прослушайте следующие скороговорки, затем прочитайте их, повторяя за диктором:\nXiӽo pngr h xiӽo wӽnr\nБутылочка и чашечка\nYu yge xiӽo hir\n\nОдна маленькая девочка\nMngz jio Xiӽohuār,\n\nПо имени Сяохуа\nZushu n yge xiӽo pngr, В левой руке держит бутылочку,\nYushu n yge xiӽo wӽnr. В правой руке держит чашечку.\nXiӽo pngr miyu gir,\n\nУ бутылочки нет крышечки,\nXiӽo wӽnr yu xiӽo br.\n\nУ чашечки есть маленькая ручка.\nXiӽopngr h xiӽo wӽnr\n\nБутылочка и чашечка\nHěn hӽownr!\n\nТакие забавные!\nCD 13.1.6Б\nHuzi chīdio xiӽo tozi\n\nОбезьянка съела персик\nSh shng yu zhī xiӽo tozi,\n\nНа дереве висит персик,\nSh xi yu zhī xiӽo huzi.\n\nПод деревом сидит обезьянка.\nFēng chuī tosh huāhuā\nxiӽng,\n\nВетер подул, и персиковое дерево\nзаскрипело,\nSh shng dioxi xiӽo tozi,\n\nС дерева упал персик,\nTozi dӽzhe xiӽo huzi,\n\nПерсик стукнул обезьянку,\nHuzi chīdio xiӽo tozi.\n\nОбезьянка съела персик.\n\n \nCD 13.1.6В\nRtou, shtou, shtou h zhӿh tou\nӿ\nСолнце, камень, язык и палец\nTiān shng yu g rtou,\n\nНа небе (есть) солнце,\nD xi yu kui shtou,\n\nПод землей (есть) камень,\nZuӿ lӿ yu g shtou,\n\nВо рту (есть) язык,\nShu shng yu w\nw gе shu\nzhӿtou.\n\nѨ\nНа руке (есть) пять пальцев.\nBguӽn sh tiān shng de r\nrtou,\n\nНе важно, жаркое солнце на небе,\nD xi de yng shtou,\n\nТвердый камень под землей,\nZuӿ lӿ de ruӽn shtou,\n\nМягкий язык во рту,\nShu shng de shu zhӿtou,\n\nПять пальцев на руке,\nHishi r rtou, yng shtou,\n\nИли горячее солнце, твердый\nкамень,\nRuӽn shtou, shu zhӿtou,\n\nМягкий язык, пальцы на руке,\nFӽnzhng dōu sh lin shtou.\nВ любом случае все это тренирует\nязык."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 13.2.1\n1. Прочитайте следующие односложные слова, повторяя за диктором:\nt\nqīzi (\n)— жена;\nt rzi ()— сын;\nt\nhizi ()— ребенок;\nt fngzi ()— дом, фанза, квартира;\nt wūzi ()— комната;\nt\nzhuōzi ()— стол;\nt yĭzi ()— стул;\nt guzi ()— шкаф;\nt\ndāozi ()— нож;\nt shozi (\n)— ложка;\nt\nchāzi ()— вилка;\nt\nkuizi ()— палочки для еды;\nt bēizi ()— стакан;\nt\nhzi ()— коробка;\nt\nmtou ()— дерево (как материал);\nt\nshtou ()— камень;\nt\nshtou ()— язык (как орг
