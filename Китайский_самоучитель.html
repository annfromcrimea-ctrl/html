o y)— одна рыба.\n8. Газета (bo).\n\nСмысл этого иероглифа сейчас не совсем понятен. Вариант написания: .\nСостав: рука (shu): + f (элемент не имеет названия): .\nПример употребления: ӑ (y fn bo)— одна газета.\n9. Подставка (ti).\n\nСмысл этого иероглифа сейчас не совсем понятен. Полная форма написания: .\nСостав: личный (sī): + рот (ku): .\nПример употребления:\n(y ti shujī)— один мобильный телефон.\nАССОЦИАТИВНЫЕ ИЕРОГЛИФЫ (ИДЕОГРАММЫ)\n1. Дом, семья (jiā).\n\nИероглиф изначально означал помещение, где держали домашних животных, главными\nиз которых считались свиньи. Состав: крыша:\nд р\n+ свинья (shӿ): .\nПримеры употребления: (jiāli)— дома;\n(y jiā gōngsī)— одна компания.\n2. Учить (xu).\n\nЭтот иероглиф изначально изображал ребенка, который сидит в доме и овладевает знаниями. Полная форма написания: .\nСостав: крыша с тремя точками:\n+ сын (zӿ): + шерсть (mo): .\nПримеры употребления: д (xux)— учиться; (xusheng)— ученик;\n(dxushēng)— студент.\n3. Место (zu).\n\nИероглиф изначально означал сидеть под навесом. Элемент является фонетиком.\nСостав: навес: + место, сиденье (zu): .\nПримеры употребления: (y zu shān)— одна гора; (zuwi)— сиденье.\n4. Место, персона (wi).\n\nСостоит из элементов человек и\nк\nстоять. Вероятно, означал место, на котором стоит человек.\nСостав: человек (rn): ӱ+ стоять (l): .\nПримеры: (y wi xiānsheng)— один господин; (zuwi) — сиденье.\n5. Ручка, пишущий предмет (bӿ).\n\nИероглиф изображает материалы, из которых делали кисти. Полная форма написания: .\nСостав: бамбук (zh): + шерсть (mo): .\nПример употребления: (mobӿ)— кисть.\n\n \nФОНОИДЕОГРАММЫ\n1. Вопросительная частица (ma).\nЭлемент часто выступает в роли детерминатива в служебных словах.\nПолная форма:\n. Состав: детерминатив рот (ku): + фонетик лошадь (mӽ): .\nПример употребления: к(Zh sh y běn shū.)— Это одна книга.\n2. Кто (shu).\n\nЭлемент обычно выступает в роли детерминатива в словах, связанных с речью, словами, документами, образованием. Полная форма написания: .\nСостав: детерминатив слова, речь (yn): + фонетик короткохвостая птица (zhuī): .\nПример употребления: (Zh sh shu?)— Кто это?\n3. Суффикс множественного числа (-men).\n\nЭтот суффикс употребляется только с местоимениями и некоторыми существительными, означающими людей. Полная форма написания: .\nСостав: детерминатив человек (rn):\nк\nӱ+ фонетик дверь (mn): .\nПримеры употребления: Ӏ(wmen)— мы;ҪӀ(tāmen)— они;Ӏ(tāmen)— они.\n4. Бумага (zhӿ).\n\nБумага в Древнем Китае делалась не из дерева, а из различных отходов, в том числе тряпок.\nПолная форма написания: .\nСостав: детерминатив нить, шелк (sī):\nк\n+ фонетик нести (sh): .\nПример употребления: (y zhāng zhӿ)— один лист бумаги.\n5. Машина, механизм (jī).\n\nМеханизмы в древности делали из дерева. Полная форма написания: .\nСостав: детерминатив дерево (m): + фонетик столик (jī):\nк\nПримеры употребления: (shujī)— мобильный телефон; (fēijī)— самолет.\n6. Пар (q).\n\nЭтот иероглиф можно считать идеограммой.\nСостав: детерминатив вода (shuӿ): + фонетик воздух, газ (q): .\nПример употребления: (qchē)— автомобиль.\n7. Плоскость, фамилия Чжан (zhāng).\n\nВидимо, лук с натянутой тетивой призван изобразить нечто плоское.\nПолная форма написания: .\nСостав: детерминатив лук (gōng):\nк\n+ фонетик длинный (chng): .\nПример употребления: (y zhāng zhӿ)— один лист бумаги.\n8. Рукоятка, держать (bӽ).\n\nЭлемент часто выступает в роли детерминатива в словах, означающих действия, совершаемые руками. Состав: детерминатив рука (shu): + фонетик удав (bā): .\nПример употребления: (y bӽ dāozi)— один нож.\n\n \n9. Экземпляр, копия (fn).\n\nЗдесь не вполне ясно, почему в качестве детерминатива выступает элемент ӱ.\nСостав: детерминатив человек (rn):\nк\nӱ+ фонетик делить (fēn): .\nПример употребления: ӑ (y fn bo)— одна газета.\n10. Пара колес (ling).\n\nЭлемент обычно выступает в роли детерминатива в словах, означающих транспорт,\nколеса, армию и др. Полная форма написания: .\nСостав: детерминатив колесница (chē): + фонетик два (liӽng): њ.\nПример употребления: (y ling qchē)— один автомобиль.\n11. Кусок (kui).\n\nЭлемент , видимо, означает нечто твердое. Полная форма написания: .\nСостав: детерминатив земля (t\nя\n): + фонетик прорыв (gui): .\nПример употребления: (y kui ru)— один кусок мяса.\n12. , учебный (k).\n\nЭлемент обычно выступает в роли детерминатива в словах, связанных с речью, словами, документами, образованием. Полная форма написания: .\nСостав: детерминатив слова, речь (yn): + фонетик плод (gu):\nПример употребления: (y běn kběn)— один учебник."],["ЗАДАНИЯ","1. Прочитайте и переведите следующие иероглифы, назовите, из каких компонентов они состоят:\nӶ\n\n2. Прочитайте и переведите следующие предложения:\nĂ ӶѾĂӊҜ\nĂ ӶѾĂж\nĂ ӶѾĂ\nĂ ӶѾĂ\nĂ ӶѾĂпѣ\nĂ ӶѾĂњ\nĂ ӶѾĂ\nĂ ӶѾĂж\nĂ ӶѾĂй\n\n \nĂ ӶѾĂӂ\nĂ ӶѾĂғ\nĂ ӶѾĂњ\nĂ ӶѾĂ\nĂ ӶѾĂж\nĂ Ă\n\nĂ Ă\nĂ Ă\nĂ Ă\nĂ\n\nĂ\nĂ\nѣ\nĂуѣ\nĂ\n\nӰĂӊӰ\n3. Переведите с русского на китайский и запишите иероглифами:\nЧто это?— Это три китайские книги. __________________________________________________\nЧто то?— То два ножа. ______________________________________________________________\nЧто это?— Это четыре автомобиля. ___________________________________________________\nЧто то?— То десять листов бумаги. ____________________________________________________\nЧто это?— Это семь газет. ___________________________________________________________\nЧто то?— То мой мобильный телефон. _________________________________________________\nЧто это?— Это три рыбы. ____________________________________________________________\nЧто то?— То три горы. ______________________________________________________________\nЧто это?— Это две птицы. ___________________________________________________________\nЧто то?— То пять учебников русского языка. ___________________________________________\nЧто это?— Это девять пальто. ________________________________________________________\nЧто то?— То три куска мяса. _________________________________________________________\nЧто это?— Это ее сумка. _____________________________________________________________\nЧто то?— То две ручки. ______________________________________________________________\nКто это?— Это господин Чжан. _______________________________________________________\nКто то?— То мой хороший друг. ______________________________________________________\nЧей это автомобиль?— Это мой автомобиль. ____________________________________________\nЧья то ручка?— То его ручка. _________________________________________________________\n\n \nЭто твоя китайская книга?— Нет, это книга господина Вана.\n__________________________________________________________________________________\nСколько человек в твоей семье?— В моей семье три человека.\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nСначала (xiān)\nТо (n)\nСуффикс (-de)\nЧто (shn)\nЭто (zh)\nОн (tā)\nОна (tā)\nЕдиница, штука\n(jin)\nПолоска (tio)\n\n \nГазета (bo)\nПодставка (ti)\nДом, семья (jiā)\nУчить (xu)\nМесто (zu)\nМесто, персона\n(wi)\nРучка, пишущий\nпредмет (bӿ)\nВопросительная\nчастица (ma)\nКто (shu)\nСуффикс множ.\nчисла (-men)\nа\nБумага (zhӿ)\nМашина,\nмеханизм (j)"]],"17":[["Начало урока","Пар (q)\nПлоскость (zhāng)\nРукоятка;\nдержать (bӽ)\nЭкземпляр (fn)\nПара колес (ling)\nКусок (kui)\n , учебный (k)"],["ФОНЕТИКА","УДАРЕНИЕ\nСлоги в китайском языке, как нам уже известно, имеют определенный тон, но помимо тона они\nмогут выделяться в речи ударением, которое называют словесным. Словесное ударение бывает сильноударное, слабоударное и безударное.\nБезударными слогами являются слоги, утратившие свой этимологический тон и произносимые в нейтральном тоне, что происходит:\nв существительных, образованных путем удвоения (редупликации) основного слога, где второй слог произносится в нейтральном тоне:\nmāma ()— мама, bba ()— папа, yye ()— дедушка;\n\n \nв существительных с суффиксами и , где второй слог произносится в нейтральном тоне:\nhizi ()— ребенок, zhuōzi ()— стол, mtou ()— дерево, shtou ()— язык;\nпри удвоении односложных глаголов, где второй слог произносится в нейтральном тоне:\nknkan ()— посмотреть, děngdeng ()— подождать;\nпри удвоении двусложных глаголов, где только первый слог каждого глагола является ударным:\nbāngzhu-bāngzhu ()— помочь, jishao-jishao (ҟҟ)— представиться;\nпри добавлении других суффиксов и частиц, которые произносятся в нейтральном тоне:\nknle (њ)— смотрел/читал, tāde (Ҫ)— его, lӿl mian (\nӿ\n)— внутри, nӿ\nn ne (\nӿ\n)— а ты;\nв других словах, содержащих слоги в нейтральном тоне:\ntufa ()— волосы, zhngfu ()— муж, xӿx huan ()— нравиться,\ndӽsuan ()— намереваться.\nОднако в большинстве двусложных слов в китайском языке обе слога являются ударными, при этом\nесть слова с равной и с разной степенью ударения на слоги, поэтому здесь возможны три варианта:\n1. Равноударные слоги: dxiӽo ()— размер, chngduӽn ()— длина.\n2. Слабоударный первый слог, сильноударный второй слог:\nHny\ny ()— китайский язык, lӽoshī ()— учитель, xux ( д)— учиться,\nzijin\ni\n()— до свидания.\n3. Сильноударный первый слог, слабоударный второй слог:\nfm ()— родители, Zhōnggu (Ё)— Китай, wn (\n)— русский язык.\nКак правило, в словах, состоящих из трех слогов, последний слог является ударным, а первый и второй— слабоударными:\nlusī (\n)— Россия, tshūguӽn (к)— библиотека,\ndtiězhn ()— станция метро.\nПри сочетании числительного со счетным словом числительное и существительное становятся\nсильноударными, а счетное слово— слабоударным:\nliӽng běn\ng\nshū (к)— две книги, y zhī gu ()— одна собака,\nsān ling chē ()— три машины.\nПомимо словесного ударения, выделяют фразовое, или ритмическое, ударение. Оно падает на центральное слово фразы, вокруг которого группируются менее значимые слова или словосочетания, выделяя\nего, например:\nW kn shū. (к)— Я читаю книгу.\nW kn Zhōngwn shū. (Ёк )— Я читаю китайскую книгу (книгу на китайском\nязыке).\nИНТОНАЦИЯ ПРЕДЛОЖЕНИЙ\nЗдесь мы рассмотрим интонацию и ритмическое деление китайских предложений, а также повторим все типы рассмотренных ранее предложений.\nВ китайском языке существуют два основных типа интонации в предложениях: понижающаяся интонация (ослабление силы голоса в конце предложения) и повышающаяся интонация (голос к концу предло-\n\n \nжения не понижается). Вопросительные предложения в основном произносятся с повышающейся инто\nя\nнацией, а повествовательные — с понижающейся. Однако стоит отметить, что в китайском языке очень\nе\nмного разных типов предложений, поэтому далее мы рассмотрим их более подробно.\n1. Интонация повествовательных предложений.\nДля повествовательных предложений характерна нисходящая интонация:\nDdi p gu. ()— Младший брат боится собак.\nTā yu qiānbӿ. (Ҫ\n)— У него есть карандаш.\nZh sh wde shū. (к)— Это моя книга.\nZh zu shān hěn gāo. ()— Эта гора (очень) высокая.\nВ сложных повествовательных предложениях начало второй части обычно чуть ниже начала\nпервой части:\nDdi p gu, w b p gu. ()— Младший брат боится собак, [а] я не\nбоюсь собак.\nTā yu qiānbӿ, w yě yu qiānbӿ. (Ҫ\nг\n)— У него есть карандаш, [а] у меня\nнет карандаша.\nZh sh w de shū, n sh tā de shū. (кҪк)— Это моя книга, [а] то его\nкнига.\nTā hěn pioliang, tā mimei yě hěn pioliang. (҂Ҫ\nг҂)— Она очень\nкрасивая, [и] ее младшая сестра тоже очень красивая.\n2. Интонация предложений с частицей ne.\nПредложения с частицей ne всегда состоят из двух частей, где первая часть представляет собой\nповествовательную фразу, вторая— вопросительную. Для вопросительной части такого предложения характерна ровная интонация:\nW i kn shū, nӿ ne? (к)— Я люблю читать (книги), а ты?\nTā hu kāichē, tā ddi ne? (ҪӮҪ)— Он умеет водить машину, а его младший\nбрат?\nTā yu nnpngyou, tā jiějie ne? (\n\n)— У нее есть молодой человек,\nа у ее старшей сестры?\n3. Интонация предложений с вопросительными концовками.\nПредложения с вопросительными концовками всегда состоят из двух частей, где первая часть\nпредставляет собой повествовательную фразу, а вторая является вопросительной концовкой.\nОднако концовка sh-bu-sh (\nу\n)— да (или нет)? произносится ровно, а концовки\nsh ma\n()— так? и\nb sh ma ()— не так ли? произносятся с восходящей интонацией:\nNӿ xux zhōngwn, sh-bu-sh? (\nӿ\nдЁ)— Ты учишь китайский язык, да?\nTā gēge sh yīshēng, sh ma? (Ҫ)— Его старший брат врач, да?\n\n \nNӿ xӿhuan nӿ de gōngzu, b sh ma? () — Тебе нравится твоя\nработа, не так ли?\n4. Интонация предложений с вопросительной частицей ma.\nДля предложений с вопросительной частицей ma в целом характерна восходящая интонация,\nоднако высота произнесения самой частицы ma зависит от тона предшествующего слога, так как\nma всегда произносится в нейтральном тоне:\nDdi p gu ma? ()— Младший брат боится собак?\nN sh dāozi ma? ()— То нож?\nNӿ i kn shū ma? (к)— Ты любишь читать (книги)?\n5. Интонация вопросительных предложений с повторами.\nВ предложениях с повторами интонация сначала повышается, но с момента повтора несколько\nпонижается:\nNӿ hu-bu-hu kāichē? (ӮӮ)— Ты умеешь (или нет) водить машину?\nNӿ gēge gāo-bu-gāo? ()— Твой старший брат высокий (или нет)?\n6. Интонация предложений с альтернативным вопросом.\nПредложения с альтернативным вопросом всегда состоят из двух частей, разделенных союзом\nhishi ()— или. Здесь стоит обратить внимание на то, что слова, представляющие собой\nальтернативу, выделяются фразовым ударением и произносятся на более высоком уровне, после\nчего интонация начинает снижаться:\nZh sh zhōngwn kběn hishi rwn kběn? (Ё)— Это учебник\nкитайского языка или японского языка?\nРИТМИЧЕСКОЕ ДЕЛЕНИЕ ПРЕДЛОЖЕНИЙ\nКитайские предложения, состоящие более чем из трех слогов, как правило, ритмически делятся на\nнесколько групп слов или словосочетаний из двух и трех, реже одного ударных слогов:\nTā kn shū. (Ҫк)— Он читает (книгу).\nTā kn / zhōngwn shū. (Ҫ / Ёк)— Он читает китайскую книгу (на китайском языке).\nW yu bӿ. (\n)— У меня есть ручка.\nW yu / qiānbӿ. (\n/ )— У меня есть карандаш.\nW hē tāng, / tā yě / hē tāng. ( / г / )— Я ем суп, [и] он тоже ест суп.\nDdi / hē tāng, / w yě / hē tāng. (/ / г / ) — Младший брат ест суп, [и]\nя тоже ем суп.\n\n \nDdi / hē tāng, / gēge / yě hē tāng. (/ / / г)— Младший брат ест суп,\n[и] старший брат тоже ест суп.\nСтоит запомнить, что нельзя интонационно разделять перечисленные далее сочетания, однако если\nза ними следует односложное или двусложное слово, заканчивающееся безударным слогом, оно\nсоставляет с ними единую ритмическую группу.\nZh sh ()— это (является) и n sh ()— то (является). Примеры:\nZh sh shū, / n sh / zzh. (к / / )— Это книга, [а] то журнал.\nZh sh / yīngwn shū, / n sh / zhōngwn / zzh. (кЁ)— Это\nанглийская книга (книга на английском языке), [а] то китайский журнал (журнал на китай -\nском языке).\nYě sh (г)— тоже является. Примеры:\nZh sh shū,/ n/ yě sh shū. (к / / гк)— Это книга, то тоже книга.\nW sh / xushēng, tā / yě sh / xushēng. ( / / г / )— Я студент(ка),\nона тоже студентка.\nZh sh / wn / bozhӿ, / n / yě sh / wn / bozhӿ. ( /\n/ / / г /\n/ )— Это русская газета (газета на русском языке), то тоже русская газета (газета\nна русском языке).\nYě yu (г\n)— тоже имеется. Примеры:\nW yu bӿ, / tā / yě yu bӿ. (\n/ / г\n)— У меня есть ручка, у нее тоже есть\nручка.\nW yu / pbāo, / tā / yě yu / pbāo. (\n/ / г\n)— У меня есть сумка,\nу нее тоже есть сумка.\nNӿ yu / zhōngwn shū, / nӿ mimei / yě yu / zhōngwn shū. (\n/ Ёк /\n/ г\n/ Ёк\ng\n)— У тебя есть китайская книга (книга на китайском языке), у твоей старшей\nсестры тоже есть китайская книга (книга на китайском языке).\nB sh ()— не (является) и другие сочетания с графемой . Примеры:\nN / b sh shū. (/ к)— То не книга.\nZh / b sh / w de běnzi. (/ / )— Это не моя тетрадь.\nW / b hu / kāichē. ( / Ӯ / )— Я не умею водить машину.\nTā / b kn / wiwn / zzh. (Ҫ / / / )— Я не читаю иностранные газеты\n(газеты на иностранном языке).\nMiyu (\n)— не иметь. Примеры:\nW y\ny u gu, / tā / miy\ny u gu. (\n/ Ҫ /\n)— У меня есть собака, у него нет собаки.\nW yu / mobӿ, / tā / miyu / mobӿ. (\n/ / Ҫ /\n/ )— У меня есть\nкисть, у него нет кисти.\nСочетания числительного и счетного слов. Примеры:\nZh sh / liӽng běn shū. (/ к)— Это две книги.\nN sh / sān bӽ yӿy zi. ( / )— То три стула.\nW yu / bā běn / kběn. (\n\n/ )— У меня есть восемь учебников.\nTā yu / w\nw jin / moyī. (\n/ Ѩӊ / )— У нее есть пять свитеров.\n\n \nНужно обратить внимание на то, что в предложениях, где встречаются сочетания нескольких слогов подряд в третьем тоне, в каждой из ритмических групп первый слог читается во втором тоне, а\nпоследний— в третьем тоне:\nW yu / liӽng bӽ yӿy zi. ĺ W yu / ling b yӿy zi. (\n/ )— У меня есть два ножа.\nTā yu / w\nw běn / kběn. ĺ Tā yu / w běn / kběn. (Ҫ\n/ Ѩ / )— У него есть пять\nучебников.\nNӿ y\nӿ u / shubiӽo, / w / yě yu / shubiӽo. ĺ N yu / shubiӽo, / w / y yu / shubiӽo. (\n\ny\n/ / г\ny y\ny\n)— У тебя есть наручные часы, [и] у меня тоже есть наручные часы."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 17.1.1\n1. Прочитайте, повторяя за диктором, следующие слова, обращая внимание на ударение:\nt\ndxiӽo chngduӽn;\nt\nHny\ny\nlӽoshī xux zijin\ni\nt\nfm Zhōnggu wn;\nt\nlusī tshūguӽn dtiězhn;\nt\nliӽng běn\ng\nshū y zhī gu sān ling chē.\nCD 17.1.2\n2. Прочитайте, повторяя за диктором, следующие предложения, обращая внимание на их интонацию и ритмическое деление:\nt\nN sh / sān bӽ y\nӽ ӿy zi.\nt Zh sh / w de shū, / n sh / tā de shū.\nt\nZh zu shān / hěn gāo, / n zu shān / b gāo.\nt\nZhe / li zu shān / hěn gāo.\nt Zh xiē shān / hěn gāo.\nt\nW hē tāng, / tā yě / hē tāng.\nt\nDdi / hē tāng, / w yě / hē tāng.\nt Ddi / hē tāng, / gēge / yě hē tāng.\nt\nZh sh shū, / n sh / zzh.\nt\nZh sh / Yīngwn shū, / n sh / Zhōngwn /\nzzh.\nt\nZh sh shū,/ n/ yě sh shū.\nt W sh / xushēng, tā / yě sh / xushēng.\nt\nZh sh / wn / bozhӿ, / n / yě sh / wn /\nbozhӿ.\nt\nW yu / bā běn / kběn.\nt\nTā yu / w\nw jin / moyī.\n\nt W yu / liӽng bӽ y\nӽ ӿy zi.\nt\nTā yu / w\nw běn / kběn.\n\nt\nW yu bӿ,/ tā/ yě yu bӿ.\nt Nӿ y\nӿ u / shubiӽo, / w / yě yu / shubiӽo.\nt\nW yu / kběn, / w mimei / yě yu /\nkběn.\nt Nӿ y\nӿ u / zhōngwn shū, / nӿ mimei / yě y\nӿ\nu /\nzhōngwn shū.\nt\nN / b sh shū.\nt\nZh / b sh / w de běnzi.\nt\nW / b hu / kāichē.\nt\nTā / b kn / wiwn / zzh.\nt Ddi / p gu, / w / b p gu.\nt W yu gu, / tā / miyu gu.\nt W yu / mobӿ, / tā / miyu / mobӿ.\nt Zh sh / liӽng běn shū.\nt W i / kn shū, / nӿ ne?\nӿ\nt\nTā hu / kāichē, / nӿ ddi ne?\nӿ\nt\nTā yu / nnpngyou, / tā jiějie ne?\nt\nNӿ xux / zhōngwn, / sh-bu-sh?\nӿ\nt\nTā gēge / sh yīshēng, / sh ma?\nt Nӿ x\nӿ ӿx huan / nӿ de gōngzu, / b sh ma?\nӿ\nt Ddi / p gu ma?\nt N sh / dāozi ma?\nt Nӿ i / kn shū ma?\nӿ\nt Nӿ / hu-bu-hu / kāichē?\nӿ\nt\nNӿ gēge / gāo-bu-gāo?\nӿ\nt\nZh sh / zhōngwn / kběn / hishi / rwn /\nkběn?\n\n \nCD 17.1.3А\n3. Прослушайте следующие китайские классические стихотворения, прочитайте их, повторяя за диктором, научитесь читать их с выражением, выучите любое понравившееся наизусть:\nFēng qio y bō\nНочью причалил у Кленового моста\nZhāng j\nЧжан Цзи\nYu lu wū t shuāng mӽn\ntiān,\nР Луна закатилась, каркают вороны, в небе\nморозная мгла,\nJiāng fēng y hu du chu\nmin.\nПрибрежные клены, рыбачьи огоньки\nнавевают тягостный сон.\nGū sū chng wi Hn shān s,\nЗа городом Гусу монастырь Ханьшаньсы,\nY bn zhōng shēng do k\nchun.\nВ полуночи гул его колокола донесся\nдо одинокой лодки путника.\nCD 17.1.3Б\nYng li\nВоспеваю иву\nH Zhīzhāng\nХэ Чжичжан\nB y zhuāng chng y sh\ngāo,\n\nВ зеленый нефрит нарядилось высокое\nдерево,\nWn tio chu xi l sī tāo.\nМножество веточек свисают как ленты\nзеленого шелка.\nB zhī x y shu ci chū,\nНеведомо мне, кто вырезал эти узкие листья,\nr yu chūn fēng s jiӽn dāo. Ѡ\nФевральский весенний ветер подобен\nножницам.\nCD 17.1.3В\nHu xiāng u shū\nПо возвращении на родину\nH Zhīzhāng\n\nХэ Чжичжан\nSho xiӽo l jiā lӽo d hu,\nМолодым я покинул родной дом, стариком\nвернулся,\nXiāng yīn w gӽi bn mo cuī. е Здешний говор не изменился, но виски мои\nпоседели.\nr tng xiāng jin b xiāng\nsh,\nВстретил незнакомых детей,\nXio wn k cng h ch li. Ң Которые, смеясь, спросили, откуда прибыл\nгость.\nL bi jiā xiāng su yu duō, е\nМного лет провел я в разлуке с родиной,\nJn li rnsh bn xiāom.\nҎџ Теперь все кажется мне наполовину\nизношенным.\nWi yu mn qin jng h\nshuӿ,\n\nПеред воротами лишь воды озера Цзинху,\nChūn fēng b gӽi ji sh bō. Весенний ветер не изменил его старые\nволны."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 17.2.1\n1. Прочитайте следующие слова, повторяя за диктором:\nt xiē (ѯ)— немного, несколько;\nt\ndiӽn () / diӽnr ()— немного, капелька, чуть-чуть, точка;\nt\nyxiē (ѯ)— немного, в некоторой степени;\nt ydiӽn () / ydiӽnr ()— немного, капельку, чуть-чуть;\nt\nyu yxiē (\nѯ)— немного, в некоторой степени;\nt\nyu ydiӽn (\n) / yu ydiӽnr (\n)— немного, капельку, чуть-чуть.\nCD 17.2.2\n2. Прочитайте следующие пары антонимов, повторяя за диктором:\nt\nd ()— большой / xiӽo ()— маленький;\nt\ngāo ()— высокий / ӽi ()— низкий (о росте), dī ()— низкий (о высоте);\nt\nchng ()— длинный / duӽn ()— короткий;\nt\nshēn ()— тёмный, глубокий /qiӽn ()— светлый, мелкий;\nt\nfi (), png ()— широкий, толстый, полный / shu ()— узкий, худой;\nt\nruӽn ()— мягкий / yng ()— твердый;\nt\nkui ()— быстрый / mn ()— медленный;\nt gānjng ()— чистый / āngzang ()— грязный;\nt\npioliang (҂)— красивый / b pioliang (҂)— некрасивый;\nt\ngu ()— дорогой / pinyi (\n)— дешевый;\nt\nlěng )— холодный / nuӽnhuo ()— теплый, r ()— жаркий;\nt yuysi (\n)— интересный, захватывающий / miyuysi (\n)— неинтересный,\nскучный.\nCD 17.2.3\n3. Прочитайте следующие словосочетания, повторяя за диктором:\nt\nzhge rn (Ҏ)— этот человек / nge rn (Ҏ)— тот человек;\nt\nzh sānge rn (Ҏ)— эти три человека / n sānge rn (Ҏ)— те три человека;\nt zh xiē rn (ѯҎ)— эти люди / n xiē rn (ѯҎ)— те люди;\nt\nzh wi xiānsheng ()— этот господин / n wi xiānsheng ()— тот господин;\nt\nzh liӽng wi xiānsheng ()— эти два господина / n liӽng wi xiānsheng (\n)— те два господина;\nt\nzh xiē xiānsheng (ѯ)— эти господа / n xiē xiānsheng (ѯ) те господа;\nt zh zhī māo ()— эта кошка / n zhī māo ()— та кошка;\nt\nzh s zhī māo ()— эти четыре кошки / n s zhī māo ()— те четыре кошки;\nt\nzh xiē māo (ѯ)— эти кошки / n xiē māo (ѯ)— те кошки;\nt\nzh zhī qiānbӿ (\n)— этот карандаш / n zhī qiānbӿ (\n)— тот карандаш;\nt\nzh sh zhī qiānbӿ (\n) — эти десять карандашей / n sh zhī qiānbӿ (\n)— те десять карандашей;\nt\nzh xiē qiānbӿ (ѯ)— эти карандаши / n xiē qiānbӿ (ѯ)— те карандаши;\n\n \nt\nzh ti shujī (\n)— этот мобильный телефон / n ti shujī (\n)— тот мобильный телефон;\nt zh s ti shujī (\n)— эти четыре мобильных телефона / n s ti shujī (\n)— те четыре мобильных телефона;\nt\nzh xiē shujī (ѯ)— эти мобильные телефоны / n xiē shujī (ѯ)— те мобильные телефоны;\nt\nzh běn shū (к)— эта книга / n běn shū (к)— та книга;\nt\nzh w\nw běn shū (Ѩк)— эти пять книг / n w\nw běn shū (Ѩк)— те пять книг;\nt zh xiē shū (ѯк)— эти книги / n xiē shū (ѯк)— те книги.\nCD 17.2.4\n4. Прочитайте следующие предложения, повторяя за диктором:\nZh sh w de kběn. ()— Это — мой учебник.\nZh běn kběn sh w de. ()— Этот учебник — мой.\nZh sh w pngyu de běnzi. (\n)— Это — тетради моего друга.\nZh xiē běnzi sh w pngyu de. (ѯ\n)— Эти тетради — моего друга.\nZh sh Wng lӽoshī de shū. (к)— Это — книга учителя Вана.\nZh běn shū sh Wng lӽoshī de. (к)— Эта книга — учителя Вана.\nZh sh w de liӽng zhī qiānbӿ. (\n)— Это — два моих карандаша.\nZh liӽng zhī qiānbӿ sh w de. (\n\n)— Эти два\nкарандаша мои.\nMinbāo yu ydiӽn yng. (\n)— Хлеб чуть жестковат.\nHny\ny y\n\ny u yxiē nnxu. (\nѯ)— Китайский язык немного сложноват в изучении.\nZh běn shū yuysi yxiē. (к\nѯ)— Эта книга интереснее.\nTā de pbāo xiӽo ydiӽn. (\n)— Ее рюкзак меньше.\nNӿ gēge bӿ w gāo. ()— Твой брат выше меня.\nNӿ gēge bӿ w gāo yge tu. ()— Твой брат выше меня на голову.\nTā mimei bӿ tā pioliang. (\n҂)— Ее младшая сестра красивее ее.\nTā mimei bӿtā pioliang yxiē. (\nӿ\n\n҂ѯ)— Ее младшая сестра немного красивее ее.\nZh běn shū bӿ n běn shū yuysi. (кк\n)— Эта книга интереснее той.\nZh běn shū bӿ n běn shū yuysi duō. (кк\n)— Эта книга намного\nинтереснее той.\nZh zhng pnggu bӿ n zhng pnggu hӽochī. ()— Этот сорт\nяблок вкуснее, чем тот.\nZh zhng pnggu bӿ n zhng pnggu hӽochī yxiē. (ѯ)—\nЭтот сорт яблок немного вкуснее, чем тот.\nZh zhāng zhuōzi bӿ n zhāng zhuōzi dī. (\nӿ\n)— Этот стол ниже, чем тот.\nZh zhāng zhuōzi bӿ n zhāng zhuōzi dī liӽng gōngfēn. (\nЭтот стол ниже, чем тот, на два сантиметра.\nJīntiān bӿ zutiān r. (Ҟ)— Сегодня теплее/жарче, чем вчера.\nJīntiān bӿ zutiān nu\nӿ\nӽnhuo duōle. (Ҟњ)— Сегодня намного теплее, чем вчера.\nNӿ zu de hěn mn. ()— Ты идешь (очень) медленно.\n\n \nTā xu de hěn nl. (Ҫ)— Он учиться (очень) старательно.\nTā xu hny\ny xu de hěn n\n\nl. (Ҫ)— Он учит китайский (очень) старательно.\nTā zu fn zu de hěn hӽo. (Ҫ)— Он готовит (еду) (очень) хорошо.\nTā chnggē chng de hěn bcu. ()— Он поет (песни) (очень) неплохо.\nTā yuyng yu de hěn kui. (Ҫ)— Он плавает (очень) быстро.\nCD 17.2.5\n5. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите следующий диалог:\nMӽi dyī (ф)— Покупка пальто\n— Nn hӽo! Nn xiӽng mӽi shnme?\n— W xiӽng mӽi y jin dyī.\n— Nn chuān sshs ho, b sh ma?\n— Sh.\n— Nӿ sh-yi-sh zh jin. Zěnme yng?\n—Yu ydiӽnr d, nӿmen yu miyu xiӽo ydiӽn\nde dyī?\n— Yu, nn sh-yiy -sh zh jin. Zěnmeyng? — Yu\nydiӽn duӽn. Nӿmen y\ny u-mei-y\ny u zhӽng ydiӽn?\n— N nӿ chuān zh jin. Hsh-bu-hsh?\n— Zh jin hsh. Duōshӽo qin?\n— Sānqiān w\nw bӽi yun.\n— Gěi nn sqiān kui.\n— Zhӽo nn w\nw bӽi kui.\n— Xixi, zijin!\n— Zijin!\nфҔМ\nфӊ\n\nӊМ\n\nӀ\n\nӊМ\n\nӀ\n\nӊ\nӊ\nѨ\n\nѨ\n\nВ этом диалоге используются новые слова: chuān () — одевать, носить; ho () — здесь: раз-\n— здесь: раз\n— здесь: размер одежды; sh-yi-sh (\nу\n)— примерять; hsh () — подходить."],["Комментарий","1. Местоимения в китайском языке. В предыдущих уроках мы изучали различные виды местоимений; здесь мы их повторим и изучим новые.\n1) Личные местоимения.\nЕдинственное число: 1-е лицо: w ()— я; 2-е лицо: nӿ (\nӿ )— ты, nn ()— вы; 3-е лицо:\ntā (Ҫ)— он, tā ()— она, tā ()— он/она/оно (для животных, предметов).\nМножественное число: 1-е лицо: wmen (Ӏ)— мы, znmen (Ӏ)— мы с тобой/с вами;\n2-е лицо: nӿ\nn men\nӿ\n)— вы (nn () множественного числа не образует); 3-е лицо: tāmen (ҪӀ),\ntāmen (Ӏ), tāmen (Ӏ\n)— они.\nИногда к личным местоимениям относят еще и zjӿ (\nӿ )— сам, только оно употребляется\nвместе с другими местоимениями, например w zjӿ (\nӿ\n)— я сам…\n2) Притяжательные местоимения.\nПритяжательные местоимения в китайском языке образуются путем прибавления к исходному\nместоимению служебного слова de (), например: wde (\nу\n)— мое, tāde (Ҫ)— его,\nwmende (Ӏ\nу\n)— наше, nӿmende (Ӏ\nр\nр\n)— ваше ит.д.\n\n \n3) Вопросительные местоимения.\nshi ()— кто? Примеры:\nShu sh nӿ de pngyou? (\n)— Кто твой друг? Zh\nsh shе? ()— Кто это?\nshide ()— чей? Примеры: Zh sh\nshеde shū? (к)— Чья эта книга? Zh běn\nshū sh shеde? (к\nр\nр\nр\nр\n)— Эта книга чья?\nshnme (ҔМ)— что? какой? Примеры: Zh sh\nshnme? (ҔМ)— Что это? Zh sh\nshnme shū? (ҔМк\n)— Какая это книга?\njӿ… ()— сколько? (когда ответ подразумевает число до 10). После\njӿ должно находиться счет\nӿ\nное слово. Примеры: Nӿ yu jӿ zhī\nӿ\nbӿ? (\n\nдр\nу\nр\nу\n)— Сколько у тебя ручек? Исключение (без\nсчетного слова): Nӿ jӿ su? (\nӿ\n\nj\n)— Сколько тебе лет?\nduōshao () — сколько? (когда ответ подразумевает число больше 10). Примеры: N\nӿ yu\nduōshӽo qin? (\n\n)— Сколько у тебя денег?\nnӽ… ()— какой, который? (подразумевает ответ\nэтот/эти, тот/те). После nӽ должно находиться счетное слово. Пример: Nӽ zhng pnggu hӽo chī? (\n)— Яблоки какого\nсорта вкуснее?\nnӽli / nӽr ()— где? Пример: Dyī zi\nnӽli? ()— Где пальто?\nshnme shhou (ҔМ)— когда? Пример: N\nӿ shnme shhou li? (ҔМ)—\nКогда (во сколько) ты придешь?\nzěnme (yng) (М))— какой? как? каким образом? Пример: N\nӿ de shēntӿ zěnmeyng? (\nМ\n(y\ng)\n(y\ng) (\n)— Как твое здоровье?\nОбратите внимание, что в китайских вопросительных предложениях порядок слов остается таким\nже, как в повествовательных.\n4) Указательные местоимения.\nЕдинственное число: zh… ()— это, этот, эта. После zh должно находиться счетное слово,\n\nнапример: zh běn shū (к\n)— эта книга; n… ()— тот, та, то. После n должно\nнаходиться счетное слово, например: n běn shū (к\n)— та книга.\nМножественное число: zh xīe (ѯ)— эти. Пример: zh xīe shū (ѯк)— эти книги; n xīe\n(ѯ)— те. Пример: shū (ѯк\n)— те книги.\nПри наличии числительного иероглиф ѯ не употребляется\nу\nр\n, например: zh liӽng běn shū (\nк\nр\n)— эти две книги.\nИногда местоимения zh (ge) (())— этот и n (ge) (())— тот могут читаться как\nzhi и ni, но такой вариант сейчас употребляется редко.\n2. Два варианта обозначения притяжательности в китайском языке. Притяжательность может выражаться двумя способами: в виде определения и в виде\nя\nименной части сказуемого с конструкцией ...\nу\n, например: Zh sh wde kběn. Zh běn kběn sh wde. (\nу\nру\nу\nру\n\nц\n3. Степени качества прилагательных. В китайском языке существуют разные грамматические способы обозначения степени качества, выраженного прилагательным.\nt\nНезначительная степень качества обозначается словосочетанием yu yxiē (\nѯ) или\nyu ydiӽn(r) (\n())— немного. Это словосочетание ставится перед прилагательным.\nПримеры: Minbāo yu ydiӽn yīng. (\n)— Хлеб чуть жестковат. Hny\ny\nyu\nyxiē nnxu. (\nѯ\ny\ny\ny\ng\ny\ng\n)— Китайский язык немного сложноват в изучении.\n\n \nt\nСравнительную степень качества передают словосочетания yxiē (ѯ)— немного и y-\ndiӽn(r) (\nу\n())— капельку, чуть-чуть. Эти словосочетания ставятся после прилагательного. Примеры: Zh běn shū yuysi yxiē. (к\nѯ)— Эта книга интереснее.\nTā de pbāo xiӽo ydiӽn. (\n\ny\ny\ny\ny\ny\n)— Ее рюкзак меньше.\nПри сравнении одного с другим используется слово bӿ (\nӿ )— по сравнению с…. В этом случае\nпосле прилагательного можно ничего не добавлять, например: Nӿ gēge bӿ w gāo. (\nу\n)— Твой брат выше меня.\nОднако если нужно выразить не просто сравнительную степень качества, а показать конкретную\nстепень превосходства, она добавляется после прилагательного. Примеры: Nӿ gēge bӿ w gāo yxiē.\n(ѯ\nр\nд\nр\n)— Твой брат немного выше меня. Nӿ gēge bӿ w gāo yge tu. (\ng\ny\ng\ny\n\n)— Твой брат выше меня на голову.\nДругие степени качества мы уже изучали в предыдущих уроках, а здесь мы их повторим.\nt\nИнтенсивную степень качества передают уже известные нам наречия hěn () и в большей\nстепени hӽo ()— очень, которые ставятся перед прилагательным, например: Shuӿgu hěn\nhӽochī. ()— Фрукты очень вкусные. Zh zhng pnggu hӽo d.\nр\ng\n)— Яблоки этого сорта очень крупные.\nt\nПревосходная степень качества выражается наречием zu (\n)— самый, например: Zh běn\nshū zu yuysi. (к\n\nр\n)— Эта книга самая интересная.\nt\nИзбыточная степень качества выражается наречием ti ()— слишком, например: Wde\npbāo ti xiӽo. (\n)— Моя сумка слишком маленькая.\nЭти грамматические средства выражения степени качества употребляются не только с прилагательными, но и с некоторыми глаголами, такими как i (\nу\n)— любить, xӿx huan\nӿ\n()— нравиться, p ()— бояться и др., например: Tā zu b x\nя\nӿx huan zhge rn. (Ҫ\n\nр\nҎ)— Он больше всего не любит этого человека. W hěn i nӿ. (\ng\ng\n)— Я очень тебя\nлюблю.\n4. Дополнение результата в китайском языке.\nДля оценки действий используется очень важная грамматическая конструкция, известная как\nдополнение результата. Главное отличие дополнения результата от качественного сказуемого —\nто, что оно отвечает на вопрос как, каким образом что-то сделано, а не какое что-то.\nВ этих предложениях между сказуемым и дополнением ставится служебное слово de (). Отрицание\nр\nуказывается в таких предложениях перед дополнением, так же как и наречия степени:\nNӿ zu de hěn mn. ()— Ты идешь (очень) медленно.\nTā xu de hěn nl. (Ҫ)— Он учится (очень) старательно.\nЕсли за сказуемым идет прямое дополнение, то сказуемое дублируется, за первым сказуемым\nставится прямое дополнение, а за вторым— слово\nу\nи дополнение результата:\nTā xu hny\ny xu de hěn n\n\nl. (\n\nҪ)— Он учит китайский (очень) старательно.\nTā zu fn zu de hěn hӽo. (Ҫ)— Он готовит (еду) (очень) хорошо.\nЕсли глагол представлен глагольно-объектной конструкций (типа к, ), то глагол разрывается на две части. Первое сказуемое полностью повторяет глагольно-объектную конструкцию, а вторая— только первую ее часть:\nTā chnggē chng de hěn bcu. ()— Он поет (песни) (очень) неплохо.\nTā yuyng yu de hěn kui. (Ҫ)— Он плавает (очень) быстро.\n\n \n5. Знаки препинания в китайском языке: каплевидная запятая. В китайском языке употребляются\nте же одиннадцать знаков препинания, что и в русском, исключение составляет каплевидная запятая (), представляющая собой разновидность обычной запятой (). Эта запятая употребляется для разделения однородных членов предложения, например: W jiā yu w ku rn: bba,\nmāma, gēge, w, hi yu w ddi. (\nѨҎ\n\nр\nр\nр\nр\nр\nр\nj\ny\n)— В моей семье пять человек: папа, мама, старший брат, я и мой младший брат.\nКроме того, как вы, наверное, уже заметили, точка в китайской пунктуации () несколько отличается своим видом от точки, принятой в западной пунктуации."],["ЗАДАНИЯ","CD 17.3.1\n1. Соедините пары антонимов:\nd\nmiyuysi\ngāo\nqiӽn\nchng\nxiӽo\nshēn\nӽi, dī\nfi, png\nāngzang\nruӽn\nnuӽnhuo, r\nkui\nshu\ngānjng\npinyi\npioliang\nmn\ngu\nyng\nlěng\nduӽn\nyuysi\nb pioliang\n2. Переделайте существительные из единственного числа в неопределенное множественное:\nZh běn shū __________________________\nZh zhī bӿ ____________________________\nZh zhī māo __________________________\nZh zhāng zhӿ ________________________\nN fn bo ___________________________\nNge rn ____________________________\nN bӽ yӿy zi ___________________________\nN ling qchē ________________________\n3. Переведите предложения с русского языка на китайский язык:\nЭто — ручка моего друга. Эта ручка — моего друга.\n__________________________________________________________________________________\nЭто — папин автомобиль. Этот автомобиль — моего папы.\n__________________________________________________________________________________\nЭто — собака моей младшей сестры. Эта собака — моей младшей сестры.\n__________________________________________________________________________________\nЭто — газета господина Вана. Этот портфель — господина Вана.\n__________________________________________________________________________________\n\n \nЭто — моя тетрадь. Эта тетрадь — моя.\n__________________________________________________________________________________\n4. Переведите словосочетания с русского языка на китайский:\nЭтот учебник, эти два учебника, эти учебники ___________________________________________\nЭта ручка, эти три ручки, эти ручки ___________________________________________________\nТот карандаш, те пять карандашей, те карандаши ________________________________________\nТа сумка, те две сумки, те сумки ______________________________________________________\nТот автомобиль, те шесть автомобилей, те автомобили ___________________________________\nЭтот человек, эти пять человек, эти люди _______________________________________________\nЭта книга, эти восемь книг, эти книги __________________________________________________\nТот лист бумаги, те семь листов бумаги, та бумага (множественное число)\n__________________________________________________________________________________\nТот господин, те два господина, те господа _____________________________________________\nТот стол, те два стола, те столы _______________________________________________________\n5. Переведите словосочетания с русского языка на китайский:\nНебольшой, немного великоват, большой, больше, очень большой, самый большой, слишком большой\n__________________________________________________________________________________\n__________________________________________________________________________________\nНедлинный, немного длинноват, длинный, длиннее, очень длинный, самый длинный, слишком\nдлинный\n__________________________________________________________________________________\n__________________________________________________________________________________\nНесложный (в изучении), немного сложноват, сложный, сложнее, очень сложный, самый сложный, слишком сложный\n__________________________________________________________________________________\n__________________________________________________________________________________\nНевысокий, немного высоковат, высокий, выше, очень высокий, самый высокий, слишком высокий\n__________________________________________________________________________________\n__________________________________________________________________________________\nЯ не боюсь, я немного боюсь, я боюсь, я очень боюсь, я больше всего боюсь\n__________________________________________________________________________________\n6. Раскройте скобки, поставив нужное вопросительное местоимение:\nZh sh (чья)_________pbāo? (Кто)_________xux zhōngwn? Nӿ de pngyu sh_________(кто)?\nZh sh (какая)_________bozhӿ? Nӿ (сколько)_________su? Tā yu (сколько)_________qin?\n(Который)_____________g z b hӽo xiě? Nӿ de běnzi zi (где)_____________?\nNӿ (когда) ________________ li? Jīntiān tiānq (какая, какова)________________?\n\n \n7. Задайте вопросы к выделенным словам.\nW de pngyu sh Zhōnggu rn. _____________________________________________________\nZh sh w māma de qchē. ___________________________________________________________\nZh sh Zhōngwn shū. ______________________________________________________________\nW yu liӽng zhī bӿ. _________________________________________________________________\nW gēge yu rsh’r fn zhōngwn bozhӿ. _______________________________________________\nW ddi sān su. _____________________________________________________________________\nZhge z hěn hӽokn. ________________________________________________________________\nW de pbāo zi zhli. _______________________________________________________________\nW zӽoshang bā diӽn li. _____________________________________________________________"],["ИЕРОГЛИФИКА","В этом уроке мы рассмотрим графемы и сложные иероглифы, представленные в табл.17.1.\nТаблица 17.1. Графемы и сложные иероглифы\nСимволы\nТранскрипция\nЗначение҆\nl; yu\nрадоваться; музыка\n\nzi\nнаходиться; в…\ntng\nвместе, совместно;\nобщий\n\ngu\nдорогой\n\nkě\nможно, разрешено\n\ngē\nстарший брат\n\nd\nмладший брат\n\ndiӽn\nточка; капелька, чутьчуть; час (на часах)\n\nmi\nне\n\nhn\nкитайский\n\nnn\nсложный, трудный\n\n-de\nсуффикс\n\nshī\nучитель\n\nhuān\nрадоваться; любить\n\nyī\nмедицина\n\nsu\nгоды, лета\nСимволы\nТранскрипция\nЗначение\n\ni\nлюбить\nhӽo\nхороший\n\nmng\nсветлый; следующий\n\nmng\nназвание\n\nkn\nсмотреть; читать\n\ngu\nгосударство, страна\n\nxӿ\nрадоваться\n\nnӽ\nкакой, который\n\nрусский\n\ny\ny\nязык\n\nmā\nмама\n\nb\nпапа\nh\nгармония; союз «и»\n\nhěn\nочень\n\nkui\nбыстрый\n\nxin\nтеперь, сейчас\n\n \nСимволы\nТранскрипция\nЗначение\n\njio\nзвать, называть\n\ngu\nсобака\nСимволы\nТранскрипция\nЗначение\n\ntīng\nслушать\nӑ\nxiē\nнесколько, некоторое\nколичество\nГРАФЕМЫ\n1. Радоваться (l), музыка (yu).\nГрафема восходит к изображению древнекитайского музыкального инструмента, являясь\nупрощенной формой сложного иероглифа . В современном языке употребляется самостоятельно в значении музыка, а также радоваться и всегда пишется в правой части иероглифа.\nя\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. Находиться, в… (zi).\nЭтот знак изначально состоял из элементов (t)— земля и\nя (ci)— только (фонетик), однако в современном написании его нельзя разложить на более простые графемы,\nпоэтому мы рассматриваем его здесь как графему. В качестве компонента эта графема\nвстречается редко, но является одним из наиболее часто встречающихся иероглифов\nв современном китайском языке.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Дорогой (gu).\nЭта графема произошла от изображения рук и горсти земли, которая ценилась дороже\nвсего. В сегодняшнем варианте написания она содержит элемент (ракушка\n). В современном китайском языке она употребляется самостоятельно в своем исходном значении.\nВ качестве компонента эта графема всегда пишется в правой части иероглифа.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Можно, разрешено (kě).\nПроисхождение этой графемы не вполне ясно. В современном китайском языке она\nупотребляется в значениях можно, разрешено и в качестве компонента обычно пишется\nв правой части иероглифа.\nПримеры употребления\nПорядок написания черт\n\n \n5. Вместе, совместно, общий (tng).\nСчитается, что эта графема произошла от изображения крышки. В качестве компонента\nона всегда пишется в правой части иероглифа.\nПримеры употребления\nПорядок написания черт\nНЕАССОЦИАТИВНЫЕ ИЕРОГЛИФЫ\n1. Старший брат (gē).\n\nЭтот иероглиф произошел от сочетания двух фонетиков.\nСостав: можно, разрешено (kě): + можно, разрешено (kě): .\nПример употребления: (gēge)— старший брат.\n2. Младший брат (d).\n\nПроисхождение этого иероглифа не совсем понятно.\nСостав: основной элемент не имеет названия и вариантов чтения:\n+ делить (bā): ѭ.\nПример употребления: (ddi)— младший брат.\n3. Час (на часах), точка, капелька, чуть-чуть (diӽn).\n\nСмысл этого иероглифа сейчас не совсем понятен. Полная форма написания: .\nСостав: занимать, оккупировать (zhān): + огонь (hu): .\nПример употребления: (ydiӽn)— немного, чуть-чуть.\n4. Не (mi).\n\nИзначально этот иероглиф означал тонуть, однако полностью его смысл непонятен.\nПолная форма написания: .\nСостав: вода (shuӿ): + пика: .\nПример употребления:\n(miyu)— не иметь.\n5. Китайский (hn).\n\nЭтот иероглиф является сильно упрощенной формой сложного иероглифа . В современном варианте написания он не несет смысла.\nПолная форма написания: .\nСостав: вода (shuӿ): + правая рука (yu): .\nПример употребления: (Hny\ny )— китайский язык.\n6. Сложный, трудный (nn).\n\nЯвляется сильно упрощенной формой сложного иероглифа . Хотя в современном\nварианте написания он не несет смысла, его можно рассматривать как «птицу в руке».\nЭто может означать, что ее сложно поймать или удержать. Полная форма написания: .\nСостав: правая рука (yu):\n+ короткохвостая птица (zhuī): .\nПример употребления: (nnxu)— сложный в изучении.\n\n \n7. Суффикс (-de).\n\nСмысл этого иероглифа сейчас не совсем понятен.\nСостав: шаг (ch): + этот элемент не имеет названия и вариантов чтения: .\nПример употребления: (zu de kui)— быстро идти.\n8. Учитель (shī).\n\nСмысл этого иероглифа сейчас не совсем понятен. Полная форма написания: .\nСостав: это сокращенный вариант графемы (стена): + окружать, осаждать (zā): .\nПример употребления: (lӽoshī)— учитель.\n9. Радоваться, любить (huān).\n\nПравый элемент этого иероглифа является детерминативом, но левый из-за упрощения\nутратил функцию фонетика. Полная форма написания: .\nСостав: открытый рот (qin): + правая рука (yu):\nПример употребления: (xӿhuan)— нравиться, любить.\n10. Медицина (yī).\n\nИзначально этот иероглиф означал колчан со стрелами, однако им был заменен более\nсложный иероглиф с другим смыслом. Полная форма написания: .\nСостав: ящик: + стрела (shӿ): . Пример употребления: (yīshēng)— врач.\n11. Годы, лета (su).\n\nЭтот иероглиф является упрощенной формой сложного иероглифа . В современном\nварианте написании он не несет смысла. Полная форма написания:\n\nСостав: гора (shān): + вечер (xī): .\nПример употребления: Ѡ(W rshsān su.)— Мне 23 года.\n12. Любить (i).\n\nСмысл этого иероглифа ни в полной, ни в упрощенной формах сейчас не совсем понятен.\nПолная форма написания: .\nСостав: когти (zhӽo): + покрытие (m): + друг (yu):\nПримеры употребления:(W i nӿ.)— Я тебя люблю.\n(kě’i)— милый.\nАССОЦИАТИВНЫЕ ИЕРОГЛИФЫ (ИДЕОГРАММЫ)\n1. Хороший (hӽo).\nЭтот иероглиф означал чувства между матерью и ребенком. Также можно сказать, что\nкогда у женщины есть ребенок, то это хорошо.\nСостав: женщина (n):\n+ ребенок (zӿ): .\nПримеры употребления: (Nӿh\nӿ ӽo!)— Здравствуй! (hěn hӽo)— очень хорошо.\n2. Светлый, следующий (mng).\n\nПредставьте, как было бы светло, если бы на небе одновременно взошли оба небесных\nсветила. Состав: солнце (r): + луна (yu): .\nПримеры употребления: (mngtiān)— завтра. (mngnin)— в следующем году.\n\n \n3. Название (mng).\n\nВечером в темноте человек может обозначить себя, произнеся вслух свое имя.\nСостав: вечер (xī): + рот (ku): .\nПример употребления: (mngzi)— имя.\n4. Смотреть, читать (kn).\n\nЕсли поднести руку к глазам, это позволяет лучше видеть.\nСостав: рука (shu):\n+ глаз (m): .\nПример употребления: к (knshū)— читать (книги).\n5. Государство, страна (gu).\n\nВ современном написании этот иероглиф состоит из элемента (ограда), символизирующего границу государства, и элемента (нефрит), который являлся символом власти.\nПолная форма написания:\n. Состав: ограда: + нефрит, яшма (y): .\nПримеры употребления: Ё(Zhōnggu)— Китай.\n(gu)— Россия.\n6. Радоваться (xӿ).\n\nИзначально этот иероглиф означал бить в барабан и петь.\nСостав: барабан (zh):\nф\n+ рот (ku): .\nПример употребления: (xӿhuan)— нравиться, любить.\nФОНОИДЕОГРАММЫ\n1. Какой, который (nӽ).\n\nЭлементчасто выступает в роли детерминатива в служебных словах и словах, означающих абстрактные понятия. Состав: детерминатив рот (ku): + фонетик то (n): .\nПримеры употребления: (zi nӽli?)— где? (nӽge)— который.\n2. Внезапный, русский ().\n\nЗдесь не вполне ясно, почему в роли детерминатива выступает иероглиф ӱ (человек).\nСостав: детерминатив человек (rn):\nк\nӱ+ фонетик я (w\nя\nу\nПримеры употребления:\n(gu)— Россия.\nҎ (gurn)— русский, россиянин.\n(wn)— русский язык.\n(y\ny )— русский язык.\n3. Язык (y\ny ).\n\nЭлемент обычно выступает в роли детерминатива в словах, связанных с речью, словами, документами, образованием. Полная форма написания: .\nСостав: детерминатив слова, речь (yn): + фонетик я (устар.) (w):\nя\nПримеры употребления: (Hny\ny )— китайский язык.\n(y\ny )— русский язык.\n4. Мама (mā).\n\nДетерминатив указывает на женский пол. Полная форма написания: .\nСостав: детерминатив женщина (n):\n+ фонетик лошадь (mӽ): .\nПример употребления: (māma)— мама.\n\n \n5. Папа (b).\n\nДетерминатив может указывать на отца или деда.\nСостав: детерминатив отец (f): + фонетик удав (bā): .\nПример употребления: (bba)— папа.\n6. Гармония, союз «и» (h).\nСкорее всего, раньше этот иероглиф означал «гармонично петь», поэтому здесь употребляется детерминатив рот: .\nСостав: фонетик злак (h):\nк\n+ детерминатив рот (ku): .\nПример употребления: Ҫ (w h tā)— я и он.\n7. Очень (hěn).\n\nЗдесь не вполне ясно, почему в роли детерминатива выступает иероглиф (шаг).\nСостав: детерминатив шаг (ch): + фонетик преграда (gn): .\nПример употребления: (hěn hӽo)— очень хорошо.\n8. Быстрый, радостный (kui).\n\nДетерминатив указывает на чувства, эмоции.\nСостав: детерминатив сердце (xīn): + фонетик gui: .\nПример употребления: (zu de kui)— быстро идти.\n9. Теперь, сейчас (xin).\n\nЭтот иероглиф, скорее всего, означал блеск драгоценного камня, а точнее нечто, бросающееся в глаза. Полная форма написания:\nр\nСостав: детерминатив яшма, нефрит (y): + фонетик видеть (jin): .\nПример употребления: (xinzi)— сейчас.\n10. Звать, называть (jio).\n\nЭлемент часто выступает в роли детерминатива в служебных словах, а также в словах, связанных с речью, голосом.\nСостав: детерминатив рот (ku): + фонетик виться (jiū):\nя\nџ.\nПример употребления: ҔМ(Nӿ jio shnme mngzi?)— Как тебя зовут?\n11. Собака (gu).\n\nВ роли фонетика здесь выступает графема (j)— фраза, которая раньше имела другой вариант чтения. Состав: детерминатив собака (quӽn): + фонетик фраза (j):\nд\nПример употребления: (y zhī xiӽo gu)— одна собачка.\n12. Слушать (tīng).\n\nЭлемент часто выступает в роли детерминатива в служебных словах, а также в словах, связанных с речью, голосом. Полная форма написания: .\nСостав: детерминатив рот (ku): + фонетик топор (jīn): .\nПримеры употребления: (hӽotīng) — благозвучный. Ф (tīng yīnyu) —\nслушать музыку.\n\n \n13. Несколько, некоторое количество (xiē).\nӑ\nВ роли детерминатива здесь выступает числительное Ѡ (r)— два, которое указывает\nна множественность.\nСостав: фонетик этот (cӿ): + детерминатив два (r): ӂ.\nПримеры употребления:ѯк (zhxiē shū)— эти книги.ѯҎ(nxiē rn)— те люди."],["ЗАДАНИЯ","1. Прочитайте и переведите следующие иероглифы, назовите, из каких компонентов они состоят:҆\n\nӑ\n2. Проч function illo(name, caption){
  const wrap=document.createElement('figure');
  const markup=SVG_ILL[name]||'';
  if(markup){
    const doc=new DOMParser().parseFromString(markup,'image/svg+xml');
    const svg=doc.documentElement;
    if(svg && svg.tagName && svg.tagName.toLowerCase()==='svg'){
      svg.setAttribute('class','ill'); wrap.appendChild(document.importNode(svg,true));
    }
  }
  const fc=document.createElement('figcaption');
  fc.textContent=(caption||MOTIF_NAMES[name]||'')+(MOTIF_EMO[name]?(' '+MOTIF_EMO[name]):'');
  wrap.appendChild(fc);
  return wrap;
}
function motifStrip(names){
  const d=document.createElement('div'); d.className='motif';
  names.forEach(n=>{ if(Array.isArray(n)) d.appendChild(illo(n[0],n[1])); else d.appendChild(illo(n)); });
  return d;
}

/* ================= КЛЮЧИ К УПРАЖНЕНИЯМ ================= */
function keyOf(ex){
  if(ex.t==='choice'||ex.t==='mcq') return (ex.opts&&ex.opts[ex.ans])||'';
  if(ex.t==='fill'||ex.t==='fillRu') return dispAns(ex);
  if(ex.t==='tone4') return toneVowel(ex.syl,ex.answerIdx+1)+' ('+(ex.answerIdx+1)+'-й тон)';
  if(ex.t==='match') return (ex.pairs||[]).map(p=>p[0]+' — '+p[1]).join('; ');
  if(ex.t==='order') return (ex.tokens||[]).join('');
  if(ex.t==='dictation') return ex.answer+(ex.pin?(' ('+ex.pin+')'):'');
  if(ex.t==='translate') return ex.sample+(ex.pin?(' ('+ex.pin+')'):'');
  if(ex.t==='stroke') return ex.opts[ex.ans];
  if(ex.t==='gap') return ex.answer;
  return ex.sample||ex.answer||'';
}
function keyTag(ex){
  return ({choice:'выбор',mcq:'выбор',fill:'ввод',fillRu:'ввод',tone4:'тон',match:'сопоставить',
    order:'порядок',dictation:'диктант',translate:'перевод',stroke:'черты',gap:'пропуск'})[ex.t]||'задание';
}
function keysForLesson(lid){

/* 1. Сопоставление (иероглиф ↔ перевод) */
function renderMatch(ex, inline){
  ex.id=ex.id||('m_'+uid());
  const {box,body,fb}=exBox('Сопоставить');
  body.appendChild(el('div','q',esc(ex.q||'Соедините иероглиф и перевод:')));
  const wrap=el('div','match-grid');
  const leftCol=el('div'), rightCol=el('div');
  const L=[], R=[];
  ex.pairs.forEach((p,i)=>{
    const b=el('button','match-btn','<span class="han">'+esc(p[0])+'</span>');
    b.dataset.side='L'; b.dataset.idx=i; L.push(b); leftCol.appendChild(b);
  });
  shuffle(ex.pairs.map((p,i)=>i)).forEach(i=>{
    const b=el('button','match-btn'); b.textContent=ex.pairs[i][1];
    b.dataset.side='R'; b.dataset.idx=i; R.push(b); rightCol.appendChild(b);
  });
  let selL=null, correct=0;
  function onPick(ev){
    const b=ev.currentTarget; if(box._done||b.disabled) return;
    if(b.dataset.side==='L'){ L.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=b; return; }
    if(!selL){ fb.className='feedback bad'; fb.textContent='Сначала выберите иероглиф слева.'; return; }
    if(b.dataset.idx===selL.dataset.idx){
      b.classList.add('correct'); selL.classList.add('correct');
      b.disabled=true; selL.disabled=true; selL.classList.remove('sel'); selL=null; correct++;
      fb.className='feedback ok'; fb.textContent='Верно! ('+correct+' из '+ex.pairs.length+')';
      if(correct===ex.pairs.length){ box._done=true; markDone(ex._lid,exKey(ex),true); if(inline) inline(true); }
    } else {
      b.classList.add('wrong');
      fb.className='feedback bad'; fb.textContent='Не совпадает — попробуйте снова.';
      const bb=b; setTimeout(()=>bb.classList.remove('wrong'),700);
    }
  }
  L.concat(R).forEach(b=>b.onclick=onPick);
  wrap.appendChild(leftCol); wrap.appendChild(rightCol); body.appendChild(wrap);
  const line=el('div','btnline');
  line.appendChild(showAnsBtn(()=>{ fb.className='feedback'; fb.innerHTML='Пары: '+ex.pairs.map(p=>esc(p[0])+' — '+esc(p[1])).join('; '); }));
  body.appendChild(line);
  return box;
}

/* 2. Порядок слов */
function renderOrder(ex, inline){
  ex.id=ex.id||('o_'+uid());
  const {box,body,fb}=exBox('Порядок слов');
  body.appendChild(el('div','q','Составьте предложение: <b>'+esc(ex.ru)+'</b>'));
  const ansRow=el('div','order-ans');
  const poolRow=el('div','opt');
  let built=[];
  function paint(){
    ansRow.innerHTML='';
    built.forEach((t,idx)=>{ const b=el('button',null,'<span class="han">'+esc(t)+'</span>');
      b.onclick=()=>{ if(box._done) return; built.splice(idx,1); addPool(t); paint(); }; ansRow.appendChild(b); });
    if(!built.length) ansRow.appendChild(el('span','lesson-status','нажимайте слова ниже'));
  }
  function addPool(t){
    const b=el('button',null,'<span class="han">'+esc(t)+'</span>');
    b.onclick=()=>{ if(box._done) return; b.remove(); built.push(t); paint(); };
    poolRow.appendChild(b);
  }
  shuffle(ex.tokens).forEach(addPool); paint();
  body.appendChild(ansRow); body.appendChild(poolRow);
  const line=el('div','btnline');
  const chk=el('button','btn','Проверить');
  const show=showAnsBtn(()=>{ fb.className='feedback'; fb.innerHTML='Ответ: <span class="correct-ans han">'+esc(ex.tokens.join(' '))+'</span> <span class="pin">'+esc(ex.pin||'')+'</span>'; });
  line.appendChild(chk); line.appendChild(show); body.appendChild(line);
  chk.onclick=()=>{
    if(box._done) return;
    if(built.join('')===ex.tokens.join('')){
      box._done=true; fb.className='feedback ok'; fb.textContent='Верно! '+(ex.pin||'');
      poolRow.querySelectorAll('button').forEach(b=>b.disabled=true);
      markDone(ex._lid,exKey(ex),true); if(inline) inline(true);
    } else { fb.className='feedback bad'; fb.textContent='Порядок неверный — переставьте слова.'; }
  };
  return box;
}

/* ================= РАСШИРЕННЫЙ ГЕНЕРАТОР ================= */
const CLASSIFIERS=[
 {h:'个',p:'gè',use:'общее счётное слово',ex:'一个人'},
 {h:'本',p:'běn',use:'для книг и тетрадей',ex:'一本书'},
 {h:'张',p:'zhāng',use:'для плоских предметов',ex:'一张桌子'},
 {h:'把',p:'bǎ',use:'для предметов с ручкой',ex:'一把椅子'},
 {h:'只',p:'zhī',use:'для животных и парных предметов',ex:'一只猫'},
 {h:'杯',p:'bēi',use:'для чашек и стаканов',ex:'一杯茶'},
 {h:'件',p:'jiàn',use:'для одежды и дел',ex:'一件衣服'},
 {h:'口',p:'kǒu',use:'для людей в семье',ex:'三口人'}
];
function genClassifierQ(lid){
  const c=pick(CLASSIFIERS);
  const others=sample(CLASSIFIERS.filter(x=>x.h!==c.h),3);
  const opts=shuffle([c].concat(others));
  return {t:'choice', q:'Какое счётное слово подходит: '+c.ex+'? ('+c.use+')',
    opts:opts.map(o=>o.h+' ('+o.p+')'), ans:opts.indexOf(c), expl:c.h+' '+c.p+' — '+c.use, _lid:lid};
}
const TONE_PAIRS=[
 {a:'mā',b:'mǎ',ra:'мама',rb:'лошадь'},
 {a:'mǎi',b:'mài',ra:'покупать',rb:'продавать'},
 {a:'shuì',b:'shuǐ',ra:'спать',rb:'вода'},
 {a:'wèn',b:'wěn',ra:'спрашивать',rb:'целовать'},
 {a:'zhī',b:'zhǐ',ra:'(счётное слово)',rb:'бумага'},
 {a:'hǎo',b:'hào',ra:'хороший',rb:'любить (что-то)'}
];
function genTonePairQ(lid){
  const p=pick(TONE_PAIRS); const first=Math.random()<0.5;
  const target=first?p.a:p.b, meaning=first?p.ra:p.rb, other=first?p.b:p.a;
  const opts=shuffle([target,other]);
  return {t:'choice', q:'Как произносится «'+meaning+'»?', opts:opts, ans:opts.indexOf(target),
    expl:target+' — '+meaning+'; '+other+' — '+(first?p.rb:p.ra), _lid:lid};
}
function genMatchQ(lid){
  const pool=(poolOf(lid)||[]).filter(w=>w.h&&w.r&&w.r.length<26);
  if(pool.length<4) return null;
  const chosen=sample(pool,4);
  return {t:'match', q:'Соедините иероглиф и перевод:', pairs:chosen.map(w=>[w.h,w.r]), _lid:lid};
}
function genOrderQ(lid){
  const s=pick(SENTENCES);
  return {t:'order', ru:s.ru, tokens:s.words, pin:s.pin, _lid:lid};
}
function genDictationQ(lid){
  const pool=(poolOf(lid)||[]).filter(w=>w.h&&w.h.length<=2);
  if(!pool.length) return null;
  const w=pick(pool);
  return {t:'dictation', audio:w.h, answer:w.h, pin:w.p, _lid:lid};
}
function genTranslateQ(lid){
  const s=pick(SENTENCES);
  return {t:'translate', q:'Переведите на китайский: «'+s.ru+'»', sample:s.words.join(''),
    pin:s.pin, accept:[s.words.join('')], _lid:lid};
}
function genStrokeQ(lid){
  const s=pick(STROKE_SAMPLES);
  const others=sample(STROKE_SAMPLES.filter(x=>x.h!==s.h),3);
  const opts=shuffle([s].concat(others));
  return {t:'stroke', q:'Сколько черт в иероглифе?', han:s.h, opts:opts.map(o=>String(o.n)+(o.n===1?' черта':' черты')),
    ans:opts.indexOf(s), expl:s.h+' '+s.p+' — '+s.r+': '+s.n+' черт(ы).', _lid:lid};
}

const GEN_ALL=[genToneQ,genSentenceQ,genMCQ,genPickHan,genFillPin,genFillRu,
  genClassifierQ,genTonePairQ,genMatchQ,genOrderQ,genDictationQ,genTranslateQ,genStrokeQ];
function renderOneGen(ex, host){
  ex.id='gen_'+uid(); ex._gen=true;
  if(ex.t==='toneQ'){ renderGenToneQ(ex,host); return; }
  if(ex.t==='sent'){ renderGenSentQ(ex,host); return; }
  const node=renderExercise(ex);
  if(node) host.appendChild(node);
}
function genLessonSet(lid, host, n){
  host.innerHTML='';
  const want=n||6;
  /* гарантируем разнообразие: берём разные типы по кругу */
  const groups=[
    [genToneQ,genTonePairQ],      // тон
    [genSentenceQ,genOrderQ],     // предложение
    [genMCQ,genClassifierQ],      // выбор
    [genPickHan],                 // иероглиф
    [genFillPin,genFillRu],       // ввод
    [genMatchQ],                  // сопоставить
    [genDictationQ],              // диктант
    [genTranslateQ],              // перевод
    [genStrokeQ]                  // черты
  ];
  const order=shuffle(groups.map((g,i)=>i));
  let placed=0;
  for(const gi of order){
    if(placed>=want) break;
    const g=pick(groups[gi]);
    let ex=null;
    try{ ex=g(lid); }catch(e){ ex=null; }
    if(!ex) continue;
    ex._lid=lid||'all';
    try{ renderOneGen(ex,host); placed++; }catch(e){}
  }
  /* добираем, если что-то не отрисовалось */
  let guard=0;
  while(placed<want && guard<24){
    guard++;
    const g=pick(GEN_ALL);
    let ex=null; try{ ex=g(lid); }catch(e){ ex=null; }
    if(!ex) continue;
    ex._lid=lid||'all';
    try{ renderOneGen(ex,host); placed++; }catch(e){}
  }
}

const BOOK_HEAD_MAP=[
 ['ФОНЕТИКА','Фонетика'],['ИЕРОГЛИФИКА','Иероглифика'],
 ['УПРАЖНЕНИЯ НА ФОНЕТИКУ','Упражнения на фонетику'],['УПРАЖНЕНИЯ НА ЛЕКСИКУ','Упражнения на лексику'],

];
function bookSectionBody(t){
  const wrap=el('div','book-sec-body');
  const blocks=t.split(/\n{2,}/);
  blocks.forEach(b=>{
    const lines=b.split('\n').map(x=>x.trim()).filter(Boolean);
    if(!lines.length) return;
    const head=lines[0].toUpperCase();
    const hit=BOOK_HEAD_MAP.find(h=>head===h[0]||head.startsWith(h[0]));
    if(hit && lines.length===1){ wrap.appendChild(el('h4','book-sub',esc(hit[1]))); return; }
    // list-like block (short lines) -> list
    const short=lines.filter(l=>l.length<90).length;
    if(lines.length>2 && short/lines.length>0.8 && lines.every(l=>l.length<160)){
      const ul=el('ul','book-list');
      lines.forEach(l=>{
        const m=l.match(/^(\d{1,2}[.)])\s*(.+)$/);
        const li=el('li');
        li.innerHTML=m?('<b>'+esc(m[1])+'</b> '+esc(m[2])):esc(l);
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    } else {
      wrap.appendChild(el('p','book-p',esc(lines.join(' '))));
    }
  });
  return wrap;
}
function renderBookLesson(main, lid){
  const L=LESSONS[lid]; const n=L.num;
  const secs=(BOOK_TEXT.lessons[String(n)]||[]);
  const title=pageTitle('Полный текст: '+esc(L.n), 'Дословный текст урока из книги М. Карловой — фонетика, иероглифика, задания, прописи.');
  main.appendChild(title);
  if(!secs.length){ main.appendChild(el('p','legend','Текст урока не найден.')); return; }
  const bar=card('plain');
  bar.appendChild(el('p','legend','Разделы урока по книге. Прокрутите страницу или выберите раздел.'));
  const chips=el('div','book-chips');
  secs.forEach((s,i)=>{
    const a=el('a','book-chip',esc(s[0].slice(0,40)));
    a.href='#booksec_'+n+'_'+i;
    a.onclick=e=>{ e.preventDefault(); const t=document.getElementById('booksec_'+n+'_'+i); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); };
    chips.appendChild(a);
  });
  bar.appendChild(chips); main.appendChild(bar);

  secs.forEach((s,i)=>{
    const c=card();
    c.id='booksec_'+n+'_'+i;
    const hh=el('h3','book-sec-h',esc(s[0]));
    c.appendChild(hh);
    c.appendChild(bookSectionBody(s[1]));
    main.appendChild(c);
  });
  // иероглифы к примерам урока
  const gl=hanziGloss(lid);
  if(gl){ gl.classList.add('book-gloss'); main.appendChild(gl); }
  // вопросы к тексту
  const rq=READ_Q[L.num];
  if(rq){ const qb=questionBlock(rq,'Вопросы к тексту урока'); qb.classList.add('book-q'); main.appendChild(qb); }

  const nav=card('plain');
  const ln=el('div','btnline');
  if(n>1){ const p=el('button','btn ghost','← Урок '+(n-1)); p.onclick=()=>go('book_'+(n-1)); ln.appendChild(p); }
  const toL=el('button','btn','Открыть интерактивный урок'); toL.onclick=()=>go('l'+n); ln.appendChild(toL);
  if(n<17){ const q=el('button','btn ghost','Урок '+(n+1)+' →'); q.onclick=()=>go('book_'+(n+1)); ln.appendChild(q); }
  nav.appendChild(ln); main.appendChild(nav);
}
function renderBookHub(main){
  main.appendChild(pageTitle('Полный текст учебника','Весь текст книги М. Карловой: предисловие, введение и все 17 уроков — дословно, по разделам.'));
  const c=card('plain');
  c.appendChild(el('div','btnline'));
  main.appendChild(c);

  /* предисловие и введение — очищенный текст с пояснениями */
  (typeof FRONT_MATTER!=='undefined'?FRONT_MATTER:[]).forEach(sec=>{
    const fc=card();
    fc.appendChild(el('h3',null,esc(sec[0])));
    const body=el('div','front-body');
    (sec[1]||[]).forEach(p=>{
      const m=p.match(/^(\d{1,2})\.\s*(.*)$/);
      if(m){ const li=el('div','front-num'); li.innerHTML='<b>'+esc(m[1])+'.</b> '+esc(m[2]); body.appendChild(li); }
      else body.appendChild(el('p','rich-p',esc(p)));
    });
    fc.appendChild(body);
    const notes=(typeof FRONT_NOTES!=='undefined')?FRONT_NOTES[sec[0]]:null;
    if(notes && notes.length){
      fc.appendChild(el('h4','rich-h','Пояснения'));
      const nl=el('div','front-notes');
      notes.forEach(n=>{
        const d=el('details','front-note');
        d.appendChild(el('summary','front-note-h',esc(n[0])));
        d.appendChild(el('div','front-note-b',esc(n[1])));
        nl.appendChild(d);
      });
      fc.appendChild(nl);
    }
    main.appendChild(fc);
  });

  const g=card();
  g.appendChild(el('h3',null,'Все уроки'));
  const grid=el('div','book-grid');
  for(let i=1;i<=17;i++){
    const L=LESSONS['l'+i];
    const a=el('a','book-card-link');
    a.href='#';
    const secs=(BOOK_TEXT.lessons[String(i)]||[]).length;
    a.innerHTML='<b>'+esc(L.n)+'</b><span>'+secs+' разделов</span><span class="book-open">Читать текст →</span>';
    a.onclick=e=>{ e.preventDefault(); go('book_'+i); };
    grid.appendChild(a);
  }
  g.appendChild(grid); main.appendChild(g);
}

function hanziFor(py){
  const k=String(py||'').trim().toLowerCase();
  return HANZI_SAFE[k]||'';
}
function hanziGloss(lid){
  const L=LESSONS[lid]; const n=L?L.num:null;
  const rows=(HANZI_GLOSS[String(n)]||[]);
  if(!rows.length) return null;
  const c=el('div','gloss');
  c.appendChild(el('div','gloss-cap','Слова урока с иероглифами'));
  const tb=el('table','gloss-table');
  const hr=el('tr'); ['Иероглиф','Пиньинь','Значение',''].forEach((h,i)=>{
    const th=el('th',null,h); if(i===3) th.className='gloss-audio'; hr.appendChild(th);
  });
  tb.appendChild(hr);
  rows.forEach(r=>{
    const tr=el('tr');
    tr.innerHTML='<td class="han gloss-han">'+esc(r[0])+'</td>'+
      '<td class="pin">'+esc(r[1])+'</td>'+
      '<td>'+esc(r[2])+'</td>';
    const td=el('td','gloss-audio'); td.appendChild(audioBtn(r[0]));
    tr.appendChild(td); tb.appendChild(tr);
  });
  c.appendChild(tb); return c;
}
function questionBlock(items, cap){
  const c=el('div','quest-block');
  c.appendChild(el('div','quest-cap',esc(cap||'Вопросы к тексту')));
  const ol=el('ol','quest-list');
  items.forEach(it=>{
    const li=el('li');
    li.innerHTML='<span class="quest-q">'+esc(it[0])+'</span>'+
      '<button class="btn ghost small quest-toggle">Показать ответ</button>'+
      '<div class="quest-a hidden">'+esc(it[1])+'</div>';
    const b=li.querySelector('.quest-toggle'), a=li.querySelector('.quest-a');
    b.onclick=()=>{ a.classList.toggle('hidden'); b.textContent=a.classList.contains('hidden')?'Показать ответ':'Скрыть ответ'; };
    ol.appendChild(li);
  });
  c.appendChild(ol); return c;
}

function breakdownBlock(lid, kind){

  c.appendChild(sum);
  c.appendChild(wordChips(rows));
  return c;
}

   {t:'p',x:'Тон различает смысл: mā «мама», má «конопля», mǎ «лошадь», mà «ругать». Сочетания тоже различаются: jiàoshī «преподаватель» и jiàoshì «аудитория»; liánxì «связь» и liànxí «упражняться».'},
   {t:'h',x:'Нулевой тон'},
   {t:'p',x:'Чаще всего в нулевом тоне оказывается второй слог двусложного слова: māma «мама», bàba «папа», péngyou «друг». После первого, второго и четвёртого тонов нулевой тон произносится ниже, после третьего (самого низкого) — выше.'},
   {t:'p',x:'При сочетании третьего тона с нулевым, вторым или четвёртым третий тон теряет восходящую часть и произносится как «полутретий» (низкий).'},
   {t:'h',x:'Инициали b, m, f — губные'},
   {t:'table',head:['Инициаль','Произношение','Комментарий'],rows:[
     ['b [b]','полузвонкий, между русскими п и б','произносится как п, но чуть звонче, без напряжения'],
     ['m [m]','как русское м','губно-носовой, аналогичен русскому'],
     ['f [f]','как русское ф','губно-зубной, участвуют зубы']]},
   {t:'h',x:'Финали a, u, o, i'},
   {t:'table',head:['Финаль','Артикуляция','Отличие от русского'],rows:[
     ['a [a]','язык отодвинут назад, спинка приподнята','русское а — язык опущен вниз'],
     ['o [o]','язык оттянут назад и вверх к мягкому нёбу, губы округлены','более закрытое, чем русское о; только с b, p, m, f'],
     ['u [u]','язык не так сильно отодвинут назад, губы менее выдвинуты','меньше напряжения, чем в русском у'],
     ['i [i]','губы сильнее растянуты','близко к русскому и; точка над i исчезает под знаком тона']]},
   {t:'ex',rows:[['ba','bā bá bǎ bà — все четыре тона'],['ma','mā má mǎ mà'],['fa','fā fá fǎ fà'],['bi','bī bí bǐ bì']]},
   {t:'p',x:'Финаль o употребляется только с инициалями b, p, m, f. Слог bo читается как «буо» с очень кратким u.'}
  ]},
 3:{intro:'Инициали d, n, l. Финали ai, ao, ou, uo.',
  blocks:[
   {t:'h',x:'Инициали d, n, l'},
   {t:'table',head:['Инициаль','Место образования','Как произносить'],rows:[
     ['d [d]','переднеязычный, непридыхательный','кончик языка у альвеол; среднее между русскими д и т, ближе к т'],
     ['t [t]','переднеязычный, придыхательный','как русское т, но с сильным выдохом'],
     ['n [n]','переднеязычный носовой','как русское н; кончик языка у альвеол'],
     ['l [l]','боковой','как русское л; кончик языка у альвеол, воздух идёт по бокам']]},
   {t:'p',x:'Главное различие d и t — придыхание: d произносится без выдоха, t — с сильным выдохом. Проверка: поднесите ладонь ко рту — при t чувствуется толчок воздуха.'},
   {t:'h',x:'Дифтонги и трифтонги'},
   {t:'p',x:'Дифтонг — финаль из двух гласных, произносится слитно, одним слогом. Первый элемент сильнее.'},
   {t:'table',head:['Финаль','Тип','Пример'],rows:[
     ['ai','дифтонг','lái 来 — приходить'],['ao','дифтонг','hǎo 好 — хороший'],
     ['ou','дифтонг','dōu 都 — все'],['uo','дифтонг с медиалью u','duō 多 — много']]},
   {t:'ex',rows:[['nǎi','nǎi — бабушка'],['lǎo','lǎo — старый'],['dōu','dōu — все'],['duō','duō — много']]},
   {t:'p',x:'Финаль uo произносится как «уо» с кратким u. В слоге не может быть больше четырёх звуков, поэтому сложные финали всегда начинаются с гласного.'}
  ]},
 4:{intro:'Инициали g, h, p, t, k. Финали ua, uai.',
  blocks:[
   {t:'h',x:'Заднеязычные g, k, h'},
   {t:'table',head:['Инициаль','Придыхание','Произношение'],rows:[
     ['g [g]','нет','задняя часть языка у мягкого нёба; среднее между г и к, ближе к к'],
     ['k [k]','сильное','как русское к, но с выдохом'],
     ['h [h]','—','заднеязычный, ближе к украинскому г или немецкому ch; не русское х']]},
   {t:'p',x:'Пара g — k различается только придыханием. Это смыслоразличительно: gā «высокий» и kā; gē «старший брат» и kē «разряд».'},
   {t:'h',x:'Придыхательные p, t, k'},
   {t:'p',x:'Три придыхательных согласных p, t, k образуют пары с непридыхательными b, d, g. Придыхание — это сильная струя воздуха после смычки. Для русского уха p, t, k звучат как русские п, т, к, а b, d, g — «звонче», но на самом деле они тоже глухие, просто без выдоха.'},
   {t:'h',x:'Финали ua, uai'},
   {t:'table',head:['Финаль','Состав','Пример'],rows:[
     ['ua','медиаль u + a','huā 花 — цветок'],['uai','медиаль u + ai','kuài 快 — быстрый']]},
   {t:'ex',rows:[['gāo','gāo — высокий'],['kàn','kàn — смотреть'],['huā','huā — цветок'],['kuài','kuài — быстрый']]},
   {t:'p',x:'Медиаль u произносится очень кратко, как переходный звук между согласным и главным гласным.'}
  ]},
 5:{intro:'Финали e, ei, ui.',
  blocks:[
   {t:'h',x:'Финаль e'},
   {t:'p',x:'Китайское e не равно русскому э. Язык оттянут назад и приподнят к мягкому нёбу, губы не растянуты. Звук близок к русскому ы в позиции между согласными, но без округления. Сравните: гэ (как в «э» с оттянутым языком).'},
   {t:'table',head:['Финаль','Произношение','Пример'],rows:[
     ['e','оттянутый назад гласный, ближе к ы/э','hē 喝 — пить'],
     ['ei','слитный дифтонг, первый элемент сильнее','hēi 黑 — чёрный'],
     ['ui','сокращённое u + ei, читается как «уэй»','duì 对 — правильно']]},
   {t:'p',x:'Финаль ui — это стяжение u + ei. В слогах gui, kui, hui, dui, tui, zhui, chui, shui, rui, zui, cui, sui она произносится как «уэй» с очень кратким u.'},
   {t:'ex',rows:[['hē','пить'],['hēi','чёрный'],['duì','правильно'],['shuǐ','вода'],['shéi','кто']]},
   {t:'p',x:'Вежливое 你 nǐ и 累 lèi — типичные слова с этими финалями.'}
  ]},
 6:{intro:'Финали an, en, uan.',
  blocks:[
   {t:'h',x:'Переднеязычные носовые -n'},
   {t:'p',x:'Конечный согласный -n переднеязычный: кончик языка прижат к альвеолам, воздух идёт через нос. Это не русское «н» в конце слова, а носовой призвук.'},
   {t:'table',head:['Финаль','Состав','Пример'],rows:[
     ['an','a + n','sān 三 — три'],['en','e + n','mén 门 — дверь'],
     ['uan','медиаль u + an','wán 完 — заканчивать']]},
   {t:'p',x:'Сравните пары, где смысл различается только носовым: an — ang, en — eng. В -an язык у альвеол (передний), в -ang корень языка у мягкого нёба (задний).'},
   {t:'ex',rows:[['sān','три'],['shān','гора'],['mén','дверь'],['fàn','еда'],['wàn','десять тысяч']]},
   {t:'h',x:'Числа с носовыми финалями'},
   {t:'p',x:'千 qiān «тысяча» и 万 wàn «десять тысяч» — отдельные слова. Нельзя сказать «десять тысяч» как 十千; правильно 一万.'}
  ]},
 7:{intro:'Финали ang, eng, uang.',
  blocks:[
   {t:'h',x:'Заднеязычный носовой -ng'},
   {t:'p',x:'Конечный -ng заднеязычный: корень языка поднимается к мягкому нёбу, кончик языка внизу. Звук похож на «нг» без отдельного г.'},
   {t:'table',head:['Финаль','Состав','Пример'],rows:[
     ['ang','a + ng','máng 忙 — занятой'],['eng','e + ng','lěng 冷 — холодный'],
     ['uang','медиаль u + ang','huáng 黄 — жёлтый']]},
   {t:'p',x:'Не путайте пары: an/ang, en/eng, in/ing, uan/uang. Разница только в положении языка — кончик у альвеол или корень у мягкого нёба.'},
   {t:'ex',rows:[['máng','занятой'],['chàng','петь'],['lěng','холодный'],['huáng','жёлтый']]},
   {t:'p',x:'Финаль ueng встречается только в слоге weng (с нулевой инициалью).'}
  ]},
 8:{intro:'Финали in, ing, un, ong. Особые инициали w, y.',
  blocks:[
   {t:'table',head:['Финаль','Носовой','Пример'],rows:[
     ['in','передний -n','yīn 音 — звук'],['ing','задний -ng','yīng 英 — герой, Англия'],
     ['un','передний -n','wèn 问 — спрашивать'],['ong','задний -ng, с округлением','dōng 东 — восток']]},
   {t:'p',x:'Финаль un — это u + en (в слогах dun, tun, lun, gun, kun, hun, zhun, chun, shun, run, zun, cun, sun). Финаль ong произносится с округлёнными губами, как «ун» с о-образным началом.'},
   {t:'h',x:'Полугласные w и y'},
   {t:'p',x:'Слоги, начинающиеся с i, u, ü без инициали, записываются через y и w: i → yi, in → yin, ing → ying; u → wu, un → wen (в слоге wen), uan → wan, uo → wo. В этих случаях w и y не произносятся как отдельные согласные, а лишь обозначают тип начального гласного.'},
   {t:'ex',rows:[['Yīngyǔ','英语 — английский язык'],['dōng','东 — восток'],['wèn','问 — спрашивать'],['yīn','音 — звук']]},
   {t:'p',x:'Цвета: 红 hóng «красный», 白 bái «белый», 黑 hēi «чёрный», 黄 huáng «жёлтый».'}
  ]},
 9:{intro:'Инициали z, c, s. Особая финаль i. Слог er.',
  blocks:[
   {t:'h',x:'Переднеязычные z, c, s'},
   {t:'table',head:['Инициаль','Придыхание','Произношение'],rows:[
     ['z [dz]','нет','слитный «дз», кончик языка у верхних зубов'],
     ['c [ts]','сильное','«ц» с придыханием'],['s [s]','—','как русское с, кончик языка у зубов']]},
   {t:'p',x:'Это плоскоязычные (не ретрофлексные) согласные: кончик языка у верхних зубов, не загибается назад. Сравните с zh, ch, sh (урок 12).'},
   {t:'h',x:'Особая финаль i'},
   {t:'p',x:'После z, c, s слоговая i не произносится как «и». Это особая финаль: язык остаётся в положении для z/c/s, а гласный звучит как редуцированный «ы»-образный призвук. Так же после zh, ch, sh, r.'},
   {t:'ex',rows:[['zì','字 — иероглиф'],['cí','词 — слово'],['sì','四 — четыре'],['shí','十 — десять']]},
   {t:'h',x:'Слог er'},
   {t:'p',x:'er — особый слог: он состоит только из финали, никогда не сочетается с инициалью. Произносится с оттянутым языком, близко к русскому «ар» без р. 二 èr «два», 耳 ěr «ухо».'},
   {t:'ex',rows:[['èr','два'],['ěr','ухо'],['ér','ребёнок'],['érzi','сын']]}
  ]},
 10:{intro:'Инициали j, q, x. Финали ia, ie, iu, iao, ian.',
  blocks:[
   {t:'h',x:'Средненёбные j, q, x'},
   {t:'table',head:['Инициаль','Придыхание','Произношение'],rows:[
     ['j [dʑ]','нет','слитное «джь», спинка языка у твёрдого нёба'],

   {t:'p',x:'Важнейшее правило: после j, q, x пишется u, но читается ü. Слоги ju, qu, xu, juan, que, jun произносятся как «цзюй», «цюй», «сюй» — с округлёнными губами.'},
   {t:'table',head:['Пишется','Читается','Пример'],rows:[
     ['ju','jü','jù 句 — предложение'],['qu','qü','qù 去 — идти'],

   {t:'table',head:['Финаль','Пример'],rows:[
     ['ia','jiā 家 — дом'],['ie','xiě 写 — писать'],['iu','jiǔ 九 — девять'],['iao','xiǎo 小 — маленький'],['ian','jiàn 见 — видеть']]},
   {t:'ex',rows:[['jiào','叫 — зваться'],['xiǎo','小 — маленький'],['qù','去 — идти'],['jiā','家 — дом']]},
   {t:'p',x:'Финаль iu — стяжение i + ou: jiǔ «девять», liù «шесть», xiū «отдыхать».'}
  ]},
 11:{intro:'Финали ian, iang, iong, ü, ün, üe, üan.',
  blocks:[
   {t:'h',x:'Носовые с медиалью i'},
   {t:'table',head:['Финаль','Носовой','Пример'],rows:[

     ['iong','задний -ng','xióng 熊 — медведь']]},

   {t:'h',x:'Финаль ü и её варианты'},

   {t:'table',head:['Финаль','Пишется','Пример'],rows:[

     ['ü в начале слога','пишется yu','yǔ 雨 — дождь'],
     ['ün','ün / yun','yún 云 — облако'],['üe','üe / yue','xuě 雪 — снег'],['üan','üan / yuan','yuán 园 — сад']]},
   {t:'ex',rows:[['nǚ','女 — женщина'],['xuě','雪 — снег'],['yún','云 — облако'],['yuǎn','远 — далёкий'],['lǜ','绿 — зелёный']]},
   {t:'p',x:'Правило: после n и l пишем ü; после j, q, x пишем u; в начале слога пишем yu.'}
  ]},
 12:{intro:'Инициали zh, ch, sh, r.',

   {t:'table',head:['Инициаль','Придыхание','Соответствие','Пример'],rows:[

   {t:'p',x:'Сравните пары: zì «иероглиф» и zhì; cì и chì; sì «четыре» и shì «быть». Ошибка в загибе языка меняет смысл слова.'},
   {t:'p',x:'После zh, ch, sh, r финаль i — особая (не «и»): zhī, chī, shī, rì произносятся с редуцированным гласным.'},

  ]},
 13:{intro:'Эризация. Сочетание тонов с нулевым. Суффиксы -zi, -tou.',
  blocks:[
   {t:'h',x:'Эризация (儿化 èrhuà)'},
   {t:'p',x:'Суффикс 儿 -r присоединяется к слогу и меняет его звучание: гласный становится немного носовым, а сам -r не произносится отдельным слогом. Эризация придаёт слову разговорный оттенок или уменьшительность.'},
   {t:'ex',rows:[['nǎr','哪儿 — где'],['zhèr','这儿 — здесь'],['nàr','那儿 — там'],['yìdiǎnr','一点儿 — немного']]},
   {t:'h',x:'Суффиксы -zi и -tou'},
   {t:'p',x:'Суффикс 子 -zi и 头 -tou присоединяются к основе и читаются в нулевом тоне. Они часто образуют названия бытовых предметов.'},
   {t:'table',head:['Слово','Чтение','Значение'],rows:[
     ['桌子','zhuōzi','стол'],['椅子','yǐzi','стул'],['杯子','bēizi','чашка'],['本子','běnzi','тетрадь'],
     ['石头','shítou','камень'],['木头','mùtou','дерево (материал)']]},
   {t:'h',x:'Сочетание тонов с нулевым'},
   {t:'p',x:'В двусложных словах второй слог часто теряет этимологический тон. Высота нулевого тона зависит от предыдущего: после 1-го, 2-го и 4-го тонов он ниже, после 3-го — выше.'},
   {t:'ex',rows:[['māma','妈+妈 — мама'],['péngyou','朋+友 — друг'],['wǒmen','我+们 — мы'],['xièxie','谢+谢 — спасибо']]},
   {t:'p',x:'Счётные слова обязательны между числом и предметом: 一个人, 一本书, 一张桌子, 一杯茶.'}
  ]},
 14:{intro:'Сочетание слогов в первом и втором тонах.',
  blocks:[
   {t:'h',x:'Правило изменения тонов (变调 biàndiào)'},
   {t:'p',x:'Тоны влияют друг на друга. Основные случаи изменения касаются третьего тона и отрицания 不.'},
   {t:'table',head:['Сочетание','Что происходит','Пример'],rows:[
     ['3-й + 3-й','первый становится 2-м','nǐ hǎo → ní hǎo 你好'],

/* ================= ОТРИСОВКА БЛОКОВ ГРАММАТИКИ И ФОНЕТИКИ ================= */
function richBlocks(blocks){
  const wrap=el('div','rich');
  (blocks||[]).forEach(b=>{
    if(b.t==='h'){ wrap.appendChild(el('h4','rich-h',esc(b.x))); return; }
    if(b.t==='p'){ wrap.appendChild(el('p','rich-p',esc(b.x))); return; }
    if(b.t==='note'){ wrap.appendChild(el('div','rich-note',esc(b.x))); return; }
    if(b.t==='ex'){
      const t=el('div','rich-ex');
      (b.rows||[]).forEach(r=>{
        const row=el('div','rich-ex-row');
        row.innerHTML='<span class="han rich-ex-han">'+esc(r[0])+'</span>'+
          '<span class="rich-ex-ru">'+esc(r[1])+'</span>';
        const a=el('span','rich-ex-a'); a.appendChild(audioBtn(r[0]));
        row.appendChild(a);
        t.appendChild(row);
      });
      wrap.appendChild(t); return;
    }
    if(b.t==='table'){
      const tb=el('table','rich-table');
      if(b.head){ const hr=el('tr'); b.head.forEach(h=>hr.appendChild(el('th',null,esc(h)))); tb.appendChild(hr); }
      (b.rows||[]).forEach(r=>{
        const tr=el('tr');
        r.forEach((c,i)=>{
          const isHan=/^[\u4e00-\u9fff]/.test(c) && c.length<=4;
          tr.appendChild(el('td', isHan?'han rich-td-han':'', esc(c)));
        });
        tb.appendChild(tr);
      });
      wrap.appendChild(tb); return;
    }
  });
  return wrap;
}
function phonDetailNode(lid){
  const L=LESSONS[lid]; const d=PHON_DETAIL[L.num]; if(!d) return null;
  const c=el('div','detail-block');
  const hd=el('div','detail-head');
  hd.appendChild(el('h3','detail-title','Фонетика подробно: '+esc(d.intro||L.phTitle)));
  c.appendChild(hd);
  c.appendChild(richBlocks(d.blocks));
  return c;
}
function gramDetailNode(lid){
  const L=LESSONS[lid]; const d=GRAM_DETAIL[L.num]; if(!d) return null;
  const c=el('div','detail-block');
  c.appendChild(el('h3','detail-title','Грамматика: '+esc(d.title)));
  c.appendChild(richBlocks(d.blocks));
  return c;
}
