<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Китайский язык: интерактивный самоучитель (по книге М. Карловой)</title>
<style>
:root{
  --red:#c23b2e; --red-d:#a52f24; --gold:#d9a441; --ink:#2b2b2b;
  --paper:#faf7f0; --card:#ffffff; --line:#e6dfd2; --muted:#7a7266;
  --teal:#1f7a74; --teal-d:#17625d; --green:#2e8b57; --soft:#f4ede0;
  --shadow:0 2px 8px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.55}
h1,h2,h3,h4{font-family:"Georgia","Times New Roman",serif;line-height:1.25;margin:.2em 0 .4em}
code,.pin{font-family:"Segoe UI",Roboto,sans-serif}
.han{font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Noto Serif SC",serif;
  font-size:1.35em;letter-spacing:.02em}
.big-han{font-size:2.6em;line-height:1}
#topbar{position:sticky;top:0;z-index:50;background:var(--red);color:#fff;
  display:flex;align-items:center;gap:10px;padding:10px 16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#topbar .brand{font-weight:700;font-size:1.05em;display:flex;align-items:center;gap:8px}
#topbar .brand .seal{background:var(--gold);color:#7a1f16;border-radius:6px;font-size:.8em;
  padding:2px 6px;font-family:"Songti SC",serif}
#burger{background:none;border:0;color:#fff;font-size:1.4em;cursor:pointer;line-height:1}
#topbar .spacer{flex:1}
#wrap{display:flex;min-height:calc(100vh - 52px)}
#nav{width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
  overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
#nav .grp-title{font-weight:700;font-size:.8em;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:16px 14px 6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
#nav .grp-title .caret{transition:transform .2s}
#nav .grp.collapsed .caret{transform:rotate(-90deg)}
#nav a.nav-link{display:block;padding:8px 14px;text-decoration:none;color:var(--ink);border-left:3px solid transparent;
  font-size:.95em}
#nav a.nav-link:hover{background:var(--soft)}
#nav a.nav-link.active{background:#f0f6f2;border-left-color:var(--green);font-weight:600}
#nav .num{display:inline-block;min-width:1.7em;color:var(--muted);font-weight:600}
#nav .status{float:right;color:var(--green);font-size:.8em}
#main{flex:1;min-width:0;padding:22px 26px 60px;max-width:980px}
@media(max-width:860px){#nav{position:fixed;left:-320px;transition:left .25s;height:100vh;max-height:100vh;z-index:60;top:0;box-shadow:2px 0 12px rgba(0,0,0,.2)}
  #nav.open{left:0}
  #topbar .brand span.full{display:none}
  #wrap{display:block}
  #main{padding:16px 14px 60px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.page-title{color:var(--red)}
.lead{font-size:1.02em;color:#444}
.kicker{color:var(--red);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:.8em}
.btn{display:inline-block;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:.95em;
  background:var(--teal);color:#fff;transition:background .15s,transform .05s}
.btn:hover{background:var(--teal-d)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:#4a3400}
.btn.gold:hover{background:#c8902f}
.btn.red{background:var(--red)}
.btn.red:hover{background:var(--red-d)}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.btn.small{padding:4px 9px;font-size:.85em}
.btn.gray{background:#e5e0d6;color:#444}
.btn:disabled{opacity:.5;cursor:default}
table{border-collapse:collapse;width:100%;margin:10px 0}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.notice{background:#fff8e6;border:1px solid #ecd9a8;border-left:5px solid var(--gold);border-radius:8px;padding:12px 14px;margin:12px 0}
.culture{background:#eef7f4;border:1px solid #cfe7e1;border-left:5px solid var(--teal);border-radius:8px;padding:14px 16px;margin:12px 0}
.culture h4{color:var(--teal-d);margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.audio-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--teal);color:var(--teal);
  border-radius:20px;padding:5px 12px;cursor:pointer;font-size:.9em}
.audio-btn.playing{background:var(--teal);color:#fff}
.audio-btn::before{content:"\25B6";font-size:.8em}
.audio-btn.playing::before{content:"\25AE"}
.vocab-row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--line)}
.vocab-row:last-child{border-bottom:0}
.vocab-row .han{min-width:110px}
.vocab-row .pin{color:var(--red);font-weight:600;min-width:110px}
.vocab-row .ru{flex:1}
.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.flash{perspective:1000px;height:150px;cursor:pointer}
.flash .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:10px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
.flash .face.back{transform:rotateY(180deg);background:var(--soft)}
.ex{margin:18px 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow)}
.ex .ex-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex .ex-tag{background:var(--red);color:#fff;font-size:.72em;font-weight:700;letter-spacing:.04em;
  padding:3px 9px;border-radius:20px;text-transform:uppercase}
.ex .q{font-weight:600;margin:10px 0}
.opt{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.opt button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-size:.95em}
.opt button:hover{border-color:var(--teal)}
.opt button.sel{border-color:var(--teal);background:#e8f4f2;color:var(--teal-d);font-weight:600}
.opt button.correct{border-color:var(--green);background:#e7f5ec;color:#1d6b3f;font-weight:700}
.opt button.wrong{border-color:var(--red);background:#fbe8e5;color:#a52f24}
input[type=text].ans{font-size:1.05em;padding:7px 10px;border:1px solid #c9c1b2;border-radius:7px;width:min(320px,90%)}
.feedback{margin-top:9px;font-size:.95em;min-height:1.2em}
.feedback.ok{color:var(--green);font-weight:600}
.feedback.bad{color:var(--red)}
.feedback .correct-ans{color:var(--teal-d);font-weight:600}
.btnline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin:14px 0}
.tab{padding:8px 14px;cursor:pointer;border-radius:8px 8px 0 0;border:1px solid transparent;color:#555;font-weight:600}
.tab:hover{background:var(--soft)}
.tab.active{background:#fff;border-color:var(--line);border-bottom-color:#fff;color:var(--red);position:relative;top:2px}
.tabpane{display:none}
.tabpane.active{display:block}
.pbar{height:16px;background:#ece5d8;border-radius:10px;overflow:hidden}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--teal),#2ba89f);border-radius:10px;transition:width .4s;width:0}
.lpbar{height:10px;background:#ece5d8;border-radius:8px;overflow:hidden}
.lpbar>div{height:100%;background:var(--green);width:0;transition:width .4s}
.lesson-status{font-size:.8em;color:var(--muted)}
.dlg{border-left:4px solid var(--red);background:#fffdf8;padding:12px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.dlg .line{display:flex;gap:10px;padding:4px 0;align-items:baseline;flex-wrap:wrap}
.dlg .who{color:var(--red);font-weight:700;min-width:3em}
.reading-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin:12px 0;
  box-shadow:var(--shadow);border-left:6px solid var(--teal)}
.reading-card .read-cn{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:1.3em;line-height:1.9;color:#1f1f1f}
.reading-card .read-pin{color:var(--red);font-size:.98em;line-height:1.8;margin-top:8px}
.reading-card .read-ru{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);color:#333}
.dict-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.dict-item .meta{color:var(--muted);font-size:.85em;flex:1}
.score-box{text-align:center;padding:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#333;color:#fff;
  padding:11px 20px;border-radius:30px;transition:transform .3s;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
.legend{font-size:.85em;color:var(--muted);margin:6px 0}
audio{display:none}
.hidden{display:none!important}
.tag-chip{display:inline-block;background:var(--soft);border-radius:6px;padding:1px 7px;font-size:.8em;margin:2px;color:#665}
/* ================= ТЕТРАДНЫЙ ЛИСТ И КИТАЙСКИЕ МОТИВЫ ================= */
body{
  background-color:#f7f3e8;
  background-image:
    radial-gradient(circle at 18% 12%, rgba(192,57,43,.05), transparent 42%),
    radial-gradient(circle at 84% 78%, rgba(31,122,116,.06), transparent 46%),
    repeating-linear-gradient(to bottom, transparent 0 31px, #dfe6e4 31px 32px),
    linear-gradient(#fdfbf5,#fdfbf5);
  background-attachment:fixed;
  font-size:16px;
}
#main{position:relative;background:linear-gradient(to right, transparent 62px, #e8b4a8 62px 64px, transparent 64px);}
@media(max-width:900px){ #main{background:none;} }
.card{background:rgba(255,255,255,.96);border-radius:4px 14px 14px 4px;
  box-shadow:0 1px 2px rgba(0,0,0,.07),0 8px 22px -14px rgba(0,0,0,.28);
  border:1px solid #ece4d6;border-left:6px solid var(--red);padding:20px 24px}
.card.gray,.card.plain{border-left-color:var(--gold)}
.card h2,.card h3{position:relative}
.page-title{font-size:1.7em;letter-spacing:.01em}
.page-title::after{content:"";display:block;width:64px;height:4px;margin-top:8px;border-radius:2px;
  background:linear-gradient(90deg,var(--red),var(--gold))}

/* китайский орнамент-рамка у шапки */
.kicker{display:inline-flex;align-items:center;gap:7px}
.kicker::before{content:"❖";color:var(--gold)}

/* заголовок урока */
.lesson-hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lesson-hd .seal{width:46px;height:46px;flex:none;border-radius:8px;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:"Songti SC",serif;font-size:1.5em;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}

/* иероглифы */
.han, .zh, .hanzi{font-family:"Songti SC","STSong","SimSun","Noto Serif SC","Noto Sans SC",serif;
  font-size:1.15em;letter-spacing:.05em}
.big-han, .big-hanzi{font-family:"Songti SC","STSong","SimSun",serif;font-size:3.1em;line-height:1.25;
  color:var(--red);text-align:center;margin:8px 0 4px;letter-spacing:.08em}
.pin{color:var(--red);font-size:.95em}
.pinyin{color:var(--red)}

/* клетки для прописей */
.grid-cell,.stroke-cells{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}
.grid-cell div,.stroke-cell{aspect-ratio:1;border:1px dashed #c9c2b2;border-radius:4px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:
  linear-gradient(to right,transparent calc(50% - .5px),#e5ddcd calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(to bottom,transparent calc(50% - .5px),#e5ddcd calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px));
  font-family:"Songti SC",serif;color:#dfc9c9;font-size:1.25em;transition:.15s}
.stroke-cell:hover{background-color:#fdf6ef}
.stroke-cell.filled{background-color:#fdeee9;border-style:solid;border-color:var(--red);color:var(--red)}
.stroke-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;box-shadow:var(--shadow)}
.stroke-head{display:flex;align-items:center;gap:12px}
.stroke-han{font-size:2.5em;color:var(--red);font-family:"Songti SC",serif}
.stroke-pin{color:var(--red);font-weight:700}
.stroke-ru{font-size:.92em;color:var(--muted)}
.stroke-rule{margin-top:7px;font-size:.9em;color:var(--muted);border-top:1px dotted var(--line);padding-top:6px}
.stroke-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:12px}

/* сопоставление */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.match-btn{display:block;width:100%;margin:5px 0;padding:9px 10px;border:1.5px solid var(--line);
  background:#fff;border-radius:9px;cursor:pointer;text-align:left;font:inherit;transition:.15s}
.match-btn:hover{border-color:var(--teal);background:#f7fbfa}
.match-btn.sel{outline:3px solid var(--teal);outline-offset:1px}
.match-btn.correct{background:#e9f6ee;border-color:var(--green);color:#1d5c39}
.match-btn.wrong{background:#fbeae6;border-color:var(--red)}
@media(max-width:620px){.match-grid{grid-template-columns:1fr}}

/* порядок слов */
.order-ans{min-height:50px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;
  display:flex;flex-wrap:wrap;gap:6px;background:#fcfcfa;align-items:center}
.order-ans button:not(.lesson-status){padding:7px 11px}

/* ключи */
.keys-box{background:#fbf7ee;border:1px solid #eadfc7;border-radius:10px;padding:14px 18px;margin-top:10px}
.keys-box h4{margin:0 0 8px;color:var(--red-d)}
.keys-box ol{margin:0;padding-left:22px}
.keys-box li{margin:7px 0;line-height:1.5}
.ktag{display:inline-block;font-size:.72em;background:var(--soft);color:var(--muted);
  border-radius:20px;padding:1px 8px;vertical-align:middle}
.kans{color:#1d5c39;font-weight:600;background:#eef7f1;border-radius:5px;padding:1px 7px;display:inline-block;margin-top:3px}
.keys-box ol.hidden{display:none}

/* иллюстрации */
.motif{display:flex;flex-wrap:wrap;gap:16px;margin:12px 0 4px;align-items:flex-end}
.motif figure{margin:0;text-align:center;flex:0 0 auto}
.motif figure svg{display:block;margin:0 auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12))}
.motif figcaption{font-size:.78em;color:var(--muted);margin-top:5px}
.fig-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* отметка полосой как в тетради */
.tab{background:rgba(255,255,255,.75)}
.tab.active{background:var(--red);color:#fff;border-color:var(--red)}
.tabpane{animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* заметки культуры */
.culture{position:relative;padding-left:40px}
.culture::before{content:"🀄";position:absolute;left:12px;top:12px;font-size:1.1em}
.notice::before{content:"💡";margin-right:6px}

/* ================= ПОЛНЫЙ ТЕКСТ УЧЕБНИКА ================= */
.book-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.book-chip{display:inline-block;font-size:.82em;background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:3px 11px;color:var(--teal-d);text-decoration:none;cursor:pointer}
.book-chip:hover{background:var(--soft);border-color:var(--teal)}
.book-sec-h{color:var(--red-d);border-bottom:2px solid var(--soft);padding-bottom:6px}
.book-sub{color:var(--teal-d);margin:14px 0 6px}
.book-p{margin:8px 0;line-height:1.65;text-align:justify}
.book-list{margin:8px 0 8px 4px;padding-left:20px;line-height:1.6}
.book-list li{margin:3px 0}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:10px}
.book-card-link{display:flex;flex-direction:column;gap:3px;background:#fff;border:1px solid var(--line);
  border-left:5px solid var(--red);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.book-card-link:hover{background:#fdf9f2;box-shadow:var(--shadow)}
.book-card-link b{color:var(--red-d)}
.book-card-link span{font-size:.85em;color:var(--muted)}
.book-card-link .book-open{color:var(--teal);font-weight:600;margin-top:5px}
.book-sec-body{max-height:none}

/* ================= ГЛОССАРИЙ, ВОПРОСЫ, ПРАВИЛА ================= */
.gloss{margin-top:16px;background:#fffdf8;border:1px solid #eadfc7;border-radius:10px;padding:12px 14px}
.gloss-cap{font-weight:700;color:var(--red-d);margin-bottom:8px}
.gloss-table{width:100%;border-collapse:collapse;font-size:.95em}
.gloss-table th{text-align:left;color:var(--muted);font-weight:600;font-size:.85em;padding:4px 8px;border-bottom:1px solid var(--line)}
.gloss-table td{padding:6px 8px;border-bottom:1px dotted #eee5d5;vertical-align:middle}
.gloss-table tr:last-child td{border-bottom:none}
.gloss-han{font-family:"Songti SC","STSong","SimSun",serif;font-size:1.55em;color:var(--red);white-space:nowrap}
.gloss-audio{width:52px;text-align:right}
.quest-block{margin-top:16px;background:#f7fbfa;border:1px solid #cfe4e0;border-radius:10px;padding:12px 16px}
.quest-cap{font-weight:700;color:var(--teal-d);margin-bottom:6px}
.quest-list{margin:0;padding-left:22px}
.quest-list li{margin:9px 0;line-height:1.55}
.quest-q{display:block;margin-bottom:4px}
.quest-toggle{margin:2px 0 0}
.quest-a{margin-top:6px;color:#1d5c39;background:#eef7f1;border-radius:6px;padding:6px 10px;display:inline-block}
.gram-list{margin:8px 0 0 4px;padding-left:20px;line-height:1.6}
.gram-list li{margin:5px 0;color:#333}
.book-gloss{margin:14px 0 4px}
.book-q{margin:14px 0 4px}

/* ================= РАЗБОР ПО СЛОВАМ ================= */
.wb-block{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.wb-block[open]{padding-bottom:14px}
.wb-sum{cursor:pointer;font-weight:700;color:var(--teal-d);list-style:none}
.wb-sum::-webkit-details-marker{display:none}
.wb-sum::before{content:"▸ ";color:var(--gold)}
.wb-block[open] .wb-sum::before{content:"▾ "}
.wb-rows{margin-top:10px}
.wb-row{display:grid;grid-template-columns:96px 130px 1fr 46px;gap:10px;align-items:center;
  padding:6px 4px;border-bottom:1px dotted #efe6d6}
.wb-row:last-child{border-bottom:none}
.wb-han{font-family:"Songti SC","STSong","SimSun",serif;font-size:1.45em;color:var(--red)}
.wb-pin{color:var(--red-d);font-size:.95em}
.wb-ru{color:#333;font-size:.96em}
.wb-audio{text-align:right}
@media(max-width:640px){
  .wb-row{grid-template-columns:78px 1fr 40px;gap:7px}
  .wb-ru{grid-column:2 / -1;font-size:.9em}
}
.read-line{margin-top:12px}
.read-line .read-cn{font-size:1.22em}

/* ================= ПОДРОБНАЯ ГРАММАТИКА И ФОНЕТИКА ================= */
.detail-block{margin-top:18px;background:#fff;border:1px solid #eadfc7;border-radius:10px;padding:14px 18px}
.detail-title{color:var(--red-d);margin:0 0 10px;border-bottom:2px solid var(--soft);padding-bottom:6px}
.rich-h{margin:16px 0 6px;color:var(--teal-d);font-size:1.02em}
.rich-p{margin:8px 0;line-height:1.65;text-align:justify}
.rich-note{margin:10px 0;padding:9px 12px;background:#fff8e8;border-left:4px solid var(--gold);border-radius:0 8px 8px 0;font-size:.95em}
.rich-ex{margin:10px 0;background:#fbfaf6;border:1px solid #eee5d5;border-radius:8px;padding:6px 10px}
.rich-ex-row{display:grid;grid-template-columns:auto 1fr 46px;gap:12px;align-items:center;padding:5px 2px;border-bottom:1px dotted #efe6d6}
.rich-ex-row:last-child{border-bottom:none}
.rich-ex-han{font-size:1.3em;color:var(--red);white-space:nowrap}
.rich-ex-ru{color:#333;font-size:.95em}
.rich-ex-a{text-align:right}
.rich-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.93em}
.rich-table th{text-align:left;background:var(--soft);color:var(--teal-d);padding:6px 9px;font-weight:600;border:1px solid #e6ddd0}
.rich-table td{padding:6px 9px;border:1px solid #f0e9dc;vertical-align:middle}
.rich-table tr:nth-child(even) td{background:#fffdf9}
.rich-td-han{font-family:"Songti SC","STSong","SimSun",serif;font-size:1.35em;color:var(--red);white-space:nowrap}
.detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){ .detail-cols{grid-template-columns:1fr} }

/* ================= ТРЕНАЖЁР ================= */
.drill-wrap{padding-top:10px}
.drill-box{margin-top:10px}
.select-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ================= ПОРЯДОК ЧЕРТ ================= */
.so-legend{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.so-leg-item{font-size:.8em;background:#fbf7ee;border:1px solid #eadfc7;border-radius:20px;padding:3px 9px;color:#555}
.so-legend .han{font-size:1.15em;color:var(--red)}
.so-ans{min-height:52px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fcfcfa}
.so-pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.so-chip{position:relative;border:1.5px solid var(--line);background:#fff;border-radius:9px;
  padding:7px 11px;cursor:pointer;font:inherit;transition:.15s}
.so-chip:hover{border-color:var(--teal);background:#f7fbfa}
.so-chip.han-stroke{background:#fdf3ef;border-color:var(--red);color:var(--red);font-weight:600}
.so-num{position:absolute;top:-7px;right:-5px;background:var(--red);color:#fff;font-size:.62em;
  border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.stroke-order-txt{color:#1d5c39;font-size:.92em}
.so-td{font-size:.85em;color:#555;max-width:320px}

/* ================= ФОНЕТИКА, ТЕОРИЯ, ПОЛЯ, ЭКЗАМЕН ================= */
.syl-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.syl-chip{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:2px 9px;font-size:.92em;color:var(--red-d)}
.syl-chip .btn.small,.syl-chip .abtn{padding:0 4px;font-size:.8em;border:none;background:none;cursor:pointer}
.syllable{display:inline-block}
.sem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.sem-cell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;
  position:relative;transition:.15s}
.sem-cell:hover{box-shadow:var(--shadow);border-color:var(--gold)}
.sem-han{font-size:2.1em;color:var(--red);line-height:1.2}
.sem-pin{color:var(--red-d);font-size:.88em}
.sem-ru{color:#444;font-size:.86em;margin-top:2px}
.sem-cell .btn.small{position:absolute;top:4px;right:4px}
.exam-cap{font-weight:700;color:var(--teal-d);margin-bottom:10px}
.exam-done{margin-top:14px;padding:12px 16px;background:#eef7f1;border-left:5px solid var(--green);
  border-radius:0 10px 10px 0;color:#1d5c39}
.exam-shell .ex{margin-bottom:0}

/* ================= ПРЕДИСЛОВИЕ И ВВЕДЕНИЕ ================= */
.front-body p{margin:10px 0;line-height:1.68;text-align:justify}
.front-num{margin:9px 0;padding-left:6px;line-height:1.6}
.front-num b{color:var(--red-d);margin-right:5px}
.front-notes{margin-top:12px;display:grid;gap:8px}
.front-note{background:#fbf8f1;border:1px solid #eadfc7;border-radius:10px;padding:10px 14px;transition:.15s}
.front-note[open]{background:#fff;box-shadow:var(--shadow)}
.front-note-h{cursor:pointer;font-weight:600;color:var(--teal-d);list-style:none}
.front-note-h::-webkit-details-marker{display:none}
.front-note-h::before{content:"▸ ";color:var(--gold)}
.front-note[open] .front-note-h::before{content:"▾ "}
.front-note-b{margin-top:8px;line-height:1.65;color:#333;text-align:justify}

/* ================= ПЛАН, ГЛОССАРИЙ, ЧАСТЫЕ ВОПРОСЫ ================= */
.week-head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.week-num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1em}
.week-lesson{color:var(--muted);font-size:.92em;margin-top:2px}
.week-days{margin-top:8px}
.week-day{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:6px 4px;
  border-bottom:1px dotted #efe6d6;align-items:baseline}
.week-day:last-child{border-bottom:none}
.week-day-n{font-weight:600;color:var(--teal-d);font-size:.9em}
.week-day-t{color:#333;font-size:.95em}
@media(max-width:600px){ .week-day{grid-template-columns:76px 1fr;gap:7px} }
.gloss-term{font-weight:600;color:var(--red-d);white-space:nowrap}
.faq-list{display:grid;gap:8px}

/* ================= АУДИО В СПРАВОЧНИКЕ ================= */
.sf-audio{display:inline-block;margin-left:6px;vertical-align:middle}
.sf-audio .audio-btn{width:20px;height:20px;line-height:1;padding:0;font-size:.7em;
  opacity:.45;transition:opacity .15s}
.rich-table tr:hover .sf-audio .audio-btn{opacity:1}
.sf-audio .audio-btn.playing{opacity:1}
@media(max-width:600px){ .sf-audio .audio-btn{opacity:.8} }

/* ================= ПОИСК ================= */
.search-row{display:flex;gap:8px;align-items:center}
.search-inp{flex:1;min-width:0;font-size:1em;padding:9px 12px}
.search-hint{font-size:.85em;color:var(--muted);margin-top:8px}
.search-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.search-type{font-size:.72em;background:var(--red);color:#fff;border-radius:20px;padding:2px 10px;text-transform:uppercase;letter-spacing:.03em}
.search-key{font-size:.82em;color:var(--muted)}
.search-body{line-height:1.55}
.search-han{font-size:1.5em;color:var(--red);margin-right:4px}
.search-ru{color:#333}
#topSearch{padding:4px 10px}
@media(max-width:600px){ .search-inp{font-size:.95em} }

/* ================= ПРОДОЛЖИТЬ ОБУЧЕНИЕ ================= */
.pbar{height:10px;background:#eee5d5;border-radius:20px;overflow:hidden;margin:8px 0 4px}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:20px;transition:width .3s}
.kbd-hint{font-size:.8em;color:var(--muted);margin-top:6px}
kbd{background:#f2ede3;border:1px solid #ddd3c0;border-radius:4px;padding:1px 5px;font-size:.85em;font-family:inherit}

<script>
/* ================= CORE HELPERS ================= */
const $ = s=>document.querySelector(s);
const $$ = (s, root)=>Array.from((root||document).querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function uid(){return Math.random().toString(36).slice(2,9);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function sample(arr,n){return shuffle(arr).slice(0,n);}

/* ---------- TTS / audio ---------- */
let voiceCache=[];
function loadVoices(){ if(!('speechSynthesis' in window)) return; voiceCache=speechSynthesis.getVoices().filter(x=>/zh|cmn|Chinese/i.test(x.lang)||/zh/i.test(x.name)); }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function getVoice(){ if(voiceCache.length) return voiceCache[0];
  const all=('speechSynthesis' in window)?speechSynthesis.getVoices():[];
  return all.filter(x=>/zh/i.test(x.lang))[0]||null; }
function tts(text, onend){
  if(!('speechSynthesis' in window)){ toast('Ваш браузер не поддерживает озвучивание'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; const v=getVoice(); if(v){u.voice=v; u.lang=v.lang;} u.rate=0.78; u.pitch=1;
  u.onend=onend||null; speechSynthesis.speak(u);
}
function stopTTS(){ if('speechSynthesis' in window) try{speechSynthesis.cancel();}catch(e){} }
let curAudioBtn=null;
function speak(text, btn){
  if(btn){ if(curAudioBtn&&curAudioBtn!==btn) curAudioBtn.classList.remove('playing');
    curAudioBtn=btn; btn.classList.add('playing'); }
  tts(text, ()=>{ if(btn) btn.classList.remove('playing'); curAudioBtn=null; });
}
function audioBtn(text){
  const b=document.createElement('button'); b.className='audio-btn'; b.title='Прослушать';
  b.setAttribute('aria-label','Прослушать пример');
  b.onclick=e=>{ e.stopPropagation(); if(b.classList.contains('playing')){stopTTS(); b.classList.remove('playing'); curAudioBtn=null; return;} speak(text,b); };
  return b;
}

/* ---------- localStorage ---------- */
const LS_KEY='zh_selfstudy_v1';
function defaultStore(){ return { prog:{}, dict:[], cultureBest:{}, testBest:{}, lastLesson:'l1' }; }
let store=loadStore();

function saveStore(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(store)); }catch(e){} }

let toastT=null;
function toast(msg){ const t=$('#toast'); if(!t) return; t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

     {id:'p_trans', label:()=>'🌐 Практикум перевода'},

/* ================= PROGRESS ================= */
function exKey(ex){ return (ex._id||ex.id||''); }
function lessonProgress(lid){ const L=LESSONS[lid]; let done=0,total=0;
  (L.exercises||[]).forEach(ex=>{ total++; if((store.prog[lid]||{})[exKey(ex)]) done++; });
  return {done,total}; }
function markDone(lid,exid,correct){ if(!correct) return; store.prog[lid]=store.prog[lid]||{}; store.prog[lid][exid]=true; saveStore(); }
function lessonState(lid){ const p=lessonProgress(lid); if(!p.total) return 'empty'; if(p.done>=p.total) return 'done'; if(p.done>0) return 'work'; return 'new'; }
function pctOf(lid){ const p=lessonProgress(lid); return p.total?Math.round(100*p.done/p.total):0; }
function statusChip(lid){ const st=lessonState(lid); const map={done:'&#10003;',work:'&#9679;',new:''};
  const col={done:'var(--green)',work:'var(--gold)',new:'transparent'};
  return '<span style="color:'+col[st]+';font-size:.8em">'+map[st]+'</span>'; }

LESSONS.l10={n:"Урок 10", num:10, phTitle:"Инициали j, q, x. Финали ia, ie, iu, iao, ian",

  theory:[

   "j — непридыхательная аффриката (похожа на «джь»), q — придыхательная (на «чь»), x — фрикативный (на «сь»).",
   "j, q, x сочетаются только с финалями на i- и ü-: ji, qia, xie, jiao, qian.",
   "После j, q, x буква u на письме читается как ü.",

  drill:"Читайте: jī/qī/xī, jiā, qiè, xiǎo, qián, xiān; jiě, qiú."},

   "Финаль ün — ü + носовое n. После j, q, x пишется un, читается ün.",
   "Финаль üe — ü + e (произносится примерно «юэ»). После j, q, x пишется ue.",
   "Финаль üan — ü + an (примерно «юань»). После j, q, x пишется uan.",
   "Если финаль с ü стоит в начале слога, над ü ставят y: ü → yu, ün → yun, üe → yue, üan → yuan. Точки у ü в этом случае опускаются."],

  theory:[

   "При эризации финаль может меняться: 花 huā → 花儿 huār «цветочек».",
   "Слог в нулевом тоне часто утрачивает свой тон и произносится кратко.",
   "После первого, второго и четвёртого тонов нулевой тон произносится низко, после третьего — выше предыдущего.",
   "Многие двусложные слова имеют второй слог в нулевом тоне: 妈妈 māma «мама», 我们 wǒmen «мы»."],

/* ================= TONE & POOL HELPERS ================= */
function toneVowel(syl, tone){
  if(!syl) return syl;
  const TBL={a:["ā","á","ǎ","à"],e:["ē","é","ě","è"],i:["ī","í","ǐ","ì"],o:["ō","ó","ǒ","ò"],u:["ū","ú","ǔ","ù"],"ü":["ǖ","ǘ","ǚ","ǜ"]};
  const order=["a","e","o","i","u","ü"];
  let main=null; for(const V of order){ if(syl.includes(V)){ main=V; break; } }
  if(main==null) return syl;
  const idx=syl.indexOf(main); const ch=syl[idx];
  const rep=(TBL[main]||[])[(tone-1)]||ch;
  return syl.slice(0,idx)+rep+syl.slice(idx+1);
}

/* ================= EXERCISE RENDER & CHECK ================= */
function norm(s){ return String(s||'').trim().toLowerCase()
  .replace(/[\u0300-\u036f]/g,'')
  .replace(/[，。！？、；：""''（）\s\.\,\!\?\;\:]/g,'')
  .replace(/ü/g,'v'); }
function normHan(s){ return String(s||'').replace(/\s/g,''); }

function exTag(label){ const s=document.createElement('span'); s.className='ex-tag'; s.textContent=label; return s; }

/* wrapper: builds .ex block, returns {box, body, fb} */
function exBox(tag){
  const box=document.createElement('div'); box.className='ex';
  const head=document.createElement('div'); head.className='ex-head';
  head.appendChild(exTag(tag));
  box.appendChild(head);
  const body=document.createElement('div'); box.appendChild(body);
  const fb=document.createElement('div'); fb.className='feedback'; box.appendChild(fb);
  return {box,body,fb,head};
}
function showAnsBtn(cb){ const b=document.createElement('button'); b.className='btn gray small'; b.textContent='Показать ответ';
  b.onclick=()=>cb(b); return b; }

/* ---------- CHOICE ---------- */
function renderChoice(ex, inline){
  ex.id=ex.id||('c_'+uid());
  const {box,body,fb}=exBox('Выбор');
  const q=document.createElement('div'); q.className='q'; q.innerHTML=esc(ex.q); body.appendChild(q);
  if(ex.hanBig){ const h=document.createElement('div'); h.className='big-han han'; h.style.margin='6px 0'; h.textContent=ex.hanBig; body.appendChild(h); }
  const opts=document.createElement('div'); opts.className='opt';
  const letters='ABCD';
  ex.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.innerHTML=(opts.children.length?'':'')+esc(o);
    b.onclick=()=>{
      if(box._done) return;
      opts.querySelectorAll('button').forEach(x=>x.classList.remove('sel','correct','wrong'));
      b.classList.add('sel');
      const ok=(i===ex.ans);
      box.querySelectorAll('button').forEach(x=>{});
      if(ok){ b.classList.add('correct'); fb.className='feedback ok'; fb.textContent='Верно! '+(ex.expl||''); }
      else{ b.classList.add('wrong'); opts.children[ex.ans].classList.add('correct');
        fb.className='feedback bad'; fb.innerHTML='Неверно. '+esc(ex.expl||''); }
      box._done=true; opts.querySelectorAll('button').forEach(x=>x.disabled=true);
      markDone(ex._lid,exKey(ex),ok);
      if(inline) inline(ok);
    };
    opts.appendChild(b);
  });
  body.appendChild(opts);
  return box;
}

/* ---------- FILL ---------- */
function renderFill(ex, inline){
  ex.id=ex.id||('f_'+uid());
  const {box,body,fb}=exBox('Ввод');
  const q=document.createElement('div'); q.className='q'; q.innerHTML=esc(ex.q); body.appendChild(q);
  const inp=document.createElement('input'); inp.type='text'; inp.className='ans'; inp.placeholder='Ваш ответ…';
  body.appendChild(inp);
  const line=document.createElement('div'); line.className='btnline';
  const chk=document.createElement('button'); chk.className='btn'; chk.textContent='Проверить';
  const show=showAnsBtn(b=>{ fb.className='feedback'; fb.innerHTML='Ответ: <span class="correct-ans">'+esc(dispAns(ex))+'</span> '+esc(ex.expl||''); });
  line.appendChild(chk); line.appendChild(show); body.appendChild(line);

  const accepts=acceptList(ex);
  function check(){
    if(box._done) return;
    const val=inp.value;
    const ok=accepts.some(a=>norm(a)===norm(val) || normHan(a)===normHan(val));
    if(ok){ box._done=true; fb.className='feedback ok'; fb.textContent='Верно! '+(ex.expl||'');
      inp.disabled=true; chk.disabled=true; markDone(ex._lid,exKey(ex),true); if(inline) inline(true); }
    else{ fb.className='feedback bad'; fb.textContent='Пока неверно — попробуйте ещё раз.'; inp.focus(); if(inline) inline(false); }
  }
  chk.onclick=check;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
  return box;
}
function acceptList(ex){
  if(Array.isArray(ex.answer)) return ex.answer.concat(ex.accept||[]);
  return [ex.answer].concat(ex.accept||[]);
}
function dispAns(ex){ return Array.isArray(ex.answer)?ex.answer[0]:ex.answer; }

function renderTone4(ex, inline){

  const {box,body,fb}=exBox('Тон');
  const q=document.createElement('div'); q.className='q'; q.innerHTML=esc(ex.q); body.appendChild(q);
  const marks=['¯','´','ˇ','`'];
  const names=['1-й тон','2-й тон','3-й тон','4-й тон'];
  const opts=document.createElement('div'); opts.className='opt';
  const variants=marks.map((m,i)=>toneVowel(ex.syl,i+1));
  names.forEach((nm,i)=>{
    const b=document.createElement('button');
    b.innerHTML='<span class="han">'+esc(variants[i])+'</span> &middot; '+nm;
    const ab=audioBtn(variants[i]); 
    b.onclick=()=>{
      if(box._done) return;
      opts.querySelectorAll('button').forEach(x=>x.classList.remove('sel','correct','wrong'));
      b.classList.add('sel');
      const ok=(i===ex.answerIdx);
      if(ok){ b.classList.add('correct'); fb.className='feedback ok'; fb.textContent='Верно! '+(ex.expl||''); }
      else{ b.classList.add('wrong'); opts.children[ex.answerIdx].classList.add('correct'); fb.className='feedback bad'; fb.textContent='Неверно. '+(ex.expl||''); }
      box._done=true; opts.querySelectorAll('button').forEach(x=>x.disabled=true);
      markDone(ex._lid,exKey(ex),ok); if(inline) inline(ok);
    };
    opts.appendChild(b);
  });
  body.appendChild(opts);
  const line=document.createElement('div'); line.className='btnline';

  return box;

function renderGenToneQ(ex, host){
  ex.id=ex.id||('gt_'+uid()); ex._lid=ex._lid||'l1';
  const {box,body,fb}=exBox('Тон');
  const q=document.createElement('div'); q.className='q';
  q.innerHTML='Слог <span class="han">'+esc(ex.han)+'</span> ('+esc(ex.syl)+') — какой тон?'; body.appendChild(q);
  const opts=document.createElement('div'); opts.className='opt';
  const variants=[toneVowel(ex.syl,1),toneVowel(ex.syl,2),toneVowel(ex.syl,3),toneVowel(ex.syl,4)];
  const names=['1-й','2-й','3-й','4-й'];
  names.forEach((nm,i)=>{
    const b=document.createElement('button'); b.innerHTML='<span class="han">'+esc(variants[i])+'</span>';
    b.onclick=()=>{ if(box._done) return;
      opts.querySelectorAll('button').forEach(x=>x.classList.remove('sel','correct','wrong')); b.classList.add('sel');
      const ok=(i===ex.tone-1);
      if(ok){ b.classList.add('correct'); fb.className='feedback ok'; fb.textContent='Верно! '+ (ex.ru?ex.ru+' — '+ex.syl+' ('+nm+' тон)':''); }
      else{ b.classList.add('wrong'); opts.children[ex.tone-1].classList.add('correct'); fb.className='feedback bad'; fb.textContent='Неверно. Правильно: '+variants[ex.tone-1]+' ('+names[ex.tone-1]+' тон).'; }
      box._done=true; opts.querySelectorAll('button').forEach(x=>x.disabled=true);
    };
    opts.appendChild(b);
  });
  body.appendChild(opts);
  const line=document.createElement('div'); line.className='btnline'; line.appendChild(audioBtn(ex.han)); body.appendChild(line);
  host.appendChild(box);
}

function renderGenSentQ(ex, host){
  ex.id=ex.id||('gs_'+uid()); ex._lid=ex._lid||'l1';
  const {box,body,fb}=exBox('Соберите предложение');
  const q=document.createElement('div'); q.className='q'; q.innerHTML='Составьте предложение: <b>'+esc(ex.ru)+'</b>'; body.appendChild(q);
  const avail=document.createElement('div'); avail.className='opt';
  const answerRow=document.createElement('div'); answerRow.className='opt'; answerRow.style.minHeight='40px';
  let built=[];
  const pool=shuffle(ex.tokens.slice());
  pool.forEach(tok=>{
    const b=document.createElement('button'); b.className='han'; b.textContent=tok;
    b.onclick=()=>{ if(box._done) return; b.remove(); built.push(tok); renderBuilt(); };
    avail.appendChild(b);
  });
  function renderBuilt(){ answerRow.innerHTML=''; built.forEach((tok,idx)=>{
    const b=document.createElement('button'); b.className='han'; b.textContent=tok;
    b.onclick=()=>{ if(box._done) return; built.splice(idx,1); renderBuilt();
      const nb=document.createElement('button'); nb.className='han'; nb.textContent=tok; nb.onclick=availFirst; avail.appendChild(nb); };
    answerRow.appendChild(b); }); }
  function availFirst(){}
  body.appendChild(answerRow); body.appendChild(avail);
  const line=document.createElement('div'); line.className='btnline';
  const chk=document.createElement('button'); chk.className='btn'; chk.textContent='Проверить';
  const show=showAnsBtn(b=>{ fb.className='feedback'; fb.innerHTML='Ответ: <span class="correct-ans han">'+esc(ex.tokens.join(' '))+'</span> <span class="pin">'+esc(ex.pin||'')+'</span>'; });
  line.appendChild(chk); line.appendChild(show); body.appendChild(line);
  chk.onclick=()=>{
    if(box._done) return;
    const ok=built.join('')===ex.tokens.join('');
    if(ok){ box._done=true; fb.className='feedback ok'; fb.textContent='Верно! '+(ex.pin||''); chk.disabled=true; }
    else{ fb.className='feedback bad'; fb.textContent='Неверный порядок — попробуйте переставить.'; }
  };
  host.appendChild(box);
}


/* ================= NAV & ROUTING ================= */
function closeNav(){ const n=$('#nav'); if(n) n.classList.remove('open'); }

function buildNav(){
  const nav=$('#nav'); nav.innerHTML='';
  const groups=navGroups();
  groups.forEach((grp,gi)=>{
    const g=document.createElement('div'); g.className='grp';
    const t=document.createElement('div'); t.className='grp-title';
    t.innerHTML='<span>'+esc(grp.title())+'</span><span class="caret">&#9662;</span>';
    t.onclick=()=>{ g.classList.toggle('collapsed'); };
    g.appendChild(t);
    const list=document.createElement('div'); list.className='grp-list';
    grp.items.forEach(it=>{
      const a=document.createElement('a'); a.className='nav-link'; a.href='#';
      a.dataset.view=it.id;
      if(it.lesson){ a.innerHTML='<span class="num">'+String(it.lesson).padStart(2,'0')+'</span>'+esc(it.label().replace(/^Урок\s+\d+\s*/,''))+' '+statusChip(it.id); }
      else a.textContent=it.label();
      a.onclick=e=>{ e.preventDefault(); go(it.id); closeNav(); };
      if(it.id===curView) a.classList.add('active');
      list.appendChild(a);
    });
    g.appendChild(list); nav.appendChild(g);
  });
}
function refreshNavActive(){ $$('#nav .nav-link').forEach(a=>a.classList.toggle('active',a.dataset.view===curView)); }

function go(view, param){
  curView=view; stopTTS();
  if(view!=='home') store.lastLesson=view;
  saveStore();
  const main=$('#main'); main.innerHTML='';
  if(view==='home') renderHome(main);
  else if(view==='intro') renderFrontMatter(main);
  else if(view==='keys') renderKeys(main);
  else if(view==='keys2') renderStrokes(main);
  else if(view==='strokes_all') renderStrokesAll(main);
  else if(view==='book') renderBookHub(main);
  else if(/^book_(\d+)$/.test(view)) renderBookLesson(main,'l'+view.split('_')[1]);
  else if(view==='progress') renderProgress(main);
  else if(view==='p_tones') renderToneTrainer(main);
  else if(view==='p_dict') renderDictionary(main);
  else if(view==='p_flash') renderAllFlashcards(main);
  else if(view==='p_gen') renderGeneratorHub(main);
  else if(view==='p_test') renderBigTest(main);
  else if(view==='p_culture') renderCultureTest(main);
  else if(view==='p_keys') renderAllKeys(main);
  else if(view==='p_trans') renderTransHub(main);
  else if(view==='p_drill') renderDrillHub(main);
  else if(view==='p_ref') renderRefFull(main);
  else if(view==='p_gram') renderGramFull(main);
  else if(view==='p_search') renderSearch(main,SEARCH_Q);
  else if(view==='p_phon') renderPhonHub(main);
  else if(view==='p_theory') renderTheoryHub(main);
  else if(view==='p_sem') renderSemFields(main);
  else if(view==='p_exam') renderExam(main);
  else if(view==='p_plan') renderPlan(main);
  else if(view==='p_gloss') renderGlossary(main);
  else if(view==='p_faq') renderFAQ(main);
  else if(LESSONS[view]) renderLesson(main,view);
  else renderHome(main);
  refreshNavActive();
  try{ window.scrollTo(0,0); }catch(e){}
}

function pageTitle(txt, sub){
  const frag=document.createDocumentFragment();

function vocabTable(list, withAudio){
  const wrap=el('div');
  list.forEach(w=>{
    const row=el('div','vocab-row');
    row.appendChild(el('span','han',esc(w.h)));
    row.appendChild(el('span','pin',esc(w.p)));
    row.appendChild(el('span','ru',esc(w.r)));
    if(withAudio!==false) row.appendChild(audioBtn(w.h));
    wrap.appendChild(row);
  });
  return wrap;
}

function renderLesson(main, lid){
  const L=LESSONS[lid];
  main.appendChild(pageTitle(L.n, L.phTitle));
  // progress bar
  const pc=card();
  const p=lessonProgress(lid);
  pc.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline"><b>Прогресс урока</b><span class="lesson-status" id="lessonStatus">'+p.done+' / '+p.total+' упражнений</span></div>'+
    '<div class="pbar" style="margin-top:8px"><div id="lessonBar" style="width:'+pctOf(lid)+'%"></div></div>';
  main.appendChild(pc);

  // tabs
  const tabs=el('div','tabs');
  const defs=[['ph','Фонетика'],['voc','Словарь'],['fl','Флешкарты'],['dlg','Диалог'],['read','Текст'],['ex','Упражнения'],['keys','🔑 Ключи'],['gen','Генератор'],['cul','Культура'],['ill','Иллюстрации']];
  const panes={};
  defs.forEach((d,idx)=>{
    const t=el('div','tab'+(idx===0?' active':''),d[1]); t.dataset.pane='pane_'+d[0];
    t.onclick=()=>{ $$('.tab',tabs).forEach(x=>x.classList.remove('active')); t.classList.add('active');
      Object.values(panes).forEach(pn=>pn.classList.remove('active')); panes[d[0]].classList.add('active'); };
    tabs.appendChild(t);
    const pn=el('div','tabpane'+(idx===0?' active':'')); pn.id='pane_'+d[0]; panes[d[0]]=pn;
  });
  main.appendChild(tabs);
  Object.values(panes).forEach(pn=>main.appendChild(pn));

  // ---- phonetics pane
  const ph=L.phon||{};
  panes.ph.appendChild(el('h2',null,esc(ph.title||'Фонетика')));
  (ph.theory||[]).forEach(t=>panes.ph.appendChild(el('p',null,esc(t))));

/* ================= GENERATORS ================= */
function hanOf(item){ return item.h; }
function ruOf(item){ return item.r; }

/* 1. Определить тон слога */
function genToneQ(lid){
  const pool=poolOf(lid).filter(w=>w.p && /[\u0100-\u01dc]/.test(w.p));
  if(!pool.length) return null;
  const item=pick(pool);
  // derive base pinyin + tone number
  const base=item.p.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/g,'v');
  let tone=1;
  const map={'ā':1,'á':2,'ǎ':3,'à':4,'ē':1,'é':2,'ě':3,'è':4,'ī':1,'í':2,'ǐ':3,'ì':4,'ō':1,'ó':2,'ǒ':3,'ò':4,'ū':1,'ú':2,'ǔ':3,'ù':4,'ǖ':1,'ǘ':2,'ǚ':3,'ǜ':4};
  for(const ch of item.p){ if(map[ch]){ tone=map[ch]; break; } }
  const syl=item.p.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ü/,'ü');
  return {t:'toneQ', han:item.h, syl:syl.replace(/v/g,'ü'), tone:tone, ru:item.r, _lid:lid};
}

function genSentenceQ(lid){

  return {t:'sent', ru:s.ru, tokens:s.words, pin:s.pin, _lid:lid};
}

/* 3. Выбор правильного иероглифа по переводу */
function genMCQ(lid){
  const pool=poolOf(lid).filter(w=>w.r&&w.r.length<26);
  if(pool.length<3) return null;
  const item=pick(pool);
  const others=sample(pool.filter(x=>x.h!==item.h&&x.r!==item.r),2);
  if(others.length<2) return null;
  const opts=shuffle([item,others[0],others[1]]);
  const ans=opts.indexOf(item);
  return {t:'choice', q:'Какой иероглиф означает «'+item.r+'»?', opts:opts.map(o=>o.h), ans:ans,
    expl:item.h+' '+item.p+' — '+item.r, _lid:lid};
}

/* 4. Выбор перевода иероглифа */
function genPickHan(lid){
  const pool=poolOf(lid).filter(w=>w.r&&w.r.length<26);
  if(pool.length<3) return null;
  const item=pick(pool);
  const others=sample(pool.filter(x=>x.r!==item.r&&x.h!==item.h),2);
  if(others.length<2) return null;
  const opts=shuffle([item,others[0],others[1]]);
  const ans=opts.indexOf(item);
  return {t:'choice', q:'Что значит иероглиф '+item.h+' ('+item.p+')?', opts:opts.map(o=>o.r), ans:ans,
    expl:item.h+' '+item.p+' — '+item.r, _lid:lid};
}

/* 5. Ввод иероглифа по переводу */
function genFillRu(lid){
  const pool=poolOf(lid).filter(w=>w.r&&w.r.length<20&&w.h.length===1);
  if(!pool.length) return null;
  const item=pick(pool);
  return {t:'fill', q:'Как сказать по-китайски «'+item.r+'»? (введите иероглиф)',
    answer:item.h, accept:[item.p], expl:item.h+' '+item.p+' — '+item.r, _lid:lid};
}

/* 6. Ввод пиньиня по иероглифу */
function genFillPin(lid){
  const pool=poolOf(lid).filter(w=>w.p&&w.h.length>=1);
  if(!pool.length) return null;
  const item=pick(pool);
  return {t:'fill', q:'Напишите пиньинь для иероглифа '+item.h+' (можно без тонов):',
    answer:item.p, accept:[item.p.normalize('NFD').replace(/[\u0300-\u036f]/g,'')],
    expl:item.h+' — '+item.r, _lid:lid};
}

function renderOneGen(ex, host){
  ex.id='gen_'+uid(); ex._gen=true;
  if(ex.t==='toneQ'){ renderGenToneQ(ex,host); return; }
  if(ex.t==='sent'){ renderGenSentQ(ex,host); return; }
  const node=renderExercise(ex);
  if(node) host.appendChild(node);
}
function genLessonSet(lid, host){
  const gens=[genToneQ,genSentenceQ,genMCQ,genPickHan,genFillPin,genFillRu];
  const chosen=sample(gens,4);
  let placed=0;
  chosen.forEach(g=>{
    let ex=null;
    try{ ex=g(lid); }catch(e){ ex=null; }
    if(!ex) ex=genSentenceQ(lid);
    ex._lid=lid||'all';
    try{ renderOneGen(ex,host); placed++; }catch(e){}
  });
}

function allFixedExercises(){

function renderBigTest(main){
  main.appendChild(pageTitle('Большой тест по курсу','Проверка всех разделов: фонетика, иероглифика, лексика. Вопросы выбираются случайно.'));
  const c=card();
  c.innerHTML='<p>Тест состоит из 20 вопросов. Выберите ответ — вы сразу увидите результат. В конце — итоговый балл и разбор.</p>';
  const line=el('div','btnline');
  const start=el('button','btn red','Начать тест');
  const best=store.testBest&&store.testBest.score!=null?('Лучший результат: '+store.testBest.score+' из '+store.testBest.total):'';
  line.appendChild(start); c.appendChild(line);
  const bestEl=el('div','legend',best); c.appendChild(bestEl);
  main.appendChild(c);
  const box=el('div'); main.appendChild(box);

  start.onclick=()=>{
    c.classList.add('hidden');
    const pool=shuffle(allFixedExercises().filter(e=>e.t==='choice')).slice(0,20);
    const results={correct:0, total:pool.length, answers:[]};
    box.innerHTML='';
    const qcard=card();
    const head=el('div'); head.id='testHead'; qcard.appendChild(head);
    const qi=el('div'); qi.id='testQ'; qcard.appendChild(qi);
    const nav=el('div','btnline'); qcard.appendChild(nav);
    box.appendChild(qcard);
    let idx=0;
    function renderQ(){
      head.innerHTML='<div style="display:flex;justify-content:space-between"><b>Вопрос '+(idx+1)+' из '+pool.length+'</b><span class="lesson-status">Верно: '+results.correct+'</span></div>'+
        '<div class="pbar" style="margin:8px 0"><div style="width:'+Math.round(100*idx/pool.length)+'%"></div></div>';
      qi.innerHTML='';
      const ex=pool[idx];
      const node=renderExercise({t:'choice',q:ex.q,opts:ex.opts.slice(),ans:ex.ans,expl:ex.expl,_tid:true}, ()=>{});
      // prevent progress marking (use fake lid)
      node.querySelectorAll('button').forEach(()=>{});
      qi.appendChild(node);
    }
    // custom simple test to avoid progress entanglement
    const questions=pool.map(ex=>({q:ex.q,opts:ex.opts.slice(),ans:ex.ans,expl:ex.expl}));
    function renderQuestion(){
      head.innerHTML='<div style="display:flex;justify-content:space-between"><b>Вопрос '+(idx+1)+' из '+questions.length+'</b><span class="lesson-status">Верно: '+results.correct+'</span></div>'+
        '<div class="pbar" style="margin:8px 0"><div style="width:'+Math.round(100*idx/questions.length)+'%"></div></div>';
      qi.innerHTML='';
      const q=questions[idx];
      qi.appendChild(el('div','q',esc(q.q)));
      const opts=el('div','opt');
      q.opts.forEach((o,i)=>{
        const b=el('button',null,esc(o));
        b.onclick=()=>{
          if(opts.dataset.done) return;
          opts.dataset.done='1';
          const ok=(i===q.ans);
          if(ok){ b.classList.add('correct'); results.correct++; }
          else{ b.classList.add('wrong'); opts.children[q.ans].classList.add('correct'); }
          results.answers.push({ok:ok,q:q.q});
          $$('button',opts).forEach(x=>x.disabled=true);
          head.querySelector('.lesson-status').textContent='Верно: '+results.correct;
          const nb=el('button','btn',idx<questions.length-1?'Далее':'Показать результат');
          nb.onclick=()=>{ idx++; if(idx<questions.length) renderQuestion(); else finish(); };
          nav.appendChild(nb);
        };
        opts.appendChild(b);
      });
      qi.appendChild(opts);
      const fb=el('div','feedback'); qi.appendChild(fb);
    }
    function finish(){
      const score=results.correct, total=questions.length;
      if(!store.testBest||score>(store.testBest.score||0)) store.testBest={score:score,total:total,date:Date.now()};
      saveStore();
      box.innerHTML='';
      const r=card('score-box');
      const pct=Math.round(100*score/total);
      let msg='Неплохо! Продолжайте повторять материал.';
      if(pct>=90) msg='Отлично! Курс освоен очень хорошо.';
      else if(pct>=70) msg='Хороший результат. Обратите внимание на разбор ошибок.';
      else if(pct<50) msg='Стоит повторить уроки — вернитесь к словарю и упражнениям.';
      r.innerHTML='<div style="font-size:2.4em;font-weight:800;color:var(--teal)">'+score+' / '+total+'</div>'+
        '<div class="lesson-status">'+pct+'%</div><p style="margin-top:10px">'+esc(msg)+'</p>';
      const rl=el('div','btnline');
      const again=el('button','btn','Пройти ещё раз'); again.onclick=()=>renderBigTest(main);
      const home=el('button','btn ghost','К началу'); home.onclick=()=>go('home');
      rl.appendChild(again); rl.appendChild(home); r.appendChild(rl);
      box.appendChild(r);
      const wrong=results.answers.filter(a=>!a.ok);
      if(wrong.length){
        const wc=card(); wc.appendChild(el('h3',null,'Разбор ошибок'));
        wrong.forEach(w=>{ wc.appendChild(el('p',null,'&bull; '+esc(w.q))); });
        box.appendChild(wc);
      }
    }
    renderQuestion();
  };
}

var FRONT_MATTER=[["Предисловие",["Считается, что изучение китайского языка представляет собой большую сложность для иностран- цев, однако это вовсе не так. При использовании правильной методики изучить китайский язык совсем не сложно. Проблема в том, что в большинстве современных учебников китайского языка уже с первых уроков совместно изучаются и устная и письменная речь в виде диалогов. Предпо- лагается, что это позволит учащемуся очень быстро овладеть китайским языком.","Однако данная методика, являющаяся очень прогрессивной при изучении языков, опирающихся на алфавитную письменность, очень плохо подходит для языков, основанных на иероглифической письменности, таких как китайский. Уже в самом начале обучения китайскому языку по такой методике на непод- готовленного учащегося обрушивается огромный объем новой информации, что может на первом этапе просто напугать. Очень сложно сразу заговорить по-китайски. Китайская фонетическая система обладает рядом особенностей, совершенно не характерных для западных языков.","Это прежде всего система тонов, когда каждый слог произносится с определенной интонацией, в зависимости от которой меняет- ся смысл сказанного. Также в китайском языке есть достаточное количество сложных звуков, не имеющих аналогов ни в русском, ни европейских языках. В качестве вспомогательного средства при изучении китайской фонетики задействуют систему латинизированной фонетической записи у ; эта запись используется как транскрипция иероглифики, без знания которой невозможно изучение китайского языка.","Однако звуки китайского языка, обозначаемые латиницей, не всегда со- ответствуют звукам европейских языков, обозначаемым теми же буквами, что может вызвать слож- ности у тех, кто ранее учил английский или немецкий. Китайская иероглифическая письменность развивалась из пиктограмм, и форма иероглифов не пере- дает их фонетического чтения. Нужно четко понимать, что китайский язык отличается от западных по своей структуре— в этом его особенность и сложность.","Если в западных языках основными фонетическими единицами явля- ются звуки, которых насчитывается около 30 и которые сами по себе никакого значения не имеют, то в китайском в качестве основных фонетических единиц выступают слоги, причем их насчитывается около 400, не считая их тоновых вариантов, и каждый слог в определенном тоне соответствует про- стому слову. Если в европейских языках одному звуку при письме соответствует одна буква или их сочетание, то в китайском одному слогу соответствует один иероглиф, которых насчитывается около 60 тысяч. Все иероглифы имеют четкую структуру.","Большинство иероглифов составляют сложные знаки, составленные из комбинаций простых. Эти простые иероглифы называются графемами, их на- читывается около 3","0","0. Графемы обычно могут выступать и в качестве самостоятельных иероглифов, и в качестве компонентов сложных знаков. Таким образом, графемы выполняют в китайском языке функцию, сходную с алфавитом. Слоги и графемы представляют собой базу китайского языка. Отсюда следует, что на начальном этапе изучения китайского языка необходимо изучить китайские слоги и основные графемы, выработать навыки чтения и письма. При хорошем знании базы дальней- шее обучение не будет представлять собой никакой сложности."]],["Как устроена книга",["Книга состоит из уроков, где подробнейшим образом изложены основы китайского языка, детально описаны многие нюансы и тонкости. В каждый урок входят фонетический и иероглифический раз- делы. Фонетический материал дает возможность проработать самые сложные аспекты произноше- ния, в иероглифическом разделе вы найдете подробную этимологию графем, познакомитесь со всеми вариантами их написания. В основе всего нового лексического и грамматического материала лежит материал, уже изученный на предыдущих уроках, что призвано упростить его усвоение.","Каждый урок снабжен заданиями, упражнениями и прописями, позволяющими закрепить изучаемый материал, за- действовав различные аспекты памяти. Кроме того, к книге прилагается компакт-диск, озвученный носителем. Он призван помочь вам овладеть китайским произношением. Предлагаемый материал поможет вам поставить хорошее китайское произношение, понять логику китайских иероглифов, выработать хороший иероглифический почерк, научиться читать китай- ский иероглифический текст, говорить и понимать простые фразы на китайском языке."]],["Как работать с книгой",["В книге предлагается система поэтапного изучения основ китайского языка по принципу «от прос- того к сложному». Фонетика и иероглифика в начале курса даются параллельно, затем постепенно, по мере их изучения, они начинают все больше пересекаться между собой, а к концу курса вы уже сможете читать простой китайский текст, записанный иероглифами. Во время обучения лучше всего использовать какую-либо специальную систему запоминания (мнемотехнику). Если же вы не умеете пользоваться мнемотехникой, желательно следовать таким несложным рекомендациям:","1. Человек способен удерживать свое внимание на одном объекте не более 20 минут, затем концент- рация начинает снижаться. Поэтому во время занятий лучше всего делать небольшие перерывы каждые 20 минут.","2. Новая информация через некоторое время начинает забываться, поэтому, если вы занимались днем, имеет смысл бегло повторить пройденный материал перед сном, затем— на следующий день, затем— еще через 3 дня.","3. При изучении фонетического раздела необходимо внимательно слушать диктора и стараться повто- рять за ним, заткнув одно ухо— это позволит четко слышать свое произношение как бы со стороны.","4. При запоминании иероглифов в первую очередь очень важно задействовать образное мышле- ние и ассоциативную память, поскольку именно образное мышление является основой мысли- тельных процессов человека, а механизмы ассоциативной памяти— это основные механизмы мыслительных процессов человека. В отличие от слов, записанных буквами, иероглифы пред- ставляют собой некие образы того, что они обозначают. Очень важно научиться видеть в иеро- глифе помимо набора черт картинку, вызывающую определенную ассоциацию, тогда его легко запомнить.","К сожалению, на протяжении времени некоторые иероглифы настолько изменились и их написание настолько схематизировалось, что в них очень сложно узнать исходный образ. Поэтому в книге приведена подробная этимология иероглифов от первоначального пиктографи- ческого изображения до современной формы написания. К тому же не возбраняется придумы- вать собственные ассоциации.","5. Для лучшего усвоения иероглифического материала необходимо также задействовать моторику. Для этого в конце каждого урока есть специальные прописи, которые нужно аккуратно заполнять.","6. Для повторения пройденного материала лучше всего использовать специальные двусторонние карточки, которые можно сделать, написав на одной стороне иероглиф и его транскрипцию, на другой— его русский перевод. Карточки очень удобно брать с собой и повторять по ним иеро- глифы, например в дороге. Курс рассчитан приблизительно на четыре месяца, при этом рекомендуемое время изучения одного урока составляет неделю. Желаю удачи!"]],["Коротко о китайском языке",["сино-тибетской (китайско-тибетской) семье языков. Первоначаль- но он являлся языком основной этнической группы Китая— хань, китайцев, поэтому одно из его современных названий звучит как хань юй— язык народности хань. Из ныне существующих ки- тайский язык является одним из самых древних языков, к тому же он обладает самой древней пись- менностью. На сегодняшний день на китайском языке говорит около 95% населения КНР, а также десятки миллионов китайцев, живущих в странах Юго-Восточной Азии: Вьетнаме, Лаосе, Камбод- же, Таиланде, Индонезии, Малайзии, Сингапуре, на Филиппинах и др.","Значительная китайская диа- спора рассеяна по всему миру, где на китайском языке говорят более 1,3 млрд человек, это наибо- лее распространенный современный язык. В своей нормативной форме китайский язык является официальным языком КНР, Тайваня и Сингапура, а также одним из шести официальных и рабочих языков ООН. В китайском языке выделяется 7 основных диалектных групп: гань, северные диалекты, хакка, минь (включая фуцзяньский и тайваньский), у (включая у шанхайский), сян и юэ, а также еще 3 груп- пы, которые признает все большее число лингвистов в мире,— аньхойский, цзинь и пинхуа.","Самой обширной является группа северных диалектов, охватывающая 70% говорящих. Кроме вышеупо- мянутых диалектов в Китае существует неофициальная практика названия диалектов по провин- циям, например сычуаньский диалект, хэнаньский диалект. Данные названия не всегда совпадают с классификациями лингвистов, однако они также обладают своими отличительными характери- стиками. Все диалектные группы, в свою очередь, делятся на множество подгрупп.","Все китайские диалекты в целом обладают сходным грамматическим строем и словарным соста- вом, но при этом между ними существуют значительные лексические и некоторые грамматические различия. Наиболее существенными являются фонетические расхождения, касающиеся как звуко- вого состава, так и системы тонов, что сильно препятствует междиалектному общению. Носители диалектов одной группы довольно свободно понимают друг друга, в то время как представители разных диалектных групп с трудом могут добиться речевого контакта или даже практически не понимают друг друга.","Полное взаимопонимание достигается в таких случаях благодаря иероглифи- ческой письменности, которая общенациональна и едина для всех диалектов Китая, а также введен- ному в XX в. нормативному китайскому языку— путунхуа. Путунхуа, буквально общепринятый язык, является государственным языком КНР. Он базируется на грамматическом строе северных диалектов и произносительной норме пекинского диалекта. Это язык современной китайской общественно-политической, научной и художественной литературы, центрального радио, телевидения, кино.","В настоящее время он преподается во всех школах Китая, так что им владеет б льшая часть населения страны. На Тайване государственный язык называется гоюй, что буквально и переводится как государ- ственный язык (то же название используется для путунхуа в разговорной речи в Гонконге и Макао), к а в Сингапуре и Малайзии он называется хуаюй, буквально язык китайцев. Между путунхуа, гоюй и хуаюй есть очень незначительные фонетические и лексические различия, и их названия зачастую используются как синонимы.","Основным различием является использование на Тайване и в Гон- конге традиционной иероглифики, а в КНР, Сингапуре и Малайзии— упрощенной. Об этом речь пойдет дальше."]],["Основные этапы развития китайской письменности",["Китайская письменность является одной из древнейших на Земле и самой древней из используемых в наше время. История китайского иероглифического письма насчитывает как минимум 4 тыся- чи лет. Археологические находки показывают, что древнейшими китайскими иероглифическими текстами были гадательные надписи династии Шан-Инь (XVII–XI вв. до н. э.), которые с помощью острого предмета наносились на панцири черепах и лопаточные кости крупного рогатого скота (рис.1 ( ). Они получили название цзягувэнь (надписи на панцирях и костях).","Хотя эти самые пер- вые китайские иероглифы по виду значительно отличались от современных, графическая структура и значения некоторых иньских иероглифов вполне сопоставимы со знаками современной китай- ской письменности. В конце правления династии Шан-Инь возникла технология бронзового литья. В это время появля- ются надписи на бронзовых сосудах, самые древние из которых относятся к XIII в. до н. э. Эти тексты получили название цзиньвэнь (надписи на металле).","Надписи на бронзовых сосудах предварительно выдавливались на глиняной форме, постепенно происходила стандартизация иероглифов, они начи- нали вписываться в квадрат. Эта техника была развита и усовершенствована при династии Чжоу. Также при династии Чжоу (XI–III вв. до н. э.) стала активно расширятся сфера применения китай- ской письменности, расширялся круг людей, ей владеющих, стали создаваться новые знаки, уве- личился запас знаков, которым активно пользовались грамотные люди. Однако в те времена не существовало единой формы письменных знаков, в различных частях Древнего Китая иероглифы писались по-разному.","Первым известным опытом кодификации графического китайского письма является список иероглифов Ши Чжоу-пянь «Книга историографа Чжоу», составленный в эпоху западной династии Чжоу. После объединения Китая династией Цинь (221–207 до н. э.) по прика- зу императора Цинь Ши Хуанди была проведена реформа письменно- сти. Было установлено единообразное для всей страны письмо сяоч- жуань, которое легло в основу современной китайской письменности. Значительные изменения в периоды правления этих династий пре- терпели материалы и орудия письма.","Усовершенствование и затем утверждение в качестве общепринятого орудия письма мягкой кону- сообразной кисти в итоге привели к появлению новой иероглифиче- ской графики. Постепенно стали складываться стандартные правила написания и появляться новые образцовые графические стили. К концу династии Цзинь (IV в.) на смену наиболее широко приме- нявшемуся и считавшемуся в то время официальным стилю лишу (официальное письмо) пришел новый, более совершенный стиль кай- шу ( у уставное письмо ( ) и его функциональные варианты — курсив синшу ( у подвижное письмо) и скоропись цаошу ( у травяное письмо).","Появление кайшу фактически завершило эволюцию основных гра у - Рис.","1. Цзягувэнь фических стилей китайской иероглифической письменности","1. Эволюцию стилей китайского письма иллюстрирует рис. 2."]],["Китайская письменность в XX в.",["в связи с необходимостью модернизации Китая и приобщения к грамотности широких слоев обще- ства, с особенной остротой встал вопрос о реформе письменности. Эта реформа осуществлялась по нескольким направлениям. Во-первых, были сделаны попытки определить количество иероглифов, необходимых для всеоб- щего употребления. Опытным путем было установлено, что в учебных текстах, а также детской и популярной литературе употребляется около 4300 знаков (при общем их количестве около 50 тыс.). Эта норма признается до сих пор. Рис.","2. Эволюция стилей китайского письма Во-вторых, реформа письменности осуществлялась по линии упрощения традиционных иероглифов, для чего применялись разные способы: сокращение знака до одной-двух наиболее характерных черт, использование скорописных начертаний, отсечение части знака или даже полная замена сложного знака другим, более простым по начертанию (табл.1). Таблица","1. Упрощение традиционных иероглифов Значение Полная форма написания Упрощенное написание Лошадь Дракон Дверь Остаток В рамках реформы было изменено написание 2235 иероглифов, имеющих наиболее сложное начертание. Однако на Тайване и в Гонконге упрощенные знаки за редким исключением не привились. В больших 1 В данном учебнике в основном используется печатный шрифт на основе кайшу."]]];

const BOOK_TEXT={"front":[],"lessons":{"1":[["Начало урока","масштабах программа упрощения иероглифики была осуществлена только в середине 1950-х гг. в КНР:\nхотя широким слоям населения был облегчен доступ к азам грамотности, рядовой житель КНР сегодня\nпрактически не может читать старые книги и даже газеты, издаваемые на Тайване.\nТретьим направлением реформы письменности стало создание алфавитного письма. Первые китайские алфавиты, на основе латиницы, были составлены еще во второй половине XIX в. христианскими\nмиссионерами, однако успеха не имели. Исключение составил алфавит для диалекта Южной Фуцзяни, вошедший в обиход на Тайване. В начале XX в. появились два слоговых алфавита— для языка\nчиновников Северного Китая и южных диалектов. На основе первого в 1919 г. был принят для применения в учебных целях так называемый алфавит для указания произношения —\nя\nчжуинь цзыму.\nГрафически этот алфавит состоял из крайне упрощенных элементов китайской иероглифики с указанием чтения латиницей. Чжуинь цзыму рассматривается лишь как вспомогательное средство при об\nу\nучении иероглифической письменности, он и по сей день принят на Тайване. В то же время в КНР был\nпринят полностью латинизированный алфавит, получивший название пиньинь цзыму, или просто\nпиньинь, что буквально переводится как алфавит произносимых звуков. Пиньинь также не имеет самостоятельного употребления, являясь вспомогательным средством при обучении китайскому языку\nиностранцев и китайских школьников. Кроме того, чжуинь цзыму и пиньинь цзыму используют при\nу\nнаборе китайского текста на компьютере.\nКИТАЙСКИЕ ИЕРОГЛИФЫ\nТеперь поговорим более подробно о том, что представляют собой китайские иероглифы.\nКитайские иероглифы, так же как и письменные знаки в других языках, обладают тремя основными\nхарактеристиками: написанием, чтением и значением. Но в отличие от фонетической системы письма\nв иероглифической системе знаки служат не для записи звучания тех или иных единиц языка, а для\nобозначения определенных значащих речевых единиц— слов или слогов— без указания на их звучание. Графическое изображение каждого иероглифа (или его частей) обычно напрямую восходит\nк какой-либо пиктограмме, что позволяет говорить о возможности взаимосвязи графики и передаваемого иероглифом значения на всем протяжении периода существования иероглифики.\nВ китайском языке каждая морфема (слог) передается отдельным иероглифом. Несмотря на то что\nкаждый китайский иероглиф несет определенное значение, в современном китайском языке слова\nчаще всего состоят из двух слогов и соответственно из двух иероглифов, хотя встречаются односложные, трехсложные и даже четырехсложные слова. Поэтому для записи китайского слова требуется столько иероглифов, сколько в нем слогов. Границы между словами не отмечаются пробелами,\nхотя на смену вертикальным строкам пришли горизонтальные, которые пишутся слева направо. Все\nкитайские иероглифы имеют определенную структуру, о чем мы поговорим в следующих уроках."],["ФОНЕТИКА","ФОНЕТИЧЕСКАЯ СИСТЕМА КИТАЙСКОГО ЯЗЫКА\nВ Китае помимо основной иероглифической письменности используют латинизированную систему\nписьменности— пиньинь. Хотя пиньинь не может заменить собой иероглифическое письмо, эта\n\nсистема играет важную вспомогательную роль при изучении китайского языка, также ее знание необходимо для ввода китайского текста на компьютере.\nКитайский алфавит пиньинь включает в себя следующие буквы латиницы:\nAa Bb Cc Dd Ee Ff Gg Hh i Jj Kk Ll Mm Nn Oo Pp Qq Rr Ss Tt u Ww Xx Yy Zz.\nСтоит заметить, что в приведенном списке отсутствуют заглавные буквы i, u, , поскольку на них не\nначинается ни один слог.\nТакже параллельно существует система звуков пиньинь— фонетический алфавит, который выступает в роли альтернативного варианта китайского алфавита:\nB p m f d t n l g k h j q x zh ch sh r z c s w y a o e i u .\nКроме того, существует система чжуинь фухао, или просто бо по мо фо, где каждый звук фонетического алфавита обозначается специальным символом. Однако такая система используется только\nна Тайване.\nОдно из многих отличий китайского языка от европейских языков (в том числе русского)— то, что\nкитайский язык является слоговым, то есть его базовые единицы — слоги, а не звуки.\nВ отличие от русского языка, где, в принципе, можно составить слог из любого сочетания гласных\nи согласных звуков, в китайском языке все слоги имеют четкую внутреннюю структуру. Количество звуков в китайском слоге не может превышать четырех. Все они за небольшим исключением\nделятся на две части: начальная часть, инициаль, может быть выражена только одним согласным\nзвуком, например: b, p, sh, zh, и окончание, финаль, которое может быть выражено различными сочетаниями звуков, начинающимися с гласного, например: o, ai, en, iong. Внутри финали выделяют\nслоговой гласный, который может быть как простым, так и дифтонгом, конечный согласный,\nкоторый может быть выражен одной из носовых сонант -n или -ng, а также медиаль— гласную,\nсвязывающую инициаль и слоговой гласный, например: гласная u в финали uan или гласная i\nв финали iao. Также существует небольшое количество слогов, состоящих только из финалей, их\nназывают слогами с нулевой инициалью.\nВ китайском языке 23 инициали1:\nb p m f d t n l g k h j q x zh ch sh r z c s w y.\nФиналей в китайском языке 35 (табл.1.1).\nТаблица 1.1. Финали китайского языка\nПростые финали\na\no\ne\ni\nu\n\nСложные финали\nДифтонги\nи трифтонги\nai\nao\nou\nei\ner\nia\nie\niu\niao\nua\nuo\nuai\nui\ne\nС конечной\nсогласной\nan\nang\nong\nen\neng\nin\ning\nian\niang\niong\nun\nuan\nuang\nn\nan\nСочетание инициалей и финалей в китайском языке подчиняется определенным правилам, но не все\nони сочетаются друг с другом. Всего инициали и финали образуют 414 слогов (табл.1.2).\n1 Иногда выделяют только 21 инициаль, не учитывая w и\nw\ny.\n\nТаблица 1.2. Слоги китайского языка\nКитайские слоги\na, ai, an, ang, ao\ne, ei, en, er\no, ou\nb\nba, bai, ban, bang, bao, bei, ben, beng, bi, bian, biao, bie, bin, bing, bo, bu\np\npa, pai, pa ang, wei, wen, weng, wo, wu\ng\ng\ny\nya, yan, yang, yao, ye, yi, yin, ying, yong, you, yu, yuan, yue, yun\ny\ny\ny\ng y\ny\ny y\ny\ng y\ng y\ny\ny\ny\ny\nКаждый слог является звуковой формой морфемы, или простого слова, то есть слог— это минимальная значимая единица китайского языка. В китайском языке слоги могут функционировать\nи как самостоятельные слова, и как части слов, однако большинство слов современного китайского\nязыка являются двусложными. Один слог соответствует одному иероглифу.\nКАК ПОСТАВИТЬ ПРАВИЛЬНОЕ КИТАЙСКОЕ ПРОИЗНОШЕНИЕ\nПрежде чем перейти непосредственно к изучению звуков китайского языка, нужно поговорить о том,\nв чем заключается секрет хорошего произношения, поскольку при изучении китайского языка это\nиграет особо важную роль— с плохим произношением вас часто могут не понять.\nДело в том, что у нас сложились привычки произносить определенные звуки определенным образом, характерным именно для русского языка. Это то, что в лингвистике называется артикуляцией — совокупность работы отдельных речевых органов при образовании звуков речи. Однако артикуляция в разных языках порой очень сильно различается, несмотря на то что некоторые звуки\nна первый взгляд кажутся похожими. Частой ошибкой является отождествление звуков изучаемого\nязыка с похожими звуками родного языка, что неизбежно ведет к плохому произношению, исправить которое потом очень сложно.\nЧтобы поставить хорошее китайское произношение, нужно сразу учиться произносить китайские\nзвуки и слоги правильно, постепенно овладевая произносительными навыками китайского языка.\nДля этого необходимо сначала понять, в каком положении должны находиться речевые органы при\n\nпроизнесении звука, потом прослушать, как его произносит носитель языка, а затем повторить вслед\nза ним.\nТак постепенно можно овладеть артикуляционной базой китайского языка и научиться произносить китайские звуки и слоги автоматически, не задумываясь.\nСТРОЕНИЕ РЕЧЕВОГО АППАРАТА\nДля овладения артикуляцией необходимо знать строение речевого аппарата (рис.1.1\nРис. 1.1. Строение речевого аппарата\nВ речевом аппарате выделяют носовую полость, ротовую полость и глотку. Особо важную роль играет ротовая полость, поскольку в ней находятся наиболее важные органы речи,— это язык, губы,\nзубы, альвеолы, твёрдое нёбо и мягкое нёбо, которое заканчивается язычком. Также большую роль\nиграют надгортанник, гортань и голосовые связки, которые расположены в области глотки."],["ЗАДАНИЯ","Ответьте на вопросы:\n1. В чем особенность китайских слогов, в чем их отличие от слогов русского языка?\n2. Из каких частей состоят слоги китайского языка?\n3. Что такое инициаль? Что такое финаль? Что такое слог с нулевой инициалью?\n4. Что такое артикуляция?\n5. Назовите основные органы речи."],["ИЕРОГЛИФИКА","ИЕРОГЛИФИЧЕСКАЯ СИСТЕМА КИТАЙСКОГО ЯЗЫКА\nЧерты китайских иероглифов\nВсе китайские иероглифы при своем многообразии построены по определенной системе. В большинстве1 они состоят из комбинаций сравнительно небольшого количества графических элементов— черт.\n1 Существуют простейшие иероглифы, состоящие всего из одной черты, например Э.\n\nЧерты являются простейшими неразложимыми составными частями иероглифов. Существует три типа\nчерт, а также их различные разновидности и варианты:\nпростые черты;\nсложные, или ломаные, черты;\nчерты с крюками.\nИз простых черт основными считаются шесть (табл.1.3).\nТаблица 1.3. Основные черты китайской иероглифики\nГоризонтальная\nВертикальная\nВосходящая\nНисходящая\nвлево\nНисходящая\nвправо\nТочка\nНачертание сложных, или ломаных, черт предполагает, что линия меняет свое направление1:\nи др.\nВарианты написания простых и сложных черт с крюками:\nи др.\nВсего в разных учебниках выделяется от 18 до 30 с лишним черт.\nГрафемы. Простые иероглифы\nБолее сложными элементами китайской иероглифики являются графемы. Графемы восходят к пиктографическим изображениям различных предметов и явлений и представляют собой устойчивые\nсочетания черт, за которыми закреплен определенный смысл
