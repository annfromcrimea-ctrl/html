ан);\nt\nzhӿtou ()— палец;\nt\nyīfu ()— одежда;\nt rnshi ()— знакомиться, узнавать;\nt\nxӿhuan ()— нравиться;\nt dӽsuan ()— собираться, намереваться;\nt\nzhīdao ()— знать;\nt\nzhngfu ()— муж;\nt\nxiānsheng ()— господин;\nt\nxusheng ()— ученик.\nCD 13.2.2\n2. Прочитайте следующие словосочетания, повторяя за диктором:\nt\n(zi) zhuōzi shng (())— на столе;\nt\n(zi) guzi lӿtou (())— в шкафу;\nt\n(zi) yӿy zi ximian (())— под стулом;\nt\n(zi) zhuōzi h guzi zhōngjiān (()Ё)— между столом и шкафом;\nt (zi) wūzi wimian (())— за пределами комнаты, снаружи;\n\n \nt (zi) běnzi pngbian (())— возле тетрадки;\nt\n(zi) fngzi qinmian (()\n)— перед домом.\nCD 13.2.3\n3. Прочитайте следующие предложения, повторяя за диктором:\nNӿ zhӽo shu? — W zhӽo Wng Xiӽoyn. (— ѥ)— Кого ты ищешь (кто\nтебе нужен)? — Я ищу (мне нужна) Ван Сяоюнь.\nNӿ zh\nӿ\nӽo shnme? — W zhӽo w de hēi bӿ. (ҔМ— )— Что ты ищешь? —\nЯ ищу свою черную ручку.\nNӿ zi nӽOӿ? — W zi Běijīng. (—\nҀ)— Где ты? — Я в Пекине.\nZhōngwn bo zi nӽli? — Zhōngwn bo zi tā nli. (Ё— ЁҪ)—\nГде китайские газеты? — Китайские газеты у него там.\nBēizi zi nӽli? — Zi w zhli. (— )— Где стакан? — У меня здесь.\nDāozi h chāzi dōu zi nӽli? — Dāozi h chāzi dōu zi zhuōzi shngmian. (\n—)— Где все ножи и вилки? — Все ножи и вилки на столе.\nYīfu zi nӽli? — Yīfu zi guzi lӿbian. (— )— Где одежда? —\nОдежда в шкафу.\nW de dōngxi zi nӽli? — Zi hzi lӿmin. (— )— Где мои\nвещи? — В коробке.\nDdi zi nӽli? — Zi wūzi wimian. (— )— Где младший брат? —\nСнаружи. (Вне комнаты.)\nZhuōzi zi nӽli? — Zi guzi pngbiān. (— )— Где стол? — Возле\nшкафа.\nYӿzi zi nӽli? — Zi zhuōzi qinmian. (—\n)— Где стул? — Перед\nстолом.\nXiӽo māo zi nӽli? — Zi yӿy zi ximian. (— )— Где котенок? — Под\nстулом.\nPbāo zi nӽli? — Zi guzi h zhuōzi zhōngjiān. (\n— Ё)—\nГде сумка? — Между шкафом и столом.\nZhōngwn shū zi zhuōzi shng. Zhuōzi shng yu zhōngwn shū. (Ёк\nЁк\ng\n)— Китайские книги (находятся) на столе. На столе есть/находятся китайские книги.\nYīfu zi guzi lӿmian. Guzi lӿ yu yīfu. (\n) — Одежда\n(находится) в шкафу. В шкафу есть/находится одежда.\nQin zi qinbāo lӿ. Qinbāo lӿ yu qin. (\n\n)— Деньги (находятся)\nв кошельке. В кошельке есть/находятся деньги.\nCD 13.2.4А\n4. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите следующие диалоги:\nNӿ zh\nӿ\nӽo shu? — Кого ты ищешь?\n— Nӿ zhӽo shu?\n\n— W zhӽo Wng xiānsheng.\n\n— Tā b zi zhli.\nҪ\n\n \n— Tā zi nӽli?\nҪ\n— Dubuqӿq , w b zhīdo.\n\nCD 13.2.4Б\nNӿ zh\nӿ\nӽo shnme? — Что ты ищешь?\n— Nӿ zhӽo shnme?\nҔМ\n— W zhӽo wde qinbāo.\n\n— Nӿde qinbāo zi zhuōzi shng.\n\n— Xixie.\n\n— B yng xi."],["Комментарий","1. Послелоги в китайском языке.\nЕсли в русском языке для обозначения местонахождения одного предмета относительно другого мы используем предлоги «в», «на», «под» и др., то в китайском языке для этой цели используются послелоги с теми же значениями, то есть они всегда ставятся после существительного,\nнапример:\nt в шкафу —\nу\nguzi lӿl bian\nӿ\nt между шкафом и столом — guzi h zhuōzi zhōngjiān .\nПолный список китайских послелогов выгладит следующим образом:\nt сверху, на — shng (\ng ), shngbian (), shngmian (), shngtou ();\nt\nснизу, под— xi (), xibian (), ximian (), xitou ();\nt\nвпереди, перед — qin (\n), qinbian (\n), qinmian (\n), qintou (\nt\nвнутри, в— lӿl (\nӿ ), lӿl bian\nӿ\n(), lӿl mian (), lӿl tou\nӿ\nt\nсзади, за — hubian (\n), humian (\n), hutou (\nt\nснаружи, вне— wibian (), wimian (), witou ();\nt\nслева — zubian ();\nt справа— yubian ();\nt\nрядом, возле — pngbiān ();\nt между, посередине— zhōngjiān (Ё);\nt\nнапротив — dumin ().\n2. Предложения местонахождения и предложения наличия.\nВ одном из предыдущих уроков мы рассматривали предложения местонахождения со словом zi:\nTā zi ma? — Tā zi.— Он у себя? — Он у себя.\nTā zi nӽli? — Tā zi Běijīng.— Где он (находится)? — Он (находится) в Пекине.\nВо втором случае zi можно рассматривать либо как глагол находиться, который на русский язык\nне переводится, либо как предлог в, на.\nАналогичной структурой обладают предложения типа:\nYīfu zi guzi lӿl .— Одежда (находится) в шкафу.\nОднако приблизительно тот же смысл можно выразить с помощью предложения наличия со словом y\ny u:\nGuzi li yu yīfu.— В шкафу есть/находится одежда."],["ЗАДАНИЯ","CD 13.3.1\n1. Слушая звукозапись, определите и поставьте правильный тон в первом слоге:\nwuzi, haizi, waimian, guizi, kuzi, chazi, gentou, shangmian, qiantou, shangtou, xiaoxi, shihou, pengyou,\nwanshang, libian, xihuan, shaozi, zhidao, daozi\nCD 13.3.2\n2. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n3. Переведите c русского на китайский и запишите с помощью пиньинь:\nГде (находится) моя книга на английском языке? — У него (там).\n__________________________________________________________________________________\nГде (находится) моя черная ручка? — У меня (здесь).\n__________________________________________________________________________________\nГде (находится) собачка? — Под столом.\n__________________________________________________________________________________\nГде (находится) ложки? — В шкафу.\n__________________________________________________________________________________\nСтол (находится) возле шкафа. Возле шкафа есть/находится стол.\n__________________________________________________________________________________\nВещи (находятся) на столе. На столе есть/находятся вещи.\n__________________________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: ПРЕДМЕТЫ БЫТА\nВ данном уроке мы рассмотрим графемы, восходящие к изображениям предметов быта (табл.13.1).\nТаблица 13.1. Графемы, связанные с изображением различных предметов быта\nГрафемы\nТранскрипция\nЗначение\n\ndāo\nнож\n\nfēn\nделить, минута\ngōng\nработа, работать\nѢ\nqing, pn\nдоска\n\npin\nщепка, тонкий кусок\n\njīn\nплаток, полотенце\nГрафемы\nТранскрипция\nЗначение\njī, jӿ\nстолик, сколько\n\nsī\nшелк, нить\nѾ\nyāo, me\nкрошечный, суффикс\n\ndu\n(ковш), мера,\n10 литров\n\nff u\nсосуд типа амфоры\n\nyu\nсосуд для вина\n\n \nГрафемы\nТранскрипция\nЗначение\nҕ\nyě\nтоже\n\nji\nступка\n\nwӽng\nсеть, Интернет\n\ngāng\nгорный хребет\n\nwӽ\nчерепица\nГрафемы\nТранскрипция\nЗначение\n\nyī\nодежда\n\nsh\nпища\n\nzhōu\nлодка (устар.)\nchē\n(повозка), автомобиль\nИз них в качестве ключей обычно выделяют графемы:\n,,,Ѐ, , ,, , , ,\n,, ,г,, ,,, ,\n, ,.\n1. Нож (dāo).\nЭта графема восходит к изображению ножа.\nВ современном китайском языке она употребляется в исходном значении.\nГрафема является производной от и всегда пишется в правой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. Делить, минута (fēn).\nЭта графема произошла от изображения ножа, разрезающего что-то на две части.\nВ качестве самостоятельного иероглифа она может также употребляться в значении\nминута.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Работа, работать (gōng).\nПроисхождение этой графемы не совсем ясно, но, скорее всего, она восходит к изображению какого-то инструмента.\nВ современном китайском языке графема употребляется самостоятельно в исходном значении.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n4. Доска (qing, pn), щепка (pin).\nГрафемы и представляют собой левую и правую половины дерева ,\nкоторые получили немного разные названия, чтобы их можно было различать.\nГрафема (доска) в качестве компонента упрощенных иероглифов, стала писаться как\n, самостоятельно она практически не употребляется, в то время как\nграфема часто употребляется самостоятельно.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Платок, полотенце (jīn).\nЭта графема восходит к рисунку, изображавшему кусок ткани, наброшенный на плечи.\nВ качестве самостоятельного иероглифа она может употребляться в значениях: полотенце,\nносовой платок, салфетка.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n6. Столик (jī), сколько (jӿ).\nЭта графема изначально восходит к изображению чайного столика, но она также совпадает с упрощенной формой иероглифа (сколько).\nВариант написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Шелк, нить.\nГрафема восходит к изображению шелковинки, выделяемой шелкопрядом.\nГрафема является производной от графемы , ее сокращенным вариантом.\nОна всегда пишется в левой части иероглифа.\nОбе эти графемы не имеют самостоятельного употребления.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Крошечный (yāo), суффикс (-me).\nГрафема также восходит к изображению шелковинки, выделяемой шелкопрядом.\nУ графемы есть вариант написания М, который в качестве суффикса входит\nв состав вопросительных местоимений ҔМ (что) и М (как).\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Ковш, мера, 10 литров (du).\nДревний рисунок, к которому восходит эта графема, изображал ковш для измерения сыпучих тел, например зерна.\nВ современном китайском языке она имеет самостоятельное употребление в значении\nмера.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Сосуд типа амфоры (ff u).\nЭта графема восходит к изображению некоего сосуда, накрытого крышкой.\nВ современном китайском языке она практически утратила самостоятельное употребление, но часто встречается в качестве компонента.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Сосуд для вина (yu).\nЭта графема восходит к рисунку, изображавшему сосуд для вина.\nОна практически вышла из самостоятельного употребления, но часто встречается в качестве компонента.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Тоже (yě).\nПроисхождение этой графемы не совсем ясно, по одной из версий, она изображает рог\nдля вина.\nВ современном китайском языке эта графема употребляется самостоятельно в значении\nтоже.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Ступка (ji).\nЭта графема восходит к изображению ступки.\nОна практически вышла из самостоятельного употребления, но часто встречается\nв качестве компонента.\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Сеть, Интернет (wӽng).\nЭта графема восходит к изображению рыболовной сети. В современном китайском языке она может также употребляться в значении Интернет.\nГрафема является производной от , всегда пишется в верхней части иероглифа.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Горный хребет (gāng).\nЭта графема восходит к изображению сети и горы, что вместе означало горный хребет.\nОна не входит в список ключей, но часто встречается в качестве компонента сложных\nиероглифов.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Черепица (wӽ).\nЭта графема восходит к изображению двух кусочков черепицы на крыше.\nВ качестве самостоятельного иероглифа она употребляется в своем исходном значении.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Одежда (yī).\nЭта графема изображает крой основного предмета китайского традиционного\nкостюма— распашного халата. Производной от нее является графема , которая всегда пишется в левой части иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n18. Пища (sh).\nРисунок, к которому восходит эта графема, изображал некий сосуд, наполненный\nедой. Производной от нее является графема , которая всегда пишется в левой\nчасти иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Лодка (zhōu) (устар.).\nЭта графема восходит к рисунку, изображавшему традиционную китайскую лодку, не\nимеющую заостренной носовой части. Этот иероглиф несколько устарел, вместо него\nв современном китайском языке используют иероглиф (лодка).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n20. Повозка, автомобиль (chē).\nПиктограмма, к которой восходит эта графема, изображал древнекитайскую боевую колесницу. В современном китайском языке иероглиф означает автомобиль, а также\nвходит в состав сложных слов, обозначающих средства передвижения.\nПолная форма написания:\n. Вариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\nѢ\nѾ\nҕ\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Назовите и сравните графемы:\nѾҕ\n4. Найдите знакомые графемы в следующих иероглифах:\nӤ\n\n \n\n5. Потренируйтесь бегло читать следующие графемы:\n\nѾҕ\n\n6. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям), затем потренируйтесь бегло их читать:\n,р, р,, ,, Ӱ, .\n7. Переведите на китайский и запишите иероглифами:\nвстретиться, зубы, сам, человеческое сердце, на сердце/на душе, язык\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nНож (dāo)\nПроизводная\nграфема\nДелить; минута\n(fēn)\nРабота (gōng)\nВариант\nслева\nДоска\n(qing, pn)\nПроизводная\nграфема\n\n \nЩепка (pin)\nПлаток;\nполотенце (jīn)\nСтолик (jī);\nсколько (jӿ)\nВариант\nсверху\nШелк; нить (sī)\nПроизводная\nграфема\nКрошечный (yāo)\nСуффикс (-me)\nМера, 10 литров\n(du)\nСосуд типа\nамфоры (ff u)\nСосуд для вина\n(yu)\nТоже (yě)\n\n \nСтупка (ji)\nСеть; Интернет\n(wӽng)\nПроизводная\nграфема\nГорный хребет\n(gāng)\nЧерепица (wӽ)\nОдежда (yī)\nПроизводная\nграфема\nПища (sh)\nПроизводная\nграфема\nЛодка (устар.)\n(zhōu)\nПовозка; автомобиль (chē)\nВариант\nслева"]],"14":[["Начало урока",""],["ФОНЕТИКА","СОЧЕТАНИЕ СЛОГОВ В ПЕРВОМ И ВТОРОМ ТОНЕ СО СЛОГАМИ В РАЗЛИЧНЫХ ТОНАХ\nВ предыдущих уроках в лексических разделах нам уже встречались сочетания слогов в различных\nтонах, а в этом и следующем уроках мы подробно рассмотрим эти сочетания и отработаем их чтение\n(рис.14.1\nРис.14.1. Мелодический рисунок сочетаний слогов в первом и втором тоне со слогами в четырех тонах\nОбратите внимание на следующие моменты:\nпри сочетании двух слогов в первом тоне первый из них произносится чуть ниже;\nпри сочетании двух слогов во втором тоне второй из них произносится чуть ниже."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 14.1.1\n1. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в первом тоне:\nyīnggāi cūnzhuāng fēijī kāifā shānpō tīngshuō zhuāngchū shōubīng zhōngyāng guānxīn shōufā\nxīyān jīntiān cānguān dōngfāng kāichē shūjiā qiūtiān fāngchā cāntīng\nCD 14.1.2\n2. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в первом и втором тонах:\nhuānyng tūrn Zhōnggu jīnnin shāngrn Zhōngwn fēichng shāhung suīrn xīyu sēnln\nshēngc ānqun jiāchng gōngrn xīnnin jīny Yīngwn jiāoli bāsh\nCD 14.1.3\n3. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в первом и третьем тонах:\nxiūgӽi qiānbӿ gōngchӽng hēibӽn fāzhӽn gōngchӿ kāishӿ cāochӽng yānhu shēngchӽn sōngsh yōuměi\nzhēnlӿ shēngqӿ jiāzhӽng huācӽo fābiӽo chūbӽn jīnglӿ sīxiӽng gōngqӿng\nCD 14.1.4\n4. Прочитайте, повторяя за диктором, слова, состоящие из слогов в первом и четвертом тонах:\ncānyu gāoxng gōngzu sōngsh shuōhu jīngj zūnzhng chīfn shūji yīnyu gōnggng fēngf\nshūhu gōngfi shēngz jiāohun yīyun shūci gōngyun bāngzh jīru xīwng\n\n \nCD 14.1.5\n5. Прочитайте, повторяя за диктором, слова, состоящие из слогов во втором и первом тонах:\npbāo jihūn moyī fngjiān mngtiān tdīng nnfēng chkān tidēng rnchēng qioshū minyī\nrnjiā chbēi mojīn qinfāng dshū michē qiofū shyī nnfāng ningēn tchū\nCD 14.1.6\n6. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов во втором тоне:\nxux wnxu ninj rtng toc hngch nngmn yunz tngsh hdi Hungh piochng\nynhng pngchng rnmn yoti yt qixng chngdi qg pxi lixu\nCD 14.1.7\n7. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов во втором и третьем тонах:\nchwӽn mobӿ yulӽn pji yunshӿ lingtng shpӿn cdiӽn biji mnku pnggu ninӽi lingshuӿ\nnbӽ shzӿ liwӽng hg cibӽo wjӿ nigu hunghӽi rnku yunshu miyu\nCD 14.1.8\n8. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов во втором и четвертом тонах:\nbici chngk hzu tngzh mngpin chngsh xuyun ydng rnhu shli yundu bihu\ncimo xuxio chngwi lushng mngyu msh lb bcu subin loji\nCD 14.1.9\n9. Прослушайте следующую скороговорку, затем прочитайте ее, повторяя за диктором:\nShuā y\nЧистить зубы\nYshuā nng shuā y,\n\nЗубная щетка может чистить зубы,\nShuā y yng yshuā.\n\nЗубы чистят с помощью зубной щетки.\nHuāhuā yng yshuā hu shuā y, ӮХуа-хуа умеет чистить зубы щеткой,\nHuhu yu yshuā b shuā y.\nУ Хуа-хуа щетка, но он не чистит зубы,\nHuāhuā h Huhu\n\nХуа-хуа и Хуа-хуа,\nShu sh hӽo wwa?\n\nКто из них хороший ребенок?"],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 14.2.1\n1. Прочитайте следующие слова, повторяя за диктором:\nt\nfēijī ()— самолет (дословно:\nлетающая машина);\nt qiānbӿ ()— карандаш (дословно:\nграфитовый пишущий предмет);\nt yīnyu (Ф)— музыка (звук + музыка);\nt gōngzu ()— работа, работать\n(труд + делать);\nt\nxux (д)— учиться\n(учить\n+ повторять);\nt\nyīyun ()— больница\n(лечить + учреждение);\nt\ngōngsī (\n)— компания, фирма\n(общественный + управлять);\nt\ngōngchӽng (\n)— завод, фабрика\n(труд + фабрика);\nt yīshēng ()— лечить + суффикс;\nt jīnglӿ ()— менеджер, директор\n(управлять\n+ заведовать);\nt shāngrn (Ҏ)— бизнесмен\n(торговля +\nя\nчеловек);\nt\ngōngrn (Ҏ)— рабочий\n(труд + человек);\n\n \nt\nfēichng ()— чрезвычайно, весьма;\nt gāoxng (\n)— радоваться;\nt\nliotiān ()— разговаривать, болтать;\nt\nyuyng ()— плавать;\nt\nzzh ()— журнал (дословно:\nразнообразные записи);\nCD 14.2.2\n3. Прочитайте следующие словосочетания, повторяя за диктором:\nt\nzi gōngsī gōngzu (\n)— работать в компании;\nt\nzi yīyun gōngzu ()— работать в больнице;\nt\nzi dxu jiāoshū (к)— преподавать в университете;\nt\nzi dxu xux (д)— учиться в университете;\nt gōngzu hish xux (д)— работать или учиться;\nt\nzu fēijī li ()— прилететь на самолете;\nt\nzu chē li ()— приехать на машине;\nt\nkāichē li ()— приехать за рулем.\nCD 14.2.3\n4. Прочитайте следующие предложения, повторяя за диктором:\nNӿ x\nӿ ӿx huan shnme? — W\nӿ\nxӿx huan gēn pngyou hē ch, liotiānr. (\nӿ\nҔМ—\n\n)— Что тебе нравится? — Мне нравится пить с друзьями чай и болтать.\nNӿ xӿhuan shnme? — W xӿhuan tīng yīnyu, kn shū. (ҔМ— Ф\nк)— Что тебе нравится? — Мне нравится слушать музыку и читать.\nNӿ x\nӿ ӿx huan zu shnme? — W\nӿ\nxӿx huan shngw\nӿ\nӽng. (ҔМ— )— Что ты\nлюбишь делать? Мне нравится выходить в Интернет.\nNӿ x\nӿ ӿx huan xu zhōngwn ma? — Hěn x\nӿ\nӿx huan. (\nӿ\nЁ— )— Тебе нравится\nучить китайский? — (Очень) нравится.\nNӿ x\nӿ ӿx huan n\nӿ\nӿ de gōngzu ma? — B x\nӿ\nӿx huan. (\nӿ\n— )— Тебе нравится\nтвоя работа? — Не нравится.\nNӿ zu shnme gōngzu? — W\nӿ\nsh yīshēng. (ҔМ— )— Кем ты работаешь? — Я врач.\nNӿ zi n\nӿ\nӽli gōngzu? — W\nӽ\nzi yīyun gōngzu. (— )— Где ты\nработаешь? — Я работаю в больнице.\nNn sh zu shnme gōngzu de? — W sh hny\ny jioshī, zi Wiguy\n\ny dxu jiāoshū. (\n\nҔМ\n— к\ng\ng\ng\ng\ny j\n)— Кем вы работаете? — Я преподаватель\nкитайского языка, преподаю в Университете иностранных языков.\nNӿ sh gn shnme de? — W\nӿ\nsh shāngrn. (ҔМ— Ҏ)— Чем ты занимаешься? — Я бизнесмен.\nNӿ sh shnme rn? — W\nӿ\nsh gōngrn, zi gōngchӽng (lӿl ) gōngzu. (ҔМҎ—\n\n)— Кто ты по профессии/чем ты занимаешься? — Я рабочий, работаю на фабрике.\nNӿ gōngzu hishi xux? — W\nӿ\nxux. (д— д)— Ты работаешь или\nучишься? — Я учусь.\nt\ncānguān ()— посещать;\nt tngxu () — одноклассник, одногруппник (вместе, совместный + учиться);\nt\ntngsh (џ) — коллега по работе\n(вместе, совместный + дела).\n\n \nNӿ zi nӽli xux? — W zi Wiguy dxu xux. (д—\nд)— Где ты учишься? — Я учусь в Университете иностранных языков.\nNӿ sh zěnme li de? — W\nӿ\nsh kāichē li de. (М— )— На чем ты\nприехал? — Я приехал за рулем.\nNӿ sh zěnme li de? — W\nӿ\nsh zu huchē li de. (М— )— На\nчем ты приехал? — Я приехал на поезде.\nNӿ sh zěnme li de? — W sh zutiān zu fēijī li de. (М—\n)— На чем ты приехал? — Я прилетел вчера на самолете.\nCD 14.2.4\n5. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите следующий диалог:\nNӿ zu shnme gōngzu? N\nӿ\nӿ x\nӿ ӿx huan zu shnme? (\nӿ\nҔМҔМ) — Кем\nты работаешь? Что ты любишь делать?\n— Nӿ zu shnme gōngzu?\nҔМ\n— W sh yīshēng.\n\n— Nӿ xӿhuan nӿ de gōngzu ma?\n\n— Hěn xӿhuan.\n\n— Nӿ bba māma sh gn shnme de?\nҔМ\n— Tāmen dōu sh wn lӽoshī.\nҪӀ\n\n— Nӿ gēge sh zu shnme gōngzu de?\nҔМ\n— Tā sh shāngrn.\nҪҎ\n— Nӿ ddi gōngzu hishi xux?\nд\n— Tā sh dxushēng, zi W\nW iguy\ny dxu\nxux.\nҪд\n— Tā xux shnme?\nҪдҔМ\n— Tā xux Hny\ny .\nҪд\n— Tā xӿhuan xux Hny\ny ma?\nҪд\n— Hěn xӿhuan.\n\n— Nӿ xӿhuan zu shnme?\nҔМ\n— W xӿx huan\nӿ\ngēn pngy\ny u hē ch, liotiānr.r\nNӿ ne?\n\n— W xӿhuan tīng yīnyu, kn shū.\nФк\nВ этом диалоге используются новые слова: wiguy ()— иностранный язык. Это то же,\nчто и wiwn (), только имеет более официальное употребление."],["Комментарий","1. Конструкция sh… de.\nИспользуется для того, чтобы подчеркнуть время, место, причину или способ осуществления\nкакого-либо действия. Особенно часто эта конструкция употребляется в предложениях типа:\nNӿ sh zu shnme gōngzu de?\nӿ\n(ҔМ)— Кем ты работаешь?\nNӿ sh gnshnme de?\nӿ\n(ҔМ)— Чем ты занимаешься?\nNӿ sh zěnme li de?\nӿ\n(М)— На чем ты приехал?\n\n \n2. Конструкции zu… li и kāi… li.\nВ китайском языке, когда говорится о том, на чем вы приехали, употребляется конструкция zu…\nli (… ), что дословно означает приехал, сидя на... Если вы сами находились за рулем средства передвижения (автомобиль, велосипед), то употребляется конструкция kāi… li (\nу\nр\n3. Вопрос о профессии.\nВ китайском языке существует несколько способов спросить собеседника о профессии, вот примеры основных:\nNӿ (sh) zu shnme gōngzu (de)?\nӿ\n(ҔМ)— Кем ты работаешь? (Дословно: Ты делаешь какую работу?).\nNӿ sh gn shnme de?\nӿ\n(ҔМ)— Чем ты занимаешься?\nNӿ sh shnme rn?\nӿ\n(ҔМҎ)— Кто ты по профессии/чем ты занимаешься? (Дословно:\nКакой ты человек?).\n4. Преподавать и преподаватель.\nОбратите внимание, что слово в слове (jioshī — преподаватель) читается в четвертом\nтоне, а в слове к (jiāoshū — преподавать)— в первом."],["ЗАДАНИЯ","CD 14.3.1\n1. Слушая звукозапись, определите и поставьте правильные тоны в следующих словах:\nxinnian songshu guanxin wenxue hezuo shipin jiehun jiaoliu cunzhuang heiban chengshi gongyuan\ntongshi renmin kaishi maojin qianbi tongzhi hudie shengchan yiding xiwang canting jingji\nCD 14.3.2\n2. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n__________________________________________________________________________________\n__________________________________________________________________________________\n3. Переведите c русского на китайский и запишите с помощью пиньинь:\nЧто тебе нравится делать? — Мне нравится плавать, читать иностранные журналы, слушать\nмузыку.\n__________________________________________________________________________________\nТебе нравится учиться? — Очень нравится.\n__________________________________________________________________________________\nКем ты работаешь? — Я менеджер.\n__________________________________________________________________________________\nГде ты работаешь? — Я работаю в компании.\n__________________________________________________________________________________\nНа чем ты приехал? — Я приехал сегодня на машине (с водителем).\n__________________________________________________________________________________"],["ИЕРОГЛИФИКА","ГРАФЕМЫ: ЦАРСКАЯ ВЛАСТЬ, ВОЙНА И РИТУАЛЬНАЯ ПРАКТИКА\nВ данном уроке мы рассмотрим графемы, связанные с войной и царской властью (табл.14.1).\nТаблица 14.1. Графемы, связанные с войной и царской властью\nГрафемы\nТранскрипция\nЗначение\n\nwng\nцарь, правитель\ny\nяшма, нефрит\n\nsh\nвоин\n\ngān, gn\n(щит), сухой, делать\n\ny\nстрелять, охотиться\n\ngē\nалебарда\n\nw\nя\n\ngōng\nлук\n\njīn\n(топор),\nполкилограмма\nshӿ\nстрела\n\nzh\nдостигать\nГрафемы\nТранскрипция\nЗначение\nѣ\nzhōng\nсередина\n\nshēn\nрастягивать,\nразъяснять\n\njiӽ\nдоспехи\n\nb\nгадать\n\nxiӽo\nмаленький\n\nshӽo\nмало\n\nsh\n(алтарь), показывать\n\nmӿn\nжертвенный сосуд\n\nxu\nкровь\n\njiān\nнаблюдать, надзирать\nИз них в качестве ключей обычно выделяют графемы:\n,, ,, ,, ,, ,, ,, ,, .\n1. Воин (sh).\nНе совсем ясно происхождение этой графемы. По одной из версий, две горизонтальные\nчерты символизируют землю и людей, а вертикальная— воина или ученого, который по\nсвоему положению стоит выше обычных людей. В современном китайском языке она\nупотребляется в основном в сочетаниях, обозначая уважаемых людей.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. Царь (wng), яшма (y).\nГрафема восходит к изображению трех горизонтальных черт — символов неба,\nлюдей и земли, и вертикальной черты, соединяющей их и символизирующей правителя. Символом царской власти были нанизанные на нить три пластинки яшмы или\nнефрита, отсюда и произошла графема , при написании слева ее пишут без точки.\nВариант написания слева:\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n3. Сухой (gān), делать (gn).\nДревний рисунок, к которому восходит эта графема, изображал лук, однако в современном\nкитайском языке она совпадает с упрощенными формами иероглифов ђ (gān)— сухой\nи (gn)— делать.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Стрелять, охотиться (y).\nЭта графема восходит к изображению древнего оружия— стрелы с веревкой. В качестве\nсамостоятельного иероглифа она встречается редко, но часто выступает в качестве компонента сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Алебарда (gē).\nЭта графема также восходит к изображению древнего оружия наподобие алебарды.\nВ качестве самостоятельного иероглифа она также встречается редко, но часто выступает\nкак компонент сложных иероглифов.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n6. Местоимение «я» (w).\nЭта графема еще в древности использовалась для обозначения местоимения я. Она восходит к рисунку, изображавшему либо две скрещенные в битве алебарды, либо руку, держащую оружие.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n7. Лук (gōng).\nЭта графема восходит к изображению лука с натянутой тетивой. В современном китайском языке она употребляется самостоятельно в исходном значении.\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n8. Топор, полкилограмма (jīn).\nПиктограмма, к которой восходит эта графема, изображала топор, однако в современном\nкитайском она употребляется самостоятельно, в основном в значении меры веса цзинь, что\nсоставляет примерно полкилограмма. В качестве компонента она всегда пишется справа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n9. Стрела (shӿ).\nДревний рисунок, к которому восходит эта графема, изображал стрелу. В современном\nкитайском языке она употребляется в исходном значении. В качестве компонента при\nнаписании слева имеет сокращенное написание.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n10. Достигать (zh).\nЭта графема восходит к изображению стрелы, достигшей цели.\nВ современном китайском языке она употребляется в качестве самостоятельного иероглифа со значениями: достигать; доходить (до), прибывать (в); приходить (к).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n11. Середина (zhōng).\nЭта графема изображает квадратную цель, пронзенную в середине.\nКитайцы с древности называют свою страну Ё(Zhōnggu), что значит Срединное\nгосударство. И одно из названий китайского языка звучит как Ё (Zhōngwn).\nИзменение знака\nПримеры употребления\nПорядок написания черт\n12. Растягивать, разъяснять (shēn).\nЭта графема изначально восходит к изображению двух рук, которые что-то растягивают, отсюда его значения: вытягивать, растягивать. В современном китайском языке она помимо\nизначального имеет значения: девятый циклический знак из двенадцати (обезьяна), разогнуться, распрямиться; настойчиво повторять,разъяснять, повторять, возобновлятьи др.\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Доспехи (jiӽ).\nИзначально эта графема восходит к панцирю жука, впоследствии она стала обозначать\nдоспехи.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n14. Гадать (b).\nДревняя гадательная практика в Китае заключалась в том, что правитель задавал вопрос,\nа жрецы-гадатели обмакивали в жертвенную кровь кости животных или черепаший\nпанцирь и накаляли на огне до раскалывания. Гадание осуществлялось по форме образовавшихся трещин. Вот такую трещину и изображает графема.\nВариант написания сверху:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Маленький (xiӽo), мало (shӽo).\nОбе эти графемы восходят к изображению какого-то предмета, разделенного\nна две части. Они различаются только откидной чертой.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n16. Жертвенный сосуд (mӿn), кровь (xu).\nОбе эти графемы восходят к изображению сосуда, куда, видимо, собирали кровь\nжертвенного животного.\nГрафема самостоятельно встречается редко, но часто используется как компонент, а графема очень часто употребляется в качестве иероглифа.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n17. Алтарь, показывать (sh).\nЭта графема восходит к изображению алтаря предков. В современном китайском\nязыке она употребляется в значениях показывать, демонстрировать.\nПримеры употребления\nПорядок написания черт\n18. Наблюдать, надзирать (jiān).\nЭта графема восходит к рисунку, изображавшему человека, склонившегося над жертвенным сосудом с кровью и делающего предсказание.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт:\nѣ\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\n3. Назовите и сравните графемы:\nѣ\n\n4. Найдите знакомые графемы в следующих иероглифах:\n\n5. Прочитайте и переведите следующие иероглифы:\nѣ\n\n \n6. Переведите следующие слова и словосочетания с китайского на русский (для самопроверки смотрите ключи к упражнениям), затем потренируйтесь бегло их читать:\nж,ѣ, ,, Ӱ,.\n7. Переведите на китайский и запишите иероглифами:\nпоезд, выходить в Интернет, в Интернете, пальто, дождевой плащ, рабочий, фабрика/завод\n__________________________________________________________________________________\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nПравитель,\nкороль (wng)\nВариант\nслева\nЯшма, нефрит (y)\nВоин (sh)\n(Щит); сухой;\nделать (gān, gn)\nСтрелять;\nохотиться (y)\nАлебарда (gē)\nЯ (w)\nЛук (gōng)\n\n \n(Топор); полкилограмма (jīn)\nСтрела (shӿ)\nВариант\nслева\nДостигать (zh)\nСередина (zhōng)\nРастягивать; разъяснять (shēn)\nДоспехи (jiӽ)\nГадать (b)\nВариант\nсверху\nМаленький (xiӽo)\nМало (shӽo)\n(Алтарь);\nпоказывать (sh)\nПроизводная\nграфема"]],"15":[["Начало урока","Жертвенный\nсосуд (mӿn)\nКровь (xu)\nНаблюдать,\nнадзирать (jiān)"],["ФОНЕТИКА","СОЧЕТАНИЕ СЛОГОВ В ТРЕТЬЕМ И ЧЕТВЕРТОМ ТОНАХ\nСО СЛОГАМИ В РАЗЛИЧНЫХ ТОНАХ\nВ этом уроке мы подробно рассмотрим сочетание слогов в третьем и четвертом тонах со слогами\nв различных тонах и отработаем их чтение.\nМелодическое представление двусложных сочетаний, начинающихся слогами в первом и втором\nтонах, иллюстрирует рис.15.1.\nРис.15.1. Мелодическое изображение двусложных сочетаний, начинающихся слогами в первом и втором тонах\nОбратите внимание на следующие моменты:\nкогда за слогом в третьем тоне следует слог в первом, втором или четвертом тоне, третий тон\nне имеет восходящей интонации, произносится низко и практически ровно (третий низкий\nтон);\n\n \nпри сочетании двух слогов с этимологическим третьим тоном тон начального слога меняется\nна второй, однако это никак не отражается на письме;\nпри сочетании двух слогов в четвертом тоне тоны укорачиваются в диапазоне и в начальном,\nи в конечном слоге."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 15.1.1\n1. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в третьем и первом тонах:\nhuchē shudū kěxī hӽohē lӽoshī xiӽobā zӽocāo nӽigāo shuxiān hӽotīng dchē běifāng měigōng\nxduō lӽogōng tӿxī jiӽndān hӽohāo tӿwēn wӽngbā shujī wӽn’ān měiguān nӽojīn\nCD 15.1.2\n2. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в третьем и втором тонах:\nbӽinin cӽich qӿchung kěnng dӽchng zhx gӽiyu gӽnju hӽili Hӽinn jiӽmng jiӽnch jiӽnfi\njiӽngti lӽob mӽqn lӽochng mӽnyun Měigu nӽiyng lxng zhěngq\nCD 15.1.3\n3. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в третьем тоне:\nshubiӽo wӽngwӽng yěx kěyӿy xӿliӽn hӽidӽo zӽochӽng hěnhӽo hӽichӽn nӿhӽo mӽbiӽo shuӿgu mӽyӿy\nyěyu\nCD 15.1.4\n4. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в третьем и четвертом тонах:\nbӿshn qӿngwn nl pӽob wӽnfn qӿngzu bӽw zhӿsh yӿy hu zhy hӽokn zӽofn gӽnxi měil\ngӽnyng kӽosh jiӽngk yӿy nlio tӽoln kěsh shji y\n\nuy shuto hӽixi bӿhu\nCD 15.1.5\n5. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в четвертом и первом тонах:\nninshū dyī bxū ljiāo tshū ybiān chnggē bntiān yuchū bngōng jioshī tzhēng ynshuā qchē\ndfāng yuyīn knshū dinchē cidān djiē dintī dnqīng yufā ybān\nCD 15.1.6\n6. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в четвертом и втором тонах:\nlinx zhnti tbi tiyng gngh dxu byun zuwn dt huxu iqng jji jngpng dioch\nktng fz minqin lchng guti bxi pih dulin xicng\nCD 15.1.7\n7. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в третьем и первом тонах:\nzjӿ kběn xiy\ny zdiӽn xinfӽf\nHny\ny\nbozhӿ zhshӽo zm homӽ gzhng dlӿ dinnӽo ry\ny xixuě\nduzhӽng bnfӽf tiow\nw zhngdiӽn fnwӽn dinyӿy ng qihӽo Rběn knfӽf\nCD 15.1.8\n8. Прочитайте, повторяя за диктором, слова, состоящие из двух слогов в четвертом тоне:\njiosh minmo jioshu xik hubo zijin bogo shujio dgi xinzi hnz dinhu wimo\njinmin snb zhy shngk dinbo zhoxing dinsh dngw dngzu\n\n \nCD 15.1.9А\n9. Прослушайте следующие скороговорки, затем прочитайте их, повторяя за диктором:\nZhӽo lӽoh\nИскать тигров\nYī r sān s w\nw ,\nѠѨ\nРаз, два, три, четыре, пять,\nShng shān zhӽo lӽoh.\n\nНа горе искали тигров.\nLӽoh zhӽo-bu-do,\n\nНе нашли тигров,\nZhӽodo xiӽo sōngsh.\n\nНашли маленьких белочек.\nSōngsh yu jӿ zhī?\n\nСколько белочек?\nYī r sān s w\nw .\nѠѨ\nРаз, два, три, четыре, пять.\nCD 15.1.9Б\nZhāi gu\nСобирать фрукты\nYī r sān s w\nw li qī,\nѠѨ\n\nРаз, два, три, четыре, пять, шесть, семь,\nQī li w\nw s sān r yī.\n\nѨѠ\nСемь, шесть, пять, четыре, три, два, один.\nQīge niūniu li zhāi gu,\n\nСемь девушек пришли собирать фрукты,\nQīge huāln shuzhōng t. Ё\nСемь корзинок держат в руках.\nQīge guzi bӽi qī yng:\n\nКладут фрукты семи видов:\nPnggu, tozi, shliu,\n\nЯблоки, персики, гранаты,\nShzi, lӿzi, lzi, l.\n\nХурму, сливы, каштаны, груши."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 15.2.1\n1. Прочитайте следующие слова, повторяя за диктором:\nt shuӿgu ()— фрукты (дословно: водяные плоды);\nt\nshujī ()— мобильный телефон (дословно: ручной аппарат);\nt shubiӽo ()— наручные часы (рука\n+ показывать);\nt dinhu ()— телефон (дословно: электронная речь);\nt\ndinnӽo ()— компьютер (дословно: электронный мозг);\nt zhopin () — фотография (фотографировать + щепка, пластинка);\nt dyī ()— пальто (дословно: большая одежда);\nt\nkběn ()— учебник (дословно: учебная книга/переплет/корешок);\nt qchē ()— автомобиль (дословно: паровая колесница);\nt huchē ()— поезд (дословно: огненная колесница);\nt\nbozhӿ ()— газета (газета + бумага);\nt kě’i (\n)— милый (дословно: можно любить);\nt\nchnggē ()— петь (дословно: петь песни);\nt\nzuk ()— гостить (дословно: делать/быть гостем);\nt lxng ()— путешествовать (проживать временно + идти);\nt\npӽob ()— бегать (бегать + поступь);\nt yqӿq ()— вместе (один + группа);\n\n \nt xinzi ()— сейчас (появляться +\nя\nнаходиться);\nt\nzijin ()— до свидания (дословно: еще увидимся).\nCD 15.2.2\n2. Прочитайте следующие словосочетания, повторяя за диктором, обращая внимание на изменение тона числительных:\nt\ny zhī māo ()— одна кошка;\nt\nliӽng zhī māo ()— две кошки;\nt\ny tio h ()— одна река;\nt\nliӽng tio h ()— две реки;\nt\ny běn shū (к)— одна книга;\nt\nliӽng běn shū (к)— две книги;\nt\nyge rn (Ҏ)— один человек;\nt\nliӽngge rn (Ҏ)— два человека;\nt\ny kui ru ()— один кусок\nмяса;\nt\nliӽng kui ru ()— два куска\nмяса;\nt d-yī zhī māo ()— первая кошка;\nt\nd-r zhī māo (Ѡ)— вторая кошка;\nt d-yī tio h ()— первая река;\nt\nd-r zhī māo (Ѡ)— вторая река;\nt\nd-yī běn shū (к)— первая книга;\nt\nd-r běn shū (Ѡк)— вторая книга;\nt d-yīge rn (Ҏ)— первый человек;\nt d-rge rn (ѠҎ)— второй человек;\nt\nd-yī kui ru ()— первый кусок\nмяса;\nt\nd-r kui ru (Ѡ)— второй кусок\nмяса.\nCD 15.2.3\n3. Прочитайте следующие предложения, повторяя за диктором:\nZh sh shnme? — Zh sh y běn shū. (ҔМ— к)— Что это? — Это (одна)\nкнига.\nN sh shnme? — N sh liӽngge z. (ҔМ— )— Что то? — То два иероглифа.\nZh sh shnme? — Zh sh sān bӽ dāozi. (ҔМ— )— Что это? — Это\nтри ножа.\nN sh shnme? — N sh li zhī qiānbӿ. (ҔМ—\n)— Что то? — То шесть\nкарандашей.\nNӿ yu jӿge pngyou? — W yu liӽngge pngyou. (\n\nСколько у тебя (есть) друзей? — У меня (есть) два друга.\nNӿ yu jӿge hizi? — W yu sge hizi. (\n) — Сколько\nу тебя детей? — У меня четверо детей.\nNӿ jiā y\nӿ\n\ny u jӿ k\nӿ\nk u rn? — W jiā y\ny u w\nw k\n\nk u rn. (\nҎ—\nѨҎ)— Сколько\nчеловек в твоей семье? — В моей семье пять человек.\nNӿ y\nӿ\ny u jӿ běn zhōngwn kběn? — W\nӿ\ny\ny u sān běn zhōngwn kběn. (\nЁ—\nЁ\ny\nj\ng\n)— Сколько у тебя китайских учебников? — У меня три китайских учебника.\nNӿ y\nӿ u duōshao yīngwn shū? — W yu sānshw\nw běn yīngwn shū. (\n\nк—\nѨк\ny\ny g\ny g\n)— Сколько у тебя книг на английском языке? — У меня тридцать пять\nкниг на английском языке.\nNӿ y\nӿ\ny u duōshao qin? — Jii shkui. (\n— б)— Сколько у тебя денег? — Девяносто (юаней).\n\n \nNӿ de rzi jӿ su? — Tā li su. (— Ҫ\n)— Сколько лет твоему сыну? —\nЕму шесть лет.\nNӿ duōd? — W rshs su. (— Ѡ)— Сколько тебе лет? — Мне двадцать\nчетыре года.\nCD 15.2.4А\n4. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите следующие диалоги:\nNӿ jiā y\nӿ\nu jӿ k\nӿ u rn? (\nҎ)— Сколько человек в твоей семье?\n— Nӿ jiā yu jӿ ku rn?\n\nҎ\n— W jiā y\ny u s k\nk u rn: zhngfu, rzi h w.\nW y\ny u y zhāng wmen jiā de zhopin, nӿ\nkn!\n\nҎ\n\nӀ\n— Nӿde rzi jӿ su?\n\n— Tā li su.\nҪ\n\n— Nӿ yu xiōngd jiěmi ma?\n\n— Miyu. Nӿ jiā yu jӿ ku rn?\n\nҎ\n— W jiā yu w\nw ku rn: bba, māma,\ngēge, w, hi yu w ddi.\n\nѨҎ\n\n— Nӿ jiā yu xiӽo māo xiӽo gu ma?\n\n— W jiā yu y zhī xiӽo māo, tā hěn kě’i.\n\n— Tā jio shnme mngz?\nҔМ\n— Tā jio Xiӽohuā.\n\n— Nӿ yu nn pngyou ma?\n\n— Yu.\n— Tā zu shnme gōngzu?\n— Tā sh yīshēng.\n\nҪҔМ\nҪ\nCD 15.2.4Б\nNn xiӽng mӽi shnme? (фҔМ)— Что вы хотите купить?\n— Nn xiӽng mӽi shnme?\nфҔМ\n— W xiӽng mӽi liӽng jīn pnggu.\nф\n— Nn xiӽng mӽi hng pnggu hish\nhung pnggu?\nф\n— Nӽ zhng pnggu hӽochī?\n\n— Wmen de pnggu dōu hӽochī.\nӀ\n— N w mӽi liӽng jīn hng pnggu,\nduōshao qin?\nф\n— rshw\nw kui.\nѠѨ\n— Gěi nӿ qin.\n\n— Xixi. Zijin!\n\n— Zijin!\n\nВ этих диалогах используются новые слова:xiōngd()— старший и младший братья;jiěmi\n) — старшая и младшая сестры; xiōngd jiěmi (\nр\n) — братья-сестры; nn\n\n \npngyou (\n)— парень, друг; Xiӽohuā ()— Сяохуа (имя); liӽng jīn ()— два\nцзиня (килограмм); pnggu (\nру\nру\n)— яблоки."],["Комментарий","1. Количественные числительные в китайском языке.\n1) Числительные первого десятка.\nlng () 0\ns ()\nbā (\n) 8\nyī ()\nw\nw (Ѩ) 5\nji (б) 9\nr (Ѡ)\nli (\n) 6\nsh () 10\nsān () 3\nqī ()\n2) Числительные второго десятка. Образуются путем сложения числительного sh (10) с соответствующим числительным первого десятка:\nsh (10) + yī(1) = shyī(11), то есть десять и один.\nshyī ()\nshs ()\nshqī () 17\nshr (Ѡ)\nshw\nw (Ѩ) 15\nshbā (\n) 18\nshsān () 13\nshli (\n) 16\nshji (б) 19\n3) Десятки. Также образуются таким образом, что сначала ставится количество десятков, затем\nчислительное:\nsh (10): rѠ(2) + sh (10) = rshѠ(20), то есть два десятка.\nsh ()\nssh ( ) 40\nqīsh () 70\nrsh (Ѡ)\nw\nw sh (Ѩ) 50\nbāsh (\n) 80\nsānsh () 30\nlish (\n) 60\njish (б) 90\n4) Двузначные числа. Складываются путем сложения десятков и единиц, например:\nrshsān (Ѡ)— 23; lishyī (\n)— 61.\n5) Сотни, тысячи. Образуются так же:\nybӽi ()\nyqiān ()\n1000\nrbӽi / liӽngbӽi (Ѡ / ) 200\nliӽngqiān () 2000\nsānbӽi ()\nsānqiān ()\n3000\n6) Десять тысяч— «тьма». В китайской системе счета есть разряд, отсутствующий в европейских\nсистемах счета,— ywn ()— 10 тысяч. Однако он был в древнерусском языке — тьма,\nчто также означало очень много. Обратите внимание, что нельзя говорить shqiān ().\nywn ()\n10 000\nswn ()\n40 000\nqīwn () 70 000\nliӽngwn () 20 000\nw\nw wn (Ѩ) 50 000\nbāwn (\n) 80 000\nsānwn ()\n30 000\nliwn (\n) 60 000\njiwn (б) 90 000\nДальнейший счет обычно вызывает большие затруднения у учащихся, так как он не соответствует привычному нам счету, поэтому более сложные числа мы здесь рассматривать не будем,\nоднако отметим, что они получаются путем сложения единиц, десятков, сотен и тысяч с раз-\n\n \nрядом (10 тысяч). Наибольшим разрядом в китайском языке считается y (ғ)— 100 миллионов.\n7) Треx-, четырех- и пятизначные числа. Также образуются последовательным сложением:\njibӽi lishyī (б\n)— 961; sqiān bābӽi w\nw sh (\nѨ)— 4850;\nbā wn yqiān w\nw bӽi sshsān (\nѨ)— 21 543.\nЕсли число 11 находится в составе более сложного числительного, то оно будет писаться уже\nне как shyī (), а как yshyī (): sbӽi yshyī ()— 411.\nЕсли какой-либо разряд пропущен, на его месте ставится 0. При пропуске двух и более стоящих\nрядом разрядов 0 пишется и произносится только один раз:\njiqiān lng lishw\nw (\nб\nѨ)— 9065; qīqiān sānb~i lng r (Ѡ)— 7302;\nsānbӽi lng bā (\n)— 30 008.\n2. Порядковые числительные.\nОбразуются путем добавления к количественному числительному суффикса d- ():\nd-yī ()— первый; d-r (Ѡ)— второй; d-sān ()— третий; d-s ()— четвертый;\nd-w\nw (\nѨ)— пятый; d-li (\n)— шестой; d-qī ()— седьмой; d-bā (\n)— восьмой;\nd-jii (\nб)— девятый ит.д.\n3. Счетные слова.\nВ русском и других языках существительные относят к исчисляемым, которые можно считать\nпоштучно, например: один стул, две книги, и неисчисляемым, которые поштучно не считаются\nи для счета которых обычно используют какую-либо меру, например: один стакан воды, две тарелки супа. Также есть существительные, при употреблении которых с числительными ставятся\nслова-посредники, например: один лист бумаги. Однако если в русском языке слова-посредники\nиспользуются очень ограниченно, в китайском языке без них не обойтись. Это и есть так называемые счетные слова. В китайском языке при присоединении числительного к существительному\nмежду ними за очень редким исключением обязательно ставится счетное слово. Счетные слова\nиногда называют классификаторами, для разных предметов или классов предметов употребляются разные счетные слова. Счетных слов довольно-таки много, но основных около двадцати:\n1) ge ()— штука. Это универсальное счетное слово, которое может употребляться с любым\nсуществительным, кроме того, это основное счетное слово для людей. Примеры:\nyge rn (Ҏ)— один человек; yge pngyou (\n)— один друг;\nyge xushēng ()— один ученик; yge z ()— один иероглиф.\n2) ku ()— рот. Это счетное слово употребляется для счета членов семьи. Например:\ny ku rn (Ҏ) — один человек (член семьи).\n3) wi ()— персона. Слово также используется для счета людей, но имеет подчеркнуто уважительный оттенок. Примеры:\ny wi lӽoshī ()— один учитель; y wi xiānshēng ()— один господин;\ny wi krn (Ҏ)— один гость.\n4) zhī ()— единица. Используется для счета всех животных и птиц, предметов прямоугольной формы, кораблей. Примеры:\n\n \ny zhī niӽo ()— одна птица; y zhī yng ()— один баран;\ny zhī pbāo (\n)— одна сумка; y zhī shubiӽo ()— одни часы.\n5) tio ()— полоска. Служит для счета тонких, узких, продолговатых объектов, таких как\nреки, улицы, а также рыб и иногда собак. Примеры:\ny tio h ()— одна река; y tio y ()— одна рыба.\n6) zhī (\n)— ветка. Используется для счета тонких, узких, продолговатых предметов цилиндрической формы, напоминающих ветку. Примеры:\ny zhī bӿ (\n)— одна ручка; y zhī qiānbӿ (\n)— один карандаш;\ny zhī mobӿ (\n)— одна кисть.\n7) zhāng (\ng )— плоскость. Употребляется для счета листов чего-либо и плоских предметов.\nПримеры:\ny zhāng zhӿ (\nӿ )— один лист бумаги; y zhāng zhopin ()— одна фотография;\ny zhāng zhuōzi ()— один стол.\n8) bӽ ()— рукоятка. Применяется для счета предметов с ручками (ножи ит.д.), а также стульев. Примеры:\ny bӽ dāozi ()— один нож; y bӽ chāzi ()— одна вилка;\ny bӽ shozi (\n)— одна ложка; y bӽ yӿy zi ()— один стул.\n9) ti (\n)— подставка. Используется для счета приборов, механизмов, промышленных машин.\nПримеры:\ny ti shujī (\n)— один сотовый телефон; y ti dinhu (\n)— один телефон.\n10) běn ()— переплет, корешок. Употребляется для счета книг, учебников, журналов, тетрадей.\nПримеры:\ny běn shū (к)— одна книга; y běn zzh ()— один журнал;\ny běn kběn ()— один учебник; y běn běnzi ()— одна тетрадь.\n11) fn (ӑ)— экземпляр. На это счетное слово в основном считаются газеты:\ny fn bo (ӑ)— одна газета.\n12) jin (ӊ)— предмет, вещь. Употребляется для счета предметов одежды, дел, вещей, документов. Примеры:\ny jin dyī (ӊ)— одно пальто; y jin sh (ӊџ)— одно дело.\n13) zu ()— место. Используется для счета зданий и деталей ландшафта. Примеры:\ny zu dlu ()— одно здание; y zu shān ()— одна гора.\n14) zhng ()— вид, сорт. Используется, когда речь идет о видах, сортах, разновидностях\nчего-либо, например:\ny zhng shuӿgu ()— один вид фруктов.\n15) ling (\ng )— пара колес. Употребляется для счета автомобилей и других средств передвижения на колесах:\ny ling qchē ()— один автомобиль.\n\n \n16) li (\n)— колонна, ряд. Это счетное слово для поездов:\ny li huchē (\n)— один поезд.\n17) jiān ()— промежуток. Это счетное слово для комнат, помещений:\ny jiān wūzi ()— одна комната.\n18) jiā ()— семья, дом. Используется для счета фирм и магазинов:\ny jiā gōngsī (\n)— одна фирма.\n19) kui ()— кусок. Указывает на существительные, не имеющие правильной формы и существующие в виде кусков чего-либо. Также используется для счета денег. Примеры:\ny kui ru ()— один кусок мяса; y kui qin ()— один юань.\n20) shuāng (\ng )— пара. Используется для счета парных предметов. Примеры:\ny shuāng pxi ()— одна пара обуви;\ny shuāng kuizi ()— одна пара палочек для еды.\nОбратите внимание, что некоторые существительные могут употребляться с разными счетными\nсловами, и если вы не знаете, с каким счетным словом употребить то или иное существительное,\nто всегда можно использовать универсальное слово ge ()— штука.\n4. Разница в употреблении числительных r (Ѡ) и liӽng (\ng ).\nОба числительных, и r (Ѡ), и liӽng (\ng ), обозначают два, но употребляются в несколько разных\nконтекстах.\nЧислительное liӽng (\ng ) употребляется:\nt\nсо счетными словами в количественном значении, например: liӽng běn shū (к)— две\nкниги;\nt в начале сложных числительных, начинающихся с 2, кроме 20, например: liӽngbӽi ()—\n200, liӽngwn ()— 20 000.\nЧислительное r (Ѡ) употребляется:\nt\nпри счете, например: yī r sān s w\nw … (ѠѨ…)— 1, 2, 3, 4, 5…\nt\nв порядковых числительных, например: d-yī, d-r, d-sān… (Ѡ…)— первый, второй, третий…\n5. Изменение тона числительного yī ()— 1.\nИзменение тонов числительного yī ()— 1, обычно представляет определенную сложность для\nучащихся, поэтому нужно запомнить несколько правил.\nПеред слогом в четвертом тоне этимологический первый тон числительного yī ()— 1 меняется на второй: y ling qchē ()— один автомобиль.\nСлово ge () в этом случае утрачивает свой этимологический четвертый тон и пишется слитно\nс предшествующим словом, в данном случае— с числительным, однако числительные yī ()—\n1 все равно меняют свой тон на второй: yge rn (Ҏ)— один человек.\nПеред слогами в любом из тонов, кроме четвертого, этимологический первый тон числительного\nyī ()— 1 меняется на четвертый: y zhī māo ()— одна кошка.\nНа порядковые числительные правила изменения тона не распространяются: d-yī běn kběn\n(к\nр\n)— первый учебник.\n\n \n6. Разница между вопросительными местоимениями jӿ () и duōshao ().\nОба эти местоимения переводятся как сколько, но употребляются по-разному:\nt\njӿ () используется всегда со счетным словом и тогда, когда хотят спросить о чем-то, чего,\nскорее всего, меньше 10, например: Nӿ yu jӿge pngyou? (\n\nр\n) — Сколько\nу тебя друзей?\nt\nduōshao () употребляется чаще всего без счетного слова и тогда, когда спрашивают\nо чем-то, чего больше 10, или о неисчисляемых предметах, например: Nӿ y\nӿ u duōshao qin?\n)— Сколько у тебя денег?"],["ЗАДАНИЯ","CD 15.3.1\n1. Слушая звукозапись, определите и поставьте правильные тоны в следующих словах:\ndacheng shouxian yihou duilian caidan huabao bangong xianzai laocheng henhao hailiu zaocao kexi\nyinliao nihao ziji tebie fanwan kanshu zaofan Hainan haoting\nCD 15.3.2\n2. Слушая звукозапись, напишите диктант:\n__________________________________________________________________________________\n3. Произнесите следующие числа по-китайски:\n22, 55, 88, 77, 22, 60, 16, 20, 12, 40, 14, 54, 45, 82, 28, 76, 67, 52, 25, 38, 83, 96, 69, 74, 31, 28, 57;\n120, 250, 340, 455, 674, 1500, 5400, 7430, 3896, 3467, 15 000, 67 500, 53 280, 47 561, 50 764, 10 076, 38 001.\n4. Переведите c русского на китайский и запишите с помощью пиньинь, обращая внимание на разницу в употреблении двух числительных, обозначающих 2:\nДва карандаша, второй карандаш. _____________________________________________________\nДве сумки, вторая сумка. ____________________________________________________________\nДве собаки, вторая собака. ___________________________________________________________\nДва стола, второй стол. ______________________________________________________________\nДва стула, второй стул. ______________________________________________________________\nДва преподавателя, второй преподаватель. _____________________________________________\nДва ученика, второй ученик. _________________________________________________________\n5. Переведите c русского на китайский и запишите с помощью пиньинь, обращая внимание на изменение тона числительных:\nОдна книга, первая книга. ___________________________________________________________\nСемь кошек, седьмая кошка. _________________________________________________________\nВосемь преподавателей, восьмой преподаватель. ________________________________________\nОдин карандаш, первый карандаш. ____________________________________________________\nСемь автомобилей, седьмой автомобиль. _______________________________________________\nВосемь иероглифов, восьмой иероглиф. ________________________________________________\nОдин сотовый телефон, первый сотовый телефон. _______________________________________\nСемь студентов, седьмой студент. _____________________________________________________\n\n \nВосемь компьютеров, восьмой компьютер. _____________________________________________\nОдин учебник, первый учебник. ______________________________________________________\n6. Переведите c русского на китайский и запишите с помощью пиньинь:\nЭто пять ручек. ____________________________________________________________________\nТо три собаки. _____________________________________________________________________\nЭто шесть иероглифов. ______________________________________________________________\nТо один господин. __________________________________________________________________\nЭто десять листов бумаги. ____________________________________________________________\nТо девять зданий. ___________________________________________________________________"],["ИЕРОГЛИФИКА","СИМВОЛЫ И ГРАФЕМЫ: ЦИФРЫ И ЦВЕТА\nВ данном уроке мы рассмотрим символы, графемы и сложные иероглифы, обозначающие цифры\nи цвета (табл.15.1).\nТаблица 15.1. Символы, графемы и сложные иероглифы, обозначающие цвета и цифры\nСимволы\nТранскрипция\nЗначение\n\nlng\nноль\nӂ\nr\nдва\nп\nsān\nтри\n\ns\nчетыре\nӊ\nw\nw\nпять\n\nli\nшесть\nй(\nqī\nсемь\nѭ)\nbā\nвосемь\nғ\nji\nдевять\n\nsh\nдесять\n\nbӽi\nсто\nСимволы\nТранскрипция\nЗначение\n\nqiān\nтысяча\nн\nwn\nдесять тысяч\nњ\nliӽng\nдва, двое, пара\nbn\nполовина\n\ns\nцвет\n\nbi\nбелый\n\nqīng\nсине-зеленый\n\nch\nалый, рыжий\n\nhung\nжелтый\n\nhēi\nчерный\nСтоит обратить внимание, что в современном китайском языке для обозначения цифр могут\nиспользоваться арабские цифры, но чаще они записываются специальными иероглифическими\nсимволами.\nВ качестве ключей из них выделяют:\nѠ,\n,,, ,,, , .\n\n \n1. Ноль (lng).\nЭто не графема и не иероглиф, а символ, которым обозначают цифру 0. Тем не менее мы\nрассматриваем его здесь, поскольку этот урок посвящен изучению цифр.\nЭтот символ принято писать против часовой стрелки. Цифра 0 также может иногда записываться сложным иероглифом .\nПорядок написания черт\n2. Два (r), три (sān).\nВ предыдущих уроках мы уже изучили цифру 1 (yī), которая представляет собой\nодну горизонтальную черту (). Цифры 2 (r) и 3 (sān) построены по тому же\nпринципу и представляют собой две и три горизонтальные черты (соответственно\nѠ и ).\nПримеры употребления\nПорядок написания черт\n3. Четыре (s).\nДревний рисунок, к которому восходит эта графема, изображает нечто разделенное на две\nчасти, что, по-видимому, подразумевает, что число делится на два.\nВ качестве компонента она встречается редко.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n4. Пять (w\nw ).\nСогласно основной версии, эта графема изображает силы инь и ян, которые производят\nпять первоэлементов.\nОна также входит в состав графемы , которой в древности обозначали местоимение я.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n5. Шесть (li).\nРисунок, к которому восходит эта графема, отличается от рисунка, изображающего\nцифру 4, только точкой сверху.\nСвоей симметричностью она также отражает идею четности. В качестве компонента\nиероглифов этот символ встречается очень редко.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n6. Семь (qī).\nЭтот несимметричный символ отражает идею нечетности.\nВариант написания слева:\nПримеры употребления\nПорядок написания черт\n7. Восемь (bā).\nЭта графема изображает деление. Она симметрична, как и все четные графемы. Вариант\nнаписания Ћ означает делить надвое.\nВарианты написания:\nПримеры употребления\nПорядок написания черт\n8. Девять (ji).\nВозможно, эта графема изображала руку, согнутую в локте. Она также несимметрична,\nкак и другие символы, обозначающие нечетные числа.\nОна часто встречается в качестве компонента.\nПримеры употребления\nПорядок написания черт\n9. Десять (sh).\nВозможно, эта графема изображала руку, согнутую в локте. Она также несимметрична,\nкак и другие символы, обозначающие нечетные числа.\nОна часто встречается в качестве компонента.\nПримеры употребления\nПорядок написания черт\n10. Сто (bӽi).\nИзначально эта графема представляла собой фоноидеограмму, состоящую из детерминатива (1) и фонетика (bi)— белый. Однако она может выступать в роли компонента сложных иероглифов.\nПримеры употребления\nПорядок написания черт\n\n \n11. Тысяча (qiān).\nИзначально эта графема представляла собой фоноидеограмму, состоящую из детерминатива (1) и фонетика ҏ(rn)— человек.\nПримеры употребления\nПорядок написания черт\n12. Десять тысяч (wn).\nГрафема в полной форме восходит к изображению скорпиона, однако упрощенная форма,\nскорее всего, имеет то же происхождение, что и графема : (1) и ҏ(rn)— человек.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n13. Два, двое (liӽng).\nЭта графема, возможно, происходит от изображения двух рук с грузом в каждой из них,\nчто символизировало равновесие, баланс. Хотя она является синонимом графемы Ѡ\n(r), употребляются графемы по-разному.\nПолная форма написания:\nПримеры употребления\nПорядок написания черт\n14. Половина (bn).\nЭта графема изначально обозначала разделенную (Ћ) надвое голову быка (). Впоследствии она стала означать половину. При размещении слева в качестве компонента имеет чуть\nизмененное написание.\nВариант написания слева:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n15. Цвет (s).\nЭта графема изначально восходила к изображению любовников и означала красоту\nи радость на их лицах. Позднее этим иероглифом стали обозначать цвет красных чернил.\nВ современном китайском языке она употребляется в значении цвет.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n\n \n16. Белый (bi).\nПроисхождение этой графемы, по всей видимости, связано с цветом заходящего солнца.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n17. Сине-зеленый (qīng).\nЭта графема изначально означала цвет зелени: — зеленые овощи, зелень, но может\nупотребляться и в значении «синий»: — синее небо, а также— сине-зеленый, бирюзовый. В качестве компонента она всегда пишется в правой части иероглифа и является\nфонетиком.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n18. Алый, рыжий (ch).\nЭта графема изначально сочетала в себе элементы (большой) и(огонь), обозначая,\nтаким образом, цвет пламени.\nСочетание (chdo) означает экватор.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n19. Желтый (hung).\nДревний рисунок, от которого произошла эта графема, изображал человека с нефритовым украшением на поясе. Нефрит считался священным камнем в Древнем Китае.\nК тому же желтый цвет считался священным, цветом императора, и только император\nимел право одеваться в одежды желтого цвета. В качестве компонента графема всегда\nпишется в правой части иероглифа.\nПолная форма написания:\nИзменение знака\nПримеры употребления\nПорядок написания черт\n20. Черный (hēi).\nИсследователи склоняются к тому, что эта графема восходит к изображению огня и дымохода, обозначая, таким образом, цвет сажи. В своем современном написании графема сохранила элемент огонь в виде четырех точек.\n\n \nИзменение знака\nПримеры употребления\nПорядок написания черт"],["ЗАДАНИЯ","1. Назовите графемы, определите в каждой из них количество и порядок черт, а затем бегло прочитайте:\nжӂпӊйғнњ\n\n2. Сравните разные варианты графем по их написанию и употреблению:\n\nѭ\n3. Назовите и сравните графемы:\nжӂпн\n\n4. Найдите знакомые графемы в следующих иероглифах:\nӐӑ\n\nӷӽ\nӶ\n\n5. Переведите, а затем бегло прочитайте следующие числа:\nӊ,ӊ,п,п,ӂ,ӂ, й, й\n, ғ, ғ, ж, пйж, ғӂп,\nйӊӊ, жнйп, њнғ\nӂӊ, ӊжӂ, пнӂй, нп,\nнӊп, пнӂ.\n6. Переведите, а затем бегло прочитайте следующие словосочетания:\nжѠӰ, њӰ, п, Ѡ,ӊҜ;, ,\n,, .\n7. Переведите, а затем бегло прочитайте следующую скороговорку:\n\n \n\nуу\n8. Запишите иероглифами:\n14, 53, 76, 28, 49, 37, 92, 85, 24, 35, 41\n__________________________________________________________________________________\n865, 7653, 2592, 43 789, 30 004, 40 051, 40 011\n__________________________________________________________________________________"],["ПРОПИСИ","Пропишите и выучите следующие графемы, обращая внимание на порядок написания черт:\nНоль (lng)\nДва (r)\nТри (sān)\nЧетыре (s)\nПять (w\nw )\nШесть (li)\nСемь (qī)\nВариант\nслева\nВосемь (bā)\nВариант\nснизу\n\n \nВариант сверху\nДевять (ji)\nДесять (sh)\nСто (bӽi)\nТысяча (qiān)\nДесять тысяч\n(wn)\nДва, двое, пара\n(liӽng)\nПоловина (bn)\nВариант\nслева\nЦвет (s)\nБелый (bi)"]],"16":[["Начало урока","Сине-зеленый\n(qīng)\nАлый, рыжий (ch)\nЖелтый (hung)\nЧерный (hēi)"],["ФОНЕТИКА","ТРЕХСЛОЖНЫЕ СОЧЕТАНИЯ И АПОСТРОФ\nВ этом уроке мы рассмотрим многосложные сочетания, в частности трехсложные сочетания,\nсостоящие из слогов в одном тоне, и трехсложные сочетания с нулевым тоном.\nМелодическое изображение трехсложных сочетаний, состоящих из слогов в одном тоне, представлено на рис.16.1.\nРис. 16.1. Интонационный рисунок трехсложных сочетаний в одном тоне\n\n \nОбратите внимание на следующие моменты:\nДля трехсложных сочетаний, состоящих из трех слогов в первом тоне, характерно постепенное незначительное повышение высоты голоса. Последний слог имеет наибольшую длительность.\nДля трехсложных сочетаний, состоящих из трех слогов во втором тоне, наоборот, характерно\nпостепенное незначительное понижение высоты голоса.\nТо же касается и трех слогов в четвертом тоне.\nВ сочетаниях, состоящих из трех слогов в третьем тоне, если они не разделены интонационно,\nпервые два слога меняют свой тон на второй.\nВ предыдущих уроках мы узнали, что слог в нулевом тоне в зависимости от тона предыдущего\nслога, произносится на разной высоте. Однако в трехсложных сочетаниях, если слог в нулевом тоне стоит в середине, высота нулевого тона также зависит и от тона следующего за ним\nслога.\nЕсли слог в нулевом тоне оказывается меду слогами в первом/втором и четвертом тонах, то он\nпроизносится высоко, на уровне первого тона (рис.16.2\nРис. 16.2. Мелодический рисунок трехсложных сочетаний с нулевым тоном в середине (первый вариант)\nЕсли слог в нулевом тоне оказывается меду слогами в третьем и первом/втором тонах, то он\nпроизносится низко, на уровне третьего тона, третий тон при этом становится полутретьим\n(рис.16.3\nРис. 16.3. Мелодический рисунок трехсложных сочетаний с нулевым тоном в середине (второй вариант)\nЕсли после слога в нулевом тоне следует слог в нулевом тоне, то высота второго нулевого\nтона будет зависеть от высоты первого и меняться в соответствии с правилами изменения\nнулевого тона после тонированного.\nВ остальных случаях правила произнесения тонов в многосложных сочетаниях те же, что\nи в двусложных.\nОтносительно апострофа мы просто отметим, что его можно встретить только при алфавитной\nзаписи китайских слогов и означает он место слогораздела в тех случаях, когда после обычного\nслога следует слог с нулевой инициалью, например: wng’ān, jī’, p’ӽo, xī’n."],["УПРАЖНЕНИЯ НА ФОНЕТИКУ","CD 16.1.1\n1. Прочитайте, повторяя за диктором, слова, состоящие из трех слогов в первом тоне:\nxīngqītiān xīngqīyī xīngqīsān tuōlājī dōngguāzhōng kāfēibēi kāfēitīng xīzhuānggōng fāguāngqī\nCD 16.1.2\n2. Прочитайте, повторяя за диктором, слова, состоящие из трех слогов во втором тоне:\nYhyun Linhgu linhm hngtushng chnpmi lnyngyng chchngj minyngp\nCD 16.1.3\n3. Прочитайте вслед за диктором слова, состоящие из трех слогов в третьем тоне:\nzhӽnlӽnguӽn měnggy\ny xuӽnjfӽf xӿliӽnshuӿ shuxiětӿ pӽomӽbiӽo\nCD 16.1.4\n4. Прочитайте, повторяя за диктором, слова, состоящие из трех слогов в четвертом тоне:\njxfn hubnyu huwngjng duhunqun dulmin cjnpi yndnghu\nCD 16.1.5\n5. Прочитайте, повторяя за диктором, трехсложные словосочетания, где слог в нулевом тоне находится между слогами в первом/втором и четвертом тонах:\nkāibudng xubuhu chīle ru\nCD 16.1.6\n6. Прочитайте, повторяя за диктором, трехсложные словосочетания, где слог в нулевом тоне находится между слогами в третьем и первом/втором тонах:\nqӿq le chung liӽngge rn mӽile huā\nCD 16.1.7\n7. Прочитайте, повторяя за диктором, различные трехсложные словосочетания с нулевым тоном:\ngubuli zudewn zubukāi gubuq wӽnshanghӽo zӽoshanghӽo zěnmeyng shēngqilai zujinqu\npshangqu tuōxialai yuysi shūjizi\nCD 16.1.8\n8. Прочитайте, повторяя за диктором, различные многосложные словосочетания:\nbngōngsh ttchӽn tshūguӽn qchēzhn dtiězhn gnghgu yulӽnsh tӿychӽng yuyngch\nzhӽnlӽnhu bwguӽn Ālāby\ny lusīrn zhӽnlӽnhuchӽng\nCD 16.1.9А\n9. Прослушайте следующие китайские классические стихотворения, прочитайте их, повторяя за диктором, научитесь читать их с выражением и выучите любое понравившееся стихотворение\nнаизусть:\nYng\nВоспеваю гусей\nLu Bīnwng\nЛо Биньван\n, , ,\n\nГуси, гуси, гуси,\nQū xing xing tiān gē.\n\nВыгнув шею, поют песню небу.\n\n \nBi mo f l shuӿ,\n\nБелые перья плывут по зеленой воде,\nHng zhӽng bō qīng bō.\nКрасные лапки гребут в прозрачных волнах.\nCD 16.1.9Б\nDēng gun qu lu\nПоднимись на башню аистов\nWng Zhīhun\nВан Чжихуань\nBi r yī shān jn,\n\nБелое солнце катится по склонам гор,\nHung h r hӽi li.\n\nРека Хуанхэ течет, впадая в море.\nY qing qiān lӿ m,\n\nЕсли хочешь охватить взглядом всю панораму,\nGng shng y cng lu.\n\nПоднимись еще на один ярус.\nCD 16.1.9В\nChūn xiӽo\nВесенний рассвет\nMng Horn\nМэн Хаожань\nChūn min b ju xiӽo,\n\nВесенний сон не чувствует рассвета,\nCh ch wn t niӽo.\n\nПовсюду слышится пение птиц.\nY li fēng y\ny shēng,\n\nПронесся ночью шум дождя и ветра,\nHuā lu zhī duō shӽo?\n\nИ кто знает, сколько опалоцветов?\nCD 16.1.9Г\nNiӽo mng jin\nУщелье, где кричат птицы\nWng Wi\nВан Вэй\nRn xin guhuā lu,\nҎ\nГуляю я один на свободе, опадают гуйхуа цветы,\nY jng chūn shān kōng.\n\nНочь безмолвна, весенние горы пустынны.\nYu chū jīng shān niӽo,\n\nЛуна взошла и вспугнула горных птиц,\nSh mng chūn jin zhōng. Ё\nДолго раздаются в весеннем ущелье их голоса."],["УПРАЖНЕНИЯ НА ЛЕКСИКУ","CD 16.2.1\n1. Прочитайте следующие слова, повторяя за диктором:\nt bngōngsh (\n)— офис (заниматься служебными делами + комната);\nt\ntӿychӽng ()— стадион (спорт + поле, площадка);\nt\ntshūguӽn (к)— библиотека (рисунки\n+ книги + помещение, здание);\nt\nyuyngch ()— бассейн (плавать + водоем);\nt\nqchēzhn ()— автобусная остановка (автобус +\nс\nостановка);\nt zhӽnlӽnhu (Ӯ)— выставка (выставлять, показывать + собрание, встреча);\nt\ndtiězhn ()— станция метро (метро + остановка);\nt\nkāfēitīng ()— кафе (кофе + холл, гостиная);\nt\ngōnggng qchē (\n)— автобус (дословно: общественная паровая повозка).\nCD 16.2.2\n2. Прочитайте следующие слова и словосочетания, повторяя за диктором:\n\n \nt\nyge pngzi ()— одна бутылка;\nt\ny png shuӿ (\nӿ )— одна бутылка воды;\nt\nyge bēizi ()— один стакан;\nt\ny bēi ch ()— один стакан чая;\nt\nyge wӽnzi ()— одна пиала;\nt\ny wӽn tāng ()— одна пиала супа;\nt\nyge pnzi () — одна тарелка;\nt\ny pn ci ()— одна тарелка овощей;\nt\ny jīn ()— цзинь (полкилограмма);\nt y jīn pnggu ()— цзинь яблок;\nt\ny hng ()— строка;\nt y hng z ()— строка иероглифов;\nt y fēn zhōng ()— минута (времени);\nt\ny k zhōng ()— четверть (времени);\nt bn xiӽosh ()— полчаса;\nt bnge xiӽosh ()— полчаса;\nt\ny xiӽosh ()— один час;\nt yge xiӽosh ()— один час;\nt\ny tiān ()— один день;\nt\ny nin ()— один год;\nt\nyīyu (\n)— январь;\nt\nyge yu (\n)— один месяц;\nt\nryu (Ѡ\n)— февраль;\nt\nliӽngge yu (\n)— два месяца;\nt xīngqīyī ()— понедельник;\nt\nyge xīngqī ()— одна неделя;\nt\nxīngqīr (Ѡ)— вторник;\nt liӽngge xīngqī ()— две недели.\nCD 16.2.3\n3. Прочитайте следующие предложения, повторяя за диктором:\nXinzi jӿ diӽn zhōng? — Xinzi liӽng diӽn (zhōng). (—())— Который сейчас час? — Сейчас 2 часа.\nXinzi jӿ diӽn zhōng? — Xinzi sān diӽn w\nw fēn. (њ— Ѩ)— Который сейчас час? — Сейчас 3 часа 5 минут.\nXinzi jӿ diӽn zhōng? — Xinzi bā diӽn y k. (—\n)— Который\nсейчас час? — Сейчас 8 часов 15 минут (одна четверть).\nXinzi jӿ diӽn le? — Xinzi w\nw diӽn bn. (њ— Ѩ)— Который сейчас\nчас? — Сейчас полшестого (пять часов с половиной).\nXinzi jӿ diӽn le? — Qī diӽn ch sh fēn. (њ— )— Который сейчас\nчас? — Без 10 минут 7.\nJīntiān xīngqī jӿ? — Jīntiān xīngqīw\nw . (Ҟ— ҞѨ)— Какой сегодня день\nнедели? — Сегодня пятница.\nJīntiān jӿ yu jӿ ho? — Jīntiān w yu rshsān ho. (Ҟ\n— ҞѨ\nѠ\n)— Какой сегодня день? — Сегодня 23 мая.\nNӿ de shēngr jӿ yu jӿ ho? — W de shēngr sān yu shw\nw ho. (\n\nѨ\ng\nj y\nj\n)— Когда у тебя день рождения? — Мой день рождения 15 марта.\nNӿ sh nӽ y nin chūshēng de? — W sh 1982 nin chūshēng de. (—\n\ny\n)— В каком году ты родился? — Я родился в 1982 году.\nMngtiān zӽoshang nӿ gn shnme? — W q tӿychӽng pӽob. (ҔМ—\n\ng\n)— Что ты делаешь завтра утром? — Я пойду бегать на стадион.\nXiw nӿ gn shnme? — W gēn w nn pngyou yqӿ q kāfēitīng hē kāfēi. (Ҕ\nМ—\n\ng\ng\np\ngy\np\ng\n)— Что делаешь после полудня? — Я с другом пойду в кафе пить кофе.\n\n \nXīngqīw\nw nӿ dӽsuan gn shnme? — Xīngqīw\nw w dӽsun q gēn pngyu jinmin. (Ѩ\nҔМ\ngq\ngq\n— Ѩ\n\ng\ngq\ng\ngq\n) — Что ты собираешься делать в пятницу? — В пятницу я собираюсь пойти встретиться с друзьями.\nXīngqīr wӽnshng nӿ dӽsuan gn shnme? — Xīngqīr wӽnshng w dӽsuan xiūxi. (\n\nҔМ\ngq\ngq\nӥ\ng\ngq\ng\ngq\n)— Что ты собираешься делать в воскресенье\nвечером? — В воскресенье вечером я собираюсь отдыхать.\nMngnin nӿ dӽsuan gn shnme? — W dӽsuan q Zhōnggu lxng. (ҔМ—\nЁ\ng\ng\n)— Что ты собираешься делать в следующем году? — Я собираюсь поехать\nпутешествовать в Китай.\nZutiān nӿ gnle shnme? — Zutiān w gēn māma q lӽolao jiā zuk le. (њҔМ—\n\nњ\ng\ng\n)— Что ты делал вчера? — Вчера я с мамой ходил в гости\nк бабушке.\nCD 16.2.4\n4. Прослушайте, прочитайте, повторяя за диктором, переведите и выучите следующий диалог:\nZh nӿ shēngr kuil!\nӿ\n(Ф)— Поздравляю тебя с днем рождения!\n— Jīntiān xīngqī jӿ?\nҞ\n— Jīntiān xīngqīli.\nҞ\n\n— Jīntiān jӿ yu jӿ ho?\nҞ\n\n— Jīntiān w\nw yu shqī ho.\nҞѨ\n\n— W wngjle, jīntiān sh Wng Huā de shēngr.\nњҞ\n— Tā duōdle?\nњ\n— Tā rshqī sule.\nѠњ\n— N tā sh yījibāli nin chūshēng de, du ma?\nб\n\n— Du. Wmen q mӽi shēngr lӿw, hӽo ma?\nӀф\n— Hӽo.\n\n— Wng Huā, zh nӿ shēngr kuil! Zh sh wmen\nsng gěi nӿ de lӿw.\nФ\nӀ\n— Duōxile! Jīntiān wӽnshng nӿmen li wjiā\nzuk!\nњҞ\nӀ\n\nВ этом диалоге используются новые слова: wngj ()— забывать; lӿl w\nӿ\n)— подарок;\nsng (\ng )— дарить, провожать; Zh nӿ shēngr kuil!\nӿ\n(Ф\n)— Поздравляю тебя\nс днем рождения!"],["Комментарий","1. Употребление существительных со счетными словами и без.\nВ китайском языке существует небольшое количество существительных, которые всегда употребляются с числительными без счетных слов:\ny hng ()— одна строка; y y ()— одна страница; y k ()— один урок;\ny fēn ()— одна минута (на часах); y k ()— одна четверть часа (на часах);\ny diӽn (zhōng) (())— один час (на часах).\n\n \nОднако слова полчаса и час как отрезки времени могут употребляться как со счетным словом,\nс\nтак и без него:\nbn(ge) xiӽosh (())— полчаса; y(ge) xiӽosh ()— один час.\nСлова tiān ()— день и nin ()— год всегда употребляются без счетных слов:\ny tiān ()— один день; y nin ()— один год.\nОднако yīyu (\n\n) означает январь, в то время как один месяц будет читаться\nц\nyge yu (\n\nСлово xīngqī ()— неделя употребляют только со счетным словом:\nя\nyge xīngqī ().\n2. Единицы измерения в качестве счетных слов.\nВ качестве счетных слов в китайском языке также могут выступать слова, являющиеся единицами\nизмерения, например:\ny jīn pnggu ()— цзинь яблок; y hng z ()— одна строка иероглифов;\ny fēn zhōng ()— одна минута; y k zhōng ()— четверть часа (отрезки времени).\nТакже в роли счетных слов могут выступать существительные, которые представляют какую-либо\nмеру, емкость, но могут употребляться самостоятельно с собственным счетным словом:\nyge pngzi ()— одна бутылка; y png shuӿ ()— одна бутылка воды.\n3. Обозначение времени в китайском языке.\n1) Время на часах:\nli diӽn (zhōng) (\n())— шесть часов; sān diӽn w\nw fēf n (Ѩ)— три часа пять минут;\nliӽng diӽn y k ()— два часа с четвертью;\nliӽng diӽn shw\nw fēn (Ѩ)— два часа пятнадцать минут;\nw\nw diӽn bn (Ѩ)— пять с половиной часов;\nw\nw diӽn sānsh fēn (Ѩ)— пять часов тридцать минут;\nsh’r diӽn ch sh fēn (Ѡ)— без десяти минут двенадцать;\nshyī diӽn w\nw sh fēn (Ѩ)— одиннадцать часов пятьдесят минут.\n2) Отрезки времени:\ny fēn zhōng ()— одна минута (на часах просто… y fēn (…));\ny k zhōng ()— одна четверть часа (на часах просто… y k (…));\nbn(ge) xiӽosh (())— полчаса (на часах просто… bn (…));\ny(ge) xiӽosh ()— один час (на часах: y diӽn (zhōng) ()).\n3) Части суток:\nzӽoshang ()— раннее утро (с 4:00 до 8:00); shngw\nw (\n)— позднее утро (с 8:00 до 12:00);\nzhōngw\nw (Ё)— полдень; xiw\nw ()— день (примерно с 12:00 до 16:00);\nbitiān ()— день (обычно говоря о погоде); wӽnshang (\n)— вечер; yli ()— ночь.\n4) Дни:\nqintiān (\n)— позавчера; zutiān ()— вчера; jīntiān (Ҟ)— сегодня;\nmngtiān ()— завтра; hutiān (\n)— послезавтра.\n\n \n5) Недели:\nxīngq yī () / lӿl bi yī (\nӿ\n)— понедельник;\nxīngq’r (Ѡ) / lӿl bi r (\nӿ\nѠ)— вторник;\nxīngqsān () / lӿl bi sān (\nӿ\n)— среда;\nxīngqs () / lӿl bi s (\nӿ\n)— четверг;\nxīngqw\nw (\nѨ) / lӿl bi w\nӿ\n\nw (\nѨ)— пятница;\nxīngqli (\n) / lӿl bili (\nӿ\n\n)— суббота;\nxīngqīr () / lӿl bitiān (\nӿ\n)— воскресенье;\nshngge xīngq ()— прошлая неделя; zhge xīngq ()— эта неделя;\nxige xīngq ()— следующая неделя.\n6) Месяцы:\ny yu (\n)— январь; r yu (Ѡ\n)— февраль; sān yu (\n)— март;\ns yu (\n)— апрель; w\nw yu (Ѩ\n)— май; li yu (\n)— июнь;\nq yu (\n)— июль; b yu (\n)— август; ji yu (б\n)— сентябрь;\nsh yu (\n)— октябрь; shyī yu (\n)— ноябрь; sh’r yu (Ѡ\n)— декабрь;\nshngge yu (\n)— прошлый месяц; zhge yu (\n)— этот месяц;\nxige yu (\n)— следующий месяц.\n7) Годы в китайском языке принято произносить по цифрам:\nyī ji bā s nin (б\n)— 1984 год; yī ji ji lng nin (бб)— 1990 год;\nr lng lng li nin (Ѡ\n)— 2006 год; r lng yī yī nin (Ѡ)— 2011 год;\nqin nin (\n)— позапрошлый год; q nin ()— прошлый (прошедший) год;\njīn nin (Ҟ)— нынешний год; mng nin ()— следующий год;\nhu nin (\n)— год после следующего.\n8) Даты в Китае принято обозначать в непривычном для нас порядке «год — месяц — число»:\nYī ji bā qī nin r yu ji ho (б\nѠ\nб)— 9 февраля 1987 года;\nr lng yī r nin bā yu rshli ho (ѠѠ\nѠ\n)— 26 августа 2012 года.\n4. Основной порядок слов в распространенном китайском предложении.\nВ предыдущих уроках мы изучали порядок слов в простых китайских предложениях, который\nстроится по схеме «подлежащее— сказуемое— дополнение» (П — С — Д), что в целом соответствует порядку слов в простых предложениях русского языка. Порядок слов в китайском распространенном предложении значительно отличается от русского, но зато все члены китайского\nпредложения, как правило, занимают четкое положение, чего нет в русском языке.\nОбстоятельство времени может занимать разное положение в предложении в зависимости\nот того, на какой вопрос оно отвечает. Чаще всего обстоятельство времени отвечает на вопрос\nв какое время?, когда?, в этом случае оно обычно ставится в начале предложения, например:\nJīntiān xi y.— Сегодня идет дождь, Mngtiān nӿ q n\nӿ\nӽli? — Куда ты завтра пойдешь? Также\nиногда возможно его положение между подлежащим и сказуемым.\nМестонахождение обстоятельства места в предложении на китайском языке зависит от того, чем\nвыражено сказуемое. Если сказуемое выражено глаголом za, то обстоятельство всегда ставится\n\n \nпосле этого глагола: Tā zi Běijīng.— Он (находится) в Пекине. В предложениях с глагольным сказуемым za также может быть предлогом в: W zi Wiguy dxu xux.— Я учусь в Университете иностранных языков. В любом случае конструкции с za всегда ставятся после подлежащего.\nОбстоятельство цели, отвечающее на вопросы для какой цели?, зачем?, в предложении всегда ставится в конце, например: Zutiān w qle lӽolao jiā zuk.— Вчера я ходил в гости к бабушке.\nКонструкции типа я с…, мы вместе с… всегда употребляются слитно, и их нельзя разделять:\nZutiān w gēn māma qle lӽolao jiā zuk.— Вчера я с мамой ходил в гости к бабушке."],["ЗАДАНИЯ","CD 16.3.1\n1. Слушая звукозапись, поставьте в нужном месте апостроф:\nwӽnān, jī, pӽo, xīn, dōngn, gāoӽi, cӽnn, chu, dun, liӽngn\nCD 16.3.2\n2. Слушая звукозапись, определите и поставьте правильные тоны в следующих словах:\nLianheguo xingqisan yundonghui Mengguyu guobulai zoujinqu guobuqu zenmeyang bangongshi\nbowuguan ditiezhan yuelanshi youyongchi tushuguan youyisi eluosiren\nCD 16.3.3\n3. Напишите диктант со слов диктора:\n__________________________________________________________________________________\n4. Переведите c русского на китайский и запишите с помощью пиньинь:\nСейчас три часа. ____________________________________________________________________\nСейчас два часа пять минут. __________________________________________________________\nСейчас семь часов пятнадцать минут. _________________________________________________\nСейчас полшестого (пять часов с половиной). ___________________________________________\n__________________________________________________________________________________\nБез десяти минут шесть. _____________________________________________________________\nСегодня среда. _____________________________________________________________________\nСегодня 16 сентября. ________________________________________________________________\nМой день рождения 3 февраля. _______________________________________________________\nЯ родился в 1989 году. _______________________________________________________________\nЧто ты делаешь завтра после полудня?— Я пойду читать в библиотеку.\n__________________________________________________________________________________\nЧто ты делаешь в пятницу утром?— Я пойду плавать в бассейн.\n__________________________________________________________________________________\nЧто ты собираешься делать завтра?— Я собираюсь с друзьями посетить выставку.\n__________________________________________________________________________________\nЧто ты собираешься делать в следующем году?— Я собираюсь поехать учиться в Китай.\n__________________________________________________________________________________"],["ИЕРОГЛИФИКА","В этом уроке мы рассмотрим графемы и сложные иероглифы (табл.16.1).\nТаблица 16.1. Графемы и сложные иероглифы\nСимволы\nТранскрипция\nЗначение\n\nxiān\nсначала\n\nn\nто\n\n-de\nсуффикс\nӶ (ӶѾ)\nshn (shnme)\nчто\n\nzh\nэто\n\ntā\nон\ntā\nона\n\njin\nединица, штука\n\ntio\nполоска\n\nbo\nгазета\n\nti\nподставка\n\njiā\nдом, семья\n\nxu\nучить\n\nzu\nместо\nСимволы\nТранскрипция\nЗначение\n\nwi\nместо, персона\n\nbӿ\nручка, пишущий\nпредмет\nma\nвопросительная\nчастица\n\nshu\nкто\n\n-men\nсуффикс множественного числа\n\nzhӿ\nбумага\n\njī\nмашина,\nмеханизм\n\nq\nпар\n\nzhāng\nплоскость,\nфамилия Чжан\n\nbӽ\nрукоятка,\nдержать в руке\n\nfn\nэкземпляр\n\nling\nпара колес\n\nkui\nкусок\n\nk\nурок, учебный\nГРАФЕМЫ\n1. Сначала (xiān).\nИногда этот знак считают сложным иероглифом, но мы здесь будем рассматривать его как\nграфему, поскольку он не раскладывается на более простые элементы, а также часто встречается в качестве компонента. Верхний элемент графемы изображал отпечаток стопы, а нижний ()— шагающего человека, что вместе означало «идти по следам того, кто пришел первым». В современном языке графема употребляется в значениях сначала, изначальный.\nИзменение знака\nПримеры употребления\nПорядок написания черт\n2. То (n).\nЭтот знак иногда считают сложным иероглифом, но мы здесь будем рассматривать его\nкак графему, поскольку он не раскладывается на более простые элементы, а также часто\nвстречается в качестве компонента.\n\n \nИзначально он состоял из элементов мех и\nх\nгород и, по всей видимости, означал название\nкакого-то города. Позднее им стали обозначать абстрактное понятие тот, которое имело такое же чтение. В современном китайском эта графема употребляется самостоятельно в значении то.\nИзменение знака\nПримеры употребления\nПорядок написания черт\nНЕАССОЦИАТИВНЫЕ ИЕРОГЛИФЫ\n1. Цель, реальный, суффикс (-de).\n\nСмысл этого иероглифа сейчас не вполне понятен, возможно, элемент был фонетиком.\nСостав: белый (bi): + ложка (sho): .\nПримеры употребления: Ҫ(tāde)— его; (tāde)— ее.\n2. Что (shn).\nӶ\nСмысл этого иероглифа сейчас не совсем понятен.\nСостав: человек (rn): ӱ+ десять (sh): .\nПример употребления: ҔМ (shnme)— что.\n3. Это (zh).\n\nВ полной форме этот иероглиф изначально означал идти на встречу, однако позднее им\nстали означать абстрактное понятие это.\nПолная форма написания: .\nСостав: письменный знак (wn): + быстро идти: .\nПример употребления: (zhli)— здесь.\n4. Он (tā).\n\nЛевый элемент этого иероглифа указывает на человека или мужской пол, а правый элемент, возможно, был раньше фонетиком.\nСостав: человек (rn): ӱ+ тоже (yě): ҕ.\nПример употребления: Ҫ(Tā sh xusheng.)— Он ученик.\n5. Она (tā).\nЛевый элемент этого иероглифа указывает на женский пол, а правый элемент, возможно,\nбыл раньше фонетиком.\nСостав: женщина (n):\n+ тоже (yě): ҕ.\nПример употребления: г(Tā yě sh xusheng.)— Она тоже ученица.\n6. Единица, штука (jin).\n\nСмысл этого иероглифа сейчас не совсем понятен.\nСостав: человек (rn): ӱ+ корова (ni): .\nПримеры употребления: ӊ(y jin dyī)— одно пальто; ӊ (y jin\nmoyī)— один свитер.\n\n \n7. Полоска (tio).\n\nИзначально этот иероглиф означал веточки на дереве. В современном написании верхний элемент стал писаться как (следовать). Вариант написания: .\nСостав: следовать: + дерево (m): .\nПример употребления: (y ti
