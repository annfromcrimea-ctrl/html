<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixar 3D Хаб · Интерактивные файлы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* —————————————————— СТИЛИ (можно не трогать) —————————————————— */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #c8e6c9 0%, #a5d6a7 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Quicksand', sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .bg-deco { position: fixed; pointer-events: none; z-index: 0; }
    .sun {
      top: 20px; right: 30px;
      width: 110px; height: 110px;
      background: radial-gradient(circle at 30% 30%, #fff7b0, #fdd835);
      border-radius: 50%;
      box-shadow: 0 20px 40px rgba(253,216,53,0.5), 0 0 0 12px rgba(255,235,59,0.3);
      animation: floatSun 6s ease-in-out infinite;
    }
    .sun::after { content: '☀️'; font-size: 60px; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1)); }
    @keyframes floatSun { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-18px) scale(1.03); } }
    .leaf {
      position: fixed;
      width: 60px; height: 60px;
      background: radial-gradient(circle at 40% 30%, #81c784, #2e7d32);
      border-radius: 80% 0 80% 0;
      transform: rotate(-20deg);
      box-shadow: 0 12px 20px rgba(46,125,50,0.3), inset -4px -6px 8px rgba(0,0,0,0.1);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }
    .leaf::after { content: '🌱'; font-size: 28px; position: absolute; bottom: -6px; right: -6px; transform: rotate(20deg); filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1)); }
    .leaf1 { top: 12%; left: 5%; width: 80px; height: 80px; transform: rotate(30deg); }
    .leaf2 { bottom: 8%; right: 6%; width: 90px; height: 90px; transform: rotate(160deg); }
    .leaf3 { top: 55%; left: 3%; width: 50px; height: 50px; transform: rotate(70deg); }
    .leaf4 { bottom: 20%; left: 18%; width: 70px; height: 70px; transform: rotate(-30deg); }
    .leaf5 { top: 30%; right: 4%; width: 55px; height: 55px; transform: rotate(100deg); }

    .hub-container {
      position: relative; z-index: 10;
      max-width: 1200px; width: 100%;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
      border-radius: 80px 80px 60px 60px;
      padding: 40px 35px 50px;
      box-shadow: 0 30px 50px rgba(27,94,32,0.25), inset 0 -6px 0 rgba(255,255,255,0.6), inset 0 6px 20px rgba(255,255,240,0.7);
      border: 1px solid rgba(255,255,240,0.5);
    }
    .hub-header {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 40px; flex-wrap: wrap;
    }
    .hub-header h1 {
      font-size: 3.2rem; font-weight: 700;
      color: #1e3a1e;
      text-shadow: 0 6px 0 #8bc34a, 0 12px 20px rgba(0,0,0,0.1);
      letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 10px;
    }
    .hub-header h1 span {
      background: #2e7d32; color: #f1f8e9;
      font-size: 1.8rem; padding: 0 20px;
      border-radius: 60px;
      box-shadow: inset 0 -4px 0 #1b5e20, 0 6px 0 #33691e;
      transform: rotate(-2deg);
    }
    .hub-header .sub {
      margin-left: auto;
      background: #f1f8e9cc; padding: 10px 22px;
      border-radius: 60px; font-weight: 600; color: #1e3a1e;
      box-shadow: 0 6px 0 #8bc34a;
      backdrop-filter: blur(4px);
      border: 1px solid #dcedc8;
      font-size: 1.1rem;
    }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 30px;
    }
    .file-card {
      background: #e8f5e9;
      border-radius: 40px 40px 40px 12px;
      padding: 24px 18px 20px;
      box-shadow: 0 20px 0 #2e7d32, 0 25px 30px -8px rgba(27,94,32,0.4),
                  inset 0 -6px 0 #81c784, inset 0 4px 12px #f1f8e9;
      transition: all 0.12s linear;
      border: 1px solid #c8e6c9;
      display: flex; flex-direction: column;
      position: relative;
      transform: rotate(0.5deg);
    }
    .file-card:nth-child(2n) { transform: rotate(-0.8deg) translateY(4px); }
    .file-card:nth-child(3n) { transform: rotate(1.2deg) translateY(-3px); }
    .file-card:hover {
      transform: scale(1.02) rotate(0deg) translateY(-8px);
      box-shadow: 0 24px 0 #2e7d32, 0 32px 40px -10px #1b5e20;
    }
    .file-icon {
      font-size: 3.6rem; line-height: 1; margin-bottom: 8px;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
      background: #dcedc8;
      width: 72px; height: 72px;
      border-radius: 30px 8px 30px 8px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 -6px 0 #81c784, 0 8px 0 #33691e;
      transform: rotate(-2deg);
    }
    .file-name {
      font-size: 1.35rem; font-weight: 700; color: #1e3a1e;
      margin: 14px 0 6px; padding: 6px 10px;
      border-radius: 30px;
      background: rgba(255,255,240,0.5);
      border: 2px dashed #81c784;
      transition: 0.2s;
      cursor: text;
      word-break: break-word;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }
    .file-name:focus {
      outline: 2px solid #4caf50;
      background: #ffffffd0;
      border-color: #2e7d32;
      box-shadow: 0 0 0 6px #a5d6a7aa;
    }
    .file-meta {
      display: flex; justify-content: space-between;
      font-size: 0.8rem; color: #2e5e2e; font-weight: 600;
      padding: 0 6px; margin-top: 6px;
      background: #dcedc8aa; border-radius: 40px;
      padding: 6px 14px;
      backdrop-filter: blur(2px);
    }
    .file-action {
      margin-top: 18px;
      background: #fdd835;
      border: none;
      padding: 14px 10px;
      border-radius: 60px;
      font-weight: 700; font-size: 1.1rem;
      color: #1e3a1e;
      box-shadow: 0 10px 0 #f9a825, inset 0 -2px 0 #f57f17;
      transition: all 0.06s linear;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      letter-spacing: 0.3px;
      border: 1px solid #fff9c4;
      text-shadow: 0 1px 0 #fff9c4;
      transform: scale(1) rotate(0.5deg);
    }
    .file-action:active { transform: translateY(6px) scale(0.97); box-shadow: 0 4px 0 #f9a825; }
    .file-action:hover { background: #ffca28; box-shadow: 0 10px 0 #f9a825, 0 6px 20px #fdd835aa; }
    .hub-footer {
      margin-top: 40px;
      display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;
      color: #1e3a1e; font-weight: 600;
      background: #dcedc8aa; padding: 18px 28px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid #b9dbb6;
    }
    .hub-footer span {
      background: #2e7d32; color: #f1f8e9;
      padding: 0 18px; border-radius: 60px;
      font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px;
      box-shadow: inset 0 -3px 0 #1b5e20;
    }
    @media (max-width:700px) {
      .hub-container { padding: 25px 18px; border-radius: 50px; }
      .hub-header h1 { font-size: 2.4rem; flex-wrap: wrap; }
      .hub-header .sub { margin-left: 0; width: 100%; text-align: center; }
      .file-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width:480px) {
      .file-grid { grid-template-columns: 1fr; }
      .leaf { display: none; }
      .sun { width: 70px; height: 70px; top: 8px; right: 8px; }
      .sun::after { font-size: 36px; }
    }
  </style>
</head>
<body>

<!-- декорации -->
<div class="bg-deco sun"></div>
<div class="bg-deco leaf leaf1"></div>
<div class="bg-deco leaf leaf2"></div>
<div class="bg-deco leaf leaf3"></div>
<div class="bg-deco leaf leaf4"></div>
<div class="bg-deco leaf leaf5"></div>

<div class="hub-container">
  <div class="hub-header">
    <h1>🌿 Хаб-карусель <span>Pixar</span></h1>
    <div class="sub">🎯 3D-файлы · редактируй в коде</div>
  </div>

  <div class="file-grid" id="fileGrid"></div>

  <div class="hub-footer">
    <span>✏️ меняй данные в массиве filesData</span>
    <span>🔘 кнопки-заглушки</span>
    <span>🍃 добавляй / удаляй объекты</span>
  </div>
</div>

<script>
  // ===================================================================
  // ===== ДАННЫЕ ФАЙЛОВ (меняйте здесь) ================================
  // ===================================================================
  // Чтобы добавить новую карточку — скопируйте объект { ... } и вставьте
  // в массив. Чтобы удалить — удалите соответствующий объект.
  // Поля:
  //   id    – уникальный номер (можно любой, главное чтобы отличался)
  //   icon  – Emoji или текст (будет показан крупно)
  //   name  – название файла (отображается в карточке)
  //   meta  – дополнительная информация (мелкий текст)
  // ===================================================================
  const filesData = [
    { id: 1, icon: '📘', name: 'Английский после лета', meta: 'Spotlight · 5 класс' },
    { id: 2, icon: '🎒', name: 'Словарь за 5 минут', meta: 'летний воркбук' },
    { id: 3, icon: '🏫', name: 'Грамматика 6 класс', meta: 'повторение' },
    { id: 4, icon: '🐶', name: 'Dog — собака!', meta: 'заметки на прогулке' },
    { id: 5, icon: '📝', name: 'Топик "My Day"', meta: 'устная речь' },
    { id: 6, icon: '📚', name: 'Книга для чтения', meta: 'Pixar style' },
    // ↓↓↓ ВОТ ТАК ДОБАВИТЬ НОВУЮ КАРТОЧКУ (раскомментируйте) ↓↓↓
    // { id: 7, icon: '🧩', name: 'Интерактив 3D', meta: 'новая игра' },
  ];

  // ===================================================================
  // ==== РЕНДЕРИНГ (не трогайте, если не уверены) =====================
  // ===================================================================
  const grid = document.getElementById('fileGrid');

  function renderCards(files) {
    grid.innerHTML = '';
    files.forEach(file => {
      const card = document.createElement('div');
      card.className = 'file-card';

      // Иконка
      const iconDiv = document.createElement('div');
      iconDiv.className = 'file-icon';
      iconDiv.textContent = file.icon || '📄';

      // Название (теперь оно НЕ редактируемое на странице,
      // чтобы всё менялось только в коде, но можно оставить
      // для удобства — закомментируйте contentEditable, если не нужно)
      const nameDiv = document.createElement('div');
      nameDiv.className = 'file-name';
      // nameDiv.contentEditable = true;  // раскомментируйте, если хотите редактировать на странице
      nameDiv.textContent = file.name || 'Без названия';

      // Мета-информация
      const metaDiv = document.createElement('div');
      metaDiv.className = 'file-meta';
      metaDiv.innerHTML = `<span>📅 ${file.meta || 'обновлён'}</span><span>📎 ${file.id}</span>`;

      // Кнопка-заглушка (действие)
      const actionBtn = document.createElement('button');
      actionBtn.className = 'file-action';
      actionBtn.innerHTML = `🔮 Открыть · ${file.id}`;
      // ===== ЗДЕСЬ МЕНЯЙТЕ ПОВЕДЕНИЕ КНОПКИ =====
      actionBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        const fileName = nameDiv.textContent.trim() || 'файл';
        alert(`✨ Заглушка: открыть «${fileName}»\n(замените на реальное действие)`);
        // Например, можно перенаправить на страницу:
        // window.location.href = `/files/${file.id}`;
      });

      card.appendChild(iconDiv);
      card.appendChild(nameDiv);
      card.appendChild(metaDiv);
      card.appendChild(actionBtn);
      grid.appendChild(card);
    });
  }

  // Первоначальная отрисовка
  renderCards(filesData);

  // При желании можно повесить обработчик на двойной клик по заголовку,
  // чтобы перезагрузить данные из массива (но для простоты перезагружайте страницу)
  console.log('🌟 Pixar 3D Хаб готов! Редактируйте массив filesData в коде.');
</script>

<!-- подсказка -->
<div style="position: fixed; bottom: 10px; left: 10px; z-index: 99; background: #dcedc8dd; padding: 6px 16px; border-radius: 40px; backdrop-filter: blur(6px); font-weight: 600; color: #1e3a1e; font-size: 0.8rem; border: 1px solid #a5d6a7; pointer-events: none;">
  ✏️ меняй данные в массиве filesData
</div>
</body>
</html>
