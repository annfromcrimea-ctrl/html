"Хуан, 31 год, женат. Хуан работает страховым агентом в Бильбао и является покупателем с рациональным поведением. «Я работаю в торговле, и имидж очень важен». При покупке Хуан покупает немного, только то, что нужно. Он пользуется распродажами. «Если мне нужны джинсы, я могу обойти пять магазинов, пока не найду то, что хочу».",
"Ана, 39 лет, замужем. «Мне очень нравится ходить по магазинам, но зависит от того, с кем. Каждый раз, когда я пытаюсь это сделать с детьми, это настоящий кошмар. Также не люблю ходить с мужем, потому что он всегда спешит и всё ему кажется дороговатым. Предпочитаю ходить с подругами или одна».",
"Альберто, 59 лет, женат. «Честно говоря, я не очень люблю ходить по магазинам. Обычно делаю покупки весной и осенью». Альберто предпочитает ходить в магазины, где его знают. Он прислушивается к советам жены и редко ходит за покупками один. Бренды, уверяет он, его совсем не интересуют, и обращает внимание прежде всего на качество.",
"а) 1. Каждую неделю. 2. Довольно много. 3. Компульсивным; потому что обожает моду. 4. Рациональным; потому что покупает только необходимое. 5. Когда есть распродажи. 6. Да; он готов обойти пять магазинов. 7. С детьми — кошмар, с мужем — потому что он спешит и всё кажется дорогим. 8. Не слишком. 9. Весной и осенью. 10. Качество."],

"L12|Ej19":[
"Кулинарный рецепт: картофельные шарики с сыром",
"Ингредиенты: 1 кг картофеля, 300 г тёртого сыра, 10 столовых ложек масла, 1 стакан муки, соль, лавровый лист. Сложность: минимальная.",
"Сначала чистим картофель, потом моем его и ставим вариться в кастрюле с большим количеством воды, солью и двумя лавровыми листьями. Когда картофель сварится, сливаем воду, разминаем до получения пюре и даём остыть.",
"Когда картофельное пюре тёплое, делаем шарики и внутрь кладём немного тёртого сыра. Наконец, наливаем масло на сковороду, обваливаем шарики в муке и жарим в большом количестве масла. Когда они подрумянятся, выкладываем их на тарелку с бумажным полотенцем — и готово! Вот у нас и есть картофельные шарики с сыром — идеальный гарнир к мясу или рыбе."],

"L13|Ej13":[
"1) Бронирование отеля. – Отель «Росмари». Чем могу служить? – Добрый день. У вас будут свободные номера на следующие выходные? – Да, сеньор. Желаете забронировать? – Да, нас будет трое: двое взрослых и ребёнок. – Двухместный номер с дополнительной кроватью? – Нет, двухместный номер и одноместный. – Вы хотите двухместный номер с двумя кроватями или с двуспальной? – Не важно. – На сколько ночей? – Мы приедем в следующую пятницу, а в воскресенье уже уедем. – На чьё имя сделать бронь? – На имя Владимира Серова. Сколько это будет стоить? – Два номера на две ночи стоят триста семьдесят евро. – Завтрак включён? – Разумеется, сеньор. Бронирую? – Да. Спасибо.",
"2) На ресепшене. – Здравствуйте, добрый день. Меня зовут Хосе. Чем могу помочь? – Добрый день. У меня забронирован номер на имя Аны Иглесиас Марин. – Сейчас посмотрим... Да, добро пожаловать, сеньора! Сколько ночей вы пробудете в отеле? – Неделю. Уеду в следующий четверг. – Отлично. Дайте мне ваш паспорт, пожалуйста? – Да, конечно. – Вы хотите двухместный или одноместный номер? – Одноместный, пожалуйста. Завтрак включён? – Нет. Завтрак подают в ресторане на первом этаже с семи до одиннадцати. Стоит десять евро. Если хотите, мы подадим завтрак в ваш номер. – Нет, спасибо. – Вот ваш ключ, ваш номер 515 с балконом, выходящим в сад. – Он на пятом этаже? Есть лифт? – Да, номер на пятом этаже. Лифт слева, рядом с лестницей. Портье вас проводит и отнесёт ваш чемодан. Если возникнет проблема, нужно набрать ноль-один-два. – Спасибо, Хосе. До свидания.",
"3) Звоним на ресепшен. – Алло. Ресепшен. – Здравствуйте. У нас проблемы с кондиционером. Кажется, он не работает. – Какой у вас номер? – Триста тринадцатый. – Сейчас придёт техник. – Кроме того, мы не можем закрыть сейф и не можем открыть дверь на балкон. – Минуту. Я запишу. – И ещё вопрос: как подключиться к интернету? – Пароль — это название отеля со строчной буквы и номер комнаты. – Большое спасибо. Подождём техника. – Не за что. К вашим услугам.",
"а) 1) Владимир Серов позвонил в отель, чтобы забронировать два номера на двоих взрослых и ребёнка: одноместный и двухместный на две ночи. Они хотели приехать в пятницу и уехать в воскресенье. Завтрак был включён в цену. Владимиру нужно было заплатить 370 €. 2) У клиентки был забронирован номер на имя Аны Иглесиас Марин. Она сказала, что пробудет в отеле неделю и уедет в следующий четверг. Ана предпочла одноместный номер. Портье предложил ей номер на пятом этаже с балконом, выходящим в сад. Завтрак не входил, стоил 10 евро и подавался в ресторане на первом этаже с семи до одиннадцати. Если возникала проблема, ей нужно было набрать 012. Портье её проводил и отнёс чемодан. 3) Клиенты позвонили на ресепшен, потому что кондиционер не работал, и к тому же не могли закрыть сейф и открыть дверь на балкон. Клиенты хотели подключиться к интернету, но не знали пароля. Портье объяснил, что пароль — это название отеля со строчной буквы и номер комнаты."],

"L13|Ej15":[
"Аренда машины. – Я хотел бы взять машину напрокат. – С водителем? – Нет, я сам водитель. – У вас есть предварительная бронь? – Нет. – Какую машину вы хотите арендовать? – Экономичную, с автоматической коробкой. – Ваш паспорт и водительские права, пожалуйста... Документы в порядке. – Какой тариф? – 60 евро в день. – Что включает стоимость аренды? – Неограниченный километраж, страховку ответственности перед третьими лицами (без франшизы), помощь на дороге. Нужно ли вам что-то ещё, например, детские кресла, вешалки для машины или GPS? – Нет, спасибо. Я могу вернуть машину в любое время? – Да, никаких проблем. Возврат производится круглосуточно. Но перед возвратом машины нужно наполнить бак. Здесь рядом есть заправка."],

"L13|Ej17":[
"Путешествуя на машине по Европе. Дядя Рикардо. – Как прошла поездка по Европе, Луисита? Луиса. – Это была чудесная поездка, дорогой! У нас с Пабло столько незабываемых впечатлений! Дядя Рикардо. – Вы впервые путешествовали на арендованной машине, верно? Луиса. – Да, мы проехали две тысячи километров за пять дней. Дядя Рикардо. – У вас не было проблем с машиной? Луиса. – С машиной никаких проблем. А вот с водителем — да. Нас оштрафовали пять раз за нарушение правил дорожного движения!",
"Дядя Рикардо. – Не могу поверить! Твой муж такой осторожный. Он всегда соблюдает правила и к тому же имеет большой опыт — водит машину почти двадцать лет. Луиса. – Ты прав, дядя. Но два раза он припарковал машину в запрещённом месте, потому что не заметил знака. Два раза превысил максимально разрешённую скорость и один раз не обратил внимания на красный свет. Дядя Рикардо. – Боже мой! Какой ужас! Сколько вам стоила поездка в общей сложности? Луиса. – С штрафами — больше трёх тысяч евро.",
"Дядя Рикардо. – Да ну! Столько же, сколько нам стоил круиз по Карибам в прошлом году. Я предпочитаю организованные поездки; поэтому мне кажется, что круиз — самый удобный и приятный способ путешествовать. Луиса. – Это скучно! Переезжать из порта в порт с тем же пейзажем и теми же людьми вокруг. Дядя Рикардо. – Я с тобой не согласен. У круиза много преимуществ. Удовольствие и спокойствие от пребывания на круизном лайнере, который обеспечивает транспорт, проживание, питание и развлечения — всё в одном пакете. Это приятный способ путешествовать, избегая суеты поездок самолётом, поездом или на машине и необходимости заселяться и выселяться из отелей. Не нужно собирать и разбирать чемоданы, ни переездов на такси в аэропорты, ни долгих ожиданий в терминалах... Луиса. – О вкусах не спорят."],

"L13|Ej19":[
"Бэкпекер, путешественник особого рода",
"Бэкпекер — это специфический персонаж современной жизни. Бэкпекер — это молодой человек, который с небольшими деньгами и большим желанием отправляется путешествовать по миру один, тратя как можно меньше (он знает все интересные места размещения в пол-звезды и даже без звёзд) и наслаждаясь по максимуму, потому что то, что ценно, не имеет цены.",
"Бэкпекер — мастер искусства жить в полную силу, проходя через разные места планеты: будь то Таиланд или Галисия, Шри-Ланка или Сейшелы. Большинство бэкпекеров — молодые люди, которые уезжают в путешествия, когда заканчивают этап учёбы, перед переходом в новую фазу, перед тем как посвятить себя профессии.",
"В целом они умеют заботиться о себе лучше, чем думают родители, и обычно одним махом переходят из подросткового возраста во взрослого — в своих первых поездках, но не падая с дерева (то есть не сбиваясь с пути). Бэкпекеры ждут часами и даже днями выгодного предложения на дешёвое место, и как только находят его, способны за несколько минут оказаться в большом аэропорту и улететь на рейс на край света.",
"За небольшие деньги они попадают в города, которые выбрали давно, которые знали только по интернету или о существовании которых даже не знали, выбранные просто из-за привлекательного предложения. Их второй паспорт, помимо документа своей страны, — это английский. А третий паспорт — это умение просить что-либо «пожалуйста» и благодарить жестами, которые не нуждаются в переводе.",
"Хотя среди бэкпекеров пока больше парней, всё больше девушек учатся объезжать мир с рюкзаком. Не стоит путать путешествие бэкпекера с обычными поездками по окончании учебного года или с экскурсиями пятнадцатилетних. Для начала бэкпекеры немного старше, что важно, и, главное, они не едут группой, они более индивидуалисты. К тому же семья далеко, и им приходится выживать, не прося помощи и денег, поэтому они должны тратить свои доллары с чрезвычайной осторожностью.",
"(Адаптировано по lanacion.com, Аргентина)",
"Что характеризует бэкпекера? Как они могут путешествовать, тратя как можно меньше? О каких паспортах идёт речь в тексте? (Ответы: молодой человек, путешествующий один с рюкзаком; ночуя в самых дешёвых местах и выискивая дешёвые билеты; о документе страны, об английском языке и о языке жестов.)"],

"L14|Ej15":[
"XXII Зимние Олимпийские игры",
"Олимпийские игры в Сочи 2014, официально известные как XXII Зимние Олимпийские игры, были международным мультиспортивным событием, проведённым в городе Сочи, Россия, с 7 по 23 февраля 2014 года. Некоторые соревнования прошли в туристическом городе Красная Поляна. Было проведено 98 соревнований по 15 олимпийским видам спорта.",
"Выбор места проведения Олимпийских игр состоялся 4 июля 2007 года в городе Гватемала, Гватемала. Игры в Сочи стали первыми Зимними Олимпийскими играми, проведёнными в Российской Федерации. В 1980 году Летние Олимпийские игры прошли в Москве, когда она ещё была столицей Советского Союза.",
"Подготовка к Играм включала строительство новых объектов, а также модернизацию телекоммуникаций, электроснабжения и транспортных систем этого района. Эти улучшения включали строительство нового Олимпийского парка вдоль побережья Чёрного моря в долине Имеретинская. Это были самые дорогие Олимпийские игры в истории — стоимостью 51 миллиард долларов.",
"Почти 6000 спортсменов из 88 стран соревновались в течение двух недель за 98 разыгрываемых медалей в 15 дисциплинах, таких как горнолыжный спорт, хоккей с шайбой, бобслей, биатлон, сноуборд, кёрлинг и другие. Победители соревнований получили свои золотые медали с фрагментами метеорита Челябинск, упавшего в российской области Урала в 2013 году.",
"С результатами, полученными в Сочи 2014, Россия не только заняла первое место в олимпийском медальном зачёте, но и превзошла лучший результат, полученный Советским Союзом в Калгари в 1988 году, и сравнялась по количеству золотых медалей, также полученных советскими спортсменами в Инсбруке в 1976 году.",
"а) 1. С 7 по 23 февраля 2014 года в Сочи, Россия. 2. 4 июля 2007 года в Гватемале. 3. Летние Олимпийские игры в Москве. 4. Строительство новых объектов и модернизацию инфраструктуры. 5. 88 стран. 6. В 15 дисциплинах. 7. В них фрагменты Челябинского метеорита. 8. Первое место в медальном зачёте и рекорд."],

"L14|Ej18":[
"Великий Рафа Надаль вновь добился в Ролан Гаррос очередного спортивного успеха, который делает его мифическим гигантом для тенниса Испании и мира. В эти выходные ещё один большой успех испанского спорта был достигнут прославленным атлетом Чемой Мартинесом, победившим в впечатляющем забеге ультрамарафона в китайской пустыне Гоби. Экстремальное приключение, в котором за шесть последовательных этапов нужно преодолеть 250 километров по местности столь же суровой, сколь и сверхчеловеческой. Чема Мартинес в свои 42 года продолжает доказывать, что бег — это жизнь.",
"«Это вызов высшего масштаба», — утверждает Унаи Эмери, тренер «Севильи», когда его спрашивают о главной нерешённой задаче его команды в текущем сезоне. «Севилья» — единственная команда Примеры, которая ещё не добилась победы в гостях, что подтвердилось после победы «Лас-Пальмас» в прошлую пятницу на поле «Хетафе».",
"23 мая 2015 года «Севилья» обыграла «Малагу» 2:3 в последнем матче Лиги прошлого сезона. С тех пор «Севилья» провела в общей сложности 12 матчей вдали от «Санчес Писхуан», из которых проиграла четыре («Лас-Пальмас», «Вильярреал», «Реал Сосьедад» и «Гранада») и сыграла вничью восемь («Малага», «Леванте», «Эйбар», «Депортиво», «Бетис», «Атлетико Мадрид», «Сельта» и «Райо Вальекано»).",
"Тот вызов высшего масштаба, о котором говорит Эмери, состоит в том, чтобы впервые победить в гостях и сделать это на «Камп Ноу», где «Барселона» не проигрывает матч с 21 февраля 2015 года, когда команда под руководством Луиса Энрике проиграла 0:1 «Малаге» с голом Хуанми.",
"Сборная Испании по художественной гимнастике завоевала путёвку на Игры в Рио с блеском, с мировой бронзой — своим лучшим результатом со времён серебра 1998 года. С тех пор она не возвращалась на подиум в общем зачёте. «Это было наше лучшее выступление сезона», — заверила Алехандра Кереда, капитан. «У этой команды нет пределов», — добавила она. Испания выступила в первой группе. Не подвела всемогущая Россия, показавшая ясное намерение вновь царствовать."],

"L15|Ej16":[
"На что вы жалуетесь? Врач. – На что вы жалуетесь? Пациентка. – Вчера я упала, и сегодня у меня сильно болит нога и голова, ещё у меня головокружение. Врач. – Вы принимали какие-нибудь лекарства? Пациентка. – Да, обезболивающее, но эффекта нет. Врач. – Давайте посмотрим. Здесь больно? Пациентка. – Да, сильно. Врач. – Нога опухла. Нужно сделать рентген, чтобы диагностировать, есть перелом или нет, нужно ли накладывать гипс. У вас есть температура? Пациентка. – Думаю, нет. Врач. – Я измерю ваше давление... Оно немного повышенное. Пациентка. – Это серьёзно? Врач. – Нет, вам не о чем беспокоиться. Вот направление на рентген. Медсестра вас проводит.",
"а) 1. На боль в ноге и голове, головокружение. 2. Принимала ли она лекарства, где болит, есть ли температура. 3. Сделать рентген и измерить давление. 4. Да, он направил её на рентген."],

"L15|Ej19":[
"Монтубио, который дал вырвать себе все зубы, чтобы выиграть пари",
"Монтубио пришёл в кабинет в сопровождении двух десятков человек, все сильно пьяные. Это были золотоискатели. Люди звали их паломниками, и им было неважно, находили ли они золото в реках или в котомках ближнего.",
"Монтубио плюхнулся в кресло и посмотрел на дантиста с глупым выражением лица. – Говори. – Вырвите мне все до единого. По одному, и складывайте их сюда, на стол. – Открывай рот. Мужчина подчинился, и дантист убедился, что рядом с разрушенными коренными у него осталось много зубов, некоторые гнилые, другие целые. – У тебя их порядочная горсть. У тебя есть деньги на столько удалений? Мужчина отбросил глупое выражение.",
"– Дело в том, доктор, что друзья, здесь присутствующие, не верят мне, когда я говорю, что я очень мужественный. Дело в том, что я сказал им, что дам вырвать себе все зубы один за другим и не закричу. Дело в том, что мы поспорили, и вы и я разделим выигрыш пополам. – Когда тебе вырвут второй, ты позовёшь мамочку, — закричал один из группы, и остальные поддержали его громким хохотом. – Пойди выпей ещё и хорошо подумай. Я не оказываю услуг для глупостей, — сказал дантист. – Если вы не позволите мне выиграть пари, я отрублю вам голову вот этим, что со мной. У монтубио заблестели глаза, пока он гладил рукоятку мачете.",
"Так пари и состоялось. Мужчина открыл рот, и дантист сделал новый подсчёт. Было пятнадцать зубов, и, сказав ему об этом, пациент выложил ряд из пятнадцати золотых крупинок — по одной за каждый зуб, а держатели пари, за или против, покрыли ставки другими золотыми крупинками.",

<script>
/* Дополнительные упражнения на материале книги:
   по диалогам (реплики+переводы), словарю и текстам для чтения.
   Типы: выбор перевода реплики, порядок слов из диалога, клоуз по тексту, верно/неверно. */
(function(){
  if(!window.BOOKDATA) return;
  function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  var add=0;

  BOOKDATA.lessons.forEach(function(l){
    var ex=l.exercises=l.exercises||[];
    var dlg=(l.dialogs||[]).filter(function(d){return d.sp&&d.ru;});
    var voc=(window.FULLVOCAB&&window.FULLVOCAB[l.id])||[];
    var rd=(window.READINGS&&window.READINGS[l.id])||[];
    var have={}; ex.forEach(function(e){have[e.t+':'+(e.q||'').slice(0,20)]=1;});

    // A. Выбор правильного перевода реплики из диалога книги
    var pairs=[];
    dlg.forEach(function(d){
      var sp=Array.isArray(d.sp)?d.sp:[d.sp];
      var ru=Array.isArray(d.ru)?d.ru:[d.ru];
      for(var i=0;i<sp.length && i<ru.length;i++){
        var s=String(sp[i]).replace(/^[–—\s]+/,'').trim();
        var r=String(ru[i]).replace(/^[–—\s]+/,'').trim();
        if(s.length>12 && r.length>8 && r.indexOf('...')<0) pairs.push([s,r]);
      }
    });
    if(pairs.length>=4){
      var pick=sh(pairs).slice(0,6);
      ex.push({t:"text",q:"Выберите перевод реплики из диалога урока",qty:String(pick.length),
        items:pick.map(function(p){return [p[0],p[1]];})});
      add++;
    }

    // B. Порядок слов: собираем фразу из реплики книги
    var orders=[];
    (pairs||[]).forEach(function(p){
      var w=p[0].replace(/[¿?¡!.,;:—–"]/g,'').trim().split(/\s+/);
      if(w.length>=4 && w.length<=9) orders.push([p[0],p[1]]);
    });
    if(orders.length>=3){
      var op=sh(orders).slice(0,4);
      ex.push({t:"order",q:"Восстановите порядок слов (реплика из учебника)",qty:String(op.length),
        items:op});
      add++;
    }

    // C. Лексика из словаря урока — отрицание/антоним не всегда есть, делаем перевод в обе стороны
    if(voc.length>=8){
      var v2=sh(voc.filter(function(v){return v[0]&&v[1]&&v[0].length>2;})).slice(0,8);
      if(v2.length>=5){
        ex.push({t:"fill",q:"Переведите словарь урока на испанский",qty:String(v2.length),
          items:v2.map(function(v){return [v[1],v[0]];})});
        add++;
      }
    }

    // D. Верно/неверно по тексту для чтения
    var prose=rd.filter(function(t){return (t.sp||'').length>200;});
    if(prose.length){
      var t=prose[0];
      var sents=String(t.sp).split(/(?<=[.!?])\s+/).filter(function(s){return s.length>25;});
      if(sents.length>=4){
        var it=sh(sents).slice(0,4).map(function(s){return [s,"верно"];});
        ex.push({t:"text",q:"Найдите в тексте «"+(t.t||'урока')+"» эти утверждения и подтвердите",qty:String(it.length),items:it});
        add++;
      }
    }

    // E. Вопросы к тексту, если их нет
    if(prose.length && !(prose[0].q&&prose[0].q.length)){
      var t2=prose[0];
      var qs=[];
      var first=String(t2.sp).split(/(?<=[.!?])\s+/)[0];
      if(first) qs.push(["О чём говорится в начале текста?","(Ответ: "+first.slice(0,90)+"…)"]);
      qs.push(["Перескажите текст одним предложением.","(Пример ответа строится по опорным словам текста.)"]);
      if(qs.length){ ex.push({t:"qa",q:"Вопросы к тексту урока",qty:String(qs.length),items:qs}); add++; }
    }
  });

  window.__extraBookEx=add;
})();

</script>

/* --- нормализация ответов --- */
function deaccent(s){return s.replace(/[áàäâ]/g,"a").replace(/[éèëê]/g,"e").replace(/[íìïî]/g,"i").replace(/[óòöô]/g,"o").replace(/[úùüû]/g,"u").replace(/ñ/g,"n");}
function norm(s){return String(s||"").toLowerCase().trim().replace(/\s+/g," ").replace(/[¡!¿?.,;:]+$/,"").replace(/[«»"']/g,"").trim();}
function checkAnswer(user,correct){
 if(correct==null) return {ok:true,soft:true};
 var raw=String(correct);
 var alts=[raw].concat(raw.split(/\s*[|/]\s*/));
 for(var i=0;i<alts.length;i++){
 var a=norm(alts[i]);
 if(a==="") continue;
 if(norm(user)===a) return {ok:true};
 if(deaccent(norm(user))===deaccent(a)) return {ok:true,accent:true};
 }
 return {ok:false};
}

function speak(text,btn){
 try{
 if(!("speechSynthesis" in window)){toast("Синтез речи не поддерживается браузером");return;}
 speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(text);
 u.lang="es-ES"; u.rate=0.9;
 var voices=speechSynthesis.getVoices();
 for(var i=0;i<voices.length;i++){ if(/es(-|_)/i.test(voices[i].lang)){u.voice=voices[i];break;} }
 if(btn){btn.classList.add("on");u.onend=function(){btn.classList.remove("on");};}
 speechSynthesis.speak(u);
 }catch(e){toast("Не удалось озвучить");}
}

function lessonWords(l){
 var w=[],seen={};
 function add(a,b){if(!a||!b)return;var k=norm(a);if(seen[k])return;seen[k]=1;w.push([a,b]);}
 var fv=window.FULLVOCAB&&window.FULLVOCAB[l.id];
 if(fv) fv.forEach(function(v){add(v[0],v[1]);});
 if(l.vocab) l.vocab.forEach(function(v){add(v[0],v[1]);});
 if(l.profesiones) l.profesiones.forEach(function(v){add(v[0],v[1]);});
 if(l.paises) l.paises.forEach(function(v){add(v[0],v[1]);});
 return w;
}
