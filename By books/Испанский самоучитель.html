window.BOOK={"heads": {"2": "УРОК 1 (Lección 1)", "4": "УРОК 3 (Lección 3)", "10": "УРОК 9 (Lección 9)"}, "theory": {"1": [{"h": "§1. Испанский алфавит", "b": ["Буква", "Название", "Название", "Буква", "Название", "Название по-русски", "по-испански", "по-русски", "по-испански", "a", "а", "ene", "энэ", "A a", "N n", "be", "бэ", "eñe", "эньэ", "B b", "Ñ ñ", "ce", "θэ", "o", "о", "C c", "O o", "de", "дэ", "pe", "пэ", "D d", "P p", "e", "э", "cu", "ку", "E e", "Q q", "efe", "эфэ", "ere", "эрэ", "F f", "R r", "ge", "хэ", "ese", "эсэ", "G g", "S s", "hache", "ачэ", "te", "тэ", "H h", "T t", "i", "и", "u", "у", "I i", "U u", "jota", "хота", "uve", "убэ", "J j", "V v", "ka", "ка", "uve doble", "убэ доблэ", "K k", "W w", "ele", "элэ", "equis", "экис", "L l", "X x", "eme", "эмэ", "ye", "йэ", "M m", "Y y", "ceta", "θэта", "Z z", "Испанцы пользуются латинским шрифтом. Буква Ñ ñ является визитной карточкой испанского алфавита. В других языках нет такой буквы. Испанский алфавит – один из самых кратких в мире: всего 27 букв!"]}, {"h": "§2. Буквы и звуки. Особенности произношения", "b": ["На испанском языке говорят более 500 млн. человек. В 20 странах мира испанский язык является официальным. Конечно, произношение, например, аргентинца отличается от произношения кубинца.", "Мы предлагаем кастильский вариант испанского произношения, который считается нормой литературного языка.", "На самом деле научиться правильно читать и произносить испанские слова не так уж и трудно. Испанский язык считается легким, так как в нем как пишется, так и произносится (за редкими исключениями). В испанском языке существуют достаточно четкие правила чтения, благодаря чему, можно правильно прочитать любое, даже незнакомое слово, не прибегая к словарю и транскрипции.", "Гласные", "В испанском языке 5 гласных:", "А а [а], О о [о], U u [у], E e [э], I i [и].", "В отличие от русских, испанские гласные произносятся более четко, напряженно и не ослабляются (не редуцируются) в безударном положении.", "Согласные. Правила чтения согласных", "Познакомьтесь с таблицей правил чтения согласных. В правой колонке, в примерах, произношение испанских слов обозначается в скобках с помощью букв русского алфавита, а подчеркнутая гласная обозначает ударный слог.", "Буква", "Как читается", "Примеры", "B, b", "[б] – в абсолютном начале", "bomba [бомба]", "V, v", "слова и после согласных m, n", "vaso [басо]", "произносится как русский звук б в", "слове бант;", "[б] – в остальных позициях,", "Cuba [куба]", "особенно между гласными,", "ave [абэ]", "произносится как ослабленный", "щелевой губной звук", "C, c", "[θ] – перед гласными i, e", "cine [θинэ]", "произносится как глухой", "cena [θэна]", "межзубный звук; при его", "артикуляции кончик языка", "находится между зубами, касаясь", "края верхних зубов;", "[к] – перед гласными a, o, u; на", "casa [каса]", "конце слова и перед согласными", "clase [класэ]", "произносится как русский звук к;", "Ch, ch", "[ч] – во всех позициях", "chico [чико]", "(c+h)", "noche [ночэ]", "[д] – звонкий, произносится как", "disco [диско]", "D, d", "русский звук д в слове дом в", "caldo [кальдо]", "абсолютном начале слова и после", "donde [дондэ]", "согласных l, n;", "[д] – звонкий межзубный во", "cada [када]", "всех остальных позициях,", "idea [идэа]", "особенно между гласными, при", "произнесении кончик языка", "касается верхних зубов, оставляя", "щель для выхода воздуха;", "[θ] на конце слова артикулируется", "edad [эда]", "как межзубный, но не", "Madrid [мадри]", "произносится или произносится", "ослаблено", "F, f", "[ф] – произносится как русский", "fama [фама]", "звук ф в слове флаг во всех", "fl or [флор]", "позициях", "[х] – произносится как русский", "gente [хэнтэ]", "G, g", "звук х перед гласными i, e;", "gitano [хитано]", "[г] – произносится как русский", "gato [гато]", "звук г перед гласными a, o, u и", "grande [грандэ]", "согласными;", "в сочетаниях gue, gui буква “u” не", "guerra [гэрра]", "произносится, а g читается как г;", "guitarra [гитарра]", "в тех словах, где буква “u” в", "сочетаниях gue, gui читается, над", "lingüística", "ней ставятся две точки", "[лингуистика]", "не обозначает никакого звука", "hola [ола]", "H, h", "ahora [аора]", "[х] – произносится как русский", "joven [хобэн]", "J, j", "звук х во всех позициях", "reloj [рэлох]", "K, k", "[к] – произносится как русский", "kópek [копэк]", "звук к, используется для", "kilómetro", "иностранных слов", "[киломэтро]", "L, l", "[л] – произносится как русский", "lápiz [лапиθ]", "звук л в начале слова и между", "malo [мало]", "гласными;", "[ль] – перед согласными и в", "alma [альма]", "конце слова произноситься как", "hotel [отэль]", "сочетание ль;", "[ль] или [й] – произносится как", "llave [льабэ]=", "Ll, ll", "сочетание ль в слове бульон или", "[йабэ]", "как русский звук й в слове район", "pollo [польо] =", "[пойо]", "M, m", "[м] – произносится как русский", "mano [мано]", "звонкий звук м в слове маска", "tomate [томатэ]", "N, n", "[н] – произносится как русский", "naranja [наранха]", "звук н;", "[м] – перед согласными b, v, f, m,", "triunfo [триумфо]", "p произносится как звук м", "[нь] – произносится как русский", "niño [ниньо],", "Ñ, ñ", "нь в слове варенье", "España [эспанья]", "[п] – произносится как русский", "padre [падрэ]", "P, p", "звук п в слове папа", "[к] – произносится как русский", "quinto [кинто]", "Q, q", "звук к, после q всегда идет буква", "querer [кэрэр]", "u, которая не читается", "R, r", "[р] – в середине слова", "cartera [картэра]", "произносится как русский звук р,", "toro [торо]", "в слове брат;", "[рр] – произносится как", "rico [ррико]", "раскатистое р в абсолютном начале", "Enrique [энррикэ]", "слова и после согласных l, n, s;", "rr", "[рр] – всегда произносится как", "perro [пэрро]", "раскатистое р в середине слова", "correr [коррэр]", "между гласными", "S, s", "[с] – произносится как русский", "sala [сала]", "приглушенный щелевой звук", "museo [мусэо]", "между с и ш;", "[з] – перед звонкими согласными", "mismo [мизмо]", "произносится как русский звонкий", "asno [азно]", "щелевой з в слове зал;", "[ø] – перед раскатистым r не", "Israel [ирраэль]", "произносится", "T, t", "[т] – произносится как русский", "tarde [тардэ]", "твердый глухой звук т в слове", "teatro [тэатро]", "тополь, перед гласной i не", "смягчается", "W, w", "[w] – произносится как", "английский звук w, используется только в иностранных словах", "[кс] – произносится как русское", "examen [эксамэн]", "X, x", "сочетание звуков кс в позиции", "между гласными;", "[с] – произносится как русский", "texto [тэсто]", "звук с, перед согласными;", "в слове México буква “x”", "произносится как русский звук х в", "[мэхико]", "слове хор", "[й] – произносится как звук", "mayo [майо]", "Y, y", "подобный русскому й в сочетании", "ayer [айэр]", "с гласными", "[и] – произносится как русский", "Аna y Lola [ана и", "звук и, если употребляется в", "лола]", "качестве соединительного союза", "«и»", "[θ] – произносится как", "zapato [θапато]", "Z, z", "глухой межзубный звук перед", "lápiz [лапиθ]", "гласными a, o, u и в конце", "слова", "Если вы внимательно рассмотрели таблицу, то можно сделать следующие выводы:", "1) согласные b и v передают одни и те же звуки, то есть читаются одинаково, поэтому написание слов с этими буквами необходимо запоминать;", "2) для передачи звука [г] используют букву g:", "ga [га], go [го], gu [гу], gue [гэ], gui [ги]", "3) для передачи звука [к] используют буквы с и q:", "ca [ка], co [ко], cu [ку], que [кэ], qui [ки]", "4) для передачи звука [х] используют буквы g и j; написание слов с буквой j или g с гласными e, i следует запоминать:", "ja [ха], jo [хо], ju [ху], je=ge [хэ], ji =gi [хи]", "5)", "для", "передачи", "межзубного", "звука", "[θ]", "используют", "буквы с и z:", "za [θа], zo [θо], zu [θу], ce [θэ], ci [θи]", "Сочетание ze, zi встречается только в словах иностранного происхождения: zinc, zenit, zebra.", "6) согласные k , w «не испанские», они встречаются в словах иностранного происхождения, которые принято писать и произносить, как они пишутся и произносятся на исходном языке:", "whisky.", "7) согласные f, l, m, n, p, t произносятся подобно русским согласным ф, л, м, н, п, т."]}, {"h": "§3. Дифтонги и трифтонги", "b": ["Гласные a, o, e являются сильными, гласные i, u – слабыми.", "Дифтонг – это сочетание сильной + слабой гласной (ai, au, oi, ou, ei, eu) или слабой + сильной гласной (ia, io, ie, ua, uo, ue), которое образует один слог. При этом четко произносятся сильные гласные.", "В дифтонгах ai, oi, ei слабая i читается и произносится как русская й: aire, oigo, reino.", "Дифтонги ia, ie, io произносятся как сочетание буквы ь с гласными в русском языке (хлопья, пьеса, бульон): piano, pieza, nervio.", "В дифтонгах au, eu, ou буква u произносится ослаблено:", "Paula, Europa.", "В дифтонгах ua, uo, ue буква u произносится ослаблено:", "cuatro, antiguo, pueblo.", "Сочетание слабая + слабая гласная (iu, ui) также образует дифтонг, при этом ударной гласной становится вторая: viuda, ruido.", "Когда две сильные гласные находятся рядом ao, ae, oa, oe, ea, eo, они произносятся раздельно: poeta, teatro, Amadeo.", "Трифтонг – это сочетание слабого + сильного + слабого гласных звуков, которое образует один слог (iai, iei, uai, uei, uau). При этом четко произносятся сильные гласные: limpiáis, limpiéis, Uruguay, continuáis."]}, {"h": "§4. Слогоделение", "b": ["В испанском языке существуют следующие правила деления на слоги:", "1) 1 согласная между 2 гласными образует слог с последующей гласной: ma-pa, to-ma-te", "2) 2 согласные между 2 гласными расходятся по одной к каждой гласной: cer-ve-za, cuen-ta", "3) взрывные согласные b, c, f, g, p, t, d + l, r не разделяются:", "li-bro, ti-gre, le-tra", "4) 3 согласные между 2 гласными (кроме неделимых сочетаний) делятся по формуле 2+1:", "ins-ti-tu-to, en-con-trar", "5) 4 согласные между 2 гласными делятся по формуле 2+2:", "ins-truc-tor", "6) существует морфологическое слогоделение:", "aero-puer-to, auto-mó-vil", "7) не разделяются буквосочетания que, qui, gue, gui, rr, ll, ch, а также дифтонги: pe-rro, mu-cha-cha, pe-que-ño, gue-rra."]}, {"h": "§5. Ударение", "b": ["В испанском языке существуют четкие правила ударения, т.е.", "какой слог в слове мы должны выделить при его произношении.", "1) Если слово оканчивается на гласную а, o, u, e, i или согласную n, s, то ударение падает на предпоследний слог: tema, momento, clase, Carmen, Mercedes.", "2) Если слово оканчивается на согласную (кроме n, s), то ударение падает на последний слог: compositor, principal, verdad, actriz.", "3) В случае нарушения правил 1 и 2 над словом обязательно должен стоять при письме значок ΄ графического ударения. Он подсказывает читателю ударный слог: Moscú , Málaga, atmósfera, lápiz, teléfono, análisis.", "4) Графическим ударением пользуются также для того, чтобы различить слова, которые пишутся и произносятся одинаково", "(омонимы), но имеют разное значение:", "el – артикль муж. рода", "él – он", "si – если", "sí – да", "tu – твой, твоя", "tú – ты", "te – тебе, тебя", "té – чай", "mi – мой, моя", "mí – мне, меня", "solo – одинокий", "sólo – только", "mas – но", "más – еще", "5) Графическое ударение ставится над вопросительными и восклицательными словами:", "¿Por qué? ¿Dónde? ¿Cuándo? ¡Qué bien!", "Вопросительные и восклицательные знаки ставятся в начале фразы в перевернутом виде и в конце фразы.", "6) Графическое ударение используется для разделения дифтонгов: María, Raúl, egoísta."]}], "2": [{"h": "§1. Имя существительное", "b": ["В испанском языке существительные имеют категорию рода.", "Все существительные делятся на мужской род (masculino) и женский род (femenino).", "Большинство существительных, оканчивающихся на гласную", "-о, относятся к мужскому роду, в то время как большинство существительных, оканчивающихся на гласную -а, – к женскому роду:", "masculino (m)", "femenino (f)", "chico мальчик", "chica девочка", "amigo друг", "amiga подруга", "hermano брат", "hermana сестра", "libro книга", "casa дом", "alumno ученик", "alumna ученица", "museo музей", "playa пляж", "Исключения:", "masculino", "femenino", "papá папа", "mano рука", "día день", "radio радио", "policía полицейский", "К мужскому роду относятся существительные греческого происхождения, оканчивающиеся на -ma и -ta:", "problema", "programa", "tema", "planeta", "Существительные, оканчивающиеся на гласную -е, могут быть как мужского, так и женского рода:", "masculino", "femenino", "padre отец", "madre мать", "café кофе", "calle улица", "coche автомобиль", "noche ночь", "hombre человек / мужчина", "tarde вечер / день", "Существительные, оканчивающиеся на согласную, могут быть как мужского, так и женского рода:", "masculino", "femenino", "amor любовь", "fl or цветок", "sol солнце", "sal соль", "avión самолет", "operación операция", "lápiz карандаш", "luz свет", "país страна", "crisis кризис", "césped газон", "pared стена", "К женскому роду относятся существительные, оканчивающиеся на -ción, -tión, -sión, -ad:", "estación", "станция", "ciudad", "город", "cuestión", "вопрос", "verdad", "правда", "pensión", "пенсия", "felicidad", "счастье", "Существительные, оканчивающиеся на -ante, -iente, -ista обозначают лиц как мужского, так и женского пола:", "estudiante m студент, estudiante f студентка", "cliente m клиент, cliente f клиентка", "economista m, f экономист (мужчина и женщина)", "В испанском языке существительные имеют категорию числа.", "Множественное число образуется путем прибавления окончания -s к существительным, оканчивающимся на гласную:", "libro → libros", "casa → casas", "coche → coches", "Множественное число существительных, оканчивающихся на согласную, образуется с помощью окончания -es:", "ciudad → ciudades", "fl or → fl ores", "avión → aviones", "país → países", "Если существительное оканчивается на -z, во множественном числе буква z заменяется на c и добавляется окончание -es:", "lápiz → lápices", "luz → luces", "Существительные, оканчивающиеся в единственном числе на безударный слог -as, -os, -us, -es, -is, во множественном числе не изменяются:", "lunes m понедельник/понедельники", "crisis f кризис/кризисы", "cumpleaños m день рождения/ дни рождения", "В испанском языке, как и в русском, есть ряд существительных, которые употребляются только в единственном или только во множественном числе:", "salud f здоровье", "dinero m деньги", "hambre f голод", "vacaciones f каникулы"]}, {"h": "§2. Артикль", "b": ["Артикль — служебное слово. Оно играет роль определения существительного, к которому оно относится, указывая его род, число. Артикли делятся на определенные и неопределенные.", "Определенный артикль:", "единственное число", "множественное число", "singular", "plural", "мужской род", "el", "los", "женский род", "la", "las", "Определенный артикль употребляется, когда говорится о конкретном предмете или предметах, известных говорящему или единственных в своем роде:", "el libro – los libros", "la casa – las casas", "Существует также определенный артикль среднего рода lo.", "У него нет множественного числа, применяется он с единственной целью – создать существительные, обозначающие абстрактные понятия. Для того чтобы получить подобное абстрактное существительное, следует поставить артикль lo перед прилагательным: lo interesante интересное, lo nuevo новое.", "Неопределенный артикль:", "единственное число", "множественное число", "мужской род", "un", "unos", "женский род", "una", "unas", "Неопределенный артикль указывает на то, что существительное упоминается впервые, незнакомо говорящему, или употребляется, когда говорится об одном предмете, относящемуся к целому классу аналогичных предметов. Неопределенный артикль единственного и множественного числа употребляется перед существительным для обозначения количества предметов, а также если за существительным следует определение:", "un libro – unos libros", "una casa – unas casas", "una fl or bonita красивый цветок", "un día difícil трудный день", "В испанском языке есть ряд существительных женского рода, начинающихся с ударной гласной а или ha, перед которыми в единственном числе следует ставить артикль мужского рода, а во множественном числе артикли женского рода, например:", "el alma душа – las almas", "el ama хозяйка – las amas", "el agua вода – las aguas", "el aula аудитория – las aulas"]}, {"h": "§3. Имя прилагательное", "b": ["Прилагательные согласуются в роде и числе с существительными, которые они определяют. Испанские прилагательные делятся на две группы: 1) прилагательные двух окончаний и 2)", "прилагательные одного окончания.", "Прилагательные двух окончаний имеют окончание -о в форме мужского рода единственного числа и окончание -а в форме женского рода единственного числа:", "blanco белый – blanca белая", "negro черный – negra черная", "Прилагательные, оканчивающие в единственном числе на другую гласную или на согласную, относятся к прилагательным одного окончания, то есть имеют одинаковую форму в женском и мужском роде:", "un lápiz azul синий карандаш", "una fl or azul синий цветок", "un coche verde зеленый", "una casa verde зеленый дом", "автомобиль", "Исключениями из этого правила являются прилагательные, обозначающие национальность, происхождение:", "un amigo español", "una amiga española", "испанский друг", "испанская подруга", "un estudiante alemán", "una estudiante alemana", "немецкий студент", "немецкая студентка", "В отличие от русского языка испанские прилагательные, ставятся после определяемого существительного:", "una сasa blanca", "белый дом", "un libro interesante", "интересная книга", "Но иногда качественные прилагательные bueno хороший, malo плохой, grande большой (в значении «великий») могут стоять перед определяемым словом.", "Прилагательное grande имеет усеченную форму gran перед существительными мужского и женского рода:", "un gran poeta ruso", "великий русский поэт", "la Gran Guerra Patria", "Великая Отечественная война", "Прилагательные bueno и malo имеют усеченную форму buen и mal только перед существительными мужского рода.", "Сравните:", "un hombre bueno", "un buen hombre", "хороший человек", "добрый человек", "un hombre malo", "un mal hombre", "плохой человек", "злой человек", "Множественное число прилагательных, оканчивающихся на гласную, образуется с помощью окончания -s:", "blanco → blancos", "española → españolas", "negra → negras", "verde → verdes", "Множественное число прилагательных, оканчивающихся на согласную, образуется с помощью окончания -es:", "azul → azules", "español → españoles", "regular → regulares"]}, {"h": "§4. Личные местоимения в именительном падеже", "b": ["Личные местоимения в испанском языке представлены следующими формами:", "Единственное число", "Множественное число", "1 лицо", "yo я", "1 лицо", "nosotros мы", "nosotras мы", "2 лицо", "tú ты", "2 лицо", "vosotros вы", "vosotras вы", "3 лицо", "él он", "3 лицо", "ellos они", "ella она", "ellas они", "usted Вы", "ustedes Вы", "Личные местоимения во множественном числе в отличие от русского языка различаются по родам:", "nosotrоs мы – м.р. или м.р.+ж.р.", "nosotrаs мы – только ж.р.", "vosotros вы – м.р. или м.р.+ж.р.", "vosotras вы – ж.р.", "ellos они – м.р. или м.р.+ж.р.", "ellas они – ж.р.", "Местоимение usted (м.р. и ж.р.) – это сокращение архаичной формы обращения Vuestra Merced (Ваша милость), поэтому употребляется с глаголами в форме третьего лица (Вы понимаете – букв. Ваша милость понимает). При письме вежливые формы обычно пишутся в сокращенном виде: Ud. или Vd. (ед.ч.),", "Uds. или Vds. (мн.ч.).", "Личные местоимения (за исключением вежливой формы) в устной и письменной речи, как правило, опускаются. Они присутствуют в тех предложениях, где есть противопоставление или, если они являются логическим и грамматическим центром фразы."]}, {"h": "§5. Глаголы SER, ESTAR", "b": ["Глагол ser быть, являться – один из самых важных и распространенных глаголов в испанском языке. Выучите его спряжение в настоящем времени:", "SER", "yo", "soy", "nosotros", "somos", "nosotras", "somos", "tú", "eres", "vosotros", "sois", "vosotras", "sois", "él", "es", "ellos", "son", "ella", "es", "ellas", "son", "usted", "es", "ustedes", "son", "Ser выполняет роль глагола-связки. Глагол-связка – это необходимая часть предложения, он обязательно ставится перед существительным, когда говорится о:", "– имени или фамилии,", "– родственных связях,", "– происхождении или национальности,", "– роде занятий или профессии,", "а также перед прилагательным, когда сообщается о какомлибо качестве подлежащего.", "В испанском языке, в отличие от русского без глагола-связки предложения не строятся.", "Например:", "Ana es economista.", "Анна – экономист.", "Yo soy ruso. Soy de Moscú.", "Я – русский. Я из Москвы.", "Don Juan es el padre de José.", "Дон Хуан – отец Хосе.", "Somos jóvenes.", "Мы – молоды.", "Mi apellido es Petrov.", "Моя фамилия Петров."]}], "3": [{"h": "§1. Простые предлоги", "b": ["a", "1. Указывает направление движения куда-либо, то есть используется, чтобы ответить на вопрос куда?", "Предлог а сливается с определенным артиклем", "мужского рода единственного числа el, образуя форму al:", "a + el → al", "ir a casa идти домой", "ir al cine идти в кино", "ir a la oficina ехать / идти на работу", "2. Употребляется перед одушевленными", "существительными в винительном и дательном падежах.", "Используется, чтобы ответить на вопрос кого? или кому?", "llamar al médico вызывать (кого?) врача", "leer al cliente читать (кому?) клиенту", "de", "1. Указывает точку, из которой начато движение, то есть используется, чтобы ответить на вопрос откуда?", "Предлог de сливается с определенным артиклем мужского рода единственного числа el, образуя форму del:", "de + el → del", "ir a casa de la oficina идти домой с работы", "ir a casa del cine идти домой из кинотеатра", "2. Передает значение русского родительного падежа", "(кого? чего?), указывает на принадлежность:", "Es el coche del abogado. Это машина адвоката.", "Las calles de la ciudad son largas. Улицы города длинные.", "3. Передает значение русского предложного падежа", "(о ком? о чем?):", "Es un libro de la vida. Это книга о жизни.", "Es un libro de un poeta ruso. Это книга об одном русском поэте.", "4. С некоторыми существительными и наречиями", "образует сочетания, соответствующие относительным", "прилагательным, то есть служит для образования", "определения. Можно задать вопросы какой? какая? какие?", "Существительные в этом случае не имеют артикля:", "Un hombre de cuarenta años. Сорокалетний мужчина.", "El periódico de hoy. Сегодняшняя газета.", "Las fl ores de plástico. Пластмассовые цветы.", "en", "1. Соответствует русским предлогам в, на. Указывает на местонахождение. Используется, чтобы ответить на вопрос где?", "Estoy en la playa. Я на пляже.", "Jorge está en el bar. Хорхе в баре.", "Lola y tú estáis en casa. Вы с Лолой дома.", "2. С глаголом ir указывает на способ передвижения:", "ir en metro ехать на метро", "ir en avión лететь на самолете", "con", "1. Перед существительными передает значение", "русского творительного падежа (чем?):", "escribir con un lápiz rojo писать красным карандашом", "2. Соответствует русским предлогам с, вместе с:", "hablar con el médico разговаривать с врачом", "vivir con los padres жить с родителями", "tomar café con leche пить кофе с молоком", "leer con interés y con atención читать внимательно и с интересом por", "Соответствует русским предлогам по, про:", "ir por la calle идти по улице", "escuchar por la radio слушать по радио", "llamar por el nombre назвать по имени", "preguntar por Luisa спрашивать про Луизу", "para Соответствует русскому предлогу для:", "Las fl ores son para la madre. Цветы для матери.", "sin", "Соответствует русскому предлогу без:", "tomar café sin leche пить кофе без молока"]}, {"h": "§2. Количественные числительные 0-100", "b": ["Прочитайте и запомните числительные от 0 до 100:", "0 cero", "20 veinte", "1 uno", "21 veintiuno", "2 dos", "22 veintidós", "3 tres", "23 veintitrés", "4 cuatro", "24 veinticuatro", "5 cinco", "25 veinticinco", "6 seis", "26 veintiséis", "7 siete", "27 veintisiete", "8 ocho", "28 veintiocho", "9 nueve", "29 veintinueve", "10 diez", "30 treinta", "11 once", "31 treinta y uno", "12 doce", "32 treinta y dos", "13 trece", "40 cuarenta", "14 catorce", "50 cincuenta", "15 quince", "60 sesenta", "16 dieciséis", "70 setenta", "17 diecisiete", "80 ochenta", "18 dieciocho", "90 noventa", "19 diecinueve", "100 ciento, cien", "Числа с 11-15 имеют особую форму, а с 16-19 – составные слова: десять и шесть, десять и семь, десять и восемь, десять и девять.", "Десятки с 30 до 90 с единицами пишутся раздельно, между ними ставится соединительный союз y – и.", "Русскому числительному один в испанском языке соответствуют две формы: полная uno и усеченная un. Полная форма uno употребляется в составных числительных. Усеченная форма un употребляется перед существительными мужского рода единственного и множественного числа. Форма женского рода одна – una употребляется перед существительными женского рода:", "un hotel один отель", "una estudiante", "veintiún años 21 год", "одна студентка", "treinta y un escritores", "veintiuna operaciones", "31 писатель", "21 операция", "cincuenta y una monedas", "51 монета", "Русскому числительному сто в испанском языке соответствуют две формы: полная ciento и усеченная cien. Полная форма ciento употребляется в составных числительных. Усеченная форма cien употребляется перед существительными:", "ciento cincuenta – 150", "cien libros – 100 книг", "cien revistas – 100 журналов"]}, {"h": "§3. Спряжение правильных глаголов", "b": ["в настоящем времени", "изъявительного наклонения", "Все испанские глаголы (кроме глаголов индивидуального спряжения) в зависимости от окончания infi nitivo (неопределенной формы или инфинитива) делятся на три спряжения.", "К I спряжению относятся глаголы, оканчивающиеся в инфинитиве на -ar.", "Ко II спряжению относятся глаголы, оканчивающиеся в инфинитиве на -er.", "К III спряжению относятся глаголы, оканчивающиеся в инфинитиве на -ir.", "Спряжение правильных глаголов в настоящем времени изъявительного наклонения (presente de indicativo):", "I спряжение", "II спряжение", "III спряжение", "hablar", "comer", "vivir", "yo", "habl-o", "com-o", "viv-o", "tú", "habl-as", "com-es", "viv-es", "él, ella, usted", "habl-a", "com-e", "viv-e", "nosotros (-as)", "habl-amos", "com-emos", "viv-imos", "vosotros (-as)", "habl-áis", "com-éis", "viv-ís", "ellos, ellas", "habl-an", "com-en", "viv-en", "ustedes", "Запомните и проспрягайте следующие правильные глаголы.", "I спряжение:", "hablar говорить, разговаривать", "llamar звать, звонить", "preguntar спрашивать", "escuchar слушать", "tomar брать, есть, пить", "Например:", "Yo hablo ruso.", "Я говорю по-русски.", "Miguel habla de la vida", "Мигель разговаривает", "con su vecino.", "о жизни со своим", "соседом.", "Hablamos en voz alta/baja.", "Мы говорим громко /", "тихо.", "Llamáis al médico por", "Вы вызываете врача по", "teléfono.", "телефону.", "El profesor llama al", "Преподаватель называет", "estudiante por el nombre.", "студента по имени.", "Llaman a la puerta.", "Стучат / звонят в дверь.", "Andrés pregunta la", "Андрей спрашивает адрес", "dirección de Ana.", "Анны.", "Usted escucha las noticias", "Вы слушаете новости по", "por la radio.", "радио.", "Los amigos toman café con", "Друзья пьют кофе с", "azúcar.", "сахаром.", "II спряжение:", "leer читать", "aprender учить", "comprender понимать", "comer есть, кушать", "Например:", "El jefe lee revistas,", "Начальник читает", "periódicos y cartas en", "журналы, газеты и письма", "inglés.", "по-английски.", "Los alumnos aprenden las", "Ученики учат новые", "palabras nuevas.", "слова.", "Comprendo bien/ mal/ un", "Я хорошо/ плохо/ немного", "poco al guía.", "понимаю гида.", "El niño come con apetito.", "Ребенок ест с", "аппетитом.", "III спряжение:", "abrir открывать", "escribir писать", "vivir жить", "Например:", "Tú no abres la ventana.", "Ты не открываешь окно.", "El señor López abre la", "Сеньор Лопес открыcuenta en el banco", "вает счет в банке", "Santander.", "«Сантан  сын не прав.", "Hijo mío, tú no tienes razón.", "Сын мой, ты не прав.", "¡Amor mío! ¡Padre nuestro!", "Любовь моя! Отче наш!"]}, {"h": "§3. Вопросительные предложения.", "b": ["Интонация вопросительного", "предложения", "В испанском языке порядок слов в предложении относительно свободный. В повествовательном предложении обычно применяется прямой порядок слов: подлежащее + сказуемое + дополнение/ обстоятельства.", "Для интонации повествовательного предложения характерно повышение тона от начала фразы до первого ударного слога, сохранение высоты тона без изменения до последнего ударного слога, а затем понижение тона до точки:", "↑Carlos va a la oficina en taxi↓.", "В вопросительных предложениях употребляется обратный порядок слов, то есть сказуемое ставится перед подлежащим:", "¿Va Carlos a la oficina en taxi?", "Вопросы бывают:", "Общие (без вопросительного слова), предполагающие ответ да – нет.", "Например:", "¿Trabaja Luis en el banco?", "Луис работает в банке?", "– Sí, (él) trabaja en el banco.", "– Да, он работает в банке.", "– No, (él) no trabaja en el", "– Нет, он не работает в", "banco.", "банке.", "Интонация общего вопроса в испанском языке не отличается от русского языка. В вопросительном предложении без вопросительного слова тон повышается от начала фразы до первого ударного слога, затем тон понижается до последнего ударного слога и вновь резко повышается до вопросительного знака:", "¿↑Va Carlos a la oficina en taxi ↑?", "Альтернативные, содержащие союз о или:", "¿Trabaja o estudia tu hijo?", "Твой сын работает или учится?", "Специальные, которые задаются с помощью вопросительных слов к различным членам предложения.", "В альтернативном и специальном вопросе в испанском языке в отличие от русского языка тон понижается к концу предложения:", "¿Cómo estás↓?", "Выучите вопросительные слова специального вопроса, которые задаются:", "к подлежащему", "¿Quién? Кто? (одушевленное подлежащее ед.ч.)", "¿Quiénes? Кто?(одушевленное подлежащее мн.ч.)", "¿Qué? Что? (неодушевленное подлежащее)", "¿Quién llama por teléfono?", "Кто звонит по телефону?", "¿Quiénes hablan ruso?", "Кто говорит по-русски?", "¿Qué pasa?", "Что происходит?", "Чтобы спросить Кто Вы /ты? в испанском языке задают вопрос ¿quién? или ¿qué?, в зависимости от информации, которую хочет получить собеседник.", "Сравните:", "¿Quién es usted (eres)?", "Кто Вы (ты)?", "– Soy Alicia López, soy la", "– Я Алисия Лопес, сестра", "hermana de Felipe.", "Фэлипэ.", "¿Qué es usted (eres)?", "Кто Вы (ты)?", "– Soy española. No soy", "– Я испанка. Я не преподаваprofesora, soy estudiante.", "тель, я студентка.", "к дополнению", "одушевленное дополнение", "¿A quién? Кому? Кого? ¿Con quién? С кем? ¿De quién? О ком?", "и т.д.", "¿A quién llama Eva?", "Кому звонит Ева?", "¿Con quiénes trabajas?", "С кем ты работаешь?", "¿De quién habláis?", "О ком вы говорите?", "неодушевленное дополнение", "¿Qué? Что? ¿De qué? О чем? ¿Con qué? С чем? и т.д.", "¿Qué leen Uds?", "Что вы читаете?", "¿De qué escribe él?", "О чем он пишет?", "¿Con qué tomas té?", "С чем ты пьешь чай?", "к определению", "¿Qué? + сущ. Какой? Какая? Какие?", "¿Cómo? + гл. ser Какой? Какая? Какие? Каков? Какова?", "¿Cuál? / ¿Cuáles? Какой? Какая? Который? Которая? / Какие?", "Которые? (если есть выбор)", "¿Qué libro lee Rosa?", "Какую книгу читает", "Роза?", "¿Qué medicinas toma Ud.?", "Какие лекарства Вы", "принимаете?", "¿Cómo son los nuevos", "Какие (каковы) новые", "amigos?", "друзья?", "¿Cómo es su carácter?", "Какой у него характер?", "¿Cuál libro es tuyo?", "Которая книга твоя?", "¿Cuáles de estos", "Которые из этих", "estudiantes hablan chino?", "студентов говорят покитайски?", "к обстоятельству времени", "¿Сuándo? Когда?", "¿Cuándo vais a la playa?", "Когда вы идете на пляж?", "к обстоятельству места", "¿Dónde? Где?", "¿Adónde? Куда?", "¿De dónde? Откуда?", "¿Dónde vive Ramón?", "Где живет Рамон?", "¿Adónde vas?", "Куда ты идешь?", "¿De dónde es Paula?", "Откуда (родом) Паула?", "к обстоятельству причины", "¿Por qué? Почему?", "(в ответе употребляется союз porque потому что)", "¿Por qué tomas agua?", "Почему ты пьешь воду?", "– Tomo agua porque tengo", "– Я пью воду, потому что", "sed.", "хочу пить.", "к обстоятельству образа действия", "¿Сómo? Как?", "¿Cómo estás?", "Как ты себя чувствуешь?", "¿Cómo se escribe esta", "Как пишется это слово?", "palabra?", "о количестве", "¿Cuánto? ¿Cuánta? ¿Cuántos? ¿Cuántas? Сколько?", "Вопрос о количестве согласуется в роде и числе с существительным, к которому он относится:", "¿Cuántos años tienes?", "Сколько тебе лет?", "¿Cuánto tiempo tenemos?", "Сколько у нас есть времени?", "¿Cuánta gente vive aquí?", "Сколько народа здесь", "проживает?", "¿Cuántas poesías vas a", "Сколько стихов ты", "aprender?", "собираешься выучить?"]}, {"h": "§4. Глаголы QUERER, PODER, VENIR, DECIR", "b": ["• Глагол querer хотеть, желать, любить – индивидуального спряжения. Выучите формы спряжения этого глагола в настоящем времени:", "QUERER", "yo", "quiero", "nosotros (-as)", "queremos", "tú", "quieres", "vosotros (-as)", "queréis", "quiere", "quieren", "él, ella, usted", "ellos, ellas ustedes", "Глагол querer употребляется для выражения своего желания совершить какое-то действие: я хочу пойти, он хочет отдохнуть.", "Например:", "(Yo) quiero descansar.", "Я хочу отдохнуть.", "(Tú) quieres leer.", "Ты хочешь почитать.", "(Ella) quiere preguntar.", "Она хочет спросить.", "¿Quieren ustedes abrir la", "Вы хотите открыть счет?", "cuenta?", "(Nosotros) queremos llamar", "Мы хотим вызвать такси.", "un taxi.", "¿Queréis (vosotros) tomar", "Хотите что-нибудь", "algo?", "выпить (перекусить)?", "После глагола querer может следовать существительное.", "Например:", "No quiero café, quiero té.", "Я не хочу кофе, я хочу чай.", "Javier quiere un coche nuevo.", "Хавьер хочет новую машину.", "Queremos caramelos.", "Мы хотим конфет.", "Глагол querer употребляется также в значении любить, относиться с симпатией, когда речь идет о людях:", "Yo te quiero.", "Я тебя люблю.", "Carlos quiere mucho a Lola.", "Карлос очень любит Лолу.", "Queremos a nuestro tío.", "Мы любим нашего дядю.", "• Глагол poder мочь – индивидуального спряжения. Выучите формы спряжения этого глагола в настоящем времени:", "PODER", "yo", "puedo", "nosotros (-as)", "podemos", "tú", "puedes", "vosotros (-as)", "podéis", "puede", "él, ella, usted", "ellos, ellas ustedes", "pueden", "Например:", "(Yo) puedo preguntar en", "Я могу спросить", "español.", "по-испански.", "Puedes comer en el", "Ты можешь поесть", "restaurante.", "в ресторане.", "(Nosotros) no podemos", "Мы не можем поговорить", "hablar aquí.", "здесь.", "• Глагол venir приходить, приезжать – индивидуального спряжения. Выучите формы спряжения этого глагола в настоящем времени:", "VENIR", "yo", "vengo", "nosotros (-as)", "venimos", "tú", "vienes", "vosotros (-as)", "venís", "él, ella, usted", "viene", "ellos, ellas, ustedes", "vienen", "Например:", "Yo vengo a casa tarde.", "Я прихожу домой поздно.", "Raúl viene de la oficina", "Рауль приходит с работы", "temprano.", "рано.", "¿De dónde vienen Uds.?", "Откуда Вы идете?", "• Глагол decir говорить, сказать – индивидуального спряжения. Выучите формы спряжения этого глагола в настоящем времени:", "DECIR", "yo", "digo", "nosotros (-as)", "decimos", "tú", "dices", "vosotros (-as)", "decís", "él, ella, usted", "dice", "ellos, ellas, ustedes", "dicen", "Например:", "Я не говорю свою фамилию.", "Yo no digo mi apellido.", "Ella quiere decir algo al", "Она хочет что-то сказать", "médico.", "врачу.", "Dices que Ana trabaja en el", "Ты говоришь, что Анна", "banco.", "работает в банке.", "\u0002 Следует различать глаголы hablar и decir, оба глагола могут переводиться как говорить.", "Сравните:", "hablar говорить, разговаривать", "Как?", "María habla español.", "Мария говорит по-испански", "(вообще).", "María habla el español", "Мария говорит по-испански", "bien/mal.", "хорошо/плохо (оценка).", "María habla en español", "Мария говорит по-испански", "en casa.", "дома (в какой-то ситуации).", "Tú hablas en voz baja.", "Ты говоришь тихим голосом /", "тихо.", "Hablamos por teléfono.", "Мы говорим /разговариваем по", "телефону.", "С кем?", "Él habla con su mujer.", "Он говорит/ разговаривает со", "своей женой.", "О ком? О чем?", "Hablo con mi hermano de", "Я говорю /разговариваю со", "la vida, de mis hijos.", "своим братом о жизни, о своих", "детях.", "decir говорить, сказать", "Что?", "Siempre digo la verdad.", "Я всегда говорю правду.", "El señor dice que no habla", "Сеньор говорит, что он не", "ruso.", "говорит по-русски.", "Кому?", "¡Qué me dices!", "Да что ты мне говоришь!", "¡Diga! – форма глагола decir употребляется вместо «Алло!», когда вы снимаете трубку, чтобы ответить на телефонный звонок."]}], "5": [{"h": "§1. Безличная глагольная форма HAY", "b": ["Безличная глагольная форма hay (от инфинитива глагола haber) соответствует русским глагольным формам есть, имеется, имеются.", "Hay в утвердительной форме при переводе на русский язык обычно опускается, а отрицательная форма no hay переводится словом нет.", "Повествовательные предложения с формой hay начинаются с обстоятельства места. Следующее за hay существительное является прямым дополнением, в единственном числе оно употребляется с неопределенным артиклем, во множественном числе без артикля, а после no hay артикль всегда опускается:", "hay + un/una + существительное в ед.ч.", "hay + Ø + существительное во мн.ч.", "no hay + Ø + существительное в ед.ч.", "no hay Ø + существительное во мн.ч.", "Например:", "En la habitación hay una", "В комнате есть (стоит)", "cama y un armario.", "кровать и шкаф.", "Sobre la mesa hay periódicos", "На столе (лежат)", "de hoy.", "сегодняшние газеты.", "En el comedor no hay", "В столовой нет часов.", "reloj.", "En el fl orero no hay fl ores.", "В вазе нет цветов.", "Конструкция hay que + инфинитив надо сделать что-либо не указывает лицо, которое должно совершить действие. Например:", "Hay que comprar pan.", "Надо купить хлеб.", "No hay que hablar con ellos.", "Не надо разговаривать", "с ними.", "Русскому глаголу быть в испанском языке соответствуют следующие глаголы:", "ser быть, являться", "estar быть, находиться", "hay (haber) быть, иметься", "В отличие от русского языка в испанских высказываниях не допускается опущение этих глаголов.", "Сравните:", "¿Qué es esto? – Es un lápiz.", "Что это? – Это карандаш.", "¿Cómo es el lápiz? – El lápiz", "Какой карандаш? –", "es negro.", "Карандаш черный.", "¿Dónde está el lápiz negro? –", "Где черный карандаш? – Он", "Él está sobre la mesa.", "на столе.", "¿Qué hay sobre la mesa? –", "Что лежит (находится)", "Sobre la mesa hay un", "на столе? – На столе", "lápiz.", "карандаш.", "Él es médico. Es un médico", "Он врач. Он хороший врач.", "bueno.", "Somos de Moscú.", "Мы из Москвы.", "La mujer está en casa, y el", "Жена дома, а муж в баре.", "marido está en el bar.", "Hoy en el museo hay poca", "Сегодня в музее мало", "gente.", "народа."]}, {"h": "§3. Предлоги обстоятельства места и времени", "b": ["cerca de la casa", "рядом с домом", "al lado de la estación", "около вокзала", "junto al monumento", "у (рядом) памятника", "lejos de la playa", "далеко от пляжа", "a la izquierda de la puerta", "слева от двери", "a la derecha de la ventana", "справа от окна", "frente al = enfrente del", "напротив кабинета", "despacho", "delante del = ante el cine", "перед кинотеатром", "detrás del = tras el hotel", "позади (сзади) гостиницы", "alrededor del = en torno", "вокруг двора", "del patio", "entre la ventana y la puerta", "между окном и дверью", "dentro del ascensor", "внутри лифта", "en el armario", "в (внутри) шкафу", "fuera de la oficina", "вне (снаружи/за пределами)", "офиса", "encima del ordenador", "над (сверху) компьютером", "debajo de la cama", "под (снизу) кроватью", "sobre la = en la mesa", "на столе", "en medio de la calle", "посреди улицы", "al fondo del parque", "в глубине парка", "antes de la operación", "до (перед) операции", "después del programa", "после программы", "durante las vacaciones", "в течение (во время)", "отпуска", "Предлоги antes de (до) и después de (после) употребляются также с инфинитивом:", "antes de preguntar перед тем, как спросить", "antes de comer перед едой", "después de leer после того, как (кто-то) прочитал"]}, {"h": "§4. Глаголы индивидуального спряжения", "b": ["в настоящем времени изъявительного наклонения", "Глаголы индивидуального спряжения, у которых только 1-ое лицо единственного числа (yo) имеет особую форму, а остальные лица изменяются по типовому спряжению:", "yo", "tú, él, nosotros, vosotros, ellos", "caber", "quepo cabes, cabe, cabemos, cabéis, caben", "помещаться", "caer падать", "caigo", "caes, cae, caemos, caéis, caen", "dar давать", "doy", "das, da, damos, dais, dan", "hacer делать", "hago", "haces, hace, hacemos, hacéis, hacen", "poner класть", "pongo pones, pone, ponemos, ponéis, ponen", "saber знать,", "sé", "sabes, sabe, sabemos, sabéis, saben", "уметь", "salir выходить", "salgo", "sales, sale, salimos, salís, salen", "traer приносить", "traigo", "traes, trae, traemos, traéis, traen", "ver видеть", "veo", "ves, ve, vemos, veis, ven", "Например:", "María pone fl ores en el fl orero.", "Мария ставит цветы в вазу.", "Yo salgo de casa temprano y tú", "Я выхожу с работы рано, а ты", "sales tarde.", "выходишь поздно.", "¿Qué haces después de las clases?", "Что ты делаешь после", "– No hago nada.", "занятий? – Ничего не делаю.", "¿Qué traes? – Traigo pan y vino", "Что ты принес? – Я принес хлеб", "para la cena.", "и вино к ужину.", "Cuando bailamos vals mi", "Когда мы танцуем вальс,", "hermano cae y yo no caigo.", "мой брат падает, а я", "не падаю.", "No sé dónde estamos.", "Я не знаю, где мы находимся.", "¿Saben Uds. conducir el coche?", "Вы умеете водить", "машину?", "La enfermera le da una medicina", "Медсестра дает лекарство", "al paciente.", "пациенту.", "Lola y yo vemos una película", "Мы с Лолой смотрим", "interesante.", "интересный фильм.", "No quepo en este coche porque", "Я не помещаюсь в эту", "es pequeño.", "машину, потому что", "она маленькая.", "\u0002 Запомните некоторые устойчивые выражения с глаголами индивидуального спряжения poner, dar и hacer:", "poner", "poner la mesa накрывать на стол", "poner orden наводить порядок", "poner la radio (la tele) включать радио (телевизор)", "dar", "dar un paseo / una vuelta прогуляться", "dar un beso поцеловать", "dar las gracias благодарить", "dar recuerdos передавать привет", "dar clases проводить занятия", "dar una fi esta устраивать праздник", "el reloj da las tres часы бьют 3 часа", "las ventanas dan al patio окна выходят во двор", "hacer", "hacer preguntas задавать вопросы", "hacer la cama убирать (заправлять) постель", "hacer la maleta собирать чемодан", "hacer ruido шуметь", "hacer caso а / de обращать внимание на кого-л./на что-л."]}], "6": [{"h": "§1. Местоимения – косвенные дополнения:", "b": ["дательный падеж", "Личные местоимения в испанском языке изменяются по падежам. Дательный падеж личных местоимений может быть образован с помощью предлога а. Также в испанском языке существует беспредложная форма личных местоимений в дательном падеже:", "Именительный падеж", "Дательный падеж", "Кто?", "Кому? Чему?", "Беспредложная", "Предложная", "форма", "форма", "yo", "me мне", "a mí мне", "tú", "te тебе", "a ti тебе", "él", "le ему", "a él ему", "ella", "le ей", "a ella ей", "usted", "le Вам", "a usted Вам", "nosotros (-as)", "nos нам", "a nosotros (-as) нам", "vosotros (-as)", "os вам", "a vosotros (-as) вам", "ellos (-as)", "les им", "a ellos (-as) им", "ustedes", "les Вам", "a ustedes Вам", "Беспредложная форма личных местоимений в дательном падеже ставится перед глаголом в личной форме; в отрицательном предложении – после отрицания no:", "¿Qué me dices?", "Что ты мне говоришь?", "– No te digo nada.", "– Я тебе ничего не говорю.", "Беспредложная форма дательного падежа личных местоимений употребляется обязательно, а предложная не употребляется самостоятельно, а лишь вместе с беспредложной для уточнения. Как правило, требуется уточнение для 3 лица, так как форма единственного числа le означает ему / ей / Вам, а форма множественного числа les – им / Вам.", "Например:", "Pablo os trae estas fl ores (a", "Пабло вам несет эти", "vosotras).", "цветы.", "Le compro un periódico a él.", "Я ему покупаю газету.", "Le damos a usted un", "Мы Вам даем совет.", "consejo.", "El nieto no le dice la verdad", "Внук не говорит дедушке", "al abuelo.", "правду.", "No les crees a ellas.", "Ты им не веришь.", "Vosotros no les abrís la", "Вы не открываете дверь", "puerta a los vecinos.", "соседям.", "El poeta les lee sus poesías a", "Поэт читаем Вас свои", "ustedes.", "стихи.", "Беспредложная форма личных местоимений с неличными", "формами глагола (инфинитив, герундий) ставится после них и пишется слитно:", "Quiero hacerte un regalo.", "Хочу сделать тебе подарок.", "Lola está haciéndonos* café.", "Лола нам готовит кофе."]}, {"h": "§2. Глагол GUSTAR", "b": ["Испанский глагол gustar соответствует русскому глаголу нравиться, любить (о неодушевленных предметах):", "Nos gusta el café.", "Мы любим кофе. / Нам нравится кофе.", "Me gusta Félix.", "Мне нравится Феликс.", "Глагол gustar сопровождается местоимением-дополнением дательного падежа (me, te, le, nos, os, les), которое обязательно употребляется в предложении.", "Подлежащее, выраженное существительным, при глаголе gustar всегда имеет определенный артикль. Глагол gustar преимущественно употребляется в 3-м лице единственного или множественного числа, в зависимости от числа существительного-подлежащего:", "No me gusta el hotel.", "Мне не нравится гостиница.", "Te gustan los coches", "Тебе нравятся (ты любишь)", "antiguos.", "старинные машины.", "Если подлежащее выражено инфинитивом, то глагол gustar имеет форму 3-го лица единственного числа:", "Me gusta cantar.", "Я люблю петь.", "A ellos les gusta pasar las", "Им нравится проводить", "vacaciones en las montañas.", "отпуск в горах.", "В том случае, если подлежащее выражено личным местоимением, оно определяет лицо и число глагола gustar:", "Tú me gustas y yo no te", "Ты мне нравишься, а я тебе не", "gusto.", "нравлюсь.", "\u0002 Следует различать глаголы gustar и querer.", "Сравните:", "Me gustan las naranjas.", "Мне нравятся апельсины.", "Quiero una naranja.", "Я хочу апельсин.", "A Carlos le gusta la nueva", "Карлосу нравится новая", "vecina.", "соседка.", "Alberto quiere mucho a su", "Альберто очень любит", "novia.", "свою невесту.", "A usted le gusta madrugar.", "Вы любите рано вставать.", "Mi hijo quiere casarse con", "Мой сын хочет жениться на", "Lola.", "Лоле."]}, {"h": "§3. Местоимения – прямые дополнения:", "b": ["винительный падеж", "Винительный падеж личных местоимений может быть образован с помощью предлога а. Также в испанском языке сущеУРОК 6 (Lección 6)", "ствует беспредложная форма личных местоимений в винительном падеже:", "Именительный падеж", "Винительный падеж", "Кто?", "Кого? Что?", "Беспредложная", "Предложная форма", "форма", "yo", "me меня", "a mí меня", "tú", "te тебя", "a ti тебе", "él", "lo (le) его", "a él его", "ella", "la ее", "a ella ее", "usted", "lo (le), la Вас", "a usted Вас", "nosotros (-as)", "nos нас", "a nosotros(-as) нас", "vosotros (-as)", "os вас", "a vosotros(-as) вас", "ellos", "los их", "a ellos их", "ellas", "las их", "a ellas их", "ustedes", "los, las Вас", "a ustedes Вас", "Местоимение мужского рода единственного числа lo относится как к одушевленным, так и к неодушевленным предметам:", "Me gusta este televisor.", "Мне нравится этот", "Lo compro.", "телевизор. Я его покупаю.", "¿Qué desea el señor? No", "Что желает сеньор? Я его", "lo comprendo.", "не понимаю.", "Местоимение мужского рода единственного числа lo может переводится на русский язык как это, об этом, про это:", "¿Dónde está Luis? – No lo", "Где Луис? – Я этого не знаю.", "sé. Hay que preguntarlo a su", "Надо спросить об этом", "madre. No puedo hacerlo.", "его мать. Я не могу это", "сделать.", "Местоимение мужского рода единственного числа le употребляется в некоторых районах Испании, относится только к лицам мужского пола, часто при обращении на usted:", "Señor Pérez, le /lo llama el", "Господин Перес, Вас", "jefe.", "вызывает начальник.", "Беспредложная форма acusativo личных местоимений ставится перед глаголом в личной форме; в отрицательном предложении – после отрицания no:", "¿Me escuchas? – Sí, te", "Ты меня слушаешь? – Да, я", "escucho pero no te", "тебя слушаю, но я тебя не", "comprendo.", "понимаю.", "Беспредложная форма acusativo личных местоимений с неличными формами глагола (инфинитив, герундий) ставится после них и пишется слитно:", "No quiero verte.", "Я не хочу тебя видеть.", "¿Buscas mis gafas? – Sí, estoy", "Ты ищешь мои очки? – Да, я", "buscándolas.", "их ищу."]}, {"h": "§4. Одновременное употребление местоимений", "b": ["прямого и косвенного дополнения", "Если в предложении употребляется одновременно косвенное и прямое дополнения, выраженные местоимениями, следует помнить, что в отличие от русского языка, в испанском языке косвенное дополнение – дательный падеж (кому?) предшествует прямому дополнению – винительный падеж (что?).", "Сравните:", "Я тебе говорю правду. → Я тебе", "Yo te digo la verdad. →", "Yo te la digo.", "ее говорю. / Я ее тебе говорю.", "Беспредложные формы личных местоимений с неличными", "формами глагола (инфинитив, герундий) ставятся после них и пишутся слитно:", "Tengo que decirte la", "Я должен сказать тебе", "verdad. → Tengo que", "правду. → Я должен тебе ее", "decírtela.", "сказать. / Я должен ее тебе", "сказать.", "Если одновременно употребляются косвенное и прямое дополнения 3-го лица, то косвенное дополнение (кому?) le, les заменяются местоимением se:", "le (ему, ей, Вам) → se", "les (им, Вам) → se", "El nieto le trae fl ores a la", "Внук приносит цветы", "abuela. → Se las trae.", "бабушке. → Он ей их (их ей)", "приносит.", "Les contamos esta historia", "Мы рассказываем эту", "a los amigos. → Se la", "историю друзьям. → Mы им", "contamos.", "ее (ее им) рассказываем.", "Quiero enseñarles a", "Я хочу показать Вам", "ustedes el piso. → Quiero", "квартиру. → Я хочу показать", "enseñárselo.", "Вам ее (ее Вам)показать."]}, {"h": "§5. Спряжение отклоняющихся глаголов", "b": ["в настоящем времени", "изъявительного наклонения", "В испанском языке все глаголы делятся на три группы: 1)", "правильные глаголы типового спряжения, 2) неправильные глаголы или отклоняющие от типового спряжения, 3) глаголы индивидуального спряжения. Среди отклоняющихся глаголов можно проследить некоторые закономерности. Всего выделяется 6 групп глаголов, в спряжении которых отклонения, подчиняются определенному правилу:", "1 группа – глаголы 1 и 2 спряжений, то есть инфинитив, которых имеет окончание -ar , -er.", "1а – глаголы, имеющие в корне гласную е, которая, попадая под ударение, меняется на дифтонг ie.", "1b – глаголы, имеющие в корне гласную о, которая, попадая под ударение, меняется на дифтонг ue.", "2 группа – глаголы 3 спряжения (инфинитив имеет окончание -ir), в которых корневая гласная е под ударением меняется на i.", "3 группа – глаголы 3 спряжения, в которых корневая гласная е под ударением переходит в дифтонг ie.", "4 группа – к этой группе относятся только два глагола – dormir спать, morir умирать. У этих глаголов корневая гласная о, попадая под ударение, дает дифтонг ue.", "5a группа – глаголы, оканчивающиеся на -cer, в которых 1 лицо единственного числа оканчивается на -zco.", "5b группа – глаголы, оканчивающиеся на -ducir, в которых 1 лицо единственного числа оканчивается на -zco.", "6 группа – глаголы, оканчивающиеся на -uir, при спряжении которых во всех лицах кроме nosotros, vosotros, появляется буква y.", "Например:", "1a grupo", "1b grupo", "2 grupo", "3 grupo", "e→ie", "o→ue", "e→i", "e→ie", "pensar", "volver", "pedir", "sentir", "думать", "возвращаться", "просить", "сожалеть", "yo", "pienso", "vuelvo", "pido", "siento", "tú", "piensas", "vuelves", "pides", "sientes", "él", "piensa", "vuelve", "pide", "siente", "nosotros", "pensamos", "volvemos", "pedimos", "sentimos", "vosotros", "pensáis", "volvéis", "pedís", "sentís", "ellos", "piensan", "vuelven", "piden", "sienten", "4 grupo", "5a grupo", "5b grupo", "6 grupo", "o→ue", "-cer", "-ducir", "-uir", "dormir", "conocer", "traducir", "concluir", "быть", "переводить", "заключать", "спать", "знакомым", "morir", "умирать", "traduzco", "concluyo", "yo", "duermo", "conozco", "traduces", "concluyes", "tú", "duermes", "conoces", "traduce", "concluye", "él", "duerme", "conoce", "traducimos", "concluimos", "nosotros", "dormimos", "conocemos", "conocéis", "traducís", "concluís", "vosotros", "dormís", "conocen", "traducen", "concluyen", "ellos", "duermen", "Отличить инфинитив отклоняющегося глагола от правильного глагола невозможно, поэтому следует уточнять спряжеУРОК 6 (Lección 6)", "ние глагола по специальным грамматическим справочникам. В данном пособии при отклоняющемся глаголе будет указана его группа: pensar (1а).", "Проспрягайте и запомните следующие отклоняющиеся глаголы:", "1a grupo", "1b grupo", "2 grupo", "3 grupo", "atender", "acostarse", "servir", "advertir", "обслуживать", "ложиться", "служить", "предупреждать", "cerrar", "almorzar", "seguir", "mentir", "закрывать", "обедать", "продолжать", "лгать", "despertar", "jugar", "despedirse", "preferir", "будить", "играть", "прощаться", "предпочитать", "empezar", "recordar", "reír", "начинать", "помнить", "смеяться", "4 grupo", "5a grupo", "5b grupo", "6 grupo", "dormir", "ofrecer", "conducir", "construir", "спать", "предлагать", "вести", "строить", "(машину)", "morir", "parecer", "infl uir", "умирать", "казаться", "влиять", "producir", "производить", "huir", "убегать", "В испанском языке важно не только научиться спрягать глаголы, но и запомнить предложное управление некоторых глаголов, то есть с какими предлогом употребляется тот или иной глагол:", "pensar en думать о", "empezar a + infi nitivo начинать что-то делать", "jugar a играть в", "despedirse de попрощаться с", "reír de смеяться над", "Например:", "Pienso en mi proyecto.", "Я думаю о своем проекте.", "Paco pide tu ayuda.", "Пако просит у тебя помощи.", "Empiezo a comer.", "Я начинаю есть.", "Ellos juegan al fútbol en el patio.", "Они играют в футбол во дворе.", "Volvéis del cine en taxi.", "Вы возвращаетесь из кинотеатра на такси.", "Nos despedimos de doña", "Мы прощаемся с доньей ЭнкарEncarnación y de su casa.", "насьон и с ее домом.", "Tú sirves de ejemplo para tus", "Ты служишь примером для своhermanos.", "их братьев.", "¿Por qué ríes de tu tía?", "Почему ты смеешься над своей", "тетей?", "Conduzco mal el coche. Lo", "Я плохо вожу машину. Мне", "siento.", "жаль. / Я сожалею об этом.", "Los amigos advierten que el", "Друзья предупреждают, что", "concierto ya empieza.", "концерт уже начинается."]}], "7": [{"h": "§1. Обозначение часового времени", "b": ["В испанском языке при обозначении времени слово hora f час используется только в вопросе, а в ответах сохраняется лишь определенный артикль этого существительного. В разговорной речи слово minuto m минута также не употребляется.", "¿Qué hora es?", "Который час? / Сколько времени?", "1:00", "Es la una en punto.", "Сейчас ровно час.", "2:00 Son las dos (tres, cuatro,", "Сейчас 2 часа (3, 4, 5, 6, 7,", "11:00", "cinco, seis, siete, ocho,", "8, 9, 10, 11) ровно.", "nueve, diez, once) en", "punto.", "12:00", "Son las doce.", "Сейчас 12 часов. Полдень.", "Es mediodía.", "24:00", "Es medianoche.", "Полночь.", "9:05", "Son las nueve y cinco.", "Пять минут десятого.", "9:10", "Son las nueve y diez.", "Десять минут десятого.", "9:15", "Son las 9 y cuarto / quince. Четверть десятого /15", "минут десятого.", "9:20", "Son las 9 y veinte.", "20 минут десятого.", "9:30", "Son las 9 y media.", "Половина десятого.", "9:40", "Son las diez menos veinte.", "Без двадцати десять.", "9:45", "Son las 10 menos cuarto.", "Без четверти десять.", "9:50", "Son las 10 menos diez.", "Без десяти десять.", "В испанском языке в разговорной речи используется 12-часовой формат времени, поэтому для уточнения, о какой половине дня идет речь, употребляют описательные конструкции со словами «утра», «дня», «вечера», «ночи»:", "madrugada f", "рассвет / раннее утро", "с 1:00 до 5:00", "mañana f", "утро", "с 6:00 до 12:00", "tarde f", "день / вечер", "с 13:00 до 20:00", "noche f", "вечер / ночь", "с 20:00 до 24:00", "Например:", "2:00", "Son las dos de la madrugada.", "7:00", "Son las siete de la mañana.", "15:00", "Son las tres de la tarde.", "21:00", "Son las nueve de la noche.", "1:00", "Es la una de la madrugada.", "13:00", "Es la una de la tarde.", "Во сколько? / В котором часу?", "¿A qué hora?", "A las 10 de la mañana en punto.", "Ровно в 10 часов утра.", "A la una de la tarde.", "В час дня.", "A las diez y media de la noche.", "В половине одиннадцатого", "вечера.", "Al mediodía.", "В полдень.", "A la medianoche.", "В полночь.", "Выражения por la mañana – por las mañanas утром – по утрам, por la(s) tarde(s) днем, por la(s) noche(s) вечером / ночью, вечерами /ночами употребляются, когда не указано точное время:", "Por las mañanas José toma café.", "Por la tarde yo trabajo.", "Por la noche descansamos.", "\u0002 Прочитайте и запомните слова и полезные выражения, относящиеся к часовому времени:", "reloj m", "часы (предмет)", "despertador m", "будильник", "hora f", "час", "media hora", "полчаса", "minuto m", "минута", "segundo m", "секунда", "ahora", "сейчас", "tiempo m", "время", "a tiempo", "вовремя", "a eso de las… tres", "около… трех", "en cinco horas", "за пять часов", "dentro de diez minutos", "через десять минут", "después de las seis", "после шести", "retraso m", "опоздание", "llegar con retraso de 2", "прибыть / приехать / прийти", "horas", "с двухчасовым опозданием", "llegar tarde", "опоздать", "desde las 7 hasta las 9 /", "с 7 до 9", "de 7 a 9"]}, {"h": "§2. Возвратные (местоименные) глаголы", "b": ["Возвратные (местоименные) глаголы в инфинитиве оканчиваются на возвратное местоимение –se.", "Сравните:", "llamar звать", "llamarse зваться, называться", "preparar готовить", "prepararse para готовиться к", "encontrar находить", "encontrarse находиться", "dormir спать", "dormirse засыпать", "despertar будить", "despertarse просыпаться", "ir ходить", "irse уходить", "sentir сожалеть", "sentirse чувствовать себя", "hacer делать", "hacerse + прилаг. / сущ. стать", "hacerse rico разбогатеть /", "стать богатым", "hacerse amigos подружиться /", "стать друзьями", "poner положить", "ponerse надеть на себя", "ponerse + прилаг. становиться", "ponerse rojo покраснеть", "ponerse blanco побледнеть", "ponerse moreno загореть", "При спряжении возвратное местоимение –se изменяется по лицам и ставится перед личной формой глагола.", "llamarse зваться / называться", "yo", "me llamo", "nosotros (-as)", "nos llamamos", "tú", "te llamas", "vosotros (-as)", "os llamáis", "él, ella, usted se llama", "ellos (-as), ustedes se llaman", "С инфинитивом и герундием возвратное местоимение –se изменяется по лицам и пишется слитно и после неличной формой глагола.", "prepararse готовиться", "yo", "me preparo", "quiero prepararme", "tú", "te preparas", "quieres prepararte", "él, ella, usted", "se prepara", "quiere prepararse", "nosotros (-as)", "nos preparamos", "queremos prepararnos", "vosotros (-as)", "os preparáis", "queréis prepararos", "ellos(-as), ustedes", "se preparan", "quieren prepararse", "Например:", "Me preparo para los exámenes.", "Я готовлюсь к экзаменам.", "Tenemos que prepararnos para", "Нам надо подготовиться к", "la entrevista.", "интервью.", "\u0002 Прочитайте и запомните возвратные глаголы, которые используются для описания распорядка дня:", "despertarse (1a)", "просыпаться", "levantarse", "вставать", "lavarse", "умываться", "limpiarse (los dientes)", "чистить (зубы)", "bañarse", "мыться / купаться", "ducharse", "принимать душ", "secarse", "вытираться", "afeitarse", "бриться", "peinarse", "причесываться", "maquillarse", "краситься", "vestirse (2)", "одеваться", "irse", "уходить", "quitarse", "снимать с себя", "despedirse de (2)", "прощаться c", "acostarse (1b)", "ложиться спать", "dormirse (4)", "засыпать"]}, {"h": "§3. Герундий. Конструкция sin+infi nitivo", "b": ["Герундий (gerundio) относится к неличным формам глагола.", "Он соединяет в себе признаки глагола и наречия и является неУРОК 7 (Lección 7)", "изменяемой формой. По свойствам и функциям испанский герундий можно сравнить с русским деепричастием.", "Герундий образуется с помощью следующих суффиксов, которые присоединяются к основе глагола:", "1 спряжение", "hablar", "-ando", "→ hablando", "2 спряжение", "comer", "-iendo", "→ comiendo", "3 спряжение", "vivir", "-iendo", "→ viviendo", "У ряда глаголов особые формы герундия. Их надо запомнить:", "leer →", "leyendo", "caer →", "cayendo", "creer →", "creyendo", "traer →", "trayendo", "oír →", "oyendo", "decir →", "diciendo", "ir →", "yendo", "poder →", "pudiendo", "venir →", "viniendo", "Герундий отклоняющихся глаголов 2 и 3 группы меняет корневую гласную -е- на гласную -i-:", "seguir → siguiendo", "sentir → sintiendo", "servir → sirviendo", "preferir → prefiriendo", "pedir → pidiendo", "Герундий отклоняющихся глаголов 4 группы меняет корневую гласную -o- на гласную -u-:", "dormir → durmiendo", "morir → muriendo", "У герундия отклоняющихся глаголов 6 группы в суффиксе появляется -y-:", "construir → construyendo", "concluir → concluyendo", "Герундий часто встречается в сочетании с глаголом estar.", "Конструкция estar + gerundio используется в испанском языке для выражения действия в процессе его развития.", "Сравните:", "José lee mucho.", "Хосе много читает. (сообщение", "о факте)", "José está leyendo", "Хосе читает письмо.", "una carta.", "(в данный момент, сообщение", "о действии как о процессе)", "Возвратное местоимение -se изменяется по лицам и пишется слитно в конце герундия.", "lavarse", "yo", "estoy lavándome", "tú", "estás lavándote", "él, ella, usted", "está lavándose", "nosotros (-as)", "estamos lavándonos", "vosotros (-as)", "estáis lavándoos", "ellos (-as), ustedes", "están lavándose", "Герундий может употребляться в предложении самостоятельно как обстоятельство образа действия, он относится к", "глаголу-сказуемому и отвечает на вопрос как? каким образом?", "В этом случае он переводится на русский язык с помощью деепричастия или придаточного предложения:", "Papá toma café leyendo el", "Папа пьет кофе, читая", "periódico.", "газету.", "Escribiendo los deberes", "Когда я пишу домашнее", "escucho la música.", "задание, я слушаю музыку.", "Беспредложная форма винительного и дательного падежей личных местоимений me, te, le, lo, la, nos, os, les, los, las ставится после герундия и пишется с ним слитно:", "¿Dónde están ellos?", "Где они? Мы их ждем.", "Estamos esperándolos.", "Tú siempre ríes", "Ты всегда смеешься,", "contándonos esta historia.", "рассказывая нам эту", "историю.", "¿Qué hace Adela? – Está", "Что делает Адела? – Она", "preparándoos el desayuno.", "готовит вам завтрак.", "¿Va a comprarle Ud. a su", "Вы собираетесь купить", "hija un abrigo? – Ya estoy", "дочери пальто? – Я ей его уже", "comprándoselo.", "покупаю.", "Для того, чтобы передать значение отрицательной характеристики действия, в испанском языке используется оборот sin", "+ infi nitivo:", "¿Por qué dices tales cosas", "Почему ты говоришь такие", "sin pensar en tus amigos?", "вещи, не думая о своих друзьях?", "Герундий всегда употребляется после глаголов seguir, continuar продолжать: seguir (continuar) + gerundio", "El sigue (continúa)", "Он продолжает работать", "trabajando en el banco.", "в банке."]}], "8": [{"h": "§1. Наречия. Образование наречий", "b": ["В испанском языке, также как и в русском, наречия являются неизменяемой частью речи:", "ahora", "сейчас", "bien", "хорошо", "hoy", "сегодня", "mal", "плохо", "mañana", "завтра", "casi", "почти", "ayer", "вчера", "primero", "сначала", "tarde", "поздно", "después", "потом, после", "temprano", "рано", "luego", "затем, после", "cerca", "близко", "arriba", "наверху, вверх", "lejos", "далеко", "abajo", "внизу, вниз", "siempre", "всегда", "fuera", "снаружи", "nunca", "никогда", "dentro", "внутри", "С помощью суффикса –mente можно образовать наречие от прилагательного. Если прилагательное одного окончания, то суффикс –mente присоединяется непосредственно к нему:", "difícil + mente → difícilmente", "трудный → трудно", "feliz + mente → felizmente", "счастливый → счастливо", "alegre + mente → alegremente", "веселый → весело", "Если прилагательное двух окончаний, то суффикс –mente присоединяется к прилагательному в форме женского рода единственного числа. Если прилагательное имеет графическое ударение, оно сохраняется при написании наречия:", "raro/a rara + mente → raramente", "редко", "alto/a alta + mente → altamente", "высоко / громко", "rápido/a rápida + mente → rápidamente", "быстро", "При употреблении двух или более наречий, оканчивающихся на -mente, суффикс прибавляется только к последнему наречию, остальные сохраняют форму прилагательного женского рода единственного числа:", "El habla alta, clara y", "Он говорит громко, ясно и", "correctamente.", "правильно."]}, {"h": "§2. Степени сравнения наречий", "b": ["Наречия в испанском языке имеют три степени сравнения:", "положительную, сравнительную и превосходную.", "Положительная степень:", "¿Por qué vienes tarde?", "Почему ты приходишь поздно?", "El museo está cerca.", "Музей находится близко.", "Vamos a hablar seriamente.", "Давай поговорим серьезно.", "Сравнительная степень образуется по схеме:", "más + наречие в положительной степени + que", "menos + наречие в положительной степени +que", "tan+ наречие в положительной степени + como", "El viene más tarde que yo.", "Он приходит позже меня.", "El viene menos tarde que yo.", "Он приходит раньше меня.", "El viene tan tarde como yo.", "Он приходит так же поздно,", "как и я.", "Некоторые наречия имеют особую форму сравнительной", "степени:", "bien | → mejor", "хорошо | лучше", "mal | → peor", "плохо | хуже", "mucho → más", "много | больше", "poco → menos", "мало | меньше", "Например:", "Canto bien/mal.", "Я пою хорошо /плохо.", "Él canta mejor/peor que yo.", "Он поет лучше /хуже меня.", "Tú cantas tan bien / tan mal", "Ты поешь так же хорошо /", "como yo.", "плохо, как и я.", "Leo mucho / poco.", "Я много / мало читаю.", "Él lee más / menos que tú.", "Он читает больше / меньше", "тебя.", "Наречие mucho не употребляется вместе с наречием tan, вместо этого в испанском языке используется наречие tanto – так много, столько:", "¡Elena trabaja tanto!", "Елена столько (так много) работает!", "Превосходная степень бывает относительной и абсолютной.", "Относительная превосходная степень образуется по схеме:", "lo + наречие в сравнительной степени + posible", "Quieres aprender el español", "Ты хочешь выучить испанский", "lo más pronto posible.", "как можно быстрее.", "Абсолютная превосходная степень образуется по схемам:", "• muy + наречие в положительной степени", "• наречие в положительной степени + суффикс –ísimo", "• прилагательное ж.р. в превосходной. степени с суффиксом", "-ísima + -mente", "Yo salgo de casa muy temprano /", "Я выхожу из дома очень", "tempranísimo.", "рано.", "Tú nadas muy rápido/ rapidísimo /", "Ты плаваешь очень быстро.", "rapidísimamente.", "Наречие mucho не употребляется вместе с наречием muy, поэтому используется только форма с суффиксом -ísimo:", "Carlos ríe muchísimo.", "Карлос очень много смеется."]}, {"h": "§3. Наречия también / tampoco", "b": ["Наречие también тоже употребляется в утвердительных и вопросительных предложениях. Наречие tampoco тоже не употребляется только в отрицательных предложениях.", "Например:", "Nosotros somos jóvenes. Vosotros", "Мы молоды. Вы тоже", "también sois jóvenes.", "молоды.", "Quiero ir al teatro y tú, ¿también", "Я хочу пойти в театр, а", "quieres ir al teatro? – Sí, yo también", "ты тоже хочешь пойти в", "quiero ir al teatro. / Sí, quiero ir al", "театр? – Да, я тоже хочу", "teatro también.", "пойти в театр.", "No somos viejos. Vosotros tampoco", "Мы не старые. Вы тоже не", "sois viejos / Vosotros no sois viejos", "старые.", "tampoco.", "No quiero ir al teatro y ¿tú? – Yo", "Я не хочу идти в театр, а", "tampoco quiero ir al teatro. / Yo no", "ты? – Я тоже не хочу идти", "quiero ir al teatro tampoco.", "в театр."]}, {"h": "§4. Количественные числительные (100 –", "b": ["1.000.000.000)", "Прочитайте и запомните числительные:", "100 ciento, cien", "1000 mil", "101 ciento uno", "1001 mil uno", "115 ciento quince", "1002 mil dos", "132 ciento treinta y dos", "1115 mil ciento quince", "200 doscientos/ -as", "1200 mil doscientos", "300 trescientos/ -as", "2000 dos mil", "400 cuatrocientos/ -as", "2014 dos mil catorce", "500 quinientos/ -as", "100 000 cien mil", "600 seiscientos/ -as", "200 000 doscientos mil", "700 setecientos/ -as", "1 000 000 un millón", "800 ochocientos/ -as", "2 000 000 dos millones", "900 novecientos/ -as", "1.000.000.000 mil millones", "Числительные от 200 до 900 в испанском языке согласуются в роде с существительным, к которому они относятся:", "seiscientos cincuenta y cuatro euros 654 евро", "quinientas quince bicicletas 515 велосипедов", "doscientas una páginas 201 страница", "Числительное mil не имеет формы множественного числа.", "Числительное ciento перед числительными mil и millón имеет форму cien:", "treinta mil metros cuadrados 30 000 м²", "cien mil automóviles 100 000 автомобилей", "Числительное millón имеет форму множественного числа, между числительным millón и существительным, к которому оно относится, ставится предлог de:", "un millón cuatrocientos mil periódicos 1 400 000 газет diecisiete millones de rublos 17 000 000 рублей", "В испанском языке нет слова, соответствующего русскому миллиард. Для этого используется сочетание mil millones:", "ciento veinte mil millones 120 миллиардов"]}, {"h": "§5. Порядковые числительные", "b": ["Запомните формы порядковых числительных:", "1º – primero", "1ª – primera", "2º – segundo", "2ª – segunda", "3º – tercero", "3ª – tercera", "4º – cuarto", "4ª – cuarta", "5º – quinto", "5ª – quinta", "6º – sexto", "6ª – sexta", "7º – séptimo", "7ª – séptima", "8º – octavo", "8ª – octava", "9º – noveno", "9ª – novena", "10º – décimo", "10ª – décima", "11º – undécimo", "11ª – undécima", "12º – duodécimo", "12ª – duodécima", "Порядковые числительные употребляются с определенным артиклем:", "el segundo piso", "второй этаж", "la quinta casa", "пятый дом", "Порядковые числительные primero и tercero сокращаются до формы primer и tercer перед существительными мужского рода единственного числа:", "el primer día", "первый день", "la primera noche", "первая ночь", "el tercer día", "третий день", "la tercera noche", "третья ночь", "Порядковые числительные в испанском языке, как и в русском, согласуются с существительными, к которым они относятся в роде и числе:", "el quinto piso → los quintos pisos", "пятый этаж пятые этажи", "la quinta página → las quintas páginas", "пятая страница | пятые страницы", "Например:", "Vivo en el tercer piso.", "Я живу на третьем этаже.", "El museo está en la segunda", "Музей находится во втором", "bocacalle a la izquierda.", "переулке налево.", "No comprendes la quinta", "Ты не понимаешь пятый", "pregunta.", "вопрос.", "Tomamos el sexto taxi.", "Мы садимся в шестое такси.", "После двенадцатого обычно употребляются количественные числительные:", "Estoy haciendo el ejercicio", "Я делаю семнадцатое", "diecisiete en la página ciento", "упражнение на сто сорок", "cuarenta y cinco de la lección", "пятой странице двадцать", "veintiuna.", "первого урока.", "Порядковые числительные используются при именах царей, королей и т.п. (с 1-го до 10-го):", "Pedro I (primero)", "Felipe II (segundo)", "Carlos V (quinto)", "Alfonso XII (doce)", "В официальной речи при указании годовщин, торжественных дат принято употреблять порядковые числительные:", "Para el quingentésimo* aniversario", "К пятисотлетию", "del descubrimiento de América.", "открытия Америки.", "En el vigésimo quinto congreso.", "На двадцать пятом съезде.", "* Полная таблица порядковых числительных представлена в Приложении 1."]}], "9": [{"h": "§1. Степени сравнения прилагательных", "b": ["Прилагательные в испанском языке имеют три степени сравнения.", "Положительная степень сравнения:", "un viaje largo", "долгая поездка", "una casa nueva", "новый дом", "Сравнительная степень образуется по схеме:", "más + прилагательное в положительной степени + que", "menos + прилагательное в положительной степени +que tan+ прилагательное в положительной степени + como", "Lola es más alta que Ana.", "Лола выше, чем Анна.", "Lola es menos alta que Ana.", "Лола ниже, чем Анна.", "Lola es tan alta como Ana.", "Лола такая же высокая,", "как Анна.", "Некоторые испанские прилагательные имеют особую форму сравнительной степени:", "bueno | →", "mejor", "хороший", "лучше", "malo →", "peor", "плохой", "хуже", "grande →", "mayor старше (о возрасте)", "большой", "más grande больше (о размере)", "pequeño →", "menor моложе (о возрасте)", "маленький", "más pequeño меньше (о размере)", "Превосходная степень делится на относительную и абсолютную.", "Относительная превосходная степень сравнения прилагательных образуется по схеме:", "• el/la + прилагательное в сравнительной степени + de", "Este aeropuerto es el más", "Этот аэропорт – самый", "grande del mundo.", "большой в мире.", "Абсолютная превосходная степень образуется по схемам:", "• un/una + существительное + muy + прилагательное в положительной степени", "• un/una + существительное + прилагательное с суффиксом", "–ísimo/a", "Es un viaje muy caro.", "Это очень дорогая поездка.", "Es un viaje carísimo.", "Это дорогущая поездка.", "Например:", "Este avión es tan pequeño como aquél.", "El viaje a Cuba es más caro que el viaje a Europa.", "El hotel “Neptuno” es muy viejo.", "Es un tema difi cilísimo.", "Pedro es el más alto de nuestra familia.", "Tu coche es mejor / peor que mi coche.", "Mi hermana es 3 años menor / mayor que yo.", "Eres tan guapa como tu mamá."]}, {"h": "§2. Предложные формы", "b": ["местоимений-дополнений", "Личные местоимения в испанском языке изменяются по падежам. В настоящее время существует четыре падежа: nominativo именительный, dativo дательный, acusativo винительный и", "preposicional предложный. Местоимение в предложном падеже употребляется с различными предлогами: de, en, para, por, con, sin и др. Личные местоимения с предлогами сохраняют свою форму именительного падежа, кроме 1-го и 2-го лица единственного числа.", "Именительный падеж", "Предложная форма (de, en,", "para, por, sin, sobre, con)", "yo", "mí", "tú", "ti", "él", "él", "ella", "ella", "usted", "usted", "nosotros (-as)", "nosotros (-as)", "vosotros (-as)", "vosotros (-as)", "ellos (-as)", "ellos (-as)", "ustedes", "ustedes", "Предлог con с местоимениями 1-го и 2-го лица единственного числа имеет особые формы: conmigo со мной, contigo с тобой.", "Например:", "Ana habla de mí.", "José piensa en ti.", "El jefe pregunta por usted.", "¿Puedes hacerlo por mí?", "Estas rosas son para ellas.", "Eva cena sin nosotros.", "Mario se casa con ella.", "Ella no quiere venir conmigo, quiere ir contigo."]}, {"h": "§3. Причастие", "b": ["Причастие (participio) является неличной формой глагола и выполняет функцию определения по отношению к существительному, согласуясь с ним в роде и числе. Причастие сообщает о результате действия того глагола, от которого образовано.", "Причастия от глаголов 1-го спряжения образуются путем прибавления суффикса -ado, а от глаголов 2-го и 3-го спряжений суффикса -ido:", "descansar", "→", "descansado", "отдыхать", "отдохнувший", "vender", "→", "vendido", "продавать", "проданный", "vivir", "→", "vivido", "жить", "прожитый", "Ряд глаголов имеет особую форму причастий:", "abrir – abierto", "открывать – открытый", "cubrir – cubierto", "накрывать – накрытый", "decir – dicho", "сказать – сказанный", "hacer – hecho", "делать – сделанный", "escribir – escrito", "написать – написанный", "romper – roto", "ломать – сломанный", "рвать – рваный", "разбить – разбитый", "morir – muerto", "умереть – мертвый", "poner – puesto", "положить – положенный", "volver – vuelto", "вернуться – возвращенный", "ver – visto", "видеть – увиденный", "resolver – resuelto", "решать – решенный", "Глаголы, производные от вышеперечисленных исключений, сохраняют те же особенности образования причастия:", "escribir → escrito", "poner → puesto", "prescribir → prescrito", "proponer → propuesto", "прописать", "предлагать", "describir → descrito", "componer → compuesto", "описывать", "составлять / сочинять (о", "envolver → envuelto", "музыке)", "заворачивать", "disponer → dispuesto", "располагать", "volver → vuelto", "cubrir → cubierto", "devolver → devuelto", "descubrir → descubierto", "возвращать", "раскрывать/обнаруживать", "Причастие употребляется с глаголом estar для образования глагольной конструкции, которая выражает состояние, являющееся результатом предшествующего действия. Причастие в данной конструкции согласуется в роде и числе с подлежащим.", "Причастие может употребляться с глаголом tener. В данной конструкции оно согласуется в роде и числе с прямым дополнением.", "Сравните:", "Los billetes están comprados.", "Tengo comprados los billetes.", "Билеты куплены.", "У меня куплены билеты.", "Los problemas están", "Tenemos resueltos los", "resueltos.", "problemas.", "Проблемы решены.", "У нас решены проблемы.", "La maleta todavía no está", "¿Ya tienes hecha la maleta?", "hecha.", "Чемодан еще не собран.", "У тебя уже собран", "чемодан?"]}, {"h": "§4. Pretérito perfecto compuesto", "b": ["(сложное прошедшее время)", "Pretérito perfecto compuesto (сложное прошедшее время)", "выражает законченное действие, имеющее непосредственную связь с настоящим.", "Pretérito perfecto образуется с помощью вспомогательного глагола haber в настоящем времени и participio (причастия)", "смыслового глагола. Причастие в этом случае не изменяется ни в роде, ни в числе.", "haber + participio", "I pagar", "II vender", "III recibir", "платить", "продать", "получать/", "встречать", "he pagado", "he vendido", "he recibido", "
