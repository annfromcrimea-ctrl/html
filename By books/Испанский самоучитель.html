<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> — интерактивный учебник</title>
<style>
:root{
 --teal:#0f766e; --teal-d:#115e59; --teal-l:#14b8a6; --bg:#f6f8f7; --card:#ffffff;
 --ink:#1f2937; --mut:#6b7280; --line:#e5e7eb; --warm:#ea580c; --warm-l:#fff7ed;
 --gold:#f59e0b; --ok:#16a34a; --ok-bg:#f0fdf4; --err:#dc2626; --err-bg:#fef2f2;
 --rojo:#c60b1e; --amarillo:#ffc400; --azul:#1e5aa8; --radius:14px;
 --paper:#fdfcf7; --grid:#dfe8f3; --margin:#f2b8b5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 color:var(--ink);line-height:1.6;position:relative;
 background-color:var(--paper);
 background-image:
 linear-gradient(var(--grid) 1px, transparent 1px),
 linear-gradient(90deg, var(--grid) 1px, transparent 1px);
 background-size:100% 28px, 28px 100%;
 background-attachment:fixed;
}
body::before{
 content:"";position:fixed;top:0;bottom:0;left:clamp(8px,4vw,64px);width:2px;
 background:var(--margin);opacity:.55;pointer-events:none;z-index:0;
}
body::after{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
 background:radial-gradient(circle at 12% 8%, rgba(255,196,0,.06), transparent 40%),
 radial-gradient(circle at 88% 92%, rgba(198,11,30,.05), transparent 45%);
}
.es{font-family:Georgia,"Times New Roman",serif}
a{color:var(--teal);text-decoration:none}
button{font-family:inherit}
header.top{position:sticky;top:0;z-index:40;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);
 background:linear-gradient(90deg,var(--rojo) 0%,var(--rojo) 32%,var(--amarillo) 32%,var(--amarillo) 36%,var(--rojo) 36%);}
header.top .bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(140,8,20,.86)}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.brand .flag{font-size:20px}
.navlinks{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.navlinks button{border:0;background:transparent;color:#ffe9b8;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px}
.navlinks button:hover{background:rgba(255,255,255,.14)}
.navlinks button.on{background:#fff;color:var(--rojo)}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 90px;position:relative;z-index:1}
.hero{color:#fff;border-radius:var(--radius);padding:30px 28px;margin-bottom:18px;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#8c0814,#c60b1e 55%,#e0341f);box-shadow:0 10px 30px rgba(140,8,20,.25)}
.hero svg.deco{position:absolute;right:-10px;bottom:-14px;opacity:.16;width:230px;height:230px}
.hero h1{margin:0 0 8px;font-size:26px;line-height:1.25;position:relative}
.hero p{margin:0;color:#ffe0c9;max-width:760px;position:relative}
.statrow{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap;position:relative}
.stat{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 14px;font-size:13px;backdrop-filter:blur(2px)}
.stat b{font-size:20px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,23,42,.04)}
.card h2{margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lessonchip{border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
.lessonchip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--rojo),var(--amarillo))}
.lessonchip:hover{border-color:var(--teal-l);transform:translateY(-1px);box-shadow:0 6px 18px rgba(15,118,110,.10)}
.lessonchip h3{margin:0 0 4px;font-size:15px;color:var(--teal)}
.lessonchip .sub{color:var(--mut);font-size:13px}
.lessonchip .meta{font-size:12px;color:var(--mut);margin-top:8px}
.chipbar{height:6px;background:#eef2f1;border-radius:4px;margin-top:10px;overflow:hidden}
.chipbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-l));width:0%;transition:.3s}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef7f6;color:var(--teal-d)}
.section{display:none}
.section.on{display:block}
.viewtitle{font-size:24px;margin:6px 0 14px;display:flex;align-items:center;gap:10px}
.lede{color:var(--mut);margin-top:-6px;margin-bottom:16px}
.block{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.block>h4{margin:0;padding:12px 18px;font-size:15px;background:#f4faf9;border-bottom:1px solid var(--line);color:var(--teal-d);display:flex;justify-content:space-between;align-items:center;gap:10px}
.block .bd{padding:16px 18px}
.grammar h5{margin:16px 0 6px;color:#0f3d38;font-size:15px;display:flex;align-items:center;gap:7px}
.grammar h5:first-child{margin-top:0}
.grammar p{margin:6px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.t th{background:#f4faf9;font-weight:700}
.note{background:var(--warm-l);border-left:4px solid var(--warm);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;font-size:14px}
.culture{background:#eef6ff;border-left:4px solid var(--azul);padding:12px 16px;border-radius:0 10px 10px 0;margin:12px 0}
.culture h6{margin:0 0 4px;color:#1d4ed8;font-size:14px;display:flex;align-items:center;gap:6px}
.vocablist{columns:2;column-gap:26px;font-size:14px}
@media(max-width:640px){.vocablist{columns:1}}
.vocablist .v{break-inside:avoid;padding:3px 0;border-bottom:1px dashed #f0f2f1}
.v .es{font-weight:700}
.v .ru{color:var(--mut)}
.speak{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--teal-l);background:#f0fdfa;color:var(--teal-d);border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;transition:.15s}
.speak:hover{background:#cffaf5}
.speak.on{background:var(--gold);border-color:var(--gold);color:#3b2f00}
.exo{margin-top:8px;padding-top:12px;border-top:1px solid #f0f2f1}
.exo .q{font-weight:600;margin-bottom:6px}
.exo .esq{font-weight:600;margin-bottom:6px}
.item{padding:10px 0;border-bottom:1px solid #f4f6f5}
.item:last-child{border-bottom:0}
.row-answer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
input[type=text]{border:1px solid #cbd5d1;border-radius:8px;padding:7px 10px;font-size:14px;min-width:220px;background:#fffdf8}
input:focus{outline:2px solid var(--teal-l);border-color:var(--teal-l)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid #cbd5d1;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px;user-select:none;transition:.12s}
.chip:hover{border-color:var(--teal-l)}
.chip.used{opacity:.35;pointer-events:none}
.sentence-box{border:2px dashed #cbd5d1;border-radius:8px;min-height:38px;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;background:#fffdf8}
.sentence-box .tok{background:var(--teal);color:#fff;border-radius:6px;padding:3px 8px;font-size:14px;cursor:pointer}
.btn{border:0;border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:14px;transition:.15s}
.btn-pri{background:var(--teal);color:#fff}
.btn-pri:hover{background:var(--teal-d)}
.btn-ghost{background:#eef2f1;color:var(--ink)}
.btn-ghost:hover{background:#e2e8e7}
.btn-ok{background:#dcfce7;color:#166534}
.btn-warn{background:var(--warm);color:#fff}
.btn-sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ansfeed{margin-top:6px;font-size:14px}
.feed-ok{color:var(--ok)}
.feed-err{color:var(--err);font-weight:600}
.reveal{border:0;background:transparent;color:var(--teal);cursor:pointer;font-size:13px;text-decoration:underline}
.ans-hide{display:none;background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:14px}
.result-msg{margin-top:8px;font-weight:700;font-size:15px}
.choices{display:grid;gap:6px}
.choice{border:1px solid #d1d5db;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px;background:#fff}
.choice:hover{border-color:var(--teal-l)}
.choice.sel{border-color:var(--teal);background:#f0fdfa}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.bad{border-color:var(--err);background:var(--err-bg)}
/* сопоставление */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:6px}
.mitem{border:1px solid #cbd5d1;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px;background:#fff}
.mitem.sel{border-color:var(--teal);background:#f0fdfa}
.mitem.done{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.mitem.wrong{border-color:var(--err);background:var(--err-bg)}
.fcwrap{display:flex;flex-direction:column;align-items:center}
.fccard{width:min(440px,92%);height:210px;perspective:1000px;cursor:pointer}
.fcin{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fccard.flip .fcin{transform:rotateY(180deg)}
.fcface{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;padding:16px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.fc-front{background:linear-gradient(135deg,var(--teal),var(--teal-l));color:#fff}
.fc-back{background:#fff;color:var(--ink);transform:rotateY(180deg);border:1px solid var(--line)}
.fc-controls{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.fccounter{color:var(--mut);font-size:13px;margin-top:10px}
.dic-form{display:grid;gap:8px;margin-bottom:14px}
.dic-form .fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
select,textarea{border:1px solid #cbd5d1;border-radius:8px;padding:7px 10px;font-size:14px;font-family:inherit;background:#fffdf8}
textarea{min-height:44px;resize:vertical}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.data th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.bigbar{height:16px;background:#eef2f1;border-radius:99px;overflow:hidden}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-l));width:0%;transition:.4s}
.pct{font-size:28px;font-weight:800;color:var(--teal)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px;border-top:1px solid var(--line);margin-top:10px;position:relative;z-index:1}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.pill.new{background:#fff7ed;color:#c2410c}
.pill.wip{background:#fef9c3;color:#854d0e}
.pill.done{background:#dcfce7;color:#166534}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.audio-note{font-size:13px;color:var(--mut);background:#fff8e6;border:1px dashed var(--gold);border-radius:8px;padding:8px 12px;margin:10px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:90}
.toast.show{opacity:1}
.dlog{border:1px solid #dbe7e5;border-radius:10px;margin:8px 0;overflow:hidden;background:#fff}
.dlog .speaker{background:#f0fdfa;color:var(--teal-d);font-weight:700;padding:5px 10px;font-size:12px}
.dlog .line{padding:7px 12px;font-size:15px}
.dlog .line .trans{color:var(--mut);font-size:13px;display:block}
.dlog .line .sp{float:right}



.bkbtn{padding:8px 14px;margin:4px;border-radius:8px;border:1px solid #e2d9c6;background:#fffdf8;cursor:pointer;font-size:14px;font-weight:600;color:#7a3b1f}
.bkbtn.on,.bkbtn:hover{background:var(--red);color:#fff;border-color:var(--red)}
.booknav{display:flex;flex-wrap:wrap;gap:6px}
.bkbtn{position:relative;padding:7px 12px;border:1px solid #e2e8f0;background:#fff;border-radius:9px;cursor:pointer;font-size:14px}
.bkbtn.on{background:var(--rojo);color:#fff;border-color:var(--rojo);font-weight:700}
.bkn{display:inline-block;margin-left:6px;font-size:11px;background:#f1f5f9;color:#475569;border-radius:999px;padding:1px 6px}
.bkbtn.on .bkn{background:rgba(255,255,255,.25);color:#fff}
.bk{border-left:5px solid var(--gold)}
.bkhead{font-size:15px;color:#6b7280;line-height:1.6}
.sec{padding:10px 0;border-bottom:1px dashed #ece4d4}
.sec:last-child{border-bottom:none}
.sec h4{margin:0 0 6px;color:var(--red);font-size:15.5px}
.sec p{margin:0 0 6px;font-size:14.5px;line-height:1.65;color:#374151}
.bkx p{margin:0 0 5px}
.bkx{background:#fffdf3;border-radius:8px;padding:10px 12px;margin-top:6px}

.keybtn{background:#eef7f4;border-color:#bfe3da;color:#0f766e}
.keybtn:hover{background:#d9efe9}
.keybox{background:#f2faf7;border-left:4px solid var(--teal);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:6px}
.keybox p{margin:0 0 6px;font-size:14.5px;color:#134e4a}
.kitem{padding:8px 0;border-bottom:1px dashed #cfe8e1}
.kitem:last-child{border-bottom:none}
.kans{margin-top:4px;color:#0f766e;font-size:14.5px}
.kans div{padding:2px 0 2px 12px;border-left:2px solid #bfe3da;margin-bottom:3px}
.gcard{border-left:5px solid var(--gold)}
.grow{display:grid;grid-template-columns:210px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed #eee7d6}
.grow:last-child{border-bottom:none}
.gterm{font-weight:700;color:var(--red)}
.gdef{font-size:14.5px;line-height:1.6;color:#374151}
.sel{padding:8px 10px;border-radius:8px;border:1px solid #d8d2c4;background:#fffdf8;font-size:14px}
@media(max-width:640px){.grow{grid-template-columns:1fr;gap:3px}}
.readcard{border-left:5px solid var(--red)}
.reading{margin:18px 0;padding:16px 18px;background:#fffdf5;border-radius:12px;
 box-shadow:inset 0 0 0 1px #f0e9d8,0 2px 10px rgba(120,100,60,.06);position:relative}
.reading:before{content:"✒️";position:absolute;top:-11px;left:14px;background:#fffdf5;padding:0 6px;font-size:16px}
.rd-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.rd-num{font-weight:700;color:var(--red);font-size:16px}
.rd-es{font-size:17.5px;line-height:1.75;color:#2b2b2b}
.rd-es p{margin:0 0 10px}
.rd-es p:first-letter{font-size:1.05em}
.rd-ru{border-left:3px solid var(--teal);padding:8px 12px;margin:12px 0;background:#f4fbfa;border-radius:0 8px 8px 0;color:#4b5563;font-size:15px}
.rd-ru p{margin:0 0 8px}
.rd-q{margin-top:12px;background:#fff9ec;border-radius:10px;padding:12px 16px;box-shadow:inset 0 0 0 1px #f2e6cc}
.rd-q h4{margin:0 0 8px;color:var(--red);font-size:15px}
.rd-q ol{margin:0;padding-left:22px}
.rd-q li{margin-bottom:9px;line-height:1.55}
.rd-a{display:inline-block;margin-left:6px}
.rd-a .ans-hide{margin-top:5px;background:#eafaf7;border-left:3px solid var(--teal);padding:6px 10px;border-radius:0 6px 6px 0;font-size:14px;color:#0f766e}
.lettura{border-left:5px solid var(--teal);background:#fffdf5;padding:14px 18px;border-radius:0 10px 10px 0;box-shadow:inset 0 0 0 1px #f0ece0}
.lettura .ru-l{color:var(--mut)}
.quizscore{margin-top:10px;font-weight:700}
.searchbox input{width:100%;padding:10px;border:1px solid #cbd5d1;border-radius:9px;font-size:15px}
.tag{font-size:11px;color:#0f766e;background:#ccfbf1;border-radius:5px;padding:1px 6px;margin-left:4px}
.keys{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 16px;margin-top:14px}
.keys h4{margin:0 0 8px;color:#334155;font-size:14px;display:flex;align-items:center;gap:6px}
.keys table{width:100%;border-collapse:collapse;font-size:13px}
.keys td{border-bottom:1px dashed #e2e8f0;padding:4px 6px;vertical-align:top}
.keys td:first-child{color:var(--mut);width:44%}
.keys td:last-child{font-weight:600;color:#0f172a}
.dictation .play{background:var(--azul);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.emoji-big{font-size:22px;line-height:1}

/* ===== мобильная вёрстка (объединённое чтение и общее) ===== */
@media(max-width:640px){
 .wrap,.container,main{padding-left:12px;padding-right:12px}
 .reading{padding:12px 12px;margin:12px 0;border-radius:10px}
 .rd-es{font-size:16px;line-height:1.65}
 .rd-head{flex-direction:column;align-items:flex-start;gap:6px}
 .rd-num{font-size:15px}
 .rd-btns{display:flex;flex-wrap:wrap;gap:6px;width:100%}
 .rd-btns .speak,.rd-btns .reveal{flex:1 1 auto;justify-content:center;min-width:112px}
 .rd-ru{font-size:14.5px;padding:8px 10px}
 .rd-ru p{margin:0 0 8px}
 .rd-q{padding:10px 12px}
 .rd-q ol{padding-left:18px}
 .rd-q li{margin-bottom:10px}
 .grid2{grid-template-columns:1fr !important}
 .hero{padding:20px 16px}
 .hero h1{font-size:22px;line-height:1.25}
 .statrow{gap:8px}
 .stat{flex:1 1 42%;text-align:center;font-size:12px}
 .stat b{font-size:20px}
 .lessonchip{padding:12px 14px}
 .vocablist{columns:1}
 table.t{font-size:13px;display:block;overflow-x:auto;white-space:nowrap}
 .keybox,.keys table{font-size:13px}
 .exo{padding-top:10px}
 .row-answer input[type=text]{width:100%}
 .btn{width:auto}
 .speak{padding:4px 10px}
}
@media(max-width:380px){
 .rd-btns .speak,.rd-btns .reveal{min-width:100%;font-size:12px}
 .hero h1{font-size:19px}
}

/* ===== мобильная доработка: сопоставление, таблицы, переносы ===== */
.match{grid-template-columns:1fr 1fr;gap:10px}
img,svg{max-width:100%;height:auto}
.rd-es,.rd-ru,.rd-q,.exo,.item,td,th{overflow-wrap:anywhere;word-break:break-word}
@media(max-width:640px){
 .match{grid-template-columns:1fr}
 .grow{grid-template-columns:1fr;gap:3px}
 .grow>div:first-child{font-weight:700}
 table.t{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;font-size:13px}
 table.t th,table.t td{padding:6px 8px}
 .keys table{display:block;overflow-x:auto;font-size:13px}
 .choices{grid-template-columns:1fr}
 .lessonchip h3{font-size:15px}
 .viewtitle{font-size:20px}
 .card{padding:14px 12px}
 .rd-btns .speak,.rd-btns .reveal{min-width:0}
}
@media(max-width:420px){
 .rd-btns{width:100%}
 .rd-btns .speak,.rd-btns .reveal{flex:1 1 100%;justify-content:center}
 .stat{flex:1 1 100%}
}
.rd-btns{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ===== меню по группам ===== */
.navlinks{display:flex;gap:16px;flex-wrap:wrap;flex:1;align-items:center}
.navgroup{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-bottom:2px}
.navlabel{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-right:2px;white-space:nowrap}

 theory:`
<h5>1. Испанский алфавит (27 букв)</h5>
<p>Испанцы пользуются латинским шрифтом. Буква <b>Ñ ñ</b> — «визитная карточка» испанского алфавита: в других языках такой буквы нет. Испанский алфавит — один из самых кратких в мире: всего <b>27 букв</b>.</p>
<table class="t"><tr><th>Буква</th><th>Название</th><th>Буква</th><th>Название</th></tr>
<tr><td>A a</td><td>a</td><td>N n</td><td>ene</td></tr>
<tr><td>B b</td><td>be</td><td>Ñ ñ</td><td>eñe</td></tr>
<tr><td>C c</td><td>ce</td><td>O o</td><td>o</td></tr>
<tr><td>D d</td><td>de</td><td>P p</td><td>pe</td></tr>
<tr><td>E e</td><td>e</td><td>Q q</td><td>cu</td></tr>
<tr><td>F f</td><td>efe</td><td>R r</td><td>ere</td></tr>
<tr><td>G g</td><td>ge</td><td>S s</td><td>ese</td></tr>
<tr><td>H h</td><td>hache</td><td>T t</td><td>te</td></tr>
<tr><td>I i</td><td>i</td><td>U u</td><td>u</td></tr>
<tr><td>J j</td><td>jota</td><td>V v</td><td>uve</td></tr>
<tr><td>K k</td><td>ka</td><td>W w</td><td>uve doble</td></tr>
<tr><td>L l</td><td>ele</td><td>X x</td><td>equis</td></tr>
<tr><td>M m</td><td>eme</td><td>Y y</td><td>ye</td></tr>
<tr><td></td><td></td><td>Z z</td><td>zeta</td></tr>
</table>
<p>На испанском говорят более 500 млн человек; в 20 странах мира он является официальным. Мы используем кастильский (испанский) вариант произношения — норму литературного языка.</p>

<h5>2. Гласные</h5>
<p>В испанском языке 5 гласных: <b>A</b> [а], <b>O</b> [о], <b>U</b> [у], <b>E</b> [э], <b>I</b> [и]. В отличие от русских, испанские гласные произносятся более чётко, напряжённо и <b>не редуцируются</b> в безударном положении.</p>

<h5>3. Согласные: как читаются</h5>
<table class="t"><tr><th>Буква</th><th>Чтение</th><th>Примеры</th></tr>
<tr><td>B b / V v</td><td>[б] в начале слова и после m,n; слабое [б] между гласными</td><td>bomba, vaso, Cuba, ave</td></tr>
<tr><td>C c (перед i,e)</td><td>[θ] — глухой межзубный</td><td>cine, cena</td></tr>
<tr><td>C c (перед a,o,u; в конце)</td><td>[к]</td><td>casa, clase</td></tr>
<tr><td>Ch ch</td><td>[ч]</td><td>chico, noche</td></tr>
<tr><td>D d</td><td>[д]; меж зубов между гласными; [θ] ослабленный в конце</td><td>disco, cada, Madrid</td></tr>
<tr><td>G g (перед i,e)</td><td>[х]</td><td>gente, gitano</td></tr>
<tr><td>G g (перед a,o,u)</td><td>[г]</td><td>gato, grande</td></tr>
<tr><td>gue, gui</td><td>[гэ], [ги] (u не читается); güe, güi — читается</td><td>guerra, guitarra, lingüística</td></tr>
<tr><td>H h</td><td>не читается</td><td>hola, ahora</td></tr>
<tr><td>J j</td><td>[х] всегда</td><td>joven, reloj</td></tr>
<tr><td>Ll ll</td><td>[ль] / [й]</td><td>llave, pollo</td></tr>
<tr><td>Ñ ñ</td><td>[нь]</td><td>niño, España</td></tr>
<tr><td>Q q (+ue,ui)</td><td>[к] (u не читается)</td><td>quinto, querer</td></tr>
<tr><td>R r</td><td>[р] в середине; раскатистое [рр] в начале и после l,n,s</td><td>cartera, rico, perro</td></tr>
<tr><td>Z z</td><td>[θ] межзубный</td><td>zapato, lápiz</td></tr>
</table>
<p><b>Выводы:</b> звук [г] дают g + a/o/u и gue/gui; звук [к] — c + a/o/u и que/qui; звук [х] — j и g перед e/i; межзубный [θ] — z и c перед e/i (za, zo, zu, ce, ci). Согласные k и w встречаются лишь в словах иностранного происхождения. Написание слов с b/v и g/j перед e/i нужно запоминать.</p>

<h5>4. Дифтонги и трифтонги</h5>
<p>Сильные гласные: <b>a, o, e</b>. Слабые: <b>i, u</b>. <b>Дифтонг</b> — сочетание сильной+слабой или слабой+сильной гласной, образующее один слог: aire, piano, puerta, viuda, ruido, Europa. В дифтонгах ai/oi/ei «i» звучит как [й]. В сочетаниях ua/uo/ue «u» звучит ослабленно. Две сильные гласные рядом (poeta, teatro) произносятся раздельно. <b>Трифтонг</b> — слабая+сильная+слабая в один слог: limpiáis, Uruguay.</p>

<h5>5. Слогоделение</h5>
<p>Одна согласная между гласными идёт к следующему слогу (ma-pa); две согласные расходятся (cer-ve-za); взрывная + l/r не делятся (li-bro, ti-gre); три согласные — 2+1 (ins-ti-tu-to). Не разделяются que, qui, gue, gui, rr, ll, ch, а также дифтонги: pe-rro, mu-cha-cha.</p>

<h5>6. Ударение</h5>
<p>1) Слово на гласную или n, s → ударение на предпоследний слог: <span class="es">tema, momento, Carmen</span>.<br>
2) Слово на согласную (кроме n, s) → ударение на последний: <span class="es">compositor, verdad</span>.<br>
3) Нарушения правил отмечаются графическим ударением ´: <span class="es">Málaga, lápiz, teléfono</span>.<br>
4) Ударение различает омонимы: <span class="es">el/él, tu/tú, te/té, mi/mí, si/sí, solo/sólo, mas/más</span>.<br>
5) Оно ставится над вопросительными и восклицательными словами: <span class="es">¿Por qué? ¿Dónde? ¡Qué bien!</span>. Вопросительные и восклицательные знаки ставятся в начале фразы в перевёрнутом виде и в конце.<br>
6) Ударение разделяет дифтонги: <span class="es">María, Raúl</span>.</p>`,

<h5>1. Имя существительное: род</h5>
<p>Существительные на <b>-о</b> — мужского рода: <span class="es">chico, libro, amigo</span>. Существительные на <b>-a</b> — женского рода: <span class="es">chica, casa, playa</span>.</p>
<p><b>Исключения:</b> мужского рода — <span class="es">papá, día, policía</span>; женского рода — <span class="es">mano, radio</span>. Слова греческого происхождения на <b>-ma, -ta</b> — мужского рода: <span class="es">problema, tema, planeta, programa</span>.</p>
<p>Существительные на <b>-e</b> бывают обоих родов: <span class="es">padre</span> (м), <span class="es">calle, noche, tarde</span> (ж). Существительные на согласную бывают обоих родов: <span class="es">sol, país</span> (м); <span class="es">flor, ciudad, luz</span> (ж). К женскому роду относятся слова на <b>-ción, -tión, -sión, -ad</b>: <span class="es">operación, ciudad, verdad, felicidad</span>. Слова на <b>-ante, -iente, -ista</b> обозначают лиц обоих полов: <span class="es">estudiante, cliente, economista</span>.</p>
<h5>2. Число существительных</h5>
<p>На гласную → +<b>s</b>: <span class="es">libro→libros</span>. На согласную → +<b>es</b>: <span class="es">ciudad→ciudades, avión→aviones</span>. Если слово оканчивается на <b>-z</b>, она меняется на <b>c</b>: <span class="es">lápiz→lápices, luz→luces</span>. Слова на безударные <b>-as, -os, -us, -es, -is</b> не меняются: <span class="es">lunes, crisis, cumpleaños</span>. Есть слова только в ед. или мн. числе: <span class="es">salud, dinero, hambre; vacaciones</span>.</p>
<h5>3. Артикль</h5>
<table class="t"><tr><th></th><th>Определённый</th><th>Неопределённый</th></tr>
<tr><td>м.р. ед./мн.</td><td>el / los</td><td>un / unos</td></tr>
<tr><td>ж.р. ед./мн.</td><td>la / las</td><td>una / unas</td></tr></table>
<p>Определённый артикль — о конкретном, известном предмете. Неопределённый — о предмете, упомянутом впервые. Существует нейтральный артикль <b>lo</b> для абстрактных понятий: <span class="es">lo interesante</span> — интересное. Ряд существительных женского рода, начинающихся с ударной a/ha, в ед. числе берут артикль мужского рода: <span class="es">el agua — las aguas, el alma, el aula, el águila</span>.</p>
<h5>4. Прилагательное</h5>
<p>Прилагательные согласуются с существительным в роде и числе. Двух окончаний: <span class="es">blanco → blanca</span> (на -о/-a). Одного окончания (одинаковы в обоих родах): <span class="es">azul, verde, grande, joven, feliz</span>. Исключение — прилагательные национальности: <span class="es">español/española, alemán/alemana</span>. Прилагательное стоит <b>после</b> существительного: <span class="es">una casa blanca</span>. Качественные <span class="es">bueno, malo, grande</span> могут стоять перед ним: <span class="es">buen</span> (перед м.р.), <span class="es">gran</span> (великий). Мн. число: <span class="es">blancos/as, verdes, azules, españoles</span>.</p>
<h5>5. Личные местоимения (именительный падеж)</h5>
<table class="t"><tr><th>Ед. число</th><th>Мн. число</th></tr>
<tr><td>yo — я<br>tú — ты<br>él — он, ella — она, usted — Вы</td>
<td>nosotros / nosotras — мы<br>vosotros / vosotras — вы<br>ellos / ellas — они, ustedes — Вы</td></tr></table>
<p>Местоимения различаются по родам во мн. числе. <b>Usted</b> (сокр. Ud./Vd.) — из «Vuestra Merced» (Ваша милость), употребляется с глаголом в 3-м лице. В устной и письменной речи личные местоимения обычно опускаются — форма глагола указывает на лицо.</p>
<h5>6. Глаголы ser и estar</h5>
<table class="t"><tr><th>ser — быть</th><th>estar — быть, находиться</th></tr>
<tr><td>yo soy<br>tú eres<br>él/ella/Ud. es<br>nosotros somos<br>vosotros sois<br>ellos/Uds. son</td>
<td>yo estoy<br>tú estás<br>él/ella/Ud. está<br>nosotros estamos<br>vosotros estáis<br>ellos/Uds. están</td></tr></table>
<p><b>Ser</b> — глагол-связка для имени, фамилии, родства, происхождения, национальности, профессии и постоянных качеств: <span class="es">Ana es economista. Soy de Moscú. Somos jóvenes.</span> Без глагола-связки предложения в испанском не строятся.</p>

<h5>1. Простые предлоги</h5>
<p>Основные предлоги: <span class="es">de</span> — из, от, о (происхождение, принадлежность: <span class="es">Soy de Moscú; el libro de Ana</span>); <span class="es">en</span> — в, на (место: <span class="es">en casa, en la universidad</span>); <span class="es">a</span> — к, в, на (направление, личный аккузатив: <span class="es">Voy a Madrid; veo a Luis</span>); <span class="es">con</span> — с; <span class="es">sin</span> — без; <span class="es">por</span> — за, по, из-за; <span class="es">para</span> — для, чтобы.</p>
<h5>2. Количественные числительные 0-100</h5>
<table class="t"><tr><td>0 cero · 1 uno · 2 dos · 3 tres · 4 cuatro · 5 cinco · 6 seis · 7 siete · 8 ocho · 9 nueve · 10 diez · 11 once · 12 doce · 13 trece · 14 catorce · 15 quince · 16 dieciséis · 17 diecisiete · 18 dieciocho · 19 diecinueve · 20 veinte</td></tr></table>

<h5>3. Правильные глаголы (настоящее время)</h5>

<p>Три степени близости:</p>
<table class="t"><tr><th>Близко (aquí — здесь)</th><th>Рядом (ahí — тут)</th><th>Далеко (allí — там)</th></tr>

<p>Местоименные (без существительного) формы имеют ударение: <span class="es">éste, ése, aquél</span>; нейтральные: <span class="es">esto, eso, aquello</span> (без рода).</p>
<h5>2. Притяжательные местоимения (усечённые, перед словом)</h5>
<table class="t"><tr><th>Лицо</th><th>Ед. число</th><th>Мн. число</th></tr>
<tr><td>yo</td><td>mi · mis</td><td>nuestro/-a, nuestros/-as</td></tr>
<tr><td>tú</td><td>tu · tus</td><td>vuestro/-a, vuestros/-as</td></tr>
<tr><td>él/ella/Ud.</td><td>su · sus</td><td>su · sus</td></tr></table>
<p>Полные притяжательные стоят после существительного: <span class="es">un amigo mío</span>. Местоимённые: <span class="es">el mío, la mía, los míos, las mías</span> — мой/моя/мои.</p>
<h5>3. Вопросительные предложения</h5>
<p>Вопросительные слова всегда с графическим ударением и в перевёрнутых знаках: <span class="es">¿Qué?</span> что? какой? · <span class="es">¿Quién?/¿Quiénes?</span> кто? · <span class="es">¿Cuál?/¿Cuáles?</span> который? · <span class="es">¿Cómo?</span> как? · <span class="es">¿Dónde?</span> где? · <span class="es">¿Adónde?</span> куда? · <span class="es">¿De dónde?</span> откуда? · <span class="es">¿Cuándo?</span> когда? · <span class="es">¿Cuánto/-a/-os/-as?</span> сколько? · <span class="es">¿Por qué?</span> почему?</p>

<h5>1. Безличная форма hay</h5>
<p><b>Hay</b> — «есть, имеется, находится» (безличный оборот от <span class="es">haber</span>), не изменяется, один слог на ед. и мн. число: <span class="es">En la casa hay tres habitaciones.</span> Для отрицания — <span class="es">No hay</span>. Сравните с глаголом estar: <span class="es">hay</span> — «что-то есть/имеется»; <span class="es">está/están</span> — «находится где-то конкретно».</p>
<h5>2. Mucho / poco / muy / tanto / tan / tal</h5>
<table class="t"><tr><th>Слово</th><th>Значение и употребление</th></tr>
<tr><td>mucho/-a/-os/-as + сущ.</td><td>много: mucho dinero, muchas casas</td></tr>
<tr><td>mucho + глагол</td><td>много: trabajo mucho</td></tr>
<tr><td>muy + прилагательное/наречие</td><td>очень: muy grande, muy bien</td></tr>
<tr><td>poco/-a/-os/-as</td><td>мало: poco tiempo, pocos amigos</td></tr>
<tr><td>tanto/-a/-os/-as · tan</td><td>так много · такой: tanto trabajo, tan bonito</td></tr>
<tr><td>tal / tales</td><td>такой / такие: tal hombre</td></tr></table>
<h5>3. Предлоги места и времени</h5>
<p>Место: <span class="es">en</span> в, на · <span class="es">sobre</span> на, над · <span class="es">bajo</span> под · <span class="es">delante de</span> перед · <span class="es">detrás de</span> за, позади · <span class="es">cerca de</span> около · <span class="es">lejos de</span> далеко от · <span class="es">entre</span> между · <span class="es">al lado de</span> рядом с · <span class="es">encima de / debajo de</span> над / под.</p>
<p>Время: <span class="es">a las ...</span> в ... (час) · <span class="es">en</span> в (месяце, году) · <span class="es">por la mañana/tarde/noche</span> утром/днём/вечером · <span class="es">de ... a ...</span> с ... до ...</p>

 ru:`Мой дом — моё любимое место. Я живу в небольшой квартире в центре города. В ней две комнаты: гостиная и спальня, а также современная кухня и ванная. В гостиной есть удобный диван, стол и много растений. На стене висят фотографии моей семьи. Кухня маленькая, но там я готовлю завтраки и ужины. Я очень люблю свой дом: он тихий, светлый и находится недалеко от парка. Поэтому я ставлю цветы на окна и всегда поддерживаю порядок.`},
 cultural:`<h6>Испанское жильё</h6><p>Большинство испанцев живут в квартирах (pisos) в многоквартирных домах, часто с балконом или террасой (terraza), выходящей на внутренний дворик. Традиционные дома Средиземноморья — белые, с плоской крышей. Характерная деталь — решётки (rejas) на окнах и внутренние дворики с растениями. Оборот <b>hay</b> («имеется») незаменим, когда описываешь, что находится в комнате: <span class="es">En la cocina hay una nevera</span> — на кухне есть холодильник.</p>`

 id:6, title:"Виды жилья и аренда", sub:"Дополнения (дательный, винительный) · gustar · отклоняющиеся глаголы",
 theory:`
<h5>1. Местоимения-косвенные дополнения (дательный падеж)</h5>
<p>Отвечают на вопрос «кому?»:</p>
<table class="t"><tr><th>Лицо</th><th>Форма</th></tr>
<tr><td>yo</td><td>me (мне)</td></tr>
<tr><td>tú</td><td>te (тебе)</td></tr>
<tr><td>él/ella/Ud.</td><td>le (ему/ей/Вам)</td></tr>
<tr><td>nosotros</td><td>nos (нам)</td></tr>
<tr><td>vosotros</td><td>os (вам)</td></tr>
<tr><td>ellos/Uds.</td><td>les (им/Вам)</td></tr></table>
<p>Местоимение стоит перед глаголом: <span class="es">Me da un libro.</span> При имени существительном — реприза: <span class="es">Le doy un libro a Ana.</span></p>
<h5>2. Глагол gustar (нравиться)</h5>
<p>Строится как «(кому-то) нравится (что-то)»: <span class="es">A mí me gusta el café. A ti te gustan las flores.</span> Если нравится один предмет/действие — <b>gusta</b> + инфинитив или ед. число; несколько предметов — <b>gustan</b> + мн. число. Усиление/уточнение лица: <span class="es">a mí, a ti, a él, a nosotros</span>.</p>
<h5>3. Местоимения-прямые дополнения (винительный падеж)</h5>
<table class="t"><tr><th>Лицо</th><th>Форма</th></tr>
<tr><td>me — меня</td><td>te — тебя</td></tr>
<tr><td>lo/la — его/её (и Вас)</td><td>nos — нас</td></tr>
<tr><td>os — вас</td><td>los/las — их (и Вас)</td></tr></table>
<p>Прямое дополнение-лицо требует предлога a: <span class="es">Veo a Luis → Lo veo.</span></p>
<h5>4. Одновременное употребление прямого и косвенного</h5>
<p>Сначала косвенное, потом прямое: <span class="es">Me lo da</span> (он мне это даёт). Косвенные le/les перед lo/la/los/las заменяются на <b>se</b>: <span class="es">Se lo doy a él</span> (я даю это ему).</p>
<h5>5. Отклоняющиеся глаголы (настоящее время)</h5>
<table class="t"><tr><th>e→ie (cerrar)</th><th>o→ue (volver)</th><th>e→i (pedir)</th></tr>
<tr><td>cierro, cierras, cierra<br>cerramos, cerráis, cierran</td>
<td>vuelvo, vuelves, vuelve<br>volvemos, volvéis, vuelven</td>
<td>pido, pides, pide<br>pedimos, pedís, piden</td></tr></table>
<p>Чередование происходит во всех лицах, кроме nosotros и vosotros. Типичные глаголы: e→ie — <span class="es">cerrar, empezar, entender, pensar, perder</span>; o→ue — <span class="es">volver, dormir, poder, encontrar, almorzar</span>; e→i — <span class="es">pedir, servir, repetir, seguir</span>.</p>
<p><b>saber</b> — знать (факт, уметь): <span class="es">Sé nadar</span> (я умею плавать); <b>conocer</b> — знать, быть знакомым (с человеком/местом): <span class="es">Conozco a tu hermano</span>.</p>`,

<h5>1. Обозначение времени</h5>
<p>Вопрос: <span class="es">¿Qué hora es?</span> Ответ: <span class="es">Es la una</span> (1:00) · <span class="es">Son las dos/tres...</span>. Половина: <span class="es">Son las tres y media</span> (15:30) · четверть: <span class="es">y cuarto / menos cuarto</span> · минуты: <span class="es">Son las tres y diez; Son las tres menos diez</span>. «В … часов» — <span class="es">a las ...</span>: <span class="es">Me levanto a las siete.</span> «В полдень/полночь» — <span class="es">al mediodía / a medianoche</span>. Периоды: <span class="es">de la mañana</span> (утра), <span class="es">de la tarde</span> (дня), <span class="es">de la noche</span> (вечера/ночи).</p>
<h5>2. Возвратные (местоименные) глаголы</h5>
<table class="t"><tr><th>levantarse (вставать)</th></tr>
<tr><td>me levanto · te levantas · se levanta<br>nos levantamos · os levantáis · se levantan</td></tr></table>
<p>Местоимение согласуется с подлежащим и стоит перед глаголом. Типичные: <span class="es">levantarse, acostarse (o→ue), ducharse, lavarse, vestirse (e→i), despertarse (e→ie), llamarse, sentirse (e→ie)</span>.</p>
<h5>3. Герундий (Gerundio)</h5>
<p>Образуется: -ar → <b>-ando</b> (hablar→hablando); -er/-ir → <b>-iendo</b> (comer→comiendo, vivir→viviendo). Глаголы с чередованием -ir меняют корневую гласную: <span class="es">pedir→pidiendo, dormir→durmiendo, sentir→sintiendo</span>. Конструкция <b>estar + gerundio</b> — процесс в данный момент: <span class="es">Estoy leyendo</span> (я сейчас читаю).</p>
<h5>4. Конструкция sin + infinitivo</h5>
<p><b>Sin + infinitivo</b> — «без того, чтобы»: <span class="es">Sale sin desayunar</span> (выходит не позавтракав); отрицательное следствие после глаголов движения: <span class="es">Se fue sin decir nada</span>.</p>`,

 id:8, title:"Город", sub:"Наречия · степени сравнения · también/tampoco · числительные · порядковые",
 theory:`
<h5>1. Наречия и их образование</h5>
<p>Качественные наречия образуются от прилагательного ж.р. + <b>-mente</b>: <span class="es">rápido→rápidamente, fácil→fácilmente, claro→claramente</span>. При двух наречиях подряд -mente остаётся только у последнего: <span class="es">clara y rápidamente</span>. Наречия неизменяемы. Частые: <span class="es">bien/mal, mucho/poco, siempre/nunca, aquí/allí, ahora, luego, temprano, tarde</span>.</p>
<h5>2. Степени сравнения наречий</h5>
<table class="t"><tr><th>Сравнительная</th><th>Форма</th></tr>
<tr><td>больше / меньше</td><td>más / menos + наречие: más rápido que</td></tr>
<tr><td>так же</td><td>tan + наречие + como: tan bien como</td></tr>
<tr><td>лучше / хуже</td><td>mejor / peor (от bien/mal)</td></tr></table>
<p>Превосходная: <span class="es">lo más + наречие</span>: lo más rápido (быстрее всего).</p>
<h5>3. Наречия también / tampoco</h5>
<p><b>también</b> — тоже, также (после утверждения); <b>tampoco</b> — тоже нет (после отрицания): <span class="es">—Me gusta el cine. —A mí también. / —No me gusta el cine. —A mí tampoco.</span></p>
<h5>4. Количественные числительные 100 – 1.000.000.000</h5>
<p>100 <span class="es">cien</span> (перед сущ. — ciento: <span class="es">ciento uno</span>), 200 <span class="es">doscientos</span>, 300 <span class="es">trescientos</span>, 400 <span class="es">cuatrocientos</span>, 500 <span class="es">quinientos</span>, 600 <span class="es">seiscientos</span>, 700 <span class="es">setecientos</span>, 800 <span class="es">ochocientos</span>, 900 <span class="es">novecientos</span>, 1000 <span class="es">mil</span>, 1.000.000 <span class="es">un millón</span>, 1.000.000.000 <span class="es">mil millones</span>. Сотни согласуются в роде: <span class="es">doscientas casas</span>.</p>
<h5>5. Порядковые числительные</h5>
<p><span class="es">primero/a, segundo/a, tercero/a, cuarto/a, quinto/a, sexto/a, séptimo/a, octavo/a, noveno/a, décimo/a</span>. Перед существ. <span class="es">primero→primer, tercero→tercer</span>. Согласуются в роде и числе: <span class="es">el primer piso, la segunda planta</span>.</p>
<p><b>estudiar / aprender / enseñar</b>: estudiar — учиться, изучать; aprender — учить(ся), усваивать (<span class="es">aprender español</span>); enseñar — преподавать, учить кого-то (<span class="es">enseñar español</span>).</p>`,

 lettura:{sp:`Mi ciudad es grande y bonita. En el centro hay una plaza muy amplia con una fuente, y alrededor hay muchos cafés y tiendas. La calle principal se llama Gran Vía. Aquí están los bancos, el mercado y la oficina de correos. Cerca de mi casa hay un parque con árboles antiguos, donde paseo los fines de semana. No lejos del parque se encuentra la biblioteca, y al lado está el museo. Me gusta caminar por el centro, admirar los edificios antiguos y tomar café en una terraza. Mi ciudad es más tranquila que la capital, pero también tiene su encanto.`,
 ru:`Мой город большой и красивый. В центре есть очень просторная площадь с фонтаном, а вокруг много кафе и магазинов. Главная улица называется Гран-Виа. Здесь находятся банки, рынок и почта. Недалеко от моего дома есть парк со старыми деревьями, где я гуляю по выходным. Неподалёку от парка расположена библиотека, а рядом — музей. Мне нравится гулять по центру, любоваться старыми зданиями и пить кофе на террасе. Мой город спокойнее столицы, но у него тоже есть своё очарование.`},
 cultural:`<h6>Испанские города</h6><p>Типичный испанский город строится вокруг центральной площади (plaza mayor) с ратушей, церковью и фонтаном. Жизнь кипит на улицах: вечерний променад <b>paseo</b>, когда жители гуляют и общаются, — важная традиция. В Испании на уличных табличках часто указывают не только название улицы, но и её старый квартал. Наречия на -mente — быстрый способ описать, КАК совершается действие.</p>`

 id:9, title:"Городской транспорт", sub:"Степени сравнения прилагательных · предложные формы · причастие · Pretérito perfecto",
 theory:`
<h5>1. Степени сравнения прилагательных</h5>
<table class="t"><tr><th>Степень</th><th>Форма</th></tr>
<tr><td>сравнительная</td><td>más/menos + прил. + que: más alto que</td></tr>
<tr><td>равенство</td><td>tan + прил. + como: tan alto como</td></tr>
<tr><td>особые формы</td><td>mejor (лучше), peor (хуже), mayor (старше), menor (младше)</td></tr>
<tr><td>превосходная</td><td>el/la más + прил.: el más alto</td></tr></table>
<h5>2. Предложные формы местоимений-дополнений</h5>
<p>После предлогов (a, de, para, con, por) употребляются формы: <span class="es">mí, ti, él, ella, usted, nosotros, vosotros, ellos, ellas, ustedes</span>. С предлогом con: <b>conmigo</b> (со мной), <b>contigo</b> (с тобой). Примеры: <span class="es">Es para mí; vivo con ella; viene conmigo</span>.</p>
<h5>3. Причастие (Participio)</h5>
<p>-ar → <b>-ado</b> (hablar→hablado); -er/-ir → <b>-ido</b> (comer→comido, vivir→vivido). Неправильные: <span class="es">hecho, dicho, visto, escrito, puesto, roto, abierto, vuelto, muerto</span>. Причастие согласуется в роде и числе при употреблении с estar (состояние): <span class="es">La puerta está cerrada.</span></p>
<h5>4. Pretérito perfecto compuesto</h5>
<table class="t"><tr><th>haber (вспомогательный)</th><th>+ participio</th></tr>
<tr><td>he, has, ha, hemos, habéis, han</td><td>hablado / comido / vivido</td></tr></table>
<p>Обозначает действие в прошлом, связанное с настоящим (результат, опыт, незавершённый период): <span class="es">Hoy he trabajado mucho. ¿Has estado en España? Este año he aprendido español.</span> Слова-маркеры: <span class="es">hoy, esta semana, este año, ya, todavía no, alguna vez, nunca, siempre</span>.</p>

 id:10, title:"Путешествия и погода", sub:"Futuro simple · неопределённые местоимения · nunca/jamás · todo/cada/otro",
 theory:`
<h5>1. Futuro simple</h5>
<p>Образуется прибавлением окончаний к инфинитиву (для всех спряжений одинаковых): <b>-é, -ás, -á, -emos, -éis, -án</b>.</p>
<table class="t"><tr><th>hablar</th><th>comer</th><th>vivir</th></tr>
<tr><td>hablaré, hablarás, hablará<br>hablaremos, hablaréis, hablarán</td><td>comeré... comerán</td><td>viviré... vivirán</td></tr></table>
<p>Особые основы: <span class="es">tener→tendr-, poder→podr-, poner→pondr-, salir→saldr-, venir→vendr-, hacer→har-, decir→dir-, querer→querr-, saber→sabr-, haber→habr-</span>. Futuro выражает будущее и предположение: <span class="es">Mañana iré a Sevilla. ¿Qué hora es? — Serán las cinco.</span></p>
<h5>2. Неопределённые и отрицательные местоимения</h5>
<p><span class="es">alguien</span> кто-то / <span class="es">nadie</span> никто · <span class="es">algo</span> что-то / <span class="es">nada</span> ничего · <span class="es">alguno/-a</span> какой-то / <span class="es">ninguno/-a</span> никакой. Усечённые формы перед сущ.: <span class="es">algún, ningún</span>. При отрицании <b>no</b> + глагол + отрицательное слово: <span class="es">No veo a nadie. No tengo nada.</span></p>
<h5>3. Отрицательные наречия nunca и jamás</h5>
<p><b>nunca</b> никогда; <b>jamás</b> никогда (усилительно). Если стоят перед глаголом — двойного отрицания нет: <span class="es">Nunca viajo en avión.</span> После глагола сохраняют no: <span class="es">No viajo nunca en avión.</span> <span class="es">Nunca jamás</span> — «никогда в жизни».</p>
<h5>4. todo / cada / otro / cualquiera</h5>
<p><b>todo</b> весь, всё + артикль/притяж.: <span class="es">todo el día, todos los días</span>. <b>cada</b> каждый (не изменяется): <span class="es">cada día, cada semana</span>. <b>otro</b> другой: <span class="es">otro libro, otra vez</span>. <b>cualquiera</b> любой (перед сущ. → <span class="es">cualquier</span>): <span class="es">cualquier día</span>.</p>`,

 ru:`Следующим летом я поеду в Испанию с семьёй. Мы полетим на самолёте в Мадрид, а потом посетим юг. По прогнозу, погода будет хорошая: солнце и жара. Мы возьмём немного одежды, солнечные очки и фотоаппараты. Мама говорит, что никогда не видела Средиземное море, так что эта поездка будет для неё особенной. Я уже забронировал отель и купил билеты. Каждый день мы будем посещать что-то новое: музеи, пляжи и старинные городки. Думаю, это будет незабываемая поездка.`},
 cultural:`<h6>Погода и путешествия</h6><p>В испанском погоду описывают оборотом с <b>hacer</b>: <span class="es">hace calor/frío/sol/viento</span>, но дождь и снег — личными глаголами: <span class="es">llueve, nieva</span>. Futuro simple часто выражает не только будущее, но и предположение о настоящем: <span class="es">Serán las cinco</span> — «сейчас, наверное, пять часов». Испанцы любят поговорить о погоде — это универсальная светская тема.</p>`

 id:11, title:"По магазинам. Покупки", sub:"Pretérito indefinido · mismo · tocar · Pretérito imperfecto · llevar(se)",
 theory:`
<h5>1. Pretérito indefinido (простое прошедшее — завершённое)</h5>
<table class="t"><tr><th>hablar</th><th>comer / vivir</th></tr>
<tr><td>hablé, hablaste, habló<br>hablamos, hablasteis, hablaron</td>
<td>comí, comiste, comió<br>comimos, comisteis, comieron</td></tr></table>
<p>Неправильные (без ударения в 1-м и 3-м л. ед.): <span class="es">ser/ir: fui, fuiste, fue, fuimos, fuisteis, fueron</span>; <span class="es">estar: estuve, estuviste, estuvo...; tener: tuve...; hacer: hice...; decir: dije...; venir: vine...; poder: pude...; poner: puse...; querer: quise...; saber: supe...; dar: di, diste, dio...; traer: traje...</span>. Ortografía: -car→-qué (busqué), -gar→-gué (llegué), -zar→-cé (empecé); e→i в 3-м лице (pedir→pidió); o→u (dormir→durmió).</p>
<h5>2. Неопределённое местоимение mismo</h5>
<p><b>mismo/-a/-os/-as</b> — сам, тот же самый: <span class="es">Yo mismo lo hice</span> (я сам это сделал); <span class="es">el mismo libro</span> — та же самая книга. С наречием <b>ahora mismo</b> — прямо сейчас.</p>
<h5>3. Pretérito imperfecto (прошедшее несовершенное — описание, привычка)</h5>
<table class="t"><tr><th>-ar</th><th>-er / -ir</th></tr>
<tr><td>hablaba, hablabas, hablaba<br>hablábamos, hablabais, hablaban</td>
<td>comía, comías, comía<br>comíamos, comíais, comían</td></tr></table>
<p>Только три неправильных: <span class="es">ser: era, eras, era...; ir: iba, ibas, iba...; ver: veía, veías, veía...</span>. Imperfecto выражает привычное/повторяющееся действие и описание в прошлом: <span class="es">Cuando era niño, jugaba en el parque.</span></p>
<p><b>tocar</b>: трогать (<span class="es">tocar la guitarra</span> — играть на гитаре); <span class="es">tocar a alguien</span> — выпадать на чью-то долю, чья-то очередь (<span class="es">Me toca a mí</span> — моя очередь). <b>llevar</b> — нести, носить; <span class="es">llevarse</span> — уносить, брать с собой (<span class="es">Me llevo el libro</span>).</p>`,

 cultural:`<h6>Магазины и распродажи</h6><p>В Испании сезоны распродаж (rebajas) официально начинаются в январе и июле. В небольших магазинах принято здороваться при входе и благодарить продавца при выходе. Оплата картой (tarjeta) распространена повсеместно, но на рынках иногда предпочитают наличные (efectivo). Indefinido описывает завершённое действие («вчера купил»), imperfecto — привычку или фон («раньше ходил»).</p>`

 theory:`
<h5>1. Календарь</h5>
<p>Дни недели: <span class="es">lunes, martes, miércoles, jueves, viernes, sábado, domingo</span> (все м.р., с артиклем el/ los). Месяцы: <span class="es">enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre</span>. Даты: <span class="es">el 1 de mayo; el 12 de octubre</span>. Времена года: <span class="es">la primavera, el verano, el otoño, el invierno</span>.</p>
<h5>2. Indefinido vs Imperfecto</h5>
<table class="t"><tr><th>Indefinido</th><th>Imperfecto</th></tr>
<tr><td>завершённое действие</td><td>привычка, описание, фон</td></tr>
<tr><td>Ayer comí paella.</td><td>Cuando era niño, comía paella los domingos.</td></tr>
<tr><td>последовательность событий</td><td>действие в процессе, одновременное с другим</td></tr>
<tr><td>Vino, se sentó y pidió.</td><td>Mientras leía, sonó el teléfono.</td></tr></table>
<h5>3. Конструкция al + infinitivo</h5>
<p><b>al + infinitivo</b> — «когда, в момент» (одновременность): <span class="es">Al llegar a casa, vi la carta</span> (когда я пришёл домой, я увидел письмо).</p>
<h5>4. Pretérito pluscuamperfecto</h5>
<p>Образуется: <b>haber в imperfecto</b> (había, habías, había, habíamos, habíais, habían) + participio. Обозначает действие, предшествующее другому прошедшему: <span class="es">Cuando llegué, ya habían cenado</span> (когда я пришёл, они уже поужинали).</p>
<p><b>dejar</b> — оставлять (dejar algo en algún sitio); <span class="es">dejar de + inf.</span> — перестать. <b>quedar</b> — договариваться о встрече, оставаться; <span class="es">quedarse</span> — оставаться где-то (<span class="es">Me quedé en casa</span>).</p>`,

<h5>1. Условные предложения I типа (реальное условие)</h5>
<p><b>Si + presente de indicativo, ... futuro / presente / imperativo</b>: <span class="es">Si tengo tiempo, iré a la playa.</span> <span class="es">Si llueve, nos quedamos en casa.</span></p>
<h5>2. Potencial simple (Condicional) — простое условное</h5>
<p>Окончания прибавляются к инфинитиву (как у futuro): <b>-ía, -ías, -ía, -íamos, -íais, -ían</b>.</p>
<table class="t"><tr><th>hablar</th><th>особые основы</th></tr>
<tr><td>hablaría, hablarías<br>hablaríamos, hablaríais, hablarían</td><td>tener→tendr-, poder→podr-, poner→pondr-, salir→saldr-, venir→vendr-, hacer→har-, decir→dir-, querer→querr-, saber→sabr-, haber→habr-</td></tr></table>
<p>Употребляется для вежливости (<span class="es">¿Podría ayudarme?</span>), будущего в прошедшем (<span class="es">Dijo que vendría</span>) и гипотезы.</p>
<h5>3. Согласование времён и прямая речь → косвенная</h5>

<tr><td>—«Lo hice ayer»</td><td>Dijo que lo había hecho el día anterior.</td></tr></table>
<p>Изменяются указатели времени и места: <span class="es">hoy→aquel día, mañana→al día siguiente, ayer→el día anterior, aquí→allí, este→aquel</span>.</p>
<p><b>Глаголы движения</b>: <span class="es">ir</span> — ехать (к цели), <span class="es">venir</span> — приходить (к говорящему), <span class="es">llegar</span> — прибывать, <span class="es">salir</span> — выходить, <span class="es">volver</span> — возвращаться, <span class="es">viajar</span> — путешествовать.</p>`,

 theory:`
<h5>1. Voz pasiva (страдательный залог)</h5>
<p>Строится: <b>ser + participio (+ por + деятель)</b>. Причастие согласуется с подлежащим в роде и числе:</p>
<table class="t"><tr><th>Актив</th><th>Пассив</th></tr>
<tr><td>El equipo ganó el partido.</td><td>El partido fue ganado por el equipo.</td></tr>
<tr><td>La empresa construye casas.</td><td>Las casas son construidas por la empresa.</td></tr></table>
<p>Чаще, однако, испанцы предпочитают пассивную конструкцию с <b>se</b>: <span class="es">Se venden pisos</span> (продаются квартиры); <span class="es">Aquí se habla español</span>.</p>
<h5>2. Acusativo con infinitivo</h5>
<p>Конструкция «винительный с инфинитивом»: глаголы восприятия и побуждения (ver, oír, sentir, dejar, hacer) + дополнение + инфинитив: <span class="es">Veo a Juan correr</span> (я вижу, как Хуан бежит); <span class="es">Le oí cantar</span> (я слышал, как он поёт); <span class="es">Le hice reír</span> (я заставил его смеяться).</p>
<h5>3. Инфинитивные перифразы</h5>
<table class="t"><tr><th>Перифраза</th><th>Значение</th></tr>
<tr><td>ir a + inf.</td><td>собираться (ближайшее будущее): Voy a correr.</td></tr>
<tr><td>tener que + inf.</td><td>должен: Tengo que entrenar.</td></tr>
<tr><td>deber + inf.</td><td>должен (морально): Debes descansar.</td></tr>
<tr><td>acabar de + inf.</td><td>только что: Acabo de llegar.</td></tr>
<tr><td>estar a punto de + inf.</td><td>вот-вот: Está a punto de empezar.</td></tr>
<tr><td>volver a + inf.</td><td>снова: Volvió a ganar.</td></tr>
<tr><td>empezar a + inf.</td><td>начинать: Empezó a llover.</td></tr>
<tr><td>soler + inf.</td><td>обычно: Suele entrenar por la mañana.</td></tr></table>
<h5>4. Местоименная реприза (дублирование)</h5>

 lettura:{sp:`El deporte es una parte muy importante de mi vida. Juego al fútbol desde niño y también voy a la piscina dos veces por semana. Los sábados suelo ver los partidos en el estadio con mi padre. El equipo de nuestra ciudad ganó la copa el año pasado: la final fue ganada en el último minuto, y el gol decisivo fue marcado por nuestro mejor jugador. Ahora el club está a punto de empezar la nueva temporada. Creo que el deporte no solo da salud, sino que también enseña a trabajar en equipo.`,

 cultural:`<h6>Спорт в Испании</h6><p>Футбол — национальная страсть: Ла Лига и сборная Испании (чемпион мира 2010 года) объединяют миллионы болельщиков. Наряду с футболом популярны баскетбол, теннис (Рафаэль Надаль), велоспорт (Vuelta a España) и коррида (традиционное, но спорное зрелище). В испанском «играть во что-то» — <b>jugar a</b> + вид спорта: <span class="es">jugar al fútbol, al tenis</span>. Страдательный залог часто заменяют конструкцией с se.</p>`

 theory:`
<h5>1. Modo imperativo afirmativo (утвердительное повелительное)</h5>
<table class="t"><tr><th></th><th>hablar</th><th>comer</th><th>vivir</th></tr>
<tr><td>tú</td><td>habla</td><td>come</td><td>vive</td></tr>
<tr><td>usted</td><td>hable</td><td>coma</td><td>viva</td></tr>
<tr><td>nosotros</td><td>hablemos</td><td>comamos</td><td>vivamos</td></tr>
<tr><td>vosotros</td><td>hablad</td><td>comed</td><td>vivid</td></tr>
<tr><td>ustedes</td><td>hablen</td><td>coman</td><td>vivan</td></tr></table>
<p>Особые формы tú: <span class="es">tener→ten, venir→ven, poner→pon, salir→sal, hacer→haz, decir→di, ir→ve, ser→sé</span>. Возвратные местоимения присоединяются к утвердительной форме: <span class="es">levántate, siéntese, sentaos</span> (при этом в 1-м л. мн. и 3-м л. мн. теряется -s/-d: <span class="es">sentémonos, siéntense</span>). Местоимения-дополнения тоже пишутся слитно с ударением: <span class="es">dímelo, cómpralo</span>.</p>
<h5>2. Modo imperativo negativo (отрицательное повелительное)</h5>
<p>Все формы отрицательного императива совпадают с формами <b>presente de subjuntivo</b>:</p>
<table class="t"><tr><th></th><th>hablar</th><th>comer</th><th>vivir</th></tr>
<tr><td>tú</td><td>no hables</td><td>no comas</td><td>no vivas</td></tr>
<tr><td>usted</td><td>no hable</td><td>no coma</td><td>no viva</td></tr>
<tr><td>nosotros</td><td>no hablemos</td><td>no comamos</td><td>no vivamos</td></tr>
<tr><td>vosotros</td><td>no habléis</td><td>no comáis</td><td>no viváis</td></tr>
<tr><td>ustedes</td><td>no hablen</td><td>no coman</td><td>no vivan</td></tr></table>
<p>При отрицательной форме местоимения стоят отдельно ПЕРЕД глаголом: <span class="es">No te levantes; no se siente; no lo compres</span>.</p>
<p><b>echar(se)</b> — бросать, выливать; <span class="es">echarse</span> — ложиться, прилечь; <span class="es">echar de menos</span> — скучать по кому-то; <span class="es">echarse a + inf.</span> — начать что-то делать.</p>`,

 lettura:{sp:`Ayer no me sentí bien. Por la mañana me dolía la cabeza y tenía fiebre. Llamé al centro de salud y pedí una cita con el médico. En la consulta el doctor me preguntó qué me pasaba y desde cuándo. Me escuchó, me miró la garganta y dijo que era un resfriado fuerte. Me recetó unas pastillas y me aconsejó descansar. «Tome la medicina cada ocho horas, beba mucha agua y no salga de casa», me dijo. Ahora estoy mejor. Es importante cuidar la salud y no dejar las cosas para después.`,
 ru:`Вчера я плохо себя чувствовал. Утром у меня болела голова и была температура. Я позвонил в поликлинику и записался на приём к врачу. В кабинете доктор спросил, что меня беспокоит и с каких пор. Он выслушал, осмотрел горло и сказал, что это сильная простуда. Выписал таблетки и посоветовал отдыхать. «Принимайте лекарство каждые восемь часов, пейте много воды и не выходите из дома», — сказал он. Сейчас мне лучше. Важно беречь здоровье и не откладывать всё на потом.`},
 cultural:`<h6>Медицина в Испании</h6><p>Испания имеет одну из лучших систем здравоохранения в Европе. Приём у врача — по записи (cita previa) через центр здоровья (centro de salud) или приложение. Лекарства отпускаются по рецепту (receta) в аптеке, которую узнают по зелёному кресту. Вежливая форма обращения к врачу — usted, поэтому в диалоге звучит императив 3-го лица: <span class="es">Tome, descanse, quédese</span>. Забота о здоровье — одна из самых частых тем повседневного общения.</p>`

window.READINGS={"1": [{"t": "Diálogos de saludo", "sp": "— ¡Buenos días, señorita! ¿Qué tal?\n— ¡Hola! Bien, gracias. ¿Y usted?\n— Regular, más o menos. ¿Qué tal la familia?\n— Todo va bien, gracias. Hasta luego.\n— Hasta mañana. Adiós.", "ru": "— Доброе утро, сеньорита! Как дела?\n— Привет! Хорошо, спасибо. А у вас?\n— Так себе. Как семья?\n— Всё хорошо, спасибо. До скорого.\n— До завтра. Прощайте.", "q": [["¿Qué dice el señor al saludar?", "Dice «Buenos días». / Dice «¡Buenos días, señorita!»"], ["¿Cómo está la señorita?", "Está bien, gracias."], ["¿Cómo está el señor?", "Está regular, más o menos."], ["¿Qué pregunta el señor sobre la familia?", "Pregunta «¿Qué tal la familia?»"], ["¿Qué responde la señorita sobre la familia?", "Responde que todo va bien, gracias."], ["¿Cómo se despiden?", "Con «Hasta luego», «Hasta mañana» y «Adiós»."]], "src": "own"}], "2": [{"t": "Yo soy Olga", "sp": "Yo soy Olga. Ellas son Natalia y Marina. Somos profesoras. Somos rusas. Somos de Moscú. Estamos en España, en la Universidad de Granada. La ciudad es bonita. La Universidad es grande y buena. El señor César Martínez es el rector de la Universidad. Es español. Es joven, delgado, alto y simpático. Estamos contentas.", "ru": "Я — Ольга. Они — Наталья и Марина. Мы преподавательницы. Мы русские. Мы из Москвы. Мы в Испании, в Университете Гранады. Город красивый. Университет большой и хороший. Сеньор Сесар Мартинес — ректор университета. Он испанец. Он молодой, стройный, высокий и приятный. Мы довольны.", "q": [["¿Cómo se llama la protagonista?", "Se llama Olga."], ["¿Quiénes son Natalia y Marina?", "Son las compañeras de Olga; son profesoras."], ["¿De dónde son las tres mujeres?", "Son de Moscú, de Rusia."], ["¿Dónde están ahora?", "Están en España, en la Universidad de Granada."], ["¿Cómo es la ciudad de Granada?", "Es bonita."], ["¿Quién es el señor César Martínez?", "Es el rector de la Universidad; es español."], ["¿Cómo es el señor Martínez?", "Es joven, delgado, alto y simpático."]], "src": "book"}, {"t": "Текст из учебника · упр. 20", "sp": "их, стараясь повторить интонацию и произношение\nдиктора.\n1)\n– Soy Rocío García. ¿Y usted?\n– Soy Sergio Iglesias. Mucho gusto.\n– Igualmente. ¿Es usted de Toledo?\n– No, soy de Sevilla. Soy ingeniero.\n– Y yo soy cocinera. Soy pobre, y mi hermana es rica.\n2)\nPablo. – ¡Hola! ¿Eres Marta, la hermana de Jorge Hernán dez?\nMarta. – ¡Hola! Sí, soy Marta, ¿y tú?\nPablo. – Mucho gusto. Soy Pablo Belov. Soy de Rusia.\nMarta. – ¡Ah, eres el nuevo periodista! ¡Encantada! Yo soy abogada. ¿Qué tal la vida, Pablo?\nPablo. – Bien, gracias. Estoy en Barcelona. Estoy contento. Todo va bien. ¿Está bien Jorge?\nMarta. – No, está regular.\nPablo. – ¿Está enfermo?\nMarta. – Sí, está en casa y está enfermo.\nPablo. – ¡Qué lástima! ¡Hasta luego!\n_______________\n¡Qué lástima! Как жаль!\n3)\nJuan. – Buenos días. Soy Juan Gómez.\nCarmen. – Mucho gusto, soy Carmen López.\nJuan. – Encantado. ¿Eres española?\nCarmen. – Sí, soy española. Soy de Málaga.\nJuan. – Y yo soy argentino, de Buenos Aires. Soy economista, y tú ¿eres médica?\nCarmen. – No, soy enfermera. ¿Estás bien?\nJuan. – Sí, estoy bien, gracias. Eres delgada y guapa.\nCarmen. – Tú también. ¿Estás casado?\nJuan. – No, soy soltero.\nCarmen. – ¡Qué interesante!\n_______________\ntambién тоже\n¡Qué interesante! Как интересно!", "ru": "1) – Я Росио Гарсия. А вы? – Я Серхио Иглесиас. Очень приятно. – Взаимно. Вы из Толедо? – Нет, я из Севильи. Я инженер. – А я повар. Я бедная, а моя сестра богатая.\n2) Пабло. – Привет! Ты Марта, сестра Хорхе Эрнандеса? Марта. – Привет! Да, я Марта, а ты? Пабло. – Очень приятно. Я Пабло Белов. Я из России. Марта. – А, ты новый журналист! Очень приятно! Я адвокат. Как жизнь, Пабло? Пабло. – Хорошо, спасибо. Я в Барселоне. Я доволен. Всё хорошо. Хорхе в порядке? Марта. – Нет, так себе. Пабло. – Он болен? Марта. – Да, он дома и болен. Пабло. – Как жаль! До скорого!\n3) Хуан. – Доброе утро. Я Хуан Гомес. Кармен. – Очень приятно, я Кармен Лопес. Хуан. – Очень приятно. Ты испанка? Кармен. – Да, я испанка. Я из Малаги. Хуан. – А я аргентинец, из Буэнос-Айреса. Я экономист, а ты? Ты врач? Кармен. – Нет, я медсестра. Ты в порядке? Хуан. – Да, я в порядке, спасибо. Ты стройная и красивая. Кармен. – Ты тоже. Ты женат? Хуан. – Нет, я холост. Кармен. – Как интересно!", "q": [], "src": "book"}], "3": [{"t": "¿Cómo es?", "sp": "Mi amigo se llama Andrés. Es joven y alto, pero no es muy delgado: es un poco gordo. Tiene el pelo negro y los ojos verdes. Es alegre y simpático, aunque a veces es bastante serio. Andrés es estudiante de economía. Vive en un piso pequeño cerca de la universidad. Tiene veinte años. Su padre es ingeniero y su madre es médica. Andrés habla español, inglés y un poco de francés.", "ru": "Моего друга зовут Андрес. Он молодой и высокий, но не очень стройный: он немного полный. У него чёрные волосы и зелёные глаза. Он весёлый и приветливый, хотя иногда довольно серьёзный. Андрес — студент-экономист. Он живёт в маленькой квартире рядом с университетом. Ему двадцать лет. Его отец — инженер, а мать — врач. Андрес говорит по-испански, по-английски и немного по-французски.", "q": [["¿Cómo se llama el amigo?", "Se llama Andrés."], ["¿Es alto o bajo?", "Es joven y alto."], ["¿Cómo es su cuerpo?", "No es muy delgado; es un poco gordo."], ["¿De qué color tiene el pelo y los ojos?", "Tiene el pelo negro y los ojos verdes."], ["¿Cuántos años tiene?", "Tiene veinte años."], ["¿Qué profesión tienen sus padres?", "Su padre es ingeniero y su madre es médica."], ["¿Qué idiomas habla Andrés?", "Habla español, inglés y un poco de francés."]], "src": "own"}], "4": [{"t": "La familia de Andrés", "sp": "La familia de Andrés es bastante grande. Son seis: su padre, su madre, sus dos hermanos, su hermana pequeña y él. Viven en un piso en el centro de la ciudad. Su abuelo vive con ellos; tiene ochenta años y ya no trabaja. Los domingos toda la familia come junta en casa de los abuelos. La madre de Andrés prepara una paella muy rica. Después de comer, los niños juegan en el parque y los mayores hablan y toman café. Andrés quiere mucho a su familia.", "ru": "Семья Андреса довольно большая. Их шесть: отец, мать, два брата, младшая сестра и он. Они живут в квартире в центре города. Дедушка живёт с ними; ему восемьдесят лет, и он уже не работает. По воскресеньям вся семья обедает вместе у бабушки с дедушкой. Мама Андреса готовит очень вкусную паэлью. После еды дети играют в парке, а взрослые разговаривают и пьют кофе. Андрес очень любит свою семью.", "q": [["¿Cuántas personas hay en la familia?", "Hay seis personas."], ["¿Dónde vive la familia?", "Vive en un piso en el centro de la ciudad."], ["¿Quién vive con ellos?", "Su abuelo vive con ellos."], ["¿Cuántos años tiene el abuelo?", "Tiene ochenta años."], ["¿Qué hacen los domingos?", "Toda la familia come junta en casa de los abuelos."], ["¿Qué prepara la madre?", "Prepara una paella muy rica."], ["¿Qué hacen los niños después de comer?", "Juegan en el parque."]], "src": "book"}], "5": [{"t": "Mi casa", "sp": "Mi casa es mi lugar favorito. Vivo en un piso pequeño pero muy cómodo, en el tercer piso de un edificio moderno. Hay dos habitaciones, un salón, una cocina y un baño. En el salón hay un sofá grande, una mesa y una estantería con muchos libros. Mi habitación tiene una cama, un armario y una ventana que da al parque. La cocina es pequeña, pero luminosa. Desde el balcón se ve toda la calle. Me gusta mucho mi casa porque es tranquila y acogedora.", "ru": "Мой дом — моё любимое место. Я живу в маленькой, но очень удобной квартире на третьем этаже современного дома. Есть две комнаты, гостиная, кухня и ванная. В гостиной большой диван, стол и книжный шкаф с множеством книг. В моей комнате кровать, шкаф и окно, выходящее в парк. Кухня маленькая, но светлая. С балкона видна вся улица. Мне очень нравится мой дом, потому что он тихий и уютный.", "q": [["¿En qué piso vive?", "Vive en el tercer piso."], ["¿Cuántas habitaciones hay?", "Hay dos habitaciones."], ["¿Qué hay en el salón?", "Hay un sofá grande, una mesa y una estantería con libros."], ["¿Qué hay en su habitación?", "Hay una cama, un armario y una ventana."], ["¿Adónde da la ventana?", "La ventana da al parque."], ["¿Qué se ve desde el balcón?", "Se ve toda la calle."], ["¿Por qué le gusta su casa?", "Porque es tranquila y acogedora."]], "src": "own"}], "6": [{"t": "Buscando piso", "sp": "— Buenos días. Quiero alquilar un piso. ¿Tiene algo libre?\n— Sí, tenemos un piso amueblado en el centro. Está en el segundo piso.\n— ¿Cuántas habitaciones tiene?\n— Tiene tres habitaciones, un salón grande, una cocina y dos baños.\n— ¿Cuánto cuesta el alquiler?\n— Setecientos euros al mes, gastos incluidos.\n— ¿Está cerca del metro?\n— Sí, está a cinco minutos a pie.\n— ¡Perfecto! Voy a pensarlo y le llamo mañana.", "ru": "— Добрый день. Я хочу снять квартиру. У вас есть что-нибудь свободное?\n— Да, у нас есть меблированная квартира в центре. Она на втором этаже.\n— Сколько в ней комнат?\n— Три комнаты, большая гостиная, кухня и две ванные.\n— Сколько стоит аренда?\n— Семьсот евро в месяц, счета включены.\n— Она близко к метро?\n— Да, пять минут пешком.\n— Отлично! Я подумаю и позвоню вам завтра.", "q": [["¿Qué quiere alquilar el cliente?", "Quiere alquilar un piso."], ["¿Cómo es el piso?", "Es un piso amueblado en el centro."], ["¿En qué piso está?", "Está en el segundo piso."], ["¿Cuántas habitaciones tiene?", "Tiene tres habitaciones, un salón, una cocina y dos baños."], ["¿Cuánto cuesta el alquiler?", "Setecientos euros al mes, gastos incluidos."], ["¿Está cerca del metro?", "Sí, está a cinco minutos a pie."], ["¿Qué va a hacer el cliente?", "Va a pensarlo y va a llamar mañana."]], "src": "partial"}], "7": [{"t": "Un día normal", "sp": "Todos los días mi vida es igual, pero me gusta. Me levanto a las seis y media, me ducho y desayuno café con tostadas. A las ocho salgo de casa y voy al trabajo en metro. Trabajo en una oficina hasta las cinco. Vuelvo a casa a las seis, preparo la cena y ceno con mi familia. Por la noche veo la televisión o leo un libro. Me acuesto a las once. Los fines de semana descanso, hago deporte y quedo con mis amigos.", "ru": "Каждый день моя жизнь одинакова, но мне это нравится. Я встаю в половине седьмого, принимаю душ и завтракаю кофе с тостами. В восемь выхожу из дома и еду на работу на метро. Работаю в офисе до пяти. Возвращаюсь домой в шесть, готовлю ужин и ужинаю с семьёй. Вечером смотрю телевизор или читаю книгу. Ложусь спать в одиннадцать. По выходным отдыхаю, занимаюсь спортом и встречаюсь с друзьями.", "q": [["¿A qué hora se levanta?", "Se levanta a las seis y media."], ["¿Qué desayuna?", "Desayuna café con tostadas."], ["¿Cómo va al trabajo?", "Va al trabajo en metro."], ["¿Hasta qué hora trabaja?", "Trabaja hasta las cinco."], ["¿Qué hace por la noche?", "Ve la televisión o lee un libro."], ["¿A qué hora se acuesta?", "Se acuesta a las once."], ["¿Qué hace los fines de semana?", "Descansa, hace deporte y queda con sus amigos."]], "src": "own"}, {"t": "Текст из учебника · упр. 20", "sp": "La mañana de una familia grande\nTodas las mañanas, en mi casa, cuando nos levantamos, se repite la misma situación. Así empieza todo.\n– ¡Javier!, sé que estás leyendo un\ntebeo, pero llego tarde a trabajar.\nEsto es lo que le dice mi madre a mi\nhermano Javier. Él tiene dieciocho años,\ny normalmente entra en el baño con un\ncómic y tarda mucho en salir.\n– ¡Juan! Comes mucho por la mañana.\nEso es lo que mi abuela Esperanza le\ndice a mi abuelo, que todos los días se\nlevanta con mucha hambre y se come\nseis tostadas con tres tazas de café con leche. Él, durante todo el día, come y duerme.\n– ¡Ramón! ¡Quiero entrar en el servicio! ¡Eres un pesado! ¡Todos los días igual!\nRamón es el hermano de mi padre. No está casado, pero está enamorado de María Ángeles, su secretaria, y todos los días pasa una hora en el baño. Se ducha, se afeita, se viste, se hace el nudo en la corbata mil veces. Sale del baño muy guapo. Pero María Ángeles ya tiene novio... Mi hermana Marta grita a mi tío Ramón todas las mañanas, es la primera que se levanta y la última que entra en el cuarto de baño, siempre llega tarde al trabajo.\nAl fi nal, todos terminamos gritando: mi padre me grita a mí, yo grito a mi hermano Javier, mi madre grita a mi abuela, mi abuela a mi abuelo... Esto es lo que ocurre cada mañana en mi casa antes de salir todos juntos.\n_______________\nmisma та же\ntebeo m комикс\ntarda en salir долго не выходит\nservicio m туалет\npesado зануда\nnudo m узел\ncorbata f галстук\ngritar кричать\núltimo последний\nocurrir происходить\nа) Отметьте единственный правильный вариант:\n1. Es una familia de …\na) ocho personas; b) nueve personas; c) seis personas.\n2. Ramón es el…\na) hermano de Marta y Javier; b) cuñado de la madre del autor;\nc) es el tío de Esperanza.\n3. El abuelo se llama…\na) Javier; b) Juan; c) Ramón.\n4. María Ángeles es…\na) la sobrina de Ramón; b) la novia de Ramón;\nc) la secretaria de Ramón.\n5. Por las mañanas tiene mucho apetito…\na) el padre; b) los hermanos; c) el abuelo.\n6. La primera que se levanta en la familia es…\na) la hermana; b) la madre; c) la abuela.\nб) Закончите предложения:\n1. La madre grita a Javier porque él…\n2. La abuela grita al abuelo porque él…\n3. Marta grita a Ramón porque él…\n4. A Javier le gusta…\n5. A Juan le gusta…\n6. A Ramón le gusta…", "ru": "Утро большой семьи\nКаждое утро в моём доме, когда мы встаём, повторяется одна и та же ситуация. Вот так всё и начинается. – Хавьер! Я знаю, что ты читаешь комикс, но я опаздываю на работу. Это моя мама говорит моему брату Хавьеру. Ему восемнадцать лет, и обычно он заходит в ванную с комиксом и долго не выходит.\n– Хуан! Ты много ешь по утрам. Это моя бабушка Эсперанса говорит моему дедушке, который каждый день встаёт очень голодным и съедает шесть тостов с тремя чашками кофе с молоком. Он целый день ест и спит.\n– Рамон! Я хочу зайти в туалет! Ты зануда! Каждый день одно и то же! Рамон — брат моего отца. Он не женат, но влюблён в Марию Анхелес, свою секретаршу, и каждый день проводит час в ванной. Он моется, бреется, одевается, тысячу раз завязывает узел на галстуке. Из ванной он выходит очень красивым. Но у Марии Анхелес уже есть жених...\nМоя сестра Марта каждое утро кричит на моего дядю Рамона. Она встаёт первой и последней заходит в ванную, всегда опаздывает на работу. В конце концов все начинают кричать: отец кричит на меня, я кричу на брата Хавьера, мама кричит на бабушку, бабушка на дедушку... Вот что происходит каждое утро в моём доме, прежде чем мы все выходим вместе.\nа) 1. c) шесть человек. 2. b) деверь матери автора. 3. b) Хуан. 4. c) секретарша Рамона. 5. c) дедушка. 6. a) сестра.\nб) 1. ...читает комикс в ванной и задерживается. 2. ...он много ест по утрам. 3. ...он целый час сидит в ванной. 4. ...читать комиксы в ванной. 5. ...много есть по утрам. 6. ...быть красивым (ухаживать за собой).", "q": [], "src": "book"}], "8": [{"t": "Mi ciudad", "sp": "Mi ciudad es grande y bonita. En el centro hay una plaza muy amplia con una fuente, y alrededor hay muchos cafés y tiendas. Cerca de la plaza está el ayuntamiento, un edificio antiguo y muy elegante. No lejos de allí hay un parque donde la gente pasea y hace deporte. En mi barrio hay una biblioteca, un mercado y dos farmacias. Lo que más me gusta es el casco antiguo: sus calles son estrechas y tranquilas. Por la noche, la ciudad se ilumina y parece más hermosa.", "ru": "Мой город большой и красивый. В центре есть очень просторная площадь с фонтаном, а вокруг много кафе и магазинов. Рядом с площадью находится мэрия — старинное и очень элегантное здание. Неподалёку есть парк, где люди гуляют и занимаются спортом. В моём районе есть библиотека, рынок и две аптеки. Больше всего мне нравится старый город: его улицы узкие и тихие. Вечером город освещается и кажется ещё красивее.", "q": [["¿Qué hay en el centro de la ciudad?", "Hay una plaza amplia con una fuente."], ["¿Qué hay alrededor de la plaza?", "Hay muchos cafés y tiendas."], ["¿Dónde está el ayuntamiento?", "Está cerca de la plaza."], ["¿Qué edificio es el ayuntamiento?", "Es un edificio antiguo y elegante."], ["¿Qué hay en el barrio?", "Hay una biblioteca, un mercado y dos farmacias."], ["¿Qué es el casco antiguo?", "Es la parte antigua, con calles estrechas y tranquilas."], ["¿Cómo es la ciudad por la noche?", "Se ilumina y parece más hermosa."]], "src": "partial"}, {"t": "Текст из учебника · упр. 16", "sp": "стараясь повторить интонацию и произношение диктора.\n1)\n– Por favor, señora, ¿sabe usted dónde está la calle de Santa\nIsabel? Es que conozco poco esta parte de la ciudad.\n– Sí, lo sé. Pero está bastante lejos de aquí. ¿Va en coche?\n– No .\n– Entonces, mejor tomar el autobús número cinco, bajar en la tercera parada, después ir todo recto hasta llegar a un cruce grande.\nAl doblar la esquina a la derecha ve usted la iglesia de Santa Isabel y precisamente aquí está la calle que está buscando.\n– Gracias. ¿Y dónde está la parada de autobuses?\n– A unos cien metros de aquí. Ahí, enfrente de la fuente. Hay que cruzar la plaza.\n– Gracias, señora.\n– No hay de que.\n_______________\ncruce m перекресток\n2)\n– ¡Oiga! ¿Hay alguna farmacia aquí cerca?\n– Sí, al lado del mercado. A dos cuadras de aquí.\n– Y, ¿cómo se va al mercado?\n– Hay que seguir esta calle y doblar la esquina en la segunda bocacalle. Allí ve usted el mercado, sólo tiene que cruzar la plaza y ya. La farmacia está a la derecha del mercado.\n– ¿Está lejos de aquí? ¿Tardo mucho en llegar?\n– No, está a unos doscientos metros, cinco minutos a pie.\n– ¿Me enseña usted el camino en el\nmapa, por favor? Es que siempre me pierdo.\n– No, ¿para qué? Mejor, la acompaño,\nseñorita.\n– Gracias. Usted es muy amable.\n_______________\nacompañar проводить\namable любезный\n3)\n– Por favor, ¿cómo puedo llegar a la calle Real?\n– No, no lo sé. ¿Qué hay allí? ¿Qué está buscando Ud.?\n– Allí hay un restaurante chino.\n– No, ni idea… Es que no soy de aquí. Lo siento.\n– Perdón por la molestia.\n– Nada.\n_______________\nni idea понятия не имею\nperdón por la molestia извините за беспокойство\nа) Отметьте фразы, соответствующие диалогам (V), а\nфразы, которые не соответствуют (F) и скажите правильный вариант:\n1. El señor tiene que tomar el autobús número cinco y bajar en la quinta parada.\n2. La parada está enfrente de la fuente.\n3. Al llegar a un cruce grande el señor debe doblar la esquina.\n4. La farmacia está a la izquierda del mercado.\n5. Para ir al mercado hay que seguir la calle todo recto hasta la plaza y cruzarla.\n6. La farmacia está a 200 metros.\n7. En la calle Real hay un restaurante argentino.\n8. El transeúnte no sabe cómo llegar a la calle Real porque no es de aquí.", "ru": "1) – Простите, сеньора, вы не знаете, где улица Санта-Исабель? Дело в том, что я плохо знаю эту часть города. – Да, знаю. Но это довольно далеко отсюда. Вы на машине? – Нет. – Тогда лучше сесть на автобус номер пять, выйти на третьей остановке, потом идти прямо до большого перекрёстка. Завернув за угол направо, вы увидите церковь Санта-Исабель, и как раз там находится улица, которую вы ищете. – Спасибо. А где автобусная остановка? – Примерно в ста метрах отсюда. Вон там, напротив фонтана. Нужно перейти площадь. – Спасибо, сеньора. – Не за что.\n2) – Послушайте! Здесь поблизости есть аптека? – Да, рядом с рынком. В двух кварталах отсюда. – А как пройти к рынку? – Нужно идти по этой улице и свернуть за угол на втором перекрёстке. Там вы увидите рынок, нужно только перейти площадь — и всё. Аптека справа от рынка. – Это далеко отсюда? Я долго буду идти? – Нет, это примерно двести метров, пять минут пешком. – Вы не покажете мне дорогу на карте, пожалуйста? Дело в том, что я всегда теряюсь. – Зачем? Лучше я вас провожу, сеньорита. – Спасибо. Вы очень любезны.\n3) – Простите, как мне добраться до улицы Реаль? – Не знаю. А что там? Что вы ищете? – Там китайский ресторан. – Понятия не имею... Дело в том, что я не отсюда. Сожалею. – Извините за беспокойство. – Ничего.\nа) 1. F (на третьей остановке). 2. V. 3. V. 4. F (справа от рынка). 5. V. 6. V. 7. F (китайский ресторан). 8. V.", "q": [], "src": "book"}], "9": [{"t": "El metro de Madrid", "sp": "Vivo en Madrid y siempre voy al trabajo en metro. El metro de Madrid es rápido y cómodo; creo que es mejor que el autobús, sobre todo por la mañana, cuando hay mucho tráfico. Compro un abono mensual, que es más barato que los billetes sencillos. En la estación hay que mirar el plano y elegir la línea correcta. A veces el tren va lleno y no hay sitio para sentarse. Viajo veinte minutos y luego ando cinco minutos hasta la oficina.", "ru": "Я живу в Мадриде и всегда езжу на работу на метро. Мадридское метро быстрое и удобное; думаю, оно лучше автобуса, особенно утром, когда большой трафик. Я покупаю месячный проездной, он дешевле отдельных билетов. На станции нужно посмотреть схему и выбрать нужную линию. Иногда поезд идёт полный, и нет места, чтобы сесть. Я еду двадцать минут, а затем пять минут иду до офиса.", "q": [["¿Cómo va al trabajo?", "Va al trabajo en metro."], ["¿Cómo es el metro de Madrid?", "Es rápido y cómodo."], ["¿Qué es mejor, el metro o el autobús? ¿Por qué?", "El metro es mejor, sobre todo cuando hay mucho tráfico."], ["¿Qué compra para viajar?", "Compra un abono mensual."], ["¿Qué hay que hacer en la estación?", "Hay que mirar el plano y elegir la línea correcta."], ["¿Cómo va el tren a veces?", "A veces va lleno y no hay sitio para sentarse."], ["¿Cuánto tiempo tarda?", "Veinte minutos en metro y cinco a pie."]], "src": "partial"}, {"t": "Текст из учебника · упр. 19", "sp": "ложения в соответствии с его содержанием.\nEl hombre vive a … de Madrid y normalmente va al trabajo ...\nporque no hay ninguna … cerca de su casa. Si no hay problemas él tarda … en … pero si hay algún … tarda … . No le gusta mucho conducir pero … porque de regreso a casa debe… del colegio.\nLa joven vive en … y tiene que ir a la … que está al norte.
