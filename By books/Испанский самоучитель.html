 "podrán", "pondrán", "querrán", "saber", "salir", "tener", "venir", "haber", "sabré", "saldré", "tendré", "vendré", "habré", "sabrás", "saldrás", "tendrás", "vendrás", "habrás", "sabrá", "saldrá", "tendrá", "vendrá", "habrá", "sabremos", "saldremos", "tendremos", "vendremos", "habremos", "sabréis", "saldréis", "tendréis", "vendréis", "habréis", "sabrán", "saldrán", "tendrán", "vendrán", "habrán", "Futuro simple в испанском языке употребляется в двух значениях: временнóм и модальном.", "Во временнóм значении futuro simple выражает будущее действие по отношению к настоящему моменту и сопровождается следующими наречиями и наречными оборотами:", "mañana", "завтра", "pasado mañana", "послезавтра", "la semana que viene", "la próxima semana", "на следующей неделе", "la semana siguiente", "el mes que viene", "el próximo mes", "в следующем месяце", "el mes siguiente", "el año que viene", "el próximo año", "в следующем году", "el año siguiente", "dentro de ... 5 días", "через … 5 дней", "pronto", "скоро", "Например:", "Dentro de dos semanas", "Через две недели мне", "cumpliré 20 años.", "исполнится 20 лет.", "¿Me enseñarás a tocar la", "Ты научишь меня играть на", "guitarra?", "гитаре?", "El mes que viene viajaremos a", "В следующем месяце мы", "Chile.", "отправимся в путешествие в", "Чили.", "В модальном значении futuro simple выражает возможное действие или предположение, одновременное по отношению к моменту речи. При переводе на русский язык используются следующие наречия: наверное, возможно, вероятно, скорее всего, может быть и т.п. При переводе вопросительных предложений используется наречие неужели.", "Например:", "¿Qué hora es? – Serán las", "Который час? – Сейчас часов", "seis.", "шесть.", "Ana trabajará en la agencia", "Анна, наверное (возможно, вероde viajes.", "ятно, скорее всего, может быть),", "работает в бюро путешествий.", "¿Vivirás en la calle", "Неужели ты живешь на улице СерCervantes?", "вантеса?"]}, {"h": "§2. Неопределенные и отрицательные местоимения", "b": ["В испанском языке существуют следующие формы неопределенных и отрицательных местоимений:", "неопределенные местоимения отрицательные местоимения algo что-нибудь / что-то nada ничто alguien кто-нибудь / кто-то nadie никто alguno, -a, -os, -as какой (какая, ninguno, -a никакой, никакая какие)- нибудь", "Если отрицательное местоимение стоит перед глаголом, то глагол употребляется в утвердительной форме. Если же оно следует за глаголом, то глагол употребляется в отрицательной форме.", "Например:", "¿Quieres comprar algo? – No", "Ты хочешь купить чтоquiero comprar nada. / Nada", "нибудь? – Я ничего не хочу", "quiero comprar.", "покупать.", "Alguien llama a la puerta.", "Кто-то звонит в дверь.", "Nadie llama a la puerta. / No", "Никто не звонит в дверь.", "llama nadie.", "Alguno и ninguno перед существительными мужского рода единственного числа имеют усеченную форму algún и ningún.", "Если существительное отсутствует, то употребляется полная форма аlguno и ninguno.", "Например:", "¿Tienes algún periódico de hoy?", "У тебя есть какая-нибудь", "– No, no tengo ningún periódico. /", "сегодняшняя газета? – Нет, у", "No, no tengo ninguno.", "меня нет никакой газеты.", "¿Conoce usted a alguna", "Вы знаете какую-нибудь", "enfermera buena? – No, no", "хорошую медсестру? – Нет, я", "conozco a ninguna enfermera.", "не знаю никакой медсестры.", "Местоимения ninguno, ninguna, как правило, не употребляются в форме множественного числа (кроме случаев согласования с существительными, которые имеют только форму множественного числа: ningunas vacaciones).", "No tengo ningún proyecto,", "У меня нет никаких проектов,", "ninguna idea.", "никаких идей.", "Местоимения alguien и nadie не употребляются с предлогом de в значении «кто-нибудь из» и «никто из», вместо них соответственно употребляются местоимения alguno (a, os, as) de и ninguno(-a) de.", "¿Le cree a Luis alguno de", "Кто-нибудь из вас верит", "vosotros? – No, ninguno de", "Луису? – Нет, никто из нас", "nosotros le cree.", "ему н bes agradecerles", "Ты сам должен поблагодарить", "su ayuda.", "их за помощь.", "Если это местоимение стоит перед существительным, то оно употребляется с определенным артиклем el mismo (la misma, los mismos, las mismas) и переводится на русский язык как тот же самый, та же самая, те же самые:", "Él vive en el mismo pueblo, en", "Он живет в той же деревне,", "la misma casa. Tiene los mismos", "в том же доме. У него те же", "proyectos y las mismas ideas.", "проекты и те же планы.", "Мismo после наречий времени и места имеет усилительное значение и переводится на русский язык как частица же:", "ahora mismo сейчас же", "hoy mismo сегодня же", "mañana mismo завтра же", "aquí mismo здесь же"]}, {"h": "§3. Pretérito imperfecto de indicativo", "b": ["(простое прошедшее время несовершенного вида", "изъявительного наклонения)", "Pretérito imperfecto выражает продолжительное, несовершенное, незавершенное или регулярно повторяющееся действие в прошлом.", "Употребление этого времени часто сопровождается следующими наречиями и наречными оборотами:", "todos los días", "каждый день", "cada mes", "каждый месяц", "generalmente", "в основном", "regularmente", "регулярно", "habitualmente", "обычно", "de costumbre", "обычно", "a veces", "иногда", "de vez en cuando", "время от времени", "cada vez que", "каждый раз, когда", "a menudo", "часто", "con frecuencia", "часто", "mientras", "в то время, как / пока", "Образуется с помощью прибавления следующих окончаний к основе глагола:", "entrar", "comer", "vivir", "entr-aba", "com-ía", "viv-ía", "entr-abas", "com-ías", "viv-ías", "entr-aba", "com-ía", "viv-ía", "entr-ábamos", "com-íamos", "viv-íamos", "entr-abais", "com-íais", "viv-íais", "entr-aban", "com-ían", "viv-ían", "Исключения:", "ser era, eras, era, éramos, erais, eran", "ir iba, ibas, iba, íbamos, ibais, iban", "ver veía, veías, veía, veíamos, veíais, veían"]}], "12": [{"h": "§1. Календарь", "b": ["El año tiene 4 estaciones:", "В году 4 времени года:", "el invierno", "зима", "la primavera", "весна", "el verano", "лето", "el otoño", "осень", "El año tiene 12 meses:", "В году 12 месяцев:", "enero", "январь", "febrero", "февраль", "marzo", "март", "abril", "апрель", "mayo", "май", "junio", "июнь", "julio", "июль", "agosto", "август", "septiembre", "сентябрь", "octubre", "октябрь", "noviembre", "ноябрь", "diciembre", "декабрь", "Los días de la semana son:", "Дни недели:", "lunes", "понедельник", "martes", "вторник", "miércoles", "среда", "jueves", "четверг", "viernes", "пятница", "sábado", "суббота", "domingo", "воскресенье", "El fi n de semana", "Конец недели, или выходные", "Например:", "¿A cuántos estamos hoy?", "– Estamos a dos de enero. ¿Qué", "Какое сегодня число?", "fecha es hoy?", "– Сегодня 2 января.", "– Hoy es el dos de enero.", "¿Qué día de la semana es hoy?", "Какой сегодня день недели?", "– Hoy es lunes.", "– Сегодня понедельник.", "¿En qué mes estamos?", "Какой сейчас месяц?", "– Estamos en enero.", "– Сейчас январь.", "¿En qué estación del año", "Какое сейчас время года?", "estamos?", "– Сейчас зима.", "– Estamos en invierno.", "¿Cuándo es tu (su) cumpleaños?", "Когда у тебя (Вас) день рождения?", "– Mi cumpleaños es el", "– Мой день рождения 21 марта.", "veintiuno de marzo.", "¿Cuándo es el cumpleaños", "Когда день рождения твоего", "de tu abuelo? – El cumpleaños", "деда? – День рождения моего", "de mi abuelo es el primero de", "деда первого апреля.", "abril.", "Порядковое числительное употребляется с первым днем месяца, а количественное числительное со всеми остальными:", "El primero / uno de mayo. Первое мая.", "El diez de julio. Десятое июля.", "Дни недели в испанском языке пишутся со строчной буквы и употребляются с определенным артиклем без предлога в следующих выражениях:", "el lunes (martes, miércoles, jueves, viernes, sábado, domingo)", "в понедельник (вторник, среду, четверг, пятницу, субботу, воскресенье)", "los lunes (martes, miércoles, jueves, viernes, sábados, domingos)", "по понедельникам (вторникам, средам, четвергам, пятницам, субботам, воскресеньям).", "Например:", "El domingo van al campo.", "В воскресенье они едут за", "город.", "Los miércoles ella no trabaja.", "По средам она не работает.", "Este fi n de semana vamos a ver", "В эти выходные мы идем", "a nuestros padres.", "в гости к родителям."]}, {"h": "§2. Сравнительная характеристика употребления", "b": ["idefi nido / imperfecto", "Pretérito indefi nido (простое прошедшее время совершенного вида) отвечает на вопрос что сделал? и выражает:", "• действие, совершенное в конкретный, завершившийся период времени в прошлом и не имеющее непосредственной связи с настоящим. Употребление этого времени часто сопровождается следующими наречиями и наречными оборотами:", "ayer", "el verano pasado", "anteayer", "el año pasado", "aquel día", "hace poco", "el año pasado", "hace mucho", "el mes pasado", "hace ... 3 años", "la semana pasada", "El 12 de octubre de 1492", "12 октября 1492 года Колумб", "Colón descubrió América.", "открыл Америку.", "El sábado pasado fuimos de", "В прошлую субботу мы ходили", "compras al centro comercial.", "за покупками в торговый центр.", "• несколько кратких, завершенных действий в прошлом, следующих друг за другом:", "Ayer me levanté a las siete,", "Вчера я встал в 7 часов, принял", "me duché, desayuné, oí las", "душ, позавтракал, послушал", "noticias y salí de casa.", "новости и вышел из дома.", "• действие, развивавшееся в длительный, но завершенный период времени в прошлом, или завершенное действие в прошлом, повторявшееся несколько раз (но не регулярно). В этом случае употребление Pretérito indefi nido сопровождается наречиями и наречными оборотами, которые указывают на период действия, например:", "ayer todo el día", "muchos años", "de nueve a cinco", "cien veces", "todo el mes pasado", "muchas veces", "diez años", "dos semanas", "Ayer Jorge me llamó cinco", "Вчера Хорхе звонил мне пять", "veces.", "раз.", "Anteayer ellos se divirtieron", "Позавчера они развлекались", "todo el día.", "весь день.", "Estuve enferma dos semanas.", "Я болела две недели.", "Pretérito imperfecto (прошедшее время несовершенного вида) отвечает на вопрос что делал? и употребляется:", "• для описания действий в прошлом, которое обычно сопровождается следующими наречиями и наречными оборотами:", "entonces тогда", "en verano", "antes раньше", "en aquellos tiempos", "En los años noventa Ana", "В 90-е годы Анна училась", "estudiaba en la universidad.", "в университете. Она была", "Era delgada, guapa, alegre.", "стройная, красивая, веселая.", "Tenía muchos amigos.", "У нее было много друзей.", "• для выражения регулярно повторяющихся действий в прошлом. В этом случае употребление Pretérito imperfecto сопровождается такими наречиями и наречными оборотами, как:", "todos los días", "a veces", "cada verano", "de vez en cuando", "generalmente", "cada vez que", "regularmente", "a menudo", "habitualmente", "con frecuencia", "De vez en cuando nos veíamos", "Время от времени мы", "y cada vez él me preguntaba", "встречались, и каждый раз он", "por ti.", "меня спрашивал о тебе.", "• для выражения нескольких длительных, параллельных действий в прошлом, после наречий:", "cuando", "mientras", "Mientras Elena preparaba", "Пока Елена готовила ужин,", "la cena, la familia veía la tele.", "семья смотрела телевизор.", "Cuando volvíamos a casa,", "Когда мы возвращались домой,", "llovía.", "шел дождь.", "• для выражения незавершенного, длительного действия в прошлом, на фоне которого происходит другое, однократное действие:", "Mientras Marisol hablaba por", "Пока Марисоль говорила по", "teléfono, el gato comió todo el", "телефону, кот съел всю рыбу.", "pescado.", "Estábamos sentados a la mesa y", "Мы сидели за столом и", "almorzábamos cuando alguien", "обедали, когда что-то", "llamó a la puerta.", "позвонил в дверь.", "Eran las siete cuando me", "Было 7 часов, когда я", "desperté.", "проснулся.", "• для выражения настоящего времени в прошедшем, при трансформации прямой речи в косвенную:", "Doña Rosa dijo: “Mis nietos desДонья Роза сказала: «Мои внуки cansan en la costa del mar”. →", "отдыхают на море». →", "Doña Rosa dijo que sus nietos", "Донья Роза сказала, что ее", "descansaban en la costa del mar.", "внуки отдыхают на море."]}, {"h": "§3. Конструкция al + infi nitivo", "b": ["Конструкция al + infi nitivo переводится деепричастным оборотом или придаточным предложением с союзом когда, если в предложении одно подлежащее, общее для инфинитивного оборота и главной части предложения:", "Al bajar del coche Juan nos", "Выйдя из машины, Хуан поздоровалha saludado.", "ся с нами. / Когда Хуан вышел из машины, он поздоровался с нами..", "Cada mañana al subir al", "Каждое утро, садясь в машину, Хуан", "coche Juan ponía la radio.", "включал радио. / Каждое утро, когда", "Хуан садился в машину, он включал", "радио", "Если же инфинитивный оборот имеет собственное подлежащее, то на русский язык он переводится только с помощью придаточного предложения времени с союзом когда:", "Al venir el padre del trabajo,", "Когда приходит отец с работы,", "la familia se sienta a cenar.", "семья садится ужинать."]}, {"h": "§4. Pretérito pluscuamperfecto", "b": ["de indicativo (предпрошедшее время", "изъявительного наклонения)", "Pluscuamperfecto de indicativo (предпрошедшее время) выражает законченное действие, совершенное в прошлом и предшествующее другому действию или моменту в прошлом.", "Образуется с помощью вспомогательного глагола haber в форме imperfecto de indicativo и participio причастия смыслового глагола. Причастие в этом случае не изменяется ни в роде, ни в числе. Вспомогательный глагол и причастие неразделимы.", "Между ними не может быть других слов (отрицания, местоимения и т. п.):", "haber +", "participio", "había", "hablado", "habías", "comido", "había", "salido", "habíamos", "hecho", "habíais", "escrito", "habían", "roto", "Para la fi esta Sofía se puso el", "На праздник София надела", "vestido que le había traído su", "платье, которое ей привез", "муж из Парижа.", "marido de París.", "Hace poco a Anita le regalaron", "Недавно Аните подарили", "el perro con que había soñado", "собаку, о которой она так", "tanto.", "мечтала.", "Ayer para las diez ya habíamos", "Вчера к десяти часам, мы уже", "discutido este asunto.", "обсудили это дело."]}], "13": [{"h": "§1. Условные предложения I типа", "b": ["Условные предложения I типа выражают реальное условие, относящееся к настоящему, прошедшему или будущему действию. Для выражения будущего действия в данных предложениях употребляется настоящее время Presente de indicativo.", "Придаточные условные предложения вводятся союзом si если.", "Сравните:", "Si Paco vuelve tarde,", "Если Пако возвращается поздно,", "cena solo.", "он ужинает один.", "Si Paco volvía tarde,", "Если Пако возвращался поздно,", "cenaba solo.", "он ужинал один.", "Si Paco ya ha vuelto,", "Если Пако уже вернулся,", "no cenará solo.", "он не будет ужинать один.", "Si mañana Paco vuelve", "Если завтра Пако вернется", "tarde, no cenará.", "поздно, он не будет ужинать."]}, {"h": "§2. Modo potencial (condicional). Potencial simple", "b": ["(будущее в прошедшем/простое условное время)", "Глаголы в Potencial simple спрягаются путем присоединения к инфинитиву всех трех спряжений следующих окончаний:", "hablar", "aprender", "vivir", "hablar-ía", "aprender-ía", "vivir-ía", "hablar-ías", "aprender-ías", "vivir-ías", "hablar-ía", "aprender-ía", "vivir-ía", "hablar-íamos", "aprender-íamos", "vivir-íamos", "hablar-íais", "aprender-íais", "vivir-íais", "hablar-ían", "aprender-ían", "vivir-ían", "Исключения составляют те же глаголы, которые имели особенности спряжения в futuro simple:", "poder podría, podrías, podría, podríamos, podríais, podrían querer querría, querrías, querría, querríamos, querríais, querrían saber sabría, sabrías, sabría, sabríamos, sabríais, sabrían haber habría, habrías, habría, habríamos, habríais, habrían poner pondría, pondrías, pondría, pondríamos, pondríais, pondrían salir saldría, saldrías, saldría, saldríamos, saldríais, saldrían tener tendría, tendrías, tendría, tendríamos, tendríais, tendrían venir vendría, vendrías, vendría, vendríamos, vendríais, vendrían decir diría, dirías, diría, diríamos, diríais, dirían hacer haría, harías, haría, haríamos, haríais, harían", "Potencial simple в испанском языке употребляется в трех значениях: временнóм, модальном и условном.", "Во временнóм значении potencial simple выражает действие последующее по отношению к моменту речи в прошлом:", "Ayer nos informaron de que", "Вчера нам сообщили, что соla reunión de los socios se брание членов (ассоциации) соcelebraría en La Habana.", "стоится в Гаване.", "El vecino me aseguró que me", "Сосед заверил меня, что мне", "gustaría el hotel.", "понравится этот отель.", "Hace dos semanas les", "Две недели назад ты пообещал", "prometiste a los padres", "родителям, что арендуешь им", "que les alquilarías un coche", "машину по Интернету.", "por Internet.", "Por la radio comunicaron que", "По радио сообщили, что ночью", "por la noche nevaría mucho.", "будет сильный снегопад.", "В условном значении potencial simple выражает возможное или желаемое действие, одновременное по отношению к моменту речи или следующее за ним. При переводе на русский язык появляется частица бы:", "Ahora tomaría un té.", "Сейчас я бы выпила чаю.", "Me gustaría ir a las islas", "Мне бы хотелось поехать на", "Canarias.", "Канары.", "Podríamos discutir esta", "Мы могли бы обсудить этот", "cuestión hoy mismo.", "вопрос сегодня же.", "В модальном значении potencial simple выражает возможное действие или предположение во временнóм плане imperfecto de indicativo. При переводе на русский язык используются следующие наречия: наверное, возможно, вероятно, скорее всего, должно быть и т.п.:", "Serían las once cuando vino", "Было часов 11, когда пришел", "Jorge.", "Хорхе.", "Cuando Lola estudiaba en el", "Когда Лола училась в школе,", "colegio, ella soñaría con ser", "она возможно (скорее всего /", "actriz.", "может быть) мечтала стать", "актрисой."]}, {"h": "§3. Concordancia de los tiempos", "b": ["(согласование времен", "изъявительного наклонения).", "Перевод прямой речи", "в косвенную", "В испанском языке время сказуемого придаточного предложения зависит от времени сказуемого главного предложения и подчиняется определенным правилам согласования времен в сложном предложении: concordancia de los tiempos.", "Примером согласования времен может служить перевод", "прямой речи в косвенную, поскольку косвенная речь является выражением прямой речи в форме сложноподчиненного дополнительного предложения.", "При переводе прямой речи в косвенную надо учитывать некоторые грамматические особенности, которые во многом совпадают с русским языком.", "Например:", "Él dice: “Mi hija me ha enviado una carta”. → Él dice que su hija le ha enviado una carta.", "Él nos pregunta: “¿Celebraréis el cumpleaños de vuestro tío el viernes?” → Él nos pregunta si celebraremos el cumpleaños de nuestro tío el viernes.", "Él pregunta: “¿A quién has traído estos recuerdos?” → Él pregunta a quién he traído estos recuerdos.", "Если глагол главного предложения стоит в одном из времен плана настоящего (presente, futuro, pretérito perfecto), то в придаточном предложении время не меняется:", "главное", "прямая речь", "косвенная речь", "предложение", "presente", "presente", "→ presente", "pretérito perpretérito perfecto", "→pretérito perfecto", "fecto", "indefi nido", "→ indefi nido", "futuro", "imperfecto", "→ imperfecto", "futuro simple", "→ futuro simple", "Ana dice (ha", "“Ahora vivo aquí”", "→ que ahora ella vive aquí.", "dicho, dirá):", "“Hoy he visto a Lola”", "→ que hoy ella ha visto a", "Lola.", "“Ayer fui al cine”", "→ que ayer ella fue al cine.", "“Antes yo cantaba", "→ que antes ella cantaba", "bien”", "bien.", "“Mañana volveré", "→ que mañana volverá", "tarde”", "tarde.", "Если глагол главного предложения стоит в одном из времен плана прошедшего (indefi nido, imperfecto), то в придаточном предложении время меняется:", "прямая речь", "косвенная ктивно употребляются различные инфинитивные перифразы, которые служат для передачи следующих значений:", "ir a + inf – собираться что-то сделать (обозначает действие, которое должно совершиться в ближайшем будущем, при этом глагол ir утрачивает свое лексическое значение и играет роль вспомогательного глагола);", "Hoy Teresa va a jugar al tenis", "Сегодня Тереза собирается", "con mi hermana.", "поиграть в теннис с моей", "сестрой.", "¿Vas a participar en el torneo de", "Ты собираешься участвовать в", "ajedrez?", "турнире по шахматам?", "Vamos a celebrar el triunfo", "Давайте отпразднуем победу", "de nuestra selección", "нашей сборной по футболу.", "de fútbol.", "empezar a + inf. – начинать делать что-либо (как правило, с указанием времени, долгосрочно)", "ponerse a + inf. – начинать делать что-либо, приниматься за что-либо (спонтанно)", "echarse a + inf. (reír, llorar, gritar) – рассмеяться, расплакаться, закричать (эмоции)", "echar a + inf. (correr) – броситься бежать (резкое начало движения);", "Nuestro equipo empieza", "Наша команда начинает", "a entrenarse a las seis", "тренироваться в шесть утра,", "de la mañana, ¿y el", "а ваша?", "vuestro?", "Después del partido los", "После матча репортеры", "reporteros se pusieron", "принялись обсуждать причины", "a discutir los motivos", "нашего поражения.", "de nuestra derrota.", "El niño cayó de la bicicleta,", "Ребенок упал с велосипеда,", "rompió la rodilla y se echó a", "разбил коленку и расплакался.", "llorar.", "De repente él se levantó y echó", "Вдруг он поднялся и стал", "a andar por el despacho sin", "ходить по кабинету, не", "hacer caso a nadie.", "обращая ни на кого внимания.", "terminar de + inf. – заканчивать делать что-либо (как правило, с указанием времени)", "dejar de + inf. – заканчивать, переставать делать что-либо acabar de + inf. – только что сделать что-либо (употребляется только в presente или imperfecto);", "¿A qué hora termináis de", "В котором часу вы", "trabajar los viernes?", "заканчиваете работа  a", "Почему ты меня заставляешь", "todo el mundo?", "всем лгать?", "Su broma nos hizo reír a todos.", "Его шутка нас всех", "рассмешила."]}, {"h": "§4. Местоименная реприза", "b": ["В испанском языке в повествовательном предложении, как правило, прямой порядок слов (подлежащее + сказуемое + дополнения + обстоятельство). В том случае, если предложение начинается не с подлежащего, а с дополнения, то необходимо повторить это дополнение соответствующей формой местоимения–дополнения. Оно ставится перед глаголом в личной форме или после инфинитива.", "Например:", "La madre ha preparado la cena", "Мама приготовила ужин, а", "y la hija va a poner la mesa.", "дочка накроет на стол. →", "→ La cena la ha preparado la", "Ужин приготовила мама, а на", "madre y la mesa va a ponerla", "стол накроет дочка.", "la hija."]}], "15": [{"h": "§1. Modo imperativo afi rmativo (утвердительная", "b": ["форма повелительного наклонения)", "Modo imperativo afi rmativo (утвердительная форма повелительного наклонения) передает приказ, инструкцию или предложение что-нибудь сделать.", "• Форма глаголов 2-го лица единственного числа (tú) полностью совпадает с формой 3-го лица единственного числа настоящего времени изъявительного наклонения:", "¡habla! ¡come! ¡sube!", "Исключения:", "decir", "di", "poner", "pon", "ir", "ve", "salir", "sal", "ser", "sé", "tener", "ten", "hacer", "haz", "venir", "ven", "• Форма imperativo afi rmativo для 2-го лица множественного числа (vosotros) образуется путем замены согласного –r в окончании инфинитива на согласный –d:", "¡hablad! ¡comed! ¡subid!", "• Вежливая форма imperativo afi rmativo для 3-его лица единственного и множественного числа (usted, ustedes) и форма", "1-го лица множественного числа (nosotros) образуется с помощью прибавления следующих окончаний к основе глагола:", "hablar", "comer", "subir", "usted", "habl-e", "com-a", "sub-a", "ustedes", "habl-en", "com-an", "sub-an", "nosotros", "habl-emos", "com-amos", "sub-amos", "Для образования форм usted, ust  "experimento", "Miguel", "Jorge", "ecologista", "exótico", "malagueño", "garaje", "queso", "excelente", "guillotina", "ingeniero", "equipaje", "éxito", "pingüino", "gigante", "quiero", "oxígeno", "cigüeña", "reloj", "queja", "México"]}, {"h": "Ejercicio 4. Прослушайте испанские скороговорки.", "b": ["Повторите за диктором и выучите их наизусть:", "El perro de San Roque no tiene rabo.", "Tres tristes tigres comen trigo en el trigal.", "Como poco coco como poco coco compro."]}, {"h": "Ejercicio 5. Прослушайте звучание испанских слов", "b": ["с дифтонгами и трифтонгами и произнесите их за диктором:", "aire", "cuento", "puente", "limpiáis", "aula", "veinte", "hierba", "limpiéis", "siete", "fl auta", "llueve", "Uruguay", "radio", "criado", "triunfo", "continuáis", "bueno", "guapo", "trauma", "paraguayo", "pueblo", "edifi cio", "causa", "estudiáis", "Daniel", "Europa", "neutral", "estudiéis"]}, {"h": "Ejercicio 8. Поставьте графическое ударение, где", "b": ["это необходимо (ударная гласная выделена):", "melodia, industria, fauna, economia, atmosfera, aeropuerto,", "Lopez, ingles, aleman, biblioteca, aura, guerrillero, periodico, peninsula Iberica, oceano Atlantico, director, Jose, Mario, Maria,", "Ines, Pilar, Juan, Mercedes, Carmen, Laura, Andres, historia, compositor."]}, {"h": "Ejercicio 9. Прослушайте слова, которые произно-", "b": ["сит диктор, и запишите их. Поставьте, где нужно, ударение.", "Тема: Формы приветствия", "и обращения", "\u0002 Прочитайте и запомните формы приветствия и прощания:", "Hola", "Привет", "Buenos días", "Здравствуй(те)", "или доброе утро [до 12.00]", "Buenas tardes", "Добрый день", "Buenas noches", "Добрый вечер", "Hasta luego", "Пока", "Hasta pronto", "До скорого", "Hasta la vista", "До свидания", "Hasta mañana", "До завтра", "Buenas noches", "Спокойной ночи", "Adiós", "Прощай(те), с богом", "¡Hola! – самое распространенное в испанском языке приветствие. Это примерный эквивалент русского «здравствуйте» и «привет». Оно подходит как для дружеской и неформальной обстановки, так и в общении с незнакомыми людьми.", "\u0002 Полезные слова и выражения:", "¿Qué tal?", "Как дела?", "¿Qué tal la vida?", "Как жизнь?", "¿Qué tal la familia?", "Как семья?", "Bien, gracias.", "Спасибо, хорошо.", "Todo va bien.", "Все хорошо (дословно: Все идет", "хорошо).", "Más o menos bien.", "Более или менее хорошо.", "Así así. / Regular.", "Так себе.", "Por favor.", "Пожалуйста. / Будьте добры (при", "обращении с просьбой)", "Muchas gracias.", "Большое спасибо.", "De nada.", "Пожалуйста. / Не за что.", "Практически неотъемлемой частью испанского приветствия является вопрос ¿Qué tal? Как правило, это всего лишь формула вежливости, и не стоит вдаваться в пространные объяснения. Достаточно ответить коротко: Bien, gracias или Todo va bien, gracias.", "Во всех общественных местах жители Испании здороваются и прощаются даже с незнакомыми людьми. Они могут спокойно заговорить с людьми, которых видят в первый раз. Мужчины обязательно пожимают руки, как при знакомстве, так и при любой встрече. Для испанцев является нормальным похлопать собеседника по спине или по плечу, потрепать по щеке, взять за руку. Женщины при встрече обычно целуют друг друга в обе щеки", "(скорее имитируют поцелуй, касаясь друг", "друга сначала правыми щеками, затем", "левыми щеками и издавая звук поцелуя). При расставании происходит тот же ритуал.", "Формы обращения", "В каждой стране есть свои нормы обращения к людям, и нарушать их весьма нежелательно. Общаясь с человеком в официальной ситуации, следует обращаться к нему по фамилии, употребляя перед ней слова señor, señora, señorita.", "Señor – обращение к мужчине.", "Señora – обращение к замужней женщине.", "Señorita – обращение к незамужней женщине или девушке, а также к женщинам, занятым в сфере обслуживания (продавщицы, горничные, телефонистки, медсестры и др.). В последнем случае возраст не всегда имеет значения.", "Señorita может также употребляться перед именем.", "Обращение don, doña употребляются только перед именем человека."]}, {"h": "Ejercicio 11. Скажите по-испански:", "b": ["привет, спасибо, как дела?, как жизнь?, до свидания, добрый день, прощайте, как семья?"]}], "2": [{"h": "Ejercicio 1. Образуйте множественное число:", "b": ["el chico → los chicos", "el amigo →", "la tarde →", "el día →", "la mano →", "la vida →", "la estudiante →", "el aula →", "el lápiz →", "la calle →", "la ciudad →", "el problema →", "el agua →"]}, {"h": "Ejercicio 2. Образуйте единственное число:", "b": ["las casas → la casa", "los hombres →", "los planetas →", "las playas →", "las madres →", "los economistas →", "los policías →", "los libros →", "las almas →", "las amas →", "los temas →", "las fl ores →", "las operaciones →"]}, {"h": "Ejercicio 3. Поставьте определенный артикль перед", "b": ["следующими существительными:", "... museo, ... manos, ... día, ... verdad, ... lápices, ... sal, … coches,", "... café, ... amigas, ... libros, ... chica, ... país, … madre, ... planeta,", "... sol, ... noche, ... crisis, … avión, ... luz, ... programa, ... hombres,", "... felicidad, … hambre."]}, {"h": "Ejercicio 4. Поставьте неопределенный артикль пе-", "b": ["ред следующими существительными:", "… coche, … amigo, … libros, … policía, … operaciones,", "… hombre, … problemas, … días, … casas, … país, … temas, … fl or,", "… mano, … estudiante, … café, … ciudad, … tarde, … museos,", "… águila, … cuestión."]}, {"h": "Ejercicio 6. Согласуйте существительные с прилага-", "b": ["тельными по образцу и переведите словосочетания на", "русский язык:", "a) un señor gordo → una señora gorda", "1. un día largo → una calle …", "2. un coche caro → una casa …", "3. un hombre casado → una mujer …", "4. un café caliente → una mano …", "5. un padre feliz → una madre …", "6. un museo grande → una ciudad …", "7. un tema raro → una operación …", "8. un policía joven → una señorita …", "b) una casa nueva → las casas nuevas", "1. un libro interesante →", "2. una fl or blanca →", "3. un amigo enfermo →", "4. una mujer усский язык:", "Doña Teresa … la madre de Andrés García.", "Lurdes y yo no … de Madrid, … de Valencia.", "Los padres de Raquel Domínguez … abogados.", "Usted … actriz y yo … músico.", "Tú y yo … estudiantes.", "La amiga de Luis … profesora, … de Granada.", "Tú no … periodista, … poeta.", "Isabel … la hermana de Jorge, Juan … el hermano de Jorge.", "Isabel y Juan … los hermanos de Jorge.", "Nosotras … alumnas y ellas … estudiantes.", "Francisco y tú … de Bélgica, Constantino y yo … de Holanda."]}, {"h": "Ejercicio 12. Переведите на испанский язык:", "b": ["1. Мы – студенты. 2. Ты не из Москвы, ты из Саратова. 3. Мы с Мигелем – друзья. 4. Анна – сестра Феликса. 5. Вы – банкир, а она – адвокат. 6. Родители Андрея – врачи. 7. Вы с Филиппом художники, вы из Германии. 8. Диего – повар, а я – официантка.", "9. Рикардо Лопес – брат Сусанны, он – писатель. 10. Ты – друг", "Рафаэля, ты – строитель, ты из Турции.", "Глагол estar быть, находиться также выполняет роль глагола-связки. Выучите его спряжение в настоящем времени:", "ESTAR", "yo", "estoy", "nosotros", "estamos", "nosotras", "estamos", "tú", "estás", "vosotros", "estáis", "vosotras", "estáis", "él", "está", "ellos", "están", "ella", "está", "ellas", "están", "usted", "está", "ustedes", "están", "Глагол estar употребляется для обозначения:", "– местонахождения (временного или постоянного)", "– временного признака или состояния, возникшего в результате какого-либо действия.", "Например:", "Los amigos están en la playa.", "Друзья (находятся) на пляже.", "Nosotros estamos en casa y tú", "Мы (находимся) дома, а ты", "estás en la oficina.", "(находишься) на работе.", "Lola está enferma.", "Лола больна.", "Estoy bien.", "Я хорошо себя чувствую.", "Usted está contento.", "Вы довольны.", "Некоторые прилагательные могут сочетаться как с глаголом ser, так и с глаголом estar. В зависимости от того, какой из глаголов выбран, изменится смысл высказывания.", "Сравните:", "José es alegre.", "José está alegre.", "Хосе веселый.", "Хосе весел.", "(по характеру веселый", "(в данный момент)", "человек)", "Pilar es guapa.", "Pilar está guapa.", "Пилар красивая.", "Пилар нарядная.", "Es una cuestión regular.", "Estoy regular.", "Обычный вопрос.", "Я неважно себя чувствую."]}, {"h": "Ejercicio 13. Проспрягайте следующие словосочета-", "b": ["ния в настоящем времени:", "estar en la playa", "no estar en casa, estar en clase", "no estar en España, estar en Moscú", "estar enfermo", "no estar bien, estar regular", "yo", "Ramón y yo", "tú", "vosotras Claudia", "Teresa y Nicolás", "usted", "ellos"]}, {"h": "Ejercicio 14. Измените предложения по образцу:", "b": ["Yo estoy bien. → Carlos y yo estamos bien.", "Tú estás en la universidad. → Pablo y tú …", "Amparo está guapa. → Amparo y Consuelo …", "Usted está en Atenas. → Ustedes …", "Vosotras estáis contentas. → Yo …", "Don Miguel y doña Carmen están en la playa. → Gabriel …", "Yo estoy enfermo. → Ignacio y yo ….", "Ellos no están en casa. → Pilar …", "Mercedes y yo estamos en el museo. → José y Ramón …", "Inés no está mal. → Tú …", "Felipe y tú estáis en la calle. → Usted …"]}, {"h": "Ejercicio 15. Поставьте глагол estar в соответствую-", "b": ["щую форму и переведите фразы на русский язык:", "Doña Teresa … mal, … enferma.", "Lurdes y yo no … en Madrid, … en Marbella.", "Los padres de Raquel Hernández … contentos.", "Usted … en la oficina y yo … en la estación.", "Tú y yo … guapas.", "La amiga de Luis … casada.", "Tú no … alegre, … triste.", "Isabel … regular pero no … enferma.", "Nosotras … en Roma y ellas … en París.", "Pedro y tú … en la playa, Manuel y yo … en clase."]}, {"h": "Ejercicio 16. Переведите на русский язык:", "b": ["1. Родители – на работе. 2. Я не в Москве, я в Сочи. 3. Сестра", "Мигеля замужем. 4. Тереза и Кларита болеют, они дома. 5. Брат", "Лолы хорошо себя чувствует, Лола довольна. 6. Друзья Андрея в университете. 7. Вы с Филиппом на пляже, вы довольны. 8. Хосе не женат, а я – замужем. 9. Мы грустим, маленький Мануэль болеет. 10. Их нет дома, они на улице."]}, {"h": "Ejercicio 17. Измените предложения по образцу:", "b": ["Yo soy rusa.→ María y yo somos rusas.", "1. Tú eres economista. → Carmen y tú ...", "2. Luis es joven. → Luis y Andrés ...", "3. Usted es viejo. → La señora Martínez y Ud. ...", "4. Tú estás casado. → Nosotros ...", "5. María y yo somos españolas. → César y Susana ...", "6. Ellas son de Madrid. → Vosotros ...", "7. Los amigos están en la playa. → Enrique ...", "8. Luisa y tú estáis enfermos. → Luisa ...", "9. Clara y yo somos felices. → Ustedes ...", "10. Vosotros estáis guapos. → Nosotras ..."]}, {"h": "Ejercicio 18. Выберите по смыслу глагол ser или estar", "b": ["и поставьте его в соответствующую форму:", "1. El chico ... en la calle.", "2. Nosotros ... casados.", "3. Ellos ... de Barcelona.", "4. El café ... caliente.", "5. Las casas ... nuevas.", "6. Vosotros ... felices.", "7. La ciudad ... grande.", "8. La madre ... en casa.", "9. Ellas ... rusas, ... de Moscú.", "10. Don Pedro ... el padre de Inés."]}, {"h": "Ejercicio 19. Переведите на испанский язык:", "b": ["1. Ты стройная, красивая и молодая.", "2. Мы – русские, из Москвы.", "3. Они женаты и счастливы.", "4. Анна и Рауль на пляже.", "5. Книга плохая и дорогая.", "6. Девочки дома.", "7. Я – в Испании. Я счастлив.", "8. Мария и Елена – студентки. Они из Испании.", "9. Филипп – брат Мерседес.", "10. Сеньора, Вы веселая и добрая.", "Тема: Знакомство. Профессии.", "Страны и национальности", "\u0002 Прочитайте и запомните слова, обозначающие:", "a) профессии:", "abogado -a", "адвокат", "camarero -a", "официант", "actor", "актер", "escritor -a", "писатель", "actriz", "актриса", "cocinero -a", "повар", "banquero", "банкир", "poeta", "поэт", "médico -a", "врач", "profesor -a", "преподаватель", "guía", "гид", "dependiente", "продавец", "periodista", "журналист", "строитель", "constructor", "ingeniero -a", "инженер", "художник", "pintor -a", "медсестра", "экономист", "enfermera", "economista", "музыкант", "юрист", "músico", "jurist . de compras en coche."]}, {"h": "Ejercicio 13. Переведите на испанский язык:", "b": ["1. Мы едем в театр на метро.", "2. Я еду на работу на машине.", "3. Петр и Мария не идут в кино, они будут писать статью.", "4. Ты едешь в Валенсию на поезде, а я плыву на корабле.", "5. Они ходят за покупками пешком.", "6. Вы (vosotros) летите на каникулы в Испанию на самолете.", "7. Она собирается поговорить с врачом.", "• Глагол tener иметь, обладать – индивидуального спряжения.", "Выучите формы спряжения этого глагола в настоящем времени:", "TENER", "yo", "tengo", "nosotros (-as)", "tenemos", "tú", "tienes", "vosotros (-as)", "tenéis", "él, ella, usted", "tiene", "ellos, ellas, ustedes", "tienen", "\u0002 Глагол tener имеет разные значения:", "tener ... años", "иметь … лет", "tener familia f", "иметь семью", "tener padre/madre", "иметь отца /мать", "tener dinero m", "иметь деньги", "tener calor m", "страдать от жары", "tener frío m", "мерзнуть", "tener hambre f", "быть голодным/ хотеть есть", "tener sed f", "испытывать жажду/ хотеть пить", "tener sueño m", "хотеть спать", "tener miedo m", "бояться (испытывать страх)", "tener razón f", "быть правым", "tener suerte f", "быть удачливым", "tener prisa f", "торопиться, спешить", "tener tiempo m", "иметь время", "tener que + inf.", "быть должным сделать что-либо", "Например:", "Tengo veintiún años.", "Мне 21 год.", "Él no tiene familia.", "У него нет семьи.", "¿Tienes sueño?", "Хочешь спать?", "Ella tiene razón.", "Она права.", "No tenemos tiempo.", "У нас нет времени.", "Tenéis prisa.", "Вы спешите.", "Usted tiene suerte.", "Вам везет.", "Ellos no tienen miedo.", "Они не боятся.", "Tengo calor.", "Мне жарко.", "Tienes que tomar la", "Тебе надо принять лекарствo.", "medicina.", "В предложениях с глаголом tener с исчисляемыми существительными в единственном числе употребляется неопределенный артикль un/una, с исчисляемыми существительными во множественном числе и с отрицанием артикль не употребляется:", "Tengo un libro. Tengo una casa.", "Tengo Ø libros. Tengo Ø casas.", "No tengo Ø libro. No tengo Ø casa.", "No tengo Ø libros. No tengo Ø casas."]}, {"h": "Ejercicio 14. Проспрягайте словосочетания:", "b": ["no tener hambre, tener sed", "tener dinero pero no tener suerte", "Juan", "Ustedes", "Tú", "Yo", "Ana y yo", "Vosotros"]}, {"h": "Ejercicio 15. Соедините левый и правый столбики:", "b": ["Yo", "tiene quince años.", "El chico", "no tenéis dinero.", "Nosotros", "tengo libros españoles.", "Ustedes", "no tienes razón.", "Pablo y tú", "tenemos que aprender la poesía.", "Tú", "tienen frío."]}, {"h": "Ejercicio 16. Поставьте глагол tener в соответствую-", "b": ["щую форму:", "1. Daniel y Laura … que aprender las palabras nuevas.", "2. Yo … prisa.", "3. Mi amigo no … razón.", "4. Vosotros … problemas.", "5. Ana y yo … una casa bonita.", "6. Tú … familia.", "7. Usted … veinticinco años y yo … diecinueve años."]}, {"h": "Ejercicio 17. Переведите на испанский язык:", "b": ["1. У тебя есть брат, но нет сестры.", "2. Нам холодно.", "3. Вы (vosotros) должны принять лекарство.", "4. Они хотят спать.", "5. Мария хочет есть.", "6. У меня большой дом.", "7. У него нет времени, он торопится.", "• Глагол oír слышать – индивидуального спряжения. Выучите формы спряжения этого глагола в настоящем времени:", "OÍR", "yo", "oigo", "nosotros(-as)", "oímos", "tú", "oyes", "vosotros(-as)", "oís", "él, ella,", "oye", "ellos, ellas,", "oyen", "usted", "ustedes", "Например:", "¿Qué oyes? – Oigo una", "Что ты слышишь? – Я слышу", "hermosa melodía.", "красивую мелодию."]}, {"h": "Ejercicio 18. Проспрягайте словосочетания:", "b": ["oír al guía bien", "no oír las palabras del arquitecto", "Juan", "Ustedes", "Tú", "Yo", "Ana y yo", "Vosotros"]}, {"h": "Ejercicio 19. Соедините левый и правый столбики:", "b": ["Yo", "oís las noticias.", "El cliente", "oyes a tu novia.", "Nosotros", "no oyen las palabras del poeta.", "Ustedes", "oigo a mi mamá.", "Pablo y tú", "oímos el teléfono.", "Tú", "no oye al camarero."]}, {"h": "Ejercicio 20. Поставьте глагол oír в соответствующую", "b": ["форму:", "1. Lola no abre la puerta porque ella … mal.", "2. Los estudiantes no … al profesor, porque él habla en voz baja.", "3. ¿Qué … Angel y tú? – Nosotros … la voz de Francisco.", "4. Yo no … a María, porque ella no tiene razón.", "5. Tú … las noticias y comprendes poco.", "Тема: Черты характера.", "Описание внешности", "\u0002 Прочитайте и запомните слова, необходимые для описания внешности человека:", "aspecto físico", "внешний вид", "simpático", "симпатичный", "antipático", "неприятный", "feo", "некрасивый", "guapo / hermoso", "красивый", "alto", "высокий", "bajo", "низкий", "gordo", "толстый", "delgado", "стройный", "fl aco", "худой", "atlético", "спортивное телосложение", "jorobado", "горбатый", "cojo", "хромой", "edad f", "возраст", "niño", "ребенок", "adolescente m/f", "подросток", "joven", "молодой", "maduro", "средних лет", "viejo", "старый", "pelo m", "волосы", "liso", "прямые", "rizado", "вьющиеся", "corto", "короткие", "largo", "длинные", "calvo", "лысый", "moreno", "брюнет", "rubio", "блондин", "pelirrojo", "рыжий", "castaño", "шатен", "cano", "седой", "facciones f", "черты лица", "ojos m pl", "глаза", "grandes", "большие", "pequeños", "маленькие", "azules", "голубые", "grises", "серые", "pardos", "карие", "verdes", "зеленые", "nariz f", "нос", "recta", "прямой", "ancha", "широкий", "chata", "курносый", "labios m pl", "губы", "fi nos", "тонкие", "carnosos", "полные", "cejas f pl", "брови", "pobladas", "густые", "otros detalles (lleva)", "особые приметы (носит)", "bigotes m pl", "усы", "barba f", "борода", "gafas f pl", "очки", "tatuaje m", "татуировка", "lunar m", "родинка", "cicatriz f", "шрам", "\u0002 Прочитайте и запомните слова, необходимые для описания характера человека:", "carácter m", "характер", "alegre", "веселый", "triste", "грустный", "cortés", "вежливый", "serio", "серьезный", "tranquilo", "спокойный", "trabajador", "трудолюбивый", "formal", "аккуратный / педантический", "puntual", "пунктуальный", "educado", "воспитанный", "egoísta m/f", "эгоист", "perezoso", "ленивый", "generoso", "щедрый", "avaro", "жадный", "tímido", "скромный / застенчивый", "curioso", "любопытный", "astuto", "хитрый", "presumido", "тщеславный", "bondadoso", "добрый", "prudente", "осторожный / благоразумный", "comunicativo", "общительный", "honrado", "честный", "valiente", "смелый", "sincero", "искренний", "верный", "fi el", "упрямый", "terco", "нежный", "cariñoso", "умный", "inteligente", "глупый", "tonto"]}, {"h": "Ejercicio 22. Найдите эквиваленты:", "b": ["у тебя есть жених?, он не молодой и не старый, он брюнет, короткие вьющиеся волосы, карие глаза, тебе везет."]}, {"h": "Ejercicio 23. Опишите жениха Петры.", "b": []}, {"h": "Ejercicio 25. Опишите портреты (возраст, внешность,", "b": ["характер, национальность, род занятий…)"]}, {"h": "Ejercicio 26. Опишите внешность и характер своего", "b": ["друга (соседа…)."]}, {"h": "Ejercicio 27. Вставьте необходимые предлоги и пе-", "b": ["реведите фразы на русский язык:", "1. Tengo que llamar … teléfono … la oficina y hablar … el jefe", "… el nuevo ingeniero.", "2. Los amigos van … casa … el cine … metro.", "3. Chelo lee … voz baja la poesía … un poeta argentino y nosotros escuchamos … atención.", "4. Voy … escribir un artículo … las fl ores exóticas.", "5. Luis y yo vamos … las calles antiguas … la ciudad.", "6. Alfredo vive … los padres … una casa pequeña.", "7. Yo compro fl ores … la hermana … Ricardo.", "8. El abogado pregunta … el señor Rodríguez, pero él no está", "… el banco.", "9. Tomo café … leche pero … azúcar.", "10. El padre va … la estación … coche y escucha las noticias", "… la radio.", "11. Manolo y Pilar tienen suerte, van … vacaciones …", "Cuba.", "12. El niño no tiene hambre … eso come … apetito."]}, {"h": "Ejercicio 28. Поставьте глаголы в соответствующую", "b": ["форму:", "1. Yo (aprender) las palabras nuevas.", "2. Felipe y tú (escribir) cartas a los amigos.", "3. Los vecinos (llamar) a la puerta.", "4. Ustedes (abrir) la cuenta en el banco.", "5. Nosotras (ser) estudiantes, (estar) de vacaciones y no (ir) a la universidad.", "6. Yo (estar) en el balcón y no (oír) el teléfono.", "7. Los turistas no (tener) tiempo y no (ir) al museo.", "8. Tú (estar) casado, (tener) una casa grande y (ser) feliz.", "9. Pablo y tú (leer) periódicos en metro.", "10. El camarero no (oír) las palabras del cliente.", "11. Yo (ser) joven y (tener) muchos proyectos.", "12. Tú (ser) portugués y no (leer) en inglés.", "13. El profesor (preguntar) el apellido de la estudiante alemana.", "14. Nosotros (tener) frío y no (abrir) la ventana.", "15. Fernando y tú (ir) al cine y Enrique y yo (ir) a la biblioteca.", "16. Los niños (oír) la voz de la madre y (estar) contentos.", "17. Yo (estar) mal y (ir) a tomar una medicina.", "18. José no (tomar) en serio las palabras de Elena.", "19. El guía (hablar) mal el ruso por eso Marina no (comprender)", "al guía.", "20. La secretaria del jefe (ser) una joven trabajadora y comunicativa."]}, {"h": "Ejercicio 29. Переведите на испанский язык:", "b": ["1. Мы не слушаем новости по радио, мы читаем газеты.", "2. Я не понимаю нового архитектора, он итальянец и плохо говорит по-английски. 3. Друзья идут в бар, пьют вино, разговаривают о жизни, они не спешат. 4. У нас с сестрой нет времени, нам надо пойти в банк и открыть счет. 5. Ребенок не хочет есть, у него нет аппетита, он плохо себя чувствует. 6. Невеста Рафаэля – симпатичная девушка, ей 21 год, она блондинка, и у нее голубые глаза. 7. Мы с Лаурой идем пешком по улице и слышим прекрасную мелодию. 8. Я собираюсь поговорить с генеральным директором об отпуске. – Но его нет на работе, он в США. – Как жаль! 9. Дон Фернандо – адвокат, он не молод, толстый, лысый, носит очки, тщеславный и жадный. Он неприятный человек! – Ты права. 10. На уроке мы читаем, пишем и говорим по-испански с преподавателем. – Везет вам!"]}], "4": [{"h": "Ejercicio 1. Образуйте множественное число:", "b": ["Esta casa es nueva. → Estas casas son nuevas.", "1. Esta familia es feliz.", "2. Aquel periodista vive allí.", "3. Esta chica tiene 12 años.", "4. Ese estudiante lee poco.", "5. Aquella mujer habla ruso.", "6. Este artículo es interesante.", "7. Aquel coche es muy caro."]}, {"h": "Ejercicio 2. Образуйте единственное число:", "b": ["Estos coches son caros. → Este coche es caro.", "1. Estos libros son raros.", "2. Aquellas revistas son francesas.", "3. Esos lápices son azules.", "4. Estas chicas toman zumo.", "5. Aquellos actores van a Rusia.", "6. Estos hombres hablan alemán.", "7. Esas señoras son ricas."]}, {"h": "Ejercicio 3. Переведите на испанский язык:", "b": ["1. Эти студентки не говорят по-английски.", "2. Этот художник живет здесь, в этом доме.", "3. Те книги лежат там, в той машине.", "4. Эта актриса – из Японии. Она работает здесь, в этом театре.", "5. Это вино старое, а то – молодое.", "6. В этом баре мы пьем это пиво.", "7. Эти экономисты пишут статьи для того журнала."]}, {"h": "Ejercicio 4. Вставьте соответствующее притяжатель-", "b": ["ное местоимение-прилагательное:", "1. Ana está casada, ... marido tiene treinta y tres años.", "2. Tenemos una casa grande, ... casa es nueva.", "3. Estáis en Moscú, ... hermano está en España.", "4. ¡Hola, Pedro! ¿Cómo estás? ¿Cómo están ... padres?", "5. María vive con ... padres en Austria.", "6. Tengo tres amigos, ... amigos viven en Moscú.", "7. Alejandro y Nicolás son hermanos, ellos toman café con ...", "amigos."]}, {"h": "Ejercicio 5. Измените предложения по образцу:", "b": ["Mi padre está en casa y tu padre, no.→ Mi padre está en casa y el tuyo, no.", "1. Tu hijo trabaja y mi hijo, no.", "2. Nuestros amigos hablan inglés y sus amigos, no.", "3. Mi hermana vive en Moscú y su hermana vive en Madrid.", "4. Nuestra casa es nueva y vuestra casa es vieja.", "5. Vuestro vecino es político y nuestro vecino es poeta.", "6. Mis amigos son ingleses y tus amigos son alemanes.", "7. Tus padres van a la oficina y sus padres van a casa."]}, {"h": "Ejercicio 6. Выберите соответствующую форму при-", "b": ["тяжательного местоимения:", "1. (Tuyos, tus, los tuyos) padres están en la playa, y (mis, los míos, míos) padres están en el museo.", "2. Esta casa no es (la nuestra, nuestra), (nuestra, la nuestra) está en el centro.", "3. (El mío, mi, mío) hijo va de vacaciones a España y ¿(tuyo, tu, el tuyo)?", "4. (Mis, míos, los míos) documentos están aquí y (sus, suyos, los suyos), no.", "5. Estos libros no son (mis, los míos, míos), (mis, míos, los míos)", "están ahí.", "6. (Nuestra, la nuestra) hermana vive en Mallorca y (vuestra, la vuestra) en Australia.", "7. Esta revista es (la mía, mi, mía) y aquella revista es (la suya, suya, su)."]}, {"h": "Ejercicio 7. Переведите на испанский язык:", "b": ["1. Этот дом не наш, наш – новый и находится на той", "улице.", "2. Эти бутерброды не ваши, ваши лежат там.", "3. Мой друг инженер, а твой?", "4. Его машина новая, а моя старая.", "5. Твои родители живут в Барселоне, а мои в Валенсии.", "6. Я еду в Испанию со своими друзьями.", "7. Привет Хуан! Как поживают твои соседи?"]}, {"h": "Ejercicio 9. Задайте общие вопросы к следующим", "b": ["предложениям и дайте на них утвердительные и отрицательные ответы:", "1. Las amigas van al cine en metro.", "2. Juan vive en la ciudad.", "3. El padre escucha la radio.", "4. Tengo un amigo danés.", "5. La secretaria es perezosa."]}, {"h": "Ejercicio 10. Задайте специальные вопросы к пред-", "b": ["ложениям по образцу и дайте на них ответы:", "El pintor Enrique Ramos es español, tiene 30 años, vive en Toledo.", "¿Qué es Enrique Ramos? – Es español, es pintor.", "¿Quién es pintor? – El pintor es Enrique Ramos.", "¿Cuántos años tiene Enrique Ramos? – Tiene treinta años.", "¿Dónde vive el pintor? – Vive en Toledo.", "1. Isabel y Patricia son jóvenes profesoras de Salamanca.", "2. Luis no va a la oficina, está en casa porque está enfermo.", "3. Los señores García tienen una hija muy guapa de quince años.", "4. Javier y yo escribimos un artículo para un periódico español.", "5. Los chicos van a la playa a pie y están contentos."]}, {"h": "Ejercicio 11. Заполните пробелы соответствующим", "b": ["вопросительным словом:", "1. ¿ _________ es Pedro? – Pedro es jurista.", "2. ¿_________ son ustedes? – Somos de Chile.", "3. ¿ _________ está Lola? – Está bien, gracias.", "4. ¿ ________ es José Ruiz? – Es el hijo de don Luis.", "5. ¿_________ hermanas tienes? – Tengo tres hermanas.", "6. ¿_________ de tus hermanos vive allí? – Pablo vive allí.", "7. ¿_________ habla el director? – Habla con su secretaria.", "8. ¿_________ vas a la oficina? – Voy a pie.", "9. ¿_________ está vuestra casa? – Está en la calle Goya.", "10. ¿________ abres la ventana? – Porque tengo calor."]}, {"h": "Ejercicio 12. Проспрягайте следующие словосочета-", "b": ["ния в настоящем времени:", "querer aprender el español", "venir del cine a casa", "decir que ser de Alemania", "no poder aprender esta poesía", "Usted", "Los amigos", "Ángela y tú", "Nosotras", "Yo", "Tú"]}, {"h": "Ejercicio 13. Измените предложения по образцу:", "b": ["Pablo viene de la oficina en autobús. → Pablo y tú venís de la oficina en autobús.", "1. Queremos a nuestra madre. → Ella …", "2. Usted dice que es de Portugal. → Yo …", "3. Vengo a la oficina temprano. → La secretaria …", "4. ¿Quieres tomar café? → Vosotros …", "5. Digo mi nombre al director. → Tú …", "6. Estamos contentos. → Yo …", "7. Tengo hambre y puedo tomar un bocadillo. → Nosotros ...", "8. Vienes de América en avión. → Vosotros …", "9. ¿Adónde vais? → Ustedes …", "10. Tenemos prisa y queremos tomar un taxi. → Ellos …"]}, {"h": "Ejercicio 14. Поставьте глаголы в соответствующую", "b": ["форму:", "1. ¿Por qué no (escribir) vuestros apellidos? – Porque no (querer, nosotros).", "2. El policía (llamar) a la puerta pero los vecinos no (abrir) la puerta porque (tener) miedo.", "3. (Ir, nosotros) a leer estos artículos porque (tener, nosotros)", "que comprender la situación.", "4. ¿Por qué no (escuchar, vosotros) al guía? – No (escuchar, nosotros) al guía porque él (hablar) en voz baja.", "5. El médico (preguntar) por mi salud. Yo (decir) que (estar) bien.", "6. ¿(Ser, vosotros) los hermanos de Miguel? – No, (ser, nosotros)", "sus amigos.", "7. ¿Cuántos años (tener, tú)? – (Tener, yo) 35 años, pero no", "(trabajar, yo) porque no (querer, yo).", "8. Cuando (venir, yo) a casa tarde (llamar, yo) a mi mujer por teléfono.", "9. Ustedes (querer) ir al bar porque (tener) hambre.", "10. ¿Adónde (ir, tú) de vacaciones? – (Ir, yo) a Inglaterra porque", "(aprender) el inglés."]}, {"h": "Ejercicio 15. Переведите на испанский язык:", "b": ["1. Мой сын – молод, поэтому не женат, но у него есть невеста.", "2. Дома мы говорим по-французски, потому что мой папа плохо говорит по-русски.", "3. Рикардо, ты где? – Я в баре, хочу пойти домой, но не могу.", "4. Мы с подругой идем домой пешком, потому что не спешим, у нас есть время.", "5. Откуда вы (vosotros) и кто вы по профессии? – Это Наталья, она из России, она – экономист, а я из Валенсии, я – инженер.", "6. Отец спрашивает свою дочь, кем она хочет стать. Она говорит, что хочет быть актрисой.", "7. Они внимательно слушают преподавателя, потому что им надо написать статью на эту тему.", "8. Ты собираешься позвонить своему другу, чтобы спросить, как он себя чувствует.", "9. Я звоню в дверь, но они не открывают. Я не понимаю, почему.", "10. Когда ты приходишь домой рано, ты ешь, читаешь газеты, слушаешь радио и разговариваешь со своими друзьями по телефону.", "11. У тебя новая машина? – Нет, она не моя. Это машина моего отца, у меня нет машины.", "12. Что говорит преподаватель? Я не слышу. – Он всегда говорит тихо.", "Тема: Моя семья", "\u0002 Прочитайте и запомните слова, обозначающие родственные связи:", "familia f", "семья", "matrimonio m", "супружеская пара / брак", "padre", "отец", "madre", "мать", "padres", "родители", "marido", "муж", "mujer", "жена", "esposo -a", "супруг / супруга", "hijo -a (hijos)", "сын / дочь /дети", "abuelo -a", "дедушка / бабушка", "nieto -a", "внук / внучка", "hermano -а", "брат / сестра", "mellizos -as", "близнецы", "padrino", "крестный отец", "madrina", "крестная мать", "tío -a", "дядя / тетя", "primo -а", "двоюродный брат / сестра", "sobrino -а", "племянник / племянница", "suegro -a", "свекор / тесть свекровь / теща", "yerno", "зять (муж дочери)", "nuera", "невестка (жена сына)", "cuñado -a", "сват / свояк / деверь / шурин", "сватья / свояченица / золовка", "padrastro", "отчим", "madrastra", "мачеха", "hijastro -a", "пасынок / падчерица", "pariente m/f", "родственник / родственница"]}, {"h": "Ejercicio 16. Укажите родственную связь:", "b": ["1. la madre de mi padre → mi abuela", "2. el hermano de mi padre → __________", "3. el hijo de mi tío → _________________", "4. la hija de mi hermano → ____________", "5. la mujer de mi hermano → ___________", "6. la madre de mi mujer → _____________", "7. el marido de mi hija → ______________", "8. el marido de mi hermana → __________", "9. el hijo de mi hija → ________________", "10. el segundo marido de mi madre → ________", "Libro de familia", "Семейная книга – это документ, который выдают в Испании гражданам, вступающим в брак, либо гражданам, независимо от гражданского состояния, родившим ребенка. В Семейную книгу вносят данные о всем составе семьи, в т.ч. о бабушках, дедушках, братьях, сестрах и т.д. Этот документ представляет собой комбинацию свидетельств о браке, разводе, смерти, рождении и усыновлении детей."]}, {"h": "Ejercicio 20. Расскажите об испанской королевской", "b": ["семье."]}, {"h": "Ejercicio 21. Расскажите по-испански о себе и своей", "b": ["семье."]}], "5": [{"h": "Ejercicio 1. Выберите по смыслу глагол ser, estar или", "b": ["hay и поставьте их в соответствующую форму:", "1. ¿Dónde ... los hijos? – Ellos ... en el colegio.", "2. En mi habitación no … televisor, el televisor … en el comedor.", "3. ¿Qué ... en aquella calle? – Allí ... un museo interesante.", "4. ¿Cómo ... Ud.? – Yo ... bien, gracias.", "5. Quiero tomar té pero en casa no ... té. … que ir al bar.", "6. Carlos y yo ... estudiantes. Nosotros ... españoles. Carlos ... de", "Sevilla, y yo ... de Zaragoza.", "7. Rafael ... en la oficina, su esposa ... en casa porque … enferma.", "8. Sobre la mesa … una revista y unas cartas.", "9. ¿Cómo … la casa donde vives? – Mi casa no… grande.", "10. En el jardín … fl ores bonitas."]}, {"h": "Ejercicio 2. Вставьте соответствующие артикли:", "b": ["1. Sobre … mesa hay … libro pero no hay… periódicos. ¿Dónde están … periódicos de hoy?", "2. Mi madre es … ama de casa. Ella no va a … oficina.", "3. ¿Cómo es … hermana de Enrique? – Es simpática.", "4. En … patio no hay … coches. ¿Dónde está … coche de", "Luis?", "5. Susana es … secretaria. Es … secretaria formal y afable."]}, {"h": "Ejercicio 3. Переведите на испанский язык:", "b": ["1. Я дома, а дети в школе.", "2. Откуда эти студенты? – Они из Англии.", "3. В комнате есть шкаф, но он небольшой.", "4. Ее брат – поэт. Он хороший поэт. Надо почитать его стихи.", "5. На столе нет книг. Где книги?", "6. Как поживают твои дедушка и бабушка?", "7. На улице нет людей, они в баре.", "8. Наш дом – там, на той улице. Какой ваш дом? – Он белый с шестью окнами.", "9. Долорес не замужем, она молодая.", "10. Кто Вы? – Я Луис Альберто, отец Нины. А кто Вы по профессии? – Я полицейский."]}, {"h": "Ejercicio 4. Выберите по смыслу mucho/poco или", "b": ["muy:", "1. ¿Por qué preguntas ...?", "2. La secretaria escribe ... cartas.", "3. Pilar es ... joven, tiene 17 años.", "4. Tenemos ... tiempo.", "5. La madre está ... triste porque la hija está ... enferma.", "6. El chico toma ... leche.", "7. Escucho... , pero hablo ... .", "8. La cama es … grande.", "9. Tomo … agua porque tengo … sed.", "10. En casa hay … libros pero son … interesantes."]}, {"h": "Ejercicio 5. Измените по образцу:", "b": ["Elvira habla mucho por teléfono.→ Elvira habla tanto por teléfono.", "1. Felipe es muy gordo porque toma mucha cerveza.", "2. El periodista pregunta mucho porque tiene muchos problemas.", "3. Tengo mucha prisa y el café está muy caliente.", "4. El coche es muy caro y yo soy muy pobre.", "5. Leemos y escribimos mucho porque somos estudiantes.", "6. El dependiente es muy cortés pero habla muy mal el ruso.", "7. En el fl orero hay muchas fl ores."]}, {"h": "Ejercicio 6. Переведите на испанский язык:", "b": ["1. В доме Павла столько книг, и он так много читает!", "2. В городе так много машин, много народа, но мало полицейских. Где полиция?", "3. Они очень довольны и едят с таким аппетитом!", "4. Сеньор Рикардо очень веселый, и внуки очень любят дедушку.", "5. Не надо разговаривать с таким преподавателем на такие темы.", "6. Кармен такая стройная, потому что ест очень мало.", "7. Надо спросить, где находится улица Пикассо. – Что есть на улице Пикассо? – Там стоит очень старый кинотеатр и мало современных зданий.", "8. Я так устала и так хочу спать! Но у меня так много работы и мало времени."]}, {"h": "Ejercicio 7. Замените выделенные предлоги на их", "b": ["антонимы:", "1. Dentro de la oficina hay mucho ruido.", "2. A la izquierda de la estación está el Banco Central.", "3. La mesa está detrás del armario.", "4. Quiero vivir cerca de tu casa.", "5. Antes de ir al cine tomamos café.", "6. El libro está debajo de la cama.", "7. El parque está al lado del hotel.", "8. Después de comer Felipe va a la playa.", "9. Los niños están fuera del patio.", "10. La carta está encima del ordenador."]}, {"h": "Ejercicio 8. Переведите на испанский язык:", "b": ["1. Напротив нашего дома – большой парк, а справа – вокзал.", "Здесь всегда много народа.", "2. Перед тем, как поехать в отпуск, тебе надо так много работать.", "3. Твоя машина стоит позади гостиницы в глубине двора, а моя – между офисом и кинотеатром.", "4. Посреди площади стоит памятник, вокруг памятника много цветов.", "5. Что лежит внутри твоей книги? – Там письмо одной моей подруги, которая живет очень далеко отсюда.", "6. Мой банк рядом с ее домом. После работы мы с ней ходим в бар слева от банка, и там я говорю с ней о своих проблемах, а она о своих.", "7. Во время операции родственники приходят в больницу.", "Они хотят поговорить с врачом после операции.", "8. Адвокат говорит, что не может находиться вне города столько времени.", "9. Музей находится напротив гостиницы, между банком и кинотеатром.", "10. Почему твои книги не на столе, а под столом?"]}, {"h": "Ejercicio 9. Проспрягайте следующие словосочета-", "b": ["ния в настоящем времени:", "salir a la calle y ver un taxi", "poner su libro sobre la mesa", "traer pan para la cena", "dar clases de literatura", "caer porque no ver nada", "no hacer caso del ruido", "no saber el correo electrónico del director", "Usted", "Los amigos", "Ángela y tú", "Nosotras", "Yo", "Tú"]}, {"h": "Ejercicio 10. Измените по образцу:", "b": ["Pablo viene de la oficina en autobús. → Pablo y tú venís de la oficina en autobús.", "1. Ellos no saben dónde está el monumento a Cervantes. →", "Nosotros…", "2. Después de comer María y yo damos un paseo por el parque. → Ricardo y tú…", "3. Sales del cine y ves a tus amigos. → Yo…", "4. ¿Por qué hace usted tantas preguntas? → Tú…", "5. Traigo fl ores y pongo las fl ores en el fl orero. → Usted…", "6. Juanito no sabe bailar bien y cae. → Yo…", "7. Los niños dan un beso a mamá y salen de casa. →", "Nosotros…", "8. Vengo a casa y pongo orden en el armario. → Ella…", "9. Los vecinos hacen mucho ruido porque hoy dan una fi esta.", "→ Vosotros…", "10. Los abuelos ponen la tele y ven una película francesa. →", "Tú…"]}, {"h": "Ejercicio 11. Поставьте глаголы в соответствующую", "b": ["форму:", "1. Cuando el padre (venir) a casa, la madre (poner) la mesa para la cena.", "2. No (poder, yo) escribir la carta al tío porque no (saber, yo) su dirección.", "3. Tú (poner) la radio y (oír) una noticia interesante.", "4. Arturo (ser) pequeño, (tener) cuatro años y no (saber) hacer la cama.", "5. No (hacer, yo) nada porque (estar, yo) de vacaciones.", "6. Doña Isabel (dar) una fi esta, los amigos (venir) a su casa y", "(traer) fl ores y vino.", "7. Sobre la mesa (haber) tantos libros que unos libros (caer).", "8. Yo (ir) a casa de mis tíos, (querer, yo) ver a mi prima.", "9. Tú siempre (dar) consejos a tus hijos y ellos no (hacer) caso de tus palabras.", "10. ¿Por qué no (traer, tú) a tu novia a nuestra casa?"]}, {"h": "Ejercicio 12. Переведите на испанский язык:", "b": ["1. Я не знаю, где живет твой друг. Можешь написать его адрес?", "2. Почему здесь так шумно? – У соседей сегодня праздник.", "Не надо обращать внимание на шум.", "3. Марта спешит, у нее мало времени, она собирает чемодан и едет на вокзал на такси.", "4. Когда мы видим (встречаем) дона Антонио, он всегда передает привет нашим родителям.", "5. Бабушка не включает телевизор, потому что плохо видит.", "Я включаю радио, и мы слушаем новости.", "6. Мой сын не умеет писать, но знает много стихов.", "7. Когда ты приходишь на работу, всегда приносишь сегодняшние газеты.", "8. Мы видим, что он не умеет танцевать, поэтому падает.", "9. Я навожу порядок в твоем кабинете, Анна накрывает на стол, а ты ничего не делаешь. Почему? – Не хочу.", "10. Их окна выходят во двор. Они видят, когда их сосед выходит из дома и когда приходит.", "Тема: Мой дом", "\u0002 Прочитайте и запомните слова, необходимые для описания дома, квартиры:", "hogar m", "дом (домашний очаг)", "piso m", "этаж / квартира", "planta baja", "цокольный этаж", "apartamento m", "квартира", "entrada f", "вход", "escalera f", "лестница", "pared f", "стена", "techo m", "потолок / крыша", "suelo m", "пол", "habitación f", "комната", "cuarto m", "комната", "cuarto de baño", "ванная комната / туалет", "aseo m", "туалет", "recibidor m", "прихожая", "pasillo m", "коридор", "dormitorio m", "спальня", "salón m", "гостиная", "comedor m", "столовая", "cocina f", "кухня", "despacho m", "кабинет", "cortinas f", "шторы", "alfombra f", "ковер", "mueble m", "мебель", "mesa f", "стол", "mesita de noche", "прикроватная тумбочка", "escritorio m", "письменный стол", "silla f", "стул", "sillón m", "кресло", "cama f", "кровать", "sofá m", "софа", "armario m (ropero)", "шкаф для одежды", "armario empotrado", "встроенный шкаф", "estantería f", "полка / стеллаж", "aparador m", "буфет", "cómoda f", "комод", "tocador m", "туалетный столик", "espejo m", "зеркало", "lámpara f", "лампа", "lámpara de pie", "торшер", "araña f", "люстра", "televisor m", "телевизор", "ordenador m", "компьютер", "electrodomésticos", "электробытовые приборы", "frigorífi co m", "холодильник", "horno microondas", "микроволновая печь", "cocina f de gas", "газовая плита", "cocina eléctrica", "электроплита", "lavadora f", "стиральная машина", "lavavajillas m", "посудомоечная машина"]}, {"h": "Ejercicio 14. Опишите дом-музей поэта.", "b": []}, {"h": "Ejercicio 16. Опишите дом, в котором живет семья", "b": ["Рауля."]}, {"h": "Ejercicio 17. Рассмотрите план квартиры и опишите", "b": ["ее по-испански:"]}, {"h": "Ejercicio 18. Опишите свой дом или квартиру.", "b": []}, {"h": "Ejercicio 19. Переведите на испанский язык:", "b": ["1. Я знаю, что семья его двоюродного брата живет за городом, у них большой трехэтажный дом, а вокруг дома – сад. 2. Почему твои тетради и учебники под кроватью? Надо навести порядок в спальне. 3. Его кабинет такой светлый! – Конечно, потому что там балкон с видом на парк, стены выкрашены в светлые тона, а на окнах нет штор. 4. Слева от письменного стола вплотную к стене стоят полки с множеством книг. Он так много читает во время каникул! 5. Где твои любимые диски?  – Они в шкафу. Я сейчас не слушаю музыку. У меня так много домашних заданий и так мало времени! 6. Перед тем, как пойти в институт, я застилаю постель, пью кофе, смотрю новости по телевизору, целую маму и выхожу из дома. 7. Между камином и буфетом не помещается это старинное кресло. Я ставлю туда стул, а напротив дивана ставлю кресло.  – Ничего себе! А гостиная кажется такой просторной.", "8. В столовой так шумно и так много студентов! Но я не обращаю внимания на шум, я так голоден и ем с таким аппетитом!", "9.  Их кухня такая современная и очень хорошо оборудована.", "Я знаю, что такая техника очень дорогая. 10. Я говорю: «Добро пожаловать, господа!», а они не слышат."]}], "6": [{"h": "Ejercicio 1. Вставьте соответствующие беспредлож-", "b": ["ные формы местоимений:", "_____", "a mí.", "_____", "a ti.", "_____", "a nuestros hijos.", "La vecina no", "_____", "abre la puerta", "a mi amigo y a mí.", "_____", "al policía.", "_____", "a usted.", "_____", "a vosotros.", "_____", "a la enfermera.", "* Подробно об образовании и употреблении герундия см. Урок 7."]}, {"h": "Ejercicio 2. Ответьте на вопросы по образцу:", "b": ["¿Me haces un regalo? → Sí , te hago un regalo (a ti). / Sí , quiero hacerte un regalo.", "1. ¿Me dices la verdad?", "2. ¿Le compras fl ores a tu novia?", "3. ¿Me escribes una carta?", "4. ¿Le lees periódicos a tu abuelo?", "5. ¿Les haces la cena a ellos?", "6. ¿Le dices tu nombre a la secretaria?", "7. ¿Les abres la puerta a tus vecinos?", "8. ¿Nos traes el disco nuevo?", "9. ¿Le haces preguntas a ella?", "10. ¿Nos compras un coche nuevo?"]}, {"h": "Ejercicio 3. Вставьте соответствующее местоиме-", "b": ["ние – косвенное дополнение:", "1. Luis siempre … dice la verdad a sus padres.", "2. Pablo y yo … traemos estos libros a ustedes.", "3. Mi amiga está enferma, tengo que comprar … medicinas.", "4. Nuestros padres quieren hacer … una sorpresa a mi hermano y a mí.", "5. Mis primos viven lejos, por eso … escribo cartas por Internet.", "6. ¿Por qué … hacéis (a mí) tantas preguntas?", "7. Enrique … trae a tu hermana y a ti pan y vino.", "8. ¿Qué … das (a mí)? – Yo … doy mi mano (a ti).", "9. ¿Por qué no … crees (a nosotros)? – Quiero creer … (a vosotros) pero no puedo.", "10. Voy a leer … a usted una poesía."]}, {"h": "Ejercicio 4. Переведите на русский язык:", "b": ["1. ¿Por qué no te gustan estos fl oreros? Son muy bonitos.", "2. El regalo de Juan os gusta mucho a tu primo y a ti.", "3. ¿Les gusta a ustedes hablar en español?", "4. A Juan le gustan los coches alemanes y a mí me gustan los coches japoneses.", "5. No queremos comprar este sillón, porque no nos gusta.", "6. Me gusta mucho el café, siempre tomo café en casa y en la oficina.", "7. Queremos mucho a nuestro tío, y a mi hermano y a mí nos gusta pasar las vacaciones en su chalé.", "8. ¿Te gusta la cerveza? – Sí, ella me gusta pero ahora quiero tomar agua.", "9. A tu novia y a ti no os gustan las casas viejas sin ascensor.", "10. ¿Quieres chocolate? – No, gracias, él no me gusta."]}, {"h": "Ejercicio 5. Измените фразы по образцу:", "b": ["Me gusta el zumo. → A mi hijo…/ A mi hijo le gusta el zumo.", "1. Te gusta el té con limón. → A vosotros…", "2. Nos gusta bailar. → A ti…", "3. Me gustan las películas españolas. → A usted…", "4. A Andrés y a ti os gusta la casa nueva. → A ustedes…", "5. A los padres no les gusta vivir fuera de la ciudad. → A mí…", "6. A mi novia no le gusta el té. → A mi novia y a mí…", "7. Al cliente no le gustan las cortinas. → A mis amigos…", "8. A los turistas les gusta el ballet ruso. → Al señor Andrade…"]}, {"h": "Ejercicio 6. Переведите на испанский язык:", "b": ["1. Я люблю пить пиво с друзьями после работы.", "2. Мария любит читать испанские журналы.", "3. Вам (ustedes) нравится эта книга? – Да, нам она очень нравится, а нашим друзьям – нет.", "4. Ты любишь кофе, а я люблю чай с лимоном.", "5. Мои дети не любят молоко.", "6. Вам (vosotros) нравится ходить за покупками?", "7. Мне нравятся блондинки, а моему брату – брюнетки.", "8. Мы с мамой любим театр, а моему брату и папе нравится кино.", "9. Я очень люблю свою бабушку и хочу поехать к ней на каникулы.", "10. Андрей любит Марию, дарит ей цветы и пишет стихи, но", "Мария не любит Андрея, ей нравится Антон."]}, {"h": "Ejercicio 7. Ответьте на вопросы по образцу:", "b": ["a) ¿Me llamas? – Sí, te llamo. / Sí, la llamo, señora. / Sí, lo llamo, señor.", "1. ¿Me buscas?", "2. ¿Me ves?", "3. ¿Me quieres?", "4. ¿Me oyes?", "5. ¿Me comprendes?", "b) ¿Nos llamáis? – No, no os llamamos. / No, no las llamamos, señoras. / No, no los llamamos, señores.", "1. ¿Nos escucháis?", "2. ¿Nos buscáis?", "3. ¿Nos comprendéis?", "4. ¿Nos veis?", "5. ¿Nos oís?", "c) ¿Compras fl ores? – Sí, las compro. / No, no las compro porque no puedo comprarlas.", "1. ¿Escuchas la radio?", "2. ¿Busca Ana un apartamento?", "3. ¿Oís al guía?", "4. ¿Abren ustedes las ventanas?", "5. ¿Llama usted a la secretaria?", "6. ¿Comen ustedes bocadillos?", "7. ¿Compras un coche nuevo?", "8. ¿Lee Mercedes periódicos en el metro?", "9. ¿Escribís las palabras nuevas?", "10. ¿Siempre dices la verdad?"]}, {"h": "Ejercicio 8. Переведите на испанский язык:", "b": ["1. Мы знаем правду, но не хотим ее говорить.", "2. Ты знаешь, где мои книги? Я их ищу. – Нет, я этого не знаю.", "3. Вы (vosotros) нас понимаете? – Да, мы вас очень хорошо понимаем.", "4. Мама делает апельсиновый сок. Будешь его пить? – Да, я его очень люблю.", "5. Где дети? – Они в гостиной, смотрят телевизор. – Надо позвать их.", "6. Что ты мне говоришь? Я тебя не слышу.", "7. У нас нет стиральной машины. Мы собираемся ее купить.", "8. Хуан меня любит, а я его не люблю, потому что он глупый и упрямый.", "9. Донья Инэс, полицейский Вас не слышит. Зачем Вы его зовете?", "10. Сеньориты, Вас ищет юрист. Он хочет видеть Вас."]}, {"h": "Ejercicio 9. Замените выделенные существительные", "b": ["соответствующими формами местоимений-дополнений", "по образцу:", "a) Le digo la verdad a mi novia.→ Se la digo.", "1. Les escribo una carta a mis abuelos.", "2. La madre le da un beso a su hijo.", "3. Les contamos las noticias a nuestros vecinos.", "4. Pablo nos trae los discos nuevos.", "5. Los amigos me hacen un regalo.", "b) Voy a decirle la verdad a mi novia. → Voy a decírsela.", "1. Luis y yo vamos a darte un consejo.", "2. Ellos no van a abriros la puerta.", "3. Usted va a contarnos esta historia.", "4. Voy a leerles a ustedes sus cartas.", "5. Vamos a buscarles a nuestros amigos un regalo."]}, {"h": "Ejercicio 10. Ответьте на вопросы по образцу:", "b": ["¿Me haces un regalo? → No, no te lo hago. / Sí, quiero hacértelo.", "1. ¿Les haces preguntas a los clientes?", "2. ¿Nos traes tus fotos?", "3. ¿Me das un beso?", "4. ¿Le enseñas a María tu apartamento?", "5. ¿Nos pones unos bocadillos aquí?"]}, {"h": "Ejercicio 11. Переведите на испанский язык:", "b": ["1. Эти цветы для Мерседес? – Да, я хочу подарить их ей.", "2. Ты напишешь письмо начальнику? – Нет, я не могу написать ему его, у меня нет времени.", "3. Вы (vosotros) принесете нам свои диски? – Да, мы cобираемся принести их вам завтра.", "4. Он всегда говорит правду своим родителям? – Да, он всегда им ее говорит.", "5. Они ищут подарки своим друзьям? – Да, они всегда им их покупают.", "6. Куда твои родители едут в отпуск? – Я не знаю, надо спросить их об этом.", "7. Можешь прочитать нам свои стихи? – Нет, я не хочу Вам их читать.", "8. Этот преподаватель любит задавать такие вопросы студентам на экзамене. А студенты не могут ему на них ответить."]}, {"h": "Ejercicio 12. Проспрягайте следующие словосочета-", "b": ["ния в настоящем времени:", "ofrecer la ayuda", "empezar a leer", "pensar en la vida", "traducir del ruso al español", "reír de sus palabras", "concluir el proyecto", "almorzar temprano", "volver a casa en metro", "preferir ir en tren", "repetir (2) la pregunta", "yo", "Dolores y yo", "tú", "vosotras", "Isabel", "Sara y Andrés", "usted", "ustedes"]}, {"h": "Ejercicio 13. Измените предложения по образцу:", "b": ["Yo cierro la ventana. → Marta y yo cerramos la ventana.", "1. El padre juega con los hijos. → Tú…", "2. ¿Por qué me mientes? → Vosotros…", "3. No conocemos al guía. → Yo…", "4. Yo le pido dinero al tío. → María y yo…", "5. Los amigos os ofrecen su ayuda. → Yo…", "6. Los abuelos ríen de su nieto. → Nosotros…", "7. José infl uye mal en mi hermano. → Juan y tú…", "8. La secretaria le traduce la carta al jefe. → Yo…", "9. Vuelves de la oficina tarde. → El señor Gómez…", "10. Empezamos a aprender la gramática. → Ellos…"]}, {"h": "Ejercicio 14. Раскройте скобки. Поставьте глаголы в", "b": ["соответствующую форму:", "1. Los chicos (jugar) al fútbol en el patio.", "2. ¿En qué (pensar, vosotros)? – Ella (pensar) en la vida y yo", "(pensar) en mi familia.", "3. Usted (dormir) poco y ellos (dormir) mucho.", "4. Yo no (conocer) al camarero que (atender) al señor López.", "5. La señorita no (recordar) el nombre de su jefe y nosotros (reír)", "de ella.", "6. Yo (traducir) los artículos del ruso al español y tú (preferir)", "escribirlos.", "7. ¿Por qué no (construir) ustedes su casa aquí?", "8. Andrés me (pedir) el número de teléfono de Ana pero yo no lo (recordar).", "9. Tú (almorzar) en casa y vosotros (preferir) comer en el bar.", "10. Yo le (repetir) mi pregunta y (empezar) a comprender que él me (mentir).", "\u0002 Следует различать глаголы saber и conocer, оба глагола могут переводиться, как знать.", "Сравните:", "saber", "conocer", "знать, уметь", "знать, быть знакомым", "saber algo знать чтоconocer a alguien знать кого-либо, либо быть знакомым с кем-либо", "(относится к конкретным", "conocer a Pedro знать Педро", "фактам, сведениям,", "conocer a la vecina знать соседку", "предполагающим точное", "conocer algo 1) знать что-либо,", "знание, информацию):", "разбираться в чем-то (относится", "saber la verdad знать", "к понятиям и областям знаний,", "правду", "которые нельзя познать в полном", "saber el nombre знать", "объеме):", "имя", "conocer la música moderna знать", "saber las palabras знать", "современную музыку (разбираться)", "слова", "Conozco tu carácter. Я знаю, какой у", "Sé que eres de Lima. Я", "тебя характер.", "знаю, что ты из Лимы.", "conocer algo 2) знать,", "saber +inf. уметь делать", "ориентироваться (о городах,", "что-либо", "улицах и других объектах):", "¿Sabes bailar tango? Ты", "conocer París знать Париж", "умеешь танцевать", "conocer la calle знать улицу", "танго?", "conocer el cine “Colón” знать", "кинотеатр «Колумб»", "\u0002 Следует различать глаголы ofrecer предлагать и proponer предлагать.", "Сравните:", "proponer", "ofrecer", "proponer algo предлагать (чтоofrecer algo предлагать то абстрактное, нематериальное):", "(что-то конкретное,", "proponer una idea, un proyecto, un", "материальное): ofrecer una", "plan предлагать идею, проект,", "taza de café, un cigarrillo,", "план", "ayuda предлагать чашку", "proponer + inf. предлагать чтокофе, сигарету, помощь то сделать:", "Te propongo ir al extranjero. Я тебе", "предлагаю поехать за границу."]}, {"h": "Ejercicio 15. Выберите подходящий по смыслу гла-", "b": ["гол и поставьте его в соответствующую форму:", "а) saber /conocer", "1. Mi hermano … a doña Marta, pero él no … su número de teléfono.", "2. Nuestros amigos … bien esta ciudad porque viven aquí.", "3. Yo … que vosotros … bailar bien el vals.", "4. Tu tía … la historia de España porque a ella le gusta leer novelas históricas.", "5. Tú … que no me gusta esta idea, porque somos amigos y tú", "… mi carácter.", "b) ofrecer /proponer", "1. Cuando me siento mal, la abuela siempre me … té con limón.", "2. Yo te … ir a la fi esta juntos.", "3. Tú siempre … ideas absurdas.", "4. ¿Por qué nos … usted alquilar este chalet?", "5. Mis padres quieren ir de compras y les … mi coche."]}, {"h": "Ejercicio 16. Переведите на испанский язык:", "b": ["1. Мы не знаем, где находится банк, и сосед предлагает отвести нас туда на своей машине.", "2. Я хорошо знаю этих людей, поэтому предлагаю тебе свою помощь.", "3. Луиза плохо знает современное искусство, и мы ей предлагаем сходить в музей.", "4. Я не умею водить машину и плохо знаю город, поэтому предлагаю взять такси.", "5. Мне предлагают поехать работать в Латинскую Америку, поэтому мне надо выучить испанский язык.", "Тема: Виды жилья", "и аренда помещения", "\u0002 Прочитайте и запомните слова, необходимые для описания жилья:", "vivienda f", "жилье", "inmobiliario m", "недвижимость", "anuncio m", "объявление / реклама", "propietario m", "собственник", "edifi cio m", "здание", "espacio m", "помещение", "local m", "помещение (для учреждения и т. п.)", "alquilar", "арендовать (помещение) / сдать в", "аренду", "alquiler m", "арендная плата", "superfi cie f", "площадь", "adosado m", "таунхаус", "dúplex m", "двухуровневая квартира", "estudio m", "однокомнатная квартира / студия", "chalé m", "загородный дом", "garaje m", "гараж", "ascensor m", "лифт", "portal m", "подъезд", "portero m", "консьерж", "ducha f", "душ", "bañera f", "ванна", "calefacción f", "отопление", "terraza f", "зд. лоджия", "reparación f", "ремонт", "reforma f", "капитальный ремонт", "barrio m", "район", "zona f", "пространство / район / участок", "\u0002 Полезные слова и выражения:", "agencia inmobiliaria", "агентство недвижимости", "alquilar la vivienda", "снять (сдать) жилье", "aire acondicionado", "кондиционер", "metros cuadrados", "квадратные метры", "apartamento en alquiler", "квартира в аренду", "apartamento en venta", "квартира на продажу", "piso amueblado", "меблированная квартира", "piso exterior", "квартира с окнами на улицу", "piso interior", "квартира с окнами во двор", "piso reparado", "квартира после ремонта", "portero automático", "домофон", "aparcamiento subterráneo", "подземная парковка", "casa rural", "сельский дом"]}, {"h": "Ejercicio 19. Переведите объявления:", "b": ["Se alquila:", "Piso exterior, amueblado, de", "110 m² con 4 dormitorios. Salón con acceso a terraza. Cocina equipada. 2 baños, uno con hidromasaje. Incluye plaza de garaje, con ascensor directo a la vivienda. Junto al Parque Norte, bien comunicado.", "C/ Boleros, 7, 5º izda.", "850 euros mensuales.", "Teléfono 6-79-94-55-15, Juan", "Сдается:", "Офис 150 кв. м. полностью", "оборудованный и меблированный (8 кабинетов, с/у, кухня).", "Цокольный этаж, отдельный", "вход, парковка.", "Рядом с м. Смоленская.", "Арендная плата 5000 руб. за", "1м² в месяц.", "Тел. 8-495-609-68-16 Оксана", "Se alquila:", "Espacio para oficina de 300 m²", "en primera planta con 10 despachos, 4 baños, aire acondicionado en el edifi cio oficinas con
