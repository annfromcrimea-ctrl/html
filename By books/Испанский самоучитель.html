\nPrimero ella va … hasta … . Luego tiene que hacer … en Gran Vía, y después toma el … que va a … . Ella tarda … pero prefi ere el … público porque durante el viaje … si no hay muchos …", "ru": "Мужчина живёт в 30 км от Мадрида и обычно едет на работу на машине, потому что рядом с его домом нет никакого метро. Если нет проблем, он тратит на дорогу 40 минут, но если есть какая-нибудь пробка, то час.\nЕму не очень нравится водить, но он вынужден это делать, потому что на обратном пути должен забрать дочку из школы.\nДевушка живёт в пригороде и должна ехать в университет, который находится на севере. Сначала она идёт пешком до станции метро. Потом должна сделать пересадку на Гран-Виа, а после садится на автобус, который идёт в университет.\nОна тратит час, но предпочитает общественный транспорт, потому что во время поездки читает, если нет многих пассажиров.", "q": [], "src": "book"}], "10": [{"t": "El próximo verano", "sp": "El próximo verano viajaré a España con mi familia. Iremos en avión a Madrid y después visitaremos el sur. Haremos un viaje largo: veremos Sevilla, Granada y la costa. Si reservamos ahora, encontraremos un hotel más barato. Según el pronóstico, hará sol y calor, así que llevaremos ropa ligera. Yo quiero visitar el Museo del Prado y probar la comida típica. Será un viaje inolvidable: nunca he estado en España.", "ru": "Следующим летом я поеду в Испанию с семьёй. Мы полетим на самолёте в Мадрид, а потом поедем на юг. Это будет долгое путешествие: мы увидим Севилью, Гранаду и побережье. Если мы забронируем сейчас, найдём более дешёвый отель. По прогнозу будет солнечно и жарко, поэтому возьмём лёгкую одежду. Я хочу посетить музей Прадо и попробовать местную кухню. Это будет незабываемая поездка: я никогда не был в Испании.", "q": [["¿Adónde viajará la familia el próximo verano?", "Viajará a España."], ["¿Cómo irán a Madrid?", "Iré en avión."], ["¿Qué ciudades verán?", "Verán Sevilla, Granada y la costa."], ["¿Qué harán si reservan ahora?", "Encontrarán un hotel más barato."], ["¿Qué tiempo hará?", "Hará sol y calor."], ["¿Qué quiere visitar el narrador?", "Quiere visitar el Museo del Prado."], ["¿Ha estado antes en España?", "No, nunca ha estado en España."]], "src": "own"}, {"t": "Текст из учебника · упр. 18", "sp": "David viaja a México\nEl avión empieza a aterrizar y David ve desde su ventanilla la cumbre del volcán Popocatepetl, totalmente cubierta de nieve.\nAbajo, casas y casas, calles y más calles, parques, barrios elegantes, barrios populares, carreteras atascadas por el tráfi co… Está llegando a la segunda ciudad más poblada del mundo, una de las más altas también: México D.F.\nLa azafata dice que los pasajeros deben abrocharse los cinturones y mantener derechos sus asientos.\nDavid se pregunta cuántos kilómetros cuadrados tendrá la ciudad que le parece inmensa. Las casas, las carreteras y los parques, cada vez más grandes, cada vez más cerca. De repente oye el ruido de las ruedas en el asfalto de la pista. Por fi n está en México.\nBaja del avión, se dirige con los demás pasajeros al control de policía y enseña el pasaporte; como español no necesita el visado de entrada y las formalidades no son complicadas. Un cuarto de hora después recoge su maleta y sale del aeropuerto Benito Juárez a la luz de un día soleado y espléndido. Piensa que en Europa los días son ya más cortos, pues está terminando el mes de octubre y la luz ya no es tan fuerte ni tan viva como en esta parte del planeta. Hace un tiempo seco y agradable y los árboles le parecen más verdes y más frondosos que en España, el color de las fl ores más intenso. Le sorprende sobre todo la cantidad de gente a su alrededor y piensa que está en una ciudad de dieciocho millones de habitantes. ¡Virgen Santísima!\nDavid sube al autobús que lo lleva al centro de la capital que está cerca, sólo a 13 kilómetros, pero hay mucho tráfi co y tardan casi 45 minutos en llegar. Piensa que debe de ser difícil conducir en una ciudad tan enorme como ésta. Hay todavía más contaminación que en Madrid. Hay también mucho ruido, pues los coches tocan constantemente la bocina.\n…Una semana más tarde, en el aeropuerto Benito Juárez, David está facturando sus maletas. Fernanda le ha traído una biblioteca completa de Frida Kahlo y Diego Rivera, y el exceso de peso que marca la balanza es inquietante. Afortunadamente, la maravillosa señorita de inmensos ojos negros de aerolíneas mexicanas no protesta y deja marcharse el equipaje por la cinta mecánica. David abraza fuertemente a Fernanda, mientras ella llora y llora desconsolada. El altavoz anuncia la salida del vuelo de Iberia:\n“Los pasajeros del vuelo 3448 de Iberia\ncon destino a Madrid deben presentarse\ninmediatamente en la puerta 25.”\nDavid y Fernanda se besan largamente.\n(Por Dolores Soler-Espiauba “Taxi a Coyoacán”)\n_______________\nMéxico D.F. (Distrito Federal) Мехико – столица Мексики poblado заселенный\nde repente вдруг\nformalidades f pl формальности\nsoleado солнечный\nespléndido замечательный/ прекрасный\nparte f часть\nseco сухой\nárbol m дерево\nsorprender удивлять\nsobre todo особенно\nhabitante m житель\n¡Virgen Santísima! Пресвятая Дева!\nenorme огромный\ncontaminación f загрязнение (окружающей среды)\nafortunadamente к счастью\nprotestar возражать\nmarcharse уезжать / уходить\nabrazar обнимать\nllorar плакать\nanunciar объявлять\nbesarse целоваться\nа) Отметьте фразы, соответствующие тексту (V), а\nфразы, которые не соответствуют (F) и скажите правильный вариант:\n1. David ve desde su ventanilla el volcán, casas, calles, parques, barrios elegantes y populares, carreteras.\n2. México D.F. tiene 18 millones de habitantes y es la ciudad más poblada del mundo.\n3. Las formalidades en el aeropuerto son complicadas porque\nDavid no tiene visado de entrada.\n4. David espera cuatro horas su maleta para recogerla.\n5. El día es espléndido porque hace sol, hace un tiempo seco y agradable.\n6. Desde el aeropuerto Benito Juárez hasta el centro de México\nD.F. son trece kilómetros.\n7. David pasa en México D.F. siete días.\n8. Fernanda le ha traído de la biblioteca muchas revistas con artículos sobre F. Kahlo y D. Rivera.\n9. La maleta de David pesa poco por eso no paga el exceso de peso del equipaje.\n10. En el aeropuerto están Frida, Diego y Fernanda que han llegado para despedirse de David.\n11. La maravillosa señorita de inmensos ojos negros de aerolíneas mexicanas protesta y no deja marcharse el equipaje de David por la cinta mecánica.\nб) Ответьте на вопросы:\n1. ¿Qué ve David desde su ventanilla durante el ate r rizaje?\n2. ¿Qué dice la azafata a los pasajeros?\n3. ¿Por qué no necesita David el visado de entrada para viajar a México?\n4. ¿En qué piensa David al salir del aeropuerto?\n5. ¿Cuánto tarda David en llegar al centro de la capital?\n6. ¿Por qué hay mucho ruido en las calles?\n7. ¿Por qué el equipaje de David pesa muchísimo?\n8. ¿Cómo es la señorita de aerolíneas mexicanas?\n9. ¿Cuál es el número del vuelo con destino a Madrid?\n10. ¿Cómo se despiden David y Fernanda?", "ru": "Давид летит в Мехико\nСамолёт начинает снижаться, и Давид видит из своего иллюминатора вершину вулкана Попокатепетль, полностью покрытую снегом. Внизу дома и дома, улицы и улицы, парки, элегантные кварталы, бедные кварталы, шоссе, забитые транспортом... Он прилетает во второй по населению город мира, один из самых высокогорных: Мехико.\nСтюардесса говорит, что пассажиры должны пристегнуть ремни и привести спинки кресел в вертикальное положение. Давид спрашивает себя, сколько квадратных километров в этом городе, который кажется ему огромным. Дома, шоссе и парки — всё больше, всё ближе. Вдруг он слышит шум колёс по асфальту взлётной полосы. Наконец он в Мехико.\nОн выходит из самолёта, вместе с другими пассажирами направляется к полицейскому контролю и показывает паспорт; как испанец он не нуждается во въездной визе, и формальности несложные. Четверть часа спустя он забирает свой чемодан и выходит из аэропорта Бенито Хуарес под свет солнечного и великолепного дня.\nОн думает, что в Европе дни уже короче, ведь заканчивается октябрь, и свет уже не такой сильный и яркий, как в этой части планеты. Погода сухая и приятная, деревья кажутся ему зеленее и пышнее, чем в Испании, а цветы — ярче. Особенно его удивляет количество людей вокруг, и он думает, что находится в городе с восемнадцатью миллионами жителей. Пресвятая Дева!\nДавид садится в автобус, который везёт его в центр столицы — он близко, всего 13 километров, но движение сильное, и ехать приходится почти 45 минут. Он думает, что водить в таком огромном городе, должно быть, трудно. Здесь ещё больше загрязнения, чем в Мадриде. И шума тоже много: машины постоянно сигналят.\n...Неделю спустя, в аэропорту Бенито Хуарес, Давид сдаёт свой багаж. Фернанда принесла ему целую библиотеку Фриды Кало и Диего Риверы, и перевес, который показывает весы, тревожит. К счастью, чудесная сеньорита с огромными чёрными глазами из мексиканских авиалиний не возражает и пропускает багаж по ленте.\nДавид крепко обнимает Фернанду, пока она плачет и плачет безутешно. Громкоговоритель объявляет о вылете рейса Iberia: «Пассажиры рейса 3448 авиакомпании Iberia, следующих в Мадрид, должны немедленно пройти к выходу 25». Давид и Фернанда долго целуются.\n(По Долорес Солер-Эспиауба «Такси в Койоакан»)\nа) 1. V. 2. F (второй по населению). 3. F (формальности несложные). 4. F (четверть часа). 5. V. 6. V. 7. V (неделю). 8. F (книги Ф. Кало и Д. Риверы). 9. F (перевес большой). 10. F (только Фернанда). 11. F (не возражает).\nб) 1. Вулкан Попокатепетль и город. 2. Пристегнуть ремни и поднять спинки кресел. 3. Потому что он испанец. 4. Что в Европе дни короче и свет слабее. 5. Почти 45 минут. 6. Потому что машины постоянно сигналят. 7. Потому что он везёт много книг. 8. У неё огромные чёрные глаза и она из мексиканских авиалиний. 9. 3448. 10. Они долго целуются.", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 22", "sp": "просы:\n1. ¿Qué ha visto el niño en la estación y por qué ha subido al tren?\n2. ¿Por qué el niño primero tiene miedo y después se siente tranquilo en el vagón?\n3. ¿En qué piensa el niño mirando por la ventana del tren?\nPrimer viaje en tren\nLlego a la estación y veo que la gente sube y baja, los vendedores de comida, sándwiches y bebida gritan sus pregones.\nA unos cinco metros un señor con una gorra azul grita: “¡Pasajeros al tren! ¡Tren con destino a la capital!” Yo subo al tren para ver cómo es por dentro.\nDe repente siento que el tren empieza a moverse, se me hace un nudo en el estómago por la sorpresa y el miedo instintivo a lo desconocido me deja paralizado. La voz de una señora que está sentada enfrente de mí me pregunta: “¿Vas a la capital?” Le contesto contándole mi historia, que por curiosidad he subido al tren. Ella me dice: “Entonces te bajarás en la próxima estación e irás al puesto\nde la policía y les dirás que te has perdido. Ellos te harán llegar a tu casa”.\n– ¿Cuántos años tienes?\n– Seis años, señora.\n– Bueno, puedes sentarte a mi lado.\nYo me siento a su lado. Ahora estoy tranquilo y tengo la sensación de estar protegido por esa señora. Hasta este momento no he pensado mirar por la ventana del tren. Me acerco lo más posible y veo campos, árboles, mercados, pueblos, gentes. Esto me hace recordar el cine, mejor dicho la película que he visto. Para mí la sala del cine es este tren, y la pantalla es la ventana por donde veo pasar la vida de la gente.\n(Por Francisco Aliaga «El llamado de la mañana»)\n_______________\nvendedor m продавец\nmoverse (1b) двигаться\nsorpresa f зд. удивление\nacercarse приближаться\ncampo m поле\npueblo m деревня\npantalla f экран", "ru": "1. Мальчик увидел в поезде толпу людей, продавцов еды, и зашёл в вагон из любопытства. 2. Сначала он испугался, потому что поезд тронулся неожиданно; потом успокоился, когда сеньора предложила сесть рядом и защитила его. 3. Глядя в окно, он думает о кино: вагон кажется ему залом, а окно — экраном, по которому проходит жизнь людей.\nПервый раз на поезде\nЯ прихожу на станцию и вижу, как люди входят и выходят, продавцы еды, бутербродов и напитков выкрикивают свои призывы. Метрах в пяти мужчина в синей фуражке кричит: «Пассажиры, по вагонам! Поезд следует в столицу!» Я поднимаюсь в поезд, чтобы посмотреть, как он устроен внутри.\nВдруг я чувствую, что поезд начинает двигаться; от неожиданности у меня сводит живот, и инстинктивный страх перед неизвестным парализует меня. Голос женщины, сидящей напротив, спрашивает меня: «Ты в столицу?» Я отвечаю, рассказывая свою историю: из любопытства я зашёл в поезд.\nОна говорит мне: «Тогда ты выйдешь на следующей станции и пойдёшь в полицейский участок, и скажешь им, что потерялся. Они отвезут тебя домой». – Сколько тебе лет? – Шесть лет, сеньора. – Хорошо, можешь сесть рядом со мной.\nЯ сажусь рядом с ней. Теперь я спокоен и чувствую, что эта женщина меня защищает. До этого момента я и не думал смотреть в окно поезда. Я подхожу как можно ближе и вижу поля, деревья, рынки, деревни, людей. Это заставляет меня вспомнить кино, точнее, фильм, который я видел. Для меня зал кинотеатра — это этот поезд, а экран — это окно, через которое я вижу, как проходит жизнь людей.\n(По Франсиско Алиага «Утренний зов»)", "q": [], "src": "book"}], "11": [{"t": "De compras", "sp": "Ayer fui de compras al centro. Primero entré en una tienda de ropa y compré una camisa y unos pantalones. Había rebajas, así que los pantalones costaron solo treinta euros. Luego fui al mercado y compré fruta, verdura y un poco de pescado. Pagué con tarjeta porque no tenía efectivo. Al final entré en una librería y compré un diccionario. Volví a casa cansado pero contento: me gusta mucho ir de compras.", "ru": "Вчера я ходил за покупками в центр. Сначала зашёл в магазин одежды и купил рубашку и брюки. Были скидки, так что брюки стоили всего тридцать евро. Потом пошёл на рынок и купил фрукты, овощи и немного рыбы. Я заплатил картой, потому что у меня не было наличных. В конце зашёл в книжный и купил словарь. Я вернулся домой усталый, но довольный: мне очень нравится ходить за покупками.", "q": [["¿Adónde fue ayer el narrador?", "Fue de compras al centro."], ["¿Qué compró en la tienda de ropa?", "Compró una camisa y unos pantalones."], ["¿Cuánto costaron los pantalones?", "Costaron solo treinta euros."], ["¿Por qué costaron poco?", "Porque había rebajas."], ["¿Qué compró en el mercado?", "Compró fruta, verdura y pescado."], ["¿Cómo pagó?", "Pagó con tarjeta."], ["¿Por qué pagó con tarjeta?", "Porque no tenía efectivo."], ["¿Cómo volvió a casa?", "Volvió cansado pero contento."]], "src": "book"}, {"t": "Текст из учебника · упр. 18", "sp": "ветьте на вопросы:\n¿Qué compró la señora? ¿Qué le parece a usted qué plato quiere preparar la señora?\n– Buenos días. ¿Qué desea usted?\n– Necesito medio kilo de mejillones, medio kilo de calamares.\n– Las gambas están fresquísimas.\n– Sí, claro, media docena de gambas, por favor.\n– ¿Algo más?\n– Un kilo de arroz, un pollo mediano y un litro de aceite de oliva.\n– ¿Necesita una bolsa?\n– Sí.\n– Aquí lo tiene. Son cincuenta y seis euros.\n– Muchas gracias.\n– A usted, hasta luego.", "ru": "– Добрый день. Что желаете? – Мне нужно полкило мидий, полкило кальмаров. – Креветки очень свежие. – Да, конечно, полдюжины креветок, пожалуйста. – Что-нибудь ещё? – Килограмм риса, среднюю курицу и литр оливкового масла. – Вам нужен пакет? – Да. – Вот, пожалуйста. Пятьдесят шесть евро. – Большое спасибо. – Вам спасибо, до свидания.\nВопросы: Что купила сеньора? Как вы думаете, какое блюдо хочет приготовить сеньора? (Ответ: мидии, кальмары, креветки, рис, курицу, оливковое масло — вероятнее всего, паэлью.)", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 25", "sp": "¿Te apetece ir de compras?\nPara algunas personas el ir de compras es un placer, mientras que para otras se convierte en un auténtico suplicio. ¿Se encuentra usted entre alguna de ellas? Cuatro ciudadanos nos han contestado a esta pregunta.\nNatalia, 19 años, soltera.\nNatalia vive con su madre en Barcelona y confi esa que le encanta la moda. Todas las semanas se da un paseo por sus tiendas preferidas y reconoce gastar bastante dinero en ropa. Se defi ne como una compradora compulsiva. “Veo las revistas de moda y las sigo. Entre los amigos no hablamos mucho de moda. Yo creo que a mí me gusta más que a la mayoría”.\nJuan, 31 años, casado.\nJuan trabaja como agente de seguros en Bilbao y es un comprador de comportamiento racional. “Trabajo de comercial, y la imagen es muy importante”. A la hora de comprar, Juan no compra mucho, sólo lo que necesita. Aprovecha las rebajas. “Si necesito unos vaqueros, puedo recorrer cinco tiendas hasta encontrar lo que quiero”.\nAna, 39 años, casada.\n“Me gusta mucho ir de compras, pero depende de quién vaya.\nCada vez que lo intento con mis hijos es una auténtica pesadilla.\nTampoco me gusta ir con mi marido, porque siempre tiene prisa y todo le parece un poco caro. Prefi ero ir con mis amigas o sola”.\nAlberto, 59 años, casado.\n“La verdad es que no me gusta demasiado ir de compras. Suelo hacer una compra en primavera y otra en otoño”. Alberto prefi ere ir a las tiendas donde lo conocen. Atiende a los consejos de su mujer y rara vez va a comprar solo. Las marcas, asegura, ni le interesan en absoluto y se fi ja sobre todo en la calidad.\n_______________\napetecer (5а) желать/ хотеть/ нравиться\nplacer m удовольствие\nconvertirse (3) превращаться\nsuplicio m мýка / мучение/ наказание\nconfesar (1а) признаваться\nreconocer (5a) признавать\ndefi nir определять\nagente de seguros страховой агент\ncomportamiento m поведение\naprovechar воспользоваться\npesadilla f кошмар\nprimavera f весна\notoño m осень\natender (1a) a los consejos прислушиваться к советам fi jarse обращать внимание calidad f качество\nа) Ответьте на вопросы:\n1. ¿Con qué frecuencia suele ir Natalia de compras?\n2. ¿Cuánto gasta en ropa?\n3. ¿Qué tipo de compradora se considera a sí misma? ¿Por qué?\n4. ¿Cómo se defi ne Juan a sí mismo como comprador? ¿Por qué?\n5. ¿Cuándo suele ir de compras Juan?\n6. ¿Es un comprador paciente? ¿Por qué?\n7. ¿Por qué no le gusta a Ana ir de compras con sus hijos ni con su marido?\n8. ¿Le gusta a Alberto ir de compras?\n9. ¿En qué época del año suele comprar Alberto?\n10. ¿Qué busca Alberto en la ropa que compra?", "ru": "Хочется ли вам пойти за покупками?\nДля некоторых людей ходить по магазинам — удовольствие, тогда как для других это превращается в настоящее мучение. Вы относитесь к кому-то из них? Четверо горожан ответили на этот вопрос.\nНаталия, 19 лет, не замужем. Наталия живёт с матерью в Барселоне и признаётся, что обожает моду. Каждую неделю она прогуливается по своим любимым магазинам и признаёт, что тратит на одежду довольно много денег. Она определяет себя как компульсивного покупателя. «Я смотрю журналы мод и следую им. Среди друзей мы не много говорим о моде. Думаю, мне она нравится больше, чем большинству».\nХуан, 31 год, женат. Хуан работает страховым агентом в Бильбао и является покупателем с рациональным поведением. «Я работаю в торговле, и имидж очень важен». При покупке Хуан покупает немного, только то, что нужно. Он пользуется распродажами. «Если мне нужны джинсы, я могу обойти пять магазинов, пока не найду то, что хочу».\nАна, 39 лет, замужем. «Мне очень нравится ходить по магазинам, но зависит от того, с кем. Каждый раз, когда я пытаюсь это сделать с детьми, это настоящий кошмар. Также не люблю ходить с мужем, потому что он всегда спешит и всё ему кажется дороговатым. Предпочитаю ходить с подругами или одна».\nАльберто, 59 лет, женат. «Честно говоря, я не очень люблю ходить по магазинам. Обычно делаю покупки весной и осенью». Альберто предпочитает ходить в магазины, где его знают. Он прислушивается к советам жены и редко ходит за покупками один. Бренды, уверяет он, его совсем не интересуют, и обращает внимание прежде всего на качество.\nа) 1. Каждую неделю. 2. Довольно много. 3. Компульсивным; потому что обожает моду. 4. Рациональным; потому что покупает только необходимое. 5. Когда есть распродажи. 6. Да; он готов обойти пять магазинов. 7. С детьми — кошмар, с мужем — потому что он спешит и всё кажется дорогим. 8. Не слишком. 9. Весной и осенью. 10. Качество.", "q": [], "src": "book"}], "12": [{"t": "En el restaurante", "sp": "El domingo pasado mis amigos y yo quedamos en un restaurante del centro para celebrar mi cumpleaños. Cuando llegamos, el camarero nos llevó a una mesa junto a la ventana. Pedimos una paella para dos y una ensalada. De primero tomamos sopa y de segundo, pescado. Todo estaba muy rico. De postre pedimos helado y café. Al final, el camarero nos trajo la cuenta y dejamos una propina. Fue una comida muy agradable.", "ru": "В прошлое воскресенье мы с друзьями встретились в ресторане в центре, чтобы отпраздновать мой день рождения. Когда мы пришли, официант проводил нас к столику у окна. Мы заказали паэлью на двоих и салат. На первое взяли суп, на второе — рыбу. Всё было очень вкусно. На десерт заказали мороженое и кофе. В конце официант принёс счёт, и мы оставили чаевые. Это был очень приятный обед.", "q": [["¿Dónde quedaron los amigos?", "Quedaron en un restaurante del centro."], ["¿Por qué celebraron la comida?", "Para celebrar el cumpleaños del narrador."], ["¿Dónde les llevó el camarero?", "Les llevó a una mesa junto a la ventana."], ["¿Qué pidieron?", "Pidieron una paella para dos y una ensalada."], ["¿Qué tomaron de primero y de segundo?", "De primero sopa y de segundo pescado."], ["¿Qué pidieron de postre?", "Pidieron helado y café."], ["¿Dejaron propina?", "Sí, dejaron una propina."]], "src": "own"}, {"t": "Текст из учебника · упр. 19", "sp": "язык кулинарный рецепт:\nReceta de las albóndigas de patata\nrellenas de queso\nIngredientes:\n1 kg de patatas\n300 g de queso rallado\n10 cucharadas de aceite\n1 vaso de harina\nsal, laurel\nDifi cultad: mínima\nPrimero pelamos las patatas, después las limpiamos y ponemos a cocer en una cazuela con abundante agua, sal y dos hojas de laurel.\nCuando las patatas están cocidas, las escurrimos, machacamos, hasta obtener un puré de patatas y lo dejamos enfriarse.\nCuando el puré de patatas está templado, hacemos las bolas y en medio metemos un poco de queso rallado.\nPor último, echamos aceite en una sartén, pasamos las albóndigas por harina y freímos en abundante aceite. Cuando están doradas, las retiramos a un plato con papel absorbente, y\n¡ya está!\nYa tenemos nuestras albóndigas de patata rellenas de queso, una guarnición perfecta para acompañar carne o pescado.", "ru": "Кулинарный рецепт: картофельные шарики с сыром\nИнгредиенты: 1 кг картофеля, 300 г тёртого сыра, 10 столовых ложек масла, 1 стакан муки, соль, лавровый лист. Сложность: минимальная.\nСначала чистим картофель, потом моем его и ставим вариться в кастрюле с большим количеством воды, солью и двумя лавровыми листьями. Когда картофель сварится, сливаем воду, разминаем до получения пюре и даём остыть.\nКогда картофельное пюре тёплое, делаем шарики и внутрь кладём немного тёртого сыра. Наконец, наливаем масло на сковороду, обваливаем шарики в муке и жарим в большом количестве масла. Когда они подрумянятся, выкладываем их на тарелку с бумажным полотенцем — и готово! Вот у нас и есть картофельные шарики с сыром — идеальный гарнир к мясу или рыбе.", "q": [], "src": "book"}], "13": [{"t": "Las vacaciones ideales", "sp": "El próximo julio mis amigos y yo iremos de vacaciones a la costa. Si reservamos ahora, encontraremos un alojamiento más barato. Si hace buen tiempo, pasaremos los días en la playa; si llueve, visitaremos museos y ciudades cercanas. Me gustaría hacer una excursión a la montaña para ver el paisaje. También quiero probar la comida típica de la región. Si tengo suficiente dinero, alquilaré un coche para moverme con libertad. Serán unas vacaciones inolvidables.", "ru": "В следующем июле мы с друзьями поедем в отпуск на побережье. Если мы забронируем сейчас, найдём более дешёвое жильё. Если будет хорошая погода, мы будем проводить дни на пляже; если пойдёт дождь, посетим музеи и ближайшие города. Мне хотелось бы совершить экскурсию в горы, чтобы увидеть пейзаж. Ещё я хочу попробовать местную кухню. Если у меня будет достаточно денег, я возьму машину напрокат, чтобы свободно передвигаться. Это будет незабываемый отпуск.", "q": [["¿Adónde irán de vacaciones?", "Irrán de vacaciones a la costa."], ["¿Qué pasará si reservan ahora?", "Encontrarán un alojamiento más barato."], ["¿Qué harán si hace buen tiempo?", "Pasarán los días en la playa."], ["¿Qué harán si llueve?", "Visitarán museos y ciudades cercanas."], ["¿Qué excursión le gustaría hacer?", "Le gustaría hacer una excursión a la montaña."], ["¿Qué quiere probar?", "Quiere probar la comida típica de la región."], ["¿Qué hará si tiene suficiente dinero?", "Alquilará un coche."]], "src": "own"}, {"t": "Текст из учебника · упр. 13", "sp": "сами, стараясь повторить интонацию и произношение\nдиктора.\n1)\nPara reservar un hotel\n– Hotel “Rosmari”. ¿En qué puedo servirle?\n– Buenas tardes. ¿Tendrán habitaciones libres el próximo fi n de semana?\n– Sí, señor. ¿Desea reservar?\n– Sí, seremos tres: dos adultos y un niño.\n– ¿Una habitación doble con cama extra?\n– No, una habitación doble y una individual.\n– ¿Quiere usted una habitación doble con dos camas o con cama de matrimonio?\n– No importa.\n–¿Para cuántas noches?\n– Llegaremos el viernes que viene y el domingo ya\nsaldremos.\n– ¿А nombre de quién hacer la reserva?\n– A nombre de Vladímir Serov. ¿Cuánto costará?\n– Dos habitaciones para dos noches cuestan trescientos setenta euros.\n– ¿Está incluido el desayuno?\n– Naturalmente, señor. ¿Reservo?\n– Sí. Gracias.\n2)\nEn la recepción. Alojamiento\n– Hola, buenos días. Me llamo José. ¿En qué puedo ayudarla?\n– Buenos días. Tengo una habitación reservada a nombre de Ana\nIglesias Marín.\n– A ver... Sí, ¡bienvenida, señora! ¿Cuántas noches estará en el hotel?\n– Una semana. Saldré el jueves que viene.\n– Muy bien. ¿Me deja su pasaporte, por favor?\n– Sí, claro.\n– ¿Quiere usted una habitación doble o individual?\n– Una individual, por favor. ¿Está incluido el desayuno?\n– No. El desayuno se sirve en el restaurante en la planta baja desde las siete hasta las once. Cuesta diez euros. Si quiere, le serviremos el desayuno en su habitación.\n– No, gracias.\n– Aquí tiene la llave, su habitación es la 515 con un balcón que da al jardín.\n– ¿Estará en el quinto piso? ¿Hay ascensor?\n– Sí, la habitación está en el quinto piso. El ascensor está a la izquierda, junto a la escalera. El portero la acompañará y le llevará su maleta. Si hay algún problema, tiene que marcar cerouno-dos.\n– Gracias, José. Hasta luego.\n3)\nLlamamos a la recepción\n– Diga. Recepción.\n– Hola. Tenemos problemas con el aire acondicionado. Parece que no funciona.\n– ¿Qué número de habitación tienen?\n– Es la trescientos trece.\n– Ahora viene el técnico.\n– Además no podemos cerrar\nla caja fuerte y tampoco podemos\nabrir la puerta del balcón.\n– Un momento. Voy a tomar\nnota.\n– Y una pregunta más, ¿cómo\nconectarse a Internet?\n– La contraseña es el nombre\ndel hotel con minúscula y el\nnúmero de la habitación.\n– Muchas gracias. Esperaremos\nal técnico.\n– De nada. A sus órdenes.\n_________\ntomar nota записать\ncontraseña f пароль\nminúscula f строчная буква\na sus órdenes к Вашим услугам\nа) Заполните пропуски словами из диалогов и перескажите их содержание:\n1) Vladímir Serov llamó al hotel … porque necesitaba reservar\n… habitaciones para dos … y un niño: una habitación … y una doble para … noches. Querían llegar el … y salir el … El desayuno estaba … en el precio. Vladimir debía pagar …€.\n2) La cliente tenía … una habitación a … de Ana Iglesias Marín.\nElla afi rmó que … en el hotel una semana y … el próximo … Ana prefi rió una habitación … El recepcionista le ofreció una habitación en el … piso con un … que daba al … El … no estaba incluido, costaba … euros y se servía en el restaurante en la … baja desde las … hasta las … Si había algún … , ella … que … 012. El … la acompañó y le … su maleta.\n3) Los clientes llamaron a la recepción porque … y además no\n… cerrar … y … la puerta de … . Los clientes querían … a Internet pero no sabían … . El recepcionista explicó que la … era el nombre del … con … y el … de la habitación.\nб) Составьте подобные диалоги.", "ru": "1) Бронирование отеля. – Отель «Росмари». Чем могу служить? – Добрый день. У вас будут свободные номера на следующие выходные? – Да, сеньор. Желаете забронировать? – Да, нас будет трое: двое взрослых и ребёнок. – Двухместный номер с дополнительной кроватью? – Нет, двухместный номер и одноместный. – Вы хотите двухместный номер с двумя кроватями или с двуспальной? – Не важно. – На сколько ночей? – Мы приедем в следующую пятницу, а в воскресенье уже уедем. – На чьё имя сделать бронь? – На имя Владимира Серова. Сколько это будет стоить? – Два номера на две ночи стоят триста семьдесят евро. – Завтрак включён? – Разумеется, сеньор. Бронирую? – Да. Спасибо.\n2) На ресепшене. – Здравствуйте, добрый день. Меня зовут Хосе. Чем могу помочь? – Добрый день. У меня забронирован номер на имя Аны Иглесиас Марин. – Сейчас посмотрим... Да, добро пожаловать, сеньора! Сколько ночей вы пробудете в отеле? – Неделю. Уеду в следующий четверг. – Отлично. Дайте мне ваш паспорт, пожалуйста? – Да, конечно. – Вы хотите двухместный или одноместный номер? – Одноместный, пожалуйста. Завтрак включён? – Нет. Завтрак подают в ресторане на первом этаже с семи до одиннадцати. Стоит десять евро. Если хотите, мы подадим завтрак в ваш номер. – Нет, спасибо. – Вот ваш ключ, ваш номер 515 с балконом, выходящим в сад. – Он на пятом этаже? Есть лифт? – Да, номер на пятом этаже. Лифт слева, рядом с лестницей. Портье вас проводит и отнесёт ваш чемодан. Если возникнет проблема, нужно набрать ноль-один-два. – Спасибо, Хосе. До свидания.\n3) Звоним на ресепшен. – Алло. Ресепшен. – Здравствуйте. У нас проблемы с кондиционером. Кажется, он не работает. – Какой у вас номер? – Триста тринадцатый. – Сейчас придёт техник. – Кроме того, мы не можем закрыть сейф и не можем открыть дверь на балкон. – Минуту. Я запишу. – И ещё вопрос: как подключиться к интернету? – Пароль — это название отеля со строчной буквы и номер комнаты. – Большое спасибо. Подождём техника. – Не за что. К вашим услугам.\nа) 1) Владимир Серов позвонил в отель, чтобы забронировать два номера на двоих взрослых и ребёнка: одноместный и двухместный на две ночи. Они хотели приехать в пятницу и уехать в воскресенье. Завтрак был включён в цену. Владимиру нужно было заплатить 370 €. 2) У клиентки был забронирован номер на имя Аны Иглесиас Марин. Она сказала, что пробудет в отеле неделю и уедет в следующий четверг. Ана предпочла одноместный номер. Портье предложил ей номер на пятом этаже с балконом, выходящим в сад. Завтрак не входил, стоил 10 евро и подавался в ресторане на первом этаже с семи до одиннадцати. Если возникала проблема, ей нужно было набрать 012. Портье её проводил и отнёс чемодан. 3) Клиенты позвонили на ресепшен, потому что кондиционер не работал, и к тому же не могли закрыть сейф и открыть дверь на балкон. Клиенты хотели подключиться к интернету, но не знали пароля. Портье объяснил, что пароль — это название отеля со строчной буквы и номер комнаты.", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 15", "sp": "Alquilando un coche\n– Me gustaría alquilar un coche.\n– ¿Con conductor?\n– No, yo soy conductor.\n– ¿Tiene reserva anticipada?\n– No.\n– ¿Qué coche quiere alquilar?\n– Un coche económico, automático.\n– Su pasaporte y carnet de conducir, por favor… Los documentos están en regla.\n– ¿Cómo es la tarifa?\n– 60 euros al día.\n– ¿Qué incluye el precio del alquiler?\n– Kilometraje ilimitado, seguro a terceros (sin franquicia), asistencia en carretera. ¿Necesita algo más, por ejemplo, sillas de coche para bebé, perchas para el coche o un gps?\n– No, gracias. ¿Puedo devolver el coche a cualquier hora?\n– Sí, no hay ningún problema. Se realizan devoluciones las 24 horas. Pero antes de devolver el coche debe llenar el depósito. Aquí al lado hay una gasolinera.\n_______\nanticipado предварительный\npercha f вешалка\nllenar наполнить", "ru": "Аренда машины. – Я хотел бы взять машину напрокат. – С водителем? – Нет, я сам водитель. – У вас есть предварительная бронь? – Нет. – Какую машину вы хотите арендовать? – Экономичную, с автоматической коробкой. – Ваш паспорт и водительские права, пожалуйста... Документы в порядке. – Какой тариф? – 60 евро в день. – Что включает стоимость аренды? – Неограниченный километраж, страховку ответственности перед третьими лицами (без франшизы), помощь на дороге. Нужно ли вам что-то ещё, например, детские кресла, вешалки для машины или GPS? – Нет, спасибо. Я могу вернуть машину в любое время? – Да, никаких проблем. Возврат производится круглосуточно. Но перед возвратом машины нужно наполнить бак. Здесь рядом есть заправка.", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 17", "sp": "стараясь повторить интонацию и произношение диктора.\nViajando en coche por Europa\nTío Ricardo. – ¿Qué tal el viaje por Europa, Luisita?\nLuisa. – ¡Ha sido un viaje maravilloso, querido! ¡Pablo y yo tenemos tantas impresiones inolvidables!\nTío Ricardo. – ¿Fue la primera vez que viajasteis en un coche alquilado, verdad?\nLuisa. – Sí, hemos recorrido dos mil kilómetros en cinco días.\nTío Ricardo. – ¿No habéis tenido problemas con el coche?\nLuisa. – Con el coche ningún problema. Con el conductor, sí.\n¡Nos multaron cinco veces por infringir las normas de la circulación!\nTío Ricardo. – ¡No puedo creerlo! Tu marido es tan prudente.\nSiempre respeta las reglas y además tiene mucha experiencia, lleva casi veinte años conduciendo el coche.\nLuisa. – Tienes razón, tío. Pero dos veces él aparcó el coche en lugar prohibido porque no había notado la señal. Dos veces excedió la velocidad máxima autorizada y una vez no hizo caso de un semáforo en rojo.\nTío Ricardo. – ¡Dios mío! ¡Qué horror! ¿Cuánto os costó el viaje en total?\nLuisa. – Con las multas más de tres mil euros.\nTío Ricardo. – ¡Qué va! Igual que nos costó el crucero por el\nCaribe el año pasado. Prefiero los viajes organizados por eso me parece que el crucero es la forma más cómoda y placentera de viajar.\nLuisa. – ¡Es aburrido! Ir de un puerto a otro, con el mismo paisaje y la misma gente que te rodea.\nTío Ricardo. – No estoy de acuerdo contigo. El crucero tiene muchas ventajas. El placer y la tranquilidad de estar en un barco de crucero, que provee transporte, alojamiento, comida y entretenimiento todo en un paquete. Es una manera agradable de viajar, evitando el ajetreo de hacerlo por aire, tren o en coche, y tener que entrar y salir de hoteles. No hay que hacer y deshacer maletas, ni traslados en taxi a aeropuertos y largas esperas en los terminales...\nLuisa. – De los gustos no hay nada escrito.\n______\nmaravilloso чудесный\nquerido дорогой (обращение)\nimpresión f впечатление\ninolvidable незабываемый\nexperiencia f опыт\nseñal f знак\nhorror m ужас\nrodear окружать\naburrido скучный\nventaja f преимущество\nproveer предоставлять\nentretenimiento m развлечение\nevitar избегать\najetreo m суматоха\nDe los gustos no hay nada escrito. О вкусах не спорят.", "ru": "Путешествуя на машине по Европе. Дядя Рикардо. – Как прошла поездка по Европе, Луисита? Луиса. – Это была чудесная поездка, дорогой! У нас с Пабло столько незабываемых впечатлений! Дядя Рикардо. – Вы впервые путешествовали на арендованной машине, верно? Луиса. – Да, мы проехали две тысячи километров за пять дней. Дядя Рикардо. – У вас не было проблем с машиной? Луиса. – С машиной никаких проблем. А вот с водителем — да. Нас оштрафовали пять раз за нарушение правил дорожного движения!\nДядя Рикардо. – Не могу поверить! Твой муж такой осторожный. Он всегда соблюдает правила и к тому же имеет большой опыт — водит машину почти двадцать лет. Луиса. – Ты прав, дядя. Но два раза он припарковал машину в запрещённом месте, потому что не заметил знака. Два раза превысил максимально разрешённую скорость и один раз не обратил внимания на красный свет. Дядя Рикардо. – Боже мой! Какой ужас! Сколько вам стоила поездка в общей сложности? Луиса. – С штрафами — больше трёх тысяч евро.\nДядя Рикардо. – Да ну! Столько же, сколько нам стоил круиз по Карибам в прошлом году. Я предпочитаю организованные поездки; поэтому мне кажется, что круиз — самый удобный и приятный способ путешествовать. Луиса. – Это скучно! Переезжать из порта в порт с тем же пейзажем и теми же людьми вокруг. Дядя Рикардо. – Я с тобой не согласен. У круиза много преимуществ. Удовольствие и спокойствие от пребывания на круизном лайнере, который обеспечивает транспорт, проживание, питание и развлечения — всё в одном пакете. Это приятный способ путешествовать, избегая суеты поездок самолётом, поездом или на машине и необходимости заселяться и выселяться из отелей. Не нужно собирать и разбирать чемоданы, ни переездов на такси в аэропорты, ни долгих ожиданий в терминалах... Луиса. – О вкусах не спорят.", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 18", "sp": "1. ¿Le gustó a Luisa el viaje en coche por Europa?\n2. ¿Cuántos días estuvieron Luisa y su marido de viaje?\n3. ¿Es un conductor bueno el marido de Luisa?\n4. ¿Cuántas veces los multaron durante el viaje a los esposos y por qué?\n5. ¿Cuánto les costó a Luisa y a su esposo el viaje por Europa?\n6. ¿Qué ventajas tiene el crucero según la opinión del señor\nRicardo?\n7. ¿Está usted de acuerdo con el señor? ¿Por qué?", "ru": "Вопросы по диалогу:\n1. Понравилась ли Луисе поездка на машине по Европе? (Да, это была чудесная поездка.)\n2. Сколько дней Луиса и её муж были в поездке? (Пять дней, проехали 2000 км.)\n3. Хороший ли водитель муж Луисы? (Он осторожный и опытный, но в поездке нарушал правила.)\n4. Сколько раз их штрафовали и за что? (Пять раз: дважды парковка в запрещённом месте, дважды превышение скорости, один раз проезд на красный.)\n5. Сколько стоила поездка по Европе? (Больше трёх тысяч евро вместе со штрафами.)\n6. Какие преимущества у круиза по мнению сеньора Рикардо? (Транспорт, проживание, питание и развлечения в одном пакете; без хлопот с чемоданами и переездами.)\n7. Согласны ли вы с сеньором? Почему? (Свободный ответ.)", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 19", "sp": "просы:\n¿Qué características tiene un mochilero?\n¿Cómo pueden los mochileros viajar gastando lo menos posible?\n¿De qué pasaportes se trata en el texto?\nEl mochilero, el viajero diferente\nEl mochilero es un personaje específi co de la vida contemporánea.\nEl mochilero es un joven que con poco dinero y mucho deseo se pone a viajar por el mundo solo, gastando lo menos posible (conoce todos los alojamientos interesantes de media estrella, e incluso de ninguna) y disfrutando al máximo porque lo que vale no tiene precio.\nEl mochilero es un maestro en el arte de vivir a fondo mientras pasa por diferentes lugares del planeta, sea Tailandia o Galicia, Sri Lanka o Seychelles.\nLa mayoría de los mochileros son jóvenes que se van de viajes cuando terminan una etapa de sus estudios, antes de pasar a una nueva fase, antes de dedicarse a una profesión. En general saben cuidar de sí mismos mejor de lo que los padres creen, y suelen pasar de golpe de la adolescencia a ser una persona mayor de edad – en sus primeros viajes, pero sin caerse del árbol.\nLos mochileros esperan horas y hasta días por la oferta de un asiento barato, y en cuanto lo encuentran son capaces de estar en pocos minutos en un gran aeropuerto y tomar un vuelo al fi n del mundo. Por poco dinero llegan a ciudades que tenían elegidas desde hace mucho tiempo, que sólo conocían por Internet o que no sabían ni que existían, elegidas simplemente por la oferta atractiva.\nSu segundo pasaporte, aparte del documento de su país, es el inglés. Y su tercer pasaporte, es saber pedir las cosas “por favor” y dar las gracias con gestos que no necesitan traducción. Aunque todavía entre los mochileros hay más chicos, cada vez más chicas aprenden a recorrer el mundo con una mochila. No hay que confundir un viaje de un mochilero con las habituales salidas de fi n de curso o con las excursiones de quinceañeras.\nPara empezar, los mochileros son un poco mayores, lo que es importante, y, sobre todo, no van en grupo, son más individualistas.\nAdemás, la familia está lejos y tienen que sobrevivir sin pedir ayuda ni dinero, por lo que deben gastar sus dólares con extremo cuidado.\n(Adaptado de lanación.com, Argentina)\n________\nmochilero человек с рюкзаком за плечами\ncontemporáneo современный\ngastar тратить\nestrella f звезда\nvivir a fondo жить полной жизнью\npasar de golpe зд. перепрыгнуть\nser capaz de быть способным на\nconfundir путать\nsobre todo особенно\nsobrevivir выживать", "ru": "Бэкпекер, путешественник особого рода\nБэкпекер — это специфический персонаж современной жизни. Бэкпекер — это молодой человек, который с небольшими деньгами и большим желанием отправляется путешествовать по миру один, тратя как можно меньше (он знает все интересные места размещения в пол-звезды и даже без звёзд) и наслаждаясь по максимуму, потому что то, что ценно, не имеет цены.\nБэкпекер — мастер искусства жить в полную силу, проходя через разные места планеты: будь то Таиланд или Галисия, Шри-Ланка или Сейшелы. Большинство бэкпекеров — молодые люди, которые уезжают в путешествия, когда заканчивают этап учёбы, перед переходом в новую фазу, перед тем как посвятить себя профессии.\nВ целом они умеют заботиться о себе лучше, чем думают родители, и обычно одним махом переходят из подросткового возраста во взрослого — в своих первых поездках, но не падая с дерева (то есть не сбиваясь с пути). Бэкпекеры ждут часами и даже днями выгодного предложения на дешёвое место, и как только находят его, способны за несколько минут оказаться в большом аэропорту и улететь на рейс на край света.\nЗа небольшие деньги они попадают в города, которые выбрали давно, которые знали только по интернету или о существовании которых даже не знали, выбранные просто из-за привлекательного предложения. Их второй паспорт, помимо документа своей страны, — это английский. А третий паспорт — это умение просить что-либо «пожалуйста» и благодарить жестами, которые не нуждаются в переводе.\nХотя среди бэкпекеров пока больше парней, всё больше девушек учатся объезжать мир с рюкзаком. Не стоит путать путешествие бэкпекера с обычными поездками по окончании учебного года или с экскурсиями пятнадцатилетних. Для начала бэкпекеры немного старше, что важно, и, главное, они не едут группой, они более индивидуалисты. К тому же семья далеко, и им приходится выживать, не прося помощи и денег, поэтому они должны тратить свои доллары с чрезвычайной осторожностью.\n(Адаптировано по lanacion.com, Аргентина)\nЧто характеризует бэкпекера? Как они могут путешествовать, тратя как можно меньше? О каких паспортах идёт речь в тексте? (Ответы: молодой человек, путешествующий один с рюкзаком; ночуя в самых дешёвых местах и выискивая дешёвые билеты; о документе страны, об английском языке и о языке жестов.)", "q": [], "src": "book"}], "14": [{"t": "El deporte en mi vida", "sp": "El deporte es una parte muy importante de mi vida. Juego al fútbol desde niño y también voy a la piscina dos veces por semana. El fútbol me enseña a trabajar en equipo: no se gana solo. Los sábados veo los partidos con mis amigos; mi equipo favorito es el Real Madrid. Cuando era pequeño, jugaba en el parque todos los días. Ahora tengo menos tiempo, pero nunca dejo el deporte: es bueno para la salud y para el ánimo.", "ru": "Спорт — очень важная часть моей жизни. Я играю в футбол с детства, а ещё хожу в бассейн два раза в неделю. Футбол учит меня работать в команде: победу не добывают в одиночку. По субботам я смотрю матчи с друзьями; моя любимая команда — «Реал Мадрид». Когда я был маленьким, я играл в парке каждый день. Сейчас у меня меньше времени, но я никогда не бросаю спорт: он полезен для здоровья и для настроения.", "q": [["¿Desde cuándo juega al fútbol?", "Juega al fútbol desde niño."], ["¿Cuántas veces va a la piscina?", "Va a la piscina dos veces por semana."], ["¿Qué le enseña el fútbol?", "Le enseña a trabajar en equipo."], ["¿Cuándo ve los partidos?", "Los ve los sábados con sus amigos."], ["¿Cuál es su equipo favorito?", "Su equipo favorito es el Real Madrid."], ["¿Qué hacía cuando era pequeño?", "Jugaba en el parque todos los días."], ["¿Por qué no deja el deporte?", "Porque es bueno para la salud y para el ánimo."]], "src": "own"}, {"t": "Текст из учебника · упр. 15", "sp": "ский язык.\nLos XXII Juegos Olímpicos de Invierno\nLos Juegos Olímpicos de Sochi 2014, oficialmente conocidos como los XXII Juegos Olímpicos de Invierno, fueron un evento multideportivo internacional, celebrado en la ciudad de Sochi,\nRusia, entre el 7 y el 23 de febrero de 2014. Algunos eventos se realizaron en la ciudad turística de Krásnaya Poliana. Se llevaron a cabo 98 eventos de 15 deportes olímpicos.\nLa elección de la sede de los Juegos Olímpicos tuvo lugar el\n4 de julio de 2007, en la Ciudad de Guatemala, Guatemala. Los\nJuegos de Sochi fueron los primeros Juegos Olímpicos de Invierno celebrados en la Federación Rusa. En 1980, los Juegos Olímpicos de Verano se celebraron en Moscú cuando todavía era capital de la\nUnión Soviética.\nLa preparación de los Juegos implicó la construcción de nuevas sedes, además de la modernización de las telecomunicaciones, la energía eléctrica y los sistemas de transporte de esta zona. Estas mejoras incluyeron la construcción de un nuevo Parque Olímpico a lo largo de la costa del mar Negro en el valle de Imeretin. Estos fueron los Juegos Olímpicos más caros de la historia, con un costo de 51 mil millones de dólares.\nCasi 6.000 deportistas de 88 países compitieron durante dos semanas por las 98 medallas en juego, en 15 modalidades como esquí alpino, hockey sobre hielo, bobsleigh, biatlón, snowboard, curling y otras.\nLos ganadores de las competiciones recibieron sus medallas de oro con fragmentos del meteorito de Cheliábinsk, caído en la región rusa de los Urales en 2013.\nCon los resultados obtenidos en Sochi 2014 por Rusia, el país no sólo ocupó el primer lugar del medallero olímpico, sino que también superó el mejor resultado obtenido por la Unión Soviética en Calgary en1988 e igualando la cantidad de oros también obtenidos por los soviéticos en Innsbruck en 1976.\n_________\nevento m событие\nllevar a cabo проводить\nsede f место проведения\ntener lugar = celebrarse\na lo largo de вдоль\nvalle m долина\ncapital f столица\nimplicar вызывать / влечь за собой\ncosto m расходы / стоимость\ncantidad f количество\nobtener получать\nа) Ответьте на вопросы:\n1. ¿Cuándo y dónde se celebraron los XXII Juegos Olímpicos de\nInvierno?\n2. ¿Dónde y cuándo eligieron la sede de estos JJ OO?\n3. ¿Qué evento deportivo se celebró en 1980?\n4. ¿Qué incluyó la preparación de los Juegos Olímpicos?\n5. ¿Cuántos países tomaron parte en los Juegos?\n6. ¿En qué modalidades compitieron casi 6.000 deportistas?\n7. ¿En qué consiste la singularidad de las medallas de oro obtenidas en Sochi por los ganadores?\n8. ¿Cuáles son los resultados de la selección olímpica de Rusia en los JJ OO de Invierno de 2014?\nб) Расскажите о XXII Зимних Олимпийских играх в Сочи.", "ru": "XXII Зимние Олимпийские игры\nОлимпийские игры в Сочи 2014, официально известные как XXII Зимние Олимпийские игры, были международным мультиспортивным событием, проведённым в городе Сочи, Россия, с 7 по 23 февраля 2014 года. Некоторые соревнования прошли в туристическом городе Красная Поляна. Было проведено 98 соревнований по 15 олимпийским видам спорта.\nВыбор места проведения Олимпийских игр состоялся 4 июля 2007 года в городе Гватемала, Гватемала. Игры в Сочи стали первыми Зимними Олимпийскими играми, проведёнными в Российской Федерации. В 1980 году Летние Олимпийские игры прошли в Москве, когда она ещё была столицей Советского Союза.\nПодготовка к Играм включала строительство новых объектов, а также модернизацию телекоммуникаций, электроснабжения и транспортных систем этого района. Эти улучшения включали строительство нового Олимпийского парка вдоль побережья Чёрного моря в долине Имеретинская. Это были самые дорогие Олимпийские игры в истории — стоимостью 51 миллиард долларов.\nПочти 6000 спортсменов из 88 стран соревновались в течение двух недель за 98 разыгрываемых медалей в 15 дисциплинах, таких как горнолыжный спорт, хоккей с шайбой, бобслей, биатлон, сноуборд, кёрлинг и другие. Победители соревнований получили свои золотые медали с фрагментами метеорита Челябинск, упавшего в российской области Урала в 2013 году.\nС результатами, полученными в Сочи 2014, Россия не только заняла первое место в олимпийском медальном зачёте, но и превзошла лучший результат, полученный Советским Союзом в Калгари в 1988 году, и сравнялась по количеству золотых медалей, также полученных советскими спортсменами в Инсбруке в 1976 году.\nа) 1. С 7 по 23 февраля 2014 года в Сочи, Россия. 2. 4 июля 2007 года в Гватемале. 3. Летние Олимпийские игры в Москве. 4. Строительство новых объектов и модернизацию инфраструктуры. 5. 88 стран. 6. В 15 дисциплинах. 7. В них фрагменты Челябинского метеорита. 8. Первое место в медальном зачёте и рекорд.", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 18", "sp": "язык спортивные новости. Подготовьте подобные сообщения.\nEl grandioso Rafa Nadal ha vuelto a lograr en Roland Garros otro éxito deportivo que le convierte en un gigante mítico para el tenis de España y del mundo.\nEste fi n de semana, otro gran éxito para el deporte español ha sido conseguido por el laureado atleta Chema Martínez, al ganar la impresionante prueba del ultramaratón en el desierto de Gobi chino. Una aventura extrema en la que, en seis etapas consecutivas, hay que recorrer 250 kilómetros por un terreno tan duro como sobrehumano. Chema Martínez, a sus 42 años, sigue demostrando que correr es vida.\n“Es un reto de una dimensión superior”, afirma Unai Emery, entrenador del Sevilla, cuando se le pregunta por la gran asignatura pendiente de su equipo en la actual temporada. El Sevilla es el único equipo de Primera que todavía no ha conseguido el triunfo fuera de casa, algo que se confirmó después del triunfo de Las Palmas el pasado viernes en el feudo del Getafe. El 23 de\nmayo de 2015, el Sevilla derrotaba al Málaga 2:3 en el último partido de la Liga de la temporada pasada. Desde entonces, el\nSevilla ha disputado un total de 12 encuentros lejos del Sánchez\nPizjuán, de los que perdió cuatro (Las Palmas, Villarreal, Real Sociedad y Granada) y empató ocho (Málaga, Levante, Eibar, Deportivo, Betis, Atlético de Madrid, Celta y Rayo Vallecano). Ese reto de dimensión superior al que se refiere Emery consiste en ganar por primera vez fuera de casa y hacerlo en el Camp Nou, donde el Barcelona no pierde un partido desde el 21 de febrero de 2015, cuando el equipo que dirige Luis Enrique perdió 0:1 ante el Málaga, con gol de Juanmi.\n_________\nreto m вызов\ndimensión f масштаб\nfeudo m владение\ndisputar спорить / оспаривать / соперничать\nLa selección española de gimnasia rítmica ha logrado una plaza en los Juegos de Río a lo grande, con un bronce mundial, su mejor resultado desde la plata de 1998. Desde entonces no había vuelto a un podio en la general.\n“Ha sido nuest ra mejor actuación de la temporada”, aseguró\nAlejandra Quereda, la capitana. “Este equipo no tiene límites”, añadió. España salió en el primer grupo. No falló la todopoderosa\nRusia, que mostró su clara intención de volver a reinar.\n_________\nfallar терпеть неудачу\ntodopoderoso всемогущий\nintención f намерение", "ru": "Великий Рафа Надаль вновь добился в Ролан Гаррос очередного спортивного успеха, который делает его мифическим гигантом для тенниса Испании и мира. В эти выходные ещё один большой успех испанского спорта был достигнут прославленным атлетом Чемой Мартинесом, победившим в впечатляющем забеге ультрамарафона в китайской пустыне Гоби. Экстремальное приключение, в котором за шесть последовательных этапов нужно преодолеть 250 километров по местности столь же суровой, сколь и сверхчеловеческой. Чема Мартинес в свои 42 года продолжает доказывать, что бег — это жизнь.\n«Это вызов высшего масштаба», — утверждает Унаи Эмери, тренер «Севильи», когда его спрашивают о главной нерешённой задаче его команды в текущем сезоне. «Севилья» — единственная команда Примеры, которая ещё не добилась победы в гостях, что подтвердилось после победы «Лас-Пальмас» в прошлую пятницу на поле «Хетафе».\n23 мая 2015 года «Севилья» обыграла «Малагу» 2:3 в последнем матче Лиги прошлого сезона. С тех пор «Севилья» провела в общей сложности 12 матчей вдали от «Санчес Писхуан», из которых проиграла четыре («Лас-Пальмас», «Вильярреал», «Реал Сосьедад» и «Гранада») и сыграла вничью восемь («Малага», «Леванте», «Эйбар», «Депортиво», «Бетис», «Атлетико Мадрид», «Сельта» и «Райо Вальекано»).\nТот вызов высшего масштаба, о котором говорит Эмери, состоит в том, чтобы впервые победить в гостях и сделать это на «Камп Ноу», где «Барселона» не проигрывает матч с 21 февраля 2015 года, когда команда под руководством Луиса Энрике проиграла 0:1 «Малаге» с голом Хуанми.\nСборная Испании по художественной гимнастике завоевала путёвку на Игры в Рио с блеском, с мировой бронзой — своим лучшим результатом со времён серебра 1998 года. С тех пор она не возвращалась на подиум в общем зачёте. «Это было наше лучшее выступление сезона», — заверила Алехандра Кереда, капитан. «У этой команды нет пределов», — добавила она. Испания выступила в первой группе. Не подвела всемогущая Россия, показавшая ясное намерение вновь царствовать.", "q": [], "src": "book"}], "15": [{"t": "Una visita al médico", "sp": "Ayer no me sentí bien. Por la mañana me dolía la cabeza y tenía fiebre. Llamé al centro de salud y pedí una cita. El médico me recibió a las once. Me preguntó qué me pasaba y me auscultó. Me dijo que era una gripe y que debía descansar. Me recetó unas pastillas y un jarabe. Tuve que tomar la medicina cada ocho horas y beber mucha agua. Hoy me siento mucho mejor.", "ru": "Вчера я почувствовал себя плохо. Утром у меня болела голова и была температура. Я позвонил в поликлинику и записался на приём. Врач принял меня в одиннадцать. Он спросил, что со мной, и прослушал меня. Он сказал, что это грипп и что мне нужно отдохнуть. Он выписал мне таблетки и сироп. Мне нужно было принимать лекарство каждые восемь часов и пить много воды. Сегодня я чувствую себя намного лучше.", "q": [["¿Cómo se sentía ayer el narrador?", "No se sentía bien."], ["¿Qué le dolía?", "Le dolía la cabeza."], ["¿Qué hizo por la mañana?", "Llamó al centro de salud y pidió una cita."], ["¿A qué hora le recibió el médico?", "Le recibió a las once."], ["¿Qué le dijo el médico?", "Le dijo que era una gripe y que debía descansar."], ["¿Qué le recetó?", "Le recetó unas pastillas y un jarabe."], ["¿Qué tuvo que hacer?", "Tomar la medicina cada ocho horas y beber mucha agua."], ["¿Cómo se siente hoy?", "Hoy se siente mucho mejor."]], "src": "own"}, {"t": "Текст из учебника · упр. 16", "sp": "стараясь повторить интонацию и произношение диктора.\n¿De qué se queja usted?\nMédico. – ¿De qué se queja usted?\nPaciente. – Ayer me caí y hoy me\nduele mucho la pierna y la cabeza,\ntambién tengo mareos.\nMédico. – ¿Ha tomado algunas\nmedicinas?\nPaciente. – Sí, un analgésico pero\nno hay efecto.\nMédico. – Vamos a ver. ¿Le duele\naquí?\nPaciente. – Sí, mucho.\nMédico. – La pierna está hinchada.\nHay que hacer la radiografía para\ndiagnosticar si hay o no una fractura, si hay necesidad de enyesar la pierna o no. ¿Tiene fi ebre?\nPaciente. – Creo que no.\nMédico. – Voy a tomar su tensión arterial... Está un poco alta.\nPaciente. – ¿Es grave?\nMédico. – No, no tiene por qué preocuparse. Aquí tiene el volante para hacer la radiografía. La enfermera la acompañará.\n_______________\nhinchado опухший\nfractura f перелом\nenyesar наложить гипс\nvolante m зд. направление\nа) Ответьте на вопросы:\n1. ¿De qué se quejó la paciente?\n2. ¿Qué preguntas le hizo el médico a la paciente?\n3. ¿Qué le recomendó el médico a la paciente?\n4. ¿Pudo el médico diagnosticar la enfermedad?", "ru": "На что вы жалуетесь? Врач. – На что вы жалуетесь? Пациентка. – Вчера я упала, и сегодня у меня сильно болит нога и голова, ещё у меня головокружение. Врач. – Вы принимали какие-нибудь лекарства? Пациентка. – Да, обезболивающее, но эффекта нет. Врач. – Давайте посмотрим. Здесь больно? Пациентка. – Да, сильно. Врач. – Нога опухла. Нужно сделать рентген, чтобы диагностировать, есть перелом или нет, нужно ли накладывать гипс. У вас есть температура? Пациентка. – Думаю, нет. Врач. – Я измерю ваше давление... Оно немного повышенное. Пациентка. – Это серьёзно? Врач. – Нет, вам не о чем беспокоиться. Вот направление на рентген. Медсестра вас проводит.\nа) 1. На боль в ноге и голове, головокружение. 2. Принимала ли она лекарства, где болит, есть ли температура. 3. Сделать рентген и измерить давление. 4. Да, он направил её на рентген.", "q": [], "src": "book"}, {"t": "Текст из учебника · упр. 19", "sp": "El montubio que se dejó sacar todos\nlos dientes para ganar una apuesta\nEl montubio llegó hasta la consulta acompañado de una veintena de individuos, todos muy borrachos. Eran buscadores de oro. Peregrinos, los llamaban las gentes, y no les importaba si el oro lo encontraban en los ríos o en las alforjas del prójimo. El montubio se dejó caer en el sillón y lo miró al dentista con expresión estúpida.\n– Tú dirás.\n– Sáquemelos toditos. De uno en uno, y póngamelos aquí, sobre la mesa.\n– Abre la boca.\nEl hombre obedeció, y el dentista comprobó que junto a las ruinas molares le quedaban muchos dientes, algunos picados y otros enteros.\n– Te queda un buen puñado. ¿Tienes dinero para tantas extracciones?\nEl hombre abandonó la expresión estúpida.\n– El caso es, doctor, los amigos aquí presentes no me creen cuando les digo que soy muy macho. El caso es que les he dicho que me dejo sacar todos los dientes uno por uno y sin quejarme.\nEl caso es que apostamos, y usted y yo nos iremos a medias con las ganancias.\n– Al sacarte el segundo vas a llamar a tu mamacita, – gritó uno del grupo y los demás lo apoyaron con sonoras carcajadas.\n– Vete a echar otros tragos y piénsalo bien. Yo no me presto para cojudeces – dijo el dentista.\n– Si usted no me permite ganar la apuesta, le corto la cabeza con esto que me acompaña.\nAl montubio le brillaron los ojos mientras acariciaba la empuñadura del machete.\nDe tal manera que corrió la apuesta.\nEl hombre abrió la boca y el dentista hizo un nuevo recuento.\nEran quince dientes, y, al decírselo, el paciente formó una hilera de quince pepitas de oro una por cada diente, y los apostaderos, a favor o en contra, cubrieron las apuestas con otras pepitas doradas.\nEl montubio se dejó sacar los primeros siete dientes sin mover un músculo. No se oía volar una mosca, y al extraer el octavo lo acometió una hemorragia que en segundos le llenó la boca de sangre. El hombre no conseguía hablar, pero le hizo una señal de pausa.\nEscupió varias veces y se echó un largo trago que le hizo revolverse de dolor en el sillón, pero no se quejó y tras de escupir de nuevo, con otra señal le hizo continuar.\nAl fi nal de la carnicería, desdentado y con la cara hinchada hasta las orejas, el montubio mostró una expresión de triunfo horripilante al dividir las ganancias con el dentista.\n(Por Luis Sepúlveda\n“Un viejo que leía novelas de amor”)\n_______________\nveintena f два десятка\nborracho пьяный\nalforja f котомка\nprójimo m ближний\nobedecer (5а) повиноваться\nmolar m коренной (зуб)\npicado m дупло\nentero целый\npuñado m горсть\nextracción f удаление\nganancia f прибыль\napoyar поддержать\ncarcajada f хохот\ntrago m глоток\nprestarse оказывать услуги\ncojudez f вздор\nacariciar гладить\nempuñadura f рукоятка\nrecuento m пересчет\nhilera f ряд / линия\npepita f крупинка\nacometer зд. одолевать\nescupir сплюнуть\ncarnicería f бойня\nhorripilante зловещий", "ru": "Монтубио, который дал вырвать себе все зубы, чтобы выиграть пари\nМонтубио пришёл в кабинет в сопровождении двух десятков человек, все сильно пьяные. Это были золотоискатели. Люди звали их паломниками, и им было неважно, находили ли они золото в реках или в котомках ближнего.\nМонтубио плюхнулся в кресло и посмотрел на дантиста с глупым выражением лица. – Говори. – Вырвите мне все до единого. По одному, и складывайте их сюда, на стол. – Открывай рот. Мужчина подчинился, и дантист убедился, что рядом с разрушенными коренными у него осталось много зубов, некоторые гнилые, другие целые. – У тебя их порядочная горсть. У тебя есть деньги на столько удалений? Мужчина отбросил глупое выражение.\n– Дело в том, доктор, что друзья, здесь присутствующие, не верят мне, когда я говорю, что я очень мужественный. Дело в том, что я сказал им, что дам вырвать себе все зубы один за другим и не закричу. Дело в том, что мы поспорили, и вы и я разделим выигрыш пополам. – Когда тебе вырвут второй, ты позовёшь мамочку, — закричал один из группы, и остальные поддержали его громким хохотом. – Пойди выпей ещё и хорошо подумай. Я не оказываю услуг для глупостей, — сказал дантист. – Если вы не позволите мне выиграть пари, я отрублю вам голову вот этим, что со мной. У монтубио заблестели глаза, пока он гладил рукоятку мачете.\nТак пари и состоялось. Мужчина открыл рот, и дантист сделал новый подсчёт. Было пятнадцать зубов, и, сказав ему об этом, пациент выложил ряд из пятнадцати золотых крупинок — по одной за каждый зуб, а держатели пари, за или против, покрыли ставки другими золотыми крупинками.\nМонтубио дал вырвать первые семь зубов, не шевельнув ни одной мышцей. Было слышно, как муха пролетит, а при удалении восьмого его одолело кровотечение, которое за секунды наполнило ему рот кровью. Мужчина не мог говорить, но сделал знак паузы. Он сплюнул несколько раз и сделал большой глоток, от которого заёрзал от боли в кресле, но не пожаловался, и, сплюнув снова, другим знаком велел продолжать.\nВ конце этой бойни, беззубый и с распухшим до ушей лицом, монтубио явил жуткое выражение триумфа, деля выигрыш с дантистом.\n(По Луису Сепульведе «Старик, который читал любовные романы»)", "q": [], "src": "book"}]};
