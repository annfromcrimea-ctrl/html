пками / идти по", "магазинам", "grandes almacenes", "универмаг", "escaparate m", "витрина", "mostrador m", "прилавок", "departamento m", "отдел", "probador m", "примерочная", "probarse (1b)", "мерить (на себя одежду / обувь)", "surtido m", "ассортимент / выбор", "estar de moda", "быть модным", "rebaja f", "сезонная распродажа", "oferta f", "выгодное предложение", "precio m", "цена", "¿Cuánto cuesta / vale?", "Сколько стоит?", "pagar en efectivo", "платить наличными", "caja f", "касса", "talla f", "размер (одежды)", "número n", "размер (обуви)", "manga f", "рукав", "cuello m", "воротник", "botón m", "пуговица", "tacón m", "каблук", "cordón m", "шнурок", "tejido m / tela f", "ткань", "algodón m", "хлопок", "lana f", "шерсть", "seda f", "шелк", "cuero m", "кожа", "me queda bien / mal", "мне подходит / не подходит", "me va bien / mal", "мне идет / не идет", "на мне сидит хорошо / плохо", "me sienta bien / mal", "мне жмет", "me aprieta", "я беру (покупаю) … эту юбку", "me llevo … esta falda", "Например:", "–¿Este traje gris oscuro a rayas", "– Этот темно–серый", "azules es de pura lana?", "костюм в синюю полоску", "чистошерстяной?", "– No, el ochenta por ciento es", "– Нет, 80% шерсти и 20%", "lana y el veinte por ciento es", "лавсана.", "lavsán.", "¿Qué talla lleva usted?", "Какой размер (одежды) Вы", "носите?", "Busco un pijama de manga", "Я ищу пижаму с коротким", "corta de color naranja o de lila", "рукавом оранжевого или", "y sin botones.", "сиреневого цвета, без пуговиц.", "¿Qué número calza Ud.?", "Какой у Вас размер обуви?", "¿Tienen zapatos rojos de cuero", "У вас есть красные кожаные", "de tacón bajo/alto sin cuerdos?", "туфли на низком/высоком", "каблуке без шнурков?", "Me queda bien esta falda a", "Мне подходит эта юбка в", "cuadros. Me la llevo.", "клетку. Я ее беру."]}, {"h": "Ejercicio 21. Переведите испанские реплики на рус-", "b": ["ский язык, а русские – на испанский:", "¿De qué talla es este vestido de", "color granate?", "Эта красная юбка в зеленую", "клетку – чистошерстяная.", "La cazadora de color naranja no", "es de cuero natural.", "Я ищу высокие сапоги без", "каблуков.", "Puede usted pagar en efectivo", "o con tarjeta.", "Какой размер обуви у твоего", "сына?"]}, {"h": "Ejercicio 23. Переведите на испанский язык:", "b": ["1. У нас сейчас как раз скидки.", "2. Я ищу шелковую блузку с длинным рукавом.", "3. Какого цвета вы предпочитаете рубашку? У нас большой выбор.", "4. Это платье мне не подходит, оно широкое и короткое.", "5. Какой размер вы носите?", "6. Хочу померить туфли на высоком каблуке, которые я видела на витрине.", "7. Вы будете платить наличными или карточкой?"]}, {"h": "Ejercicio 26. Составьте сообщения по темам:", "b": ["1. ¿Le gusta a usted ir de compras? ¿Le gusta a usted ir de compras solo/a o acompañado/a? ¿Qué tipo de comprador/a se considera usted a sí mismo/a?", "2. ¿Dónde suele usted comprar la ropa? ¿Compra usted la ropa de segunda mano? ¿Con qué frecuencia suele usted ir de compras?", "¿Aprovecha usted rebajas? ¿Sigue usted la moda?", "3. ¿Cuándo fue usted de compras la última vez y qué compró?"]}, {"h": "Ejercicio 27. Переведите на испанский язык:", "b": ["1. София следила за модой, она любила рассматривать модные журналы, для нее было истинным наслаждением каждую неделю прогуливаться по своим любимым магазинам, и она тратила много денег на одежду. 2. Когда мы были молодыми, мы носили широкие брюки, а девушки – короткие юбки и сапоги на высоком каблуке. 3. Я признаю, что этот светло-серый костюм в полоску на мне сидит хорошо, но он мне не подходит: слишком узкий пиджак и большие пуговицы, и мне кажется, что он не чистошерстяной. 4. Вчера мои подруги решили воспользоваться", "сезонной распродажей и пошли за покупками в универмаг. В отделе женской одежды было много покупателей. Девушкам пришлось стоять в очереди в примерочную. Они перемерили много платьев, джинсов, курток, но им ничего не подошло. Все вещи оказались низкого качества. 5. Раулю надо было купить себе несколько новых сорочек. Два дня назад он отправился в большой торговый центр. Он предпочел пойти один, потому что ходить за покупками с женой – это настоящая мука, и в последнее время они не ладят друг с другом. Продавец предложил Раулю померить несколько моделей сорочек его размера. Рауль выбрал одну розовую в белую полоску, а другую - сиреневую в горошек со скидкой 10%. Покупка ему показалась недорогой, он потратил", "115 евро. 6. Недавно я увидела в витрине красное кожаное пальто, и оно мне так понравилось, что я его в тот же день купила.", "Теперь мне нужны новые туфли, потому что старые не подходят.", "Дорогой, сходишь со мной в обувной в эти выходные, чтобы помочь мне выбрать какую-нибудь модель? – В эти выходные я занят, мне нужно закончить проект, к тому же ты все равно не прислушиваешься ни к чьим советам."]}], "12": [{"h": "Ejercicio 1. Ответьте на вопросы:", "b": ["1. ¿Qué día de la semana es hoy, será mañana, fue ayer?", "2. ¿A cuántos estamos?", "3. ¿En qué estación del año estamos?", "4. ¿Qué tiempo hace en verano (otoño, invierno, primavera)?", "5. ¿Cuándo es su cumpleaños? ¿Cuántos años cumple usted?", "6. ¿Cuándo es el cumpleaños de su amigo?", "7. ¿Qué fecha es hoy, será pasado mañana, fue anteayer?", "8. ¿Qué estación del año le gusta más? ¿Por qué?", "9. ¿Qué mes prefi ere usted para ir de vacaciones?", "10. ¿Cuándo tendrá usted vacaciones este año?", "11. ¿Qué harán ustedes el próximo fi n de semana, qué hicieron el fi n de semana pasado?", "12. ¿Estudia usted los martes y los jueves?"]}, {"h": "Ejercicio 2. Прослушайте прогноз погоды и отметьте", "b": ["единственный правильный вариант:", "1. Estamos en…", "a) invierno b) primavera c) verano d) otoño.", "2. Hoy es…", "a) lunes; b) miércoles; c) jueves; d) viernes.", "3. Esta semana en la zona…", "a) ha hecho el anticiclón; b) ha llovido poco y ha hecho frío; c) ha llovido mucho y ha hecho frío; d) ha llovido mucho y ha hecho calor.", "4. El próximo viernes por la mañana …", "a) hará sol; b) habrá algunas lluvias débiles; c) hará frío sin viento;", "d) habrá algunas lluvias débiles y hará viento.", "5. Este fi n de semana …", "a) será soleado con máximas de 19-20 grados; b) será soleado", "con mínimas de 20 grados; c) lloverá pero hará calor; d) hará calor de 20 grados pero con fuertes lluvias."]}, {"h": "Ejercicio 3. Измените предложения по образцу:", "b": ["Hoy me he levantado tarde. → Ayer me levanté tarde. → Todas las mañanas me levantaba tarde.", "1. Esta tarde has vuelto a casa temprano. → Anteayer … →", "Todas las tardes …", "2. Este lunes hemos alquilado un coche. → El lunes", "pasado … → A veces ...", "3. Esta noche se ha perdido su gato. → Anoche … → Con frecuencia …", "4. Ya he traducido las cartas al inglés. → Hace poco … → A menudo …", "5. Nunca ha pedido usted nada a nadie. → Anoche no … →", "Habitualmente …", "6. Esta mañana te he visto en la playa. → Aquella mañana … →", "Cada mañana …", "7. El niño se ha dormido ya. → Hace una hora … → De vez en cuando …", "8. Habéis dicho una información secreta. → El 15 de mayo … →", "Regularmente …", "9. Este fi n de semana los abuelos han ido al campo. → El fi n de semana pasado … → Antes los fi nes de semana …", "10. Hoy he dado un paseo antes de acostarme. → Anoche … →", "De costumbre …"]}, {"h": "Ejercicio 4. Поставьте глаголы в соответствующую", "b": ["форму indefi nido или imperfecto:", "1. De 8 a 15 de junio nosotros (estar) en Valencia.", "2. Todas las tardes los empleados (almorzar) en la misma cafetería.", "3. En 2008 vosotros (ir) de vacaciones a Málaga.", "4. Ayer supimos que Miguel (ser) de Cuba.", "5. Ellos no (poder) venir anoche porque (trabajar).", "6. Hace unos días (ver, yo) esta película y no (gustarme).", "7. Cuando yo (entrar) en el cuarto, mi esposa (dormir) en el sofá y los niños (comer) fresas.", "8. El 3 de mayo Inés (salir) de casa, (tomar) un taxi y (irse) para siempre.", "9. Cuando (ser, yo) pequeño a menudo (jugar) al fútbol con mi padre.", "10. Mientras Juan (reservar) billetes por Internet, Marta (hacer)", "la maleta."]}, {"h": "Ejercicio 5. Переведите на испанский язык:", "b": ["1. Вчера была суббота, я не захотел идти с женой в торговый центр, потому что знал, что по выходным там много народа.", "2. Было 5 часов утра, когда зазвонил телефон и разбудил нас.", "3. Недавно Лола мне сказала, что ее двоюродный брат хочет жениться на Кармен.", "4. Когда Даниэль учился в Германии, родители звонили ему каждую неделю по вторникам и пятницам.", "5. Я не пришел вчера на нашу встречу, потому что жена была занята, и мне самому пришлось заехать в школу и привезти дочку домой.", "6. Пока ты мерила костюмы и платья, я прочел все газеты.", "7. Вчера вечером мы спросили у консьержки, где находится торговый центр «Меридиан» и в котором часу он начинает работать.", "8. 14 мая я вспомнил, что у Рикардо день рождения, написал ему письмо по электронной почте и пожелал ему здоровья, любви, удачи и много денег. Он поблагодарил меня за письмо.", "9. Позавчера мой младший брат принес домой кота с улицы, мы ему дали немного сыра, но он его не съел. А вчера вечером кот умер. Мой брат плакал всю ночь.", "10. Когда мы с Энрике сидели в баре, пили вино и смотрели футбол, вошел Андрес и поздоровался с нами по-русски."]}, {"h": "Ejercicio 6. Измените предложения по образцу и", "b": ["переведите на русский язык:", "Cuando escucho esta música, me pongo triste. → Al escuchar esta música, me pongo triste.", "1. Cuando la maestra entra, los alumnos se levantan y la saludan.", "2. Cuando Isabel ha preparado la cena, nos ha llamado.", "3. Cuando el tío vio las fotos, recordó el verano del año 1998.", "4. Cuando me despido de Ana, la abrazo.", "5. Cuando José salió del bar, nadie le hizo caso.", "6. Cuando me senté a la mesa, mi esposa me trajo el al muerzo."]}, {"h": "Ejercicio 7. Переведите на испанский язык:", "b": ["1. Когда я входил в дом, я всегда здоровался с консьержкой.", "2. Услышав такую грустную историю, все захотели помочь нам.", "3. Когда родители уезжали в отпуск, за их котом присматривала соседка.", "4. Когда я с тобой познакомился, ты мне очень понравилась.", "5. Позавтракав, мы вышли из дома, сели в машину, и Хорхе отвез нас в аэропорт.", "6. Когда он увидел мою сестру в первый раз, сразу в нее влюбился.", "7. Когда туристы прощались с гидом, они поблагодарили его за интересную экскурсию.", "8. Почему ты не целуешь меня, когда приходишь с работы?", "9. Когда они поженились, родители подарили им машину.", "10. Когда вы (vosotros) построили новый дом, вы продали свою квартиру.", "\u0002 Следует различать глаголы dejar и quedar(se):", "dejar", "quedar(se)", "dejar algo оставлять / покиquedar оставаться (что-либо дать что-либо у кого-либо)", "dejar a alguien оставлять", "quedar + сущ., прил., прич.,", "кого-либо", "оставаться / оказаться (каdejar de + inf. переставать/ ким, в каком-то состоянии)", "прекращать делать что-то", "quedar en договориться", "dejar + inf. позволить / не преquedar(se) оставаться пятствовать делать что-то где-то dejar caer уронить quedar(se) con взять / заdejar en paz оставить в покое брать с собой", "Например:", "He dejado mis guantes en el", "Я оставила свои перчатки в", "taxi.", "такси.", "En 1973 el poeta dejó la Patria.", "В 1973 году поэт покинул", "Родину.", "No puedo dejar a los hijos solos", "Не могу оставить детей одних", "en casa.", "дома.", "¿Por qué no me dejas contar", "Почему ты не даешь мне", "este chiste?", "рассказать этот", "анекдот?", "Usted debe dejar de fumar.", "Вы должны бросить", "курить.", "Hoy he dejado caer mi fl orero", "Сегодня я уронила свою", "favorito y él se ha roto.", "любимую вазу, и она разбилась.", "¿Puedes dejarle en paz un", "Ты можешь оставить его на", "momento? ¿No ves que le", "минутку в покое? Ты", "molestas?", "не видишь, что ты ему", "мешаешь?", "Quedan 20 minutos para la", "Остается 20 минут до", "llegada de los huéspedes y la", "прихода гостей, а стол еще не", "mesa todavía no está puesta.", "накрыт.", "A los 38 años Sara quedó viuda.", "В 38 лет Сара овдовела.", "Al oír su historia quedamos", "Услышав их историю, мы очень", "sorprendidos.", "удивились.", "Ellos quedaron en verse en la", "Они договорились", "reunión de mañana.", "встретиться на завтрашнем", "собрании.", "Cuando me siento mal me", "Когда я плохо себя чувствую,", "quedo en casa.", "остаюсь дома.", "Este traje me sienta muy bien", "Этот костюм хорошо", "por eso me quedo con él.", "на мне сидит, поэтому", "я его беру."]}, {"h": "Ejercicio 8. Переведите на русский язык:", "b": ["1. Ayer nos quedamos en casa porque llovía.", "2. No debes dejar al abuelo solo en casa porque está en fermo.", "3. No me llevaba el pasaporte y no me dejaron entrar en el club deportivo.", "4. Nos quedan tres días para el examen.", "5. Quedaron en ir a la exposición el fi n de semana.", "6. El viernes pasado dejé caer mi móvil y éste se rompió.", "7. ¿Queda usted con esta bufanda? – Sí, porque me gusta el color y va bien con mi abrigo.", "8. Hace dos horas traduje los documentos y los dejé sobre la mesa del jefe.", "9. Me parece que mi novia ha quedado contenta con mi regalo.", "10. Debes dejar de reír de él, ¿no ves que está enamorado locamente de ti?"]}, {"h": "Ejercicio 9. Выберите подходящий по смыслу глагол", "b": ["dejar или quedar(se) и поставьте его в соответствующую форму:", "1. Ayer no quise … a los niños solos en casa y preferí … con ellos.", "2. Carmencita no me … hacer nada, siempre me pregunta algo, no me … en paz.", "3. Hace 5 años Pedro … su familia y se fue a trabajar a Colombia.", "4. Después de hablar contigo Antonio … triste y no … de pensar en tus palabras.", "5. ¿A qué hora … en veros mañana?", "6. Para la salida del tren … diez minutos.", "7. La madre no les … salir a los niños porque hace mucho frío y está nevando."]}, {"h": "Ejercicio 10. Переведите на испанский язык:", "b": ["1. Вы так громко разговариваете, вы всем мешаете и не даете мне заснуть.", "2. Услышав шум, мы удивились, потому что знали, что в доме никого не было.", "3. Я беру эти перчатки, потому что они подходит к моим сапогам.", "4. Мы не будем договариваться с ними о встрече, потому что они отказываются обсуждать с нами этот вопрос.", "5. Ты должен перестать просить новый мобильный телефон.", "Неужели ты не знаешь, что у нас осталось мало денег?", "6. Нельзя ей разрешать готовить: она роняет посуду.", "7. Мы переводили весь день и очень устали. Я понимаю, что у нас осталось еще три статьи и только два дня, но предлагаю оставить работу."]}, {"h": "Ejercicio 11. Поставьте глаголы в соответствующую", "b": ["форму pluscuamperfecto de indicativo и переведите на русский язык:", "1. Ayer, cuando volví a casa, Teresa ya (poner) la mesa.", "2. El domingo no compraste pan para el desayuno porque la panadería todavía no (abrirse).", "3. Estábamos seguros de que tu tío (ver) todo el mundo.", "4. Para los 20 años Mario (escribir) muchas poesías y (componer)", "una ópera.", "5. Alquilamos el piso que (ver, nosotros) en las fotos en la agencia inmobiliaria.", "6. El jefe estaba descontento porque (hacer, yo) mal la traducción del documento.", "7. Anoche me puse el traje que (comprar, yo) en Roma.", "8. Algunos pasajeros perdieron el tren porque no (poder, ellos)", "llegar a tiempo por el atasco en la carretera.", "9. Los padres no pudieron leer la carta de Juan porque Marta", "(romperla).", "10. Hace poco supimos que tú todavía no (devolverle) su maleta a Antonio."]}, {"h": "Ejercicio 12. Переведите на испанский язык:", "b": ["1. Три дня назад он купил новый компьютер, о котором мечтал.", "2. На конгресс приехало больше журналистов, чем мы пригласили.", "3. Позавчера София встретила свою подругу, с которой она отдыхала зимой.", "4. Недавно все узнали, что сын президента компании женился на знаменитой теннисистке.", "5. К 5 годам мой внук научился плавать, а в 17 лет стал чемпионом страны.", "6. Хосе пригласил поужинать девушку, с которой познакомился в Интернете.", "7. Мы не поехали за город и остались дома, потому что наш сын заболел.", "8. В прошлую пятницу она принесла фотографии, которые сделала, путешествуя по Аргентине, и нам их показала.", "9. Две недели назад нам сказали, что сосед с третьего этажа умер.", "10. Вчера вечером они посмотрели фильм, который ты им привез из Бразилии.", "Тема: Приятного аппетита!", "\u0002 Прочитайте и запомните слова и полезные выражения, связанные с темой «завтрак»:", "tostada f", "тост", "galleta f", "печенье", "magdalena f", "кекс", "mermelada f", "джем", "miel f", "мед", "bollería f", "выпечка", "huevos fritos", "яичница (досл: жареные яйца)", "huevo duro", "яйцо, сваренное вкрутую", "huevo pasado por agua", "яйцо, сваренное всмятку", "huevos revueltos", "омлет", "bocadillo m", "бутерброд", "bocadillo de queso m", "бутерброд с сыром", "bocadillo de salchichón m", "бутерброд с колбасой", "bocadillo de jamón m", "бутерброд с ветчиной", "zumo de toronja", "грейпфрутовый сок", "té m / infusión f", "чай", "cacao m", "какао", "yogur m", "йогурт", "Как известно, второй по популярности напиток на Земле после воды – это чай. Только не в Испании! Здесь пьют кофе, всегда и везде, по несколько раз в день и, чаще всего, именно в кафе, а не дома:", "café solo – маленькая порция (чашечка) крепкого черного кофе;", "café con leche – большая порция (чашка) кофе пополам с молоком;", "café cortado – маленькая порция кофе с добавлением небольшого количества молока;", "café carajillo – чашечка крепкого кофе с добавлением алкоголя: коньяка, рома или ликера;", "café descafeinado – кофе без кофеина", "café con hielo – кофе cо льдом. Подается чашечка горячего крепкого кофе и стакан со льдом. Кофе выливается в стакан и пьется холодным.", "Чаще всего подается в летнее время.", "В Испании не очень принято пить чай. По-испански чай будет звучать как infusión (дословно: настой) или té."]}, {"h": "Ejercicio 14. Расскажите, что Вы обычно едите на зав-", "b": ["трак (что Вы ели сегодня утром, что Вы ели вчера).", "\u0002 Прочитайте и запомните слова и полезные выражения, связанные с темой «еда» и необходимые для посещения ресторана:", "beber", "пить", "bebida f", "питьё", "merendar (1а)", "полдничать", "merienda f", "полдник", "ración f", "порция", "guarnición f", "гарнир", "botella f", "бутылка", "jarro m", "кувшин", "¡Buen provecho!", "Приятного аппетита!", "menú del día", "комплексный обед /", "бизнес-ланч", "comer a la carta", "пообедать тем, что есть в меню (не", "комплексный обед)", "hacer el pedido", "сделать заказ", "de entremés", "на закуску", "de primer plato", "на первое", "de segundo plato", "на второе", "de postre", "на десерт", "ensalada f", "салат", "sopa f", "суп", "chuleta de ternera", "отбивная из говядины", "pollo asado", "жареный цыпленок", "pastel m", "пирог / пирожное", "helado m", "мороженое", "Национальные напитки Испании", "Horchata, f – напиток из миндальных орехов и земляных орехов, сладковатый на вкус, белого цвета (можно подумать, что в стакане молоко).", "Granizado, m – замороженный сок или фруктовое пюре, измельченное до мелкой крошки.", "Sangría, f – слабоалкогольный напиток, приготовленный на основе красного вина с добавлением персиков, яблок, апельсинов нарезанных кусочками.", "Jerez, m – крепленое виноградное вино, производят в Андалусии (поанглийски – sherry).", "Cava, f – испанское «шампанское».", "Sidra, f – испанский сидр изготавливается из натурального яблочного сока, его не газируют, а игристым оно становится при умелом разливе.", "Национальные блюда Испании", "Tapas – это разновидность разнообразных холодных и горячих закусок, которые подаются маленькими порциями во всех барах Испании. Обычно тапас закусывают пиво, вино и др. аперитив, не садясь за стол, у стойки бара, накалывая (picar – клевать) порции короткими деревянными палочками. Тапас – часто подается бесплатно к алкогольным напиткам. Но для испанцев это не просто еда, это стиль жизни. В испанском языке даже есть глагол tapear – он переводится как «ходить по барам, общаться с друзьями и знакомыми, пить вино и есть тапас». Нормальным считается посещение около десятка различных тапас-баров в течение одного вечера после окончания работы.", "Тапас располагает к беседе, шуткам и хорошему настроению.", "Tortilla, f – самое распространенное блюдо испанской национальУРОК 12 (Lección 12)", "ной кухни (как у итальянцев пицца): пережаренный мелко нарезанный картофель с луком заливают взбитыми яйцами и обжаривают с двух сторон; подают в горячем и в холодном виде.", "Paella, f – ароматное горячее блюдо из специального риса с шафраном и оливковым маслом, разновидность плова с курицей, морепродуктами и овощами.", "Jamón, m – сыровяленый свиной окорок – национальный деликатес.", "Солят хамон от 6 до 36 месяцев, подают нарезанным очень тонкими ломтиками. Хамон напоминает итальянскую пармскую ветчину.", "Существует 2 вида хамона: jamón serrano (хамон серрано) – светлый и jamón ibérico (хамон иберико) – темный.", "Gazpacho, m – острый холодный суп из помидоров и других овощей.", "Часто в суп добавляют чеснок, оливковое масло, зелень и пряности.", "Некоторые повара добавляют в гаспачо лед.", "Fabada, f – астурийское блюдо из фасоли или бобов с кровяной колбасой.", "Flan, m – десерт из взбитых яиц, молока и сахара, напоминает пудинг.", "Arroz con leche – холодная рисовая каша с корицей, подается на десерт.", "Turrón, m – традиционное испанское лакомство, приготовленное из нуги и орехов. Раньше данное кушанье готовили лишь на Рождество, но поскольку эту сладость сейчас больше производят не столько для испанцев, сколько для туристов, то его можно приобрести в любое время года."]}, {"h": "Ejercicio 16. Переведите на испанский язык:", "b": ["1. Уже половина третьего. Пора обедать.", "2. Вчера вечером мы захотели поужинать более основательно и пошли в ресторан. Там нам подали очень вкусное жареное мясо.", "3. Как тебе новый гриль-бар? – Мы с женой были там вчера, я заплатил много денег, но нам не понравилось.", "4. Есть свободные столики или надо немного подождать?", "5. Вчера на первое они выбрали суп, на второе заказали отбивную из баранины, а на десерт предпочли мороженое.", "6. Комплексный обед включает два блюда, десерт и напитки.", "За кофе отдельная плата.", "7. Официант нам посоветовал заказать кувшин красного домашнего вина, оно оказалась превосходным.", "8. Я купил хлеб, ветчину, сыр и фрукты, предлагаю поужинать сегодня дома. – Ничего не имею против."]}, {"h": "Ejercicio 20. Расскажите по-испански рецепт при-", "b": ["готовления Вашего «фирменного» блюда."]}, {"h": "Ejercicio 22. Составьте сообщения по темам:", "b": ["1. Вы ожидаете гостей. Расскажите о своих приготовлениях к их приходу. Чем вы будете угощать гостей? Как вы будете готовить эти блюда?", "2. Опишите банкет, на котором Вам довелось побывать."]}, {"h": "Ejercicio 23. Переведите на испанский язык:", "b": ["1. Три дня назад врач мне сказал, что я должен бросить курить и есть меньше выпечки. 2. Они заказали овощной салат и спаржу, она предпочла выпить бокал белого сухого вина, а он – пива. 3.", "Была половина второго, дети уже хотели есть, потому что было время обеда, но тефтели еще не были готовы. 4. Вчера вечером мы ходили в ресторан, который ты нам советовал. Было холодно, и дул ветер. Мне не захотелось садиться ужинать на улице, но в зале не было свободных столиков. 5. К пяти часам вы уже накрыли на стол: поставили тарелки, фужеры, разложили приборы, салфетки. Вам оставалось только принести закуски. В четверть шестого в дверь позвонил первый гость. 6. Мне много раз говорили, что твой пирог со шпинатом – это настоящий шедевр, но я его никогда не пробовала. 7. Почему ты такой грустный? – Меня мучают угрызения совести, потому из-за моей глупой шутки они теперь не ладят друг с другом. 8. На кухне пахло жареным луком, потому что бабушка готовила фаршированный перец. 9. Недавно кот уронил мою любимую вазу, и она разбилась. Мы решили, что нельзя оставлять кота одного дома. 10. В четверг, 21 декабря был день рождения у нашей тети, а в пятницу она устроила банкет, на который пришли все наши родственники и принесли ей подарки.", "Мы хорошо повеселись, и каждый остался доволен."]}], "13": [{"h": "Ejercicio 1. Переведите на русский язык:", "b": ["1. Si nieva así toda la noche, mañana tendrás que dejar tu coche e ir a la oficina en metro.", "2. Si ya os habéis duchado os serviré café y galletas y desayunaremos.", "3. Si el autobús llegaba con cinco minutos de retraso la tía se ponía nerviosa.", "4. Si ellos volvieron de las vacaciones hace tres días, ¿por qué todavía no nos han llamado?", "5. Si Raúl y Pablo venían a nuestra casa juntos, nos divertíamos mucho."]}, {"h": "Ejercicio 2. Измените предложения по образцу:", "b": ["Mañana hará calor e iremos a la playa. → Si mañana hace calor, iremos a la playa.", "1. Leerás esta novela y te gustará.", "2. Usted tomará la medicina y se sentirá mejor.", "3. Llegaremos demasiado tarde y no habrá lugar para aparcar el coche a la entrada del teatro.", "4. Dentro de media hora estaremos libres y te ayudaremos.", "5. Por la tarde lloverá y no podréis dar un paseo."]}, {"h": "Ejercicio 3. Переведите на испанский язык:", "b": ["1. Если дядя Рамон подарит своей племяннице котенка, девочка будет счастлива.", "2. Если у него было свободное время, он всегда приходил к нам в гости.", "3. Если дочка будет чувствовать себя лучше, мы в эти выходные отведем её в зоопарк.", "4. Если Вы попробуете это блюдо, оно Вам понравится, и Вы его закажете.", "5. Если шел дождь и дети не могли выйти на улицу гулять, они играли дома и не давали мне заниматься.", "6. Если они сегодня пообедали в ресторане, я не буду готовить плотный ужин.", "7. Если ты их не разбудила, они все еще спят.", "8. Если они предпочли вчера остаться дома и не были на собрании, они ничего не знают об этом деле.", "9. Если вы захотите есть, в холодильнике в кастрюле ужин, вам надо будет только разогреть его.", "10. Если они договорились поехать в отпуск вместе, родители не будут против."]}, {"h": "Ejercicio 4. Проспрягайте следующие словосочета-", "b": ["ния в potencial simple:", "pagar la cuenta", "discutir los planes para el verano", "ponerse moreno", "hacerse rico", "disfrutar del buen tiempo", "agradecerle al jefe su regalo", "yo", "Dolores y yo", "tú", "vosotras", "Isabel", "Sara y Andrés", "usted", "ustedes"]}, {"h": "Ejercicio 5. Поставьте глаголы в соответствующую", "b": ["форму potencial simple и переведите на русский язык:", "1. Ahora (gustarme) ir a Japón para probar platos exóticos.", "2. Alicia nos dijo que ustedes (venir) el lunes y (traernos) las fotos.", "3. Yo te (explicar) como se hace paella, pero yo misma no lo sé.", "4. Tú prometiste que después de la reunión (pasar) por mi casa y nosotros (discutir) el menú para la fi esta.", "5. Cuando mi abuela se casó por primera vez (tener, ella) 16 años.", "6. Le (decir) a usted el número de mi pasaporte pero no lo recuerdo.", "7. Juan pensaba que tú (negarse) a venir con nosotros de excursión.", "8. En los años noventa Pedro (ganar) muchísimo, porque ellos compraron un chalé en la costa y un coche de lujo.", "9. (Acompañaros, nosotros) con mucho gusto al aeropuerto, pero no tenemos coche, vamos a llamar un taxi.", "10. Durante la guerra (vivir, ellos) en Panamá.", "11. Víctor soñaba con ir a Sierra Nevada el próximo enero donde él (esquiar) y (poder) probar el jerez.", "12. (Hacer, ellos) un viaje a América Latina pero no disponen de tanto dinero.", "13. Cuando entré en la habitación ellos (hablar) de mí, porque callaron en seguida.", "14. Ahora (ver, yo) mi programa favorito por la tele, pero tengo que irme.", "15. Antonio no quiso cenar, no (tener, él) apetito o (estar, él)", "muy cansado."]}, {"h": "Ejercicio 6. Переведите на испанский язык:", "b": ["1. Ты сказал, что не сможешь встретить меня в аэропорту, так как будешь занят.", "2. Они пообещали, что принесут нам фотографии после своего путешествия по Европе.", "3. Я бы поехала с тобой, но не могу, у меня сейчас очень много работы. Я сожалею.", "4. Когда я был маленьким, мой дядя, должно быть, работал на кондитерской фабрике, потому что он всегда приносил мне конфеты или пирожные.", "5. Этот ресторан новый? – Я бы этого не сказал, его построили давно, но он очень хороший.", "6. Мы знали, что всю следующую неделю будет холодно, и будет идти дождь.", "7. Я бы попробовала этот салат, но он с кальмарами, а я их не люблю.", "8. Вы, наверное, тоже носили короткие юбки и широкие брюки, когда учились в университете?", "9. Хуан сказал, что у не будет завтракать, потому что опоздает на работу.", "10. Мы не знаем, что выбрать на десерт. Что бы Вы нам посоветовали?", "11. Тетя Эстер жила в Бельгии и приезжала к нам в гости на поезде, вероятно, она боялась летать на самолете.", "12. Официант наc предупредил, что паэлья будет готова через 30 минут."]}, {"h": "Ejercicio 7. Трансформируйте прямую речь в косвен-", "b": ["ную по образцу:", "a) “Hoy no me llevo tanto dinero para comprarte este vestido.”", "→ José me dice (ha dicho, dirá) que hoy él no se lleva tanto dinero para comprarme este vestido. → José dijo (decía) que aquel día no se llevaba tanto dinero para comprarme aquel vestido.", "1. “Mañana saldré de casa a las 7.”", "2. “Este verano mi hermano y yo hemos estado de vacaciones en Málaga.”", "3. “Antes ganabas más dinero que ahora”.", "4. “Si me ayudas, haremos esta tarea para el jueves.”", "5. “El año pasado mis amigos visitaron el museo de El Prado.”", "6. “Esta es la mujer más bella que he visto en mi vida.”", "7. “Si nos invitas a tu cumpleaños, vendremos con mucho gusto.”", "8. “Ayer compré el billete a través de Internet.”", "9. “Ahora no quiero comer carne, prefi ero el pescado.”", "10. “Si pierdo el autobús tendré que ir en taxi.”", "b) “¿Dónde está tu coche?” → Alicia me pregunta (ha preguntado, preguntará) dónde está mi coche. → Alicia me preguntó (preguntaba)", "dónde estaba mi coche.", "1. “¿Cuánto te costó el apartamento de la playa?”", "2. “¿Has comprado arroz para la paella?”", "3. “¿Habéis reservado la habitación en el hotel?”", "4. “¿Quién os recomendó este restaurante?”", "5. “¿Salen todos los vuelos con retraso?”", "6. “¿Enviaste la invitación a nuestros socios?”", "7. “¿Adónde queréis ir de tapas?”", "8. “¿Quién ha preparado este gazpacho?”", "9. “¿Está incluido el desayuno? ¿Me lo servirán a las siete?”", "10. “¿A qué hora llegarás a la estación si sales a las cinco?”"]}, {"h": "Ejercicio 8. Переведите на испанский язык:", "b": ["1. Мария сказала, что уже купила новое платье, а завтра собирается купить туфли и сумку.", "2. Мы объяснили официанту, что заказывали не суп, а салат.", "3. Мой друг, когда возвращался из поездок, всегда рассказывал, какие города он посетил, и какие отели ему понравились.", "4. Мы подумали, что если у нас останется время, мы обсудим этот вопрос завтра на собрании.", "5. Хосе спросил, где я была в отпуске прошлым летом, и куда я хочу поехать в следующем году.", "6. Нам объяснили, что запрещено заходить в ресторан с собаками.", "7. Мой муж сообщил, что он уже купил билеты в агентстве, но что в следующем году он закажет билеты через Интернет.", "8. Официант говорит клиенту, что обслужит его через минуту.", "9. Врач объяснил, что если Андрей хочет чувствовать себя лучше, ему надо бросить курить и начать заниматься спортом.", "10. Я хотел бы знать, почему Алисия ко мне так плохо относится и не хочет оставить меня в покое.", "\u0002 Прочитайте и запомните глаголы движения:", "ir идти, ехать, плыть,", "pasar проходить", "лететь", "pasar por заходить,", "irse уходить, уезжать", "заезжать куда-либо", "venir приходить,", "recorrer обходить,", "приезжать", "объезжать", "llegar приезжать,", "avanzar продвигаться", "прибывать", "вперед", "salir выходить", "cruzar пересекать,", "entrar входить", "переходить", "dirigirse направляться", "volver возвращаться", "andar ходить пешком", "dar una vuelta прогуляться"]}, {"h": "Ejercicio 9. Переведите на русский язык:", "b": ["1. ¿Vienes a vernos el domingo?", "2. Hemos recorrido toda la ciudad pero no hemos encontrado ninguna tienda de regalos y recuerdos.", "3. Si pasáis por nuestra casa mañana conoceréis a la novia de", "Juan.", "4. El coche avanzó unos metros y se paró.", "5. Si tú te vas, tampoco me quedaré aquí.", "6. Ayer mis amigos perdieron el último autobús, anduvieron dos horas y llegaron al hotel a las dos de la madrugada.", "7. Me gusta dar una vuelta por el parque antes de acostarme.", "8. No sabíamos a qué hora volverías y nos sentamos a la mesa a cenar sin ti.", "9. Hay que tener mucho cuidado cruzando la calle.", "10. Al entrar en la oficina el jefe en seguida se dirigió hacia mi mesa.", "Тема: Отпуск. Виды туризма", "\u0002 Прочитайте и запомните слова и полезные выражения, связанные с темой «отпуск»:", "conceder (las vacaciones)", "предоставить (отпуск)", "balneario m", "курорт", "veranear", "проводить лето", "veraneante", "курортник /", "отдыхающий", "aventura f", "приключение", "viajar", "путешествовать", "viajero -а", "путешественник /", "пассажир", "campamento m", "лагерь", "tienda de campaña", "палатка", "mochila f", "рюкзак", "intérprete m", "переводчик", "recuerdo m", "сувенир", "extranjero m", "(разг.) заграница", "extranjero", "иностранный", "exótico", "экзотический", "viaje de negocios", "деловая поездка / командировка", "viaje de placer", "развлекательная поездка", "viaje de novios", "свадебное путешествие", "isla f", "остров", "deshabitado", "необитаемый", "montaña f", "гора", "paisaje m", "пейзаж", "lago m", "озеро", "crucero m", "круиз / круизное судно", "itinerario m", "маршрут", "senderismo m", "поход / пеший туризм", "esquí m", "лыжный спорт", "estación de esquí", "горнолыжный курорт", "esquiador m", "лыжник", "remonte m", "подъемник", "pista f", "(зд.) трасса"]}, {"h": "Ejercicio 16. Переведите испанские реплики на рус-", "b": ["ский язык, а русские – на испанский.", "El precio del alquiler incluye", "kilometraje ilimitado, seguro a", "terceros, asistencia en carretera.", "Я хочу взять в аренду", "внедорожник с большим", "багажником.", "Si tiene algún problema en el", "camino, un pinchazo o una avería,", "puede llamar a la oficina y nuestros", "especialistas no tardarán en llegar.", "Чтобы взять в аренду", "автомобиль, Вам должно", "быть не менее 21 года и", "стаж вождения не менее", "двух лет."]}, {"h": "Ejercicio 20. Расскажите об отпуске (каникулах), ко-", "b": ["торый Вам особенно запомнился."]}, {"h": "Ejercicio 21. Составьте сообщения по темам:", "b": ["1. ¿Qué tipo de turismo prefi ere usted? ¿Le gustan los viajes organizados? ¿Cómo planea usted sus vacaciones? ¿Quién y cómo las organiza?", "2. El hotel donde se alojó usted la última vez.", "3. Mis vacaciones ideales."]}, {"h": "Ejercicio 22. Переведите на испанский язык:", "b": ["1. Андрей и Клавдия решили, что если у них останутся деньги после свадьбы, то они смогут поехать в свадебное путешествие в Индию. 2. Мы узнали, что в туристический пакет входит две экскурсии: в первый день – обзорная экскурсия по городу, а в третий – поездка на горнолыжную базу, о которой мы столько читали на сайте тур. агентства в интернете. 3. Мне бы хотелось совершить круиз по Карибскому морю, о котором я столько мечтал, когда я учился в школе. 4. Полицейский объяснил, что надо будет проехать вперед 500 метров, и там мы увидим парковку.", "5. Почему вчера Мигель не поблагодарил администратора отеля за размещение в номере с видом на море. – Наверное, он думал,", "что это уже сделала его жена. 6. Мы думали, что в этом отеле, вероятно, есть свободные номера, поэтому мы не забронировали двухместный номер заранее, но, когда мы приехали, нам сообщили, что остались только одноместные номера, но они могут принести туда дополнительную кровать. 7. Девушка-администратор сообщила, что в отеле есть бесплатный доступ в интернет, и что, если мне надо будет подключиться к интернету, то они мне предоставят пароль. 8. Я спросил у горничной, может ли она завтра отнести мой костюм в химчистку. 9. Они узнали, что вчера состоялось собрание компаньонов, на котором обсуждали вопросы о замене кондиционеров и спутникового телевидения в отеле.", "10. Агент туристической компании мне сообщил, что если я буду располагать временем, то в четверг меня отвезут в живописную бухту, где я смогу насладиться природой и заняться подводным плаванием."]}], "14": [{"h": "Ejercicio 1. Измените предложения по образцу:", "b": ["Anita ha preparado la tortilla. → La tortilla ha sido preparada por Anita.", "1. Carlos tradujo la carta.", "2. El doctor Sánchez ha hecho esta operación.", "3. En verano mis amigos alquilarán una casa en el campo.", "4. El gato rompió el fl orero.", "5. Los hijos pondrán la mesa.", "6. La secretaria ha contado este chiste por la mañana.", "7. Colón descubrió América en el año 1492.", "8. Cervantes escribió la novela Don Quijote en el año 1615.", "9. Ayer nosotros pusimos en orden todos los documentos.", "10. Tú has elegido estos zapatos rojos de tacón para mí."]}, {"h": "Ejercicio 2. Переведите на испанский язык:", "b": ["1. Этот дом был построен моим дедом в прошлом веке.", "2. Когда был написан роман «Война и мир»?", "3. Банки в Испании закрываются в час дня.", "4. Как читается это слово по-английски?", "5. Наша квартира была сдана в аренду на этой неделе.", "6. Счет будет оплачен соседями через три дня.", "7. Здесь курить запрещается.", "8. Ужин в ресторане отеля подается с 19 до 22.", "9. Заказ был сделан клиентами 15 минут назад.", "10. Новый район строится очень быстро.", "11. Антонио не знал, как переводится это слово и не смог ответить на вопрос.", "12. Вчера мой брат был оштрафован полицейским, потому что нарушил правила дорожного движения.", "\u0002 Глагол valer* и производные от этого глагола имеет разные значения:", "valer стоить / цениться / иметь значимость", "vale la pena быть стоящим", "¡Vale! Ладно! Хорошо! Согласен!", "* глагол индивидуального спряжения см. Приложение 3 valor m стоимость / цена /значимость / ценность / храбрость / отвага / достоинство valiente смелый / отважный"]}, {"h": "Ejercicio 3. Переведите предложения:", "b": ["а) с испанского языка на русский", "1. Los hechos valen más que mil palabras. 2. Mis zapatos deportivos se han roto y ya no valen para nada. 3. Su opinión vale a peso de oro. 4. Vale la pena señalar que no muchos Estados miembros de la UE designan mujeres para integrar la Comisión", "Europea. 5. La cuenta incluye IVA (Impuesto del Valor Añadido).", "6. Muchos consideran el valor como una de las más importantes virtudes del ser humano.", "б) с русского языка на испанский", "1. Если Педро узнает, сколько стоит эта сумка, он не захочет мне ее покупать. 2. Мы решили, что не стоит идти смотреть этот фильм, потому что он скучный. 3. Эта картина представляет большую художественную ценность. 4. В этом конкурсе смогут принять участие только самые смелые, ловкие и быстрые. 5. Завтра я уезжаю в командировку, можешь присмотреть за моим котом? – Хорошо. Нет проблем. 6. Лучше поздно, чем никогда."]}, {"h": "Ejercicio 4. Измените предложения по образцу:", "b": ["Veo que el niño come sin apetito. → Veo al niño comer sin apetito.", "1. Ramón oyó que el ruido del motor se acercaba.", "2. Todos vieron que el tren llegaba.", "3. Los viajeros sienten que pasa algo incomprensible.", "4. La abuela oyó que el niño tocaba la guitarra.", "5. De pronto noté que Sergio apareció en el camino.", "6. Vimos que ella bajaba del autobús."]}, {"h": "Ejercicio 5. Составьте из двух фраз одно предложе-", "b": ["ние по образцу и переведите на русский язык:", "Vi a las mujeres con trajes nacionales. Ellas bailaban fl amenco en la plaza. → Vi a las mujeres de trajes nacionales bailar fl amenco en la plaza.", "1. El guarda observaba a los pasajeros. Ellos bajaban del tren.", "2. Detrás de mí corría un muchacho. No lo vi.", "3. Por las tardes la nieta tocaba el piano. La abuela estaba escuchándola.", "4. Noté a un tipo muy raro. Él salía de mi apartamento.", "5. Por la ventana vi a Juan. Él daba vueltas alrededor de mi casa."]}, {"h": "Ejercicio 6. Переведите на испанский язык:", "b": ["1. Я не заметила, как ты вошел в кабинет.", "2. Все почувствовали, что весна приближается.", "3. Мы любили слушать, как дедушка рассказывал о своих путешествиях по Африке.", "4. Родители смотрели, как их дети играли в футбол.", "5. Ты не слышал, как соседи шумели всю ночь."]}, {"h": "Ejercicio 7. Переведите на русский язык:", "b": ["1. La madre no le deja al niño comer mucho chocolate.", "2. Los padres siempre me hacen tomar leche caliente antes de acostarme.", "3. El guía acaba de decir que dentro de una hora él nos esperará a la salida del museo.", "4. ¿Por qué vuelves a llamarme si ya lo hemos discutido todo?", "5. Ayer los vi a los reporteros acercarse a nuestra casa y decidí que no les dejaría entrar de ninguna manera. Sabía que volverían a hacerme preguntas estúpidas.", "6. Juan tiene mal aspecto, debe dejar de fumar y empezar a practicar algún deporte.", "7. ¿Por qué no se pone Ana a trabajar? Le queda muy poco tiempo, el jefe necesita fi rmar estos documentos dentro de media hora.", "8. Noté a la niña marearse y tuve que parar el coche.", "9. No me gustan los viajes organizados, suelo alquilar un todoterreno y recorrer los lugares interesantes solo.", "10. Para no tener problemas con la policía en el camino hay que respetar las normas de circulación.", "11. Oímos el reloj dar las diez y nos pusimos a despedirnos de los Fuentes.", "12. Al escuchar la historia de Juan, María se echó a reír."]}, {"h": "Ejercicio 8. Переведите на испанский язык:", "b": ["1. Я видел, как вы бросились бежать, когда заметили собаку.", "2. Мне только что сказали, что этот столик забронирован и нам придется сесть за другой.", "3. В выходные надо будет приготовить паэлью: мои дети ее очень любят.", "4. Если ты перестанешь изучать языки, тебя не отправят в командировку в Швейцарию.", "5. Я вижу, как много ты работаешь, тебе надо отдохнуть.", "6. Когда Филипп начинает рассказывать о своих приключениях, он всех смешит.", "7. Обычно мы проводим лето за городом, а осенью, когда дети начинают учиться, и мы возвращаемся в город.", "8. Ты только что выпил сок и опять хочешь пить? Странно.", "9. Что вы собираетесь делать сегодня вечером? – Мы должны снова встретиться с архитектором и обсудить с ним мебель для нашей новой квартиры.", "10. Два часа назад Хуан позвонил мне из больницы и сообщил, что наша тетя только что скончалась. Я расплакалась."]}, {"h": "Ejercicio 9. Измените предложения по образцу:", "b": ["La gata tomó la leche. → La leche la tomó la gata.", "1. Escribiré la carta ahora mismo.", "2. Necesitas pagar la cuenta hoy.", "3. Los padres me regalaron la bicicleta.", "4. Habéis reservado los billetes por Internet.", "5. No hemos visto a nuestra profesora esta mañana.", "6. Petra quiere comprar el pescado en el mercado.", "7. El perro dejó caer el fl orero."]}, {"h": "Ejercicio 10. Переведите на испанский язык:", "b": ["1. Дом мы хотим снять рядом с парком.", "2. Нашу бабушку все любят и уважают.", "3. Эту блузку я купила на распродаже.", "4. Каникулы мы собираемся провести на море.", "5. Газеты папа читает за завтраком, а новости он смотрит после ужина.", "6. Квартиру ты уже убрала, а продукты принесет Лола.", "7. Машину они смогли продать очень быстро.", "\u0002 Следует различать существительные partido m и partida f:", "partido m", "partida f", "partido (político)", "partida отъезд", "политическая партия", "partida de nacimiento", "свидетельство о рождении", "partido (de fútbol) матч /", "partida de (ajedrez) партия в", "встреча (по футболу)", "(шахматы)"]}, {"h": "Ejercicio 11. Переведите на испанский язык:", "b": ["1. В парламентских выборах 2011 года в России принимали участие всего семь политических партий.", "2. Вчера я два часа искал свое свидетельство о рождении, но так и не нашел его.", "3. Прошло всего два дня после твоего отъезда, а мне кажется, что прошло уже два месяца.", "4. Во время чемпионата по баскетболу, нам посчастливилось посмотреть все матчи с участием нашей сборной.", "5. Когда ты был маленьким, вы с дедушкой каждый вечер играли партию в шахматы или шашки.", "Тема: Спорт", "\u0002 Прочитайте и запомните слова и полезные выражения, связанные с темой «спорт»:", "deportista m/f", "спортсмен / cпортсменка", "atleta m/f", "спортсмен / атлет", "campeonato m", "чемпионат", "copa f", "кубок", "competición f", "соревнование", "partido m", "матч", "partida f", "партия", "campeón m", "чемпион", "ganador m", "победитель", "rival m", "соперник", "vencer / triunfar", "победить", "ganar la medalla", "выиграть медаль", "perder la partida", "проиграть партию", "tanteo m", "счет", "empatar el partido a cero", "сыграть матч вничью 0:0", "empate m", "ничья", "ganar con tres a uno", "выиграть 3:1", "triunfo m", "победа", "entrenarse", "тренироваться", "entrenamiento m", "тренировка", "entrenador m", "тренер", "ser afi cionado a", "увлекаться чем-либо", "apuntarse a", "записаться", "hincha m", "болельщик", "estadio m", "стадион", "campo m", "поле", "cancha f", "спортивная площадка", "cancha de tenis", "теннисный корт", "pista f", "беговая дорожка / трек /", "площадка", "pista de esquí", "горнолыжная трасса", "equipo m", "команда", "selección f", "сборная", "modalidad f", "вид спорта", "atletismo m", "легкая атлетика", "ciclismo m", "велоспорт", "artes marciales f pl", "боевые искусства", "boxeo m", "бокс", "patinaje m", "конькобежный спорт", "patinaje artístico", "фигурное катание", "gimnasia deportiva f", "спортивная гимнастика", "gimnasia rítmica f", "художественная гимнастика", "baloncesto m", "баскетбол", "balonmano m", "гандбол", "hípica f", "конный спорт", "natación f", "плавание", "vela f", "парусный спорт", "remo m", "гребля", "portero m", "вратарь", "defensa m", "защитник", "delantero m", "нападающий", "marcar el gol", "забить гол", "cruzar la meta", "пересечь финишную черту", "felicitar con la victoria", "поздравить с победой", "derrota f", "поражение", "participar en", "участвовать", "dopaje m", "допинг", "apuesta f", "ставка", "apostar (1b)", "делать ставки / заключать", "пари"]}, {"h": "Ejercicio 17. Переведите испанские реплики на рус-", "b": ["ский язык, а русские реплики на испанский.", "Entrevista con Laura Urriola", "Laura es una chica española de 16 años. Ella ha ganado la medalla de oro en los Campeonatos del Mundo Júnior de Taekwondo que se celebraron en Corea del Sur.", "– Наши поздравления, Лаура! Почему ты решила заниматься этим видом спорта?", "– Mi hermano iba al gimnasio a practicar artes marciales. Un día me llevó porque me quería apuntar a kárate, probé el taekwondo y me gustó mucho.", "– Этим летом ты стала чемпионкой мира в Корее. Было трудно завоевать золотую медаль?", "– Sí, bastante … En la fi nal peleé contra una turca que me lo puso muy difícil.", "– После победы тебе предложили остаться в Корее, чтобы продолжить заниматься тхэквондо, но ты не захотела. Почему?", "– Creo que todavía soy joven y prefi ero estar en casa con mis padres. Además quiero estudiar en la universidad aquí, en España.", "– Чему ты хочешь посвятить себя в будущем?", "– Me gustaría ser profesora de Educación Física, pero todavía no lo tengo muy claro.", "– Как ты успеваешь одновременно учиться и тренироваться? Ты много времени посвящаешь тренировкам?", "– Unas tres horas al día. Me entreno por la mañana antes de ir al colegio y por la tarde. Claro que madrugo mucho. A las siete de la mañana tengo que estar en el gimnasio.", "– Ты бы хотела принять участие в Олимпийских Играх?", "– Por supuesto. Cada deportista sueña con ser campeón olímpico. Pero hay que ser realista.", "– Большое спасибо, Лаура. Нам остается только пожелать тебе удачи и успехов в спорте и в учебе!", "а) Составьте рассказ о Лауре Урриоле."]}, {"h": "Ejercicio 19. Составьте сообщения по темам:", "b": ["1. ¿Por qué y para qué la gente practica deportes?", "2. Mi deporte favorito. ¿A qué deporte es afi cionado usted?", "3. ¿Qué deporte practica usted? ¿Qué deporte le gustaría practicar?", "4. ¿Es usted hincha de algún equipo? Mi equipo favorito.", "5. ¿Tiene usted un deportista favorito de categoría nacional / mundial?", "6. ¿Cuál es el deporte más practicado en su país?"]}, {"h": "Ejercicio 20. Вставьте необходимые предлоги и ар-", "b": ["тикли:", "1. El abono … 15 visitas … él y … su esposa fue comprado …", "Antonio … martes pasado. 2. El polideportivo … universidad dispone", "…. cancha … tenis, … campo …. fútbol y … piscina … aire libre. 3.", "Si desea usted jugar … tenis … domingo tendrá que reservar … cancha dos días … como mínimo … nuestra página web o llamando", "… teléfono … administrador … club deportivo. 4. Ayer supe que … partida … nacimiento … mi sobrino había sido perdida … empleado … agencia turística durante … excursión … pirámides. 5. ¿Quién cuidará", "… tu perro si te vas … viaje … placer … extranjero … una semana? 6.", "Quiero apuntar … mi hija … clases … patinaje artístico. Me gustaría saber cuántas veces … semana hay … clases … niños … 6 años. 7. No vale … pena intervenir … conversación … personas mayores. – Estoy", "… acuerdo … (tú). 8. Se sabe que … año 2018 se celebrará … Rusia", "… campeonato mundial … fútbol … eso … todas partes se habla … preparativos … este acontecimiento. 9. Debes agradecerle … señor", "López … consejo porque sus consejos valen … peso … oro. 10. Vi … ventana … Juan hablar … esquina … dueño … bar."]}, {"h": "Ejercicio 21. Переведите на испанский язык:", "b": ["1. Тереза не могла вспомнить, куда она положила свидетельство о рождении своей дочери, и подумала, что если не найдет его, она не сможет записать дочь на плавание. 2. Мне сказали, что не стоит приезжать в спорткомплекс, чтобы узнать расписание занятий, потому что можно посмотреть его на сайте. 3. В 90-е годы дон Диего, вероятно, был тренером по фигурному катанию, а сейчас он на пенсии и, наверное, живет в Англии со своими внуками.", "4. Директор сказал, что осенью в этом парке студентами было посажено 515 деревьев. 5. Я слышал, как ты вчера вечером разговаривал с врачом. – Да, и он сказал, что если у меня будут проблемы со спиной, мне придется оставить занятия йогой. 6. Неужели ты не знаешь, что здесь запрещено курить? Если ты закуришь у входа в бассейн, тебя оштрафуют. 7. Администратор сообщил, что теннисный корт на выходные надо бронировать заранее."]}], "15": [{"h": "Ejercicio 1. Образуйте формы imperativo afi rmativo:", "b": ["а) tú – vosotros", "1. Fumar menos.", "2. Pasear antes de acostarse.", "3. Leer este artículo.", "4. Abrir la ventana.", "5. Dormir ocho horas al día.", "6. Seguir las recomendaciones del médico.", "7. Pensar en mis palabras.", "8. Hacer una sorpresa.", "9. Venir a vernos.", "10. Decir la verdad.", "11. Jugar al ajedrez.", "12. Salir a la calle.", "13. Tener cuidado.", "14. Aparcar el coche aquí.", "15. Almorzar en el colegio.", "b) usted – ustedes – nosotros", "1. Descansar más.", "2. Comer fruta y verdura.", "3. Practicar deporte.", "4. Discutir el contrato con los socios.", "5. Agradecer al amigo su ayuda.", "6. Traer el seguro médico.", "7. Cerrar la ventana.", "8. Empezar a cenar sin ellos.", "9. Contar lo que ha pasado.", "10. Sonreír al fotógrafo.", "11. Elegir otro vino.", "12. Dar una vuelta por la ciudad.", "13. Ir a la oficina a pie.", "14. Ser optimista.", "15. Apagar la luz."]}, {"h": "Ejercicio 2. Измените предложения по образцу:", "b": ["a) tú → usted", "Abre la puerta. → Abra usted la puerta.", "1. Lee el fax.", "2. Rompe la carta.", "3. Piensa en tus padres.", "4. Atiende al cliente.", "5. Divierte a la señorita.", "6. Traduce esta poesía.", "7. Haz caso de mis palabras.", "8. Ven a ver las competiciones.", "9. Sé fuerte.", "10. Ve la nueva película que ha traído Juan.", "11. Ve a la biblioteca y busca este libro.", "12. Sonríe despidiéndote de Miguel.", "13. Trae pan y leche para el desayuno.", "14. Di tu nombre y apellido a la secretaria.", "15. Oye a Carmen cantar.", "16. Paga la cuenta.", "17. Cruza la carretera con cuidado.", "18. Sigue entrenándote.", "19. Coge un taxi.", "20. Ten cuidado.", "b) vosotros → nosotros", "Abrid la puerta. → Abramos la puerta.", "1. Leed el fax.", "2. Romped la carta.", "3. Pensad en vuestros padres.", "4. Atended al cliente.", "5. Divertid a la señorita.", "6. Traducid esta poesía.", "7. Haced caso de mis palabras.", "8. Venid a ver las competiciones.", "9. Sed fuertes.", "10. Ved la nueva película que ha traído Juan.", "11. Id a la biblioteca y buscad este libro.", "12. Sonreíd despidiéndoos de Miguel.", "13. Traed pan y leche para el desayuno.", "14. Decid vuestros nombres a la secretaria.", "15. Oíd a Carmen cantar.", "16. Pagad la cuenta.", "17. Cruzad la carretera con cuidado.", "18. Seguid entrenándoos.", "19. Coged un taxi.", "20. Tened cuidado."]}, {"h": "Ejercicio 3. Замените формы единственного числа", "b": ["imperativo afi rmativo формами множественного числа и наоборот:", "1. Tened prisa. 2. Da una vuelta antes de acostarte. 3. Sea usted prudente conduciendo el coche. 4. Hagan cola para entrar en el museo. 5. Id en avión, es más cómodo. 6. Recuerda mi dirección.", "7. Despierte usted a los niños. 8. Seguid participando en las competiciones de vela. 9. Sabed esta regla. 10. Di algo agradable.", "11. Huyan de aquí. 12. Pedid perdón.", "Все местоимения (как возвратные, так и местоимения-дополнения) ставятся после форм imperativo afi rmativo и пишутся с ними слитно.", "Возвратные глаголы в форме 1-го лица множественного числа теряют в окончании глагола перед возвратным местоимением согласный –s:", "acostarse → acostemos + nos → ¡Acostémonos!", "Возвратные глаголы в форме 2-го лица множественного числа теряют в окончании согласный –d:", "sentarse → sentad + os → ¡Sentaos!", "Исключением является глагол irse:", "irse → id + os → ¡Idos!", "lavarse", "decirlo", "tú", "lávate", "dilo", "vosotros", "lavaos", "decidlo", "usted", "lávese", "dígalo", "ustedes", "lávense", "díganlo", "nosotros", "lavémonos", "digámoslo"]}, {"h": "Ejercicio 4. Измените предложения по образцу:", "b": ["Quiero lavarme (tú, usted). → Lávate. Lávese.", "1. Necesito despertarme a las siete (tú, usted).", "2. Tenemos que acostarnos ahora mismo (vosotros, ustedes).", "3. Necesito dormirme en seguida (tú, usted).", "4. Vamos a divertirnos hasta la madrugada (vosotros, nosotros). s) las curiosidades de esta ciudad porque hoy no (disponer, nosotros) de tiempo libre. (Hacerlo, nosotros) mañana.", "7. (Tener, yo) frío. ¿Quién (abrir) la ventana? – Nadie. Yo (poner)", "el aire acondicionado.", "8. ¿Ya (prepararse, tú) para el viaje? – Naturalmente. Ya (escribir, yo) por el correo electrónico que (llegar, nosotros) la semana siguiente, (solicitar, yo) el visado, y mi marido (reservarme) el billete para el avión.", "9. Miguel no (devolverme) la deuda porque todavía no (resolver, él) sus problemas.", "10. Ellos no (querer) ir en tren porque (tardar, ellos) todo un día en llegar. (Pensar, yo) que (preferir, ellos) ir en avión.", "2. Вставьте необходимые предлоги и артикли:", "1. Marisol es … más puntual … nuestra oficina. Nunca llega … retraso.", "2. ¿Va … pagar usted … viaje? – … supuesto, pero tengo … billete … 50€. – No hay … problema, le doy … vuelta.", "3. ¿Quién te ha enseñado … esquiar? ¿Ha sido alguno … tus amigos?", "4. Necesito dos billetes … ida y vuelta … destino … París.", "5. Tenemos que llegar … aeropuerto dos horas … salida … avión … facturar … equipaje y cumplir todas … formalidades.", "6. ¿Hay … vuestro barrio … estadio? – No, no hay … estadio, pero hay … polideportivo.", "7. ¿Tenemos que cambiar … línea … ir … zoo? – ¡Qué va! Es … misma línea, pero hay que ir … dirección contraria.", "8. … farmacia está … cinco cuadras … mi casa … eso subo … coche … ir allí.", "9. Toda … semana Jorge piensa … tus palabras.", "10. Cuando tú tratas … traducir … poesías de Lorca … español", "… ruso todos ríen … ti.", "3. Переведите на испанский язык:", "1. Почему ты ходишь в рваных ботинках? Все над тобой смеются. Я предлагаю тебе поехать в магазин, чтобы купить тебе новые ботинки.", "2. Хосе очень мало спит и много работает, поэтому чувствует себя хуже. Ему надо больше отдыхать.", "TEST DE CONTROL (Lecciones 8-10)", "3. Почему ты так нервничаешь? К поездке у тебя все готово, чемоданы собраны. – Да, но я еще не заказала такси. – Я отвезу тебя на вокзал.", "4. Здесь есть поблизости банк? – Да, есть один. Вам надо пройти один квартал до угла и там повернуть налево, перейти улицу и вы увидите банк. – Спасибо, а Вы не знаете, он сейчас открыт?", "5. Мои родители решили мою проблему с жильем. Они купили мне однокомнатную квартиру в центре города недалеко от университета.", "6. Мы слышали по радио, что будет ураган, и поэтому из-за неблагоприятных метеорологических условий все рейсы из Мадрида задерживаются.", "7. Завтра будет хорошая погода, будет солнечно и тепло, мы отравимся на экскурсию в пригород Санкт-Петербурга, я покажу тебе дворец, мы прогуляемся по красивейшему парку, а вечером купим билеты на ночной поезд и вернемся в Москву. – Мне очень жаль, я не смогу поехать, у меня много работы. – Наверное, тебе просто не нравится мой план.", "8. Ты уже вернул книги Елене? – Еще нет, я еще не закончил писать статью об открытии Америки. Завтра я приду домой пораньше, все сделаю, а послезавтра верну ей ее книги.", "9. Мы еще не знаем всей правды, поэтому не можем помочь ей. Речь идет об очень важном деле.", "10. Ваш район не такой старый, как наш. – Да, он более новый, здесь нет старинных зданий или каких-либо других достопримечательностей, но есть спорткомплекс, парк, скоро построят еще одну школу, а в этом месяце открыли большой торговый центр.", "У Р О К 1 1 (LE CC I Ó N 11)"]}, {"h": "Test de control", "b": ["(LECCIONES 11-12)", "1. Поставьте глаголы в соответствующую форму", "indefi nido или imperfecto:", "1. Hace quince días nosotros (estar) en Valencia.", "2. El mes pasado vosotros (ir) de vacaciones a Málaga.", "3. Cuando (ser, nosotros) pequeños a menudo (jugar) al fútbol.", "4. Luis (leer) tranquilamente en el sofá, cuando (sonar) el teléfono.", "5. Durante las vacaciones todas las noches (ver, nosotros) alguna película y (acostarse) a la una o a las dos de la madrugada.", "6. El mes pasado Juan (telefonear) a Carmen 20 veces.", "7. Ayer ellos no (poder) venir porque (trabajar).", "8. Anteayer cuando Isabel (volver) a casa, ella (encontrar) a mi hermano y (discutir, ellos) el futuro veraneo.", "9. Anteayer los niños (dormir) más de diez horas.", "10. El lunes yo (despertarse) a las 6:30 y (andar) media hora por el parque, el martes no (querer) levantarme tan temprano.", "11. Anoche nosotros (ir) al cine pero la película no (gustarnos).", "12. El miércoles (llover) toda la noche. Pero el jueves (hacer)", "buen tiempo.", "13. La semana pasada mis padres no (irse) al campo, porque la abuela (sentirse) mal.", "14. Mientras Marta (elegir) platos, el camarero (servirle) el aperitivo.", "15. (Haber) niebla en Londres, cuando el avión (aterrizar) en el aeropuerto.", "TEST DE CONTROL (Lecciones 11–12)", "2. Вставьте необходимые предлоги:", "1. Mi hermana se dedicaba … dar clases … matemáticas … el colegio.", "2. Felipe decía … vez … cuando que soñaba … ser médico pero estudiaba … la facultad … Derecho.", "3. Hemos quedado … encontrarnos … día siguiente … el mostrador … facturación y allí les agradeceremos … su ayuda y nos despediremos … ellos.", "4. ¿Por qué te niegas … acompañarme … el centro comercial?", "5. Raúl vio … primera vez … Teresa … el concierto y … seguida se enamoró … ella y no deja … pensar …ella.", "6. Voy … compras, ¿qué necesitas … preparar gazpacho? – Un litro … aceite y un kilo … tomates.", "7. Me gusta esta blusa … seda … rayas azules y blancas … manga larga. Me quedo … ella.", "8. Su hijo mismo aprendió … leer … los cinco años y la abuela le enseñó … tocar … el piano.", "9. La familia … los domingos … veces iba … almorzar … el restaurante “Gula” donde habitualmente pedían … primer plato sopa … ajo y … segundo chuletas … ternera.", "10. Hoy estamos … 25 … junio, mañana vendrá … vernos nuestra tía, debemos dejar … divertirnos y empezar … prepararnos", "… su visita.", "3. Переведите на испанский язык:", "1. Прошлой весной мы ездили в круиз, о котором мечтали несколько лет. Нам так понравилось! Это была незабываемая поездка.", "2. Начальник спросил, почему я не сделал перевод и не написал статью. Я объяснил ему, что всю неделю был очень занят.", "3. На прошлой неделе мы были в Риме. Погода была плохая, лил дождь, и мы не смогли пройтись по улицам города, а некоторые достопримечательности мы видели только из окна автобуса.", "4. Ночью Анна почувствовала себя плохо, потому что весь день провела на пляже, и нам пришлось вызвать врача.", "5. Вчера мой сосед женился. Гости веселились всю ночь:", "пели, танцевали, играли на гитаре. Я заснул только в 5 утра.", "6. Когда тебе исполнилось 15 лет, бабушка уже умерла.", "7. Мы хотели воспользоваться сезонной распродажей, поэтому в субботу отправились в торговый центр и взяли с собой детей, а Луис предпочел остаться дома.", "У Р О К 1 3 (LE CCI Ó N 13)"]}, {"h": "Test de control", "b": ["(LECCIONES 13-14)", "1. Впишите спряжение следующих глаголов в таблицу:", "Infi nitivo", "Indefi nido", "Imperfecto", "Pretérito plusPotencial", "cuamperfecto", "simple", "yo,", "vosotros", "tú", "nosotros", "nosotros,", "ellos", "1. salir", "2. atraer", "3. disponer", "4. sacar", "5. ir", "6. producir", "7. tener", "8. poder", "9. dormir", "10. ver", "11. seguir", "12. hacer", "13. preferir", "14. volver", "15. ser", "16. decir", "17. sentir", "18. infl uir", "19. reír", "20. querer", "2. Трансформируйте прямую речь в косвенную:", "1. “Si tengo tiempo mañana, pasaré por el banco”. → Pablo nos aseguró que…", "2. “¿Quieren ustedes ir de vacaciones a un país exótico?” → La operadora nos preguntó …", "3. “Ayer llegaron muchos turistas y ahora en el hotel no hay habitaciones libres.” → El recepcionista explicó que…", "4. “¿Por qué nuestro vuelo sale con tanto retraso y cuándo anunciarán el embarque al avión? → Los pasajeros querían saber …", "5. “Estuvimos en Grecia cinco veces y este año iremos a Grecia también porque nos gusta este país.” → Los Muñoz comunicaron que …", "6. “¿Habéis agradecido a vuestro tío su regalo?” → La madre nos preguntó …", "7. “Soy de España pero este año he trabajado en Berlín.” → El periodista informó de que…", "8. “Cuando vivíamos en Cuba teníamos que trabajar mucho.” →", "A veces el abuelo nos contaba que...", "9. “Estuve en Moscú dos veces pero conozco poco la ciudad y si me acompañas te estaré muy agradecida.” → Lola me dijo que …", "10. “¿Qué os apetece tomar de aperitivo?” → Miguel preguntó", "…", "3. Вставьте необходимые предлоги и артикли:", "1. … primer día … tarde tuvimos … visita panorámica … centro", "… ciudad.", "2. Acababan … explicarnos que …desayuno se servía … restaurante … planta baja … siete … once … mañana.", "3. … programa incluye … viaje … barco … bahía donde … turistas afi cionados … deportes náuticos podrán disfrutar … buceo.", "TEST DE CONTROL (Lecciones 13-14)", "4. Necesito … reservar … habitación doble … dos noches ...", "nombre … Miguel Hernández.", "5. Luis siempre soñaba … ser … futbolista famoso pero tuvo que dejar … practicar … deporte porque … últimas competiciones había roto … rodilla.", "6. Estamos seguros … que … fi nal nuestra selección volverá … ganar … dos … uno.", "4. Переведите на испанский язык:", "1. Недавно я узнала, что ты уезжаешь за границу и вернешься через год. Неужели ты оставишь свою семью на целый год?", "2. Мы подумали, что если завтра в посольстве будет много народа, мы потеряем время и не сможем подать документы на визу.", "3. Дорогая, где бы ты хотела отметить свой день рождения? –", "Ты не помнишь, что месяц назад ты мне обещал, что ты арендуешь яхту, и мы отправимся в Ниццу?", "4. К 30-ти годам он объездил всю Европу, побывал на всех модных курортах, а вчера он сказал, что мечтает отправиться в", "Австралию.", "5. Летисия спросила, в котором часу завтра придут гости, и добавила, что надо будет купить сухого красного вина, потому что она собирается приготовить отбивные из баранины.", "6. Абонемент в бассейн сейчас продается с большой скидкой.", "Думаю, стоит купить его и ходить всей семьей по воскресеньям в бассейн, к тому же у меня проблемы со спиной, а плавание в этом случае очень полезно.", "7. Знаешь, в прошлые выходные наша команда снова выиграла. После матча все наши болельщики принялись поздравлять нас с победой и долго не давали нам уйти с поля.", "8. Сотрудница спортивного клуба объяснила, что у них есть два теннисных корта, но их следует бронировать заранее, а цены можно посмотреть на их сайте.", "9. Выходные мы обычно проводили на даче, которая была куплена моими родителями в 1999 году.", "10. Если ты хочешь послушать, как поет Андрес Гарсия, билеты на его концерт надо купить сегодня.", "У Р О К 15 (LE CCI Ó N 15)"]}, {"h": "Test de control", "b": ["(LECCIONES 11-15)", "1. Поставьте глаголы в соответствующую форму:", "1. Anoche Andrés no (caber) en el último autobús y (tener que ir, él) a pie. (Andar, él) dos horas pero (traer, él) la medicina a tiempo.", "2. Esta mañana (leer, nosotros) en un periódico que pronto en nuestra ciudad (construir, ellos) un nuevo club deportivo. Si yo", "(poder), (apuntarse, yo) en él.", "3. Cuando (ser, yo) niño (empezar, yo) a practicar artes marciales y casi todas mis victorias (dedicárselas, yo) a mi entrenador porque él (descubrir) mi talento.", "4. Alguien (tocar) a la puerta. ¡Niños, (irse) a ver quién", "(ser) y (abrir, vosotros) la puerta! ¡No (dejar, vosotros) entrar a desconocidos!", "5. ¡Señor director, (atender) a las cuentas! ¡No (distraerse, Ud.) y", "(colgar) el teléfono! Si no (pagar, nosotros) la cuenta hoy mismo, no", "(recibir, nosotros) el pedido a tiempo.", "6. Cuando (ser, yo) pequeño, siempre (descansar, nosotros) en casa de mi abuela. (Soler + cenar, nosotros) al aire libre.", "7. ¡Señores, no (irse), (sentarse) aquí! El jefe (acabar) de llamar y é l (decir) que (venir) dentro de 10 minutos.", "8. Hace una semana yo (explicarles) que para los 20 años ya", "(descubrir) el secreto de la vida.", "9. (Tratar, ustedes) de trabajar menos, no (trabajar, ustedes) los domingos, (relajarse, ustedes), (llevar, ustedes) una vida más sana:", "no (fumar, ustedes), no (beber, ustedes) alcohol.", "TEST DE CONTROL (Lecciones 11-15)", "10. ¡Niños, (tener) cuidado! ¡No (acercarse, vosotros) al balcón!", "Si (caer, vosotros), (hacerse, vosotros) daño. ¡Mejor (irse) a vuestra habitación y (divertirse) allí!", "11. Anteayer (saber, yo) casualmente que mi amigo nuevo (ser) un ciclista muy bueno, que ya (participar, él) en muchas competiciones y (acabar) de ganar una medalla de oro.", "12. – Si yo no (caber) en el próximo autobús, ¿(poder, tú)", "llevarme en tu coche al aeropuerto?", "13. Si es posible, (dormir, tú) la siesta de vez en cuando, (salir, tú)", "a dar un paseo antes de acostarte. Sin embargo, por si acaso, (hacer, tú) una radiografía y análisis de sangre y orina.", "14. Antes José (ir) a esquiar a Suiza cada invierno, pero el año pasado él (caer) gravemente enfermo. Los médicos (decir) que él", "(morir) si no (hacerle, ellos) una operación quirúrgica.", "15. Hijo, no (negarse, tú) a llevar a la tía a la estación, pero (tener)", "cuidado, no (conducir) a gran velocidad.", "16. ¿Qué (hacer, vosotros) ayer? – (Traducir, nosotros) dos artículos. Andrés (divertirse) en el casino, (venir, él) a casa a la madrugada. Su madre no (dormir) toda la noche.", "17. (Echarse, usted) aquí, (subirse, usted) la manga de la camisa y (darme, usted) su brazo izquierdo. Primero (ir, yo) a examinarlo y", "(tomarle, yo) la tensión.", "18. Ayer (oír, yo) por la radio que la próxima semana en la costa", "(hacer) frío. – Si (hacer) frío, no (poder bañarse, vosotros) en el mar.", "2. Измените фразы по образцу:", "Quiero comprar fl ores a mi abuela (tú). → Cómpraselas. No se las compres.", "1. Tenemos que pedir dinero a los padres (vosotros).", "2. Quiero ponerme los zapatos de tacón alto (tú).", "3. Voy a pagarte tus servicios (usted).", "4. Queremos hacer una pregunta al entrenador (ustedes).", "5. Queremos conseguir éxitos en el kárate (nosotros).", "6. Debo decirle a Lola nuestra decisión (tú).", "7. Tengo que explicar esta regla a los estudiantes (usted).", "8. Queremos el
