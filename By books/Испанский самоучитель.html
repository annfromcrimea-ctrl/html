 entrada independiente.", "Avda. Arenal, 33.", "Tel. 6-32-43-54-12", "Сдается:", "Двухкомнатная полностью", "меблированная квартира", "после ремонта. 2-ой этаж", "7-этажного дома. Общая", "площадь 75 м² (22 м² + 18 м²).", "Окна комнат выходят во", "двор. Кухня 10 м² с балконом", "с видом на Петровский парк.", "Имеется холодильник, посудомоечная и стиральная машины, телевизор, микроволновая печь, кондиционер. Во дворе – парковка. Рядом с м. Динамо", "60 000 руб. в месяц"]}, {"h": "Ejercicio 20. Напишите по-испански объявления:", "b": ["а) о сдаче в аренду своей квартиры;", "б) об аренде помещения для школы иностранных языков, юридической консультации, фитнес-клуба, …"]}], "7": [{"h": "Ejercicio 1. Ответьте на вопрос: ¿Qué hora es?", "b": ["17:20 – Son las cinco y veinte de la tarde.", "9:00 – ……..", "13:30 –………", "7:35 –……….", "21:15 – …….", "5:55 – ………", "15:45 – ……….", "2:05 – ………", "24:00 – ………..", "22:00 –………"]}, {"h": "Ejercicio 3. Ответьте на вопрос: ¿A qué hora..?", "b": ["¿A qué hora vas de compras? 11:00 → Voy de compras a las once de la mañana.", "¿A qué hora…", "volvéis a casa?", "21:00", "toman café tus amigos?", "9:30", "Enrique habla por teléfono con su novia?", "23:40", "empieza el concierto?", "19:20", "despiertas a tu hijo?", "7:45", "almorzáis?", "13:15", "escucha usted las noticias?", "15:45", "vas a la oficina?", "8:10", "los niños juegan al fútbol?", "12:00", "viene el tren?", "3:05"]}, {"h": "Ejercicio 4. Переведите на русский язык:", "b": ["1. Te despiertas a las seis de la mañana y yo no puedo despertarme tan temprano.", "2. Los niños se acuestan a las diez y se duermen en seguida.", "3. Antes de irnos queremos despedirnos de ellos.", "4. Ya no tenéis tiempo para ducharos.", "5. Ella se viste rápido y se va porque la esperan.", "6. No quiero quitarme la bufanda: tengo frío.", "7. No os gusta lavaros con agua fría.", "8. ¿Por qué te pones blanco cuando contestas a las preguntas del profesor?", "9. Para hacerse rico hay que primero estudiar bien y después trabajar mucho.", "10. Cuando por la mañana me ducho con agua fría, me siento bien todo el día."]}, {"h": "Ejercicio 5. Проспрягайте следующие словосочета-", "b": ["ния в настоящем времени:", "acostarse tarde pero no poder dormirse en seguida", "despertarse a las siete y ducharse con agua fría", "despedirse de los amigos e irse", "decir que no poder prepararse para el examen sin ordenador sentirse bien porque dormir mucho", "Elena", "Los amigos", "Daniel y tú", "Nosotras", "Yo", "Tú"]}, {"h": "Ejercicio 6. Измените предложения по образцу:", "b": ["Me levanto a las siete. → Juan y yo… / Juan y yo nos levantamos a las siete.", "1. Nos despedimos de esta ciudad. → Nina…", "2. Mi marido prefi ere ducharse antes de acostarse. → Yo…", "3. ¿A qué hora os despertáis? → Tú…", "4. Por la mañana te duchas con agua fría y te sientes bien. →", "Ellos…", "5. Los niños no pueden vestirse rápido. → Nosotros…", "6. Isabel se peina y se maquilla media hora. → Yo…", "7. Me acuesto y me duermo en seguida. → Usted…", "8. ¿Cómo os llamáis? → Tú…", "9. No nos despertamos tan temprano. → Carlos y tú…", "10. Él se va porque tiene que prepararse para el examen. → Yo…"]}, {"h": "Ejercicio 7. Поставьте глаголы в соответствующую", "b": ["форму:", "1. Yo (despertarse) temprano y (acostarse) tarde.", "2. Nosotros (prepararse) para los exámenes en la biblioteca.", "3. ¿Por qué no (despedirse, tú) de Juan? – Porque tengo que", "(irse) ahora y Juan (venir) tarde.", "4. ¿Cómo (llamarse, tú)? – Yo (llamarse) David y mis padres", "(llamarse) Augusto e Isabel.", "5. Ana siempre (vestirse) y (peinarse) ante el espejo.", "6. ¿Quieres (limpiarse) los dientes y (maquillarse)? Tienes que", "(irse) al cuarto de baño.", "7. ¿Dónde (encontrarse) la calle Velázquez? – Yo no (conocer)", "esta calle. Lo (sentir, yo).", "8. (Preferir, yo) dar un paseo antes de (acostarse).", "9. Susana y tú (querer despedirse) de nosotros porque (irse, vosotros) dentro de media hora.", "10. Yo no (poder maquillarse) porque hay poca luz."]}, {"h": "Ejercicio 8. Вставьте необходимые предлоги:", "b": ["1. No podemos ir … dar un paseo … el parque porque ahora nos preparamos … el concierto.", "2. ¿Por qué Juan se despide … nosotros? – Porque él se va mañana … la tarde.", "3. ¿No le gusta … usted el té? Voy … prepararle un café.", "4. Enrique y yo empezamos … trabajar … las nueve … punto", "… la mañana.", "5. Ellos quieren jugar … el fútbol … mis amigos … el jardín.", "6. El jefe piensa … el proyecto … nuestro arquitecto.", "7. Son las once … la noche. Quiero leer un poco … acostarme.", "8. Alicia no recuerda el nombre … su profesor y la tía ríe … su sobrina.", "9. Tienes que traducir … el ruso … el español este documento.", "10. Hay que llamar … teléfono … saber … qué hora empieza la película. ¿Por qué no haces caso … mi consejo?"]}, {"h": "Ejercicio 9. Переведите на испанский язык:", "b": ["1. Как вас зовут, сеньориты? – Меня зовут Анита, а мою подругу зовут Росита. – Очень приятно.", "2. Я ложусь спать, но не засыпаю, не хочу спать и пью лекарство, чтобы заснуть.", "3. Вы не знаете, где находится кинотеатр «Космос»? – Нет, я этого не знаю. Я не местный. Мне жаль.", "4. Почему ты не готовишься к празднику: не бреешься, не одеваешься? – Не хочу идти на праздник, я плохо себя чувствую.", "5. Я ей не лгу, я говорю ей правду, а она смеется надо мной, потому что мне не верит.", "6. Дон Альфонсо снимает шляпу, прощается со своими друзьями и уходит.", "7. Я не хочу чистить зубы и не люблю умываться холодной водой.", "8. Бабушка не купается в море, она предпочитает купаться в бассейне.", "9. В котором часу вы (vosotros) уезжаете? – Я не помню. Надо спросить об этом ее брата.", "10. Мама просыпается в 5 часов утра и встает. Она слышит, что ее зовет дочка."]}, {"h": "Ejercicio 10. Образуйте герундий:", "b": ["esperar → …, salir → …, leer → …, querer → …, poder → …, construir → …, venir → …, encontrar → …, aprender → …, ser → …, preferir → …, dormirse → …, ir → …, llegar → …, levantarse → …, saber → …, morir → …., servir → …, infl uir → …, creer → …, lavarse → …, despedirse → …, volver → …, decir → …, oír → …, vestirse → …, reír → …"]}, {"h": "Ejercicio 11. Измените фразы по образцу:", "b": ["а) Ramón toma café y lee periódicos. → Ramón toma café leyendo periódicos.", "1. Usted va a la oficina y piensa en su familia.", "2. Hablo por teléfono con mi novia y me despido de ella para siempre.", "3. Lola cuenta su historia y ríe mucho.", "4. Escribes la carta y recuerdas nuestra universidad.", "5. Preferimos conducir el coche y escuchar la música.", "b) Ramón toma café y no lee periódicos. → Ramón toma café sin leer periódicos.", "1. La abuela se duerme y no toma la medicina.", "2. ¿Quires ir al teatro y no te maquillas?", "3. Alfredo busca la información por Internet y no pide ayuda.", "4. Leemos el texto en alemán y no lo traducimos.", "5. Ellos se van y no se despiden de nosotros."]}, {"h": "Ejercicio 12. Ответьте на вопросы по образцу:", "b": ["¿Dónde está Antonia? – (trabajar en la oficina) / Antonia está trabajando en la oficina.", "1. ¿Qué haces ahora? – (lavarse y peinarse)", "2. ¿ Dónde está don Pedro? – (tomar cerveza con los amigos en la cafetería)", "3. ¿Dónde están los niños? – (dormir)", "4. ¿Qué hace ahora el padre? – (leer el periódico)", "5. ¿Qué hacéis ahora María y tú? – (preparar la cena)", "6. ¿Dónde está la abuela? – (descansar, ver la tele en el salón)", "7. ¿Qué hace la madre? – (poner la mesa para el desayuno)", "8. ¿Dónde están Anita y Pepito? – (jugar en el patio)", "9. ¿Qué hace la secretaria? – (escribir la carta a los clientes)", "10. ¿Qué hacéis ahora Carmen y tú? – (vestirse para ir a la fi esta)"]}, {"h": "Ejercicio 13. Выберите между формой настоящего", "b": ["времени и конструкцией estar + gerundio:", "1. Usted (esperar – estar esperando) al jefe dos horas, (querer – estar queriendo) hablar сon él del nuevo proyecto.", "2. ¿Qué (hacer – estar haciendo) ahora el director? – (Hablar – estar hablando) por teléfono con los clientes y no (poder – estar pudiendo) atenderle.", "3. Doña Marta (trabajar – estar trabajando) en el jardín y no", "(oír – estar oyendo) que tú (llamarla – estar llamándola).", "4. Jorge nunca (decirles – estar diciéndoles) la verdad a sus amigos. ¿Por que siempre (mentirles – estar mintiéndoles)?", "5. Yo (buscar – estar buscando) mis libros una hora. ¿Tú no", "(saber – estar sabiendo) dónde están?", "6. ¿Qué (hacer – estar haciendo) ahora la abuela? – Ella", "(preparar – estar preparando) la cena.", "7. Los niños ahora (jugar – estar jugando) en el patio, la madre", "(poner – estar poniendo) orden en el hogar, y el padre (leer – estar leyendo) un periódico.", "8. La secretaria no está ahora, porque (tomar – estar tomando)", "café en la cafetería cerca de la oficina.", "9. ¿Por qué tú no (escucharme – estar escuchándome)? – Yo", "(escucharte – estar escuchándote) con mucha atención pero no", "(comprenderte – estar comprendiéndote).", "10. ¿Dónde están los niños? – María (vestirse – estar vistiéndose)", "y Juanito (dormir – estar durmiendo)."]}, {"h": "Ejercicio 14. Переведите на испанский язык:", "b": ["1. Я ищу свои очки уже целый час, но никак не могу найти их.", "2. Он никогда не обращает внимания на твои советы. Зачем ты продолжаешь их ему давать?", "3. Где твои друзья? – Они сейчас в библиотеке, читают книги и готовят доклад по истории.", "4. Уже 8:45, а ты все еще продолжаешь завтракать. Тебе надо выходить из дома через 15 минут.", "5. Где сейчас твоя сестра? – Она в своей комнате, она одевается.", "6. Они всегда смеются, вспоминая эту историю.", "7. Ты не можешь уехать, не попрощавшись с ними. – У меня нет времени, я спешу. Я им позвоню.", "8. Что сейчас делает Анна? – Она разговаривает по телефону с владельцем квартиры.", "9. Что ты нам говоришь? Мы тебя не слышим, здесь очень шумно.", "10. Дети сейчас спят, муж читает газету, а я готовлю ужин.", "Тема: Повседневные", "занятия", "\u0002 Прочитайте и запомните слова и выражения, относящиеся к повседневным занятиям:", "actividades cotidianas /", "повседневные дела", "rutina diaria", "costumbre f", "привычка", "soler (1b)", "иметь обыкновение", "hacer gimnasia", "делать зарядку", "hacer la cama", "застилать кровать", "poner la mesa", "накрывать на стол", "lavar la vajilla", "мыть посуду", "ir de compras", "ходить за покупками", "preparar el desayuno", "готовить завтрак", "desayunar", "завтракать", "almuerzo m", "обед", "almorzar (1b)", "обедать", "cena f", "ужин", "cenar", "ужинать", "poner orden m", "наводить порядок", "lavar la ropa", "стирать белье", "planchar", "гладить", "вытирать пыль", "quitar el polvo", "приводить в порядок", "arreglar", "cuidar (el jardín)", "ухаживать (за садом)", "cuidar (a los niños)", "заботиться (о детях)", "dormir la siesta", "спать после обеда", "ver la tele", "смотреть телевизор", "navegar por Internet", "сидеть в Интернете", "Siesta – послеобеденный сон. Днем испанцы, особенно жители сельской местности, ложатся спать. В больших городах эта традиция почти исчезла. Однако в выходные и праздничные дни после обеда почти все испанцы спят с удовольствием."]}, {"h": "Ejercicio 17. Прослушайте текст «Actividades coti -", "b": ["dianas».", "a) Запишите цифрами время, которое упоминается в", "тексте:", "1. El despertador suena a las __________", "2. Nicolás se levanta a las _________", "3. El estudiante sale de casa a las ________", "4. Las clases empiezan a las __________", "5. El joven estudia desde las 9:00 hasta las ___________", "6. Nicolás va al cine a las __________", "7. El joven vuelve a casa a las ___________", "б) Ответьте на вопросы:", "1. ¿Qué es Nicolás?", "2. ¿Por qué por la mañana Nicolás no se limpia los dientes ni hace la cama?", "3. ¿Cómo va a la universidad?", "4. ¿Qué hace él en la universidad?", "5. ¿Adónde tiene que ir Nicolás después de las clases y qué hace en realidad?", "6. ¿Adónde va con su nueva amiga por la tarde?", "7. ¿A qué hora hace Nicolás sus deberes?"]}, {"h": "Ejercicio 19. Расскажите, как проходят будни у сеньоры.", "b": []}, {"h": "Ejercicio 21. Ответьте на вопросы:", "b": ["1. ¿A qué hora te despiertas?", "2. ¿A qué hora te levantas?", "3. ¿Sueles hacer gimnasia por la mañana?", "4. ¿Prefi eres lavarte con agua fría o con agua caliente?", "5. ¿Te limpias los dientes por la mañana o por la noche?", "6. ¿Prefi eres ducharte o bañarte por las mañanas?", "7. ¿Te vistes rápido o despacio?", "8. ¿Desayunas en casa? ¿Quién te prepara el desayuno?", "9. ¿De quién te despides cuando sales de casa?", "10. ¿A qué hora te vas a la oficina (a la universidad)?", "11. ¿Cómo vas a la oficina (a la universidad)?", "12. ¿A qué hora empieza tu trabajo (las clases)?", "13. ¿De qué te ocupas en la universidad (en la oficina)?", "14. ¿A qué hora almuerzas? ¿Dónde sueles almorzar?", "15. ¿A qué hora normalmente vuelves a casa?", "16. ¿Quién prepara la cena y lava la vajilla en tu casa?", "17. ¿Pones orden en casa todos los días?", "18. ¿Ves la tele por la noche? ¿Tienes programas favoritos o prefi eres ver películas?", "19. ¿A qué hora empiezas a hacer los deberes?", "20. ¿A qué hora te acuestas? ¿Te duermes en seguida?"]}, {"h": "Ejercicio 22. Расскажите, как проходит рабочий день", "b": ["у Вас, у членов Вашей семьи или у друзей."]}], "8": [{"h": "Ejercicio 1. Образуйте наречия от прилагательных и", "b": ["переведите их на русский язык:", "largo", "fuerte", "prudente", "difícil", "cariñoso", "triste", "tímido", "frío", "fácil", "regular", "sencillo", "feliz", "atento", "alegre", "cordial"]}, {"h": "Ejercicio 2. Ответьте на вопросы по образцу:", "b": ["a) Yo hablo rápidamente, ¿y vosotros? → Nosotros hablamos más / menos rápidamente que tú.", "1. Yo vivo cerca del centro de la ciudad, ¿y ustedes?", "2. Yo me acuesto tarde, ¿y tú?", "3. Yo vengo temprano a casa, ¿y ella?", "4. Yo estudio bien, ¿y él?", "5. Yo hablo mucho, ¿y usted?", "b) Yo hablo rápidamente, ¿y vosotros? → Nosotros hablamos tan rápidamente como tú.", "1. Yo quiero irme lejos de aquí, ¿y ella?", "2. Yo la escucho atentamente, ¿y vosotros?", "3. Yo hago gimnasia regularmente, ¿y él?", "4. Yo como poco, ¿y tú?", "5. Me siento mal, ¿y usted?"]}, {"h": "Ejercicio 3. Измените фразы по образцу:", "b": ["Me levanto temprano. → Me levanto muy temprano /", "tempranísimo. → Quiero levantarme lo más temprano posible.", "1. Leemos diálogos altamente.", "2. Tú juegas bien al tenis.", "3. Me voy lejos de aquí.", "4. Coméis poco.", "5. Ellos trabajan mucho."]}, {"h": "Ejercicio 4. Вставьте наречия también или tampoco:", "b": ["1. No tengo hambre. Vosotros … tenéis hambre.", "2. El padre se ducha con agua fría. El hijo … se ducha con agua fría.", "3. Mi tío no es viejo. La tía no es vieja …, es joven.", "4. Usted es economista y mi hermano … es economista.", "5. No me gusta levantarme temprano a ti … te gusta."]}, {"h": "Ejercicio 5. Переведите на испанский язык:", "b": ["1. Лола говорит по-испански быстро и правильно. Я тоже хочу говорить по-испански так же быстро, как и она.", "2. Ты должен лечь спать сегодня как можно раньше, потому что завтра у тебя трудный день.", "3. Мои дети не любят делать зарядку. – Мои тоже не любят.", "4. Бабушка очень редко слушает новости, она предпочитает смотреть старые фильмы.", "5. Я возвращаюсь с работы позже тебя, поэтому ты готовишь ужин.", "6. Эти студенты переводят тексты хуже, чем те, поэтому им надо заниматься как можно больше.", "7. Елена ест очень мало. Я тоже ем мало, меньше ее.", "8. Ты не можешь заснуть, потому что очень много думаешь о своих проблемах, и я тоже не сплю.", "9. Мы чувствуем себя лучше, потому что больше гуляем и отдыхаем.", "10. Вы живете ближе от работы, чем они, но приходите позже их."]}, {"h": "Ejercicio 7. Назовите и запишите буквами следую-", "b": ["щие числительные:", "112, 136, 258, 203, 333, 381, 422, 415, 555, 517, 606, 640, 769,", "704, 875, 999, 1001, 1979, 2015, 10 111, 123 456, 654 321, 8 888 888,", "115 000 000 000."]}, {"h": "Ejercicio 8. Прослушайте и запишите цифрами чис-", "b": ["лительные, которые называет диктор."]}, {"h": "Ejercicio 9. Переведите на испанский язык:", "b": ["178 самолетов, 615 автомобилей, 201 страница, 511 операций, 825 монет, 753 евро, 2025 студентов, 30 900 квадратных метров, 400 000 учеников, 1 000 000  цветов, 12 000 000 женщин,", "18 300 000 000 рублей."]}, {"h": "Ejercicio 10. Преобразуйте фразы, заменяя порядко-", "b": ["вое числительное на предложенное в скобках:", "1. ¿Vive usted en el primer piso? – No, vivo en el segundo.", "(3 – 4; 5 – 6; 7 – 8; 9 – 10)", "2. ¿Estudiáis la quinta lección? – No, estudiamos la tercera.", "(1 – 3; 2 – 4; 6 – 7; 9 – 10; 12 – 11)"]}, {"h": "Ejercicio 11. Заполните пропуски соответствующи-", "b": ["ми порядковыми числительными:", "1. Estudiamos la … lección (8).", "2. No entiendo la … pregunta (4).", "3. Vivimos en el … piso (11).", "4. Tenéis que leer el … texto (5).", "5. Él está tomando el … café (6).", "6. Usted está haciendo el … ejercicio (7).", "7. ¿Para qué quieres comprar el … ordenador (3)?", "8. El … ascensor está al lado de la escalera (2).", "9. Su poesía está en la … página (1).", "10. Estamos preparándonos para el … aniversario de nuestro club (10).", "\u0002 Следует различать глаголы estudiar, aprender, enseñar.", "Эти глаголы могут переводиться, как учить/учиться.", "Сравните:", "estudiar учиться, изучать что-л.", "Mi hijo estudia en la", "Мой сын учится в", "universidad, en la facultad de", "университет, на факультете", "Derecho.", "Права.", "Estudiamos el español.", "Мы учим испанский язык.", "aprender учиться, учить", "Luis aprende a esquiar.", "Луис учится кататься на", "лыжах.", "Aprendemos las palabras nuevas.", "Мы учим новые слова.", "El niño aprende de memoria la", "Ребенок учит", "poesía.", "стихотворение наизусть.", "enseñar учить, научить, показать", "Carlos le enseña a su amigo a", "Карлос учит своего друга", "preparar la paella.", "готовить паэлью.", "Quiero enseñarte mi coche", "Я хочу показать тебе мою", "nuevo.", "новую машину."]}, {"h": "Ejercicio 12. Выберите подходящий по смыслу гла-", "b": ["гол estudiar/aprender/enseñar и поставьте его в соответствующую форму:", "1. Elena ... a su hermana a leer y escribir.", "2. Los estudiantes tienen que ... muchas palabras nuevas.", "3. El hijo de Carmen tiene 19 años, ... economía en la universidad y vive solo en un apartamento alquilado.", "4. ¿Puedes ... en el mapa dónde está el polideportivo?", "5. Mi sobrina quiere ... a nadar, por eso yo la llevo a la piscina y allí le ... a nadar."]}, {"h": "Ejercicio 13. Переведите на испанский язык:", "b": ["1. Можешь научить меня играть в футбол? Я знаю, что ты играешь очень хорошо.", "2. Хуан хочет показать нам свою новую квартиру, которую он снимает недалеко от порта.", "3. Чтобы перевести это упражнение, тебе надо выучить все новые слова.", "4. Твой сын еще учится или уже работает? – Он еще учится в университете, но уже ищет себе работу.", "5. Мне предлагают поехать работать в Латинскую Америку, поэтому мне надо выучить испанский язык.", "Тема: Город", "\u0002 Прочитайте и запомните слова, необходимые для описания города / городского района:", "curiosidad f", "достопримечательность", "centro m", "центр", "ayuntamiento m", "мэрия", "afueras f pl", "пригород / окрестности", "calle f", "улица", "bocacalle f / callejón m", "переулок", "esquina f", "угол улицы", "avenida f", "проспект", "plaza f", "площадь", "paseo m", "бульвар", "malecón m", "набережная", "barrio m", "район", "cuadra f", "квартал (городской)", "muralla f", "городская стена", "río m", "река", "puerto m", "порт", "estación f", "вокзал", "farmacia f", "аптека", "hospital m", "больница", "policía f", "полиция", "banco m", "банк", "parque m", "парк", "museo m", "музей", "edifi cio m", "здание", "teatro m", "театр", "cine m", "кинотеатр", "monumento m", "памятник", "iglesia f", "церковь", "catedral f", "собор", "tienda f", "магазин", "mercado m", "рынок", "centro comercial", "торговый центр", "peluquería f", "парикмахерская", "estadio m", "стадион", "Correos m pl", "почта", "fuente f", "фонтан", "puente m", "мост", "norte m", "север", "sur m", "юг", "este m", "восток", "oeste m", "запад"]}, {"h": "Ejercicio 15. Опишите район, где вы проживаете, от-", "b": ["ветив на вопросы:", "¿Qué hay en su barrio? ¿Dónde está … en su barrio? ¿Qué problemas hay en su barrio? ¿Le gusta o no vivir en su barrio?", "\u0002 Прочитайте и запомните слова и выражения, необходимые для поиска пути в незнакомом городе:", "perderse (1а)", "потеряться / заблудиться", "doblar la esquina", "повернуть за угол", "cruzar la plaza", "перейти площадь", "seguir (2) todo recto", "идти все время прямо", "girar a la izquierda / a la", "повернуть налево / направо", "derecha", "tomar el metro", "сесть в метро", "a dos cuadras de aquí", "в двух кварталах отсюда", "a quinientos metros de la", "в пятистах метрах от вокзала", "estación", "subir por la calle", "подняться вверх по улице", "bajar por la avenida", "спуститься вниз по проспекту", "enseñar el camino en el", "показать дорогу на карте", "mapa", "buscar el camino", "искать дорогу", "transeúnte m/f", "прохожий"]}, {"h": "Ejercicio 17. Переведите испанские реплики на рус-", "b": ["ский язык, а русские – на испанский:", "1)", "– Как мне добраться до порта?", "– Es muy fácil. Hay que seguir esta avenida todo recto. Usted puede ir a pie o tomar el autobús.", "– Далеко отсюда?", "– El puerto está a un kilómetro de aquí.", "– Вы можете показать мне на карте?", "– Claro que sí. Con mucho gusto.", "2)", "– Señora, ¿cómo se va al museo del arte moderno?", "– Понятия не имею. А на какой улице он находится?", "– No recuerdo el nombre de la calle, solo sé que está enfrente del Banco Central.", "– Дело в том, что я не местная. Я плохо знаю этот район.", "Сожалею.", "– Perdón por la molestia."]}, {"h": "Ejercicio 19. Рассмотрите план города и объясните", "b": ["по-испански, как пройти…", "1) desde la oficina de información en la Plaza Mayor hasta el", "Monasterio de las Descalzas Reales;", "2) desde el Monasterio de las Descalzas Reales hasta la parada de autobuses en la Puerta del Sol."]}, {"h": "Ejercicio 21. Составьте план прогулки по Кадису и", "b": ["перескажите текст."]}, {"h": "Ejercicio 22. Переведите на испанский язык:", "b": ["Пешеходная прогулка от Старого Арбата", "до Красной площади", "От Старого Арбата идем направо по Гоголевскому бульвару и наслаждаемся прекрасным видом Храма Христа Спасителя*. Затем поворачиваем налево и идем по улице Волхонка мимо музея изобразительных искусств имени Пушкина**. Переходим улицу Знаменка на улицу Моховая, где открывается вид на Большой Каменный", "* Catedral de Cristo El Salvador", "** Museo de Bellas Artes", "мост. Продолжаем идти прямо до Библиотеки имени Ленина, там поворачиваем направо к Александровскому саду. Идем налево вдоль Кремлевской стены до Театральной площади, где расположен Большой театр. А справа от нас – Красная площадь. За полчаса мы проходим по самым знаковым местам Москвы."]}, {"h": "Ejercicio 23. Составьте рассказ о том, что можно по-", "b": ["смотреть и посетить в Вашем городе за один день."]}, {"h": "Ejercicio 24. Переведите на испанский язык:", "b": ["1. Я хочу показать тебе свои фотографии собора и набережной Кадиса, а ты все еще учишь новые слова восьмого урока. 2.", "Хоакин живет дальше тебя, но приходит на занятия так же рано, как и ты. Почему? – Ну и вопрос! Ведь его привозит на машине его отец, а я сначала 15 минут иду пешком, а потом сажусь в метро, поэтому я трачу на дорогу больше времени, чем он. 3. В этом районе нет достопримечательностей, но в пятистах метрах от нашего дома есть спорткомплекс, где по вечерам я играю в футбол.", "4. Здесь есть поблизости банк? – Понятия не имею. – Простите за беспокойство. 5. Друзья провожают Терезу до остановки автобуса, потому что она плохо знает этот район и может заблудиться.", "6. Они идут все время прямо по бульвару, переходят улицу, поворачивают налево, выходят на площадь и видят памятник Петру I.", "7. В этом тесте 341 вопрос, мы сейчас отвечаем на 5-ый вопрос, но я его не понимаю. Ты тоже его не понимаешь. Нам жаль. 8. Ты хочешь, как можно быстрее, научиться плавать. Я могу научить тебя плавать, но тебе придется вставать так же рано, как и мне, и очень много тренироваться."]}], "9": [{"h": "Ejercicio 1. Преобразуйте предложения, заменяя", "b": ["прилагательные на предложенные в списке:", "a) ¿Es guapa la tí a de Juan? → Sí , pero mi tí a es má s/ menos guapa que la suya.", "b) ¿Es guapa la tí a de Juan? → Me parece que la mí a es tan guapa como la suya.", "1. inteligente", "7. perezosa", "13. vieja", "2. curiosa", "8. generosa", "14. alta", "3. lista", "9. joven", "15. pobre", "4. trabajadora", "10. rica", "16. buena", "5. comunicativa", "11. elegante", "17. mala", "6. presumida", "12. prudente", "18. puntual"]}, {"h": "Ejercicio 2. Измените предложения по образцу:", "b": ["a) Esta casa es alta. → Sí , es muy alta. Es altí sima.", "b) Esta casa es alta. → Tienes razó n. Pero aquella es la má s alta de todas.", "1. Este libro es interesante.", "2. Este texto es difícil.", "3. Esta señora es elegante.", "4. Este restaurante es caro.", "5. Esta plaza es grande.", "6. Este documento es importante.", "7. Este barrio es malo.", "8. Esta señorita es guapa.", "9. Esta situación es rara.", "10. Este abogado es rico."]}, {"h": "Ejercicio 3. Переведите на испанский язык:", "b": ["1. Эти старинные часы дороже, чем те, но они мне нравятся меньше.", "2. Эта больница – самая плохая в нашем городе.", "3. Машина Хуана такая же старая, как моя.", "4. Сеньор Суарес богаче, чем ты, но он очень жадный.", "5. Секретарша начальника – самая красивая девушка в нашем офисе.", "6. Этот журнал менее интересный, чем тот.", "7. Ваша квартира меньше, чем наша, но светлее и с очень высокими потолками.", "8. Хавьер моложе своего брата на 5 лет. Он очень серьезный и воспитанный молодой человек.", "9. Это хорошая парикмахерская? – Да, очень хорошая, но парикмахерская напротив почты – самая лучшая в нашем районе.", "10. У них плохие новости? – Да, очень плохие."]}, {"h": "Ejercicio 4. Переведите на испанский язык:", "b": ["1. Хочешь пойти со мной в театр?", "2. Нам нравится рано вставать, а вам нравится?", "3. Эти упражнения для них – простые.", "4. Я не могу ехать за границу без тебя.", "5. Мы не смеемся над тобой, мы смеемся над ними.", "6. Я делаю это ради тебя, а не ради них.", "7. Он предпочитает не говорить с Вами о ней.", "8. Она думает о тебе, готовит ужин для тебя. Тебе надо позвонить ей.", "9. Сын говорит родителям, что хочет жениться на ней, потому что не может жить без нее.", "10. Полицейский спрашивает про Вас, а я не знаю, что сказать ему."]}, {"h": "Ejercicio 5. Образуйте причастия:", "b": ["llevar", "vender", "decir", "pensar", "dormir", "dar", "parecer", "abrir", "cenar", "escribir", "ser", "descubrir", "tener", "esperar", "ir", "volver", "hacer", "oí r", "poner", "venir", "llegar", "leer", "morir", "salir", "ver", "romper", "servir", "querer", "ofrecer", "jugar", "proponer", "empezar"]}, {"h": "Ejercicio 6. Ответьте на вопросы по образцу:", "b": ["a) ¿Puedes abrir la ventana? → Ya está abierta.", "1. ¿Tienes que preparar la cena?", "2. ¿Quieres escribir cartas?", "3. ¿Piensas alquilar un coche?", "4. ¿Puedes poner la mesa?", "5. ¿Tienes que traer sillas?", "6. ¿Quieres ver esta película?", "7. ¿Piensas vender el espejo antiguo?", "8. ¿Puedes atender a aquellas señoras?", "9. ¿Quieres comprar periódicos?", "10. ¿Puedes hacer la maleta?", "b) ¿Vas a hacer los ejercicios? → Ya tengo hechos los ejercicios.", "1. ¿Vais a comprar un coche nuevo?", "2. ¿Va a preparar Ud. el almuerzo?", "3. ¿Vas a escribir una carta a tu abuelo?", "4. ¿Vais a leer estos artículos?", "5. ¿Vas a pagar la deuda?", "6. ¿Van Uds. a vender sus sillas?", "7. ¿Vas a poner la mesa?", "8. ¿Va usted a traducir estas poesías?", "9. ¿Van a resolver ellos este problema?", "10. ¿Vas a construir una piscina?"]}, {"h": "Ejercicio 7. Проспрягайте следующие словосочета-", "b": ["ния в pretérito perfecto compuesto:", "ya escribir el ejercicio pero no leer el texto todavía ya levantarse y hacer la cama esta semana ir al cine y ver una película interesante este mes resolver el problema y devolver la deuda yo Dolores y yo tú vosotras", "Isabel Sara y Andrés", "usted ustedes"]}, {"h": "Ejercicio 8. Поставьте глаголы в соответствующую", "b": ["форму рretérito perfecto compuesto:", "1. Ya es tarde. ¿Por qué los niños todavía no (acostarse)?", "2. Esta semana (encontrar, nosotros) un piso pero mis padres no", "(querer) pagar el alquiler.", "3. Tengo tanto frío. ¿Quién (abrir) la ventana? – Yo no (hacerlo).", "4. No recuerdo dónde (poner, yo) mis gafas.", "5. Celia (romper) su nuevo reloj y no (decírselo) a José.", "6. Este año en nuestra ciudad (construir, ellos) un cine nuevo.", "7. Hoy yo no (tener) suerte, (despertarse, yo) a las ocho y cuarto,", "(llegar, yo) tarde a la oficina.", "8. Tú nunca (comprenderme), siempre (reír, tú) de mí.", "9. Esta semana los nietos (ir) a ver a sus abuelos y (volver) muy contentos.", "10. Esta tarde (llamarte y pedirte, yo) comprar leche y tú", "(traernos) vino."]}, {"h": "Ejercicio 9. Переведите на испанский язык:", "b": ["1. Хуан уже купил билет, собрал чемодан и попрощался с нами.", "2. Кто сломал стул и разбил окно? – Я этого не делал.", "3. Почему твой муж в этом году не поехал с тобой в отпуск? –", "Он сказал, что не может.", "4. Фильм, который вы посмотрели сегодня днем, вам не понравился.", "5. Сегодня утром Марта прочитала письмо своего жениха и загрустила.", "6. Почему ты думаешь, что этот художник уже умер? Кто тебе об этом сказал?", "7. Мы еще не ужинали, потому что мама еще не вернулась из магазина.", "8. На этой неделе они продали свою старую машину и купили новую.", "9. Дети, вы уже проснулись, умылись, оделись? – Да, но мы еще не завтракали.", "10. Тереза не пришла сегодня на работу, потому ее дочка заболела.", "\u0002 Глагол tratar имеет разные значения:", "tratar algo (un asunto, un problema, una cuestión) обсудить что-л. (дело, проблему, вопрос)", "tratar a alguien обращаться /общаться с кем-л.", "tratar bien / mal a alguien относиться хорошо/ плохо к кому-либо tratar con alguien иметь дело с кем-либо tratar de algo рассказывать / повествовать о чем-л.", "tratar de tú / de usted обращаться на ты / на Вы", "tratar de + inf. пытаться /стараться сделать что-либо"]}, {"h": "Ejercicio 10. Переведите предложения:", "b": ["а) с испанского языка на русский", "1. Juan trata de explicarte el camino pero no lo escuchas.", "2. ¿De qué se trata en esta novela? 3. Prefi ero no tratar con tal gente.", "4. El viejo profesor trata a sus estudiantes de usted. 5. La suegra trata bien a mi hermana. 6. Tenemos que tratar esta cuestión en la conferencia.", "б) с русского языка на испанский", "1. Мы уже обсудили этот вопрос с коллегами по работе. 2. Испанские студенты обращаются к преподавателям на ты. 3. Я не хочу иметь с тобой дело, потому что ты всегда лжешь. 4. В этой песне говорится о грустной истории любви. 5. Сегодня утром он попытался поговорить с ней, но не смог. 6. Почему ты так плохо ко мне относишься? Я не сделал тебе ничего дурного.", "Тема: Городской", "транспорт", "\u0002 Прочитайте и запомните полезные слова и выражения, необходимые для поездки на автобусе:", "transporte público", "общественный транспорт", "transporte urbano", "городской транспорт", "parada de autobús", "автобусная остановка", "viaje m", "поездка / путешествие /", "проезд", "viajar", "путешествовать", "pasajero m", "пассажир", "conductor m", "водитель", "próxima parada", "следующая остановка", "plano m", "схема / план (местности)", "ruta f / línea f", "маршрут", "tráfi co m", "дорожное движение", "subir al (autobús)", "сесть в (автобус)", "bajar del (autobús)", "выйти из (автобуса)", "ceder asiento m", "уступить место", "tarjeta de transporte", "проездной билет / карточка", "urbano", "horario m", "расписание", "paso m", "пешеходный переход", "ir en dirección contraria", "ехать в обратном", "направлении", "perder (1a) el autobús", "опоздать на автобус", "costar (1b)", "стоить"]}, {"h": "Ejercicio 13. Переведите на испанский язык:", "b": ["1. Послушайте! Где я могу посмотреть схему маршрутов автобусов?", "2. До Центрального Вокзала Вы можете доехать на автобусе", "№ 2 серой линии, который идет в противоположном направлении. Остановка автобуса находится напротив, поэтому Вам надо перейти улицу.", "3. Вам надо выйти на пятой остановке. Поездка длится минут", "8-10.", "4. Одна поездка на автобусе стоит 1,50 €.", "5. У меня нет проездного билета.", "6. Вот Вам сдача 8,50 € с купюры в 10 €.", "7. Вы собираетесь платить? – Да, конечно.", "8. Водитель предупреждает пассажира, что ему нужно выходить на следующей остановке.", "\u0002 Прочитайте и запомните полезные слова и выражения, необходимые для поездки на метро:", "estación del metro", "станция метро", "entrada f", "вход", "salida f", "выход", "taquilla f", "билетная касса", "máquina expendedora", "автомат для продажи", "проездных билетов /", "платежный терминал", "origen m", "станция отправления", "destino m", "станция назначения", "cambiar de línea", "сделать пересадку на", "другую линию (дословно:", "поменять линию)", "correspondencia f", "зд. станция пересадки", "escalera mecánica", "эскалатор", "andén m", "перрон / платформа", "¿De qué color es la Línea 5?", "Какого цвета пятая линия?", "rojo", "красный", "verde", "зеленый", "azul", "синий", "amarillo", "желтый", "gris", "серый", "marrón", "коричневый"]}, {"h": "Ejercicio 15. Переведите испанские реплики на рус-", "b": ["ский язык, а русские – на испанский:", "Tienes que cambiar de línea.", "Вы можете купить билет в", "автомате или в кассе.", "Los niños menores de 4 años", "viajan sin billete.", "Билет надо сохранять до", "конца поездки."]}, {"h": "Ejercicio 16. Объясните по-испански, как в Москве", "b": ["доехать на метро от станции Беляево до станции Парк Победы.", "\u0002 Прочитайте и запомните полезные слова и выражения, необходимые для поездки на такси:", "taxímetro m", "счетчик", "pagar al taxista", "заплатить таксисту", "equipaje m", "багаж", "maletero m", "багажник", "abrocharse el cinturón de", "пристегнуть ремень", "seguridad", "безопасности", "prohibido fumar", "курить запрещено", "prohibido parar", "остановка запрещена", "atasco m", "пробка (на дороге)", "carretera f", "шоссе"]}, {"h": "Ejercicio 20. Расскажите, каким общественным тран-", "b": ["спортом пользуются жители Вашего города. Как Вы предпочитаете передвигаться по городу."]}, {"h": "Ejercicio 21. Переведите на испанский язык:", "b": ["1. Сегодня утром мне не повезло, я села в автобус и обнаружила, что у меня нет проездного билета. 2. Водитель сказал, что, чтобы добраться до станции метро, нам надо выйти на следующей остановке и пересесть на автобус, который идет в обратном направлении. 3. Хорхе самый молодой актер в нашем театре, поэтому он обращается ко всем на Вы и ко мне тоже, хотя он моложе меня всего на два года. 4. Почему вы вернулись так поздно?  – Ты еще не смотрела телевизор, поэтому не знаешь, что в городе огромные пробки. 5. В этой статье говорится об общественном транспорте столицы. Автор написал, что", "Московское метро – самое красивое и лучшее в мире. 6. Мерседес не хочет ехать с тобой на вокзал на метро, потому что ей надо делать пересадку с серой линии на зеленую, она предпочитает взять такси. 7. У меня уже готов завтрак, стол накрыт, а вы еще не умылись, не убрали кровати и не оделись. 8. На этой неделе нам предложили перевести текст с испанского языка на английский, но без тебя мы не смогли это сделать."]}], "10": [{"h": "Ejercicio 1. Проспрягайте следующие словосочета-", "b": ["ния в futuro simple:", "pensar en la vida", "reír de sus palabras", "hacer la maleta", "salir temprano", "preferir ir en tren", "decir la dirección", "traducir del ruso al español", "venir a tiempo", "yo", "Dolores y yo", "tú", "vosotras", "Isabel", "Sara y Andrés", "usted", "ustedes"]}, {"h": "Ejercicio 2. Поставьте глаголы в соответствующую", "b": ["форму futuro simple и переведите предложения на русский язык:", "a)", "1. Mañana el tren (salir) a las seis en punto.", "2. La semana que viene nosotros (venir) a verte.", "3. Los padres (ir) de viaje con su hija a Cuba el año siguiente.", "4. Ellos nos (decir) los resultados de la operación pasado mañana.", "5. El próximo mes los Muñoz (alquilar) otro piso.", "6. Nosotros (volver) dentro de 5 minutos.", "7. Luis dice que los vecinos también (querer) venir mañana a nuestra fi esta.", "8. La semana siguiente ellos (tener) poco trabajo.", "9. Dentro de tres meses tú (saber) hablar el español bien.", "10. Después del almuerzo mi tío y yo (dar) un paseo por el parque.", "b)", "1. ¿Cuántos hijos tiene Silvia? – (Tener) seis hijos.", "2. Ahora ellos (vivir) en Dinamarca.", "3. ¿De dónde es Helga? – (Ser) de Suiza.", "4. ¿Por qué no ha venido el jefe? – (Estar) enfermo.", "5. ¿Dónde están tus amigos? – (Jugar) al fútbol.", "6. A esta hora (haber) atascos en la carretera.", "7. ¿No (saber, tú) la dirección de tu primo?", "8. ¿Qué está haciendo la hermana? – (Hablar) por teléfono o", "(ver) la tele.", "9. Este coche deportivo (costar) muchísimo.", "10. ¿No (conocer, vosotros) a los vecinos del quinto?"]}, {"h": "Ejercicio 3. Измените предложения по образцу:", "b": ["Siempre me levanto a las 7. → Mañana me levantaré a las 7 tambié n.", "1. Siempre desayuno en casa.", "2. Salimos de la Universidad a las 4.", "3. Los estudiantes leen y escriben mucho.", "4. Carmen siempre descubre mis secretos.", "5. Veo dos películas por la noche.", "6. Tenemos prisa por eso vamos en taxi.", "7. Quiero decir la verdad pero no puedo.", "8. Lola hace la cena y nosotros ponemos la mesa.", "9. Anita y Pablito siempre rompen sus juguetes.", "10. Aquí hay mucho tráfi co y no podemos llegar a tiempo."]}, {"h": "Ejercicio 4. Ответьте на вопросы по образцу:", "b": ["¿Has visto a Carmen hoy? → No, la veré dentro de dos horas.", "1. ¿Habé is visitado el museo del Prado? → … el año que viene.", "2. ¿Ha escrito ya tu hermano el artí culo? → … la próxima semana.", "3. ¿Has roto aquellas cartas? → … mañana.", "4. ¿Ha comprado ya el tí o Marti los regalos? → … pasado mañana.", "5. ¿Habéis hecho los deberes? → … dentro de media hora.", "6. ¿Ha vendido tu abuelo su castillo? → … el próximo año.", "7. ¿Habé is visto pelí culas cubanas? → … el mes siguiente.", "8. ¿Ha puesto usted la tele? → … dentro de cinco minutos.", "9. ¿Han dicho los resultados de la operación? → … pronto.", "10. ¿Ha devuelto Jorge la deuda? → … pasado mañana."]}, {"h": "Ejercicio 5. Переведите на испанский язык:", "b": ["1. В следующем году они поедут в отпуск в Италию.", "2. Мы купим билеты на следующей неделе.", "3. Послезавтра Лола придет к нам в гости, и ты с ней познакомишься.", "4. Почему дедушка не играет со мной? – Наверное, он плохо себя чувствует или устал.", "5. Завтра я узнаю, в котором часу уходит поезд, и тебе об этом скажу. Сможешь проводить меня на вокзал?", "6. Сколько лет Анне? – Ей лет 20-25.", "7. Вы (vosotros) полетите на самолете или поедете на поезде? – Я думаю, что моя жена захочет поехать на поезде.", "8. Им понравится эта квартира, и они ее снимут.", "9. Завтра ты выйдешь из дома пораньше и приедешь на работу вовремя.", "10. Мы сможем посмотреть этот фильм через неделю."]}, {"h": "Ejercicio 6. Ответьте на вопросы по образцу:", "b": ["a) ¿Quieres comer algo? → No quiero comer nada. ∕ Nada quiero comer.", "1. ¿Ves a alguien?", "2. ¿Está s diciendo algo?", "3. ¿A quié n quieres?", "4. ¿De quié n está s hablando?", "5. ¿A quié n vas a hacer esta pregunta?", "6. ¿Con quié n desayunas?", "7. ¿Sabes algo de Marí a?", "8. ¿Oyes algo?", "b) ¿Quié n tomará café? → Nadie lo tomará. → Ninguno de nosotros lo tomará.", "1. ¿Quié n abrirá la ventana?", "2. ¿Quié n hará la cama?", "3. ¿Quié n pondrá la mesa?", "4. ¿Quié n traerá los billetes?", "5. ¿Quié n cerrará la puerta?", "6. ¿Quié n irá a ver esta película?", "7. ¿Quié n perderá el tren?", "8. ¿Quié n descubrirá mi secreto?", "c) ¿Has conducido coches deportivos? → Nunca he conducido ningún coche deportivo.", "1. ¿Habéis leído poesías de Lorca?", "2. ¿Ha trabajado usted en el banco BBV?", "3. ¿Has roto tu teléfono móvil?", "4. ¿Ha perdido usted el tren de la mañana?", "5. ¿Habéis tenido problemas con la policía?", "6. ¿Le ha traído el tío un regalo a su sobrino?", "7. ¿Has viajado en barco?", "8. ¿Han tomado ustedes vinos chinos?"]}, {"h": "Ejercicio 7. Заполните пропуски соответствующим", "b": ["местоимением или наречием:", "algo, alguien, alguno, alguna, algunos, algunas, nada, nadie, ninguno, ninguna, nunca", "1. Quiero comer ... .", "2. Por la mañana el padre lee ... periódico.", "3. Juan no hace ... , porque es perezoso.", "4. En nuestro grupo ... estudiantes son de Francia.", "5. En mi cuarto no hay ... espejo.", "6. Ana no pregunta ... al profesor.", "7. Pedro ... va de compras con sus padres.", "8. ¿Conoces a ... de tus vecinos?", "9. No sabe bailar bien ... de mis amigas.", "10. ¿Esperas a ...? – No espero a ... ."]}, {"h": "Ejercicio 8. Переведите на испанский язык:", "b": ["1. Никто ничего не знает.", "2. Я никогда не езжу в отпуск без тебя.", "3. В нашем городе нет никаких музеев.", "4. На этой улице есть какая-нибудь аптека? – Нет, здесь нет никакой аптеки.", "5. Он не помнит никого из них.", "6. Перед сном дедушка любит что-нибудь почитать.", "7. В 10 часов вечера Терезе кто-то звонит по телефону и ничего не говорит.", "8. Кто-нибудь из Вас знает, где находится стоянка такси?", "9. Ты видишь кого-нибудь? – Я не вижу никого.", "10. Здесь есть поблизости какой-нибудь банк? – Да, есть какой-то."]}, {"h": "Ejercicio 9. Измените предложения по образцу:", "b": ["Traduzco este texto. → Traduzco todos los textos.", "1. Me gusta esta película de Almodóvar.", "2. Este consejo de mi amigo es muy bueno.", "3. Esta tarde después de la siesta trabajo en el jardín.", "4. Vamos a ver a nuestros padres esta semana.", "5. Este año vas a España.", "6. Esta mañana empiezo a estudiar a las nueve en punto.", "7. Este coche deportivo es caro.", "8. Esta poesía de Jorge es muy romántica."]}, {"h": "Ejercicio 10. Переведите на русский язык:", "b": ["1. Todas las mañanas hago gimnasia.", "2. ¿Por qué no me has llamado toda una semana?", "3. Todo abogado sabrá contestar a esta pregunta.", "4. Mañana cumplirás 18 años y daremos toda una fi esta.", "5. Todo está hecho, podemos irnos.", "6. Don Sergio es todo un profesional, por eso lo sabe y lo comprende todo.", "7. Eres un egoísta, todos están esperándote toda una hora.", "8. Hay que llamarlos y avisarlos en todo caso."]}, {"h": "Ejercicio 11. Ответьте на вопросы по образцу:", "b": ["¿Vive usted en esa casa? → No, vivo en otra.", "1. ¿Va usted en ese tren?", "2. ¿Estudias en este colegio?", "3. ¿Trabaja usted en esta peluquería?", "4. ¿Lee usted estos periódicos?", "5. ¿Te pondrás esta bufanda?", "6. ¿Vais a ver esta película?", "7. ¿Vives en este barrio?", "8. ¿Van a comprar ustedes estas fl ores?"]}, {"h": "Ejercicio 12. Переведите на русский язык:", "b": ["1. Me lo preguntas cada mañana.", "2. Prefi ero leer otras revistas.", "3. Cada uno tiene sus problemas.", "4. Un niño cualquiera sabrá aprender esta poesía.", "5. ¿Puede usted darme otros consejos?", "6. En esta habitación viven dos estudiantes: una es alemana y la otra es española.", "7. Tenemos que tomar medicinas cada seis horas.", "8. No me gusta este bar, vamos a otro.", "9. Aquí hay dos regalos: uno es para ti y el otro es para tu hermano.", "10. Puedes comprar billetes para este tren en cualquier taquilla."]}, {"h": "Ejercicio 13. Заполните пропуски соответствующи-", "b": ["ми местоимениями:", "todo, toda, todos, todas, cada, otro, otra, otros, otras", "1. He leído … los artículos de este periodista.", "2. … ya está preparado para la fi esta.", "3. Conozco a Andrés, lo veo y lo saludo … día.", "4. Tenemos dos plazas de garaje: una es mía y … es de mi padre.", "5. ¿Por qué queréis alquilar … apartamento?", "6. Puedes llamarme a … hora.", "7. … dicen que Lola se ha hecho … una actriz.", "8. Nuestros hijos ya son mayores … uno tiene su familia."]}, {"h": "Ejercicio 14. Переведите на испанский язык:", "b": ["1. Каждое лето мы ездим в отпуск на море, а в этом году мы поедем в другое место.", "2. У них двое сыновей: один сын уже работает, а другой еще учится в университете.", "3. Каждый меня об этом спрашивает, а я не могу об этом говорить.", "4. Инес и Хавьер не захотят идти с нами, они хотят пойти в другой кинотеатр и посмотреть другой фильм.", "5. Всю неделю они готовятся к поездке.", "6. Любая секретарша умеет готовить кофе.", "7. Каждые три дня я навещаю свою тетю и приношу ей лекарства. Она болеет целый месяц.", "8. Вы построили настоящий дворец. Все это говорят.", "9. Мы покупаем все цветы, которые здесь есть.", "10. Я все вижу, и мне все нравится.", "Тема: Путешествие на самолете,", "поезде. Погода и явления", "природы", "\u0002 Прочитайте и запомните полезные слова и выражения, необходимые для описания погоды:", "¿Qué tiempo hace hoy?", "Какая сегодня погода?", "hace buen tiempo", "стоит хорошая погода", "hace mal tiempo", "стоит плохая погода", "hace (mucho) frío", "(очень) холодно", "hace (mucho) calor", "(очень) жарко", "hace sol", "светит солнце (солнечно)", "hace viento", "дует ветер (ветрено)", "10 grados sobre / bajo cero", "10 градусов выше / ниже нуля", "llueve (llover 1b)", "идет дождь", "lluvia f", "дождь", "nieva (nevar 1a)", "идет снег", "nieve f", "снег", "niebla f", "туман", "tormenta f", "гроза / буря / шторм", "huracán m", "ураган", "nevada f", "снегопад", "congelación f", "обледенение", "Например:", "Hoy hace buen tiempo. Hace", "Сегодня хорошая погода. Тепло,", "calor pero no hace sol porque el", "но солнца нет, потому что небо", "cielo está nublado. Parece que", "покрыто облаками. Кажется,", "lloverá y habrá una tormenta.", "пойдет дождь и будет гроза.", "Mañana hará mucho frío. La", "Завтра будет очень холодно.", "temperatura será de 20 grados", "Будет 20 градусов ниже нуля, и", "bajo cero y estará nevando todo", "весь день будет идти снег.", "el día."]}, {"h": "Ejercicio 15. Опишите, какая сегодня стоит погода, ка-", "b": ["кая погода будет завтра, какая погода была на этой неделе.", "\u0002 Прочитайте и запомните слова, необходимые для путешествия на самолете:", "aeropuerto m", "аэропорт", "avión m", "самолет", "vuelo m", "экипаж", "azafata f", "командир", "tripulación f", "регистрация", "comandante m", "(зд.) место у прохода", "facturación f", "(зд.) место у окна", "pasillo m", "таможня", "ventana f", "досмотр (багажа)", "aduana f", "багаж", "registro m", "чемодан", "equipaje m", "сумка (дорожная / хозяйственная)", "maleta f", "отправление", "bolsa f", "прибытие", "salida f", "посадка (на самолет)", "llegada f", "задержка (рейса)", "embarque m", "отмена (рейса)", "retraso f", "рейс, полет", "cancelación f", "стюардесса", "escala f", "промежуточная посадка", "carrito m", "тележка", "\u0002Прочитайте и запомните полезные выражения, необходимые для путешествия на самолете:", "reservar billetes", "забронировать билеты", "solicitar el visado en la", "запросить визу в посольстве", "embajada", "llegar al aeropuerto dos", "приехать в аэропорт за два", "horas antes del vuelo", "часа до вылета", "panel de información", "информационное табло", "mostrador de facturación", "стойка регистрации", "facturar el equipaje", "сдать вещи в багаж", "equipaje de mano", "ручная кладь", "tarjeta de embarque", "посадочный талон", "pagar el exceso de peso", "оплатить перевес (багажа)", "compañía aérea", "авиакомпания", "pasar el control de", "пройти паспортный контроль", "pasaportes", "llenar el impreso de", "заполнить бланк декларации", "declaración", "declarar los objetos de", "декларировать ценные вещи", "и валюту", "valor y las divisas", "зона контроля безопа сcontrol de seguridad", "ности", "прямой рейс", "vuelo directo", "беспосадочный рейс", "vuelo sin escala", "стыковочный рейс", "vuelo de conexión", "транзитный пассажир", "pasajero en tránsito", "embarcar", "пройти на посадку", "puerta de embarque", "выход на посадку", "aterrizaje de emergencia", "вынужденная посадка", "recoger el equipaje", "забрать багаж", "condiciones", "неблагоприятные", "meteorológicas desfaметеорологические условия", "vorables", "desperfectos técnicos", "технические неполадки", "(самолета)", "huelga del personal", "забастовка персонала", "atentado terrorista", "террористический акт"]}, {"h": "Ejercicio 19. Переведите на испанский язык:", "b": ["1. Завтра будет прекрасный и солнечный день.", "2. Особенно меня удивляет количество людей и машин на улицах Мехико.", "3. Сегодня такая приятная погода!", "4. Давиду кажется, что сейчас в этой части планеты деревья зеленее, а цветы – ярче, чем в Европе.", "5. Трудно водить машину в таком огромном городе, где проживает 18 млн. человек.", "6. К счастью, мне не нужна въездная виза и мне не придется выполнять некоторые формальности.", "7. Все шоссе полностью покрыты снегом, поэтому мы потратим на дорогу до аэропорта больше времени.", "8. Пассажиры, вылетающие рейсом 3449 в Лондон, должны срочно пройти на посаду к выходу 25.", "9. Давид крепко обнимает Фернанду, которая безутешно плачет.", "10. Прекрасная стюардесса с огромными черными глазами говорит, что пассажиры должны пристегнуть ремни безопасности и привести спинки кресел в вертикальное положение, потому что самолет идет на посадку."]}, {"h": "Ejercicio 20. Расскажите о своем путешествии на", "b": ["самолете. Столкнулись ли Вы с какими-нибудь трудностями или неудобствами в аэропорту или во время полета?", "\u0002 Прочитайте и запомните слова и выражения, необходимые для путешествия на поезде:", "ferrocarril m", "железная дорога", "estación f", "вокзал", "vagón m", "вагон", "tren m", "поезд", "tren rápido", "скорый поезд", "AVE (alta velocidad)", "скоростной поезд", "vía f", "путь", "andén m", "перрон / платформа", "coche-cama m", "спальный вагон", "litera f", "спальное место", "asiento m", "пассажирское место", "compartimiento m", "купе", "revisor, m", "контролер", "horario m", "расписание", "taquilla, f", "касса", "billete de ida", "билет в один конец", "billete de ida y vuelta", "билет туда и обратно", "consigna f", "камера хранения"]}, {"h": "Ejercicio 23. Если Вам предстоит дальняя поездка,", "b": ["какой вид транспорта Вы выберете: самолет или поезд?", "Объясните Ваш выбор."]}], "11": [{"h": "Ejercicio 1. Образуйте 1 л. ед. ч. pretérito indefi nido", "b": ["следующих глаголов и запишите их формы:", "atacar …", "jugar …", "cruzar …", "sacar …", "pegar …", "abrazar …", "indicar …", "apagar …", "almorzar …", "buscar …"]}, {"h": "Ejercicio 2. Проспрягайте следующие словосочета-", "b": ["ния в pretérito indefi nido:", "a) hablar con su jefe la semana pasada", "hace poco leer aquella carta y romperla", "ayer asistir a dos conferencias y volver a tiempo", "b) anteayer sentirse mal y pedir ayuda", "anoche acostarse temprano y dormirse en seguida", "el año pasado traducir la instrucción y construir un yate", "c) el mes pasado traer el nuevo proyecto e ir al extranjero el verano pasado ver esta película tres veces hace tres días saberlo pero no decírselo a nadie yo", "Dolores y yo", "tú", "Manuel y tú", "usted", "ellos"]}, {"h": "Ejercicio 3. Преобразуйте предложения, меняя ска-", "b": ["зуемое:", "1. ¿A qué hora te despertaste ayer? – Me desperté a las 9.", "(levantarse, salir del cine, tener la cita, llegar a la estación, sentirse peor, ver a Luis, empezar a estudiar, volver a casa)", "2. ¿Os bañasteis en el mar anoche? – Sí, nos bañamos anoche.", "(jugar al fútbol, traducir el artículo, venir a tiempo, trabajar, darse un paseo antes de acostarse, estar en el teatro, saber el horario, conocer al nuevo ingeniero)", "3. Anteayer Sofía se sintió mal.", "(despedirse de nosotros, ir de compras, ofrecernos su ayuda, no poder avisarnos, no hacer nada, oír una noticia agradable, leer mi carta y reír de mí, conducir el coche 5 horas)", "4. El año pasado ellos conocieron Madrid.", "(proponer una idea genial, casarse, morir durante la tormenta, construir un puente, vender su apartamento, preferir el tren al avión, seguir estudiando en el extranjero, querer ir de vacaciones a África)"]}, {"h": "Ejercicio 4. Поставьте глаголы в соответствующую", "b": ["форму pretérito indefi nido:", "1. Mis padres me (llamar) ayer por teléfono.", "2. El tren (salir) anoche con retraso.", "3. El verano pasado (llover) mucho.", "4. La semana pasada (estar, nosotros) en Valencia.", "5. Anteayer Juan (dormir) más de diez horas.", "6. Anoche (ver, nosotros) una película que no (gustarnos).", "7. Ayer Carmen (ponerse) el vestido rojo e (ir) a la cita.", "8. Pedro no (poder) venir a vernos la semana pasada.", "9. Ustedes ayer no nos (decir) el nombre del guía.", "10. El domingo pasado los niños (preferir) quedarse en casa."]}, {"h": "Ejercicio 5. Измените предложения по образцу:", "b": ["Todos los días me levanto a las 7. → Ayer me levanté a las 7 también.", "1. Hoy no tengo apetito. → Ayer tampoco ...", "2. Ellos siempre ríen de mí. → Anteayer ...", "3. Este mes llueve mucho. → El mes pasado ...", "4. Todos los sábados Enrique me trae fl ores y cenamos en este restaurante. → Anoche ...", "5. Cada mes pago el alquiler. → El mes pasado ...", "6. Todos los días Ud. viene tarde a la oficina. → Hace dos días ...", "7. Este año hay muchos turistas en España. → El año pasado ...", "8. Vosotros nunca hacéis caso de mis palabras. → Ayer tampoco ...", "9. Hoy no es mi día. → Ayer ...", "10. Cada semana Felipe y yo vamos al cine y vemos una película nueva. → La semana pasada..."]}, {"h": "Ejercicio 6. Ответьте на вопросы по образцу:", "b": ["¿Has visto a Carmen? → … (ayer) – Sí, la vi ayer.", "1. ¿Has descubierto el secreto? → … (la semana pasada)", "2. ¿Ha traducido Ud. las cartas? → … (ayer)", "3. ¿Habéis traído vuestras fotos? → … (anteayer)", "4. ¿Has hecho la maleta? → … (anoche)", "5. ¿Te lo ha dicho Alicia? → … (hace tres días)", "6. ¿Han pedido ayuda tus hermanos? → … (hace poco)", "7. ¿Has devuelto la deuda? → … (el mes pasado)", "8. ¿Se ha sentido mejor la abuela? → … (anoche)", "9. ¿Ha leído el jefe nuestra carta? → … (anteayer)", "10. ¿Han sabido los estudiantes el horario? → … (ayer)"]}, {"h": "Ejercicio 7. Поставьте глаголы в соответствующую", "b": ["форму pretérito indefi nido:", "El viernes pasado (ir, nosotros) a ver a nuestros parientes a La", "Camocha. Nuestro viaje (ser) horrible. Mi mujer y yo (tener) mala suerte. El coche (averiarse) varias veces y no (poder, nosotros) llegar a nuestro destino. El primer día de viaje (hacer) un tiempo malísimo.", "(Estar) lloviendo todo el día y yo (conducir) muy despacio. Yo no", "(ver) nada por la lluvia y la espesa niebla. Nosotros (decidir) pasar la noche en un hostal y al día siguiente (ponerse, nosotros) muy temprano en carretera. Pero el radiador del coche (estropearse) y no (llegar, nosotros) muy lejos. (Tener, yo) que llamar una grúa. Sin", "embargo, eso no (ser) todo. Cuando (querer, nosotros) continuar el viaje, (haber) otro problema: mi mujer (sentirse) mal. (Ir, yo) a la farmacia y (traerle) la medicina que no (hacerle) ningún efecto. Yo", "(proponer) llevarla al hospital, pero ella (preferir) volver a casa.", "а) Сделайте это же упражнение, изменив первое лицо на третье."]}, {"h": "Ejercicio 8. Переведите на испанский язык:", "b": ["1. В прошлом году я два раза ездил в Италию и во Францию, эти страны мне очень понравились.", "2. Три дня назад Кармен почувствовала себя плохо и не пришла к нам в гости.", "3. На прошлой неделе мы были в Лондоне.", "4. Вчера была хорошая погода, и мы смогли погулять по улицам города и посмотрели некоторые достопримечательности.", "5. В пятницу мой начальник предложил мне пообедать в итальянском ресторане.", "6. Прошлым летом Антонио познакомился с Розой, влюбился в нее, а недавно он на ней женился.", "7. Пять дней назад мой друг попросил меня перевести несколько документов на немецкий язык, и я ему их перевел.", "8. В воскресенье дети проснулись в 9 часов утра, но не захотели сразу вставать.", "9. Позавчера Хуан заснул в 2 часа ночи, утром не услышал будильник и опоздал на поезд.", "10. Вчера нам сказали результаты экзамена, и мы расстроились."]}, {"h": "Ejercicio 9. Переведите на русский язык:", "b": ["1. Yo le he dicho a usted que nosotros mismos lo haremos.", "2. Todos los días tú llegas a la oficina con el mismo retraso.", "3. Sebastián e Inés siguen viviendo en el mismo pueblo.", "4. El abogado mismo pagó la cuenta.", "5. Mañana mismo iremos a la embajada para solicitar el visado."]}, {"h": "Ejercicio 10. Переведите на испанский язык:", "b": ["1. Дети сами приготовили ужин и накрыли на стол.", "2. Мы сегодня же им позвоним и пригласим их на конкурс.", "3. Они приехали в Мадрид вчера и в тот же день выехали в", "Барселону.", "4. Мой муж продолжает работать в том же банке.", "5. Я сама отвезу детей в школу и там же их подожду.", "\u0002 Глагол tocar имеет разные значения:", "tocar algo трогать, дотрагиваться до чего-либо,", "прикасаться", "tocar (el piano, el violín) играть (на фортепиано,", "скрипке)", "tocar a la puerta стучать, звонить в дверь", "tocar a alguien касаться кого-либо", "tocar (el tema) коснуться, затронуть (тему)"]}, {"h": "Ejercicio 11. Переведите предложения:", "b": ["а) с испанского языка на русский", "1. Te prohíbo tocar mis documentos. 2. Mi hermana menor toca muy bien el piano. 3. Alguien toca a la puerta, voy a abrirla. 4. Tus problemas no me tocan. 5. Ayer preferimos no tocar el tema de la crisis en nuestra conversación. 6. Hoy te toca a ti recoger al niño del colegio.", "б) с русского языка на испанский", "1. Почему ты решил научиться играть на скрипке? 2. Мы не захотели касаться этого вопроса. 3. Кто-то стучит в дверь, надо пойти посмотреть, кто это. 4. В музее нельзя трогать экспонаты.", "5. Чья сегодня очередь мыть посуду? 6. Приказ (orden f) директора касается всех."]}, {"h": "Ejercicio 12. Проспрягайте следующие словосочета-", "b": ["ния в pretérito imperfecto:", "prepararse para la entrevista", "vestirse elegante y salir temprano", "a menudo dar un paseo antes de acostarse", "cada mes ir al teatro y ver un espectáculo", "cuando ser niño preferir levantarse más tarde", "mientras desayunar oír las noticias", "Yo", "Andrés y yo", "Laura y Adela", "Tú", "Usted", "Juan y tú"]}, {"h": "Ejercicio 13. Измените предложения по образцу:", "b": ["Siempre descanso en Sochi.→ Siempre descansaba en Sochi.", "1. Siempre me das buenos consejos.", "2. Cada mes la abuela viene a vernos.", "3. Siempre vais a la oficina en coche.", "4. Carmen siempre ve alguna película antes de acostarse.", "5. Todas las mañanas hacéis gimnasia.", "6. Siempre nos despertamos temprano.", "7. A veces usted nos trae chocolate de Suiza.", "8. A menudo este tren llega con retraso.", "9. De vez en cuando leo periódicos cubanos.", "10. Por las noches José toca la guitarra en este bar."]}, {"h": "Ejercicio 14. Поставьте инфинитивы в соответствую-", "b": ["щую форму pretérito imperfecto:", "1. Cada vez que (viajar, nosotros) a Madrid (reservar, nosotros)", "el mismo hotel.", "2. Cuando (ser, yo) niño (gustarme) mucho comer chocolate.", "3. Siempre que (venir, él) a vernos, nos (traer) fl ores.", "4. Cuando (estudiar, vosotros) en la universidad, (comer) en una cafetería.", "5. Por las mañanas Juan (dar) un paseo por el parque en bicicleta.", "6. Cada vez que (vernos, él), (preguntarnos) por nuestros padres.", "7. Cuando (tener, yo) diez años, a menudo (ir) a descansar al campo.", "8. ¿Qué (leer, vosotros) cuando (ser) pequeños?", "9. De vez en cuando (encontrarse, nosotros) con nuestros amigos y (almorzar, nosotros) en el restaurante chino.", "10. Cuando (vivir, tú) solo a menudo (ponerse, tú) triste."]}, {"h": "Ejercicio 15. Переведите на испанский язык:", "b": ["1. Когда мои дети учились в школе, они ходили в школу пешком, потому что у нас не было машины.", "2. Когда я была маленькой, мы с мамой часто гуляли в этом парке.", "3. Летом вы каждый день вставали рано, пили кофе и шли на пляж.", "4. Сестра Марии была очень красивой и хотела стать актрисой.", "5. Мне очень нравился этот магазин, я всегда здесь чтонибудь покупала.", "6. Когда он лгал, мы всегда об этом знали, потому что он краснел.", "7. Ты часто над ним смеялась, а потом сожалела об этом.", "8. Каждый раз, когда он приглашал ее в кино или театр, она благодарила его за приглашение, но отказывалась идти с ним.", "9. Иногда я просыпался на рассвете и больше не мог заснуть, потому что думал о тебе.", "10. По вечерам, когда шел дождь, мы читали или смотрели телевизор.", "\u0002 Глагол llevar(se) имеет разные значения:", "llevar a alguien отводить / отвозить кого-то", "llevar algo относить / отвозить / носить что-то", "llevar algún tiempo проводить время, делая что-то", "llevar a cabo осуществлять / доводить до конца", "llevarse уносить ( увозить) с собой / иметь при себе llevarse bien/mal ладить / не ладить"]}, {"h": "Ejercicio 16. Переведите предложения:", "b": ["а) с испанского языка на русский", "1. Juan y yo somos dos jugadores muy diferentes pero llevamos muchos años jugando en el mismo equipo y nos conocemos bien. 2.", "No puedes llevarme al aeropuerto en tu coche porque no te llevas el carnet de conducir. 3. Si te llevas bien con el jefe no tendrás problemas con la promoción. 4. ¿Por qué Elena no lleva gafas? –", "Las rompió ayer. 5. Mi hermano mayor nunca se me lleva a ninguna parte porque nos llevamos mal. 6. No puedo acompañaros porque todavía no he llevado a cabo algunos asuntos pendientes.", "б) с русского языка на испанский", "1. В прошлое воскресенье отец водил сына в зоопарк. 2. Художник носит усы. 3. Надо отнести посуду на кухню. 4. Павел", "10 лет работает здесь юристом. 5. У меня с собой нет зонта. 6.", "Ева не ладит со своей свекровью. 7. Мне нравится эта футболка, я ее беру (покупаю). 8. В прошлом месяце мы завершили (осуществили) свой проект.", "Тема: По магазинам.", "Покупки", "\u0002 Прочитайте и запомните названия продуктов и отделов в продуктовом магазине:", "alimentos m pl", "продукты", "panadería f", "булочная", "pan m", "хлеб", "bollo m", "булочка", "pastel m", "пирожное", "carnicería f", "мясной отдел", "carne f", "мясо", "ca
