<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЛингваЖурнал — помощник репетитора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1E9; --card:#FFFFFF; --card2:#FBFAF3; --line:#E3DECD; --line2:#D8D2BE;
  --ink:#182C2E; --mut:#6B787C; --soft:#93A09E;
  --teal:#0E5A5F; --teal2:#0A4348; --tealsoft:#E2EEEC;
  --pen:#DE4E34; --pensoft:#FBE7E2;
  --green:#2E9C63; --greensoft:#E2F3E9;
  --amber:#D9941F; --ambersoft:#FBF0DB;
  --gray:#8B979C; --graysoft:#EEF0EF;
  --gold:#C99118;
  --disp:'Unbounded',system-ui,sans-serif; --body:'Golos Text',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --r:14px; --shadow:0 1px 2px rgba(24,44,46,.05),0 8px 24px -14px rgba(24,44,46,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--bg);background-image:radial-gradient(rgba(14,90,95,.06) 1px,transparent 1.3px);background-size:23px 23px;font-size:14.5px;line-height:1.45}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;border:1.5px solid var(--line2);border-radius:9px;padding:8px 10px;outline:none;transition:border-color .15s, box-shadow .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(14,90,95,.13)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#C9C3B0;border-radius:8px;border:2px solid var(--bg)}
h1,h2,h3{font-weight:700}
.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== shell ===== */
#app{display:flex;min-height:100vh}
aside{width:250px;flex:none;background:linear-gradient(178deg,#123734 0%,#0B2426 100%);color:#AFC5C0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:22px 14px 16px}
.logo{font-family:var(--disp);font-weight:800;font-size:19px;color:#fff;letter-spacing:.3px;padding:0 10px;line-height:1.15}
.logo em{font-style:normal;color:#F2B33D}
.logo-sub{font-size:11px;color:#6F8B86;padding:4px 10px 18px;letter-spacing:.4px}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
.navi{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-weight:500;font-size:13.5px;color:#AFC5C0;position:relative;transition:background .18s,color .18s,transform .18s;text-align:left;width:100%}
.navi:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(3px)}
.navi.on{background:rgba(255,255,255,.12);color:#fff}
.navi.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#F2B33D}
.nbadge{margin-left:auto;background:var(--pen);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;animation:pulseB 2.4s infinite}
@keyframes pulseB{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.side-foot{padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#6F8B86}
.side-foot b{color:#CFE0DC;display:block;font-size:13px;margin-bottom:2px}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:14px 28px;background:rgba(243,241,233,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-greet{font-family:var(--disp);font-weight:700;font-size:15px}
.tb-date{font-size:12px;color:var(--mut);margin-top:1px}
.tb-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:#fff;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;transition:.18s;box-shadow:var(--shadow)}
.pill:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
.pill .dot{width:8px;height:8px;border-radius:99px;background:var(--green)}
.pill.wait .dot{background:var(--amber);animation:pulseB 1.2s infinite}
.pill.busy .dot{background:var(--teal);animation:pulseB .7s infinite}
.icon-btn{position:relative;width:40px;height:40px;border-radius:11px;border:1.5px solid var(--line2);background:#fff;display:grid;place-items:center;transition:.18s;box-shadow:var(--shadow)}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--teal);color:var(--teal)}
.b-badge{position:absolute;top:-6px;right:-6px;background:var(--pen);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 6px;border:2px solid var(--bg)}
#content{padding:26px 28px 60px;max-width:1280px;width:100%;margin:0 auto}
.sec{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ===== components ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;transition:transform .2s,box-shadow .2s}
.card.hoverable:hover{transform:translateY(-3px);box-shadow:0 4px 6px rgba(24,44,46,.06),0 18px 34px -18px rgba(24,44,46,.35)}
.sec-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h1{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:-.3px}
.sec-h .sub{color:var(--mut);font-size:13px;margin-top:4px}
.sec-h .acts{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;transition:.16s;line-height:1.2}
.btn:hover{transform:translateY(-1.5px);border-color:var(--teal);color:var(--teal);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal2);color:#fff}
.btn.danger{background:var(--pen);border-color:var(--pen);color:#fff}
.btn.danger:hover{background:#C43D26;color:#fff;box-shadow:0 8px 18px -10px rgba(222,78,52,.7)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2.5px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-lang{color:#fff}
.c-teal{background:var(--tealsoft);color:var(--teal)}
.c-red{background:var(--pensoft);color:var(--pen)}
.c-green{background:var(--greensoft);color:#1F7A4B}
.c-amber{background:var(--ambersoft);color:#9C6A0E}
.c-gray{background:var(--graysoft);color:var(--mut)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--disp);font-weight:700;font-size:21px;margin-top:2px}
.stat .k{font-size:12px;color:var(--mut)}
.empty{padding:26px;text-align:center;color:var(--mut);border:1.5px dashed var(--line2);border-radius:var(--r);font-size:13.5px}

/* attendance statuses */
.st-present{background:var(--greensoft)!important;color:#1F7A4B!important;border-color:#BCE3CC!important}
.st-late{background:var(--ambersoft)!important;color:#9C6A0E!important;border-color:#EBD5A4!important}
.st-absent{background:var(--pensoft)!important;color:var(--pen)!important;border-color:#EFC1B6!important}
.st-cancel{background:var(--graysoft)!important;color:var(--mut)!important;border-color:#D5DAD8!important}
.st-marked{border-width:1.5px}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}

/* dashboard */
.dash-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px;padding:20px 24px;background:linear-gradient(120deg,#123734,#0E5A5F);color:#fff;border:none;position:relative;overflow:hidden}
.dash-hero::after{content:"";position:absolute;right:-40px;top:-60px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(242,179,61,.28),transparent 65%)}
.dh-day{font-family:var(--disp);font-weight:800;font-size:52px;line-height:1;color:#F2B33D}
.dh-wd{font-family:var(--disp);font-weight:700;font-size:18px}
.dh-mon{font-size:13px;color:#AFC5C0}
.dh-quote{margin-left:auto;text-align:right;position:relative;z-index:1}
.dh-quote b{font-family:var(--disp);font-weight:700;font-size:15px;display:block}
.dh-quote span{font-size:12.5px;color:#AFC5C0}
.dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
.d-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card h2{font-family:var(--disp);font-weight:700;font-size:15px;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.card h2 .cnt{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--mut);font-weight:600}
.page-card{background:repeating-linear-gradient(#fff 0px,#fff 27px,rgba(14,90,95,.075) 27px,rgba(14,90,95,.075) 28px);border:1px solid var(--line);position:relative}
.page-card::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:rgba(222,78,52,.35)}
.page-card .pc-in{padding:16px 18px 16px 48px}
.lesson-row{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px dashed rgba(14,90,95,.15)}
.lesson-row:last-child{border-bottom:none}
.lr-time{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--teal);min-width:52px}
.lr-name{font-weight:600}
.lr-sub{font-size:11.5px;color:var(--mut);margin-top:1px}
.lr-st{margin-left:auto}
.mark-btn{border:1.5px dashed var(--line2);border-radius:9px;padding:6px 13px;font-size:12.5px;font-weight:700;transition:.16s;background:#fff}
.mark-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.mark-btn.st-marked{border-style:solid}
.debt-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.debt-row:last-child{border:none}
.debt-sum{font-family:var(--mono);font-weight:700;color:var(--pen);font-size:15px}
.reminded{font-size:11px;color:var(--green);font-weight:600}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:140px;height:140px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:17;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .ctr b{font-family:var(--disp);font-size:22px;font-weight:800}
.donut .ctr span{font-size:10.5px;color:var(--mut)}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;flex:1;min-width:130px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:7px}
.hw-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.hw-row:last-child{border:none}
.due-chip{margin-left:auto;flex:none}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bday-row,.streak-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.bday-row:last-child,.streak-row:last-child{border:none}
.flame{font-size:16px}
.note-mini{display:flex;flex-direction:column;gap:6px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.note-mini:hover .nm-t{color:var(--teal)}
.note-mini:last-child{border:none}
.nm-t{font-weight:600;transition:color .15s}
.nm-s{font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* journal */
.week-nav{display:flex;align-items:center;gap:10px}
.wk-label{font-family:var(--disp);font-weight:700;font-size:14px;min-width:200px;text-align:center}
.j-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table.journal{border-collapse:collapse;width:100%;min-width:860px}
.journal th,.journal td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
.journal th{font-size:11.5px;color:var(--mut);font-weight:600;padding:10px 6px;background:var(--card2)}
.journal th.today-col{color:var(--pen)}
.journal th .dnum{font-family:var(--mono);font-size:14px;font-weight:700;display:block;color:var(--ink)}
.journal th.today-col .dnum{color:var(--pen)}
.journal td.name-col{text-align:left;padding:6px 12px;white-space:nowrap;font-weight:600;font-size:13px;position:sticky;left:0;background:var(--card);z-index:2;min-width:170px}
.journal tr.paused-row td.name-col{color:var(--soft)}
.journal tr:hover td{background:rgba(14,90,95,.035)}
.journal tr:hover td.name-col{background:#F4F8F6}
.cell{width:62px;height:46px;border-radius:9px;border:1.5px solid var(--line);background:var(--card2);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .13s,border-color .13s;vertical-align:middle}
.cell:hover{transform:scale(1.08);border-color:var(--teal)}
.cell .c-time{font-family:var(--mono);font-size:9.5px;opacity:.75}
.cell .c-st{font-size:11px;font-weight:700}
.cell.emptyc{border-style:dashed;color:var(--soft);cursor:default;background:transparent}
.cell.emptyc:hover{transform:none;border-color:var(--line)}
.j-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut);align-items:center}
.j-legend .sw{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* students */
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.st-card{display:flex;flex-direction:column;gap:10px}
.st-card.paused{opacity:.62;filter:saturate(.6)}
.st-top{display:flex;gap:12px;align-items:center}
.ava{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:16px;color:#fff;flex:none;background:var(--c,#0E5A5F);transition:transform .2s}
.st-card:hover .ava{transform:rotate(-5deg) scale(1.06)}
.st-name{font-weight:700;font-size:15.5px}
.st-meta{font-size:12px;color:var(--mut);margin-top:1px}
.st-pts{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--gold);font-size:13px}
.st-line{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.st-line b{color:var(--ink)}
.bar{height:8px;background:var(--graysoft);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2E9C63);border-radius:99px;transition:width .6s ease}
.bar i.low{background:linear-gradient(90deg,var(--pen),var(--amber))}
.sched-chips{display:flex;gap:6px;flex-wrap:wrap}
.st-acts{display:flex;gap:8px;margin-top:2px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;padding:9px 10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr{transition:background .13s}
.tbl tbody tr:hover{background:rgba(14,90,95,.04)}
.money{font-family:var(--mono);font-weight:700}
.money.pos{color:#1F7A4B}.money.neg{color:var(--pen)}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--mut)}
.two-col{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;align-items:start}

/* homework */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:7px 15px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;font-weight:600;font-size:13px;transition:.15s}
.tab:hover{border-color:var(--teal);color:var(--teal)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hw-card{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.hw-card.done{opacity:.6}
.hw-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:19px}
.hw-body{flex:1;min-width:0}
.hw-t{font-weight:700;font-size:14.5px}
.hw-note{font-size:12.5px;color:var(--mut);margin-top:3px}
.hw-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}

/* notifications */
.notif{display:flex;gap:13px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:9px;cursor:pointer;transition:.15s;align-items:flex-start}
.notif:hover{transform:translateX(4px);border-color:var(--teal)}
.notif.unread{background:#FDFBF2;border-left:3.5px solid var(--pen)}
.n-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.n-title{font-weight:700;font-size:13.5px}
.n-body{font-size:12.5px;color:var(--mut);margin-top:2px}
.n-ts{margin-left:auto;font-size:11px;color:var(--soft);white-space:nowrap;flex:none}

/* bonus */
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.rule{display:flex;gap:13px;align-items:center}
.rule .r-ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none}
.rule b{font-size:14px;display:block}
.rule span{font-size:12px;color:var(--mut)}

/* notes */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.note-card{display:flex;flex-direction:column;gap:9px}
.nt-title{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.3;cursor:pointer;transition:color .15s}
.nt-title:hover{color:var(--teal)}
.nt-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--mut)}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:var(--tealsoft);color:var(--teal);border-radius:6px;padding:1.5px 8px;font-size:11px;font-weight:600}
.nt-acts{display:flex;gap:7px;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line);flex-wrap:wrap}
.sync-chip{font-size:11px;font-weight:700;border-radius:99px;padding:2.5px 10px}
.sy-local{background:var(--graysoft);color:var(--mut)}
.sy-pending{background:var(--ambersoft);color:#9C6A0E;animation:pulseB 1.8s infinite}
.sy-synced{background:var(--greensoft);color:#1F7A4B}
.progress{height:7px;background:var(--graysoft);border-radius:99px;overflow:hidden;margin-top:10px;display:none}
.progress.on{display:block}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2E9C63);border-radius:99px;transition:width .5s ease;width:0}

/* editor */
.ed-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ed-head input.topic{font-family:var(--disp);font-weight:700;font-size:17px;border:none;border-bottom:2px solid var(--line2);border-radius:0;background:transparent;padding:6px 2px;flex:1;min-width:220px}
.ed-head input.topic:focus{box-shadow:none;border-color:var(--teal)}
.ed-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
.ed-tools{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.ed-tools .btn{padding:5px 11px;font-size:12px}
textarea#ne-body{min-height:340px;font-family:var(--mono);font-size:13px;line-height:1.7;resize:vertical;background:#FFFDF6}
.ed-attach{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.att-block{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--card2)}
.att-block h3{font-size:12.5px;font-family:var(--body);font-weight:700;color:var(--teal);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.att-row{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--line)}
.att-row:last-child{border:none}
.att-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-val{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--gold)}
.margin-note{background:#FDF3D7;border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:7px 11px;font-size:12.5px;margin-top:6px;position:relative}
.preview{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 26px 46px;box-shadow:var(--shadow);min-height:400px;position:relative;background-image:linear-gradient(90deg,transparent 33px,rgba(222,78,52,.3) 33px,rgba(222,78,52,.3) 34.5px,transparent 34.5px)}
.preview h3{font-family:var(--disp);font-size:14px;margin:18px 0 8px;color:var(--teal)}
.preview h3:first-child{margin-top:0}
.preview p{margin:7px 0}
.preview ul{margin:7px 0 7px 20px}
.preview li{margin:3px 0}
.cards-h{font-size:12px;color:var(--pen);letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px;font-family:var(--body)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fcard{border:1.5px solid var(--line2);border-radius:10px;padding:8px 11px;background:var(--card2);display:flex;flex-direction:column;gap:2px;transition:.15s}
.fcard:hover{transform:translateY(-2px) rotate(-.5deg);box-shadow:var(--shadow);border-color:var(--teal)}
.fc-f{font-weight:700}
.fc-b{font-size:12px;color:var(--mut)}

/* modal & toast */
#modalRoot .ovl{position:fixed;inset:0;background:rgba(15,40,40,.5);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:90;animation:fadeIn .2s}
.modal{background:#fff;border-radius:18px;max-width:540px;width:calc(100% - 40px);max-height:88vh;overflow:auto;padding:24px;animation:slideUp .3s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 30px 70px -20px rgba(10,30,30,.5)}
.modal.wide{max-width:700px}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(26px) scale(.97)}}
.m-h{font-family:var(--disp);font-weight:700;font-size:17px;margin-bottom:12px}
.m-b{color:var(--mut);font-size:13.5px;margin-bottom:16px}
.m-f{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.slot-row{display:flex;gap:8px;margin-bottom:7px;align-items:center}
#toasts{position:fixed;right:20px;bottom:20px;z-index:120;display:flex;flex-direction:column;gap:9px}
.toast{background:#132E30;color:#fff;border-radius:12px;padding:12px 17px;font-size:13.5px;font-weight:500;box-shadow:0 14px 34px -10px rgba(10,30,30,.5);display:flex;gap:10px;align-items:center;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);max-width:360px;border-left:4px solid var(--green)}
.toast.t-info{border-color:#F2B33D}.toast.t-warn{border-color:var(--amber)}.toast.t-err{border-color:var(--pen)}
.toast.out{animation:toastOut .4s forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.float-pts{position:fixed;z-index:130;font-family:var(--disp);font-weight:800;font-size:15px;pointer-events:none;animation:floatUp 1.1s ease forwards}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}

/* template picker */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.tpl{border:1.5px solid var(--line2);border-radius:12px;padding:14px 12px;text-align:center;font-weight:600;font-size:13px;transition:.15s;background:#fff}
.tpl:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:var(--shadow)}
.tpl.on{border-color:var(--teal);background:var(--tealsoft)}
.tpl .t-ico{font-size:24px;display:block;margin-bottom:7px}

/* print */
#printSheet{display:none}
@media print{
  body{background:#fff}
  #app,#toasts,#modalRoot{display:none!important}
  #printSheet{display:block}
  @page{margin:15mm}
}
.p-page{font-family:var(--body);color:#111;max-width:100%}
.p-brand{display:flex;justify-content:space-between;border-bottom:3px solid #123734;padding-bottom:8px;font-family:var(--disp);font-weight:800;font-size:15px}
.p-brand span:last-child{font-family:var(--mono);font-weight:500;font-size:11px;color:#666}
.p-title{font-family:var(--disp);font-size:22px;margin:16px 0 6px}
.p-meta{font-size:12px;color:#444;margin-bottom:14px;border-bottom:1px solid #ccc;padding-bottom:10px}
.p-page h3{font-size:14px;margin:14px 0 6px;border-left:4px solid #123734;padding-left:8px}
.p-page h4{font-size:12px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px}
.p-page p{font-size:13px;margin:5px 0}
.p-page ul{margin:5px 0 5px 20px;font-size:13px}
.p-page .cards{grid-template-columns:1fr 1fr 1fr}
.p-page .fcard{break-inside:avoid;border-color:#bbb}
.p-sec{margin-top:16px;break-inside:avoid}
.p-sign{display:flex;gap:30px;margin-top:36px;font-size:12px}
.p-sign div{flex:1;border-top:1px solid #333;padding-top:6px;text-align:center}

@media (max-width:1080px){.dash-grid,.ed-grid,.two-col{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
@media (max-width:880px){
  aside{width:64px;padding:16px 8px}
  .logo span,.logo-sub,.navi span.lbl,.side-foot b{display:none}
  .navi{justify-content:center;padding:12px 8px}
  .navi.on::before{left:-8px}
  .nbadge{position:absolute;top:2px;right:2px;margin:0}
  .form-grid{grid-template-columns:1fr}
  #content{padding:18px 14px 60px}
}

<body>
<div id="app">
  <aside>
    <div class="logo">Лингва<em>Журнал</em></div>
    <div class="logo-sub">персональный помощник репетитора</div>
    <nav id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div id="main">
    <header id="topbar">
      <div><div class="tb-greet" id="tbGreet"></div><div class="tb-date" id="tbDate"></div></div>
      <div class="tb-right">
        <button class="pill" id="syncPill" title="Синхронизировать сейчас"></button>
        <button class="icon-btn" id="bellBtn" title="Уведомления"></button>
      </div>
    </header>
    <div id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<div id="printSheet"></div>

<script>
'use strict';
/* ==================== utils ==================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS='lingwaJournal.v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const plur=(n,o,f,m)=>{n=Math.abs(n)%100;const d=n%10;if(n>10&&n<20)return m;if(d>1&&d<5)return f;if(d===1)return o;return m};
const money=n=>Math.round(n).toLocaleString('ru-RU')+' ₽';
const fmtMoneyCSV=n=>String(Math.round(n));
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const dowOf=d=>(d.getDay()+6)%7+1;
const DOWS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const fm=(d,st)=>new Intl.DateTimeFormat('ru-RU',st).format(d);
const isoRu=s=>fm(pISO(s),{day:'numeric',month:'short'});
const timeAgo=ts=>{const m=Math.floor((Date.now()-ts)/60000);if(m<1)return'только что';if(m<60)return m+' мин назад';const h=Math.floor(m/60);if(h<24)return h+' ч назад';return fm(new Date(ts),{day:'numeric',month:'short'})};

const LANGS={en:{label:'Английский',flag:'🇬',c:'#3B6ED4'},de:{label:'Немецкий',flag:'🇩🇪',c:'#C98A12'},fr:{label:'Французский',flag:'🇫🇷',c:'#C2497A'},es:{label:'Испанский',flag:'🇪🇸',c:'#E0762F'},it:{label:'Итальянский',flag:'🇮',c:'#3E9E5F'},zh:{label:'Китайский',flag:'🇨🇳',c:'#C53A2F'}};
const LEVELS=['A1','A2','B1','B2','C1','C2'];
const METHODS=['Наличные','Перевод на карту','СБП','PayPal','Другое'];
const PROVIDERS=['Яндекс.Диск','Google Drive','Dropbox','Notion','Облако Mail'];
const STMETA={present:{l:'Явка',sh:'Я',cls:'st-present'},late:{l:'Опоздание',sh:'О',cls:'st-late'},absent:{l:'Пропуск',sh:'П',cls:'st-absent'},cancel:{l:'Отмена',sh:'От',cls:'st-cancel'}};
const CYCLE=['','present','late','absent','cancel'];
const TPLS={grammar:{l:'Грамматика',i:'📐',t:'## Правило\n\n\n## Примеры\n- \n\n## Карточки\nслово — перевод'},vocab:{l:'Лексика',i:'🃏',t:'## Новая лексика\n\n\n## Карточки\nслово — перевод'},speaking:{l:'Разговорный',i:'💬',t:'## Ситуация\n\n\n## Полезные фразы\n- \n\n## Карточки\nфраза — перевод'},exam:{l:'Экзаменационный',i:'🎯',t:'## Формат задания\n\n\n## Стратегия\n- \n\n## Типичные ошибки\n- \n\n## Карточки\nслово — перевод'},blank:{l:'Чистый лист',i:'📄',t:''}};
const IC={
dash:'<rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/>',
journal:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18M8.5 15l2.2 2.2L15.5 12.5"/>',
students:'<circle cx="9" cy="8" r="3.4"/><path d="M2.7 20c.8-3.1 3.2-4.7 6.3-4.7s5.5 1.6 6.3 4.7"/><circle cx="17.2" cy="9" r="2.5"/><path d="M16.4 15.6c2.5.4 4.2 1.8 4.9 4.4"/>',
pay:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 9.6h19M6.2 14.8h4.5"/>',
hw:'<path d="M4 4.6A2.6 2.6 0 0 1 6.6 2H20v17.4H6.6A2.6 2.6 0 0 0 4 22z"/><path d="M4 19.4A2.6 2.6 0 0 1 6.6 16.8H20M9 7.5h7M9 11h5"/>',
notes:'<path d="M14 2.5H6a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5z"/><path d="M14 2.5v6h6M8.5 13.5h7M8.5 17h4.5"/>',
bonus:'<path d="M12 3l2 4.2 4.6.6-3.4 3.2.9 4.6L12 13.4l-4.1 2.2.9-4.6-3.4-3.2 4.6-.6z"/>',
bell:'<path d="M18 8.4a6 6 0 1 0-12 0c0 6.6-2.5 7.6-2.5 7.6h17S18 15 18 8.4"/><path d="M13.7 19.8a2 2 0 0 1-3.4 0"/>',
data:'<ellipse cx="12" cy="5" rx="8" ry="2.9"/><path d="M4 5v14c0 1.6 3.6 2.9 8 2.9s8-1.3 8-2.9V5"/><path d="M4 12c0 1.6 3.6 2.9 8 2.9s8-1.3 8-2.9"/>'};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24">${IC[n]}</svg>`;
const NAV=[['dash','Обзор','dash'],['journal','Журнал посещений','journal'],['students','Ученики','students'],['payments','Оплаты','pay'],['hw','Домашние задания','hw'],['notes','Конспекты','notes'],['bonus','Бонусы','bonus'],['notif','Уведомления','bell'],['data','Данные и настройки','data']];

/* ==================== state ==================== */
let db=null;
const ui={section:'dash',weekOffset:0,hwTab:'all',noteId:null,draft:null,search:'',langF:'all',syncing:false,syncMsg:''};
const saveDB=()=>{try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){toast('⚠️ Хранилище переполнено (файлы слишком большие)','err')}};
const getSt=id=>db.students.find(s=>s.id===id);
const initials=n=>n.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
const langChip=l=>`<span class="chip c-lang" style="background:${LANGS[l].c}">${LANGS[l].flag} ${LANGS[l].label}</span>`;

function pushOp(sid,delta,reason){db.ops.unshift({ts:Date.now(),sid,delta,reason});db.ops=db.ops.slice(0,300)}
function computeStreak(st){const dows=new Set(st.schedule.map(x=>+x.dow));let c=0;for(let i=0;i<120;i++){const d=addD(TODAY,-i);if(!dows.has(dowOf(d)))continue;const a=db.att[iso(d)+'_'+st.id];if(a&&(a.s==='present'||a.s==='late'))c++;else if(i===0)continue;else break}return c}
function lessonsOn(dISO){const dw=dowOf(pISO(dISO));return db.students.filter(s=>!s.paused&&s.schedule.some(x=>+x.dow===dw)).map(s=>({st:s,time:s.schedule.find(x=>+x.dow===dw).time})).sort((a,b)=>a.time.localeCompare(b.time))}
function daysToBday(st){const b=pISO(st.birthday);let nx=new Date(TODAY.getFullYear(),b.getMonth(),b.getDate());if(nx<TODAY)nx=new Date(TODAY.getFullYear()+1,b.getMonth(),b.getDate());return Math.round((nx-TODAY)/864e5)}
function nextStatus(cur){return CYCLE[(CYCLE.indexOf(cur)+1)%CYCLE.length]}

function setAttendance(sid,dISO,newS){
  const st=getSt(sid);const key=dISO+'_'+sid;const old=db.att[key];
  const cnt=s=>s==='present'||s==='late';const oldC=old&&cnt(old.s),newC=cnt(newS);
  if(oldC&&!newC){if(old.src==='abo')st.aboLeft++;else st.debt=Math.max(0,st.debt-st.price);
    st.bonusPoints=Math.max(0,st.bonusPoints-db.settings.pointsPerLesson);pushOp(sid,-db.settings.pointsPerLesson,'Корректировка: отметка изменена')}
  let src=null;
  if(newC&&!oldC){if(st.aboLeft>0){st.aboLeft--;src='abo'}else{st.debt+=st.price;src='debt'}
    st.bonusPoints+=db.settings.pointsPerLesson;if(db.settings.autoPoints)pushOp(sid,db.settings.pointsPerLesson,'Баллы за занятие')}
  if(newC)db.att[key]={s:newS,src:src||old.src};else delete db.att[key];
  st.streak=computeStreak(st);saveDB();
  return{newC,added:newC&&!oldC,src};
}

function pay(sid,amount,method,comment){
  const st=getSt(sid);const total=amount+(st.advance||0);
  const debtPaid=Math.min(st.debt,total);st.debt=Math.round((st.debt-debtPaid)*100)/100;
  const rest=total-debtPaid;const lessons=Math.floor(rest/st.price);st.aboLeft+=lessons;
  st.advance=Math.round((rest-lessons*st.price)*100)/100;
  const bonus=Math.round(amount/100);st.bonusPoints+=bonus;pushOp(sid,bonus,'Баллы за оплату');
  db.payments.unshift({id:uid(),ts:Date.now(),dateISO:iso(TODAY),sid,amount,method,comment:comment||'',debtPaid:Math.round(debtPaid),lessons});
  saveDB();
  toast(`💳 Оплата проведена: ${debtPaid>0?`долг −${money(debtPaid)}, `:''}${lessons>0?`+${lessons} ${plur(lessons,'занятие','занятия','занятий')}`:''}${st.advance>0?`, аванс ${money(st.advance)}`:''}${bonus?`, +${bonus} ★`:''}`);
}

/* ==================== notifications ==================== */
function addNotif(type,title,body,key){
  if(key){if(db.notifKeys.includes(key))return;db.notifKeys.push(key);if(db.notifKeys.length>250)db.notifKeys.shift()}
  db.notifs.unshift({id:uid(),ts:Date.now(),type,title,body,read:false});saveDB();
}
function genNotifs(){
  const tISO=iso(TODAY),tom=iso(addD(TODAY,1));
  const tl=lessonsOn(tISO);
  if(tl.length)addNotif('lesson',`Сегодня ${tl.length} ${plur(tl.length,'занятие','занятия','занятий')}`,tl.map(x=>`${x.time} — ${x.st.name}`).join(' · '),'les-'+tISO);
  const tm=lessonsOn(tom);
  if(tm.length)addNotif('lesson',`Завтра ${tm.length} ${plur(tm.length,'занятие','занятия','занятий')}`,tm.map(x=>`${x.time} — ${x.st.name}`).join(' · '),'les-'+tom);
  db.students.filter(s=>s.debt>0).forEach(s=>addNotif('debt',`Долг: ${s.name}`,`Задолженность ${money(s.debt)}. Отправьте напоминание из Обзора.`,'debt-'+s.id+'-'+s.debt));
  db.students.forEach(s=>{const d=daysToBday(s);if(d<=7)addNotif('bday',`День рождения: ${s.name}`,d===0?'Сегодня! Не забудьте поздравить и начислить подарочные баллы 🎂':`Через ${d} ${plur(d,'день','дня','дней')}. Подарок: +${db.settings.pointsBirthday} ★`,'bd-'+s.id+'-'+TODAY.getFullYear()+'-'+TODAY.getMonth())});
  db.hw.filter(h=>!h.done&&pISO(h.due)<TODAY).forEach(h=>addNotif('hw','Просроченное ДЗ',`${getSt(h.sid)?.name}: «${h.title}» (срок ${isoRu(h.due)})`,'hw-'+h.id));
}
const unread=()=>db.notifs.filter(n=>!n.read).length;

/* ==================== sync ==================== */
function pendingCount(){return db.notes.filter(n=>n.sync==='pending').length}
function syncNow(manual){
  if(ui.syncing)return;
  const pend=db.notes.filter(n=>n.sync==='pending');
  if(!pend.length){toast(manual?'✅ Всё уже синхронизировано':'Очередь пуста','info');return}
  ui.syncing=true;let i=0;renderTop();
  if(ui.section==='notes'&&!ui.noteId)renderContent();
  const step=()=>{
    if(i>=pend.length){ui.syncing=false;saveDB();
      if(ui.noteId&&ui.draft&&pend.some(n=>n.id===ui.draft.id)){ui.draft.sync='synced';const chip=$('#ne-syncchip');if(chip){chip.className='sync-chip sy-synced';chip.textContent='✓ синхронизирован'}}
      renderTop();if(ui.section==='notes'&&!ui.noteId)renderContent();
      toast(`☁️ Синхронизировано ${pend.length} ${plur(pend.length,'конспект','конспекта','конспектов')} → ${db.settings.syncProvider}`);
      addNotif('sync','Синхронизация завершена',`${pend.length} ${plur(pend.length,'конспект','конспекта','конспектов')} загружено в ${db.settings.syncProvider}`,'sync-'+Date.now());return}
    const n=pend[i];n.sync='synced';n.syncTs=Date.now();i++;saveDB();
    ui.syncMsg=`${i} / ${pend.length}`;renderTop();
    if(ui.section==='notes'&&!ui.noteId)renderContent();
    setTimeout(step,650);
  };
  ui.syncMsg=`0 / ${pend.length}`;setTimeout(step,500);
}

/* ==================== toast & float ==================== */
function toast(msg,type='ok'){const t=document.createElement('div');t.className='toast t-'+type;t.innerHTML=msg;$('#toasts').appendChild(t);setTimeout(()=>t.classList.add('out'),2900);setTimeout(()=>t.remove(),3400)}
function floatAt(x,y,text,color){const s=document.createElement('div');s.className='float-pts';s.textContent=text;s.style.cssText=`left:${x}px;top:${y}px;color:${color}`;document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}

/* ==================== modal ==================== */
function openModal(html,wide){$('#modalRoot').innerHTML=`<div class="ovl"><div class="modal ${wide?'wide':''}">${html}</div></div>`;
  $('.ovl').addEventListener('click',e=>{if(e.target.classList.contains('ovl'))closeModal()})}
function closeModal(){$('#modalRoot').innerHTML=''}
function confirmM(title,body,ok,cb,danger){openModal(`<div class="m-h">${title}</div><div class="m-b">${body}</div><div class="m-f"><button class="btn" id="m-c">Отмена</button><button class="btn ${danger?'danger':'primary'}" id="m-o">${ok}</button></div>`);
  $('#m-c').onclick=closeModal;$('#m-o').onclick=()=>{closeModal();cb()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='s'&&ui.section==='notes'&&ui.noteId){e.preventDefault();neSave()}});

/* ==================== chrome ==================== */
function renderNav(){
  const u=unread();
  $('#nav').innerHTML=NAV.map(([id,lbl,ic])=>`<button class="navi ${ui.section===id?'on':''}" data-nav="${id}">${icon(ic)}<span class="lbl">${lbl}</span>${id==='notif'&&u?`<span class="nbadge">${u}</span>`:''}</button>`).join('');
  $$('#nav [data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
  $('#sideFoot').innerHTML=`<b>${esc(db.settings.teacher)}</b>данные хранятся локально ✓`;
}
function renderTop(){
  const h=new Date().getHours();const g=h<6?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';
  $('#tbGreet').textContent=`${g}, ${esc(db.settings.teacher.split(' ')[0])}!`;
  $('#tbDate').textContent=fm(TODAY,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const p=$('#syncPill');const pc=pendingCount();
  p.className='pill'+(ui.syncing?' busy':pc?' wait':'');
  p.innerHTML=`<span class="dot"></span>${ui.syncing?`Синхронизация… ${ui.syncMsg}`:`☁️ ${db.settings.syncProvider}${pc?` · в очереди ${pc}`:' · всё синхронизировано'}`}`;
  p.onclick=()=>syncNow(true);
  const u=unread();
  $('#bellBtn').innerHTML=icon('bell')+(u?`<span class="b-badge">${u}</span>`:'');
  $('#bellBtn').onclick=()=>go('notif');
}
function go(sec){ui.section=sec;ui.noteId=null;ui.draft=null;renderNav();renderTop();renderContent();window.scrollTo({top:0,behavior:'smooth'})}
function renderContent(){
  const c=$('#content');
  ({dash:renderDash,journal:renderJournal,students:renderStudents,payments:renderPayments,hw:renderHW,notif:renderNotifs,bonus:renderBonus,notes:renderNotes,data:renderData})[ui.section](c);
}

/* ==================== ОБОР ==================== */
function renderDash(c){
  const tISO=iso(TODAY);const les=lessonsOn(tISO);
  const debtors=db.students.filter(s=>s.debt>0&&!s.paused);
  const totalDebt=debtors.reduce((a,s)=>a+s.debt,0);
  const mon=monday(TODAY);const cnt={present:0,late:0,absent:0,cancel:0};
  Object.keys(db.att).forEach(k=>{const[d]=k.split('_');const dd=pISO(d);if(dd>=mon&&dd<=addD(mon,6))cnt[db.att[k].s]++});
  const total=cnt.present+cnt.late+cnt.absent+cnt.cancel;
  const pct=total?Math.round((cnt.present+cnt.late)/total*100):0;
  const R=56,C=2*Math.PI*R;let acc=0;
  const segs=[['#2E9C63',cnt.present],['#D9941F',cnt.late],['#DE4E34',cnt.absent],['#98A5A3',cnt.cancel]].map(([col,v])=>{
    if(!v)return'';const len=v/total*C;const s=`<circle r="${R}" cx="70" cy="70" stroke="${col}" stroke-dasharray="0 ${C}" data-len="${len}" data-off="${-acc}"/>`;acc+=len;return s}).join('');
  const donut=`<div class="donut"><svg width="140" height="140"><circle r="${R}" cx="70" cy="70" stroke="#EDEAE0" fill="none"/>${segs}</svg><div class="ctr"><b>${pct}%</b><span>посещаемость</span></div></div>`;
  const legend=[['Явка',cnt.present,'#2E9C63'],['Опоздание',cnt.late,'#D9941F'],['Пропуск',cnt.absent,'#DE4E34'],['Отмена',cnt.cancel,'#98A5A3']].map(x=>`<div><i style="background:${x[2]}"></i>${x[0]} — <b>${x[1]}</b></div>`).join('');
  const hwUp=db.hw.filter(h=>!h.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);
  const hwRow=h=>{const dl=Math.round((pISO(h.due)-TODAY)/864e5);
    const chip=dl<0?`<span class="chip c-red due-chip">просрочено ${-dl} ${plur(-dl,'день','дня','дней')}</span>`:dl===0?'<span class="chip c-red due-chip">сегодня!</span>':dl===1?'<span class="chip c-amber due-chip">завтра</span>':`<span class="chip c-teal due-chip">через ${dl} ${plur(dl,'день','дня','дней')}</span>`;
    return`<div class="hw-row"><div style="min-width:0"><b style="font-size:13px">${esc(h.title)}</b><div style="font-size:11.5px;color:var(--mut)">${esc(getSt(h.sid)?.name||'')}</div></div>${chip}</div>`};
  const bdays=db.students.filter(s=>daysToBday(s)<=14).sort((a,b)=>daysToBday(a)-daysToBday(b));
  const streaks=db.students.filter(s=>!s.paused).sort((a,b)=>b.streak-a.streak).slice(0,4);
  const fresh=[...db.notes].sort((a,b)=>b.ts-a.ts).slice(0,3);
  const quote=['Язык — это карта культуры народа.','Język to mapa kultury.','Le langage est la carte de la culture.','El idioma es el mapa de un pueblo.','语言是一张地图。'][Math.floor(Date.now()/864e5)%5];

  c.innerHTML=`<section class="sec">
  <div class="card dash-hero">
    <div class="dh-day">${TODAY.getDate()}</div>
    <div><div class="dh-wd">${fm(TODAY,{weekday:'long'})}</div><div class="dh-mon">${fm(TODAY,{month:'long',year:'numeric'})} · страница дня</div></div>
    <div class="dh-quote"><b>Сегодня ${les.length} ${plur(les.length,'занятие','занятия','занятий')}</b>
    <span>${debtors.length?`долги: ${money(totalDebt)} · `:''}непрочитанных: ${unread()} · «${quote}»</span></div>
  </div>
  <div class="dash-grid">
    <div class="d-col">
      <div class="card page-card" style="padding:0">
        <div class="pc-in">
          <h2>📖 Занятия сегодня <span class="cnt">${les.length}</span></h2>
          ${les.length?les.map(({st,time})=>{const a=db.att[tISO+'_'+st.id];const m=STMETA[a?.s];
            return`<div class="lesson-row"><span class="lr-time">${time}</span><div><div class="lr-name">${esc(st.name)}</div><div class="lr-sub">${LANGS[st.lang].flag} ${LANGS[st.lang].label} · ${st.level} · осталось ${st.aboLeft} ${plur(st.aboLeft,'занятие','занятия','занятий')}${st.debt?` · <b style="color:var(--pen)">долг ${money(st.debt)}</b>`:''}</div></div>
            <span class="lr-st"><button class="mark-btn ${m?'st-marked '+m.cls:''}" data-cycle data-sid="${st.id}" data-date="${tISO}">${m?m.l:'отметить'}</button></span></div>`}).join('')
          :`<div class="empty" style="margin:8px 0 4px">Сегодня занятий нет — время подготовить конспекты ☕<br><br><button class="btn primary sm" data-gonotes>Открыть конспекты</button></div>`}
        </div>
      </div>
      <div class="card hoverable">
        <h2>💸 Долги <span class="cnt">${debtors.length?money(totalDebt):'нет 🎉'}</span></h2>
        ${debtors.length?debtors.map(s=>{const sent=s.remindedTs&&Date.now()-s.remindedTs<864e5*3;
          return`<div class="debt-row"><div><b>${esc(s.name)}</b> <div style="font-size:11.5px;color:var(--mut)">${LANGS[s.lang].label} · ${money(s.price)}/занятие</div></div><span class="debt-sum">${money(s.debt)}</span>
          <button class="btn sm ${sent?'':'primary'}" data-remind="${s.id}" style="margin-left:auto" ${sent?'disabled':''}>${sent?'✓ отправлено':'📨 Напомнить'}</button></div>`}).join('')
        :'<div class="empty">Все ученики расплатились. Отличный день!</div>'}
      </div>
      <div class="card hoverable"><h2>🔥 Серии посещений</h2>
        ${streaks.map(s=>`<div class="streak-row"><span class="flame">🔥</span><b>${esc(s.name)}</b><span style="margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--teal)">${s.streak} ${plur(s.streak,'занятие','занятия','занятий')} подряд</span></div>`).join('')}
      </div>
    </div>
    <div class="d-col">
      <div class="card hoverable"><h2>📊 Посещаемость недели</h2>
        ${total?`<div class="donut-wrap">${donut}<div class="legend">${legend}</div></div>`:'<div class="empty">Отметок на этой неделе пока нет</div>'}
      </div>
      <div class="card hoverable"><h2>📚 Ближайшие ДЗ <span class="cnt">${db.hw.filter(h=>!h.done).length} актив.</span></h2>
        ${hwUp.length?hwUp.map(hwRow).join(''):'<div class="empty">Активных заданий нет</div>'}
      </div>
      <div class="mini-grid">
        <div class="card hoverable"><h2>🎂 Дни рождения</h2>
          ${bdays.length?bdays.map(s=>{const d=daysToBday(s);return`<div class="bday-row">🎈 <b>${esc(s.name)}</b><span style="margin-left:auto" class="chip ${d===0?'c-red':'c-amber'}">${d===0?'сегодня!':'через '+d+' '+plur(d,'день','дня','дней')}</span></div>`}).join(''):'<div class="empty" style="font-size:12px">Ближайшие 2 недели — тихо</div>'}
        </div>
        <div class="card hoverable"><h2>🗒 Свежие конспекты</h2>
          ${fresh.map(n=>`<div class="note-mini" data-open-note="${n.id}"><span class="nm-t">${esc(n.topic)}</span><span class="nm-s">${esc(getSt(n.studentId)?.name||'—')} · <span class="sync-chip sy-${n.sync}">${n.sync==='synced'?'✓ синхр.':n.sync==='pending'?'⏳ очередь':'локально'}</span></span></div>`).join('')}
        </div>
      </div>
    </div>
  </div></section>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$('#content .donut circle[data-len]').forEach(el=>{el.setAttribute('stroke-dasharray',`${el.dataset.len} ${C}`);el.setAttribute('stroke-dashoffset',el.dataset.off)})));
  $$('[data-cycle]').forEach(b=>b.onclick=e=>{
    const cur=db.att[b.dataset.date+'_'+b.dataset.sid]?.s||'';const nx=nextStatus(cur);
    const r=setAttendance(b.dataset.sid,b.dataset.date,nx);
    if(r.added&&db.settings.autoPoints)floatAt(e.clientX-10,e.clientY-24,`+${db.settings.pointsPerLesson} ★`,'#C99118');
    toast(nx?`Отмечено: <b>${STMETA[nx].l.toLowerCase()}</b>`:'Отметка снята','info');renderDash(c);renderNav();renderTop();
  });
  $$('[data-remind]').forEach(b=>b.onclick=()=>{const s=getSt(b.dataset.remind);s.remindedTs=Date.now();saveDB();
    toast(`📨 Напоминание отправлено: <b>${esc(s.name)}</b> (${s.phone})`);addNotif('info','Напоминание о долге отправлено',`${s.name}, ${money(s.debt)}`);renderDash(c)});
  $$('[data-open-note]').forEach(b=>b.onclick=()=>{ui.section='notes';ui.noteId=b.dataset.openNote;renderNav();renderContent()});
  const gn=$('[data-gonotes]');if(gn)gn.onclick=()=>go('notes');
}

/* ==================== ЖУРНАЛ ==================== */
function renderJournal(c){
  const mon=addD(monday(TODAY),7*ui.weekOffset);const sun=addD(mon,6);
  const label=`${fm(mon,{day:'numeric',month:'short'})} — ${fm(sun,{day:'numeric',month:'long',year:'numeric'})}`;
  const rowHtml=st=>{
    let cells='',cntW=0;
    for(let i=0;i<7;i++){const d=addD(mon,i);const dISO=iso(d);const slot=st.schedule.find(x=>+x.dow===dowOf(d));
      if(!slot){cells+=`<td><span class="cell emptyc">·</span></td>`;continue}
      const a=db.att[dISO+'_'+st.id];const m=a?STMETA[a.s]:null;if(m&&(a.s==='present'||a.s==='late'))cntW++;
      cells+=`<td>${cellBtn(st,dISO,slot,a,m)}</td>`}
    return`<tr class="${st.paused?'paused-row':''}" data-row="${st.id}"><td class="name-col">${esc(st.name)}${st.paused?' <span class="chip c-gray">пауза</span>':''}<div style="font-size:10.5px;color:var(--mut);font-weight:400">${LANGS[st.lang].flag} ${st.level} · ост. ${st.aboLeft}</div></td>${cells}<td data-sum style="font-family:var(--mono);font-weight:700;color:var(--teal)">${cntW}</td></tr>`;
  };
  c.innerHTML=`<section class="sec">
  <div class="sec-h"><div><h1>Журнал посещений</h1><div class="sub">Клик по ячейке: явка → опоздание → пропуск → отмена → пусто. Явка списывает занятие из абонемента.</div></div>
    <div class="acts week-nav"><button class="btn sm" data-wnav="-1">←</button><span class="wk-label">${label}${ui.weekOffset===0?' · <span style="color:var(--pen)">текущая</span>':''}</span><button class="btn sm" data-wnav="1">→</button>${ui.weekOffset!==0?'<button class="btn sm" data-wnav="0">Сегодня</button>':''}</div></div>
  <div class="j-wrap"><table class="journal"><thead><tr><th style="text-align:left;padding-left:12px">Ученик</th>
  ${[0,1,2,3,4,5,6].map(i=>{const d=addD(mon,i);return`<th class="${iso(d)===iso(TODAY)?'today-col':''}">${DOWS[i]}<span class="dnum">${d.getDate()}</span></th>`}).join('')}<th>Итог</th></tr></thead>
  <tbody>${db.students.map(rowHtml).join('')}</tbody></table></div>
  <div class="j-legend"><span><span class="sw" style="background:var(--greensoft);border:1px solid #BCE3CC"></span>явка (−1 занятие, +${db.settings.pointsPerLesson} ★)</span><span><span class="sw" style="background:var(--ambersoft)"></span>опоздание</span><span><span class="sw" style="background:var(--pensoft)"></span>пропуск</span><span><span class="sw" style="background:var(--graysoft)"></span>отмена</span><span style="margin-left:auto">Расписание на ±4 недели доступно листанием</span></div></section>`;
  $$('[data-wnav]').forEach(b=>b.onclick=()=>{ui.weekOffset=+b.dataset.wnav===0?0:ui.weekOffset+ +b.dataset.wnav;renderJournal(c)});
  const wrap=c.querySelector('.j-wrap');
  wrap.addEventListener('click',e=>{
    const btn=e.target.closest('[data-cell]');
    if(!btn||btn.classList.contains('emptyc'))return;
    const sid=btn.dataset.sid,dISO=btn.dataset.date;const st=getSt(sid);
    if(st.paused)return toast('Ученик на паузе','warn');
    const cur=db.att[dISO+'_'+sid]?.s||'';const nx=nextStatus(cur);
    const r=setAttendance(sid,dISO,nx);
    const slot=st.schedule.find(x=>+x.dow===dowOf(pISO(dISO)));
    const a=db.att[dISO+'_'+sid];const m=a?STMETA[a.s]:null;
    btn.outerHTML=cellBtn(st,dISO,slot,a,m,true);
    let cnt=0;for(let i=0;i<7;i++){const a2=db.att[iso(addD(mon,i))+'_'+sid];if(a2&&(a2.s==='present'||a2.s==='late'))cnt++}
    const tr=c.querySelector(`[data-row="${sid}"]`);if(tr)tr.querySelector('[data-sum]').textContent=cnt;
    if(r.added&&db.settings.autoPoints)floatAt(e.clientX-8,e.clientY-20,`+${db.settings.pointsPerLesson} ★`,'#C99118');
    if(r.added&&r.src==='debt')toast(`⚠️ Абонемент пуст — ${esc(st.name)}: долг ${money(st.price)}`,'warn');
  });
}
function cellBtn(st,dISO,slot,a,m,pop){
  return`<button class="cell ${m?'st-marked '+m.cls:''} ${pop?'pop':''}" data-cell data-sid="${st.id}" data-date="${dISO}" title="${slot.time} · ${m?m.l:'не отмечено'}"><span class="c-time">${slot.time}</span><span class="c-st">${m?m.sh:'—'}</span></button>`;
}

/* ==================== УЧЕНИКИ ==================== */
function renderStudents(c){
  let list=db.students;
  if(ui.search)list=list.filter(s=>(s.name+s.phone+LANGS[s.lang].label).toLowerCase().includes(ui.search.toLowerCase()));
  if(ui.langF!=='all')list=list.filter(s=>s.lang===ui.langF);
  c.innerHTML=`<section class="sec"><div class="sec-h"><div><h1>Ученики</h1><div class="sub">${db.students.length} всего · ${db.students.filter(s=>s.paused).length} на паузе</div></div>
    <div class="acts"><input id="stSearch" placeholder="🔍 Поиск…" style="width:190px" value="${esc(ui.search)}"><select id="stLang" style="width:150px"><option value="all">Все языки</option>${Object.keys(LANGS).map(k=>`<option value="${k}" ${ui.langF===k?'selected':''}>${LANGS[k].flag} ${LANGS[k].label}</option>`).join('')}</select><button class="btn primary" id="stAdd">＋ Ученик</button></div></div>
  <div class="st-grid">${list.length?list.map(stCard).join(''):'<div class="empty">Никого не нашлось</div>'}</div></section>`;
  $('#stSearch').oninput=e=>{ui.search=e.target.value;const pos=e.target.selectionStart;renderStudents(c);const el=$('#stSearch');el.focus();el.setSelectionRange(pos,pos)};
  $('#stLang').onchange=e=>{ui.langF=e.target.value;renderStudents(c)};
  $('#stAdd').onclick=()=>stModal(null);
  $$('[data-edit-st]').forEach(b=>b.onclick=()=>stModal(getSt(b.dataset.editSt)));
  $$('[data-pause-st]').forEach(b=>b.onclick=()=>{const s=getSt(b.dataset.pauseSt);s.paused=!s.paused;s.pausedSince=s.paused?iso(TODAY):null;saveDB();
    toast(s.paused?`⏸ ${esc(s.name)} — занятия приостановлены`:`▶️ ${esc(s.name)} снова в строю!`);renderStudents(c)});
}
function stCard(st){
  const L=LANGS[st.lang];const pct=st.aboTotal?Math.round(st.aboLeft/st.aboTotal*100):0;
  const dw=new Set(st.schedule.map(x=>+x.dow));let next=null;
  for(let i=0;i<8&&!next;i++){const d=addD(TODAY,i);if(dw.has(dowOf(d))&&!st.paused)next=`${i===0?'сегодня':i===1?'завтра':fm(d,{weekday:'short'})} ${st.schedule.find(x=>+x.dow===dowOf(d)).time}`}
  return`<div class="card st-card hoverable ${st.paused?'paused':''}">
    <div class="st-top"><span class="ava" style="--c:${L.c}">${initials(st.name)}</span>
      <div><div class="st-name">${esc(st.name)}</div><div class="st-meta">${L.flag} ${L.label} · ${st.level}</div></div>
      <span class="st-pts" title="Бонусные баллы">★ ${st.bonusPoints}</span></div>
    <div class="st-line"><span>📞 ${esc(st.phone)}</span><span>🔥 серия: <b>${st.streak}</b></span></div>
    <div class="sched-chips">${st.schedule.length?st.schedule.map(x=>`<span class="chip c-teal">${DOWS[x.dow-1]} ${x.time}</span>`).join(''):'<span class="chip c-gray">расписание не задано</span>'}${st.paused?'<span class="chip c-amber">⏸ пауза</span>':''}</div>
    <div><div class="st-line"><span>Абонемент</span><b>${st.aboLeft} из ${st.aboTotal}</b></div><div class="bar"><i class="${pct<=25?'low':''}" style="width:${pct}%"></i></div></div>
    <div class="st-line"><span>${st.debt>0?'Долг':'Цена занятия'}</span><b style="${st.debt>0?'color:var(--pen)':''}">${st.debt>0?money(st.debt):money(st.price)}</b></div>
    ${st.advance>0?`<div class="st-line"><span>Аванс</span><b style="color:var(--green)">${money(st.advance)}</b></div>`:''}
    <div class="st-line"><span>Ближайшее занятие</span><b>${next||'—'}</b></div>
    <div class="st-acts"><button class="btn sm" data-edit-st="${st.id}">✏️ Редактировать</button><button class="btn sm ghost" data-pause-st="${st.id}">${st.paused?'▶️ Вернуть':'⏸ Пауза'}</button></div>
  </div>`;
}
function stModal(st){
  const isNew=!st;let slots=st?st.schedule.map(x=>({...x})):[];const bday=st?st.birthday:iso(new Date(2000,0,1));
  const slotsHtml=()=>slots.map((x,i)=>`<div class="slot-row"><select data-sd="${i}" style="width:110px">${DOWS.map((d,k)=>`<option value="${k+1}" ${+x.dow===k+1?'selected':''}>${d}</option>`).join('')}</select><input type="time" data-st="${i}" value="${x.time}" style="width:120px"><button class="btn sm ghost" data-sdel="${i}">✕</button></div>`).join('');
  openModal(`<div class="m-h">${isNew?'Новый ученик':'Редактировать: '+esc(st.name)}</div>
  <div class="form-grid">
    <label class="f full">Имя и фамилия<input id="f-name" value="${esc(st?.name||'')}" placeholder="Например: Мария Иванова"></label>
    <label class="f">Язык<select id="f-lang">${Object.keys(LANGS).map(k=>`<option value="${k}" ${st?.lang===k?'selected':''}>${LANGS[k].flag} ${LANGS[k].label}</option>`).join('')}</select></label>
    <label class="f">Уровень<select id="f-level">${LEVELS.map(l=>`<option ${st?.level===l?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="f">Телефон<input id="f-phone" value="${esc(st?.phone||'')}" placeholder="+7 900 000-00-00"></label>
    <label class="f">Дата рождения<input type="date" id="f-bday" value="${bday}"></label>
    <label class="f">Цена занятия, ₽<input type="number" id="f-price" value="${st?.price??1000}" min="0" step="50"></label>
    <label class="f">Абонемент, занятий<input type="number" id="f-abo" value="${st?.aboTotal??8}" min="1"></label>
    <div class="full"><div style="font-size:12px;font-weight:600;color:var(--mut);margin-bottom:6px">Расписание по дням</div><div id="f-slots">${slotsHtml()}</div><button class="btn sm" id="f-sadd">＋ Добавить слот</button></div>
  </div>
  <div class="m-f"><button class="btn" id="m-c">Отмена</button><button class="btn primary" id="m-o">${isNew?'Создать':'Сохранить'}</button></div>`,true);
  const refresh=()=>{$('#f-slots').innerHTML=slotsHtml();bindSlots()};
  function bindSlots(){
    $$('[data-sd]').forEach(s=>s.onchange=()=>{slots[+s.dataset.sd].dow=+s.value});

function neSave(){
  if(!ui.draft)return;const i=db.notes.findIndex(n=>n.id===ui.draft.id);if(i<0)return;
  ui.draft.sync='pending';ui.draft.ts=Date.now();db.notes[i]=JSON.parse(JSON.stringify(ui.draft));saveDB();

  toast('💾 Конспект сохранён и поставлен в очередь синхронизации');renderTop();
  if(db.settings.autoSync)setTimeout(()=>syncNow(false),900);
}
/* --- markup --- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}
function renderMarkup(src){
  const lines=String(src||'').split('\n');let out='',para=[],list=[],cards=false,rows=[];
  const fP=()=>{if(para.length){out+=`<p>${inline(para.join(' '))}</p>`;para=[]}};
  const fL=()=>{if(list.length){out+=`<ul>${list.map(x=>`<li>${inline(x)}</li>`).join('')}</ul>`;list=[]}};
  const fC=()=>{if(rows.length){out+=`<div class="cards">${rows.map(r=>`<div class="fcard"><span class="fc-f">${esc(r[0])}</span><span class="fc-b">${esc(r[1])}</span></div>`).join('')}</div>`;rows=[]}};
  const pair=line=>{const p=line.split(/\s*(?:—|–)\s*|\s+-\s+/);return p.length>=2&&p[0].trim()?[p[0].trim(),p.slice(1).join(' — ').trim()]:null};
  for(const raw of lines){const line=raw.trimEnd();
    if(/^##\s+/.test(line)){fP();fL();fC();const t=line.replace(/^##\s+/,'').trim();
      if(/^карточки/i.test(t)){cards=true;out+='<h4 class="cards-h">🃏 Карточки</h4>'}else{cards=false;out+=`<h3>${inline(t)}</h3>`}}
    else if(line.trim()===''){fP();fL();if(cards){fC();cards=false}}
    else if(cards){fP();fL();const pr=pair(line.trim());if(pr)rows.push(pr)}
    else if(/^\s*[-•]\s+/.test(line)){fP();list.push(line.replace(/^\s*[-•]\s+/,''))}
    else{fL();para.push(line.trim())}}
  fP();fL();fC();return out;
}
function extractCards(src){
  const out=[];let cards=false;
  for(const raw of String(src||'').split('\n')){const line=raw.trim();
    if(/^##\s+/.test(line)){cards=/^карточки/i.test(line.replace(/^##\s+/,'').trim());continue}
    if(!cards||!line)continue;
    const p=line.split(/\s*(?:—|–)\s*|\s+-\s+/);if(p.length>=2&&p[0].trim())out.push([p[0].trim(),p.slice(1).join(' — ').trim()])}
  return out;
}

function download(name,content,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function csv(name,head,rows){
  let s='\uFEFF'+[head,...rows].map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const b=new Blob([s],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('⬇ CSV скачан');
}

        packageCost: student.aboTotal * student.price,

    var button = document.getElementById('ultraTutorBtn');
    if (button) {
      button.innerHTML = '<span class="dot"></span>Урок PRO';
      button.title = 'Создать готовый к проведению урок';
      button.onclick = mlOpen;
      return;
    }
    var target = document.querySelector('#topbar .tb-right');
    if (!target) return;
    button = document.createElement('button');
    button.id = 'ultraTutorBtn'; button.className = 'pill'; button.type = 'button'; button.innerHTML = '<span class="dot"></span>Урок PRO'; button.title = 'Создать готовый к проведению урок'; button.onclick = mlOpen;
    target.insertBefore(button, target.firstChild);
  }
  var style = '<style id="merged-lesson-style">.pro-lesson-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pro-lesson-form .full{grid-column:1/-1}.ml-options{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-radius:9px;background:var(--mint);font-size:12px;color:var(--ink)}.ml-options label{display:flex;align-items:center;gap:5px}.ml-options input{width:auto}@media(max-width:640px){.pro-lesson-form{grid-template-columns:1fr}}</style>';
  if (!document.getElementById('merged-lesson-style')) document.head.insertAdjacentHTML('beforeend', style);
  setTimeout(mlInstallButton, 0);
})();
