<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>СтудияPRO · Управление</title>

<style>
:root{
  --bg:#eaf6ff;
  --bg2:#dff0ff;
  --card:#ffffff;
  --ink:#173753;
  --mut:#6d84a0;
  --line:#dbeaf7;
  --sun:#ffc93c; --sun-d:#e0a415;
  --coral:#ff6f59; --coral-d:#e34a35;
  --sky:#3dccc7; --sky-d:#1fa39e;
  --blue:#3da9fc; --blue-d:#1f83d6;
  --purple:#8c6fff; --purple-d:#6a4de0;
  --grass:#4bd07a; --grass-d:#26a856;
  --shadow-lg:0 14px 32px rgba(23,55,83,.14);
  --shadow-sm:0 3px 0 rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:16px/1.5 'Nunito',system-ui,sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #fff7de 0%, transparent 45%),
    radial-gradient(circle at 90% 4%, #dcf7ff 0%, transparent 40%),
    linear-gradient(180deg, var(--bg), var(--bg2));
  color:var(--ink);
  min-height:100vh;
}
body.dark{
  --bg:#141a2e; --bg2:#0f1424; --card:#1d2338; --ink:#eaf1ff; --mut:#93a3c4; --line:#2a3352;
}
h1,h2,h3,.headline{font-family:'Fredoka',sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(120deg, var(--purple), var(--blue) 55%, var(--sky));
  box-shadow:0 6px 22px rgba(60,80,180,.25);
}
.bar{display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap;padding:8px 0}
.logo{font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;color:#fff;display:flex;align-items:center;gap:8px;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.logo span{font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;opacity:.85;letter-spacing:.02em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;color:#fff;
  background:rgba(255,255,255,.16);border:none;border-radius:14px;
  padding:9px 14px;cursor:pointer;transition:.15s;
}
.tab:hover{background:rgba(255,255,255,.28)}
.tab.on{background:#fff;color:var(--purple-d);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.iconbtn{width:36px;height:36px;border-radius:12px;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer}
main{padding:22px 0 90px}

/* ===== Cards & 3D chunky elements ===== */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow-lg);
}
.card-pad{padding:18px}
.mt{margin-top:16px} .mt4{margin-top:4px} .mt8{margin-top:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:120px}
.sm{font-size:13px} .xs{font-size:11px}
.mut{color:var(--mut)}
.b{font-weight:800}
.headline{font-weight:700;font-size:17px}
.sec{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;margin-bottom:2px;display:flex;align-items:center;gap:6px}

.btn{
  font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;
  border:none;border-radius:14px;padding:10px 18px;cursor:pointer;color:var(--ink);
  background:#f1f6fc;box-shadow:var(--shadow-sm);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:11px}
.btn.xs{padding:4px 9px;font-size:11px;border-radius:9px;box-shadow:none}
.btn.lg{padding:14px 26px;font-size:16px;border-radius:18px}
.btn.sun{background:var(--sun);color:#5b3d00;box-shadow:0 4px 0 var(--sun-d)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d)}
.btn.sky{background:var(--sky);color:#013b39;box-shadow:0 4px 0 var(--sky-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.purple{background:var(--purple);color:#fff;box-shadow:0 4px 0 var(--purple-d)}
.btn.grass{background:var(--grass);color:#083c1b;box-shadow:0 4px 0 var(--grass-d)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn.d{background:#ffe4e0;color:var(--coral-d)}

.inp,select.inp,textarea.inp{
  font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:14px;padding:9px 13px;width:100%;
}
textarea.inp{resize:vertical;min-height:70px}
.inp-sm{max-width:130px} .inp-md{max-width:220px}

.chip{
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;
  padding:5px 13px;font-weight:800;font-size:12px;font-family:'Fredoka',sans-serif;
}
.chip.sun{background:#fff3d1;color:#8a5b00}
.chip.coral{background:#ffe1dc;color:#b93a24}
.chip.sky{background:#d7f7f5;color:#0f6b67}
.chip.blue{background:#dcefff;color:#0e5aa6}
.chip.purple{background:#ece5ff;color:#5335c9}
.chip.grass{background:#e0f9e8;color:#1c7d3f}

.stat{
  border-radius:22px;padding:16px;color:#fff;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;gap:2px;min-height:96px;justify-content:center;
}
.stat .n{font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px}
.stat .l{font-size:12px;opacity:.9;font-weight:800}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.seg button{font-family:'Fredoka',sans-serif;font-weight:600;border:none;background:transparent;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--purple);color:#fff}

.bar-row{display:flex;align-items:center;gap:8px}
.bar-track{flex:1;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;border-radius:999px}

.empty{border:3px dashed var(--line);border-radius:22px;padding:30px;text-align:center}
.empty .ic{font-size:34px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'Fredoka',sans-serif;font-weight:600;padding:11px 22px;border-radius:999px;font-size:13px;z-index:999;display:none;box-shadow:var(--shadow-lg)}

.fabw{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:80}
.fab{width:56px;height:56px;border-radius:50%;border:none;font-size:22px;cursor:pointer;background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral-d)}
.fab:active{transform:translateY(4px);box-shadow:none}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
th{font-family:'Fredoka',sans-serif;color:var(--mut);font-weight:600}

@media print{ header,.no-print{display:none!important} }
@media (max-width:640px){ .statgrid{grid-template-columns:repeat(2,1fr)} }
</style>
<style id="notebook-style">
/* ===== ТЕТРАДНЫЙ СТИЛЬ ===== */
:root{--paper:#fffdf4;--paper-line:#b9d8f0;--paper-margin:#e8a0a0;--ink:#25384a;--blue-ink:#285a8f;--card:rgba(255,255,255,.78);--line:#c9dced;--shadow-lg:0 5px 14px rgba(48,76,98,.10);--shadow-sm:0 2px 0 rgba(48,76,98,.10)}
body{font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive,sans-serif;background-color:var(--paper);background-image:linear-gradient(90deg,transparent 0,transparent 42px,rgba(232,160,160,.55) 43px,transparent 44px),repeating-linear-gradient(0deg,transparent 0,transparent 30px,var(--paper-line) 31px,transparent 32px);background-attachment:fixed;color:var(--ink)}
body.dark{--paper:#202832;--paper-line:#40566b;--paper-margin:#9b6262;--ink:#eef5fb;--card:rgba(32,40,50,.88);--line:#496074}
h1,h2,h3,.headline,.logo,.tab,.btn,.chip,.stat .n,.sec,th{font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive,sans-serif}
header{background:rgba(255,253,244,.9);backdrop-filter:blur(5px);border-bottom:2px solid var(--paper-line);box-shadow:0 3px 10px rgba(48,76,98,.10)}
body.dark header{background:rgba(32,40,50,.92)}
.logo{color:var(--blue-ink);text-shadow:none}.logo span{color:var(--blue-ink)}
.tab{color:var(--blue-ink);background:transparent;border-bottom:2px solid transparent;border-radius:0}.tab:hover{background:rgba(185,216,240,.25)}.tab.on{background:rgba(185,216,240,.35);color:var(--blue-ink);box-shadow:none;border-bottom-color:var(--blue-ink)}
.iconbtn{color:var(--blue-ink);background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow-lg);position:relative}
.card:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0,transparent 30px,rgba(185,216,240,.18) 31px,transparent 32px);pointer-events:none;border-radius:inherit}
.btn{border-radius:4px;background:#f7f2df;box-shadow:0 2px 0 rgba(48,76,98,.16);border:1px solid #c8d7e2}.btn.sun,.btn.coral,.btn.sky,.btn.blue,.btn.purple,.btn.grass{box-shadow:0 2px 0 rgba(48,76,98,.18);filter:saturate(.75)}
.inp,select.inp,textarea.inp{background:rgba(255,255,255,.72);border:0;border-bottom:2px solid var(--paper-line);border-radius:0;color:var(--ink)}
.chip{border-radius:3px;transform:rotate(-.4deg);border:1px dashed rgba(40,90,143,.25)}
.stat{border-radius:4px;box-shadow:var(--shadow-lg);filter:saturate(.65)}
.seg{border-radius:4px;box-shadow:none;background:transparent}.seg button{border-right:1px solid var(--line)}.seg button.on{background:rgba(185,216,240,.45);color:var(--blue-ink)}
.empty{border:2px dashed var(--paper-line);border-radius:4px;background:rgba(255,255,255,.35)}
table{background:rgba(255,255,255,.28)}th,td{border-bottom:1px dashed var(--paper-line)}
.fabw{right:18px;bottom:18px}.fab{border-radius:4px;box-shadow:0 3px 0 rgba(48,76,98,.2);filter:saturate(.7)}
.toast{border-radius:4px}
</style>

<body>
<header>
  <div class="wrap bar">
    <div class="logo">🎬 СтудияPRO <span>· УПРАВЛЕНИЕ</span></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-t="dash" onclick="setTab('dash')">🏠 Дашборд</button>
      <button class="tab" data-t="people" onclick="setTab('people')">🧑‍🏫 Люди</button>
      <button class="tab" data-t="sched" onclick="setTab('sched')">🗓 Расписание</button>
      <button class="tab" data-t="fin" onclick="setTab('fin')">💰 Финансы</button>
      <button class="tab" data-t="data" onclick="setTab('data')">🔗 Данные</button>
      <button class="tab" data-t="gen" onclick="setTab('gen')">🎁 Генераторы</button>
    </div>
    <button class="iconbtn no-print" onclick="toggleDark()" title="Тема">🌙</button>
  </div>
</header>

<main class="wrap">
  <div id="tab-dash"></div>
  <div id="tab-people" style="display:none"></div>
  <div id="tab-sched" style="display:none"></div>
  <div id="tab-fin" style="display:none"></div>
  <div id="tab-data" style="display:none"></div>
  <div id="tab-gen" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>
<div class="fabw no-print">
  <button class="fab" title="Добавить занятие" onclick="setTab('sched')">🗓</button>
</div>

<script>
// =====================================================================
//  БАЗОВЫЕ УТИЛИТЫ И ХРАНИЛИЩЕ
// =====================================================================
function iso(d){ d=d||new Date(); var y=d.getFullYear(), m=('0'+(d.getMonth()+1)).slice(-2), day=('0'+d.getDate()).slice(-2); return y+'-'+m+'-'+day; }
window.uid = function(){ return Math.random().toString(36).slice(2,9); };
window.today = function(){ return iso(); };
window.addD = function(s,n){ var d=new Date(s+'T12:00'); d.setDate(d.getDate()+n); return iso(d); };
window.fmt = function(s){ return new Date(s+'T12:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.',''); };
window.esc = function(s){ if (s==null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
window.empty = function(t,x){ return '<div class="empty"><div class="ic">🌤️</div><div class="b mt8">'+t+'</div><div class="sm mut mt4">'+x+'</div></div>'; };
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function money(n){ return (Number(n)||0).toLocaleString('ru-RU') + ' ₽'; }
function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.display='none'; }, 2400);
}

window.KEY = 'studio_pro_admin_v1';
function defaultDB(){
  return { theme:'light', teachers:[], students:[], lessons:[], payments:[], expenses:[], reminders:[] };
}
window.loadDB = function(){
  try{
    var r = localStorage.getItem(KEY);
    if (r){
      var d = JSON.parse(r);
      var def = defaultDB();
      for (var k in def){ if (!d[k]) d[k] = def[k]; }
      return d;
    }
  } catch(e){}
  return defaultDB();
};
window.DB = loadDB();
window.saveDB = function(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ toast('Не удалось сохранить — освободите память браузера'); } if (DB.theme==='dark') document.body.classList.add('dark'); };
if (DB.theme === 'dark') document.body.classList.add('dark');

window.toggleDark = function(){ document.body.classList.toggle('dark'); DB.theme = document.body.classList.contains('dark') ? 'dark' : 'light'; saveDB(); };

window.TAB = 'dash';
window.setTab = function(t){
  TAB = t;
  ['dash','people','sched','fin','data','gen'].forEach(function(k){
    document.getElementById('tab-'+k).style.display = (k===t) ? '' : 'none';
  });
  document.querySelectorAll('#tabs .tab').forEach(function(b){ b.classList.toggle('on', b.dataset.t === t); });
  renderAll();
};

function renderAll(){
  if (TAB === 'dash') renderDash();
  if (TAB === 'people') renderPeople();
  if (TAB === 'sched') renderSched();
  if (TAB === 'fin') renderFin();
  if (TAB === 'data') renderData();
  if (TAB === 'gen') renderGenTab();
}

// =====================================================================
//  ЛЮДИ: преподаватели и ученики
// =====================================================================
window.PTAB = 'teachers';
window.setPTab = function(t){ PTAB = t; renderPeople(); };

window.teacher = function(id){ for (var i=0;i<DB.teachers.length;i++){ if (DB.teachers[i].id===id) return DB.teachers[i]; } return null; };
window.teacherName = function(id){ var t = teacher(id); return t ? t.name : '(не назначен)'; };
window.teacherOptions = function(sel){ var h='<option value="">— преподаватель —</option>'; for (var i=0;i<DB.teachers.length;i++){ var t=DB.teachers[i]; h+='<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+'</option>'; } return h; };
window.student = function(id){ for (var i=0;i<DB.students.length;i++){ if (DB.students[i].id===id) return DB.students[i]; } return null; };
window.studentName = function(id){ var s = student(id); return s ? s.name : '(не найден)'; };
window.studentOptions = function(sel){ var h='<option value="">— ученик —</option>'; for (var i=0;i<DB.students.length;i++){ var s=DB.students[i]; h+='<option value="'+s.id+'"'+(s.id===sel?' selected':'')+'>'+esc(s.name)+'</option>'; } return h; };

var TCOLORS = ['sun','coral','sky','blue','purple','grass'];
window.addTeacher = function(){
  var n=document.getElementById('tcname'), sub=document.getElementById('tcsubj'), ph=document.getElementById('tcphone'), rt=document.getElementById('tcrate');
  if (!n.value.trim()){ toast('Введите имя преподавателя'); return; }
  DB.teachers.push({ id:uid(), name:n.value.trim(), subject:sub.value.trim(), phone:ph.value.trim(), rate:Number(rt.value)||0, color: pick(TCOLORS) });
  saveDB(); n.value=''; sub.value=''; ph.value=''; rt.value=''; renderPeople(); toast('Преподаватель добавлен 🧑‍🏫');
};
window.delTeacher = function(id){
  if (!confirm('Удалить преподавателя? Ученики останутся, но без назначенного преподавателя.')) return;
  DB.teachers = DB.teachers.filter(function(t){ return t.id!==id; });
  DB.students.forEach(function(s){ if (s.teacherId===id) s.teacherId=''; });
  DB.lessons = DB.lessons.filter(function(l){ return l.teacherId!==id; });
  saveDB(); renderPeople(); toast('Преподаватель удалён');
};
window.addStudent = function(){
  var n=document.getElementById('stname'), ph=document.getElementById('stphone'), tid=document.getElementById('stteacher').value, fmt=document.getElementById('stformat').value;
  if (!n.value.trim()){ toast('Введите имя ученика'); return; }
  DB.students.push({ id:uid(), name:n.value.trim(), phone:ph.value.trim(), teacherId:tid, format:fmt, status:'активен', note:'' });
  saveDB(); n.value=''; ph.value=''; renderPeople(); toast('Ученик добавлен 🎓');
};
window.delStudent = function(id){
  if (!confirm('Удалить ученика и все связанные записи (занятия, оплаты)?')) return;
  DB.students = DB.students.filter(function(s){ return s.id!==id; });
  DB.lessons = DB.lessons.filter(function(l){ return l.studentId!==id; });
  DB.payments = DB.payments.filter(function(p){ return p.studentId!==id; });
  saveDB(); renderPeople(); toast('Ученик удалён');
};
window.setStudentStatus = function(id, val){
  var s = student(id); if (!s) return; s.status = val; saveDB(); renderPeople();
};

function renderPeople(){
  var h = '<div class="card card-pad"><div class="row"><div class="sec grow">🧑‍🏫 Люди студии</div>';
  h += '<div class="seg"><button class="'+(PTAB==='teachers'?'on':'')+'" onclick="setPTab(\'teachers\')">Преподаватели</button><button class="'+(PTAB==='students'?'on':'')+'" onclick="setPTab(\'students\')">Ученики</button></div>';
  h += '</div></div>';

  if (PTAB === 'teachers') h += renderTeachers();
  else h += renderStudents();

  document.getElementById('tab-people').innerHTML = h;
}

function renderTeachers(){
  var h = '<div class="card card-pad mt"><div class="sec">Новый преподаватель</div>';
  h += '<div class="row mt8"><input class="inp grow" id="tcname" placeholder="Имя преподавателя">';
  h += '<input class="inp inp-md" id="tcsubj" placeholder="Предмет / направление">';
  h += '<input class="inp inp-sm" id="tcphone" placeholder="Телефон">';
  h += '<input class="inp inp-sm" id="tcrate" type="number" placeholder="Ставка за занятие, ₽">';
  h += '<button class="btn purple" onclick="addTeacher()">+ Добавить</button></div></div>';

  if (!DB.teachers.length){ h += '<div class="mt">'+empty('Пока нет преподавателей','Добавьте первого в форме выше.')+'</div>'; return h; }

  var monthStart = today().slice(0,7)+'-01';
  h += '<div class="statgrid mt">';
  DB.teachers.forEach(function(t){
    var lessonsMonth = DB.lessons.filter(function(l){ return l.teacherId===t.id && l.status==='проведено' && l.date>=monthStart; }).length;
    var studCount = DB.students.filter(function(s){ return s.teacherId===t.id; }).length;
    var earned = lessonsMonth * (t.rate||0);
    h += '<div class="card card-pad">';
    h += '<div class="row"><span class="chip '+t.color+'">'+esc(t.name)+'</span></div>';
    h += '<div class="sm mut mt8">'+(esc(t.subject)||'без специализации')+(t.phone?' · '+esc(t.phone):'')+'</div>';
    h += '<div class="row mt8" style="flex-wrap:wrap;gap:6px">';

function monthKey(dstr){ return dstr.slice(0,7); }
function last6Months(){
  var arr = [], d = new Date();
  for (var i=5;i>=0;i--){ var x = new Date(d.getFullYear(), d.getMonth()-i, 1); arr.push(x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)); }
  return arr;
}

  DB.expenses.forEach(function(e){ var m=monthKey(e.date); if (expByM[m]!==undefined) expByM[m]+=Number(e.amount)||0; });
  var maxV = 1; months.forEach(function(m){ maxV = Math.max(maxV, revByM[m], expByM[m]); });

  var h = '<div class="card card-pad mt"><div class="sec">📊 Доходы и расходы за 6 месяцев</div>';

    h += '<div class="grow"><div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:'+(revByM[m]/maxV*100)+'%;background:var(--grass)"></div></div><span class="xs mut" style="min-width:70px">'+money(revByM[m])+'</span></div>';
    h += '<div class="bar-row mt4"><div class="bar-track"><div class="bar-fill" style="width:'+(expByM[m]/maxV*100)+'%;background:var(--coral)"></div></div><span class="xs mut" style="min-width:70px">'+money(expByM[m])+'</span></div></div>';
    h += '</div></div>';
  });
  h += '</div>';

  var monthStart = today().slice(0,7)+'-01';
  var revMonth = 0, expMonth = 0;
  DB.payments.forEach(function(p){ if (p.date>=monthStart) revMonth += Number(p.amount)||0; });
  DB.expenses.forEach(function(e){ if (e.date>=monthStart) expMonth += Number(e.amount)||0; });
  var lessonsMonth = DB.lessons.filter(function(l){ return l.status==='проведено' && l.date>=monthStart; }).length;

  h += '<div class="statgrid mt8">';
  h += '<div class="stat" style="background:linear-gradient(135deg,var(--grass),var(--sky))"><div class="n">'+money(revMonth)+'</div><div class="l">доход</div></div>';
  h += '<div class="stat" style="background:linear-gradient(135deg,var(--coral),#ff9a6a)"><div class="n">'+money(expMonth)+'</div><div class="l">расход</div></div>';
  h += '<div class="stat" style="background:linear-gradient(135deg,var(--purple),var(--blue))"><div class="n">'+money(revMonth-expMonth)+'</div><div class="l">прибыль</div></div>';

window.importFile = function(inp){
  var f = inp.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(String(r.result));
      if (!d || !d.teachers) throw new Error('bad');
      var def = defaultDB();
      for (var k in def){ if (!d[k]) d[k] = def[k]; }
      DB = d; saveDB(); renderAll(); toast('Данные загружены ✅');
    } catch(e){ toast('Файл не похож на резервную копию студии'); }
  };
  r.readAsText(f); inp.value = '';
};
function toCSV(rows, headers){
  var lines = [headers.join(';')];
  rows.forEach(function(r){ lines.push(r.map(function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'; }).join(';')); });
  return lines.join('\r\n');
}
window.exportCSV = function(type){
  var csv = '', name = '';
  if (type === 'students'){
    csv = toCSV(DB.students.map(function(s){ return [s.name, s.phone, teacherName(s.teacherId), s.format, s.status]; }), ['Имя','Телефон','Преподаватель','Формат','Статус']);
    name = 'ученики.csv';
  } else if (type === 'teachers'){
    csv = toCSV(DB.teachers.map(function(t){ return [t.name, t.subject, t.phone, t.rate]; }), ['Имя','Предмет','Телефон','Ставка']);
    name = 'преподаватели.csv';
  } else if (type === 'payments'){
    csv = toCSV(DB.payments.map(function(p){ return [p.date, studentName(p.studentId), p.amount, p.method, p.comment]; }), ['Дата','Ученик','Сумма','Способ','Комментарий']);
    name = 'оплаты.csv';
  } else if (type === 'lessons'){
    csv = toCSV(DB.lessons.map(function(l){ return [l.date, l.time, teacherName(l.teacherId), studentName(l.studentId), l.subject, l.format, l.status]; }), ['Дата','Время','Преподаватель','Ученик','Тема','Формат','Статус']);
    name = 'расписание.csv';
  }
  var blob = new Blob(['\ufeff'+csv], {type:'text/csv'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
};
window.icsExportSchedule = function(){
  var list = DB.lessons.filter(function(l){ return l.status!=='отменено'; });
  if (!list.length){ toast('Нет занятий для экспорта'); return; }
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//StudioPRO//Schedule//RU'];
  list.forEach(function(l){
    var d = l.date.replace(/-/g,''), t = (l.time||'12:00').replace(':','')+'00';
    var title = String(studentName(l.studentId))+' — '+String(teacherName(l.teacherId))+(l.subject?' ('+String(l.subject)+')':''); title = title.replace(/[\r\n;,]/g,' ');
    lines.push('BEGIN:VEVENT','UID:'+l.id+'@studiopro','DTSTART:'+d+'T'+t,'SUMMARY:'+title.replace(/[\r\n]+/g,' '),'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'расписание.ics'; a.click();
  toast('Файл .ics сохранён');
};
