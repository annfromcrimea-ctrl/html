<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Репетитор PRO · Генератор + Журнал</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===== */
    :root {
      --bg: #eef6ec;
      --card: #fff;
      --ink: #20362a;
      --mut: #7c9083;
      --line: #dcead9;
      --pine: #1e7a4c;
      --leaf: #2f9e63;
      --sea: #4d9de0;
      --gold: #f5a623;
      --red: #e74c3c;
      --marker: #ffcf4d;
      --guach: #ff8a5c;
      --mint: #39b98a;
      --purple: #8a5fb0;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      margin: 0;
      font: 14px/1.5 'Nunito', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      background-image: radial-gradient(var(--line) 1.2px, transparent 1.6px);
      background-size: 24px 24px;
      transition: background 0.2s, color 0.2s;
    }
    body.dark {
      --bg: #16211a;
      --card: #1e2b22;
      --ink: #e7f2e9;
      --mut: #93a79a;
      --line: #2c3d31;
    }
    button, input, select, textarea { font: inherit; outline: none; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 14px; }

    /* ===== ШАПКА ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(135deg, var(--leaf), var(--pine));
      color: #fff;
      box-shadow: 0 6px 18px rgba(30, 122, 76, 0.25);
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 54px;
      flex-wrap: wrap;
    }
    .logo { font-weight: 900; font-size: 18px; }
    .tabs {
      display: flex;
      gap: 6px;
      padding: 0 0 10px;
      overflow: auto;
    }
    .tab {
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      padding: 6px 16px;
      font-weight: 800;
      white-space: nowrap;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab.on { background: #fff; color: var(--pine); }
    .tab:hover { background: rgba(255, 255, 255, 0.3); }

    /* ===== КНОПКИ, КАРТОЧКИ, ПОЛЯ ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 7px 13px;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
      text-decoration: none;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(30, 122, 76, 0.18); }
    .btn.p { background: var(--leaf); border-color: var(--leaf); color: #fff; }
    .btn.b { background: var(--sea); border-color: var(--sea); color: #fff; }
    .btn.g { background: var(--gold); border-color: var(--gold); color: #20362a; }
    .btn.r { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.sm { padding: 4px 9px; font-size: 12px; }
    .btn.d { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.v { background: var(--purple); border-color: var(--purple); color: #fff; }

    .inp {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 7px 10px;
      width: 100%;
      border-radius: 12px;
    }
    .card {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(30, 122, 76, 0.10);
      padding: 16px;
    }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .mut { color: var(--mut); }
    .sm { font-size: 12px; }
    .xs { font-size: 11px; }
    .b { font-weight: 800; }
    .mt { margin-top: 14px; }
    .mt8 { margin-top: 8px; }
    .mt4 { margin-top: 4px; }
    .mb { margin-bottom: 10px; }
    .sec {
      font-weight: 900;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.06em;
      margin: 0 0 8px;
      color: var(--pine);
    }
    .seg {
      display: inline-flex;
      border-radius: 999px;
      background: var(--card);
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .seg button {
      border: 0;
      background: none;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      cursor: pointer;
    }
    .seg button.on { background: var(--leaf); color: #fff; }
    .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 900px) { .g3 { grid-template-columns: 1fr; } }

    /* ===== ПРЕВЬЮ КОНСПЕКТА ===== */
    .prev {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      font-size: 14px;
      line-height: 1.55;
      overflow-x: auto;
    }
    body.dark .prev { background: var(--card); }
    .prev h2 { font-size: 20px; color: var(--pine); }
    .prev h3 { font-size: 16px; color: var(--leaf); margin-top: 16px; }
    .prev table { border-collapse: collapse; width: 100%; }
    .prev td, .prev th { border: 1px solid #999; padding: 6px; font-size: 12px; vertical-align: top; }
    .prev ul { margin: 4px 0; }
    .prev li { margin: 3px 0; }
    .prev .checklist { background: #f0f7f0; border-radius: 12px; padding: 12px; margin: 8px 0; }
    .prev .checklist label { display: block; margin: 3px 0; cursor: pointer; }
    .prev .diff-box { background: #f9f9f9; border-left: 4px solid var(--gold); padding: 8px 12px; margin: 6px 0; border-radius: 0 8px 8px 0; }
    body.dark .prev .diff-box { background: #2c3d31; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      margin: 8px 0;
    }
    .card-item {
      border: 2px solid var(--leaf);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      background: #f9f9f9;
      font-weight: 800;
      font-size: 16px;
    }
    body.dark .card-item { background: #2c3d31; }

    .toast {
      position: fixed;
      left: 14px;
      bottom: 14px;
      background: var(--pine);
      color: #fff;
      padding: 10px 16px;
      font-weight: 800;
      border-radius: 14px;
      z-index: 99;
      display: none;
    }
    .chip {
      display: inline-block;
      border: 1px solid;
      padding: 1px 8px;
      font-size: 11px;
      font-weight: 800;
      border-radius: 999px;
    }
    .prog { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .prog > div { height: 100%; }

    /* ===== ТАБЛИЦЫ ЖУРНАЛА ===== */
    table.jr { border-collapse: collapse; width: 100%; font-size: 13px; }
    .jr th, .jr td { border: 1px solid var(--line); padding: 5px; vertical-align: top; text-align: left; }
    .jr thead th { background: var(--line); }
    .stk { position: sticky; left: 0; background: var(--card); z-index: 5; }
    td.stk { background: var(--card); }
    .cell {
      width: 100%;
      min-height: 46px;
      border: 0;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px;
      color: var(--ink);
      border-radius: 10px;
      cursor: pointer;
    }
    .cell:hover { background: var(--line); }
    .kidname {
      border: none;
      background: none;
      font-weight: 800;
      color: var(--ink);
      padding: 0;
      font-size: 13px;
      cursor: pointer;
    }
    .kidname:hover { color: var(--leaf); }
    .bg {
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 900;
      border-radius: 8px;
    }
    .g3 { background: var(--leaf); color: #fff; }
    .g2 { background: var(--marker); color: #20362a; }
    .g1 { background: var(--red); color: #fff; }
    .st {
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 800;
      border-radius: 8px;
    }
    .s5, .s6 { background: var(--leaf); color: #fff; }
    .s3, .s4 { background: var(--marker); color: #20362a; }
    .s0, .s1, .s2 { background: rgba(224, 90, 78, 0.14); color: var(--red); border: 1px solid rgba(224, 90, 78, 0.5); }

    /* ===== МОДАЛЬНЫЕ ОКНА ===== */
    .ovl {
      position: fixed;
      inset: 0;
      background: rgba(20, 40, 28, 0.5);
      z-index: 80;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .mdl {
      background: var(--card);
      color: var(--ink);
      border-radius: 22px;
      max-width: 540px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .pl {
      position: fixed;
      inset: 0;
      z-index: 75;
    }
    .pb {
      position: absolute;
      width: 300px;
      background: var(--card);
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.3);
    }
    .fabw {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 70;
    }
    .fab {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 18px rgba(30, 122, 76, 0.3);
      cursor: pointer;
      background: var(--card);
      color: var(--ink);
    }
    .fab.t { background: var(--marker); color: #20362a; }
    .fab.r { background: var(--guach); color: #fff; }
    .fab.m { background: var(--mint); color: #fff; }
    .fab.s { background: var(--sea); color: #fff; }
    .fab.v { background: var(--purple); color: #fff; }

    .note {
      width: 132px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #20362a;
      position: relative;
      border-radius: 14px;
      box-shadow: 0 6px 14px rgba(30, 122, 76, 0.18);
    }
    .note .nx { position: absolute; top: 2px; right: 5px; border: 0; background: none; opacity: 0; cursor: pointer; }
    .note:hover .nx { opacity: 1; }

    .errbox { border: 2px solid var(--red); background: #fff; color: #900; padding: 14px; margin: 16px; font-size: 13px; border-radius: 14px; }
    body.dark .errbox { background: #2c1a1a; color: #f99; }

    @keyframes br {
      0% { transform: scale(0.6); }
      33% { transform: scale(1.5); }
      55% { transform: scale(1.5); }
      100% { transform: scale(0.6); }
    }
    @media print { header, .fabw, .no-print { display: none !important; } body { background: #fff; } }
  </style>

  window.renderCardsModal = function () {
    var h = '<div class="ovl no-print" onclick="closeModal()"><div class="mdl" style="padding:18px;max-width:420px" onclick="event.stopPropagation()">';
    h += '<div class="row sb"><b>🖨 Карточки A4 · звук [' + GSOUND + ']</b><button class="btn sm" onclick="closeModal()">✕</button></div>';
    var w = WGEN[GSOUND] || [];
    h += '<div class="sm mut mt4">Слова: ' + w.join(', ') + '</div>';
    h += '<div class="row mt8"><button class="btn p" onclick="printCardsJournal()">Печать A4</button></div>';
    h += '</div></div>';
    return h;
  };
  window.renderRasp = function () {
    var RASP = [['👋', 'Приветствие'], ['👅', 'Артикуляция'], ['🗣', 'Основная часть'], ['🤸', 'Физминутка'], ['🧠', 'Рефлексия'], ['👋', 'Прощание']];
    var h = '<div class="ovl no-print" onclick="closeModal()"><div class="mdl" style="padding:18px;max-width:420px" onclick="event.stopPropagation()">';
    h += '<div class="row sb"><b>📋 Расписание занятия</b><button class="btn sm" onclick="closeModal()">✕</button></div>';
    h += '<div class="row mt8" style="gap:6px">';
    for (var i = 0; i < RASP.length; i++) { h += '<div class="card" style="padding:10px;text-align:center;width:90px"><div style="font-size:26px">' + RASP[i][0] + '</div><div class="xs b">' + RASP[i][1] + '</div></div>'; }
    h += '</div>';
    h += '<div class="row mt8"><button class="btn p" onclick="printRasp()">Печать</button></div>';
    h += '</div></div>';
    return h;
  };
  window.renderCal = function () {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth();
    var dim = new Date(y, m + 1, 0).getDate();
    var h = '<div class="ovl no-print" onclick="closeModal()"><div class="mdl" style="padding:18px;max-width:560px" onclick="event.stopPropagation()">';
    h += '<div class="row sb"><b>📅 План на ' + now.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }) + '</b><span class="row"><button class="btn sm p" onclick="printCal()">Печать</button><button class="btn sm" onclick="closeModal()">✕</button></span></div>';
    h += '<div class="grid mt8" style="grid-template-columns:repeat(7,1fr);gap:4px">';
    for (var d = 1; d <= dim; d++) {
      var ds = iso(new Date(y, m, d));
      var ls = [];
      for (var i = 0; i < JOURNAL.lessons.length; i++) { if (JOURNAL.lessons[i].date === ds) ls.push(JOURNAL.lessons[i]); }
      h += '<div class="card" style="padding:4px;min-height:52px;text-align:center' + (ls.length ? ';border-color:var(--leaf)' : '') + '"><div class="xs b">' + d + '</div>';
      for (var i = 0; i < ls.length; i++) h += '<div class="xs" style="color:var(--leaf)">●</div>';
      h += '</div>';
    }
    h += '</div>';
    h += '<div class="sm mut mt8">● — запланировано занятие. Список ниже.</div>';
    h += '<div class="mt8" style="max-height:200px;overflow:auto">';
    var any = false;
    for (var d = 1; d <= dim; d++) {
      var ds2 = iso(new Date(y, m, d));
      for (var i = 0; i < JOURNAL.lessons.length; i++) {
        if (JOURNAL.lessons[i].date === ds2) { any = true; h += '<div class="sm mb">' + fmt(ds2) + ' — ' + esc(JOURNAL.lessons[i].topic) + '</div>'; }
      }
    }
    if (!any) h += '<div class="sm mut">На этот месяц занятий нет.</div>';
    h += '</div></div></div>';
    return h;
  };
  window.pullInteract = function () {
    var t = topicNow();
    window.open('https://wordwall.net/search/resource/' + encodeURIComponent(t), '_blank');
    window.open('https://learningapps.org/index.php?s=' + encodeURIComponent(t), '_blank');
    toast('Интерактив 🎮');
  };
  window.saveNotes = function () {
    var el = document.getElementById('notes');
    if (el) try { localStorage.setItem('konspekt-notes', el.value); } catch (e) { }
  };
  window.importTasks = function () {
    var el = document.getElementById('importTxt');
    if (!el) return;
    var t = el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
    if (t.length) { IMPORT_TASKS = IMPORT_TASKS.concat(t); el.value = ''; updImp(); toast('Импортировано: ' + t.length); }
  };
  // =================================================================
  //  ЗАПУСК
  // =================================================================
  window.mmss = function (s) { return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + s % 60; };
  window.lvl = function (m) { if (m === 'В') return 3; if (m === 'С') return 2; if (m === 'Н') return 1; if (typeof m === 'number') return m; return 0; };
  window.PRESETS = [['Артикуляционная гимнастика', 120], ['Дыхательная гимнастика', 180], ['Пальчиковая игра', 180], ['Динамическая пауза', 240], ['Логоритмика', 300]];
  window.RASP = [['👋', 'Приветствие'], ['👅', 'Артикуляция'], ['🗣', 'Основная часть'], ['🤸', 'Физминутка'], ['🧠', 'Рефлексия'], ['👋', 'Прощание']];
  window.APPLY_THEME = function () {
    document.body.classList.toggle('dark', JOURNAL.theme === 'dark');
  };
  setInterval(function () {
    if (!TMR || !TMR.run) return;
    if (TMR.left <= 1) { TMR.left = 0; TMR.run = false; toast('Время вышло! Отличная работа ⭐'); beep(); render(); return; }
    TMR.left--;
    var el = document.getElementById('tmtext');
    if (el) el.textContent = mmss(TMR.left);
    var ring = document.getElementById('tmring');
    if (ring && TMR.total) ring.setAttribute('stroke-dashoffset', String(2 * Math.PI * 54 * (1 - TMR.left / TMR.total)));
  }, 1000);
  setInterval(function () {
    if (MODAL !== 'breath') return;
    BRT = (BRT + 0.1) % 9;
    var lbl = BRT < 3 ? 'Вдох…' : (BRT < 5 ? 'Держим' : 'Выдох…');
    var el = document.getElementById('brl');
    if (el) el.textContent = lbl;
  }, 100);
  try {
    JOURNAL = loadJournal();
    applyTheme();
    render();
    try {
      var lo = localStorage.getItem('last-out');
      if (lo && TAB === 'generator') { OUT = lo; showOut(); }
    } catch (e) { }
  } catch (e) { showErr(e); }
  window.LJ = 'done';
</script>
