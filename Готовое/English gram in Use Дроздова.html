<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Grammar Reference &amp; Practice — Expanded Course</title>
<style>
:root{
--blue:#00247d;--red:#cf142b;--gold:#ffd700;--bg:#f8f9fa;--card:#fff;
--dark:#1a1a2e;--shadow:0 4px 24px rgba(0,0,0,.08);--radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--dark);line-height:1.6}
.app{display:flex;min-height:100vh}
.sidebar{width:310px;background:linear-gradient(180deg,#001845 0%,#000c22 100%);color:#fff;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform .3s}
.sidebar-header{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-header h1{font-size:1.1rem;font-weight:700;color:var(--gold)}
.sidebar-header p{font-size:.75rem;opacity:.8;margin-top:4px}
.flag-bar{display:flex;height:6px;margin-top:12px;border-radius:3px;overflow:hidden}
.flag-bar .b{background:var(--blue)}.flag-bar .w{background:#fff;border-top:1px solid #ddd;border-bottom:1px solid #ddd}.flag-bar .r{background:var(--red)}
.progress-wrap{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.progress-label{font-size:.75rem;display:flex;justify-content:space-between;margin-bottom:6px;opacity:.8}
.progress-bar{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:4px;transition:width .5s;width:0}
.nav-section{padding:8px 0}
.nav-section-title{padding:12px 20px 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;opacity:.6;font-weight:700;color:var(--gold)}
.nav-item{display:flex;align-items:center;padding:8px 20px;cursor:pointer;transition:background .2s;font-size:.82rem;gap:10px}
.nav-item:hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:rgba(255,255,255,.14);border-right:3px solid var(--gold)}
.nav-item .num{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;flex-shrink:0}
.nav-item.done .num{background:var(--gold);color:#001845}
.nav-item .score-badge{margin-left:auto;background:var(--gold);color:#001845;font-size:.6rem;padding:1px 7px;border-radius:10px;font-weight:700}
.main{margin-left:310px;flex:1;padding:32px 40px;max-width:920px}
.lesson-header{margin-bottom:28px}
.lesson-tag{display:inline-block;background:var(--red);color:#fff;font-size:.7rem;padding:3px 12px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.lesson-header h2{font-size:1.6rem;font-weight:800;color:var(--dark)}
.lesson-header .subtitle{color:#777;font-size:.9rem;margin-top:4px}
.grammar-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-bottom:24px;border-left:4px solid var(--blue)}
.grammar-card h3{font-size:1.05rem;margin-bottom:14px;color:var(--blue);display:flex;align-items:center;gap:8px}
.grammar-card h3::before{content:'📘'}
.grammar-card p{margin-bottom:10px;font-size:.9rem}
.grammar-card .en{color:var(--blue);font-weight:600}
.grammar-card .ru{color:#888;font-style:italic;font-size:.85rem}
table.gram{width:100%;border-collapse:collapse;margin:14px 0;font-size:.85rem}
table.gram th{background:#e8eef7;padding:8px 12px;text-align:left;font-weight:600;border-bottom:2px solid var(--blue)}
table.gram td{padding:8px 12px;border-bottom:1px solid #eee}
table.gram tr:hover td{background:#f5f8fc}
.tip{background:#fffde7;border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 8px 8px 0;font-size:.83rem;margin:12px 0}
.tip::before{content:'💡 ';font-size:.9rem}
.example{background:#e8eef7;padding:10px 14px;border-radius:8px;margin:8px 0;font-size:.88rem}
.example .en{font-weight:600;color:var(--blue)}
.example .ru{display:block;font-size:.8rem;color:#777;margin-top:2px}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin:12px 0}
.vocab-item{background:#f5f8fc;padding:8px 12px;border-radius:8px;font-size:.83rem;display:flex;justify-content:space-between;align-items:center}
.vocab-item .en{font-weight:600;color:var(--blue)}
.vocab-item .ru{color:#555}
.exercise-section{margin-bottom:28px}
.exercise-section h3{font-size:1.05rem;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.exercise-section h3::before{content:'✏️'}
.ex-block{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:14px}
.ex-block .q{font-size:.92rem;font-weight:600;margin-bottom:12px}
.options{display:flex;flex-direction:column;gap:7px}
.opt{padding:9px 14px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;transition:all .2s;font-size:.87rem;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--blue);background:#f5f8fc}
.opt.selected{border-color:var(--blue);background:#e8eef7}
.opt.correct{border-color:#009246;background:#d4edda;color:#155724}
.opt.wrong{border-color:var(--red);background:#f8d7da;color:#721c24}
.opt .letter{width:22px;height:22px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.opt.correct .letter{background:#009246;color:#fff}
.opt.wrong .letter{background:var(--red);color:#fff}
.fill-input{border:2px solid #ddd;border-radius:8px;padding:8px 14px;font-size:.92rem;width:280px;outline:none;transition:border .2s;font-family:inherit}
.fill-input:focus{border-color:var(--blue)}
.fill-input.correct{border-color:#009246;background:#d4edda}
.fill-input.wrong{border-color:var(--red);background:#f8d7da}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 24px;border:none;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#001845;transform:translateY(-1px)}
.btn-outline{background:transparent;border:2px solid var(--blue);color:var(--blue)}
.btn-outline:hover{background:#f5f8fc}
.feedback{margin-top:12px;padding:12px 16px;border-radius:8px;font-size:.85rem;display:none}
.feedback.show{display:block}
.feedback.ok{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.feedback.err{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}
.feedback.info{background:#e8f4fd;color:#0c5460;border:1px solid #bee5eb}
.result-box{background:linear-gradient(135deg,#001845,#000c22);color:#fff;border-radius:var(--radius);padding:24px;margin-top:20px;text-align:center;display:none}
.result-box.show{display:block}
.result-box .score-big{font-size:2.5rem;font-weight:800;color:var(--gold)}
.result-box p{opacity:.8;margin-top:6px}
.welcome{text-align:center;padding:60px 20px}
.welcome .flag-big{font-size:4rem;margin-bottom:16px}
.welcome h2{font-size:2rem;font-weight:800;margin-bottom:10px}
.welcome p{color:#777;max-width:600px;margin:0 auto 28px}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:28px;text-align:left}
.feature{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.feature .icon{font-size:1.5rem;margin-bottom:8px}
.feature h4{font-size:.9rem;margin-bottom:4px}
.feature p{font-size:.78rem;color:#888}
.menu-toggle{display:none;position:fixed;top:14px;left:14px;z-index:200;background:var(--blue);color:#fff;border:none;border-radius:10px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0;padding:20px 16px;padding-top:70px}
.menu-toggle{display:block}
.vocab-grid{grid-template-columns:1fr}
}
.hidden{display:none!important}

/* Expanded course and unlimited practice laboratory */
.course-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0 26px}
.summary-stat{background:linear-gradient(135deg,#001845,#073b7a);color:#fff;border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.summary-stat strong{display:block;color:var(--gold);font-size:1.4rem;line-height:1.2}.summary-stat span{font-size:.76rem;opacity:.86}
.practice-nav{margin:10px 12px 16px;padding:12px 10px;border:1px solid rgba(255,215,0,.45);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:all .2s;font-size:.82rem;font-weight:700;line-height:1.3}
.practice-nav:hover,.practice-nav.active{background:rgba(255,215,0,.18);border-color:var(--gold)}
.practice-nav small{display:block;margin-top:4px;font-size:.68rem;font-weight:400;opacity:.8}
.practice-hero{background:linear-gradient(135deg,#001845 0%,#073b7a 62%,#0b5c8b 100%);border-radius:var(--radius);padding:28px;color:#fff;margin-bottom:24px;box-shadow:var(--shadow)}
.practice-hero h2{font-size:1.6rem;color:#fff}.practice-hero p{opacity:.9;margin-top:8px;max-width:700px;font-size:.9rem}
.practice-controls{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-bottom:20px}
.control-group label{display:block;font-size:.78rem;font-weight:700;color:var(--blue);margin-bottom:6px}.practice-select{width:100%;border:2px solid #dfe7f3;border-radius:9px;padding:10px 12px;background:#fff;font:inherit;color:var(--dark);outline:none}.practice-select:focus{border-color:var(--blue)}
.practice-actions{display:flex;gap:8px;flex-wrap:wrap}.btn-small{padding:8px 13px;font-size:.78rem}.practice-note{font-size:.78rem;color:#667085;margin:-8px 0 20px}.answer-key{background:#f5f8fc;border-left:3px solid var(--blue);padding:10px 13px;margin-top:10px;border-radius:0 8px 8px 0;font-size:.8rem;color:#344054}.diagnostic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0}.diagnostic-chip{padding:10px 12px;border-radius:9px;background:#f5f8fc;border:1px solid #dce6f4;font-size:.8rem}.diagnostic-chip b{color:var(--blue)}
@media(max-width:640px){.practice-controls{grid-template-columns:1fr}.practice-actions{display:grid;grid-template-columns:repeat(3,1fr)}.practice-actions .btn{justify-content:center;padding:9px 6px}.course-summary{grid-template-columns:repeat(2,1fr)}}

</style>
</head>
<body>
<button class="menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
<div class="app">

</div>

</div>

<main class="main" id="mainContent"></main>
</div>

<script>
const lessons=[
{id:0,tag:"Урок 1",title:"The Verb TO BE",subtitle:"Present Simple &amp; Past Simple",
grammar:`<h3>The Verb "to be" in the Present Simple</h3>
<table class="gram"><tr><th>Positive</th><th>Negative</th><th>Questions</th></tr>
<tr><td>I <b>am</b> (I'm)</td><td>I am <b>not</b> (I'm not)</td><td><b>Am</b> I?</td></tr>
<tr><td>You <b>are</b> (you're)</td><td>You are <b>not</b> (you aren't)</td><td><b>Are</b> you?</td></tr>
<tr><td>He/She/It <b>is</b> (he's)</td><td>He is <b>not</b> (he isn't)</td><td><b>Is</b> he?</td></tr>
<tr><td>We <b>are</b> (we're)</td><td>We are <b>not</b> (we aren't)</td><td><b>Are</b> we?</td></tr>
<tr><td>They <b>are</b> (they're)</td><td>They are <b>not</b> (they aren't)</td><td><b>Are</b> they?</td></tr></table>
<h3>The Verb "to be" in the Past Simple</h3>
<table class="gram"><tr><th>Positive</th><th>Negative</th><th>Questions</th></tr>
<tr><td>I/He/She/It <b>was</b></td><td>was <b>not</b> (wasn't)</td><td><b>Was</b> I/he/she?</td></tr>
<tr><td>We/You/They <b>were</b></td><td>were <b>not</b> (weren't)</td><td><b>Were</b> we/you/they?</td></tr></table>
<div class="example"><span class="en">I am in Russia now.</span> — <span class="en">I <b>was</b> in Russia last summer.</span><span class="ru">Я в России сейчас. — Я был в России прошлым летом.</span></div>`,
exercises:[
{type:"choice",q:"The sky ___ very blue today.",opts:["is","are","am","was"],ans:0},
{type:"choice",q:"I ___ not tired.",opts:["is","are","am","was"],ans:2},
{type:"choice",q:"The children ___ asleep.",opts:["is","are","am","was"],ans:1},
{type:"choice",q:"Look! This ___ Mabel.",opts:["is","are","am","were"],ans:0},
{type:"choice",q:"I ___ cold. Can you shut the window, please?",opts:["is","are","am","was"],ans:2},
{type:"choice",q:"The castle ___ one thousand years old.",opts:["is","are","am","were"],ans:0},
{type:"choice",q:"My brother and I ___ good tennis players.",opts:["is","are","am","was"],ans:1},
{type:"choice",q:"Amy ___ at home but her parents ___ in church.",opts:["is / are","are / is","am / are","is / is"],ans:0},
{type:"fill",q:"My sister ___ a doctor. (am/is/are)",ans:"is"},
{type:"choice",q:"Last year their son ___ 26 so he is 27 now.",opts:["is","was","were","are"],ans:1}
]},
{id:1,tag:"Урок 2",title:"The Verb TO HAVE (have got)",subtitle:"Possession, questions, negatives",
grammar:`<h3>The Verb "to have" in the Present Simple</h3>
<table class="gram"><tr><th>Positive</th><th>Negative</th><th>Questions</th></tr>
<tr><td>I <b>have (got)</b> / I've got</td><td>I have <b>not</b> got</td><td><b>Have</b> I got?</td></tr>
<tr><td>You <b>have (got)</b> / you've got</td><td>You have <b>not</b> got</td><td><b>Have</b> you got?</td></tr>
<tr><td>He/She/It <b>has (got)</b> / he's got</td><td>He has <b>not</b> got</td><td><b>Has</b> he got?</td></tr>
<tr><td>We <b>have (got)</b> / we've got</td><td>We have <b>not</b> got</td><td><b>Have</b> we got?</td></tr>
<tr><td>They <b>have (got)</b> / they've got</td><td>They have <b>not</b> got</td><td><b>Have</b> they got?</td></tr></table>
<div class="tip">Got-forms are most common in the <b>present tense</b>. We use the correct forms of <b>have</b> in other tenses to mean "possess": <span class="en">I <b>had</b> a bad cold last week. We <b>will have</b> a new apartment soon.</span></div>
<h3>Expressions with "have"</h3>
<div class="vocab-grid">
<div class="vocab-item"><span class="en">to have dinner/breakfast</span><span class="ru">обедать/завтракать</span></div>
<div class="vocab-item"><span class="en">to have tea/coffee</span><span class="ru">пить чай/кофе</span></div>
<div class="vocab-item"><span class="en">to have a bath/a shower</span><span class="ru">принять ванну/душ</span></div>
<div class="vocab-item"><span class="en">to have a shave/a wash</span><span class="ru">побриться/помыться</span></div>
<div class="vocab-item"><span class="en">to have a rest/a sleep</span><span class="ru">отдохнуть/поспать</span></div>
<div class="vocab-item"><span class="en">to have a holiday/a good time</span><span class="ru">отдохнуть/хорошо провести время</span></div>
</div>`,
exercises:[
{type:"choice",q:"(you / a bicycle?) ___",opts:["Have you got a bicycle?","Do you have got a bicycle?","Are you got a bicycle?"],ans:0},
{type:"choice",q:"(your father / a car?) ___",opts:["Has your father got a car?","Have your father got a car?","Does your father got a car?"],ans:0},
{type:"choice",q:"(Carol / many friends?) ___",opts:["Has Carol got many friends?","Have Carol got many friends?","Does Carol got many friends?"],ans:0},
{type:"choice",q:"(how much money / you?) ___",opts:["How much money have you got?","How much money do you have got?","How much money are you got?"],ans:0},
{type:"choice",q:"(what kind of car / John?) ___",opts:["What kind of car has John got?","What kind of car have John got?","What kind of car does John got?"],ans:0},
{type:"fill",q:"We have got → сокращённая форма:",ans:"we've got"},
{type:"fill",q:"She has not got → сокращённая форма:",ans:"she hasn't got"},
{type:"choice",q:"Does Ann have a car? = ___",opts:["Has Ann got a car?","Have Ann got a car?","Is Ann got a car?"],ans:0},
{type:"choice",q:"В каком времени чаще всего используются got-формы?",opts:["Present","Past","Future"],ans:0},
{type:"choice",q:"«У них есть дети?»",opts:["Have they got any children?","Has they got any children?","Do they got any children?"],ans:0}
]},
{id:2,tag:"Урок 3",title:"There is / There are",subtitle:"Конструкция наличия",
grammar:`<h3>The Construction "There + be"</h3>
<p>Используется для выражения наличия чего-либо в определённом месте:</p>
<div class="example"><span class="en">There <b>is</b> a telephone in my room.</span> — В моей комнате есть телефон.<span class="ru"><span class="en">There <b>are</b> many apple-trees in the garden.</span> — В саду много яблонь.</span></div>
<h3>Порядок слов</h3>
<table class="gram"><tr><th></th><th>Порядок</th></tr>
<tr><td>Утверждение</td><td>There + be + подлежащее + обстоятельство места/времени</td></tr>
<tr><td>Отрицание</td><td>There + be + not + подлежащее</td></tr>
<tr><td>Вопрос</td><td>Be + there + подлежащее?</td></tr></table>
<div class="tip">Если подлежащих несколько и они разного числа, сказуемое согласуется с <b>первым</b> подлежащим: <span class="en">There <b>is</b> a table and six chairs in the room.</span></div>
<h3>С модальными глаголами</h3>
<div class="example"><span class="en">There <b>must be</b> a dictionary on the shelf.</span> — На полке должен быть словарь.<span class="ru"><span class="en">There <b>can be</b> no doubt about it.</span> — В этом не может быть сомнений.</span></div>`,
exercises:[
{type:"choice",q:"Look! ___ their telephone number in the letter.",opts:["There is","There are","There was"],ans:0},
{type:"choice",q:"Chester is a very old town. ___ many old buildings there.",opts:["There is","There are","There was"],ans:1},
{type:"choice",q:"Excuse me, ___ a restaurant near here?",opts:["is there","are there","there is"],ans:0},
{type:"choice",q:"How many students ___ in your group?",opts:["is there","are there","there are"],ans:1},
{type:"choice",q:"I was hungry but ___ anything to eat.",opts:["there wasn't","there weren't","there isn't"],ans:0},
{type:"choice",q:"___ a football match on TV last night.",opts:["There is","There was","There were"],ans:1},
{type:"choice",q:"___ many people at the meeting?",opts:["Were there","Was there","There were"],ans:0},
{type:"choice",q:"Look! ___ an accident. Call the ambulance!",opts:["There is","There are","There was"],ans:0},
{type:"choice",q:"___ 24 hours in a day.",opts:["There is","There are","There was"],ans:1},
{type:"choice",q:"This box is empty. ___ nothing in it.",opts:["There is","There are","There were"],ans:0}
]},
{id:3,tag:"Урок 4",title:"Present Simple Tense",subtitle:"Обычные, повторяющиеся действия",
grammar:`<h3>Formation</h3>
<table class="gram"><tr><th>Affirmative</th><th>Negative</th><th>Interrogative</th></tr>
<tr><td>I <b>work</b></td><td>I <b>do not</b> work (don't)</td><td><b>Do</b> I work?</td></tr>
<tr><td>He/She/It <b>works</b></td><td>He <b>does not</b> work (doesn't)</td><td><b>Does</b> he work?</td></tr>
<tr><td>We/You/They <b>work</b></td><td>We <b>do not</b> work (don't)</td><td><b>Do</b> we work?</td></tr></table>
<h3>Use</h3>
<p>1. Постоянное действие (факт): <span class="en">She speaks English. They live in France.</span><br>
2. Общая истина: <span class="en">The Earth rotates round its axis.</span><br>
3. Повторяющееся действие: <span class="en">The Browns go to the seaside every summer.</span><br>
4. Будущее по расписанию: <span class="en">The train leaves at 10 tomorrow.</span></p>
<h3>Adverbials of time</h3>
<p><span class="en">usually, often, always, every day/week/month, in the morning/afternoon/evening, at night, on Mondays</span></p>
<div class="tip">Глаголы, обозначающие чувства (see, hear), умственную деятельность (know, believe, think), желания (want, wish), чувства (love, like, hate) и абстрактные отношения (be, have, belong, consist of) <b>НЕ используются</b> в Continuous.</div>`,
exercises:[
{type:"choice",q:"What does a driver do?",opts:["He drives.","He is driving.","He drove."],ans:0},
{type:"choice",q:"What does a singer do?",opts:["He sings.","He is singing.","He sang."],ans:0},
{type:"choice",q:"What do students do?",opts:["They study.","They are studying.","They studied."],ans:0},

{id:4,tag:"Урок 5",title:"Present Continuous Tense",subtitle:"Действие в момент речи",
grammar:`<h3>Formation</h3>
<table class="gram"><tr><th>Affirmative</th><th>Negative</th><th>Interrogative</th></tr>
<tr><td>I <b>am reading</b></td><td>I am <b>not</b> reading</td><td><b>Am</b> I reading?</td></tr>
<tr><td>He/She/It <b>is reading</b></td><td>He is <b>not</b> reading (isn't)</td><td><b>Is</b> he reading?</td></tr>
<tr><td>We/You/They <b>are reading</b></td><td>We are <b>not</b> reading (aren't)</td><td><b>Are</b> we reading?</td></tr></table>
<h3>Use</h3>
<p>1. Действие в данный момент: <span class="en">Look! Listen! I <b>am reading</b> now.</span><br>
2. Запланированное будущее: <span class="en">I <b>am meeting</b> a friend tonight.</span></p>
<h3>Adverbials of time</h3>
<p><span class="en">now, at present, at the moment, Look! Listen!</span></p>
<div class="tip">Present Continuous <b>НЕ используется</b> с глаголами чувств (see, hear), умственной деятельности (know, believe), желания (want, wish), чувств (love, like, hate).</div>`,
exercises:[
{type:"choice",q:"Please be quiet. I ___ to sleep. (try)",opts:["try","am trying","tried"],ans:1},

{type:"choice",q:"Why ___ your fur coat today? It's very warm. (you/wear)",opts:["do you wear","are you wearing","did you wear"],ans:1},
{type:"choice",q:"I ___ to school this week. I'm on holiday. (not/go)",opts:["don't go","am not going","didn't go"],ans:1},

]},
{id:5,tag:"Урок 6",title:"Past Simple Tense",subtitle:"Действие в прошлом",
grammar:`<h3>Formation</h3>
<p>Regular verbs: stem + <b>-ed</b> (or <b>-d</b> if stem ends in -e)</p>
<table class="gram"><tr><th>Affirmative</th><th>Negative</th><th>Interrogative</th></tr>
<tr><td>I/he <b>worked/wrote</b></td><td>I/he <b>did not</b> work/write (didn't)</td><td><b>Did</b> I/he work/write?</td></tr></table>
<h3>Pronunciation of -ed</h3>
<table class="gram"><tr><th>After</th><th>Pronunciation</th><th>Example</th></tr>
<tr><td>t, d</td><td>[id]</td><td>wanted ['wɒntɪd], landed ['lændɪd]</td></tr>
<tr><td>voiced consonants, vowels</td><td>[d]</td><td>opened ['əʊpənd], played [pleɪd]</td></tr>
<tr><td>voiceless consonants</td><td>[t]</td><td>worked [wɜːkt]</td></tr></table>
<h3>Use</h3>
<p>1. Действие в прошлом: <span class="en">We entered the house in silence.</span><br>
2. Последовательность действий: <span class="en">He shut the window, switched off the light and went upstairs.</span><br>
3. Повторяющееся действие в прошлом: <span class="en">He made an entry in his diary every night.</span></p>
<h3>Adverbials of time</h3>
<p><span class="en">yesterday, last night/week/month/year, two days/weeks ago, then, in 1993/1825</span></p>`,
exercises:[
{type:"choice",q:"Regular verbs form the Past Simple by adding:",opts:["-ing","-ed","-en"],ans:1},
{type:"choice",q:"Pronunciation of -ed after voiceless consonants:",opts:["[id]","[d]","[t]"],ans:2},
{type:"choice",q:"Pronunciation of -ed after t, d:",opts:["[id]","[d]","[t]"],ans:0},
{type:"choice",q:"«Он закрыл окно, выключил свет и поднялся наверх» — это:",opts:["Одно действие","Последовательность действий","Повторяющееся действие"],ans:1},
{type:"choice",q:"I ___ him yesterday.",opts:["see","saw","seen"],ans:1},
{type:"choice",q:"Last week, he ___ from a business trip.",opts:["return","returned","returns"],ans:1},
{type:"fill",q:"to want → Past Simple:",ans:"wanted"},
{type:"fill",q:"to live → Past Simple:",ans:"lived"},
{type:"choice",q:"«Вчера» по-английски:",opts:["today","yesterday","tomorrow"],ans:1},
{type:"choice",q:"Past Simple используется с:",opts:["now, at present","yesterday, last week, ago","usually, always"],ans:1}
]},
{id:6,tag:"Урок 7",title:"Past Continuous Tense",subtitle:"Действие в процессе в определённый момент прошлого",
grammar:`<h3>Formation</h3>
<table class="gram"><tr><th>Affirmative</th><th>Negative</th><th>Interrogative</th></tr>
<tr><td>I <b>was reading</b></td><td>I was <b>not</b> reading</td><td><b>Was</b> I reading?</td></tr>
<tr><td>We/You/They <b>were reading</b></td><td>We were <b>not</b> reading</td><td><b>Were</b> we reading?</td></tr></table>
<h3>Use</h3>
<p>Временное действие, происходящее в определённый момент в прошлом:</p>
<div class="example"><span class="en">I was writing a letter to my friend from 5 to 6 on Sunday.</span><span class="ru">Я писал письмо другу с 5 до 6 в воскресенье.</span></div>
<h3>Past Simple + Past Continuous</h3>
<p>Часто используются вместе: одно действие (Past Continuous) происходит в процессе другого (Past Simple):</p>
<div class="example"><span class="en">I saw Irene in the park. She <b>was sitting</b> on the bench and <b>waiting</b> for somebody.</span><span class="ru">Я увидел Ирину в парке. Она сидела на скамейке и кого-то ждала.</span></div>
<div class="example"><span class="en">Jensa broke her leg when she <b>was skiing</b> in Switzerland.</span><span class="ru">Дженса сломала ногу, когда каталась на лыжах в Швейцарии.</span></div>
<h3>Adverbials of time</h3>
<p><span class="en">at five (o'clock) yesterday, from five to/till six yesterday, for three days last week, all day long, the whole day</span></p>`,

{id:7,tag:"Урок 8",title:"Future Simple Tense",subtitle:"will + Infinitive",
grammar:`<h3>Formation</h3>
<table class="gram"><tr><th>Affirmative</th><th>Negative</th><th>Interrogative</th></tr>
<tr><td>I/He/She/It/We/You/They <b>will</b> + Inf</td><td>will <b>not</b> (won't) + Inf</td><td><b>Will</b> + subject + Inf?</td></tr></table>
<div class="tip"><b>Will</b> is used for all persons. In British English, <b>shall</b> can be used for I and we.</div>
<h3>Important Rule: Future Simple is NOT used after conjunctions</h3>
<table class="gram"><tr><th>Conjunctions</th></tr>
<tr><td>when, as soon as, provided, till, as long as, in case, until, if, before, unless, after, on condition that</td></tr></table>
<div class="example"><span class="en">I don't know <b>when</b> they <b>will arrive</b>.</span> (придаточное дополнительное — Future Simple)<span class="ru"><b>When</b> they <b>arrive</b>, I'll inform you. (придаточное времени — Present Simple!)</span></div>
<div class="example"><span class="en">I don't know <b>if</b> he <b>will agree</b>.</span> (придаточное дополнительное)<span class="ru"><b>If</b> he <b>agrees</b>, I'll call you. (придаточное условия — Present Simple!)</span></div>`,
exercises:[

{id:8,tag:"Урок 9",title:"Future Continuous Tense",subtitle:"will be + -ing",
grammar:`<h3>Formation</h3>

<div class="tip"><b>Will</b> is used for all persons. In British English, <b>shall</b> can be used for I and we.</div>
<h3>Use</h3>

{id:9,tag:"Урок 10",title:"Used to / Would",subtitle:"Привычные действия в прошлом",
grammar:`<h3>Used to</h3>
<p>Используется для описания привычных действий или состояний в прошлом, которые больше не происходят:</p>
<div class="example"><span class="en">He doesn't play the piano any more but he <b>used to</b> play it every day.</span><span class="ru">Он больше не играет на пианино, но раньше играл каждый день.</span></div>
<h3>Would</h3>
<p><b>Would</b> может заменять <b>used to</b> для повторяющихся действий в прошлом, но <b>НЕ для состояний</b>:</p>
<table class="gram"><tr><th>USED TO</th><th>WOULD</th></tr>
<tr><td>Может описывать состояния</td><td>НЕ может описывать состояния</td></tr>
<tr><td>I used to live in Scotland.</td><td>❌ I would live in Scotland.</td></tr>
<tr><td>Отрицание: didn't use to</td><td>Отрицание: wouldn't = отказ</td></tr></table>
<div class="tip"><b>We didn't use to drink coffee in the morning.</b> — Мы никогда не пили кофе по утрам.<br><b>We wouldn't drink coffee in the morning</b> = We <b>refused</b> to drink coffee. (Мы отказывались пить кофе.)</div>`,
exercises:[
{type:"choice",q:"He doesn't play the piano any more but he ___ play it every day.",opts:["used to","would","is used to"],ans:0},
{type:"choice",q:"She doesn't eat sweets now but she ___ them every day.",opts:["used to eat","would eat","is used to eat"],ans:0},
{type:"choice",q:"Miranda ___ my colleague but we don't work together any longer.",opts:["used to be","would be","is used to be"],ans:0},
{type:"choice",q:"We live in Sussex now but we ___ in Scotland.",opts:["used to live","would live","are used to live"],ans:0},
{type:"choice",q:"Now there is one cinema in our town but there ___ five.",opts:["used to be","would be","are used to be"],ans:0},
{type:"choice",q:"Melly walks everywhere now. She ___ a horse.",opts:["used to ride","would ride","is used to ride"],ans:0},
{type:"choice",q:"I ___ like to play chess when I lived with my father.",opts:["used to","would","both are possible"],ans:2},
{type:"choice",q:"We didn't ___ go out much when we stayed at Granny's.",opts:["use to","used to","using to"],ans:0},
{type:"choice",q:"«Would» в отрицании означает:",opts:["Привычку","Отказ","Состояние"],ans:1},
{type:"choice",q:"«Used to» может описывать:",opts:["Только действия","Действия и состояния","Только состояния"],ans:1}
]},
{id:10,tag:"Урок 11",title:"The Noun. Countable / Uncountable. Plural",subtitle:"Правила образования множественного числа",
grammar:`<h3>Countable and Uncountable Nouns</h3>
<table class="gram"><tr><th>Countable</th><th>Uncountable</th></tr>
<tr><td>a book – 5 books</td><td>meat, water, glass, beauty, help</td></tr>
<tr><td>a boy – many boys</td><td>luggage, furniture, information, news</td></tr>
<tr><td>Имеют мн. число</td><td>Не имеют мн. числа, не с a/an</td></tr></table>
<h3>Rules for Forming the Plural</h3>
<table class="gram"><tr><th>Rule</th><th>Examples</th><th>Notes</th></tr>
<tr><td>General rule: + <b>-s</b></td><td>tables, books, paths</td><td>[z] after voiced; [s] after voiceless; [iz] after sibilants</td></tr>
<tr><td>-s, -ss, -x, -z, -sh, -ch, -o → + <b>-es</b></td><td>buses, boxes, potatoes</td><td>BUT: pianos, photos, videos</td></tr>
<tr><td>Change root vowel</td><td>man–men, foot–feet, goose–geese</td><td>7 nouns only</td></tr>
<tr><td>+ <b>-en</b></td><td>ox–oxen, child–children</td><td>2 nouns only</td></tr>
<tr><td>Singular = Plural</td><td>deer, sheep, fish, aircraft</td><td>BUT: dozens, scores of</td></tr>
<tr><td>Latin/Greek plurals</td><td>phenomenon–phenomena, crisis–crises</td><td>Also: formulas, indexes in colloquial</td></tr>
<tr><td>Compound nouns</td><td>editors-in-chief, brothers-in-law</td><td>Plural on head-word</td></tr></table>`,
exercises:[
{type:"choice",q:"Plural of <b>child</b>:",opts:["childs","childes","children"],ans:2},
{type:"choice",q:"Plural of <b>phenomenon</b>:",opts:["phenomenons","phenomena","phenomenes"],ans:1},
{type:"choice",q:"Plural of <b>sheep</b>:",opts:["sheeps","sheepes","sheep"],ans:2},
{type:"choice",q:"Plural of <b>editor-in-chief</b>:",opts:["editor-in-chiefs","editors-in-chief","editor-in-chiefes"],ans:1},
{type:"choice",q:"<b>News</b> is:",opts:["countable","uncountable","both"],ans:1},
{type:"fill",q:"Plural of <b>crisis</b>:",ans:"crises"},
{type:"fill",q:"Plural of <b>goose</b>:",ans:"geese"},
{type:"choice",q:"Plural of <b>box</b>:",opts:["boxs","boxes","boxies"],ans:1},
{type:"choice",q:"Plural of <b>ox</b>:",opts:["oxs","oxes","oxen"],ans:2},
{type:"choice",q:"Plural of <b>potato</b>:",opts:["potatos","potatoes","potatoies"],ans:1}
]},
{id:11,tag:"Урок 12",title:"The Article",subtitle:"a/an, the, zero article",
grammar:`<h3>The Indefinite Article (a / an)</h3>
<p>Used with singular countable nouns when we mention something for the first time or don't specify which one:</p>
<div class="example"><span class="en">I bought <b>a</b> new car.</span> (first mention)<span class="ru">Can I have <b>an</b> apple? (any apple)</span></div>
<h3>The Definite Article (the)</h3>
<table class="gram"><tr><th>Rule</th><th>Example</th></tr>
<tr><td>Both speaker and listener know the object</td><td>Where is <b>the</b> key?</td></tr>
<tr><td>An attribute points out the object</td><td>This is <b>the</b> house that Jack built.</td></tr>
<tr><td>Unique things: Sun, Moon, Earth</td><td><b>The</b> Sun is the centre of our Galaxy.</td></tr>
<tr><td>With superlatives, ordinals</td><td><b>The</b> first row, <b>the</b> best day</td></tr>
<tr><td>With "same, all, very, next, last"</td><td>You're <b>the</b> very person I need.</td></tr></table>
<h3>The Zero Article (no article)</h3>
<table class="gram"><tr><th>Rule</th><th>Example</th></tr>
<tr><td>Plural countable nouns in general statements</td><td>Dogs should eat meat.</td></tr>
<tr><td>Uncountable nouns in general statements</td><td>Coffee is produced in Brazil.</td></tr>
<tr><td>Abstract nouns in general sense</td><td>No news is good news.</td></tr>
<tr><td>Languages, meals, sports</td><td>Chinese is difficult. I like tennis.</td></tr></table>`,
exercises:[
{type:"choice",q:"I bought ___ new house with ___ large garden.",opts:["a / a","a / the","the / a"],ans:0},
{type:"choice",q:"___ Sun is the centre of our Galaxy.",opts:["A","An","The","(no article)"],ans:2},
{type:"choice",q:"___ oranges are good for you.",opts:["The","A","An","(no article)"],ans:3},
{type:"choice",q:"You're ___ very person I need.",opts:["a","an","the","(no article)"],ans:2},
{type:"choice",q:"___ news is very depressing today.",opts:["The","A","An","(no article)"],ans:0},
{type:"choice",q:"___ smoking is not allowed here.",opts:["The","A","An","(no article)"],ans:3},
{type:"fill",q:"This is ___ house that Jack built.",ans:"the"},
{type:"choice",q:"I usually buy ___ newspaper on my way to work.",opts:["the","a","(no article)","an"],ans:1},
{type:"choice",q:"Could you pass ___ salt, please?",opts:["a","an","the","(no article)"],ans:2},
{type:"choice",q:"___ dogs should eat meat.",opts:["The","A","An","(no article)"],ans:3}
]},
{id:12,tag:"Урок 13",title:"Comparative &amp; Superlative Adjectives",subtitle:"the same as, more...than, -er/-est",
grammar:`<h3>Comparative Degree</h3>
<table class="gram"><tr><th>Type</th><th>Formula</th><th>Example</th></tr>
<tr><td>Short adjectives</td><td>adj + <b>-er</b> + than</td><td>taller than, thinner than</td></tr>
<tr><td>Long adjectives</td><td><b>more</b> + adj + than</td><td>more severe than, more interesting than</td></tr>
<tr><td>Irregular</td><td>good → better, bad → worse, far → farther/further</td><td></td></tr></table>
<h3>Superlative Degree</h3>
<table class="gram"><tr><th>Type</th><th>Formula</th><th>Example</th></tr>
<tr><td>Short adjectives</td><td>the + adj + <b>-est</b></td><td>the tallest, the thinnest</td></tr>
<tr><td>Long adjectives</td><td>the + <b>most</b> + adj</td><td>the most interesting, the most popular</td></tr></table>
<h3>The same as</h3>
<div class="example"><span class="en">Your hair is <b>the same colour as</b> mine.</span><span class="ru">У тебя волосы того же цвета, что и у меня.</span></div>`,
exercises:[
{type:"choice",q:"This is ___ (the most interesting) book I have ever read on this subject.",opts:["the most interesting","more interesting","the more interesting"],ans:0},
{type:"choice",q:"Swimming is ___ (extremely popular) summer sport.",opts:["extremely popular","the most popular","more popular"],ans:1},
{type:"choice",q:"Shakespeare is ___ (the most outstanding) English poet and playwright of all the ages.",opts:["the most outstanding","more outstanding","the more outstanding"],ans:0},
{type:"choice",q:"My toothache is ___ it was yesterday. (severe)",opts:["more severe than","severer than","the most severe than"],ans:0},
{type:"choice",q:"You look ___ you were last year. (thin)",opts:["thinner than","more thin than","the thinnest than"],ans:0},
{type:"choice",q:"(this suit / the same size / that one)",opts:["This suit is the same size as that one.","This suit is the same size that that one.","This suit is the same size than that one."],ans:0},
{type:"choice",q:"(I arrived here / the same time / you)",opts:["I arrived here at the same time as you.","I arrived here at the same time that you.","I arrived here at the same time than you."],ans:0},
{type:"choice",q:"(we rented / the same house / your parents)",opts:["We rented the same house as your parents.","We rented the same house that your parents.","We rented the same house than your parents."],ans:0},
{type:"choice",q:"The ___ animals have the ___ lifespan. (active / short)",opts:["most active / shortest","more active / shorter","most active / shorter"],ans:0},
{type:"choice",q:"Animals which move slowly or live a ___ life usually grow a lot ___. (quiet / old)",opts:["quieter / older","more quiet / older","quietest / oldest"],ans:1}
]},
{id:13,tag:"Урок 14",title:"Conditional Sentences Type I",subtitle:"Real condition: If + Present Simple, will + Inf",
grammar:`<h3>Type I — Real Condition (настоящее/будущее)</h3>
<table class="gram"><tr><th>Condition clause</th><th>Main clause</th></tr>
<tr><td>If + Present Simple/Continuous</td><td>will + Infinitive</td></tr>
<tr><td>If it looks like rain,</td><td>we'll stay at home.</td></tr>
<tr><td>If I have more time,</td><td>I'll come over.</td></tr></table>
<div class="tip">NB! В придаточном условия после <b>if</b> НЕ используется <b>will</b>. Правильно: If it <b>rains</b>... НЕПРАВИЛЬНО: If it <b>will rain</b>...</div>`,
exercises:[
{type:"choice",q:"If I don't feel / won't feel well tomorrow, I stay / I'll stay at home.",opts:["don't feel / stay","won't feel / stay","don't feel / I'll stay"],ans:2},
{type:"choice",q:"If the weather is / will be nice tomorrow, we can go to the beach.",opts:["is","will be"],ans:0},
{type:"choice",q:"It will be hard to find a hotel if we arrive / will arrive late.",opts:["arrive","will arrive"],ans:0},
{type:"choice",q:"The alarm will ring if there is / will be a fire.",opts:["is","will be"],ans:0},
{type:"choice",q:"Do / Will you go to the party if they invite / will invite you?",opts:["Do / invite","Will / invite","Will / will invite"],ans:1},
{type:"fill",q:"If you speak slowly, I ___ (be able) to understand you.",ans:"will be able"},
{type:"choice",q:"If he doesn't practise his English, he will / would never speak fluently.",opts:["will","would"],ans:0},
{type:"choice",q:"If their train arrives early, we'll / would be able to meet them.",opts:["we'll","we would"],ans:0},
{type:"fill",q:"If it rains tomorrow, we ___ (stay) at home.",ans:"will stay"},
{type:"choice",q:"You won't get in if you don't have / won't have a ticket.",opts:["don't have","won't have"],ans:0}
]},
{id:14,tag:"Урок 15",title:"Conditional Sentences Type II",subtitle:"Unreal condition: If + Past Simple, would + Inf",
grammar:`<h3>Type II — Unreal Condition (настоящее/будущее)</h3>
<table class="gram"><tr><th>Condition clause</th><th>Main clause</th></tr>
<tr><td>If + Past Simple/Continuous</td><td>would/could/might + Infinitive</td></tr>
<tr><td>If I were you,</td><td>I would go there myself.</td></tr>
<tr><td>If I had more time,</td><td>I would come over.</td></tr></table>
<div class="tip">В Type II для глагола <b>be</b> обычно используется <b>were</b> для всех лиц: If I <b>were</b> you... If she <b>were</b> here...</div>
<h3>Inversion (без if)</h3>
<div class="example"><span class="en">Were she in New York, she would certainly call you.</span><span class="ru">Если бы она была в Нью-Йорке, она бы обязательно позвонила.</span></div>`,
exercises:[
{type:"choice",q:"If I ___ you, I would go there myself.",opts:["am","was","were"],ans:2},
{type:"choice",q:"If I had more time, I ___ come over.",opts:["will","would","can"],ans:1},
{type:"choice",q:"If you knew him better, you ___ think so.",opts:["won't","wouldn't","don't"],ans:1},
{type:"choice",q:"If it ___ not raining, I could go out.",opts:["is","was","were"],ans:2},
{type:"fill",q:"If I ___ (know) his address, I would write to him.",ans:"knew"},
{type:"choice",q:"If she ___ taller, she would be a model.",opts:["is","was","were"],ans:2},
{type:"choice",q:"If I had books there, I ___ a lot in summer.",opts:["will read","would read","read"],ans:1},
{type:"fill",q:"If I ___ (have) a dictionary, I would finish the translation today.",ans:"had"},
{type:"choice",q:"Were she in New York, she ___ call you.",opts:["will","would","can"],ans:1},
{type:"choice",q:"If he worked more slowly, he ___ make so many mistakes.",opts:["won't","wouldn't","doesn't"],ans:1}
]},
{id:15,tag:"Урок 16",title:"Conditional Sentences Type III. But for",subtitle:"Unreal past: If + Past Perfect, would have + Participle II",
grammar:`<h3>Type III — Unreal Condition (прошедшее)</h3>
<table class="gram"><tr><th>Condition clause</th><th>Main clause</th></tr>
<tr><td>If + Past Perfect</td><td>would/could/might + have + Participle II</td></tr>
<tr><td>If you had gone there,</td><td>you would have seen him.</td></tr>
<tr><td>If it hadn't been so hot last summer,</td><td>we could have gone to the South.</td></tr></table>
<h3>But for + noun/pronoun</h3>
<p>Используется вместо придаточного условия в нереальных условиях:</p>
<div class="example"><span class="en">But for my promise I wouldn't tell you this.</span><span class="ru">Если бы не моё обещание, я бы тебе этого не сказал.</span></div>
<div class="example"><span class="en">But for the operation he would have died.</span><span class="ru">Если бы не операция, он бы умер.</span></div>
<div class="tip">But for + существительное/местоимение = If it were not for / If it had not been for + noun</div>`,
exercises:[
{type:"choice",q:"If you had gone there, you ___ him.",opts:["would see","would have seen","will see"],ans:1},
{type:"choice",q:"If it hadn't been so hot, we ___ to the South.",opts:["could go","could have gone","can go"],ans:1},
{type:"choice",q:"But for my sister's help I ___ the article.",opts:["couldn't translate","couldn't have translated","can't translate"],ans:1},
{type:"choice",q:"But for the neighbour's chickens I ___ the dog chained.",opts:["wouldn't hear","wouldn't have heard","won't hear"],ans:1},
{type:"fill",q:"But for your explanation I ___ (not learn) to do it so well.",ans:"wouldn't have learned"},
{type:"choice",q:"If the goal-keeper ___ hurt early in the game, the team would not have lost.",opts:["was not","had not been","is not"],ans:1},
{type:"choice",q:"But for the heat I ___ working in this country.",opts:["would like","would have liked","will like"],ans:1},
{type:"fill",q:"If it had not been for the rain, we ___ (go) for a walk.",ans:"would have gone"},
{type:"choice",q:"But for her spelling she ___ an excellent mark.",opts:["would get","would have got","will get"],ans:1},
{type:"choice",q:"But for the accident he ___ a record.",opts:["would set","would have set","will set"],ans:1}
]},
{id:16,tag:"Урок 17",title:"Wish Constructions",subtitle:"I wish + Past Simple / Past Perfect",
grammar:`<h3>Wish about the Present</h3>
<p>I wish + Past Simple/Continuous (сожаление о настоящем):</p>
<div class="example"><span class="en">I wish I were/was beautiful.</span><span class="ru">Как бы мне хотелось быть красивой.</span></div>
<div class="example"><span class="en">I wish it weren't raining.</span><span class="ru">Жаль, что идёт дождь.</span></div>
<h3>Wish about the Past</h3>
<p>I wish + Past Perfect (сожаление о прошлом):</p>
<div class="example"><span class="en">I wish I had brought my camera.</span><span class="ru">Жаль, что я не взял с собой фотоаппарат.</span></div>
<div class="example"><span class="en">I wish I could have gone to the theatre yesterday.</span><span class="ru">Жаль, что я не смог пойти в театр вчера.</span></div>
<h3>Wish about the Future</h3>
<p>I wish + could/would + Infinitive:</p>
<div class="example"><span class="en">I wish they could come to see us tomorrow.</span><span class="ru">Жаль, что они не смогут зайти к нам завтра.</span></div>`,
exercises:[
{type:"choice",q:"I wish I ___ (know) how to drive a car. (present)",opts:["know","knew","had known"],ans:1},
{type:"choice",q:"I wish I ___ (bring) my camera. (past regret)",opts:["brought","had brought","bring"],ans:1},
{type:"choice",q:"I wish today ___ a holiday. (present)",opts:["is","was/were","had been"],ans:1},
{type:"choice",q:"I wish I ___ (can) travel round the world.",opts:["can","could","could have"],ans:1},
{type:"choice",q:"I wish I ___ (know) how to drive a car in 2005. (past)",opts:["knew","had known","know"],ans:1},
{type:"fill",q:"I wish I ___ (not lose) my keys yesterday.",ans:"hadn't lost"},
{type:"choice",q:"I wish you ___ (not work) so much. (present)",opts:["don't work","didn't work","hadn't worked"],ans:1},
{type:"choice",q:"I wish they ___ (can) come to see us tomorrow.",opts:["can","could","could have"],ans:1},
{type:"fill",q:"I wish it ___ (not rain) now.",ans:"wasn't raining"},
{type:"choice",q:"I wish yesterday ___ a holiday. (past)",opts:["was","had been","is"],ans:1}
]},
{id:17,tag:"Урок 18",title:"Indirect Speech. Statements",subtitle:"Косвенная речь: утверждения",
grammar:`<h3>Rule of the Sequence of Tenses</h3>
<table class="gram"><tr><th>Direct Speech</th><th>Indirect Speech</th></tr>
<tr><td>Present Simple</td><td>Past Simple</td></tr>
<tr><td>Present Perfect</td><td>Past Perfect</td></tr>
<tr><td>Past Simple</td><td>Past Perfect</td></tr>
<tr><td>Future Simple (will)</td><td>Future-in-the-Past (would)</td></tr></table>
<div class="example"><span class="en">Nick explained, "I know the man."</span> → <span class="en">Nick explained that he <b>knew</b> the man.</span><span class="ru">Ник объяснил, что он знает этого человека.</span></div>
<div class="example"><span class="en">"I will be absent tomorrow." John remarked.</span> → <span class="en">John remarked that he <b>would</b> be absent the next day.</span><span class="ru">Джон заметил, что будет отсутствовать на следующий день.</span></div>
<h3>Reporting Verbs</h3>
<p>to tell, to say, to add, to notice, to remark, to explain, to inform, to remind, to mention, to confess, to guess, to repeat</p>
<div class="tip">NB! to <b>say</b> smth (to smb) / to <b>tell</b> smb smth</div>`,
exercises:[
{type:"choice",q:"He said, \"I know the man.\" → He said that he ___ the man.",opts:["knows","knew","had known"],ans:1},
{type:"choice",q:"\"I will be absent tomorrow.\" → John remarked that he ___ absent the next day.",opts:["will be","would be","would have been"],ans:1},
{type:"choice",q:"\"I haven't read many books.\" → He said that he ___ many books.",opts:["hasn't read","hadn't read","didn't read"],ans:1},
{type:"choice",q:"\"I made no mistakes.\" → Bob said that he ___ no mistakes.",opts:["made","had made","makes"],ans:1},
{type:"choice",q:"She said, \"I'm listening.\" → She said that she ___ listening.",opts:["is","was","had been"],ans:1},
{type:"fill",q:"He said that he ___ (see) the film the day before.",ans:"had seen"},
{type:"choice",q:"\"I saw the thief.\" → He told the policeman that he ___ the thief.",opts:["saw","had seen","sees"],ans:1},
{type:"choice",q:"She told the grocer that she ___ want any sugar.",opts:["doesn't","didn't","hadn't"],ans:1},
{type:"fill",q:"They said that they ___ (come) the next day.",ans:"would come"},
{type:"choice",q:"The secretary informed us, \"The delegation has just arrived.\" → The secretary informed us that the delegation ___ just arrived.",opts:["has","had","was having"],ans:1}
]},
{id:18,tag:"Урок 19",title:"Indirect Speech. Questions, Orders, Requests",subtitle:"Косвенные вопросы, приказы, просьбы",
grammar:`<h3>Indirect Questions</h3>
<p>Общий вопрос → <b>if / whether</b> + прямой порядок слов:</p>
<div class="example"><span class="en">"Do you understand?"</span> → <span class="en">He asked <b>if</b> I understood.</span></div>
<p>Специальный вопрос → вопросительное слово + прямой порядок слов:</p>
<div class="example"><span class="en">"Where do Ron's parents live?"</span> → <span class="en">Ted wondered <b>where</b> Ron's parents lived.</span></div>
<h3>Indirect Orders and Requests</h3>
<p>Reporting verb + to-infinitive / not to-infinitive:</p>
<table class="gram"><tr><th>Function</th><th>Reporting verbs</th></tr>
<tr><td>Orders</td><td>to order, to command, to instruct</td></tr>
<tr><td>Advice</td><td>to advise, to recommend</td></tr>
<tr><td>Requests</td><td>to ask, to beg, to implore, to urge</td></tr>
<tr><td>Warnings</td><td>to warn</td></tr>
<tr><td>Permission</td><td>to allow, to permit, to forbid</td></tr></table>
<div class="example"><span class="en">"Don't run across the street."</span> → <span class="en">The old man <b>warned</b> the girl <b>not to run</b> across the street.</span><span class="ru">Старик предупредил девочку не перебегать улицу.</span></div>`,
exercises:[
{type:"choice",q:"\"Have you got a match?\" → He asked me ___ I had got a match.",opts:["that","if","what"],ans:1},
{type:"choice",q:"\"Where do Ron's parents live?\" → Ted wondered ___ Ron's parents lived.",opts:["that","if","where"],ans:2},
{type:"choice",q:"\"Don't run across the street.\" → The old man ___ the girl not to run.",opts:["said","warned","asked"],ans:1},
{type:"choice",q:"\"Open your books at page 60.\" → The teacher ___ the students to open their books.",opts:["asked","told","suggested"],ans:1},
{type:"choice",q:"\"Why haven't you done the homework?\" → The teacher inquired ___ the pupils had not done the homework.",opts:["that","if","why"],ans:2},
{type:"fill",q:"\"Don't go out without your coat.\" → Mary's mother told her ___ to go out.",ans:"not"},
{type:"choice",q:"\"Tell me the time, please.\" → Jack ___ the policeman to tell him the time.",opts:["ordered","asked","commanded"],ans:1},
{type:"choice",q:"\"Collect the exercise-books.\" → The teacher ___ Tom to collect the exercise-books.",opts:["asked","told","begged"],ans:1},
{type:"fill",q:"\"Who did you meet at the theatre?\" → Nina's sister wanted to know ___ Nina had met at the theatre.",ans:"who"},
{type:"choice",q:"\"Don't touch those plates. They are hot.\" → She ___ me not to touch the plates.",opts:["said","warned","told"],ans:1}
]},
{id:19,tag:"Урок 20",title:"The Participle. Forms",subtitle:"Participle I, Participle II, Perfect Participle",
grammar:`<h3>Forms of the Participle</h3>
<table class="gram"><tr><th></th><th>Active</th><th>Passive</th></tr>
<tr><td><b>Present Participle (Participle I)</b></td><td>asking</td><td>being asked</td></tr>
<tr><td><b>Past Participle (Participle II)</b></td><td>asked</td><td>—</td></tr>
<tr><td><b>Perfect Participle</b></td><td>having asked</td><td>having been asked</td></tr></table>
<h3>Present Participle (Participle I)</h3>
<p>Показывает, что действие причастия происходит <b>одновременно</b> с действием сказуемого — в настоящем, прошлом или будущем:</p>
<div class="example"><span class="en">Do you see the child <b>waving</b> the flag?</span> — Ты видишь ребёнка, машущего флагом?<span class="ru"><span class="en">That day we stayed at home <b>watching</b> TV.</span> — В тот день мы сидели дома и смотрели телевизор.</span></div>
<h3>Perfect Participle</h3>
<p>Показывает, что действие причастия <b>предшествует</b> действию сказуемого:</p>
<div class="example"><span class="en"><b>Having explained</b> everything, I want to tell you how sorry I am.</span><span class="ru"><span class="en"><b>Having finished</b> the letter, he went to the post office.</span> — Закончив письмо, он пошёл на почту.</span></div>
<div class="tip">Perfect Participle может относиться к настоящему, прошлому и будущему времени — всё зависит от времени сказуемого главного предложения.</div>`,
exercises:[
{type:"choice",q:"Present Participle Active от <b>ask</b>:",opts:["asked","asking","having asked","being asked"],ans:1},
{type:"choice",q:"Present Participle Passive от <b>ask</b>:",opts:["asking","asked","being asked","having asked"],ans:2},
{type:"choice",q:"Perfect Participle Active от <b>ask</b>:",opts:["asking","asked","being asked","having asked"],ans:3},
{type:"choice",q:"Perfect Participle Passive от <b>ask</b>:",opts:["having asked","being asked","having been asked","asked"],ans:2},
{type:"choice",q:"Present Participle показывает:",opts:["Предшествование","Одновременность","Следование"],ans:1},
{type:"choice",q:"Perfect Participle показывает:",opts:["Одновременность","Предшествование","Следование"],ans:1},
{type:"fill",q:"Having finished the letter, he ___ (go) to the post office.",ans:"went"},
{type:"choice",q:"«Do you see the child ___ the flag?»",opts:["waved","waving","having waved","being waved"],ans:1},
{type:"choice",q:"«___ everything, I want to tell you how sorry I am.»",opts:["Having explained","Explaining","Being explained","Explained"],ans:0},
{type:"fill",q:"«___ the problem, you will find something new to worry about.» (settle)",ans:"having settled"}
]},
{id:20,tag:"Урок 21",title:"Participle as Attribute",subtitle:"interesting/interested, frying/fried",
grammar:`<h3>Participle I как определение</h3>
<p>Participle I (Active) переводится причастием настоящего времени или прилагательным:</p>
<div class="vocab-grid">
<div class="vocab-item"><span class="en">interesting films</span><span class="ru">интересные фильмы</span></div>
<div class="vocab-item"><span class="en">exciting games</span><span class="ru">увлекательные игры</span></div>
<div class="vocab-item"><span class="en">boring lessons</span><span class="ru">скучные уроки</span></div>
<div class="vocab-item"><span class="en">burning fires</span><span class="ru">горящие костры</span></div>
<div class="vocab-item"><span class="en">sinking ships</span><span class="ru">тонущие корабли</span></div>
<div class="vocab-item"><span class="en">a frying pan</span><span class="ru">сковорода (для жарки)</span></div>
<div class="vocab-item"><span class="en">a writing boy</span><span class="ru">пишущий мальчик</span></div>
</div>
<h3>Participle II как определение</h3>
<div class="vocab-grid">
<div class="vocab-item"><span class="en">interested spectators</span><span class="ru">заинтересованные зрители</span></div>
<div class="vocab-item"><span class="en">excited children</span><span class="ru">взволнованные дети</span></div>
<div class="vocab-item"><span class="en">bored students</span><span class="ru">скучающие студенты</span></div>
<div class="vocab-item"><span class="en">burnt woods</span><span class="ru">сожжённые леса</span></div>
<div class="vocab-item"><span class="en">sunk ships</span><span class="ru">затонувшие корабли</span></div>
<div class="vocab-item"><span class="en">fried fish</span><span class="ru">жареная рыба</span></div>
<div class="vocab-item"><span class="en">a written letter</span><span class="ru">написанное письмо</span></div>
<div class="vocab-item"><span class="en">a baked potato</span><span class="ru">печёный картофель</span></div>
</div>
<div class="tip">Participle I (Active) = признак по действию (кипящий, горящий). Participle II (Passive) = признак по результату (сваренный, сожжённый).</div>
<h3>Замена определительного придаточного причастием</h3>
<div class="example"><span class="en">All the people <b>who live</b> in this house are students.</span><br>→ <span class="en">All the people <b>living</b> in this house are students.</span><span class="ru">Все люди, живущие в этом доме, — студенты.</span></div>`,
exercises:[
{type:"choice",q:"«Жареная рыба»:",opts:["frying fish","fried fish","having fried fish"],ans:1},
{type:"choice",q:"«Написанное письмо»:",opts:["writing letter","written letter","having written letter"],ans:1},
{type:"choice",q:"«Печёный картофель»:",opts:["baking potato","baked potato","having baked potato"],ans:1},
{type:"choice",q:"«Тонущие корабли»:",opts:["sunk ships","sinking ships","having sunk ships"],ans:1},
{type:"choice",q:"«Затонувшие корабли»:",opts:["sinking ships","sunk ships","having sunk ships"],ans:1},
{type:"choice",q:"«Скучающие студенты»:",opts:["boring students","bored students","having bored students"],ans:1},
{type:"choice",q:"«Скучные уроки»:",opts:["bored lessons","boring lessons","having bored lessons"],ans:1},
{type:"choice",q:"«All the people who live in this house» → причастие:",opts:["lived","living","having lived"],ans:1},
{type:"fill",q:"«Взволнованные дети» (excite):",ans:"excited children"},
{type:"fill",q:"«Увлекательные игры» (excite):",ans:"exciting games"}
]},
{id:21,tag:"Урок 22",title:"Participle as Adverbial Modifier",subtitle:"Причастие как обстоятельство",
grammar:`<h3>Participle как обстоятельство времени</h3>
<div class="example"><span class="en"><b>When asked</b> about his plans, he smiled.</span> — Когда его спросили о планах, он улыбнулся.<span class="ru"><span class="en"><b>While reading</b> the letter, she kept smiling.</span> — Читая письмо, она продолжала улыбаться.</span></div>
<h3>Participle как обстоятельство причины</h3>
<div class="example"><span class="en"><b>Not knowing</b> what to do, I asked him for advice.</span> — Не зная, что делать, я попросил у него совета.</div>
<h3>Participle как обстоятельство образа действия</h3>
<div class="example"><span class="en">He sat in the armchair <b>reading</b> a newspaper.</span> — Он сидел в кресле, читая газету.<span class="ru"><span class="en">She left the room <b>without saying</b> a word.</span> — Она вышла из комнаты, не сказав ни слова.</span></div>
<h3>The Absolute Participial Construction</h3>
<p>Конструкция, в которой причастие имеет собственное «подлежащее», не являющееся подлежащим предложения:</p>
<div class="example"><span class="en"><b>The letter having been written</b>, he went out to post it.</span><span class="ru">Письмо было написано, и он пошёл на почту отправить его.</span></div>
<div class="example"><span class="en"><b>The room being dark</b>, I couldn't see him.</span><span class="ru">Так как в комнате было темно, я не видел его.</span></div>`,
exercises:[
{type:"choice",q:"«___ about his plans, he smiled.» (ask)",opts:["Asking","Asked","Having asked"],ans:1},
{type:"choice",q:"«___ the letter, she kept smiling.» (read)",opts:["Read","Reading","Having read"],ans:1},
{type:"choice",q:"«___ what to do, I asked him for advice.» (not/know)",opts:["Not knowing","Not known","Not having known"],ans:0},
{type:"choice",q:"«He sat in the armchair ___ a newspaper.» (read)",opts:["read","reading","having read"],ans:1},
{type:"choice",q:"«She left the room ___ a word.» (not/say)",opts:["not saying","without saying","not said"],ans:1},
{type:"fill",q:"«___ everything, he went home.» (finish)",ans:"having finished"},
{type:"choice",q:"«___ the door, she ran out.» (open)",opts:["Opened","Opening","Having opened"],ans:2},
{type:"choice",q:"«___ by the noise, he woke up.» (disturb)",opts:["Disturbing","Disturbed","Having disturbed"],ans:1},
{type:"fill",q:"«___ the letter, he went to the post office.» (finish)",ans:"having finished"},
{type:"choice",q:"«___ from the window, I saw him cross the street.» (look)",opts:["Looked","Looking","Having looked"],ans:1}
]},
{id:22,tag:"Урок 23",title:"Complex Object",subtitle:"Objective-with-the-Infinitive Construction",
grammar:`<h3>Complex Object (Объектный падеж с инфинитивом)</h3>
<p>Состоит из существительного в общем падеже или местоимения в объектном падеже + инфинитив. Переводится придаточным дополнительным.</p>
<div class="example"><span class="en">I want <b>you to stop</b> worrying.</span> — Я хочу, чтобы ты перестал волноваться.<span class="ru"><span class="en">I want Mother (her) <b>to help</b> me.</span> — Я хочу, чтобы мама (она) помогла мне.</span></div>
<h3>Группы глаголов перед Complex Object</h3>
<table class="gram"><tr><th>Группа</th><th>Глаголы</th><th>Пример</th></tr>
<tr><td>Объявления</td><td>to pronounce, to declare, to report</td><td>The doctor pronounced the wound to be a slight one.</td></tr>
<tr><td>Желания и намерения</td><td>to want, to wish, to desire, to mean, to urge, to intend, to choose</td><td>I want you to stop worrying.</td></tr>
<tr><td>Чувства и эмоции</td><td>to like, to love, to dislike, to hate, cannot bear</td><td>Tell me what you would like me to do.</td></tr>
<tr><td>Приказ и разрешение</td><td>to order, to allow, to let, to command, to encourage, to ask, to forbid</td><td>The colonel ordered his men to attack.</td></tr>
<tr><td>Умственная деятельность</td><td>to know, to think, to consider, to believe, to find, to expect, to suppose</td><td>I knew them to be right. We expect them to arrive soon.</td></tr></table>
<div class="tip">NB! После глаголов to think, to consider, to find глагол <b>to be</b> может опускаться: <span class="en">I find him (to be) a very clever man.</span></div>
<h3>Глаголы let и make</h3>
<p>После <b>let</b> и <b>make</b> инфинитив используется <b>без to</b>:</p>
<div class="example"><span class="en">You can't <b>make</b> him <b>come</b> if he doesn't want to.</span><span class="ru"><span class="en">Let <b>me go</b>!</span> — Отпусти меня!</span></div>
<div class="tip">NB! В пассивных конструкциях с make используется to-Infinitive: <span class="en">He was made <b>to apologise</b>.</span></div>`,
exercises:[
{type:"choice",q:"«Why don't you ___ her to wear high heels?»",opts:["allow","let","make"],ans:0},
{type:"choice",q:"«The way she looks at me ___ me blush.»",opts:["wants","makes","expects"],ans:1},
{type:"choice",q:"«Do you ___ me to show you the place on the map?»",opts:["want","let","make"],ans:0},
{type:"choice",q:"«No one had ___ her to return so early.»",opts:["expected","let","made"],ans:0},
{type:"choice",q:"«Who ___ you to miss lectures?»",opts:["made","allowed","let"],ans:1},
{type:"choice",q:"«She ___ the children to be well behaved.»",opts:["expects","lets","makes"],ans:0},
{type:"choice",q:"«You can't ___ him come if he doesn't want to.»",opts:["allow","make","expect"],ans:1},
{type:"choice",q:"«The colonel ordered his men ___ attack.»",opts:["to","(без to)","for"],ans:0},
{type:"fill",q:"«I want you ___ (stop) worrying.»",ans:"to stop"},
{type:"choice",q:"Пассив с make: «He was made ___ .»",opts:["apologise","to apologise","apologising"],ans:1}
]},
{id:23,tag:"Урок 24",title:"Complex Object: Sense Perception",subtitle:"see, hear, watch, feel + bare Infinitive",
grammar:`<h3>Complex Object после глаголов восприятия</h3>
<p>После глаголов <b>to hear, to see, to watch, to feel, to observe</b> используется <b>bare Infinitive</b> (без to) — только Simple Infinitive Active.</p>
<div class="example"><span class="en">I saw Brown <b>enter</b> the room.</span> — Я видел, как Браун вошёл в комнату.<span class="ru"><span class="en">I felt the blood <b>rush</b> into my cheeks.</span> — Я почувствовал, как кровь прилила к щекам.</span></div>
<h3>Если значение пассивное — Participle II</h3>
<div class="example"><span class="en">I saw the fire slowly <b>conquered</b>.</span> — Я видел, как пожар постепенно потушили.</div>
<h3>Если выражен процесс — Participle I</h3>
<div class="example"><span class="en">He saw Fleur <b>coming</b> to us.</span> — Он видел, как Флёр подходила к нам.<span class="ru"><span class="en">He watched his camera <b>being repaired</b>.</span> — Он наблюдал, как ремонтируют его фотоаппарат.</span></div>
<h3>Сравнение: Infinitive vs Participle I</h3>
<table class="gram"><tr><th>Verb + Infinitive</th><th>Verb + Participle I</th></tr>
<tr><td>I saw him <b>enter</b> the shop.<br>(Я видел всё действие целиком — он открыл дверь, вошёл и исчез.)</td><td>I saw him <b>entering</b> the shop.<br>(Действие было в процессе, когда я его увидел.)</td></tr></table>
<div class="tip">После глаголов восприятия используется ТОЛЬКО Simple Infinitive Active (без to). Для пассива — Participle II. Для процесса — Participle I.</div>`,
exercises:[
{type:"choice",q:"«I saw Brown ___ the room.» (целое действие)",opts:["enter","entering","to enter"],ans:0},
{type:"choice",q:"«I saw him ___ the shop.» (действие в процессе)",opts:["enter","entering","to enter"],ans:1},
{type:"choice",q:"«He watched his camera ___ .» (пассив, процесс)",opts:["repaired","being repaired","to be repaired"],ans:1},
{type:"choice",q:"«I felt the blood ___ into my cheeks.»",opts:["rush","rushing","to rush"],ans:0},
{type:"choice",q:"«I saw the fire slowly ___ .» (пассив)",opts:["conquer","conquered","conquering"],ans:1},
{type:"choice",q:"«He saw Fleur ___ to us.» (процесс)",opts:["come","coming","to come"],ans:1},
{type:"choice",q:"«We heard them ___ .» (процесс)",opts:["argue","arguing","to argue"],ans:1},
{type:"choice",q:"«Nobody noticed me ___ the door and go out.»",opts:["open","opening","to open"],ans:0},
{type:"fill",q:"«I heard someone ___ .» (laugh, целое действие)",ans:"laugh"},
{type:"choice",q:"«The porter saw you ___ off the train.»",opts:["get","getting","to get"],ans:0}
]},
{id:24,tag:"Урок 25",title:"Complex Subject",subtitle:"Nominative-with-the-Infinitive Construction",
grammar:`<h3>Complex Subject (Именительный падеж с инфинитивом)</h3>
<p>Состоит из существительного/местоимения в именительном падеже + инфинитив. Переводится придаточным дополнительным или подлежащным.</p>
<div class="example"><span class="en">Laser <b>is known to be used</b> in medicine.</span> — Известно, что лазер широко используется в медицине.</div>
<h3>Группы глаголов в Passive перед Complex Subject</h3>
<table class="gram"><tr><th>Группа</th><th>Глаголы</th><th>Пример</th></tr>
<tr><td>Восприятие</td><td>to see, to hear, to notice, to observe, to watch</td><td>The car was seen to disappear in the distance.</td></tr>
<tr><td>Умственная деятельность</td><td>to think, to consider, to believe, to expect, to suppose, to know, to understand</td><td>He was thought to be honest and kind.</td></tr>
<tr><td>Сообщение</td><td>to say, to report, to order, to ask, to allow, to state, to announce</td><td>She is said to be working at the factory.</td></tr></table>
<div class="tip">NB! После глаголов в Passive Complex Subject более характерен для литературного стиля, чем для разговорного, кроме глаголов to suppose, to expect, to make.</div>
<h3>Формы инфинитива в Complex Subject</h3>
<table class="gram"><tr><th>Значение</th><th>Форма</th><th>Пример</th></tr>
<tr><td>Одновременное действие</td><td>Simple Infinitive</td><td>He is said to live in London.</td></tr>
<tr><td>Действие в процессе</td><td>Continuous Infinitive</td><td>The water seems to be boiling.</td></tr>
<tr><td>Предшествующее действие</td><td>Perfect Infinitive</td><td>They are reported to have finished the construction.</td></tr></table>
<div class="tip">Инфинитив в Complex Subject НЕ может относиться к будущему времени, кроме случаев с глаголами to expect, to be sure/certain, to be likely: <span class="en">He is expected to give us an answer tomorrow.</span></div>`,
exercises:[
{type:"choice",q:"«The car was seen ___ in the distance.»",opts:["to disappear","disappearing","disappear"],ans:0},
{type:"choice",q:"«He was thought ___ honest and kind.»",opts:["to be","being","be"],ans:0},
{type:"choice",q:"«She is said ___ at the factory.» (сейчас работает)",opts:["to work","to be working","to have worked"],ans:1},
{type:"choice",q:"«The delegation is reported ___ Moscow.» (уже покинула)",opts:["to leave","to have left","to be leaving"],ans:1},
{type:"choice",q:"«He is expected ___ us an answer tomorrow.»",opts:["to give","to have given","to be giving"],ans:0},
{type:"choice",q:"«The water seems ___ .» (кипит сейчас)",opts:["to boil","to be boiling","to have boiled"],ans:1},
{type:"choice",q:"«They are reported ___ the construction.» (уже закончили)",opts:["to finish","to have finished","to be finishing"],ans:1},
{type:"fill",q:"«He is known ___ an expert in this field.» (be)",ans:"to be"},
{type:"fill",q:"«She was heard ___ heartily.» (laugh)",ans:"to laugh"},
{type:"choice",q:"«He is considered ___ one of the most popular writers of his time.» (был)",opts:["to be","to have been","to be being"],ans:1}
]},
{id:25,tag:"Урок 26",title:"Complex Subject: Forms of the Infinitive",subtitle:"Практика раскрытия скобок",
grammar:`<h3>Выбор формы инфинитива в Complex Subject</h3>
<table class="gram"><tr><th>Ситуация</th><th>Форма инфинитива</th><th>Пример</th></tr>
<tr><td>Действие одновременно со сказуемым</td><td>to + V</td><td>He appears <b>to know</b> French well.</td></tr>
<tr><td>Действие в процессе</td><td>to be + V-ing</td><td>The water seems <b>to be boiling</b>.</td></tr>
<tr><td>Действие предшествует сказуемому</td><td>to have + V3</td><td>He is said <b>to have spent</b> his youth in Paris.</td></tr>
<tr><td>Пассив (одновременность)</td><td>to be + V3</td><td>She is expected <b>to be operated</b> on today.</td></tr>
<tr><td>Пассив (предшествование)</td><td>to have been + V3</td><td>The book was thought <b>to have been lost</b>.</td></tr>
<tr><td>Пассив + процесс</td><td>to have been + V-ing</td><td>The parties are reported <b>to have been considering</b> the agreement.</td></tr></table>
<h3>Примеры из учебника</h3>
<div class="example"><span class="en">He appears <b>to know</b> French well.</span> — Он, кажется, хорошо знает французский.<span class="ru"><span class="en">He is said <b>to have spent</b> his youth in Paris.</span> — Говорят, что он провёл юность в Париже.</span></div>
<div class="example"><span class="en">They are supposed <b>to have been working</b> at the problem for the last two months.</span> — Предполагается, что они работают над этой проблемой уже два месяца.<span class="ru"><span class="en">This man was seen <b>to run</b> away from the scene of crime.</span> — Видели, как этот человек убегал с места преступления.</span></div>`,
exercises:[
{type:"fill",q:"He appears ___ (know) French well.",ans:"to know"},
{type:"fill",q:"He is said ___ (spend) his youth in Paris.",ans:"to have spent"},
{type:"fill",q:"They are supposed ___ (work) at the problem for the last two months.",ans:"to have been working"},
{type:"fill",q:"His childhood is said ___ (be) very difficult.",ans:"to have been"},
{type:"fill",q:"A young woman is supposed ___ (write) this book.",ans:"to have written"},
{type:"fill",q:"He is believed ___ (teach) by his father. (пассив)",ans:"to have been taught"},
{type:"fill",q:"She is expected ___ (operate) on today. (пассив)",ans:"to be operated"},
{type:"fill",q:"The book was thought ___ (lose) until the librarian happened to find it.",ans:"to have been lost"},
{type:"fill",q:"This man was seen ___ (run) away from the scene of crime.",ans:"to run"},
{type:"fill",q:"The parties are reported ___ (consider) the agreement for six months.",ans:"to have been considering"}
]},
{id:26,tag:"Урок 27",title:"Subject Clauses",subtitle:"Подлежащные придаточные. Вводное it",
grammar:`<h3>Subject Clauses (Подлежащные придаточные)</h3>
<p>Выполняют функцию подлежащего к сказуемому главного предложения. Вводятся союзами:</p>
<table class="gram"><tr><th>Союз</th><th>Перевод</th><th>Пример</th></tr>
<tr><td>that</td><td>что</td><td>That he left is surprising.</td></tr>
<tr><td>what</td><td>что; то, что</td><td>What he said was true.</td></tr>
<tr><td>if / whether</td><td>ли</td><td>Whether he will come is unknown.</td></tr>
<tr><td>who / whoever</td><td>кто; тот, кто</td><td>Whoever said that is wrong.</td></tr>
<tr><td>whatever</td><td>всё, что; что бы ни</td><td>Whatever happens, I'll be there.</td></tr>
<tr><td>where / when / why / how</td><td>где / когда / почему / как</td><td>How he did it is a mystery.</td></tr>
<tr><td>how + adjective</td><td>насколько + прилагательное</td><td>How important it is...</td></tr></table>
<div class="tip">Если подлежащное придаточное стоит в конце предложения, используется вводное <b>it</b>: <span class="en"><b>It</b> is surprising <b>how</b> your voice hasn't changed.</span></div>
<div class="example"><span class="en">How important it is to start the work right away is clear to everybody.</span><span class="ru">Всем ясно, насколько важно начать работу немедленно.</span></div>
<div class="example"><span class="en">It is a pity you are leaving.</span> — Жаль, что ты уезжаешь.</div>
<h3>Различение предлогов, союзов и наречий</h3>
<table class="gram"><tr><th>Часть речи</th><th>Функция</th><th>Пример</th></tr>
<tr><td>Предлог</td><td>Соединяет словосочетания</td><td>After the presentation the guests will be able to buy products.</td></tr>
<tr><td>Подчинительный союз</td><td>Соединяет придаточные</td><td>After the presentation is over, the guests will be able to buy products.</td></tr>
<tr><td>Наречие</td><td>Обстоятельство в предложении</td><td>Once the towns were independent entities.</td></tr></table>`,
exercises:[
{type:"choice",q:"«___ important it is to start the work right away is clear to everybody.»",opts:["What","How","That","Whether"],ans:1},
{type:"choice",q:"«It is surprising ___ your voice hasn't changed.»",opts:["that","what","how","whether"],ans:2},
{type:"choice",q:"«It is a pity ___ you are leaving.»",opts:["what","that","how","whether"],ans:1},
{type:"choice",q:"«___ he said was true.»",opts:["That","What","Whether","How"],ans:1},
{type:"choice",q:"«___ he will come is unknown.»",opts:["What","Whether","That","How"],ans:1},
{type:"choice",q:"«After the presentation ___ over, the guests will be able to buy products.»",opts:["is (союз)","(предлог, без глагола)"],ans:0},
{type:"choice",q:"«After the presentation the guests will be able to buy products.» — «after» здесь:",opts:["Подчинительный союз","Предлог","Наречие"],ans:1},
{type:"fill",q:"«It is known ___ he has a large collection of pictures.» (союз)",ans:"that"},
{type:"choice",q:"«It may be said that the new theatre is the most beautiful building in town.» → Complex Subject:",opts:["The new theatre may be said to be the most beautiful building in town.","The new theatre may be said being the most beautiful building in town."],ans:0},
{type:"choice",q:"«It was reported that the ship had arrived in Odessa.» → Complex Subject:",opts:["The ship was reported to have arrived in Odessa.","The ship was reported to arrive in Odessa.","The ship was reported arriving in Odessa."],ans:0}
]},
{id:27,tag:"Урок 28",title:"Revision. Mixed Grammar",subtitle:"Итоговый урок: все темы курса",
grammar:`<h3>Краткое повторение всех тем</h3>
<table class="gram"><tr><th>Тема</th><th>Ключевое правило</th></tr>
<tr><td>to be</td><td>am/is/are (Present), was/were (Past)</td></tr>
<tr><td>to have</td><td>have/has got, had, will have</td></tr>
<tr><td>There is/are</td><td>Наличие чего-либо, согласование с первым подлежащим</td></tr>
<tr><td>Present Simple</td><td>Обычные действия, расписание, истины</td></tr>
<tr><td>Present Continuous</td><td>Действие сейчас, запланированное будущее</td></tr>
<tr><td>Past Simple</td><td>Действие в прошлом, последовательность</td></tr>
<tr><td>Past Continuous</td><td>Процесс в определённый момент прошлого</td></tr>
<tr><td>Future Simple</td><td>will + Inf, НЕ после if/when</td></tr>
<tr><td>Future Continuous</td><td>will be + -ing, процесс в будущем</td></tr>
<tr><td>Used to / Would</td><td>Привычки в прошлом</td></tr>
<tr><td>Nouns</td><td>Countable/Uncountable, 7 правил мн.ч.</td></tr>
<tr><td>Articles</td><td>a/an, the, zero article</td></tr>
<tr><td>Comparatives</td><td>-er/more, -est/most, the same as</td></tr>
<tr><td>Conditional I</td><td>If + Present, will + Inf</td></tr>
<tr><td>Conditional II</td><td>If + Past, would + Inf</td></tr>
<tr><td>Conditional III</td><td>If + Past Perfect, would have + Part II</td></tr>
<tr><td>But for</td><td>But for + noun = If it were not for</td></tr>
<tr><td>Wish</td><td>I wish + Past Simple (present), Past Perfect (past)</td></tr>
<tr><td>Indirect Speech</td><td>Sequence of Tenses, if/whether, to-inf</td></tr>
<tr><td>Participle</td><td>Forms I/II/Perfect, Attribute, Adverbial Modifier</td></tr>
<tr><td>Complex Object</td><td>Verb + noun/pronoun + Infinitive</td></tr>
<tr><td>Complex Subject</td><td>Passive verb + Infinitive (Simple/Cont/Perfect)</td></tr>
<tr><td>Subject Clauses</td><td>Connectives, introductory "it"</td></tr></table>
<div class="tip">Этот урок содержит комплексные упражнения из всех разделов. Используйте его для самопроверки перед экзаменом!</div>`,
exercises:[
{type:"choice",q:"The sky ___ very blue today.",opts:["is","are","am","was"],ans:0},
{type:"choice",q:"___ many old buildings in Chester.",opts:["There is","There are","There was"],ans:1},
{type:"choice",q:"What does a singer do?",opts:["He sings.","He is singing.","He sang."],ans:0},
{type:"choice",q:"Look! It ___. (rain)",opts:["rains","is raining","rained"],ans:1},

{type:"choice",q:"If it rains, we ___ at home. (Type I)",opts:["stay","will stay","would stay"],ans:1},
{type:"choice",q:"If I ___ you, I would go there. (Type II)",opts:["am","was","were"],ans:2},

{type:"choice",q:"I wish I ___ (know) how to drive. (present)",opts:["know","knew","had known"],ans:1},

{id:28,tag:"Урок 29",title:"Question Forms & Short Answers",subtitle:"Порядок слов, специальные вопросы и краткие ответы",
grammar:`<h3>Как строить вопросы</h3><p>В общем вопросе вспомогательный глагол ставится перед подлежащим: <span class="en">Do you work? Is she ready? Have they arrived?</span> Если вопросительное слово является подлежащим, вспомогательный глагол не нужен: <span class="en">Who lives here?</span></p><table class="gram"><tr><th>Тип</th><th>Схема</th><th>Пример</th></tr><tr><td>Общий</td><td>Auxiliary + subject + verb?</td><td>Did you call?</td></tr><tr><td>Специальный</td><td>Wh-word + auxiliary + subject + verb?</td><td>Where did you go?</td></tr><tr><td>К подлежащему</td><td>Who/What + verb?</td><td>Who called you?</td></tr><tr><td>Разделительный</td><td>Statement, auxiliary + pronoun?</td><td>She is here, isn't she?</td></tr></table><div class="tip">После <b>do/does/did</b> используется начальная форма смыслового глагола: <span class="en">Where did he <b>go</b>?</span>, не <span class="en">did he went</span>.</div>`,
