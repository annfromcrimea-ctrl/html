{id:29,tag:"Урок 30",title:"Modal Verbs",subtitle:"Can, could, may, must, have to, should, needn't",
grammar:`<h3>Значения модальных глаголов</h3><p>Модальные глаголы выражают способность, разрешение, обязанность, совет, вероятность и необходимость. После <b>can, could, may, might, must, should</b> употребляется инфинитив без <i>to</i>.</p><table class="gram"><tr><th>Форма</th><th>Основное значение</th><th>Пример</th></tr><tr><td>can / could</td><td>умение, возможность, просьба</td><td>She can drive. Could you help?</td></tr><tr><td>must</td><td>строгая обязанность, логический вывод</td><td>You must wear a helmet.</td></tr><tr><td>have to</td><td>внешняя необходимость</td><td>I have to leave early.</td></tr><tr><td>should</td><td>совет</td><td>You should rest.</td></tr><tr><td>may / might</td><td>возможность</td><td>It might rain.</td></tr></table><div class="tip"><b>Mustn't</b> означает «нельзя», а <b>don't have to</b> — «необязательно»: <span class="en">You mustn't park here. You don't have to come early.</span></div>`,
exercises:[
{type:"choice",q:"You ___ show your passport at the border.",opts:["must","might","can","would"],ans:0},{type:"choice",q:"You ___ smoke here; it is forbidden.",opts:["needn't","mustn't","don't have to","couldn't"],ans:1},{type:"choice",q:"I ___ get up early tomorrow; it is my day off.",opts:["mustn't","don't have to","shouldn't","can't"],ans:1},{type:"choice",q:"___ you please open the window?",opts:["Could","Must","Should","Have"],ans:0},{type:"choice",q:"When I was five, I ___ already read.",opts:["can","could","must","should"],ans:1},{type:"choice",q:"It is cloudy. It ___ rain later.",opts:["must to","might","has to","should to"],ans:1},{type:"choice",q:"You look tired. You ___ take a break.",opts:["should","have","can to","mustn't"],ans:0},{type:"choice",q:"Employees ___ wear an ID badge at work.",opts:["have to","might","needn't to","can"],ans:0},{type:"choice",q:"She ___ be at home; the lights are on.",opts:["must","must to","has","should to"],ans:0},{type:"choice",q:"Which form is correct?",opts:["He can speak English.","He can to speak English.","He cans speak English.","He can speaking English."],ans:0},{type:"fill",q:"Complete: 'You ___ not tell anyone.' (prohibition)",ans:"must"},{type:"fill",q:"Complete: '___ I borrow your pen?' (polite permission)",ans:"may"}
]},
{id:30,tag:"Урок 31",title:"Passive Voice",subtitle:"Пассивный залог во временах и с модальными глаголами",
grammar:`<h3>Когда используется Passive Voice</h3><p>Пассивный залог нужен, когда важнее действие или его результат, а исполнитель неизвестен, неважен или очевиден. Формула: <b>be + Past Participle (V3)</b>.</p><table class="gram"><tr><th>Время</th><th>Форма</th><th>Пример</th></tr><tr><td>Present Simple</td><td>am/is/are + V3</td><td>English is spoken here.</td></tr><tr><td>Past Simple</td><td>was/were + V3</td><td>The bridge was built in 1890.</td></tr><tr><td>Present Perfect</td><td>has/have been + V3</td><td>The work has been finished.</td></tr><tr><td>Future</td><td>will be + V3</td><td>The results will be announced.</td></tr><tr><td>Modal</td><td>modal + be + V3</td><td>The form must be signed.</td></tr></table><div class="tip">Указывайте исполнителя с <b>by</b>, только если он действительно важен: <span class="en">The novel was written <b>by</b> Orwell.</span></div>`,
exercises:[
{type:"choice",q:"English ___ in many countries.",opts:["speaks","is spoken","is speaking","has spoken"],ans:1},{type:"choice",q:"The windows ___ yesterday.",opts:["cleaned","were cleaned","have cleaned","were cleaning"],ans:1},{type:"choice",q:"The report ___ yet.",opts:["hasn't finished","hasn't been finished","wasn't finishing","doesn't finish"],ans:1},{type:"choice",q:"The tickets ___ online tomorrow.",opts:["will sell","will be sold","are selling","will have sold"],ans:1},{type:"choice",q:"All mobile phones ___ off during the exam.",opts:["must switch","must be switched","must switched","are must switched"],ans:1},{type:"choice",q:"This painting was created ___ a local artist.",opts:["from","by","with","at"],ans:1},{type:"choice",q:"People grow coffee in Brazil. → Passive:",opts:["Coffee grows in Brazil.","Coffee is grown in Brazil.","Coffee was grown in Brazil.","Coffee has grown in Brazil."],ans:1},{type:"choice",q:"Someone has stolen my bike. → Passive:",opts:["My bike has been stolen.","My bike has stolen.","My bike was stealing.","My bike is stolen yesterday."],ans:0},{type:"choice",q:"Which sentence is passive?",opts:["The door was locked at six.","The door locked at six.","The door was locking at six.","The door has lock at six."],ans:0},{type:"choice",q:"The new library ___ next year.",opts:["will open","will be opened","opens by","will be opening by"],ans:1},{type:"fill",q:"Complete: 'The package ___ delivered this morning.' (Past Simple passive)",ans:"was"},{type:"fill",q:"Complete: 'The instructions must ___ read carefully.'",ans:"be"}
]},
{id:31,tag:"Урок 32",title:"Gerund & Infinitive",subtitle:"V-ing, to-infinitive и глаголы с изменением значения",
grammar:`<h3>Две неличные формы</h3><p><b>Gerund</b> — форма на <i>-ing</i>, часто после предлогов и некоторых глаголов. <b>To-infinitive</b> часто выражает цель или следует за определёнными глаголами и прилагательными.</p><table class="gram"><tr><th>После V-ing</th><th>После to + infinitive</th><th>Пример</th></tr><tr><td>enjoy, avoid, suggest, finish, keep</td><td>want, decide, hope, plan, promise</td><td>She enjoys reading. We decided to stay.</td></tr><tr><td>после предлога</td><td>после too/enough</td><td>Before leaving; too tired to walk</td></tr></table><div class="tip">После <b>stop</b> значения различаются: <span class="en">stop smoking</span> — перестать курить; <span class="en">stop to smoke</span> — остановиться, чтобы покурить.</div>`,
exercises:[
{type:"choice",q:"I enjoy ___ detective stories.",opts:["read","to read","reading","to reading"],ans:2},{type:"choice",q:"They decided ___ by train.",opts:["go","going","to go","to going"],ans:2},{type:"choice",q:"Thank you for ___ me.",opts:["help","to help","helping","to helping"],ans:2},{type:"choice",q:"She hopes ___ abroad next year.",opts:["study","studying","to study","to studying"],ans:2},{type:"choice",q:"He avoided ___ about the problem.",opts:["talk","to talk","talking","to talking"],ans:2},{type:"choice",q:"We are looking forward to ___ you.",opts:["meet","to meet","meeting","to meeting"],ans:2},{type:"choice",q:"It is important ___ enough sleep.",opts:["get","getting","to get","to getting"],ans:2},{type:"choice",q:"I stopped ___ because it was unhealthy.",opts:["to smoke","smoking","smoke","to smoking"],ans:1},{type:"choice",q:"I stopped ___ a coffee on the way home.",opts:["to have","having","have","to having"],ans:0},{type:"choice",q:"She suggested ___ earlier.",opts:["leave","to leave","leaving","to leaving"],ans:2},{type:"fill",q:"Complete: 'Before ___, turn off the lights.' (leave)",ans:"leaving"},{type:"fill",q:"Complete: 'I want ___ a new language.' (learn)",ans:"to learn"}
]},
{id:32,tag:"Урок 33",title:"Relative Clauses",subtitle:"Who, which, that, whose, where и определительные придаточные",
grammar:`<h3>Относительные местоимения</h3><p>Relative clauses добавляют информацию о существительном. В определительных придаточных <b>who</b> относится к людям, <b>which</b> — к предметам, <b>whose</b> выражает принадлежность, <b>where</b> — место. <b>That</b> может заменить who/which в определительных придаточных.</p><table class="gram"><tr><th>Слово</th><th>Функция</th><th>Пример</th></tr><tr><td>who / that</td><td>люди</td><td>The woman who called is my aunt.</td></tr><tr><td>which / that</td><td>вещи и животные</td><td>The book that I bought is useful.</td></tr><tr><td>whose</td><td>принадлежность</td><td>The student whose bag is missing...</td></tr><tr><td>where</td><td>место</td><td>The café where we met...</td></tr></table><div class="tip">Если местоимение — дополнение в определительном придаточном, его иногда можно опустить: <span class="en">The film (that) we watched was excellent.</span></div>`,
exercises:[
{type:"choice",q:"The man ___ lives next door is a doctor.",opts:["which","who","where","whose"],ans:1},{type:"choice",q:"This is the book ___ I told you about.",opts:["who","where","that","whose"],ans:2},{type:"choice",q:"The girl ___ brother is a pilot won the prize.",opts:["who","which","whose","where"],ans:2},{type:"choice",q:"That is the restaurant ___ we had dinner.",opts:["who","which","where","whose"],ans:2},{type:"choice",q:"The laptop ___ I bought last week is very fast.",opts:["who","that","whose","where"],ans:1},{type:"choice",q:"Which is correct?",opts:["The person who helped me was kind.","The person which helped me was kind.","The person where helped me was kind.","The person whose helped me was kind."],ans:0},{type:"choice",q:"The car ___ was parked outside has gone.",opts:["who","which","where","whose"],ans:1},{type:"choice",q:"The woman ___ you met is my teacher.",opts:["who","which","where","whose"],ans:0},{type:"choice",q:"The city ___ I was born is on the coast.",opts:["that","whose","where","who"],ans:2},{type:"choice",q:"A relative pronoun can be omitted in: ___",opts:["The woman who called.","The book that I bought.","The boy whose bike was stolen.","The café where we met."],ans:1},{type:"fill",q:"Complete: 'The people ___ work here are friendly.'",ans:"who"},{type:"fill",q:"Complete: 'The teacher ___ class I joined is helpful.'",ans:"whose"}
]},
{id:33,tag:"Урок 34",title:"Determiners & Quantifiers",subtitle:"Some, any, much, many, few, little, each, every",
grammar:`<h3>Количество и определители</h3><p><b>Many/few/a few</b> употребляются с исчисляемыми существительными; <b>much/little/a little</b> — с неисчисляемыми. <b>Some</b> обычно в утверждениях, <b>any</b> в вопросах и отрицаниях, но <b>some</b> также встречается в предложениях-просьбах и предложениях чего-либо.</p><table class="gram"><tr><th>Исчисляемые</th><th>Неисчисляемые</th><th>Оттенок</th></tr><tr><td>many books, few books, a few books</td><td>much water, little water, a little water</td><td>few/little = почти нет; a few/a little = немного, достаточно</td></tr><tr><td>each/every student</td><td>all the information</td><td>each — по отдельности; every — все в целом</td></tr></table><div class="tip"><b>Less</b> обычно с неисчисляемыми, <b>fewer</b> — с исчисляемыми: <span class="en">less traffic, fewer cars.</span></div>`,
exercises:[
{type:"choice",q:"There aren't ___ chairs in the room.",opts:["much","many","little","a little"],ans:1},{type:"choice",q:"How ___ water do you drink every day?",opts:["many","much","few","a few"],ans:1},{type:"choice",q:"We have ___ time, so let's hurry.",opts:["few","a few","little","a little"],ans:2},{type:"choice",q:"I have ___ close friends I can rely on.",opts:["little","a little","a few","much"],ans:2},{type:"choice",q:"Would you like ___ tea?",opts:["any","some","many","few"],ans:1},{type:"choice",q:"Do you have ___ questions?",opts:["some","any","much","little"],ans:1},{type:"choice",q:"___ student must submit the form.",opts:["Every","Many","Much","Any"],ans:0},{type:"choice",q:"There were ___ people at the beach this year than last year.",opts:["less","fewer","little","few"],ans:1},{type:"choice",q:"I need ___ information before I decide.",opts:["a few","a little","many","few"],ans:1},{type:"choice",q:"Which word suits 'advice'?",opts:["many","few","a little","a few"],ans:2},{type:"fill",q:"Complete: 'There isn't ___ milk left.'",ans:"much"},{type:"fill",q:"Complete: '___ of the answers is correct.'",ans:"each"}
]},
{id:34,tag:"Урок 35",title:"Pronouns & Determiners",subtitle:"Personal, possessive, reflexive, indefinite pronouns",
grammar:`<h3>Местоимения в контексте</h3><p>Личные местоимения меняются по функции: <span class="en">I → me, she → her, they → them.</span> После предлога используйте объектную форму. Притяжательные прилагательные стоят перед существительным (<span class="en">my book</span>), а самостоятельные притяжательные местоимения заменяют существительное (<span class="en">mine</span>).</p><table class="gram"><tr><th>Функция</th><th>Пример</th><th>Форма</th></tr><tr><td>Объект</td><td>Give it to Anna and me.</td><td>me, him, her, us, them</td></tr><tr><td>Притяжательное определение</td><td>This is our room.</td><td>my, your, his, her, its, our, their</td></tr><tr><td>Самостоятельное притяжательное</td><td>This room is ours.</td><td>mine, yours, his, hers, ours, theirs</td></tr><tr><td>Возвратное</td><td>She taught herself.</td><td>myself, yourself, himself...</td></tr></table><div class="tip">После <b>everyone, somebody, nobody</b> традиционно возможен <b>they/their</b> в нейтральной речи: <span class="en">Everyone should bring their ID.</span></div>`,
exercises:[
{type:"choice",q:"Could you help Anna and ___?",opts:["I","me","my","mine"],ans:1},{type:"choice",q:"This coat is ___.",opts:["my","mine","me","I"],ans:1},{type:"choice",q:"We painted the room ___.",opts:["us","our","ourselves","ourself"],ans:2},{type:"choice",q:"Tom has lost ___ keys.",opts:["he","him","his","himself"],ans:2},{type:"choice",q:"I spoke to Julia and ___.",opts:["she","her","hers","herself"],ans:1},{type:"choice",q:"The decision is ___, not theirs.",opts:["our","ours","us","we"],ans:1},{type:"choice",q:"Nobody brought ___ passport.",opts:["they","their","them","theirs"],ans:1},{type:"choice",q:"The cat cleaned ___.",opts:["it","its","itself","itself's"],ans:2},{type:"choice",q:"Is this your bag? — No, ___ is blue.",opts:["my","mine","me","I"],ans:1},{type:"choice",q:"Which sentence is correct?",opts:["Between you and me, it is difficult.","Between you and I, it is difficult.","Between your and me, it is difficult.","Between you and mine, it is difficult."],ans:0},{type:"fill",q:"Complete: 'They invited my sister and ___.'",ans:"me"},{type:"fill",q:"Complete: 'She made the dress ___.'",ans:"herself"}
]},
{id:35,tag:"Урок 36",title:"Prepositions",subtitle:"Время, место, движение и устойчивые сочетания",
grammar:`<h3>Предлоги в системах</h3><p>Предлоги нельзя всегда переводить буквально, поэтому полезно учить их в сочетаниях. Для времени: <b>at</b> — точка, <b>on</b> — день/дата, <b>in</b> — период. Для места: <b>at</b> — точка/место деятельности, <b>on</b> — поверхность, <b>in</b> — внутри.</p><table class="gram"><tr><th>Предлог</th><th>Время</th><th>Место/движение</th></tr><tr><td>at</td><td>at 7, at night</td><td>at the station</td></tr><tr><td>on</td><td>on Monday, on 5 May</td><td>on the wall</td></tr><tr><td>in</td><td>in July, in 2026</td><td>in a box</td></tr><tr><td>to / into</td><td>—</td><td>to a destination / movement inside</td></tr></table><div class="tip">После <b>arrive</b>: <span class="en">arrive <b>at</b> a station</span>, но <span class="en">arrive <b>in</b> a city/country</span>.</div>`,
exercises:[
{type:"choice",q:"The meeting starts ___ 9:30.",opts:["in","on","at","by"],ans:2},{type:"choice",q:"We moved here ___ 2023.",opts:["at","on","in","to"],ans:2},{type:"choice",q:"Her birthday is ___ Friday.",opts:["at","on","in","by"],ans:1},{type:"choice",q:"The keys are ___ the table.",opts:["in","at","on","to"],ans:2},{type:"choice",q:"They arrived ___ London late at night.",opts:["at","in","on","to"],ans:1},{type:"choice",q:"She walked ___ the room and sat down.",opts:["into","on","at","by"],ans:0},{type:"choice",q:"I am interested ___ modern art.",opts:["on","at","in","for"],ans:2},{type:"choice",q:"He is good ___ mathematics.",opts:["in","on","at","to"],ans:2},{type:"choice",q:"We have lived here ___ five years.",opts:["since","for","during","from"],ans:1},{type:"choice",q:"I have known her ___ 2019.",opts:["for","during","since","at"],ans:2},{type:"fill",q:"Complete: 'Please listen ___ the teacher.'",ans:"to"},{type:"fill",q:"Complete: 'The bus stopped ___ the corner.'",ans:"at"}
]},
{id:36,tag:"Урок 37",title:"Phrasal Verbs",subtitle:"Глагол + частица: значение, отделяемость и контекст",
grammar:`<h3>Что такое phrasal verb</h3><p>Фразовый глагол состоит из глагола и частицы/предлога; вместе они часто получают новое значение. Учите фразовый глагол вместе с примером. У отделяемых глаголов местоимение ставится между глаголом и частицей: <span class="en">turn it off</span>, не <span class="en">turn off it</span>.</p><table class="gram"><tr><th>Глагол</th><th>Значение</th><th>Пример</th></tr><tr><td>find out</td><td>выяснить</td><td>Find out the answer.</td></tr><tr><td>look after</td><td>заботиться о</td><td>She looks after her nephew.</td></tr><tr><td>give up</td><td>бросить, отказаться</td><td>He gave up smoking.</td></tr><tr><td>turn on/off</td><td>включить/выключить</td><td>Turn the light off.</td></tr><tr><td>run out of</td><td>израсходовать</td><td>We ran out of milk.</td></tr></table><div class="tip">Некоторые фразовые глаголы неразделяемы: <span class="en">look after the child</span>, не <span class="en">look the child after</span>.</div>`,
exercises:[
{type:"choice",q:"Please ___ the light; it is dark here.",opts:["turn on","give up","find out","look after"],ans:0},{type:"choice",q:"Who will ___ the children this evening?",opts:["look after","run out","turn off","give up"],ans:0},{type:"choice",q:"I need to ___ why the train is late.",opts:["find out","turn on","look after","run out"],ans:0},{type:"choice",q:"She ___ smoking two years ago.",opts:["gave up","gave on","gave after","gave out of"],ans:0},{type:"choice",q:"We have ___ coffee.",opts:["run out of","run after","run into","run off"],ans:0},{type:"choice",q:"Turn ___ your phone during the film.",opts:["off","after","out of","up"],ans:0},{type:"choice",q:"Correct order with a pronoun:",opts:["Turn it off.","Turn off it.","Turn off it up.","Turn it after."],ans:0},{type:"choice",q:"The plane ___ at 7:15.",opts:["takes off","looks after","gives up","runs out"],ans:0},{type:"choice",q:"I came ___ an old photo yesterday.",opts:["across","after","off","up"],ans:0},{type:"choice",q:"Please fill ___ this form.",opts:["in","after","out of","across"],ans:0},{type:"fill",q:"Complete: 'Don't ___ up; keep practising!'",ans:"give"},{type:"fill",q:"Complete: 'Can you pick ___ the children at five?'",ans:"up"}
]},
{id:37,tag:"Урок 38",title:"Word Formation",subtitle:"Суффиксы, приставки и части речи",
grammar:`<h3>Как расширять словарный запас</h3><p>Word formation помогает распознавать незнакомые слова. Суффиксы часто показывают часть речи: <b>-ment, -tion, -ness</b> образуют существительные, <b>-ful, -less, -able</b> — прилагательные, <b>-ly</b> — наречия. Приставки <b>un-, im-, dis-, re-</b> меняют значение.</p><table class="gram"><tr><th>Основа</th><th>Производное</th><th>Значение</th></tr><tr><td>develop</td><td>development</td><td>развитие</td></tr><tr><td>care</td><td>careful / careless</td><td>осторожный / небрежный</td></tr><tr><td>possible</td><td>impossible</td><td>невозможный</td></tr><tr><td>happy</td><td>happiness / happily</td><td>счастье / счастливо</td></tr></table><div class="tip">Сначала определите, какая часть речи нужна после артикля, перед существительным или после глагола; затем выберите подходящий суффикс.</div>`,
exercises:[
{type:"choice",q:"The ___ of the project took six months. (develop)",opts:["development","developing","developed","developerly"],ans:0},{type:"choice",q:"She answered the question ___. (polite)",opts:["politeness","politely","impolite","politeful"],ans:1},{type:"choice",q:"It was a very ___ decision. (care)",opts:["careful","carefully","careless","care"],ans:0},{type:"choice",q:"The weather made travel ___. (possible)",opts:["impossible","possibility","possibly","unpossible"],ans:0},{type:"choice",q:"His ___ was obvious to everyone. (kind)",opts:["kindness","kindly","unkind","kindful"],ans:0},{type:"choice",q:"Please ___ the file before sending it. (check)",opts:["recheck","uncheckful","checkness","checking"],ans:0},{type:"choice",q:"The instructions were clear and ___. (use)",opts:["useful","usefully","uselessly","usage"],ans:0},{type:"choice",q:"She spoke with great ___. (confident)",opts:["confidence","confidently","confident","unconfident"],ans:0},{type:"choice",q:"The room was ___ clean. (surprise)",opts:["surprisingly","surprise","surprised","surprisingness"],ans:0},{type:"choice",q:"Which word means 'without hope'?",opts:["hopeless","hopeful","hopefully","hope"],ans:0},{type:"fill",q:"Complete: 'Their ___ made everyone smile.' (happy)",ans:"happiness"},{type:"fill",q:"Complete: 'The device is ___.' (use)",ans:"useful"}
]},
{id:38,tag:"Урок 39",title:"Punctuation & Capitalization",subtitle:"Точность письменной английской речи",
grammar:`<h3>Пунктуация делает смысл ясным</h3><p>В английском предложение начинается с прописной буквы и заканчивается точкой, вопросительным или восклицательным знаком. Апостроф показывает сокращение или принадлежность. Запятая не ставится между подлежащим и сказуемым.</p><table class="gram"><tr><th>Знак / правило</th><th>Применение</th><th>Пример</th></tr><tr><td>apostrophe</td><td>сокращение и принадлежность</td><td>it's; Maria's book; the students' room</td></tr><tr><td>comma</td><td>после вводной части</td><td>After dinner, we went home.</td></tr><tr><td>capital letter</td><td>имена, дни, месяцы, страны, I</td><td>Monday, Russia, I</td></tr><tr><td>semicolon</td><td>связанные самостоятельные части</td><td>It was late; we left.</td></tr></table><div class="tip">Не путайте <b>it's</b> (= it is) и <b>its</b> (его/её для предмета): <span class="en">It's cold. The company changed its policy.</span></div>`,
exercises:[
{type:"choice",q:"Choose the correct sentence.",opts:["My sister's car is new.","My sisters car is new.","My sister car is new.","My sister's' car is new."],ans:0},{type:"choice",q:"Choose the correct word: '___ a beautiful day.'",opts:["Its","It's","Its'","It"],ans:1},{type:"choice",q:"Which sentence uses capitals correctly?",opts:["We met on Monday in London.","We met on monday in london.","We met on Monday in london.","We met on monday in London."],ans:0},{type:"choice",q:"Correct punctuation after an introductory clause:",opts:["When I arrived, the lesson had started.","When I arrived the lesson had started.","When, I arrived the lesson had started.","When I, arrived the lesson had started."],ans:0},{type:"choice",q:"The plural possessive of 'students' is:",opts:["students'","student's","students's","student"],ans:0},{type:"choice",q:"Which is a complete sentence?",opts:["Because the weather was cold.","The weather was cold.","Although very cold.","When arriving at home."],ans:1},{type:"choice",q:"Choose correct direct speech punctuation.",opts:["She said, 'I am ready.'","She said 'I am ready'.","She said, I am ready.","She said 'I am ready."],ans:0},{type:"choice",q:"Which word is always capitalized?",opts:["i","I","me","my"],ans:1},{type:"choice",q:"Correct: 'the children's toys' means:",opts:["toys belonging to several children","toys belonging to one child","children that are toys","toys for one child only"],ans:0},{type:"choice",q:"Which sentence is punctuated correctly?",opts:["However, we decided to stay.","However we, decided to stay.","However we decided, to stay.","However; we decided, to stay."],ans:0},{type:"fill",q:"Complete: 'The dog wagged ___ tail.' (its / it's)",ans:"its"},{type:"fill",q:"Write the contracted form of 'do not'.",ans:"don't"}
]},
{id:39,tag:"Урок 40",title:"Academic Editing & Common Errors",subtitle:"Саморедактирование, согласование и типичные ошибки",
grammar:`<h3>Алгоритм самопроверки</h3><p>После черновика проверьте согласование подлежащего и глагола, времена, артикли, предлоги, форму после вспомогательных и модальных глаголов, а также орфографию. Отдельно ищите типичные ошибки русскоязычных учащихся: <span class="en">I am agree</span>, <span class="en">discuss about</span>, <span class="en">depend from</span>.</p><table class="gram"><tr><th>Ошибка</th><th>Правильно</th><th>Пояснение</th></tr><tr><td>I am agree.</td><td>I agree.</td><td>agree — глагол</td></tr><tr><td>discuss about it</td><td>discuss it</td><td>discuss без about</td></tr><tr><td>depend from</td><td>depend on</td><td>устойчивое сочетание</td></tr><tr><td>more better</td><td>better</td><td>двойная сравнительная форма</td></tr><tr><td>He said me</td><td>He told me / He said to me</td><td>разные модели управления</td></tr></table><div class="tip">При сомнении сформулируйте короткое ясное предложение. Точность важнее чрезмерно сложной конструкции.</div>`,
exercises:[
{type:"choice",q:"Choose the correct sentence.",opts:["I agree with you.","I am agree with you.","I am agreeing with you always.","I agree to you."],ans:0},{type:"choice",q:"We need to ___ this issue today.",opts:["discuss","discuss about","discussing about","to discuss about"],ans:0},{type:"choice",q:"Success depends ___ careful planning.",opts:["from","of","on","at"],ans:2},{type:"choice",q:"This solution is ___ than the previous one.",opts:["more better","better","best","the better"],ans:1},{type:"choice",q:"He ___ me that he was busy.",opts:["said","told","spoke","talked"],ans:1},{type:"choice",q:"The information ___ useful.",opts:["are","is","were","have"],ans:1},{type:"choice",q:"Neither the manager nor the employees ___ ready.",opts:["was","were","is","has"],ans:1},{type:"choice",q:"There ___ a mistake in these calculations.",opts:["seem","seems","are seeming","have seemed"],ans:1},{type:"choice",q:"She suggested that he ___ earlier.",opts:["leave","leaves","left","to leave"],ans:0},{type:"choice",q:"I am used to ___ early.",opts:["get up","getting up","to get up","got up"],ans:1},{type:"fill",q:"Complete: 'The results ___ reliable.' (be)",ans:"are"},{type:"fill",q:"Complete: 'Could you explain it ___ me?'",ans:"to"}
]},
{id:40,tag:"Урок 41",title:"Final Diagnostic Test",subtitle:"Итоговая диагностика по всей программе",
grammar:`<h3>Как работать с диагностикой</h3><p>Выполните задание без справочника, затем проверьте результат. Ошибки группируйте по теме: время, структура вопроса, артикль/определитель, неличная форма, предлог или лексико-грамматическая сочетаемость. После этого повторите соответствующий урок и пройдите новый вариант в Практической лаборатории.</p><div class="diagnostic-grid"><div class="diagnostic-chip"><b>1–5</b><br>Базовые формы</div><div class="diagnostic-chip"><b>6–10</b><br>Времена и модальные</div><div class="diagnostic-chip"><b>11–15</b><br>Пассив и неличные формы</div><div class="diagnostic-chip"><b>16–20</b><br>Точность и редактура</div></div><div class="tip">Результат 17–20 означает уверенное владение рассмотренными темами. При меньшем результате начните с тех вопросов, где допущены ошибки, а не повторяйте весь курс без разбора.</div>`,
exercises:[
{type:"choice",q:"There ___ any milk in the fridge.",opts:["isn't","aren't","don't have","hasn't"],ans:0},{type:"choice",q:"My father ___ to work by bus every day.",opts:["go","goes","is go","going"],ans:1},{type:"choice",q:"Look! The children ___.",opts:["play","are playing","played","have play"],ans:1},{type:"choice",q:"I ___ this film last weekend.",opts:["see","saw","have seen","was seeing"],ans:1},{type:"choice",q:"We ___ dinner when the lights went out.",opts:["had","were having","have","are having"],ans:1},{type:"choice",q:"You ___ wear a seatbelt in a car.",opts:["must","might","could to","must to"],ans:0},{type:"choice",q:"If it ___ tomorrow, we will stay at home.",opts:["rains","will rain","rained","would rain"],ans:0},{type:"choice",q:"I wish I ___ more free time.",opts:["have","had","will have","have had"],ans:1},{type:"choice",q:"She asked me where I ___.",opts:["live","lived","will live","am living"],ans:1},{type:"choice",q:"He said that he ___ the report already.",opts:["finishes","had finished","is finishing","will finish"],ans:1},{type:"choice",q:"The museum ___ every Monday.",opts:["closes","is closed","has closed","was closing"],ans:1},{type:"choice",q:"The documents must ___ before Friday.",opts:["submit","be submitted","submitted","be submitting"],ans:1},{type:"choice",q:"I suggest ___ a taxi.",opts:["take","to take","taking","to taking"],ans:2},{type:"choice",q:"The woman ___ called you is my colleague.",opts:["which","who","where","whose"],ans:1},{type:"choice",q:"There are ___ apples left, so buy some more.",opts:["little","a little","few","much"],ans:2},{type:"choice",q:"We arrived ___ the airport at 6 a.m.",opts:["in","at","on","to"],ans:1},{type:"choice",q:"Please turn ___ the radio; I am working.",opts:["off","after","up to","out of"],ans:0},{type:"choice",q:"Her explanation was very ___.",opts:["clear","clearly","clearness","unclearfully"],ans:0},{type:"choice",q:"Choose the correct sentence.",opts:["The company's policy has changed.","The companys policy has changed.","The companies policy has changed.","The company's' policy has changed."],ans:0},{type:"choice",q:"He is interested ___ learning languages.",opts:["on","in","at","for"],ans:1}
]}
];

let scores={},currentLesson=null;
function saveState(){try{localStorage.setItem('en_grammar_full',JSON.stringify(scores))}catch(e){}}
function loadState(){try{const s=localStorage.getItem('en_grammar_full');if(s)scores=JSON.parse(s)}catch(e){}}
loadState();

function updateProgress(){
const total=lessons.length;let done=0;
for(let i=0;i<total;i++){if(scores[i]&&scores[i].answered===scores[i].total&&scores[i].total>0)done++;}
const pct=Math.round(done/total*100);
document.getElementById('progressPct').textContent=pct+'%';
document.getElementById('progressFill').style.width=pct+'%';
document.querySelectorAll('.nav-item').forEach(el=>{
const id=+el.dataset.lesson;
if(scores[id]&&scores[id].answered===scores[id].total&&scores[id].total>0){
el.classList.add('done');
const badge=el.querySelector('.score-badge');
if(badge){badge.classList.remove('hidden');badge.textContent=scores[id].correct+'/'+scores[id].total;}
}
});
}

function loadLesson(id){
currentLesson=id;
const l=lessons[id];
if(!l)return;
document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',+el.dataset.lesson===id));
document.querySelector('.sidebar').classList.remove('open');
const main=document.getElementById('mainContent');
let html=`<div class="lesson-header"><span class="lesson-tag">${l.tag}</span><h2>${l.title}</h2><p class="subtitle">${l.subtitle}</p></div>`;
html+=`<div class="grammar-card">${l.grammar}</div>`;
html+=`<div class="exercise-section"><h3>Exercises — test yourself!</h3>`;
l.exercises.forEach((ex,idx)=>{html+=renderExercise(ex,idx);});
html+=`<div style="text-align:center;margin-top:20px"><button class="btn btn-primary" onclick="checkAll()">✅ Check Answers</button> <button class="btn btn-outline" onclick="resetEx()">🔄 Reset</button></div>`;
html+=`<div class="result-box" id="resultBox"><div class="score-big" id="scoreBig"></div><p id="scoreMsg"></p></div></div>`;
main.innerHTML=html;
window.scrollTo(0,0);
}

function renderExercise(ex,idx){
let h=`<div class="ex-block" data-idx="${idx}" data-ans="${ex.ans}" data-type="${ex.type}">`;
h+=`<div class="q">${idx+1}. ${ex.q}</div>`;
if(ex.type==='choice'){
h+=`<div class="options">`;
const letters=['A','B','C','D','E'];
ex.opts.forEach((o,i)=>{
h+=`<div class="opt" data-val="${i}" onclick="selectOpt(this)"><span class="letter">${letters[i]}</span>${o}</div>`;
});
h+=`</div>`;
}else if(ex.type==='fill'){
h+=`<input type="text" class="fill-input" placeholder="Type your answer..." autocomplete="off">`;
}
h+=`<div class="feedback"></div></div>`;
return h;
}

function selectOpt(el){
const block=el.closest('.ex-block');
block.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
el.classList.add('selected');
}

function checkAll(){
const l=lessons[currentLesson];
let correct=0,total=l.exercises.length;
document.querySelectorAll('.ex-block').forEach(block=>{
const idx=+block.dataset.idx;
const ex=l.exercises[idx];
const fb=block.querySelector('.feedback');
if(ex.type==='choice'){
const sel=block.querySelector('.opt.selected');
const opts=block.querySelectorAll('.opt');
opts.forEach(o=>{o.classList.remove('correct','wrong')});
if(!sel){fb.className='feedback show info';fb.textContent='⚠️ Please choose an answer.';return;}
const val=+sel.dataset.val;
if(val===ex.ans){
sel.classList.add('correct');correct++;
fb.className='feedback show ok';fb.textContent='✅ Correct! Well done!';
}else{
sel.classList.add('wrong');
opts[ex.ans].classList.add('correct');
fb.className='feedback show err';fb.textContent='❌ Wrong. Correct answer: '+ex.opts[ex.ans];
}
}else if(ex.type==='fill'){
const inp=block.querySelector('.fill-input');
const val=inp.value.trim().toLowerCase();
const ans=ex.ans.toLowerCase();
inp.classList.remove('correct','wrong');
if(!val){fb.className='feedback show info';fb.textContent='⚠️ Please type your answer.';return;}
if(val===ans){inp.classList.add('correct');correct++;fb.className='feedback show ok';fb.textContent='✅ Correct! Excellent!';}
else{inp.classList.add('wrong');fb.className='feedback show err';fb.textContent='❌ Wrong. Correct answer: '+ex.ans;}
}
});
scores[currentLesson]={correct,total,answered:total};
saveState();updateProgress();
const box=document.getElementById('resultBox');
box.classList.add('show');
document.getElementById('scoreBig').textContent=correct+' / '+total;
const pct=Math.round(correct/total*100);
let msg='';
if(pct===100)msg='🏆 Perfect! Outstanding result!';
else if(pct>=80)msg='🌟 Very good! Excellent work!';
else if(pct>=60)msg='👍 Good! But review the grammar rules.';
else msg='📖 Please review the lesson material. Keep trying!';
document.getElementById('scoreMsg').textContent=msg;
box.scrollIntoView({behavior:'smooth',block:'center'});
}

function resetEx(){
document.querySelectorAll('.ex-block').forEach(block=>{
block.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected','correct','wrong'));
const inp=block.querySelector('.fill-input');
if(inp){inp.value='';inp.classList.remove('correct','wrong');}
block.querySelector('.feedback').className='feedback';
});
document.getElementById('resultBox').classList.remove('show');
}


let generatedExercises=[];
let practiceCorrect=0;
const practiceSubjects=[
{name:'I',be:'am',pastBe:'was',do:'do',have:'have'},
{name:'you',be:'are',pastBe:'were',do:'do',have:'have'},
{name:'he',be:'is',pastBe:'was',do:'does',have:'has'},
{name:'she',be:'is',pastBe:'was',do:'does',have:'has'},
{name:'we',be:'are',pastBe:'were',do:'do',have:'have'},
{name:'they',be:'are',pastBe:'were',do:'do',have:'have'}
];
const practiceNames=['Alex','Maya','Daniel','Olivia','Sam','Nina','Leo','Emma'];
const practiceVerbs=[
{base:'work',third:'works',past:'worked',ing:'working'},
{base:'study',third:'studies',past:'studied',ing:'studying'},
{base:'travel',third:'travels',past:'travelled',ing:'travelling'},
{base:'cook',third:'cooks',past:'cooked',ing:'cooking'},
{base:'read',third:'reads',past:'read',ing:'reading'},
{base:'write',third:'writes',past:'wrote',ing:'writing'}
];
const practiceNouns=['report','email','application','ticket','project','room','essay','message'];
const practicePlaces=['at the office','at home','in the library','at the station','in the classroom','at the airport'];
function pPick(a){return a[Math.floor(Math.random()*a.length)]}
function pShuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pChoice(q,correct,wrong){const opts=pShuffle([...new Set([correct,...wrong])]);return {type:'choice',q,opts,ans:opts.indexOf(correct)}}
function pFill(q,ans){return {type:'fill',q,ans}}
function pBe(){const s=pPick(practiceSubjects), adjective=pPick(['ready','late','busy','careful','happy','hungry']);return pChoice(`Complete: ${s.name[0].toUpperCase()+s.name.slice(1)} ___ ${adjective}.`,s.be,['is','are','am'].filter(x=>x!==s.be))}
function pPresent(){const s=pPick(practiceSubjects),v=pPick(practiceVerbs),place=pPick(practicePlaces);const form=(s.name==='he'||s.name==='she')?v.third:v.base;return pChoice(`Usually, ${s.name} ___ ${place}.`,form,[v.base,v.third,'is '+v.ing].filter(x=>x!==form))}
function pContinuous(){const s=pPick(practiceSubjects),v=pPick(practiceVerbs),now=pPick(['right now','at the moment','today']);return pChoice(`Look! ${s.name[0].toUpperCase()+s.name.slice(1)} ___ ${now}.`,s.be+' '+v.ing,[v.base,v.third,s.pastBe+' '+v.ing])}
function pPast(){const n=pPick(practiceNames),v=pPick(practiceVerbs),time=pPick(['yesterday','last weekend','two days ago']);return pChoice(`${n} ___ the report ${time}.`,v.past,[v.base,v.third,'has '+v.past])}
function pFuture(){const s=pPick(practiceSubjects),v=pPick(practiceVerbs),time=pPick(['tomorrow','next week','soon']);return pChoice(`${s.name[0].toUpperCase()+s.name.slice(1)} ___ ${time}.`, 'will '+v.base,['will '+v.third,'is '+v.ing,'would '+v.base])}
function pArticle(){const word=pPick([{w:'umbrella',a:'an'},{w:'useful idea',a:'a'},{w:'honest answer',a:'an'},{w:'university',a:'a'}]);return pChoice(`Choose the article: It is ___ ${word.w}.`,word.a,word.a==='a'?['an','the','—']:['a','the','—'])}
function pQuantifier(){const item=pPick([{q:'How ___ books have you read?',a:'many',w:['much','little','a little']},{q:'How ___ time do we have?',a:'much',w:['many','few','a few']},{q:'There are very ___ students today.',a:'few',w:['little','much','a little']},{q:'We have ___ information, but we need more.',a:'a little',w:['a few','many','few']}]);return pChoice(item.q,item.a,item.w)}
function pModal(){const item=pPick([{q:'You ___ show your ID to enter the building.',a:'must',w:['must to','might','can to']},{q:'___ you help me with this bag?',a:'Could',w:['Must','Have','Did']},{q:'It ___ snow tonight; the forecast is uncertain.',a:'might',w:['must to','has to','should to']},{q:'You ___ bring food; we have plenty.',a:"don't have to",w:["mustn't","can't","shouldn't"]}]);return pChoice(item.q,item.a,item.w)}
function pPassive(){const n=pPick(practiceNouns),verb=pPick([{base:'send',v3:'sent'},{base:'finish',v3:'finished'},{base:'check',v3:'checked'},{base:'deliver',v3:'delivered'}]);return pChoice(`The ${n} ___ yesterday.`, 'was '+verb.v3,[verb.base,'is '+verb.v3,'has '+verb.v3])}
function pConditional(){const item=pPick([{q:'If it rains, we ___ at home.',a:'will stay',w:['stay','would stay','stayed']},{q:'If I were you, I ___ earlier.',a:'would leave',w:['will leave','left','leave']},{q:'If they had known, they ___ us.',a:'would have told',w:['will tell','would tell','told']}]);return pChoice(item.q,item.a,item.w)}
function pPreposition(){const item=pPick([{q:'The train arrives ___ 8:15.',a:'at',w:['in','on','for']},{q:'We met ___ Tuesday.',a:'on',w:['at','in','by']},{q:'She is interested ___ science.',a:'in',w:['on','at','for']},{q:'The keys are ___ the desk.',a:'on',w:['in','at','to']}]);return pChoice(item.q,item.a,item.w)}
function pVerbPattern(){const item=pPick([{q:'They decided ___ a new course.',a:'to start',w:['start','starting','to starting']},{q:'I enjoy ___ new words.',a:'learning',w:['learn','to learn','to learning']},{q:'Thank you for ___ so quickly.',a:'replying',w:['reply','to reply','to replying']},{q:'It is difficult ___ this rule.',a:'to remember',w:['remember','remembering','to remembering']}]);return pChoice(item.q,item.a,item.w)}
const practiceGenerators={
'all':[pBe,pPresent,pContinuous,pPast,pFuture,pArticle,pQuantifier,pModal,pPassive,pConditional,pPreposition,pVerbPattern],
'basics':[pBe,pPresent,pContinuous,pPast,pFuture],
'articles':[pArticle,pQuantifier],
'modals':[pModal],
'passive':[pPassive],
'conditionals':[pConditional],
'prepositions':[pPreposition],
'verbPatterns':[pVerbPattern]
};
function practiceStats(){try{return JSON.parse(localStorage.getItem('en_grammar_practice_stats')||'{"generated":0,"correct":0,"attempts":0}')}catch(e){return {generated:0,correct:0,attempts:0}}}
function practiceStatsSave(s){try{localStorage.setItem('en_grammar_practice_stats',JSON.stringify(s))}catch(e){}}
function showPracticeLab(){
currentLesson=null;
document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
document.querySelector('.sidebar').classList.remove('open');
document.querySelector('.practice-nav').classList.add('active');
const st=practiceStats();
const main=document.getElementById('mainContent');
main.innerHTML=`<section class="practice-hero"><span class="lesson-tag">Practice Laboratory</span><h2>Unlimited new grammar exercises</h2><p>Choose a topic and generate a fresh practice set. The local generator combines changing subjects, verbs, nouns, times and contexts, so you can revise the same rule repeatedly without seeing one static list.</p></section><div class="course-summary"><div class="summary-stat"><strong>${lessons.length}</strong><span>grammar lessons</span></div><div class="summary-stat"><strong>454+</strong><span>fixed exercises</span></div><div class="summary-stat"><strong>${st.generated}</strong><span>generated for you</span></div><div class="summary-stat"><strong>${st.attempts?Math.round(st.correct/st.attempts*100):0}%</strong><span>laboratory accuracy</span></div></div><div class="practice-controls"><div class="control-group"><label for="practiceTopic">Topic for a new exercise set</label><select id="practiceTopic" class="practice-select"><option value="all">Mixed grammar: all topics</option><option value="basics">Tenses and basic forms</option><option value="articles">Articles and quantifiers</option><option value="modals">Modal verbs</option><option value="passive">Passive voice</option><option value="conditionals">Conditionals</option><option value="prepositions">Prepositions</option><option value="verbPatterns">Gerund and infinitive</option></select></div><div class="practice-actions"><button class="btn btn-outline btn-small" onclick="generatePractice(10)">10 tasks</button><button class="btn btn-outline btn-small" onclick="generatePractice(20)">20 tasks</button><button class="btn btn-primary btn-small" onclick="generatePractice(30)">30 tasks</button></div></div><p class="practice-note">Every generation creates a different selection and order. You can produce new sets as many times as you wish while working offline.</p><div id="generatedExerciseList"></div><div id="generatedActions" style="text-align:center;margin:20px 0"></div><div class="result-box" id="generatedResult"><div class="score-big" id="generatedScore"></div><p id="generatedMsg"></p></div>`;
generatePractice(10);
window.scrollTo(0,0);
}
function generatePractice(amount){
const topicEl=document.getElementById('practiceTopic');
if(!topicEl)return;
const gens=practiceGenerators[topicEl.value]||practiceGenerators.all;
generatedExercises=[];
for(let i=0;i<amount;i++)generatedExercises.push(pPick(gens)());
const list=document.getElementById('generatedExerciseList');
list.innerHTML=`<div class="exercise-section"><h3>Fresh practice set — ${amount} exercises</h3>${generatedExercises.map((ex,i)=>renderExercise(ex,i)).join('')}</div>`;
document.getElementById('generatedActions').innerHTML=`<button class="btn btn-primary" onclick="checkGenerated()">Check this set</button> <button class="btn btn-outline" onclick="generatePractice(${amount})">Generate another set</button>`;
document.getElementById('generatedResult').classList.remove('show');
const s=practiceStats();s.generated+=amount;practiceStatsSave(s);
}
function checkGenerated(){
let correct=0;
document.querySelectorAll('#generatedExerciseList .ex-block').forEach(block=>{
const idx=+block.dataset.idx,ex=generatedExercises[idx],fb=block.querySelector('.feedback');
if(ex.type==='choice'){
const sel=block.querySelector('.opt.selected'),opts=block.querySelectorAll('.opt');opts.forEach(o=>o.classList.remove('correct','wrong'));
if(!sel){fb.className='feedback show info';fb.textContent='Choose an answer before checking.';return}
if(+sel.dataset.val===ex.ans){sel.classList.add('correct');correct++;fb.className='feedback show ok';fb.textContent='Correct.'}
else{sel.classList.add('wrong');opts[ex.ans].classList.add('correct');fb.className='feedback show err';fb.textContent='Correct answer: '+ex.opts[ex.ans]}
}else{
const inp=block.querySelector('.fill-input'),val=inp.value.trim().toLowerCase(),ans=ex.ans.toLowerCase();inp.classList.remove('correct','wrong');
if(!val){fb.className='feedback show info';fb.textContent='Type an answer before checking.';return}
if(val===ans){inp.classList.add('correct');correct++;fb.className='feedback show ok';fb.textContent='Correct.'}
else{inp.classList.add('wrong');fb.className='feedback show err';fb.textContent='Correct answer: '+ex.ans}
}
});
const total=generatedExercises.length,pct=Math.round(correct/total*100),result=document.getElementById('generatedResult');
document.getElementById('generatedScore').textContent=correct+' / '+total;
document.getElementById('generatedMsg').textContent=pct>=85?'Strong result. Generate a new mixed set to consolidate it.':pct>=60?'A useful attempt. Review the incorrect items and try a fresh set.':'Review the matching lesson, then create another focused practice set.';
result.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'center'});
const s=practiceStats();s.correct+=correct;s.attempts+=total;practiceStatsSave(s);
}
